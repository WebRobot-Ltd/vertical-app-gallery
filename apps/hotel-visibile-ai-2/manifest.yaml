apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: hotel-visibile-ai
  displayName: Hotel Visibile AI
  tagline:
    it: Fatti consigliare dagli assistenti AI e ricevi più prenotazioni dirette.
    en: Get recommended by AI assistants and win more direct bookings.
  description:
    it: Ogni settimana un agente interroga più modelli linguistici con le domande dei tuoi ospiti, misura quante volte e dove
      compare il tuo hotel e ti dice cosa fare. In più, una chat di prenotazione da incorporare nel tuo sito.
    en: Every week an agent asks several language models your guests' questions, measures how often and where your hotel appears,
      and tells you what to do. Plus a booking chat to embed in your website.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: dashboard
  branding:
    theme: light
    palette:
      primary: '#12355b'
      accent: '#d9822b'
      background: '#fbf8f3'
      foreground: '#1c2530'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: 'Hotel '
      color: primary
    - text: Visibile AI
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Chat
        en: Chat
      href: '#chat'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
      - booking_chat
      - availability_request
      agents:
      - concierge
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
    - key: hotelier
      label:
        it: Albergatore
        en: Hotelier
      assignedBy: derived
      from: collection:public_hotels.owner_email
  limits:
  - action: create:hotel_profiles
    max: 1
    window: total
    plans:
      group: 10
  - action: chat
    per: ip
    max: 60
    window: day
    roles:
    - anonymous
  agents:
  - key: monitor
    role: scheduled
    description: Asks several LLMs realistic guest questions, searches the web and measures the hotel's visibility.
    memory: instance
    output: markdown+json
    resultSchema:
      type: object
      properties:
        date:
          type: string
        mentions:
          type: number
        queries:
          type: number
        avg_position:
          type: number
        wrong_info_count:
          type: number
        summary:
          type: string
    writesTo:
      collection: visibility_reports
      parse: json_last
      keyBy: date
    context:
    - key: hotel_data
      from: collection:hotel_profiles
    mcpServers:
    - name: webrobot
      url: https://mcp-full.webrobot.eu/mcp
      allow: all
    appTools:
    - name: ask_openai
      description: Ask an OpenAI model a guest question (chat completions body)
      action: http
      http:
        method: POST
        url: https://api.openai.com/v1/chat/completions
        attribution: OpenAI API
        credential:
          provider: openai
    - name: ask_perplexity
      description: Ask Perplexity a guest question with web citations (chat completions body)
      action: http
      http:
        method: POST
        url: https://api.perplexity.ai/chat/completions
        attribution: Perplexity API
        credential:
          provider: perplexity
    goalTemplate: 'Hotel: {hotel_name}. Today is {date}.

      Hotel records of the user (find the one with this name): {hotel_data}

      Run this week''s visibility check. Write the report in the language with ISO code {lang}.'
    limits:
      maxTurns: 40
      maxBudgetUsd: 2
    profile:
      inline:
        display_name: Hotel visibility monitor
        crews:
        - id: monitor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You are an analyst of hotel visibility in AI assistants. From the hotel record (name, location,
            website, category, strengths, competitors, guest questions) build 8-12 realistic guest queries (e.g. ''romantic
            hotel near Taormina with parking''), using the owner''s questions plus variations. Ask each query to ask_openai
            and ask_perplexity (OpenAI body: {"model":"gpt-4o","messages":[{"role":"user","content":"..."}]}; Perplexity body:
            {"model":"sonar","messages":[...]}). If a tool says the key is not connected, say so in the report and use the
            other. Also search the web via the webrobot MCP to see which properties are cited and why. For each answer record
            whether the hotel is named, its position in the list, and any wrong facts (address, services, prices, closed amenities)
            compared with the website. Use your memory of the previous week to describe the trend. Never invent figures: count
            only what you observed. Report structure: start with ''# <Hotel> — AI visibility, week of <date>''; then ## Score
            (mentions out of queries, average position, wrong information found), ## Who is cited instead and why (table),
            ## Wrong information, ## Recommended actions (website texts to add with draft wording, structured data schema.org
            Hotel JSON-LD snippet, FAQ entries, reviews to request, each with priority), ## Trend vs last week. Add a chart
            block ```chart {"type":"bar","title":"Mentions by model","labels":[...],"series":[{"name":"Mentions","values":[...]}]}```
            when you have the data. End with one final JSON object: {"date":"YYYY-MM-DD","mentions":n,"queries":n,"avg_position":n,"wrong_info_count":n,"summary":"one
            sentence"}. Then call remember once with the 5 key points.'
  - key: concierge
    role: helper
    description: Booking chat for anonymous visitors, answers from the hotel's public content.
    goalTemplate: 'Page / hotel: {page}

      Visitor history:

      {history}

      New message: {message}

      Reply in the language with ISO code {lang}.'
    output: markdown
    appTools:
    - name: hotel_info
      description: Read the public hotel contents (rooms, services, surroundings, policies)
      action: search
      collection: public_hotels
      scope: all
    limits:
      maxTurns: 6
      maxBudgetUsd: 0.2
    profile:
      inline:
        display_name: Hotel booking concierge
        crews:
        - id: concierge
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the friendly booking assistant of an independent hotel. Use hotel_info to find the hotel
            (by slug or name given in the page) and answer ONLY from its contents about rooms, services and surroundings.
            If something is not in the contents, say you don''t know and suggest contacting the hotel. Never invent prices,
            availability or policies; you cannot confirm bookings. When the visitor wants to book, ask for dates, number of
            guests and email, and invite them to send the availability request with the form below the chat: the hotelier
            will confirm. Keep answers short.'
  - key: publisher
    role: helper
    description: Publishes the hotel's public contents for the booking chat when the hotelier saves the profile.
    output: markdown
    goalTemplate: The hotelier saved the profile {record.hotel_name} ({record.location}); owner {record.owner_email}. Write
      or update its public record in public_hotels (slug from the name).
    appTools:
    - name: publish_hotel
      description: Write the public hotel record
      action: write
      collection: public_hotels
      scope: all
    limits:
      maxTurns: 6
      maxBudgetUsd: 0.2
    profile:
      inline:
        display_name: Hotel publisher
        crews:
        - id: publisher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You copy the guest-facing information of a saved hotel profile into the public_hotels record with
            the publish_hotel tool: fields slug (kebab-case of the name), name, location, website, category, strengths, rooms_services,
            surroundings, owner_email. Copy only what the record contains; never invent facts. Answer with one line confirming.'
  inputForm:
    title:
      it: Profilo hotel
      en: Hotel profile
    fields:
    - name: note
      type: text
      label: Note
  templates:
  - key: visibility_watch
    title:
      it: Monitor visibilità AI
      en: AI visibility watch
    description:
      it: Ogni settimana, un report sulla visibilità del tuo hotel negli assistenti AI.
      en: A weekly report on your hotel's visibility in AI assistants.
    agent: monitor
    params:
    - name: hotel_name
      type: select
      required: true
      optionsFrom: collection:hotel_profiles
      label:
        it: Struttura
        en: Property
    goal: 'Hotel: {hotel_name}. Today is {date}. Run this week''s visibility check in the language with ISO code {lang}.'
    schedule:
      cron: 0 6 * * 1
      userCanChange: false
    maxPerUser: 10
    deliver:
      to: owner
      onlyIfNew: true
  triggers:
  - key: profile_saved
    'on':
      collection: hotel_profiles
      op: any
    start:
      agent: publisher
    goal: Publish the profile {record.hotel_name}, {record.location}, owner {record.owner_email}.
  - key: new_request
    'on':
      collection: availability_requests
      op: insert
    notify:
      to:
      - record.hotel_email
      subject:
        it: Nuova richiesta di disponibilità da {record.guest_email}
        en: New availability request from {record.guest_email}
      body:
        it: 'Date: {record.check_in} - {record.check_out}. Ospiti: {record.guests}. Email: {record.guest_email}. Note: {record.message}.
          Rispondi all''ospite per confermare.'
        en: 'Dates: {record.check_in} - {record.check_out}. Guests: {record.guests}. Email: {record.guest_email}. Notes: {record.message}.
          Reply to the guest to confirm.'
      link: requests
  data:
    collections:
    - name: hotel_profiles
      ownedBy: user
      description: The hotelier's own property profile
      fields:
      - name: hotel_name
        type: text
        required: true
        label:
          it: Nome struttura
          en: Property name
      - name: location
        type: text
        required: true
        label:
          it: Località
          en: Location
      - name: website
        type: url
        label:
          it: Sito web
          en: Website
      - name: category
        type: select
        label:
          it: Categoria
          en: Category
        options:
        - value: '3'
          label: 3 stelle
        - value: '4'
          label: 4 stelle
        - value: '5'
          label: 5 stelle
        - value: boutique
          label: Boutique
        - value: b&b
          label: B&B
      - name: strengths
        type: textarea
        label:
          it: Punti di forza
          en: Strengths
      - name: competitors
        type: textarea
        label:
          it: Concorrenti diretti
          en: Direct competitors
      - name: guest_questions
        type: textarea
        label:
          it: Domande tipiche degli ospiti
          en: Typical guest questions
      - name: rooms_services
        type: textarea
        label:
          it: Camere e servizi (per la chat)
          en: Rooms and services (for the chat)
      - name: surroundings
        type: textarea
        label:
          it: Dintorni (per la chat)
          en: Surroundings (for the chat)
      - name: owner_email
        type: email
        required: true
        label:
          it: Email di contatto
          en: Contact email
    - name: visibility_reports
      ownedBy: instance
      description: Weekly visibility results of each hotel
      fields:
      - name: date
        type: date
      - name: mentions
        type: number
      - name: queries
        type: number
      - name: avg_position
        type: number
      - name: wrong_info_count
        type: number
      - name: summary
        type: text
    - name: public_hotels
      ownedBy: app
      description: Guest-facing contents of each hotel, read by the booking chat
      fields:
      - name: slug
        type: text
      - name: name
        type: text
      - name: location
        type: text
      - name: website
        type: url
      - name: category
        type: text
      - name: strengths
        type: textarea
      - name: rooms_services
        type: textarea
      - name: surroundings
        type: textarea
      - name: owner_email
        type: email
    - name: availability_requests
      ownedBy: org
      description: Availability requests from website visitors; the hotelier sees those addressed to them
      retentionDays: 365
      fields:
      - name: hotel_slug
        type: text
        required: true
        label:
          it: Struttura
          en: Property
      - name: hotel_email
        type: email
        required: true
        label:
          it: Email struttura
          en: Property email
      - name: check_in
        type: date
        required: true
        label:
          it: Arrivo
          en: Check-in
      - name: check_out
        type: date
        required: true
        label:
          it: Partenza
          en: Check-out
      - name: guests
        type: number
        required: true
        label:
          it: Ospiti
          en: Guests
      - name: guest_email
        type: email
        required: true
        label:
          it: La tua email
          en: Your email
      - name: message
        type: textarea
        label:
          it: Note
          en: Notes
      - name: status
        type: select
        label: Status
        default: new
        options:
        - new
        - confirmed
        - declined
      access:
      - role: hotelier
        where:
          hotel_email: '{user.email}'
        can:
        - read
        - write
    credentials:
    - provider: openai
      kind: api_key
      scope: org
      label: OpenAI API
      help: API key of the app owner
    - provider: perplexity
      kind: api_key
      scope: org
      label: Perplexity API
      help: API key of the app owner
  egress:
    hosts:
    - api.openai.com
    - api.perplexity.ai
    notes: Paid LLM APIs queried with the app owner's keys to measure how assistants answer guest questions.
  views:
  - key: home
    type: page
    nav: false
    sections:
    - type: hero
      title:
        it: Fatti consigliare dall'**AI**, ricevi più prenotazioni dirette.
        en: Get recommended by **AI**, win more direct bookings.
      text:
        it: Ogni settimana misuriamo quante volte il tuo hotel compare nelle risposte degli assistenti AI, con quali errori,
          e ti diciamo cosa correggere.
        en: Every week we measure how often your hotel shows up in AI assistants' answers, with which mistakes, and tell you
          what to fix.
      actions:
      - label:
          it: Inizia
          en: Start
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Descrivi il tuo hotel
          en: Describe your hotel
        text:
          it: Località, punti di forza, concorrenti e domande degli ospiti.
          en: Location, strengths, competitors and guest questions.
      - title:
          it: Misuriamo ogni settimana
          en: We measure weekly
        text:
          it: Interroghiamo più modelli e cerchiamo sul web chi viene citato e perché.
          en: We query several models and search the web to see who is cited and why.
      - title:
          it: Agisci
          en: Act
        text:
          it: Testi, dati strutturati, FAQ e recensioni da sollecitare.
          en: Texts, structured data, FAQs and reviews to request.
      - title:
          it: Chat per il tuo sito
          en: Chat for your site
        text:
          it: Un assistente risponde ai visitatori e ti gira le richieste di disponibilità.
          en: An assistant answers visitors and forwards availability requests to you.
    - type: view
      id: chat
      title:
        it: Prova la chat di prenotazione
        en: Try the booking chat
      view: booking_chat
    - type: view
      view: availability_request
    - type: note
      content:
        it: Le misure riflettono le risposte osservate in un dato momento e possono variare.
        en: Measurements reflect answers observed at a point in time and may vary.
  - key: booking_chat
    type: chat
    source: agent:concierge
    title:
      it: Chat
      en: Chat
    nav: false
    examples:
    - it: Che camere avete?
      en: What rooms do you have?
    - it: C'è parcheggio?
      en: Is there parking?
    placeholder:
      it: Scrivi la tua domanda…
      en: Type your question…
  - key: availability_request
    type: form
    collection: availability_requests
    title:
      it: Richiedi disponibilità
      en: Request availability
    nav: false
    fields:
    - hotel_slug
    - hotel_email
    - check_in
    - check_out
    - guests
    - guest_email
    - message
    submit:
      label:
        it: Invia richiesta
        en: Send request
      message:
        it: 'Richiesta inviata: l''hotel ti risponderà via email.'
        en: 'Request sent: the hotel will reply by email.'
  - key: profile
    type: form
    collection: hotel_profiles
    title:
      it: Il mio hotel
      en: My hotel
    edit: true
    roles:
    - user
    - admin
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Profilo salvato.
        en: Profile saved.
      redirect: watches
  - key: watches
    type: instances
    template: visibility_watch
    title:
      it: Monitor settimanale
      en: Weekly watch
    roles:
    - user
    - admin
  - key: trend
    type: chart
    source: collection:visibility_reports
    title:
      it: Andamento
      en: Trend
    roles:
    - user
    - admin
    data:
      display: chart
      chart: line
      fields:
      - key: date
        format: date
      - key: mentions
      - key: wrong_info_count
      sort:
        field: date
        dir: asc
      limit: 52
  - key: reports
    type: table
    source: collection:visibility_reports
    title:
      it: Report
      en: Reports
    roles:
    - user
    - admin
    export: true
    data:
      display: table
      fields:
      - key: date
        format: date
      - key: mentions
      - key: queries
      - key: avg_position
      - key: wrong_info_count
      - key: summary
      sort:
        field: date
        dir: desc
  - key: requests
    type: table
    source: collection:availability_requests
    title:
      it: Richieste di disponibilità
      en: Availability requests
    roles:
    - hotelier
    - admin
    export: true
    data:
      display: table
      fields:
      - key: check_in
        format: date
      - key: check_out
        format: date
      - key: guests
      - key: guest_email
      - key: message
      - key: status
        format: badge
      sort:
        field: check_in
        dir: asc
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Plan
    roles:
    - user
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: pro
      price: 49
      interval: month
      label:
        it: Hotel singolo
        en: Single hotel
      includes:
      - 1 struttura
      - report settimanale
      - chat di prenotazione
    - key: group
      price: 149
      interval: month
      label:
        it: Gruppi
        en: Groups
      includes:
      - fino a 10 strutture
      - report settimanale per struttura
      - chat di prenotazione
  notifications:
    emailOnRunDone: false
  extensions:
  - key: hotel_prefill
    description: The embed code should prefill hotel_slug and hotel_email in the availability form and pass the hotel to the
      chat; the embeddable widget is not yet available as a view.
