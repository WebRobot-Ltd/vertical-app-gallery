apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: campo-digitale
  displayName: Campo Digitale
  tagline:
    it: 'Il gestionale per la tua azienda agricola: appezzamenti, quaderno di campagna, meteo e satellite.'
    en: 'Farm management: parcels, field logbook, weather and satellite.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: dashboard
  branding:
    theme: light
    palette:
      primary: '#2f5d3a'
      accent: '#c9a227'
      background: '#f6f4ec'
      foreground: '#1d2a1f'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Campo
      color: primary
    - text: Digitale
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      label:
        it: Agricoltore
        en: Farmer
      assignedBy: signup
    - key: consultant
      label:
        it: Consulente agronomo
        en: Agronomist consultant
      assignedBy: derived
      from: collection:parcels.consultant_email
  limits:
  - action: create:parcels
    max: 5
    window: total
    plans:
      azienda_media: 30
      azienda_grande: -1
  - action: chat
    per: user
    max: 40
    window: day
  egress:
    hosts:
    - api.open-meteo.com
    - sh.dataspace.copernicus.eu
    notes: 'Open-Meteo: previsioni; il piano gratuito è per uso non commerciale, per l''uso commerciale serve una chiave/abbonamento
      Open-Meteo (CC BY 4.0). Copernicus Data Space / Sentinel Hub Statistics API: dati Sentinel-2, licenza libera con attribuzione
      ''Contains modified Copernicus Sentinel data''.'
  agents:
  - key: agronomo
    role: main
    description: Agronomist assistant answering technical questions in chat.
    memory: user
    profile:
      inline:
        display_name: Agronomo
        chat_mode: true
        crews:
        - id: agronomo
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un agronomo esperto che assiste agricoltori italiani. Rispondi in modo chiaro e pratico su colture,
            fitopatie, concimazione, irrigazione, difesa integrata. Usa i dati dell''azienda (appezzamenti, quaderno di campagna,
            avvisi) tramite gli strumenti di lettura quando servono. Non inventare mai dosi, registrazioni o numeri: per ogni
            prodotto fitosanitario rimanda all''etichetta e al registro del Ministero della Salute e alla verifica del consulente.
            Non dare come certe diagnosi basate solo su una descrizione.'
    goalTemplate: 'Conversazione finora:

      {history}

      Nuovo messaggio dell''agricoltore ({user}): {message}

      Rispondi nella lingua con codice ISO {lang}. Data di oggi: {date}.'
    appTools:
    - name: read_parcels
      description: Read the user's parcels
      action: read
      collection: parcels
      scope: user
    - name: read_logbook
      description: Read the user's field logbook entries
      action: read
      collection: logbook
      scope: user
    - name: read_risk_reports
      description: Read recent disease-risk reports
      action: read
      collection: risk_reports
      scope: user
    output: markdown
  - key: verificatore
    role: helper
    description: Checks a logged treatment against the Ministry of Health plant-protection products register.
    profile:
      inline:
        display_name: Verificatore trattamenti
        crews:
        - id: verificatore
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: Verifichi un trattamento fitosanitario registrato da un agricoltore. Usa il WebRobot MCP per consultare
            la Banca dati dei prodotti fitosanitari del Ministero della Salute (www.salute.gov.it), cerca il prodotto per
            nome, controlla stato di autorizzazione, che la coltura dell'appezzamento sia tra gli usi ammessi, la dose massima
            per ettaro, intervallo di sicurezza e numero massimo di applicazioni. Leggi l'appezzamento (coltura) con read_parcels
            e il registro con read_logbook. Poi aggiorna la voce con write_logbook impostando check_status a 'conforme', 'non_conforme'
            o 'da_verificare' (se il registro non è consultabile o il prodotto è ambiguo) e check_note con motivazione e fonte.
            Non inventare mai dati del registro; in caso di dubbio 'da_verificare'. Chiudi con un breve report che inizia
            con '# Verifica trattamento <prodotto>'.
    appTools:
    - name: read_parcels
      description: Read the user's parcels
      action: read
      collection: parcels
      scope: user
    - name: read_logbook
      description: Read logbook entries
      action: read
      collection: logbook
      scope: user
    - name: write_logbook
      description: Update the check result of a logbook entry
      action: write
      collection: logbook
      scope: user
    output: markdown
  - key: meteo
    role: scheduled
    description: Daily weather forecast and simple disease-risk estimate for one parcel.
    memory: instance
    writesTo:
      collection: risk_reports
      parse: whole
      keyBy: date
    profile:
      inline:
        display_name: Rischio malattie
        crews:
        - id: meteo
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Controlli ogni giorno il rischio di malattie fungine di un appezzamento. Leggi l''appezzamento con
            read_parcels (coltura, lat, lon). Chiama open_meteo con query: latitude, longitude, hourly=temperature_2m,relative_humidity_2m,precipitation,leaf_wetness_probability,soil_moisture_0_to_1cm,
            daily=precipitation_sum,temperature_2m_max,temperature_2m_min, forecast_days=5, past_days=3, timezone=Europe/Rome.
            Stima il rischio con modelli semplici e dichiarali: per la peronospora della vite regola dei 3x10 (temperatura
            >=10°C, pioggia >=10 mm in 24-48 h, germogli >=10 cm) e ore di bagnatura fogliare; per oidio temperature 20-27°C
            e umidità alta; per altre colture indica solo i fattori meteo favorevoli. Livello: basso, medio, alto. Il report
            inizia con ''# <appezzamento> — rischio <livello> — <data>'', poi sezioni ## Previsioni 5 giorni, ## Rischio per
            malattia, ## Cosa fare. Nella prima riga dopo il titolo scrivi ''ALERT: si'' se il rischio è pari o superiore
            alla soglia dell''utente, altrimenti ''ALERT: no''. Non sono consigli di trattamento: rimanda al consulente. Mai
            inventare dati.'
    appTools:
    - name: read_parcels
      description: Read the user's parcels
      action: read
      collection: parcels
      scope: user
    - name: open_meteo
      description: Open-Meteo forecast for a location
      action: http
      http:
        method: GET
        url: https://api.open-meteo.com/v1/forecast
        attribution: Weather data by Open-Meteo.com, CC BY 4.0
    output: markdown
  - key: vigore
    role: scheduled
    description: Weekly Sentinel-2 vigour index (NDVI) per parcel, flags stressed zones.
    memory: instance
    writesTo:
      collection: vigor_reports
      parse: whole
      keyBy: date
    profile:
      inline:
        display_name: Vigore satellitare
        crews:
        - id: vigore
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Ogni settimana calcoli l''indice di vigore (NDVI) di un appezzamento con immagini Sentinel-2. Leggi
            l''appezzamento con read_parcels (geometry, se manca usa lat/lon con un riquadro di circa sqrt(superficie) metri).
            Chiama copernicus_stats (POST, Sentinel Hub Statistics API) con input bounds/geometry, dataFilter Sentinel-2 L2A
            con maxCloudCoverage 30, intervallo di aggregazione P7D sulle ultime 4 settimane, evalscript NDVI=(B08-B04)/(B08+B04)
            con dataMask, statistiche medie e percentili. Confronta l''ultima settimana con le precedenti e con l''andamento
            atteso per la coltura. Report che inizia con ''# <appezzamento> — vigore settimana <data>'', sezioni ## NDVI (tabella
            settimane), ## Zone in sofferenza, ## Verifiche consigliate in campo; includi un grafico ```chart``` con i valori
            reali. Se le nuvole impediscono la misura, dillo. Mai inventare valori; cita ''Contains modified Copernicus Sentinel
            data''.'
    appTools:
    - name: read_parcels
      description: Read the user's parcels
      action: read
      collection: parcels
      scope: user
    - name: copernicus_stats
      description: Sentinel Hub statistics for a geometry
      action: http
      http:
        method: POST
        url: https://sh.dataspace.copernicus.eu/api/v1/statistics
        credential:
          provider: copernicus
          header: Authorization
          format: Bearer {secret}
        attribution: Contains modified Copernicus Sentinel data
    output: markdown
  data:
    credentials:
    - provider: copernicus
      kind: api_key
      scope: org
      label:
        it: Token Copernicus Data Space
        en: Copernicus Data Space token
      help:
        it: Token di accesso Sentinel Hub del tuo account Copernicus Data Space.
        en: Sentinel Hub access token from your Copernicus Data Space account.
    collections:
    - name: parcels
      description: Appezzamenti dell'azienda
      ownedBy: user
      access:
      - role: consultant
        where:
          consultant_email: '{user.email}'
        can:
        - read
        - write
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome appezzamento
          en: Parcel name
      - name: crop
        type: text
        required: true
        label:
          it: Coltura
          en: Crop
      - name: variety
        type: text
        label:
          it: Varietà
          en: Variety
      - name: sowing_date
        type: date
        required: true
        label:
          it: Data di semina/impianto
          en: Sowing date
      - name: area_ha
        type: number
        required: true
        label:
          it: Superficie (ha)
          en: Area (ha)
      - name: lat
        type: number
        required: true
        label: Lat
      - name: lon
        type: number
        required: true
        label: Lon
      - name: geometry
        type: json
        label:
          it: Perimetro (GeoJSON)
          en: Boundary (GeoJSON)
      - name: consultant_email
        type: email
        label:
          it: Email del consulente agronomo
          en: Consultant email
    - name: logbook
      description: Quaderno di campagna
      ownedBy: user
      access:
      - role: consultant
        where:
          consultant_email: '{user.email}'
        can:
        - read
        - write
      retentionDays: 3650
      fields:
      - name: parcel
        type: relation
        relation: parcels
        required: true
        label:
          it: Appezzamento
          en: Parcel
      - name: date
        type: date
        required: true
        label: Data
      - name: activity
        type: select
        required: true
        label:
          it: Operazione
          en: Activity
        options:
        - value: trattamento
          label:
            it: Trattamento
            en: Treatment
        - value: concimazione
          label:
            it: Concimazione
            en: Fertilisation
        - value: irrigazione
          label:
            it: Irrigazione
            en: Irrigation
        - value: raccolto
          label:
            it: Raccolto
            en: Harvest
      - name: product
        type: text
        label:
          it: Prodotto
          en: Product
      - name: dose
        type: number
        label:
          it: Dose per ettaro / quantità
          en: Dose per ha / quantity
      - name: unit
        type: text
        label:
          it: Unità
          en: Unit
      - name: notes
        type: textarea
        label:
          it: Note
          en: Notes
      - name: consultant_email
        type: email
        label:
          it: Email consulente (facoltativa)
          en: Consultant email (optional)
      - name: check_status
        type: select
        label:
          it: Verifica registro
          en: Register check
        options:
        - conforme
        - non_conforme
        - da_verificare
      - name: check_note
        type: textarea
        label:
          it: Esito verifica
          en: Check note
    - name: sensor_readings
      description: Letture di stazioni meteo e sonde di umidità
      ownedBy: user
      retentionDays: 730
      fields:
      - name: device
        type: text
        required: true
      - name: parcel
        type: text
      - name: kind
        type: text
      - name: value
        type: number
      - name: unit
        type: text
      - name: at
        type: date
    - name: risk_reports
      description: Rapporti giornalieri sul rischio malattie
      ownedBy: instance
      retentionDays: 365
    - name: vigor_reports
      description: Rapporti settimanali sul vigore
      ownedBy: instance
      retentionDays: 730
  templates:
  - key: risk_watch
    title:
      it: Rischio malattie (meteo)
      en: Disease risk (weather)
    description:
      it: Ogni giorno previsioni e rischio per un appezzamento, con avviso se supera la soglia.
      en: Daily forecast and risk for one parcel, with an alert above the threshold.
    agent: meteo
    params:
    - name: parcel
      type: text
      required: true
      label:
        it: Nome appezzamento
        en: Parcel name
    - name: threshold
      type: select
      required: true
      label:
        it: Soglia di avviso
        en: Alert threshold
      options:
      - value: medio
        label: Medio
      - value: alto
        label: Alto
    goal: 'Appezzamento "{parcel}". Soglia di avviso: {threshold}. Oggi è {date}. Scrivi il report nella lingua con codice
      ISO {lang}.'
    schedule:
      cron: 0 5 * * *
      userCanChange: false
    maxPerUser: 30
    deliver:
      to: owner
      subject: Campo Digitale — rischio malattie {title}
      onlyIfNew: true
  - key: vigor_watch
    title:
      it: Vigore satellitare
      en: Satellite vigour
    description:
      it: Ogni settimana l'indice di vigore Sentinel-2 di un appezzamento.
      en: Weekly Sentinel-2 vigour index for a parcel.
    agent: vigore
    params:
    - name: parcel
      type: text
      required: true
      label:
        it: Nome appezzamento
        en: Parcel name
    goal: Appezzamento "{parcel}". Oggi è {date}. Scrivi il report nella lingua con codice ISO {lang}.
    schedule:
      cron: 0 6 * * 1
      userCanChange: false
    maxPerUser: 30
    deliver:
      to: owner
      subject: Campo Digitale — vigore {title}
      onlyIfNew: true
  triggers:
  - key: check_treatment
    'on':
      collection: logbook
      op: insert
      where:
        activity: trattamento
    start:
      agent: verificatore
    goal: 'Verifica il trattamento appena registrato (voce quaderno id/campi: {event}). Prodotto {record.product}, dose {record.dose}
      {record.unit}, appezzamento {record.parcel}.'
  - key: treatment_not_ok
    'on':
      collection: logbook
      op: update
      where:
        check_status: non_conforme
    notify:
      to:
      - owner
      - record.consultant_email
      subject:
        it: 'Trattamento non conforme: {record.product}'
        en: 'Non-compliant treatment: {record.product}'
      body:
        it: 'Il trattamento con {record.product} registrato il {record.date} non risulta conforme al registro fitosanitario.
          Dettagli: {record.check_note}'
        en: 'The treatment with {record.product} logged on {record.date} does not match the plant-protection register. Details:
          {record.check_note}'
      link: logbook
  - key: sensor_hook
    'on':
      webhook: true
    write:
      collection: sensor_readings
      fields:
        device: device
        parcel: parcel
        kind: kind
        value: value
        unit: unit
        at: at
  inputForm:
    title:
      it: Domanda
      en: Question
    fields: []
  views:
  - key: home
    type: page
    nav: false
    title: Campo Digitale
    sections:
    - type: hero
      title:
        it: La tua azienda agricola, **sotto controllo**.
        en: Your farm, **under control**.
      text:
        it: Appezzamenti, quaderno di campagna con verifica dei prodotti fitosanitari, rischio malattie ogni giorno, vigore
          da satellite ogni settimana e un agronomo AI in chat.
        en: Parcels, a field logbook with plant-protection checks, daily disease risk, weekly satellite vigour and an AI agronomist
          in chat.
      actions:
      - label:
          it: Inizia
          en: Get started
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Registra i campi
          en: Add your parcels
        text:
          it: Coltura, varietà, semina, superficie e posizione.
          en: Crop, variety, sowing, area and location.
        badge: 🌱
      - title:
          it: Compila il quaderno
          en: Fill the logbook
        text:
          it: I trattamenti sono verificati sul registro del Ministero della Salute.
          en: Treatments are checked against the Ministry of Health register.
        badge: 📒
      - title:
          it: Ricevi avvisi
          en: Get alerts
        text:
          it: Meteo e satellite lavorano per te ogni giorno e ogni settimana.
          en: Weather and satellite work for you daily and weekly.
        badge: 🛰️
    - type: note
      content:
        it: Supporto alle decisioni, non sostituisce il consulente né l'etichetta del prodotto. Contains modified Copernicus
          Sentinel data; meteo Open-Meteo.com (CC BY 4.0).
        en: Decision support; it does not replace your consultant or the product label. Contains modified Copernicus Sentinel
          data; weather by Open-Meteo.com (CC BY 4.0).
  - key: new_parcel
    type: form
    title:
      it: Nuovo appezzamento
      en: New parcel
    collection: parcels
    roles:
    - user
    - admin
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Appezzamento salvato
        en: Parcel saved
      redirect: parcels
  - key: parcels
    type: table
    title:
      it: Appezzamenti
      en: Parcels
    source: collection:parcels
    columns:
    - name
    - crop
    - variety
    - sowing_date
    - area_ha
    export: true
    roles:
    - user
    - admin
    - consultant
  - key: map
    type: map
    title:
      it: Mappa
      en: Map
    source: collection:parcels
    map:
      lat: lat
      lon: lon
      title: name
      popup:
      - crop
      - variety
      - area_ha
    roles:
    - user
    - admin
    - consultant
  - key: new_entry
    type: form
    title:
      it: Nuova operazione
      en: New entry
    collection: logbook
    roles:
    - user
    - admin
    submit:
      label:
        it: Registra
        en: Log
      message:
        it: 'Registrato: i trattamenti vengono verificati sul registro'
        en: 'Logged: treatments are checked against the register'
      redirect: logbook
  - key: logbook
    type: table
    title:
      it: Quaderno di campagna
      en: Field logbook
    source: collection:logbook
    columns:
    - date
    - parcel
    - activity
    - product
    - dose
    - unit
    - check_status
    - check_note
    export: true
    roles:
    - user
    - admin
    - consultant
  - key: risk_watches
    type: instances
    title:
      it: Rischio malattie
      en: Disease risk
    template: risk_watch
    roles:
    - user
    - admin
  - key: vigor_watches
    type: instances
    title:
      it: Vigore satellitare
      en: Satellite vigour
    template: vigor_watch
    roles:
    - user
    - admin
  - key: sensors
    type: table
    title:
      it: Sensori
      en: Sensors
    source: collection:sensor_readings
    columns:
    - at
    - device
    - parcel
    - kind
    - value
    - unit
    roles:
    - user
    - admin
  - key: chat
    type: chat
    title:
      it: Agronomo
      en: Agronomist
    source: agent:agronomo
    examples:
    - it: Quando conviene trattare la vite contro la peronospora?
      en: When should I treat grapevine against downy mildew?
    - it: Come interpreto un NDVI in calo?
      en: How do I read a falling NDVI?
    placeholder:
      it: Scrivi la tua domanda tecnica…
      en: Ask a technical question…
    roles:
    - user
    - admin
    - consultant
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - user
  billing:
    modes:
    - subscription
    plans:
    - key: azienda_piccola
      price: 149
      interval: year
      label:
        it: Piccola azienda (fino a 20 ha)
        en: Small farm (up to 20 ha)
      roles:
      - user
    - key: azienda_media
      price: 399
      interval: year
      label:
        it: Media azienda (fino a 100 ha)
        en: Medium farm (up to 100 ha)
      roles:
      - user
    - key: azienda_grande
      price: 899
      interval: year
      label:
        it: Grande azienda (oltre 100 ha)
        en: Large farm (over 100 ha)
      roles:
      - user
  notifications:
    emailOnRunDone: false
  mobile:
    appId: eu.webrobot.campodigitale
  extensions:
  - key: polygon_drawing
    description: 'Disegno dei perimetri degli appezzamenti sulla mappa: la vista map mostra solo marcatori; per ora lat/lon
      e GeoJSON si inseriscono nel form. Serve un editor di poligoni.'
  - key: offline_mobile
    description: 'Uso offline in campagna con sincronizzazione al ritorno della rete: il guscio mobile è dichiarato, ma la
      cache offline e la sincronizzazione del quaderno non sono ancora espresse nel manifest.'
  - key: per_hectare_pricing
    description: 'Il prezzo annuale proporzionale agli ettari non è disponibile: usati tre scaglioni di piano annuale; il
      limite totale di ettari per piano va verificato.'
  - key: sensor_ownership
    description: 'I dati dei sensori arrivano da webhook /api/hooks/sensor_hook senza utente: l''associazione dispositivo-azienda
      e l''isolamento per cliente richiedono una verifica.'
  - key: copernicus_auth
    description: 'L''accesso a Copernicus Data Space richiede un token OAuth a breve durata: per ora il token è incollato
      dall''admin come chiave; serve lo scambio OAuth automatico.'
  - key: phyto_register
