apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: campo-digitale
  displayName: Campo Digitale
  tagline:
    it: Il quaderno di campagna che controlla i trattamenti e ti avvisa dei rischi.
    en: The field notebook that checks your treatments and warns you of risks.
  description:
    it: 'Gestionale per aziende agricole: appezzamenti, quaderno di campagna, controllo dei prodotti fitosanitari, avvisi
      meteo-malattie ogni giorno e un agronomo AI in chat.'
    en: 'Farm management: plots, field notebook, plant-protection product checks, daily weather-disease alerts and an AI agronomist
      in chat.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: dashboard
  branding:
    theme: light
    palette:
      primary: '#2f5d34'
      accent: '#d9a21b'
      background: '#f7f5ee'
      foreground: '#1f2a1f'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Campo
      color: primary
    - text: Digitale
      color: accent
    button: primary
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Cosa c'è dentro
        en: Features
      href: '#funzioni'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      label:
        it: Agricoltore
        en: Farmer
      assignedBy: signup
    - key: consultant
      label:
        it: Consulente agronomo
        en: Agronomist consultant
      assignedBy: invite
  limits:
  - action: agent:agronomist
    per: user
    max: 30
    window: day
    roles:
    - user
  agents:
  - key: agronomist
    role: main
    description: Agronomo AI che risponde in chat alle domande tecniche, conoscendo gli appezzamenti e il quaderno dell'azienda.
    memory: user
    appTools:
    - name: read_plots
      description: Legge gli appezzamenti dell'agricoltore
      action: read
      collection: plots
      scope: user
    - name: read_log
      description: Legge il quaderno di campagna dell'agricoltore
      action: read
      collection: field_log
      scope: user
    - name: read_alerts
      description: Legge gli ultimi avvisi di rischio malattie
      action: search
      collection: risk_alerts
      scope: user
    profile:
      inline:
        display_name: Agronomo Campo Digitale
        chat_mode: true
        crews:
        - id: agronomist
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un agronomo esperto che assiste agricoltori italiani. Rispondi in modo pratico e breve alle
            domande tecniche (colture, varietà, fertilizzazione, irrigazione, difesa, raccolta). Usa gli strumenti read_plots,
            read_log e read_alerts per conoscere gli appezzamenti, i trattamenti già fatti e gli avvisi recenti, e citali
            quando rispondi. Non inventare mai dosaggi, numeri di registrazione o autorizzazioni: per i prodotti fitosanitari
            rimanda sempre all''etichetta e al registro del Ministero della Salute, e dì chiaramente quando non sei sicuro.
            Non sostituisci un agronomo abilitato per decisioni di legge o di sicurezza. Rispondi nella lingua dell''utente.
            Ricorda con lo strumento remember le preferenze stabili dell''azienda.'
    goalTemplate: 'Conversazione finora:

      {history}


      Nuovo messaggio di {user}: {message}

      Rispondi nella lingua con codice ISO {lang}.'
    output: markdown
  - key: phyto_checker
    role: helper
    description: Quando l'agricoltore registra un trattamento, verifica nel registro pubblico dei prodotti fitosanitari del
      Ministero della Salute che il prodotto sia autorizzato sulla coltura e che il dosaggio sia corretto.
    writesTo:
      collection: treatment_checks
      parse: markdown_sections
    profile:
      inline:
        display_name: Controllo fitosanitari
        crews:
        - id: phyto_checker
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'Controlli che un trattamento registrato nel quaderno di campagna sia conforme. Con gli strumenti
            WebRobot consulta la banca dati pubblica dei prodotti fitosanitari del Ministero della Salute (www.salute.gov.it,
            sezione Prodotti fitosanitari): cerca il prodotto per nome, verifica che l''autorizzazione sia in corso (non revocata
            né scaduta, anche per i periodi di smaltimento scorte), che la coltura sia tra gli usi autorizzati e che la dose
            per ettaro (o per hl) rientri nel massimo di etichetta, oltre a numero massimo di trattamenti e intervallo di
            sicurezza se disponibili. Scrivi un report che inizia con un titolo di livello 1 "# Controllo trattamento — <prodotto>
            su <coltura>", poi le sezioni ## Esito (una sola parola: CONFORME, NON CONFORME o DA VERIFICARE), ## Dettagli
            (tabella: autorizzazione, coltura, dose registrata, dose massima, intervallo di sicurezza), ## Cosa fare. Non
            inventare mai dati: se il prodotto o l''uso non si trova, scrivi DA VERIFICARE e rimanda all''etichetta. Cita
            la pagina del registro consultata. Non è una consulenza legale.'
    goalTemplate: 'Controlla il trattamento descritto nel compito ricevuto. Data di oggi: {date}. Scrivi in lingua ISO {lang}.'
    output: markdown
  - key: weather_risk
    role: helper
    description: Ogni giorno scarica le previsioni Open-Meteo per un appezzamento e stima il rischio di malattie con modelli
      semplici.
    memory: instance
    writesTo:
      collection: risk_alerts
      parse: markdown_sections
    appTools:
    - name: open_meteo_forecast
      description: Previsioni orarie e giornaliere Open-Meteo per una coordinata
      action: http
      http:
        method: GET
        url: https://api.open-meteo.com/v1/forecast
        attribution: Weather data by Open-Meteo.com, CC BY 4.0
    profile:
      inline:
        display_name: Rischio malattie
        crews:
        - id: weather_risk
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sorvegli un appezzamento agricolo. Chiama open_meteo_forecast con query: latitude=<lat>&longitude=<lon>&hourly=temperature_2m,relative_humidity_2m,precipitation&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&past_days=3&forecast_days=5&timezone=auto.
            La risposta è JSON con gli array hourly e daily. Stima il rischio con modelli semplici e dichiarali: per la peronospora
            della vite regola dei tre dieci (temperatura minima >= 10 °C, pioggia >= 10 mm in 24 ore, germogli >= 10 cm) e
            ore con umidità relativa > 90% con temperatura 10-25 °C; per l''oidio temperature 20-27 °C con umidità alta; adatta
            il modello alla coltura. Inizia con "# <Appezzamento> — <data>", poi ## Livello di rischio (BASSO, MEDIO o ALTO
            per ogni malattia, con soglia superata sì/no), ## Perché (i numeri previsti), ## Cosa fare (azioni pratiche, mai
            dosaggi di prodotti), ## Previsione 5 giorni (tabella). Se il rischio è ALTO scrivi AVVISO in prima riga dopo
            il titolo. Non inventare dati: se la chiamata fallisce dillo. La tua memoria contiene l''ultimo stato: segnala
            cosa è cambiato; alla fine chiama remember con i 3 punti chiave. Dati meteo: Open-Meteo.com, CC BY 4.0.'
  templates:
  - key: plot_watch
    title:
      it: Sorveglianza appezzamento
      en: Plot watch
    description:
      it: Ogni giorno previsioni meteo e rischio malattie per uno dei tuoi appezzamenti.
      en: Every day weather forecast and disease risk for one of your plots.
    agent: weather_risk
    params:
    - name: plot_name
      type: text
      required: true
      label:
        it: Appezzamento
        en: Plot
    - name: crop
      type: text
      required: true
      label:
        it: Coltura e varietà
        en: Crop and variety
    - name: lat
      type: number
      required: true
      label:
        it: Latitudine
        en: Latitude
    - name: lon
      type: number
      required: true
      label:
        it: Longitudine
        en: Longitude
    - name: threshold
      type: select
      label:
        it: Soglia di avviso
        en: Alert threshold
      default: alto
      options:
      - value: medio
        label:
          it: Medio e alto
          en: Medium and high
      - value: alto
        label:
          it: Solo alto
          en: High only
    goal: 'Appezzamento "{instance}": {plot_name}, coltura {crop}, lat {lat}, lon {lon}. Soglia di avviso: {threshold}. Oggi
      è {date}. Scrivi in lingua ISO {lang}.'
    schedule:
      cron: 0 5 * * *
      userCanChange: true
    maxPerUser: 30
    cost:
      perRun: 2
  triggers:
  - key: check_treatment
    description: Controlla ogni nuovo trattamento nel registro fitosanitari
    'on':
      collection: field_log
      op: insert
      where:
        type: treatment
    start:
      agent: phyto_checker
    goal: 'Verifica il trattamento registrato: {record.product} su {record.crop}, dose {record.dose} {record.dose_unit}, data
      {record.date}, note {record.notes}.'
    asUser: true
  egress:
    hosts:
    - api.open-meteo.com
    notes: Open-Meteo forecast API, dati CC BY 4.0 con attribuzione; l'uso commerciale richiede il piano a pagamento di Open-Meteo
      (da verificare prima del lancio).
  data:
    collections:
    - name: plots
      ownedBy: user
      sharing:
      - viewer
      - editor
      description: Appezzamenti dell'azienda, condivisibili con il consulente
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome
          en: Name
      - name: crop
        type: text
        required: true
        label:
          it: Coltura
          en: Crop
      - name: variety
        type: text
        label:
          it: Varietà
          en: Variety
      - name: sowing_date
        type: date
        label:
          it: Data di semina/impianto
          en: Sowing date
      - name: area_ha
        type: number
        required: true
        label:
          it: Superficie (ha)
          en: Area (ha)
      - name: lat
        type: number
        label:
          it: Latitudine
          en: Latitude
      - name: lon
        type: number
        label:
          it: Longitudine
          en: Longitude
      - name: boundary
        type: json
        label:
          it: Perimetro (GeoJSON)
          en: Boundary (GeoJSON)
    - name: field_log
      ownedBy: user
      sharing:
      - viewer
      - editor
      description: Quaderno di campagna
      fields:
      - name: plot
        type: relation
        relation: plots
        required: true
        label:
          it: Appezzamento
          en: Plot
      - name: crop
        type: text
        label:
          it: Coltura
          en: Crop
      - name: type
        type: select
        required: true
        label:
          it: Tipo
          en: Type
        options:
        - value: treatment
          label:
            it: Trattamento
            en: Treatment
        - value: fertilization
          label:
            it: Concimazione
            en: Fertilization
        - value: irrigation
          label:
            it: Irrigazione
            en: Irrigation
        - value: harvest
          label:
            it: Raccolto
            en: Harvest
      - name: date
        type: date
        required: true
        label:
          it: Data
          en: Date
      - name: product
        type: text
        label:
          it: Prodotto
          en: Product
      - name: dose
        type: number
        label:
          it: Dose/quantità
          en: Dose/quantity
      - name: dose_unit
        type: text
        label:
          it: Unità (kg/ha, l/ha, mm, q...)
          en: Unit
      - name: notes
        type: textarea
        label:
          it: Note
          en: Notes
    - name: treatment_checks
      ownedBy: user
      description: Esito dei controlli sul registro fitosanitari
    - name: risk_alerts
      ownedBy: instance
      description: Avvisi e stime di rischio giornaliere di ogni appezzamento sorvegliato
  views:
  - key: home
    type: page
    nav: false
    title: Campo Digitale
    sections:
    - type: hero
      eyebrow:
        it: Per aziende agricole
        en: For farms
      title:
        it: Il **quaderno di campagna** che pensa con te.
        en: The **field notebook** that thinks with you.
      text:
        it: Registra appezzamenti e lavori, controlla che i trattamenti siano autorizzati, ricevi ogni giorno il rischio di
          malattie e chiedi all'agronomo AI.
        en: Record plots and work, check that treatments are authorised, get daily disease risk and ask the AI agronomist.
      actions:
      - label:
          it: Inizia
          en: Start
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Crea gli appezzamenti
          en: Create plots
        text:
          it: Coltura, varietà, semina, superficie e posizione.
          en: Crop, variety, sowing, area and location.
        badge: 🌱
      - title:
          it: Compila il quaderno
          en: Fill the notebook
        text:
          it: Trattamenti, concimazioni, irrigazioni, raccolti. Ogni trattamento è controllato nel registro del Ministero
            della Salute.
          en: Treatments, fertilisation, irrigation, harvests. Every treatment is checked against the Ministry of Health register.
        badge: 📒
      - title:
          it: Ricevi gli avvisi
          en: Get alerts
        text:
          it: Ogni giorno previsioni Open-Meteo e rischio di peronospora e altre malattie.
          en: Daily Open-Meteo forecasts and downy mildew and other disease risk.
        badge: ⛅
    - type: cards
      id: funzioni
      title:
        it: Cosa c'è dentro
        en: Features
      items:
      - title:
          it: Agronomo in chat
          en: Chat agronomist
        text:
          it: Risposte tecniche che conoscono la tua azienda.
          en: Technical answers that know your farm.
        badge: 💬
      - title:
          it: Consulente multi-azienda
          en: Multi-farm consultant
        text:
          it: Il consulente segue più aziende, su invito dell'agricoltore.
          en: The consultant follows several farms, by the farmer's invitation.
        badge: 🤝
      - title:
          it: Abbonamento annuale
          en: Annual plan
        text:
          it: Scaglioni in base agli ettari.
          en: Tiers based on hectares.
        badge: 🌾
    - type: note
      content:
        it: 'Supporto alle decisioni, non sostituisce l''agronomo abilitato né l''etichetta dei prodotti. Dati meteo: Open-Meteo.com
          (CC BY 4.0).'
        en: 'Decision support; it does not replace a licensed agronomist or the product label. Weather data: Open-Meteo.com
          (CC BY 4.0).'
  - key: overview
    type: page
    title:
      it: Azienda
      en: Farm
    roles:
    - user
    - consultant
    - admin
    sections:
    - type: data
      title:
        it: Ultimi avvisi
        en: Latest alerts
      source: collection:risk_alerts
      display: list
      limit: 10
      sort:
        field: createdAt
        dir: desc
      empty:
        it: 'Nessun avviso: crea una sorveglianza per un appezzamento.'
        en: 'No alerts yet: create a plot watch.'
    - type: data
      title:
        it: Appezzamenti
        en: Plots
      source: collection:plots
      display: kpi
      kpis:
      - label:
          it: Appezzamenti
          en: Plots
        agg: count
      - label:
          it: Ettari
          en: Hectares
        agg: sum
        field: area_ha
        format: number
  - key: plots
    type: table
    title:
      it: Appezzamenti
      en: Plots
    source: collection:plots
    columns:
    - name
    - crop
    - variety
    - sowing_date
    - area_ha
    roles:
    - user
    - consultant
    - admin
  - key: log
    type: table
    title:
      it: Quaderno di campagna
      en: Field notebook
    source: collection:field_log
    columns:
    - date
    - plot
    - type
    - product
    - dose
    - dose_unit
    - notes
    roles:
    - user
    - consultant
    - admin
  - key: checks
    type: list
    title:
      it: Controlli trattamenti
      en: Treatment checks
    source: collection:treatment_checks
    roles:
    - user
    - consultant
    - admin
  - key: watches
    type: instances
    template: plot_watch
    title:
      it: Sorveglianza meteo-malattie
      en: Weather-disease watch
    roles:
    - user
    - admin
  - key: alerts
    type: list
    title:
      it: Avvisi rischio
      en: Risk alerts
    source: collection:risk_alerts
    roles:
    - user
    - consultant
    - admin
  - key: chat
    type: chat
    title:
      it: Agronomo
      en: Agronomist
    source: agent:agronomist
    examples:
    - it: Quando conviene irrigare la vite questa settimana?
      en: When should I irrigate the vines this week?
    - it: Come riconosco i primi sintomi di peronospora?
      en: How do I spot early downy mildew?
    placeholder:
      it: Fai una domanda tecnica…
      en: Ask a technical question…
    roles:
    - user
    - consultant
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Plan
    roles:
    - user
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 50
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:agronomist:
        estimate: 10
        metered: true
      agent:phyto_checker:
        estimate: 10
        metered: true
    packs:
    - key: extra
      credits: 500
      price: 5
      label: 500 crediti
    plans:
    - key: farm_s
      price: 120
      interval: year
      label: Fino a 20 ha
      includes:
      - plots up to 20 ha
      credits: 1000
      creditsReset: monthly
      roles:
      - user
    - key: farm_m
      price: 300
      interval: year
      label: Fino a 100 ha
      includes:
      - plots up to 100 ha
      credits: 3000
      creditsReset: monthly
      roles:
      - user
    - key: farm_l
      price: 700
      interval: year
      label: Fino a 500 ha
      includes:
      - plots up to 500 ha
      credits: 8000
      creditsReset: monthly
      roles:
      - user
  mobile:
    appId: eu.webrobot.campodigitale
  extensions:
  - key: map_editor
    description: 'Disegno degli appezzamenti su mappa: non disponibile; per ora perimetro come GeoJSON incollato e coordinate
      del centro.'
  - key: vigor_ndvi
    description: 'Indice di vigore settimanale da immagini Copernicus/Sentinel-2 e segnalazione zone in sofferenza: richiede
      accesso autenticato a Copernicus Data Space e analisi raster, non esprimibile oggi.'
  - key: sensors
    description: 'Collegamento di stazioni meteo e sonde di umidità: richiede credenziali per cliente o ingest dai dispositivi,
      non disponibile.'
  - key: offline_mobile
    description: 'App mobile con uso offline in campagna e sincronizzazione: il guscio nativo c''è, la modalità offline no.'
  - key: notifications
    description: 'Avvisi push o email quando il rischio supera la soglia: per ora gli avvisi compaiono nell''app.'
  - key: per_hectare_billing
    description: 'Abbonamento annuale calcolato per ettaro: approssimato con scaglioni di ettari.'
  - key: consultant_multi_farm
    description: 'Vista unica del consulente su più aziende: oggi via condivisione per record (viewer/editor) di appezzamenti
      e quaderno.'
