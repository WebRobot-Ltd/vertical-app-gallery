apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: radar-agevolazioni
  displayName: RadarAgevolazioni
  tagline:
    it: I bandi giusti per la tua impresa, ogni mattina, con il punteggio di ammissibilità.
  description:
    it: Monitoraggio quotidiano di oltre trenta fonti pubbliche di finanza agevolata, confronto con il profilo aziendale,
      bozze di domanda riviste da un consulente.
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: dashboard
  branding:
    theme: light
    palette:
      primary: '#12355b'
      accent: '#e08a1e'
      background: '#f6f8fb'
      foreground: '#17202b'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Radar
      color: primary
    - text: Agevolazioni
      color: accent
  header:
    links:
    - label: Come funziona
      href: '#come-funziona'
    - label: Fonti
      href: '#fonti'
    cta:
      label: Accedi
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      label: Cliente
      assignedBy: signup
    - key: consultant
      label: Consulente
      assignedBy: derived
      from: collection:company_profiles.consultant_email
  limits:
  - action: agent:drafter
    per: user
    max: 10
    window: day
  agents:
  - key: scout
    role: scheduled
    description: Ogni mattina monitora le fonti pubbliche e indicizza i nuovi bandi.
    mcpServers: []
    writesTo:
      collection: grants
      parse: markdown_sections
    goalTemplate: Oggi è {date}. Controlla le fonti pubbliche di finanza agevolata e restituisci SOLO i bandi nuovi o modificati
      dall'ultimo controllo.
    output: markdown
    limits:
      maxTurns: 60
      maxBudgetUsd: 3
    profile:
      inline:
        display_name: Radar bandi - scout
        crews:
        - id: scout
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 60
          max_budget_usd: 3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'Sei lo scout di RadarAgevolazioni. Ogni giorno monitori più di trenta fonti pubbliche: incentivi.gov.it,
            i portali delle Regioni e delle Camere di Commercio, il Registro Nazionale Aiuti (RNA), il portale EU Funding
            & Tenders, Invitalia, MIMIT, GSE. Usa gli strumenti WebRobot MCP per leggere le pagine e costruire/lanciare le
            pipeline di raccolta; non scrivere codice né YAML a mano. Individua i bandi pubblicati o modificati di recente
            e, per ciascuno, apri la pagina ufficiale ed estrai solo ciò che vi è scritto: mai inventare importi, scadenze
            o requisiti (se manca scrivi ''non indicato''). Restituisci una sezione per bando, con titolo ''## <titolo del
            bando>'' seguito da righe ''- campo: valore'' con questi campi esatti: authority (ente), source_url, region (o
            ''Nazionale''/''UE''), ateco_codes (codici o settori ammessi), deadline (AAAA-MM-GG), budget (dotazione), contribution_pct
            (numero, percentuale di contributo), requirements (requisiti: dimensione, dipendenti, fatturato, anzianità, sede,
            ecc.), eligible_investments (macchinari, digitale, assunzioni, energia, altro), summary (2-3 frasi), published
            (AAAA-MM-GG). Inizia con una riga ''# Bandi rilevati <data>''. Se non ci sono novità scrivi solo il titolo e ''Nessuna
            novità''.'
  - key: matcher
    role: helper
    description: Confronta i bandi con il profilo del cliente e calcola il punteggio di ammissibilità.
    memory: instance
    context:
    - key: profile
      from: collection:company_profiles
    appTools:
    - name: read_grants
      description: Cerca e legge i bandi indicizzati
      action: search
      collection: grants
      scope: all
    - name: read_matches
      description: Legge le valutazioni già salvate per questo cliente
      action: read
      collection: matches
      scope: user
    - name: write_matches
      description: Salva la valutazione di un bando per questo cliente
      action: write
      collection: matches
      scope: user
    goalTemplate: 'Oggi è {date}. Cliente: {instance}. Profilo aziendale (JSON): {profile}

      Punteggio minimo da segnalare: {min_score}.

      Valuta i bandi aperti e salva le valutazioni.'
    output: markdown
    limits:
      maxTurns: 40
      maxBudgetUsd: 1.5
    profile:
      inline:
        display_name: Radar bandi - matcher
        crews:
        - id: matcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei il valutatore di ammissibilità di RadarAgevolazioni. Con read_grants leggi i bandi non scaduti;
            con read_matches vedi quelli già valutati (rivaluta solo se il bando è cambiato). Per ogni bando confrontalo con
            il profilo (ATECO, regione e provincia, dipendenti, fatturato, anno di costituzione, tipo e importo dell''investimento).
            Calcola un punteggio 0-100 basato SOLO sui requisiti documentati nel bando: ATECO e settore, territorio, dimensione,
            anzianità, tipo di investimento, scadenza ancora aperta. Per i bandi con punteggio >= soglia chiama write_matches
            con i campi: grant_title, grant_ref (url del bando), score, met (elenco dei requisiti soddisfatti), missing (requisiti
            non soddisfatti o non verificabili, con cosa serve), deadline, contribution_pct, url, consultant_email (dal profilo),
            run_date (oggi). Non inventare: se un requisito non è verificabile, indicalo in missing e non assegnare punti.
            Il punteggio è un supporto, non una garanzia di ammissibilità. Chiudi con un report ''# Bandi compatibili — <data>''
            con tabella (bando, punteggio, scadenza, contributo) e per ciascuno due righe su cosa soddisfa e cosa manca; solo
            bandi nuovi rispetto a quanto già segnalato, altrimenti ''Nessun nuovo bando compatibile''. Alla fine chiama remember
            con i bandi già segnalati.'
  - key: drafter
    role: main
    description: Prepara bozza di domanda e relazione tecnica per un bando scelto e le invia al consulente.
    awaits:
    - draft_review
    context:
    - key: profile
      from: collection:company_profiles
    - key: grant_title
      from: collection:matches.grant_title
    - key: grant_ref
      from: collection:matches.grant_ref
    - key: missing
      from: collection:matches.missing
    - key: consultant_email
      from: collection:matches.consultant_email
    appTools:
    - name: read_grants
      description: Cerca e legge i bandi indicizzati
      action: search
      collection: grants
      scope: all
    - name: read_drafts
      description: Legge le bozze del cliente
      action: read
      collection: drafts
      scope: user
    - name: write_drafts
      description: Salva o aggiorna una bozza del cliente
      action: write
      collection: drafts
      scope: user
    goalTemplate: 'Bando: {grant_title} ({grant_ref}).

      Requisiti mancanti o da verificare: {missing}

      Profilo aziendale (JSON): {profile}

      {?notes}Note del cliente: {notes}{/notes}

      Consulente assegnato: {consultant_email}. Oggi è {date}. Scrivi in italiano.'
    output: markdown
    limits:
      maxTurns: 30
      maxBudgetUsd: 2
    profile:
      inline:
        display_name: Radar bandi - redattore pratiche
        crews:
        - id: drafter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei il redattore di pratiche di finanza agevolata. Con read_grants recupera il testo del bando scelto.
            Prepara (1) una bozza di domanda di contributo e (2) una relazione tecnica, usando solo i dati del profilo e del
            bando; ogni dato mancante va segnato [DA COMPLETARE], mai inventato (importi, date, dati economici). Segnala chiaramente
            i requisiti mancanti. Salva con write_drafts: grant_title, match_id (se noto), application_draft, technical_report,
            status ''in_review'', consultant_email. Poi chiama request_draft_review con grant_title e l''id della bozza (draft_id):
            il cliente potrà scaricare i documenti solo dopo l''approvazione del consulente. Chiudi con un report che inizia
            con ''# Bozza pratica — <bando>'' con il riepilogo e l''avviso che la bozza è in revisione presso il consulente.
            Non è consulenza legale o fiscale.'
  - key: finalizer
    role: helper
    description: Rende scaricabile la bozza dopo l'approvazione del consulente.
    appTools:
    - name: read_drafts
      description: Legge le bozze del cliente
      action: read
      collection: drafts
      scope: user
    - name: write_drafts
      description: Salva o aggiorna una bozza del cliente
      action: write
      collection: drafts
      scope: user
    output: markdown
    limits:
      maxTurns: 6
      maxBudgetUsd: 0.2
    profile:
      inline:
        display_name: Radar bandi - finalizzatore
        crews:
        - id: finalizer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: Ricevi l'evento di un'approvazione concessa dal consulente. Individua la bozza indicata da draft_id
            con read_drafts e aggiornala con write_drafts impostando status 'approved'. Non modificare altro. Rispondi con
            '# Bozza approvata' e una riga.
  inputForm:
    title: Prepara bozza di domanda
    fields:
    - name: match
      type: select
      required: true
      label: Bando scelto
      optionsFrom: collection:matches
    - name: notes
      type: textarea
      maxLength: 800
      label: Note per la pratica (facoltative)
  data:
    collections:
    - name: company_profiles
      description: Profilo aziendale del cliente
      ownedBy: user
      fields:
      - name: company_name
        type: text
        required: true
        label: Ragione sociale
      - name: ateco
        type: text
        required: true
        label: Codice ATECO
      - name: region
        type: text
        required: true
        label: Regione sede
      - name: province
        type: text
        required: true
        label: Provincia sede
      - name: employees
        type: number
        required: true
        label: Numero dipendenti
      - name: revenue
        type: number
        required: true
        label: Fatturato annuo (€)
      - name: founded_year
        type: number
        required: true
        label: Anno di costituzione
      - name: investment_type
        type: multiselect
        required: true
        label: Tipo di investimento
        options:
        - value: macchinari
          label: Macchinari
        - value: digitale
          label: Digitale
        - value: assunzioni
          label: Assunzioni
        - value: energia
          label: Energia
      - name: investment_amount
        type: number
        required: true
        label: Importo previsto (€)
      - name: consultant_email
        type: email
        label: Email del consulente dello studio
        help: Il consulente assegnato vedrà i tuoi dati.
      access:
      - role: consultant
        where:
          consultant_email: '{user.email}'
        can:
        - read
        - write
    - name: grants
      description: Bandi indicizzati dallo scout
      ownedBy: app
      searchable: true
      fields:
      - name: title
        type: text
        label: Bando
      - name: authority
        type: text
        label: Ente
      - name: source_url
        type: url
        label: Fonte
      - name: region
        type: text
        label: Territorio
      - name: ateco_codes
        type: text
        label: ATECO / settori
      - name: deadline
        type: date
        label: Scadenza
      - name: budget
        type: text
        label: Dotazione
      - name: contribution_pct
        type: number
        label: Contributo %
      - name: requirements
        type: textarea
        label: Requisiti
      - name: eligible_investments
        type: text
        label: Investimenti ammessi
      - name: summary
        type: textarea
        label: Sintesi
      - name: published
        type: date
        label: Pubblicato
    - name: matches
      description: Valutazione di ammissibilità per cliente
      ownedBy: user
      fields:
      - name: grant_title
        type: text
        label: Bando
      - name: grant_ref
        type: url
        label: Link
      - name: score
        type: number
        label: Punteggio
      - name: met
        type: textarea
        label: Requisiti soddisfatti
      - name: missing
        type: textarea
        label: Requisiti mancanti
      - name: deadline
        type: date
        label: Scadenza
      - name: contribution_pct
        type: number
        label: Contributo %
      - name: url
        type: url
        label: Fonte
      - name: consultant_email
        type: email
      - name: run_date
        type: date
        label: Valutato il
      access:
      - role: consultant
        where:
          consultant_email: '{user.email}'
        can:
        - read
    - name: drafts
      description: Bozze di domanda e relazione tecnica
      ownedBy: user
      retentionDays: 730
      fields:
      - name: grant_title
        type: text
        label: Bando
      - name: match_id
        type: text
      - name: application_draft
        type: textarea
        label: Bozza di domanda
      - name: technical_report
        type: textarea
        label: Relazione tecnica
      - name: status
        type: select
        label: Stato
        options:
        - value: in_review
          label: In revisione
        - value: approved
          label: Approvata
      - name: consultant_email
        type: email
      access:
      - role: consultant
        where:
          consultant_email: '{user.email}'
        can:
        - read
        - write
  templates:
  - key: radar
    title: Il mio radar
    description: Ogni mattina confronta i nuovi bandi con il tuo profilo e ti scrive i compatibili.
    agent: matcher
    params:
    - name: min_score
      type: number
      required: true
      default: 60
      label: Punteggio minimo da segnalare
    goal: Valuta per "{instance}" i bandi aperti rispetto al profilo. Soglia {min_score}. Oggi è {date}. Scrivi in italiano.
    schedule:
      cron: 0 6 * * *
      userCanChange: false
    maxPerUser: 1
    deliver:
      to: owner
      subject: Bandi compatibili del {date}
      onlyIfNew: true
  schedules:
  - agent: scout
    cron: 0 4 * * *
    action: run
    owner: app
  approvals:
  - key: draft_review
    title: Revisione bozza di domanda
    description: Il consulente rivede e approva la bozza prima che il cliente la scarichi.
    role: consultant
    fields:
    - grant_title
    - draft_id
    timeoutMinutes: 10080
    onTimeout: reject
  triggers:
  - key: draft_to_review
    'on':
      collection: drafts
      op: insert
    notify:
      to:
      - record.consultant_email
      subject: 'Nuova bozza da rivedere: {record.grant_title}'
      body: Un cliente ha una bozza di domanda in attesa di revisione.
      link: approvals
  - key: draft_approved
    'on':
      approval: draft_review
      decision: approved
    start:
      agent: finalizer
    goal: 'Approvazione concessa. Evento: {event}. Imposta status approved sulla bozza indicata da draft_id.'
  - key: draft_ready
    'on':
      collection: drafts
      op: update
      where:
        status: approved
    notify:
      to: owner
      subject: 'La tua bozza è pronta: {record.grant_title}'
      body: Il consulente ha approvato la bozza. Puoi scaricarla dall'area Le mie pratiche.
      link: my_drafts
  views:
  - key: home
    type: page
    title: RadarAgevolazioni
    nav: false
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow: Per PMI e consulenti di finanza agevolata
      title: Il bando giusto, **prima** della scadenza.
      text: Ogni mattina monitoriamo oltre trenta fonti pubbliche, confrontiamo i nuovi bandi con il profilo della tua impresa
        e ti diciamo quali requisiti soddisfi e quali mancano. Le bozze di domanda sono riviste da un consulente.
      actions:
      - label: Inizia
        href: /login
        style: primary
      - label: Come funziona
        href: '#come-funziona'
        style: ghost
    - type: steps
      id: come-funziona
      title: Come funziona
      items:
      - title: Compili il profilo
        text: ATECO, sede, dipendenti, fatturato, anno di costituzione, investimento previsto.
        badge: '1'
      - title: Il radar lavora ogni mattina
        text: Un agente indicizza i nuovi bandi ed estrae requisiti, scadenze, dotazione e percentuale di contributo.
        badge: '2'
      - title: Punteggio di ammissibilità
        text: Un secondo agente confronta ogni bando con il tuo profilo e spiega cosa è soddisfatto e cosa manca. Ricevi i
          compatibili via email.
        badge: '3'
      - title: Bozza rivista dal consulente
        text: Per i bandi scelti prepariamo domanda e relazione tecnica; si scaricano dopo l'approvazione del consulente.
        badge: '4'
    - type: cards
      id: fonti
      title: Fonti monitorate
      items:
      - title: Nazionali
        text: incentivi.gov.it, Registro Nazionale Aiuti, MIMIT, Invitalia, GSE.
      - title: Regionali
        text: Portali delle Regioni e delle Camere di Commercio.
      - title: Europee
        text: EU Funding & Tenders.
    - type: note
      content: 'Strumento di supporto alle decisioni: il punteggio non garantisce l''ammissibilità né il contributo. Le informazioni
        vanno verificate sul bando ufficiale.'
  - key: profile
    type: form
    title: Profilo aziendale
    collection: company_profiles
    submit:
      label: Salva profilo
      message: Profilo salvato.
      redirect: dashboard
    edit: true
    roles:
    - user
    - admin
  - key: dashboard
    type: page
    title: Dashboard
    roles:
    - user
    - admin
    sections:
    - type: data
      title: I miei bandi compatibili
      source: collection:matches
      display: kpi
      kpis:
      - label: Bandi compatibili
        agg: count
      - label: Punteggio medio
        agg: avg
        field: score
        format: number
      - label: Punteggio massimo
        agg: max
        field: score
        format: number
    - type: data
      id: compatibili
      title: Bandi compatibili con il mio profilo
      source: collection:matches
      display: table
      fields:
      - key: grant_title
        label: Bando
      - key: score
        label: Punteggio
        format: number
      - key: deadline
        label: Scadenza
        format: date
      - key: contribution_pct
        label: Contributo %
        format: percent
      - key: met
        label: Soddisfatti
      - key: missing
        label: Mancanti
      - key: url
        label: Fonte
        format: link
      sort:
        field: score
        dir: desc
      limit: 100
      empty: 'Nessun bando compatibile ancora: completa il profilo e attiva il radar.'
    - type: view
      title: Il mio radar
      view: radar
  - key: grants
    type: table
    title: Tutti i bandi
    source: collection:grants
    export: true
    roles:
    - user
    - consultant
    - admin
    data:
      display: table
      fields:
      - key: title
        label: Bando
      - key: authority
        label: Ente
      - key: region
        label: Territorio
      - key: deadline
        label: Scadenza
        format: date
      - key: budget
        label: Dotazione
      - key: contribution_pct
        label: Contributo %
        format: percent
      - key: eligible_investments
        label: Investimenti
      - key: source_url
        label: Fonte
        format: link
      sort:
        field: published
        dir: desc
      limit: 200
  - key: radar
    type: instances
    template: radar
    title: Il mio radar
    roles:
    - user
    - admin
  - key: new_draft
    type: new_run
    title: Prepara bozza di domanda
    roles:
    - user
    - admin
  - key: my_drafts
    type: table
    title: Le mie pratiche
    source: collection:drafts
    roles:
    - user
    - admin
    data:
      display: table
      fields:
      - key: grant_title
        label: Bando
      - key: status
        label: Stato
        format: badge
      - key: application_draft
        label: Bozza di domanda
      - key: technical_report
        label: Relazione tecnica
      filters:
      - field: status
        op: '='
        value: approved
      limit: 50
      empty: Nessuna bozza approvata finora.
  - key: draft
    type: report
    title: Bozza
    source: run
    printable: true
    nav: false
  - key: history
    type: history
    title: Le mie richieste
    source: run
    roles:
    - user
    - admin
  - key: clients
    type: table
    title: Clienti assegnati
    source: collection:company_profiles
    export: true
    roles:
    - consultant
    - admin
    data:
      display: table
      fields:
      - key: company_name
        label: Azienda
      - key: ateco
        label: ATECO
      - key: region
        label: Regione
      - key: province
        label: Provincia
      - key: employees
        label: Dipendenti
        format: number
      - key: revenue
        label: Fatturato
        format: money
      - key: investment_amount
        label: Investimento
        format: money
      limit: 200
  - key: client_matches
    type: table
    title: Bandi per cliente
    source: collection:matches
    roles:
    - consultant
    - admin
    data:
      display: table
      fields:
      - key: grant_title
        label: Bando
      - key: score
        label: Punteggio
        format: number
      - key: deadline
        label: Scadenza
        format: date
      - key: missing
        label: Mancanti
      sort:
        field: score
        dir: desc
      limit: 200
  - key: drafts_review
    type: table
    title: Bozze dei clienti
    source: collection:drafts
    roles:
    - consultant
    - admin
    data:
      display: table
      fields:
      - key: grant_title
        label: Bando
      - key: status
        label: Stato
        format: badge
      - key: application_draft
        label: Bozza di domanda
      - key: technical_report
        label: Relazione tecnica
      limit: 100
  - key: approvals
    type: approvals
    title: Da approvare
    approvals:
    - draft_review
    roles:
    - consultant
    - admin
  - key: account
    type: account
    title: Abbonamento e crediti
    roles:
    - user
  notifications:
    emailOnRunDone: true
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 0
    costs:
      agent:drafter: 40
    packs:
    - key: pratiche_3
      credits: 120
      price: 120
      label: 3 bozze di domanda
