apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: lenteaste
  displayName: LenteAste
  tagline: Aste giudiziarie immobiliari, senza leggere cento pagine di perizia.
  description: LenteAste controlla ogni giorno il Portale delle Vendite Pubbliche, legge perizie e allegati al posto tuo,
    stima il costo reale dell'operazione e ti avvisa via email quando compare un'asta compatibile con le tue ricerche.
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: dashboard
  branding:
    theme: light
    palette:
      primary: '#1f2a44'
      accent: '#b8862b'
      background: '#f8f6f1'
      foreground: '#1b1f24'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Lente
      color: primary
    - text: Aste
      color: accent
  header:
    links:
    - label: Come funziona
      href: '#come-funziona'
    - label: Prezzi
      href: '#prezzi'
    cta:
      label: Accedi
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  limits:
  - action: agent:advisor
    per: user
    max: 40
    window: day
    roles:
    - user
  - action: agent:deep
    per: user
    max: 10
    window: day
    roles:
    - user
  agents:
  - key: collector
    role: scheduled
    description: Ogni giorno raccoglie dal Portale delle Vendite Pubbliche i nuovi annunci immobiliari e i PDF allegati.
    profile:
      inline:
        display_name: LenteAste collector
        crews:
        - id: collector
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 60
          max_budget_usd: 3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'Sei il raccoglitore di LenteAste. Con il MCP WebRobot consulti il Portale delle Vendite Pubbliche
            (pvp.giustizia.it) per gli immobili in vendita giudiziaria, rispettando le condizioni di riuso del portale, robots
            e frequenza ragionevole delle richieste: nessun accesso massivo, solo annunci nuovi o aggiornati dalle ultime
            48 ore. Per ogni annuncio non ancora presente (usa get_auctions per controllare external_id) chiama save_auction
            con: external_id (id dell''annuncio sul portale), title, comune, provincia, tipo (appartamento|box|terreno|capannone|altro),
            base_price (euro, numero), occupazione (libero|occupato_debitore|occupato_terzi|non_noto), sale_date (YYYY-MM-DD),
            url, doc_urls (elenco degli URL dei PDF: perizia, avviso di vendita, ordinanza), status ''nuovo''. Non inventare
            dati: se un campo manca lascialo vuoto. Chiudi con un titolo ''# Raccolta del <data>'' e un breve riepilogo (numero
            di annunci nuovi, eventuali errori).'
    appTools:
    - name: save_auction
      description: Salva un nuovo annuncio d'asta
      action: append
      collection: auctions
      scope: all
    - name: get_auctions
      description: Legge le aste già salvate
      action: read
      collection: auctions
      scope: all
    output: markdown
    limits:
      maxTurns: 60
      maxBudgetUsd: 3
  - key: extractor
    role: helper
    description: Scarica i PDF di un'asta, li indicizza pagina per pagina e ne estrae i dati chiave con semaforo di rischio.
    profile:
      inline:
        display_name: LenteAste perizia reader
        crews:
        - id: extractor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 50
          max_budget_usd: 2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'Sei un analista di perizie per aste immobiliari italiane. Con il MCP WebRobot scarichi i PDF dell''asta
            indicata (perizia, avviso di vendita, ordinanza) e ne ricavi il testo. 1) Per ogni pagina chiama index_page con
            auction_id (external_id), doc_type (perizia|avviso|ordinanza|altro), page (numero), text (testo della pagina).
            2) Poi chiama update_auction (stesso external_id) con: surface (mq), irregularities (difformità urbanistiche/catastali),
            abuses (abusi e sanabilità), condo_arrears (euro di spese condominiali arretrate, numero), occupazione (libero|occupato_debitore|occupato_terzi|non_noto),
            charges (oneri a carico dell''aggiudicatario: sanatorie, cancellazioni, spese), total_cost (stima del costo totale
            reale = prezzo base + oneri + arretrati + sanatorie + eventuali costi di liberazione, euro), risk (verde|giallo|rosso),
            summary (max 80 parole con i motivi del semaforo), status ''analizzato''. Rosso: abusi non sanabili, occupazione
            da terzi con titolo opponibile, arretrati o oneri rilevanti rispetto al prezzo. Non inventare cifre: se un dato
            non è nel documento scrivi ''non indicato''. Chiudi con ''# Analisi <external_id>'' e una riga di esito.'
    appTools:
    - name: index_page
      description: Salva il testo di una pagina di documento
      action: append
      collection: auction_docs
      scope: all
    - name: update_auction
      description: Aggiorna i dati estratti di un'asta
      action: write
      collection: auctions
      scope: all
    output: markdown
    limits:
      maxTurns: 50
      maxBudgetUsd: 2
  - key: matcher
    role: helper
    description: Per una ricerca salvata, trova le nuove aste compatibili e prepara la scheda sintetica con semaforo.
    memory: instance
    writesTo:
      collection: matches
      parse: whole
    profile:
      inline:
        display_name: LenteAste matcher
        crews:
        - id: matcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Segui una ricerca salvata di un utente su aste giudiziarie. Con search_auctions cerca le aste analizzate
            (status ''analizzato'') che rispettano i criteri: comuni/province, tipologia, prezzo base massimo, occupazione
            desiderata (se ''qualsiasi'' ignora il filtro). La tua memoria contiene gli external_id già segnalati: escludili.
            Scrivi ''# Nuove aste — <data>'' e per ogni asta nuova una scheda: 🟢/🟡/🔴 semaforo, titolo, comune, prezzo base,
            costo totale stimato, occupazione, 3 punti chiave dal summary, link. Se non ci sono novità scrivi ''# Nessuna
            nuova asta'' con una sola riga. Mai inventare dati. Alla fine chiama una volta remember con gli external_id segnalati
            finora (vecchi + nuovi).'
    appTools:
    - name: search_auctions
      description: Cerca tra le aste analizzate
      action: search
      collection: auctions
      scope: all
  - key: deep
    role: main
    description: Analisi approfondita di una singola asta con costo totale e rischi.
    goalTemplate: 'Asta: {auction}

      {?notes}Note dell''utente: {notes}{/notes}

      {?budget}Budget massimo dell''utente: {budget} euro.{/budget}

      Scrivi il report in italiano. Oggi è {date}.'
    profile:
      inline:
        display_name: LenteAste deep analysis
        crews:
        - id: deep
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un analista di aste immobiliari giudiziarie. Con get_auctions leggi la scheda dell''asta (external_id
            indicato) e con find_docs le pagine indicizzate dei documenti. Produci un report: ''# Asta <comune> — <tipo> —
            <external_id>'' poi ## Sintesi e semaforo (🟢🟡🔴 motivato), ## Immobile (superficie, occupazione, stato), ## Difformità
            e abusi, ## Spese e oneri a carico dell''aggiudicatario (arretrati condominiali, sanatorie, cancellazioni), ##
            Costo totale reale (tabella: prezzo base, oneri, arretrati, sanatorie, liberazione, totale, con ipotesi dichiarate),
            ## Domande da porre al custode/professionista delegato, ## Fonti (documento e pagina). Aggiungi un grafico ```chart
            con le voci di costo (type bar, unit €). Cita sempre pagina e documento. Non inventare cifre né dare consulenza
            legale o fiscale: è un supporto alla decisione, da verificare con un professionista.'
    appTools:
    - name: get_auctions
      description: Legge le aste
      action: read
      collection: auctions
      scope: all
    - name: find_docs
      description: Cerca nelle pagine dei documenti d'asta
      action: search
      collection: auction_docs
      scope: all
    output: markdown
    limits:
      maxTurns: 25
      maxBudgetUsd: 1.5
  - key: advisor
    role: helper
    description: Chat sui documenti di un'asta, con citazione della pagina.
    goalTemplate: 'Pagina/asta corrente: {?page}{page}{/page}

      Conversazione finora:

      {history}

      Nuova domanda: {message}

      Rispondi in italiano.'
    profile:
      inline:
        display_name: LenteAste advisor
        crews:
        - id: advisor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Rispondi a domande sui documenti di un''asta giudiziaria (perizia, avviso di vendita, ordinanza).
            Usa get_auctions per la scheda e find_docs per trovare i passaggi: rispondi solo in base ai documenti, citando
            sempre documento e pagina tra parentesi, es. (perizia, p. 14). Se l''informazione non c''è, dillo. Se l''utente
            non indica l''asta, chiedi l''external_id. Nessuna consulenza legale: suggerisci di verificare con un professionista.'
    appTools:
    - name: get_auctions
      description: Legge le aste
      action: read
      collection: auctions
      scope: all
    - name: find_docs
      description: Cerca nelle pagine dei documenti d'asta
      action: search
      collection: auction_docs
      scope: all
  inputForm:
    title: Analisi approfondita
    fields:
    - name: auction
      type: select
      required: true
      label: Asta
      optionsFrom: collection:auctions
    - name: budget
      type: number
      label: Il tuo budget massimo (€)
    - name: notes
      type: textarea
      maxLength: 500
      label: Note o priorità (facoltative)
  data:
    collections:
    - name: auctions
      ownedBy: shared
      searchable: true
      description: Aste giudiziarie raccolte dal portale e analizzate (comuni a tutti)
      fields:
      - name: external_id
        type: text
        label: ID portale
      - name: title
        type: text
        label: Titolo
      - name: comune
        type: text
        label: Comune
      - name: provincia
        type: text
        label: Provincia
      - name: tipo
        type: select
        label: Tipologia
        options:
        - appartamento
        - box
        - terreno
        - capannone
        - altro
      - name: base_price
        type: number
        label: Prezzo base
      - name: occupazione
        type: select
        label: Occupazione
        options:
        - libero
        - occupato_debitore
        - occupato_terzi
        - non_noto
      - name: sale_date
        type: date
        label: Data vendita
      - name: url
        type: url
        label: Link
      - name: doc_urls
        type: textarea
        label: PDF allegati
      - name: status
        type: select
        label: Stato
        options:
        - nuovo
        - analizzato
      - name: surface
        type: number
        label: Superficie mq
      - name: irregularities
        type: textarea
        label: Difformità
      - name: abuses
        type: textarea
        label: Abusi
      - name: condo_arrears
        type: number
        label: Arretrati condominiali
      - name: charges
        type: textarea
        label: Oneri aggiudicatario
      - name: total_cost
        type: number
        label: Costo totale stimato
      - name: risk
        type: select
        label: Rischio
        options:
        - verde
        - giallo
        - rosso
      - name: summary
        type: textarea
        label: Sintesi
    - name: auction_docs
      ownedBy: shared
      searchable: true
      retentionDays: 365
      description: Pagine indicizzate dei documenti d'asta
      fields:
      - name: auction_id
        type: text
      - name: doc_type
        type: select
        options:
        - perizia
        - avviso
        - ordinanza
        - altro
      - name: page
        type: number
      - name: text
        type: textarea
    - name: favorites
      ownedBy: user
      description: Aste preferite dell'utente
      fields:
      - name: auction
        type: select
        required: true
        label: Asta
        optionsFrom: collection:auctions
      - name: note
        type: text
        label: Nota
    - name: matches
      ownedBy: instance
      retentionDays: 180
      description: Schede inviate per ogni ricerca salvata
  templates:
  - key: saved_search
    title: Ricerca salvata
    description: Ogni giorno controlla le nuove aste compatibili e ti scrive via email.
    agent: matcher
    params:
    - name: luoghi
      type: text
      required: true
      label: Comuni o province
    - name: tipologia
      type: select
      required: true
      label: Tipologia
      options:
      - appartamento
      - box
      - terreno
      - capannone
    - name: prezzo_max
      type: number
      required: true
      label: Prezzo base massimo (€)
    - name: occupazione
      type: select
      label: Occupazione desiderata
      options:
      - qualsiasi
      - libero
      - occupato_debitore
      - occupato_terzi
    goal: 'Ricerca "{instance}": luoghi {luoghi}, tipologia {tipologia}, prezzo base massimo {prezzo_max} euro, occupazione
      {?occupazione}{occupazione}{/occupazione}{!occupazione}qualsiasi{/occupazione}. Oggi è {date}. Scrivi in italiano.'
    schedule:
      cron: 0 7 * * *
      userCanChange: false
    maxPerUser: 10
    deliver:
      to: owner
      subject: LenteAste — nuove aste per la tua ricerca
      onlyIfNew: true
  triggers:
  - key: analyze_new
    description: Analizza ogni nuova asta appena raccolta
    'on':
      collection: auctions
      op: insert
      where:
        status: nuovo
    start:
      agent: extractor
    goal: 'Analizza l''asta con external_id {record.external_id}, URL {record.url}. PDF allegati: {record.doc_urls}.'
    asUser: false
  schedules:
  - agent: collector
    action: run
    cron: 0 4 * * *
    owner: app
  views:
  - key: home
    type: page
    nav: false
    title: LenteAste
    sections:
    - type: hero
      title: Compra all'asta **senza leggere cento pagine** di perizia
      text: 'Salva le tue ricerche: ogni giorno un agente controlla il Portale delle Vendite Pubbliche, legge perizie e allegati,
        stima il costo reale e ti manda una scheda con semaforo di rischio.'
      actions:
      - label: Inizia
        href: /login
        style: primary
      - label: Come funziona
        href: '#come-funziona'
        style: ghost
    - type: steps
      id: come-funziona
      title: Come funziona
      items:
      - title: Salva una ricerca
        text: Comuni o province, tipologia, prezzo base massimo, occupazione.
        badge: 🔎
      - title: L'agente legge i documenti
        text: 'Perizia, avviso di vendita e ordinanza: superficie, abusi, arretrati, occupazione, oneri.'
        badge: 📄
      - title: Ricevi la scheda
        text: Email con semaforo 🟢🟡🔴 e costo totale stimato.
        badge: ✉️
      - title: Chiedi ai documenti
        text: Chat sull'asta con citazione di documento e pagina.
        badge: 💬
    - type: cards
      id: prezzi
      title: Prezzi
      items:
      - title: Abbonamento mensile
        text: Ricerche salvate, avvisi email e crediti inclusi ogni mese.
      - title: A crediti
        text: Paghi solo ogni analisi approfondita e ogni domanda in chat.
    - type: note
      content: Supporto alla decisione, non consulenza legale, fiscale o immobiliare. Dati dal Portale delle Vendite Pubbliche,
        usati nel rispetto delle sue condizioni di riuso; verifica sempre i documenti ufficiali.
  - key: searches
    type: instances
    template: saved_search
    title: Le mie ricerche
    roles:
    - user
    - admin
  - key: auctions_list
    type: table
    title: Aste
    source: collection:auctions
    columns:
    - title
    - comune
    - tipo
    - base_price
    - occupazione
    - total_cost
    - risk
    - sale_date
    - url
    export: true
    roles:
    - user
    - admin
  - key: fav_add
    type: form
    title: Aggiungi ai preferiti
    collection: favorites
    submit:
      label: Salva
      message: Aggiunta ai preferiti
      redirect: favorites
    roles:
    - user
    - admin
  - key: favorites
    type: table
    title: I miei preferiti
    source: collection:favorites
    columns:
    - auction
    - note
    roles:
    - user
    - admin
  - key: new_deep
    type: new_run
    title: Analisi approfondita
    roles:
    - user
    - admin
  - key: reports
    type: history
    title: Le mie analisi
    source: run
    roles:
    - user
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: chat
    type: chat
    title: Chiedi ai documenti
    source: agent:advisor
    examples:
    - Ci sono abusi sanabili nell'asta ...?
    - Chi occupa l'immobile e con quale titolo?
    - Quali spese condominiali arretrate sono a carico dell'aggiudicatario?
    placeholder: Indica l'ID dell'asta e fai la tua domanda
    roles:
    - user
    - admin
  - key: account
    type: account
    title: Abbonamento e crediti
    roles:
    - user
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 20
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:deep:
        estimate: 30
        metered: true
      agent:advisor:
        estimate: 3
        metered: true
    packs:
    - key: small
      credits: 500
      price: 9
      label: 500 crediti
    - key: big
      credits: 2500
      price: 35
      label: 2500 crediti
    plans:
    - key: pro
      price: 29
      interval: month
      label: Pro mensile
      credits: 1500
      creditsReset: monthly
      includes:
      - ricerche salvate con avvisi email
      - 1500 crediti al mese per analisi e chat
  notifications:
    emailOnRunDone: true
  extensions:
  - key: pvp_reuse_terms
    description: Verificare e documentare le condizioni di riuso dei dati del Portale delle Vendite Pubbliche prima della
      pubblicazione; il collector è limitato a un passaggio giornaliero con richieste contenute.
