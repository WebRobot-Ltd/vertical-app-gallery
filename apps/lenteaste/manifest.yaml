apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: lenteaste
  displayName: LenteAste
  tagline:
    it: 'Le aste giudiziarie, lette per te: rischi e costo reale prima di offrire.'
    en: 'Court auctions, read for you: risks and real cost before you bid.'
  description:
    it: LenteAste monitora ogni giorno il Portale delle Vendite Pubbliche, legge perizie, avvisi di vendita e ordinanze, estrae
      superficie, abusi, occupazione e oneri, stima il costo totale reale e assegna un semaforo di rischio. Salvi le tue ricerche,
      vedi le aste compatibili e fai domande ai documenti con citazione della pagina.
    en: LenteAste monitors the Italian Public Sales Portal daily, reads appraisals, sale notices and court orders, extracts
      area, irregularities, occupancy and charges, estimates the real total cost and gives a risk traffic light.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1d2b3a'
      accent: '#b8862b'
      background: '#f7f5f0'
      foreground: '#1a1f26'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Lente
      color: primary
    - text: Aste
      color: accent
    width: wide
  header:
    links:
    - label: Come funziona
      href: '#come-funziona'
    - label: Il semaforo
      href: '#semaforo'
    - label: Prezzi
      href: '#prezzi'
    cta:
      label: Inizia
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  limits:
  - action: agent:deep_analyst
    per: user
    max: 10
    window: day
    roles:
    - user
  - action: chat
    per: user
    max: 60
    window: day
    roles:
    - user
  agents:
  - key: deep_analyst
    role: main
    description: 'Analisi approfondita di una singola asta: legge perizia e documenti già indicizzati e scrive il report completo.'
    profile:
      inline:
        display_name: LenteAste analista
        crews:
        - id: deep_analyst
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 20
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un analista di aste immobiliari giudiziarie italiane. Usi gli strumenti per leggere l''asta
            richiesta (collezione auctions), le pagine dei documenti (auction_pages: perizia, avviso di vendita, ordinanza)
            e l''eventuale scheda già estratta (auction_analysis). Scrivi il report in italiano. Inizia con un titolo di livello
            1 "# <Comune> — <tipologia> — lotto <n>". Sezioni ## : Semaforo di rischio (verde/giallo/rosso con motivazione
            in 2 righe), Dati chiave (tabella: prezzo base, offerta minima, superficie, tipologia, stato di occupazione, data
            vendita), Conformità urbanistica e catastale, Abusi e difformità (sanabilità e costi se indicati), Occupazione
            e tempi di liberazione, Spese condominiali arretrate e oneri a carico dell''aggiudicatario, Stima del costo totale
            reale (tabella con voci: prezzo, imposte, spese di regolarizzazione, arretrati, liberazione, ristrutturazione
            eventuale; indica chiaramente cosa è dato dal documento e cosa è una tua stima con le ipotesi), Cosa verificare
            prima di offrire. Dopo ogni dato estratto cita il documento e la pagina tra parentesi, es. (perizia, p. 14). Se
            un dato non è nei documenti scrivi ''non indicato'': non inventare mai cifre. Non è consulenza legale o finanziaria:
            ricordalo in una riga finale. Aggiungi un blocco ```chart di tipo stacked o bar con le voci del costo totale quando
            hai le cifre.'
    goalTemplate: 'Asta richiesta: {auction_ref}

      {?focus}Il cliente vuole approfondire: {focus}{/focus}

      Oggi è {date}. Scrivi in lingua {lang}.'
    appTools:
    - name: read_auctions
      description: Cerca nelle aste (dati comuni)
      action: search
      collection: auctions
      scope: all
    - name: read_pages
      description: Cerca nelle pagine dei documenti allegati
      action: search
      collection: auction_pages
      scope: all
    - name: read_analysis
      description: Cerca le schede estratte delle aste
      action: search
      collection: auction_analysis
      scope: all
    output: markdown
    limits:
      maxTurns: 20
      maxBudgetUsd: 1.0
  - key: collector
    role: scheduled
    description: Ogni giorno consulta il Portale delle Vendite Pubbliche, trova i nuovi annunci e ne scarica e indicizza i
      PDF.
    profile:
      inline:
        display_name: LenteAste collettore
        crews:
        - id: collector
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 60
          max_budget_usd: 3.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'Sei il collettore di LenteAste. Con il MCP WebRobot costruisci ed esegui una pipeline che consulta
            il Portale delle Vendite Pubbliche (pvp.giustizia.it) per i nuovi annunci di vendita immobiliare pubblicati dall''ultima
            esecuzione, rispettando le condizioni di riuso e i limiti di frequenza del portale (poche richieste, nessun accesso
            massivo, nessun aggiramento di protezioni, nessun dato personale di debitori o parti); se le condizioni non consentono
            l''operazione, fermati e dillo nel report. Per ogni annuncio nuovo (id portale non ancora presente, controlla
            con read_auctions) scrivi un record in auctions: portal_id, title, comune, provincia, property_type (appartamento|box|terreno|capannone|altro),
            base_price, min_offer, sale_date, court, occupancy_declared, url, published_at. Poi scarica i PDF allegati (perizia,
            avviso di vendita, ordinanza), estrai il testo pagina per pagina e aggiungi un record in auction_pages per ogni
            pagina: portal_id, doc_type, doc_name, page, text. Massimo 30 annunci per esecuzione. Chiudi con un breve report
            Markdown che inizia con "# Raccolta del <data>" e riporta numeri di annunci nuovi, documenti scaricati ed eventuali
            errori. Non inventare dati.'
    goalTemplate: Raccolta giornaliera del {date}. Cerca gli annunci nuovi dall'ultima esecuzione.
    appTools:
    - name: read_auctions
      description: Cerca nelle aste (dati comuni)
      action: search
      collection: auctions
      scope: all
    - name: write_auction
      description: Crea o aggiorna un'asta
      action: write
      collection: auctions
      scope: all
    - name: add_page
      description: Aggiunge una pagina di documento
      action: append
      collection: auction_pages
      scope: all
    output: markdown
    limits:
      maxTurns: 60
      maxBudgetUsd: 3.0
  - key: extractor
    role: scheduled
    description: Legge le perizie delle aste nuove ed estrae i dati, il costo totale stimato e il semaforo.
    profile:
      inline:
        display_name: LenteAste estrattore
        crews:
        - id: extractor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 60
          max_budget_usd: 3.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''estrattore di LenteAste. Per ogni asta in auctions che non ha ancora una scheda in auction_analysis
            (massimo 30 per esecuzione) leggi le sue pagine in auction_pages e scrivi con write_analysis un record con: portal_id,
            surface_sqm, urban_irregularities, abuses, condo_arrears, occupancy (libero|occupato dal debitore|occupato con
            titolo|non indicato), buyer_charges, estimated_total_cost (numero in euro, solo se desumibile; stima prudente
            con ipotesi nel campo cost_assumptions), risk_level (verde|giallo|rosso), risk_reasons, citations (elenco ''dato:
            documento, pagina''). Semaforo: rosso se occupazione con titolo opponibile, abusi non sanabili o arretrati/oneri
            rilevanti rispetto al prezzo; giallo se ci sono difformità sanabili, occupazione del debitore o dati mancanti
            importanti; verde altrimenti. Non inventare: se un dato manca scrivi ''non indicato''. Chiudi con un report Markdown
            che inizia con "# Estrazione del <data>" con il numero di schede create.'
    goalTemplate: Estrazione giornaliera del {date}. Elabora le aste senza scheda.
    appTools:
    - name: read_auctions
      description: Cerca nelle aste (dati comuni)
      action: search
      collection: auctions
      scope: all
    - name: read_pages
      description: Cerca nelle pagine dei documenti allegati
      action: search
      collection: auction_pages
      scope: all
    - name: read_analysis
      description: Cerca le schede estratte delle aste
      action: search
      collection: auction_analysis
      scope: all
    - name: write_analysis
      description: Scrive la scheda di un'asta
      action: write
      collection: auction_analysis
      scope: all
    output: markdown
    limits:
      maxTurns: 60
      maxBudgetUsd: 3.0
  - key: matcher
    role: helper
    description: Ogni giorno, per una ricerca salvata, elenca le nuove aste compatibili con scheda e semaforo.
    memory: instance
    writesTo:
      collection: search_matches
      parse: whole
    profile:
      inline:
        display_name: LenteAste cercatore
        crews:
        - id: matcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Controlli una ricerca salvata di un utente. Con gli strumenti cerca nelle aste (auctions) e nelle
            schede (auction_analysis) quelle che rispettano comuni/province, tipologia, prezzo base massimo e stato di occupazione
            desiderato. La tua memoria contiene gli id portale già segnalati: escludili e, alla fine, chiama remember una
            volta con l''elenco aggiornato. Scrivi un report che inizia con "# <nome ricerca> — <data>" e per ogni nuova asta
            compatibile una voce ## con: semaforo (🟢🟡🔴), comune, tipologia, prezzo base, superficie, occupazione, costo totale
            stimato, 2 righe di motivi e il portal_id. Se non ci sono novità scrivi una sola riga: ''Nessuna nuova asta compatibile''.
            Non inventare dati.'
    goalTemplate: Controlla la ricerca salvata descritta nel compito. Oggi è {date}. Scrivi in lingua {lang}.
    appTools:
    - name: read_auctions
      description: Cerca nelle aste (dati comuni)
      action: search
      collection: auctions
      scope: all
    - name: read_analysis
      description: Cerca le schede estratte delle aste
      action: search
      collection: auction_analysis
      scope: all
    output: markdown
    limits:
      maxTurns: 15
      maxBudgetUsd: 0.5
  - key: doc_chat
    role: helper
    description: Risponde alle domande sui documenti di una singola asta citando la pagina.
    profile:
      inline:
        display_name: LenteAste chat documenti
        chat_mode: true
        crews:
        - id: doc_chat
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Rispondi a domande su UNA asta giudiziaria, usando solo le pagine dei suoi documenti (cerca con
            read_pages filtrando per portal_id) e la sua scheda (read_analysis). Ogni affermazione di fatto termina con la
            citazione (documento, pagina). Se la risposta non è nei documenti, dillo chiaramente senza supporre. Risposte
            brevi, in italiano semplice. Non dai consulenza legale: per decisioni di offerta rimandi a un professionista.'
    goalTemplate: 'Pagina/asta: {page}

      Conversazione finora:

      {history}

      Nuova domanda: {message}'
    appTools:
    - name: read_pages
      description: Cerca nelle pagine dei documenti allegati
      action: search
      collection: auction_pages
      scope: all
    - name: read_analysis
      description: Cerca le schede estratte delle aste
      action: search
      collection: auction_analysis
      scope: all
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.4
  inputForm:
    title: Analisi approfondita
    fields:
    - name: auction_ref
      type: text
      required: true
      label: Asta (id portale o link all'annuncio)
      help: Copia l'id dalla scheda dell'asta
    - name: focus
      type: textarea
      maxLength: 500
      label: Cosa vuoi approfondire (facoltativo)
  data:
    collections:
    - name: auctions
      ownedBy: app
      searchable: true
      description: Annunci dal Portale Vendite Pubbliche (comuni a tutti)
      fields:
      - name: portal_id
        type: text
      - name: title
        type: text
      - name: comune
        type: text
      - name: provincia
        type: text
      - name: property_type
        type: text
      - name: base_price
        type: number
      - name: min_offer
        type: number
      - name: sale_date
        type: date
      - name: court
        type: text
      - name: occupancy_declared
        type: text
      - name: url
        type: url
      - name: published_at
        type: date
    - name: auction_pages
      ownedBy: app
      searchable: true
      description: Testo dei PDF allegati, pagina per pagina
      fields:
      - name: portal_id
        type: text
      - name: doc_type
        type: text
      - name: doc_name
        type: text
      - name: page
        type: number
      - name: text
        type: textarea
    - name: auction_analysis
      ownedBy: app
      searchable: true
      description: Scheda sintetica estratta dalla perizia
      fields:
      - name: portal_id
        type: text
      - name: surface_sqm
        type: number
      - name: urban_irregularities
        type: textarea
      - name: abuses
        type: textarea
      - name: condo_arrears
        type: text
      - name: occupancy
        type: text
      - name: buyer_charges
        type: textarea
      - name: estimated_total_cost
        type: number
      - name: cost_assumptions
        type: textarea
      - name: risk_level
        type: text
      - name: risk_reasons
        type: textarea
      - name: citations
        type: textarea
    - name: favorites
      ownedBy: user
      description: Aste preferite dell'utente
      fields:
      - name: portal_id
        type: text
      - name: title
        type: text
      - name: note
        type: textarea
    - name: search_matches
      ownedBy: instance
      description: Aste compatibili trovate ogni giorno per una ricerca salvata
  templates:
  - key: saved_search
    title: Ricerca salvata
    description: Ogni giorno controlla le nuove aste compatibili con i tuoi criteri.
    agent: matcher
    params:
    - name: places
      type: text
      required: true
      label: Comuni o province
      help: es. Bologna, Modena, provincia di Padova
    - name: property_type
      type: select
      required: true
      label: Tipologia
      options:
      - value: appartamento
        label: Appartamento
      - value: box
        label: Box
      - value: terreno
        label: Terreno
      - value: capannone
        label: Capannone
    - name: max_base_price
      type: number
      required: true
      label: Prezzo base massimo (€)
    - name: occupancy
      type: select
      label: Stato di occupazione
      options:
      - value: qualsiasi
        label: Qualsiasi
      - value: libero
        label: Solo libero
      - value: occupato
        label: Anche occupato
    goal: 'Ricerca "{instance}": zone {places}; tipologia {property_type}; prezzo base massimo {max_base_price} €; occupazione
      {occupancy}. Oggi è {date}. Scrivi in lingua {lang}.'
    schedule:
      cron: 0 8 * * *
      userCanChange: false
    maxPerUser: 5
    cost:
      perRun: 1
  schedules:
  - agent: collector
    action: run
    cron: 0 4 * * *
    owner: app
  - agent: extractor
    action: run
    cron: 0 6 * * *
    owner: app
  views:
  - key: home
    type: page
    nav: false
    title: LenteAste
    sections:
    - type: hero
      band: true
      eyebrow: Aste giudiziarie immobiliari
      title: Compra all'asta senza leggere **cento pagine di perizia**.
      text: Ogni giorno LenteAste legge gli annunci del Portale delle Vendite Pubbliche e i documenti allegati, estrae abusi,
        occupazione e oneri, stima il costo reale e ti dà un semaforo di rischio.
      actions:
      - label: Crea la tua prima ricerca
        href: /login
        style: primary
      - label: Come funziona
        href: '#come-funziona'
        style: ghost
    - type: steps
      id: come-funziona
      title: Come funziona
      items:
      - title: Salvi una ricerca
        text: Comuni o province, tipologia, prezzo base massimo e occupazione desiderata.
        badge: 🔎
      - title: Gli agenti leggono per te
        text: Annunci, perizie, avvisi di vendita e ordinanze vengono scaricati, indicizzati e analizzati ogni giorno.
        badge: 📄
      - title: Scheda e semaforo
        text: Vedi le aste compatibili con costo totale stimato e rischio, e fai domande ai documenti con citazione della
          pagina.
        badge: 🚦
    - type: cards
      id: semaforo
      title: Il semaforo di rischio
      items:
      - title: Verde
        text: Documenti coerenti, nessun abuso rilevante, immobile libero o tempi chiari.
        badge: 🟢
      - title: Giallo
        text: Difformità sanabili, occupazione del debitore o dati importanti mancanti.
        badge: 🟡
      - title: Rosso
        text: Occupazione opponibile, abusi non sanabili o oneri molto alti rispetto al prezzo.
        badge: 🔴
    - type: cards
      id: prezzi
      title: Prezzi
      items:
      - title: Abbonamento mensile
        text: Ricerche salvate, schede di tutte le aste e chat sui documenti. 29 €/mese.
      - title: A crediti
        text: Paghi solo le analisi approfondite che richiedi, in base all'uso reale.
    - type: note
      content: Supporto alla decisione, non consulenza legale, tecnica o finanziaria. Le stime di costo si basano sui documenti
        pubblicati e vanno verificate da un professionista prima di offrire. Dati dal Portale delle Vendite Pubbliche, nel
        rispetto delle sue condizioni di riuso.
  - key: searches
    type: instances
    template: saved_search
    title: Le mie ricerche
    roles:
    - user
    - admin
  - key: matches
    type: table
    title: Aste compatibili
    source: collection:search_matches
    roles:
    - user
    - admin
  - key: auctions_list
    type: table
    title: Tutte le aste
    source: collection:auction_analysis
    roles:
    - user
    - admin
    data:
      display: table
      fields:
      - key: portal_id
        label: Id
      - key: risk_level
        label: Semaforo
        format: badge
      - key: surface_sqm
        label: m²
        format: number
      - key: occupancy
        label: Occupazione
      - key: estimated_total_cost
        label: Costo totale stimato
        format: money
      sort:
        field: estimated_total_cost
        dir: asc
      limit: 100
      empty: Nessuna scheda disponibile.
  - key: favorites_list
    type: cards
    title: Preferiti
    source: collection:favorites
    roles:
    - user
    - admin
  - key: chat
    type: chat
    title: Chiedi ai documenti
    source: agent:doc_chat
    placeholder: Es. Ci sono abusi? Chi occupa l'immobile? (indica l'id asta)
    examples:
    - Ci sono difformità urbanistiche e sono sanabili?
    - Chi occupa l'immobile e con quale titolo?
    - Quali spese condominiali arretrate sono a carico mio?
    roles:
    - user
    - admin
  - key: new
    type: new_run
    title: Analisi approfondita
    roles:
    - user
    - admin
  - key: analyses
    type: history
    title: Le mie analisi
    source: run
    roles:
    - user
    - admin
  - key: analysis
    type: report
    source: run
    printable: true
    nav: false
  - key: account
    type: account
    title: Abbonamento e crediti
    roles:
    - user
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 30
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:deep_analyst:
        estimate: 10
        metered: true
      chat: 1
    packs:
    - key: small
      credits: 500
      price: 9
      label: 500 crediti
    - key: large
      credits: 2500
      price: 39
      label: 2500 crediti
    plans:
    - key: monthly
      price: 29
      interval: month
      label: LenteAste mensile
      credits: 1000
      creditsReset: monthly
      includes:
      - ricerche salvate
      - schede di tutte le aste
      - chat sui documenti
  extensions:
  - key: email_alerts
    description: 'Le email con scheda e semaforo quando compare un''asta compatibile non sono ancora disponibili: per ora
      le aste compatibili compaiono nella vista ''Aste compatibili'' aggiornata ogni mattina.'
  - key: pvp_terms
    description: Prima della pubblicazione verificare le condizioni di riuso del Portale delle Vendite Pubbliche e se esiste
      un'API ufficiale; il collettore lavora con pochi accessi e si ferma se non consentito.
  - key: favorites_button
    description: 'Il pulsante ''aggiungi ai preferiti'' sulla scheda non è espresso dal manifest: i preferiti si salvano per
      ora tramite la collezione favorites.'
