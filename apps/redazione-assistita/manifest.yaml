apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: bozzarapida
  displayName: BozzaRapida
  tagline:
    it: Dalle fonti all'articolo da approvare, in redazione.
  description:
    it: Un agente controlla ogni ora le fonti della testata e propone gli argomenti del giorno; un secondo agente scrive la
      bozza con i passaggi da verificare, un terzo propone i post social. Il caporedattore approva, modifica o rimanda indietro;
      nulla viene pubblicato in automatico.
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f2a44'
      accent: '#c8372d'
      background: '#f8f6f1'
      foreground: '#1b1f24'
    fonts:
      body: Inter
      display: Merriweather
    wordmark:
    - text: Bozza
      color: primary
    - text: Rapida
      color: accent
  header:
    links:
    - label:
        it: Come funziona
      href: '#come-funziona'
    cta:
      label:
        it: Accedi
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label:
        it: Caporedattore
      assignedBy: admin_emails
    - key: user
      label:
        it: Redattore
      assignedBy: signup
    - key: desk
      label:
        it: Desk web
      assignedBy: invite
  limits:
  - action: run
    per: user
    max: 20
    window: day
    roles:
    - user
  agents:
  - key: scanner
    role: scheduled
    description: Ogni ora controlla le fonti, raggruppa le notizie sullo stesso fatto e propone gli argomenti del giorno.
    profile:
      inline:
        display_name: BozzaRapida – Scanner
        crews:
        - id: scanner
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'Sei il redattore di desk di una testata locale italiana. Con lo strumento read_sources leggi le
            fonti configurate dalla redazione (feed RSS, comunicati di enti, comuni, questure e aziende, siti istituzionali,
            lanci d''agenzia). Salta le fonti non attive e salta le fonti di tipo agenzia a meno che siano contrassegnate
            come abbonamento attivo. Per leggere feed e pagine usa il MCP webrobot (scraping di pagine web), non inventare
            mai contenuti. Raggruppa le notizie che riguardano lo stesso fatto, valuta la rilevanza per il territorio della
            testata (alta, media, bassa) e proponi l''elenco degli argomenti del giorno, dal più rilevante. Formato: un titolo
            di primo livello "# Argomenti del giorno — <data e ora>", poi per ogni argomento una sezione "## <titolo proposto>"
            con: rilevanza e motivo in una riga, sintesi di 2-3 righe, elenco delle fonti con link e orario di pubblicazione,
            eventuali dubbi. Massimo 12 argomenti. Ignora quanto già trattato nelle ultime ore se non ci sono novità. Non
            inventare dati, nomi o citazioni.'
    appTools:
    - name: read_sources
      description: Legge le fonti configurate dalla redazione
      action: read
      collection: sources
      scope: all
    goalTemplate: 'Controlla le fonti attive e proponi gli argomenti del giorno. Data e ora: {date}. Scrivi in italiano.'
    output: markdown
    writesTo:
      collection: topics
      parse: whole
    limits:
      maxTurns: 30
      maxBudgetUsd: 1.0
  - key: writer
    role: main
    description: Scrive titolo, sommario e testo con fonti e passaggi da verificare, poi chiede l'approvazione del caporedattore.
    profile:
      inline:
        display_name: BozzaRapida – Redattore
        crews:
        - id: writer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 20
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'Sei un giornalista di una testata locale italiana. Scrivi la bozza di un articolo sull''argomento
            indicato, con il taglio, la lunghezza e il tono richiesti. Puoi rileggere le fonti citate con il MCP webrobot.
            Usa solo fatti presenti nelle fonti: mai inventare cifre, nomi, date o citazioni. Struttura: "# <Titolo>" (primo
            livello), poi "**Sommario:** ...", poi il testo dell''articolo, poi "## Fonti usate" con elenco e link, poi "##
            Passaggi da verificare" con ogni dato dubbio o non confermato da almeno due fonti; nel testo evidenzia gli stessi
            passaggi con ⚠️ **DA VERIFICARE**. Poi chiedi il contributo dell''agente social con ask_social (passagli titolo,
            sommario e punti chiave) e inserisci i suoi post in una sezione "## Post per i social". Alla fine chiama request_editor_review
            con title e text (articolo completo con sommario). Non pubblicare mai nulla: decide il caporedattore. Se ricevi
            un commento di rinvio, riscrivi tenendone conto.'
    delegates:
    - social
    awaits:
    - editor_review
    goalTemplate: 'Argomento e fonti:

      {topic}

      {?angle}Taglio: {angle}

      {/angle}Lunghezza: {length_label}

      Tono: {tone_label}

      {?notes}Note del redattore: {notes}

      {/notes}Autore: {user}. Data: {date}. Scrivi in italiano.'
    output: markdown
    writesTo:
      collection: drafts
      parse: whole
    limits:
      maxTurns: 20
      maxBudgetUsd: 1.0
  - key: social
    role: helper
    description: Propone post brevi per i social a partire dalla bozza.
    profile:
      inline:
        display_name: BozzaRapida – Social
        crews:
        - id: social
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 4
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei il social media editor di una testata locale italiana. Dati titolo, sommario e punti chiave
            di un articolo, proponi 3 post brevi in italiano: uno per Facebook (max 280 caratteri), uno per X (max 240 caratteri),
            uno per Instagram (didascalia con 3-5 hashtag). Tono sobrio e informativo, niente clickbait, nessun fatto che
            non sia nel materiale ricevuto. Non pubblichi nulla: restituisci solo le proposte.'
  inputForm:
    title:
      it: Nuova bozza
    fields:
    - name: topic
      type: textarea
      required: true
      maxLength: 4000
      label:
        it: Argomento scelto (incolla titolo e fonti dall'elenco)
    - name: angle
      type: text
      maxLength: 300
      label:
        it: Taglio
      help:
        it: es. impatto sui residenti, cronaca, approfondimento economico
    - name: length
      type: select
      required: true
      label:
        it: Lunghezza
      default: medio
      options:
      - value: breve
        label:
          it: Breve (circa 1.500 battute)
      - value: medio
        label:
          it: Medio (circa 3.500 battute)
      - value: lungo
        label:
          it: Lungo (circa 7.000 battute)
    - name: tone
      type: select
      required: true
      label:
        it: Tono
      default: neutro
      options:
      - value: neutro
        label:
          it: Neutro, di cronaca
      - value: divulgativo
        label:
          it: Divulgativo
      - value: istituzionale
        label:
          it: Istituzionale
      - value: vivace
        label:
          it: Vivace
    - name: notes
      type: textarea
      maxLength: 600
      label:
        it: Note (facoltative)
  approvals:
  - key: editor_review
    title:
      it: Revisione del caporedattore
    description: Il caporedattore approva, modifica o rimanda indietro la bozza con un commento.
    role: admin
    decidedBy: role
    fields:
    - title
    - text
  triggers:
  - key: to_desk
    description: 'Pezzo approvato: il testo arriva al desk web.'
    'on':
      approval: editor_review
      decision: approved
    notify:
      to: role:desk
      subject:
        it: 'Pezzo approvato: {record.title}'
      body:
        it: 'Il caporedattore ha approvato il pezzo seguente, pronto per la pubblicazione.


          {record.title}


          {record.text}'
      link: drafts
  data:
    collections:
    - name: sources
      ownedBy: org
      description: Fonti seguite dalla redazione (configurate dal caporedattore)
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome
      - name: url
        type: url
        required: true
        label:
          it: Indirizzo del feed o del sito
      - name: kind
        type: select
        required: true
        label:
          it: Tipo
        options:
        - value: rss_ente
          label:
            it: Feed RSS ente pubblico
        - value: comunicati
          label:
            it: Comunicati (comune, questura, azienda)
        - value: istituzionale
          label:
            it: Sito istituzionale
        - value: agenzia
          label:
            it: Lanci d'agenzia (solo con abbonamento)
      - name: active
        type: boolean
        default: true
        label:
          it: Attiva
      - name: notes
        type: textarea
        label:
          it: Note
    - name: topics
      ownedBy: app
      retentionDays: 14
      description: Argomenti del giorno proposti dall'agente ogni ora
      fields:
      - name: title
        type: text
      - name: content
        type: textarea
    - name: drafts
      ownedBy: user
      description: 'Bozze: ogni redattore vede le sue, il caporedattore tutte'
      fields:
      - name: title
        type: text
      - name: content
        type: textarea
      - name: status
        type: text
  schedules:
  - agent: scanner
    cron: 0 * * * *
    action: run
    owner: app
    goal: Controlla le fonti attive e proponi gli argomenti del giorno. Scrivi in italiano.
  views:
  - key: home
    type: page
    nav: false
    sections:
    - type: hero
      title:
        it: Dalle fonti alla **bozza**, in pochi minuti.
      text:
        it: 'BozzaRapida controlla ogni ora le fonti della testata, propone gli argomenti del giorno e prepara la bozza con
          le fonti e i passaggi da verificare. Il caporedattore decide: nulla viene pubblicato in automatico.'
      actions:
      - label:
          it: Accedi
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
      items:
      - title:
          it: Fonti
        text:
          it: Feed RSS, comunicati e siti istituzionali; le agenzie solo con abbonamento.
        badge: 📰
      - title:
          it: Argomenti del giorno
        text:
          it: Notizie sullo stesso fatto raggruppate e valutate per rilevanza sul territorio.
        badge: 🗂️
      - title:
          it: Bozza e social
        text:
          it: Titolo, sommario, testo, fonti, passaggi da verificare e post social.
        badge: ✍️
      - title:
          it: Approvazione
        text:
          it: Il caporedattore modifica, approva o rimanda indietro; poi il testo va al desk web.
        badge: ✅
    - type: note
      content:
        it: Le bozze sono generate da AI e vanno sempre verificate dalla redazione.
  - key: topics_list
    type: list
    title:
      it: Argomenti del giorno
    source: collection:topics
    data:
      display: cards
      fields:
      - key: title
        label:
          it: Titolo
      - key: content
        label:
          it: Argomenti
      sort:
        field: created_at
        dir: desc
      limit: 5
      empty:
        it: 'Nessun elenco ancora: il primo controllo parte all''ora piena.'
    roles:
    - user
    - admin
  - key: new_draft
    type: new_run
    title:
      it: Nuova bozza
    roles:
    - user
    - admin
  - key: drafts
    type: table
    title:
      it: Bozze
    source: collection:drafts
    columns:
    - title
    - status
    export: true
    roles:
    - user
    - admin
    - desk
  - key: my_runs
    type: history
    title:
      it: Le mie richieste
    source: run
    roles:
    - user
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: review
    type: approvals
    title:
      it: Da approvare
    approvals:
    - editor_review
    roles:
    - admin
  - key: sources_list
    type: table
    title:
      it: Fonti
    source: collection:sources
    columns:
    - name
    - kind
    - active
    - url
    roles:
    - admin
  - key: source_add
    type: form
    title:
      it: Aggiungi fonte
    collection: sources
    submit:
      label:
        it: Salva fonte
      message:
        it: Fonte salvata.
      redirect: sources_list
    roles:
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
    roles:
    - admin
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: redazione_s
      price: 79
      interval: month
      label:
        it: Redazione S — fino a 3 redattori
      includes:
      - fino a 3 redattori
      - controllo orario delle fonti
      - bozze e post social
      roles:
      - admin
    - key: redazione_m
      price: 199
      interval: month
      label:
        it: Redazione M — fino a 8 redattori
      includes:
      - fino a 8 redattori
      - controllo orario delle fonti
      - bozze e post social
      roles:
      - admin
    - key: redazione_l
      price: 399
      interval: month
      label:
        it: Redazione L — fino a 20 redattori
      includes:
      - fino a 20 redattori
      - controllo orario delle fonti
      - bozze e post social
      roles:
      - admin
  extensions:
  - key: seat_limit
    description: 'Il numero massimo di redattori per piano (3, 8, 20) non è applicabile automaticamente dal manifest: va verificato
      dal caporedattore tra gli utenti.'
  - key: source_edit_by_editors
    description: Le fonti sono configurate dal caporedattore (dati riservati alla redazione); la configurazione da parte di
      ogni redattore richiederebbe un modello dati condiviso non ancora disponibile per l'agente orario.
