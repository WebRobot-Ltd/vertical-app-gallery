apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: fitslot
  displayName: FitSlot
  tagline:
    it: Prenota uno spazio fitness e paghi solo il tempo che usi.
    en: Book a fitness space and pay only for the time you use.
  description:
    it: 'Piattaforma software per la prenotazione pay per use di palestre e spazi fitness: cerca per orario, zona e attività,
      prenota uno slot, paga con carta e ricevi un codice di accesso. Gli spazi fisici sono un servizio a parte.'
    en: 'Software platform for pay-per-use booking of gyms and fitness spaces: search by time, area and activity, book a slot,
      pay by card and get an access code. The physical spaces are a separate service.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12343b'
      accent: '#f26b38'
      background: '#f7f9f8'
      foreground: '#16222a'
    fonts:
      body: Inter
      display: Poppins
    wordmark:
    - text: Fit
      color: primary
    - text: Slot
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#how'
    - label:
        it: Per i gestori
        en: For managers
      href: '#managers'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
      - spaces
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: manager
      label:
        it: Gestore
        en: Manager
      assignedBy: derived
      from: collection:spaces.manager_email
    - key: user
      label:
        it: Utente
        en: User
      assignedBy: signup
  limits:
  - action: agent:advisor
    per: user
    max: 10
    window: day
  agents:
  - key: advisor
    role: main
    description: Suggests the best-fitting spaces from the user's preferences and usual times, using the published catalogue
      and the user's own past bookings.
    profile:
      inline:
        display_name: FitSlot advisor
        crews:
        - id: advisor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the FitSlot advisor. You recommend fitness spaces to book pay per use. Use the tool read_spaces
            (published spaces: name, area, activities, opening hours, capacity, price per session, extraordinary openings)
            and read_my_bookings (the user''s own past bookings) to learn their usual days and times. Never invent spaces,
            prices or availability: only what the tools return. Start with a level-1 title "# Spazi consigliati — <activity>"
            (or "# Recommended spaces — <activity>" in English). Then: ## Top picks (up to 3, each with area, price per session,
            best slot matching their habits and why), ## Other options (a small table), ## Your habits (what you noticed from
            past bookings, if any), ## Next step (tell the user to open the space and book a slot; payment is by card on booking).
            Under 350 words. If nothing matches, say so and suggest relaxing the criteria. Write in the requested language.'
    goalTemplate: 'Activity: {activity_label}

      {?area}Area: {area}{/area}

      {?day_time}Preferred days and times: {day_time}{/day_time}

      {?max_price}Max price per session: {max_price} EUR{/max_price}

      {?notes}Notes: {notes}{/notes}

      Today is {date}. Write in the language with ISO code {lang}.'
    appTools:
    - name: read_spaces
      description: Read the published fitness spaces
      action: read
      collection: spaces
      scope: all
    - name: read_my_bookings
      description: Read the current user's own bookings
      action: read
      collection: bookings
      scope: user
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.4
  - key: reporter
    role: helper
    description: Periodic usage and revenue summary for one space of one manager.
    writesTo:
      collection: space_reports
    profile:
      inline:
        display_name: FitSlot reporter
        crews:
        - id: reporter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write the weekly usage and revenue report for one fitness space. Use read_space_stats (per-space
            aggregate of bookings, occupancy by time band and revenue) filtered to the given space. Start with "# <Space>
            — week of <date>". Sections: ## Bookings and revenue, ## Occupancy by time band (add a ```chart block, type bar,
            with real figures only), ## Quiet and peak slots, ## Suggestions (pricing or extraordinary openings). Under 300
            words. Never invent figures: if data is missing, say so.'
    appTools:
    - name: read_space_stats
      description: Aggregated bookings, occupancy and revenue per space
      action: read
      collection: space_stats
      scope: all
    output: markdown
  templates:
  - key: space_report
    title:
      it: Report del mio spazio
      en: My space report
    description:
      it: Un report settimanale su utilizzo, saturazione e incassi del tuo spazio.
      en: A weekly report on usage, occupancy and revenue of your space.
    agent: reporter
    params:
    - name: space
      type: text
      required: true
      label:
        it: Nome dello spazio
        en: Space name
    goal: Write this week's report for the space "{space}". Today is {date}. Write in the language with ISO code {lang}.
    schedule:
      cron: 0 7 * * 1
      userCanChange: false
    maxPerUser: 5
    roles:
    - manager
    - admin
    cost:
      perRun: 5
  inputForm:
    title:
      it: Trova il tuo spazio
      en: Find your space
    fields:
    - name: activity
      type: select
      required: true
      label:
        it: Attività
        en: Activity
      options:
      - value: gym
        label:
          it: Palestra / pesi
          en: Gym / weights
      - value: yoga
        label: Yoga / pilates
      - value: crossfit
        label: CrossFit / functional
      - value: boxing
        label:
          it: Boxe / arti marziali
          en: Boxing / martial arts
      - value: pool
        label:
          it: Piscina
          en: Pool
      - value: studio
        label:
          it: Sala libera
          en: Open studio
    - name: area
      type: text
      label:
        it: Zona
        en: Area
    - name: day_time
      type: text
      label:
        it: Giorni e orari abituali
        en: Usual days and times
      help:
        it: es. lun-ven dopo le 18
        en: e.g. Mon-Fri after 6pm
    - name: max_price
      type: number
      label:
        it: Prezzo massimo a sessione (€)
        en: Max price per session (€)
    - name: notes
      type: textarea
      maxLength: 400
      label:
        it: Note (facoltative)
        en: Notes (optional)
  data:
    collections:
    - name: spaces
      ownedBy: shared
      description: 'Spaces published by managers: hours, capacity, price per session, extraordinary openings'
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome
          en: Name
      - name: area
        type: text
        label:
          it: Zona
          en: Area
      - name: activity
        type: text
        label:
          it: Attività
          en: Activity
      - name: opening_hours
        type: textarea
        label:
          it: Orari
          en: Hours
      - name: capacity
        type: number
        label:
          it: Capienza
          en: Capacity
      - name: price_per_session
        type: number
        label:
          it: Prezzo a sessione (€)
          en: Price per session (€)
      - name: extra_openings
        type: textarea
        label:
          it: Aperture straordinarie
          en: Extraordinary openings
      - name: manager_email
        type: email
        required: true
        label: Manager
    - name: bookings
      ownedBy: user
      description: 'A user''s bookings: space, slot, duration, price paid, access code, status'
      fields:
      - name: space
        type: relation
        relation: spaces
        label:
          it: Spazio
          en: Space
      - name: slot_start
        type: date
        label:
          it: Inizio
          en: Start
      - name: minutes
        type: number
        label:
          it: Minuti
          en: Minutes
      - name: price
        type: number
        label:
          it: Importo (€)
          en: Amount (€)
      - name: access_code
        type: text
        label:
          it: Codice accesso
          en: Access code
      - name: status
        type: text
        label:
          it: Stato
          en: Status
    - name: space_stats
      ownedBy: shared
      description: 'Aggregates per space and time band: bookings, occupancy, revenue'
      fields:
      - name: space
        type: text
      - name: band
        type: text
      - name: bookings
        type: number
      - name: occupancy_pct
        type: number
      - name: revenue
        type: number
    - name: space_reports
      ownedBy: instance
      description: Weekly reports of each space
  views:
  - key: home
    type: page
    title: FitSlot
    nav: false
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow:
        it: Pay per use
        en: Pay per use
      title:
        it: Prenota uno spazio fitness. Paghi solo **il tempo che usi**.
        en: Book a fitness space. Pay only **for the time you use**.
      text:
        it: Cerca per orario, zona e attività, scegli uno slot, paga con carta e ricevi il codice di accesso. Un agente ti
          suggerisce gli spazi più adatti alle tue abitudini.
        en: Search by time, area and activity, pick a slot, pay by card and get your access code. An agent suggests the spaces
          that best fit your habits.
      actions:
      - label:
          it: Trova uno spazio
          en: Find a space
        href: /v/new_search
        style: primary
      - label:
          it: Vedi gli spazi
          en: Browse spaces
        href: /v/spaces
        style: ghost
      aside: <div style="padding:16px"><b>Yoga Studio Navigli</b><br>Milano · 18:00–19:00<br>€9 / sessione<br><i>QR di accesso
        incluso</i></div>
    - type: steps
      id: how
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Cerca
          en: Search
        text:
          it: Filtra per orario, zona e tipo di attività e vedi disponibilità e prezzo a sessione.
          en: Filter by time, area and activity and see availability and price per session.
        badge: 🔎
      - title:
          it: Prenota e paga
          en: Book and pay
        text:
          it: Scegli lo slot e paga online con carta solo per il tempo usato.
          en: Pick the slot and pay online by card only for the time used.
        badge: 💳
      - title:
          it: Entra
          en: Get in
        text:
          it: Ricevi un codice o un QR per l'accesso allo spazio.
          en: Receive a code or QR to access the space.
        badge: 📱
    - type: cards
      id: managers
      title:
        it: Per i gestori
        en: For managers
      items:
      - title:
          it: Pubblica
          en: Publish
        text:
          it: Orari, capienza, prezzi e aperture straordinarie.
          en: Hours, capacity, prices and extraordinary openings.
      - title:
          it: Monitora
          en: Monitor
        text:
          it: Prenotazioni, saturazione delle fasce e incassi.
          en: Bookings, occupancy by time band and revenue.
      - title:
          it: Commissione
          en: Commission
        text:
          it: 'Nessun canone: la piattaforma trattiene una commissione sulle prenotazioni.'
          en: 'No fee to join: the platform keeps a commission on bookings.'
    - type: note
      content:
        it: FitSlot è lo strato software di prenotazione; gli spazi fisici e le attrezzature sono un servizio a parte.
        en: FitSlot is the booking software layer; physical spaces and equipment are a separate service.
  - key: spaces
    type: cards
    title:
      it: Spazi
      en: Spaces
    source: collection:spaces
    data:
      display: cards
      fields:
      - key: name
        label:
          it: Nome
          en: Name
      - key: area
        label:
          it: Zona
          en: Area
      - key: activity
        label:
          it: Attività
          en: Activity
        format: badge
      - key: price_per_session
        label:
          it: € / sessione
          en: € / session
        format: money
      - key: capacity
        label:
          it: Capienza
          en: Capacity
        format: number
      - key: opening_hours
        label:
          it: Orari
          en: Hours
      sort:
        field: name
        dir: asc
      limit: 60
      empty:
        it: Nessuno spazio pubblicato.
        en: No spaces published yet.
  - key: new_search
    type: new_run
    title:
      it: Consigliami
      en: Suggest for me
    roles:
    - user
    - manager
    - admin
  - key: suggestions
    type: history
    title:
      it: I miei consigli
      en: My suggestions
    source: run
    roles:
    - user
    - manager
    - admin
  - key: suggestion
    type: report
    source: run
    printable: true
    nav: false
  - key: my_bookings
    type: table
    title:
      it: Le mie prenotazioni
      en: My bookings
    source: collection:bookings
    data:
      display: table
      fields:
      - key: space
        label:
          it: Spazio
          en: Space
      - key: slot_start
        label:
          it: Inizio
          en: Start
        format: date
      - key: minutes
        label:
          it: Minuti
          en: Minutes
        format: number
      - key: price
        label:
          it: Importo
          en: Amount
        format: money
      - key: access_code
        label:
          it: Codice
          en: Code
      - key: status
        label:
          it: Stato
          en: Status
        format: badge
      sort:
        field: slot_start
        dir: desc
      limit: 100
    roles:
    - user
    - manager
    - admin
  - key: manager_spaces
    type: table
    title:
      it: I miei spazi
      en: My spaces
    source: collection:spaces
    data:
      display: table
      fields:
      - key: name
      - key: area
      - key: capacity
        format: number
      - key: price_per_session
        format: money
      - key: extra_openings
      limit: 100
    roles:
    - manager
    - admin
  - key: space_reports_view
    type: instances
    template: space_report
    title:
      it: Report spazio
      en: Space reports
    roles:
    - manager
    - admin
  - key: account
    type: account
    title:
      it: Pagamenti
      en: Payments
    roles:
    - user
    - manager
  - key: admin
    type: admin
    title: Admin
    roles:
    - admin
  billing:
    modes:
    - per_transaction
    - credits
    currency: eur
    transactionFeePct: 10
    sellers: collection:spaces
    signupCredits: 30
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:advisor:
        estimate: 10
        metered: true
    packs:
    - key: small
      credits: 300
      price: 5
      label: Advisor 300
  extensions:
  - key: slot_booking_payment
    description: Availability by slot, booking with card payment per session and commission on each booking need booking logic
      beyond the manifest; collections hold the data.
  - key: access_qr
    description: Generation of the access code / QR for each paid booking.
  - key: manager_booking_view
    description: Managers must see bookings and occupancy of their own space only; bookings are user-owned, so a per-space
      view and the space_stats aggregates need custom code.
  - key: email_reminders_and_reports
    description: 'Not available yet: email reminders before a session and the periodic email report to managers. Reports are
      available in the app (space_reports); reminders require notifications.'
