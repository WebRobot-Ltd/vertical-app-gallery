apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: fitspot-pay
  displayName: FitSpot
  tagline:
    it: Prenota uno spazio fitness e paga solo il tempo che usi.
    en: Book a fitness space and pay only for the time you use.
  description:
    it: Piattaforma pay per use per prenotare palestre e spazi fitness per orario, zona e attività, con codice di accesso,
      suggerimenti e promemoria.
    en: Pay-per-use platform to book gyms and fitness spaces by time, area and activity, with an access code, suggestions
      and reminders.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12343b'
      accent: '#e4572e'
      background: '#f6f8f7'
      foreground: '#161d1f'
    fonts:
      body: Inter
      display: Poppins
    wordmark:
    - text: Fit
      color: primary
    - text: Spot
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#how'
    - label:
        it: Spazi
        en: Spaces
      href: '#spaces'
    cta:
      label:
        it: Prenota
        en: Book
      href: /v/book
  auth:
    method: magic_link
    anonymous:
      views:
      - home
      - search
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
    - key: manager
      label:
        it: Gestore
        en: Space manager
      assignedBy: derived
      from: collection:spaces.manager_email
  limits:
  - action: agent:suggester
    per: user
    max: 10
    window: day
    roles:
    - user
  agents:
  - key: suggester
    role: main
    description: Suggests the best spaces from the user's preferences and habits.
    profile:
      inline:
        display_name: FitSpot suggester
        crews:
        - id: suggester
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You recommend fitness spaces for pay-per-use sessions. Use read_spaces to list the published spaces
            (zone, activity, price per session, capacity, hours) and read_my_bookings for the user''s past sessions. Start
            with a level-1 title "# Spazi consigliati / Recommended spaces" (in the requested language). Then give up to 5
            ranked spaces, each with why it fits (zone, activity, usual times, price), the price per session and the suggested
            time slot, in a short table. Finish with a line pointing to the Book page. Never invent spaces, prices or availability:
            use only what the tools return, and say plainly if nothing matches.'
    appTools:
    - name: read_spaces
      description: List the published fitness spaces
      action: read
      collection: spaces
      scope: all
    - name: read_my_bookings
      description: The user's past and upcoming bookings
      action: read
      collection: bookings
      scope: user
    context:
    - key: prefs
      from: collection:preferences
    goalTemplate: 'Suggest spaces for {user}. Wanted date: {date_wanted}. Time: {time_wanted}. {?zone}Zone: {zone}.{/zone}
      {?activity}Activity: {activity_label}.{/activity}

      Saved preferences (JSON lines): {prefs}

      Write in the language with ISO code {lang}. Today is {date}.'
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.3
  - key: booking_desk
    role: helper
    description: 'Completes a new booking: access code and manager link.'
    profile:
      inline:
        display_name: FitSpot booking desk
        crews:
        - id: desk
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.1
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You finalise a just-created booking. Read the booking in the event, find its space with read_spaces,
            then call write_booking on that booking record with: space_manager_email = the space''s manager_email, amount
            = the space''s price_per_session, access_code = a 8-character uppercase alphanumeric code derived from the booking
            id (the QR shown to the user encodes this code), code_ready = true. Do nothing else. Never change other users''
            records. Answer with one line: done.'
    appTools:
    - name: read_spaces
      description: List the published fitness spaces
      action: read
      collection: spaces
      scope: all
    - name: write_booking
      description: Update fields of the user's booking
      action: write
      collection: bookings
      scope: user
    goalTemplate: 'New booking event: {event}'
    output: markdown
    limits:
      maxTurns: 6
      maxBudgetUsd: 0.1
  - key: reporter
    role: scheduled
    description: Weekly usage and revenue report for one space manager.
    profile:
      inline:
        display_name: FitSpot manager reporter
        crews:
        - id: reporter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write the weekly usage and revenue report for a space manager. Use read_bookings (you only get
            the manager''s own bookings) and read_spaces. Start with "# <Space> — week of <date>". Sections: ## Usage (sessions,
            occupancy per time band, busiest and emptiest bands), ## Revenue (gross takings, number of paid sessions, platform
            commission 10% and net), ## Suggestions (pricing or opening hours to try). Add a chart block of sessions per day:
            ```chart

            {"type":"bar","title":"...","labels":[...],"series":[{"name":"...","values":[...]}]}

            ```. Use real figures only; if there is no data, say so. Under 300 words.'
    appTools:
    - name: read_bookings
      description: Bookings of the manager's spaces
      action: read
      collection: bookings
      scope: all
    - name: read_spaces
      description: List the published fitness spaces
      action: read
      collection: spaces
      scope: all
    goalTemplate: Report for the space "{space_name}" (manager {user}). Today is {date}. Write in the language with ISO code
      {lang}.
    output: markdown
  inputForm:
    title:
      it: Trova il tuo spazio
      en: Find your space
    fields:
    - name: date_wanted
      type: date
      required: true
      label:
        it: Giorno
        en: Day
    - name: time_wanted
      type: text
      required: true
      label:
        it: Orario (es. 18:00-19:00)
        en: Time (e.g. 18:00-19:00)
    - name: zone
      type: text
      label:
        it: Zona
        en: Zone
    - name: activity
      type: select
      label:
        it: Attività
        en: Activity
      options:
      - value: weights
        label:
          it: Pesi
          en: Weights
      - value: cardio
        label: Cardio
      - value: yoga
        label: Yoga
      - value: functional
        label:
          it: Funzionale
          en: Functional
      - value: climbing
        label:
          it: Arrampicata
          en: Climbing
  data:
    collections:
    - name: spaces
      ownedBy: shared
      description: Published fitness spaces with hours, capacity and price per session
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome
          en: Name
      - name: zone
        type: text
        required: true
        label:
          it: Zona
          en: Zone
      - name: address
        type: text
        label:
          it: Indirizzo
          en: Address
      - name: activity
        type: select
        required: true
        label:
          it: Attività
          en: Activity
        options:
        - weights
        - cardio
        - yoga
        - functional
        - climbing
      - name: price_per_session
        type: number
        required: true
        label:
          it: Prezzo a sessione (€)
          en: Price per session (€)
      - name: capacity
        type: number
        required: true
        label:
          it: Capienza
          en: Capacity
      - name: hours
        type: text
        label:
          it: Orari
          en: Opening hours
      - name: slots
        type: json
        label: Slots
      - name: manager_email
        type: email
        required: true
        label:
          it: Email gestore
          en: Manager email
      access:
      - role: manager
        where:
          manager_email: '{user.email}'
        can:
        - read
        - write
    - name: bookings
      ownedBy: user
      description: Session bookings
      retentionDays: 730
      fields:
      - name: notes
        type: text
        label:
          it: Note
          en: Notes
      - name: space_manager_email
        type: email
      - name: amount
        type: number
      - name: access_code
        type: text
      - name: code_ready
        type: boolean
      access:
      - role: manager
        where:
          space_manager_email: '{user.email}'
        can:
        - read
        - write
      - role: admin
        can:
        - read
        - write
    - name: openings
      ownedBy: user
      description: Extraordinary openings or closures declared by a manager
      fields:
      - name: space
        type: text
        required: true
        label:
          it: Spazio
          en: Space
      - name: date
        type: date
        required: true
        label:
          it: Data
          en: Date
      - name: from_time
        type: text
        label:
          it: Dalle
          en: From
      - name: to_time
        type: text
        label:
          it: Alle
          en: To
      - name: kind
        type: select
        required: true
        label:
          it: Tipo
          en: Type
        options:
        - value: open
          label:
            it: Apertura straordinaria
            en: Extra opening
        - value: closed
          label:
            it: Chiusura
            en: Closure
      - name: note
        type: text
    - name: preferences
      ownedBy: user
      description: Each user's preferences and usual times
      fields:
      - name: zone
        type: text
        label:
          it: Zona preferita
          en: Preferred zone
      - name: activities
        type: multiselect
        label:
          it: Attività
          en: Activities
        options:
        - weights
        - cardio
        - yoga
        - functional
        - climbing
      - name: usual_times
        type: text
        label:
          it: Orari abituali
          en: Usual times
      - name: max_price
        type: number
        label:
          it: Prezzo massimo a sessione
          en: Max price per session
    - name: space_reports
      ownedBy: instance
      description: Weekly reports per space
  views:
  - key: home
    type: page
    nav: false
    title: FitSpot
    sections:
    - type: hero
      title:
        it: Allenati dove e quando vuoi, **paga solo la sessione**.
        en: Train where and when you want, **pay only per session**.
      text:
        it: Cerca palestre e spazi per orario, zona e attività, prenota uno slot e ricevi un codice QR per entrare.
        en: Search gyms and spaces by time, area and activity, book a slot and get a QR code to get in.
      actions:
      - label:
          it: Cerca e prenota
          en: Search and book
        href: /v/book
        style: primary
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: ghost
    - type: steps
      id: how
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Cerca
          en: Search
        text:
          it: Filtra per zona, attività e orario.
          en: Filter by zone, activity and time.
        badge: 🔎
      - title:
          it: Prenota e paga
          en: Book and pay
        text:
          it: Scegli lo slot e paga online con carta solo quella sessione.
          en: Pick a slot and pay that session online by card.
        badge: 💳
      - title:
          it: Entra
          en: Get in
        text:
          it: Ricevi codice/QR e un promemoria prima della sessione.
          en: Get a code/QR and a reminder before your session.
        badge: 📲
    - type: data
      id: spaces
      title:
        it: Spazi disponibili
        en: Available spaces
      source: collection:spaces
      display: cards
      fields:
      - key: name
        label:
          it: Nome
          en: Name
      - key: zone
        label:
          it: Zona
          en: Zone
      - key: activity
        format: badge
      - key: price_per_session
        format: money
        label:
          it: €/sessione
          en: €/session
      limit: 12
    - type: note
      content:
        it: 'FitSpot è solo la piattaforma di prenotazione: spazi e attrezzature sono forniti dai gestori.'
        en: 'FitSpot is only the booking platform: spaces and equipment are provided by their managers.'
  - key: search
    type: table
    title:
      it: Cerca spazi
      en: Search spaces
    source: collection:spaces
    columns:
    - name
    - zone
    - activity
    - price_per_session
    - capacity
    - hours
  - key: book
    type: booking
    title:
      it: Prenota
      en: Book
    collection: bookings
    resources: collection:spaces
    fields:
    - notes
    slots:
      days:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      from: 07:00
      to: '22:00'
      minutes: 60
      tz: Europe/Rome
      aheadDays: 14
      minNoticeHours: 1
      capacity: 1
    roles:
    - user
    - admin
  - key: my_bookings
    type: table
    title:
      it: Le mie prenotazioni
      en: My bookings
    source: collection:bookings
    columns:
    - date
    - start
    - end
    - resource
    - status
    - access_code
    - amount
    export: true
    roles:
    - user
  - key: suggest
    type: new_run
    title:
      it: Suggeriscimi
      en: Suggest for me
    roles:
    - user
    - admin
  - key: suggestions
    type: history
    title:
      it: I miei suggerimenti
      en: My suggestions
    source: run
    roles:
    - user
    - admin
  - key: suggestion
    type: report
    source: run
    printable: true
    nav: false
  - key: prefs
    type: form
    title:
      it: Le mie preferenze
      en: My preferences
    collection: preferences
    edit: true
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Preferenze salvate
        en: Preferences saved
      redirect: suggest
    roles:
    - user
  - key: space_edit
    type: form
    title:
      it: Il mio spazio (orari, capienza, prezzi)
      en: My space (hours, capacity, prices)
    collection: spaces
    edit: true
    submit:
      label:
        it: Pubblica
        en: Publish
      message:
        it: Spazio aggiornato
        en: Space updated
    roles:
    - manager
    - admin
  - key: openings_form
    type: form
    title:
      it: Aperture straordinarie
      en: Extraordinary openings
    collection: openings
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Salvato
        en: Saved
    roles:
    - manager
    - admin
  - key: occupancy
    type: page
    title:
      it: Saturazione e incassi
      en: Occupancy and takings
    roles:
    - manager
    - admin
    sections:
    - type: data
      title:
        it: Prenotazioni per giorno
        en: Bookings per day
      source: collection:bookings
      display: chart
      chart: bar
      fields:
      - key: date
      - key: count
      - key: total
      groupBy:
        field: date
        bucket: day
        aggs:
        - key: total
          agg: sum
          field: amount
    - type: data
      title:
        it: Prenotazioni dei miei spazi
        en: Bookings of my spaces
      source: collection:bookings
      display: table
      fields:
      - key: date
        format: date
      - key: start
      - key: resource
      - key: status
        format: badge
      - key: amount
        format: money
      sort:
        field: date
        dir: desc
      limit: 100
  - key: reports
    type: instances
    title:
      it: Report periodico
      en: Periodic report
    template: space_report
    roles:
    - manager
    - admin
  - key: admin_bookings
    type: table
    title:
      it: Tutte le prenotazioni
      en: All bookings
    source: collection:bookings
    columns:
    - date
    - start
    - resource
    - status
    - amount
    - space_manager_email
    export: true
    roles:
    - admin
  - key: account
    type: account
    title:
      it: Account
      en: Account
    roles:
    - user
    - manager
  templates:
  - key: space_report
    title:
      it: Report utilizzo e incassi
      en: Usage and takings report
    description:
      it: Ogni settimana ricevi via email utilizzo e incassi del tuo spazio.
      en: Every week you get usage and takings of your space by email.
    agent: reporter
    params:
    - name: space_name
      type: text
      required: true
      label:
        it: Nome dello spazio
        en: Space name
    goal: Report for the space "{space_name}" . Today is {date}. Write in the language with ISO code {lang}.
    schedule:
      cron: 0 7 * * 1
      userCanChange: true
    maxPerUser: 5
    roles:
    - manager
    - admin
    deliver:
      to: owner
      onlyIfNew: false
  triggers:
  - key: booking_new
    'on':
      collection: bookings
      op: insert
    start:
      agent: booking_desk
    goal: 'A booking was created: {event}'
  - key: booking_code_ready
    'on':
      collection: bookings
      op: update
      where:
        code_ready: true
    notify:
      to:
      - owner
      - record.space_manager_email
      subject:
        it: Prenotazione confermata
        en: Booking confirmed
      body:
        it: 'La tua sessione del {record.date} è confermata. Codice di accesso: {record.access_code}. Mostra il QR dalla pagina
          Le mie prenotazioni.'
        en: 'Your session on {record.date} is confirmed. Access code: {record.access_code}. Show the QR from My bookings.'
      link: my_bookings
  - key: booking_reminder
    'on':
      date:
        collection: bookings
        field: start
        offsetDays: 0
        hour: 7
    notify:
      to: owner
      subject:
        it: 'Promemoria: oggi hai una sessione'
        en: 'Reminder: you have a session today'
      body:
        it: 'Oggi hai una sessione prenotata ({record.resource}). Codice: {record.access_code}.'
        en: 'You have a session booked today ({record.resource}). Code: {record.access_code}.'
      link: my_bookings
  billing:
    modes:
    - per_transaction
    currency: eur
    transactionFeePct: 10
    sellers: collection:spaces
  extensions:
  - key: qr_image
    description: QR image rendering of access_code and variable-price card payment per booking (price_per_session) are not
      expressible in the manifest; the code is shown as text and the 10% commission is configured via per_transaction.
  - key: openings_in_slots
    description: Extraordinary openings/closures in the openings collection are not applied automatically to booking slots;
      managers can also edit the slots field of their space.
  - key: occupancy_bands
    description: Saturation per time band is approximated by bookings per day; finer bands need a custom aggregate.
