apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: calice-perfetto
  displayName: CalicePerfetto
  tagline:
    it: L'enoteca online con il sommelier AI che sceglie il vino giusto per ogni occasione.
    en: The online wine shop with an AI sommelier who picks the right bottle for every occasion.
  description:
    it: 'Sfoglia il catalogo o racconta l''occasione al sommelier: ti propone tre o quattro bottiglie, alternative se qualcosa
      è esaurito e casse miste.'
    en: 'Browse the catalogue or describe the occasion to the sommelier: three or four bottles, alternatives if something
      is sold out, and mixed cases.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#5b1a2b'
      accent: '#b08d57'
      background: '#fbf7f2'
      foreground: '#2a1d1f'
    fonts:
      body: Inter
      display: Playfair Display
    wordmark:
    - text: Calice
      color: primary
    - text: Perfetto
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Catalogo
        en: Catalogue
      href: /v/catalog
    cta:
      label:
        it: Chiedi al sommelier
        en: Ask the sommelier
      href: /v/sommelier
  auth:
    method: magic_link
    anonymous:
      views:
      - home
      - catalog
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
    - key: warehouse
      label:
        it: Magazziniere
        en: Warehouse
      assignedBy: invite
  limits:
  - action: chat
    per: user
    max: 60
    window: day
    roles:
    - user
  agents:
  - key: sommelier
    role: main
    description: 'Sommelier AI: cerca nel catalogo, consiglia, gestisce carrello, preferiti e ordini.'
    memory: user
    context:
    - key: past_orders
      from: collection:orders
    - key: favs
      from: collection:favorites
    goalTemplate: 'Conversazione finora:

      {history}


      Nuovo messaggio del cliente: {message}


      Cliente: {user}

      Acquisti precedenti (JSON): {past_orders}

      Vini preferiti (JSON): {favs}

      Rispondi nella lingua con codice ISO {lang}.'
    output: markdown
    profile:
      inline:
        display_name: Sommelier CalicePerfetto
        chat_mode: true
        crews:
        - id: sommelier
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei il sommelier di CalicePerfetto, un''enoteca online. Parli con calore e competenza, nella lingua
            del cliente. Per ogni richiesta (occasione, numero di persone, budget a bottiglia, gusti, piatti) usa SEMPRE search_wines
            sulle schede del catalogo (ricerca semantica) e, se serve, read_wines. Proponi 3 o 4 bottiglie realmente presenti,
            spiegando il perché (abbinamento, vitigno, note di degustazione, rispetto del budget) e indicando prezzo e annata.
            Non inventare mai vini, prezzi o giacenze: se la giacenza è 0 o insufficiente per le persone indicate, dillo e
            proponi un''alternativa simile. Se richiesto, componi una cassa mista (es. 6 bottiglie) con totale e quantità
            entro la giacenza. Usa i preferiti e gli acquisti passati e la tua memoria per personalizzare; a fine conversazione
            utile chiama remember con i 5 punti chiave sui gusti del cliente (sostituiscono i vecchi). Quando il cliente lo
            chiede, aggiungi al carrello con add_to_cart o ai preferiti con add_favorite. Per fare l''ordine: riepiloga il
            carrello, chiedi indirizzo di spedizione e chiedi esplicitamente se il cliente dichiara di avere almeno 18 anni;
            solo se risponde sì chiama place_order con age_confirmed true; altrimenti non ordinare. Ricorda che il pagamento
            con carta avviene al checkout sicuro. Promuovi un consumo responsabile. Ogni volta: registra con log_recommendation
            le bottiglie consigliate e con log_question una riga con l''argomento della domanda (senza dati personali). Risposte
            brevi e ben formattate, niente tabelle enormi.'
    appTools:
    - name: search_wines
      description: Ricerca semantica sulle schede dei vini
      action: search
      collection: wines
      scope: all
    - name: read_wines
      description: Legge i vini del catalogo con prezzo e giacenza
      action: read
      collection: wines
      scope: all
    - name: add_to_cart
      description: Aggiunge una bottiglia al carrello del cliente
      action: write
      collection: cart
      scope: user
    - name: read_cart
      description: Legge il carrello del cliente
      action: read
      collection: cart
      scope: user
    - name: add_favorite
      description: Aggiunge un vino ai preferiti del cliente
      action: write
      collection: favorites
      scope: user
    - name: place_order
      description: Crea l'ordine del cliente dopo conferma maggiore età
      action: write
      collection: orders
      scope: user
    - name: log_recommendation
      description: Registra un vino consigliato
      action: append
      collection: recommendations
      scope: all
    - name: log_question
      description: Registra l'argomento di una domanda in chat
      action: append
      collection: chat_questions
      scope: all
  - key: importer
    role: setup
    description: Importa il catalogo vini da un file caricato dall'admin.
    goalTemplate: 'Importa nel catalogo tutte le righe di questo file ({catalog}).

      Contenuto:

      {?catalog_text}{catalog_text}{/catalog_text}

      Modalità: {mode_label}.'
    output: markdown
    limits:
      maxTurns: 60
      maxBudgetUsd: 1.5
    profile:
      inline:
        display_name: Importatore catalogo
        crews:
        - id: importer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 60
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Importi un catalogo di vini da un file CSV/Excel/JSON. Per ogni riga chiama import_wine con i campi:
            label, winery, region, grapes, vintage, abv, pairings, tasting_notes, price (numero in euro), stock (intero),
            photo_url. Mappa le colonne anche se hanno nomi diversi (italiano o inglese). Non inventare valori mancanti: lasciali
            vuoti. Non creare duplicati: etichetta+annata identica va aggiornata, non ripetuta. Chiudi con un report che inizia
            con "# Importazione catalogo" con numero di righe importate, saltate e motivi.'
    appTools:
    - name: import_wine
      description: Crea o aggiorna una scheda vino nel catalogo
      action: write
      collection: wines
      scope: all
  - key: newsletter_writer
    role: helper
    description: Scrive ogni mese la selezione personalizzata per un cliente e chiede l'approvazione dell'enoteca.
    memory: instance
    awaits:
    - newsletter_ok
    context:
    - key: past_orders
      from: collection:orders
    - key: favs
      from: collection:favorites
    writesTo:
      collection: newsletters
    goalTemplate: 'Scrivi la newsletter di {date} per il cliente "{instance}".

      Acquisti (JSON): {past_orders}

      Preferiti (JSON): {favs}

      Scrivi in lingua ISO {lang}.'
    output: markdown
    limits:
      maxTurns: 10
      maxBudgetUsd: 0.5
    profile:
      inline:
        display_name: Newsletter CalicePerfetto
        crews:
        - id: newsletter_writer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Scrivi la newsletter mensile personalizzata di un''enoteca. Usa search_wines per scegliere 3-4 bottiglie
            in stock coerenti con acquisti e preferiti del cliente (evita quelle già acquistate di recente) e la tua memoria.
            Struttura: "# Titolo" del mese, breve saluto, ## Per te (bottiglie con prezzo e motivo), ## Idea del mese (un
            abbinamento), invito all''acquisto. Meno di 250 parole, solo vini e prezzi reali del catalogo, consumo responsabile.
            Dopo la bozza chiama request_newsletter_ok per far approvare l''enoteca; non è inviata finché non approvata. Infine
            chiama remember con i punti chiave.'
    appTools:
    - name: search_wines
      description: Ricerca semantica sulle schede dei vini
      action: search
      collection: wines
      scope: all
  inputForm:
    title:
      it: Importa catalogo
      en: Import catalogue
    fields:
    - name: catalog
      type: file
      required: true
      accept:
      - csv
      - xlsx
      - json
      maxMb: 15
      label:
        it: File del catalogo
        en: Catalogue file
    - name: mode
      type: select
      required: true
      default: update
      label:
        it: Modalità
        en: Mode
      options:
      - value: update
        label:
          it: Aggiungi e aggiorna
          en: Add and update
      - value: add
        label:
          it: Solo nuovi vini
          en: New wines only
  data:
    collections:
    - name: wines
      ownedBy: shared
      searchable: true
      description: Catalogo vini
      fields:
      - name: label
        type: text
        required: true
        label:
          it: Etichetta
          en: Label
      - name: winery
        type: text
        label:
          it: Cantina
          en: Winery
      - name: region
        type: text
        label:
          it: Regione
          en: Region
      - name: grapes
        type: text
        label:
          it: Vitigni
          en: Grapes
      - name: vintage
        type: number
        label:
          it: Annata
          en: Vintage
      - name: abv
        type: number
        label:
          it: Gradazione %
          en: ABV %
      - name: pairings
        type: textarea
        label:
          it: Abbinamenti
          en: Pairings
      - name: tasting_notes
        type: textarea
        label:
          it: Note di degustazione
          en: Tasting notes
      - name: price
        type: number
        required: true
        label:
          it: Prezzo €
          en: Price €
      - name: stock
        type: number
        required: true
        label:
          it: Giacenza
          en: Stock
      - name: photo
        type: file
        accept:
        - jpg
        - png
        - webp
        maxMb: 5
        label:
          it: Foto
          en: Photo
      - name: photo_url
        type: url
    - name: favorites
      ownedBy: user
      fields:
      - name: wine_label
        type: text
        required: true
      - name: wine_id
        type: text
    - name: cart
      ownedBy: user
      fields:
      - name: wine_label
        type: text
        required: true
      - name: wine_id
        type: text
      - name: qty
        type: number
        required: true
      - name: unit_price
        type: number
    - name: orders
      ownedBy: user
      description: Ordini dei clienti; il magazziniere li vede e li aggiorna
      retentionDays: 1825
      fields:
      - name: date
        type: date
      - name: items
        type: textarea
        required: true
      - name: total
        type: number
      - name: address
        type: textarea
        required: true
      - name: email
        type: email
        required: true
      - name: age_confirmed
        type: boolean
        required: true
        label:
          it: Dichiaro di avere almeno 18 anni
          en: I confirm I am at least 18
      - name: status
        type: select
        options:
        - placed
        - paid
        - preparing
        - shipped
        default: placed
      - name: carrier
        type: text
      - name: tracking_code
        type: text
      access:
      - role: warehouse
        can:
        - read
        - write
    - name: recommendations
      ownedBy: org
      description: Bottiglie consigliate dal sommelier
      retentionDays: 365
      fields:
      - name: wine_label
        type: text
      - name: date
        type: date
    - name: chat_questions
      ownedBy: org
      description: Argomenti delle domande in chat, senza dati personali
      retentionDays: 180
      fields:
      - name: topic
        type: text
      - name: date
        type: date
    - name: newsletters
      ownedBy: instance
      description: Bozze e newsletter mensili per cliente
  views:
  - key: home
    type: page
    title: CalicePerfetto
    nav: false
    sections:
    - type: hero
      layout: stack
      band: true
      eyebrow:
        it: Enoteca online
        en: Online wine shop
      title:
        it: Racconta l'occasione, **il sommelier** sceglie il vino.
        en: Tell us the occasion, **the sommelier** picks the wine.
      text:
        it: '«Cena di pesce per sei, 25 € a bottiglia, bianchi minerali»: tre o quattro bottiglie scelte nel nostro catalogo,
          con il perché.'
        en: '"Fish dinner for six, €25 a bottle, mineral whites": three or four bottles picked from our catalogue, with the
          reasons why.'
      actions:
      - label:
          it: Chiedi al sommelier
          en: Ask the sommelier
        href: /v/sommelier
        style: primary
      - label:
          it: Sfoglia il catalogo
          en: Browse the catalogue
        href: /v/catalog
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Descrivi
          en: Describe
        text:
          it: Occasione, persone, budget e gusti.
          en: Occasion, guests, budget and taste.
        badge: 💬
      - title:
          it: Scegli
          en: Choose
        text:
          it: Bottiglie, alternative e casse miste. Aggiungi al carrello.
          en: Bottles, alternatives and mixed cases. Add to cart.
        badge: 🍷
      - title:
          it: Ricevi
          en: Receive
        text:
          it: Paghi con carta, confermi la maggiore età e segui la spedizione via email.
          en: Pay by card, confirm you are of age and follow shipping by email.
        badge: 📦
    - type: note
      content:
        it: Vendita riservata ai maggiori di 18 anni. Bevi responsabilmente.
        en: Sales to persons aged 18 or over only. Please drink responsibly.
  - key: catalog
    type: cards
    title:
      it: Catalogo
      en: Catalogue
    source: collection:wines
    columns:
    - label
    - winery
    - region
    - grapes
    - vintage
    - price
    - stock
    query: stock > 0
  - key: sommelier
    type: chat
    title:
      it: Sommelier
      en: Sommelier
    source: agent:sommelier
    roles:
    - user
    - admin
    examples:
    - it: Cena di pesce per sei, budget 25 euro a bottiglia, mi piacciono i bianchi minerali
      en: Fish dinner for six, €25 a bottle budget, I like mineral whites
    - it: Componi una cassa mista di 6 rossi per l'inverno
      en: Put together a mixed case of 6 winter reds
    placeholder:
      it: Descrivi l'occasione…
      en: Describe the occasion…
  - key: cart_view
    type: table
    title:
      it: Carrello
      en: Cart
    source: collection:cart
    columns:
    - wine_label
    - qty
    - unit_price
    roles:
    - user
  - key: favorites_view
    type: list
    title:
      it: Preferiti
      en: Favourites
    source: collection:favorites
    columns:
    - wine_label
    roles:
    - user
  - key: orders_view
    type: table
    title:
      it: I miei ordini
      en: My orders
    source: collection:orders
    columns:
    - date
    - items
    - total
    - status
    - carrier
    - tracking_code
    roles:
    - user
  - key: newsletters_view
    type: instances
    template: newsletter
    title:
      it: Newsletter mensile
      en: Monthly newsletter
    roles:
    - user
  - key: import_catalog
    type: new_run
    title:
      it: Importa catalogo
      en: Import catalogue
    roles:
    - admin
  - key: wine_form
    type: form
    title:
      it: Scheda vino
      en: Wine record
    collection: wines
    edit: true
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Vino salvato
        en: Wine saved
      redirect: catalog
    roles:
    - admin
  - key: warehouse_orders
    type: table
    title:
      it: Ordini da preparare
      en: Orders to prepare
    source: collection:orders
    columns:
    - date
    - items
    - address
    - status
    - carrier
    - tracking_code
    export: true
    roles:
    - warehouse
    - admin
  - key: order_update
    type: form
    title:
      it: Aggiorna ordine
      en: Update order
    collection: orders
    fields:
    - status
    - carrier
    - tracking_code
    edit: true
    submit:
      label:
        it: Conferma
        en: Confirm
      message:
        it: Ordine aggiornato
        en: Order updated
      redirect: warehouse_orders
    roles:
    - warehouse
    - admin
    nav: false
  - key: approvals_view
    type: approvals
    title:
      it: Approvazioni newsletter
      en: Newsletter approvals
    approvals:
    - newsletter_ok
    roles:
    - admin
  - key: admin_dashboard
    type: page
    title:
      it: Dashboard
      en: Dashboard
    roles:
    - admin
    sections:
    - type: data
      title:
        it: Vendite per mese
        en: Sales per month
      source: collection:orders
      display: chart
      chart: bar
      fields:
      - key: date
        label:
          it: Mese
          en: Month
      - key: total
        label: €
      groupBy:
        field: date
        bucket: month
        aggs:
        - key: total
          agg: sum
          field: total
      kpis:
      - label:
          it: Ordini
          en: Orders
        agg: count
      - label:
          it: Incasso
          en: Revenue
        agg: sum
        field: total
        format: money
    - type: data
      title:
        it: Bottiglie più consigliate
        en: Most recommended bottles
      source: collection:recommendations
      display: bar
      fields:
      - key: wine_label
      - key: count
      groupBy:
        field: wine_label
        aggs: []
      limit: 15
    - type: data
      title:
        it: Domande frequenti in chat
        en: Frequent chat questions
      source: collection:chat_questions
      display: table
      fields:
      - key: topic
      - key: count
      groupBy:
        field: topic
        aggs: []
      limit: 20
  - key: orders_report
    type: report
    source: run
    printable: true
    nav: false
  templates:
  - key: newsletter
    title:
      it: Newsletter mensile
      en: Monthly newsletter
    description:
      it: Una selezione personalizzata ogni mese, inviata solo dopo approvazione dell'enoteca.
      en: A personalised selection every month, sent only after the shop approves it.
    agent: newsletter_writer
    params:
    - name: note
      type: text
      label:
        it: Cosa ti interessa (facoltativo)
        en: What interests you (optional)
    goal: 'Newsletter of {date} for "{instance}". Preferences: {note}. Language ISO {lang}.'
    schedule:
      cron: 0 8 1 * *
      userCanChange: false
    maxPerUser: 1
  approvals:
  - key: newsletter_ok
    title:
      it: Approva newsletter
      en: Approve newsletter
    role: admin
    decidedBy: role
    timeoutMinutes: 10080
    onTimeout: reject
  triggers:
  - key: new_order
    'on':
      collection: orders
      op: insert
    notify:
      to:
      - role:warehouse
      - admins
      subject:
        it: Nuovo ordine da preparare
        en: New order to prepare
      body:
        it: 'Ordine: {record.items}

          Indirizzo: {record.address}'
        en: 'Order: {record.items}

          Address: {record.address}'
      link: warehouse_orders
  - key: order_shipped
    'on':
      collection: orders
      op: update
      where:
        status: shipped
    notify:
      to: record.email
      subject:
        it: Il tuo ordine CalicePerfetto è stato spedito
        en: Your CalicePerfetto order has shipped
      body:
        it: 'Corriere: {record.carrier}

          Tracking: {record.tracking_code}'
        en: 'Carrier: {record.carrier}

          Tracking: {record.tracking_code}'
      link: orders_view
  - key: newsletter_approved
    'on':
      approval: newsletter_ok
      decision: approved
    notify:
      to: owner
      subject:
        it: La tua selezione CalicePerfetto del mese
        en: Your CalicePerfetto selection of the month
      body:
        it: 'La tua selezione personalizzata è pronta: aprila nell''app.'
        en: 'Your personalised selection is ready: open it in the app.'
      link: newsletters_view
  billing:
    modes:
    - per_transaction
    currency: eur
    transactionFeePct: 10
  egress:
    hosts:
    - api.example-courier.invalid
    notes: 'Segnaposto: corriere non ancora scelto; da sostituire quando disponibile.'
  extensions:
  - key: card_checkout
    description: 'Pagamento con carta del carrello (checkout Stripe sul totale dell''ordine) e passaggio a ''paid'': non esprimibile
      ancora con il manifest, l''ordine nasce ''placed''.'
  - key: courier_booking
    description: 'Prenotazione automatica della spedizione e tracking col corriere via API: per ora il magazziniere inserisce
      corriere e codice, e il cliente riceve l''email.'
  - key: erp_sync
    description: 'Sincronizzazione del catalogo dal gestionale: ora via upload di file (CSV/Excel/JSON); API del gestionale
      da collegare.'
