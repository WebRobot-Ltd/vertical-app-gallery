apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: calice-perfetto
  displayName: CalicePerfetto
  tagline:
    it: L'enoteca online con il sommelier AI che trova il vino giusto per ogni occasione.
    en: The online wine shop with an AI sommelier who finds the right bottle for every occasion.
  description:
    it: 'Sfoglia il catalogo con i filtri o racconta al sommelier AI la tua occasione: ti propone tre o quattro bottiglie,
      alternative se qualcosa è esaurito e casse miste su misura.'
    en: 'Browse the catalogue with filters or tell the AI sommelier about your occasion: you get three or four bottles, alternatives
      when something is sold out, and mixed cases made for you.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#5b1a2b'
      accent: '#b8893b'
      background: '#faf6f0'
      foreground: '#241a1c'
    fonts:
      body: Inter
      display: Playfair Display
    wordmark:
    - text: Calice
      color: primary
    - text: Perfetto
      color: accent
    button: primary
    width: wide
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Catalogo
        en: Catalogue
      href: /v/catalog
    cta:
      label:
        it: Chiedi al sommelier
        en: Ask the sommelier
      href: /v/sommelier
  auth:
    method: magic_link
    anonymous:
      views:
      - home
      - catalog
    roles:
    - key: admin
      label: Enoteca
      assignedBy: admin_emails
    - key: warehouse
      label:
        it: Magazziniere
        en: Warehouse
      assignedBy: invite
    - key: user
      label:
        it: Cliente
        en: Customer
      assignedBy: signup
  limits:
  - action: chat
    per: user
    max: 60
    window: day
    roles:
    - user
  agents:
  - key: sommelier
    role: main
    description: 'Sommelier AI: searches the catalogue, recommends bottles, builds mixed cases, learns from the customer''s
      purchases.'
    memory: user
    profile:
      inline:
        display_name: CalicePerfetto sommelier
        chat_mode: true
        crews:
        - id: sommelier
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the sommelier of CalicePerfetto, an online wine shop. Answer in the customer''s language
            (Italian or English). Start every reply with a level-1 Markdown title "# " of a few words.

            Workflow: understand the occasion (dish, number of guests, budget per bottle, taste); call search_wines (semantic
            search over the catalogue cards) and, when useful, read_orders and read_favorites to learn the customer''s taste;
            then propose 3 or 4 bottles. For each: name, winery, region, vintage, price, and WHY it fits (pairing, tasting
            notes). Only recommend wines that exist in the catalogue and respect the budget. Check the stock: if a bottle
            is sold out (stock 0) say so and offer an in-stock alternative. On request compose a mixed case (e.g. 6 or 12
            bottles) with a total price and a short rationale. Never invent wines, prices, vintages or stock. Offer to save
            bottles to favorites (save_favorite) and to add them to the cart (add_to_cart). Before placing an order (place_order)
            you MUST ask explicitly whether the customer confirms to be of legal drinking age (18+), and set age_confirmed
            true only after a clear yes; otherwise do not place the order. Payment by card is done on the secure checkout,
            never ask for card data. Promote responsible drinking; no health claims. After each answer call log_question once
            with the question topic and the wine skus you recommended. At the end call remember with the customer''s 5 key
            taste preferences (they replace the old ones).'
    appTools:
    - name: search_wines
      description: Semantic search over the wine catalogue cards
      action: search
      collection: wines
      scope: all
    - name: read_favorites
      description: The customer's favorite wines
      action: read
      collection: favorites
      scope: user
    - name: save_favorite
      description: Add a wine to the customer's favorites
      action: write
      collection: favorites
      scope: user
    - name: read_orders
      description: The customer's past orders
      action: read
      collection: orders
      scope: user
    - name: add_to_cart
      description: Add a bottle or a case to the customer's cart
      action: write
      collection: cart
      scope: user
    - name: place_order
      description: Create the order from the cart, with age confirmation
      action: write
      collection: orders
      scope: user
    - name: log_question
      description: Log the topic of the question and the recommended skus
      action: append
      collection: faq_log
      scope: all
    goalTemplate: 'Conversation so far:

      {history}


      Customer ({user}) writes: {message}

      Today is {date}. Reply in the language with ISO code {lang}.'
    output: markdown
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.5
  - key: importer
    role: setup
    description: Imports the wine catalogue from text or a link pasted by the shop admin.
    profile:
      inline:
        display_name: CalicePerfetto catalogue importer
        chat_mode: true
        crews:
        - id: importer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You help the wine shop admin load the catalogue. The admin pastes CSV/table text or a list of wines.
            Map each row to the fields: sku, label, winery, region, grapes, vintage, abv, pairings, tasting_notes, price,
            stock, photo_url. For each wine call upsert_wine (the sku is the key). Never invent values: leave a field empty
            when it is missing, and ask when a column is ambiguous. Answer in the admin''s language. Start with a level-1
            Markdown title and end with a summary table: rows imported, rows skipped and why.'
    appTools:
    - name: upsert_wine
      description: Create or update a wine in the catalogue
      action: write
      collection: wines
      scope: all
    - name: read_wines
      description: Read the catalogue
      action: read
      collection: wines
      scope: all
    goalTemplate: 'Conversation so far:

      {history}


      Admin writes: {message}

      Reply in the language with ISO code {lang}.'
    output: markdown
    limits:
      maxTurns: 15
      maxBudgetUsd: 0.8
  - key: orderdesk
    role: helper
    description: 'Handles a new order: asks the warehouse to confirm preparation, then records the sale.'
    awaits:
    - prepare_order
    profile:
      inline:
        display_name: CalicePerfetto order desk
        crews:
        - id: orderdesk
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You process one wine order, described in the task you receive. Check that age_confirmed is true:
            if not, set the status to blocked and stop. Otherwise call request_prepare_order with the order summary (items,
            total, shipping address). When the warehouse has approved, set the order status to preparing with update_order
            and record the sale with log_sale (date, total, items). Start your answer with a level-1 Markdown title and summarise
            what you did in two lines. Never invent data.'
    appTools:
    - name: update_order
      description: Update the customer's order status
      action: write
      collection: orders
      scope: user
    - name: log_sale
      description: Record the sale for the shop dashboard
      action: append
      collection: sales_log
      scope: all
    goalTemplate: Process the newly placed order described in the task. Today is {date}. Reply in the language with ISO code
      {lang}.
    output: markdown
    limits:
      maxTurns: 6
      maxBudgetUsd: 0.2
  - key: newsletter
    role: scheduled
    description: Drafts the monthly newsletter selection, to be approved by the shop before sending.
    awaits:
    - newsletter_ok
    writesTo:
      collection: newsletter_drafts
      parse: whole
      keyBy: month
    profile:
      inline:
        display_name: CalicePerfetto newsletter
        crews:
        - id: newsletter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write the monthly newsletter of CalicePerfetto, an online wine shop. Use read_wines (catalogue),
            read_sales and read_faq (what sold and what customers ask) to choose a seasonal selection of 5 in-stock wines.
            Output a level-1 title "# " with the subject line, then a short intro, the 5 wines (name, winery, region, price,
            one reason each), and a closing line, first in Italian then in English. Only real catalogue data; never invent
            prices or stock. Include a note to responsible drinking (18+). Then call request_newsletter_ok with the draft:
            it is sent only after the shop approves.'
    appTools:
    - name: read_wines
      description: Read the catalogue
      action: read
      collection: wines
      scope: all
    - name: read_sales
      description: Read the sales log
      action: read
      collection: sales_log
      scope: all
    - name: read_faq
      description: Read the logged chat questions
      action: read
      collection: faq_log
      scope: all
    goalTemplate: Write the newsletter for the month of {date}.
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.4
  data:
    collections:
    - name: wines
      ownedBy: shared
      searchable: true
      description: Wine catalogue
      fields:
      - name: sku
        type: text
        required: true
        label: SKU
      - name: label
        type: text
        required: true
        label:
          it: Etichetta
          en: Label
      - name: winery
        type: text
        label:
          it: Cantina
          en: Winery
      - name: region
        type: text
        label:
          it: Regione
          en: Region
      - name: grapes
        type: text
        label:
          it: Vitigni
          en: Grapes
      - name: vintage
        type: number
        label:
          it: Annata
          en: Vintage
      - name: abv
        type: number
        label:
          it: Gradazione %
          en: ABV %
      - name: pairings
        type: textarea
        label:
          it: Abbinamenti
          en: Pairings
      - name: tasting_notes
        type: textarea
        label:
          it: Note di degustazione
          en: Tasting notes
      - name: price
        type: number
        required: true
        label:
          it: Prezzo
          en: Price
      - name: stock
        type: number
        label:
          it: Giacenza
          en: Stock
      - name: photo_url
        type: url
        label:
          it: Foto (link)
          en: Photo (link)
    - name: favorites
      ownedBy: user
      description: Customer's favorite wines
      fields:
      - name: sku
        type: text
        required: true
      - name: label
        type: text
      - name: price
        type: number
    - name: cart
      ownedBy: user
      description: Customer's cart
      fields:
      - name: sku
        type: text
        required: true
      - name: label
        type: text
      - name: quantity
        type: number
      - name: price
        type: number
    - name: orders
      ownedBy: user
      description: Customer's orders
      fields:
      - name: items
        type: json
      - name: total
        type: number
        label:
          it: Totale
          en: Total
      - name: age_confirmed
        type: boolean
        required: true
        label:
          it: Maggiore età confermata
          en: Legal age confirmed
      - name: shipping_address
        type: textarea
      - name: status
        type: select
        options:
        - placed
        - preparing
        - shipped
        - delivered
        - blocked
      - name: tracking_url
        type: url
    - name: sales_log
      ownedBy: org
      description: Sales for the shop dashboard
      fields:
      - name: date
        type: date
      - name: total
        type: number
      - name: items
        type: json
    - name: faq_log
      ownedBy: org
      description: Chat questions and recommended skus
      fields:
      - name: topic
        type: text
      - name: skus
        type: text
      - name: date
        type: date
    - name: newsletter_drafts
      ownedBy: org
      description: Monthly newsletter drafts
      fields:
      - name: month
        type: text
      - name: content
        type: textarea
  views:
  - key: home
    type: page
    nav: false
    title: CalicePerfetto
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow:
        it: Enoteca online
        en: Online wine shop
      title:
        it: Racconta l'occasione, il **sommelier AI** sceglie il vino.
        en: Tell us the occasion, the **AI sommelier** picks the wine.
      text:
        it: '«Cena di pesce per sei, 25 euro a bottiglia, mi piacciono i bianchi minerali»: tre o quattro bottiglie con il
          perché, alternative se qualcosa è esaurito e casse miste su misura.'
        en: '"Fish dinner for six, 25 euros a bottle, I like mineral whites": three or four bottles with the reasons, alternatives
          if something is sold out, and mixed cases made for you.'
      actions:
      - label:
          it: Chiedi al sommelier
          en: Ask the sommelier
        href: /v/sommelier
        style: primary
      - label:
          it: Sfoglia il catalogo
          en: Browse the catalogue
        href: /v/catalog
        style: ghost
      note:
        it: Vendita riservata ai maggiorenni.
        en: Sales only to adults.
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Descrivi
          en: Describe
        text:
          it: Piatto, ospiti, budget e gusti, in chat o con i filtri del catalogo.
          en: Dish, guests, budget and taste, in chat or with the catalogue filters.
        badge: 🍷
      - title:
          it: Scegli
          en: Choose
        text:
          it: Il sommelier cerca nelle schede e ti spiega ogni scelta.
          en: The sommelier searches the cards and explains each pick.
        badge: 🔎
      - title:
          it: Ordina
          en: Order
        text:
          it: Carrello, conferma della maggiore età, pagamento con carta e spedizione.
          en: Cart, age confirmation, card payment and shipping.
        badge: 📦
    - type: note
      content:
        it: Bevi responsabilmente. Vendita vietata ai minori di 18 anni.
        en: Please drink responsibly. Sales to under-18s are prohibited.
  - key: catalog
    type: cards
    title:
      it: Catalogo
      en: Catalogue
    source: collection:wines
    data:
      display: cards
      fields:
      - key: label
        label:
          it: Vino
          en: Wine
      - key: winery
        label:
          it: Cantina
          en: Winery
      - key: region
        label:
          it: Regione
          en: Region
        format: badge
      - key: grapes
        label:
          it: Vitigni
          en: Grapes
      - key: vintage
        label:
          it: Annata
          en: Vintage
      - key: price
        label:
          it: Prezzo
          en: Price
        format: money
      - key: stock
        label:
          it: Giacenza
          en: Stock
        format: number
      sort:
        field: label
        dir: asc
      limit: 60
      empty:
        it: Il catalogo è in preparazione.
        en: The catalogue is being prepared.
  - key: sommelier
    type: chat
    title:
      it: Sommelier
      en: Sommelier
    source: agent:sommelier
    roles:
    - user
    - admin
    placeholder:
      it: Descrivi l'occasione…
      en: Describe the occasion…
    examples:
    - it: Cena di pesce per sei, 25 euro a bottiglia, mi piacciono i bianchi minerali
      en: Fish dinner for six, 25 euros a bottle, I like mineral whites
    - it: Componi una cassa mista da 6 rossi sotto i 20 euro
      en: Make a mixed case of 6 reds under 20 euros
  - key: favorites
    type: list
    title:
      it: I miei preferiti
      en: My favorites
    source: collection:favorites
    roles:
    - user
    data:
      display: cards
      fields:
      - key: label
      - key: price
        format: money
      empty:
        it: Nessun preferito ancora.
        en: No favorites yet.
  - key: my_orders
    type: table
    title:
      it: I miei ordini
      en: My orders
    source: collection:orders
    roles:
    - user
    data:
      display: table
      fields:
      - key: total
        label:
          it: Totale
          en: Total
        format: money
      - key: status
        label:
          it: Stato
          en: Status
        format: badge
      - key: tracking_url
        label: Tracking
        format: link
      empty:
        it: Nessun ordine.
        en: No orders.
  - key: approvals
    type: approvals
    title:
      it: Da approvare
      en: To approve
    roles:
    - admin
    - warehouse
  - key: import
    type: chat
    title:
      it: Carica catalogo
      en: Load catalogue
    source: agent:importer
    roles:
    - admin
    placeholder:
      it: Incolla le righe del catalogo (CSV) o un elenco di vini…
      en: Paste catalogue rows (CSV) or a list of wines…
  - key: dashboard
    type: page
    title:
      it: Dashboard
      en: Dashboard
    roles:
    - admin
    sections:
    - type: data
      title:
        it: Vendite
        en: Sales
      source: collection:sales_log
      display: kpi
      kpis:
      - label:
          it: Ordini
          en: Orders
        agg: count
      - label:
          it: Incasso
          en: Revenue
        agg: sum
        field: total
        format: money
      - label:
          it: Ordine medio
          en: Average order
        agg: avg
        field: total
        format: money
    - type: data
      title:
        it: Vendite nel tempo
        en: Sales over time
      source: collection:sales_log
      display: chart
      chart: line
      fields:
      - key: date
      - key: total
      sort:
        field: date
        dir: asc
      limit: 60
    - type: data
      title:
        it: Domande frequenti in chat
        en: Frequent chat questions
      source: collection:faq_log
      display: table
      fields:
      - key: date
        format: date
      - key: topic
      - key: skus
        label:
          it: Bottiglie consigliate
          en: Recommended bottles
      sort:
        field: date
        dir: desc
      limit: 50
    - type: data
      title:
        it: Newsletter in bozza
        en: Newsletter drafts
      source: collection:newsletter_drafts
      display: list
      fields:
      - key: month
      - key: content
      limit: 6
  - key: settings
    type: page
    title:
      it: Informazioni
      en: About
    nav: false
    content: CalicePerfetto
  approvals:
  - key: prepare_order
    title:
      it: Conferma preparazione ordine
      en: Confirm order preparation
    role: warehouse
    fields:
    - items
    - total
    - shipping_address
    timeoutMinutes: 2880
    decidedBy: role
  - key: newsletter_ok
    title:
      it: Approva la newsletter mensile
      en: Approve the monthly newsletter
    role: admin
    fields:
    - content
    timeoutMinutes: 10080
    onTimeout: reject
    decidedBy: role
  triggers:
  - key: on_new_order
    'on':
      collection: orders
      op: insert
      where:
        status: placed
    start:
      agent: orderdesk
    goal: 'New order placed: {event}'
    asUser: true
  schedules:
  - agent: newsletter
    action: run
    cron: 0 8 1 * *
    owner: app
    goal: Draft this month's newsletter.
  billing:
    modes:
    - free
  extensions:
  - key: file_upload_and_erp_sync
    description: 'Catalogue upload from a file and sync from the shop''s management system are not available yet: the admin
      pastes CSV text or a list into the Load catalogue chat. Photos are links.'
  - key: card_checkout_with_margin
    description: Card payment of the goods with the shop's margin (no subscription, no credits) needs a product checkout that
      is not declared here yet; orders are created with status placed and payment must be connected in the studio.
  - key: courier_and_tracking_email
    description: Booking the courier and sending the tracking by email are not available yet (no notifications, no courier
      connector). The warehouse enters the tracking link on the order.
  - key: personalised_newsletter_sending
    description: 'Sending emails is not available yet: the newsletter is drafted monthly and approved by the shop, but delivery
      and per-customer personalisation need the notification feature.'
  - key: age_gate
    description: Age confirmation is collected by the sommelier before the order is placed and stored on the order (age_confirmed);
      a blocking checkbox on the card checkout is still to be added.
