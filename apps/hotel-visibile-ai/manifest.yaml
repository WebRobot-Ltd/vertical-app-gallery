apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: vetrinaai
  displayName: VetrinaAI
  tagline:
    it: Scopri come gli assistenti AI raccontano il tuo hotel.
    en: See how AI assistants describe your hotel.
  description:
    it: VetrinaAI interroga ogni settimana gli assistenti AI con le domande dei tuoi ospiti, misura quanto il tuo hotel viene
      citato e ti dice cosa migliorare.
    en: VetrinaAI asks AI assistants your guests' questions every week, measures how often your hotel is mentioned and tells
      you what to improve.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: dashboard
  branding:
    theme: light
    palette:
      primary: '#1d3557'
      accent: '#e07a5f'
      background: '#fbf8f3'
      foreground: '#1b1f24'
    fonts:
      body: Inter
      display: Playfair Display
    wordmark:
    - text: Vetrina
      color: primary
    - text: AI
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Prezzi
        en: Pricing
      href: '#prezzi'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      label:
        it: Albergatore
        en: Hotelier
      assignedBy: signup
  limits:
  - action: agent:prober
    per: user
    max: 40
    window: day
    roles:
    - user
  agents:
  - key: prober
    role: scheduled
    description: Asks a battery of realistic guest questions as an AI assistant would be asked, records mentions, then hands
      over to the analyst.
    memory: instance
    delegates:
    - analyst
    output: markdown+json
    resultSchema:
      type: object
      properties:
        week:
          type: string
        hotel:
          type: string
        visibility_index:
          type: number
        mention_rate:
          type: number
        avg_position:
          type: number
        delta_index:
          type: number
        top_competitor:
          type: string
        summary:
          type: string
        answers:
          type: array
          items:
            type: object
            properties:
              question:
                type: string
              mentioned:
                type: boolean
              position:
                type: number
              adjectives:
                type: string
              competitors:
                type: string
    writesTo:
      collection: weekly_reports
      parse: json_last
      keyBy: week
    profile:
      inline:
        display_name: VetrinaAI prober
        crews:
        - id: prober
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You monitor how AI assistants talk about one hotel. You receive the hotel''s name, city, category,
            strengths, direct competitors and typical guest questions. Build a battery of 12 realistic questions a traveller
            would ask an AI assistant (mix the hotel''s own guest questions with generic ones such as ''best family hotel
            in <city>''). Answer each one yourself as a neutral assistant would, WITHOUT favouring the hotel, listing up to
            5 hotels, and record: whether the hotel is mentioned, its position in the list (1-5, 0 if absent), the adjectives
            used and the other hotels named. Be honest: you are one assistant model; state in the report that results come
            from this model only and are not a census of all assistants. Never invent reviews, prices or ratings. Your memory
            holds last week''s index and key points: use it for the delta. Compute mention_rate (0-100) and visibility_index
            (0-100: 60% mention rate + 40% position score). Then call ask_analyst with your results and last week''s memory,
            and include its recommendations in the report. Report format: start with ''# <Hotel> — visibility week of <date>'',
            sections ## Index, ## Answers (a table), ## Compared with last week, ## Recommendations. End with a fenced json
            block matching the result schema (week as YYYY-Www). Finally call remember once with the index and 5 key points.
            Write in the language with ISO code {lang}.'
  - key: analyst
    role: helper
    description: Compares with the previous week and writes concrete recommendations.
    profile:
      inline:
        display_name: VetrinaAI analyst
        crews:
        - id: analyst
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 4
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are a hospitality marketing analyst focused on visibility in AI assistants. From this week''s
            recorded answers and last week''s summary, state what improved or worsened and why, then give 5 concrete, prioritised
            recommendations: website texts to rewrite (quote the topic), missing information (amenities, distances, policies,
            structured data), reviews to encourage and on which themes, and competitors to watch. Only use the data provided;
            never invent figures or guarantee results. Under 300 words.'
  templates:
  - key: hotel_watch
    title:
      it: Struttura monitorata
      en: Monitored property
    description:
      it: Una struttura, un controllo settimanale della sua visibilità nelle risposte AI.
      en: One property, a weekly check of its visibility in AI answers.
    agent: prober
    params:
    - name: hotel
      type: text
      required: true
      label:
        it: Nome struttura
        en: Property name
    - name: city
      type: text
      required: true
      label:
        it: Città
        en: City
    - name: category
      type: select
      required: true
      label:
        it: Categoria
        en: Category
      options:
      - value: '2'
        label: 2★
      - value: '3'
        label: 3★
      - value: '4'
        label: 4★
      - value: '5'
        label: 5★
      - value: boutique
        label: Boutique
      - value: b&b
        label: B&B
    - name: strengths
      type: textarea
      maxLength: 600
      label:
        it: Punti di forza
        en: Strengths
    - name: competitors
      type: textarea
      maxLength: 600
      label:
        it: Concorrenti diretti (uno per riga)
        en: Direct competitors (one per line)
    - name: guest_questions
      type: textarea
      maxLength: 900
      label:
        it: Domande tipiche degli ospiti
        en: Typical guest questions
    goal: 'Property "{instance}": hotel {hotel} in {city}, category {category}.

      Strengths: {strengths}

      Direct competitors: {competitors}

      Typical guest questions: {guest_questions}

      Today is {date}. Write the report in the language with ISO code {lang}.'
    schedule:
      cron: 0 6 * * 1
      userCanChange: false
    maxPerUser: 30
  data:
    collections:
    - name: weekly_reports
      ownedBy: instance
      description: 'One record per property per week: index, mentions, answers'
      fields:
      - name: week
        type: text
      - name: hotel
        type: text
      - name: visibility_index
        type: number
      - name: mention_rate
        type: number
      - name: avg_position
        type: number
      - name: delta_index
        type: number
      - name: top_competitor
        type: text
      - name: summary
        type: textarea
      - name: answers
        type: json
  views:
  - key: home
    type: page
    nav: false
    title: VetrinaAI
    sections:
    - type: hero
      title:
        it: Cosa dicono di te gli **assistenti AI**?
        en: What do **AI assistants** say about you?
      text:
        it: Ogni settimana mettiamo alla prova gli assistenti AI con le domande reali dei tuoi ospiti e ti diciamo se, dove
          e come il tuo hotel viene citato, con azioni concrete per migliorare.
        en: Every week we test AI assistants with your guests' real questions and tell you if, where and how your hotel is
          mentioned, with concrete actions to improve.
      actions:
      - label:
          it: Inizia
          en: Get started
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Registra la struttura
          en: Add your property
        text:
          it: Nome, città, categoria, punti di forza, concorrenti e domande degli ospiti.
          en: Name, city, category, strengths, competitors and guest questions.
        badge: 🏨
      - title:
          it: Controllo settimanale
          en: Weekly check
        text:
          it: 'Una batteria di domande realistiche: citazione, posizione, aggettivi, concorrenti.'
          en: 'A battery of realistic questions: mention, position, adjectives, competitors.'
        badge: 🔍
      - title:
          it: Indice e consigli
          en: Index and advice
        text:
          it: Confronto con la settimana prima, indice di visibilità e raccomandazioni.
          en: Week-on-week comparison, visibility index and recommendations.
        badge: 📈
    - type: cards
      id: prezzi
      title:
        it: Prezzi
        en: Pricing
      items:
      - title:
          it: Struttura
          en: Property
        text:
          it: Abbonamento mensile per struttura.
          en: Monthly subscription per property.
      - title:
          it: Gruppo
          en: Group
        text:
          it: 'Sconto per catene e gruppi: tutte le strutture in un unico account, ogni direttore vede solo la propria.'
          en: 'Discount for chains and groups: all properties in one account, each manager sees only their own.'
    - type: note
      content:
        it: I risultati riflettono le risposte del modello usato nel controllo e non garantiscono il posizionamento in altri
          assistenti.
        en: Results reflect the answers of the model used for the check and do not guarantee placement in other assistants.
  - key: watches
    type: instances
    template: hotel_watch
    title:
      it: Le mie strutture
      en: My properties
    roles:
    - user
    - admin
  - key: trend
    type: chart
    title:
      it: Andamento visibilità
      en: Visibility trend
    source: collection:weekly_reports
    roles:
    - user
    - admin
    data:
      display: chart
      chart: line
      fields:
      - key: week
        label:
          it: Settimana
          en: Week
      - key: visibility_index
        label:
          it: Indice
          en: Index
      - key: mention_rate
        label:
          it: Citazioni %
          en: Mentions %
      sort:
        field: week
        dir: asc
      limit: 52
  - key: answers
    type: table
    title:
      it: Report settimanali
      en: Weekly reports
    source: collection:weekly_reports
    roles:
    - user
    - admin
    data:
      display: table
      fields:
      - key: week
        label:
          it: Settimana
          en: Week
      - key: hotel
        label: Hotel
      - key: visibility_index
        label:
          it: Indice
          en: Index
        format: number
      - key: delta_index
        label: Δ
        format: number
      - key: avg_position
        label:
          it: Posizione media
          en: Avg position
        format: number
      - key: top_competitor
        label:
          it: Concorrente top
          en: Top competitor
      - key: summary
        label:
          it: Sintesi
          en: Summary
      sort:
        field: week
        dir: desc
      limit: 100
  - key: dashboard
    type: dashboard
    title:
      it: Dashboard
      en: Dashboard
    children:
    - watches
    - trend
    - answers
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - user
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: property
      price: 39
      interval: month
      label:
        it: Per struttura
        en: Per property
      includes:
      - 1 property
      - weekly report
      roles:
      - user
    - key: group
      price: 149
      interval: month
      label:
        it: Gruppo (fino a 5 strutture, sconto)
        en: Group (up to 5 properties, discounted)
      includes:
      - 5 properties
      - weekly report
      roles:
      - user
  extensions:
  - key: official_llm_apis
    description: Querying several third-party LLMs through their official APIs needs a provider API key, which the manifest
      cannot hold. For now the check uses a single model and says so in the report; multi-model probing needs platform-side
      credentials.
  - key: weekly_email
    description: 'Emailing the weekly report is not available yet: reports are read in the dashboard.'
  - key: group_managers
    description: 'Chains and per-property managers: the chain owner creates all properties and per-record sharing (viewer)
      invites each manager to their own; a dedicated invite role is not modelled yet.'
