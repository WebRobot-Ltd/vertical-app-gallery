apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: vetrinaai
  displayName: VetrinaAI
  tagline:
    it: Scopri come gli assistenti AI parlano del tuo hotel.
    en: See how AI assistants talk about your hotel.
  description:
    it: Ogni settimana VetrinaAI interroga i principali modelli di intelligenza artificiale con le domande dei tuoi ospiti,
      misura se il tuo hotel viene citato e ti dà raccomandazioni concrete per migliorare la visibilità.
    en: Every week VetrinaAI asks the main AI models the questions your guests ask, measures whether your hotel is mentioned
      and gives you concrete recommendations to improve visibility.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: dashboard
  branding:
    theme: light
    palette:
      primary: '#12304a'
      accent: '#d9822b'
      background: '#f8f6f1'
      foreground: '#1c2229'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Vetrina
      color: primary
    - text: AI
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Prezzi
        en: Pricing
      href: '#prezzi'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      label:
        it: Albergatore / catena
        en: Hotelier / chain
      assignedBy: signup
    - key: director
      label:
        it: Direttore di struttura
        en: Property manager
      assignedBy: derived
      from: collection:hotels.director_email
  limits:
  - action: create:hotels
    max: 1
    window: total
    roles:
    - user
    plans:
      group: 5
      chain: -1
  egress:
    hosts:
    - api.openai.com
    - api.anthropic.com
    - generativelanguage.googleapis.com
    notes: Official APIs of the language models being measured, called with the app owner's own API keys (org credentials).
      Used only to ask public-style travel questions.
  agents:
  - key: prober
    role: scheduled
    description: Asks the main language models the guests' questions and records how the hotel is mentioned.
    memory: none
    profile:
      inline:
        display_name: VetrinaAI prober
        crews:
        - id: prober
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 80
          max_budget_usd: 2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You measure how AI assistants describe a hotel. Steps:

            1. Call read_hotel to get the hotel record (name, city, category, strengths, competitors, guest_questions, director_email).

            2. Build a battery of 8 to 10 realistic guest questions in Italian (and 2 in English if the city is touristic
            for foreigners): use the guest_questions of the record and add typical ones for the city and category (e.g. "miglior
            hotel per famiglie a Rimini", "hotel con spa vicino al centro di Firenze"). NEVER put the hotel''s own name in
            a question: the point is whether the models mention it spontaneously.

            3. For each question call the three tools ask_openai, ask_anthropic, ask_gemini. Requests:

            - ask_openai: POST body {"model":"gpt-5-mini","messages":[{"role":"user","content":"<question>"}]}; the answer
            is in choices[0].message.content.

            - ask_anthropic: POST body {"model":"claude-sonnet-5-5","max_tokens":800,"messages":[{"role":"user","content":"<question>"}]};
            the answer is in content[0].text.

            - ask_gemini: POST body {"contents":[{"parts":[{"text":"<question>"}]}]}; the answer is in candidates[0].content.parts[0].text.

            If a model''s key is not connected or the call fails, skip that model and say so in the report; never invent an
            answer.

            4. For each answer call append_answer with: hotel (name), director_email, week_date (today, YYYY-MM-DD), model,
            question, mentioned (true/false), position (1-based order of the hotel in the list, 0 if absent), adjectives (the
            adjectives/phrases used about the hotel), competitors (other hotels cited in the same answer, comma separated),
            excerpt (max 300 chars about the hotel or about the top-cited hotels if absent).

            5. At the end call append_scan once with hotel, director_email, week_date, questions_count.

            6. Write a short run report: first line "# Scansione VetrinaAI — <hotel> — <date>" (in English if the language
            is en), then totals per model: answers, mentions, average position, and the most frequent competitors. Only real
            data; never invent figures.'
          mcp_servers: []
    appTools:
    - name: read_hotel
      description: Read the registered hotels of the user
      action: read
      collection: hotels
      scope: user
    - name: ask_openai
      description: Ask an OpenAI model a question (official API)
      action: http
      http:
        method: POST
        url: https://api.openai.com/v1/chat/completions
        attribution: OpenAI API
        credential:
          provider: openai
        timeoutMs: 30000
    - name: ask_anthropic
      description: Ask a Claude model a question (official API)
      action: http
      http:
        method: POST
        url: https://api.anthropic.com/v1/messages
        headers:
          anthropic-version: '2023-06-01'
        attribution: Anthropic API
        credential:
          provider: anthropic
          header: x-api-key
          format: '{secret}'
        timeoutMs: 30000
    - name: ask_gemini
      description: Ask a Gemini model a question (official API)
      action: http
      http:
        method: POST
        url: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
        attribution: Google Gemini API
        credential:
          provider: gemini
          query: key
        timeoutMs: 30000
    - name: append_answer
      description: Record one model answer analysis
      action: append
      collection: answers
      scope: user
    - name: append_scan
      description: Record that a weekly scan is complete
      action: append
      collection: scans
      scope: user
    output: markdown
  - key: analyst
    role: analyst
    description: Compares this week with the previous one, computes the visibility index and writes recommendations.
    profile:
      inline:
        display_name: VetrinaAI analyst
        crews:
        - id: analyst
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 20
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are a hotel visibility analyst for AI assistants. You are started when a weekly scan of one
            hotel is complete.

            1. read_hotel for the hotel profile; read_answers for the answers of the hotel (this week and the previous ones);
            read_index for earlier weekly indexes.

            2. Compute for this week: mention_rate (% of answers that cite the hotel), avg_position (over mentions only),
            and the visibility index 0-100 = 70% mention_rate + 30% position score (position 1 = 100, 2 = 80, 3 = 60, 4 =
            40, 5+ = 20, computed on mentions). Compute delta against the previous week''s index (0 if none). Use only the
            recorded data; never invent figures.

            3. Call append_index once with: hotel, director_email, week_date, index, mention_rate, avg_position, delta, summary
            (3 lines), recommendations (markdown list).

            4. Reply with the report. First line "# VetrinaAI — <hotel> — settimana del <date>" (English if lang is en). Sections
            ## Visibilità e andamento (with a chart block), ## Come ti descrivono (adjectives, strengths vs. the declared
            ones), ## Concorrenti citati, ## Raccomandazioni (concrete: website texts to improve, missing information such
            as amenities, family services, distances, FAQ, reviews to stimulate on which topics, structured data). Add a chart
            as a fenced block:

            ```chart

            {"type":"bar","title":"Citazioni per modello","labels":["A","B"],"series":[{"name":"Citazioni","values":[1,2]}],"unit":"%"}

            ```

            with real figures. Do not promise results and do not state that a text change will make a model cite the hotel;
            say it is likely to help.'
          mcp_servers: []
    appTools:
    - name: read_hotel
      description: Read the registered hotels of the user
      action: read
      collection: hotels
      scope: user
    - name: read_answers
      description: Read the recorded model answers
      action: read
      collection: answers
      scope: user
    - name: read_index
      description: Read the weekly visibility indexes
      action: read
      collection: weekly_index
      scope: user
    - name: append_index
      description: Record the weekly visibility index and recommendations
      action: append
      collection: weekly_index
      scope: user
    output: markdown
  templates:
  - key: hotel_watch
    title:
      it: Monitoraggio struttura
      en: Property monitoring
    description:
      it: Ogni settimana interroga le AI sulla struttura scelta e produce il report.
      en: Every week asks the AIs about the chosen property and produces the report.
    agent: prober
    params:
    - name: hotel
      type: select
      required: true
      optionsFrom: collection:hotels
      label:
        it: Struttura
        en: Property
    goal: Run the weekly AI-visibility scan for the hotel record "{hotel}". Today is {date}. Write the report in the language
      with ISO code {lang}.
    schedule:
      cron: 0 5 * * 1
      userCanChange: false
    maxPerUser: 30
    roles:
    - user
    - admin
  triggers:
  - key: scan_done
    description: When a scan is complete, the analyst computes the index and recommendations
    'on':
      collection: scans
      op: insert
    start:
      agent: analyst
    goal: 'Analyse the weekly scan of the hotel {record.hotel} for the week {record.week_date}. Hotel director email: {record.director_email}.
      Write the report in the language with ISO code {lang}.'
  - key: report_ready
    description: Weekly report by email to the owner and to the property director
    'on':
      collection: weekly_index
      op: insert
    notify:
      to:
      - owner
      - record.director_email
      subject:
        it: 'VetrinaAI: indice di visibilità di {record.hotel} — {record.index}/100'
        en: 'VetrinaAI: visibility index of {record.hotel} — {record.index}/100'
      body:
        it: 'Settimana del {record.week_date}

          Indice: {record.index}/100 (variazione {record.delta})

          Citazioni: {record.mention_rate}%


          {record.summary}


          Raccomandazioni:

          {record.recommendations}'
        en: 'Week of {record.week_date}

          Index: {record.index}/100 (change {record.delta})

          Mentions: {record.mention_rate}%


          {record.summary}


          Recommendations:

          {record.recommendations}'
      link: dashboard
  views:
  - key: home
    type: page
    nav: false
    title: VetrinaAI
    sections:
    - type: hero
      layout: split
      band: true
      title:
        it: Come ti racconta l'**intelligenza artificiale**?
        en: How does **artificial intelligence** describe you?
      text:
        it: I tuoi ospiti chiedono consigli a ChatGPT, Claude e Gemini. VetrinaAI misura ogni settimana se il tuo hotel viene
          citato, in che posizione e accanto a chi, e ti dice cosa fare per migliorare.
        en: Your guests ask ChatGPT, Claude and Gemini for advice. VetrinaAI measures every week whether your hotel is mentioned,
          in which position and next to whom, and tells you what to do to improve.
      actions:
      - label:
          it: Inizia ora
          en: Get started
        href: /login
        style: primary
      aside: <div style="padding:16px;border-radius:12px;background:#fff"><b>Indice di visibilità</b><br><span style="font-size:40px">62/100</span><br>+8
        rispetto alla settimana scorsa<br><small>Citato in 14 risposte su 24</small></div>
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Registra la struttura
          en: Register your property
        text:
          it: Nome, città, categoria, punti di forza, concorrenti e domande tipiche degli ospiti.
          en: Name, city, category, strengths, competitors and typical guest questions.
        badge: 🏨
      - title:
          it: Interroghiamo le AI
          en: We query the AIs
        text:
          it: Ogni settimana una batteria di domande realistiche ai principali modelli, tramite le API ufficiali.
          en: Every week a battery of realistic questions to the main models, through their official APIs.
        badge: 🤖
      - title:
          it: Indice e raccomandazioni
          en: Index and recommendations
        text:
          it: Confronto con la settimana precedente, testi da migliorare, informazioni mancanti, recensioni da stimolare.
            Report anche via email.
          en: Comparison with last week, texts to improve, missing information, reviews to encourage. Report also by email.
        badge: 📈
    - type: cards
      id: prezzi
      title:
        it: Prezzi
        en: Pricing
      items:
      - title:
          it: Struttura singola · 49 €/mese
          en: Single property · €49/month
        text:
          it: Una struttura, report settimanale.
          en: One property, weekly report.
      - title:
          it: Gruppo · 199 €/mese
          en: Group · €199/month
        text:
          it: Fino a 5 strutture, con sconto, direttori con accesso alla propria.
          en: Up to 5 properties, discounted, managers see their own.
      - title:
          it: Catena · 399 €/mese
          en: Chain · €399/month
        text:
          it: Strutture illimitate, vista d'insieme.
          en: Unlimited properties, overview.
    - type: note
      content:
        it: 'Le risposte delle AI variano nel tempo: l''indice è un indicatore, non una garanzia di posizionamento.'
        en: 'AI answers vary over time: the index is an indicator, not a guarantee of ranking.'
  - key: hotel_new
    type: form
    title:
      it: Registra struttura
      en: Register property
    collection: hotels
    submit:
      label:
        it: Salva struttura
        en: Save property
      message:
        it: Struttura salvata. Ora attiva il monitoraggio.
        en: Property saved. Now start the monitoring.
      redirect: watches
    edit: true
    roles:
    - user
    - admin
  - key: hotels
    type: table
    title:
      it: Le mie strutture
      en: My properties
    source: collection:hotels
    columns:
    - name
    - city
    - category
    - director_email
    export: true
    roles:
    - user
    - admin
    - director
  - key: watches
    type: instances
    template: hotel_watch
    title:
      it: Monitoraggi
      en: Monitoring
    roles:
    - user
    - admin
  - key: dashboard
    type: dashboard
    title:
      it: Dashboard
      en: Dashboard
    children:
    - trend
    - latest
    - answers_table
    roles:
    - user
    - admin
    - director
  - key: trend
    type: chart
    title:
      it: Andamento indice di visibilità
      en: Visibility index trend
    source: collection:weekly_index
    data:
      display: chart
      chart: line
      fields:
      - key: week_date
        label:
          it: Settimana
          en: Week
        format: date
      - key: index
        label:
          it: Indice
          en: Index
        format: number
      groupBy:
        field: week_date
        bucket: week
        aggs:
        - key: index
          agg: avg
          field: index
    nav: false
  - key: latest
    type: table
    title:
      it: Report settimanali
      en: Weekly reports
    source: collection:weekly_index
    data:
      display: table
      fields:
      - key: week_date
        label:
          it: Settimana
          en: Week
        format: date
      - key: hotel
        label:
          it: Struttura
          en: Property
      - key: index
        label:
          it: Indice
          en: Index
        format: number
      - key: delta
        label:
          it: Variazione
          en: Change
        format: number
      - key: mention_rate
        label:
          it: '% citazioni'
          en: '% mentions'
        format: number
      - key: summary
        label:
          it: Sintesi
          en: Summary
      - key: recommendations
        label:
          it: Raccomandazioni
          en: Recommendations
      sort:
        field: week_date
        dir: desc
      limit: 50
    export: true
    nav: false
  - key: answers_table
    type: table
    title:
      it: Risposte delle AI
      en: AI answers
    source: collection:answers
    data:
      display: table
      fields:
      - key: week_date
        label:
          it: Settimana
          en: Week
        format: date
      - key: hotel
        label:
          it: Struttura
          en: Property
      - key: model
        label:
          it: Modello
          en: Model
        format: badge
      - key: question
        label:
          it: Domanda
          en: Question
      - key: mentioned
        label:
          it: Citato
          en: Mentioned
        format: badge
      - key: position
        label:
          it: Posizione
          en: Position
        format: number
      - key: adjectives
        label:
          it: Aggettivi
          en: Adjectives
      - key: competitors
        label:
          it: Concorrenti citati
          en: Competitors cited
      sort:
        field: week_date
        dir: desc
      limit: 200
    export: true
    nav: false
  - key: report
    type: report
    title:
      it: Report
      en: Report
    source: run
    printable: true
    nav: false
  - key: history
    type: history
    title:
      it: Scansioni
      en: Scans
    source: run
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - user
  data:
    collections:
    - name: hotels
      ownedBy: user
      description: Properties registered by the hotelier or chain
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome struttura
          en: Property name
      - name: city
        type: text
        required: true
        label:
          it: Città
          en: City
      - name: category
        type: select
        required: true
        label:
          it: Categoria
          en: Category
        options:
        - value: '2'
          label: 2★
        - value: '3'
          label: 3★
        - value: '4'
          label: 4★
        - value: '5'
          label: 5★
        - value: boutique
          label: Boutique
        - value: resort
          label: Resort
      - name: website
        type: url
        label:
          it: Sito web
          en: Website
      - name: strengths
        type: textarea
        required: true
        maxLength: 800
        label:
          it: Punti di forza
          en: Strengths
      - name: competitors
        type: textarea
        maxLength: 600
        label:
          it: Concorrenti diretti
          en: Direct competitors
      - name: guest_questions
        type: textarea
        maxLength: 1000
        label:
          it: Domande tipiche degli ospiti
          en: Typical guest questions
        help:
          it: Una per riga, es. miglior hotel per famiglie a Rimini
          en: One per line, e.g. best family hotel in Rimini
      - name: director_email
        type: email
        label:
          it: Email del direttore (facoltativa)
          en: Property manager email (optional)
      access:
      - role: director
        where:
          director_email: '{user.email}'
        can:
        - read
    - name: answers
      ownedBy: user
      description: One analysed answer of an AI model to a question
      retentionDays: 400
      fields:
      - name: hotel
        type: text
      - name: director_email
        type: email
      - name: week_date
        type: date
      - name: model
        type: text
      - name: question
        type: textarea
      - name: mentioned
        type: boolean
      - name: position
        type: number
      - name: adjectives
        type: text
      - name: competitors
        type: text
      - name: excerpt
        type: textarea
      access:
      - role: director
        where:
          director_email: '{user.email}'
        can:
        - read
    - name: scans
      ownedBy: user
      description: Marker of a completed weekly scan, starts the analyst
      retentionDays: 400
      fields:
      - name: hotel
        type: text
      - name: director_email
        type: email
      - name: week_date
        type: date
      - name: questions_count
        type: number
    - name: weekly_index
      ownedBy: user
      description: Weekly visibility index and recommendations per property
      fields:
      - name: hotel
        type: text
      - name: director_email
        type: email
      - name: week_date
        type: date
      - name: index
        type: number
      - name: mention_rate
        type: number
      - name: avg_position
        type: number
      - name: delta
        type: number
      - name: summary
        type: textarea
      - name: recommendations
        type: textarea
      access:
      - role: director
        where:
          director_email: '{user.email}'
        can:
        - read
    credentials:
    - provider: openai
      kind: api_key
      scope: org
      label: OpenAI API key
      help: API key of the app owner for the OpenAI official API
    - provider: anthropic
      kind: api_key
      scope: org
      label: Anthropic API key
      help: API key of the app owner for the Anthropic official API
    - provider: gemini
      kind: api_key
      scope: org
      label: Google Gemini API key
      help: API key of the app owner for the Gemini official API
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: single
      price: 49
      interval: month
      label:
        it: Struttura singola
        en: Single property
      roles:
      - user
    - key: group
      price: 199
      interval: month
      label:
        it: Gruppo (fino a 5 strutture)
        en: Group (up to 5 properties)
      roles:
      - user
    - key: chain
      price: 399
      interval: month
      label:
        it: Catena (illimitate)
        en: Chain (unlimited)
      roles:
      - user
  extensions:
  - key: group_discount_per_property
    description: Per-property monthly price with automatic volume discount is approximated by the group and chain plans; exact
      per-seat metering is not available yet.
