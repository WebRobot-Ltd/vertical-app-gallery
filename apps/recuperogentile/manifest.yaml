apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: recuperogentile
  displayName: RecuperoGentile
  tagline:
    it: Solleciti di pagamento automatici, ma sempre rispettosi.
  description:
    it: 'Per PMI, studi professionali e utility: importa le fatture scadute, segmenta i debitori, invia solleciti cortesi
      e gestisci rateizzazioni e contestazioni con l''approvazione di un operatore. Solo sollecito stragiudiziale del creditore.'
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f3a5f'
      accent: '#2a9d8f'
      background: '#f7f9fb'
      foreground: '#18222d'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Recupero
      color: primary
    - text: Gentile
      color: accent
  header:
    links:
    - label: Come funziona
      href: '#come-funziona'
    - label: Rispetto
      href: '#rispetto'
    cta:
      label: Accedi
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin azienda creditrice
      assignedBy: admin_emails
    - key: operator
      label: Operatore crediti
      assignedBy: invite
    - key: debtor
      label: Debitore
      assignedBy: derived
      from: collection:cases.debtor_email
  agents:
  - key: segmenter
    role: main
    description: Legge il file delle fatture scadute, segmenta i debitori per rischio e importo, sceglie la sequenza di contatto
      e crea le pratiche.
    appTools:
    - name: read_upload
      description: Legge un file caricato dall'utente
      action: read_file
    - name: write_case
      description: Crea o aggiorna una pratica di recupero
      action: write
      collection: cases
      scope: all
    profile:
      inline:
        display_name: RecuperoGentile segmentatore
        crews:
        - id: segmenter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''analista crediti di RecuperoGentile, una piattaforma di sollecito STRAGIUDIZIALE per conto
            del creditore (non sei un''agenzia di recupero). Ricevi un file di fatture scadute (debitore, email, telefono,
            importo, scadenza, giorni di ritardo, storico pagamenti). Per ogni riga crei una pratica con lo strumento write_case:
            debtor_name, debtor_email, debtor_phone, invoice_number, amount, due_date (AAAA-MM-GG), days_late, payment_history,
            risk (low|medium|high, in base a storico e ritardo), segment (es. ''piccolo-basso rischio'', ''grande-alto rischio''),
            sequence (testo: email cortese al primo ritardo, promemoria a 15 giorni, proposta di piano di rientro a 30; più
            cauta per importi piccoli e buoni pagatori, con più attenzione umana per importi grandi o storico problematico)
            e status ''open''. Se il file è un''immagine usa read_upload. Non inventare dati mancanti: lascia il campo vuoto
            e segnalalo. Tono sempre rispettoso, nessuna minaccia. Chiudi con un report che inizia con ''# Import fatture
            — <data>'' e contiene: numero di pratiche create, tabella dei segmenti (numero e importo totale), anomalie del
            file e un grafico ```chart {"type":"bar","title":"Importo per segmento","labels":[…],"series":[{"name":"€","values":[…]}]}
            ``` con cifre reali.'
    goalTemplate: 'Importa e segmenta le fatture scadute del file: {invoices}.

      {?invoices_text}Contenuto del file:

      {invoices_text}{/invoices_text}

      {?notes}Note dell''operatore: {notes}{/notes}

      Data di oggi: {date}. Scrivi in italiano.'
    output: markdown
    limits:
      maxTurns: 30
      maxBudgetUsd: 1.0
  - key: reply_reader
    role: helper
    description: Classifica la risposta di un debitore (contestazione, rateizzazione, promessa di pagamento) e prepara una
      bozza di risposta per l'operatore.
    appTools:
    - name: read_cases
      description: Cerca le pratiche di un debitore
      action: search
      collection: cases
      scope: all
    - name: write_case
      description: Crea o aggiorna una pratica di recupero
      action: write
      collection: cases
      scope: all
    output: markdown+json
    writesTo:
      collection: reply_reviews
      parse: json_last
      keyBy: reply_id
    profile:
      inline:
        display_name: RecuperoGentile lettore risposte
        crews:
        - id: reply_reader
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Leggi la risposta di un debitore a un sollecito di pagamento (sollecito stragiudiziale per conto
            del creditore). Trova la pratica con read_cases (per email). Capisci se il debitore: contesta (intent ''contestazione''),
            chiede una rateizzazione (''rateizzazione''), promette un pagamento (''promessa'') o altro (''altro''). Aggiorna
            la pratica con write_case: status ''promised'', ''plan_proposed'' o ''disputed'' di conseguenza. Scrivi una bozza
            di risposta cortese, chiara, senza minacce né pressioni, in italiano; non promettere sconti o piani non autorizzati
            e non dare consulenza legale. Ogni bozza passa da un operatore umano prima dell''invio. Rispondi con una breve
            nota e, come ultimo elemento, un blocco JSON con i campi: reply_id (id del messaggio ricevuto), case_id (numero
            fattura), debtor_email, intent, summary, draft, status (''pending_review'').'
    goalTemplate: 'Nuova risposta ricevuta.

      Mittente: {record.from_email}

      Oggetto: {record.subject}

      Riferimento: {record.case_ref}

      Id messaggio: {record.id}

      Testo:

      {record.body}

      Data: {date}.'
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.4
  inputForm:
    title: Importa fatture scadute
    fields:
    - name: invoices
      type: file
      required: true
      label: File fatture (CSV o Excel dal gestionale)
      accept:
      - csv
      - xlsx
      - pdf
      maxMb: 15
    - name: notes
      type: textarea
      maxLength: 500
      label: Note (facoltative)
  data:
    collections:
    - name: cases
      ownedBy: org
      description: Pratiche di sollecito (una per fattura scaduta)
      retentionDays: 1095
      fields:
      - name: debtor_name
        type: text
        required: true
        label: Debitore
      - name: debtor_email
        type: email
        required: true
        label: Email
      - name: debtor_phone
        type: text
        label: Telefono
      - name: invoice_number
        type: text
        label: Fattura
      - name: amount
        type: number
        label: Importo
      - name: due_date
        type: date
        label: Scadenza
      - name: days_late
        type: number
        label: Giorni di ritardo
      - name: payment_history
        type: textarea
        label: Storico pagamenti
      - name: risk
        type: select
        label: Rischio
        options:
        - value: low
          label: Basso
        - value: medium
          label: Medio
        - value: high
          label: Alto
      - name: segment
        type: text
        label: Segmento
      - name: sequence
        type: textarea
        label: Sequenza di contatto
      - name: status
        type: select
        label: Stato
        options:
        - value: open
          label: Aperta
        - value: promised
          label: Pagamento promesso
        - value: plan_proposed
          label: Piano proposto
        - value: disputed
          label: Contestata
        - value: paid
          label: Pagata
        - value: closed
          label: Chiusa
      - name: paid_amount
        type: number
        label: Incassato
      access:
      - role: operator
        can:
        - read
        - write
      - role: debtor
        where:
          debtor_email: '{user.email}'
        can:
        - read
    - name: replies
      ownedBy: org
      description: Email di risposta dei debitori inoltrate all'app
      retentionDays: 365
      fields:
      - name: from_email
        type: email
        label: Da
      - name: subject
        type: text
        label: Oggetto
      - name: body
        type: textarea
        label: Testo
      - name: case_ref
        type: text
        label: Riferimento pratica
      access:
      - role: operator
    - name: reply_reviews
      ownedBy: org
      description: Bozze di risposta da approvare da parte dell'operatore
      retentionDays: 365
      fields:
      - name: reply_id
        type: text
        label: Messaggio
      - name: case_id
        type: text
        label: Fattura
      - name: debtor_email
        type: email
        label: Email debitore
      - name: intent
        type: select
        label: Intento
        options:
        - value: contestazione
          label: Contestazione
        - value: rateizzazione
          label: Rateizzazione
        - value: promessa
          label: Promessa di pagamento
        - value: altro
          label: Altro
      - name: summary
        type: textarea
        label: Sintesi
      - name: draft
        type: textarea
        label: Bozza di risposta
      - name: status
        type: select
        label: Stato
        options:
        - value: pending_review
          label: Da approvare
        - value: approved
          label: 'Approvata: invia'
        - value: sent
          label: Inviata
        - value: discarded
          label: Scartata
      access:
      - role: operator
        can:
        - read
        - write
    - name: plan_requests
      ownedBy: user
      description: Piani di rientro scelti dal debitore
      retentionDays: 1095
      fields:
      - name: invoice_number
        type: text
        required: true
        label: Fattura
      - name: installments
        type: select
        required: true
        label: Numero di rate
        options:
        - value: '3'
          label: 3 rate
        - value: '6'
          label: 6 rate
        - value: '12'
          label: 12 rate
      - name: contact_email
        type: email
        required: true
        label: La tua email
      - name: notes
        type: textarea
        label: Note
      access:
      - role: operator
        can:
        - read
        - write
  views:
  - key: home
    type: page
    nav: false
    title: RecuperoGentile
    sections:
    - type: hero
      title: Solleciti di pagamento **automatici**, ma sempre rispettosi.
      text: Importa le fatture scadute, lascia che gli agenti AI scelgano il contatto giusto per ogni debitore e approva tu
        le risposte delicate. Ogni debitore ha una pagina personale e riservata.
      actions:
      - label: Accedi
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title: Come funziona
      items:
      - title: 1 · Importa
        text: 'Carica il file delle fatture scadute dal tuo gestionale: debitore, contatti, importo, scadenza, storico.'
      - title: 2 · Segmenta e sollecita
        text: 'L''agente classifica per rischio e importo: email cortese al primo ritardo, promemoria a 15 giorni, proposta
          di piano di rientro a 30.'
      - title: 3 · Leggi le risposte
        text: Un secondo agente capisce se il debitore contesta, chiede una rateizzazione o promette di pagare, e prepara
          la bozza di risposta.
      - title: 4 · Approva
        text: Rateizzazioni e contestazioni passano sempre da un operatore umano prima dell'invio.
    - type: cards
      id: rispetto
      title: Un recupero rispettoso
      items:
      - title: Solo sollecito stragiudiziale
        text: Agiamo per conto dell'azienda creditrice, senza attività di agenzia di recupero crediti.
      - title: Pagina personale
        text: Il debitore vede solo il proprio debito e può scegliere un piano di rientro.
      - title: Nessuna minaccia
        text: Toni cortesi e chiari, nessuna consulenza legale presentata come certa.
    - type: note
      content: RecuperoGentile · sollecito stragiudiziale per conto del creditore. Non siamo un'agenzia di recupero crediti.
  - key: import
    type: new_run
    title: Importa fatture
    roles:
    - admin
    - operator
  - key: imports
    type: history
    title: Importazioni
    source: run
    roles:
    - admin
    - operator
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: dashboard
    type: page
    title: Dashboard
    roles:
    - admin
    - operator
    sections:
    - type: data
      title: Incassato
      source: collection:cases
      display: kpi
      kpis:
      - label: Incassato
        agg: sum
        field: paid_amount
        format: money
      - label: Pratiche totali
        agg: count
    - type: data
      title: Pratiche aperte
      source: collection:cases
      display: kpi
      filters:
      - field: status
        op: '='
        value: open
      kpis:
      - label: Pratiche aperte
        agg: count
      - label: Da incassare
        agg: sum
        field: amount
        format: money
    - type: data
      title: Risposte ricevute (tasso di risposta)
      source: collection:replies
      display: kpi
      kpis:
      - label: Risposte dei debitori
        agg: count
    - type: data
      title: Pratiche per stato
      source: collection:cases
      display: chart
      chart: bar
      fields:
      - key: status
        label: Stato
      - key: count
        label: Pratiche
      groupBy:
        field: status
        aggs:
        - key: totale
          agg: sum
          field: amount
  - key: cases_table
    type: table
    title: Pratiche
    source: collection:cases
    columns:
    - debtor_name
    - invoice_number
    - amount
    - due_date
    - days_late
    - risk
    - segment
    - status
    - paid_amount
    export: true
    roles:
    - admin
    - operator
  - key: reviews
    type: table
    title: Risposte da approvare
    source: collection:reply_reviews
    columns:
    - debtor_email
    - case_id
    - intent
    - summary
    - draft
    - status
    roles:
    - admin
    - operator
  - key: reply_edit
    type: form
    title: Rivedi e approva risposta
    collection: reply_reviews
    fields:
    - draft
    - status
    edit: true
    submit:
      label: Salva
      message: 'Salvato. Se hai scelto «Approvata: invia», la risposta parte al debitore.'
      redirect: reviews
    roles:
    - admin
    - operator
    nav: false
  - key: plans
    type: table
    title: Piani richiesti
    source: collection:plan_requests
    columns:
    - invoice_number
    - installments
    - contact_email
    - notes
    roles:
    - admin
    - operator
  - key: my_debt
    type: page
    title: Il mio debito
    roles:
    - debtor
    sections:
    - type: text
      title: La tua posizione
      content: Qui vedi solo le tue fatture scadute. Se hai bisogno di più tempo puoi scegliere un piano di rientro.
    - type: data
      source: collection:cases
      display: cards
      fields:
      - key: invoice_number
        label: Fattura
      - key: amount
        label: Importo
        format: money
      - key: due_date
        label: Scadenza
        format: date
      - key: days_late
        label: Giorni di ritardo
      - key: status
        label: Stato
        format: badge
      empty: Non risultano fatture scadute.
    - type: view
      title: Scegli un piano
      view: plan_form
  - key: plan_form
    type: form
    title: Piano di rientro
    collection: plan_requests
    submit:
      label: Invia richiesta
      message: 'Richiesta inviata: un operatore la valuterà e ti risponderà.'
    roles:
    - debtor
    nav: false
  - key: account
    type: account
    title: Abbonamento
    roles:
    - admin
  triggers:
  - key: inbound_mail
    description: Email di risposta inoltrata all'app (webhook)
    'on':
      webhook: true
    write:
      collection: replies
      fields:
        from_email: from
        subject: subject
        body: text
        case_ref: case_ref
  - key: classify_reply
    'on':
      collection: replies
      op: insert
    start:
      agent: reply_reader
    asUser: false
    goal: 'Nuova risposta da {record.from_email}, oggetto {record.subject}, riferimento {record.case_ref}. Testo: {record.body}'
  - key: first_reminder
    description: Email cortese al primo giorno di ritardo
    'on':
      date:
        collection: cases
        field: due_date
        offsetDays: 1
        hour: 8
      where:
        status: open
    notify:
      to: record.debtor_email
      subject: 'Promemoria cortese: fattura {record.invoice_number}'
      body: 'Gentile {record.debtor_name},


        risulta scaduta la fattura {record.invoice_number} di € {record.amount}. Probabilmente si tratta di una svista: se
        ha già pagato ignori pure questo messaggio, altrimenti può regolarizzare o scriverci per qualsiasi chiarimento.


        Grazie e cordiali saluti.'
      link: my_debt
  - key: second_reminder
    description: Promemoria a 15 giorni
    'on':
      date:
        collection: cases
        field: due_date
        offsetDays: 15
        hour: 8
      where:
        status: open
    notify:
      to: record.debtor_email
      subject: 'Secondo promemoria: fattura {record.invoice_number}'
      body: 'Gentile {record.debtor_name},


        la fattura {record.invoice_number} di € {record.amount} risulta ancora da saldare. Può consultare la sua posizione
        nella pagina personale riservata. Per qualsiasi difficoltà o contestazione ci risponda a questa email.


        Cordiali saluti.'
      link: my_debt
  - key: plan_offer
    description: Proposta di piano di rientro a 30 giorni
    'on':
      date:
        collection: cases
        field: due_date
        offsetDays: 30
        hour: 8
      where:
        status: open
    notify:
      to: record.debtor_email
      subject: 'Possiamo aiutarla con un piano di rientro: fattura {record.invoice_number}'
      body: 'Gentile {record.debtor_name},


        la fattura {record.invoice_number} di € {record.amount} è scaduta da circa 30 giorni. Se salda in un''unica soluzione
        non è semplice, può scegliere un piano di rientro a rate dalla sua pagina personale. Un operatore lo valuterà con
        lei.


        Cordiali saluti.'
      link: my_debt
  - key: reply_approved
    description: Invio della risposta dopo l'approvazione dell'operatore
    'on':
      collection: reply_reviews
      op: update
      where:
        status: approved
    notify:
      to: record.debtor_email
      subject: 'Re: la sua fattura {record.case_id}'
      body: '{record.draft}'
  - key: plan_requested
    'on':
      collection: plan_requests
      op: insert
    notify:
      to: role:operator
      subject: 'Nuova richiesta di piano di rientro: fattura {record.invoice_number}'
      body: 'Un debitore ha richiesto un piano in {record.installments} rate per la fattura {record.invoice_number}. Contatto:
        {record.contact_email}.'
      link: plans
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: standard
      price: 149
      interval: month
      label: Canone mensile
      includes:
      - Import fatture
      - Agenti di segmentazione e lettura risposte
      - Pagina personale per i debitori
      - Dashboard
      roles:
      - admin
  notifications:
    emailOnRunDone: true
  extensions:
  - key: imap_inbox
    description: 'La lettura diretta di una casella IMAP non è disponibile: le risposte entrano inoltrando le email al webhook
      /api/hooks/inbound_mail (campi from, subject, text, case_ref) tramite una regola di inoltro del provider email.'
  - key: voice_whatsapp
    description: Chiamate vocali e messaggi WhatsApp non sono ancora disponibili. Quando lo saranno resteranno solo sollecito
      stragiudiziale del creditore, senza attività di agenzia di recupero.
  - key: card_payment
    description: Il pagamento con carta del debito da parte del debitore verso il creditore non è coperto dai pagamenti dell'app
      (che servono per i pacchetti del proprietario). Serve un link di pagamento del creditore da inserire nelle email.
  - key: success_fee
    description: 'La percentuale sul recuperato non è ancora addebitabile automaticamente: si fattura a parte partendo dal
      totale incassato in dashboard (campo paid_amount).'
  - key: accounting_connector
    description: 'Il connettore diretto al gestionale contabile non è incluso: l''import avviene da file CSV/Excel. Un connettore
      via chiave API può essere aggiunto per il gestionale scelto.'
