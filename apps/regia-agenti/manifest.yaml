  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 0
    metering:
      creditEur: 0.01
      markupPct: 40
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:designer:
        estimate: 20
        metered: true
      agent:checker:
        estimate: 15
        metered: true
      agent:executor:
        estimate: 25
        metered: true
      agent:communicator:
        estimate: 8
        metered: true
    packs:
    - key: extra
      credits: 50000
      price: 450
      label:
        it: Crediti extra
        en: Extra credits
    plans:
    - key: enterprise_year
      price: 24000
      interval: year
      label:
        it: Contratto annuale Enterprise
        en: Enterprise annual contract
      credits: 500000
      creditsReset: never
      includes:
      - all departments
      - full audit log
      - agent permissions
      roles:
      - admin
  extensions:
  - key: connector_gateway
    description: 'Tools system_read and system_write: calls to the ERP/CRM (OAuth connected by IT), internal HTTP APIs and
      existing MCP servers, enforcing the per-agent read/write rights in agent_permissions. Connectors needing the company''s
      own credentials and per-company internal hosts are not available yet in the generic runtime.'
  - key: auto_approval_switch
    description: A control for the process owner to switch a process from 'approval' to 'auto' (per system and action) after
      trusting it; for now the owner edits the autonomy field of the process.
  - key: department_scoping
    description: Departments are fixed roles (sales, finance, operations); more departments mean more roles and pages. Approvers
      are any process_owner, not only the owner of that department.
  - key: email_in_out
    description: Incoming email as a trigger (for now events are posted to the events collection or a webhook) and outgoing
      notifications (for now the communicator writes to the outbox shown in the app).
  - key: per_process_event_routing
    description: Events carry a process key; each process's own trigger condition is checked by the checker agent, not by
      the runtime.
