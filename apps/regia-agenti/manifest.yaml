apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: regia-agenti
  displayName: Regia Agenti
  tagline:
    it: Team di agenti che automatizzano i processi tra reparti, con approvazione umana e registro completo.
    en: Agent teams that automate cross-department processes, with human approval and a full audit log.
  description:
    it: 'Descrivi un flusso in linguaggio naturale: Regia Agenti progetta un team con ruoli separati (controllo, esecuzione,
      comunicazione). Ogni scrittura sui sistemi aziendali richiede approvazione finché non la rendi automatica. Ogni esecuzione
      lascia un registro consultabile.'
    en: 'Describe a workflow in plain words: Regia Agenti designs a team with separate roles (control, execution, communication).
      Every write to a company system needs approval until you make it automatic. Every run leaves a searchable log.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1d2b4a'
      accent: '#2f6fed'
      background: '#f6f7fb'
      foreground: '#161b26'
    fonts:
      body: Inter
      display: IBM Plex Sans
    wordmark:
    - text: Regia
      color: primary
    - text: Agenti
      color: accent
    width: wide
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Sicurezza
        en: Safety
      href: '#controllo'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label:
        it: Admin IT
        en: IT admin
      assignedBy: admin_emails
    - key: cio
      label: CIO
      assignedBy: invite
    - key: manager
      label:
        it: Responsabile di processo
        en: Process owner
      assignedBy: invite
    - key: user
      label:
        it: Dipendente
        en: Employee
      assignedBy: signup
  limits:
  - action: agent:designer
    per: user
    max: 20
    window: day
  agents:
  - key: designer
    role: main
    description: Turns a plain-language workflow into a process specification with separate roles.
    profile:
      inline:
        display_name: Process designer
        crews:
        - id: designer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You design automated business processes for large companies. Given a workflow described in plain
            words, write a specification. Start with a level-1 title "# <Process name>". Sections with ## headings: Trigger
            (event or schedule, with conditions e.g. thresholds), Systems needed (for each: read or write, using the registered
            connections you can read with the tool list_connections), Control agent (checks, what it reads, pass/fail criteria),
            Execution agent (steps, which are WRITES to company systems and therefore need human approval), Communication
            agent (who is notified, message drafts), Failure handling, Audit log (what is recorded). Add a table of steps:
            step, agent, reads, writes, approval needed (yes for every write). Never invent systems that are not registered;
            flag them as ''to connect''. Do not claim anything has been executed. Answer in the report language.'
    appTools:
    - name: list_connections
      description: List the company systems registered by the IT admin and what each agent may read or write
      action: read
      collection: connections
      scope: all
    goalTemplate: 'Process name: {name}

      Department: {department}

      Trigger type: {trigger_kind_label}

      Workflow description: {description}

      Write the specification in the language with ISO code {lang}.'
    output: markdown
    limits:
      maxTurns: 6
      maxBudgetUsd: 0.5
  - key: controller
    role: helper
    description: 'Control agent: validates the event against the process rules and the registered systems.'
    profile:
      inline:
        display_name: Control agent
        crews:
        - id: controller
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the CONTROL agent of an automated business process. You only read; you never write to company
            systems. From the event given in your task and the process definitions (list_processes) decide whether the process
            applies, check the conditions (thresholds, credit, stock, etc.) using only data you can actually read through
            registered connections (list_connections) and state clearly what you could not verify. Start with "# Control —
            <process> — <result>". Sections: Event, Checks (table: check, source, result), Verdict (proceed / stop / needs
            human), Handoff to execution. Never invent figures. Record what you did with audit_append (actor control, action,
            systems read, outcome, members copied from the process).'
    appTools:
    - name: list_processes
      description: Read the defined processes
      action: read
      collection: processes
      scope: all
    - name: list_connections
      description: List the company systems registered by the IT admin and what each agent may read or write
      action: read
      collection: connections
      scope: all
    - name: audit_append
      description: 'Append one entry to the audit log: who did what'
      action: append
      collection: audit_log
      scope: all
    goalTemplate: 'Carry out your role on the incoming event described in your task.

      Today is {date}. Write in the language with ISO code {lang}.'
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.5
  - key: executor
    role: helper
    description: 'Execution agent: performs the steps; every write waits for human approval unless the process is set to automatic.'
    profile:
      inline:
        display_name: Execution agent
        crews:
        - id: executor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the EXECUTION agent. You receive the control agent''s verdict. If it is not ''proceed'',
            stop and say why. For each step that WRITES to a company system: read the process (list_processes); if its auto_write
            field is not true you MUST call request_write_approval with the exact system, operation and payload, and do nothing
            until it is approved. Only write within the permissions registered in the connections (list_connections); if a
            write is not allowed, do not attempt it. Start with "# Execution — <process>". Sections: Steps done, Steps waiting
            for approval, Steps refused. Record every step with audit_append (actor execution, action, system, payload summary,
            approval status, outcome, members copied from the process). Never claim a write happened unless it did.'
    appTools:
    - name: list_processes
      description: Read the defined processes
      action: read
      collection: processes
      scope: all
    - name: list_connections
      description: List the company systems registered by the IT admin and what each agent may read or write
      action: read
      collection: connections
      scope: all
    - name: audit_append
      description: 'Append one entry to the audit log: who did what'
      action: append
      collection: audit_log
      scope: all
    awaits:
    - write_approval
    goalTemplate: 'Carry out your role on the incoming event described in your task.

      Today is {date}. Write in the language with ISO code {lang}.'
    output: markdown
    limits:
      maxTurns: 10
      maxBudgetUsd: 0.6
  - key: communicator
    role: helper
    description: 'Communication agent: summarises the outcome and drafts the messages to the people concerned.'
    profile:
      inline:
        display_name: Communication agent
        crews:
        - id: communicator
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 5
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the COMMUNICATION agent. From the work of the previous agents write the final summary and
            the messages for the people concerned (e.g. the sales rep, the customer, the finance team). Start with "# Outcome
            — <process>". Sections: What happened, What is pending approval, Messages (one block per recipient: to, subject,
            text). Be factual; never state something as done if it is pending or failed. Record the closing entry with audit_append
            (actor communication, action, recipients, outcome, members copied from the process).'
    appTools:
    - name: list_processes
      description: Read the defined processes
      action: read
      collection: processes
      scope: all
    - name: audit_append
      description: 'Append one entry to the audit log: who did what'
      action: append
      collection: audit_log
      scope: all
    goalTemplate: 'Carry out your role on the incoming event described in your task.

      Today is {date}. Write in the language with ISO code {lang}.'
    output: markdown
    limits:
      maxTurns: 5
      maxBudgetUsd: 0.3
  teams:
  - key: process_team
    mode: sequence
    title:
      it: Team di processo
      en: Process team
    steps:
    - agent: controller
    - agent: executor
      after:
      - controller
    - agent: communicator
      after:
      - executor
    maxMinutes: 30
  approvals:
  - key: write_approval
    title:
      it: Approva scrittura su sistema aziendale
      en: Approve write to a company system
    description: An execution agent wants to write to a company system.
    role: manager
    decidedBy: role
    fields:
    - system
    - operation
    - payload
    - process
    timeoutMinutes: 2880
    onTimeout: reject
  triggers:
  - key: incoming_event
    description: Webhook for events from ERP, CRM, mail gateways or other systems
    'on':
      webhook: true
    start:
      team: process_team
    goal: 'Process this event according to the defined processes: {event}'
    asUser: false
  - key: daily_processes
    description: Scheduled processes
    'on':
      cron: 0 5 * * *
    start:
      team: process_team
    goal: 'Scheduled run. Read the processes with trigger_kind schedule and run those due today. Event: {event}'
    asUser: false
  - key: failure_alert
    'on':
      collection: audit_log
      op: insert
      where:
        outcome: failed
    notify:
      to:
      - role:manager
      - role:cio
      subject:
        it: 'Esecuzione fallita: {record.process}'
        en: 'Run failed: {record.process}'
      body:
        it: Un'azione del processo {record.process} è fallita ({record.action}). Controlla il registro.
        en: An action of process {record.process} failed ({record.action}). Check the audit log.
      link: audit
  inputForm:
    title:
      it: Descrivi un processo
      en: Describe a process
    fields:
    - name: name
      type: text
      required: true
      label:
        it: Nome del processo
        en: Process name
    - name: department
      type: text
      required: true
      label:
        it: Reparto
        en: Department
    - name: trigger_kind
      type: select
      required: true
      label:
        it: Avvio
        en: Start
      options:
      - value: event
        label:
          it: Evento (nuovo record, email, webhook)
          en: Event (new record, email, webhook)
      - value: schedule
        label:
          it: Pianificazione
          en: Schedule
    - name: description
      type: textarea
      required: true
      maxLength: 2000
      label:
        it: Il flusso in parole tue
        en: The workflow in your words
      help:
        it: es. quando arriva un ordine sopra i 50.000 euro verifica il credito del cliente, controlla il magazzino, prepara
          la conferma e avvisa il commerciale
        en: e.g. when an order over 50,000 euro arrives, check the customer's credit, check stock, prepare the confirmation
          and notify the sales rep
  data:
    collections:
    - name: processes
      ownedBy: org
      description: Defined processes, by department
      retentionDays: 3650
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome
          en: Name
      - name: department
        type: text
        required: true
        label:
          it: Reparto
          en: Department
      - name: trigger_kind
        type: select
        options:
        - event
        - schedule
        label:
          it: Avvio
          en: Start
      - name: specification
        type: textarea
        label:
          it: Specifica (dal progettista)
          en: Specification (from the designer)
      - name: auto_write
        type: boolean
        default: false
        label:
          it: Scritture automatiche senza approvazione
          en: Automatic writes without approval
      - name: members
        type: array
        label:
          it: Email dei dipendenti del reparto
          en: Department employees' emails
      access:
      - role: manager
        can:
        - read
        - write
      - role: cio
      - role: user
        where:
          members: '{user.email}'
    - name: connections
      ownedBy: org
      description: Company systems registered by the IT admin (no secrets here) and per-agent permissions
      fields:
      - name: system
        type: text
        required: true
        label:
          it: Sistema
          en: System
      - name: kind
        type: select
        required: true
        options:
        - erp
        - crm
        - internal_api
        - mcp
        label:
          it: Tipo
          en: Type
      - name: endpoint
        type: url
        label: Endpoint
      - name: agent_can_read
        type: textarea
        label:
          it: Cosa può leggere ogni agente
          en: What each agent may read
      - name: agent_can_write
        type: textarea
        label:
          it: Cosa può scrivere ogni agente
          en: What each agent may write
      - name: notes
        type: textarea
        label:
          it: Note
          en: Notes
      access:
      - role: cio
    - name: audit_log
      ownedBy: org
      description: Who did what in every execution
      retentionDays: 2555
      fields:
      - name: process
        type: text
      - name: actor
        type: text
      - name: action
        type: text
      - name: system
        type: text
      - name: approval
        type: text
      - name: outcome
        type: text
      - name: detail
        type: textarea
      - name: members
        type: array
      access:
      - role: cio
      - role: manager
      - role: user
        where:
          members: '{user.email}'
  views:
  - key: home
    type: page
    title: Regia Agenti
    nav: false
    sections:
    - type: hero
      layout: stack
      band: true
      eyebrow:
        it: Per grandi aziende
        en: For large companies
      title:
        it: Processi tra reparti, eseguiti da **team di agenti** sotto il tuo controllo.
        en: Cross-department processes run by **agent teams** under your control.
      text:
        it: Descrivi il flusso in linguaggio naturale. Regia Agenti crea agenti con ruoli separati di controllo, esecuzione
          e comunicazione. Ogni scrittura richiede la tua approvazione e ogni esecuzione lascia un registro completo.
        en: Describe the flow in plain words. Regia Agenti creates agents with separate control, execution and communication
          roles. Every write needs your approval and every run leaves a complete log.
      actions:
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: L'IT collega i sistemi
          en: IT connects systems
        text:
          it: Registra ERP, CRM, API interne e server MCP e decidi cosa ogni agente può leggere e scrivere.
          en: Register ERP, CRM, internal APIs and MCP servers and set what each agent may read and write.
      - title:
          it: Il responsabile descrive il flusso
          en: The process owner describes the flow
        text:
          it: Il progettista traduce la descrizione in una specifica con ruoli separati.
          en: The designer turns the description into a specification with separate roles.
      - title:
          it: Eventi o pianificazioni
          en: Events or schedules
        text:
          it: 'Un webhook o un orario avvia il team: controllo, esecuzione, comunicazione.'
          en: 'A webhook or a schedule starts the team: control, execution, communication.'
    - type: cards
      id: controllo
      title:
        it: Controllo e tracciabilità
        en: Control and traceability
      items:
      - title:
          it: Approvazione umana
          en: Human approval
        text:
          it: Nessuna scrittura senza approvazione, finché il responsabile non la rende automatica.
          en: No write without approval until the owner makes it automatic.
      - title:
          it: Registro completo
          en: Full audit log
        text:
          it: Chi ha fatto cosa, su quale sistema, con quale esito. Esportabile in CSV.
          en: Who did what, on which system, with what outcome. CSV export.
      - title:
          it: Visibilità per reparto
          en: Visibility by department
        text:
          it: I dipendenti vedono solo i processi del loro reparto; il CIO vede tutto.
          en: Employees see only their department's processes; the CIO sees everything.
    - type: note
      content:
        it: Le scritture sui sistemi sono sempre soggette ai permessi registrati dall'admin IT.
        en: Writes to systems always follow the permissions registered by the IT admin.
  - key: new_process
    type: new_run
    title:
      it: Progetta un processo
      en: Design a process
    roles:
    - manager
    - admin
  - key: designs
    type: history
    title:
      it: Progetti
      en: Designs
    source: run
    roles:
    - manager
    - admin
  - key: design
    type: report
    source: run
    printable: true
    nav: false
  - key: save_process
    type: form
    title:
      it: Salva processo
      en: Save process
    collection: processes
    edit: true
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Processo salvato.
        en: Process saved.
      redirect: processes
    roles:
    - manager
    - admin
  - key: processes
    type: table
    title:
      it: Processi
      en: Processes
    source: collection:processes
    columns:
    - name
    - department
    - trigger_kind
    - auto_write
    export: true
    roles:
    - user
    - manager
    - cio
    - admin
  - key: approvals_view
    type: approvals
    title:
      it: Approvazioni
      en: Approvals
    roles:
    - manager
    - admin
  - key: audit
    type: table
    title:
      it: Registro esecuzioni
      en: Audit log
    source: collection:audit_log
    columns:
    - process
    - actor
    - action
    - system
    - approval
    - outcome
    - detail
    export: true
    roles:
    - user
    - manager
    - cio
    - admin
  - key: connect_system
    type: form
    title:
      it: Collega sistema
      en: Connect system
    collection: connections
    edit: true
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Sistema registrato.
        en: System registered.
      redirect: systems
    roles:
    - admin
  - key: systems
    type: table
    title:
      it: Sistemi collegati
      en: Connected systems
    source: collection:connections
    columns:
    - system
    - kind
    - endpoint
    - agent_can_read
    - agent_can_write
    roles:
    - admin
    - cio
  - key: account
    type: account
    title:
      it: Contratto e crediti
      en: Contract and credits
    roles:
    - admin
    - cio
    - manager
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 0
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:designer:
        estimate: 10
        metered: true
      agent:controller:
        estimate: 10
        metered: true
      agent:executor:
        estimate: 15
        metered: true
      agent:communicator:
        estimate: 5
        metered: true
    plans:
    - key: enterprise
      price: 24000
      interval: year
      label:
        it: Contratto annuale Enterprise
        en: Enterprise annual contract
      credits: 500000
      creditsReset: never
      roles:
      - admin
    packs:
    - key: extra
      credits: 50000
      price: 450
      label:
        it: Crediti aggiuntivi
        en: Extra credits
  notifications:
    emailOnRunDone: false
  extensions:
  - key: oauth_connectors
    description: 'OAuth sign-in to ERP and CRM is not available yet: for now systems are reached via API keys (credentials),
      internal HTTP APIs and existing MCP servers, which must be added with their exact hosts once known.'
  - key: existing_mcp_servers
    description: 'Connecting the company''s existing MCP servers and internal APIs needs their URLs: add them as mcp_servers
      on the agents and http tools with egress hosts.'
  - key: per_department_roles
    description: Department visibility uses the members list of each process; a role per department is not modelled.
  - key: auto_process_teams
    description: Automatic creation of a dedicated agent team per process from the specification is not available; all processes
      share one control-execution-communication team.
