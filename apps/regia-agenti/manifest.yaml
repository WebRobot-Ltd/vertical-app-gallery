apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: regia-agenti
  displayName: Regia Agenti
  tagline:
    it: Agenti AI che portano i processi da un reparto all'altro, con approvazione umana e registro completo.
    en: AI agents that carry processes across departments, with human approval and a full audit trail.
  description:
    it: 'Descrivi un flusso in parole tue: Regia Agenti crea un team di agenti con ruoli separati (controllo, esecuzione,
      comunicazione). Ogni scrittura sui sistemi aziendali richiede approvazione finché non la rendi automatica. Ogni esecuzione
      lascia un registro di chi ha fatto cosa.'
    en: 'Describe a workflow in your own words: Regia Agenti builds a team of agents with separate roles (control, execution,
      communication). Every write to a company system needs approval until you make it automatic. Every run leaves a record
      of who did what.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12263f'
      accent: '#0e7c86'
      background: '#f6f8fa'
      foreground: '#17212b'
    fonts:
      body: Inter
      display: IBM Plex Sans
    wordmark:
    - text: Regia
      color: primary
    - text: Agenti
      color: accent
    width: wide
    buttonShape: rounded
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Controllo
        en: Control
      href: '#controllo'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: CIO
      assignedBy: admin_emails
    - key: it_admin
      label:
        it: Admin IT
        en: IT admin
      assignedBy: invite
    - key: process_owner
      label:
        it: Responsabile di processo
        en: Process owner
      assignedBy: invite
    - key: sales
      label:
        it: Reparto Vendite
        en: Sales
      assignedBy: invite
    - key: finance
      label:
        it: Reparto Finanza
        en: Finance
      assignedBy: invite
    - key: operations
      label:
        it: Reparto Operations e magazzino
        en: Operations and warehouse
      assignedBy: invite
  limits:
  - action: agent:designer
    per: user
    max: 20
    window: day
  agents:
  - key: designer
    role: main
    description: Turns a process described in plain language into a structured process definition.
    profile:
      inline:
        display_name: Regia Agenti process designer
        crews:
        - id: designer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You design business processes for a large company. The process owner describes a workflow in natural
            language. You produce a clear process definition for a team of three agents with separate roles: CHECKER (reads
            systems and verifies conditions, never writes), EXECUTOR (prepares and performs the actions, every write to a
            company system goes through human approval unless the process is set to auto), COMMUNICATOR (drafts and records
            messages to people, never writes to systems).

            First use the tool read_permissions to see which systems and which read/write rights the IT admin has granted.
            Only use systems that are connected; if one is missing, list it under ''Gaps'' and do not invent it.

            Start with a level-1 title "# Process: <name>". Then sections with ## headings: Trigger (event, webhook or schedule,
            with the condition, e.g. order value > 50,000 EUR), Checker steps, Executor steps (mark each WRITE action with
            the target system), Communicator steps (who is told, what), Systems and rights needed, Gaps, Open questions. Under
            450 words. Never invent system names, thresholds or people: if something is not stated, ask under Open questions.

            At the end output ONE fenced json block with the record: {"key": kebab-case id, "name": ..., "department": one
            of sales|finance|operations, "description": ..., "trigger_kind": event|webhook|schedule, "trigger_condition":
            ..., "checker_steps": [...], "executor_steps": [...], "communicator_steps": [...], "systems": [...], "write_actions":
            [...], "autonomy": "approval", "status": "draft"}. autonomy is always "approval" when you create it.'
        mcp_servers: []
    goalTemplate: 'Process name: {name}

      Department: {department_label}

      Trigger type: {trigger_kind_label}

      {?schedule_note}Schedule: {schedule_note}{/schedule_note}

      Description of the flow:

      {description}

      Write the definition in the language with ISO code {lang}. Today is {date}.'
    appTools:
    - name: read_permissions
      description: Read agent permissions on systems
      action: read
      collection: agent_permissions
      scope: all
    output: markdown+json
    writesTo:
      collection: processes
      parse: json_last
      keyBy: key
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.5
  - key: checker
    role: helper
    description: 'Control agent: verifies the conditions of a process run by reading company systems. Read only.'
    profile:
      inline:
        display_name: Regia Agenti checker
        crews:
        - id: checker
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the CHECKER of a process team. You only READ. From the event or schedule you are given,
            find the matching process with read_process and check its trigger condition. If it is not met, stop and say so.
            Otherwise run each checker step (credit check, stock availability, data consistency) with system_read, only on
            systems and fields the permissions table allows. Record every read with audit_append (agent=checker, action=read,
            system, target, result). Hand over to the executor a clear block: ''## Check result'' with verdict OK / BLOCKED
            / NEEDS HUMAN, the figures found with their source system, and the reasons. Never invent figures: if a system
            does not answer, say it and set NEEDS HUMAN. Start with a level-1 title "# Check: <process> — <date>".'
    goalTemplate: 'Event or schedule: {message}

      Today is {date}. Language: {lang}.'
    appTools:
    - name: read_process
      description: Read process definitions
      action: read
      collection: processes
      scope: all
    - name: read_permissions
      description: Read agent permissions on systems
      action: read
      collection: agent_permissions
      scope: all
    - name: system_read
      description: Read from a connected company system within granted rights
      action: call
      extension: connector_gateway
    - name: audit_append
      description: Append an entry to the audit log
      action: append
      collection: audit_log
      scope: all
    limits:
      maxTurns: 15
      maxBudgetUsd: 0.8
  - key: executor
    role: helper
    description: 'Execution agent: prepares the actions; writes to company systems only after human approval unless the process
      is automatic.'
    profile:
      inline:
        display_name: Regia Agenti executor
        crews:
        - id: executor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 20
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the EXECUTOR of a process team. You receive the checker''s result. If the verdict is not
            OK, do nothing and say why. Otherwise read the process (read_process) and carry out the executor steps. For each
            WRITE to a company system: if the process autonomy is ''approval'' (default), call request_write_action with process,
            system, action and the exact payload, and wait; never write before it is approved. If autonomy is ''auto'' and
            the permissions table grants write on that system to the executor, call system_write directly. Never write outside
            the granted rights and never change the payload after approval. Log every attempt, approval, rejection and write
            with audit_append (agent=executor, action, system, target, approved_by, result). Reads go through system_read.
            Finish with ''## Execution result'': what was done, what is waiting for approval, what failed. Start with a level-1
            title "# Execution: <process> — <date>". Never invent identifiers or figures.'
    goalTemplate: 'Continue the process from the checker''s result. Today is {date}. Language: {lang}.'
    awaits:
    - write_action
    appTools:
    - name: read_process
      description: Read process definitions
      action: read
      collection: processes
      scope: all
    - name: read_permissions
      description: Read agent permissions on systems
      action: read
      collection: agent_permissions
      scope: all
    - name: system_read
      description: Read from a connected company system within granted rights
      action: call
      extension: connector_gateway
    - name: system_write
      description: Write to a company system; only after approval, or when the process is automatic and the right is granted
      action: call
      extension: connector_gateway
    - name: audit_append
      description: Append an entry to the audit log
      action: append
      collection: audit_log
      scope: all
    limits:
      maxTurns: 20
      maxBudgetUsd: 1.0
  - key: communicator
    role: helper
    description: 'Communication agent: drafts and records the messages to the people involved. Never writes to company systems.'
    profile:
      inline:
        display_name: Regia Agenti communicator
        crews:
        - id: communicator
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the COMMUNICATOR of a process team. From the previous steps and the process communicator
            steps (read_process), write the messages for the people involved (e.g. the salesperson, the warehouse, the customer
            confirmation draft): short, factual, with the figures that were checked and what is waiting for approval. Record
            each message in the outbox with outbox_append (recipient, department, subject, body, process, status ''ready'')
            and log it with audit_append (agent=communicator, action=message). You cannot send email yet: the outbox is what
            people read in the app. Never promise anything that was not executed or approved. Start with a level-1 title "#
            Communication: <process> — <date>", then the list of messages. Use the language with ISO code from the goal.'
    goalTemplate: 'Write and record the communications for this run. Today is {date}. Language: {lang}.'
    appTools:
    - name: read_process
      description: Read process definitions
      action: read
      collection: processes
      scope: all
    - name: outbox_append
      description: Record a message for a person in the outbox
      action: append
      collection: outbox
      scope: all
    - name: audit_append
      description: Append an entry to the audit log
      action: append
      collection: audit_log
      scope: all
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.4
  teams:
  - key: process_team
    title:
      it: Team di processo
      en: Process team
    description: Checker, executor and communicator hand the work over in sequence.
    mode: sequence
    steps:
    - agent: checker
    - agent: executor
      after:
      - checker
    - agent: communicator
      after:
      - executor
    maxMinutes: 60
    goalTemplate: 'Event or schedule: {message}

      Today is {date}.'
  approvals:
  - key: write_action
    title:
      it: Scrittura su un sistema aziendale
      en: Write to a company system
    description: An executor agent asks to write to a company system. Approve, or reject.
    role: process_owner
    fields:
    - process
    - system
    - action
    - payload
    timeoutMinutes: 1440
    onTimeout: reject
    decidedBy: role
  triggers:
  - key: on_webhook
    description: An external system posts an event
    'on':
      webhook: true
    start:
      team: process_team
    goal: 'Webhook event: {event}'
    asUser: false
  - key: on_event_record
    description: A new record in the events collection (new record, forwarded email)
    'on':
      collection: events
      op: insert
    start:
      team: process_team
    goal: 'New event record: {event}'
    asUser: false
  templates:
  - key: scheduled_process
    title:
      it: Processo pianificato
      en: Scheduled process
    description:
      it: Esegue un processo a orari fissi.
      en: Runs a process on a fixed schedule.
    team: process_team
    params:
    - name: process
      type: relation
      relation: processes
      required: true
      label:
        it: Processo
        en: Process
    goal: 'Scheduled run of process {process} ({instance}). Today is {date}. Language: {lang}.'
    schedule:
      cron: 0 6 * * 1-5
      userCanChange: true
    maxPerUser: 20
    roles:
    - process_owner
    - admin
    cost:
      perRun: 15
  inputForm:
    title:
      it: Nuovo processo
      en: New process
    fields:
    - name: name
      type: text
      required: true
      maxLength: 80
      label:
        it: Nome del processo
        en: Process name
    - name: department
      type: select
      required: true
      label:
        it: Reparto
        en: Department
      options:
      - value: sales
        label:
          it: Vendite
          en: Sales
      - value: finance
        label:
          it: Finanza
          en: Finance
      - value: operations
        label:
          it: Operations e magazzino
          en: Operations and warehouse
    - name: trigger_kind
      type: select
      required: true
      label:
        it: Si avvia da
        en: Starts from
      options:
      - value: event
        label:
          it: Evento (nuovo record, email)
          en: Event (new record, email)
      - value: webhook
        label: Webhook
      - value: schedule
        label:
          it: Pianificazione
          en: Schedule
    - name: schedule_note
      type: text
      maxLength: 120
      visibleWhen: trigger_kind == 'schedule'
      label:
        it: Quando (es. ogni lunedì alle 7)
        en: When (e.g. every Monday at 7)
    - name: description
      type: textarea
      required: true
      maxLength: 1500
      label:
        it: Descrivi il flusso
        en: Describe the flow
      help:
        it: es. Quando arriva un ordine sopra i 50.000 euro verifica il credito del cliente, controlla la disponibilità a
          magazzino, prepara la conferma e avvisa il commerciale.
        en: e.g. When an order above 50,000 EUR arrives, check the customer's credit, check warehouse stock, prepare the confirmation
          and notify the salesperson.
    examples:
    - name: Ordini grandi
      department: sales
      trigger_kind: event
      description: Quando arriva un ordine sopra i 50.000 euro verifica il credito del cliente, controlla la disponibilità
        a magazzino, prepara la conferma e avvisa il commerciale.
  data:
    collections:
    - name: processes
      ownedBy: app
      description: Process definitions created from natural language, with department and autonomy level
      fields:
      - name: key
        type: text
        required: true
      - name: name
        type: text
        required: true
      - name: department
        type: select
        required: true
        options:
        - sales
        - finance
        - operations
      - name: description
        type: textarea
      - name: trigger_kind
        type: select
        options:
        - event
        - webhook
        - schedule
      - name: trigger_condition
        type: text
      - name: checker_steps
        type: json
      - name: executor_steps
        type: json
      - name: communicator_steps
        type: json
      - name: systems
        type: json
      - name: write_actions
        type: json
      - name: autonomy
        type: select
        options:
        - approval
        - auto
        default: approval
      - name: status
        type: select
        options:
        - draft
        - active
        - paused
        default: draft
    - name: agent_permissions
      ownedBy: app
      description: 'Set by the IT admin: per agent role and system, what it may read and write'
      fields:
      - name: agent_role
        type: select
        required: true
        options:
        - checker
        - executor
        - communicator
        - designer
      - name: system
        type: text
        required: true
      - name: connection
        type: select
        options:
        - oauth
        - http
        - mcp
      - name: can_read
        type: text
        help:
          it: Oggetti e campi leggibili
          en: Readable objects and fields
      - name: can_write
        type: text
        help:
          it: Oggetti e campi scrivibili (vuoto = nessuna scrittura)
          en: Writable objects and fields (empty = no write)
    - name: audit_log
      ownedBy: app
      description: 'Who did what in every run: agent, action, system, target, approver, result'
      fields:
      - name: ts
        type: date
      - name: run_id
        type: text
      - name: process
        type: text
      - name: department
        type: text
      - name: agent
        type: text
      - name: action
        type: text
      - name: system
        type: text
      - name: target
        type: text
      - name: approved_by
        type: text
      - name: result
        type: text
    - name: events
      ownedBy: app
      description: Incoming events (new record, email text) that start a process
      fields:
      - name: process
        type: text
      - name: source
        type: text
      - name: payload
        type: json
    - name: outbox
      ownedBy: app
      description: Messages drafted by the communicator for people in the company
      fields:
      - name: ts
        type: date
      - name: process
        type: text
      - name: department
        type: text
      - name: recipient
        type: text
      - name: subject
        type: text
      - name: body
        type: textarea
      - name: status
        type: text
    credentials:
    - provider: erp
      label:
        it: ERP aziendale
        en: Company ERP
      kind: oauth
      scope: org
    - provider: crm
      label:
        it: CRM aziendale
        en: Company CRM
      kind: oauth
      scope: org
    - provider: internal_mcp
      label:
        it: Server MCP interni
        en: Internal MCP servers
      kind: mcp
      scope: org
  views:
  - key: home
    type: page
    nav: false
    title: Regia Agenti
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow:
        it: Per grandi aziende
        en: For large companies
      title:
        it: Descrivi il processo. **Un team di agenti** lo porta avanti tra i reparti.
        en: Describe the process. **A team of agents** carries it across departments.
      text:
        it: Controllo, esecuzione e comunicazione sono agenti separati che si passano il lavoro. Ogni scrittura sui sistemi
          aziendali passa da un'approvazione umana, e ogni passo finisce nel registro.
        en: Control, execution and communication are separate agents that hand work to each other. Every write to a company
          system goes through human approval, and every step lands in the audit log.
      actions:
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: primary
      - label:
          it: Come funziona
          en: How it works
        href: '#come-funziona'
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: L'admin IT collega i sistemi
          en: IT connects the systems
        text:
          it: ERP e CRM via OAuth, API interne, server MCP esistenti. Per ogni ruolo di agente decide cosa può leggere e cosa
            scrivere.
          en: ERP and CRM via OAuth, internal APIs, existing MCP servers. For each agent role it decides what may be read
            and written.
        badge: 🔌
      - title:
          it: Il responsabile descrive il flusso
          en: The process owner describes the flow
        text:
          it: In linguaggio naturale. Il sistema lo trasforma in un processo con controllo, esecuzione e comunicazione.
          en: In plain language. The system turns it into a process with control, execution and communication.
        badge: 💬
      - title:
          it: Parte da un evento o da un orario
          en: Starts from an event or a schedule
        text:
          it: Nuovo record, email, webhook oppure pianificazione.
          en: New record, email, webhook or a schedule.
        badge: ⚡
      - title:
          it: Tu approvi, poi automatizzi
          en: You approve, then automate
        text:
          it: Ogni scrittura attende il via libera finché il responsabile non la rende automatica.
          en: Every write waits for sign-off until the owner makes it automatic.
        badge: ✅
    - type: cards
      id: controllo
      title:
        it: Controllo e visibilità
        en: Control and visibility
      items:
      - title:
          it: Registro completo
          en: Complete audit log
        text:
          it: Chi ha fatto cosa, su quale sistema, con chi l'ha approvato e con quale esito.
          en: Who did what, on which system, who approved and with what result.
      - title:
          it: Per reparto
          en: By department
        text:
          it: I dipendenti vedono solo i processi del loro reparto; il CIO vede tutto.
          en: Employees see only their department's processes; the CIO sees everything.
      - title:
          it: Contratto annuale a crediti
          en: Annual contract with credits
        text:
          it: Un contratto annuale con crediti consumati a ogni esecuzione.
          en: An annual contract with credits used on each run.
    - type: note
      content:
        it: 'Gli agenti operano solo entro i diritti concessi dall''admin IT. Supporto alle decisioni: la responsabilità delle
          azioni approvate resta della vostra organizzazione.'
        en: 'Agents work only within the rights granted by IT. Decision support: responsibility for approved actions stays
          with your organisation.'
  - key: new_process
    type: new_run
    title:
      it: Nuovo processo
      en: New process
    roles:
    - process_owner
    - admin
  - key: my_runs
    type: history
    title:
      it: Definizioni create
      en: Definitions created
    source: run
    roles:
    - process_owner
    - admin
  - key: definition
    type: report
    source: run
    printable: true
    nav: false
  - key: all_processes
    type: table
    title:
      it: Tutti i processi
      en: All processes
    source: collection:processes
    roles:
    - admin
    data:
      display: table
      fields:
      - key: name
        label:
          it: Processo
          en: Process
      - key: department
        label:
          it: Reparto
          en: Department
        format: badge
      - key: trigger_kind
        label:
          it: Avvio
          en: Trigger
        format: badge
      - key: autonomy
        label:
          it: Autonomia
          en: Autonomy
        format: badge
      - key: status
        label:
          it: Stato
          en: Status
        format: badge
      limit: 200
  - key: scheduled
    type: instances
    template: scheduled_process
    title:
      it: Esecuzioni pianificate
      en: Scheduled runs
    roles:
    - process_owner
    - admin
  - key: approvals
    type: approvals
    title:
      it: Approvazioni
      en: Approvals
    approvals:
    - write_action
    roles:
    - process_owner
    - admin
  - key: dept_sales
    type: page
    title:
      it: Vendite
      en: Sales
    roles:
    - sales
    sections:
    - type: data
      title:
        it: Processi del reparto
        en: Department processes
      source: collection:processes
      display: table
      fields:
      - key: name
        label:
          it: Processo
          en: Process
      - key: trigger_kind
        label:
          it: Avvio
          en: Trigger
        format: badge
      - key: autonomy
        label:
          it: Autonomia
          en: Autonomy
        format: badge
      - key: status
        label:
          it: Stato
          en: Status
        format: badge
      filters:
      - field: department
        op: '='
        value: sales
    - type: data
      title:
        it: Registro
        en: Audit log
      source: collection:audit_log
      display: table
      fields:
      - key: ts
        label: Data
        format: date
      - key: process
        label: Processo
      - key: agent
        label: Agente
      - key: action
        label: Azione
      - key: system
        label: Sistema
      - key: approved_by
        label: Approvato da
      - key: result
        label: Esito
      filters:
      - field: department
        op: '='
        value: sales
      sort:
        field: ts
        dir: desc
      limit: 100
    - type: data
      title:
        it: Messaggi
        en: Messages
      source: collection:outbox
      display: list
      fields:
