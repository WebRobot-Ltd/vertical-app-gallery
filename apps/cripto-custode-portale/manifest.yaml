apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: btc-custody-portal
  displayName: Portale Deposito Bitcoin
  tagline:
    it: Il rendiconto del tuo deposito in custodia, sempre a portata di mano.
    en: The statement of your custody deposit, always at hand.
  description:
    it: 'Area riservata informativa per i clienti di un servizio di custodia di bitcoin: quantità in custodia, valore, operazioni
      confermate, estratti conto e documenti per la dichiarazione fiscale, assistente per la documentazione. Non è il servizio
      di custodia né detiene chiavi.'
    en: 'Reserved information area for clients of a bitcoin custody service: quantity held, value, confirmed operations, statements
      and tax documents, and a documentation assistant. It is not the custody service and holds no keys.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1d2a3a'
      accent: '#c77d12'
      background: '#f7f7f5'
      foreground: '#18202b'
    fonts:
      body: Inter
      display: IBM Plex Serif
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: operator
      label:
        it: Operatore
        en: Operator
      assignedBy: invite
    - key: customer
      label:
        it: Cliente
        en: Client
      assignedBy: invite
  limits:
  - action: agent:reporter
    per: user
    max: 5
    window: day
  - action: chat
    per: user
    max: 40
    window: day
  agents:
  - key: reporter
    role: main
    description: Genera estratto conto e documento per la dichiarazione fiscale dai soli dati registrati dall'operatore.
    profile:
      inline:
        display_name: Custody report writer
        crews:
        - id: reporter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write periodic reports for a client of a bitcoin custody service. You only describe the client''s
            deposit: you do NOT hold keys, you do NOT give investment, tax or legal advice. Read the data ONLY with the tools
            read_position and read_transactions (they return the signed-in client''s own records, entered by the operator).
            Never invent quantities, prices, dates or fees; if data is missing for the period, say so plainly. Start with
            a level-1 title "# <Estratto conto|Account statement> — <period>" (or "# Documento per la dichiarazione fiscale
            — <year>" / "# Tax reporting document — <year>" for tax). Statement sections (## headings): Summary (quantity
            in custody, last recorded value and its date), Confirmed operations in the period (table: date, type, BTC, EUR
            value, reference), Fees, Notes. Tax document: a factual chronological table of confirmed operations of the year
            with the EUR value recorded at the time, quantity at 1 January and 31 December, and a closing note that it is
            an informational summary to hand to the client''s own tax advisor, not tax advice. Write in the language requested.
            Add the line: ''Informational document based on operator-registered data.'' Under 600 words besides tables.'
    appTools:
    - name: read_position
      description: The signed-in client's deposit position records (quantity, value, valuation date)
      action: read
      collection: deposit_position
      scope: user
    - name: read_transactions
      description: The signed-in client's confirmed operations registered by the operator
      action: read
      collection: transactions
      scope: user
    goalTemplate: 'Report type: {report_type_label}

      Period: from {period_from} to {period_to}

      {?notes}Client notes: {notes}{/notes}

      Today is {date}. Write the report in the language with ISO code {lang}.'
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.4
  - key: assistant
    role: helper
    description: Chat on how the service works, answering only from the company's information materials; opens a case for
      sensitive requests.
    profile:
      inline:
        display_name: Custody info assistant
        crews:
        - id: assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the information assistant of a bitcoin custody service portal. Answer ONLY from the company''s
            information materials, which you find with the tool search_docs; quote the document title you used. If the materials
            do not cover the question, say so and suggest opening a case. You may read the client''s own deposit with read_position
            and read_transactions to explain what the statement shows. You NEVER give investment advice, price forecasts,
            tax or legal advice, and you never hold, move or ask for keys, seed phrases or passwords. For every sensitive
            request (withdrawal or transfer, change of details or limits, access recovery, disputes, anything that moves assets
            or changes data) do not act: collect a short description and call open_case once, then tell the client that an
            authorised human operator will handle it outside the platform. Be concise and reply in the client''s language.'
    appTools:
    - name: search_docs
      description: Search the company's information materials
      action: search
      collection: info_docs
      scope: all
    - name: read_position
      description: The signed-in client's deposit position records (quantity, value, valuation date)
      action: read
      collection: deposit_position
      scope: user
    - name: read_transactions
      description: The signed-in client's confirmed operations registered by the operator
      action: read
      collection: transactions
      scope: user
    - name: open_case
      description: Open a case (pratica) for a sensitive request, worked by a human operator offline
      action: write
      collection: cases
      scope: user
    goalTemplate: 'Conversation so far:

      {history}


      New message from the client:

      {message}

      Reply in the language with ISO code {lang}.'
    output: markdown
  inputForm:
    title:
      it: Nuovo report
      en: New report
    fields:
    - name: report_type
      type: select
      required: true
      label:
        it: Tipo di documento
        en: Document
      options:
      - value: statement
        label:
          it: Estratto conto
          en: Account statement
      - value: tax
        label:
          it: Documento per la dichiarazione fiscale
          en: Tax reporting document
    - name: period_from
      type: date
      required: true
      label:
        it: Dal
        en: From
    - name: period_to
      type: date
      required: true
      label:
        it: Al
        en: To
    - name: notes
      type: textarea
      maxLength: 300
      label:
        it: Note (facoltative)
        en: Notes (optional)
  data:
    collections:
    - name: deposit_position
      ownedBy: user
      description: Quantity in custody and valuation of each client's deposit, registered by the operator
      fields:
      - name: as_of
        type: date
        label:
          it: Data
          en: As of
      - name: btc_quantity
        type: number
        label:
          it: BTC in custodia
          en: BTC in custody
      - name: value_eur
        type: number
        label:
          it: Valore (EUR)
          en: Value (EUR)
      - name: price_source
        type: text
        label:
          it: Fonte del prezzo
          en: Price source
    - name: transactions
      ownedBy: user
      description: Confirmed operations registered by the operator
      fields:
      - name: date
        type: date
        label:
          it: Data
          en: Date
      - name: kind
        type: select
        options:
        - deposit
        - withdrawal
        - fee
        label:
          it: Tipo
          en: Type
      - name: btc
        type: number
        label: BTC
      - name: value_eur
        type: number
        label:
          it: Valore (EUR)
          en: Value (EUR)
      - name: reference
        type: text
        label:
          it: Riferimento
          en: Reference
    - name: info_docs
      ownedBy: shared
      description: Information materials of the company (service terms, FAQ, procedures), pasted as text by the admin
      searchable: true
      fields:
      - name: title
        type: text
        label:
          it: Titolo
          en: Title
      - name: body
        type: textarea
        label:
          it: Testo
          en: Text
      - name: link
        type: url
        label: Link
    - name: cases
      ownedBy: user
      description: Cases (pratiche) opened for sensitive requests; worked by a human operator outside the platform
      fields:
      - name: opened_at
        type: date
        label:
          it: Aperta il
          en: Opened
      - name: category
        type: select
        options:
        - withdrawal
        - details_change
        - access
        - dispute
        - other
        label:
          it: Categoria
          en: Category
      - name: description
        type: textarea
        label:
          it: Descrizione
          en: Description
      - name: status
        type: select
        options:
        - open
        - in_progress
        - closed
        default: open
        label:
          it: Stato
          en: Status
  views:
  - key: home
    type: page
    nav: false
    title: Home
    sections:
    - type: hero
      title:
        it: Il rendiconto del tuo **deposito** in custodia
        en: The statement of your custody **deposit**
      text:
        it: 'Area riservata per i clienti abilitati: quantità, valore, operazioni confermate, estratti conto e documenti per
          la dichiarazione fiscale, più un assistente che risponde sulla documentazione del servizio.'
        en: 'Reserved area for enabled clients: quantity, value, confirmed operations, statements and tax documents, plus
          an assistant that answers on the service documentation.'
      actions:
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: primary
      note:
        it: L'accesso è riservato ai clienti abilitati dall'operatore.
        en: Access is reserved to clients enabled by the operator.
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Consulta
          en: Review
        text:
          it: Vedi il tuo deposito e lo storico delle operazioni confermate registrate dall'operatore.
          en: See your deposit and the history of confirmed operations registered by the operator.
      - title:
          it: Genera
          en: Generate
        text:
          it: Chiedi l'estratto conto o il documento per la dichiarazione fiscale.
          en: Request the account statement or the tax reporting document.
      - title:
          it: Chiedi
          en: Ask
        text:
          it: L'assistente risponde solo dai materiali informativi; le richieste sensibili aprono una pratica gestita da un
            operatore.
          en: The assistant answers only from the information materials; sensitive requests open a case handled by an operator.
    - type: note
      content:
        it: 'Questo portale è solo informativo: non è il servizio di custodia, non detiene chiavi e non fornisce consulenza
          di investimento, fiscale o legale.'
        en: 'This portal is informational only: it is not the custody service, holds no keys and provides no investment, tax
          or legal advice.'
  - key: deposit
    type: page
    title:
      it: Il mio deposito
      en: My deposit
    roles:
    - customer
    - admin
    sections:
    - type: data
      title:
        it: Posizione
        en: Position
      source: collection:deposit_position
      display: kpi
      kpis:
      - label:
          it: BTC in custodia
          en: BTC in custody
        agg: last
        field: btc_quantity
        format: number
      - label:
          it: Valore (EUR)
          en: Value (EUR)
        agg: last
        field: value_eur
        format: money
      - label:
          it: Aggiornato al
          en: As of
        agg: last
        field: as_of
        format: date
      sort:
        field: as_of
        dir: asc
    - type: data
      title:
        it: Operazioni confermate
        en: Confirmed operations
      source: collection:transactions
      display: table
      fields:
      - key: date
        label:
          it: Data
          en: Date
        format: date
      - key: kind
        label:
          it: Tipo
          en: Type
        format: badge
      - key: btc
        label: BTC
        format: number
      - key: value_eur
        label:
          it: Valore (EUR)
          en: Value (EUR)
        format: money
      - key: reference
        label:
          it: Riferimento
          en: Reference
      sort:
        field: date
        dir: desc
      limit: 100
      empty:
        it: Nessuna operazione registrata.
        en: No operations registered.
  - key: new_report
    type: new_run
    title:
      it: Nuovo report
      en: New report
    roles:
    - customer
    - admin
  - key: reports
    type: history
    title:
      it: I miei report
      en: My reports
    source: run
    roles:
    - customer
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: assistant_chat
    type: chat
    source: agent:assistant
    title:
      it: Assistente
      en: Assistant
    placeholder:
      it: Chiedi come funziona il servizio…
      en: Ask how the service works…
    examples:
    - it: Come funziona la custodia?
      en: How does custody work?
    - it: Quali documenti posso richiedere?
      en: Which documents can I request?
    - it: Vorrei richiedere un prelievo
      en: I would like to request a withdrawal
    roles:
    - customer
    - admin
  - key: my_cases
    type: table
    title:
      it: Le mie pratiche
      en: My cases
    source: collection:cases
    columns:
    - opened_at
    - category
    - description
    - status
    roles:
    - customer
  - key: ops_cases
    type: table
    title:
      it: Pratiche (operatori)
      en: Cases (operators)
    source: collection:cases
    columns:
    - opened_at
    - category
    - description
    - status
    roles:
    - operator
    - admin
  - key: docs_admin
    type: table
    title:
      it: Materiali informativi
      en: Information materials
    source: collection:info_docs
    columns:
    - title
    - link
    roles:
    - admin
  billing:
    modes:
    - free
  notifications:
    emailOnRunDone: true
  extensions:
  - key: email_delivery
    description: 'Sending reports by email is not available yet: reports are read and printed in the portal. Needs the email
      notification feature.'
  - key: operator_assignment
    description: 'Operators should see only their assigned clients'' records and cases, and record positions and confirmed
      operations on behalf of clients. The runtime has no per-operator assignment scope nor write-on-behalf: today operators/admins
      enter data through the back office and ownedBy user records.'
  - key: live_valuation
    description: Current value is the valuation registered by the operator with its source and date; no live price feed is
      connected.
  - key: document_upload
    description: 'File upload is not available: information materials are pasted as text or linked by URL in info_docs.'
