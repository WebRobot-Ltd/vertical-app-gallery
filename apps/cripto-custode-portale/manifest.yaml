apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: btc-custody-portal
  displayName: Custody Portal
  tagline:
    it: Il rendiconto del tuo deposito in bitcoin, sempre a portata di mano.
    en: The statement of your bitcoin deposit, always at hand.
  description:
    it: 'Portale informativo e di rendicontazione per i clienti di un servizio di custodia di bitcoin. Non custodisce chiavi
      né fondi: mostra i dati registrati dall''operatore, genera estratti conto e documenti fiscali, risponde sulla documentazione
      e apre pratiche per le richieste sensibili.'
    en: 'Information and reporting portal for the clients of a bitcoin custody service. It holds no keys or funds: it shows
      the data recorded by the operator, generates statements and tax documents, answers questions on the documentation and
      opens cases for sensitive requests.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1d2b3a'
      accent: '#d98a1f'
      background: '#f6f6f3'
      foreground: '#18212b'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Custody
      color: primary
    - text: Portal
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: customer
      label:
        it: Cliente
        en: Client
      assignedBy: invite
    - key: operator
      label:
        it: Operatore
        en: Operator
      assignedBy: derived
      from: collection:deposits.operator_email
  limits:
  - action: agent:statement
    per: user
    max: 5
    window: day
  - action: chat
    per: user
    max: 60
    window: day
  agents:
  - key: statement
    role: main
    description: Writes the periodic statement or the tax-declaration document from the client's recorded data.
    appTools:
    - name: read_deposit
      description: Read the client's deposit record (quantity in custody, current value, valuation date)
      action: read
      collection: deposits
      scope: user
    - name: read_transactions
      description: Read the client's confirmed transactions recorded by the operator
      action: read
      collection: transactions
      scope: user
    profile:
      inline:
        display_name: Custody statement writer
        crews:
        - id: statement
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You prepare statements for clients of a bitcoin custody service. You only report data recorded by
            the operator, read with the tools read_deposit and read_transactions. Never invent or estimate figures, never
            convert with rates you were not given, never give investment, legal or tax advice. If data is missing, say so.

            Start with a level-1 title "# <Document type> — <period>". For an account statement use ## sections: Summary (quantity
            in custody in BTC, current value and valuation date), Confirmed transactions in the period (table: date, type,
            BTC, price, reference), Totals of the period (BTC in, BTC out), Notes. For a tax-declaration document use: Summary
            of the position at period start and end, Table of confirmed transactions with date, type, BTC amount and EUR value
            as recorded, Totals, and a closing note stating that this is an informational summary of recorded data, not tax
            advice, and that the client should consult a tax professional. Optionally add a ```chart block with real recorded
            figures only. Write in the language with the requested ISO code.'
    goalTemplate: 'Document type: {report_type_label}

      Period: from {period_from} to {period_to}

      Client: {user}

      Today is {date}. Write the document in the language with ISO code {lang}.'
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.5
  - key: assistant
    role: helper
    description: Chat assistant answering only from the company's information materials.
    appTools:
    - name: search_documents
      description: Search the company's information materials (service rules, fees, procedures, FAQ)
      action: search
      collection: documents
      scope: all
    profile:
      inline:
        display_name: Custody service assistant
        chat_mode: true
        crews:
        - id: assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You answer questions about how a bitcoin custody service works and about its documentation. Always
            search the materials with search_documents and answer ONLY from what they say, citing the document title. If the
            materials do not cover the question, say so and suggest opening a case from the app. Never give investment advice,
            price predictions, or tax/legal advice. You cannot move funds, change data or authorise anything: for any sensitive
            request (withdrawals, changes of details, address changes, closing) tell the user to open a case (pratica) with
            the form in the app, which a human operator handles outside the platform. Answer in the user''s language, briefly.'
    goalTemplate: 'Conversation so far:

      {history}


      New message from {user}: {message}

      Answer in the language with ISO code {lang}.'
    output: markdown
  inputForm:
    title:
      it: Nuovo documento
      en: New document
    fields:
    - name: report_type
      type: select
      required: true
      label:
        it: Documento
        en: Document
      options:
      - value: statement
        label:
          it: Estratto conto
          en: Account statement
      - value: tax
        label:
          it: Documento per la dichiarazione fiscale
          en: Tax declaration document
    - name: period_from
      type: date
      required: true
      label:
        it: Dal
        en: From
    - name: period_to
      type: date
      required: true
      label:
        it: Al
        en: To
  data:
    collections:
    - name: deposits
      ownedBy: org
      description: Deposit of each client as recorded by the operator
      fields:
      - name: customer_email
        type: email
        required: true
        label:
          it: Email cliente
          en: Client email
      - name: customer_name
        type: text
        label:
          it: Cliente
          en: Client
      - name: operator_email
        type: email
        required: true
        label:
          it: Operatore assegnato
          en: Assigned operator
      - name: btc_amount
        type: number
        label:
          it: BTC in custodia
          en: BTC in custody
      - name: value_eur
        type: number
        label:
          it: Valore corrente (EUR)
          en: Current value (EUR)
      - name: valued_at
        type: date
        label:
          it: Data valutazione
          en: Valuation date
      access:
      - role: customer
        where:
          customer_email: '{user.email}'
        can:
        - read
      - role: operator
        where:
          operator_email: '{user.email}'
        can:
        - read
        - write
    - name: transactions
      ownedBy: org
      description: Confirmed operations recorded by the operator
      fields:
      - name: customer_email
        type: email
        required: true
      - name: operator_email
        type: email
        required: true
      - name: date
        type: date
        required: true
        label:
          it: Data
          en: Date
      - name: type
        type: select
        label:
          it: Tipo
          en: Type
        options:
        - value: deposit
          label:
            it: Deposito
            en: Deposit
        - value: withdrawal
          label:
            it: Prelievo
            en: Withdrawal
        - value: fee
          label:
            it: Commissione
            en: Fee
      - name: btc_amount
        type: number
        label: BTC
      - name: price_eur
        type: number
        label:
          it: Prezzo EUR
          en: Price EUR
      - name: reference
        type: text
        label:
          it: Riferimento
          en: Reference
      - name: status
        type: select
        options:
        - confirmed
      access:
      - role: customer
        where:
          customer_email: '{user.email}'
        can:
        - read
      - role: operator
        where:
          operator_email: '{user.email}'
        can:
        - read
        - write
    - name: cases
      ownedBy: user
      description: Cases (pratiche) opened by clients, handled by an operator outside the platform
      retentionDays: 1825
      fields:
      - name: kind
        type: select
        required: true
        label:
          it: Tipo di richiesta
          en: Request type
        options:
        - value: withdrawal
          label:
            it: Prelievo
            en: Withdrawal
        - value: details
          label:
            it: Modifica dati
            en: Change of details
        - value: documents
          label:
            it: Documentazione
            en: Documents
        - value: other
          label:
            it: Altro
            en: Other
      - name: details
        type: textarea
        required: true
        maxLength: 1500
        label:
          it: Dettagli
          en: Details
      - name: status
        type: select
        label:
          it: Stato
          en: Status
        options:
        - open
        - in_progress
        - closed
        default: open
      access:
      - role: operator
    - name: documents
      ownedBy: shared
      searchable: true
      description: Information materials uploaded by the company
      fields:
      - name: title
        type: text
        required: true
        label:
          it: Titolo
          en: Title
      - name: content
        type: textarea
        label:
          it: Testo
          en: Text
      - name: file
        type: file
        accept:
        - pdf
        - docx
        - txt
        - md
  views:
  - key: home
    type: page
    nav: false
    sections:
    - type: hero
      title:
        it: Il rendiconto del tuo **deposito** in bitcoin
        en: The statement of your bitcoin **deposit**
      text:
        it: 'Area riservata ai clienti abilitati: quantità in custodia, valore, storico operazioni, estratti conto e assistente
          sulla documentazione.'
        en: 'Private area for enabled clients: quantity in custody, value, transaction history, statements and a documentation
          assistant.'
      actions:
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Consulta
          en: Review
        text:
          it: Vedi il tuo deposito e le operazioni confermate registrate dall'operatore.
          en: See your deposit and the confirmed operations recorded by the operator.
      - title:
          it: Genera
          en: Generate
        text:
          it: Estratto conto o documento fiscale, inviato anche via email.
          en: Account statement or tax document, also sent by email.
      - title:
          it: Chiedi
          en: Ask
        text:
          it: L'assistente risponde dalla documentazione; le richieste sensibili aprono una pratica.
          en: The assistant answers from the documentation; sensitive requests open a case.
    - type: note
      content:
        it: 'Questo portale è solo informativo: non custodisce chiavi né fondi e non fornisce consigli di investimento. L''accesso
          è riservato ai clienti abilitati dall''operatore. Il servizio è incluso nella commissione di custodia.'
        en: 'This portal is informational only: it holds no keys or funds and gives no investment advice. Access is limited
          to clients enabled by the operator. The service is included in the custody fee.'
  - key: deposit
    type: page
    title:
      it: Il mio deposito
      en: My deposit
    roles:
    - customer
    - operator
    - admin
    sections:
    - type: data
      title:
        it: Deposito
        en: Deposit
      source: collection:deposits
      display: kpi
      kpis:
      - label:
          it: BTC in custodia
          en: BTC in custody
        agg: sum
        field: btc_amount
        format: number
      - label:
          it: Valore corrente (EUR)
          en: Current value (EUR)
        agg: sum
        field: value_eur
        format: money
      - label:
          it: Ultima valutazione
          en: Last valuation
        agg: last
        field: valued_at
        format: date
    - type: data
      title:
        it: Operazioni confermate
        en: Confirmed operations
      source: collection:transactions
      display: table
      fields:
      - key: date
        label:
          it: Data
          en: Date
        format: date
      - key: type
        label:
          it: Tipo
          en: Type
        format: badge
      - key: btc_amount
        label: BTC
        format: number
      - key: price_eur
        label:
          it: Prezzo EUR
          en: Price EUR
        format: money
      - key: reference
        label:
          it: Riferimento
          en: Reference
      sort:
        field: date
        dir: desc
      limit: 100
      empty:
        it: Nessuna operazione registrata.
        en: No operations recorded.
  - key: clients
    type: table
    title:
      it: Clienti
      en: Clients
    source: collection:deposits
    columns:
    - customer_name
    - customer_email
    - btc_amount
    - value_eur
    - valued_at
    export: true
    roles:
    - operator
    - admin
  - key: new_report
    type: new_run
    title:
      it: Nuovo documento
      en: New document
    roles:
    - customer
    - admin
  - key: reports
    type: history
    title:
      it: I miei documenti
      en: My documents
    source: run
    roles:
    - customer
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: assistant_chat
    type: chat
    title:
      it: Assistente
      en: Assistant
    source: agent:assistant
    examples:
    - it: Come funziona la custodia?
      en: How does custody work?
    - it: Quali sono le commissioni?
      en: What are the fees?
    - it: Come richiedo un prelievo?
      en: How do I request a withdrawal?
    placeholder:
      it: Fai una domanda sul servizio…
      en: Ask about the service…
    roles:
    - customer
    - admin
  - key: new_case
    type: form
    title:
      it: Apri una pratica
      en: Open a case
    collection: cases
    fields:
    - kind
    - details
    submit:
      label:
        it: Invia richiesta
        en: Send request
      message:
        it: 'Pratica aperta: un operatore la prenderà in carico.'
        en: 'Case opened: an operator will handle it.'
      redirect: my_cases
    roles:
    - customer
  - key: my_cases
    type: table
    title:
      it: Le pratiche
      en: Cases
    source: collection:cases
    columns:
    - kind
    - details
    - status
    roles:
    - customer
    - operator
    - admin
  - key: docs
    type: table
    title:
      it: Documentazione
      en: Documentation
    source: collection:documents
    columns:
    - title
    - file
    roles:
    - admin
    - customer
    - operator
  triggers:
  - key: case_opened
    'on':
      collection: cases
      op: insert
    notify:
      to:
      - role:operator
      - admins
      subject:
        it: Nuova pratica {record.kind}
        en: New case {record.kind}
      body:
        it: Un cliente ha aperto una pratica. Accedi al portale per i dettagli.
        en: A client opened a case. Sign in to the portal for details.
      link: my_cases
  notifications:
    emailOnRunDone: true
  billing:
    modes:
    - free
  extensions:
  - key: case_assignment
    description: Cases are visible to all operators; automatic assignment of a case to the client's own operator is not available
      yet.
  - key: no_custody
    description: The app only shows data entered by the operator; custody, keys and sensitive operations stay outside the
      platform.
