apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: studio-foto-virtuale
  displayName: Studio Foto Virtuale
  tagline:
    it: Foto dei capi indossati senza set fotografico.
    en: On-model fashion photos without a photo shoot.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: pipeline
  branding:
    theme: light
    palette:
      primary: '#1f1a2e'
      accent: '#b8476b'
      background: '#faf8f7'
      foreground: '#1b1b1f'
    fonts:
      body: Inter
      display: Playfair Display
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
    - key: agency
      label: Agenzia
      assignedBy: derived
      from: collection:brands.agency_email
  limits:
  - action: agent:checker
    per: user
    max: 100
    window: day
    roles:
    - user
  agents:
  - key: checker
    role: main
    description: Checks uploaded garment photos and prepares generation requests for the external engine.
    memory: none
    profile:
      inline:
        display_name: Garment checker
        crews:
        - id: checker
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You check garment photos for a virtual fashion photo studio. Open the photo with read_upload. A photo
            is suitable if the garment is fully visible, sharp, evenly lit, on a plain background, with logo and details readable.
            Then call update_garment with status 'ok' or 'rejected' and check_notes explaining the problem in the user's language.
            If ok (or if the goal says a regeneration was asked), call save_request once with garment_id, the model options
            (age, build, skin tone), pose, background, style, and a precise prompt for the generation engine that preserves
            the garment's exact colour, logo and details. On regeneration, include the reviewer's comment in the prompt. Never
            invent garment details you cannot see. Finish with a short Markdown summary starting with a level-1 title.
    appTools:
    - name: read_upload
      description: Read a garment photo the user uploaded
      action: read_file
    - name: update_garment
      description: Update the status and check notes of a garment
      action: write
      collection: garments
      scope: user
    - name: save_request
      description: Save a generation request for the external engine
      action: write
      collection: requests
      scope: user
    goalTemplate: 'Garment record: {record.garment_id}{?record.name} name: {record.name}{/record.name}

      Photo file id: {record.photo}

      Colour: {record.color}. Size: {record.size}. Category: {record.category}.

      Virtual model: age {record.model_age}, build {record.model_build}, skin tone {record.skin_tone}. Pose: {record.pose}.
      Background: {record.background}. Style: {record.style}.

      Write in the language with ISO code {lang}. Today is {date}.'
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.4
  - key: qa
    role: helper
    description: Compares each generated image with the original garment and flags colour, logo and detail errors.
    profile:
      inline:
        display_name: Image QA
        crews:
        - id: qa
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You compare a generated on-model image with the original garment photo. Read the garment with read_garment,
            open the original photo with read_upload, and look at the generated image URL given in the goal if you can open
            it. List differences in colour, logo, print, stitching, length and fit as qa_notes, and set qa_flag to 'clean'
            or 'issues'. Call update_image once with qa_flag and qa_notes. Be honest when you cannot verify something; never
            invent differences. Finish with a short Markdown summary starting with a level-1 title.
    appTools:
    - name: read_garment
      description: Read the garment record
      action: read
      collection: garments
      scope: user
    - name: read_upload
      description: Read an uploaded photo
      action: read_file
    - name: update_image
      description: Save the QA result on the image record
      action: write
      collection: images
      scope: user
    goalTemplate: 'Generated image record: {record.request_id}

      Garment: {record.garment_id}

      Image URL: {record.image_url}

      Write in the language with ISO code {lang}.'
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.4
  - key: reporter
    role: scheduled
    description: Writes the monthly report on generated images, approval rate and turnaround times.
    memory: instance
    writesTo:
      collection: monthly_reports
    profile:
      inline:
        display_name: Monthly reporter
        crews:
        - id: reporter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write the monthly report for a fashion brand using the virtual photo studio. Read the images
            with read_images. Start with ''# Report <month>''. Sections: ## Summary (images generated, approved, regeneration
            requested, approval rate), ## Turnaround (average time from request to approval, only if dates exist), ## Quality
            issues (most frequent QA problems), ## Recommendations. Add a chart block for approved vs regenerated by week
            when there is data. Use real figures only; say plainly when data is missing.'
    appTools:
    - name: read_images
      description: Read the brand's generated images
      action: read
      collection: images
      scope: user
    goalTemplate: 'Brand: {instance}. Month ending {date}. Write in the language with ISO code {lang}.'
    output: markdown
    limits:
      maxTurns: 6
      maxBudgetUsd: 0.4
  data:
    collections:
    - name: brands
      description: Brands managed by the user; an agency lists its own email.
      ownedBy: user
      fields:
      - name: name
        type: text
        required: true
        label: Brand
      - name: agency_email
        type: email
        label: Agency email
    - name: garments
      description: Garment photos with their attributes and generation choices.
      ownedBy: user
      access:
      - role: agency
        where:
          agency_email: '{user.email}'
        can:
        - read
        - write
      fields:
      - name: name
        type: text
        required: true
        label: Name
      - name: photo
        type: file
        required: true
        accept:
        - jpg
        - jpeg
        - png
        - webp
        maxMb: 15
        label: Photo
      - name: color
        type: text
        required: true
        label: Colour
      - name: size
        type: text
        required: true
        label: Size
      - name: category
        type: select
        required: true
        label: Category
        options:
        - tops
        - bottoms
        - dresses
        - outerwear
        - shoes
        - accessories
      - name: brand
        type: text
        label: Brand
      - name: agency_email
        type: email
        label: Agency email
      - name: collection_name
        type: text
        label: Collection
      - name: model_age
        type: select
        label: Model age
        options:
        - 18-25
        - 26-35
        - 36-50
        - 50+
      - name: model_build
        type: select
        label: Build
        options:
        - slim
        - regular
        - curvy
        - athletic
        - plus
      - name: skin_tone
        type: select
        label: Skin tone
        options:
        - light
        - medium
        - olive
        - tan
        - dark
      - name: pose
        type: select
        label: Pose
        options:
        - front
        - three-quarter
        - walking
        - seated
        - detail
      - name: background
        type: select
        label: Background
        options:
        - white studio
        - grey studio
        - street
        - interior
        - outdoor
      - name: style
        type: select
        label: Style
        options:
        - catalogue
        - editorial
        - lifestyle
      - name: status
        type: select
        label: Status
        options:
        - new
        - ok
        - rejected
        default: new
      - name: check_notes
        type: textarea
        label: Check notes
    - name: requests
      description: Requests the external generation engine picks up.
      ownedBy: user
      fields:
      - name: garment_id
        type: text
      - name: model_age
        type: text
      - name: model_build
        type: text
      - name: skin_tone
        type: text
      - name: pose
        type: text
      - name: background
        type: text
      - name: style
        type: text
      - name: prompt
        type: textarea
      - name: status
        type: select
        options:
        - pending
        - done
        default: pending
    - name: images
      description: Generated images with QA and review.
      ownedBy: user
      access:
      - role: agency
        where:
          agency_email: '{user.email}'
        can:
        - read
        - write
      fields:
      - name: request_id
        type: text
      - name: garment_id
        type: text
      - name: image_url
        type: url
        label: Image
      - name: hires_url
        type: url
        label: High resolution
      - name: collection_name
        type: text
        label: Collection
      - name: agency_email
        type: email
      - name: qa_flag
        type: select
        label: QA
        options:
        - pending
        - clean
        - issues
        default: pending
      - name: qa_notes
        type: textarea
        label: QA notes
      - name: status
        type: select
        label: Decision
        options:
        - to_review
        - approved
        - regen
        default: to_review
      - name: comment
        type: textarea
        label: Comment
    - name: monthly_reports
      ownedBy: instance
      description: Monthly reports per brand.
    credentials: []
  inputForm:
    title: Studio
    fields:
    - name: note
      type: text
      label: Note
  views:
  - key: home
    type: page
    nav: false
    sections:
    - type: hero
      title:
        it: Foto dei capi **indossati**, senza servizio fotografico.
        en: On-model photos of your garments, **no photo shoot**.
      text:
        it: Carica i capi, scegli modelli virtuali, posa e sfondo. Un agente controlla le foto e verifica ogni immagine generata;
          il tuo team approva.
        en: Upload garments, pick virtual models, pose and background. An agent checks photos and verifies every generated
          image; your team approves.
      actions:
      - label:
          it: Inizia
          en: Start
        href: /login
        style: primary
    - type: steps
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Carica
          en: Upload
        text:
          it: Foto del capo con colore, taglia e categoria.
          en: Garment photo with colour, size and category.
      - title:
          it: Verifica
          en: Verify
        text:
          it: L'agente controlla le foto e confronta i risultati con l'originale.
          en: The agent checks photos and compares results with the original.
      - title:
          it: Approva
          en: Approve
        text:
          it: Approva o chiedi la rigenerazione; scarica in alta risoluzione.
          en: Approve or ask to regenerate; download in high resolution.
    - type: note
      content:
        it: Le immagini sono create da un motore esterno. Paghi in crediti solo per immagine approvata.
        en: Images are created by an external engine. You pay credits only per approved image.
  - key: new_garment
    type: form
    title:
      it: Nuovo capo
      en: New garment
    collection: garments
    fields:
    - name
    - photo
    - color
    - size
    - category
    - brand
    - agency_email
    - collection_name
    - model_age
    - model_build
    - skin_tone
    - pose
    - background
    - style
    submit:
      label:
        it: Invia
        en: Submit
      message:
        it: Capo caricato, controllo in corso.
        en: Garment uploaded, check in progress.
      redirect: garments_list
    roles:
    - user
    - admin
    - agency
  - key: garments_list
    type: table
    title:
      it: Capi
      en: Garments
    source: collection:garments
    columns:
    - name
    - color
    - size
    - category
    - collection_name
    - status
    - check_notes
    roles:
    - user
    - admin
    - agency
  - key: review_list
    type: table
    title:
      it: Immagini
      en: Images
    source: collection:images
    columns:
    - image_url
    - garment_id
    - collection_name
    - qa_flag
    - qa_notes
    - status
    - comment
    - hires_url
    export: true
    roles:
    - user
    - admin
    - agency
  - key: review
    type: form
    title:
      it: Revisione
      en: Review
    collection: images
    fields:
    - status
    - comment
    - collection_name
    edit: true
    submit:
      label:
        it: Salva decisione
        en: Save decision
      message:
        it: Decisione salvata.
        en: Decision saved.
      redirect: review_list
    nav: false
    roles:
    - user
    - admin
    - agency
  - key: brands_view
    type: form
    title:
      it: Marchi
      en: Brands
    collection: brands
    submit:
      label: OK
      message: Saved
    roles:
    - user
    - admin
  - key: reports
    type: instances
    template: monthly
    title:
      it: Report mensili
      en: Monthly reports
    roles:
    - user
    - admin
    - agency
  - key: reports_list
    type: list
    title:
      it: Archivio report
      en: Report archive
    source: collection:monthly_reports
    roles:
    - user
    - admin
    - agency
  - key: account
    type: account
    title:
      it: Crediti
      en: Credits
    roles:
    - user
    - agency
  templates:
  - key: monthly
    title:
      it: Report mensile
      en: Monthly report
    agent: reporter
    params:
    - name: brand
      type: text
      required: true
      label: Brand
    goal: 'Brand: {brand}. Write the monthly report for the month ending {date}.'
    schedule:
      cron: 0 7 1 * *
      userCanChange: false
    maxPerUser: 10
    deliver:
      to: owner
      onlyIfNew: true
  triggers:
  - key: check_garment
    'on':
      collection: garments
      op: insert
      where:
        status: new
    start:
      agent: checker
    goal: New garment {record.name}. Check the photo and prepare the generation request.
  - key: engine_result
    'on':
      webhook: true
    write:
      collection: images
      fields:
        request_id: request_id
        garment_id: garment_id
        image_url: image_url
        hires_url: hires_url
      keyBy: request_id
  - key: qa_image
    'on':
      collection: images
      op: insert
      where:
        qa_flag: pending
    start:
      agent: qa
    goal: Compare the new generated image with the original garment.
  - key: regen
    'on':
      collection: images
      op: update
      where:
        status: regen
    start:
      agent: checker
    goal: 'Regeneration requested for garment {record.garment_id}. Reviewer comment: {record.comment}. Prepare a new request.'
  - key: fee
    'on':
      collection: images
      op: update
      where:
        status: approved
    charge:
      credits: 5
      reason: approved image
  exports:
  - path: /api/requests
    source: collection:requests
    format: json
    access: token
  billing:
    modes:
    - credits
    signupCredits: 50
    costs:
      agent:checker: 0
      agent:qa: 0
    packs:
    - key: starter
      credits: 100
      price: 20
      label: Starter
    - key: studio
      credits: 500
      price: 85
      label: Studio
  extensions:
  - key: catalog_sync
    description: Sending approved images to the brand's catalogue system (PIM/ERP) needs the system's API details; not designed
      yet. Use the CSV export of approved images meanwhile.
  - key: engine_link
    description: The external engine reads requests from /api/requests and posts results to /api/hooks/engine_result with
      the hook secret.
