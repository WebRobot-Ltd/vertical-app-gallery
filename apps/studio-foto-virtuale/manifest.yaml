apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: studio-foto-virtuale
  displayName: Studio Foto Virtuale
  tagline:
    it: Foto dei capi indossati, senza servizio fotografico.
    en: On-model fashion photos, no photo shoot.
  description:
    it: 'Livello di gestione per brand di moda e agenzie: carichi i capi, scegli modelli virtuali, posa e stile; un agente
      controlla le foto, prepara le richieste per il motore di generazione e confronta i risultati con il capo originale.
      Il tuo team approva o chiede una rigenerazione.'
    en: 'Management layer for fashion brands and agencies: add garments, choose virtual models, pose and style; an agent checks
      the photos, prepares requests for the generation engine and compares results with the original garment. Your team approves
      or asks for a regeneration.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1d1d22'
      accent: '#b0486a'
      background: '#faf8f6'
      foreground: '#1d1d22'
    fonts:
      body: Inter
      display: Playfair Display
    wordmark:
    - text: 'Studio Foto '
      color: primary
    - text: Virtuale
      color: accent
    buttonShape: rounded
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Prezzi
        en: Pricing
      href: '#prezzi'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      label:
        it: Brand / agenzia
        en: Brand / agency
      assignedBy: signup
  limits:
  - action: agent:preparer
    per: user
    max: 50
    window: day
    roles:
    - user
  agents:
  - key: preparer
    role: main
    description: Checks garment photos and prepares the generation-engine requests.
    profile:
      inline:
        display_name: Preparatore richieste
        crews:
        - id: preparer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebSearch
          system_prompt: 'You prepare virtual try-on photo requests for fashion brands. Steps: 1) read the garment record
            with the tool read_garments; open its photo link and judge suitability (garment fully visible, flat/mannequin
            or still life, neutral background, sharp, true colour, logo/details visible, no other person). 2) If the photo
            is NOT suitable, say exactly why and what to reshoot; do not write a request. 3) If suitable, write ONE record
            with write_generation_requests: garment, brand, model (age, body, skin tone), pose, background, style, garment_notes
            (colour, logo, details that must be preserved), status ''ready'', attempt number and, for a regeneration, the
            reviewer''s comment. Never invent garment details you cannot see. Final answer in Markdown: a level-1 title ''#
            Richiesta <garment name> — <verdict>'', then sections ## Verifica foto (table of checks), ## Richiesta preparata,
            ## Prossimi passi. Under 300 words.'
    goalTemplate: 'Garment record: {garment}

      Brand: {brand}

      Virtual model: age {model_age_label}, body {model_body_label}, skin tone {model_skin_label}.

      Pose: {pose_label}. Background: {background_label}. Style: {style_label}.

      {?comment}Regeneration, creative team comment: {comment}{/comment}

      Write the report in the language with ISO code {lang}.'
    appTools:
    - name: read_garments
      description: Read the user's garments
      action: read
      collection: garments
      scope: user
    - name: write_generation_requests
      description: Write a generation request for the external engine
      action: write
      collection: generation_requests
      scope: user
    output: markdown
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.5
  - key: reviewer
    role: helper
    description: Compares each generated image with the original garment and asks the brand to approve.
    profile:
      inline:
        display_name: Controllo qualità immagini
        crews:
        - id: reviewer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebSearch
          system_prompt: 'You are a quality controller for AI-generated fashion images. For a result (image link) read the
            original garment (read_garments) and its request (read_generation_requests), open both images and compare: colour
            (name any visible shift), logo (position, shape, legibility), details (buttons, seams, prints, length, fit, neckline),
            plus artefacts (hands, fabric, background). Do not claim differences you cannot see; mark uncertainty. Write a
            record with write_image_checks: result, verdict (ok | issues), list of issues with severity. Then call request_image_review
            so the brand''s creative team decides. Final answer in Markdown: ''# Controllo <garment> — <ok|problemi>'', ##
            Confronto (table: aspect, original, generato, esito), ## Raccomandazione (approve / regenerate with suggested
            comment). Under 250 words.'
    goalTemplate: 'A new result arrived from the generation engine; the task details give the result and its garment. Check
      it against the original garment.

      Write in the language with ISO code {lang}.'
    awaits:
    - image_review
    appTools:
    - name: read_garments
      description: Read the user's garments
      action: read
      collection: garments
      scope: user
    - name: read_generation_requests
      description: Read generation requests
      action: read
      collection: generation_requests
      scope: user
    - name: write_image_checks
      description: Record the quality check of a result
      action: write
      collection: image_checks
      scope: user
    output: markdown
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.5
  - key: reporter
    role: scheduled
    description: Monthly report per brand.
    memory: instance
    writesTo:
      collection: monthly_reports
    profile:
      inline:
        display_name: Report mensile
        crews:
        - id: reporter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write the monthly report of a brand''s virtual photo studio. Read the user''s generation_requests
            and image_checks (tools) for the last month. Report only real counts: images generated, approved, regenerated,
            approval rate, average time from request to decision, top recurring issues (colour, logo, details), by collection.
            Start with ''# Report mensile — <month> <year>''. Sections ## Numeri chiave (table), ## Per collezione, ## Problemi
            ricorrenti, ## Suggerimenti. Add a chart block ```chart {"type":"bar","title":"...","labels":[...],"series":[{"name":"...","values":[...]}]}
            ``` for approval rate by collection when data exists. Never invent figures; if data is missing say so.'
    appTools:
    - name: read_generation_requests
      description: Read generation requests
      action: read
      collection: generation_requests
      scope: user
    - name: read_image_checks
      description: Read quality checks
      action: read
      collection: image_checks
      scope: user
    output: markdown
  inputForm:
    title:
      it: Nuova richiesta di foto
      en: New photo request
    fields:
    - name: brand
      type: text
      required: true
      label:
        it: Brand
        en: Brand
    - name: garment
      type: relation
      relation: garments
      required: true
      label:
        it: Capo
        en: Garment
    - name: model_age
      type: select
      required: true
      label:
        it: Età modello
        en: Model age
      options:
      - value: 18-25
        label: 18–25
      - value: 26-35
        label: 26–35
      - value: 36-50
        label: 36–50
      - value: 50+
        label: 50+
    - name: model_body
      type: select
      required: true
      label:
        it: Corporatura
        en: Body type
      options:
      - value: slim
        label:
          it: Slim
          en: Slim
      - value: regular
        label:
          it: Regolare
          en: Regular
      - value: athletic
        label:
          it: Atletica
          en: Athletic
      - value: curvy
        label:
          it: Curvy
          en: Curvy
      - value: plus
        label: Plus size
    - name: model_skin
      type: select
      required: true
      label:
        it: Tono della pelle
        en: Skin tone
      options:
      - value: light
        label:
          it: Chiaro
          en: Light
      - value: medium
        label:
          it: Medio
          en: Medium
      - value: olive
        label:
          it: Olivastro
          en: Olive
      - value: brown
        label:
          it: Scuro
          en: Brown
      - value: deep
        label:
          it: Molto scuro
          en: Deep
    - name: pose
      type: select
      required: true
      label:
        it: Posa
        en: Pose
      options:
      - value: front
        label:
          it: Frontale
          en: Front
      - value: three_quarter
        label:
          it: Tre quarti
          en: Three-quarter
      - value: back
        label:
          it: Retro
          en: Back
      - value: walking
        label:
          it: In movimento
          en: Walking
    - name: background
      type: select
      required: true
      label:
        it: Sfondo
        en: Background
      options:
      - value: white
        label:
          it: Bianco studio
          en: White studio
      - value: grey
        label:
          it: Grigio neutro
          en: Neutral grey
      - value: street
        label:
          it: Strada urbana
          en: Urban street
      - value: interior
        label:
          it: Interno
          en: Interior
    - name: style
      type: select
      required: true
      label:
        it: Stile
        en: Style
      options:
      - value: ecommerce
        label: E-commerce
      - value: editorial
        label: Editorial
      - value: lifestyle
        label: Lifestyle
    - name: comment
      type: textarea
      maxLength: 500
      label:
        it: Commento per rigenerazione (facoltativo)
        en: Regeneration comment (optional)
  data:
    collections:
    - name: garments
      ownedBy: user
      description: 'Garments of each brand (photo as a link: file upload not available yet)'
      fields:
      - name: brand
        type: text
        required: true
        label: Brand
      - name: name
        type: text
        required: true
        label: Nome
      - name: color
        type: text
        label: Colore
      - name: size
        type: text
        label: Taglia
      - name: category
        type: select
        label: Categoria
        options:
        - tops
        - bottoms
        - dresses
        - outerwear
        - knitwear
        - accessories
      - name: photo_url
        type: url
        required: true
        label: Link foto (manichino / still life)
      - name: collection
        type: text
        label: Collezione
      - name: photo_check
        type: select
        label: Esito controllo foto
        options:
        - pending
        - suitable
        - not_suitable
    - name: generation_requests
      ownedBy: user
      description: Requests prepared for the external generation engine
      fields:
      - name: garment
        type: text
      - name: brand
        type: text
      - name: model_spec
        type: json
      - name: pose
        type: text
      - name: background
        type: text
      - name: style
        type: text
      - name: garment_notes
        type: textarea
      - name: attempt
        type: number
      - name: comment
        type: textarea
      - name: status
        type: select
        options:
        - ready
        - sent
        - received
        - approved
        - regenerate
    - name: image_checks
      ownedBy: user
      description: Quality checks of generated images against the original garment
      fields:
      - name: result
        type: url
      - name: garment
        type: text
      - name: collection
        type: text
      - name: verdict
        type: select
        options:
        - ok
        - issues
      - name: issues
        type: textarea
      - name: decision
        type: select
        options:
        - pending
        - approved
        - regenerate
    - name: monthly_reports
      ownedBy: instance
      description: Monthly reports of each report subscription
  views:
  - key: home
    type: page
    nav: false
    title: Studio Foto Virtuale
    sections:
    - type: hero
      eyebrow:
        it: Per brand di moda e agenzie
        en: For fashion brands and agencies
      title:
        it: '**Foto dei capi indossati**, senza servizio fotografico.'
        en: '**On-model photos**, no photo shoot.'
      text:
        it: Carichi i capi, scegli modello virtuale, posa e stile. Un agente controlla le foto, prepara le richieste per il
          motore di generazione e verifica colore, logo e dettagli. Tu approvi, e paghi solo le immagini approvate.
        en: Add your garments, pick a virtual model, pose and style. An agent checks the photos, prepares the engine requests
          and checks colour, logo and details. You approve, and pay only for approved images.
      actions:
      - label:
          it: Inizia
          en: Start
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Carica i capi
          en: Add garments
        text:
          it: Link alla foto, nome, colore, taglia, categoria.
          en: Photo link, name, colour, size, category.
        badge: 👗
      - title:
          it: Scegli e prepara
          en: Choose and prepare
        text:
          it: Modello, posa, sfondo, stile. L'agente verifica la foto e prepara la richiesta.
          en: Model, pose, background, style. The agent checks the photo and prepares the request.
        badge: 🧍
      - title:
          it: Controlla e approva
          en: Review and approve
        text:
          it: Confronto automatico col capo originale; il tuo team approva o chiede una rigenerazione.
          en: Automatic comparison with the original garment; your team approves or requests a regeneration.
        badge: ✅
      - title:
          it: Organizza e scarica
          en: Organise and download
        text:
          it: Immagini approvate per collezione, report mensile.
          en: Approved images by collection, monthly report.
        badge: 📁
    - type: cards
      id: prezzi
      title:
        it: Prezzi
        en: Pricing
      items:
      - title:
          it: A crediti
          en: Credits
        text:
          it: Si paga per immagine approvata. Crediti di prova alla registrazione.
          en: You pay per approved image. Trial credits at signup.
    - type: note
      content:
        it: Le immagini sono generate da un motore esterno; l'agente segnala le differenze ma la decisione finale è del tuo
          team.
        en: Images are produced by an external engine; the agent flags differences but your team makes the final call.
  - key: new_request
    type: new_run
    title:
      it: Nuova richiesta
      en: New request
    roles:
    - user
    - admin
  - key: garments_list
    type: table
    title:
      it: Capi
      en: Garments
    source: collection:garments
    roles:
    - user
    - admin
    data:
      display: table
      fields:
      - key: brand
        label: Brand
      - key: name
        label: Nome
      - key: color
        label: Colore
      - key: size
        label: Taglia
      - key: category
        label: Categoria
        format: badge
      - key: collection
        label: Collezione
      - key: photo_check
        label: Foto
        format: badge
      - key: photo_url
        label: Link
        format: link
      limit: 200
  - key: requests_list
    type: history
    title:
      it: Richieste
      en: Requests
    source: run
    roles:
    - user
    - admin
  - key: request_report
    type: report
    source: run
    printable: true
    nav: false
  - key: reviews
    type: approvals
    title:
      it: Da approvare
      en: To approve
    approvals:
    - image_review
    roles:
    - user
    - admin
  - key: collections_view
    type: table
    title:
      it: Collezioni approvate
      en: Approved collections
    source: collection:image_checks
    roles:
    - user
    - admin
    data:
      display: table
      fields:
      - key: collection
        label: Collezione
      - key: garment
        label: Capo
      - key: verdict
        label: Controllo
        format: badge
      - key: decision
        label: Decisione
        format: badge
      - key: result
        label: Immagine
        format: link
      filters:
      - field: decision
        op: '='
        value: approved
      sort:
        field: collection
        dir: asc
      limit: 200
  - key: monthly
    type: instances
    template: monthly_report
    title:
      it: Report mensile
      en: Monthly report
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Crediti
      en: Credits
    roles:
    - user
  templates:
  - key: monthly_report
    title:
      it: Report mensile
      en: Monthly report
    description:
      it: 'Ogni mese: immagini generate, tasso di approvazione e tempi, per brand.'
      en: 'Monthly: images generated, approval rate and times, per brand.'
    agent: reporter
    params:
    - name: brand
      type: text
      required: true
      label: Brand
    goal: Monthly report for brand "{brand}" (instance {instance}). Today is {date}. Cover the previous month. Write in the
      language with ISO code {lang}.
    schedule:
      cron: 0 6 1 * *
      userCanChange: false
    maxPerUser: 10
    cost:
      perRun: 5
  approvals:
  - key: image_review
    title:
      it: Revisione immagine
      en: Image review
    description: The brand's creative team approves the generated image or requests a regeneration with a comment.
    decidedBy: requester
    fields:
    - result
    - garment
    - verdict
    - issues
  triggers:
  - key: engine_result
    description: The generation engine posts a finished image
    'on':
      webhook: true
    start:
      agent: reviewer
    goal: 'New result: {event}'
  - key: regenerate
    description: 'Rejected image: prepare a new request with the comment'
    'on':
      approval: image_review
      decision: rejected
    start:
      agent: preparer
    goal: 'Regenerate: {event}. Keep the same garment and choices, apply the creative team''s comment.'
  egress:
    hosts:
    - example.invalid
    notes: 'placeholder, remove: engine integration is not available yet'
  billing:
    modes:
    - credits
    signupCredits: 50
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:preparer:
        estimate: 10
        metered: true
    packs:
    - key: small
      credits: 500
      price: 10
      label: Starter
    - key: studio
      credits: 3000
      price: 50
      label: Studio
  extensions:
  - key: generation_engine
    description: 'Sending requests to the external generation engine and receiving results (webhook to /api/hooks/engine_result)
      needs the engine''s API and credentials: not available yet. Until then requests are stored with status ''ready'' and
      results are registered by the engine''s webhook.'
  - key: file_upload
    description: 'Uploading garment photos is not available: the brand gives a link to each photo.'
  - key: pay_per_approved_image
    description: Credits are charged per agent run (estimate); charging exactly one credit amount per approved image needs
      a hook on the approval decision.
  - key: hires_download_and_catalog_push
    description: 'High-resolution download and sending to the catalogue management system need file storage and each brand''s
      catalogue credentials: not available yet.'
  - key: agency_multi_brand
    description: An agency manages several brands through the brand field on every record; separate sub-accounts per brand
      with their own users are not available yet.
  - key: monthly_email
    description: Emailing the monthly report is not available; it is read in the Monthly report view.
