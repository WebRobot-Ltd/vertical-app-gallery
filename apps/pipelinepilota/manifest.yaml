apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: pipelinepilota
  displayName: PipelinePilota
  tagline:
    it: Team di agenti per prospezione B2B e selezione del personale, con approvazione umana.
    en: Agent teams for B2B prospecting and recruiting, with human approval.
  description:
    it: 'Un catalogo di team di agenti per team commerciali e HR: ogni mattina alle 7 ricercano aziende o analizzano candidature,
      preparano bozze e le mettono in coda per l''approvazione. Nessuna email parte senza il via libera.'
    en: 'A catalogue of agent teams for sales and HR: every morning at 7 they research companies or screen applications, prepare
      drafts and queue them for approval. No email is sent without sign-off.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1d3557'
      accent: '#e07a1f'
      background: '#f7f8fa'
      foreground: '#16202c'
    fonts:
      body: Inter
      display: Manrope
    wordmark:
    - text: Pipeline
      color: primary
    - text: Pilota
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Team
        en: Teams
      href: '#team'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label:
        it: Admin aziendale
        en: Company admin
      assignedBy: admin_emails
    - key: commerciale
      label:
        it: Commerciale
        en: Sales
      assignedBy: invite
    - key: recruiter
      label: Recruiter
      assignedBy: invite
    - key: manager
      label: Manager
      assignedBy: invite
  egress:
    hosts:
    - api.ted.europa.eu
    notes: 'TED (appalti pubblici UE): riuso libero anche commerciale, CC BY 4.0. Nessun dato da LinkedIn o social.'
  agents:
  - key: researcher
    role: main
    description: Raccoglie aziende candidate da siti aziendali pubblici e registri open.
    profile:
      inline:
        display_name: Ricercatore prospezione
        crews:
        - id: researcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'Sei un ricercatore commerciale B2B. Dato settore, area, dimensione e ruolo del decisore, trova aziende
            candidate SOLO da siti aziendali pubblici e registri open (camerali, appalti pubblici via lo strumento ted_search:
            POST con body {"query":"buyer-country=ITA AND publication-date>=AAAAMMGG","fields":["publication-number","notice-title","buyer-name","links"],"limit":50,"page":1}).
            Per le pagine web usa il WebRobot MCP per raccogliere dati dai siti aziendali. VIETATO usare LinkedIn, social
            network o dati personali non pubblicati dall''azienda come contatto istituzionale. Produci un report che inizia
            con "# Aziende candidate — <settore> <area>" e una tabella: azienda, sito, sede, dimensione stimata, segnale osservato
            (nuova sede, bando vinto, assunzioni annunciate), fonte (URL). Non inventare mai dati: se non verificabile scrivilo.'
    appTools:
    - name: ted_search
      description: Cerca avvisi di appalti pubblici UE (TED)
      action: http
      http:
        method: POST
        url: https://api.ted.europa.eu/v3/notices/search
        attribution: TED, Publications Office of the EU, CC BY 4.0
    output: markdown
    limits:
      maxTurns: 30
      maxBudgetUsd: 1.0
  - key: analyst
    role: helper
    description: Costruisce il grafo di relazioni tra aziende, settori e segnali.
    profile:
      inline:
        display_name: Analista grafo relazioni
        crews:
        - id: analyst
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un analista. Ricevi le aziende candidate dal ricercatore. Costruisci un grafo di relazioni tra
            aziende, settori e segnali (nuove sedi, bandi vinti, assunzioni annunciate). Inizia con "# Grafo e priorità".
            Sezioni: ## Nodi e archi (elenco ''A —[relazione]→ B'' con fonte), ## Priorità (punteggio 1-5 per azienda con
            motivazione), ## Segnali da sfruttare. Usa solo fatti presenti nell''input; non inventare cifre.'
    output: markdown
  - key: copywriter
    role: helper
    description: Scrive email personalizzate e le sottopone ad approvazione.
    awaits:
    - send_draft
    writesTo:
      collection: drafts
      parse: markdown_sections
    profile:
      inline:
        display_name: Copywriter email
        crews:
        - id: copywriter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un copywriter B2B. Per le prime aziende per priorità scrivi una bozza di email personalizzata
            (oggetto + corpo, max 120 parole) che cita il segnale reale osservato e la proposta di valore. Inizia con "# Bozze
            email — <data>" e una sezione ## per azienda. Tono professionale, nessuna promessa non verificabile, conformità
            GDPR (offri la cancellazione). Non inviare nulla: per ogni bozza chiedi approvazione con lo strumento request_send_draft;
            il commerciale decide.'
    output: markdown
  - key: cv_screener
    role: helper
    description: Analizza le candidature ricevute (testo incollato o link) rispetto al profilo cercato.
    profile:
      inline:
        display_name: Selezione candidature
        crews:
        - id: cv_screener
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un assistente di selezione del personale. Valuta le candidature fornite rispetto ai requisiti,
            solo su criteri professionali (mai età, genere, origine, salute, ecc.). Inizia con "# Selezione — <ruolo>". Sezioni:
            ## Short list (punteggio 1-5 e motivazione per candidato), ## Dubbi da verificare, ## Domande per il colloquio.
            Non inventare informazioni assenti dal CV. La decisione finale spetta sempre a una persona.'
    output: markdown
  - key: recruit_writer
    role: helper
    description: Prepara risposte ai candidati, da approvare.
    awaits:
    - send_draft
    writesTo:
      collection: drafts
      parse: markdown_sections
    profile:
      inline:
        display_name: Redattore comunicazioni candidati
        crews:
        - id: recruit_writer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Scrivi bozze di email ai candidati (invito al colloquio o risposta cortese di non proseguimento)
            in base alla short list ricevuta. Inizia con "# Bozze candidati — <data>" e una sezione ## per candidato. Tono
            rispettoso, nessun motivo discriminatorio. Non inviare nulla: chiedi approvazione con request_send_draft.'
    output: markdown
  teams:
  - key: prospecting
    mode: sequence
    title:
      it: Prospezione B2B
      en: B2B prospecting
    steps:
    - agent: researcher
    - agent: analyst
      after:
      - researcher
    - agent: copywriter
      after:
      - analyst
  - key: hiring
    mode: sequence
    title:
      it: Selezione del personale
      en: Recruiting
    steps:
    - agent: cv_screener
    - agent: recruit_writer
      after:
      - cv_screener
  approvals:
  - key: send_draft
    title:
      it: Approva l'invio della bozza
      en: Approve sending the draft
    decidedBy: requester
    fields:
    - company
    - subject
    - body
  templates:
  - key: prospecting_campaign
    title:
      it: Campagna di prospezione
      en: Prospecting campaign
    description:
      it: Ogni mattina alle 7 cerca nuove aziende e prepara bozze da approvare.
      en: Every morning at 7 finds new companies and prepares drafts to approve.
    team: prospecting
    params:
    - name: sector
      type: text
      required: true
      label:
        it: Settore
        en: Sector
    - name: area
      type: text
      required: true
      label:
        it: Area geografica
        en: Geographic area
    - name: company_size
      type: select
      required: true
      label:
        it: Dimensione azienda
        en: Company size
      options:
      - value: 10-50
        label: 10-50
      - value: 50-250
        label: 50-250
      - value: 250+
        label: 250+
    - name: decision_role
      type: text
      required: true
      label:
        it: Ruolo del decisore
        en: Decision-maker role
    - name: value_prop
      type: textarea
      required: true
      maxLength: 600
      label:
        it: Proposta di valore
        en: Value proposition
    goal: 'Campagna "{instance}". Settore: {sector}. Area: {area}. Dimensione: {company_size}. Decisore: {decision_role}.
      Proposta di valore: {value_prop}. Oggi è {date}. Cerca solo aziende nuove rispetto ai giorni precedenti. Scrivi in lingua
      ISO {lang}.'
    schedule:
      cron: 0 7 * * *
      userCanChange: true
    maxPerUser: 5
    roles:
    - commerciale
    - admin
    - manager
    cost:
      perRun: 10
  - key: hiring_campaign
    title:
      it: Selezione candidati
      en: Candidate screening
    description:
      it: Valuta ogni mattina le candidature incollate o linkate e prepara le risposte da approvare.
      en: Screens pasted or linked applications each morning and drafts replies for approval.
    team: hiring
    params:
    - name: job_title
      type: text
      required: true
      label:
        it: Posizione
        en: Position
    - name: requirements
      type: textarea
      required: true
      maxLength: 800
      label:
        it: Requisiti
        en: Requirements
    - name: applications
      type: textarea
      required: true
      maxLength: 8000
      label:
        it: Candidature (testo o link)
        en: Applications (text or links)
    goal: 'Selezione "{instance}" per {job_title}. Requisiti: {requirements}. Candidature:

      {applications}

      Oggi è {date}. Scrivi in lingua ISO {lang}.'
    schedule:
      cron: 0 7 * * *
      userCanChange: true
    maxPerUser: 5
    roles:
    - recruiter
    - admin
    - manager
    cost:
      perRun: 10
  data:
    collections:
    - name: drafts
      ownedBy: instance
      description: Bozze di email in coda di approvazione
      fields:
      - name: company
        type: text
        label: Company
      - name: subject
        type: text
        label: Subject
      - name: body
        type: textarea
        label: Body
      - name: status
        type: text
        label: Status
  schedules: []
  views:
  - key: home
    type: page
    nav: false
    title: PipelinePilota
    sections:
    - type: hero
      title:
        it: Il tuo team commerciale e HR, con **agenti AI** che lavorano dalle 7 del mattino.
        en: Your sales and HR team, with **AI agents** working from 7 a.m.
      text:
        it: 'Prospezione B2B e selezione del personale: gli agenti ricercano, analizzano e scrivono le bozze. Tu approvi,
          niente parte senza il tuo via libera.'
        en: 'B2B prospecting and recruiting: agents research, analyse and draft. You approve; nothing goes out without your
          sign-off.'
      actions:
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: primary
      - label:
          it: Come funziona
          en: How it works
        href: '#come-funziona'
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Configura
          en: Set up
        text:
          it: L'admin invita colleghi (commerciale, recruiter, manager) e sceglie i team dal catalogo.
          en: The admin invites colleagues (sales, recruiter, manager) and picks teams from the catalogue.
      - title:
          it: Gli agenti lavorano
          en: Agents work
        text:
          it: Ogni mattina alle 7 ricercatore, analista e copywriter producono aziende, grafo di segnali e bozze.
          en: Every morning at 7 researcher, analyst and copywriter produce companies, a signal graph and drafts.
      - title:
          it: Approvi
          en: You approve
        text:
          it: 'Le bozze finiscono in una coda: le rivedi, modifichi e approvi.'
          en: 'Drafts land in a queue: review, edit and approve.'
    - type: cards
      id: team
      title:
        it: Team disponibili
        en: Available teams
      items:
      - title:
          it: Prospezione B2B
          en: B2B prospecting
        text:
          it: 'Fonti: siti aziendali pubblici, registri camerali, appalti pubblici (TED). Nessun dato da LinkedIn o social.'
          en: 'Sources: public company sites, business registers, public procurement (TED). No LinkedIn or social data.'
        badge: 🔎
      - title:
          it: Selezione del personale
          en: Recruiting
        text:
          it: Valuta le candidature ricevute e prepara risposte ai candidati.
          en: Screens received applications and drafts replies to candidates.
        badge: 👥
    - type: note
      content:
        it: 'Supporto alle decisioni: ogni invio e ogni decisione di assunzione restano a una persona. Trattamento dati conforme
          al GDPR.'
        en: 'Decision support: every send and every hiring decision stays with a person. GDPR-compliant data handling.'
  - key: campaigns
    type: instances
    template: prospecting_campaign
    title:
      it: Le mie campagne
      en: My campaigns
    roles:
    - commerciale
    - admin
    - manager
  - key: hiring_views
    type: instances
    template: hiring_campaign
    title:
      it: Le mie selezioni
      en: My screenings
    roles:
    - recruiter
    - admin
    - manager
  - key: queue
    type: approvals
    title:
      it: Coda bozze
      en: Draft queue
    approvals:
    - send_draft
    roles:
    - commerciale
    - recruiter
    - admin
    - manager
  - key: draft_list
    type: table
    title:
      it: Bozze
      en: Drafts
    source: collection:drafts
    columns:
    - company
    - subject
    - status
    roles:
    - commerciale
    - recruiter
    - admin
    - manager
  - key: history
    type: history
    title:
      it: Storico esecuzioni
      en: Run history
    source: run
    roles:
    - commerciale
    - recruiter
    - admin
    - manager
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: account
    type: account
    title:
      it: Abbonamento e crediti
      en: Plan and credits
    roles:
    - admin
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 50
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:researcher:
        estimate: 10
        metered: true
    plans:
    - key: seat
      price: 29
      interval: month
      label:
        it: Posto per utente
        en: Per-seat plan
      credits: 300
      creditsReset: monthly
      roles:
      - admin
    packs:
    - key: credits_1000
      credits: 1000
      price: 10
      label: 1000 crediti
    - key: credits_5000
      credits: 5000
      price: 45
      label: 5000 crediti
  extensions:
  - key: inbox_replies
    description: 'Non ancora disponibile: collegare la casella email, ricevere le risposte e classificarle (interessato, non
      ora, rifiuto), e ricevere le candidature via email. Per ora le candidature si incollano nel modulo e l''invio delle
      email approvate è manuale.'
  - key: crm_oauth_sync
    description: 'Non ancora disponibile: sincronizzazione contatti con il CRM aziendale via OAuth (richiede credenziali per
      cliente).'
  - key: manager_team_view
    description: 'Non ancora disponibile: vista del manager sulle campagne di tutto il team (i dati sono per utente) e report
      settimanale ai manager via email (notifiche non disponibili).'
  - key: per_seat_billing
    description: L'abbonamento per posto è modellato come piano mensile per l'admin; il conteggio dei posti per utente invitato
      richiede logica aggiuntiva.
  - key: workspace_provisioning
    description: 'La creazione di spazi di lavoro separati per azienda è gestita dal deploy: un''app per azienda cliente.'
