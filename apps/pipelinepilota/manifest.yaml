apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: pipelinepilota
  displayName: PipelinePilota
  tagline:
    it: Agenti per prospezione B2B e selezione del personale, con approvazione umana.
    en: Agent teams for B2B prospecting and hiring, with human approval.
  description:
    it: 'Team di agenti per commerciali e HR: ricerca aziende da fonti pubbliche, grafo dei segnali, bozze email da approvare,
      classificazione delle risposte e screening candidature.'
    en: 'Agent teams for sales and HR: company research from public sources, a signal graph, email drafts for approval, reply
      classification and application screening.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#16324f'
      accent: '#e07a1f'
      background: '#f6f8fb'
      foreground: '#18222e'
    fonts:
      body: Inter
      display: Manrope
    wordmark:
    - text: Pipeline
      color: primary
    - text: Pilota
      color: accent
    width: wide
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#how'
    - label:
        it: Regole
        en: Rules
      href: '#rules'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label:
        it: Admin aziendale
        en: Company admin
      assignedBy: admin_emails
    - key: commerciale
      label:
        it: Commerciale
        en: Sales rep
      assignedBy: invite
    - key: recruiter
      label: Recruiter
      assignedBy: invite
    - key: manager
      label: Manager
      assignedBy: invite
  limits:
  - action: run
    per: user
    max: 10
    window: day
  notifications:
    emailOnRunDone: true
  agents:
  - key: prospector
    role: main
    when: mode == 'prospecting'
    description: 'Team: researcher, analyst, copywriter. Draft emails only, never sent without approval.'
    profile:
      inline:
        display_name: Prospecting team
        crews:
        - id: researcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You are the researcher of a B2B prospecting team. Find candidate companies matching sector, area,
            size and decision-maker role, using ONLY public company websites and open registers (chambers of commerce, public
            procurement). NEVER use LinkedIn or any social network. For each company collect: name, website, sector, city,
            a public contact email if published on the company site, the decision-maker role, and public signals (new offices,
            tenders won, hiring announced on the site) with the source URL. Save each with the tool save_prospect. Never invent
            data; skip a company if unsure. Hand a short list to the analyst.'
        - id: analyst
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You are the analyst. From the researched companies build a relationship graph between companies,
            sectors and signals (new office, tender won, hiring). Save each edge with save_edge (source, target, relation,
            signal, source_url). Score each prospect 0-100 for fit with the value proposition and justify it briefly. Real
            data only.
        - id: copywriter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the copywriter. For the top prospects with a public contact email write a short personalized
            email in the requested language, referring to a real signal and the value proposition. Save each with save_draft
            with status ''draft'' (NEVER ''approved'': only the sales rep approves). No claims you cannot support. Finish
            the run with a report starting with ''# Campaign <sector> - <area>'' listing prospects, signals, graph highlights
            and drafts waiting for approval.'
        orchestration:
          type: dag
          entry: researcher
          nodes:
          - id: researcher
            crew: researcher
          - id: analyst
            crew: analyst
          - id: copywriter
            crew: copywriter
          edges:
          - from: researcher
            to: analyst
          - from: analyst
            to: copywriter
    goalTemplate: 'Prospecting campaign. Sector: {sector}. Area: {region}. Company size: {company_size_label}. Decision-maker
      role: {decision_role}. Value proposition: {value_prop}. Today is {date}. Write emails and report in the language with
      ISO code {lang}.'
    appTools:
    - name: save_prospect
      description: Save a candidate company
      action: write
      collection: prospects
      scope: user
    - name: save_edge
      description: Save a relation of the graph
      action: append
      collection: graph_edges
      scope: user
    - name: save_draft
      description: Save an email draft awaiting approval
      action: append
      collection: drafts
      scope: user
    output: markdown
    limits:
      maxTurns: 80
      maxBudgetUsd: 3
  - key: recruiter
    role: main
    when: mode == 'hiring'
    description: 'Team: evaluator and drafter on applications received by email.'
    profile:
      inline:
        display_name: Hiring team
        crews:
        - id: evaluator
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You evaluate job applications received by email (read them with list_candidates and open attachments
            with read_upload). Score each candidate 0-100 against the role and requirements using only job-relevant criteria;
            never use age, gender, origin, health or other protected traits; do not look up candidates on LinkedIn or social
            networks. Update the score and a short summary with save_candidate. Give a shortlist with reasons.
        - id: drafter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You write polite reply drafts (interview invitation or respectful decline) for evaluated candidates
            and save them with save_draft with status 'draft' and kind 'candidate' (NEVER 'approved'). Finish with a report
            starting with '# Selection <role>' with the shortlist, scores and drafts waiting for approval. Human recruiters
            decide.
        orchestration:
          type: dag
          entry: evaluator
          nodes:
          - id: evaluator
            crew: evaluator
          - id: drafter
            crew: drafter
          edges:
          - from: evaluator
            to: drafter
    goalTemplate: 'Candidate selection. Role: {job_title}. Requirements: {requirements}. {?notes}Notes: {notes}{/notes} Today
      is {date}. Write in the language with ISO code {lang}.'
    appTools:
    - name: list_candidates
      description: Read the applications received
      action: read
      collection: candidates
      scope: user
    - name: save_candidate
      description: Update a candidate record
      action: write
      collection: candidates
      scope: user
    - name: save_draft
      description: Save an email draft awaiting approval
      action: append
      collection: drafts
      scope: user
    - name: read_upload
      description: Read an attached CV
      action: read_file
    output: markdown
    limits:
      maxTurns: 50
      maxBudgetUsd: 2
  - key: classifier
    role: helper
    description: Classifies replies arriving in the connected mailbox.
    profile:
      inline:
        display_name: Reply classifier
        crews:
        - id: classifier
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 5
          max_budget_usd: 0.1
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You receive replies to outreach emails. Classify each as interested, not_now or refused and save
            it with save_reply (from_email, subject, body summary, classification, next_step). Never reply by yourself.
    appTools:
    - name: save_reply
      description: Save a classified reply
      action: append
      collection: replies
      scope: user
    output: markdown
  - key: intake
    role: helper
    description: Registers applications received by email.
    profile:
      inline:
        display_name: Application intake
        crews:
        - id: intake
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.15
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You receive job applications by email. Register each with add_candidate (name, email, role_applied,
            summary from the text, status 'new'). Open attached CVs with read_upload. Do not evaluate and do not reply.
    appTools:
    - name: add_candidate
      description: Register a candidate
      action: append
      collection: candidates
      scope: user
    - name: read_upload
      description: Read an attached CV
      action: read_file
    output: markdown
  - key: reporter
    role: scheduled
    description: Weekly report for managers on the records they can see.
    profile:
      inline:
        display_name: Weekly team reporter
        crews:
        - id: reporter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write the weekly report for a manager. Read prospects, drafts, replies and candidates with the
            tools. Start with ''# Weekly team report - <date>''. Sections: Campaigns, Replies (interested / not now / refused
            counts), Drafts waiting for approval, Hiring pipeline, Next actions. Real figures only. Add a ```chart block with
            reply classes when there are replies.'
    appTools:
    - name: read_prospects
      description: Read prospects
      action: read
      collection: prospects
      scope: all
    - name: read_drafts
      description: Read drafts
      action: read
      collection: drafts
      scope: all
    - name: read_replies
      description: Read replies
      action: read
      collection: replies
      scope: all
    - name: read_candidates
      description: Read candidates
      action: read
      collection: candidates
      scope: all
    output: markdown
  templates:
  - key: daily_prospecting
    title:
      it: Prospezione quotidiana
      en: Daily prospecting
    description:
      it: Ogni mattina alle 7 il team cerca nuove aziende e prepara bozze da approvare.
      en: Every morning at 7 the team finds new companies and prepares drafts for approval.
    agent: prospector
    params:
    - name: sector
      type: text
      required: true
      label:
        it: Settore
        en: Sector
    - name: region
      type: text
      required: true
      label:
        it: Area geografica
        en: Area
    - name: company_size
      type: select
      label:
        it: Dimensione
        en: Size
      options:
      - value: small
        label:
          it: Piccola (10-50)
          en: Small (10-50)
      - value: medium
        label:
          it: Media (50-250)
          en: Medium (50-250)
      - value: large
        label:
          it: Grande (250+)
          en: Large (250+)
    - name: decision_role
      type: text
      label:
        it: Ruolo del decisore
        en: Decision-maker role
    - name: value_prop
      type: textarea
      maxLength: 600
      label:
        it: Proposta di valore
        en: Value proposition
    goal: 'Daily prospecting "{instance}". Sector: {sector}. Area: {region}. Size: {company_size}. Decision-maker role: {decision_role}.
      Value proposition: {value_prop}. Find only NEW companies not already saved. Today is {date}. Language ISO code {lang}.'
    schedule:
      cron: 0 7 * * *
      userCanChange: true
    maxPerUser: 5
    roles:
    - commerciale
    - admin
    cost:
      perRun: 30
  - key: daily_hiring
    title:
      it: Selezione quotidiana
      en: Daily hiring
    description:
      it: Ogni mattina alle 7 valuta le nuove candidature arrivate via email.
      en: Every morning at 7 evaluates new applications received by email.
    agent: recruiter
    params:
    - name: job_title
      type: text
      required: true
      label:
        it: Posizione
        en: Role
    - name: requirements
      type: textarea
      maxLength: 800
      label:
        it: Requisiti
        en: Requirements
    goal: 'Daily selection "{instance}". Role: {job_title}. Requirements: {requirements}. Evaluate only candidates with status
      new. Today is {date}. Language ISO code {lang}.'
    schedule:
      cron: 0 7 * * *
      userCanChange: true
    maxPerUser: 5
    roles:
    - recruiter
    - admin
    cost:
      perRun: 20
  - key: weekly_report
    title:
      it: Report settimanale
      en: Weekly report
    description:
      it: Ogni lunedì alle 7 il report del team arriva via email al manager.
      en: Every Monday at 7 the team report is emailed to the manager.
    agent: reporter
    params:
    - name: notes
      type: text
      label:
        it: Focus (facoltativo)
        en: Focus (optional)
    goal: 'Weekly team report. {?notes}Focus: {notes}.{/notes} Today is {date}. Language ISO code {lang}.'
    schedule:
      cron: 0 7 * * 1
      userCanChange: false
    maxPerUser: 1
    roles:
    - manager
    - admin
    cost:
      perRun: 10
    deliver:
      to: owner
      onlyIfNew: true
  inputForm:
    title:
      it: Nuova campagna
      en: New campaign
    fields:
    - name: mode
      type: select
      required: true
      label:
        it: Team di agenti
        en: Agent team
      options:
      - value: prospecting
        label:
          it: Prospezione B2B
          en: B2B prospecting
      - value: hiring
        label:
          it: Selezione del personale
          en: Hiring
    - name: sector
      type: text
      visibleWhen: mode == 'prospecting'
      label:
        it: Settore
        en: Sector
    - name: region
      type: text
      visibleWhen: mode == 'prospecting'
      label:
        it: Area geografica
        en: Area
    - name: company_size
      type: select
      visibleWhen: mode == 'prospecting'
      label:
        it: Dimensione azienda
        en: Company size
      options:
      - value: small
        label:
          it: Piccola (10-50)
          en: Small (10-50)
      - value: medium
        label:
          it: Media (50-250)
          en: Medium (50-250)
      - value: large
        label:
          it: Grande (250+)
          en: Large (250+)
    - name: decision_role
      type: text
      visibleWhen: mode == 'prospecting'
      label:
        it: Ruolo del decisore
        en: Decision-maker role
    - name: value_prop
      type: textarea
      maxLength: 600
      visibleWhen: mode == 'prospecting'
      label:
        it: Proposta di valore
        en: Value proposition
    - name: job_title
      type: text
      visibleWhen: mode == 'hiring'
      label:
        it: Posizione
        en: Role
    - name: requirements
      type: textarea
      maxLength: 800
      visibleWhen: mode == 'hiring'
      label:
        it: Requisiti
        en: Requirements
    - name: notes
      type: textarea
      maxLength: 400
      visibleWhen: mode == 'hiring'
      label:
        it: Note (facoltative)
        en: Notes (optional)
  data:
    collections:
    - name: prospects
      ownedBy: user
      description: Candidate companies from public sources
      retentionDays: 365
      access:
      - role: manager
      fields:
      - name: company
        type: text
        label: Company
      - name: website
        type: url
      - name: sector
        type: text
      - name: city
        type: text
      - name: decision_role
        type: text
      - name: contact_email
        type: email
      - name: signals
        type: textarea
      - name: source_url
        type: url
      - name: score
        type: number
      - name: status
        type: select
        options:
        - new
        - drafted
        - contacted
        - interested
        - not_now
        - refused
    - name: graph_edges
      ownedBy: user
      description: Relations between companies, sectors and signals
      retentionDays: 365
      access:
      - role: manager
      fields:
      - name: source
        type: text
      - name: target
        type: text
      - name: relation
        type: text
      - name: signal
        type: text
      - name: source_url
        type: url
    - name: drafts
      ownedBy: user
      description: 'Email drafts: nothing is sent until the owner approves'
      retentionDays: 180
      access:
      - role: manager
      fields:
      - name: kind
        type: select
        options:
        - outreach
        - candidate
      - name: recipient
        type: text
      - name: contact_email
        type: email
      - name: subject
        type: text
        required: true
      - name: body
        type: textarea
        required: true
      - name: status
        type: select
        required: true
        default: draft
        options:
        - draft
        - approved
        - rejected
    - name: replies
      ownedBy: user
      description: Classified replies from the connected mailbox
      retentionDays: 365
      access:
      - role: manager
      fields:
      - name: from_email
        type: email
      - name: subject
        type: text
      - name: summary
        type: textarea
      - name: classification
        type: select
        options:
        - interested
        - not_now
        - refused
      - name: next_step
        type: text
    - name: candidates
      ownedBy: user
      description: Applications received by email
      retentionDays: 365
      access:
      - role: manager
      fields:
      - name: name
        type: text
      - name: email
        type: email
      - name: role_applied
        type: text
      - name: summary
        type: textarea
      - name: cv
        type: file
        accept:
        - pdf
        - docx
        - txt
        maxMb: 10
        label:
          it: CV
          en: CV
      - name: score
        type: number
      - name: status
        type: select
        options:
        - new
        - evaluated
        - shortlisted
        - rejected
  channels:
  - key: inbox_replies
    type: email
    agent: classifier
  - key: inbox_jobs
    type: email
    agent: intake
  triggers:
  - key: send_approved_draft
    description: The email goes out only when the owner sets the draft to approved
    'on':
      collection: drafts
      op: update
      where:
        status: approved
    notify:
      to:
      - record.contact_email
      subject: '{record.subject}'
      body: '{record.body}'
  views:
  - key: home
    type: page
    nav: false
    sections:
    - type: hero
      eyebrow: PipelinePilota
      title:
        it: Prospezione e selezione, **guidate da agenti**, decise da te.
        en: Prospecting and hiring, **run by agents**, decided by you.
      text:
        it: Ricerca da fonti pubbliche, grafo dei segnali, bozze email in coda di approvazione, risposte classificate. Niente
          LinkedIn, niente invii senza il tuo ok.
        en: Research from public sources, a signal graph, email drafts in an approval queue, classified replies. No LinkedIn,
          nothing sent without your OK.
      actions:
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: primary
    - type: steps
      id: how
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Ricerca
          en: Research
        text:
          it: Aziende da siti pubblici e registri aperti (camerali, appalti).
          en: Companies from public sites and open registers (chambers, tenders).
        badge: 🔎
      - title:
          it: Grafo e bozze
          en: Graph and drafts
        text:
          it: Relazioni e segnali, poi email personalizzate.
          en: Relations and signals, then personalised emails.
        badge: 🕸️
      - title:
          it: Approvi tu
          en: You approve
        text:
          it: Le bozze restano in coda finché non le approvi.
          en: Drafts wait in the queue until you approve them.
        badge: ✅
      - title:
          it: Risposte
          en: Replies
        text:
          it: 'Classificate: interessato, non ora, rifiuto.'
          en: 'Classified: interested, not now, refused.'
        badge: 📬
    - type: note
      id: rules
      content:
        it: Nessun dato da LinkedIn o social. Ogni commerciale vede le proprie campagne, il manager quelle del team.
        en: No data from LinkedIn or social networks. Each user sees their own campaigns, the manager sees the team's.
  - key: new
    type: new_run
    title:
      it: Nuova campagna
      en: New campaign
    roles:
    - commerciale
    - recruiter
    - admin
  - key: campaigns
    type: history
    title:
      it: Le mie campagne
      en: My campaigns
    source: run
    roles:
    - commerciale
    - recruiter
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: queue
    type: table
    title:
      it: Coda di approvazione
      en: Approval queue
    source: collection:drafts
    columns:
    - recipient
    - contact_email
    - subject
    - status
    roles:
    - commerciale
    - recruiter
    - admin
  - key: review_draft
    type: form
    collection: drafts
    fields:
    - subject
    - body
    - status
    edit: true
    nav: false
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Bozza aggiornata. Se approvata, parte l'email.
        en: Draft updated. If approved, the email goes out.
      redirect: queue
    roles:
    - commerciale
    - recruiter
    - admin
  - key: prospects_list
    type: table
    title:
      it: Aziende
      en: Companies
    source: collection:prospects
    columns:
    - company
    - sector
    - city
    - score
    - signals
    - status
    export: true
    roles:
    - commerciale
    - manager
    - admin
  - key: graph
    type: table
    title:
      it: Grafo dei segnali
      en: Signal graph
    source: collection:graph_edges
    columns:
    - source
    - relation
    - target
    - signal
    roles:
    - commerciale
    - manager
    - admin
  - key: replies_list
    type: table
    title:
      it: Risposte
      en: Replies
    source: collection:replies
    columns:
    - from_email
    - subject
    - classification
    - next_step
    roles:
    - commerciale
    - manager
    - admin
  - key: candidates_list
    type: table
    title:
      it: Candidature
      en: Candidates
    source: collection:candidates
    columns:
    - name
    - role_applied
    - score
    - status
    - summary
    roles:
    - recruiter
    - manager
    - admin
  - key: automations
    type: instances
    template: daily_prospecting
    title:
      it: Prospezione ogni mattina
      en: Daily prospecting
    roles:
    - commerciale
    - admin
  - key: hiring_auto
    type: instances
    template: daily_hiring
    title:
      it: Selezione ogni mattina
      en: Daily hiring
    roles:
    - recruiter
    - admin
  - key: weekly
    type: instances
    template: weekly_report
    title:
      it: Report settimanale
      en: Weekly report
    roles:
    - manager
    - admin
  - key: account
    type: account
    title:
      it: Posti e crediti
      en: Seats and credits
    roles:
    - admin
    - manager
  billing:
    modes:
    - subscription
    - credits
    signupCredits: 50
