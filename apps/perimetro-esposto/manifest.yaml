apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: perimetro-esposto
  displayName: Perimetro Esposto
  tagline:
    it: Il rating di sicurezza della superficie internet della tua azienda, da A a F.
    en: A security rating, A to F, for your company's internet-facing surface.
  description:
    it: 'Analisi solo passiva dei domini: sottodomini da Certificate Transparency, DNS (SPF, DMARC, DNSSEC, MX), certificati,
      header HTTP, versioni software incrociate con NVD e CISA KEV. Punteggio per categoria, report con priorità di correzione
      e scansione settimanale con avviso se il voto peggiora.'
    en: 'Passive-only analysis of domains: subdomains from Certificate Transparency, DNS (SPF, DMARC, DNSSEC, MX), certificates,
      HTTP headers, software versions cross-checked with NVD and CISA KEV. Per-category score, a report with fix priorities
      and a weekly scan that flags a worse grade.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#10243a'
      accent: '#d9480f'
      background: '#f6f7f9'
      foreground: '#17212b'
    fonts:
      body: Inter
      display: IBM Plex Sans
    wordmark:
    - text: Perimetro
      color: primary
    - text: Esposto
      color: accent
    width: wide
    headingWeight: 600
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Punteggio
        en: Scoring
      href: '#punteggio'
    - label:
        it: Piani
        en: Plans
      href: '#piani'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      label:
        it: Cliente / broker
        en: Customer / broker
      assignedBy: signup
  limits:
  - action: agent:scanner
    per: user
    max: 5
    window: day
    roles:
    - user
  egress:
    hosts:
    - crt.sh
    - dns.google
    - services.nvd.nist.gov
    - www.cisa.gov
    notes: 'crt.sh: public Certificate Transparency search, passive. dns.google: Google Public DNS JSON over HTTPS, public
      records only. services.nvd.nist.gov: NIST NVD API 2.0, public domain data. www.cisa.gov: Known Exploited Vulnerabilities
      catalog, free reuse.'
  agents:
  - key: scanner
    role: main
    description: One-off passive scan of the submitted domains, with grade and prioritised report.
    profile:
      inline:
        display_name: Perimetro Esposto scanner
        crews:
        - id: scanner
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: "You are an external attack-surface analyst. You perform PASSIVE analysis only: public sources and\
            \ normal GET requests to public pages. You never port-scan, brute-force, fuzz, log in, or exploit anything.\n\n\
            FIRST CHECK: if the goal says the user did NOT declare authorization, or a domain is not a plain registrable domain,\
            \ answer only with \"# Analisi non eseguita\" and one sentence explaining why. Do nothing else.\n\nMETHOD for\
            \ each domain (max 5 domains):\n1. Subdomains: crtsh_search with query q=%25.<domain>&output=json; deduplicate\
            \ names, drop wildcards, count them, flag names suggesting staging/dev/test/admin/vpn/old.\n2. DNS: dns_query\
            \ (name=<domain>&type=TXT / MX / and name=_dmarc.<domain>&type=TXT, with do=1 for DNSSEC: check the AD flag and\
            \ DS record). Evaluate SPF (present, ends in -all or ~all, not +all, lookup count), DMARC (policy none/quarantine/reject,\
            \ rua), DNSSEC, MX.\n3. Certificates: from crt.sh data note expiry of current certificates, issuers, very recent\
            \ issuance on unknown hosts. \n4. HTTP: with the WebRobot MCP fetch the home page of the domain and of up to 5\
            \ public subdomains (GET only) and read the response headers (HSTS, CSP, X-Frame-Options, X-Content-Type-Options,\
            \ Referrer-Policy, Server, X-Powered-By) and the declared software versions (Server, generator meta, script paths).\n\
            5. Vulnerabilities: for each declared product+version call nvd_search (keywordSearch or cpeName, resultsPerPage\
            \ small). Then check kev_catalog and mark any CVE that is in CISA KEV as ACTIVELY EXPLOITED. Only report a CVE\
            \ when product and version genuinely match; say 'to verify' when the version is a guess.\n6. Shodan and Have I\
            \ Been Pwned: not connected in this version. State in the report that open ports and breached credentials were\
            \ NOT assessed.\n\nSCORING (0-100 per category, then weighted): Email & DNS authentication 20%, TLS & certificates\
            \ 15%, HTTP security headers 15%, Software versions & CVEs 25%, Attack surface (subdomains, forgotten hosts) 15%,\
            \ Exposures (ports, breaches) 10% — when not assessed, redistribute that weight proportionally and say so. Grade:\
            \ A >=90, B >=75, C >=60, D >=40, E >=25, F <25. Cap the grade at D if any CISA KEV vulnerability is present.\
            \ Never invent findings or figures; if a source failed, say so and lower confidence rather than guessing. Adjust\
            \ severity by the sector given.\n\nOUTPUT in the language of the goal: first line \"# Rating di sicurezza — <main\
            \ domain> — <grade>\" (translate for English). Then ## Sintesi (grade, score, 3 lines), ## Punteggio per categoria\
            \ (table with weight, score, key finding) followed by a chart block:\n```chart\n{\"type\":\"bar\",\"title\":\"\
            Punteggio per categoria\",\"labels\":[\"...\"],\"series\":[{\"name\":\"Score\",\"values\":[0]}],\"unit\":\"/100\"\
            }\n```\nThen ## Priorità di correzione (numbered, each with: finding, evidence, impact, how to fix, effort low/medium/high;\
            \ exploited CVEs first), ## Dettaglio per dominio, ## Fonti e limiti (sources with dates, what was not assessed).\
            \ Passive analysis is not a penetration test or a compliance certification; say so in one line."
    appTools:
    - name: crtsh_search
      description: 'Search Certificate Transparency logs on crt.sh. Query: q=%25.example.com&output=json'
      action: http
      http:
        method: GET
        url: https://crt.sh/
        attribution: crt.sh Certificate Transparency search
        maxBytes: 2000000
        timeoutMs: 30000
    - name: dns_query
      description: 'Public DNS lookup via Google DNS over HTTPS. Query: name=example.com&type=TXT (types MX, TXT, DS, DNSKEY);
        add do=1 to see the AD (DNSSEC validated) flag'
      action: http
      http:
        method: GET
        url: https://dns.google/resolve
        attribution: Google Public DNS
    - name: nvd_search
      description: 'Search NIST NVD CVEs. Query: keywordSearch=nginx%201.18.0&resultsPerPage=10 or cpeName=cpe:2.3:...'
      action: http
      http:
        method: GET
        url: https://services.nvd.nist.gov/rest/json/cves/2.0
        attribution: NIST National Vulnerability Database
        maxBytes: 500000
        timeoutMs: 30000
    - name: kev_catalog
      description: Full CISA Known Exploited Vulnerabilities catalog (JSON, field vulnerabilities[].cveID)
      action: http
      http:
        method: GET
        url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
        attribution: CISA KEV catalog
        maxBytes: 2000000
        timeoutMs: 30000
    goalTemplate: 'Domini da analizzare (uno per riga):

      {domains}

      Settore: {sector_label}

      {?authorized}Autorizzazione dichiarata dal cliente: SÌ{/authorized}{!authorized}Autorizzazione dichiarata dal cliente:
      NO{/authorized}

      Email per gli avvisi: {alert_email}

      Data: {date}. Scrivi il report nella lingua con codice ISO {lang}.'
    output: markdown
    limits:
      maxTurns: 40
      maxBudgetUsd: 1.5
  - key: watcher
    role: helper
    description: Weekly passive re-scan of one client's domains; compares with last week and raises an alert.
    memory: instance
    output: markdown+json
    resultSchema:
      type: object
      properties:
        date:
          type: string
        grade:
          type: string
        score:
          type: number
        previous_grade:
          type: string
        alert:
          type: boolean
        alert_reason:
          type: string
        summary:
          type: string
      required:
      - date
      - grade
      - score
      - alert
    writesTo:
      collection: scan_results
      parse: json_last
      keyBy: date
    profile:
      inline:
        display_name: Perimetro Esposto weekly watcher
        crews:
        - id: watcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You repeat every week a PASSIVE external security scan of the client''s domains (never port-scan,
            brute-force, log in or exploit). If the goal says authorization was not declared, output only "# Analisi non eseguita"
            and a JSON block with alert false, grade "-".


            Method: crtsh_search for subdomains; dns_query for SPF, DMARC, MX and DNSSEC; certificates expiry from crt.sh;
            HTTP headers and declared software versions of the home pages via the WebRobot MCP (GET only); nvd_search for
            product+version matches and kev_catalog to mark CISA KEV exploited CVEs. Shodan and HIBP are not connected: say
            they were not assessed.


            Scoring: Email & DNS 20%, TLS & certificates 15%, headers 15%, software & CVEs 25%, attack surface 15%, exposures
            10% (redistribute if not assessed). Grade A>=90, B>=75, C>=60, D>=40, E>=25, F<25; cap at D if any KEV vulnerability.
            Never invent findings.


            Your memory holds last week''s grade, score, and known KEV CVEs and subdomains: lead with what changed. ALERT
            = true when the grade is worse than last week OR a CISA KEV vulnerability appears that was not in memory; alert_reason
            says which, in one sentence.


            Output: "# Scansione settimanale — <client or main domain> — <grade>", then ## Cosa è cambiato, ## Priorità di
            correzione (numbered, exploited first), ## Punteggio per categoria (table), ## Limiti. Under 600 words. End with
            ONE fenced json block: {"date":"YYYY-MM-DD","grade":"B","score":78,"previous_grade":"B","alert":false,"alert_reason":"","summary":"two
            sentences"}. Finally call the tool remember once with grade, score, KEV CVE ids and the list of subdomains (replaces
            old memory).'
    appTools:
    - name: crtsh_search
      description: 'Search Certificate Transparency logs on crt.sh. Query: q=%25.example.com&output=json'
      action: http
      http:
        method: GET
        url: https://crt.sh/
        attribution: crt.sh Certificate Transparency search
        maxBytes: 2000000
        timeoutMs: 30000
    - name: dns_query
      description: 'Public DNS lookup via Google DNS over HTTPS. Query: name=example.com&type=TXT (types MX, TXT, DS, DNSKEY);
        add do=1 to see the AD (DNSSEC validated) flag'
      action: http
      http:
        method: GET
        url: https://dns.google/resolve
        attribution: Google Public DNS
    - name: nvd_search
      description: 'Search NIST NVD CVEs. Query: keywordSearch=nginx%201.18.0&resultsPerPage=10 or cpeName=cpe:2.3:...'
      action: http
      http:
        method: GET
        url: https://services.nvd.nist.gov/rest/json/cves/2.0
        attribution: NIST National Vulnerability Database
        maxBytes: 500000
        timeoutMs: 30000
    - name: kev_catalog
      description: Full CISA Known Exploited Vulnerabilities catalog (JSON, field vulnerabilities[].cveID)
      action: http
      http:
        method: GET
        url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
        attribution: CISA KEV catalog
        maxBytes: 2000000
        timeoutMs: 30000
    limits:
      maxTurns: 40
      maxBudgetUsd: 1.5
  inputForm:
    title:
      it: Nuova analisi
      en: New scan
    fields:
    - name: domains
      type: textarea
      required: true
      maxLength: 500
      label:
        it: Domini (uno per riga, max 5)
        en: Domains (one per line, max 5)
      help:
        it: es. azienda.it
        en: e.g. company.com
    - name: sector
      type: select
      required: true
      label:
        it: Settore
        en: Sector
      options:
      - value: finance
        label:
          it: Finanza e assicurazioni
          en: Finance and insurance
      - value: health
        label:
          it: Sanità
          en: Healthcare
      - value: manufacturing
        label:
          it: Manifattura
          en: Manufacturing
      - value: retail
        label:
          it: Commercio e e-commerce
          en: Retail and e-commerce
      - value: public
        label:
          it: Pubblica amministrazione
          en: Public sector
      - value: tech
        label:
          it: Tecnologia e servizi digitali
          en: Technology
      - value: services
        label:
          it: Servizi professionali
          en: Professional services
      - value: other
        label:
          it: Altro
          en: Other
    - name: alert_email
      type: email
      required: true
      label:
        it: Email per gli avvisi
        en: Alert email
    - name: authorized
      type: boolean
      required: true
      label:
        it: Dichiaro di essere autorizzato ad analizzare questi domini
        en: I declare I am authorised to analyse these domains
  data:
    collections:
    - name: scan_results
      ownedBy: instance
      description: 'Weekly scan outcome of each domain watch: grade, score, alert'
      fields:
      - name: date
        type: date
      - name: grade
        type: text
      - name: score
        type: number
      - name: previous_grade
        type: text
      - name: alert
        type: boolean
      - name: alert_reason
        type: text
      - name: summary
        type: textarea
  templates:
  - key: domain_watch
    title:
      it: Monitoraggio settimanale
      en: Weekly monitoring
    description:
      it: Ogni lunedì riesegue la scansione passiva dei domini di un cliente e segnala se il voto peggiora o compare una vulnerabilità
        sfruttata.
      en: Every Monday re-runs the passive scan of a client's domains and flags a worse grade or a newly exploited vulnerability.
    agent: watcher
    params:
    - name: client
      type: text
      required: true
      label:
        it: Nome cliente o azienda
        en: Client or company name
    - name: domains
      type: textarea
      required: true
      maxLength: 500
      label:
        it: Domini (uno per riga, max 5)
        en: Domains (one per line, max 5)
    - name: sector
      type: select
      required: true
      label:
        it: Settore
        en: Sector
      options:
      - finance
      - health
      - manufacturing
      - retail
      - public
      - tech
      - services
      - other
    - name: alert_email
      type: email
      required: true
      label:
        it: Email per gli avvisi
        en: Alert email
    - name: authorized
      type: boolean
      required: true
      label:
        it: Dichiaro di essere autorizzato ad analizzare questi domini
        en: I declare I am authorised to analyse these domains
    goal: 'Watch "{instance}" (client {client}). Domains, one per line:

      {domains}

      Sector: {sector}. Alert email: {alert_email}.

      {?authorized}Authorization declared: YES{/authorized}{!authorized}Authorization declared: NO{/authorized}

      Today is {date}. Write the report in the language with ISO code {lang}.'
    schedule:
      cron: 0 5 * * 1
      userCanChange: false
    maxPerUser: 25
    cost:
      perRun: 40
  views:
  - key: home
    type: page
    nav: false
    title: Perimetro Esposto
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow:
        it: Per responsabili IT e broker assicurativi
        en: For IT managers and insurance brokers
      title:
        it: Che voto prende la **superficie internet** della tua azienda?
        en: What grade does your company's **internet surface** get?
      text:
        it: Un agente AI analizza in modo solo passivo i tuoi domini e assegna un rating da A a F, con un report di correzioni
          in ordine di priorità. Ogni settimana si ripete e ti avvisa se il voto peggiora.
        en: An AI agent passively analyses your domains and assigns an A to F rating, with a prioritised fix list. It repeats
          weekly and warns you when the grade drops.
      actions:
      - label:
          it: Analizza un dominio
          en: Scan a domain
        href: /v/new_scan
        style: primary
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: ghost
      aside: <div style="padding:20px;text-align:center"><div style="font-size:64px;font-weight:700;color:#d9480f">C</div><div>azienda.it
        · 62/100</div><div style="margin-top:8px;font-size:14px">1 vulnerabilità CISA KEV · DMARC in modalità none</div></div>
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Inserisci i domini
          en: Enter your domains
        text:
          it: Domini, settore, email per gli avvisi e dichiarazione di autorizzazione.
          en: Domains, sector, alert email and authorisation declaration.
        badge: '1'
      - title:
          it: Analisi passiva
          en: Passive analysis
        text:
          it: Sottodomini da Certificate Transparency, DNS, certificati, header HTTP, versioni software contro NVD e CISA
            KEV. Nessuna scansione attiva.
          en: Subdomains from Certificate Transparency, DNS, certificates, HTTP headers, software versions against NVD and
            CISA KEV. No active scanning.
        badge: '2'
      - title:
          it: Rating e priorità
          en: Rating and priorities
        text:
          it: Voto da A a F e report con le correzioni in ordine di urgenza.
          en: A to F grade and a report with fixes in order of urgency.
        badge: '3'
      - title:
          it: Controllo ogni settimana
          en: Weekly monitoring
        text:
          it: Se il voto peggiora o compare una vulnerabilità sfruttata, l'avviso compare nell'app.
          en: If the grade worsens or an exploited vulnerability appears, the alert shows up in the app.
        badge: '4'
    - type: cards
      id: punteggio
      title:
        it: Come si calcola il voto
        en: How the grade is calculated
      intro:
        it: Pesi per categoria; una vulnerabilità del catalogo CISA KEV limita il voto a D.
        en: Weights per category; a CISA KEV vulnerability caps the grade at D.
      items:
      - title:
          it: Email e DNS · 20%
          en: Email and DNS · 20%
        text: SPF, DMARC, DNSSEC, MX
      - title:
          it: Certificati TLS · 15%
          en: TLS certificates · 15%
        text:
          it: Scadenze, emittenti, host dimenticati
          en: Expiry, issuers, forgotten hosts
      - title:
          it: Header HTTP · 15%
          en: HTTP headers · 15%
        text: HSTS, CSP, X-Frame-Options
      - title:
          it: Software e CVE · 25%
          en: Software and CVEs · 25%
        text:
          it: Versioni dichiarate contro NVD e CISA KEV
          en: Declared versions against NVD and CISA KEV
      - title:
          it: Superficie esposta · 15%
          en: Attack surface · 15%
        text:
          it: Sottodomini di test, admin, vecchi
          en: Test, admin, legacy subdomains
      - title:
          it: Esposizioni · 10%
          en: Exposures · 10%
        text:
          it: Porte e credenziali in breach (Shodan e HIBP, in arrivo)
          en: Ports and breached credentials (Shodan and HIBP, coming)
    - type: cards
      id: piani
      title:
        it: Piani
        en: Plans
      items:
      - title: Starter · 49 €/mese
        text:
          it: Fino a 5 domini, scansione settimanale.
          en: Up to 5 domains, weekly scan.
      - title: Pro · 149 €/mese
        text:
          it: 'Fino a 25 domini: ideale per i broker.'
          en: 'Up to 25 domains: ideal for brokers.'
      - title: Business · 399 €/mese
        text:
          it: Fino a 100 domini.
          en: Up to 100 domains.
    - type: note
      content:
        it: Analisi solo passiva su fonti pubbliche, da eseguire su domini per cui sei autorizzato. Non è un penetration test
          né una certificazione di conformità.
        en: Passive analysis of public sources, only for domains you are authorised to analyse. It is not a penetration test
          or a compliance certification.
  - key: new_scan
    type: new_run
    title:
      it: Nuova analisi
      en: New scan
    roles:
    - user
    - admin
  - key: scans
    type: history
    title:
      it: Le mie analisi
      en: My scans
    source: run
    roles:
    - user
    - admin
  - key: scan
    type: report
    title:
      it: Report
      en: Report
    source: run
    printable: true
    nav: false
  - key: watches
    type: instances
    template: domain_watch
    title:
      it: Domini monitorati
      en: Monitored domains
    roles:
    - user
    - admin
  - key: grades
    type: table
    title:
      it: Storico voti e avvisi
      en: Grade history and alerts
    source: collection:scan_results
    columns:
    - date
    - grade
    - score
    - previous_grade
    - alert
    - alert_reason
    - summary
    data:
      display: table
      fields:
      - key: date
        label:
          it: Data
          en: Date
        format: date
      - key: grade
        label:
          it: Voto
          en: Grade
        format: badge
      - key: score
        label: Score
        format: number
      - key: previous_grade
        label:
          it: Voto precedente
          en: Previous
        format: badge
      - key: alert
        label:
          it: Avviso
          en: Alert
        format: badge
      - key: alert_reason
        label:
          it: Motivo
          en: Reason
      sort:
        field: date
        dir: desc
      limit: 100
      empty:
        it: Nessuna scansione settimanale ancora.
        en: No weekly scan yet.
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Plan
    roles:
    - user
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 60
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:scanner:
        estimate: 60
        metered: true
    packs:
    - key: scans
      credits: 500
      price: 9
      label:
        it: Pacchetto analisi
        en: Scan pack
    plans:
    - key: starter
      price: 49
      interval: month
      label: Starter — 5 domini
      includes:
      - Up to 5 domains
      - Weekly monitoring
      credits: 1000
      creditsReset: monthly
      roles:
      - user
    - key: pro
      price: 149
      interval: month
      label: Pro — 25 domini
      includes:
      - Up to 25 domains
      - Weekly monitoring
      credits: 5000
      creditsReset: monthly
      roles:
      - user
    - key: business
      price: 399
      interval: month
      label: Business — 100 domini
      includes:
      - Up to 100 domains
      - Weekly monitoring
      credits: 20000
      creditsReset: monthly
      roles:
      - user
  extensions:
  - key: email_alerts
    description: 'Email alerts when the grade worsens or a KEV vulnerability appears are not available yet: the alert is recorded
      in scan_results (alert, alert_reason) and shown in the ''Storico voti e avvisi'' view. The alert_email is collected
      for when notifications are supported.'
  - key: shodan_hibp_keys
    description: Connecting each customer's own Shodan and Have I Been Pwned API keys needs per-customer credentials, not
      available yet. The agents declare in the report that ports and breached credentials were not assessed and redistribute
      that 10% weight.
  - key: broker_client_hierarchy
    description: A broker sees all the domains of their clients by creating one monitored-domain entry per client under their
      own account; a client invited into the same records (separate login with read-only access) needs per-record sharing,
      not modelled here.
  - key: plan_domain_cap
    description: The domain cap per plan (5 / 25 / 100) is enforced only through maxPerUser on watches and the monthly credit
      allowance, not as an exact per-domain counter.
  - key: authorization_proof
    description: The authorisation checkbox is required in the form and checked by the agent (it refuses to scan without it);
      a stored audit log of the declaration is the run's own input.
