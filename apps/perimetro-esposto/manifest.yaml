apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: perimetro-esposto
  displayName: Perimetro Esposto
  tagline:
    it: Un rating di sicurezza da A a F per la superficie internet della tua azienda.
    en: An A-to-F security rating for your company's internet exposure.
  description:
    it: 'Analisi solo passiva dei domini: sottodomini, DNS, certificati, header HTTP, vulnerabilità note (NVD, CISA KEV),
      con scansione settimanale e alert email se il voto peggiora.'
    en: 'Passive-only domain analysis: subdomains, DNS, certificates, HTTP headers, known vulnerabilities (NVD, CISA KEV),
      with weekly scans and email alerts when the grade worsens.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: dashboard
  branding:
    theme: light
    palette:
      primary: '#0f1e33'
      accent: '#d64a2f'
      background: '#f6f7f9'
      foreground: '#16202e'
    fonts:
      body: Inter
      display: IBM Plex Sans
    wordmark:
    - text: Perimetro
      color: primary
    - text: Esposto
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Voto
        en: Grading
      href: '#voto'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
    - key: broker
      label:
        it: Broker
        en: Broker
      assignedBy: derived
      from: collection:scans.broker_email
  limits:
  - action: agent:scanner
    per: user
    max: 5
    window: month
    plans:
      solo: 30
      business: 130
      broker: 520
  - action: login
    per: ip
    max: 20
    window: hour
  agents:
  - key: scanner
    role: scheduled
    description: 'Passive weekly scan of one domain: grade A-F, report, alert flags.'
    memory: instance
    writesTo:
      collection: scans
      parse: json_last
    output: markdown+json
    resultSchema:
      type: object
      properties:
        domain:
          type: string
        sector:
          type: string
        scan_date:
          type: string
        grade:
          type: string
          enum:
          - A
          - B
          - C
          - D
          - F
        score:
          type: number
        previous_grade:
          type: string
        worsened:
          type: boolean
        kev_found:
          type: boolean
        kev_count:
          type: number
        critical_count:
          type: number
        summary:
          type: string
        alert_email:
          type: string
        broker_email:
          type: string
    limits:
      maxTurns: 60
      maxBudgetUsd: 1.5
      timeoutSeconds: 900
    appTools:
    - name: crtsh_search
      description: 'Certificate Transparency log search on crt.sh. query: q=%25.example.com&output=json'
      action: http
      http:
        method: GET
        url: https://crt.sh/
        attribution: crt.sh (Sectigo), public CT logs
    - name: dns_lookup
      description: 'DNS over HTTPS (Cloudflare). query: name=<host>&type=TXT|MX|A|DS|DNSKEY|CAA. For DMARC query _dmarc.<domain>
        TXT.'
      action: http
      http:
        method: GET
        url: https://cloudflare-dns.com/dns-query
        headers:
          Accept: application/dns-json
        attribution: Cloudflare public DNS
    - name: nvd_search
      description: 'NVD CVE API 2.0. query: cpeName=... or keywordSearch=<product version>&resultsPerPage=20; hasKev adds
        only CISA KEV entries.'
      action: http
      http:
        method: GET
        url: https://services.nvd.nist.gov/rest/json/cves/2.0
        attribution: NIST National Vulnerability Database
    - name: kev_catalog
      description: CISA Known Exploited Vulnerabilities catalog (JSON). Check whether a CVE id appears in it.
      action: http
      http:
        method: GET
        url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
        maxBytes: 2000000
        timeoutMs: 30000
        attribution: CISA KEV catalog
    - name: shodan_host
      description: 'Shodan host info (open ports, banners) for an IP, using the user''s own Shodan key. path: /<ip>'
      action: http
      http:
        method: GET
        url: https://api.shodan.io/shodan/host
        allowPath: true
        credential:
          provider: shodan
          query: key
        attribution: Shodan
    - name: hibp_domain
      description: 'Have I Been Pwned: breached accounts of a verified domain, with the user''s own key. path: /<domain>'
      action: http
      http:
        method: GET
        url: https://haveibeenpwned.com/api/v3/breacheddomain
        allowPath: true
        headers:
          user-agent: PerimetroEsposto
        credential:
          provider: hibp
          header: hibp-api-key
          format: '{secret}'
        attribution: Have I Been Pwned
    profile:
      inline:
        display_name: Perimetro Esposto scanner
        crews:
        - id: scanner
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 60
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You are a passive external attack-surface analyst. You rate ONE domain from A to F.


            SAFETY: if the goal says authorized is not true, stop and write only ''# Scan refused'' with the reason; no tools.
            NEVER do active probing: no port scans, no exploitation, no login attempts, no brute force, no fuzzing. Allowed:
            crt.sh, public DNS queries, loading the public home page and obvious public pages (HTTP headers, TLS certificate,
            declared software versions) through the webrobot MCP, NVD, CISA KEV, and the user''s own Shodan/HIBP keys only
            if connected (if a tool says the key is not connected, skip that category and say so).


            STEPS: 1) crtsh_search ''%25.<domain>'' -> unique subdomains, flag forgotten ones (dev, test, staging, vpn, old)
            and wildcard/expired certs. 2) dns_lookup: SPF (TXT), DMARC (_dmarc TXT; policy none/quarantine/reject), DNSSEC
            (DS/DNSKEY), MX, CAA. 3) Certificates and HTTP headers of the apex and up to 10 public subdomains via the MCP:
            expiry, protocol, HSTS, CSP, X-Frame-Options, X-Content-Type-Options, Referrer-Policy, cookies flags. 4) Declared
            software versions (Server, X-Powered-By, generator meta, banners); look each up with nvd_search (keywordSearch,
            hasKev when useful) and confirm with kev_catalog; never claim a CVE applies unless version matches, otherwise
            say ''to verify''. 5) If connected: shodan_host for A/AAAA IPs (open ports/services) and hibp_domain (count of
            exposed accounts; never list passwords).


            SCORING (0-100 per category, weighted): Email & DNS authentication 20, TLS/certificates 15, HTTP security headers
            15, Known vulnerabilities 25, Subdomain hygiene 10, Exposed ports 10 (Shodan), Credential breaches 5 (HIBP). If
            a category is unavailable, redistribute its weight proportionally and say so. Grade: A>=90, B>=75, C>=60, D>=40,
            F<40. A CISA KEV match on a software actually detected caps the grade at D. Never invent findings or figures.


            PREVIOUS RESULT: your memory holds last scan''s grade and key findings. Compare: worsened = true if the grade
            is lower than previous_grade (first scan: false). At the end call remember once with the grade, score, and top
            5 findings (they replace the old ones).


            REPORT (Markdown, in the user''s language): start with ''# <domain> — Rating <grade> (<score>/100) — <date>''.
            Sections ## Sintesi / Summary, ## Punteggio per categoria (table category, weight, score; plus a ```chart block
            {"type":"bar","title":"...","labels":[...],"series":[{"name":"Score","values":[...]}]}), ## Priorità di correzione
            (numbered, each with severity, evidence, fix, effort), ## Cosa è cambiato, ## Limiti dell''analisi (passive only,
            not a penetration test, not insurance or legal advice).


            LAST, after the report, output one fenced json block with: domain, sector, scan_date (YYYY-MM-DD), grade, score,
            previous_grade, worsened, kev_found, kev_count, critical_count, summary (max 400 chars), alert_email, broker_email
            (copy both from the goal; empty string if none).'
  templates:
  - key: domain_watch
    title:
      it: Dominio monitorato
      en: Monitored domain
    description:
      it: Scansione passiva settimanale di un dominio, con alert email se il voto peggiora o compare una vulnerabilità sfruttata.
      en: Weekly passive scan of one domain, with an email alert if the grade worsens or an exploited vulnerability appears.
    agent: scanner
    params:
    - name: domain
      type: text
      required: true
      label:
        it: Dominio (es. azienda.it)
        en: Domain (e.g. company.com)
    - name: sector
      type: select
      required: true
      label:
        it: Settore
        en: Sector
      options:
      - value: finance
        label:
          it: Finanza e assicurazioni
          en: Finance and insurance
      - value: health
        label:
          it: Sanità
          en: Healthcare
      - value: manufacturing
        label:
          it: Manifattura
          en: Manufacturing
      - value: retail
        label:
          it: Commercio e e-commerce
          en: Retail and e-commerce
      - value: services
        label:
          it: Servizi professionali
          en: Professional services
      - value: public
        label:
          it: Pubblica amministrazione
          en: Public sector
      - value: other
        label:
          it: Altro
          en: Other
    - name: alert_email
      type: email
      required: true
      label:
        it: Email per gli avvisi
        en: Alert email
    - name: broker_email
      type: email
      label:
        it: Email del broker (facoltativa)
        en: Broker email (optional)
      help:
        it: Il broker potrà vedere i risultati di questo dominio.
        en: The broker will be able to see this domain's results.
    - name: authorized
      type: boolean
      required: true
      label:
        it: Dichiaro di essere autorizzato ad analizzare questo dominio
        en: I declare I am authorized to analyze this domain
      help:
        it: Obbligatorio. L'analisi è solo passiva.
        en: Required. The analysis is passive only.
    goal: 'Scan the domain {domain} (sector: {sector}). Authorized by the customer: {authorized}. alert_email: {alert_email}.
      broker_email: {broker_email}. Today is {date}. Write the report in the language with ISO code {lang}.'
    schedule:
      cron: 0 5 * * 1
      userCanChange: false
    maxPerUser: 100
    deliver:
      to: owner
      subject: '{title}'
  data:
    collections:
    - name: scans
      description: Weekly scan results, one record per domain per run
      ownedBy: instance
      fields:
      - name: domain
        type: text
        label:
          it: Dominio
          en: Domain
      - name: sector
        type: text
        label:
          it: Settore
          en: Sector
      - name: scan_date
        type: date
        label:
          it: Data
          en: Date
      - name: grade
        type: text
        label:
          it: Voto
          en: Grade
      - name: score
        type: number
        label:
          it: Punteggio
          en: Score
      - name: previous_grade
        type: text
        label:
          it: Voto precedente
          en: Previous grade
      - name: worsened
        type: boolean
      - name: kev_found
        type: boolean
      - name: kev_count
        type: number
        label: KEV
      - name: critical_count
        type: number
        label:
          it: Critiche
          en: Critical
      - name: summary
        type: textarea
        label:
          it: Sintesi
          en: Summary
      - name: alert_email
        type: email
      - name: broker_email
        type: email
      access:
      - role: broker
        where:
          broker_email: '{user.email}'
        can:
        - read
      retentionDays: 730
    credentials:
    - provider: shodan
      kind: api_key
      scope: user
      label: Shodan
      help:
        it: 'Facoltativa: la trovi in account.shodan.io. Aggiunge le porte esposte.'
        en: 'Optional: find it at account.shodan.io. Adds exposed ports.'
    - provider: hibp
      kind: api_key
      scope: user
      label: Have I Been Pwned
      help:
        it: 'Facoltativa: la trovi su haveibeenpwned.com/API/Key. Aggiunge le credenziali in data breach (serve dominio verificato).'
        en: 'Optional: haveibeenpwned.com/API/Key. Adds credentials in data breaches (verified domain required).'
  egress:
    hosts:
    - crt.sh
    - cloudflare-dns.com
    - services.nvd.nist.gov
    - www.cisa.gov
    - api.shodan.io
    - haveibeenpwned.com
    notes: 'crt.sh: public CT logs, read-only. Cloudflare DoH: public DNS queries. NVD: public domain data (NIST). CISA KEV:
      public domain US government data. Shodan and HIBP: only with the user''s own API key, per their terms.'
  views:
  - key: home
    type: page
    nav: false
    title: Perimetro Esposto
    sections:
    - type: hero
      eyebrow:
        it: Rating di sicurezza esterno
        en: External security rating
      title:
        it: Che voto ha la **superficie internet** della tua azienda?
        en: What grade does your company's **internet exposure** get?
      text:
        it: Inserisci un dominio e ricevi un rating da A a F con le priorità di correzione. Analisi solo passiva, ripetuta
          ogni settimana, con alert email se il voto peggiora.
        en: Enter a domain and get an A–F rating with fix priorities. Passive analysis only, repeated weekly, with an email
          alert if the grade worsens.
      actions:
      - label:
          it: Monitora un dominio
          en: Monitor a domain
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: 1 · Autorizzi
          en: 1 · Authorize
        text:
          it: Indichi dominio, settore, email per gli avvisi e dichiari di essere autorizzato.
          en: You give the domain, sector, alert email and declare you are authorized.
      - title:
          it: 2 · Analisi passiva
          en: 2 · Passive analysis
        text:
          it: Certificate Transparency, DNS (SPF, DMARC, DNSSEC, MX), certificati, header HTTP, versioni software incrociate
            con NVD e CISA KEV. Con le tue chiavi Shodan e HIBP anche porte e credenziali esposte.
          en: Certificate Transparency, DNS (SPF, DMARC, DNSSEC, MX), certificates, HTTP headers, software versions matched
            against NVD and CISA KEV. With your Shodan and HIBP keys, also exposed ports and credentials.
      - title:
          it: 3 · Rating e alert
          en: 3 · Rating and alerts
        text:
          it: Voto, report con priorità e scansione ogni settimana. Se il voto peggiora o compare una vulnerabilità sfruttata
            ricevi un'email.
          en: Grade, prioritized report and a weekly rescan. You get an email if the grade worsens or an exploited vulnerability
            appears.
    - type: cards
      id: voto
      title:
        it: Pesi del voto
        en: Grade weights
      items:
      - title:
          it: Vulnerabilità note · 25%
          en: Known vulnerabilities · 25%
        text:
          it: NVD e CISA KEV
          en: NVD and CISA KEV
      - title:
          it: Email e DNS · 20%
          en: Email and DNS · 20%
        text: SPF, DMARC, DNSSEC, CAA
      - title:
          it: Certificati TLS · 15%
          en: TLS certificates · 15%
        text:
          it: Scadenze, protocolli, certificati dimenticati
          en: Expiry, protocols, forgotten certificates
      - title:
          it: Header HTTP · 15%
          en: HTTP headers · 15%
        text: HSTS, CSP, cookie
      - title:
          it: Sottodomini · 10%, porte · 10%, breach · 5%
          en: Subdomains · 10%, ports · 10%, breaches · 5%
        text:
          it: Porte e breach richiedono le tue chiavi
          en: Ports and breaches need your keys
    - type: note
      content:
        it: 'Analisi esclusivamente passiva su fonti pubbliche: non è un penetration test né consulenza assicurativa o legale.
          Analizza solo domini che sei autorizzato a valutare.'
        en: 'Strictly passive analysis of public sources: not a penetration test nor insurance or legal advice. Only analyze
          domains you are authorized to assess.'
  - key: domains
    type: instances
    template: domain_watch
    title:
      it: I miei domini
      en: My domains
    roles:
    - user
    - admin
    - broker
  - key: my_scans
    type: table
    title:
      it: Storico voti
      en: Grade history
    source: collection:scans
    columns:
    - scan_date
    - domain
    - grade
    - score
    - previous_grade
    - kev_count
    - summary
    export: true
    roles:
    - user
    - admin
  - key: broker_clients
    type: table
    title:
      it: Domini dei clienti
      en: Client domains
    source: collection:scans
    columns:
    - domain
    - sector
    - scan_date
    - grade
    - score
    - previous_grade
    - kev_count
    - critical_count
    export: true
    roles:
    - broker
    - admin
  - key: runs
    type: history
    title:
      it: Report
      en: Reports
    source: run
    roles:
    - user
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: account
    type: account
    title:
      it: Abbonamento e chiavi API
      en: Plan and API keys
    roles:
    - user
    - admin
    - broker
  schedules: []
  triggers:
  - key: alert_worse
    description: Grade got worse
    'on':
      collection: scans
      op: insert
      where:
        worsened: true
    notify:
      to:
      - record.alert_email
      - record.broker_email
      subject:
        it: 'Perimetro Esposto: il voto di {record.domain} è peggiorato ({record.previous_grade} → {record.grade})'
        en: 'Perimetro Esposto: grade of {record.domain} worsened ({record.previous_grade} → {record.grade})'
      body:
        it: 'Il rating di {record.domain} è passato da {record.previous_grade} a {record.grade} (punteggio {record.score}).


          {record.summary}


          Apri il report per le priorità di correzione.'
        en: 'The rating of {record.domain} moved from {record.previous_grade} to {record.grade} (score {record.score}).


          {record.summary}


          Open the report for fix priorities.'
      link: runs
  - key: alert_kev
    description: Actively exploited vulnerability found
    'on':
      collection: scans
      op: insert
      where:
        kev_found: true
    notify:
      to:
      - record.alert_email
      - record.broker_email
      subject:
        it: 'Perimetro Esposto: vulnerabilità sfruttata attivamente su {record.domain}'
        en: 'Perimetro Esposto: actively exploited vulnerability on {record.domain}'
      body:
        it: 'Sul dominio {record.domain} è stata rilevata almeno una vulnerabilità presente nel catalogo CISA KEV (sfruttata
          in attacchi reali): {record.kev_count}.


          {record.summary}


          Apri il report per i dettagli e le correzioni urgenti.'
        en: 'On {record.domain} at least one vulnerability from the CISA KEV catalog (exploited in real attacks) was detected:
          {record.kev_count}.


          {record.summary}


          Open the report for details and urgent fixes.'
      link: runs
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: solo
      price: 49
      interval: month
      label:
        it: Solo · fino a 5 domini
        en: Solo · up to 5 domains
      includes:
      - 5 domains
      - weekly scans
      - email alerts
    - key: business
      price: 149
      interval: month
      label:
        it: Business · fino a 25 domini
        en: Business · up to 25 domains
      includes:
      - 25 domains
      - weekly scans
      - email alerts
    - key: broker
      price: 399
      interval: month
      label:
        it: Broker · fino a 100 domini
        en: Broker · up to 100 domains
      includes:
      - 100 domains
      - client portfolio view
      - CSV export
  extensions:
  - key: domain_ownership_check
    description: Authorization is a declaration (checkbox) enforced by the agent; verification of domain ownership (DNS TXT
      challenge) is not available yet.
  - key: domain_quota
    description: The per-plan domain count is enforced through a monthly run quota (about 5 runs per domain); a hard cap on
      instances per plan is not expressible yet.
