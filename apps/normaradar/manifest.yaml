apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: normaradar
  displayName: NormaRadar
  tagline:
    it: Il radar normativo europeo, su misura per la tua azienda.
    en: The EU regulatory radar, tailored to your company.
  description:
    it: Ogni giorno un agente controlla le novità su EUR-Lex e ti segnala quelle rilevanti con priorità e motivazione. Gap
      analysis sulle tue policy e chat con fonti citate.
    en: Every day an agent checks EUR-Lex for new rules and flags the relevant ones with priority and rationale. Gap analysis
      on your policies and a source-cited chat.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#0b2545'
      accent: '#13a89e'
      background: '#f6f8fb'
      foreground: '#14202e'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Norma
      color: primary
    - text: Radar
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#how'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  limits:
  - action: agent:radar
    per: user
    max: 1
    window: month
    plans:
      radar_pro: 40
  - action: agent:gap
    per: user
    max: 20
    window: day
    roles:
    - user
  egress:
    hosts:
    - eur-lex.europa.eu
    - publications.europa.eu
    notes: 'EUR-Lex and the Publications Office of the EU: reuse allowed with attribution (Commission Decision 2011/833/EU).'
  agents:
  - key: radar
    role: helper
    description: 'Daily check of EUR-Lex for one company: relevant new rules with priority and why.'
    memory: instance
    awaits:
    - share_review
    writesTo:
      collection: radar_items
      parse: markdown_sections
    appTools:
    - name: eurlex_search
      description: Search EUR-Lex (query parameters of the expert search)
      action: http
      http:
        method: GET
        url: https://eur-lex.europa.eu/search.html
        attribution: EUR-Lex, Publications Office of the EU, reuse with attribution
    - name: eurlex_doc
      description: Read a EUR-Lex document or RSS feed by path
      action: http
      http:
        method: GET
        url: https://eur-lex.europa.eu/legal-content
        allowPath: true
        attribution: EUR-Lex, Publications Office of the EU, reuse with attribution
    profile:
      inline:
        display_name: NormaRadar radar
        crews:
        - id: radar
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are a regulatory monitoring analyst for EU regulated companies. Use eurlex_search and eurlex_doc
            to find acts, amendments, delegated acts, guidelines and proposals published or updated in the last 2 days that
            are relevant to the company profile you receive. Never invent documents: every item must have a CELEX number or
            an EUR-Lex URL you actually retrieved. Output: a level-1 title "# Radar normativo — <date>" then one section per
            item with heading "## [ALTA|MEDIA|BASSA] <title>" (use HIGH|MEDIUM|LOW if the report language is English), and
            under it: Document (CELEX + URL), Date, Why it matters for this company, Suggested action. Priority: high = binding
            with near deadline or direct impact on the company''s products/regulations; medium = relevant, medium-term; low
            = informational. If nothing relevant, write the title and one line saying so. End with the attribution: Source
            EUR-Lex, Publications Office of the EU. After the report, call request_share_review so the compliance officer
            approves it before it is shared. Use remember to keep the list of items already reported, to avoid repeats.'
  - key: gap
    role: main
    description: Gap analysis between a chosen regulation and the user's uploaded internal policies.
    awaits:
    - share_review
    context:
    - key: sector
      from: collection:company_profile.sector
    - key: countries
      from: collection:company_profile.countries
    - key: products
      from: collection:company_profile.products
    goalTemplate: 'Regulation: {regulation_label}

      {?sector}Company sector: {sector}. Countries: {countries}. Products: {products}.{/sector}

      {?focus}Focus requested: {focus}{/focus}

      Policy files: {policies}

      {?policies_text}Policy text:

      {policies_text}{/policies_text}

      Write the report in the language with ISO code {lang}. Today is {date}.'
    output: markdown
    appTools:
    - name: read_upload
      description: Read a file the user uploaded
      action: read_file
    - name: eurlex_doc
      description: Read a EUR-Lex document or RSS feed by path
      action: http
      http:
        method: GET
        url: https://eur-lex.europa.eu/legal-content
        allowPath: true
        attribution: EUR-Lex, Publications Office of the EU, reuse with attribution
    profile:
      inline:
        display_name: NormaRadar gap analyst
        crews:
        - id: gap
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 20
          max_budget_usd: 1
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are a compliance analyst. Compare the chosen EU regulation with the company''s internal policies.
            Retrieve the regulation text from EUR-Lex with eurlex_doc when you need exact wording; if a policy file has no
            text, call read_upload with its file id. Start with "# Gap analysis — <regulation>". Sections: ## Summary (counts
            of compliant / partial / non-compliant), ## Findings: a table with columns Policy clause, Regulation article (cite
            article and document with CELEX), Status (compliant, partial, non-compliant), Why; ## Proposed corrective text:
            for each non-compliant or partial clause, the replacement wording; ## Not covered: obligations with no policy
            at all. Cite article and document for every claim. If you cannot verify an article, say so; never invent articles
            or quotes. This is decision support, not legal advice. Add a bar chart of statuses as a fenced chart block. At
            the end call request_share_review so the compliance officer approves the report before sharing.'
  - key: assistant
    role: helper
    description: Answers questions on EU rules citing article and document, or says it does not know.
    context:
    - key: sector
      from: collection:company_profile.sector
    - key: regulations
      from: collection:company_profile.regulations
    goalTemplate: '{?sector}Company sector: {sector}. Regulations of interest: {regulations}.{/sector}

      Conversation so far:

      {history}

      New question: {message}

      Answer in the language with ISO code {lang}.'
    output: markdown
    appTools:
    - name: eurlex_search
      description: Search EUR-Lex (query parameters of the expert search)
      action: http
      http:
        method: GET
        url: https://eur-lex.europa.eu/search.html
        attribution: EUR-Lex, Publications Office of the EU, reuse with attribution
    - name: eurlex_doc
      description: Read a EUR-Lex document or RSS feed by path
      action: http
      http:
        method: GET
        url: https://eur-lex.europa.eu/legal-content
        allowPath: true
        attribution: EUR-Lex, Publications Office of the EU, reuse with attribution
    profile:
      inline:
        display_name: NormaRadar assistant
        crews:
        - id: assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You answer questions about EU regulations (DORA, MiCAR, AI Act, GDPR, PSD2, NIS2 and others). Always
            look the source up on EUR-Lex with eurlex_search and eurlex_doc before answering. Answer ONLY with what you found
            in a retrieved source, and cite for every statement the article and the document (title + CELEX + URL). If you
            do not find the source, answer exactly that you do not know ("Non lo so: non ho trovato una fonte" / "I don''t
            know: I found no source") and suggest how to refine the question. Never answer from memory, never give legal advice
            as fact. Keep answers short.'
  inputForm:
    title:
      it: Nuova gap analysis
      en: New gap analysis
    fields:
    - name: regulation
      type: select
      required: true
      label:
        it: Norma
        en: Regulation
      options:
      - value: dora
        label: DORA (Reg. 2022/2554)
      - value: micar
        label: MiCAR (Reg. 2023/1114)
      - value: ai_act
        label: AI Act (Reg. 2024/1689)
      - value: gdpr
        label: GDPR (Reg. 2016/679)
      - value: psd2
        label: PSD2 (Dir. 2015/2366)
      - value: nis2
        label: NIS2 (Dir. 2022/2555)
    - name: policies
      type: file
      required: true
      accept:
      - pdf
      - docx
      maxMb: 15
      multiple: true
      label:
        it: Policy interne (PDF o Word)
        en: Internal policies (PDF or Word)
    - name: focus
      type: textarea
      maxLength: 400
      label:
        it: Ambito specifico (facoltativo)
        en: Specific scope (optional)
  templates:
  - key: radar_watch
    title:
      it: Radar normativo
      en: Regulatory radar
    description:
      it: Ogni giorno le novità EUR-Lex rilevanti per la tua azienda.
      en: Every day the EUR-Lex news relevant to your company.
    agent: radar
    params:
    - name: sector
      type: select
      required: true
      label:
        it: Settore
        en: Sector
      options:
      - value: bank
        label:
          it: Banca
          en: Bank
      - value: fintech
        label: Fintech
      - value: insurance
        label:
          it: Assicurazione
          en: Insurance
      - value: crypto
        label: Crypto
    - name: countries
      type: text
      required: true
      label:
        it: Paesi in cui operi
        en: Countries of operation
    - name: products
      type: textarea
      maxLength: 500
      label:
        it: Prodotti e servizi
        en: Products and services
    - name: regulations
      type: text
      required: true
      label:
        it: Normative che ti riguardano
        en: Regulations that apply to you
      help:
        it: es. DORA, MiCAR, AI Act, GDPR, PSD2
        en: e.g. DORA, MiCAR, AI Act, GDPR, PSD2
    goal: 'Daily radar for "{instance}". Sector: {sector}. Countries: {countries}. Products: {products}. Regulations: {regulations}.
      Today is {date}. Write the radar in the language with ISO code {lang}.'
    schedule:
      cron: 0 6 * * *
      userCanChange: false
    maxPerUser: 3
    deliver:
      to: owner
      onlyIfNew: true
  approvals:
  - key: share_review
    title:
      it: Approvazione compliance prima della condivisione
      en: Compliance approval before sharing
    decidedBy: requester
    timeoutMinutes: 10080
  triggers:
  - key: share_approved
    'on':
      approval: share_review
      decision: approved
    notify:
      to: owner
      subject:
        it: 'Output approvato: puoi condividerlo'
        en: 'Output approved: you can share it'
      body:
        it: Il responsabile compliance ha approvato l'output. Ora è condivisibile.
        en: The compliance officer approved the output. It can now be shared.
      link: approvals
  data:
    collections:
    - name: company_profile
      ownedBy: user
      description: The company's regulatory profile
      fields:
      - name: company_name
        type: text
        required: true
        label:
          it: Azienda
          en: Company
      - name: sector
        type: select
        required: true
        label:
          it: Settore
          en: Sector
        options:
        - bank
        - fintech
        - insurance
        - crypto
      - name: countries
        type: text
        required: true
        label:
          it: Paesi
          en: Countries
      - name: products
        type: textarea
        label:
          it: Prodotti
          en: Products
      - name: regulations
        type: text
        label:
          it: Normative
          en: Regulations
    - name: radar_items
      ownedBy: instance
      description: Daily radar reports of each watch
      retentionDays: 365
  views:
  - key: home
    type: page
    nav: false
    sections:
    - type: hero
      title:
        it: Il **radar normativo** per aziende regolate
        en: The **regulatory radar** for regulated companies
      text:
        it: Novità EUR-Lex filtrate sul tuo profilo, gap analysis sulle tue policy e una chat che cita sempre la fonte.
        en: EUR-Lex news filtered on your profile, gap analysis on your policies and a chat that always cites its source.
      actions:
      - label:
          it: Inizia
          en: Get started
        href: /login
        style: primary
    - type: steps
      id: how
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Descrivi la tua azienda
          en: Describe your company
        text:
          it: Settore, paesi, prodotti e normative applicabili.
          en: Sector, countries, products and applicable regulations.
        badge: 🏢
      - title:
          it: Ricevi il radar
          en: Get the radar
        text:
          it: Ogni giorno le novità con priorità alta, media o bassa e il perché.
          en: Every day the news with high, medium or low priority and why.
        badge: 📡
      - title:
          it: Analizza le policy
          en: Analyse your policies
        text:
          it: Gap analysis con clausole non conformi e testo correttivo.
          en: Gap analysis with non-compliant clauses and corrective text.
        badge: 📄
      - title:
          it: Approva e condividi
          en: Approve and share
        text:
          it: Nulla esce senza l'approvazione del responsabile compliance.
          en: Nothing goes out without the compliance officer's approval.
        badge: ✅
    - type: note
      content:
        it: 'Fonte: EUR-Lex, Ufficio delle pubblicazioni dell''UE, riuso con attribuzione. Supporto alle decisioni, non consulenza
          legale.'
        en: 'Source: EUR-Lex, Publications Office of the EU, reuse with attribution. Decision support, not legal advice.'
  - key: profile
    type: form
    collection: company_profile
    title:
      it: Profilo aziendale
      en: Company profile
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Profilo salvato
        en: Profile saved
    edit: true
    roles:
    - user
    - admin
  - key: watches
    type: instances
    template: radar_watch
    title:
      it: Radar
      en: Radar
    roles:
    - user
    - admin
  - key: radar_feed
    type: table
    source: collection:radar_items
    title:
      it: Archivio radar
      en: Radar archive
    export: true
    roles:
    - user
    - admin
  - key: new_gap
    type: new_run
    title:
      it: Gap analysis
      en: Gap analysis
    roles:
    - user
    - admin
  - key: gaps
    type: history
    source: run
    title:
      it: Le mie analisi
      en: My analyses
    roles:
    - user
    - admin
  - key: gap_report
    type: report
    source: run
    printable: true
    nav: false
  - key: chat
    type: chat
    source: agent:assistant
    title:
      it: Chiedi alla norma
      en: Ask the law
    placeholder:
      it: Es. Quali sono gli obblighi di notifica incidenti in DORA?
      en: E.g. What are DORA's incident reporting duties?
    examples:
    - it: Cosa prevede l'art. 28 DORA sui fornitori ICT?
      en: What does DORA Art. 28 say on ICT providers?
    - it: Chi deve richiedere l'autorizzazione CASP in MiCAR?
      en: Who must apply for CASP authorisation under MiCAR?
    roles:
    - user
    - admin
  - key: approvals
    type: approvals
    approvals:
    - share_review
    title:
      it: Approvazioni
      en: Approvals
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento e crediti
      en: Plan and credits
    roles:
    - user
  notifications:
    emailOnRunDone: true
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 50
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:gap:
        estimate: 100
        metered: true
      agent:assistant:
        estimate: 5
        metered: true
    packs:
    - key: credits_1000
      credits: 1000
      price: 12
      label: 1000 crediti
    - key: credits_5000
      credits: 5000
      price: 50
      label: 5000 crediti
    plans:
    - key: radar_pro
      price: 79
      interval: month
      label:
        it: Radar normativo
        en: Regulatory radar
      includes:
      - Daily radar on EUR-Lex
      - Email digest
  extensions:
  - key: chat_approval
    description: The chat answers are interactive and are not put through the approval step; only radar and gap analysis reports
      require compliance approval before sharing.
  - key: share_channel
    description: Sharing an approved output with colleagues is by exporting or printing the report; no in-app team sharing
      yet.
