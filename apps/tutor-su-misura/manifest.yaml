apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: tutorgiusto
  displayName: TutorGiusto
  tagline:
    it: Il tutor giusto per tuo figlio, scelto con un perché.
    en: The right tutor, chosen with a reason.
  description:
    it: 'Descrivi materia, livello e obiettivo: un agente AI ti propone i tre tutor più adatti, prenoti, paghi con carta e
      ricevi il resoconto di ogni lezione.'
    en: 'Describe subject, level and goal: an AI agent proposes the three best-fitting tutors, you book, pay by card and get
      a report after every lesson.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f3a5f'
      accent: '#e07a1f'
      background: '#fbf9f5'
      foreground: '#1c2430'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Tutor
      color: primary
    - text: Giusto
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    cta:
      label:
        it: Trova un tutor
        en: Find a tutor
      href: /v/new_search
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      label:
        it: Famiglia / studente
        en: Family / student
      assignedBy: signup
    - key: tutor
      label: Tutor
      assignedBy: derived
      from: collection:tutors.account_email
  limits:
  - action: agent:matcher
    per: user
    max: 10
    window: day
  agents:
  - key: matcher
    role: main
    description: Reads the tutor catalogue and proposes the three best matches.
    profile:
      inline:
        display_name: TutorGiusto matcher
        crews:
        - id: matcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You match students with private tutors. Use the tool search_tutors to read the catalogue (subjects,
            school level, hourly rate, availability, bio). Pick the three best tutors for the request, considering subject,
            level, the student''s difficulty, goal (recovery, exam, test), budget and availability. Never invent tutors, rates
            or availability: use only catalogue data. If fewer than three fit, say so. Output: a level-1 title "# I tre tutor
            più adatti — <subject>" (in the user''s language), then for each tutor a ## section with name, hourly rate, availability,
            and a ''Perché è adatto'' paragraph tied to the student''s difficulty and goal; then a small comparison table
            and a short ''Come prenotare'' note: open the Booking chat. Under 450 words.'
    goalTemplate: 'Materia: {subject}

      Livello: {level_label}

      Obiettivo: {goal_kind_label}

      Difficoltà: {difficulty}

      {?budget}Budget massimo orario: {budget} EUR{/budget}

      {?availability}Disponibilità dello studente: {availability}{/availability}

      Write the answer in the language with ISO code {lang}.'
    appTools:
    - name: search_tutors
      description: Search the tutor catalogue
      action: search
      collection: tutors
      scope: all
    output: markdown
  - key: onboarding
    role: helper
    description: Helps a tutor create or update their own profile.
    profile:
      inline:
        display_name: TutorGiusto onboarding
        chat_mode: true
        crews:
        - id: onboarding
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You help a tutor register. Ask, one or two questions at a time: name, subjects, school levels, hourly
            rate in EUR, weekly availability, short bio. When complete, show a summary, ask confirmation, then save it with
            the tool save_profile (account_email = the user''s email, from {user}). Never invent data.'
    goalTemplate: 'User: {user}

      Conversation so far:

      {history}

      New message: {message}

      Reply in the language with ISO code {lang}.'
    appTools:
    - name: save_profile
      description: Create or update the tutor's own profile
      action: write
      collection: tutors
      scope: user
    memory: user
  - key: booking
    role: helper
    description: Helps a family book a lesson; the tutor confirms.
    profile:
      inline:
        display_name: TutorGiusto booking
        chat_mode: true
        crews:
        - id: booking
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You help a student or parent book one lesson. Find the tutor with read_tutors, agree a date, time
            and duration within the tutor's availability, compute the price from the hourly rate (never invent it), show a
            summary and ask confirmation. Then save the lesson with save_lesson (status requested, include tutor_email, student
            name, parent email) and call request_lesson_confirm so the tutor confirms. Explain that payment by card is taken
            at booking and the platform fee is included in the price.
    goalTemplate: 'User: {user}

      Conversation so far:

      {history}

      New message: {message}

      Reply in the language with ISO code {lang}.'
    appTools:
    - name: read_tutors
      description: Read tutor profiles
      action: search
      collection: tutors
      scope: all
    - name: save_lesson
      description: Create the family's lesson booking
      action: write
      collection: lessons
      scope: user
    awaits:
    - lesson_confirm
  - key: recap
    role: helper
    description: Helps the tutor write the short post-lesson report for the parent.
    profile:
      inline:
        display_name: TutorGiusto recap
        chat_mode: true
        crews:
        - id: recap
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You help a tutor write a brief, warm, factual lesson report for the parent: topics covered, how
            the student did, homework, next steps. Read the tutor''s lessons with read_lessons, ask for the key points, draft
            under 120 words, and after the tutor approves save it with save_report. Never invent what happened in the lesson.'
    goalTemplate: 'User: {user}

      Conversation so far:

      {history}

      New message: {message}

      Reply in the language with ISO code {lang}.'
    appTools:
    - name: read_lessons
      description: Lessons shared with this tutor
      action: read
      collection: lessons
      scope: user
    - name: save_report
      description: Save the lesson report
      action: write
      collection: lesson_reports
      scope: user
  approvals:
  - key: lesson_confirm
    title:
      it: Conferma lezione
      en: Confirm lesson
    role: tutor
    fields:
    - tutor_email
    - date
    - start_time
    - duration_min
    - price
    timeoutMinutes: 2880
    onTimeout: reject
  inputForm:
    title:
      it: Cerca un tutor
      en: Find a tutor
    fields:
    - name: subject
      type: text
      required: true
      label:
        it: Materia
        en: Subject
    - name: level
      type: select
      required: true
      label:
        it: Livello scolastico
        en: School level
      options:
      - value: primary
        label:
          it: Primaria
          en: Primary
      - value: middle
        label:
          it: Medie
          en: Middle school
      - value: high
        label:
          it: Superiori
          en: High school
      - value: university
        label:
          it: Università
          en: University
    - name: goal_kind
      type: select
      required: true
      label:
        it: Obiettivo
        en: Goal
      options:
      - value: recovery
        label:
          it: Recupero
          en: Catch-up
      - value: exam
        label:
          it: Esame
          en: Exam
      - value: test
        label:
          it: Verifica
          en: Test
    - name: difficulty
      type: textarea
      required: true
      maxLength: 600
      label:
        it: Difficoltà
        en: Difficulties
    - name: budget
      type: number
      label:
        it: Budget orario (€)
        en: Hourly budget (€)
    - name: availability
      type: text
      label:
        it: Quando è libero lo studente
        en: Student availability
  data:
    collections:
    - name: tutors
      ownedBy: shared
      description: Public tutor catalogue; account_email identifies the tutor account
      fields:
      - name: account_email
        type: email
        required: true
      - name: name
        type: text
        required: true
      - name: subjects
        type: text
      - name: levels
        type: text
      - name: hourly_rate
        type: number
      - name: availability
        type: textarea
      - name: bio
        type: textarea
    - name: lessons
      ownedBy: user
      sharing:
      - editor
      description: Bookings; each family sees its own, the tutor sees those shared with them
      fields:
      - name: tutor_email
        type: email
      - name: student_name
        type: text
      - name: parent_email
        type: email
      - name: subject
        type: text
      - name: date
        type: date
      - name: start_time
        type: text
      - name: duration_min
        type: number
      - name: price
        type: number
      - name: status
        type: select
        options:
        - requested
        - confirmed
        - done
        - cancelled
    - name: lesson_reports
      ownedBy: user
      sharing:
      - viewer
      description: Post-lesson reports written by the tutor, shared with the family
      fields:
      - name: lesson
        type: text
      - name: student_name
        type: text
      - name: summary
        type: textarea
      - name: homework
        type: textarea
  views:
  - key: home
    type: page
    nav: false
    title: TutorGiusto
    sections:
    - type: hero
      title:
        it: Il **tutor giusto**, con il perché.
        en: The **right tutor**, with the reason.
      text:
        it: 'Racconta materia, livello e obiettivo: l''agente ti propone i tre tutor più adatti. Prenoti, paghi con carta,
          ricevi il resoconto di ogni lezione.'
        en: 'Tell us subject, level and goal: the agent proposes the three best tutors. Book, pay by card, get a report after
          each lesson.'
      actions:
      - label:
          it: Trova un tutor
          en: Find a tutor
        href: /v/new_search
        style: primary
      - label:
          it: Sono un tutor
          en: I'm a tutor
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Descrivi
          en: Describe
        text:
          it: Materia, livello, difficoltà e obiettivo.
          en: Subject, level, difficulties and goal.
      - title:
          it: Confronta
          en: Compare
        text:
          it: Tre tutor con motivazione, tariffa e disponibilità.
          en: Three tutors with reasons, rate and availability.
      - title:
          it: Prenota e paga
          en: Book and pay
        text:
          it: Il tutor conferma la lezione.
          en: The tutor confirms the lesson.
      - title:
          it: Resoconto
          en: Report
        text:
          it: Dopo la lezione trovi il resoconto del tutor.
          en: After the lesson you find the tutor's report.
    - type: note
      content:
        it: Una commissione è inclusa nel prezzo di ogni lezione. I tutor vedono solo i propri studenti, le famiglie solo
          le proprie lezioni.
        en: A fee is included in each lesson price. Tutors see only their own students, families only their own lessons.
  - key: new_search
    type: new_run
    title:
      it: Cerca un tutor
      en: Find a tutor
    roles:
    - user
    - admin
  - key: searches
    type: history
    title:
      it: Le mie ricerche
      en: My searches
    source: run
    roles:
    - user
    - admin
  - key: result
    type: report
    source: run
    printable: true
    nav: false
  - key: book
    type: chat
    title:
      it: Prenota una lezione
      en: Book a lesson
    source: agent:booking
    placeholder:
      it: Es. Vorrei prenotare con il primo tutor sabato alle 10
      en: E.g. I'd like to book the first tutor on Saturday at 10
    roles:
    - user
  - key: my_lessons
    type: table
    title:
      it: Le mie lezioni
      en: My lessons
    source: collection:lessons
    data:
      display: table
      fields:
      - key: date
        label:
          it: Data
          en: Date
        format: date
      - key: subject
        label:
          it: Materia
          en: Subject
      - key: student_name
        label:
          it: Studente
          en: Student
      - key: price
        label:
          it: Prezzo
          en: Price
        format: money
      - key: status
        label: Stato
        format: badge
      sort:
        field: date
        dir: desc
      limit: 100
    roles:
    - user
    - tutor
  - key: my_reports
    type: table
    title:
      it: Resoconti
      en: Lesson reports
    source: collection:lesson_reports
    data:
      display: cards
      fields:
      - key: student_name
        label:
          it: Studente
          en: Student
      - key: summary
        label:
          it: Resoconto
          en: Summary
      - key: homework
        label:
          it: Compiti
          en: Homework
      limit: 50
    roles:
    - user
    - tutor
  - key: tutor_profile
    type: chat
    title:
      it: Il mio profilo tutor
      en: My tutor profile
    source: agent:onboarding
    placeholder:
      it: Es. Insegno matematica alle superiori
      en: E.g. I teach high-school maths
    roles:
    - user
    - tutor
  - key: write_recap
    type: chat
    title:
      it: Resoconto lezione
      en: Lesson report
    source: agent:recap
    roles:
    - tutor
  - key: to_confirm
    type: approvals
    title:
      it: Lezioni da confermare
      en: Lessons to confirm
    approvals:
    - lesson_confirm
    roles:
    - tutor
  - key: account
    type: account
    title:
      it: Pagamenti
      en: Payments
    roles:
    - user
    - tutor
  billing:
    modes:
    - per_transaction
    currency: eur
    transactionFeePct: 12
    sellers: collection:tutors
extensions:
- key: email_to_parent
  description: 'Emailing the lesson report to the parent is not available yet: the parent finds it in the Lesson reports view
    (shared with their account).'
- key: tutor_payout_checkout
  description: Card checkout at booking and each tutor's Stripe Connect onboarding need the owner to connect Stripe; the tutors'
    account_email is visible in the shared catalogue, to be separated later.
