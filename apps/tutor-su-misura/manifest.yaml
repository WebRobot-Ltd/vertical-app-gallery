apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: tutorgiusto
  displayName: TutorGiusto
  tagline:
    it: Il tutor giusto per ripetizioni online, scelto per te.
    en: The right online tutor, picked for you.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f3a5f'
      accent: '#e07a1f'
      background: '#fbf9f5'
      foreground: '#1c2430'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Tutor
      color: primary
    - text: Giusto
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    cta:
      label:
        it: Trova un tutor
        en: Find a tutor
      href: /v/new_match
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: tutor
      label:
        it: Tutor
        en: Tutor
      assignedBy: invite
    - key: user
      label:
        it: Famiglia
        en: Family
      assignedBy: signup
  limits:
  - action: agent:matcher
    per: user
    max: 10
    window: day
  agents:
  - key: matcher
    role: main
    description: Propone i tre tutor più adatti spiegando il perché.
    appTools:
    - name: search_tutors
      description: Cerca tra i tutor registrati (materie, livelli, tariffa, disponibilità)
      action: search
      collection: tutors
      scope: all
    profile:
      inline:
        display_name: TutorGiusto matcher
        crews:
        - id: matcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''assistente di TutorGiusto. Ricevi la richiesta di uno studente o genitore (materia, livello,
            difficoltà, obiettivo). Usa search_tutors per trovare i tutor registrati, poi scegli i TRE più adatti. Usa solo
            dati presenti nei profili: non inventare titoli, recensioni o tariffe. Se ne trovi meno di tre, presentane meno
            e dillo. Formato: titolo di primo livello "# I tre tutor per <materia> — <obiettivo>"; poi per ciascun tutor una
            sezione ## con nome, tariffa oraria, disponibilità e un paragrafo ''Perché è adatto'' legato a livello, difficoltà
            e obiettivo; infine ## Come prenotare (vai su Prenota una lezione). Massimo 350 parole.'
    goalTemplate: 'Materia: {subject}

      Livello scolastico: {level_label}

      Obiettivo: {goal_kind_label}

      Difficoltà descritte: {difficulty}

      {?budget}Budget massimo orario: {budget} euro.{/budget}

      Scrivi nella lingua con codice ISO {lang}.'
    output: markdown
  inputForm:
    title:
      it: Trova il tutor giusto
      en: Find the right tutor
    fields:
    - name: subject
      type: text
      required: true
      label:
        it: Materia
        en: Subject
    - name: level
      type: select
      required: true
      label:
        it: Livello
        en: Level
      options:
      - value: medie
        label: Scuole medie
      - value: superiori
        label: Scuole superiori
      - value: universita
        label:
          it: Università
          en: University
    - name: goal_kind
      type: select
      required: true
      label:
        it: Obiettivo
        en: Goal
      options:
      - value: recupero
        label:
          it: Recupero
          en: Catch-up
      - value: esame
        label:
          it: Esame
          en: Exam
      - value: verifica
        label:
          it: Verifica
          en: Test
    - name: difficulty
      type: textarea
      required: true
      maxLength: 600
      label:
        it: Difficoltà
        en: Difficulties
    - name: budget
      type: number
      label:
        it: Budget orario (€)
        en: Hourly budget (€)
  data:
    collections:
    - name: tutors
      ownedBy: shared
      description: Profili dei tutor
      searchable: true
      fields:
      - name: name
        type: text
        required: true
        label: Nome
      - name: email
        type: email
        required: true
        label: Email
      - name: subjects
        type: text
        required: true
        label:
          it: Materie
          en: Subjects
      - name: levels
        type: multiselect
        required: true
        label:
          it: Livelli
          en: Levels
        options:
        - medie
        - superiori
        - universita
      - name: hourly_rate
        type: number
        required: true
        label:
          it: Tariffa oraria (€)
          en: Hourly rate (€)
      - name: availability
        type: textarea
        label:
          it: Disponibilità
          en: Availability
      - name: bio
        type: textarea
        maxLength: 800
        label: Bio
      - name: slots
        type: json
        label: Slots
    - name: lessons
      ownedBy: user
      description: Lezioni prenotate dalla famiglia
      retentionDays: 730
      fields:
      - name: tutor_email
        type: email
        label: Tutor
      - name: tutor_name
        type: text
        label: Tutor
      - name: student_name
        type: text
        required: true
        label:
          it: Studente
          en: Student
      - name: parent_email
        type: email
        required: true
        label:
          it: Email del genitore
          en: Parent email
      - name: subject
        type: text
        label:
          it: Materia
          en: Subject
      - name: confirmation
        type: select
        default: pending
        label:
          it: Stato
          en: Status
        options:
        - value: pending
          label: In attesa
        - value: confirmed
          label: Confermata
        - value: done
          label: Svolta
      - name: report
        type: textarea
        maxLength: 1500
        label:
          it: Resoconto della lezione
          en: Lesson report
      access:
      - role: tutor
        where:
          tutor_email: '{user.email}'
        can:
        - read
        - write
  views:
  - key: home
    type: page
    nav: false
    sections:
    - type: hero
      eyebrow: Ripetizioni online
      title: Il **tutor giusto** per tuo figlio, in un minuto
      text:
        it: 'Descrivi materia, livello e difficoltà: un agente AI ti propone i tre tutor più adatti e ti spiega perché. Prenoti,
          paghi con carta e ricevi il resoconto dopo ogni lezione.'
        en: 'Describe subject, level and difficulties: an AI agent proposes the three best tutors and explains why.'
      actions:
      - label: Trova un tutor
        href: /v/new_match
        style: primary
      - label: Accedi
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title: Come funziona
      items:
      - title: Racconta
        text: Materia, livello, difficoltà e obiettivo (recupero, esame, verifica).
        badge: 📝
      - title: Scegli
        text: L'agente propone tre tutor con la motivazione.
        badge: 🎯
      - title: Prenota e paga
        text: Scegli l'orario, paga con carta; il tutor conferma.
        badge: 💳
      - title: Resoconto
        text: Dopo la lezione il genitore riceve via email un breve resoconto.
        badge: ✉️
    - type: note
      content: TutorGiusto trattiene una commissione su ogni lezione. I suggerimenti dell'agente si basano solo sui profili
        dei tutor.
  - key: new_match
    type: new_run
    title:
      it: Trova un tutor
      en: Find a tutor
    roles:
    - user
    - admin
  - key: matches
    type: history
    title:
      it: Le mie ricerche
      en: My searches
    source: run
    roles:
    - user
    - admin
  - key: match
    type: report
    source: run
    printable: true
    nav: false
  - key: book
    type: booking
    title:
      it: Prenota una lezione
      en: Book a lesson
    collection: lessons
    resources: collection:tutors
    fields:
    - student_name
    - parent_email
    - subject
    slots:
      days:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      from: '14:00'
      to: '21:00'
      minutes: 60
      tz: Europe/Rome
      aheadDays: 14
      minNoticeHours: 6
      capacity: 1
    roles:
    - user
    - admin
  - key: lessons_list
    type: table
    title:
      it: Le lezioni
      en: Lessons
    source: collection:lessons
    columns:
    - student_name
    - subject
    - tutor_name
    - start
    - confirmation
    - report
    roles:
    - user
    - tutor
    - admin
  - key: lesson_edit
    type: form
    title:
      it: Conferma / resoconto
      en: Confirm / report
    collection: lessons
    fields:
    - confirmation
    - report
    edit: true
    submit:
      label: Salva
      message: Salvato. Il genitore riceverà il resoconto via email.
      redirect: lessons_list
    roles:
    - tutor
    - admin
    nav: false
  - key: tutor_profile
    type: form
    title:
      it: Il mio profilo tutor
      en: My tutor profile
    collection: tutors
    submit:
      label: Salva profilo
      message: Profilo salvato.
    roles:
    - tutor
    - admin
  triggers:
  - key: new_booking
    'on':
      collection: lessons
      op: insert
    notify:
      to:
      - record.tutor_email
      subject: Nuova richiesta di lezione
      body: Hai una nuova richiesta di lezione di {record.subject} per {record.student_name}. Confermala dall'app.
      link: lessons_list
  - key: lesson_confirmed
    'on':
      collection: lessons
      op: update
      where:
        confirmation: confirmed
    notify:
      to:
      - owner
      - record.parent_email
      subject: Lezione confermata
      body: Il tutor ha confermato la lezione di {record.subject} per {record.student_name}.
      link: lessons_list
  - key: lesson_done
    'on':
      collection: lessons
      op: update
      where:
        confirmation: done
    notify:
      to:
      - record.parent_email
      subject: Resoconto della lezione di {record.student_name}
      body: 'Ecco il resoconto del tutor {record.tutor_name} per la lezione di {record.subject}:


        {record.report}'
  billing:
    modes:
    - per_transaction
    currency: eur
    transactionFeePct: 15
    sellers: collection:tutors
  extensions:
  - key: tutor_link
    description: Il campo tutor_email/tutor_name della lezione va compilato dalla risorsa scelta in prenotazione, e il pagamento
      con carta va collegato alla prenotazione; i tutor devono collegare il proprio Stripe Connect.
