apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: portale-welfare
  displayName: Portale Welfare
  tagline:
    it: 'Il welfare aziendale in un unico portale: budget, rimborsi e voucher.'
    en: 'Corporate welfare in one portal: budget, reimbursements and vouchers.'
  description:
    it: 'Lo strato digitale del servizio di welfare aziendale: l''HR assegna i budget, il dipendente chiede rimborsi e voucher,
      un agente controlla le pratiche, un assistente risponde sul piano.'
    en: The digital layer of a corporate welfare service.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1d3b5c'
      accent: '#2a9d8f'
      background: '#f7f9fb'
      foreground: '#18222d'
    fonts:
      body: Inter
      display: Fraunces
  header:
    links:
    - label: Come funziona
      href: '#come-funziona'
    cta:
      label: Accedi
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Operatore provider
      assignedBy: admin_emails
    - key: hr
      label: HR azienda
      assignedBy: invite
    - key: employee
      label: Dipendente
      assignedBy: derived
      from: collection:employees.email
    - key: supplier
      label: Fornitore
      assignedBy: derived
      from: collection:suppliers.contact_email
    - key: user
      assignedBy: signup
  limits:
  - action: agent:claims_agent
    per: user
    max: 10
    window: day
  - action: chat
    per: user
    max: 60
    window: day
  agents:
  - key: claims_agent
    role: main
    description: Legge la ricevuta, verifica l'ammissibilità secondo regolamento e regole fiscali, prepara la pratica e la
      sottopone all'approvazione.
    awaits:
    - claim_review
    profile:
      inline:
        display_name: Istruttore pratiche welfare
        crews:
        - id: claims
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''istruttore delle pratiche di rimborso welfare aziendale. Passi: 1) leggi la ricevuta con
            read_upload (anche foto/scansioni) e il testo fornito; estrai data, emittente, importo, descrizione. 2) Leggi
            le regole con read_rules (regolamento aziendale e criteri fiscali caricati dal provider) e il conto del dipendente
            con read_employee. 3) Valuta l''ammissibilità: categoria ammessa, data nell''anno di competenza, importo coerente
            con la ricevuta, budget residuo sufficiente, documento leggibile. Cita sempre la regola usata; se manca la regola
            o sei in dubbio dillo e segna ''da verificare'': non dare mai consulenza fiscale come fatto e non inventare importi.
            4) Salva la pratica con save_claim (status pending, eligibility eligible|doubtful|not_eligible, summary) e chiama
            request_claim_review per l''approvazione di HR/operatore. Il rimborso e l''emissione effettiva dei voucher sono
            del provider. Rapporto in Markdown che inizia con un titolo ''# Pratica di rimborso — <categoria> <importo>''
            e le sezioni ## Dati della ricevuta, ## Ammissibilità, ## Regole applicate, ## Punti da verificare, ## Esito proposto.'
          mcp_servers: []
    appTools:
    - name: read_upload
      description: Legge un file caricato dall'utente (OCR incluso)
      action: read_file
    - name: read_rules
      description: Regolamento aziendale e regole fiscali
      action: read
      collection: rules
      scope: all
    - name: read_employee
      description: Il conto welfare del dipendente
      action: read
      collection: employees
      scope: user
    - name: save_claim
      description: Salva la pratica di rimborso
      action: append
      collection: claims
      scope: user
    context:
    - key: annual_budget
      from: collection:employees.annual_budget
    - key: hr_email
      from: collection:employees.hr_email
    - key: email
      from: user.email
    goalTemplate: 'Dipendente: {email} (HR: {hr_email}). Budget annuale: {annual_budget}.

      Categoria: {category_label}

      Importo richiesto: {amount} EUR

      Data della spesa: {expense_date}

      {?description}Note: {description}{/description}

      Ricevuta (file): {receipt}

      {?receipt_text}Testo della ricevuta: {receipt_text}{/receipt_text}

      Oggi è {date}. Scrivi in lingua {lang}.'
    output: markdown
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.5
  - key: assistant
    role: helper
    description: Risponde alle domande dei dipendenti sul piano welfare.
    profile:
      inline:
        display_name: Assistente welfare
        chat_mode: true
        crews:
        - id: assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: Sei l'assistente del portale welfare. Rispondi alle domande del dipendente su categorie ammesse,
            scadenze, saldo, stato di rimborsi e voucher, usando solo read_rules, read_employee, read_claims e read_vouchers.
            Se la regola non c'è, dillo e rimanda all'HR; non dare consulenza fiscale o legale come fatto e non inventare
            importi. Risposte brevi e chiare.
    appTools:
    - name: read_rules
      description: Regolamento aziendale e regole fiscali
      action: read
      collection: rules
      scope: all
    - name: read_employee
      description: Il conto welfare del dipendente
      action: read
      collection: employees
      scope: user
    - name: read_claims
      description: Le pratiche dell'utente
      action: read
      collection: claims
      scope: user
    - name: read_vouchers
      description: I voucher dell'utente
      action: read
      collection: vouchers
      scope: user
    context:
    - key: email
      from: user.email
    goalTemplate: 'Utente: {email}

      Conversazione finora:

      {history}

      Nuovo messaggio: {message}

      Rispondi in lingua {lang}.'
    output: markdown
  - key: reporter
    role: scheduled
    description: 'Report mensile per l''HR: utilizzo per categoria, budget residuo, scadenze.'
    memory: instance
    writesTo:
      collection: monthly_reports
    profile:
      inline:
        display_name: Reporter welfare HR
        crews:
        - id: reporter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Prepari il report mensile del welfare per l''HR. Leggi i dipendenti con read_company_employees,
            le pratiche con read_company_claims e i voucher con read_company_vouchers. Inizia con ''# Report welfare — <mese
            anno>''. Sezioni: ## Sintesi (budget totale, speso, residuo, % utilizzo), ## Utilizzo per categoria (con un blocco
            ```chart``` di tipo bar con cifre reali), ## Budget residuo e dipendenti con poco utilizzo, ## Scadenze (budget
            in scadenza nei prossimi 90 giorni), ## Pratiche in attesa. Usa solo dati letti; non inventare cifre; nessun consiglio
            fiscale.'
    appTools:
    - name: read_company_employees
      description: Dipendenti e budget dell'azienda
      action: read
      collection: employees
      scope: user
    - name: read_company_claims
      description: Pratiche dell'azienda
      action: read
      collection: claims
      scope: user
    - name: read_company_vouchers
      description: Voucher dell'azienda
      action: read
      collection: vouchers
      scope: user
  inputForm:
    title: Nuova richiesta di rimborso
    fields:
    - name: category
      type: select
      required: true
      label: Categoria
      options:
      - value: scuola
        label: Spese scolastiche
      - value: sanita
        label: Spese mediche
      - value: trasporti
        label: Abbonamento trasporti
      - value: palestra
        label: Palestra / sport
      - value: previdenza
        label: Previdenza complementare
    - name: amount
      type: number
      required: true
      label: Importo (EUR)
    - name: expense_date
      type: date
      required: true
      label: Data della spesa
    - name: description
      type: textarea
      maxLength: 500
      label: Note
    - name: receipt
      type: file
      required: true
      accept:
      - pdf
      - jpg
      - jpeg
      - png
      maxMb: 10
      label: Ricevuta
  data:
    collections:
    - name: employees
      ownedBy: user
      description: Dipendenti con budget annuale, caricati dall'HR
      fields:
      - name: name
        type: text
        required: true
        label: Nome
      - name: email
        type: email
        required: true
        label: Email
      - name: hr_email
        type: email
        required: true
        label: Email HR responsabile
      - name: annual_budget
        type: number
        required: true
        label: Budget annuale (EUR)
      - name: year
        type: number
        required: true
        label: Anno
      - name: expiry
        type: date
        required: true
        label: Scadenza budget
      access:
      - role: employee
        where:
          email: '{user.email}'
        can:
        - read
      retentionDays: 1825
    - name: claims
      ownedBy: user
      description: Pratiche di rimborso del dipendente
      fields:
      - name: hr_email
        type: email
        label: HR
      - name: category
        type: text
        label: Categoria
      - name: amount
        type: number
        label: Importo
      - name: expense_date
        type: date
        label: Data spesa
      - name: status
        type: select
        options:
        - pending
        - approved
        - rejected
        label: Stato
      - name: eligibility
        type: select
        options:
        - eligible
        - doubtful
        - not_eligible
        label: Ammissibilità
      - name: summary
        type: textarea
        label: Sintesi
      access:
      - role: hr
        where:
          hr_email: '{user.email}'
        can:
        - read
        - write
      retentionDays: 1825
    - name: suppliers
      ownedBy: shared
      description: Fornitori convenzionati (gestiti dal provider)
      fields:
      - name: name
        type: text
        label: Nome
      - name: category
        type: text
        label: Categoria
      - name: contact_email
        type: email
        label: Email referente
    - name: vouchers
      ownedBy: user
      description: Richieste e voucher emessi dal provider presso i fornitori
      fields:
      - name: category
        type: select
        required: true
        options:
        - buoni_spesa
        - palestra
        - trasporti
        label: Categoria
      - name: supplier
        type: select
        required: true
        optionsFrom: collection:suppliers
        label: Fornitore
      - name: supplier_email
        type: email
        label: Email fornitore
      - name: hr_email
        type: email
        label: Email HR
      - name: amount
        type: number
        required: true
        label: Importo
      - name: status
        type: select
        options:
        - requested
        - issued
        - redeemed
        label: Stato
      access:
      - role: supplier
        where:
          supplier_email: '{user.email}'
        can:
        - read
      - role: hr
        where:
          hr_email: '{user.email}'
        can:
        - read
    - name: rules
      ownedBy: shared
      description: Regolamento aziendale e regole fiscali, tenuti dall'operatore
      fields:
      - name: title
        type: text
        label: Titolo
      - name: category
        type: text
        label: Categoria
      - name: text
        type: textarea
        label: Testo
    - name: monthly_reports
      ownedBy: instance
      description: Report mensili HR
  views:
  - key: home
    type: page
    nav: false
    title: Portale Welfare
    sections:
    - type: hero
      title: Il tuo **welfare aziendale**, in un solo posto.
      text: Vedi il saldo, chiedi rimborsi con la ricevuta, scegli voucher e previdenza. Un agente prepara la pratica, l'HR
        approva.
      actions:
      - label: Accedi
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title: Come funziona
      items:
      - title: L'HR assegna il budget
        text: Carica i dipendenti e il budget annuale secondo il regolamento.
      - title: Il dipendente sceglie
        text: Rimborsi, trasporti, buoni spesa, palestra, previdenza.
      - title: Controllo e approvazione
        text: L'agente verifica la ricevuta; HR o operatore approvano.
      - title: Report mensile
        text: Utilizzo per categoria, residuo e scadenze all'HR.
    - type: note
      content: Rete fornitori, emissione dei voucher e aspetti fiscali sono gestiti dal provider. Le verifiche dell'agente
        sono un supporto, non consulenza fiscale.
  - key: balance
    type: page
    title: Il mio saldo
    roles:
    - employee
    sections:
    - type: data
      title: Il mio budget
      source: collection:employees
      display: kpi
      kpis:
      - label: Budget annuale
        agg: sum
        field: annual_budget
        format: money
      - label: Scadenza
        agg: last
        field: expiry
        format: date
    - type: data
      title: Rimborsi approvati
      source: collection:claims
      display: kpi
      filters:
      - field: status
        op: '='
        value: approved
      kpis:
      - label: Rimborsato
        agg: sum
        field: amount
        format: money
    - type: data
      title: I miei voucher
      source: collection:vouchers
      display: table
      fields:
      - key: category
        label: Categoria
      - key: supplier
        label: Fornitore
      - key: amount
        label: Importo
        format: money
      - key: status
        label: Stato
        format: badge
  - key: new_claim
    type: new_run
    title: Chiedi un rimborso
    roles:
    - employee
  - key: my_claims
    type: history
    title: Le mie pratiche
    source: run
    roles:
    - employee
  - key: claim_report
    type: report
    source: run
    printable: true
    nav: false
  - key: voucher_request
    type: form
    title: Richiedi un voucher
    collection: vouchers
    fields:
    - category
    - supplier
    - amount
    submit:
      label: Richiedi
      message: Richiesta inviata al provider.
    roles:
    - employee
  - key: assistant_chat
    type: chat
    title: Assistente
    source: agent:assistant
    examples:
    - Quanto budget mi resta?
    - Posso rimborsare un corso di inglese per mio figlio?
    - Quando scade il mio budget?
    placeholder: Chiedi qualcosa sul tuo piano welfare
    roles:
    - employee
  - key: employees_form
    type: form
    title: Aggiungi dipendente
    collection: employees
    submit:
      label: Salva
      message: Dipendente salvato.
    roles:
    - hr
    - admin
  - key: employees_table
    type: table
    title: Dipendenti e budget
    source: collection:employees
    columns:
    - name
    - email
    - annual_budget
    - year
    - expiry
    export: true
    roles:
    - hr
    - admin
  - key: company_claims
    type: table
    title: Pratiche azienda
    source: collection:claims
    columns:
    - category
    - amount
    - expense_date
    - eligibility
    - status
    - summary
    export: true
    roles:
    - hr
    - admin
  - key: company_usage
    type: page
    title: Utilizzo per categoria
    roles:
    - hr
    - admin
    sections:
    - type: data
      title: Utilizzo per categoria
      source: collection:claims
      display: chart
      chart: bar
      filters:
      - field: status
        op: '='
        value: approved
      groupBy:
        field: category
        aggs:
        - key: total
          agg: sum
          field: amount
      fields:
      - key: category
        label: Categoria
      - key: total
        label: Totale
        format: money
  - key: reviews
    type: approvals
    title: Pratiche da approvare
    approvals:
    - claim_review
    roles:
    - hr
    - admin
  - key: supplier_vouchers
    type: table
    title: Voucher emessi presso di me
    source: collection:vouchers
    columns:
    - category
    - amount
    - status
    roles:
    - supplier
  - key: reports
    type: instances
    template: monthly_report
    title: Report mensili
    roles:
    - hr
  approvals:
  - key: claim_review
    title: Approvazione pratica di rimborso
    role: hr
    fields:
    - category
    - amount
    - eligibility
    - summary
    timeoutMinutes: 10080
    onTimeout: reject
  triggers:
  - key: claim_decided
    'on':
      approval: claim_review
      decision: any
    notify:
      to: owner
      subject: Esito della tua pratica welfare
      body: La tua pratica di rimborso è stata esaminata. Apri il portale per vedere l'esito.
      link: my_claims
  - key: budget_expiry
    'on':
      date:
        collection: employees
        field: expiry
        offsetDays: -30
        hour: 8
    notify:
      to:
      - record.email
      - record.hr_email
      subject: Il tuo budget welfare sta per scadere
      body: Il budget welfare di {record.name} scade tra 30 giorni. Usalo dal portale.
      link: balance
  templates:
  - key: monthly_report
    title: Report mensile welfare
    description: Ogni mese l'HR riceve utilizzo per categoria, residuo e scadenze.
    agent: reporter
    params:
    - name: company
      type: text
      required: true
      label: Azienda
    goal: Prepara il report mensile welfare per "{instance}" (azienda {company}). Oggi è {date}. Scrivi in lingua {lang}.
    schedule:
      cron: 0 7 1 * *
      userCanChange: false
    maxPerUser: 1
    roles:
    - hr
    deliver:
      to: owner
      onlyIfNew: true
  billing:
    modes:
    - free
  notifications:
    emailOnRunDone: true
  extensions:
  - key: commission_on_budget
    description: 'La commissione dell''azienda sul budget gestito (percentuale) è fatturata dal provider fuori dal portale:
      il manifest non la calcola.'
  - key: budget_enforcement
    description: Il saldo residuo è mostrato e verificato dall'agente; non esiste un blocco automatico oltre il budget.
  - key: csv_upload_employees
    description: 'Il caricamento in blocco dei dipendenti da CSV non è disponibile per le raccolte di utente: l''HR li inserisce
      dal form.'
  - key: provider_integration
    description: Rete fornitori, emissione voucher ed effettivo rimborso sono nei sistemi del provider.
