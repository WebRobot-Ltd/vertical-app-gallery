apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: autenticamedia
  displayName: AutenticaMedia
  tagline:
    it: Verifica difensiva dell'autenticità di immagini, video e audio, con report firmato da un revisore.
    en: Defensive authenticity checks for images, video and audio, with a reviewer-signed report.
  description:
    it: Gestione dei casi e reportistica per redazioni, uffici legali, assicurazioni e banche. I modelli di rilevamento sono
      un servizio di analisi esterno; AutenticaMedia orchestra l'analisi, cerca versioni precedenti dei contenuti, redige
      il report e lo fa firmare da un revisore umano. Uso esclusivamente difensivo.
    en: Case management and reporting for newsrooms, legal departments, insurers and banks. Detection models are an external
      analysis service; AutenticaMedia orchestrates the analysis, looks for earlier versions of the content, drafts the report
      and has a human reviewer sign it. Strictly defensive use.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1d2b3a'
      accent: '#0b7a75'
      background: '#f6f7f9'
      foreground: '#16202a'
    fonts:
      body: Inter
      display: IBM Plex Serif
    wordmark:
    - text: Autentica
      color: primary
    - text: Media
      color: accent
    width: wide
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Monitoraggio
        en: Monitoring
      href: '#monitoraggio'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: analyst
      label:
        it: Analista
        en: Analyst
      assignedBy: signup
    - key: reviewer
      label:
        it: Revisore
        en: Reviewer
      assignedBy: invite
  limits:
  - action: agent:investigator
    per: user
    max: 5
    window: month
    plans:
      starter: 50
      business: 300
      enterprise: -1
  - action: create:org_profile
    max: 1
    window: total
  - action: login
    per: ip
    max: 20
    window: hour
  agents:
  - key: investigator
    role: main
    description: Extracts metadata, sends the content to the external analysis service, collects per-indicator scores, looks
      for earlier public versions, then hands over to the report writer.
    profile:
      inline:
        display_name: AutenticaMedia investigator
        crews:
        - id: investigator
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You are a media-forensics case investigator working for a defensive verification service (newsrooms,
            legal, insurance, banks). You never help create or improve manipulated content or identify people from faces.
            Steps: 1) Read the case context. If a file was uploaded, open it with read_upload (file id) and note technical
            metadata you can see (format, dimensions, duration, EXIF/creation data, software tags, inconsistencies). If only
            a public link was given, collect metadata from the page via the WebRobot MCP. 2) Call submit_analysis (POST) with
            a JSON body {"source_url": <public link or null>, "file_id": <id or null>, "media_type": "image|video|audio",
            "indicators": ["face_manipulation","synthetic_generation","audio_cloning","splicing","metadata_consistency"]}.
            Report each indicator''s score exactly as returned; if the service is unavailable or not connected, say so and
            never invent scores. 3) Search public sources (reverse-image style searches, news archives, social platforms,
            fact-check sites) through the WebRobot MCP for earlier or original versions of the same content; list URL, date
            found, and how similar. 4) Save the case with save_case (title, status ''analysed'', media_type, declared_source,
            scores summary, members = the team emails). 5) Call ask_reporter with the full findings so the report is drafted.
            Finish with a short level-1 Markdown title ''# Caso <title> — analisi completata'' and a summary table of indicators
            and earlier versions found. Never state a verdict yourself: that is the reporter''s job.'
          mcp_servers_note: webrobot
    goalTemplate: 'Case title: {case_title}

      {?evidence}Uploaded file(s): {evidence}

      {?evidence_text}Text extracted from the file: {evidence_text}{/evidence_text}{/evidence}

      {?link}Public link: {link}{/link}

      Declared source: {declared_source}

      {?content_date}Date of the content (declared): {content_date}{/content_date}

      {?person}Person depicted / involved: {person}{/person}

      Reason for verification: {reason_label}

      {?notes}Notes: {notes}{/notes}

      Team emails of this organisation (case members): {team}

      Analyst: {email}. Today is {date}. Write in the language with ISO code {lang}.'
    context:
    - key: team
      from: collection:org_profile.members
    - key: email
      from: user.email
    appTools:
    - name: read_upload
      description: Read a file the user uploaded (images and scans included)
      action: read_file
    - name: submit_analysis
      description: Send the content to the external analysis service and get the score of each indicator
      action: http
      http:
        method: POST
        url: https://api.analysis-provider.example/v1/analyses
        timeoutMs: 30000
        attribution: External analysis service (configured by the app owner)
        credential:
          provider: analysis_service
          header: Authorization
          format: Bearer {secret}
    - name: save_case
      description: Create or update the case record
      action: write
      collection: cases
      scope: user
    delegates:
    - reporter
    output: markdown
    limits:
      maxTurns: 30
      maxBudgetUsd: 1.5
  - key: reporter
    role: helper
    description: Drafts the report with a reasoned verdict, confidence and limits, then asks the human reviewer to sign.
    profile:
      inline:
        display_name: AutenticaMedia report writer
        crews:
        - id: reporter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write forensic verification reports for a defensive service. Start with ''# Report di verifica
            — <case title>'' (or ''# Verification report — <case title>'' in English). Sections (## headings): Sintesi / Summary;
            Contesto dichiarato / Declared context; Metadati / Metadata; Indicatori / Indicators (table: indicator, score,
            meaning); Versioni precedenti / Earlier versions found; Giudizio / Verdict — exactly one of: probabilmente autentico
            (probably authentic), dubbio (doubtful), probabilmente manipolato (probably manipulated), with a reasoned justification;
            Livello di confidenza / Confidence: low, medium or high, with why; Limiti dell''analisi / Limits (detector error
            rates, compression, short samples, missing original, no certainty). Add a ```chart bar block of indicator scores
            when at least 3 real scores exist. Use only figures provided; never invent scores; never present the verdict as
            legal proof or identify anyone from their face. After writing, save it with save_report (status ''awaiting_signature'')
            and call request_sign_report: the report cannot be exported or shared until a human reviewer signs.'
          mcp_servers_note: none
    appTools:
    - name: read_cases
      description: Read the organisation's cases
      action: read
      collection: cases
      scope: user
    - name: save_report
      description: Save the report draft
      action: write
      collection: reports
      scope: user
    awaits:
    - sign_report
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.5
  - key: monitor
    role: scheduled
    description: Periodic scan of public mentions of a brand and its executives, flagging impersonation or synthetic media.
    memory: instance
    writesTo:
      collection: mentions
      parse: whole
    profile:
      inline:
        display_name: AutenticaMedia brand monitor
        crews:
        - id: monitor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 20
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You monitor public web sources (news, social platforms, video sites, forums) for mentions of one
            organisation''s brand and named executives, with a defensive aim: spot possible deepfakes, impersonation, or misleading
            media. Start with ''# <brand> — monitoraggio <date>''. Sections: ## Nuove menzioni (title, URL, date, source),
            ## Contenuti sospetti (why suspicious, severity high|medium|low), ## Già noto. Your memory holds the URLs seen
            before: report only what is new and at the end call remember with the URLs seen (replace old ones). Never invent
            URLs; if nothing new, say so in one line. Suggest opening a case for suspicious media, never conclude it is fake
            yourself.'
          mcp_servers_note: webrobot
    output: markdown
    limits:
      maxTurns: 20
      maxBudgetUsd: 1.0
  approvals:
  - key: sign_report
    title:
      it: Firma del report
      en: Report signature
    description: A human reviewer reads the report and signs it before PDF export or sharing.
    role: reviewer
    decidedBy: role
    fields:
    - title
    - verdict
    - confidence
    timeoutMinutes: 10080
    onTimeout: reject
  triggers:
  - key: report_signed
    'on':
      approval: sign_report
      decision: approved
    notify:
      to: owner
      subject:
        it: Report firmato e pronto per l'export
        en: Report signed and ready to export
      body:
        it: Il revisore ha firmato il report. Ora puoi esportarlo in PDF o condividerlo.
        en: The reviewer has signed the report. You can now export it as PDF or share it.
      link: report
  - key: report_rejected
    'on':
      approval: sign_report
      decision: rejected
    notify:
      to: owner
      subject:
        it: Report non firmato
        en: Report not signed
      body:
        it: 'Il revisore non ha firmato il report: apri il caso per vedere le osservazioni.'
        en: 'The reviewer did not sign the report: open the case to see the comments.'
      link: cases
  - key: high_risk_mention
    'on':
      collection: mentions
      op: insert
      where:
        severity: high
    notify:
      to: owner
      subject:
        it: 'Alert: contenuto sospetto su {record.title}'
        en: 'Alert: suspicious content on {record.title}'
      body:
        it: 'Il monitoraggio ha trovato un contenuto sospetto ad alta severità: {record.summary}

          {record.url}

          Apri un caso per verificarlo.'
        en: 'Monitoring found a high-severity suspicious item: {record.summary}

          {record.url}

          Open a case to verify it.'
      link: mentions
  templates:
  - key: brand_watch
    title:
      it: Monitoraggio marchio e dirigenti
      en: Brand and executive watch
    description:
      it: Controllo periodico delle menzioni pubbliche con alert email.
      en: Periodic check of public mentions with email alerts.
    agent: monitor
    params:
    - name: brand
      type: text
      required: true
      label:
        it: Marchio
        en: Brand
    - name: executives
      type: textarea
      maxLength: 500
      label:
        it: Dirigenti da monitorare (uno per riga)
        en: Executives to monitor (one per line)
    - name: keywords
      type: text
      label:
        it: Parole chiave aggiuntive
        en: Extra keywords
    goal: 'Watch "{instance}": brand {brand}; executives: {executives}; extra keywords: {keywords}. Today is {date}. Write
      in the language with ISO code {lang}.'
    schedule:
      cron: 0 6 * * *
      userCanChange: true
    maxPerUser: 5
    roles:
    - analyst
    - admin
    cost:
      perRun: 5
    deliver:
      to: owner
      subject:
        it: Monitoraggio {title}
        en: Monitoring {title}
      onlyIfNew: true
  inputForm:
    title:
      it: Apri un caso
      en: Open a case
    fields:
    - name: case_title
      type: text
      required: true
      maxLength: 120
      label:
        it: Titolo del caso
        en: Case title
    - name: evidence
      type: file
      accept:
      - jpg
      - jpeg
      - png
      - webp
      - pdf
      maxMb: 15
      multiple: true
      label:
        it: File (immagine o frame/estratto)
        en: File (image or frame/excerpt)
      help:
        it: Per video e audio indica un link pubblico.
        en: For video and audio give a public link.
    - name: link
      type: url
      label:
        it: Link pubblico al contenuto
        en: Public link to the content
    - name: declared_source
      type: text
      required: true
      label:
        it: Fonte dichiarata
        en: Declared source
    - name: content_date
      type: date
      label:
        it: Data del contenuto
        en: Content date
    - name: person
      type: text
      label:
        it: Persona ritratta
        en: Person depicted
    - name: reason
      type: select
      required: true
      label:
        it: Motivo della verifica
        en: Reason for verification
      options:
      - value: news
        label:
          it: Verifica giornalistica
          en: Newsroom verification
      - value: legal
        label:
          it: Contenzioso / prova legale
          en: Litigation / legal evidence
      - value: claim
        label:
          it: Sinistro assicurativo
          en: Insurance claim
      - value: fraud
        label:
          it: Frode / impersonificazione
          en: Fraud / impersonation
      - value: reputation
        label:
          it: Tutela reputazione
          en: Reputation protection
    - name: notes
      type: textarea
      maxLength: 800
      label:
        it: Note
        en: Notes
  data:
    collections:
    - name: org_profile
      description: The organisation's profile and the emails of its team (the people who see its cases)
      ownedBy: user
      fields:
      - name: org_name
        type: text
        required: true
        label:
          it: Organizzazione
          en: Organisation
      - name: sector
        type: select
        label:
          it: Settore
          en: Sector
        options:
        - value: newsroom
          label:
            it: Redazione
            en: Newsroom
        - value: legal
          label:
            it: Ufficio legale
            en: Legal
        - value: insurance
          label:
            it: Assicurazione
            en: Insurance
        - value: bank
          label:
            it: Banca
            en: Bank
      - name: members
        type: text
        required: true
        label:
          it: Email del team (separate da virgola)
          en: Team emails (comma separated)
      access:
      - role: analyst
        where:
          members: '{user.email}'
        can:
        - read
      - role: reviewer
        where:
          members: '{user.email}'
        can:
        - read
    - name: cases
      description: Verification cases; visible only to the owning organisation's team
      ownedBy: user
      fields:
      - name: title
        type: text
        required: true
      - name: status
        type: select
        options:
        - open
        - analysed
        - awaiting_signature
        - signed
        - rejected
      - name: media_type
        type: select
        options:
        - image
        - video
        - audio
      - name: declared_source
        type: text
      - name: scores
        type: textarea
      - name: earlier_versions
        type: textarea
      - name: members
        type: text
      access:
      - role: analyst
        where:
          members: '{user.email}'
        can:
        - read
        - write
      - role: reviewer
        where:
          members: '{user.email}'
        can:
        - read
        - write
      retentionDays: 730
    - name: reports
      description: Draft and signed reports
      ownedBy: user
      fields:
      - name: title
        type: text
        required: true
      - name: verdict
        type: select
        options:
        - probably_authentic
        - doubtful
        - probably_manipulated
      - name: confidence
        type: select
        options:
        - low
        - medium
        - high
      - name: body
        type: textarea
      - name: status
        type: select
        options:
        - awaiting_signature
        - signed
        - rejected
      - name: members
        type: text
      access:
      - role: analyst
        where:
          members: '{user.email}'
        can:
        - read
      - role: reviewer
        where:
          members: '{user.email}'
        can:
        - read
        - write
      retentionDays: 1825
    - name: mentions
      description: Mentions found by each brand watch
      ownedBy: instance
      fields:
      - name: title
        type: text
      - name: summary
        type: textarea
      - name: severity
        type: select
        options:
        - high
        - medium
        - low
      - name: url
        type: url
      - name: date
        type: date
      retentionDays: 365
    credentials:
    - provider: analysis_service
      kind: api_key
      scope: org
      label:
        it: Servizio di analisi esterno
        en: External analysis service
      help:
        it: Chiave API del servizio di rilevamento contenuti generati o manipolati; la imposta l'admin.
        en: API key of the external detection service for generated or manipulated content; set by the admin.
  egress:
    hosts:
    - api.analysis-provider.example
    notes: 'Placeholder host of the external detection service the app owner contracts: replace with the provider''s real
      API host and check its terms before publishing.'
  views:
  - key: home
    type: page
    nav: false
    title: AutenticaMedia
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow:
        it: Verifica difensiva
        en: Defensive verification
      title:
        it: Sai se quell'immagine, video o audio è **autentico**?
        en: Is that image, video or audio **authentic**?
      text:
        it: Apri un caso, un agente analizza il contenuto con un servizio esterno e cerca versioni precedenti; un secondo
          agente scrive il report e un revisore umano lo firma prima dell'export.
        en: 'Open a case: an agent analyses the content with an external service and looks for earlier versions; a second
          agent writes the report and a human reviewer signs it before export.'
      actions:
      - label:
          it: Apri un caso
          en: Open a case
        href: /v/new_case
        style: primary
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: ghost
      aside: <div style="padding:16px"><b>Giudizio / Verdict</b><br>Probabilmente autentico · Dubbio · Probabilmente manipolato<br><small>+
        confidenza e limiti dell'analisi / confidence and limits</small></div>
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: 'Analista: apre il caso'
          en: 'Analyst: opens the case'
        text:
          it: File o link pubblico, fonte dichiarata, data, persona, motivo.
          en: File or public link, declared source, date, person, reason.
        badge: 📁
      - title:
          it: 'Agenti: analisi e report'
          en: 'Agents: analysis and report'
        text:
          it: Metadati, punteggi per indicatore, versioni precedenti, giudizio motivato con confidenza e limiti.
          en: Metadata, per-indicator scores, earlier versions, reasoned verdict with confidence and limits.
        badge: 🔎
      - title:
          it: 'Revisore: firma'
          en: 'Reviewer: signs'
        text:
          it: Solo dopo la firma il report si esporta in PDF o si condivide.
          en: Only after signature can the report be exported as PDF or shared.
        badge: ✍️
    - type: cards
      id: monitoraggio
      title:
        it: Monitoraggio per aziende
        en: Monitoring for businesses
      intro:
        it: Controllo periodico di menzioni del marchio e dei dirigenti, con alert email sui contenuti sospetti.
        en: Periodic check of brand and executive mentions, with email alerts on suspicious content.
      items:
      - title:
          it: Isolamento per organizzazione
          en: Per-organisation isolation
        text:
          it: Ogni organizzazione vede solo i propri casi.
          en: Each organisation sees only its own cases.
        badge: 🔒
      - title:
          it: Abbonamento a volume
          en: Volume plans
        text:
          it: Piani in base al numero di analisi mensili.
          en: Plans by monthly number of analyses.
        badge: 📊
    - type: note
      content:
        it: 'Uso esclusivamente difensivo. L''esito è un supporto alla decisione, non una prova legale: i rilevatori hanno
          margini di errore indicati nel report.'
        en: 'Strictly defensive use. The outcome supports decisions and is not legal proof: detectors have error margins stated
          in each report.'
  - key: org
    type: form
    title:
      it: Organizzazione e team
      en: Organisation and team
    collection: org_profile
    edit: true
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Profilo salvato
        en: Profile saved
      redirect: new_case
    roles:
    - analyst
    - admin
  - key: new_case
    type: new_run
    title:
      it: Nuovo caso
      en: New case
    roles:
    - analyst
    - admin
  - key: history
    type: history
    title:
      it: Analisi
      en: Analyses
    source: run
    roles:
    - analyst
    - reviewer
    - admin
  - key: cases
    type: table
    title:
      it: Casi
      en: Cases
    source: collection:cases
    columns:
    - title
    - status
    - media_type
    - declared_source
    export: true
    roles:
    - analyst
    - reviewer
    - admin
  - key: reports_list
    type: table
    title:
      it: Report
      en: Reports
    source: collection:reports
    columns:
    - title
    - verdict
    - confidence
    - status
    roles:
    - analyst
    - reviewer
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: signatures
    type: approvals
    title:
      it: Da firmare
      en: To sign
    approvals:
    - sign_report
    roles:
    - reviewer
    - admin
  - key: watches
    type: instances
    template: brand_watch
    title:
      it: Monitoraggio
      en: Monitoring
    roles:
    - analyst
    - admin
  - key: mentions
    type: table
    title:
      it: Menzioni e alert
      en: Mentions and alerts
    source: collection:mentions
    columns:
    - date
    - title
    - severity
    - url
    roles:
    - analyst
    - reviewer
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Plan
    roles:
    - analyst
    - admin
  - key: admin
    type: admin
    title: Admin
    roles:
    - admin
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 20
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
      - browser
    costs:
      agent:investigator:
        estimate: 40
        metered: true
    packs:
    - key: extra
      credits: 1000
      price: 15
      label:
        it: Analisi extra
        en: Extra analyses
    plans:
    - key: starter
      price: 79
      interval: month
      label: Starter
      credits: 2000
      creditsReset: monthly
      includes:
      - 50 analisi/mese · 50 analyses/month
      roles:
      - analyst
      - admin
    - key: business
      price: 299
      interval: month
      label: Business
      credits: 10000
      creditsReset: monthly
      includes:
      - 300 analisi/mese · 300 analyses/month
      - Monitoraggio marchio · Brand monitoring
      roles:
      - analyst
      - admin
    - key: enterprise
      price: 899
      interval: month
      label: Enterprise
      credits: 40000
      creditsReset: monthly
      includes:
      - Analisi illimitate · Unlimited analyses
      - Monitoraggio esteso · Extended monitoring
      roles:
      - analyst
      - admin
  notifications:
    emailOnRunDone: true
  extensions:
  - key: video_audio_upload
    description: 'Direct upload of video and audio files is not available (file fields accept documents and images only):
      video and audio are verified through a public link.'
  - key: access_audit_log
    description: A dedicated, exportable log of every read access to cases and reports is not expressible in the manifest;
      the runtime records runs and approvals decisions only.
  - key: pdf_export_gate
    description: Hard blocking of PDF export/sharing until the report is signed is enforced by the approval flow and report
      status; a runtime-level export lock on unsigned reports is not available.
  - key: detection_service_contract
    description: The external analysis service host, request body and response shape are placeholders to align with the contracted
      provider.
