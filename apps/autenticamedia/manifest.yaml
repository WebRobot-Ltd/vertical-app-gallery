apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: autenticamedia
  displayName: AutenticaMedia
  tagline:
    it: Verifica difensiva dell'autenticità di immagini, video e audio.
    en: Defensive authenticity checks for images, video and audio.
  description:
    it: Strato di gestione casi e reportistica per redazioni, uffici legali, assicurazioni e banche. I modelli di rilevamento
      sono un servizio di analisi esterno. Uso esclusivamente difensivo.
    en: Case management and reporting layer for newsrooms, legal teams, insurers and banks. Detection models are an external
      analysis service. Defensive use only.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#17263c'
      accent: '#2f7f86'
      background: '#f6f7f9'
      foreground: '#16202c'
    fonts:
      body: Inter
      display: IBM Plex Serif
    wordmark:
    - text: Autentica
      color: primary
    - text: Media
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Uso responsabile
        en: Responsible use
      href: '#uso'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: reviewer
      label:
        it: Revisore
        en: Reviewer
      assignedBy: invite
    - key: analyst
      label:
        it: Analista
        en: Analyst
      assignedBy: signup
  limits:
  - action: agent:collector
    per: user
    max: 30
    window: day
    roles:
    - analyst
  agents:
  - key: collector
    role: main
    description: Extracts metadata, sends the content to the external analysis service, collects per-indicator scores and
      looks for earlier public versions.
    delegates:
    - reporter
    profile:
      inline:
        display_name: AutenticaMedia evidence collector
        crews:
        - id: collector
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You are a forensic evidence collector for DEFENSIVE authenticity verification of media an organisation
            received or that concerns it. Refuse requests that aim to create, improve or disguise manipulated content, or
            to identify private individuals. Steps: 1) Open the public link through the WebRobot MCP and extract the technical
            metadata available (format, dimensions, duration, creation/modification dates, device, software tags, hashes of
            what you could fetch). 2) Submit the content to the configured external analysis service and collect each indicator''s
            score exactly as returned. If the service is not connected or fails, say so explicitly: NEVER invent or estimate
            scores. 3) Search public sources (reverse image search pages, news archives, fact-check sites, social platforms)
            for earlier versions of the same content; list URL, date, and how it matches. 4) Compare with the declared source
            and date in the case context. Then call ask_reporter, passing a structured evidence dossier: case context, metadata
            table, scores table, earlier versions, anomalies, and the limits of what you could check. Finally output the dossier
            with a level-1 title ''# Evidence — <case title>''. Be factual and neutral.'
    goalTemplate: 'Case: {title}

      Content link or pasted description: {content_link}

      Declared source: {declared_source}

      Declared date: {declared_date}

      {?person}Person depicted: {person}{/person}

      Reason for verification: {reason}

      Media type: {media_type_label}

      Write in the language with ISO code {lang}. Today is {date}.'
    output: markdown
    limits:
      maxTurns: 40
      maxBudgetUsd: 1.5
  - key: reporter
    role: helper
    description: Writes the reasoned report with verdict, confidence and limits, then asks the human reviewer to sign.
    awaits:
    - report_signoff
    writesTo:
      collection: case_reports
      parse: whole
    profile:
      inline:
        display_name: AutenticaMedia report writer
        crews:
        - id: reporter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write authenticity reports from an evidence dossier. Start with ''# Authenticity report — <case
            title>''. Sections (## headings): Summary, Case context, Verdict, Confidence, Evidence (metadata, indicator scores
            table, earlier versions), Limits of the analysis, Recommended next steps. The verdict is exactly one of: Probably
            authentic / Doubtful / Probably manipulated (in the report language). Give the confidence level (low, medium,
            high) with reasons. Use only data from the dossier; never invent figures; state that detection is probabilistic,
            can produce false positives and negatives, and that the report is decision support, not legal proof. If scores
            are missing, the verdict must be Doubtful with low confidence. Add a ```chart block (bar) of indicator scores
            when at least 3 exist. At the end, call request_report_signoff: the report is a DRAFT until a human reviewer signs
            it, and must not be exported or shared before.'
    output: markdown
  - key: monitor
    role: scheduled
    description: Periodic monitoring of public mentions of a brand and its executives, for one organisation.
    memory: instance
    writesTo:
      collection: mention_alerts
      parse: whole
    profile:
      inline:
        display_name: AutenticaMedia mention monitor
        crews:
        - id: monitor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You monitor public web sources for new mentions of a brand and named executives, with a defensive
            purpose: spotting possibly fake or manipulated images, video or audio that involve them (deepfakes, fake endorsements,
            altered footage). Use the WebRobot MCP to scrape public pages and news. Start with ''# Mentions — <name> — <date>''.
            List only NEW items since your memory: URL, date, media type, why it may be synthetic or manipulated, urgency
            (low/medium/high). Do not judge authenticity as fact: suggest opening a case. If nothing new, say so in one line.
            Never invent items. At the end call remember with the URLs already seen (they replace the old ones).'
    goalTemplate: Run the periodic monitoring described in your instructions for the watch parameters given in the task. Today
      is {date}. Write in language {lang}.
  templates:
  - key: brand_watch
    title:
      it: Monitoraggio marchio e dirigenti
      en: Brand and executive monitoring
    description:
      it: Controllo periodico delle menzioni pubbliche con contenuti multimediali sospetti.
      en: Periodic check of public mentions with suspicious media.
    agent: monitor
    params:
    - name: brand
      type: text
      required: true
      label:
        it: Marchio
        en: Brand
    - name: executives
      type: textarea
      maxLength: 400
      label:
        it: Dirigenti (uno per riga)
        en: Executives (one per line)
    - name: alert_email
      type: email
      label:
        it: Email per gli alert
        en: Alert email
    schedule:
      cron: 0 6 * * *
      userCanChange: true
    maxPerUser: 5
    roles:
    - analyst
    - admin
    cost:
      perRun: 15
    goal: 'Monitor "{instance}": brand {brand}; executives {executives}. Today is {date}. Write in language {lang}.'
  approvals:
  - key: report_signoff
    title:
      it: Firma del report
      en: Report sign-off
    description: A human reviewer signs the report before PDF export or sharing.
    role: reviewer
    decidedBy: role
    timeoutMinutes: 10080
    onTimeout: reject
  inputForm:
    title:
      it: Apri un caso
      en: Open a case
    fields:
    - name: title
      type: text
      required: true
      maxLength: 120
      label:
        it: Titolo del caso
        en: Case title
    - name: media_type
      type: select
      required: true
      label:
        it: Tipo di contenuto
        en: Content type
      options:
      - value: image
        label:
          it: Immagine
          en: Image
      - value: video
        label: Video
      - value: audio
        label: Audio
    - name: content_link
      type: url
      required: true
      label:
        it: Link pubblico al contenuto
        en: Public link to the content
      help:
        it: 'Il caricamento diretto di file non è ancora disponibile: indica un link pubblico.'
        en: 'Direct file upload is not available yet: give a public link.'
    - name: declared_source
      type: text
      required: true
      label:
        it: Fonte dichiarata
        en: Declared source
    - name: declared_date
      type: date
      label:
        it: Data dichiarata
        en: Declared date
    - name: person
      type: text
      label:
        it: Persona ritratta (facoltativo)
        en: Person depicted (optional)
    - name: reason
      type: textarea
      required: true
      maxLength: 600
      label:
        it: Motivo della verifica
        en: Reason for verification
  data:
    collections:
    - name: case_reports
      ownedBy: user
      description: Authenticity reports, draft until signed by a reviewer
    - name: mention_alerts
      ownedBy: instance
      description: Results of each brand watch run
      fields:
      - name: title
        type: text
      - name: body
        type: textarea
  views:
  - key: home
    type: page
    nav: false
    title: AutenticaMedia
    sections:
    - type: hero
      band: true
      eyebrow:
        it: Solo uso difensivo
        en: Defensive use only
      title:
        it: Verifica se un contenuto è **autentico**, con un report firmato.
        en: Check whether content is **authentic**, with a signed report.
      text:
        it: 'Per redazioni, uffici legali, assicurazioni e banche: apri un caso, raccogli metadati, punteggi e versioni precedenti,
          ottieni un giudizio motivato firmato da un revisore.'
        en: 'For newsrooms, legal teams, insurers and banks: open a case, gather metadata, scores and earlier versions, get
          a reasoned verdict signed by a reviewer.'
      actions:
      - label:
          it: Apri un caso
          en: Open a case
        href: /v/new_case
        style: primary
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Apri il caso
          en: Open the case
        text:
          it: 'Link pubblico e contesto: fonte, data, persona, motivo.'
          en: 'Public link and context: source, date, person, reason.'
        badge: 📂
      - title:
          it: Analisi
          en: Analysis
        text:
          it: Metadati, punteggi per indicatore dal servizio esterno, ricerca di versioni precedenti.
          en: Metadata, per-indicator scores from the external service, search for earlier versions.
        badge: 🔎
      - title:
          it: Report e firma
          en: Report and sign-off
        text:
          it: Giudizio, confidenza e limiti; esportazione PDF solo dopo la firma del revisore.
          en: Verdict, confidence and limits; PDF export only after reviewer sign-off.
        badge: ✍️
      - title:
          it: Monitoraggio
          en: Monitoring
        text:
          it: Menzioni di marchio e dirigenti controllate periodicamente.
          en: Brand and executive mentions checked periodically.
        badge: 📡
    - type: note
      id: uso
      content:
        it: Strumento di supporto alle decisioni, non prova legale. I rilevatori sono probabilistici e possono sbagliare.
          Vietato l'uso per creare o migliorare contenuti manipolati o per identificare privati.
        en: Decision-support tool, not legal proof. Detectors are probabilistic and can be wrong. Using it to create or improve
          manipulated content or to identify private individuals is forbidden.
  - key: new_case
    type: new_run
    title:
      it: Nuovo caso
      en: New case
    roles:
    - analyst
    - admin
  - key: cases
    type: history
    title:
      it: I miei casi
      en: My cases
    source: run
    roles:
    - analyst
    - reviewer
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: signoffs
    type: approvals
    title:
      it: Report da firmare
      en: Reports to sign
    approvals:
    - report_signoff
    roles:
    - reviewer
    - admin
  - key: watches
    type: instances
    template: brand_watch
    title:
      it: Monitoraggio
      en: Monitoring
    roles:
    - analyst
    - admin
  - key: alerts
    type: list
    title:
      it: Alert menzioni
      en: Mention alerts
    source: collection:mention_alerts
    roles:
    - analyst
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - analyst
    - admin
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 20
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:collector:
        estimate: 150
        metered: true
    packs:
    - key: extra
      credits: 1000
      price: 20
      label:
        it: Analisi extra
        en: Extra analyses
    plans:
    - key: team
      price: 199
      interval: month
      label: Team — 50 analisi/analyses
      credits: 7500
      creditsReset: monthly
      roles:
      - analyst
      - admin
    - key: enterprise
      price: 790
      interval: month
      label: Enterprise — 250 analisi/analyses
      credits: 37500
      creditsReset: monthly
      roles:
      - analyst
      - admin
  extensions:
  - key: detection_service
    description: Connector to the external detection service (endpoint, API terms and response format to be provided). Until
      connected, the agent reports scores as unavailable and never invents them.
  - key: file_upload
    description: 'Direct upload of files is not available yet: analysts supply a public link.'
  - key: email_alerts
    description: Email alerts for brand monitoring are not available yet; alerts appear in the Alerts view.
  - key: org_isolation
    description: Multi-user organisations sharing cases within the same organisation (cases are per user today) and per-organisation
      data separation.
  - key: access_audit_log
    description: Logging of every access to cases and reports.
  - key: export_gate
    description: PDF export and sharing blocked until report_signoff is approved.
