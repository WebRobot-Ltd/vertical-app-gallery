apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: palatosocial
  displayName: PalatoSocial
  tagline:
    it: La presenza social del tuo locale, con un piano editoriale ogni mese.
  description:
    it: PalatoSocial legge i dati pubblici del tuo locale da Google Places, ne ricava punti di forza e criticità e prepara
      ogni mese un piano editoriale con idee di post e reel, testi, hashtag e date. Tu approvi ogni contenuto.
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#7a1f2b'
      accent: '#e07a2f'
      background: '#fbf6f0'
      foreground: '#231a17'
    fonts:
      body: Inter
      display: Playfair Display
    wordmark:
    - text: Palato
      color: primary
    - text: Social
      color: accent
  header:
    links:
    - label:
        it: Come funziona
      href: '#come-funziona'
    - label:
        it: Prezzi
      href: '#prezzi'
    cta:
      label:
        it: Inizia
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: agency
      label:
        it: Agenzia partner
      assignedBy: invite
    - key: user
      label:
        it: Ristoratore
      assignedBy: signup
  limits:
  - action: agent:analyst
    per: user
    max: 5
    window: day
    roles:
    - user
  egress:
    hosts:
    - places.googleapis.com
    notes: 'Google Places API (New), uso ufficiale con licenza: orari, valutazione, recensioni. Si rispettano i Termini di
      Google Maps Platform, con attribuzione.'
  agents:
  - key: analyst
    role: main
    description: Legge i dati pubblici del locale da Google Places e ne ricava punti di forza e criticità.
    profile:
      inline:
        display_name: PalatoSocial analista
        crews:
        - id: analyst
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un social media strategist per ristoranti. Cerchi il locale con lo strumento places_search (POST,
            body JSON {"textQuery":"<nome> <città>","languageCode":"it"}), poi, se serve, places_details con path /<place
            id>. Ricavi orari, valutazione media, numero di recensioni e recensioni recenti. Non inventare mai dati: se un
            campo manca, scrivilo. Struttura del report: parti con un titolo di livello 1 "# Analisi social — <locale>". Poi
            sezioni ## Scheda del locale, ## Punti di forza (con citazioni brevi delle recensioni), ## Criticità, ## Opportunità
            sui canali scelti, ## Tre idee di contenuto da cui partire. Se utile aggiungi un grafico ```chart``` con figure
            reali. Chiudi con la nota: dati Google Places, uso conforme ai termini. Italiano, tono professionale e concreto,
            max 500 parole.'
    appTools:
    - name: places_search
      description: Cerca un locale su Google Places (Text Search)
      action: http
      http:
        method: POST
        url: https://places.googleapis.com/v1/places:searchText
        headers:
          X-Goog-FieldMask: places.id,places.displayName,places.formattedAddress,places.rating,places.userRatingCount,places.regularOpeningHours,places.reviews
        attribution: Google Places API
    - name: places_details
      description: Dettagli di un locale Google Places dato l'id
      action: http
      http:
        method: GET
        url: https://places.googleapis.com/v1/places
        allowPath: true
        headers:
          X-Goog-FieldMask: id,displayName,rating,userRatingCount,regularOpeningHours,reviews
        attribution: Google Places API
    goalTemplate: 'Locale: {name}, {city}.

      Cucina: {cuisine}. Pubblico: {audience}. Tono di voce: {tone_label}. Canali: {channels}.

      {?notes}Note: {notes}{/notes}

      Data: {date}. Scrivi in italiano.'
    output: markdown
  - key: planner
    role: helper
    description: Ogni mese prepara il piano editoriale del locale e lo propone al ristoratore.
    profile:
      inline:
        display_name: PalatoSocial editor
        crews:
        - id: planner
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei il social media manager di un locale. Leggi i dati pubblici con places_search/places_details
            (non inventare nulla), individua punti di forza e criticità, poi scrivi il piano editoriale del mese. Parti con
            "# Piano editoriale — <locale> — <mese>". Poi una tabella con colonne: Data, Canale (Instagram/TikTok/Facebook,
            solo quelli scelti), Formato (post/reel), Idea, Testo, Hashtag, Video da girare (cosa riprendere in sala o in
            cucina, max 20 secondi). 8-12 contenuti, distribuiti nel mese, rispettando tono di voce e pubblico. Sezione ##
            Perché questo piano con i dati usati. Il tuo memory contiene il piano precedente: non ripetere le stesse idee.
            Quando il piano è pronto chiedi l''approvazione con request_approve_plan; non considerare nulla pubblicato. Alla
            fine chiama remember con i 5 temi del mese. Italiano.'
    appTools:
    - name: places_search
      description: Cerca un locale su Google Places (Text Search)
      action: http
      http:
        method: POST
        url: https://places.googleapis.com/v1/places:searchText
        headers:
          X-Goog-FieldMask: places.id,places.displayName,places.formattedAddress,places.rating,places.userRatingCount,places.regularOpeningHours,places.reviews
        attribution: Google Places API
    - name: places_details
      description: Dettagli di un locale Google Places dato l'id
      action: http
      http:
        method: GET
        url: https://places.googleapis.com/v1/places
        allowPath: true
        headers:
          X-Goog-FieldMask: id,displayName,rating,userRatingCount,regularOpeningHours,reviews
        attribution: Google Places API
    awaits:
    - approve_plan
    memory: instance
    writesTo:
      collection: monthly_plans
      parse: whole
    output: markdown
  inputForm:
    title:
      it: Analizza il tuo locale
    fields:
    - name: name
      type: text
      required: true
      label:
        it: Nome del locale
    - name: city
      type: text
      required: true
      label:
        it: Città
    - name: cuisine
      type: text
      required: true
      label:
        it: Tipo di cucina
    - name: audience
      type: text
      required: true
      label:
        it: Pubblico
      help:
        it: es. famiglie, giovani, turisti
    - name: tone
      type: select
      required: true
      label:
        it: Tono di voce
      options:
      - value: caldo
        label:
          it: Caldo e familiare
      - value: elegante
        label:
          it: Elegante
      - value: giovane
        label:
          it: Giovane e ironico
      - value: artigianale
        label:
          it: Autentico e artigianale
    - name: channels
      type: multiselect
      required: true
      label:
        it: Canali social usati
      options:
      - value: instagram
        label: Instagram
      - value: tiktok
        label: TikTok
      - value: facebook
        label: Facebook
    - name: notes
      type: textarea
      maxLength: 400
      label:
        it: Note (facoltative)
  data:
    collections:
    - name: monthly_plans
      ownedBy: instance
      description: Piani editoriali mensili di ogni locale (uno per esecuzione)
  approvals:
  - key: approve_plan
    title:
      it: Approva il piano editoriale
    description: Il ristoratore conferma il piano del mese proposto dall'agente
    decidedBy: requester
    timeoutMinutes: 10080
    onTimeout: reject
  templates:
  - key: social_plan
    title:
      it: Piano editoriale mensile
    description:
      it: Ogni mese un piano di post e reel per il tuo locale, da approvare.
    agent: planner
    params:
    - name: name
      type: text
      required: true
      label:
        it: Nome del locale
    - name: city
      type: text
      required: true
      label:
        it: Città
    - name: cuisine
      type: text
      required: true
      label:
        it: Tipo di cucina
    - name: audience
      type: text
      required: true
      label:
        it: Pubblico
    - name: tone
      type: select
      required: true
      label:
        it: Tono di voce
      options:
      - value: caldo
        label:
          it: Caldo e familiare
      - value: elegante
        label:
          it: Elegante
      - value: giovane
        label:
          it: Giovane e ironico
      - value: artigianale
        label:
          it: Autentico e artigianale
    - name: channels
      type: multiselect
      required: true
      label:
        it: Canali social
      options:
      - value: instagram
        label: Instagram
      - value: tiktok
        label: TikTok
      - value: facebook
        label: Facebook
    goal: 'Prepara il piano editoriale del prossimo mese per "{instance}": {name}, {city}. Cucina: {cuisine}. Pubblico: {audience}.
      Tono: {tone}. Canali: {channels}. Oggi è {date}. Scrivi in italiano.'
    schedule:
      cron: 0 6 25 * *
      userCanChange: true
    maxPerUser: 3
    cost:
      perRun: 15
  views:
  - key: home
    type: page
    nav: false
    title: PalatoSocial
    sections:
    - type: hero
      eyebrow:
        it: Per ristoranti e locali
      title:
        it: La tua presenza **social**, senza pensieri.
      text:
        it: Un agente AI legge i dati pubblici del tuo locale, ne ricava punti di forza e criticità e ogni mese ti propone
          un piano editoriale con idee di post e reel, testi, hashtag e date. Tu approvi.
      actions:
      - label:
          it: Inizia ora
        href: /login
        style: primary
      - label:
          it: Come funziona
        href: '#come-funziona'
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
      items:
      - title:
          it: Racconta il tuo locale
        text:
          it: Cucina, pubblico, tono di voce e canali social che usi.
        badge: 🍝
      - title:
          it: Analisi da Google Places
        text:
          it: Orari, valutazione e recensioni recenti diventano punti di forza e criticità.
        badge: ⭐
      - title:
          it: Piano mensile
        text:
          it: 'Post e reel con testi, hashtag e date: approvi o chiedi modifiche.'
        badge: 📅
    - type: cards
      id: prezzi
      title:
        it: Prezzi
      items:
      - title:
          it: Abbonamento mensile
        text:
          it: Piano editoriale ogni mese e crediti per le analisi. Annullabile quando vuoi.
    - type: note
      content:
        it: Dati pubblici da Google Places API, usati secondo i termini di Google Maps Platform. Supporto alla comunicazione,
          nessuna garanzia di risultati.
  - key: new_analysis
    type: new_run
    title:
      it: Analizza il locale
    roles:
    - user
    - admin
  - key: analyses
    type: history
    title:
      it: Le mie analisi
    source: run
    roles:
    - user
    - admin
  - key: analysis
    type: report
    source: run
    printable: true
    nav: false
  - key: plans
    type: instances
    template: social_plan
    title:
      it: Piano editoriale
    roles:
    - user
    - admin
  - key: plan_archive
    type: list
    title:
      it: Piani passati
    source: collection:monthly_plans
    roles:
    - user
    - admin
  - key: to_approve
    type: approvals
    title:
      it: Da approvare
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
    roles:
    - user
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 30
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:analyst:
        estimate: 10
        metered: true
    packs:
    - key: extra
      credits: 500
      price: 6
      label: Crediti extra
    plans:
    - key: mensile
      price: 39
      interval: month
      label:
        it: PalatoSocial mensile
      credits: 800
      creditsReset: monthly
      roles:
      - user
  extensions:
  - key: video_upload_edit
    description: 'Non disponibili: caricamento video dall''app mobile e montaggio automatico con sottotitoli e musica (nessun
      campo file). Per ora il piano indica cosa riprendere; i video si gestiscono fuori dall''app.'
  - key: social_publishing
    description: 'Non disponibile: pubblicazione automatica su Instagram, TikTok e Facebook, che richiede il collegamento
      degli account di ogni cliente. Per ora i contenuti approvati si pubblicano a mano.'
  - key: monthly_metrics_report
    description: 'Non disponibile: report di fine mese con copertura e interazioni, che richiede le statistiche degli account
      social collegati; anche la notifica del report via email manca.'
  - key: agency_multi_client
    description: 'Il ruolo agenzia partner (su invito) esiste, ma vedere i contenuti di tutti i propri clienti non è esprimibile
      con le collezioni attuali senza esporre dati tra clienti: serve una funzione dedicata.'
  - key: places_api_key
    description: Google Places richiede una chiave API, che non può stare nel manifest. Va configurata dal proprietario come
      credenziale lato piattaforma prima della pubblicazione.
  - key: edit_plan_items
    description: L'approvazione è sull'intero piano; la modifica del singolo contenuto non è ancora disponibile (si chiede
      una nuova versione all'agente).
