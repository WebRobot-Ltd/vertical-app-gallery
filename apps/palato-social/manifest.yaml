apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: palatosocial
  displayName: PalatoSocial
  tagline:
    it: Il piano editoriale social del tuo locale, pronto ogni mese.
  description:
    it: PalatoSocial analizza la presenza online del tuo locale con i dati ufficiali di Google Places e prepara ogni mese
      un piano editoriale di post e reel che approvi o modifichi.
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#7a1f2b'
      accent: '#e07a1f'
      background: '#fbf6f0'
      foreground: '#2a1c1c'
    fonts:
      body: Inter
      display: Playfair Display
    wordmark:
    - text: Palato
      color: primary
    - text: Social
      color: accent
  header:
    links:
    - label:
        it: Come funziona
      href: '#come-funziona'
    - label:
        it: Prezzi
      href: '#prezzi'
    cta:
      label:
        it: Accedi
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: agency
      label:
        it: Agenzia partner
      assignedBy: invite
    - key: user
      label:
        it: Locale
      assignedBy: signup
  limits:
  - action: agent:planner
    per: user
    max: 4
    window: month
    roles:
    - user
  agents:
  - key: planner
    role: main
    description: Legge i dati pubblici del locale da Google Places, ne ricava punti di forza e criticità e prepara il piano
      editoriale del mese.
    profile:
      inline:
        display_name: PalatoSocial – social media manager
        crews:
        - id: planner
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 14
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un social media manager esperto di ristorazione italiana. Ricevi il profilo del locale (nome,
            città, cucina, pubblico, tono di voce, canali, eventuale Place ID Google). Procedura: 1) se manca il Place ID,
            usa places_search con body {"textQuery":"<nome> <città>","maxResultCount":1}; poi places_details con path /<placeId>
            per leggere orari, valutazione media e recensioni recenti (i campi richiesti sono già impostati). 2) Ricava punti
            di forza e criticità SOLO da dati e recensioni realmente letti; non inventare cifre o recensioni. Se la lettura
            fallisce dillo chiaramente. 3) Scrivi il piano del mese: 8-12 contenuti tra post e reel, adatti ai canali indicati,
            nel tono di voce richiesto, ciascuno con data di pubblicazione, canale, formato, idea, testo completo, hashtag
            e suggerimento di ripresa video (cosa girare in sala o in cucina). 4) Salva ogni contenuto con lo strumento save_post
            (status ''proposto''). 5) Chiama request_approve_plan per far confermare il piano al ristoratore. Struttura del
            report: un titolo di primo livello ''# Piano editoriale <mese> — <locale>'', poi ## Punti di forza, ## Criticità,
            ## Calendario (tabella con data, canale, formato, idea), ## Contenuti (dettaglio), ## Prossimi passi. Non promettere
            risultati di crescita. Rispondi in italiano.'
          mcp_servers: []
    goalTemplate: 'Prepara il piano editoriale per {month_label}.

      Profilo del locale (JSON): {venue}

      {?focus}Priorità del ristoratore: {focus}{/focus}

      Oggi è {date}. Scrivi in italiano.'
    context:
    - key: venue
      from: collection:venues
    appTools:
    - name: places_search
      description: 'Cerca un locale su Google Places (Text Search). Body JSON: {"textQuery":"...","maxResultCount":1}'
      action: http
      http:
        method: POST
        url: https://places.googleapis.com/v1/places:searchText
        headers:
          X-Goog-FieldMask: places.id,places.displayName,places.formattedAddress
        attribution: Google Places API
        credential:
          provider: google_places
          header: X-Goog-Api-Key
          format: '{secret}'
    - name: places_details
      description: 'Dettagli di un locale: orari, valutazione, recensioni recenti. Path: /<placeId>'
      action: http
      http:
        method: GET
        url: https://places.googleapis.com/v1/places
        allowPath: true
        headers:
          X-Goog-FieldMask: id,displayName,rating,userRatingCount,regularOpeningHours,reviews,websiteUri
        attribution: Google Places API
        credential:
          provider: google_places
          header: X-Goog-Api-Key
          format: '{secret}'
    - name: save_post
      description: Salva un contenuto proposto del piano (post o reel) tra i contenuti del locale
      action: append
      collection: posts
      scope: user
    awaits:
    - approve_plan
    output: markdown
    limits:
      maxTurns: 14
      maxBudgetUsd: 0.8
      timeoutSeconds: 600
  approvals:
  - key: approve_plan
    title:
      it: Approva il piano editoriale
    decidedBy: requester
    fields:
    - month
    timeoutMinutes: 10080
  inputForm:
    title:
      it: Nuovo piano editoriale
    fields:
    - name: month
      type: select
      required: true
      label:
        it: Mese
      options:
      - value: 2026-12
        label: Dicembre 2026
      - value: 2027-01
        label: Gennaio 2027
      - value: 2027-02
        label: Febbraio 2027
    - name: focus
      type: textarea
      maxLength: 500
      label:
        it: Priorità (facoltativo)
      help:
        it: Es. promuovere il menu di Natale, più reel dalla cucina
  data:
    collections:
    - name: venues
      description: Profilo del locale
      ownedBy: user
      access:
      - role: agency
        can:
        - read
        - write
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome del locale
      - name: city
        type: city
        required: true
        label:
          it: Città
      - name: place_id
        type: text
        label:
          it: Google Place ID (facoltativo)
      - name: cuisine
        type: text
        required: true
        label:
          it: Tipo di cucina
      - name: audience
        type: text
        label:
          it: Pubblico
      - name: tone
        type: select
        label:
          it: Tono di voce
        options:
        - value: familiare
          label: Familiare
        - value: elegante
          label: Elegante
        - value: giocoso
          label: Giocoso
        - value: professionale
          label: Professionale
      - name: channels
        type: multiselect
        label:
          it: Canali social
        options:
        - value: instagram
          label: Instagram
        - value: tiktok
          label: TikTok
        - value: facebook
          label: Facebook
    - name: posts
      description: Contenuti del piano editoriale
      ownedBy: user
      access:
      - role: agency
        can:
        - read
        - write
      retentionDays: 730
      fields:
      - name: date
        type: date
        label:
          it: Data di pubblicazione
      - name: channel
        type: select
        label:
          it: Canale
        options:
        - value: instagram
          label: Instagram
        - value: tiktok
          label: TikTok
        - value: facebook
          label: Facebook
      - name: format
        type: select
        label:
          it: Formato
        options:
        - value: post
          label: Post
        - value: reel
          label: Reel
      - name: idea
        type: text
        label:
          it: Idea
      - name: text
        type: textarea
        label:
          it: Testo
      - name: hashtags
        type: text
        label:
          it: Hashtag
      - name: shot_tip
        type: textarea
        label:
          it: Cosa girare
      - name: status
        type: select
        label:
          it: Stato
        default: proposto
        options:
        - value: proposto
          label: Proposto
        - value: approvato
          label: Approvato
        - value: scartato
          label: Scartato
    credentials:
    - provider: google_places
      kind: api_key
      scope: org
      label:
        it: Google Places API
      help:
        it: Chiave API Google Cloud con Places API (New) attiva, impostata dall'amministratore dell'app.
  egress:
    hosts:
    - places.googleapis.com
    notes: Google Places API (New), uso con licenza Google e chiave API del titolare dell'app; rispettare i Termini di servizio
      Google Maps Platform.
  views:
  - key: home
    type: page
    nav: false
    title: PalatoSocial
    sections:
    - type: hero
      layout: stack
      band: true
      eyebrow:
        it: Per ristoranti e locali
      title:
        it: Il tuo locale sui social, **senza pensieri**
      text:
        it: Un agente AI legge i dati pubblici del tuo locale su Google, ne ricava punti di forza e criticità e prepara ogni
          mese un piano editoriale di post e reel con testi, hashtag e date. Tu approvi o modifichi.
      actions:
      - label:
          it: Inizia ora
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
      items:
      - title:
          it: 1 · Registra il locale
        text:
          it: Cucina, pubblico, tono di voce e canali che usi.
      - title:
          it: 2 · Analisi e piano
        text:
          it: Orari, valutazione e recensioni recenti da Google Places, poi il piano del mese.
      - title:
          it: 3 · Approva e modifica
        text:
          it: 'Ogni contenuto è tuo: lo approvi, lo cambi o lo scarti.'
    - type: cards
      id: prezzi
      title:
        it: Abbonamento mensile
      items:
      - title: Locale
        text:
          it: '49 € al mese: piani mensili, contenuti e i tuoi dati riservati.'
        badge: 💳
    - type: note
      content:
        it: I dati di Google provengono dalle API ufficiali Google Places. Montaggio video automatico, pubblicazione automatica
          e report di copertura arriveranno quando saranno disponibili i collegamenti agli account social.
  - key: venue
    type: form
    title:
      it: Il mio locale
    collection: venues
    submit:
      label:
        it: Salva
      message:
        it: Profilo salvato
      redirect: new_plan
    roles:
    - user
    - admin
  - key: new_plan
    type: new_run
    title:
      it: Nuovo piano
    roles:
    - user
    - admin
  - key: plans
    type: history
    title:
      it: I miei piani
    source: run
    roles:
    - user
    - admin
  - key: plan
    type: report
    source: run
    printable: true
    nav: false
  - key: posts_list
    type: table
    title:
      it: Contenuti
    source: collection:posts
    columns:
    - date
    - channel
    - format
    - idea
    - status
    export: true
    roles:
    - user
    - agency
    - admin
  - key: post_edit
    type: form
    title:
      it: Modifica contenuto
    collection: posts
    edit: true
    nav: false
    submit:
      label:
        it: Salva
      message:
        it: Contenuto aggiornato
      redirect: posts_list
    roles:
    - user
    - agency
    - admin
  - key: approvals_view
    type: approvals
    title:
      it: Approvazioni
    approvals:
    - approve_plan
    roles:
    - user
    - admin
  - key: clients
    type: table
    title:
      it: Clienti
    source: collection:venues
    columns:
    - name
    - city
    - cuisine
    - tone
    roles:
    - agency
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
    roles:
    - user
  notifications:
    emailOnRunDone: true
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: locale
      price: 49
      interval: month
      label:
        it: Locale
      includes:
      - Piano editoriale mensile
      - Analisi Google Places
      - Approvazione e modifica dei contenuti
      roles:
      - user
  extensions:
  - key: video_editing
    description: 'Montaggio automatico dei video caricati dall''app mobile con sottotitoli e musica: non disponibile (caricamento
      video e editing non supportati).'
  - key: social_publishing
    description: 'Pubblicazione automatica su Instagram, TikTok e Facebook collegando gli account: non disponibile (richiede
      OAuth con i servizi Meta e TikTok).'
  - key: monthly_metrics_report
    description: 'Report di fine mese con copertura e interazioni: richiede le API social collegate via OAuth, non ancora
      disponibili.'
  - key: mobile_upload
    description: 'App mobile per caricare i video girati in sala o in cucina: non disponibile finché non è supportato il caricamento
      video.'
