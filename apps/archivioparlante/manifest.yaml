apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: archivio-parlante
  displayName: ArchivioParlante
  tagline:
    it: Interroga i tuoi documenti come se parlassero.
    en: Ask your documents questions, in plain language.
  description:
    it: 'Carica contratti, fatture, polizze e verbali: un agente li classifica, estrae i campi chiave con un livello di confidenza,
      un revisore conferma i dubbi e un assistente risponde citando documento e pagina.'
    en: 'Upload contracts, invoices, policies and minutes: an agent classifies them and extracts key fields with a confidence
      level, a reviewer confirms doubtful ones and an assistant answers citing document and page.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#1f3a5f'
      accent: '#d98324'
      background: '#f7f8fa'
      foreground: '#18222e'
    fonts:
      body: Inter
      display: Source Serif 4
    wordmark:
    - text: Archivio
      color: primary
    - text: Parlante
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label:
        it: Admin organizzazione
        en: Organization admin
      assignedBy: admin_emails
    - key: operator
      label:
        it: Operatore
        en: Operator
      assignedBy: invite
    - key: reviewer
      label:
        it: Revisore
        en: Reviewer
      assignedBy: invite
    - key: reader
      label:
        it: Consultatore
        en: Read-only reader
      assignedBy: invite
  limits:
  - action: chat
    per: user
    max: 100
    window: day
  agents:
  - key: extractor
    role: main
    description: Classifies each uploaded document and extracts the key fields with a confidence level.
    profile:
      inline:
        display_name: ArchivioParlante extractor
        crews:
        - id: extractor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are a document analyst for administrative offices and professional firms. You receive one uploaded
            document (PDF, scan or Office file). Open it with the read_upload tool using the file id (it reads text and does
            OCR on scans). Confirm or correct the document type given by the operator (contract, invoice, policy, minutes,
            other). Extract the fields of the schema for that type:

            - contract: parties, subject, duration, start_date, end_date, amount, withdrawal_clause, penalty_amount, deadlines

            - invoice: supplier, customer, invoice_number, issue_date, due_date, net_amount, vat, total_amount

            - policy: insurer, policyholder, policy_number, coverage, premium, start_date, expiry_date, renewal_terms

            - minutes: date, participants, decisions, assigned_actions, action_deadlines

            - other: the 5 most relevant fields.

            For EACH field call save_field once with: document_title, doc_type, client, field_name, value (as written, dates
            as YYYY-MM-DD, amounts as plain numbers in amount), amount (number if monetary), due_date (YYYY-MM-DD if the field
            is a deadline or expiry, else empty), page (page number where found), confidence (0 to 1), status (''to_review''
            if confidence < 0.8 or the text is illegible or ambiguous, else ''auto''), members (the list of colleague emails
            given in the task, copied exactly). Never invent values: if a field is absent, skip it or save it with an empty
            value and confidence 0. At the end call update_document to set the document status to ''processed'' (or ''failed''),
            and write a short report starting with a level-1 title ''# Analisi <document title>'' listing the fields found
            and those needing review.'
    goalTemplate: Analyze this document.
    appTools:
    - name: read_upload
      description: Read an uploaded file (text and OCR)
      action: read_file
    - name: save_field
      description: Save one extracted field of a document
      action: append
      collection: extractions
      scope: user
    - name: update_document
      description: Update the processing status of the document
      action: write
      collection: documents
      scope: user
    output: markdown
    limits:
      maxTurns: 30
      maxBudgetUsd: 1.0
  - key: assistant
    role: helper
    description: Answers questions on the extracted data, always citing document and page.
    profile:
      inline:
        display_name: ArchivioParlante assistant
        crews:
        - id: assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You answer questions about the user''s organization documents using ONLY the extracted data you
            obtain with search_extractions (fields: document_title, doc_type, client, field_name, value, amount, due_date,
            page, confidence, status). Filter by dates, amounts, clients and types as the question requires, running several
            searches if needed. Every statement must cite the source as [document title, p. N]. If a field has status to_review
            or confidence below 0.8, say it is not yet confirmed. If data is missing, say so; never invent figures or dates.
            Answer in the user''s language, concisely, with a small table when listing several documents.'
    goalTemplate: 'Conversation so far:

      {history}


      New question from {user}: {message}

      Today is {date}. Reply in the language with ISO code {lang}.'
    appTools:
    - name: search_extractions
      description: Search the extracted fields the user may read
      action: search
      collection: extractions
      scope: all
    output: markdown
  - key: digest
    role: scheduled
    description: Weekly summary of the deadlines of the month for one user.
    memory: none
    profile:
      inline:
        display_name: ArchivioParlante deadlines
        crews:
        - id: digest
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You prepare the weekly deadline email. Use search_extractions to find the fields with a due_date
            within the current calendar month (and overdue ones not yet handled). Start with ''# Scadenze del mese'' (or ''#
            Deadlines of the month'' if the language is English). List them in date order in a table: date, document, client,
            field, amount, page. Mark unconfirmed ones. Under 300 words; never invent data. If there are none, say so in one
            line.'
    appTools:
    - name: search_extractions_digest
      description: Search the extracted fields the user may read
      action: search
      collection: extractions
      scope: all
    output: markdown
  templates:
  - key: deadline_digest
    title:
      it: Email scadenze del lunedì
      en: Monday deadlines email
    description:
      it: Ogni lunedì ricevi le scadenze del mese.
      en: Every Monday you get the deadlines of the month.
    agent: digest
    params:
    - name: scope_note
      type: text
      label:
        it: Nome (es. Scadenze studio)
        en: Name (e.g. Firm deadlines)
    goal: Prepare the deadlines of the month for "{instance}". Today is {date}. Write in the language with ISO code {lang}.
    schedule:
      cron: 0 7 * * 1
      userCanChange: false
    maxPerUser: 1
    deliver:
      to: owner
      subject:
        it: Scadenze del mese
        en: Deadlines of the month
  triggers:
  - key: process_document
    description: Start the extraction when a document is uploaded
    'on':
      collection: documents
      op: insert
      where:
        status: uploaded
    start:
      agent: extractor
    goal: 'Analyze the uploaded document. Title: {record.title}. Type declared by the operator: {record.doc_type}. Client:
      {record.client}. Reference date: {record.ref_date}. File id(s): {record.file}. Colleague emails to copy into members:
      {record.members}. Write the report in the language with ISO code {lang}.'
    asUser: true
  data:
    collections:
    - name: documents
      ownedBy: user
      description: Uploaded documents of the organization
      retentionDays: 3650
      fields:
      - name: title
        type: text
        required: true
        label:
          it: Titolo
          en: Title
      - name: doc_type
        type: select
        required: true
        label:
          it: Tipo di documento
          en: Document type
        options:
        - value: contract
          label:
            it: Contratto
            en: Contract
        - value: invoice
          label:
            it: Fattura
            en: Invoice
        - value: policy
          label:
            it: Polizza
            en: Policy
        - value: minutes
          label:
            it: Verbale
            en: Minutes
        - value: other
          label:
            it: Altro
            en: Other
      - name: client
        type: text
        required: true
        label:
          it: Cliente
          en: Client
      - name: ref_date
        type: date
        label:
          it: Data di riferimento
          en: Reference date
      - name: file
        type: file
        required: true
        accept:
        - pdf
        - docx
        - xlsx
        - jpg
        - jpeg
        - png
        maxMb: 15
        multiple: false
        label:
          it: File (PDF, scansione, Office)
          en: File (PDF, scan, Office)
      - name: pages
        type: number
        label:
          it: Numero di pagine
          en: Number of pages
      - name: members
        type: array
        label:
          it: Email dei colleghi dell'organizzazione
          en: Organization colleagues' emails
        help:
          it: Chi nella tua organizzazione può vedere il documento
          en: Who in your organization can see the document
      - name: status
        type: select
        options:
        - uploaded
        - processed
        - failed
        default: uploaded
        label:
          it: Stato
          en: Status
      access:
      - role: operator
        where:
          members: '{user.email}'
        can:
        - read
        - write
      - role: reviewer
        where:
          members: '{user.email}'
        can:
        - read
      - role: reader
        where:
          members: '{user.email}'
        can:
        - read
    - name: extractions
      ownedBy: user
      description: Fields extracted from documents, one row per field, with confidence
      retentionDays: 3650
      fields:
      - name: document_title
        type: text
        label:
          it: Documento
          en: Document
      - name: doc_type
        type: text
        label:
          it: Tipo
          en: Type
      - name: client
        type: text
        label:
          it: Cliente
          en: Client
      - name: field_name
        type: text
        label:
          it: Campo
          en: Field
      - name: value
        type: textarea
        label:
          it: Valore
          en: Value
      - name: amount
        type: number
        label:
          it: Importo
          en: Amount
      - name: due_date
        type: date
        label:
          it: Scadenza
          en: Due date
      - name: page
        type: number
        label:
          it: Pagina
          en: Page
      - name: confidence
        type: number
        label:
          it: Confidenza
          en: Confidence
      - name: status
        type: select
        options:
        - value: auto
          label:
            it: Automatico
            en: Automatic
        - value: to_review
          label:
            it: Da rivedere
            en: To review
        - value: confirmed
          label:
            it: Confermato
            en: Confirmed
        label:
          it: Stato
          en: Status
      - name: members
        type: array
        label:
          it: Colleghi
          en: Colleagues
      access:
      - role: operator
        where:
          members: '{user.email}'
        can:
        - read
      - role: reviewer
        where:
          members: '{user.email}'
        can:
        - read
        - write
      - role: reader
        where:
          members: '{user.email}'
        can:
        - read
  views:
  - key: home
    type: page
    nav: false
    title: ArchivioParlante
    sections:
    - type: hero
      title:
        it: I tuoi documenti, **finalmente interrogabili**.
        en: Your documents, **finally searchable by question**.
      text:
        it: Carica contratti, fatture, polizze e verbali. Un agente estrae i dati chiave, un revisore conferma i dubbi e una
          chat risponde citando documento e pagina.
        en: Upload contracts, invoices, policies and minutes. An agent extracts the key data, a reviewer confirms doubtful
          fields and a chat answers citing document and page.
      actions:
      - label:
          it: Accedi e inizia
          en: Sign in to start
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Carica
          en: Upload
        text:
          it: PDF, scansioni (con OCR) e file Office in una pratica, con tipo, cliente e data.
          en: PDFs, scans (with OCR) and Office files in a case, with type, client and date.
        badge: 📄
      - title:
          it: Estrai e rivedi
          en: Extract and review
        text:
          it: I campi incerti vengono segnalati e confermati da un revisore.
          en: Uncertain fields are flagged and confirmed by a reviewer.
        badge: ✅
      - title:
          it: Chiedi
          en: Ask
        text:
          it: «Quali contratti scadono entro marzo con penale sopra 10.000 euro?» Risposta con fonti.
          en: '"Which contracts expire by March with a penalty above 10,000 euro?" Answers with sources.'
        badge: 💬
    - type: note
      content:
        it: 'Ogni organizzazione vede solo i propri documenti. Le estrazioni automatiche possono contenere errori: verificare
          i campi prima di usarli a fini legali o fiscali.'
        en: 'Each organization sees only its own documents. Automatic extractions may contain errors: verify fields before
          legal or tax use.'
  - key: upload
    type: form
    title:
      it: Carica documento
      en: Upload document
    collection: documents
    fields:
    - title
    - doc_type
    - client
    - ref_date
    - file
    - pages
    - members
    submit:
      label:
        it: Carica e analizza
        en: Upload and analyze
      message:
        it: 'Documento caricato: l''analisi è in corso.'
        en: 'Document uploaded: analysis is running.'
      redirect: documents
    roles:
    - operator
    - admin
  - key: documents
    type: table
    title:
      it: Documenti
      en: Documents
    source: collection:documents
    columns:
    - title
    - doc_type
    - client
    - ref_date
    - pages
    - status
    export: true
    roles:
    - operator
    - reviewer
    - reader
    - admin
  - key: data
    type: table
    title:
      it: Dati estratti
      en: Extracted data
    source: collection:extractions
    columns:
    - document_title
    - doc_type
    - client
    - field_name
    - value
    - amount
    - due_date
    - page
    - confidence
    - status
    export: true
    roles:
    - operator
    - reviewer
    - reader
    - admin
  - key: review_list
    type: table
    title:
      it: Da rivedere
      en: To review
    source: collection:extractions
    query: status = to_review
    columns:
    - document_title
    - field_name
    - value
    - page
    - confidence
    roles:
    - reviewer
    - admin
  - key: review
    type: form
    title:
      it: Conferma o correggi
      en: Confirm or correct
    collection: extractions
    fields:
    - value
    - amount
    - due_date
    - status
    edit: true
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Campo aggiornato.
        en: Field updated.
      redirect: review_list
    roles:
    - reviewer
    - admin
    nav: false
  - key: chat
    type: chat
    title:
      it: Chiedi ai documenti
      en: Ask your documents
    source: agent:assistant
    examples:
    - it: Quali contratti scadono entro marzo con penale sopra 10.000 euro?
      en: Which contracts expire by March with a penalty above 10,000 euro?
    - it: Quali polizze del cliente Rossi scadono quest'anno?
      en: Which of client Rossi's policies expire this year?
    - it: Elenca le fatture non ancora scadute sopra 5.000 euro
      en: List unexpired invoices above 5,000 euro
    placeholder:
      it: Fai una domanda sui tuoi documenti…
      en: Ask a question about your documents…
    roles:
    - operator
    - reviewer
    - reader
    - admin
  - key: deadlines
    type: instances
    template: deadline_digest
    title:
      it: Email scadenze
      en: Deadline emails
    roles:
    - operator
    - reviewer
    - reader
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - admin
  - key: admin_data
    type: admin
    title:
      it: Amministrazione
      en: Administration
    roles:
    - admin
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 30
    metering:
      creditEur: 0.05
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:extractor:
        estimate: 10
        metered: true
      chat: 1
    packs:
    - key: pages_500
      credits: 500
      price: 25
      label:
        it: 500 pagine
        en: 500 pages
    plans:
    - key: studio
      price: 49
      interval: month
      credits: 1000
      creditsReset: monthly
      label:
        it: Studio — 1.000 pagine/mese
        en: Studio — 1,000 pages/month
      roles:
      - admin
    - key: business
      price: 149
      interval: month
      credits: 5000
      creditsReset: monthly
      label:
        it: Business — 5.000 pagine/mese
        en: Business — 5,000 pages/month
      roles:
      - admin
  extensions:
  - key: org_isolation
    description: Organizations are separated by the members list (emails) on each document; there is no native per-organization
      tenant, so operators must list colleagues' emails. Roles are app-wide invites.
  - key: page_count
    description: Pages are declared by the operator in the form; automatic page counting of uploads is not available. Extraction
      is billed by metered usage (tokens and compute), which follows the pages processed.
