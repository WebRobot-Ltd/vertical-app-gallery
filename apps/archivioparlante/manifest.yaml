apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: archivioparlante
  displayName: ArchivioParlante
  tagline:
    it: Interroga i tuoi documenti come se parlassero.
    en: Ask your documents questions, in plain words.
  description:
    it: Classificazione ed estrazione dei campi chiave da contratti, fatture, polizze e verbali, revisione umana dei dati
      incerti e un assistente in chat che cita sempre documento e pagina.
    en: Classification and key-field extraction from contracts, invoices, policies and minutes, human review of uncertain
      data, and a chat assistant that always cites document and page.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#1f3a5f'
      accent: '#d98e04'
      background: '#f7f8fa'
      foreground: '#1a2230'
    fonts:
      body: Inter
      display: Source Serif 4
    wordmark:
    - text: Archivio
      color: primary
    - text: Parlante
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Ruoli
        en: Roles
      href: '#ruoli'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label:
        it: Admin organizzazione
        en: Organization admin
      assignedBy: admin_emails
    - key: operator
      label:
        it: Operatore
        en: Operator
      assignedBy: invite
    - key: reviewer
      label:
        it: Revisore
        en: Reviewer
      assignedBy: invite
    - key: viewer
      label:
        it: Consultatore
        en: Read-only viewer
      assignedBy: invite
  limits:
  - action: agent:extractor
    per: user
    max: 50
    window: day
  - action: chat
    per: user
    max: 100
    window: day
  agents:
  - key: extractor
    role: main
    description: Classifies a document, extracts key fields by type and saves them with a confidence level.
    profile:
      inline:
        display_name: ArchivioParlante extractor
        crews:
        - id: extractor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 20
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'Sei un analista documentale per uffici amministrativi e studi professionali. Ricevi il testo di
            un documento (incollato, oppure da un link che leggi con il MCP webrobot) con tipo, cliente e data di riferimento.
            Passi: 1) conferma o correggi il tipo (contratto, fattura, polizza, verbale, altro); 2) estrai i campi secondo
            lo schema del tipo. Contratto: parti, oggetto, data_inizio, durata, scadenza, importo, penale, clausole_recesso.
            Fattura: fornitore, cliente, numero, data, imponibile, iva, totale, scadenza_pagamento. Polizza: compagnia, contraente,
            massimali, premio, decorrenza, scadenza, franchigie. Verbale: organo, data, presenti, delibere, scadenze. 3) per
            ogni campo indica valore, pagina di origine e confidenza da 0 a 1; sotto 0.8 il campo è incerto. Salva il documento
            nella collezione documents e ogni campo in extracted_fields con i tool di scrittura (status ''confirmed'' se confidenza
            >= 0.8, altrimenti ''to_review''); per i campi incerti chiama request_field_review. Non inventare mai valori:
            se manca, lascia vuoto con confidenza 0. Se il testo sembra una scansione con errori OCR, abbassa la confidenza
            dei campi dubbi. Rispondi con un report Markdown che inizia con ''# <tipo> — <cliente>'', poi ## Campi estratti
            (tabella con campo, valore, pagina, confidenza) e ## Da rivedere.'
    goalTemplate: 'Pratica: {practice}

      Tipo dichiarato: {doc_type_label}

      Cliente: {client}

      Data di riferimento: {ref_date}

      {?source_url}Link al documento: {source_url}{/source_url}

      {?text}Testo del documento (con indicazione delle pagine):

      {text}{/text}

      Scrivi il report in lingua ISO {lang}. Oggi è {date}.'
    appTools:
    - name: save_document
      description: Save the classified document
      action: write
      collection: documents
      scope: user
    - name: save_field
      description: Save one extracted field with confidence and page
      action: write
      collection: extracted_fields
      scope: user
    awaits:
    - field_review
    output: markdown
    limits:
      maxTurns: 20
      maxBudgetUsd: 1.0
  - key: assistant
    role: helper
    description: Answers questions over the extracted data, always citing document and page.
    profile:
      inline:
        display_name: ArchivioParlante assistant
        crews:
        - id: assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Rispondi a domande in linguaggio naturale sui documenti dell''utente usando SOLO i tool di ricerca
            sulle collezioni documents ed extracted_fields. Cita sempre per ogni affermazione documento e pagina nel formato
            [nome documento, p. N]. Segnala i campi ancora ''to_review'' come non confermati. Per domande su scadenze e importi
            filtra con precisione e mostra una tabella. Se non trovi nulla, dillo: non inventare. Rispondi nella lingua dell''utente.'
    goalTemplate: 'Conversazione finora:

      {history}


      Nuovo messaggio: {message}

      Oggi è {date}. Lingua: {lang}.'
    appTools:
    - name: search_fields
      description: Search extracted fields
      action: search
      collection: extracted_fields
      scope: user
    - name: search_documents
      description: Search documents
      action: search
      collection: documents
      scope: user
    output: markdown
  - key: deadline_watcher
    role: scheduled
    description: Every Monday lists the deadlines of the month for one user's archive.
    memory: instance
    writesTo:
      collection: deadline_digests
    profile:
      inline:
        display_name: ArchivioParlante deadlines
        crews:
        - id: deadline_watcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Cerca nei campi estratti dell''utente le scadenze (scadenza, scadenza_pagamento, recesso, decorrenza)
            che cadono nel mese corrente e nei 7 giorni successivi. Inizia con ''# Scadenze — settimana del <data>''. Poi
            ## Questo mese (tabella: data, documento, cliente, tipo scadenza, importo, pagina), ## Urgenti (entro 7 giorni),
            ## Da verificare (campi non confermati). Non inventare date.'
    appTools:
    - name: search_fields
      description: Search extracted fields
      action: search
      collection: extracted_fields
      scope: user
    output: markdown
  templates:
  - key: weekly_deadlines
    title:
      it: Scadenze del mese
      en: Monthly deadlines
    description:
      it: Ogni lunedì un riepilogo delle scadenze del mese, consultabile nell'app.
      en: Every Monday a summary of the month's deadlines, readable in the app.
    agent: deadline_watcher
    params:
    - name: scope_note
      type: text
      label:
        it: Cliente (facoltativo)
        en: Client (optional)
    goal: 'Riepilogo scadenze "{instance}". {?scope_note}Solo cliente: {scope_note}.{/scope_note} Oggi è {date}. Lingua ISO
      {lang}.'
    schedule:
      cron: 0 7 * * 1
      userCanChange: true
    maxPerUser: 2
    roles:
    - admin
    - operator
    - reviewer
    - viewer
    cost:
      perRun: 5
  approvals:
  - key: field_review
    title:
      it: Revisione campi incerti
      en: Review of uncertain fields
    description: A reviewer confirms or corrects fields extracted with low confidence
    role: reviewer
    fields:
    - document
    - field
    - value
    - page
    - confidence
    timeoutMinutes: 10080
    onTimeout: reject
  inputForm:
    title:
      it: Carica documento
      en: Add document
    fields:
    - name: practice
      type: text
      required: true
      label:
        it: Pratica
        en: Case file
    - name: doc_type
      type: select
      required: true
      label:
        it: Tipo di documento
        en: Document type
      options:
      - value: contract
        label:
          it: Contratto
          en: Contract
      - value: invoice
        label:
          it: Fattura
          en: Invoice
      - value: policy
        label:
          it: Polizza
          en: Policy
      - value: minutes
        label:
          it: Verbale
          en: Minutes
      - value: other
        label:
          it: Altro
          en: Other
    - name: client
      type: text
      required: true
      label:
        it: Cliente
        en: Client
    - name: ref_date
      type: date
      required: true
      label:
        it: Data di riferimento
        en: Reference date
    - name: source_url
      type: url
      label:
        it: Link al documento
        en: Link to the document
      help:
        it: 'Il caricamento diretto di file non è ancora disponibile: usa un link o incolla il testo.'
        en: 'Direct file upload is not available yet: use a link or paste the text.'
    - name: text
      type: textarea
      maxLength: 60000
      label:
        it: Testo del documento (con indicazione delle pagine)
        en: Document text (with page markers)
  data:
    collections:
    - name: documents
      ownedBy: user
      searchable: true
      description: Uploaded documents with classification
      fields:
      - name: name
        type: text
      - name: practice
        type: text
      - name: client
        type: text
      - name: doc_type
        type: text
      - name: ref_date
        type: date
      - name: pages
        type: number
      - name: source_url
        type: url
    - name: extracted_fields
      ownedBy: user
      searchable: true
      description: Key fields extracted per document, with confidence and source page
      fields:
      - name: document
        type: text
      - name: client
        type: text
      - name: doc_type
        type: text
      - name: field
        type: text
      - name: value
        type: text
      - name: date_value
        type: date
      - name: amount
        type: number
      - name: page
        type: number
      - name: confidence
        type: number
      - name: status
        type: select
        options:
        - confirmed
        - to_review
        - corrected
    - name: deadline_digests
      ownedBy: instance
      description: Weekly deadline summaries
  views:
  - key: home
    type: page
    nav: false
    title: ArchivioParlante
    sections:
    - type: hero
      title:
        it: I tuoi documenti, **finalmente interrogabili**.
        en: Your documents, **finally searchable by question**.
      text:
        it: 'Carica contratti, fatture, polizze e verbali: un agente li classifica, estrae i campi chiave, un revisore conferma
          i dati incerti e una chat risponde citando documento e pagina.'
        en: 'Add contracts, invoices, policies and minutes: an agent classifies them and extracts key fields, a reviewer confirms
          uncertain data, and a chat answers citing document and page.'
      actions:
      - label:
          it: Inizia
          en: Get started
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Carica
          en: Add
        text:
          it: Tipo, cliente e data di riferimento della pratica.
          en: Type, client and reference date of the case.
        badge: 📄
      - title:
          it: Estrai e rivedi
          en: Extract and review
        text:
          it: Campi con livello di confidenza; i dubbi vanno al revisore.
          en: Fields with confidence levels; doubts go to the reviewer.
        badge: ✅
      - title:
          it: Chiedi
          en: Ask
        text:
          it: Domande in linguaggio naturale, sempre con fonte e pagina.
          en: Natural-language questions, always with source and page.
        badge: 💬
    - type: cards
      id: ruoli
      title:
        it: Ruoli
        en: Roles
      items:
      - title:
          it: Admin
          en: Admin
        text:
          it: Gestisce organizzazione e abbonamento.
          en: Manages the organization and subscription.
      - title:
          it: Operatore
          en: Operator
        text:
          it: Carica i documenti.
          en: Adds documents.
      - title:
          it: Revisore
          en: Reviewer
        text:
          it: Conferma o corregge i campi incerti.
          en: Confirms or corrects uncertain fields.
      - title:
          it: Consultatore
          en: Viewer
        text:
          it: Consulta in sola lettura.
          en: Read-only access.
    - type: note
      content:
        it: Supporto alla consultazione, non consulenza legale. Verifica sempre i dati critici sul documento originale.
        en: A lookup aid, not legal advice. Always check critical data against the original document.
  - key: new_doc
    type: new_run
    title:
      it: Carica documento
      en: Add document
    roles:
    - admin
    - operator
  - key: runs
    type: history
    title:
      it: Elaborazioni
      en: Processing
    source: run
    roles:
    - admin
    - operator
    - reviewer
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: review
    type: approvals
    title:
      it: Da rivedere
      en: To review
    approvals:
    - field_review
    roles:
    - admin
    - reviewer
  - key: data_table
    type: table
    title:
      it: Dati estratti
      en: Extracted data
    source: collection:extracted_fields
    roles:
    - admin
    - operator
    - reviewer
    - viewer
    data:
      display: table
      fields:
      - key: document
        label:
          it: Documento
          en: Document
      - key: client
        label:
          it: Cliente
          en: Client
      - key: doc_type
        label:
          it: Tipo
          en: Type
        format: badge
      - key: field
        label:
          it: Campo
          en: Field
      - key: value
        label:
          it: Valore
          en: Value
      - key: amount
        label:
          it: Importo
          en: Amount
        format: money
      - key: page
        label:
          it: Pag.
          en: Page
        format: number
      - key: confidence
        label:
          it: Confidenza
          en: Confidence
        format: percent
      - key: status
        label:
          it: Stato
          en: Status
        format: badge
      sort:
        field: document
        dir: asc
      limit: 200
      empty:
        it: Nessun dato ancora.
        en: No data yet.
  - key: chat
    type: chat
    title:
      it: Assistente
      en: Assistant
    source: agent:assistant
    examples:
    - it: Quali contratti scadono entro marzo con penale sopra 10.000 euro?
      en: Which contracts expire by March with a penalty above 10,000 euros?
    - it: Che clausole di recesso ha il cliente Rossi?
      en: What termination clauses does client Rossi have?
    placeholder:
      it: Fai una domanda sui tuoi documenti…
      en: Ask about your documents…
    roles:
    - admin
    - operator
    - reviewer
    - viewer
  - key: watches
    type: instances
    template: weekly_deadlines
    title:
      it: Scadenze del lunedì
      en: Monday deadlines
    roles:
    - admin
    - operator
    - reviewer
    - viewer
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - admin
  exports:
  - path: /api/export/extracted-fields.csv
    source: collection:extracted_fields
    format: csv
    access: user
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 20
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:extractor:
        estimate: 10
        metered: true
      agent:assistant:
        estimate: 3
        metered: true
    packs:
    - key: extra_pages
      credits: 500
      price: 9
      label:
        it: 500 pagine extra
        en: 500 extra pages
    plans:
    - key: studio
      price: 39
      interval: month
      credits: 500
      creditsReset: monthly
      label:
        it: Studio — 500 pagine/mese
        en: Studio — 500 pages/month
      roles:
      - admin
    - key: ufficio
      price: 149
      interval: month
      credits: 3000
      creditsReset: monthly
      label:
        it: Ufficio — 3000 pagine/mese
        en: Office — 3000 pages/month
      roles:
      - admin
  extensions:
  - key: file_upload_ocr
    description: 'Direct upload of PDF, scans and Office files with OCR is not available yet: for now the operator gives a
      link or pastes the text.'
  - key: weekly_email
    description: 'The Monday email with the month''s deadlines is not available (no notifications yet): the digest is produced
      every Monday and read in the app under Monday deadlines.'
  - key: org_sharing
    description: Records are owned per user; sharing one archive among all users of the same organization (admin, operator,
      reviewer, viewer) needs an organization-level scope that is not available yet. Role-based read-only enforcement is by
      view.
