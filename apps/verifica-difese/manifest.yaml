apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: verificadifese
  displayName: VerificaDifese
  tagline:
    it: Controlla le tue applicazioni web prima che lo faccia qualcun altro.
    en: Check your web applications before someone else does.
  description:
    it: Valutazioni di sicurezza non distruttive su applicazioni di tua proprietà, con dominio verificato e autorizzazione
      scritta. Ogni report è rivisto da un consulente prima di arrivare a te.
    en: Non-destructive security assessments of applications you own, with a verified domain and written authorisation. Every
      report is reviewed by a consultant before it reaches you.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#10243e'
      accent: '#0f8b6d'
      background: '#f6f8fa'
      foreground: '#14202e'
    fonts:
      body: Inter
      display: IBM Plex Sans
    wordmark:
    - text: Verifica
      color: primary
    - text: Difese
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Controlli
        en: Checks
      href: '#controlli'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: consultant
      label:
        it: Consulente di sicurezza
        en: Security consultant
      assignedBy: invite
    - key: user
      assignedBy: signup
  limits:
  - action: create:applications
    max: 1
    window: total
    plans:
      starter: 3
      pro: 15
      enterprise: -1
  agents:
  - key: scanner
    role: main
    description: Runs non-destructive, low-load checks on a verified application and writes a draft report for consultant
      review.
    memory: none
    mcpServers:
    - name: webrobot
      url: https://mcp-full.webrobot.eu/mcp
      allow: all
    appTools:
    - name: read_applications
      description: Read the user's registered applications (domain, environment, allowed windows, declared hosts, status,
        authorization)
      action: read
      collection: applications
      scope: user
    - name: read_reports
      description: Read the user's previous approved reports of an application, to compare
      action: read
      collection: reports
      scope: user
    - name: write_report
      description: Save the draft report of this assessment
      action: write
      collection: reports
      scope: user
    limits:
      maxTurns: 60
      maxBudgetUsd: 3.0
    output: markdown
    profile:
      inline:
        display_name: VerificaDifese scanner
        crews:
        - id: scanner
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 60
          max_budget_usd: 3.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You are a defensive web security assessor for VerificaDifese. You assess ONLY applications the customer
            owns.


            HARD PRECONDITIONS (check first with read_applications, by the application id or name in the goal): status must
            be ''verified'' AND authorization_accepted must be true. If not, do not touch the network: reply with a short
            ''# Assessment refused'' report stating which condition is missing. Also check the current date/time against the
            application''s allowed windows (field windows, with its timezone) and the environment: if now is outside the allowed
            windows, do not scan; reply ''# Assessment postponed'' explaining the next window. Production environments get
            an even lighter load.


            SCOPE: only the verified domain and the hosts listed in declared_hosts. Never any other host, never third-party
            services, never links followed off-scope.


            ALLOWED (non-destructive, low load, at most about 1 request per second, no parallel floods): TLS configuration
            (protocol versions, certificate validity, HSTS); HTTP security headers (CSP, X-Frame-Options, X-Content-Type-Options,
            Referrer-Policy, Permissions-Policy, cookie flags); component and version fingerprints visible in public responses,
            matched to PUBLISHED vulnerabilities (cite CVE ids only when you are sure; otherwise mark ''to verify''); exposure
            of administrative pages (check that common admin paths are reachable, never log in, never guess credentials);
            OWASP good-practice conformance seen from public pages (information disclosure, error pages, CORS, cookie settings,
            directory listing, robots/security.txt).


            FORBIDDEN: exploitation, payloads, injection attempts, fuzzing, brute force, credential guessing, denial-of-service,
            authentication bypass, data extraction, anything that modifies state on the target. Stop at the first sign of
            instability or blocking.


            OUTPUT: classify every finding as critical, high, medium, low or info, with: title, where, evidence (what you
            observed), why it matters, how developers should fix it (concrete steps), reference (OWASP/CWE). Never invent
            findings or CVEs; say plainly what you could not check. Use read_reports to compare with the last approved report:
            mark each finding new, persisting, or fixed.


            Then call write_report once with: application (the application id), application_name, date (today, YYYY-MM-DD),
            status ''draft'', critical, high, medium, low, info (counts as numbers), summary (5 lines, plain language), findings
            (full Markdown findings list), comparison (what changed since last time), checked (list of checks done and not
            done). Never write status ''approved'': only a human consultant does.


            Final answer: a Markdown report starting with a level-1 title ''# Security assessment — <application name> — <date>'',
            sections ## Summary, ## Findings by severity, ## Remediation plan, ## Changes since last assessment, ## Scope
            and limits. Write in the language requested in the goal (ISO code), default Italian. This is decision support,
            not a guarantee of security.'
  - key: verifier
    role: helper
    description: Issues the ownership verification code and checks it on the customer's domain.
    mcpServers:
    - name: webrobot
      url: https://mcp-full.webrobot.eu/mcp
      allow: all
    appTools:
    - name: read_applications
      description: Read the user's registered applications (domain, environment, allowed windows, declared hosts, status,
        authorization)
      action: read
      collection: applications
      scope: user
    - name: update_application
      description: Update a field of the user's application record (verification_token, status, verify_requested, last_checked)
      action: write
      collection: applications
      scope: user
    - name: new_token
      description: Generate a random verification code
      action: call
      slot: token
    limits:
      maxTurns: 15
      maxBudgetUsd: 0.4
    output: markdown
    profile:
      inline:
        display_name: VerificaDifese verifier
        crews:
        - id: verifier
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You handle domain ownership verification for VerificaDifese. Two jobs, told in the goal.


            ISSUE: call new_token, then update_application on the given record with verification_token = the token, status
            = ''token_issued''. Nothing else.


            CHECK: read the application (read_applications). Fetch ONLY these two URLs with a single GET each using the WebRobot
            MCP: https://<domain>/.well-known/verificadifese.txt and, if that fails, the same path on http://. The body must
            contain exactly the application''s verification_token. If it matches: update_application status = ''verified'',
            verify_requested = false, last_checked = today. Otherwise: status = ''failed'', verify_requested = false, last_checked
            = today. Never fetch any other URL, never scan. Reply with a short Markdown note starting with ''# Verification
            — <domain>'' stating the outcome and, on failure, what the customer should check (file path, exact content, HTTPS
            reachability).'
  data:
    collections:
    - name: applications
      description: Web applications registered by each customer
      ownedBy: user
      access:
      - role: consultant
        can:
        - read
      retentionDays: 1825
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome applicazione
          en: Application name
      - name: domain
        type: text
        required: true
        label:
          it: Dominio (es. app.azienda.it)
          en: Domain (e.g. app.company.com)
        help:
          it: Solo il nome host, senza https://
          en: Host name only, without https://
      - name: environment
        type: select
        required: true
        label:
          it: Ambiente
          en: Environment
        options:
        - value: test
          label:
            it: Test
            en: Test
        - value: production
          label:
            it: Produzione
            en: Production
      - name: windows
        type: textarea
        required: true
        label:
          it: Finestre orarie consentite
          en: Allowed time windows
        help:
          it: es. Lun-Ven 22:00-05:00 Europe/Rome
          en: e.g. Mon-Fri 22:00-05:00 Europe/Rome
      - name: declared_hosts
        type: textarea
        label:
          it: Altri host dichiarati (uno per riga)
          en: Other declared hosts (one per line)
        help:
          it: Il traffico sarà limitato al dominio e a questi host.
          en: Traffic is limited to the domain and these hosts.
      - name: authorization_accepted
        type: boolean
        required: true
        label:
          it: Dichiaro di essere titolare dell'applicazione e autorizzo per iscritto VerificaDifese a eseguire controlli di
            sicurezza non distruttivi sul dominio e sugli host indicati, nelle finestre indicate.
          en: I declare I own this application and give VerificaDifese written authorisation to run non-destructive security
            checks on the domain and hosts listed, within the windows indicated.
      - name: status
        type: select
        default: pending
        label:
          it: Stato verifica
          en: Verification status
        options:
        - value: pending
          label:
            it: In attesa
            en: Pending
        - value: token_issued
          label:
            it: Codice emesso
            en: Code issued
        - value: verified
          label:
            it: Verificato
            en: Verified
        - value: failed
          label:
            it: Non riuscita
            en: Failed
      - name: verification_token
        type: text
        label:
          it: Codice di verifica
          en: Verification code
      - name: verify_requested
        type: boolean
        label:
          it: Ho pubblicato il codice, verifica ora
          en: I published the code, verify now
      - name: last_checked
        type: date
        label:
          it: Ultimo controllo
          en: Last check
    - name: scan_requests
      description: Customer requests for an on-demand assessment
      ownedBy: user
      retentionDays: 365
      fields:
      - name: application
        type: select
        required: true
        optionsFrom: collection:applications
        label:
          it: Applicazione
          en: Application
      - name: note
        type: textarea
        maxLength: 500
        label:
          it: Note (facoltative)
          en: Notes (optional)
    - name: reports
      description: Assessment reports; customers see them only once approved by a consultant
      ownedBy: user
      retentionDays: 1095
      access:
      - role: consultant
        can:
        - read
        - write
      fields:
      - name: application
        type: text
        label:
          it: ID applicazione
          en: Application id
      - name: application_name
        type: text
        label:
          it: Applicazione
          en: Application
      - name: date
        type: date
        label:
          it: Data
          en: Date
      - name: status
        type: select
        default: draft
        label:
          it: Stato
          en: Status
        options:
        - value: draft
          label:
            it: In revisione
            en: In review
        - value: approved
          label:
            it: Approvato
            en: Approved
      - name: critical
        type: number
        label:
          it: Critiche
          en: Critical
      - name: high
        type: number
        label:
          it: Alte
          en: High
      - name: medium
        type: number
        label:
          it: Medie
          en: Medium
      - name: low
        type: number
        label:
          it: Basse
          en: Low
      - name: info
        type: number
        label:
          it: Informative
          en: Info
      - name: summary
        type: textarea
        label:
          it: Sintesi
          en: Summary
      - name: findings
        type: textarea
        label:
          it: Risultati e correzioni
          en: Findings and fixes
      - name: comparison
        type: textarea
        label:
          it: Confronto con la verifica precedente
          en: Comparison with previous assessment
      - name: checked
        type: textarea
        label:
          it: Controlli eseguiti e limiti
          en: Checks done and limits
      - name: reviewer_notes
        type: textarea
        label:
          it: Note del consulente
          en: Consultant notes
  views:
  - key: home
    type: page
    nav: false
    title: VerificaDifese
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow:
        it: Sicurezza applicativa autorizzata
        en: Authorised application security
      title:
        it: Controlla le tue applicazioni web **prima** che lo faccia qualcun altro.
        en: Check your web applications **before** someone else does.
      text:
        it: Registra la tua applicazione, dimostra di controllarla e autorizza il test. Un agente esegue solo controlli non
          distruttivi; un consulente rivede il report prima che ti arrivi.
        en: Register your application, prove you control it and authorise the test. An agent runs only non-destructive checks;
          a consultant reviews the report before it reaches you.
      actions:
      - label:
          it: Inizia
          en: Get started
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Registra
          en: Register
        text:
          it: Dominio, ambiente (test o produzione), finestre orarie, host dichiarati e autorizzazione scritta.
          en: Domain, environment (test or production), time windows, declared hosts and written authorisation.
        badge: '1'
      - title:
          it: Verifica la proprietà
          en: Prove ownership
        text:
          it: 'Pubblichi il codice su /.well-known/verificadifese.txt: senza verifica nessuna analisi parte.'
          en: 'Publish the code at /.well-known/verificadifese.txt: no assessment starts without it.'
        badge: '2'
      - title:
          it: Analisi
          en: Assessment
        text:
          it: Una volta o ogni mese, solo nelle finestre consentite e a basso carico.
          en: Once or every month, only inside the allowed windows and at low load.
        badge: '3'
      - title:
          it: Report rivisto
          en: Reviewed report
        text:
          it: Un consulente approva; ricevi l'email con gravità, spiegazioni e correzioni.
          en: A consultant approves; you get an email with severity, explanations and fixes.
        badge: '4'
    - type: cards
      id: controlli
      title:
        it: Cosa controlliamo
        en: What we check
      items:
      - title: TLS e intestazioni
        text:
          it: Protocolli, certificati, HSTS, CSP, cookie.
          en: Protocols, certificates, HSTS, CSP, cookies.
        badge: 🔒
      - title:
          it: Componenti vulnerabili
          en: Vulnerable components
        text:
          it: Versioni con vulnerabilità note pubblicate.
          en: Versions with published known vulnerabilities.
        badge: 🧩
      - title:
          it: Pagine amministrative
          en: Admin pages
        text:
          it: Esposizione pubblica, senza mai tentare accessi.
          en: Public exposure, never attempting logins.
        badge: 🚪
      - title: OWASP
        text:
          it: Buone pratiche, solo traffico verso gli host dichiarati.
          en: Good practices, traffic only to declared hosts.
        badge: ✅
    - type: note
      content:
        it: Nessuna analisi parte senza proprietà verificata e autorizzazione accettata. Strumento di supporto, non garanzia
          di sicurezza.
        en: No assessment starts without verified ownership and accepted authorisation. A support tool, not a guarantee of
          security.
  - key: register
    type: form
    collection: applications
    title:
      it: Registra applicazione
      en: Register application
    fields:
    - name
    - domain
    - environment
    - windows
    - declared_hosts
    - authorization_accepted
    submit:
      label:
        it: Registra
        en: Register
      message:
        it: Registrata. Ora trovi il codice di verifica nell'elenco applicazioni.
        en: Registered. Your verification code is now in the applications list.
      redirect: apps
    roles:
    - user
    - admin
  - key: apps
    type: table
    title:
      it: Le mie applicazioni
      en: My applications
    source: collection:applications
    columns:
    - name
    - domain
    - environment
    - status
    - verification_token
    - last_checked
    roles:
    - user
    - admin
  - key: verify
    type: form
    collection: applications
    title:
      it: Verifica proprietà
      en: Verify ownership
    fields:
    - verify_requested
    edit: true
    nav: false
    submit:
      label:
        it: Verifica
        en: Verify
      message:
        it: 'Verifica richiesta: controlla lo stato nell''elenco tra poco.'
        en: 'Verification requested: check the status in the list shortly.'
      redirect: apps
    roles:
    - user
    - admin
  - key: request_scan
    type: form
    collection: scan_requests
    title:
      it: Avvia analisi
      en: Start assessment
    submit:
      label:
        it: Avvia
        en: Start
      message:
        it: Richiesta ricevuta. Riceverai un'email quando il consulente avrà approvato il report.
        en: Request received. You will get an email once the consultant approves the report.
      redirect: reports
    roles:
    - user
    - admin
  - key: monthly
    type: instances
    template: monthly_check
    title:
      it: Verifiche mensili
      en: Monthly checks
    roles:
    - user
    - admin
  - key: reports
    type: table
    title:
      it: I miei report
      en: My reports
    source: collection:reports
    columns:
    - date
    - application_name
    - critical
    - high
    - medium
    - low
    - summary
    data:
      display: table
      fields:
      - key: date
        format: date
      - key: application_name
      - key: critical
      - key: high
      - key: medium
      - key: low
      - key: summary
      filters:
      - field: status
        op: '='
        value: approved
      sort:
        field: date
        dir: desc
      limit: 100
    export: true
    roles:
    - user
    - admin
  - key: trend
    type: page
    title:
      it: Andamento
      en: Trend
    roles:
    - user
    - admin
    sections:
    - type: data
      title:
        it: Vulnerabilità nel tempo
        en: Findings over time
      source: collection:reports
      display: chart
      chart: stacked
      fields:
      - key: date
      - key: critical
      - key: high
      - key: medium
      - key: low
      filters:
      - field: status
        op: '='
        value: approved
      sort:
        field: date
        dir: asc
      limit: 60
      empty:
        it: Nessun report approvato.
        en: No approved reports yet.
    - type: data
      title:
        it: Dettaglio e correzioni
        en: Details and fixes
      source: collection:reports
      display: cards
      fields:
      - key: application_name
      - key: date
        format: date
      - key: comparison
      - key: findings
      - key: checked
      - key: reviewer_notes
      filters:
      - field: status
        op: '='
        value: approved
      sort:
        field: date
        dir: desc
      limit: 20
  - key: review
    type: table
    title:
      it: Revisione report
      en: Report review
    source: collection:reports
    data:
      display: table
      fields:
      - key: id
      - key: date
        format: date
      - key: application_name
      - key: critical
      - key: high
      - key: medium
      - key: summary
      filters:
      - field: status
        op: '='
        value: draft
      limit: 100
    roles:
    - consultant
    - admin
  - key: review_form
    type: form
    collection: reports
    title:
      it: Approva report
      en: Approve report
    fields:
    - findings
    - comparison
    - reviewer_notes
    - status
    edit: true
    nav: false
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Salvato. Se approvato, il cliente riceve l'email.
        en: Saved. If approved, the customer gets the email.
      redirect: review
    roles:
    - consultant
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - user
  templates:
  - key: monthly_check
    title:
      it: Verifica mensile
      en: Monthly check
    description:
      it: Ogni mese una nuova analisi della stessa applicazione, nelle finestre consentite.
      en: A new assessment of the same application every month, inside the allowed windows.
    agent: scanner
    params:
    - name: application
      type: select
      required: true
      optionsFrom: collection:applications
      label:
        it: Applicazione
        en: Application
    goal: Monthly assessment of application {application} (instance "{instance}"). Today is {date}. Follow all preconditions;
      if outside the allowed windows, postpone. Write the report in the language with ISO code {lang}.
    schedule:
      cron: 0 2 1 * *
      userCanChange: true
    maxPerUser: 15
  triggers:
  - key: issue_code
    'on':
      collection: applications
      op: insert
      where:
        status: pending
    start:
      agent: verifier
    goal: ISSUE a verification code for application record {record.id} (domain {record.domain}).
    asUser: true
  - key: check_code
    'on':
      collection: applications
      op: update
      where:
        verify_requested: true
    start:
      agent: verifier
    goal: CHECK domain ownership for application record {record.id} (domain {record.domain}). Today is {date}.
    asUser: true
  - key: on_demand_scan
    'on':
      collection: scan_requests
      op: insert
    start:
      agent: scanner
    goal: 'On-demand assessment of the application with id {record.application}. Customer note: {record.note}. Today is {date}.
      Write the report in the language with ISO code {lang}.'
    asUser: true
  - key: report_to_review
    'on':
      collection: reports
      op: insert
      where:
        status: draft
    notify:
      to: role:consultant
      subject:
        it: 'Nuovo report da rivedere: {record.application_name}'
        en: 'New report to review: {record.application_name}'
      body:
        it: Un report di sicurezza è in attesa della tua revisione.
        en: A security report is waiting for your review.
      link: review
  - key: report_approved
    'on':
      collection: reports
      op: update
      where:
        status: approved
    notify:
      to: owner
      subject:
        it: Il report di sicurezza di {record.application_name} è pronto
        en: Your security report for {record.application_name} is ready
      body:
        it: 'Il consulente ha approvato il report del {record.date}: critiche {record.critical}, alte {record.high}, medie
          {record.medium}, basse {record.low}. Aprilo per spiegazioni e correzioni.'
        en: 'The consultant approved the report of {record.date}: critical {record.critical}, high {record.high}, medium {record.medium},
          low {record.low}. Open it for explanations and fixes.'
      link: reports
  slots:
  - key: token
    description: Random ownership verification code
    timeoutMs: 2000
    code: "import secrets\n\ndef main(input):\n    return {\"token\": \"vd-\" + secrets.token_hex(16)}\n"
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: starter
      price: 49
      interval: month
      label:
        it: Starter — 3 applicazioni
        en: Starter — 3 applications
      includes:
      - 3 applications
      - on-demand and monthly assessments
      - consultant-reviewed reports
    - key: pro
      price: 149
      interval: month
      label:
        it: Pro — 15 applicazioni
        en: Pro — 15 applications
      includes:
      - 15 applications
      - on-demand and monthly assessments
      - consultant-reviewed reports
    - key: enterprise
      price: 399
      interval: month
      label:
        it: Enterprise — illimitate
        en: Enterprise — unlimited
      includes:
      - unlimited applications
      - on-demand and monthly assessments
      - consultant-reviewed reports
  extensions:
  - key: field_level_protection
    description: 'Form views expose only the intended fields, but record fields such as status are not write-protected at
      field level: a technically skilled user could try to set their own status. Verification and report approval should be
      enforced by the platform with field-level write rules.'
  - key: window_enforcement
    description: Allowed time windows are checked by the agent from the stored text, not by the scheduler; a structured window
      field and scheduler-level enforcement would be stronger.
