apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: bussola-polizze
  displayName: Bussola Polizze
  tagline:
    it: Capisci quale assicurazione fa per te, prima di parlare con il broker.
    en: Understand which insurance fits you, before talking to a broker.
  description:
    it: 'Bussola Polizze è uno strumento di orientamento per assicurazioni auto, casa e vita. Confronta i documenti informativi
      delle compagnie partner e ti spiega coperture, esclusioni, franchigie e massimali. Non vende né intermedia: se vuoi
      procedere, la richiesta passa a un broker iscritto al registro.'
    en: 'Bussola Polizze is an orientation tool for car, home and life insurance. It compares the information documents of
      partner insurers and explains coverage, exclusions, deductibles and limits. It does not sell or broker: if you want
      to proceed, your request goes to a registered broker.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12355b'
      accent: '#d98324'
      background: '#f7f8fa'
      foreground: '#1a2230'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Bussola
      color: primary
    - text: Polizze
      color: accent
    button: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Chi siamo
        en: Who does what
      href: '#ruoli'
    cta:
      label:
        it: Inizia
        en: Start
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: broker
      label:
        it: Broker
        en: Broker
      assignedBy: invite
    - key: insurer
      label:
        it: Compagnia partner
        en: Partner insurer
      assignedBy: invite
    - key: user
      label:
        it: Utente
        en: User
      assignedBy: signup
  limits:
  - action: agent:advisor
    per: user
    max: 5
    window: day
    roles:
    - user
  - action: chat
    per: user
    max: 40
    window: day
    roles:
    - user
  egress:
    hosts: []
  agents:
  - key: advisor
    role: main
    description: Compares the partner insurers' information documents and writes the comparison and a reasoned recommendation.
    profile:
      inline:
        display_name: Bussola Polizze advisor
        crews:
        - id: advisor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 14
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un orientatore assicurativo imparziale. NON vendi e NON intermedi: l''intermediazione spetta
            al broker iscritto al registro. Usi SOLO i documenti informativi (DIP/IPID) caricati dalle compagnie partner,
            che leggi con lo strumento search_policy_docs (filtra per tipo di polizza e compagnia) e read_policy_docs. Non
            consulti siti di compagnie e non inventi prezzi, premi, coperture o massimali: se un dato non è nei documenti,
            scrivi ''non indicato nel documento''. Struttura del report, nella lingua richiesta: prima riga ''# Confronto
            polizze <tipo> — <data>''. Poi sezioni ##: 1) Il tuo bisogno (riassunto in 3 righe); 2) Tabella comparativa (una
            riga per polizza, colonne: compagnia/prodotto, coperture principali, esclusioni rilevanti, franchigie, massimali,
            garanzie richieste dall''utente coperte sì/no/parziale); 3) Spiegazione semplice (cosa significano franchigia,
            massimale, esclusione per questo caso, senza gergo); 4) Raccomandazione motivata (la polizza più adatta in base
            a budget, età, famiglia e garanzie, con 2-3 motivi e 1-2 rischi); 5) Cosa verificare col broker; 6) Fonti (documento
            e data). Se il budget è sotto ciò che serve per le garanzie richieste, dillo. Chiudi con: ''Questo confronto è
            orientativo e non è consulenza né preventivo: l''adeguatezza la verifica il broker.'' Se i documenti non bastano,
            dillo chiaramente. Se utile, aggiungi un grafico ```chart``` con dati reali dai documenti.'
          mcp_servers: []
    appTools:
    - name: search_policy_docs
      description: Search the partner insurers' information documents
      action: search
      collection: policy_docs
      scope: all
    - name: read_policy_docs
      description: Read policy documents
      action: read
      collection: policy_docs
      scope: all
    writesTo:
      collection: requests
      parse: whole
    goalTemplate: 'Tipo di polizza: {policy_type_label}

      {?asset}Veicolo o immobile: {asset}{/asset}

      Età dell''utente: {age}

      Situazione familiare: {family_label}

      Budget annuo: {budget} EUR

      {?must_have}Garanzie a cui tiene: {must_have}{/must_have}

      {?expiry}Scadenza della polizza attuale: {expiry}{/expiry}

      Oggi: {date}. Scrivi il report nella lingua con codice ISO {lang}.'
    output: markdown
    limits:
      maxTurns: 14
      maxBudgetUsd: 0.6
  - key: assistant
    role: helper
    description: Answers the user's questions about their comparison and, on request, hands the request to the broker.
    profile:
      inline:
        display_name: Bussola Polizze assistant
        chat_mode: true
        crews:
        - id: assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''assistente di Bussola Polizze. Rispondi alle domande dell''utente in modo semplice sui suoi
            confronti (leggili con read_requests) e sui documenti informativi delle compagnie partner (search_policy_docs).
            Non inventare dati, non dare preventivi né consulenza personalizzata vincolante, non vendere. Se un dato non è
            nei documenti, dillo. Se l''utente vuole procedere, chiedi conferma, riassumi in poche righe bisogno e polizza
            preferita, e chiama request_broker_handoff: spiega che sarà il broker iscritto al registro a verificare l''adeguatezza,
            preparare il preventivo e contattarlo, e che servirà la sua approvazione al passaggio dei dati.'
    appTools:
    - name: search_policy_docs
      description: Search the partner insurers' information documents
      action: search
      collection: policy_docs
      scope: all
    - name: read_requests
      description: The user's own previous comparisons
      action: read
      collection: requests
      scope: user
    awaits:
    - broker_handoff
    goalTemplate: 'Conversazione finora:

      {history}


      Nuovo messaggio: {message}

      Rispondi nella lingua con codice ISO {lang}.'
    output: markdown
  approvals:
  - key: broker_handoff
    title:
      it: Richiesta di contatto per il broker
      en: Contact request for the broker
    description: The user asks the registered broker to check suitability, prepare the real quote and get in touch.
    role: broker
    decidedBy: role
    fields:
    - policy_type
    - summary
    - preferred_policy
    - budget
    - contact_email
    timeoutMinutes: 10080
    onTimeout: reject
  inputForm:
    title:
      it: Di quale polizza hai bisogno?
      en: Which policy do you need?
    fields:
    - name: policy_type
      type: select
      required: true
      label:
        it: Tipo di polizza
        en: Policy type
      options:
      - value: auto
        label:
          it: Auto
          en: Car
      - value: casa
        label:
          it: Casa
          en: Home
      - value: vita
        label:
          it: Vita
          en: Life
    - name: asset
      type: textarea
      maxLength: 400
      label:
        it: Veicolo o immobile
        en: Vehicle or property
      help:
        it: es. Fiat Panda 2019, 70 CV, Bologna · appartamento 80 mq, zona sismica 3
        en: e.g. 2019 Fiat Panda, Bologna · 80 sqm flat
    - name: age
      type: number
      required: true
      label:
        it: La tua età
        en: Your age
    - name: family
      type: select
      required: true
      label:
        it: Situazione familiare
        en: Family situation
      options:
      - value: single
        label:
          it: Single
          en: Single
      - value: coppia
        label:
          it: In coppia
          en: Couple
      - value: figli
        label:
          it: Famiglia con figli
          en: Family with children
    - name: budget
      type: number
      required: true
      label:
        it: Budget annuo (€)
        en: Yearly budget (€)
    - name: must_have
      type: textarea
      maxLength: 500
      label:
        it: Garanzie a cui tieni
        en: Coverages you care about
      help:
        it: es. furto, kasko, assistenza stradale, danni da acqua
        en: e.g. theft, collision, roadside assistance
    - name: expiry
      type: date
      label:
        it: Scadenza della polizza attuale (facoltativa)
        en: Current policy expiry (optional)
  data:
    collections:
    - name: policy_docs
      ownedBy: shared
      description: Information documents (DIP/IPID) of partner insurers, pasted as text by staff on their behalf; one record
        per product
      fields:
      - name: insurer
        type: text
        required: true
      - name: product
        type: text
        required: true
      - name: policy_type
        type: select
        options:
        - auto
        - casa
        - vita
      - name: version_date
        type: date
      - name: source_url
        type: url
      - name: text
        type: textarea
      searchable: true
    - name: requests
      ownedBy: user
      description: The user's own comparisons
      fields:
      - name: policy_type
        type: text
      - name: expiry
        type: date
      - name: report
        type: textarea
  views:
  - key: home
    type: page
    nav: false
    title: Bussola Polizze
    sections:
    - type: hero
      eyebrow:
        it: Auto · Casa · Vita
        en: Car · Home · Life
      title:
        it: Capisci quale **polizza** fa per te
        en: Understand which **policy** fits you
      text:
        it: 'Compila un breve modulo: un agente AI legge i documenti informativi delle compagnie partner e ti spiega coperture,
          esclusioni, franchigie e massimali, con una raccomandazione motivata. Gratis per te.'
        en: 'Fill in a short form: an AI agent reads the partner insurers'' information documents and explains coverage, exclusions,
          deductibles and limits, with a reasoned recommendation. Free for you.'
      actions:
      - label:
          it: Confronta ora
          en: Compare now
        href: /v/new_run
        style: primary
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Racconta il tuo bisogno
          en: Describe your need
        text:
          it: Tipo di polizza, veicolo o immobile, età, famiglia, budget e garanzie importanti.
          en: Policy type, vehicle or property, age, family, budget and key coverages.
        badge: 📝
      - title:
          it: Ricevi il confronto
          en: Get the comparison
        text:
          it: Tabella comparativa in parole semplici e raccomandazione motivata.
          en: A plain-language comparison table and a reasoned recommendation.
        badge: 📊
      - title:
          it: Chiedi in chat
          en: Ask in chat
        text:
          it: Dubbi su franchigie o esclusioni? L'assistente risponde.
          en: Doubts about deductibles or exclusions? The assistant answers.
        badge: 💬
      - title:
          it: Passa al broker
          en: Hand over to the broker
        text:
          it: Se vuoi procedere, un broker iscritto al registro verifica l'adeguatezza, prepara il preventivo e ti contatta.
          en: If you want to proceed, a registered broker checks suitability, prepares the quote and contacts you.
        badge: 🤝
    - type: cards
      id: ruoli
      title:
        it: Chi fa cosa
        en: Who does what
      items:
      - title:
          it: Bussola Polizze
          en: Bussola Polizze
        text:
          it: Orienta e spiega. Non vende, non intermedia, non raccoglie preventivi dai siti delle compagnie.
          en: Guides and explains. Does not sell, broker, or collect quotes from insurers' websites.
      - title:
          it: Il broker
          en: The broker
        text:
          it: 'Iscritto al registro: verifica l''adeguatezza e prepara il preventivo vero.'
          en: 'Registered: checks suitability and prepares the real quote.'
      - title:
          it: Le tue richieste sono private
          en: Your requests are private
        text:
          it: Le compagnie vedono solo statistiche aggregate.
          en: Insurers only see aggregate statistics.
    - type: note
      content:
        it: 'Strumento orientativo: non è consulenza né preventivo. Si basa sui documenti informativi caricati dalle compagnie
          partner.'
        en: 'Orientation tool: not advice or a quote. Based on information documents uploaded by partner insurers.'
  - key: new_run
    type: new_run
    title:
      it: Nuovo confronto
      en: New comparison
    roles:
    - user
    - admin
  - key: history
    type: history
    title:
      it: I miei confronti
      en: My comparisons
    source: run
    roles:
    - user
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: ask
    type: chat
    title:
      it: Chiedi all'assistente
      en: Ask the assistant
    source: agent:assistant
    examples:
    - Cosa significa franchigia in questo confronto?
    - Quali esclusioni devo guardare di più?
    - Voglio procedere con il broker
    placeholder:
      it: Scrivi la tua domanda…
      en: Type your question…
    roles:
    - user
    - admin
  - key: broker_inbox
    type: approvals
    title:
      it: Richieste ricevute
      en: Received requests
    approvals:
    - broker_handoff
    roles:
    - broker
    - admin
  - key: docs
    type: table
    title:
      it: Documenti delle compagnie
      en: Insurer documents
    source: collection:policy_docs
    columns:
    - insurer
    - product
    - policy_type
    - version_date
    roles:
    - admin
    - insurer
  - key: account
    type: account
    title:
      it: Account
      en: Account
    roles:
    - user
  billing:
    modes:
    - free
  extensions:
  - key: expiry_reminder_email
    description: Email to the user before their policy expires, inviting them to redo the comparison (expiry date is saved
      in the request). Notifications are not available yet; for now the date is stored and shown in the history.
  - key: document_upload
    description: 'Partner insurers cannot upload files yet: documents (DIP/IPID) are pasted as text into policy_docs by staff
      or by the insurer; file upload is needed later.'
  - key: insurer_aggregate_stats
    description: Aggregate, anonymous statistics for partner insurers (requests by type, budget bands). Needs a privacy-safe
      aggregation that does not read customers' records through an app-wide tool; not expressible yet.
  - key: broker_fee_per_contact
    description: 'The broker pays a fee for each contact received (each approved broker_handoff). Per-contact charging to
      a role is not available yet: invoice manually from the approvals list, or later via per_transaction billing.'
