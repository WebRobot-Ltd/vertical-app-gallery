apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: bussola-polizze
  displayName: Bussola Polizze
  tagline:
    it: Capisci quale polizza auto, casa o vita fa per te, prima di parlare con il broker.
  description:
    it: 'Orientatore software per la scelta di un''assicurazione. Non è intermediazione né vendita: queste restano al broker
      iscritto al registro.'
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12355b'
      accent: '#e08a1e'
      background: '#f6f8fb'
      foreground: '#16202b'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Bussola
      color: primary
    - text: Polizze
      color: accent
  header:
    links:
    - label:
        it: Come funziona
      href: '#come-funziona'
    - label:
        it: Chi siamo
      href: '#note-legali'
    cta:
      label:
        it: Inizia il confronto
      href: /v/new
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
    - key: broker
      label:
        it: Broker
      assignedBy: invite
    - key: insurer
      label:
        it: Compagnia partner
      assignedBy: invite
  limits:
  - action: agent:comparer
    per: user
    max: 5
    window: day
    roles:
    - user
  - action: chat
    per: user
    max: 40
    window: day
    roles:
    - user
  egress:
    hosts:
    - example.invalid
    notes: 'Nessuna API esterna usata: l''agente legge solo i documenti caricati dalle compagnie partner. Nessuna raccolta
      di preventivi dai siti delle compagnie.'
  agents:
  - key: comparer
    role: main
    description: Confronta coperture, esclusioni, franchigie e massimali dai documenti informativi caricati dalle compagnie
      partner.
    profile:
      inline:
        display_name: Bussola Polizze comparatore
        crews:
        - id: comparer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 14
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''orientatore di Bussola Polizze. NON sei un intermediario e non vendi: aiuti a capire, poi
            il broker iscritto al registro verifica l''adeguatezza e prepara il preventivo. Usa SOLO i documenti informativi
            (DIP/set informativi) caricati dalle compagnie partner: cercali con search_docs per tipo di polizza e leggili
            con read_docs. Non usare altri siti e non inventare prezzi, premi, coperture o massimali: se un dato non è nei
            documenti scrivi ''non indicato nel documento''. Struttura del report: un titolo di primo livello ''# Confronto
            polizze <tipo> — <data>''. Poi ## Il tuo bisogno (riassunto in 3 righe), ## Tabella comparativa (una riga per
            prodotto: compagnia, prodotto, coperture principali, esclusioni rilevanti, franchigie, massimali, garanzie richieste
            dall''utente coperte sì/no/parziale), ## Spiegazione in parole semplici (cosa significano franchigia, massimale,
            esclusione per questo caso), ## Raccomandazione motivata (1-2 prodotti, perché, rispetto a budget e garanzie;
            cosa NON copre), ## Cosa chiedere al broker, ## Fonti (documenti usati con compagnia e data di validità). Se il
            budget annuo non è coerente con i documenti, dillo senza stimare premi. Chiudi ricordando che è un orientamento,
            non una consulenza assicurativa né un''offerta, e che per procedere basta usare ''Parla con il broker''. Se non
            trovi documenti per il tipo richiesto, dillo chiaramente. Aggiungi un blocco ```chart solo con dati reali dei
            documenti (es. massimali) se utile. Scrivi in italiano semplice.'
    appTools:
    - name: search_docs
      description: Cerca tra i documenti informativi delle compagnie partner
      action: search
      collection: policy_docs
      scope: all
    - name: read_docs
      description: Legge un documento informativo di una compagnia partner
      action: read
      collection: policy_docs
      scope: all
    goalTemplate: 'Tipo di polizza: {policy_type_label}

      Dati del veicolo o dell''immobile / del bisogno: {details}

      Età: {age}

      Situazione familiare: {family_label}

      Budget annuo: {budget} euro

      {?coverages}Garanzie a cui tiene: {coverages}{/coverages}

      {?notes}Note: {notes}{/notes}

      Data di oggi: {date}. Scrivi il report in lingua {lang}.'
    output: markdown
    limits:
      maxTurns: 14
      maxBudgetUsd: 0.8
  - key: advisor
    role: helper
    description: Risponde alle domande dell'utente sulle polizze, sui documenti delle compagnie e sul confronto.
    profile:
      inline:
        display_name: Bussola Polizze assistente
        crews:
        - id: advisor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''assistente di Bussola Polizze: spieghi in modo semplice coperture, esclusioni, franchigie
            e massimali di assicurazioni auto, casa e vita, basandoti SOLO sui documenti informativi delle compagnie partner
            (search_docs, read_docs). Non vendi, non intermedi, non stimi premi, non dai consulenza personalizzata vincolante:
            per preventivo e verifica di adeguatezza rimandi al broker (view ''Parla con il broker''). Se non trovi l''informazione
            nei documenti, dillo. Risposte brevi, in italiano semplice, citando compagnia e documento.'
    appTools:
    - name: search_docs
      description: Cerca tra i documenti informativi delle compagnie partner
      action: search
      collection: policy_docs
      scope: all
    - name: read_docs
      description: Legge un documento informativo di una compagnia partner
      action: read
      collection: policy_docs
      scope: all
    goalTemplate: 'Conversazione finora:

      {history}


      Nuova domanda dell''utente: {message}

      Rispondi in lingua {lang}.'
    output: markdown
  inputForm:
    title:
      it: Il tuo bisogno assicurativo
    fields:
    - name: policy_type
      type: select
      required: true
      label:
        it: Tipo di polizza
      options:
      - value: auto
        label:
          it: Auto
      - value: casa
        label:
          it: Casa
      - value: vita
        label:
          it: Vita
    - name: details
      type: textarea
      required: true
      maxLength: 800
      label:
        it: Dati del veicolo o dell'immobile
      help:
        it: 'Auto: marca, modello, anno, alimentazione, uso. Casa: tipo, mq, zona, proprietà o affitto. Vita: obiettivo (protezione
          famiglia, mutuo...).'
    - name: age
      type: number
      required: true
      label:
        it: Età
    - name: family
      type: select
      required: true
      label:
        it: Situazione familiare
      options:
      - value: single
        label:
          it: Single
      - value: couple
        label:
          it: In coppia
      - value: family_kids
        label:
          it: Famiglia con figli
      - value: single_parent
        label:
          it: Genitore singolo
    - name: budget
      type: number
      required: true
      label:
        it: Budget annuo (€)
    - name: coverages
      type: multiselect
      label:
        it: Garanzie a cui tieni
      options:
      - value: rca
        label:
          it: Responsabilità civile
      - value: furto_incendio
        label:
          it: Furto e incendio
      - value: kasko
        label:
          it: Kasko / collisione
      - value: assistenza
        label:
          it: Assistenza stradale
      - value: eventi_naturali
        label:
          it: Eventi naturali
      - value: rc_famiglia
        label:
          it: RC capofamiglia
      - value: tutela_legale
        label:
          it: Tutela legale
      - value: morte
        label:
          it: Caso morte
      - value: invalidita
        label:
          it: Invalidità permanente
      - value: malattie_gravi
        label:
          it: Malattie gravi
    - name: notes
      type: textarea
      maxLength: 400
      label:
        it: Note (facoltative)
  data:
    collections:
    - name: policy_docs
      ownedBy: shared
      description: Documenti informativi caricati dalle compagnie partner
      retentionDays: 1825
      fields:
      - name: insurer_name
        type: text
        required: true
        label:
          it: Compagnia
      - name: insurer_email
        type: email
        required: true
        label:
          it: Email referente
      - name: policy_type
        type: select
        required: true
        label:
          it: Tipo
        options:
        - auto
        - casa
        - vita
      - name: product_name
        type: text
        required: true
        label:
          it: Prodotto
      - name: valid_from
        type: date
        label:
          it: Valido dal
      - name: document
        type: file
        accept:
        - pdf
        - docx
        - txt
        maxMb: 15
        label:
          it: Documento informativo (DIP)
      - name: text
        type: textarea
        label:
          it: Testo del documento (se non estratto)
      searchable: true
      access:
      - role: insurer
        where:
          insurer_email: '{user.email}'
        can:
        - read
        - write
    - name: requests
      ownedBy: user
      description: Richieste di contatto dal broker
      retentionDays: 730
      fields:
      - name: policy_type
        type: select
        required: true
        label:
          it: Tipo di polizza
        options:
        - auto
        - casa
        - vita
      - name: summary
        type: textarea
        required: true
        label:
          it: Il tuo bisogno in breve
        help:
          it: Copia qui il riassunto del confronto o scrivi cosa cerchi.
      - name: budget
        type: number
        label:
          it: Budget annuo (€)
      - name: contact_email
        type: email
        required: true
        label:
          it: Email di contatto
      - name: phone
        type: text
        label:
          it: Telefono (facoltativo)
      - name: consent
        type: boolean
        required: true
        label:
          it: Acconsento a essere contattato dal broker e alla condivisione dei dati inseriti
      - name: status
        type: select
        label:
          it: Stato
        default: new
        options:
        - new
        - contacted
        - quoted
        - closed
      - name: broker_notes
        type: textarea
        label:
          it: Note del broker
      access:
      - role: broker
        can:
        - read
        - write
    - name: expiries
      ownedBy: user
      description: Scadenze polizze per il promemoria
      retentionDays: 1095
      fields:
      - name: policy_type
        type: select
        required: true
        label:
          it: Tipo di polizza
        options:
        - auto
        - casa
        - vita
      - name: expiry_date
        type: date
        required: true
        label:
          it: Data di scadenza
      - name: label
        type: text
        label:
          it: Nome (es. Fiat Panda)
  triggers:
  - key: new_request_broker
    description: Avvisa i broker di una nuova richiesta
    'on':
      collection: requests
      op: insert
    notify:
      to: role:broker
      subject:
        it: Nuova richiesta {record.policy_type} su Bussola Polizze
      body:
        it: Hai ricevuto una nuova richiesta di contatto ({record.policy_type}). Verifica l'adeguatezza e contatta l'utente.
      link: broker_inbox
  - key: new_request_user
    description: Conferma all'utente
    'on':
      collection: requests
      op: insert
    notify:
      to: owner
      subject:
        it: Richiesta inviata al broker
      body:
        it: Abbiamo passato la tua richiesta al broker, che verificherà l'adeguatezza e ti contatterà con un preventivo. Bussola
          Polizze è solo uno strumento di orientamento.
      link: my_requests
  - key: renewal_reminder
    description: Invito a rifare il confronto prima della scadenza
    'on':
      date:
        collection: expiries
        field: expiry_date
        offsetDays: -30
        hour: 8
    notify:
      to: owner
      subject:
        it: La tua polizza {record.policy_type} sta per scadere
      body:
        it: La polizza {record.label} scade il {record.expiry_date}. È il momento di rifare il confronto su Bussola Polizze.
      link: new
  views:
  - key: home
    type: page
    title: Bussola Polizze
    nav: false
    sections:
    - type: hero
      eyebrow:
        it: Auto · Casa · Vita
      title:
        it: Scegli la polizza con **chiarezza**, prima di parlare con il broker.
      text:
        it: Compili un modulo, un agente AI legge i documenti informativi delle compagnie partner e ti spiega coperture, esclusioni,
          franchigie e massimali in parole semplici. Gratis per te.
      actions:
      - label:
          it: Inizia il confronto
        href: /v/new
        style: primary
      - label:
          it: Accedi
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
      items:
      - title:
          it: Racconta il bisogno
        text:
          it: Tipo di polizza, dati, età, famiglia, budget e garanzie importanti.
      - title:
          it: Ricevi il confronto
        text:
          it: Tabella comparativa spiegata semplice e raccomandazione motivata.
      - title:
          it: Fai domande
        text:
          it: Chiedi in chat cosa significa una clausola o una franchigia.
      - title:
          it: Parla con il broker
        text:
          it: Se vuoi procedere, il broker verifica l'adeguatezza, prepara il preventivo e ti contatta.
      - title:
          it: Promemoria alla scadenza
        text:
          it: Ti avvisiamo prima che la polizza scada, per rifare il confronto.
    - type: cards
      title:
        it: I tuoi dati
      items:
      - title:
          it: Solo tu vedi le tue richieste
        text:
          it: Le compagnie partner vedono solo statistiche aggregate e anonime.
      - title:
          it: Fonti dichiarate
        text:
          it: Usiamo solo documenti informativi caricati dalle compagnie partner, non raccogliamo preventivi dai loro siti.
    - type: note
      id: note-legali
      content:
        it: 'Bussola Polizze è uno strumento software di orientamento: non svolge attività di intermediazione né vendita assicurativa,
          che restano al broker iscritto al registro (RUI). Il confronto non è un''offerta né una consulenza.'
  - key: new
    type: new_run
    title:
      it: Nuovo confronto
    roles:
    - user
    - admin
  - key: history
    type: history
    title:
      it: I miei confronti
    source: run
    roles:
    - user
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: chat
    type: chat
    title:
      it: Chiedi all'assistente
    source: agent:advisor
    examples:
    - it: Che differenza c'è tra franchigia e scoperto?
    - it: Cosa vuol dire massimale per la RC auto?
    - it: Quali esclusioni sono più comuni nelle polizze casa?
    placeholder:
      it: Scrivi la tua domanda sulle polizze…
    roles:
    - user
    - admin
  - key: contact_broker
    type: form
    title:
      it: Parla con il broker
    collection: requests
    fields:
    - policy_type
    - summary
    - budget
    - contact_email
    - phone
    - consent
    submit:
      label:
        it: Invia al broker
      message:
        it: Richiesta inviata. Il broker ti contatterà.
      redirect: my_requests
    roles:
    - user
    - admin
  - key: my_requests
    type: table
    title:
      it: Le mie richieste
    source: collection:requests
    columns:
    - policy_type
    - summary
    - status
    - broker_notes
    roles:
    - user
    - admin
  - key: expiry
    type: form
    title:
      it: Promemoria scadenza
    collection: expiries
    fields:
    - policy_type
    - label
    - expiry_date
    submit:
      label:
        it: Salva promemoria
      message:
        it: Ti scriveremo 30 giorni prima della scadenza.
    roles:
    - user
    - admin
  - key: broker_inbox
    type: table
    title:
      it: Richieste ricevute
    source: collection:requests
    columns:
    - policy_type
    - summary
    - budget
    - contact_email
    - phone
    - status
    export: true
    roles:
    - broker
    - admin
  - key: broker_update
    type: form
    title:
      it: Aggiorna richiesta
    collection: requests
    fields:
    - status
    - broker_notes
    edit: true
    submit:
      label:
        it: Salva
      redirect: broker_inbox
    nav: false
    roles:
    - broker
    - admin
  - key: partner_docs
    type: form
    title:
      it: Carica documento informativo
    collection: policy_docs
    fields:
    - insurer_name
    - insurer_email
    - policy_type
    - product_name
    - valid_from
    - document
    - text
    submit:
      label:
        it: Pubblica
      message:
        it: Documento caricato.
    roles:
    - insurer
    - admin
  - key: partner_stats
    type: table
    title:
      it: Statistiche aggregate
    source: collection:requests
    data:
      display: table
      fields:
      - key: policy_type
        label:
          it: Tipo
      - key: n
        label:
          it: Richieste
      - key: avg_budget
        label:
          it: Budget medio
        format: money
      groupBy:
        field: policy_type
        aggs:
        - key: avg_budget
          agg: avg
          field: budget
        minCount: 5
        acrossUsers: true
    roles:
    - insurer
    - admin
  notifications:
    emailOnRunDone: true
  billing:
    modes:
    - free
  extensions:
  - key: broker_fee_per_contact
    description: 'La quota per contatto pagata dal broker non è esprimibile ora: il trigger ''charge'' addebita l''utente
      dell''evento (il cliente), non il broker. Va gestita fuori piattaforma (fatturazione mensile in base al numero di richieste)
      finché non è disponibile l''addebito a un ruolo.'
  - key: doc_text_extraction
    description: 'L''estrazione automatica del testo dai PDF caricati dalle compagnie in una collezione non è garantita: il
      campo ''text'' consente di incollare il testo del documento.'
