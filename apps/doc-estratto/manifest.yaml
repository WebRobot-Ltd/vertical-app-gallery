apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: docestratto
  displayName: DocEstratto
  tagline:
    it: 'Dai documenti ai dati: estrazione, validazione e revisione.'
    en: 'From documents to data: extraction, validation and review.'
  description:
    it: Definisci il tipo di documento e i campi, carica scansioni e foto, ottieni dati normalizzati e verificati, con coda
      di revisione ed esportazione CSV.
    en: Define the document type and fields, upload scans and photos, get normalised, validated data with a review queue and
      CSV export.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1d3557'
      accent: '#2a9d8f'
      background: '#f7f9fb'
      foreground: '#16202b'
    fonts:
      body: Inter
      display: Manrope
    wordmark:
    - text: Doc
      color: primary
    - text: Estratto
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  limits:
  - action: agent:extractor
    per: user
    max: 200
    window: day
    roles:
    - user
  agents:
  - key: extractor
    role: main
    description: Reads the uploaded document (OCR included), extracts the requested fields, normalises them and checks internal
      consistency.
    profile:
      inline:
        display_name: DocEstratto extractor
        crews:
        - id: extractor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are a document data-extraction specialist. For each uploaded file call the tool read_upload
            with the file id to read it (scans and skewed photos included, OCR is done by the tool). Extract exactly the fields
            defined by the user''s field specification. Normalise: dates to YYYY-MM-DD, amounts as plain numbers with dot
            decimal, tax codes (codice fiscale, partita IVA) uppercase without spaces. Apply the user''s validation rules
            and check internal consistency (e.g. taxable amount + VAT = total; check digits when verifiable). Never invent
            values: if a field is unreadable or absent, leave it null and lower the confidence. Give an overall confidence
            from 0 to 1. Status is ''review'' if confidence < 0.85 or any check fails, otherwise ''validated''.

            Output: start with a level-1 title "# <document type> — <file name>". Then a short table of the extracted fields
            (value, confidence), then a ''## Checks'' section listing each validation as OK/FAILED, then ''## Notes''. Finish
            with ONE fenced json block containing exactly: {"doc_type":string,"filename":string,"status":"validated"|"review","confidence":number,"data":string
            (JSON text of the extracted fields),"issues":string (failed checks, empty if none),"date":"YYYY-MM-DD"}. Write
            the report in the language with ISO code given in the goal.'
    appTools:
    - name: read_upload
      description: Read a file the user uploaded (OCR included)
      action: read_file
    context:
    - key: fields_spec
      from: collection:doc_types.fields_spec
    - key: rules
      from: collection:doc_types.rules
    goalTemplate: 'Document type: {doc_type}

      Fields to extract and their format:

      {fields_spec}

      {?rules}Validation rules:

      {rules}{/rules}

      Uploaded files: {files}

      {?files_text}Text already extracted: {files_text}{/files_text}

      Today is {date}. Write the report in the language with ISO code {lang}.'
    output: markdown+json
    writesTo:
      collection: documents
      parse: json_last
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.6
  inputForm:
    title:
      it: Elabora documenti
      en: Process documents
    fields:
    - name: doc_type
      type: select
      required: true
      optionsFrom: collection:doc_types
      label:
        it: Tipo di documento
        en: Document type
    - name: files
      type: file
      required: true
      multiple: true
      accept:
      - pdf
      - jpg
      - jpeg
      - png
      - webp
      - docx
      - xlsx
      - csv
      - txt
      maxMb: 15
      label:
        it: Documenti (fino a 10 per invio)
        en: Documents (up to 10 per upload)
    - name: pages
      type: number
      required: true
      default: 1
      label:
        it: Pagine totali
        en: Total pages
      help:
        it: Si paga per pagina elaborata
        en: You pay per processed page
  data:
    collections:
    - name: doc_types
      ownedBy: user
      description: Document types defined by the organisation with their fields and rules
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome tipo documento
          en: Document type name
      - name: fields_spec
        type: textarea
        required: true
        label:
          it: Campi da estrarre (nome, tipo, formato)
          en: Fields to extract (name, type, format)
        help:
          it: 'Es. numero_fattura: testo; data: data YYYY-MM-DD; imponibile: importo; iva: importo; totale: importo'
          en: 'E.g. invoice_number: text; date: YYYY-MM-DD; net: amount; vat: amount; total: amount'
      - name: rules
        type: textarea
        label:
          it: Regole di validazione
          en: Validation rules
        help:
          it: Es. imponibile + iva = totale; il codice fiscale deve essere valido
          en: E.g. net + vat = total; tax code must be valid
    - name: documents
      ownedBy: user
      retentionDays: 365
      description: Extracted documents with status and confidence
      fields:
      - name: doc_type
        type: text
        label:
          it: Tipo
          en: Type
      - name: filename
        type: text
        label:
          it: File
          en: File
      - name: status
        type: select
        options:
        - value: validated
          label:
            it: Validato
            en: Validated
        - value: review
          label:
            it: Da rivedere
            en: To review
        - value: corrected
          label:
            it: Corretto
            en: Corrected
        label:
          it: Stato
          en: Status
      - name: confidence
        type: number
        label:
          it: Confidenza
          en: Confidence
      - name: data
        type: textarea
        label:
          it: Campi estratti (JSON)
          en: Extracted fields (JSON)
      - name: issues
        type: textarea
        label:
          it: Problemi rilevati
          en: Issues found
      - name: date
        type: date
        label:
          it: Data
          en: Date
  views:
  - key: home
    type: page
    nav: false
    title: DocEstratto
    sections:
    - type: hero
      title:
        it: Dai documenti ai **dati**, senza digitare.
        en: From documents to **data**, no typing.
      text:
        it: 'Definisci i campi, carica scansioni e foto: un agente fa OCR, estrae, normalizza e controlla la coerenza. Solo
          i dubbi passano a un operatore.'
        en: 'Define the fields, upload scans and photos: an agent runs OCR, extracts, normalises and checks consistency. Only
          doubtful ones go to an operator.'
      actions:
      - label:
          it: Inizia
          en: Start
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Definisci il tipo
          en: Define the type
        text:
          it: Campi, formati e regole di validazione.
          en: Fields, formats and validation rules.
        badge: 📝
      - title:
          it: Carica
          en: Upload
        text:
          it: PDF, scansioni e foto storte.
          en: PDFs, scans and skewed photos.
        badge: 📤
      - title:
          it: Estrai e verifica
          en: Extract and check
        text:
          it: Date, importi e codici fiscali normalizzati; imponibile + IVA = totale.
          en: Dates, amounts and tax codes normalised; net + VAT = total.
        badge: 🔍
      - title:
          it: Rivedi ed esporta
          en: Review and export
        text:
          it: Coda di revisione e CSV.
          en: Review queue and CSV.
        badge: ✅
    - type: note
      content:
        it: I dati sono visibili solo alla tua organizzazione e conservati per 12 mesi. Pagamento a consumo, a pagina.
        en: Data is visible only to your organisation and kept for 12 months. Pay per page.
  - key: types_new
    type: form
    collection: doc_types
    title:
      it: Nuovo tipo di documento
      en: New document type
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Tipo salvato
        en: Type saved
      redirect: types
    roles:
    - user
    - admin
  - key: types
    type: table
    title:
      it: Tipi di documento
      en: Document types
    source: collection:doc_types
    columns:
    - name
    - fields_spec
    - rules
    roles:
    - user
    - admin
  - key: new
    type: new_run
    title:
      it: Elabora
      en: Process
    roles:
    - user
    - admin
  - key: runs
    type: history
    title:
      it: Elaborazioni
      en: Runs
    source: run
    roles:
    - user
    - admin
  - key: run_report
    type: report
    source: run
    printable: true
    nav: false
  - key: documents
    type: table
    title:
      it: Documenti
      en: Documents
    source: collection:documents
    columns:
    - date
    - doc_type
    - filename
    - status
    - confidence
    - data
    - issues
    export: true
    roles:
    - user
    - admin
  - key: review
    type: table
    title:
      it: Coda di revisione
      en: Review queue
    source: collection:documents
    columns:
    - filename
    - doc_type
    - confidence
    - data
    - issues
    data:
      display: table
      fields:
      - key: filename
        label:
          it: File
          en: File
      - key: doc_type
        label:
          it: Tipo
          en: Type
      - key: confidence
        label:
          it: Confidenza
          en: Confidence
        format: percent
      - key: issues
        label:
          it: Problemi
          en: Issues
      filters:
      - field: status
        op: '='
        value: review
      sort:
        field: confidence
        dir: asc
      limit: 100
      empty:
        it: Nessun documento da rivedere.
        en: Nothing to review.
    roles:
    - user
    - admin
  - key: fix
    type: form
    collection: documents
    edit: true
    nav: false
    title:
      it: Correggi documento
      en: Correct document
    fields:
    - doc_type
    - filename
    - status
    - data
    - issues
    - date
    submit:
      label:
        it: Salva correzione
        en: Save correction
      message:
        it: Correzione salvata
        en: Correction saved
      redirect: documents
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Crediti
      en: Credits
    roles:
    - user
  notifications:
    emailOnRunDone: true
  billing:
    modes:
    - credits
    signupCredits: 50
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:extractor:
        perUnit:
          field: pages
          credits: 3
          min: 3
    packs:
    - key: small
      credits: 1000
      price: 10
      label: '1000'
    - key: large
      credits: 6000
      price: 50
      label: '6000'
  extensions:
  - key: batch_upload
    description: 'Batches of hundreds of documents and automatic splitting: a run takes up to 10 files, larger batches need
      a bulk ingest not available yet.'
  - key: email_inbox
    description: Receiving documents at a dedicated email address and turning attachments into runs is not available yet.
  - key: outbound_webhook
    description: Sending results to the customer's ERP by webhook (customer-specific URL) is not available yet; CSV export
      is.
  - key: image_side_by_side
    description: Review screen with the document image next to the editable fields is not available; the review form shows
      the extracted fields only.
  - key: excel_export
    description: Excel export (CSV is available).
  - key: org_teams
    description: 'Multiple operators per organisation sharing documents: here each account sees its own records; shared team
      access can be added with a members field.'
