apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: spedizionetraccia
  displayName: SpedizioneTraccia
  tagline:
    it: Tracciamento spedizioni e notifiche ai clienti, in un unico posto.
    en: Shipment tracking and customer notifications, in one place.
  description:
    it: Collega i tuoi corrieri, importa gli ordini spediti e lascia che un agente aggiorni gli stati, avvisi i clienti e
      segnali i colli bloccati.
    en: Connect your carriers, import shipped orders and let an agent update statuses, notify customers and flag stuck parcels.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12355b'
      accent: '#e8702a'
      background: '#f7f8fa'
      foreground: '#17212b'
    fonts:
      body: Inter
      display: Manrope
    wordmark:
    - text: Spedizione
      color: primary
    - text: Traccia
      color: accent
    buttonShape: rounded
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#how'
    - label:
        it: Piani
        en: Plans
      href: '#plans'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      label:
        it: Negozio
        en: Store
      assignedBy: signup
  limits:
  - action: create:shipments
    max: 100
    window: month
    plans:
      growth: 500
      scale: 2000
  agents:
  - key: importer
    role: main
    description: Importa ordini spediti da un CSV/Excel del gestionale e li salva come spedizioni.
    memory: none
    appTools:
    - name: shipments_write
      description: Create or update shipment records of the store
      action: write
      collection: shipments
      scope: user
    - name: shipments_read
      description: Read the store's shipments
      action: read
      collection: shipments
      scope: user
    profile:
      inline:
        display_name: SpedizioneTraccia importer
        crews:
        - id: importer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You import shipped orders for an e-commerce store. You receive the text of a CSV/Excel export. For
            each row with a tracking number, first check with shipments_read that the tracking number does not already exist,
            then create a shipment with shipments_write: order_ref, tracking_number, carrier (dhl, gls, brt, ups, sda, poste,
            other; lowercase), customer_name, customer_email, customer_lang (it or en; guess from country/name, default it),
            destination, shipped_at (YYYY-MM-DD), status ''created'', is_delivered 0. Skip rows without tracking number or
            with an invalid email (keep the shipment but leave the email empty). Never invent data. Finish with a report starting
            with ''# Import completato'' (title in the user''s language) listing: rows read, shipments created, rows skipped
            and why.'
    goalTemplate: 'Import the shipped orders from this export. Language of the report: {lang}. Today is {date}.

      {?orders_text}Export content:

      {orders_text}{/orders_text}{!orders_text}No readable file was provided: say so.{/orders_text}

      {?notes}Notes from the store: {notes}{/notes}'
    output: markdown
    limits:
      maxTurns: 15
      maxBudgetUsd: 0.5
  - key: tracker
    role: scheduled
    description: Interroga i corrieri per le spedizioni aperte del negozio, normalizza gli stati e aggiorna ogni spedizione.
    appTools:
    - name: shipments_write
      description: Create or update shipment records of the store
      action: write
      collection: shipments
      scope: user
    - name: shipments_read
      description: Read the store's shipments
      action: read
      collection: shipments
      scope: user
    - name: dhl_track
      description: 'Track a DHL shipment (query: trackingNumber=<number>)'
      action: http
      http:
        method: GET
        url: https://api-eu.dhl.com/track/shipments
        attribution: DHL Shipment Tracking API
        credential:
          provider: dhl
          header: DHL-API-Key
          format: '{secret}'
    - name: aftership_track
      description: 'Track a shipment of any other carrier through AfterShip (path: /<slug>/<tracking_number>)'
      action: http
      http:
        method: GET
        url: https://api.aftership.com/v4/trackings
        allowPath: true
        attribution: AfterShip API
        credential:
          provider: aftership
          header: as-api-key
          format: '{secret}'
    profile:
      inline:
        display_name: SpedizioneTraccia tracker
        crews:
        - id: tracker
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You track parcels for one e-commerce store. Read the store''s shipments whose status is not ''delivered''
            (use shipments_read; process at most 40 per run, oldest last_event_at first). For each, query the carrier: DHL
            with dhl_track (query trackingNumber=<number>, read shipments[0].status.statusCode and events); every other carrier
            with aftership_track (path /<carrier>/<tracking_number>, read data.tracking.tag and checkpoints). If the store
            has not connected the carrier''s key, skip those shipments and say so in the report. Normalise every carrier status
            into exactly one of: picked_up (taken in charge), in_transit, out_for_delivery, delivered, held (giacenza: held
            at a pickup point/depot, waiting for collection), exception (failed delivery, damaged, lost, returned, address
            problem). Only when the normalised status differs from the stored one, update the record with shipments_write:
            status, status_detail (short, factual, from the carrier event), last_event_at; when delivered also delivered_at,
            is_delivered 1 and transit_days (days from shipped_at). Do not touch records whose status did not change. Never
            guess a status the carrier did not report. End with a report starting with ''# Aggiornamento spedizioni — <date>''
            (use the language code given): table of shipments checked, changed statuses, and a list of held/exception parcels
            needing attention.'
    goalTemplate: 'Update the open shipments of the store ({instance}). Carriers to check: {carriers}. Today is {date}. Report
      language: {lang}.'
    output: markdown
    limits:
      maxTurns: 40
      maxBudgetUsd: 1.0
  inputForm:
    title:
      it: Importa ordini spediti
      en: Import shipped orders
    fields:
    - name: orders
      type: file
      required: true
      label:
        it: File ordini (CSV/Excel)
        en: Orders file (CSV/Excel)
      accept:
      - csv
      - xlsx
      - txt
      maxMb: 10
      help:
        it: 'Colonne utili: ordine, tracking, corriere, cliente, email, lingua, destinazione, data spedizione.'
        en: 'Useful columns: order, tracking, carrier, customer, email, language, destination, ship date.'
    - name: notes
      type: textarea
      maxLength: 400
      label:
        it: Note (facoltative)
        en: Notes (optional)
  templates:
  - key: tracking_watch
    title:
      it: Monitoraggio corrieri
      en: Carrier monitoring
    description:
      it: Controlla periodicamente i corrieri e aggiorna le tue spedizioni.
      en: Periodically checks carriers and updates your shipments.
    agent: tracker
    params:
    - name: carriers
      type: multiselect
      required: true
      label:
        it: Corrieri da controllare
        en: Carriers to check
      options:
      - value: dhl
        label: DHL
      - value: gls
        label: GLS
      - value: brt
        label: BRT
      - value: ups
        label: UPS
      - value: sda
        label: SDA
      - value: poste
        label: Poste Italiane
    goal: 'Update the open shipments of the store ({instance}). Carriers to check: {carriers}. Today is {date}. Report language:
      {lang}.'
    schedule:
      cron: 0 */6 * * *
      userCanChange: true
    maxPerUser: 1
    roles:
    - user
    - admin
  data:
    collections:
    - name: store
      ownedBy: user
      description: Branding and contacts of the store, used in customer notifications
      fields:
      - name: brand_name
        type: text
        required: true
        label:
          it: Nome del negozio
          en: Store name
      - name: logo_url
        type: url
        label: Logo URL
      - name: brand_color
        type: text
        label:
          it: Colore (#rrggbb)
          en: Brand colour (#rrggbb)
      - name: support_email
        type: email
        label:
          it: Email assistenza
          en: Support email
    - name: shipments
      ownedBy: user
      description: Each store's own shipments, with the normalised status
      retentionDays: 365
      fields:
      - name: order_ref
        type: text
        required: true
        label:
          it: Ordine
          en: Order
      - name: tracking_number
        type: text
        required: true
        label: Tracking
      - name: carrier
        type: select
        required: true
        label:
          it: Corriere
          en: Carrier
        options:
        - dhl
        - gls
        - brt
        - ups
        - sda
        - poste
        - other
      - name: customer_name
        type: text
        label:
          it: Cliente
          en: Customer
      - name: customer_email
        type: email
        label:
          it: Email cliente
          en: Customer email
      - name: customer_lang
        type: select
        label:
          it: Lingua cliente
          en: Customer language
        default: it
        options:
        - value: it
          label: Italiano
        - value: en
          label: English
      - name: destination
        type: text
        label:
          it: Destinazione
          en: Destination
      - name: shipped_at
        type: date
        label:
          it: Data spedizione
          en: Ship date
      - name: status
        type: select
        default: created
        label:
          it: Stato
          en: Status
        options:
        - value: created
          label:
            it: Creata
            en: Created
        - value: picked_up
          label:
            it: Preso in carico
            en: Picked up
        - value: in_transit
          label:
            it: In transito
            en: In transit
        - value: out_for_delivery
          label:
            it: In consegna
            en: Out for delivery
        - value: delivered
          label:
            it: Consegnato
            en: Delivered
        - value: held
          label:
            it: Giacenza
            en: Held
        - value: exception
          label:
            it: Eccezione
            en: Exception
      - name: status_detail
        type: text
        label:
          it: Dettaglio
          en: Detail
      - name: last_event_at
        type: date
        label:
          it: Ultimo evento
          en: Last event
      - name: delivered_at
        type: date
        label:
          it: Consegnato il
          en: Delivered on
      - name: transit_days
        type: number
        label:
          it: Giorni in transito
          en: Transit days
      - name: is_delivered
        type: number
        default: 0
        label:
          it: Consegnato (0/1)
          en: Delivered (0/1)
    credentials:
    - provider: dhl
      kind: api_key
      scope: user
      label: DHL
      help:
        it: Chiave API del tuo account sviluppatori DHL (Shipment Tracking).
        en: API key from your DHL developer account (Shipment Tracking).
    - provider: aftership
      kind: api_key
      scope: user
      label:
        it: AfterShip (GLS, BRT, UPS, SDA, Poste…)
        en: AfterShip (GLS, BRT, UPS, SDA, Poste…)
      help:
        it: Chiave API AfterShip, da Impostazioni > API Keys. Collega lì i tuoi account corriere.
        en: AfterShip API key, from Settings > API Keys. Connect your carrier accounts there.
  egress:
    hosts:
    - api-eu.dhl.com
    - api.aftership.com
    notes: DHL Shipment Tracking API and AfterShip API, called with the store's own API key under each provider's terms.
  views:
  - key: home
    type: page
    nav: false
    title: SpedizioneTraccia
    sections:
    - type: hero
      title:
        it: Ogni spedizione, **un solo posto**. Clienti sempre informati.
        en: Every shipment, **one place**. Customers always informed.
      text:
        it: Collega i tuoi corrieri, importa gli ordini spediti e un agente normalizza gli stati, avvisa i clienti e ti segnala
          i colli bloccati.
        en: Connect your carriers, import shipped orders and an agent normalises statuses, notifies customers and flags stuck
          parcels.
      actions:
      - label:
          it: Inizia ora
          en: Get started
        href: /login
        style: primary
      - label:
          it: Piani
          en: Plans
        href: '#plans'
        style: ghost
    - type: steps
      id: how
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Collega i corrieri
          en: Connect carriers
        text:
          it: Inserisci le tue chiavi API nella pagina account.
          en: Paste your API keys on the account page.
        badge: 🔗
      - title:
          it: Importa gli ordini
          en: Import orders
        text:
          it: Carica un file dal gestionale o aggiungi una spedizione.
          en: Upload a file from your system or add a shipment.
        badge: 📦
      - title:
          it: L'agente aggiorna
          en: The agent updates
        text:
          it: 'Stati unificati: preso in carico, in transito, in consegna, consegnato, giacenza, eccezione.'
          en: 'Unified statuses: picked up, in transit, out for delivery, delivered, held, exception.'
        badge: 🚚
      - title:
          it: Notifiche automatiche
          en: Automatic notifications
        text:
          it: Email al cliente a ogni cambio di stato; avviso al negozio per giacenza ed eccezioni.
          en: Email to the customer on every status change; alert to the store on held or exception.
        badge: ✉️
    - type: cards
      id: plans
      title:
        it: Piani mensili
        en: Monthly plans
      items:
      - title: Starter
        text:
          it: Fino a 100 spedizioni al mese
          en: Up to 100 shipments a month
      - title: Growth
        text:
          it: Fino a 500 spedizioni al mese
          en: Up to 500 shipments a month
      - title: Scale
        text:
          it: Fino a 2000 spedizioni al mese
          en: Up to 2000 shipments a month
    - type: note
      content:
        it: SpedizioneTraccia · gli stati dipendono dai dati forniti dai corrieri.
        en: SpedizioneTraccia · statuses depend on data provided by the carriers.
  - key: dashboard
    type: page
    title:
      it: Dashboard
      en: Dashboard
    roles:
    - user
    - admin
    sections:
    - type: data
      title:
        it: Panoramica
        en: Overview
      source: collection:shipments
      display: kpi
      kpis:
      - label:
          it: Spedizioni
          en: Shipments
        agg: count
      - label:
          it: Tasso di consegna
          en: Delivery rate
        agg: avg
        field: is_delivered
        format: percent
      - label:
          it: Giorni medi in transito
          en: Avg transit days
        agg: avg
        field: transit_days
        format: number
    - type: data
      title:
        it: 'Per corriere: consegne e tempi'
        en: 'By carrier: delivery and speed'
      source: collection:shipments
      display: table
      groupBy:
        field: carrier
        aggs:
        - key: delivery_rate
          agg: avg
          field: is_delivered
        - key: avg_days
          agg: avg
          field: transit_days
      fields:
      - key: carrier
        label:
          it: Corriere
          en: Carrier
      - key: count
        label:
          it: Spedizioni
          en: Shipments
        format: number
      - key: delivery_rate
        label:
          it: Tasso consegna
          en: Delivery rate
        format: percent
      - key: avg_days
        label:
          it: Giorni medi
          en: Avg days
        format: number
    - type: data
      title:
        it: Corrieri più lenti
        en: Slowest carriers
      source: collection:shipments
      display: chart
      chart: bar
      groupBy:
        field: carrier
        aggs:
        - key: avg_days
          agg: avg
          field: transit_days
      fields:
      - key: carrier
      - key: avg_days
    - type: data
      title:
        it: 'Colli bloccati: giacenza'
        en: 'Stuck parcels: held'
      source: collection:shipments
      display: table
      filters:
      - field: status
        op: '='
        value: held
      fields:
      - key: order_ref
        label:
          it: Ordine
          en: Order
      - key: tracking_number
        label: Tracking
      - key: carrier
        label:
          it: Corriere
          en: Carrier
      - key: customer_name
        label:
          it: Cliente
          en: Customer
      - key: status_detail
        label:
          it: Dettaglio
          en: Detail
      - key: last_event_at
        label:
          it: Ultimo evento
          en: Last event
        format: date
      empty:
        it: Nessun collo in giacenza.
        en: No held parcels.
    - type: data
      title:
        it: 'Colli bloccati: eccezioni'
        en: 'Stuck parcels: exceptions'
      source: collection:shipments
      display: table
      filters:
      - field: status
        op: '='
        value: exception
      fields:
      - key: order_ref
        label:
          it: Ordine
          en: Order
      - key: tracking_number
        label: Tracking
      - key: carrier
        label:
          it: Corriere
          en: Carrier
      - key: customer_name
        label:
          it: Cliente
          en: Customer
      - key: status_detail
        label:
          it: Dettaglio
          en: Detail
      - key: last_event_at
        label:
          it: Ultimo evento
          en: Last event
        format: date
      empty:
        it: Nessuna eccezione.
        en: No exceptions.
  - key: shipments_table
    type: table
    title:
      it: Tutte le spedizioni
      en: All shipments
    source: collection:shipments
    columns:
    - order_ref
    - tracking_number
    - carrier
    - customer_name
    - status
    - status_detail
    - last_event_at
    export: true
    roles:
    - user
    - admin
  - key: add_shipment
    type: form
    title:
      it: Aggiungi spedizione
      en: Add shipment
    collection: shipments
    fields:
    - order_ref
    - tracking_number
    - carrier
    - customer_name
    - customer_email
    - customer_lang
    - destination
    - shipped_at
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Spedizione aggiunta.
        en: Shipment added.
      redirect: shipments_table
    edit: false
    roles:
    - user
    - admin
  - key: import
    type: new_run
    title:
      it: Importa ordini
      en: Import orders
    roles:
    - user
    - admin
  - key: imports
    type: history
    title:
      it: Importazioni
      en: Imports
    source: run
    roles:
    - user
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: watches
    type: instances
    template: tracking_watch
    title:
      it: Monitoraggio corrieri
      en: Carrier monitoring
    roles:
    - user
    - admin
  - key: store_settings
    type: form
    title:
      it: Il mio negozio
      en: My store
    collection: store
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Salvato.
        en: Saved.
    edit: true
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Account e piano
      en: Account and plan
    roles:
    - user
    - admin
  triggers:
  - key: cust_picked_up
    'on':
      collection: shipments
      op: update
      where:
        status: picked_up
    notify:
      to: record.customer_email
      subject: Spedizione presa in carico / Parcel picked up — {record.order_ref}
      body: 'IT: Il tuo ordine {record.order_ref} è stato preso in carico dal corriere. Tracking: {record.tracking_number}.

        EN: Your order {record.order_ref} has been picked up by the carrier. Tracking: {record.tracking_number}.'
  - key: cust_in_transit
    'on':
      collection: shipments
      op: update
      where:
        status: in_transit
    notify:
      to: record.customer_email
      subject: Ordine in transito / Order in transit — {record.order_ref}
      body: 'IT: Il tuo ordine {record.order_ref} è in transito. Tracking: {record.tracking_number}.

        EN: Your order {record.order_ref} is in transit. Tracking: {record.tracking_number}.'
  - key: cust_out_for_delivery
    'on':
      collection: shipments
      op: update
      where:
        status: out_for_delivery
    notify:
      to: record.customer_email
      subject: In consegna oggi / Out for delivery — {record.order_ref}
      body: 'IT: Il tuo ordine {record.order_ref} è in consegna. Tracking: {record.tracking_number}.

        EN: Your order {record.order_ref} is out for delivery. Tracking: {record.tracking_number}.'
  - key: cust_delivered
    'on':
      collection: shipments
      op: update
      where:
        status: delivered
    notify:
      to: record.customer_email
      subject: Ordine consegnato / Order delivered — {record.order_ref}
      body: 'IT: Il tuo ordine {record.order_ref} è stato consegnato. Grazie!

        EN: Your order {record.order_ref} has been delivered. Thank you!'
  - key: cust_held
    'on':
      collection: shipments
      op: update
      where:
        status: held
    notify:
      to: record.customer_email
      subject: Pacco in giacenza / Parcel on hold — {record.order_ref}
      body: 'IT: Il tuo ordine {record.order_ref} è in giacenza: {record.status_detail}. Contatta il corriere per il ritiro.
        Tracking: {record.tracking_number}.

        EN: Your order {record.order_ref} is being held: {record.status_detail}. Please contact the carrier to collect it.
        Tracking: {record.tracking_number}.'
  - key: cust_exception
    'on':
      collection: shipments
      op: update
      where:
        status: exception
    notify:
      to: record.customer_email
      subject: Problema con la consegna / Delivery issue — {record.order_ref}
      body: 'IT: C''è stato un problema con la consegna dell''ordine {record.order_ref}: {record.status_detail}. Il negozio
        è stato avvisato.

        EN: There was a problem delivering your order {record.order_ref}: {record.status_detail}. The store has been notified.'
  - key: store_held
    'on':
      collection: shipments
      op: update
      where:
        status: held
    notify:
      to: owner
      subject:
        it: 'Giacenza: ordine {record.order_ref}'
        en: 'Held parcel: order {record.order_ref}'
      body:
        it: 'La spedizione {record.tracking_number} ({record.carrier}) per {record.customer_name} è in giacenza: {record.status_detail}.'
        en: 'Shipment {record.tracking_number} ({record.carrier}) for {record.customer_name} is being held: {record.status_detail}.'
      link: dashboard
  - key: store_exception
    'on':
      collection: shipments
      op: update
      where:
        status: exception
    notify:
      to: owner
      subject:
        it: 'Eccezione: ordine {record.order_ref}'
        en: 'Exception: order {record.order_ref}'
      body:
        it: 'La spedizione {record.tracking_number} ({record.carrier}) per {record.customer_name} ha un''eccezione: {record.status_detail}.'
        en: 'Shipment {record.tracking_number} ({record.carrier}) for {record.customer_name} has an exception: {record.status_detail}.'
      link: dashboard
  notifications:
    emailOnRunDone: true
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: starter
      price: 29
      interval: month
      label: Starter
      includes:
      - 100 shipments/month
    - key: growth
