apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: chiaroreferto
  displayName: ChiaroReferto
  tagline: Il referto spiegato con parole semplici, dopo la revisione del tuo medico.
  description: 'Strato informativo e gestionale per strutture sanitarie e medici di base: un agente prepara la spiegazione
    per il paziente e una bozza di piano di cura per il medico. Nulla arriva al paziente prima dell''approvazione del medico.
    Non sostituisce il medico e non legge immagini diagnostiche.'
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#0f4c5c'
      accent: '#2a9d8f'
      background: '#f6faf9'
      foreground: '#16282d'
    fonts:
      body: Inter
      display: Source Serif 4
    wordmark:
    - text: Chiaro
      color: primary
    - text: Referto
      color: accent
  header:
    links:
    - label: Come funziona
      href: '#come-funziona'
    - label: Garanzie
      href: '#garanzie'
    cta:
      label: Accedi
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin struttura
      assignedBy: admin_emails
    - key: medico
      label: Medico
      assignedBy: invite
    - key: paziente
      label: Paziente
      assignedBy: signup
  limits:
  - action: agent:analista
    per: user
    max: 30
    window: day
  - action: chat
    per: user
    max: 40
    window: day
    roles:
    - paziente
  agents:
  - key: analista
    role: main
    description: Estrae valori, diagnosi e indicazioni dal referto e salva una bozza per la revisione del medico.
    profile:
      inline:
        display_name: ChiaroReferto analista
        crews:
        - id: analista
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un assistente che prepara bozze per un medico. Non sostituisci il medico e non prendi decisioni
            cliniche. Leggi il testo del referto (esami del sangue, ecografie, visite specialistiche; non interpretare immagini).
            Estrai: valori misurati con unità e range di riferimento RIPORTATI NEL REFERTO, diagnosi/conclusioni e indicazioni.
            Confronta ogni valore solo con il range scritto nel referto: segna ''nella norma'', ''sopra'' o ''sotto''. Non
            inventare valori, range, diagnosi o date; se un dato manca scrivi ''non riportato''. Prepara: (1) valori: tabella
            Markdown; (2) spiegazione: testo in italiano semplice per il paziente, rassicurante ma onesto, senza diagnosi
            proprie, senza consigli terapeutici nuovi, che termina invitando a parlarne col medico; (3) piano: bozza di piano
            di cura per il medico con controlli suggeriti e motivazioni, marcata come BOZZA DA VALIDARE; (4) scadenze: una
            riga per controllo nel formato ''AAAA-MM-GG | descrizione'', solo se il referto o il buon senso clinico generico
            lo giustificano, calcolando dalla data odierna. Poi chiama UNA volta lo strumento salva_bozza con stato ''bozza''.
            La tua risposta finale è SOLO: ''# Referto in revisione'' e una riga che dice che il medico lo esaminerà prima
            che sia visibile al paziente. Non ripetere nella risposta alcun contenuto clinico.'
    goalTemplate: 'Tipo di referto: {tipo_label}

      Email paziente: {paziente_email}

      Email medico: {medico_email}

      Caricato da: {uploader_email}

      Consenso esplicito al trattamento: {?consenso}sì{/consenso}{!consenso}NON dato: non salvare nulla e spiegalo{/consenso}

      Data di oggi: {date}

      {?referto_text}Testo del referto (file):

      {referto_text}{/referto_text}

      {?testo}Testo incollato:

      {testo}{/testo}

      Scrivi in italiano (lingua {lang}).'
    context:
    - key: uploader_email
      from: user.email
    appTools:
    - name: salva_bozza
      description: Salva la bozza (valori, spiegazione, piano, scadenze) per la revisione del medico
      action: write
      collection: bozze
      scope: all
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.5
  - key: pubblicatore
    role: helper
    description: Dopo l'approvazione del medico pubblica il fascicolo e i controlli per il paziente.
    profile:
      inline:
        display_name: ChiaroReferto pubblicatore
        crews:
        - id: pubblicatore
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Pubblichi testi GIÀ approvati da un medico, senza modificarli. Prima cerca con cerca_fascicolo se
            esiste già un fascicolo con lo stesso bozza_id: in tal caso non fare nulla. Altrimenti chiama salva_fascicolo
            una volta con i campi forniti, poi salva_scadenza una volta per ogni riga ''AAAA-MM-GG | descrizione'' delle scadenze
            (se non ci sono righe valide, nessuna). Non aggiungere né inventare contenuti. Risposta finale: ''# Pubblicato''
            e una riga.'
    appTools:
    - name: cerca_fascicolo
      description: Cerca fascicoli già pubblicati
      action: search
      collection: fascicolo
      scope: all
    - name: salva_fascicolo
      description: Pubblica il fascicolo approvato per il paziente
      action: write
      collection: fascicolo
      scope: all
    - name: salva_scadenza
      description: Crea una scadenza di controllo per il paziente
      action: write
      collection: scadenze
      scope: all
    output: markdown
    limits:
      maxTurns: 15
      maxBudgetUsd: 0.4
  - key: assistente
    role: helper
    description: Risponde alle domande del paziente solo sul testo approvato dal medico.
    profile:
      inline:
        display_name: ChiaroReferto assistente
        chat_mode: true
        crews:
        - id: assistente
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: Aiuti un paziente a capire i propri referti. Rispondi SOLO in base ai fascicoli approvati dal medico,
            che leggi con leggi_fascicolo, in italiano semplice e breve. Non fare diagnosi, non suggerire terapie o cambi
            di cura, non interpretare valori oltre il testo approvato. Per ogni decisione o dubbio clinico, o se il fascicolo
            non contiene la risposta, invita a rivolgersi al proprio medico; in caso di sintomi gravi o urgenti, al 112/medico
            di guardia. Ricorda brevemente in ogni risposta che non sostituisci il medico.
    goalTemplate: 'Email del paziente: {email}

      Conversazione finora:

      {history}

      Nuova domanda: {message}

      Rispondi in italiano.'
    context:
    - key: email
      from: user.email
    appTools:
    - name: leggi_fascicolo
      description: Legge i fascicoli approvati del paziente
      action: read
      collection: fascicolo
      scope: all
    - name: leggi_scadenze
      description: Legge i controlli in programma del paziente
      action: read
      collection: scadenze
      scope: all
    output: markdown
    limits:
      maxTurns: 6
      maxBudgetUsd: 0.2
  inputForm:
    title: Nuovo referto
    fields:
    - name: paziente_email
      type: email
      required: true
      label: Email del paziente
    - name: medico_email
      type: email
      required: true
      label: Email del medico responsabile
      help: Se sei il medico, la tua email.
    - name: tipo
      type: select
      required: true
      label: Tipo di referto
      options:
      - value: sangue
        label: Esami del sangue
      - value: ecografia
        label: Ecografia
      - value: visita
        label: Visita specialistica
      - value: altro
        label: Altro
    - name: referto
      type: file
      accept:
      - pdf
      - txt
      - docx
      maxMb: 10
      multiple: false
      label: Referto (PDF o testo)
    - name: testo
      type: textarea
      maxLength: 8000
      label: Oppure incolla il testo del referto
    - name: consenso
      type: boolean
      required: true
      label: Confermo il consenso esplicito al trattamento del referto per questa finalità
      help: Il medico che carica conferma che il consenso del paziente è stato raccolto.
  data:
    collections:
    - name: bozze
      ownedBy: org
      description: Bozze generate dall'agente, visibili solo al medico responsabile
      fields:
      - name: paziente_email
        type: email
        required: true
        label: Paziente
      - name: medico_email
        type: email
        required: true
        label: Medico
      - name: uploader_email
        type: email
        label: Caricato da
      - name: tipo
        type: text
        label: Tipo
      - name: consenso
        type: boolean
        label: Consenso
      - name: valori
        type: textarea
        label: Valori e confronto con i range
      - name: spiegazione
        type: textarea
        label: Spiegazione per il paziente
      - name: piano
        type: textarea
        label: Piano di cura (bozza)
      - name: scadenze
        type: textarea
        label: Scadenze (AAAA-MM-GG | descrizione)
      - name: stato
        type: select
        label: Stato
        options:
        - value: bozza
          label: Bozza
        - value: approvato
          label: Approvato
      access:
      - role: medico
        where:
          medico_email: '{user.email}'
        can:
        - read
        - write
      retentionDays: 1095
    - name: fascicolo
      ownedBy: org
      description: Fascicolo approvato dal medico, visibile al paziente
      fields:
      - name: paziente_email
        type: email
        required: true
      - name: medico_email
        type: email
        required: true
      - name: tipo
        type: text
        label: Tipo
      - name: valori
        type: textarea
        label: Valori
      - name: spiegazione
        type: textarea
        label: Spiegazione
      - name: piano
        type: textarea
        label: Piano di cura
      - name: bozza_id
        type: text
        label: Bozza di origine
      access:
      - role: paziente
        where:
          paziente_email: '{user.email}'
        can:
        - read
      - role: medico
        where:
          medico_email: '{user.email}'
        can:
        - read
      retentionDays: 3650
    - name: scadenze
      ownedBy: org
      description: Calendario dei controlli
      fields:
      - name: paziente_email
        type: email
        required: true
      - name: medico_email
        type: email
      - name: data
        type: date
        required: true
        label: Data
      - name: titolo
        type: text
        label: Controllo
      access:
      - role: paziente
        where:
          paziente_email: '{user.email}'
        can:
        - read
      - role: medico
        where:
          medico_email: '{user.email}'
        can:
        - read
      retentionDays: 3650
  views:
  - key: home
    type: page
    nav: false
    title: ChiaroReferto
    sections:
    - type: hero
      title: Il tuo referto, spiegato **chiaramente**.
      text: 'Il medico carica il referto, un agente prepara una spiegazione semplice e una bozza di piano di cura. Il medico
        legge, corregge e approva: solo allora il testo arriva a te, con il calendario dei controlli.'
      actions:
      - label: Accedi
        href: /login
        style: primary
      note: Non sostituisce il medico.
    - type: steps
      id: come-funziona
      title: Come funziona
      items:
      - title: Caricamento
        text: Il medico, o il paziente dopo il consenso esplicito, carica il referto in testo o PDF.
      - title: Bozza dell'agente
        text: Valori confrontati con i range del referto, spiegazione semplice e bozza del piano di cura.
      - title: Revisione del medico
        text: Il medico legge, corregge e approva. Fino ad allora il paziente non vede nulla.
      - title: Il tuo fascicolo
        text: Spiegazione, calendario dei controlli, promemoria via email e chat sul testo approvato.
    - type: cards
      id: garanzie
      title: Garanzie
      items:
      - title: Privacy
        text: Ogni paziente vede solo i propri referti, ogni medico solo i propri pazienti.
      - title: Il medico decide
        text: Nessuna decisione clinica è automatica; la chat rimanda sempre al medico.
      - title: Ambito
        text: 'Solo strato informativo e gestionale: nessuna integrazione con sistemi ospedalieri, nessuna lettura di immagini
          diagnostiche.'
    - type: note
      content: ChiaroReferto è uno strumento di supporto informativo e non sostituisce il parere del medico. In emergenza
        chiama il 112.
  - key: nuovo_referto
    type: new_run
    title: Nuovo referto
    roles:
    - paziente
    - medico
    - admin
  - key: miei_invii
    type: history
    title: I miei invii
    source: run
    roles:
    - paziente
    - medico
    - admin
  - key: invio
    type: report
    source: run
    nav: false
  - key: bozze_da_rivedere
    type: table
    title: Bozze da rivedere
    source: collection:bozze
    columns:
    - paziente_email
    - tipo
    - stato
    roles:
    - medico
    - admin
  - key: revisione
    type: form
    title: Revisione e approvazione
    collection: bozze
    fields:
    - valori
    - spiegazione
    - piano
    - scadenze
    - stato
    edit: true
    submit:
      label: Salva
      message: Salvato. Se hai impostato 'Approvato' il fascicolo viene pubblicato al paziente.
      redirect: bozze_da_rivedere
    roles:
    - medico
    nav: false
  - key: fascicolo_view
    type: cards
    title: Il mio fascicolo
    source: collection:fascicolo
    columns:
    - tipo
    - spiegazione
    - piano
    roles:
    - paziente
    - medico
  - key: calendario
    type: table
    title: Calendario dei controlli
    source: collection:scadenze
    columns:
    - data
    - titolo
    - paziente_email
    roles:
    - paziente
    - medico
    export: true
  - key: chat
    type: chat
    title: Domande sul referto
    source: agent:assistente
    examples:
    - Cosa significa il mio ultimo esame?
    - Quando è il prossimo controllo?
    placeholder: Scrivi una domanda sul tuo referto approvato
    roles:
    - paziente
  - key: account
    type: account
    title: Licenza
    roles:
    - admin
  triggers:
  - key: bozza_pronta
    'on':
      collection: bozze
      op: insert
    notify:
      to:
      - record.medico_email
      subject: Nuovo referto da rivedere
      body: È disponibile una bozza di spiegazione e piano di cura da rivedere e approvare.
      link: bozze_da_rivedere
  - key: approvata
    'on':
      collection: bozze
      op: update
      where:
        stato: approvato
    start:
      agent: pubblicatore
    goal: 'Pubblica il fascicolo approvato. bozza_id: {record.id}. paziente_email: {record.paziente_email}. medico_email:
      {record.medico_email}. tipo: {record.tipo}.

      Valori:

      {record.valori}

      Spiegazione:

      {record.spiegazione}

      Piano:

      {record.piano}

      Scadenze:

      {record.scadenze}'
  - key: fascicolo_nuovo
    'on':
      collection: fascicolo
      op: insert
    notify:
      to:
      - record.paziente_email
      subject: Il tuo referto è disponibile
      body: Il tuo medico ha approvato la spiegazione del tuo referto. Puoi leggerla nel tuo fascicolo.
      link: fascicolo_view
  - key: promemoria
    'on':
      date:
        collection: scadenze
        field: data
        offsetDays: -3
        hour: 8
    notify:
      to:
      - record.paziente_email
      subject: 'Promemoria controllo: {record.titolo}'
      body: 'Tra tre giorni, il {record.data}: {record.titolo}. Per dubbi rivolgiti al tuo medico.'
      link: calendario
  notifications:
    emailOnRunDone: false
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: struttura
      price: 299
      interval: month
      label: Licenza per struttura
      includes:
      - medici e pazienti illimitati della struttura
      - analisi referti incluse nei limiti d'uso equo
      roles:
      - admin
  extensions:
  - key: audit_accessi
    description: 'Registro degli accessi ai referti (chi, quando, quale record) consultabile dall''admin della struttura:
      da attivare a livello di piattaforma, non esprimibile nel manifest.'
  - key: associazione_struttura
    description: 'Licenza per struttura con più medici: l''admin invita i medici; la separazione tra strutture diverse richiede
      un''istanza dell''app per struttura.'
