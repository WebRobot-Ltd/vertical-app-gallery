apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: ordinapronto
  displayName: OrdinaPronto
  tagline:
    it: Gli ordini dei negozianti, dalla chat all'ERP, con l'approvazione del tuo agente di vendita.
    fr: Les commandes des détaillants, du chat à l'ERP, avec l'approbation de votre commercial.
  description:
    it: 'Gestionale con assistente AI per distributori all''ingrosso: il negoziante scrive l''ordine come vuole, l''AI lo
      abbina al catalogo, un secondo agente controlla prezzi e fido, l''agente di vendita approva.'
    fr: 'Gestion avec assistant IA pour grossistes : le détaillant écrit sa commande librement, l''IA la rapproche du catalogue,
      un second agent contrôle prix et encours, le commercial approuve.'
  langs:
  - it
  - fr
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#16324f'
      accent: '#e07a1f'
      background: '#f6f7f9'
      foreground: '#1a2230'
    fonts:
      body: Inter
      display: Manrope
    wordmark:
    - text: Ordina
      color: primary
    - text: Pronto
      color: accent
    width: wide
  header:
    links:
    - label:
        it: Come funziona
        fr: Comment ça marche
      href: '#come-funziona'
    cta:
      label:
        it: Accedi
        fr: Connexion
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label:
        it: Distributore
        fr: Distributeur
      assignedBy: admin_emails
    - key: sales
      label:
        it: Agente di vendita
        fr: Commercial
      assignedBy: invite
    - key: customer
      label:
        it: Cliente negoziante
        fr: Client détaillant
      assignedBy: signup
  limits:
  - action: chat
    per: user
    max: 200
    window: day
    roles:
    - customer
  - action: agent:assistant
    per: user
    max: 30
    window: day
    roles:
    - customer
  agents:
  - key: assistant
    role: main
    description: Reads the shopkeeper's free-text, WhatsApp paste or photo, matches items to the catalogue and writes a draft
      order.
    profile:
      inline:
        display_name: OrdinaPronto assistente ordini
        crews:
        - id: assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 14
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''assistente ordini di un distributore all''ingrosso (food, ferramenta, cosmetica). Parli con
            un negoziante, nella sua lingua (italiano o francese). Il negoziante scrive in modo libero, incolla messaggi WhatsApp
            o carica la foto di un elenco.


            Come lavori:

            1. Leggi il profilo del cliente con read_customer (fascia prezzo, agente assegnato, fido). Se ha caricato una
            foto o un file, chiama read_upload con l''id del file per leggerlo.

            2. Per ogni riga richiesta (quantità + articolo) cerca nel catalogo con search_products. Abbina per descrizione,
            codice e unità di vendita (cartone, pezzo, confezione). Se una frase come ''come la volta scorsa'' o ''il solito''
            compare, consulta lo storico con read_my_orders e usa le righe dell''ordine precedente.

            3. Usa il prezzo della fascia del cliente. Rispetta il minimo d''ordine e l''unità di vendita; se la quantità
            non è un multiplo o è sotto il minimo, segnalalo.

            4. Se un articolo è esaurito (giacenza insufficiente) o non lo trovi, proponi 1-2 alternative del catalogo e dillo
            chiaramente. Se l''abbinamento è ambiguo, chiedi conferma invece di indovinare.

            5. Quando le righe sono chiare, salva la bozza con save_draft_order: status ''draft'', customer_email, customer_name,
            agent_email del cliente, order_date di oggi (AAAA-MM-GG), lines [{code, description, qty, unit, price, line_total}],
            total, note.

            6. Rispondi con una tabella Markdown (codice, descrizione, quantità, unità, prezzo, totale riga), il totale, gli
            avvisi e le alternative. Spiega che può modificare la bozza nella pagina ''Le mie bozze'' e inviarla all''agente
            di vendita.


            Non inventare mai articoli, codici, prezzi o giacenze: usa solo ciò che trovi negli strumenti. Non confermare
            l''ordine: lo approva l''agente di vendita. Se il negoziante non è un cliente registrato, dillo e non salvare
            nulla.'
          mcp_servers: []
    goalTemplate: 'Cliente: {user}. Data di oggi: {date}. Lingua: {lang}.

      {?history}Conversazione finora:

      {history}{/history}

      {?message}Messaggio del cliente: {message}{/message}

      {?photo}File caricati (usa read_upload): {photo}{/photo}

      {?photo_text}Testo dei file:

      {photo_text}{/photo_text}'
    appTools:
    - name: read_customer
      description: 'Customer profile: price tier, credit limit, used credit, assigned sales agent'
      action: read
      collection: customers
      scope: all
    - name: search_products
      description: Search the catalogue by code or description (unit, price per tier, stock, minimum order)
      action: search
      collection: products
      scope: all
    - name: read_my_orders
      description: The customer's previous orders
      action: read
      collection: orders
      scope: user
    - name: save_draft_order
      description: Save a draft order for the customer
      action: write
      collection: orders
      scope: user
    - name: read_upload
      description: Read a file the user uploaded (photo or document, OCR included)
      action: read_file
    output: markdown
    limits:
      maxTurns: 14
      maxBudgetUsd: 0.5
  - key: checker
    role: helper
    description: Checks list prices and remaining credit of a submitted order and flags anomalies.
    profile:
      inline:
        display_name: OrdinaPronto controllo ordini
        crews:
        - id: checker
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei il controllore degli ordini di un distributore. Ricevi un ordine inviato da un cliente. Verifica
            con gli strumenti:

            - ogni prezzo di riga coincide con il prezzo di listino della fascia del cliente (search_products_check, read_customer_check);

            - unità di vendita, minimo d''ordine e giacenza sono rispettati;

            - il totale è la somma delle righe;

            - totale + credit_used non supera credit_limit (fido residuo);

            - quantità o importi insolitamente alti rispetto allo storico (read_orders_check).

            Poi aggiorna l''ordine con update_order_check: status ''checked'' e anomalies, un elenco Markdown breve di cosa
            non torna (vuoto se tutto regolare, scrivi ''Nessuna anomalia''). Non modificare righe, prezzi o quantità e non
            approvare: decide l''agente di vendita. Non inventare dati. Rispondi con un riepilogo di 3-5 righe che inizi con
            ''# Controllo ordine''.'
          mcp_servers: []
    goalTemplate: 'Controlla questo ordine inviato dal cliente e aggiorna il record: {event}'
    appTools:
    - name: read_customer_check
      description: 'Customer profile: tier, credit limit, used credit'
      action: read
      collection: customers
      scope: all
    - name: search_products_check
      description: 'Catalogue lookup: list prices per tier, stock, minimum order'
      action: search
      collection: products
      scope: all
    - name: read_orders_check
      description: The customer's orders (history)
      action: read
      collection: orders
      scope: user
    - name: update_order_check
      description: Write status and anomalies on the order
      action: write
      collection: orders
      scope: user
    output: markdown
    limits:
      maxTurns: 10
      maxBudgetUsd: 0.3
  - key: importer
    role: setup
    description: Imports the catalogue from an Excel/CSV file uploaded by the distributor.
    profile:
      inline:
        display_name: OrdinaPronto import catalogo
        crews:
        - id: importer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Importi il catalogo di un distributore da un file Excel o CSV. Leggi il file con read_catalog_file
            (id del file). Colonne attese: codice articolo, descrizione, unità di vendita, prezzo per fascia cliente (A, B,
            C), giacenza, minimo d''ordine; riconosci nomi di colonna simili in italiano o francese. Per ogni riga valida
            salva un record con upsert_product: code, description, unit, price_a, price_b, price_c, stock, min_order, category
            se presente. Salta e riporta le righe senza codice o con prezzi non numerici. Non inventare valori mancanti. Termina
            con ''# Import catalogo'' e un riepilogo: righe importate, righe saltate con il motivo.'
          mcp_servers: []
    goalTemplate: 'Importa il catalogo dal file caricato: {event}'
    appTools:
    - name: read_catalog_file
      description: Read the uploaded catalogue file
      action: read_file
    - name: upsert_product
      description: Create or update a catalogue article
      action: write
      collection: products
      scope: all
    output: markdown
    limits:
      maxTurns: 30
      maxBudgetUsd: 0.6
  inputForm:
    title:
      it: Ordine da WhatsApp o foto
      fr: Commande depuis WhatsApp ou photo
    fields:
    - name: message
      type: textarea
      maxLength: 4000
      label:
        it: Messaggio o elenco
        fr: Message ou liste
      help:
        it: Incolla qui il messaggio WhatsApp, oppure scrivi l'ordine
        fr: Collez ici le message WhatsApp, ou écrivez la commande
    - name: photo
      type: file
      accept:
      - pdf
      - jpg
      - jpeg
      - png
      - webp
      - txt
      maxMb: 10
      multiple: true
      label:
        it: Foto o file dell'elenco
        fr: Photo ou fichier de la liste
  data:
    collections:
    - name: products
      ownedBy: shared
      description: Catalogue synced from the ERP or imported from Excel
      searchable: true
      fields:
      - name: code
        type: text
        required: true
        label:
          it: Codice articolo
          fr: Code article
      - name: description
        type: text
        required: true
        label:
          it: Descrizione
          fr: Description
      - name: category
        type: select
        label:
          it: Settore
          fr: Secteur
        options:
        - value: food
          label: Food
        - value: hardware
          label:
            it: Ferramenta
            fr: Quincaillerie
        - value: cosmetics
          label:
            it: Cosmetica
            fr: Cosmétique
      - name: unit
        type: text
        label:
          it: Unità di vendita
          fr: Unité de vente
      - name: price_a
        type: number
        label:
          it: Prezzo fascia A
          fr: Prix tranche A
      - name: price_b
        type: number
        label:
          it: Prezzo fascia B
          fr: Prix tranche B
      - name: price_c
        type: number
        label:
          it: Prezzo fascia C
          fr: Prix tranche C
      - name: stock
        type: number
        label:
          it: Giacenza
          fr: Stock
      - name: min_order
        type: number
        label:
          it: Minimo d'ordine
          fr: Minimum de commande
    - name: customers
      ownedBy: org
      description: 'Shopkeeper customers managed by the distributor: tier, credit and assigned sales agent'
      access:
      - role: sales
        where:
          agent_email: '{user.email}'
        can:
        - read
      - role: customer
        where:
          email: '{user.email}'
        can:
        - read
      fields:
      - name: company
        type: text
        required: true
        label:
          it: Negozio
          fr: Magasin
      - name: email
        type: email
        required: true
        label:
          it: Email del cliente
          fr: Email du client
      - name: tier
        type: select
        required: true
        label:
          it: Fascia prezzo
          fr: Tranche de prix
        options:
        - A
        - B
        - C
      - name: credit_limit
        type: number
        label:
          it: Fido
          fr: Plafond de crédit
      - name: credit_used
        type: number
        label:
          it: Fido utilizzato
          fr: Encours utilisé
      - name: agent_email
        type: email
        required: true
        label:
          it: Email agente di vendita
          fr: Email du commercial
      - name: address
        type: text
        label:
          it: Indirizzo
          fr: Adresse
    - name: orders
      ownedBy: user
      description: 'Orders of each shopkeeper: draft, checked, approved'
      access:
      - role: sales
        where:
          agent_email: '{user.email}'
        can:
        - read
        - write
      fields:
      - name: customer_name
        type: text
        label:
          it: Cliente
          fr: Client
      - name: customer_email
        type: email
        label:
          it: Email cliente
          fr: Email client
      - name: agent_email
        type: email
        label:
          it: Agente
          fr: Commercial
      - name: order_date
        type: date
        label:
          it: Data
          fr: Date
      - name: lines
        type: array
        label:
          it: Righe
          fr: Lignes
        fields:
        - name: code
          type: text
          label:
            it: Codice
            fr: Code
        - name: description
          type: text
          label:
            it: Descrizione
            fr: Description
        - name: qty
          type: number
          label:
            it: Quantità
            fr: Quantité
        - name: unit
          type: text
          label:
            it: Unità
            fr: Unité
        - name: price
          type: number
          label:
            it: Prezzo
            fr: Prix
        - name: line_total
          type: number
          label:
            it: Totale riga
            fr: Total ligne
      - name: total
        type: number
        label:
          it: Totale
          fr: Total
      - name: status
        type: select
        label:
          it: Stato
          fr: Statut
        default: draft
        options:
        - value: draft
          label:
            it: Bozza
            fr: Brouillon
        - value: checked
          label:
            it: Da approvare
            fr: À approuver
        - value: approved
          label:
            it: Approvato
            fr: Approuvé
        - value: rejected
          label:
            it: Rifiutato
            fr: Refusé
      - name: submitted
        type: boolean
        label:
          it: Invia all'agente di vendita
          fr: Envoyer au commercial
      - name: anomalies
        type: textarea
        label:
          it: Anomalie
          fr: Anomalies
      - name: note
        type: textarea
        label:
          it: Note
          fr: Notes
      - name: agent_note
        type: textarea
        label:
          it: Nota dell'agente
          fr: Note du commercial
    - name: catalog_uploads
      ownedBy: org
      description: Excel/CSV catalogue files uploaded by the distributor
      fields:
      - name: file
        type: file
        required: true
        accept:
        - xlsx
        - csv
        maxMb: 15
        label:
          it: File catalogo (Excel/CSV)
          fr: Fichier catalogue (Excel/CSV)
  views:
  - key: home
    type: page
    nav: false
    title: OrdinaPronto
    sections:
    - type: hero
      layout: stack
      band: true
      eyebrow:
        it: Per distributori all'ingrosso
        fr: Pour grossistes
      title:
        it: Dal messaggio WhatsApp all'ordine in ERP, **senza ricopiare nulla**.
        fr: Du message WhatsApp à la commande dans l'ERP, **sans rien recopier**.
      text:
        it: Il negoziante scrive l'ordine come vuole, l'AI lo abbina al catalogo, controlla prezzi e fido, il tuo agente di
          vendita approva.
        fr: Le détaillant écrit sa commande librement, l'IA la rapproche du catalogue, contrôle prix et encours, votre commercial
          approuve.
      actions:
      - label:
          it: Accedi
          fr: Connexion
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        fr: Comment ça marche
      items:
      - title:
          it: Scrivi o fotografa
          fr: Écrivez ou photographiez
        text:
          it: 'Testo libero, messaggio WhatsApp incollato o foto dell''elenco: ''come la volta scorsa'' funziona.'
          fr: 'Texte libre, message WhatsApp collé ou photo de la liste : « comme la dernière fois » fonctionne.'
        badge: 💬
      - title:
          it: Bozza modificabile
          fr: Brouillon modifiable
        text:
          it: Articoli abbinati al catalogo, alternative se mancano, tabella da correggere.
          fr: Articles rapprochés du catalogue, alternatives en cas de rupture, tableau à corriger.
        badge: 📝
      - title:
          it: Controllo prezzi e fido
          fr: Contrôle prix et encours
        text:
          it: Un secondo agente segnala anomalie prima che l'ordine arrivi all'agente di vendita.
          fr: Un second agent signale les anomalies avant que la commande n'arrive au commercial.
        badge: 🔍
      - title:
          it: Approvazione e conferma
          fr: Approbation et confirmation
        text:
          it: L'agente di vendita approva o corregge; il cliente riceve l'email di conferma e l'ordine passa all'ERP.
          fr: Le commercial approuve ou corrige ; le client reçoit l'email de confirmation et la commande part vers l'ERP.
        badge: ✅
    - type: note
      content:
        it: OrdinaPronto · I dati di ogni negoziante sono visibili solo a lui, al suo agente di vendita e al distributore.
        fr: OrdinaPronto · Les données de chaque détaillant ne sont visibles que par lui, son commercial et le distributeur.
  - key: chat
    type: chat
    title:
      it: Chat ordini
      fr: Chat commandes
    source: agent:assistant
    examples:
    - it: 10 cartoni acqua naturale, 3 detersivo come la volta scorsa
      fr: 10 cartons d'eau plate, 3 lessive comme la dernière fois
    - it: Mi serve il solito ordine del lunedì
      fr: Il me faut la commande habituelle du lundi
    placeholder:
      it: Scrivi o incolla il tuo ordine…
      fr: Écrivez ou collez votre commande…
    roles:
    - customer
  - key: photo_order
    type: new_run
    title:
      it: Ordine da foto o file
      fr: Commande par photo ou fichier
    roles:
    - customer
  - key: run_history
    type: history
    title:
      it: Le mie richieste
      fr: Mes demandes
    source: run
    roles:
    - customer
    nav: false
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: my_drafts
    type: table
    title:
      it: Le mie bozze e ordini
      fr: Mes brouillons et commandes
    source: collection:orders
    columns:
    - order_date
    - total
    - status
    - anomalies
    - note
    export: true
    roles:
    - customer
  - key: edit_order
    type: form
    title:
      it: Modifica bozza
      fr: Modifier le brouillon
    collection: orders
    fields:
    - lines
    - note
    - submitted
    edit: true
    submit:
      label:
        it: Salva
        fr: Enregistrer
      message:
        it: Bozza salvata. Se hai spuntato l'invio, l'ordine va al controllo e poi al tuo agente.
        fr: Brouillon enregistré. Si l'envoi est coché, la commande passe au contrôle puis à votre commercial.
      redirect: my_drafts
    roles:
    - customer
    nav: false
  - key: queue
    type: table
    title:
      it: Coda da approvare
      fr: File à approuver
    source: collection:orders
    query: status = checked
    columns:
    - order_date
    - customer_name
    - total
    - anomalies
    - note
    roles:
    - sales
    - admin
  - key: review_order
    type: form
    title:
      it: Approva o correggi
      fr: Approuver ou corriger
    collection: orders
    fields:
    - lines
    - total
    - status
    - agent_note
    edit: true
    submit:
      label:
        it: Salva decisione
        fr: Enregistrer la décision
      message:
        it: Ordine aggiornato. Se approvato, il cliente riceve la conferma.
        fr: Commande mise à jour. Si approuvée, le client reçoit la confirmation.
      redirect: queue
    roles:
    - sales
    - admin
    nav: false
  - key: my_customers
    type: table
    title:
      it: I miei clienti
      fr: Mes clients
    source: collection:customers
    columns:
    - company
    - email
    - tier
    - credit_limit
    - credit_used
    roles:
    - sales
    - admin
  - key: all_orders
    type: table
    title:
      it: Tutti gli ordini
      fr: Toutes les commandes
    source: collection:orders
    columns:
    - order_date
    - customer_name
    - agent_email
    - total
    - status
    export: true
    roles:
    - admin
  - key: new_customer
    type: form
    title:
      it: Nuovo cliente
      fr: Nouveau client
    collection: customers
    submit:
      label:
        it: Salva cliente
        fr: Enregistrer le client
      message:
        it: Cliente salvato.
        fr: Client enregistré.
    edit: false
    roles:
    - admin
  - key: catalog
    type: table
    title:
      it: Catalogo
      fr: Catalogue
    source: collection:products
    columns:
    - code
    - description
    - unit
    - price_a
    - price_b
    - price_c
    - stock
    - min_order
    export: true
    roles:
    - admin
  - key: catalog_upload
    type: form
    title:
      it: Carica catalogo Excel
      fr: Importer le catalogue Excel
    collection: catalog_uploads
    submit:
      label:
        it: Importa
        fr: Importer
      message:
        it: 'File ricevuto: l''agente sta importando il catalogo.'
        fr: 'Fichier reçu : l''agent importe le catalogue.'
    edit: false
    roles:
    - admin
  - key: sales_dashboard
    type: page
    title:
      it: Ordinato per settimana
      fr: Commandes par semaine
    roles:
    - admin
    sections:
    - type: data
      title:
        it: Ordinato approvato per settimana
        fr: Commandes approuvées par semaine
      source: collection:orders
      display: chart
      chart: bar
      fields:
      - key: order_date
        label:
          it: Settimana
          fr: Semaine
      - key: total
        label:
          it: Ordinato
          fr: Commandé
      filters:
      - field: status
        op: '='
        value: approved
      groupBy:
        field: order_date
        bucket: week
        aggs:
        - key: total
          agg: sum
          field: total
    - type: data
      title:
        it: Indicatori
        fr: Indicateurs
      source: collection:orders
      display: kpi
      filters:
      - field: status
        op: '='
        value: approved
      kpis:
      - label:
          it: Ordini approvati
          fr: Commandes approuvées
        agg: count
      - label:
          it: Ordinato totale
          fr: Total commandé
        agg: sum
        field: total
        format: money
  - key: account
    type: account
    title:
      it: Abbonamento
      fr: Abonnement
    roles:
    - admin
  triggers:
  - key: check_submitted
    description: Check prices and credit when the customer submits a draft
    'on':
      collection: orders
      op: update
      where:
        submitted: true
        status: draft
    start:
      agent: checker
    goal: 'Ordine {record.id} di {record.customer_email} (agente {record.agent_email}), totale {record.total}. Righe: {record.lines}.
      Controllalo e aggiornalo.'
    asUser: true
  - key: notify_sales_checked
    'on':
      collection: orders
      op: update
      where:
        status: checked
    notify:
      to:
      - record.agent_email
      subject:
        it: 'Ordine da approvare: {record.customer_name}'
        fr: 'Commande à approuver : {record.customer_name}'
      body:
        it: 'Un ordine di {record.customer_name} da {record.total} EUR attende la tua approvazione.

          Anomalie: {record.anomalies}'
        fr: 'Une commande de {record.customer_name} de {record.total} EUR attend votre approbation.

          Anomalies : {record.anomalies}'
      link: queue
  - key: order_approved
    'on':
      collection: orders
      op: update
      where:
        status: approved
    notify:
      to:
      - record.customer_email
      subject:
        it: Ordine confermato del {record.order_date}
        fr: Commande confirmée du {record.order_date}
      body:
        it: Il tuo ordine di {record.total} EUR è stato approvato e trasmesso al gestionale del distributore.
        fr: Votre commande de {record.total} EUR a été approuvée et transmise au système du distributeur.
      link: my_drafts
  - key: order_rejected
    'on':
      collection: orders
      op: update
      where:
        status: rejected
    notify:
      to:
      - record.customer_email
      subject:
        it: Ordine non approvato
        fr: Commande non approuvée
      body:
        it: 'Il tuo ordine non è stato approvato. Nota dell''agente: {record.agent_note}'
        fr: 'Votre commande n''a pas été approuvée. Note du commercial : {record.agent_note}'
      link: my_drafts
  - key: import_catalog
    'on':
      collection: catalog_uploads
      op: insert
    start:
      agent: importer
    goal: 'Importa il catalogo dal file caricato (campo file): {event}'
    asUser: true
  - key: erp_catalog_sync
    description: Nightly ERP connector pushes one article per call
    'on':
      webhook: true
    write:
      collection: products
      fields:
        code: code
        description: description
        unit: unit
        category: category
        price_a: price_a
        price_b: price_b
        price_c: price_c
        stock: stock
        min_order: min_order
      keyBy: code
  exports:
  - path: /api/erp/orders
    source: collection:orders
    format: json
    access: token
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: starter
      price: 79
      interval: month
      label:
        it: Fino a 25 clienti attivi
        fr: Jusqu'à 25 clients actifs
      includes:
      - 25 active customers
      - unlimited orders
      roles:
      - admin
    - key: growth
      price: 199
      interval: month
      label:
        it: Fino a 100 clienti attivi
        fr: Jusqu'à 100 clients actifs
      includes:
      - 100 active customers
      - unlimited orders
      roles:
      - admin
    - key: scale
      price: 449
      interval: month
      label:
        it: Fino a 400 clienti attivi
        fr: Jusqu'à 400 clients actifs
      includes:
      - 400 active customers
      - unlimited orders
      roles:
      - admin
  extensions:
  - key: erp_connector
    description: Nightly ERP sync is exposed as a webhook (POST /api/hooks/erp_catalog_sync, one article per call) and approved
      orders are readable by the ERP at the token-protected /api/erp/orders; a push of the order into a specific ERP API needs
      its host and key, to be added once the ERP is known.
  - key: active_customers_metering
    description: The plan tiers match the number of active customers, but automatic enforcement or metering of the active-customer
      count is not available yet; the distributor chooses the tier.
