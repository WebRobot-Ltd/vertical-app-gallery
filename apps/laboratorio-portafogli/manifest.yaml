apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: laboratorio-portafogli
  displayName: Laboratorio Portafogli
  tagline:
    it: Impara le criptovalute simulando portafogli modello. Solo didattica.
    en: Learn crypto by simulating model portfolios. Education only.
  description:
    it: 'App didattica: questionario, portafogli modello, backtest su prezzi storici pubblici, grafici, lezioni e un''email
      mensile. Non gestiamo patrimoni, non custodiamo fondi, non eseguiamo ordini e non offriamo consulenza.'
    en: 'Educational app: questionnaire, model portfolios, backtests on public historical prices, charts, lessons and a monthly
      email. We do not manage assets, hold funds, execute orders or give advice.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12304a'
      accent: '#e08a1e'
      background: '#f7f8fa'
      foreground: '#18222d'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: 'Laboratorio '
      color: primary
    - text: Portafogli
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Avvertenze
        en: Disclaimer
      href: '#avvertenze'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
      - invest
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  limits:
  - action: agent:backtester
    per: user
    max: 3
    window: month
    roles:
    - user
    plans:
      pro: -1
  - action: agent:backtester
    per: user
    max: 20
    window: day
    roles:
    - user
  egress:
    hosts:
    - api.coingecko.com
    notes: CoinGecko public API for daily historical prices (bitcoin, ethereum, solana), used for education with attribution
      'Data by CoinGecko', within the public rate limits.
  slots:
  - key: backtest
    description: 'Backtest of a portfolio from aligned daily prices: return, volatility, max drawdown, comparison with Bitcoin'
    timeoutMs: 5000
    example:
      args:
        prices:
          btc:
          - 100
          - 110
          - 105
          - 120
          eth:
          - 10
          - 11
          - 10
          - 12
        weights:
          btc: 50
          eth: 30
          stable: 20
        rebalance_days: 0
    code: "import math\n\ndef _stats(vals):\n    rets = [vals[i]/vals[i-1]-1 for i in range(1, len(vals))]\n    n = len(rets)\n\
      \    mean = sum(rets)/n if n else 0.0\n    var = sum((r-mean)**2 for r in rets)/(n-1) if n > 1 else 0.0\n    peak =\
      \ vals[0]\n    mdd = 0.0\n    for v in vals:\n        peak = max(peak, v)\n        mdd = min(mdd, v/peak-1)\n    return\
      \ {\n        'return_pct': round((vals[-1]/vals[0]-1)*100, 2),\n        'volatility_pct': round(math.sqrt(var)*math.sqrt(365)*100,\
      \ 2),\n        'max_drawdown_pct': round(mdd*100, 2),\n    }\n\ndef main(input):\n    a = input.get('args') or input\n\
      \    prices = a.get('prices') or {}\n    w = {k: float(v) for k, v in (a.get('weights') or {}).items() if float(v) >\
      \ 0}\n    every = int(a.get('rebalance_days') or 0)\n    tot = sum(w.values())\n    if not w or tot <= 0:\n        return\
      \ {'error': 'no weights'}\n    w = {k: v/tot for k, v in w.items()}\n    lens = [len(v) for k, v in prices.items() if\
      \ k in w]\n    if 'btc' not in prices:\n        return {'error': 'btc prices required'}\n    n = min(lens + [len(prices['btc'])])\n\
      \    if n < 10:\n        return {'error': 'not enough prices'}\n    p = {k: v[-n:] for k, v in prices.items()}\n   \
      \ hold = dict(w)\n    series = [1.0]\n    for i in range(1, n):\n        for k in hold:\n            if k in p:\n  \
      \              hold[k] *= p[k][i]/p[k][i-1]\n        total = sum(hold.values())\n        if every and i % every == 0:\n\
      \            hold = {k: total*w[k] for k in w}\n        series.append(total)\n    res = _stats(series)\n    btc = [x/p['btc'][0]\
      \ for x in p['btc']]\n    b = _stats(btc)\n    res['btc_return_pct'] = b['return_pct']\n    res['btc_volatility_pct']\
      \ = b['volatility_pct']\n    res['btc_max_drawdown_pct'] = b['max_drawdown_pct']\n    res['days'] = n\n    step = max(1,\
      \ n//24)\n    idx = list(range(0, n, step))\n    if idx[-1] != n-1:\n        idx.append(n-1)\n    res['chart_index']\
      \ = idx\n    res['portfolio_series'] = [round(series[i]*100, 1) for i in idx]\n    res['btc_series'] = [round(btc[i]*100,\
      \ 1) for i in idx]\n    return res\n"
  agents:
  - key: backtester
    role: main
    description: Downloads daily prices from CoinGecko, runs the backtest with the app's calculator and writes an educational
      report.
    profile:
      inline:
        display_name: Backtester didattico
        crews:
        - id: backtester
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 20
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are an educational assistant of ''Laboratorio Portafogli''. You simulate model crypto portfolios
            on historical data. You do NOT give investment advice, do not recommend buying or selling, do not manage funds
            and do not execute orders. Past performance does not predict the future.


            PROCEDURE

            1. Weights: if the goal gives custom weights (btc, eth, stable, other in %), use them. Otherwise call read_portfolios
            and use the weights of the chosen model; if the collection is empty use defaults (btc/eth/stable/other %, rebalance
            days): prudente 30/15/50/5 with 90, bilanciato 45/25/20/10 with 90, dinamico 50/30/0/20 with 30. ''other'' is
            Solana.

            2. Prices: call coingecko_history with path ''/bitcoin/market_chart'', ''/ethereum/market_chart'' and (only if
            other>0) ''/solana/market_chart'', query ''vs_currency=eur&days=<days>&interval=daily''. The response has prices:
            [[timestamp, price], ...]. Stablecoins need no download (treated as flat at 1).

            3. Call run_backtest with args {"prices":{"btc":[...],"eth":[...],"other":[...]},"weights":{"btc":..,"eth":..,"stable":..,"other":..},"rebalance_days":<0
            none, 30 monthly, 90 quarterly, 365 yearly>}. Pass only price numbers, never invent or alter data. Never compute
            the metrics yourself: use the tool result.

            4. Write the report in the user''s language.


            REPORT STRUCTURE: first line ''# Backtest — <portfolio name>''. Sections with ## : Sintesi (what was tested, period,
            weights, rebalancing), Risultati (small table: return, volatility, max drawdown for the portfolio and for Bitcoin
            alone), Come leggere i numeri (plain explanation of volatility and drawdown), Confronto con la tua situazione
            (link the result to the questionnaire answers on horizon, risk tolerance and experience as a learning remark,
            never as a recommendation), Limiti (short period, one data source, no fees or taxes, past is not future). Add
            a chart block:

            ```chart

            {"type":"line","title":"Portafoglio vs Bitcoin (base 100)","labels":[...],"series":[{"name":"Portafoglio","values":[...]},{"name":"Solo
            Bitcoin","values":[...]}]}

            ```

            using portfolio_series and btc_series of the tool (labels = the day numbers from chart_index). Add a second bar
            chart comparing return, volatility and max drawdown. End with the attribution ''Prezzi: CoinGecko'' and a note
            that whoever wants to invest must use an authorised operator (CASP under MiCA).


            LAST: after the report output one final JSON block (fenced ```json) with keys: portfolio, weights (object), rebalance,
            return_pct, volatility_pct, max_drawdown_pct, btc_return_pct, btc_max_drawdown_pct, days, date.'
          mcp_servers: []
    context:
    - key: horizon
      from: collection:profiles.horizon
    - key: risk
      from: collection:profiles.risk_tolerance
    - key: experience
      from: collection:profiles.experience
    goalTemplate: 'Model: {portfolio_label}.

      Period: last {days_label}. Rebalancing: {rebalance_label}.

      {?btc}Custom weights in %: btc {btc}, eth {eth}, stable {stable}, other {other}.{/btc}{!btc}Use the weights of the chosen
      model.{/btc}

      Questionnaire of the user — horizon: {horizon}; risk tolerance: {risk}; experience: {experience}.

      Today is {date}. Write the report in the language with ISO code {lang}.'
    output: markdown+json
    resultSchema:
      type: object
      properties:
        portfolio:
          type: string
        weights:
          type: object
        rebalance:
          type: string
        return_pct:
          type: number
        volatility_pct:
          type: number
        max_drawdown_pct:
          type: number
        btc_return_pct:
          type: number
        btc_max_drawdown_pct:
          type: number
        days:
          type: number
        date:
          type: string
    writesTo:
      collection: simulations
      parse: json_last
    appTools:
    - name: read_portfolios
      description: Read the model portfolios (weights and rebalancing rules)
      action: read
      collection: model_portfolios
      scope: all
    - name: coingecko_history
      description: Daily historical prices from CoinGecko. Path e.g. /bitcoin/market_chart, query vs_currency=eur&days=365&interval=daily
      action: http
      http:
        method: GET
        url: https://api.coingecko.com/api/v3/coins
        allowPath: true
        attribution: Data by CoinGecko
    - name: run_backtest
      description: Compute return, volatility, max drawdown and Bitcoin comparison from aligned daily prices and weights
      action: call
      slot: backtest
    limits:
      maxTurns: 20
      maxBudgetUsd: 0.8
      timeoutSeconds: 600
  - key: digest
    role: scheduled
    description: Monthly summary of the model portfolios and a plain explanation of what happened on the market.
    profile:
      inline:
        display_name: Cronista mensile didattico
        crews:
        - id: digest
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 20
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write the monthly educational digest of ''Laboratorio Portafogli''. No advice, no buy/sell suggestions,
            no price predictions. Read the model portfolios with read_portfolios (defaults if empty: prudente 30/15/50/5,
            bilanciato 45/25/20/10, dinamico 50/30/0/20 for btc/eth/stable/other %, rebalance 90 days; ''other'' is Solana).
            Download the last 90 days of daily prices with coingecko_history (path ''/bitcoin/market_chart'', ''/ethereum/market_chart'',
            ''/solana/market_chart'', query ''vs_currency=eur&days=90&interval=daily''; prices: [[ts, price],...]) and call
            run_backtest for each model (args {prices:{btc,eth,other},weights,rebalance_days}). Use only tool figures. Write
            in Italian. Start with ''# Andamento dei portafogli modello — <mese anno>''. Sections: ## Cosa è successo sul
            mercato (simple language, only what the price data shows: Bitcoin, Ether, Solana moves), ## I portafogli modello
            (table: model, return, volatility, max drawdown, vs Bitcoin), ## Da imparare questo mese (one concept explained
            simply), ## Avvertenze (educational only, past is not future; to invest use an authorised operator). Add a bar
            chart block of returns. Under 450 words. End with ''Prezzi: CoinGecko''.'
          mcp_servers: []
    goalTemplate: 'Write the monthly digest. Today is {date}. Language: Italian.'
    output: markdown
    writesTo:
      collection: market_digest
      parse: whole
    appTools:
    - name: read_portfolios
      description: Read the model portfolios (weights and rebalancing rules)
      action: read
      collection: model_portfolios
      scope: all
    - name: coingecko_history
      description: Daily historical prices from CoinGecko. Path e.g. /bitcoin/market_chart, query vs_currency=eur&days=365&interval=daily
      action: http
      http:
        method: GET
        url: https://api.coingecko.com/api/v3/coins
        allowPath: true
        attribution: Data by CoinGecko
    - name: run_backtest
      description: Compute return, volatility, max drawdown and Bitcoin comparison from aligned daily prices and weights
      action: call
      slot: backtest
    limits:
      maxTurns: 20
      maxBudgetUsd: 0.8
      timeoutSeconds: 600
  schedules:
  - agent: digest
    action: run
    cron: 0 7 1 * *
    owner: app
    goal: Write the monthly digest of the model portfolios.
    deliver:
      to: role:user
      subject: Laboratorio Portafogli — andamento dei portafogli modello
      onlyIfNew: true
  inputForm:
    title:
      it: Nuovo backtest
      en: New backtest
    fields:
    - name: portfolio
      type: select
      required: true
      label:
        it: Portafoglio modello
        en: Model portfolio
      default: bilanciato
      options:
      - value: prudente
        label:
          it: Prudente
          en: Prudent
      - value: bilanciato
        label:
          it: Bilanciato
          en: Balanced
      - value: dinamico
        label:
          it: Dinamico
          en: Dynamic
      - value: personalizzato
        label:
          it: Personalizzato (pesi qui sotto)
          en: Custom (weights below)
    - name: btc
      type: number
      label:
        it: Bitcoin %
        en: Bitcoin %
      help:
        it: 'Solo per il personalizzato: i pesi devono sommare 100'
        en: 'Custom only: weights must sum to 100'
    - name: eth
      type: number
      label:
        it: Ether %
        en: Ether %
    - name: stable
      type: number
      label:
        it: Stablecoin %
        en: Stablecoins %
    - name: other
      type: number
      label:
        it: Altri asset (Solana) %
        en: Other assets (Solana) %
    - name: rebalance
      type: select
      required: true
      label:
        it: Ribilanciamento
        en: Rebalancing
      default: quarterly
      options:
      - value: none
        label:
          it: Nessuno
          en: None
      - value: monthly
        label:
          it: Mensile
          en: Monthly
      - value: quarterly
        label:
          it: Trimestrale
          en: Quarterly
      - value: yearly
        label:
          it: Annuale
          en: Yearly
    - name: days
      type: select
      required: true
      label:
        it: Periodo
        en: Period
      default: '365'
      options:
      - value: '180'
        label:
          it: Ultimi 6 mesi
          en: Last 6 months
      - value: '365'
        label:
          it: Ultimo anno
          en: Last year
  data:
    collections:
    - name: profiles
      ownedBy: user
      description: Questionnaire answers of each user
      retentionDays: 730
      fields:
      - name: horizon
        type: select
        required: true
        label:
          it: Orizzonte temporale
          en: Time horizon
        options:
        - value: under_2y
          label:
            it: Meno di 2 anni
            en: Under 2 years
        - value: 2_5y
          label:
            it: 2–5 anni
            en: 2–5 years
        - value: over_5y
          label:
            it: Oltre 5 anni
            en: Over 5 years
      - name: risk_tolerance
        type: select
        required: true
        label:
          it: Tolleranza al rischio
          en: Risk tolerance
        options:
        - value: low
          label:
            it: 'Bassa: non accetto perdite forti'
            en: Low
        - value: medium
          label:
            it: 'Media: accetto oscillazioni moderate'
            en: Medium
        - value: high
          label:
            it: 'Alta: accetto perdite anche superiori al 50%'
            en: High
      - name: experience
        type: select
        required: true
        label:
          it: Esperienza con le criptovalute
          en: Crypto experience
        options:
        - value: none
          label:
            it: Nessuna
            en: None
        - value: some
          label:
            it: Qualche conoscenza
            en: Some
        - value: expert
          label:
            it: Esperto
            en: Expert
    - name: simulations
      ownedBy: user
      description: Each user's own backtest results
      retentionDays: 730
      fields:
      - name: portfolio
        type: text
        label:
          it: Portafoglio
          en: Portfolio
      - name: return_pct
        type: number
        label:
          it: Rendimento %
          en: Return %
      - name: volatility_pct
        type: number
        label:
          it: Volatilità %
          en: Volatility %
      - name: max_drawdown_pct
        type: number
        label:
          it: Massima perdita %
          en: Max drawdown %
      - name: btc_return_pct
        type: number
        label:
          it: Solo Bitcoin %
          en: Bitcoin only %
      - name: date
        type: text
        label:
          it: Data
          en: Date
    - name: model_portfolios
      ownedBy: shared
      description: 'Model portfolios kept by the admins (data page): name, label, risk_level, btc, eth, stable, other (weights
        %), rebalance_days, description'
      fields:
      - name: name
        type: text
        required: true
      - name: label
        type: text
      - name: risk_level
        type: select
        options:
        - low
        - medium
        - high
      - name: btc
        type: number
      - name: eth
        type: number
      - name: stable
        type: number
      - name: other
        type: number
      - name: rebalance_days
        type: number
      - name: description
        type: textarea
    - name: lessons
      ownedBy: shared
      description: Lessons kept by the admins
      fields:
      - name: title
        type: text
        required: true
      - name: level
        type: select
        options:
        - base
        - intermediate
        - advanced
      - name: content
        type: textarea
    - name: operators
      ownedBy: shared
      description: Authorised operators (CASP) the admins list for users who want to invest for real
      fields:
      - name: name
        type: text
        required: true
      - name: country
        type: text
      - name: register_url
        type: url
        label: Register entry
      - name: website
        type: url
    - name: market_digest
      ownedBy: app
      description: Monthly digests written by the scheduled agent
      retentionDays: 1095
  views:
  - key: home
    type: page
    nav: false
    title: Laboratorio Portafogli
    sections:
    - type: hero
      title:
        it: Capisci le **criptovalute** simulando portafogli modello
        en: Understand **crypto** by simulating model portfolios
      text:
        it: 'Rispondi a un breve questionario, prova portafogli prudente, bilanciato e dinamico su prezzi storici reali, modifica
          i pesi e guarda i risultati nei grafici. Solo didattica: nessuna gestione di patrimoni, nessun ordine.'
        en: Answer a short questionnaire, test prudent, balanced and dynamic portfolios on real historical prices, change
          the weights and see the results in charts. Education only.
      actions:
      - label:
          it: Inizia
          en: Start
        href: /login
        style: primary
      - label:
          it: Vuoi investire davvero?
          en: Want to invest for real?
        href: /v/invest
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Questionario
          en: Questionnaire
        text:
          it: Orizzonte, tolleranza al rischio ed esperienza.
          en: Horizon, risk tolerance and experience.
        badge: 📝
      - title:
          it: Backtest
          en: Backtest
        text:
          it: Rendimento, volatilità, massima perdita e confronto con il solo Bitcoin.
          en: Return, volatility, max drawdown and comparison with Bitcoin only.
        badge: 📈
      - title:
          it: Email mensile e lezioni
          en: Monthly email and lessons
        text:
          it: Cosa è successo sul mercato, spiegato in modo semplice.
          en: What happened on the market, explained simply.
        badge: ✉️
    - type: cards
      title:
        it: Piani
        en: Plans
      items:
      - title: Free
        text:
          it: 3 backtest al mese, email mensile.
          en: 3 backtests a month, monthly email.
      - title: Pro — 9,90 €/mese
        text:
          it: Backtest illimitati e tutte le lezioni.
          en: Unlimited backtests and all lessons.
    - type: note
      id: avvertenze
      content:
        it: 'Servizio puramente informativo e didattico. Non è consulenza in materia di investimenti, non gestiamo patrimoni,
          non custodiamo fondi e non eseguiamo ordini: attività riservate a prestatori di servizi per le cripto-attività autorizzati.
          Le performance passate non indicano risultati futuri; le criptovalute possono far perdere tutto il capitale. Prezzi:
          CoinGecko.'
        en: 'Purely informational and educational. Not investment advice; we do not manage assets, hold funds or execute orders,
          which are reserved to authorised crypto-asset service providers. Past performance does not predict future results;
          crypto can lose all of its value. Prices: CoinGecko.'
  - key: questionnaire
    type: form
    title:
      it: Questionario
      en: Questionnaire
    collection: profiles
    edit: false
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Risposte salvate. Ora prova un backtest.
        en: Saved. Now try a backtest.
      redirect: new_backtest
    roles:
    - user
    - admin
  - key: models
    type: cards
    title:
      it: Portafogli modello
      en: Model portfolios
    source: collection:model_portfolios
    roles:
    - user
    - admin
  - key: new_backtest
    type: new_run
    title:
      it: Nuovo backtest
      en: New backtest
    roles:
    - user
    - admin
  - key: history
    type: history
    title:
      it: I miei backtest
      en: My backtests
    source: run
    roles:
    - user
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: results
    type: page
    title:
      it: I miei risultati
      en: My results
    roles:
    - user
    - admin
    sections:
    - type: data
      title:
        it: 'Rendimento: portafoglio vs solo Bitcoin'
        en: 'Return: portfolio vs Bitcoin only'
      source: collection:simulations
      display: chart
      chart: bar
      fields:
      - key: portfolio
        label:
          it: Portafoglio
          en: Portfolio
      - key: return_pct
        label:
          it: Rendimento %
          en: Return %
      - key: btc_return_pct
        label:
          it: Solo Bitcoin %
          en: Bitcoin only %
      limit: 12
      empty:
        it: Nessun backtest ancora.
        en: No backtest yet.
    - type: data
      title:
        it: Rischio
        en: Risk
      source: collection:simulations
      display: chart
      chart: bar
      fields:
      - key: portfolio
      - key: volatility_pct
        label:
          it: Volatilità %
          en: Volatility %
      - key: max_drawdown_pct
        label:
          it: Massima perdita %
          en: Max drawdown %
      limit: 12
    - type: data
      title:
        it: Tutte le simulazioni
        en: All simulations
      source: collection:simulations
      display: table
      fields:
      - key: date
        format: date
      - key: portfolio
      - key: return_pct
        format: number
      - key: volatility_pct
        format: number
      - key: max_drawdown_pct
        format: number
      - key: btc_return_pct
        format: number
      sort:
        field: date
        dir: desc
      limit: 50
  - key: digest_view
    type: cards
    title:
      it: Andamento mensile
      en: Monthly update
    source: collection:market_digest
    roles:
    - user
