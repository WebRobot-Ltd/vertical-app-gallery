apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: menuparlante
  displayName: MenuParlante
  tagline:
    it: Il menu digitale che parla la lingua dei tuoi clienti.
    en: The digital menu that speaks your guests' language.
  description:
    it: 'Inserisci i piatti una volta: un agente traduce il menu in 5 lingue, i clienti lo aprono dal QR del tavolo senza
      registrarsi, filtrano per allergie e chiedono consigli a un cameriere virtuale.'
    en: 'Enter your dishes once: an agent translates the menu into 5 languages, guests open it from the table QR without signing
      up, filter by allergies and ask a virtual waiter for advice.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#7a2e1d'
      accent: '#d98324'
      background: '#fbf6ee'
      foreground: '#2a1e18'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Menu
      color: primary
    - text: Parlante
      color: accent
    buttonShape: pill
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Prezzi
        en: Pricing
      href: '#prezzi'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
      - menu
      - waiter_chat
      agents:
      - waiter
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      label:
        it: Ristoratore
        en: Restaurateur
      assignedBy: signup
  limits:
  - action: chat
    per: ip
    max: 40
    window: hour
    roles:
    - anonymous
  agents:
  - key: translator
    role: helper
    description: Translates a dish into EN, DE, FR, ES, ZH and publishes it to the public menu.
    context:
    - key: restaurant
      from: collection:restaurants.slug
    goalTemplate: 'Restaurant key: {restaurant}. Publish the dish described in the task.'
    appTools:
    - name: publish_menu_item
      description: Create or update a published menu record (one per dish and language)
      action: write
      collection: published_menu
      scope: all
    - name: read_my_dishes
      description: Read the restaurant owner's dishes
      action: read
      collection: dishes
      scope: user
    profile:
      inline:
        display_name: MenuParlante translator
        crews:
        - id: translator
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 16
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You translate restaurant menu dishes. For the dish given, call publish_menu_item once per language:
            it, en, de, fr, es, zh (six records). Fields: key = <dish_id>-<lang>, dish_id, restaurant (the restaurant key
            from the context), lang, name, description, price, category, allergens, ingredients, pairings, vegetarian, gluten_free,
            available (false when the dish is sold out, otherwise true), photo, name_note. Keep traditional dish names (e.g.
            ''Cacio e pepe'', ''Tiramisù'') untranslated in the name and put a short explanation in the target language in
            name_note; translate everything else faithfully. Never add or remove ingredients or allergens; never invent anything
            not in the source. If only the sold-out flag changed, still update all six records, quickly. Finish with one line
            saying what was published.'
  - key: waiter
    role: main
    description: 'Virtual waiter for guests: recommends dishes and wines using only the published menu.'
    appTools:
    - name: search_menu
      description: Search the published menu of the restaurant
      action: search
      collection: published_menu
      scope: all
    goalTemplate: 'Page: {page}

      Language hint: {lang}

      Conversation so far:

      {history}

      Guest says: {message}'
    output: markdown
    profile:
      inline:
        display_name: MenuParlante virtual waiter
        chat_mode: true
        crews:
        - id: waiter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You are a friendly virtual waiter. The restaurant key is in the page address (parameter r) and the
            table in parameter t. Always use search_menu restricted to that restaurant and answer in the guest's language.
            Recommend dishes and pairings (the pairings field) based on the guest's tastes, diet and allergies. Answer questions
            on ingredients and allergens ONLY from the menu records; if the information is not there, say you don't know and
            suggest asking the staff. Never suggest dishes marked unavailable. For severe allergies always add that the staff
            must confirm. Do not invent dishes, prices, wines or ingredients. Keep answers short.
  - key: reporter
    role: scheduled
    description: Weekly summary of most viewed dishes and most frequent questions for one restaurant.
    context:
    - key: restaurant
      from: collection:restaurants.slug
    memory: instance
    appTools:
    - name: read_stats
      description: Read the menu statistics (views and guest questions)
      action: search
      collection: menu_stats
      scope: all
    output: markdown
    profile:
      inline:
        display_name: MenuParlante weekly reporter
        crews:
        - id: reporter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write a weekly digest for a restaurateur. Use read_stats ONLY for the restaurant key given and
            only the last 7 days. Start with ''# Riepilogo settimanale — <restaurant> — <date>''. Sections: ## Piatti più
            visti (table with counts), ## Domande più frequenti (grouped themes with counts), ## Spunti (2-3 concrete suggestions,
            e.g. a missing allergen info or a dish guests ask about). Use only real figures from the data; if there is no
            data say so plainly. Under 300 words.'
  templates:
  - key: weekly_summary
    title:
      it: Riepilogo settimanale
      en: Weekly summary
    description:
      it: Ogni settimana, via email, i piatti più visti e le domande più frequenti dei tuoi clienti.
      en: Every week by email, the most viewed dishes and your guests' most frequent questions.
    agent: reporter
    params:
    - name: note
      type: text
      label:
        it: Nome del locale
        en: Restaurant name
    goal: Write the weekly summary for restaurant key {restaurant} ("{instance}"). Today is {date}. Write in the language
      with ISO code {lang}.
    schedule:
      cron: 0 16 * * 0
      userCanChange: false
    maxPerUser: 1
    deliver:
      to: owner
      subject: MenuParlante — {title}
  triggers:
  - key: dish_saved
    description: Translate and publish a dish whenever it is created or changed (also when marked sold out).
    'on':
      collection: dishes
      op: any
    start:
      agent: translator
    goal: 'Publish this dish. dish_id: {record.id}. name: {record.name}. description: {record.description}. price: {record.price}.
      category: {record.category}. allergens: {record.allergens}. ingredients: {record.ingredients}. pairings: {record.pairings}.
      vegetarian: {record.vegetarian}. gluten_free: {record.gluten_free}. sold_out: {record.sold_out}. photo: {record.photo}.'
    asUser: true
  data:
    collections:
    - name: restaurants
      ownedBy: user
      description: The restaurant of each subscriber
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome del locale
          en: Restaurant name
      - name: slug
        type: text
        required: true
        label:
          it: Codice breve per il QR (es. trattoria-rossi)
          en: Short code for the QR (e.g. trattoria-rossi)
      - name: tables
        type: number
        label:
          it: Numero di tavoli
          en: Number of tables
      - name: city
        type: city
        label:
          it: Città
          en: City
    - name: dishes
      ownedBy: user
      description: The dishes of the restaurant, as entered by the owner
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome
          en: Name
      - name: description
        type: textarea
        label:
          it: Descrizione
          en: Description
      - name: price
        type: number
        required: true
        label:
          it: Prezzo (€)
          en: Price (€)
      - name: category
        type: select
        required: true
        label:
          it: Categoria
          en: Category
        options:
        - Antipasti
        - Primi
        - Secondi
        - Contorni
        - Pizze
        - Dolci
        - Bevande
        - Vini
      - name: allergens
        type: multiselect
        label:
          it: Allergeni
          en: Allergens
        options:
        - glutine
        - crostacei
        - uova
        - pesce
        - arachidi
        - soia
        - latte
        - frutta a guscio
        - sedano
        - senape
        - sesamo
        - solfiti
        - lupini
        - molluschi
      - name: ingredients
        type: textarea
        label:
          it: Ingredienti
          en: Ingredients
      - name: vegetarian
        type: boolean
        label:
          it: Vegetariano
          en: Vegetarian
      - name: gluten_free
        type: boolean
        label:
          it: Senza glutine
          en: Gluten free
      - name: pairings
        type: textarea
        label:
          it: Abbinamenti consigliati (piatti o vini)
          en: Recommended pairings (dishes or wines)
      - name: photo
        type: file
        accept:
        - jpg
        - jpeg
        - png
        - webp
        maxMb: 5
        label:
          it: Foto
          en: Photo
      - name: sold_out
        type: boolean
        label:
          it: Esaurito
          en: Sold out
    - name: published_menu
      ownedBy: app
      description: The public translated menu, one record per dish and language, read by guests
      fields:
      - name: key
        type: text
      - name: dish_id
        type: text
      - name: restaurant
        type: text
      - name: lang
        type: select
        options:
        - it
        - en
        - de
        - fr
        - es
        - zh
      - name: name
        type: text
      - name: name_note
        type: text
      - name: description
        type: textarea
      - name: price
        type: number
      - name: category
        type: text
      - name: allergens
        type: text
      - name: ingredients
        type: textarea
      - name: pairings
        type: textarea
      - name: vegetarian
        type: boolean
      - name: gluten_free
        type: boolean
      - name: available
        type: boolean
      - name: photo
        type: text
    - name: menu_stats
      ownedBy: app
      description: Anonymous menu views and guest questions, per restaurant
      retentionDays: 90
      fields:
      - name: restaurant
        type: text
      - name: kind
        type: select
        options:
        - view
        - question
      - name: dish_id
        type: text
      - name: text
        type: text
      - name: date
        type: date
  views:
  - key: home
    type: page
    nav: false
    title: MenuParlante
    sections:
    - type: hero
      eyebrow:
        it: Menu digitale per ristoranti
        en: Digital menu for restaurants
      title:
        it: Il tuo menu, **in ogni lingua**, a un QR di distanza.
        en: Your menu, **in every language**, one QR away.
      text:
        it: Inserisci i piatti una volta. Un agente li traduce in inglese, tedesco, francese, spagnolo e cinese; i clienti
          inquadrano il QR del tavolo, filtrano per allergie e chiedono consigli al cameriere virtuale.
        en: Enter your dishes once. An agent translates them into English, German, French, Spanish and Chinese; guests scan
          the table QR, filter by allergies and ask the virtual waiter for advice.
      actions:
      - label:
          it: Crea il tuo menu
          en: Create your menu
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Inserisci i piatti
          en: Add your dishes
        text:
          it: Nome, descrizione, prezzo, categoria, allergeni, ingredienti, foto e abbinamenti.
          en: Name, description, price, category, allergens, ingredients, photo and pairings.
        badge: 🍝
      - title:
          it: Traduzione automatica
          en: Automatic translation
        text:
          it: 5 lingue, con i nomi tipici mantenuti e spiegati.
          en: 5 languages, typical names kept and explained.
        badge: 🌍
      - title:
          it: QR per tavolo
          en: QR per table
        text:
          it: I clienti vedono il menu senza registrarsi e chattano con il cameriere virtuale.
          en: Guests see the menu without signing up and chat with the virtual waiter.
        badge: 📱
      - title:
          it: Riepilogo settimanale
          en: Weekly summary
        text:
          it: 'Ogni settimana via email: piatti più visti e domande frequenti.'
          en: 'Every week by email: most viewed dishes and frequent questions.'
        badge: ✉️
    - type: cards
      id: prezzi
      title:
        it: Prezzi
        en: Pricing
      items:
      - title:
          it: Abbonamento per locale
          en: Per-venue subscription
        text:
          it: Un abbonamento mensile per ogni locale, con tutte le lingue e il cameriere virtuale inclusi.
          en: One monthly subscription per venue, with all languages and the virtual waiter included.
    - type: note
      content:
        it: Il cameriere virtuale usa solo le informazioni del menu. In caso di allergie gravi, confermare sempre con il personale.
        en: The virtual waiter only uses the menu information. For severe allergies always confirm with the staff.
  - key: restaurant
    type: form
    collection: restaurants
    title:
      it: Il mio locale
      en: My restaurant
    edit: true
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Locale salvato.
        en: Restaurant saved.
      redirect: tables
    roles:
    - user
    - admin
  - key: dish_form
    type: form
    collection: dishes
    title:
      it: Nuovo piatto
      en: New dish
    edit: true
    submit:
      label:
        it: Salva e traduci
        en: Save and translate
      message:
        it: 'Piatto salvato: la traduzione parte in automatico.'
        en: 'Dish saved: translation starts automatically.'
      redirect: dishes
    roles:
    - user
    - admin
  - key: dishes
    type: table
    source: collection:dishes
    title:
      it: I miei piatti
      en: My dishes
    export: true
    roles:
    - user
    - admin
    data:
      display: table
      fields:
      - key: name
        label:
          it: Piatto
          en: Dish
      - key: category
        label:
          it: Categoria
          en: Category
        format: badge
      - key: price
        label:
          it: Prezzo
          en: Price
        format: money
      - key: sold_out
        label:
          it: Esaurito
          en: Sold out
        format: badge
      sort:
        field: category
        dir: asc
      limit: 200
  - key: tables
    type: page
    title:
      it: QR dei tavoli
      en: Table QR codes
    roles:
    - user
    - admin
    sections:
    - type: text
      title:
        it: Link dei tavoli
        en: Table links
      content:
        it: 'Ogni tavolo ha il suo link: `/v/menu?r=<codice-del-locale>&t=<numero-tavolo>`. Stampa il QR di quel link su ogni
          tavolo. Il cliente aggiunge `&lang=en` (o de, fr, es, zh) per la lingua; il cameriere virtuale risponde nella lingua
          del cliente.'
        en: 'Each table has its own link: `/v/menu?r=<restaurant-code>&t=<table-number>`. Print the QR of that link on every
          table. Guests add `&lang=en` (or de, fr, es, zh) for the language; the virtual waiter answers in the guest''s language.'
  - key: menu
    type: cards
    title:
      it: Menu
      en: Menu
    source: collection:published_menu
    param: lang
    query: available = true
    nav: false
    data:
      display: cards
      fields:
      - key: name
        label:
          it: Piatto
          en: Dish
      - key: name_note
        label:
          it: Nota
          en: Note
      - key: description
        label:
          it: Descrizione
          en: Description
      - key: price
        label:
          it: Prezzo
          en: Price
        format: money
      - key: category
        label:
          it: Categoria
          en: Category
        format: badge
      - key: allergens
        label:
          it: Allergeni
          en: Allergens
      - key: vegetarian
        label:
          it: Vegetariano
          en: Vegetarian
        format: badge
      - key: gluten_free
        label:
          it: Senza glutine
          en: Gluten free
        format: badge
      filters:
      - field: available
        op: '='
        value: true
      sort:
        field: category
        dir: asc
      limit: 200
      empty:
        it: Menu non disponibile.
        en: Menu not available.
  - key: waiter_chat
    type: chat
    source: agent:waiter
    title:
      it: Cameriere virtuale
      en: Virtual waiter
    placement: floating
    examples:
    - it: Cosa mi consigli senza glutine?
      en: What do you recommend gluten free?
    - it: Che vino con il secondo?
      en: Which wine goes with the main course?
    - it: Ci sono arachidi nel dolce?
      en: Are there peanuts in the dessert?
    placeholder:
      it: Chiedi al cameriere…
      en: Ask the waiter…
  - key: summary
    type: instances
    template: weekly_summary
    title:
      it: Riepilogo settimanale
      en: Weekly summary
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - user
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: locale
      price: 39
      interval: month
      label:
        it: MenuParlante — un locale
        en: MenuParlante — one venue
      includes:
      - 5 translated languages
      - virtual waiter
      - weekly email summary
  extensions:
  - key: qr_codes
    description: 'Generating and printing a QR image per table is not available: the app shows the table links to turn into
      QR codes.'
  - key: menu_stats_capture
    description: Recording anonymous dish views and guest questions into menu_stats needs a collector (webhook) the manifest
      cannot create; until then the weekly summary will report no data.
  - key: guest_filters
    description: Interactive allergy/vegetarian/gluten-free filter chips on the public menu are not available yet; the cards
      show the flags and the waiter chat filters by diet.
  - key: instant_sold_out
    description: Sold-out changes are republished by the translator agent within moments, not strictly instantly.
