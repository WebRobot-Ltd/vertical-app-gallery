apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: gararadar
  displayName: GaraRadar
  tagline: Le gare pubbliche giuste per la tua impresa, ogni mattina.
  description: GaraRadar legge ogni giorno i nuovi bandi (dati aperti ANAC e TED), li confronta con il profilo della tua azienda,
    assegna un punteggio di compatibilità e prepara schede di sintesi e bozze di relazione tecnica per le gare che salvi.
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: dashboard
  branding:
    theme: light
    palette:
      primary: '#12324f'
      accent: '#d9822b'
      background: '#f6f7f9'
      foreground: '#1a2230'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Gara
      color: primary
    - text: Radar
      color: accent
  header:
    links:
    - label: Come funziona
      href: '#come-funziona'
    - label: Fonti
      href: '#fonti'
    cta:
      label: Accedi
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  limits:
  - action: agent:drafter
    per: user
    max: 10
    window: day
    roles:
    - user
  egress:
    hosts:
    - api.ted.europa.eu
    - dati.anticorruzione.it
    notes: 'TED: riuso libero anche commerciale, CC BY 4.0 (Publications Office of the EU). ANAC: dati aperti dell''Autorità
      Nazionale Anticorruzione, licenza IODL 2.0 / CC BY, con attribuzione.'
  agents:
  - key: scanner
    role: scheduled
    description: Ogni mattina legge i nuovi bandi ANAC e TED, li filtra sul profilo dell'azienda e assegna un punteggio di
      compatibilità.
    memory: instance
    context:
    - key: profile
      from: collection:company_profile
    goalTemplate: 'Oggi è {date}. Radar: {instance}. Punteggio minimo da mostrare: {min_score}.

      Profilo aziendale (una riga JSON per profilo):

      {profile}

      Cerca i bandi pubblicati nelle ultime 24-48 ore (o dall''ultima esecuzione, vedi memoria), filtrali sul profilo e scrivi
      il report in italiano.'
    output: markdown
    writesTo:
      collection: daily_matches
      parse: whole
      keyBy: date
    appTools:
    - name: ted_search
      description: Cerca avvisi di gara su TED (Publications Office of the EU)
      action: http
      http:
        method: POST
        url: https://api.ted.europa.eu/v3/notices/search
        attribution: TED, Publications Office of the EU, CC BY 4.0
    - name: anac_opendata
      description: 'Interroga il portale dei dati aperti ANAC (API CKAN: aggiungi nel path es. /datastore_search o /package_search)'
      action: http
      http:
        method: GET
        url: https://dati.anticorruzione.it/opendata/api/3/action
        allowPath: true
        attribution: ANAC dati aperti, IODL 2.0
    limits:
      maxTurns: 30
      maxBudgetUsd: 1.0
    profile:
      inline:
        display_name: GaraRadar scanner
        crews:
        - id: scanner
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''analista di GaraRadar: individui le gare pubbliche italiane ed europee adatte a una specifica
            impresa.


            FONTI (solo tramite i tuoi strumenti):

            - ted_search (POST): body JSON es. {"query":"buyer-country=ITA AND classification-cpv=45* AND publication-date>=20261108","fields":["publication-number","notice-title","buyer-name","deadline-receipt-tender-date-lot","estimated-value-lot","links"],"limit":50,"page":1}.
            Costruisci la query dai codici CPV del profilo (usa il prefisso con *), il paese ITA e la data di pubblicazione
            recente.

            - anac_opendata (GET): API CKAN dei dati aperti ANAC; usa path come /package_search con query ?q=... per trovare
            i dataset dei bandi e /datastore_search per leggerne le righe. Se un dataset non contiene i bandi recenti, dillo
            apertamente.


            PROCEDURA: 1) leggi il profilo (CPV, categorie SOA, regioni, importo minimo e massimo, fatturato, certificazioni);
            2) raccogli i bandi nuovi; 3) scarta quelli fuori dalle regioni, fuori fascia di importo o già scaduti; 4) per
            ciascuno calcola un punteggio 0-100 di compatibilità (CPV 35, categoria SOA/importo 25, territorio 15, fatturato
            15, certificazioni 10) e spiega in una riga i requisiti mancanti o da verificare; 5) mostra solo i bandi con punteggio
            >= soglia, ordinati per punteggio, al massimo 20; 6) usa la memoria per non ripetere bandi già segnalati; a fine
            lavoro chiama una volta lo strumento remember con gli identificativi dei bandi segnalati (sostituiscono i vecchi).


            FORMATO: inizia con "# Nuove gare compatibili — <data>". Poi una tabella (Punteggio | Titolo | Stazione appaltante
            | Importo | Scadenza | Link) e sotto, per ogni gara, un elenco "Requisiti mancanti o da verificare". Se non ci
            sono gare, scrivilo in una riga. Chiudi con la riga delle fonti: TED (CC BY 4.0) e ANAC dati aperti.


            NON inventare importi, scadenze, codici o link: se un dato manca scrivi "non indicato". Il punteggio è un supporto
            alla decisione, non una consulenza legale.'
  - key: briefer
    role: helper
    description: 'Prepara la scheda di sintesi di una gara salvata: scadenze, criteri, documenti e checklist.'
    goalTemplate: 'Prepara la scheda di sintesi della gara salvata.

      Titolo: {record.title}

      Link: {record.url}

      CIG: {record.cig}

      Stazione appaltante: {record.buyer}

      Scadenza: {record.deadline}

      Importo: {record.amount}

      Oggi è {date}. Scrivi in italiano.'
    output: markdown
    writesTo:
      collection: tender_briefs
      parse: whole
    appTools:
    - name: ted_search
      description: Cerca avvisi di gara su TED (Publications Office of the EU)
      action: http
      http:
        method: POST
        url: https://api.ted.europa.eu/v3/notices/search
        attribution: TED, Publications Office of the EU, CC BY 4.0
    - name: anac_opendata
      description: 'Interroga il portale dei dati aperti ANAC (API CKAN: aggiungi nel path es. /datastore_search o /package_search)'
      action: http
      http:
        method: GET
        url: https://dati.anticorruzione.it/opendata/api/3/action
        allowPath: true
        attribution: ANAC dati aperti, IODL 2.0
    limits:
      maxTurns: 20
      maxBudgetUsd: 0.6
    profile:
      inline:
        display_name: GaraRadar briefer
        crews:
        - id: briefer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 20
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un esperto di appalti pubblici. Per una gara salvata dall''utente produci una scheda di sintesi.
            Cerca l''avviso con gli strumenti ted_search o anac_opendata partendo da CIG, numero di pubblicazione o titolo;
            se non lo trovi, lavora con i dati forniti e dichiaralo.


            FORMATO: inizia con "# Scheda gara — <titolo breve>". Sezioni ## Sintesi, ## Scadenze (presentazione offerte,
            chiarimenti, sopralluogo se previsto), ## Criteri di aggiudicazione (OEPV con pesi o minor prezzo), ## Documenti
            richiesti, ## Requisiti di partecipazione, ## Checklist di preparazione (elenco con caselle - [ ] e tempi suggeriti
            a ritroso dalla scadenza), ## Rischi e punti da verificare.


            NON inventare dati: scrivi "non indicato" quando manca. Non dare pareri legali come fatti; rimanda al disciplinare
            ufficiale.'
  - key: drafter
    role: main
    description: Scrive una bozza di relazione tecnica per una gara salvata, modificabile dall'utente.
    goalTemplate: 'Scrivi la bozza di relazione tecnica per la gara salvata con id {tender}.

      {?focus}Punti da enfatizzare: {focus}{/focus}

      Leggi la gara con read_tender, la scheda con read_briefs e il profilo con read_profile. Oggi è {date}. Scrivi in italiano.'
    output: markdown
    writesTo:
      collection: drafts
      parse: whole
    appTools:
    - name: read_tender
      description: Legge le gare salvate dell'utente
      action: read
      collection: saved_tenders
      scope: user
    - name: read_briefs
      description: Legge le schede di sintesi delle gare salvate
      action: read
      collection: tender_briefs
      scope: user
    - name: read_profile
      description: Legge il profilo aziendale dell'utente
      action: read
      collection: company_profile
      scope: user
    limits:
      maxTurns: 15
      maxBudgetUsd: 0.8
    profile:
      inline:
        display_name: GaraRadar drafter
        crews:
        - id: drafter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un consulente di gare d''appalto che redige relazioni tecniche. Usa gli strumenti per leggere
            la gara scelta, la sua scheda e il profilo aziendale.


            FORMATO: inizia con "# Relazione tecnica — <titolo gara>". Struttura secondo i criteri di aggiudicazione trovati
            nella scheda: ## Presentazione dell''impresa, ## Comprensione dell''appalto, ## Metodologia e organizzazione del
            servizio/lavoro, ## Risorse e mezzi, ## Gestione qualità e sicurezza (solo se coerente con le certificazioni possedute),
            ## Migliorie proposte, ## Cronoprogramma. Per i dati che solo l''azienda conosce inserisci segnaposto tra parentesi
            quadre [DA COMPLETARE: …].


            NON inventare referenze, certificazioni, fatturati o mezzi non presenti nel profilo. È una bozza da rivedere e
            modificare.'
  templates:
  - key: daily_radar
    title: Radar giornaliero
    description: Ogni mattina i nuovi bandi compatibili con il profilo della tua azienda, con punteggio e requisiti mancanti.
    agent: scanner
    params:
    - name: min_score
      type: number
      required: true
      default: 60
      label: Punteggio minimo (0-100)
    goal: 'Radar "{instance}", oggi è {date}. Punteggio minimo: {min_score}. Cerca i nuovi bandi compatibili con il profilo
      e scrivi il report in italiano.'
    schedule:
      cron: 40 6 * * *
      userCanChange: false
    maxPerUser: 1
    deliver:
      to: owner
      subject: GaraRadar — nuove gare compatibili del {date}
      onlyIfNew: true
  triggers:
  - key: brief_on_save
    description: Quando l'utente salva una gara, prepara la scheda di sintesi.
    'on':
      collection: saved_tenders
      op: insert
    start:
      agent: briefer
    goal: 'Prepara la scheda di sintesi della gara salvata: {record.title}.'
    asUser: true
  - key: deadline_reminder
    description: Promemoria tre giorni prima della scadenza.
    'on':
      date:
        collection: saved_tenders
        field: deadline
        offsetDays: -3
        hour: 7
    notify:
      to: owner
      subject: 'Scadenza tra 3 giorni: {record.title}'
      body: La gara "{record.title}" ({record.buyer}) scade il {record.deadline}. Controlla la checklist di preparazione e
        completa la documentazione.
      link: saved
  inputForm:
    title: Nuova bozza di relazione tecnica
    fields:
    - name: tender
      type: select
      required: true
      label: Gara salvata
      optionsFrom: collection:saved_tenders
    - name: focus
      type: textarea
      maxLength: 600
      label: Punti da enfatizzare (facoltativo)
      help: Es. esperienze simili, certificazioni, migliorie
  data:
    collections:
    - name: company_profile
      description: Profilo aziendale dell'utente
      ownedBy: user
      fields:
      - name: company
        type: text
        required: true
        label: Ragione sociale
      - name: cpv_codes
        type: text
        required: true
        label: Codici CPV
        help: Separati da virgola, es. 45233140, 71320000
      - name: soa_categories
        type: text
        label: Categorie SOA e classifiche
        help: Es. OG3 classifica III, OS30 classifica II
      - name: regions
        type: text
        required: true
        label: Regioni di interesse
      - name: min_amount
        type: number
        label: Importo minimo (€)
      - name: max_amount
        type: number
        label: Importo massimo (€)
      - name: turnover
        type: number
        label: Fatturato annuo (€)
      - name: certifications
        type: text
        label: Certificazioni possedute
        help: Es. ISO 9001, ISO 14001, ISO 45001, SA8000
    - name: daily_matches
      description: Report giornalieri delle gare compatibili, per radar
      ownedBy: instance
      fields:
      - name: date
        type: date
        label: Data
      - name: title
        type: text
        label: Titolo
      - name: body
        type: textarea
        label: Report
      retentionDays: 90
    - name: saved_tenders
      description: Gare salvate dall'utente, condivisibili con i colleghi
      ownedBy: user
      fields:
      - name: title
        type: text
        required: true
        label: Titolo della gara
      - name: url
        type: url
        label: Link al bando
      - name: cig
        type: text
        label: CIG o numero avviso
      - name: buyer
        type: text
        label: Stazione appaltante
      - name: amount
        type: number
        label: Importo (€)
      - name: deadline
        type: date
        required: true
        label: Scadenza offerte
      - name: members
        type: array
        label: Colleghi editor (email)
        help: Possono leggere e modificare la gara
      - name: viewers
        type: array
        label: Colleghi sola lettura (email)
        help: Possono solo leggere la gara
      access:
      - role: user
        where:
          members: '{user.email}'
        can:
        - read
        - write
      - role: user
        where:
          viewers: '{user.email}'
        can:
        - read
    - name: tender_briefs
      description: Schede di sintesi delle gare salvate
      ownedBy: user
      fields:
      - name: title
        type: text
        label: Titolo
      - name: body
        type: textarea
        label: Scheda
    - name: drafts
      description: Bozze di relazione tecnica, modificabili
      ownedBy: user
      fields:
      - name: title
        type: text
        label: Titolo
      - name: body
        type: textarea
        label: Testo della relazione
  views:
  - key: home
    type: page
    title: GaraRadar
    nav: false
    sections:
    - type: hero
      title: Le gare pubbliche **giuste** per la tua impresa, ogni mattina.
      text: GaraRadar legge i nuovi bandi di ANAC e TED, li filtra sul profilo della tua azienda e ti dice quanto sono compatibili
        e cosa ti manca. Per le gare che salvi prepara scheda, checklist e bozza di relazione tecnica.
      actions:
      - label: Inizia ora
        href: /login
        style: primary
      note: Per imprese edili, di servizi e consulenti.
    - type: steps
      id: come-funziona
      title: Come funziona
      items:
      - title: 1 · Profilo aziendale
        text: CPV, categorie SOA, regioni, importi, fatturato e certificazioni.
      - title: 2 · Radar quotidiano
        text: Alle 8 un'email con le nuove gare compatibili, con punteggio e requisiti mancanti.
      - title: 3 · Salva e prepara
        text: Scheda con scadenze, criteri e documenti, checklist e bozza di relazione tecnica da modificare.
      - title: 4 · Promemoria
        text: Un avviso tre giorni prima di ogni scadenza.
    - type: cards
      id: fonti
      title: Fonti
      items:
      - title: TED
        text: Avvisi europei, licenza CC BY 4.0 (Publications Office of the EU).
      - title: ANAC dati aperti
        text: Dati aperti dell'Autorità Nazionale Anticorruzione, con attribuzione.
    - type: note
      content: 'GaraRadar è un supporto alla decisione, non consulenza legale: verifica sempre bando e disciplinare ufficiali.'
  - key: profile
    type: form
    title: Profilo aziendale
    collection: company_profile
    edit: true
    submit:
      label: Salva profilo
      message: Profilo salvato.
      redirect: radar
    roles:
    - user
    - admin
  - key: radar
    type: instances
    template: daily_radar
    title: Il mio radar
    roles:
    - user
    - admin
  - key: matches
    type: table
    title: Gare compatibili
    source: collection:daily_matches
    columns:
    - date
    - title
    - body
    roles:
    - user
    - admin
  - key: save_tender
    type: form
    title: Salva una gara
    collection: saved_tenders
    submit:
      label: Salva gara
      message: 'Gara salvata: sto preparando la scheda di sintesi.'
      redirect: saved
    roles:
    - user
    - admin
  - key: saved
    type: table
    title: Gare salvate
    source: collection:saved_tenders
    columns:
    - title
    - buyer
    - amount
    - deadline
    - url
    export: true
    roles:
    - user
    - admin
  - key: briefs
    type: table
    title: Schede di sintesi
    source: collection:tender_briefs
    columns:
    - title
    - body
    roles:
    - user
    - admin
  - key: new_draft
    type: new_run
    title: Genera bozza di relazione
    roles:
    - user
    - admin
  - key: drafts_list
    type: table
    title: Le mie bozze
    source: collection:drafts
    columns:
    - title
    roles:
    - user
    - admin
  - key: edit_draft
    type: form
    title: Modifica bozza
    collection: drafts
    edit: true
    nav: false
    submit:
      label: Salva modifiche
      message: Bozza aggiornata.
      redirect: drafts_list
    roles:
    - user
    - admin
  - key: runs
    type: history
    title: Storico generazioni
    source: run
    roles:
    - user
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: account
    type: account
    title: Abbonamento e crediti
    roles:
    - user
  notifications:
    emailOnRunDone: true
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:drafter: 15
    plans:
    - key: pro
      price: 39
      interval: month
      label: GaraRadar Pro
      includes:
      - Radar quotidiano con email alle 8
      - Schede di sintesi e promemoria scadenze
      - Condivisione con i colleghi
      - 30 crediti mensili per le bozze
      credits: 30
      creditsReset: monthly
    packs:
    - key: bozze_10
      credits: 150
      price: 15
      label: 10 bozze extra
    - key: bozze_30
      credits: 450
      price: 39
      label: 30 bozze extra
