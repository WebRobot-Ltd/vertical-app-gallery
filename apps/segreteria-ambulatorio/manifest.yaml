apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: segreteria-ambulatorio
  displayName: SegreteriaAmbulatorio
  tagline:
    it: La segreteria del tuo centro medico, sempre disponibile in chat.
    en: Your medical centre's front desk, always available in chat.
  description:
    it: Un assistente AI risponde ai pazienti su prestazioni, preparazione agli esami e orari, propone gli slot liberi e prenota
      la visita nell'agenda del centro. Le richieste cliniche o urgenti passano a un operatore umano.
    en: An AI assistant answers patients about services, exam preparation and opening hours, offers free slots and books the
      visit in the centre's agenda. Clinical or urgent requests go to a human operator.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#0b4f6c'
      accent: '#1a936f'
      background: '#f6fafb'
      foreground: '#14232b'
    fonts:
      body: Inter
      display: Nunito
    wordmark:
    - text: Segreteria
      color: primary
    - text: Ambulatorio
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Privacy
        en: Privacy
      href: '#privacy'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin centro
      assignedBy: admin_emails
    - key: operator
      label:
        it: Operatore
        en: Operator
      assignedBy: invite
    - key: user
      label:
        it: Paziente
        en: Patient
      assignedBy: signup
  limits:
  - action: chat
    per: user
    max: 100
    window: day
    roles:
    - user
  agents:
  - key: assistant
    role: main
    description: 'Front-desk assistant: answers on services, preparation and hours, offers free slots, books, hands clinical
      or urgent requests to a human.'
    profile:
      inline:
        display_name: Segreteria assistant
        crews:
        - id: assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 14
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the front-desk assistant of a medical centre. You answer in the patient''s language, briefly
            and kindly.


            YOU DO: answer on services (duration, price, preparation), doctors, specialties and opening hours using ONLY the
            tools read_services, read_doctors, read_hours; propose free slots; book visits.


            CONSENT: before collecting any personal or health detail or booking, call read_consent. If there is no record,
            explain in two sentences that health-related data will be processed only to manage the booking, and ask for explicit
            consent. Only after a clear ''yes'' call write_consent. Without consent, answer general questions only.


            SLOTS: a free slot is inside the doctor''s hours (read_hours), as long as the service lasts (read_services), and
            does not overlap any appointment from read_agenda. Offer at most 3 slots. Never invent doctors, prices, hours
            or preparations: if the data is missing, say so and offer a human operator.


            BOOKING: confirm service, doctor, date, time and price with the patient, then call book_appointment (patient''s
            own record) and book_agenda (centre agenda) with the same data, status ''confirmed'', and a random cancel_token
            string. Tell the patient they will get a reminder the day before with a link to cancel.


            HANDOFF: you NEVER give medical advice, diagnoses, interpretation of results, medication or dosage guidance. For
            any clinical question, symptom, test result, complaint, or anything urgent, call request_handoff with a short
            summary and tell the patient an operator will reply. If symptoms sound like an emergency (chest pain, breathing
            difficulty, severe bleeding, loss of consciousness), tell them at once to call the emergency number 112 and also
            request the handoff.


            Never reveal other patients'' data.'
          mcp_servers: []
    goalTemplate: 'Today is {date}. Language: {lang}.

      Conversation so far:

      {history}

      New patient message: {message}'
    output: markdown
    awaits:
    - handoff
    appTools:
    - name: read_services
      description: List the centre's services with doctor, specialty, duration, price and preparation
      action: read
      collection: services
      scope: all
    - name: read_doctors
      description: List doctors and specialties
      action: read
      collection: doctors
      scope: all
    - name: read_hours
      description: Weekly working hours of each doctor
      action: read
      collection: hours
      scope: all
    - name: read_agenda
      description: Busy slots in the centre agenda (doctor, start, end only)
      action: read
      collection: agenda
      scope: all
    - name: read_consent
      description: Read this patient's consent record
      action: read
      collection: consents
      scope: user
    - name: write_consent
      description: Record the patient's explicit consent
      action: write
      collection: consents
      scope: user
    - name: book_appointment
      description: Save the appointment in the patient's own records
      action: write
      collection: appointments
      scope: user
    - name: book_agenda
      description: Add the appointment to the centre agenda
      action: append
      collection: agenda
      scope: all
    limits:
      maxTurns: 14
      maxBudgetUsd: 0.4
  data:
    collections:
    - name: doctors
      ownedBy: shared
      description: Doctors and specialties, managed by the admin
      fields:
      - name: name
        type: text
        required: true
        label: Nome
      - name: specialty
        type: text
        required: true
        label: Specialità
    - name: services
      ownedBy: shared
      description: Services with duration, price and preparation
      fields:
      - name: name
        type: text
        required: true
        label: Prestazione
      - name: doctor
        type: text
        required: true
        label: Medico
      - name: specialty
        type: text
        label: Specialità
      - name: duration_min
        type: number
        required: true
        label: Durata (min)
      - name: price
        type: number
        required: true
        label: Prezzo (€)
      - name: preparation
        type: textarea
        label: Preparazione
    - name: hours
      ownedBy: shared
      description: Weekly hours per doctor
      fields:
      - name: doctor
        type: text
        required: true
      - name: weekday
        type: select
        required: true
        options:
        - '1'
        - '2'
        - '3'
        - '4'
        - '5'
        - '6'
        - '7'
        help: 1 = lunedì
      - name: from
        type: text
        required: true
        help: HH:MM
      - name: to
        type: text
        required: true
        help: HH:MM
    - name: consents
      ownedBy: user
      description: Explicit health-data consent of each patient
      fields:
      - name: accepted
        type: boolean
        required: true
      - name: accepted_at
        type: date
      - name: purpose
        type: text
    - name: appointments
      ownedBy: user
      description: The patient's own bookings
      fields:
      - name: service
        type: text
      - name: doctor
        type: text
      - name: start
        type: text
        help: ISO datetime
      - name: end
        type: text
      - name: price
        type: number
      - name: status
        type: text
      - name: cancel_token
        type: text
    - name: agenda
      ownedBy: org
      description: Centre agenda, visible to staff only
      fields:
      - name: patient
        type: text
      - name: patient_email
        type: email
      - name: service
        type: text
      - name: doctor
        type: text
      - name: start
        type: text
      - name: end
        type: text
      - name: status
        type: text
      - name: cancel_token
        type: text
  approvals:
  - key: handoff
    title:
      it: Richiesta per operatore
      en: Request for operator
    description: Clinical or urgent request the assistant does not handle
    role: operator
    decidedBy: role
    fields:
    - summary
    - urgency
  views:
  - key: home
    type: page
    title: SegreteriaAmbulatorio
    nav: false
    sections:
    - type: hero
      title:
        it: La **segreteria** del centro, sempre aperta.
        en: The centre's **front desk**, always open.
      text:
        it: Chiedi prestazioni, preparazione agli esami e orari. Trova uno slot libero e prenota in chat.
        en: Ask about services, exam preparation and hours. Find a free slot and book in chat.
      actions:
      - label:
          it: Parla con la segreteria
          en: Talk to the front desk
        href: /v/chat
        style: primary
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Scrivi
          en: Write
        text:
          it: Chiedi informazioni in chat.
          en: Ask in chat.
        badge: 💬
      - title:
          it: Scegli lo slot
          en: Pick a slot
        text:
          it: L'assistente propone gli orari liberi e prenota.
          en: The assistant offers free times and books.
        badge: 📅
      - title:
          it: Promemoria
          en: Reminder
        text:
          it: Il giorno prima ricevi un promemoria con link per disdire.
          en: The day before you get a reminder with a cancel link.
        badge: ✉️
      - title:
          it: Operatore umano
          en: Human operator
        text:
          it: Le richieste cliniche o urgenti passano a una persona.
          en: Clinical or urgent requests go to a person.
        badge: 🧑‍⚕️
    - type: note
      id: privacy
      content:
        it: L'assistente non fornisce consigli medici. In caso di emergenza chiama il 112. I dati sanitari sono trattati solo
          con il tuo consenso esplicito, e il centro vede solo i propri pazienti.
        en: The assistant gives no medical advice. In an emergency call 112. Health data is processed only with your explicit
          consent, and the centre sees only its own patients.
  - key: chat
    type: chat
    title:
      it: Segreteria
      en: Front desk
    source: agent:assistant
    examples:
    - it: Quali prestazioni di cardiologia avete?
      en: Which cardiology services do you offer?
    - it: Come mi preparo all'ecografia addominale?
      en: How do I prepare for an abdominal ultrasound?
    - it: Vorrei prenotare una visita dermatologica la prossima settimana
      en: I'd like to book a dermatology visit next week
    placeholder:
      it: Scrivi alla segreteria…
      en: Write to the front desk…
    roles:
    - user
  - key: my_appointments
    type: table
    title:
      it: Le mie visite
      en: My appointments
    source: collection:appointments
    data:
      display: table
      fields:
      - key: start
        label: Data
        format: date
      - key: service
        label: Prestazione
      - key: doctor
        label: Medico
      - key: price
        label: Prezzo
        format: money
      - key: status
        label: Stato
        format: badge
      sort:
        field: start
        dir: desc
    roles:
    - user
  - key: agenda_view
    type: table
    title:
      it: Agenda del centro
      en: Centre agenda
    source: collection:agenda
    data:
      display: table
      fields:
      - key: start
        label: Inizio
        format: date
      - key: doctor
        label: Medico
      - key: service
        label: Prestazione
      - key: patient
        label: Paziente
      - key: status
        label: Stato
        format: badge
      sort:
        field: start
        dir: asc
    roles:
    - admin
    - operator
  - key: queue
    type: approvals
    title:
      it: Coda operatore
      en: Operator queue
    approvals:
    - handoff
    roles:
    - operator
    - admin
  - key: doctors_admin
    type: table
    title: Medici
    source: collection:doctors
    roles:
    - admin
  - key: services_admin
    type: table
    title: Prestazioni
    source: collection:services
    roles:
    - admin
  - key: hours_admin
    type: table
    title: Orari
    source: collection:hours
    roles:
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Plan
    roles:
    - admin
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 0
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:assistant:
        estimate: 10
        metered: true
    packs:
    - key: bookings
      credits: 1000
      price: 10
      label: Prenotazioni
    plans:
    - key: centro
      price: 99
      interval: month
      label: Centro medico
      includes:
      - assistente di segreteria
      - agenda
      - coda operatore
      credits: 0
      roles:
      - admin
  extensions:
  - key: reminder_email
    description: 'Email reminder the day before with a cancel link (using cancel_token) is not available yet: notifications
      are missing. For now the agenda lists tomorrow''s visits for staff.'
  - key: voice_chat
    description: Speaking to the assistant (voice/phone) is not available in this manifest; text chat only.
  - key: file_upload
    description: Admin loads doctors, services and hours by entering them in tables; file/CSV upload is not available yet.
  - key: cancel_link
    description: A public cancellation page via token needs custom logic; for now patients can ask the assistant to cancel.
  - key: per_booking_fee
    description: The per-booking charge is approximated by metered cost of each assistant run; an exact fee per confirmed
      booking needs custom billing.
  - key: multi_centre
    description: Each centre is its own app instance (own subscription, patients and agenda), which guarantees centres only
      see their own patients.
