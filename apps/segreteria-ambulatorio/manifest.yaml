apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: segreteria-ambulatorio
  displayName: SegreteriaAmbulatorio
  tagline:
    it: La segreteria del tuo centro medico, sempre disponibile.
    en: Your medical center's front desk, always available.
  description:
    it: Un assistente risponde ai pazienti su prestazioni, preparazioni e orari, propone gli slot liberi e prenota la visita
      in agenda. Le richieste cliniche o urgenti passano a un operatore umano.
    en: An assistant answers patients about services, exam preparation and opening hours, offers free slots and books the
      visit. Clinical or urgent requests go to a human operator.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#0b4f6c'
      accent: '#1a9e8f'
      background: '#f6fafb'
      foreground: '#12232e'
    fonts:
      body: Inter
      display: Manrope
    buttonShape: rounded
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: staff
      label:
        it: Operatore
        en: Operator
      assignedBy: invite
    - key: user
      label:
        it: Paziente
        en: Patient
      assignedBy: signup
  limits:
  - action: chat
    per: user
    max: 60
    window: hour
    roles:
    - user
  - action: login
    per: ip
    max: 20
    window: hour
  agents:
  - key: assistant
    role: main
    description: 'Segretaria virtuale: informa, propone slot, prenota, passa le richieste cliniche a un operatore.'
    profile:
      inline:
        display_name: Segreteria Ambulatorio
        crews:
        - id: assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei la segretaria virtuale di un centro medico. Rispondi in modo cortese e breve nella lingua del
            paziente. Usi SOLO i dati degli strumenti: medici (read_doctors), prestazioni con durata, prezzo e preparazione
            (read_services), appuntamenti del paziente (read_appointments). Non inventare mai orari, prezzi o preparazioni:
            se un dato manca, dillo.


            CONSENSO: prima di raccogliere dati personali o prenotare, chiama read_consent. Se il paziente non ha dato il
            consenso al trattamento dei dati sanitari, invitalo a darlo nella pagina /v/consent e non prenotare.


            PRENOTAZIONE: chiedi prestazione e medico, proponi gli slot dall''agenda e dagli orari del medico (evita quelli
            già occupati dai suoi appuntamenti), conferma data e ora con il paziente e solo poi chiama book_appointment (start,
            end in base alla durata, resource = nome medico, service, status = booked). In alternativa indica la pagina /v/book
            dove vede gli slot liberi. Spiega che il giorno prima riceverà un promemoria con il link per disdire (pagina /v/my_appointments).


            LIMITI: non dare mai pareri medici, diagnosi, interpretazioni di sintomi, terapie o dosaggi. Se la richiesta è
            clinica (sintomi, referti, farmaci) o urgente, chiama handoff_to_operator con reason (clinical|urgent|other),
            message riassunto e status open, e dì al paziente che un operatore risponderà. In caso di segni di emergenza (dolore
            al petto, difficoltà respiratoria, ecc.) invita subito a chiamare il 112, e poi passa all''operatore.'
    goalTemplate: 'Conversazione finora:

      {history}


      Paziente ({user}), oggi è {date}. Nuovo messaggio:

      {message}


      Rispondi nella lingua con codice ISO {lang}.'
    context:
    - key: patient_email
      from: user.email
    output: markdown
    appTools:
    - name: read_doctors
      description: Elenco dei medici con specialità e orari
      action: read
      collection: doctors
      scope: all
    - name: read_services
      description: Prestazioni con durata, prezzo e preparazione
      action: read
      collection: services
      scope: all
    - name: read_appointments
      description: Gli appuntamenti del paziente
      action: read
      collection: appointments
      scope: user
    - name: read_consent
      description: Il consenso al trattamento dei dati del paziente
      action: read
      collection: consents
      scope: user
    - name: book_appointment
      description: Registra una visita in agenda per il paziente
      action: write
      collection: appointments
      scope: user
    - name: handoff_to_operator
      description: Passa una richiesta clinica o urgente alla coda degli operatori
      action: write
      collection: handoffs
      scope: user
    limits:
      maxTurns: 10
      maxBudgetUsd: 0.3
  data:
    collections:
    - name: doctors
      ownedBy: shared
      description: Medici e specialità, caricati dall'admin
      fields:
      - name: name
        type: text
        required: true
        label: Nome
      - name: specialty
        type: text
        required: true
        label: Specialità
      - name: hours
        type: textarea
        label: Giorni e orari
      - name: bio
        type: textarea
        label: Note
    - name: services
      ownedBy: shared
      description: Prestazioni con durata, prezzo e preparazione
      fields:
      - name: name
        type: text
        required: true
        label: Prestazione
      - name: specialty
        type: text
        label: Specialità
      - name: doctor
        type: text
        label: Medico
      - name: duration_min
        type: number
        required: true
        label: Durata (min)
      - name: price
        type: number
        required: true
        label: Prezzo (€)
      - name: preparation
        type: textarea
        label: Preparazione all'esame
    - name: consents
      ownedBy: user
      description: Consenso esplicito al trattamento dei dati sanitari
      retentionDays: 3650
      fields:
      - name: full_name
        type: text
        required: true
        label: Nome e cognome
      - name: phone
        type: text
        label: Telefono
      - name: accepted
        type: boolean
        required: true
        label: Acconsento esplicitamente al trattamento dei miei dati sanitari per la gestione delle prenotazioni
      access:
      - role: staff
        can:
        - read
    - name: appointments
      ownedBy: user
      description: 'Agenda del centro: una riga per visita'
      retentionDays: 730
      fields:
      - name: start
        type: date
        label: Inizio
      - name: end
        type: date
        label: Fine
      - name: date
        type: date
        label: Data
      - name: resource
        type: text
        label: Medico
      - name: service
        type: text
        label: Prestazione
      - name: notes
        type: textarea
        label: Note
      - name: status
        type: select
        label: Stato
        default: booked
        options:
        - value: booked
          label: Prenotata
        - value: cancelled
          label: Disdetta
      access:
      - role: staff
        can:
        - read
        - write
    - name: handoffs
      ownedBy: user
      description: 'Coda degli operatori: richieste cliniche o urgenti'
      retentionDays: 365
      fields:
      - name: reason
        type: select
        label: Motivo
        options:
        - value: clinical
          label: Clinica
        - value: urgent
          label: Urgente
        - value: other
          label: Altro
      - name: message
        type: textarea
        required: true
        label: Richiesta
      - name: status
        type: select
        label: Stato
        default: open
        options:
        - value: open
          label: Aperta
        - value: answered
          label: Risposta
      - name: reply
        type: textarea
        label: Risposta dell'operatore
      access:
      - role: staff
        can:
        - read
        - write
  views:
  - key: home
    type: page
    nav: false
    title: SegreteriaAmbulatorio
    sections:
    - type: hero
      title:
        it: La **segreteria** del centro, sempre a disposizione
        en: Your center's **front desk**, always available
      text:
        it: Chiedi di prestazioni, preparazioni e orari, scegli uno slot libero e prenota la visita in chat.
        en: Ask about services, preparation and hours, pick a free slot and book in chat.
      actions:
      - label:
          it: Parla con la segreteria
          en: Talk to the front desk
        href: /v/assistant
        style: primary
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Dai il consenso
          en: Give consent
        text:
          it: Il consenso esplicito al trattamento dei dati sanitari è richiesto prima di prenotare.
          en: Explicit consent to health data processing is required before booking.
      - title:
          it: Chiedi e prenota
          en: Ask and book
        text:
          it: L'assistente risponde e prenota nell'agenda del centro.
          en: The assistant answers and books in the center's agenda.
      - title:
          it: Promemoria
          en: Reminder
        text:
          it: Il giorno prima ricevi un'email con il link per disdire.
          en: The day before you get an email with a cancellation link.
      - title:
          it: Richieste cliniche
          en: Clinical requests
        text:
          it: Sintomi, referti e urgenze passano a un operatore umano.
          en: Symptoms, results and urgent matters go to a human operator.
    - type: note
      content:
        it: L'assistente non fornisce pareri medici. In caso di emergenza chiama il 112.
        en: The assistant gives no medical advice. In an emergency call 112.
  - key: assistant
    type: chat
    title:
      it: Segreteria
      en: Front desk
    source: agent:assistant
    placeholder:
      it: Scrivi la tua domanda…
      en: Write your question…
    examples:
    - it: Quanto costa una visita cardiologica e come mi preparo?
      en: How much is a cardiology visit?
    - it: Vorrei prenotare una visita dermatologica la prossima settimana
      en: I'd like to book a dermatology visit next week
    roles:
    - user
    - admin
  - key: consent
    type: form
    title:
      it: Consenso dati sanitari
      en: Health data consent
    collection: consents
    fields:
    - full_name
    - phone
    - accepted
    submit:
      label:
        it: Conferma consenso
        en: Confirm consent
      message:
        it: Consenso registrato.
        en: Consent saved.
      redirect: assistant
    roles:
    - user
  - key: book
    type: booking
    title:
      it: Prenota una visita
      en: Book a visit
    collection: appointments
    resources: collection:doctors
    fields:
    - service
    - notes
    slots:
      days:
      - 1
      - 2
      - 3
      - 4
      - 5
      from: 09:00
      to: '18:00'
      minutes: 30
      tz: Europe/Rome
      aheadDays: 30
      minNoticeHours: 2
      capacity: 1
    roles:
    - user
  - key: my_appointments
    type: list
    title:
      it: Le mie visite
      en: My visits
    source: collection:appointments
    columns:
    - date
    - resource
    - service
    - status
    roles:
    - user
  - key: manage
    type: form
    title:
      it: Disdici o modifica
      en: Cancel or change
    collection: appointments
    fields:
    - status
    - notes
    edit: true
    submit:
      label:
        it: Salva
        en: Save
      redirect: my_appointments
    nav: false
    roles:
    - user
  - key: agenda
    type: table
    title:
      it: Agenda del centro
      en: Center agenda
    source: collection:appointments
    columns:
    - date
    - start
    - resource
    - service
    - status
    - notes
    export: true
    roles:
    - staff
    - admin
  - key: queue
    type: table
    title:
      it: Coda operatori
      en: Operator queue
    source: collection:handoffs
    columns:
    - reason
    - message
    - status
    - reply
    roles:
    - staff
    - admin
  - key: reply
    type: form
    title:
      it: Rispondi
      en: Reply
    collection: handoffs
    fields:
    - reply
    - status
    edit: true
    submit:
      label:
        it: Invia risposta
        en: Send reply
      redirect: queue
    nav: false
    roles:
    - staff
    - admin
  - key: admin
    type: admin
    title: Admin
    roles:
    - admin
  - key: account
    type: account
    title:
      it: Account
      en: Account
    roles:
    - user
  triggers:
  - key: booking_confirmed
    'on':
      collection: appointments
      op: insert
    notify:
      to: owner
      subject:
        it: 'Visita prenotata: {record.service}'
        en: 'Visit booked: {record.service}'
      body:
        it: La tua visita con {record.resource} è confermata per il {record.date}. Per disdire usa il link.
        en: Your visit with {record.resource} is confirmed for {record.date}. Use the link to cancel.
      link: my_appointments
  - key: reminder
    'on':
      date:
        collection: appointments
        field: start
        offsetDays: -1
        hour: 8
      where:
        status: booked
    notify:
      to: owner
      subject:
        it: 'Promemoria: visita domani con {record.resource}'
        en: 'Reminder: visit tomorrow with {record.resource}'
      body:
        it: Ti ricordiamo la visita di domani ({record.date}) con {record.resource}. Se non puoi venire, disdici dal link.
        en: Reminder of your visit tomorrow ({record.date}) with {record.resource}. If you cannot come, cancel with the link.
      link: my_appointments
  - key: new_handoff
    'on':
      collection: handoffs
      op: insert
    notify:
      to:
      - role:staff
      - admins
      subject:
        it: Nuova richiesta da gestire
        en: New request to handle
      body:
        it: 'Un paziente ha una richiesta {record.reason}: {record.message}'
        en: 'A patient has a {record.reason} request: {record.message}'
      link: queue
  - key: handoff_answered
    'on':
      collection: handoffs
      op: update
      where:
        status: answered
    notify:
      to: owner
      subject:
        it: Risposta dalla segreteria
        en: Reply from the front desk
      body:
        it: 'Un operatore ha risposto alla tua richiesta: {record.reply}'
        en: 'An operator replied to your request: {record.reply}'
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: centro
      price: 99
      interval: month
      label:
        it: Abbonamento centro
        en: Center subscription
      includes:
      - assistente in chat
      - agenda e prenotazioni
      - coda operatori
      roles:
      - admin
  extensions:
  - key: per_booking_fee
    description: 'Costo per prenotazione a carico del centro (oltre all''abbonamento mensile): oggi i crediti si addebitano
      all''utente dell''evento (il paziente), non al centro; serve un addebito per evento sul proprietario dell''app.'
  - key: voice_input
    description: 'Il paziente che parla (voce/telefono) richiede un canale phone o speech-to-text, non disponibile in questa
      versione: per ora solo chat scritta.'
  - key: free_slots_for_agent
    description: 'L''agente non può leggere gli appuntamenti degli altri pazienti: gli slot realmente liberi sono garantiti
      dalla pagina di prenotazione /v/book; nella chat l''agente propone gli orari del medico e rimanda a /v/book per la conferma.'
  - key: one_tenant_per_center
    description: 'Ogni centro è un''app/tenant distinta: l''isolamento dei pazienti tra centri deriva dal deploy separato;
      all''interno del centro i dati dei pazienti sono visibili solo a staff e admin.'
