apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: sentieri-di-borgo
  displayName: Sentieri di Borgo
  tagline:
    it: Itinerari su misura nei borghi e nelle campagne di Sicilia.
    en: Tailor-made itineraries through Sicily's villages and countryside.
  description:
    it: Sentieri di Borgo crea itinerari giorno per giorno nei piccoli borghi e nelle aree rurali, a partire dalla Sicilia.
      Usa OpenStreetMap, gli open data della Regione, gli eventi e le schede dei borghi inseriti dai comuni e dalle pro loco
      partner.
    en: Sentieri di Borgo builds day-by-day itineraries in small villages and rural areas, starting from Sicily. It uses OpenStreetMap,
      regional open data, and the events and village profiles entered by partner municipalities and pro loco associations.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#7a3b1d'
      accent: '#2f6b4f'
      background: '#fbf6ee'
      foreground: '#2a2119'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: 'Sentieri di '
      color: primary
    - text: Borgo
      color: accent
    button: accent
    buttonShape: rounded
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Fonti
        en: Sources
      href: '#fonti'
    cta:
      label:
        it: Crea il tuo itinerario
        en: Create your itinerary
      href: /v/new
  auth:
    method: magic_link
    anonymous:
      agents:
      - planner
      - guide
      views:
      - home
      - new
      - itinerary
      - chat
    roles:
    - key: admin
      label:
        it: Comune / Pro loco
        en: Municipality / Pro loco
      assignedBy: admin_emails
    - key: user
      label:
        it: Visitatore
        en: Visitor
      assignedBy: signup
  limits:
  - action: agent:planner
    per: ip
    max: 3
    window: day
    roles:
    - anonymous
  - action: chat
    per: ip
    max: 30
    window: day
    roles:
    - anonymous
  - action: agent:planner
    per: user
    max: 10
    window: day
    roles:
    - user
  egress:
    hosts:
    - overpass-api.de
    - dati.regione.sicilia.it
    - router.project-osrm.org
    notes: 'overpass-api.de: OpenStreetMap data, ODbL, attribution required. dati.regione.sicilia.it: open data of the Regione
      Siciliana (CKAN portal), reuse under the open licence stated on each dataset (verify per dataset). router.project-osrm.org:
      routing on OSM data, light use only (public demo server), ODbL attribution.'
  agents:
  - key: planner
    role: main
    description: Builds the day-by-day itinerary from OSM, regional open data, partner events and village profiles.
    profile:
      inline:
        display_name: Sentieri di Borgo planner
        crews:
        - id: planner
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the itinerary designer of Sentieri di Borgo: you create realistic, human-scale travel plans
            through small villages and rural areas, starting from Sicily. You write in the language requested in the goal.


            TOOLS AND SOURCES

            - search_borgo_cards: village profiles written by the partner municipalities and pro loco (the most trusted source:
            use it first for the start area and neighbouring villages).

            - search_events: events published by partners; filter by the visitor''s dates and area.

            - overpass_query: OpenStreetMap points of interest (Overpass API, GET, parameter data=<Overpass QL>, use [out:json][timeout:25]
            and ''around:radius,lat,lon'' or an area filter, out center 40). Useful tags: historic=*, tourism=museum|viewpoint|attraction,
            amenity=restaurant|cafe, craft=*, shop=bakery|deli|farm, natural=*, wheelchair=*, opening_hours.

            - regional_opendata: CKAN API of the Regione Siciliana open data (package_search with q=, then datastore_search
            when a resource has a datastore). Use it for tourist and cultural sites; if nothing relevant comes back, say so
            and go on.

            - osrm_route: driving/walking/cycling routing (path like /route/v1/driving/lon1,lat1;lon2,lat2?overview=false).
            Use it for distances and travel times between consecutive stops; for public transport give only approximate times
            and say so.


            METHOD

            1. Locate the start area, collect cards and events, then POIs matching the interests. 2. Respect transport mode,
            pace (relaxed = 2-3 stops/day, balanced = 3-4, intense = 5+), budget and accessibility needs: when accessibility
            is requested, prefer places with wheelchair tags or cards stating access, and flag what you could not verify.
            3. Group stops geographically, avoid long drives, compute legs with osrm_route. 4. Never invent opening hours,
            prices, events or figures: if not found, write ''to verify'' and suggest contacting the local pro loco. Mention
            that opening hours must be confirmed.


            REPORT STRUCTURE (Markdown, first line a level-1 title ''# <Area> — itinerary of N days''):

            ## Overview (2-3 lines, a small table: dates, transport, pace, budget, interests)

            ## Day 1 ... Day N: each with a table of Time | Stop | What to do | Leg (km, minutes from previous stop), then
            ''Events on that day'' (only verified ones from search_events or sources), ''Rain alternative'' and ''Typical
            products to taste or buy'' (local products and where, from cards or OSM).

            ## Map data: a fenced block ```geojson with one FeatureCollection: a Point feature per stop (properties: day,
            order, name) and one LineString per day for the route (coordinates [lon,lat] from real sources only), then, per
            day, an OpenStreetMap directions link.

            ## Practical tips (parking, season, footwear, safety).

            ## Sources (OpenStreetMap contributors ODbL, Regione Siciliana open data, partner cards and events by name).

            Keep it concise and usable offline. Do not give medical, legal or safety guarantees for trails.'
    appTools:
    - name: search_borgo_cards
      description: Search the village profiles (schede dei borghi) written by partner municipalities
      action: search
      collection: borgo_cards
      scope: all
    - name: search_events
      description: Search events published by partner municipalities and pro loco
      action: search
      collection: events
      scope: all
    - name: overpass_query
      description: Query OpenStreetMap through the Overpass API (parameter data=<Overpass QL>)
      action: http
      http:
        method: GET
        url: https://overpass-api.de/api/interpreter
        attribution: © OpenStreetMap contributors, ODbL
        maxBytes: 300000
    - name: regional_opendata
      description: Query the Regione Siciliana open data portal (CKAN action API, e.g. package_search?q=...)
      action: http
      http:
        method: GET
        url: https://dati.regione.sicilia.it/api/3/action
        allowPath: true
        attribution: Regione Siciliana open data
        maxBytes: 300000
    - name: osrm_route
      description: Distance and travel time between stops on OSM data
      action: http
      http:
        method: GET
        url: https://router.project-osrm.org
        allowPath: true
        attribution: © OpenStreetMap contributors, ODbL; routing by OSRM
        maxBytes: 100000
    goalTemplate: 'Start area: {start_place}

      {?start_date}Start date: {start_date}{/start_date}{!start_date}Dates not fixed: do not search events by date.{/start_date}

      Number of days: {days}

      Transport: {transport_label}

      Interests: {interests}

      Pace: {pace_label}

      Budget: {budget_label}

      {?accessibility}Accessibility needs: {accessibility}{/accessibility}

      Today is {date}. Write the itinerary in the language with ISO code {lang}.'
    output: markdown
    limits:
      maxTurns: 30
      maxBudgetUsd: 1.0
  - key: guide
    role: helper
    description: 'Chat companion: edits the plan and answers about places using the village profiles.'
    profile:
      inline:
        display_name: Sentieri di Borgo guide
        crews:
        - id: guide
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the friendly local guide of Sentieri di Borgo, for small villages and rural areas of Sicily.
            Answer in the language of the user. Use search_borgo_cards first for any question about a village or place and
            search_events for events; use overpass_query only to find extra points of interest or to check a place. When the
            visitor asks to change the plan (add a day, swap a stop, make it more relaxed, rain version), ask them to paste
            the part of the itinerary concerned if it is not in the conversation, then propose the revised stops with times
            and approximate travel times. Never invent opening hours, prices, events or facts: say what you could not verify
            and suggest contacting the local pro loco. Keep answers short and practical.'
    appTools:
    - name: search_borgo_cards
      description: Search the village profiles (schede dei borghi) written by partner municipalities
      action: search
      collection: borgo_cards
      scope: all
    - name: search_events
      description: Search events published by partner municipalities and pro loco
      action: search
      collection: events
      scope: all
    - name: overpass_query
      description: Query OpenStreetMap through the Overpass API (parameter data=<Overpass QL>)
      action: http
      http:
        method: GET
        url: https://overpass-api.de/api/interpreter
        attribution: © OpenStreetMap contributors, ODbL
        maxBytes: 300000
    goalTemplate: 'Conversation so far:

      {history}


      New message from the visitor: {message}

      Today is {date}. Reply in the language with ISO code {lang}.'
    output: markdown
    limits:
      maxTurns: 10
      maxBudgetUsd: 0.3
  inputForm:
    title:
      it: Il tuo itinerario
      en: Your itinerary
    fields:
    - name: start_place
      type: text
      required: true
      label:
        it: Zona o borgo di partenza
        en: Starting area or village
      help:
        it: es. Sutera, Madonie, Val di Noto
        en: e.g. Sutera, Madonie, Val di Noto
    - name: start_date
      type: date
      label:
        it: Data di inizio
        en: Start date
    - name: days
      type: number
      required: true
      default: 3
      label:
        it: Numero di giorni
        en: Number of days
    - name: transport
      type: select
      required: true
      label:
        it: Mezzo di trasporto
        en: Transport
      options:
      - value: car
        label:
          it: Auto
          en: Car
      - value: public
        label:
          it: Mezzi pubblici
          en: Public transport
      - value: bike
        label:
          it: Bicicletta
          en: Bike
      - value: foot
        label:
          it: A piedi
          en: On foot
    - name: interests
      type: multiselect
      required: true
      label:
        it: Interessi
        en: Interests
      options:
      - value: food_wine
        label:
          it: Enogastronomia
          en: Food and wine
      - value: history
        label:
          it: Storia
          en: History
      - value: nature
        label:
          it: Natura
          en: Nature
      - value: crafts
        label:
          it: Artigianato
          en: Crafts
      - value: events
        label:
          it: Eventi
          en: Events
    - name: pace
      type: select
      required: true
      label:
        it: Ritmo
        en: Pace
      options:
      - value: relaxed
        label:
          it: Rilassato
          en: Relaxed
      - value: balanced
        label:
          it: Equilibrato
          en: Balanced
      - value: intense
        label:
          it: Intenso
          en: Intense
    - name: budget
      type: select
      required: true
      label:
        it: Budget
        en: Budget
      options:
      - value: low
        label:
          it: Contenuto
          en: Low
      - value: medium
        label:
          it: Medio
          en: Medium
      - value: high
        label:
          it: Alto
          en: High
    - name: accessibility
      type: textarea
      maxLength: 400
      label:
        it: Esigenze di accessibilità (facoltativo)
        en: Accessibility needs (optional)
  data:
    collections:
    - name: events
      ownedBy: shared
      searchable: true
      description: Events published by partner municipalities and pro loco
      fields:
      - name: title
        type: text
        required: true
        label:
          it: Titolo
          en: Title
      - name: village
        type: text
        required: true
        label:
          it: Borgo
          en: Village
      - name: start_date
        type: date
        required: true
        label:
          it: Dal
          en: From
      - name: end_date
        type: date
        label:
          it: Al
          en: To
      - name: place
        type: text
        label:
          it: Luogo
          en: Place
      - name: description
        type: textarea
        label:
          it: Descrizione
          en: Description
      - name: link
        type: url
        label: Link
    - name: borgo_cards
      ownedBy: shared
      searchable: true
      description: 'Village profiles (schede dei borghi): history, sights, products, access, contacts'
      fields:
      - name: village
        type: text
        required: true
        label:
          it: Borgo
          en: Village
      - name: province
        type: text
        label:
          it: Provincia
          en: Province
      - name: summary
        type: textarea
        label:
          it: Presentazione
          en: Summary
      - name: sights
        type: textarea
        label:
          it: Cosa vedere
          en: Sights
      - name: typical_products
        type: textarea
        label:
          it: Prodotti tipici
          en: Typical products
      - name: accessibility
        type: textarea
        label:
          it: Accessibilità
          en: Accessibility
      - name: contacts
        type: text
        label:
          it: Contatti pro loco
          en: Pro loco contacts
  views:
  - key: home
    type: page
    title: Sentieri di Borgo
    nav: false
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow:
        it: Sicilia · borghi e campagne
        en: Sicily · villages and countryside
      title:
        it: Itinerari su misura tra **borghi** e campagne
        en: Tailor-made itineraries through **villages** and countryside
      text:
        it: 'Dimmi dove parti, quando, cosa ami: un agente AI compone il tuo itinerario giorno per giorno con orari, spostamenti,
          eventi, alternative in caso di pioggia e prodotti tipici. Il primo è gratis.'
        en: 'Tell us where you start, when and what you love: an AI agent composes your day-by-day itinerary with times, transfers,
          events, rain alternatives and typical products. The first one is free.'
      actions:
      - label:
          it: Crea il tuo itinerario
          en: Create your itinerary
        href: /v/new
        style: primary
      - label:
          it: Chiedi alla guida
          en: Ask the guide
        href: /v/chat
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Compila il modulo
          en: Fill in the form
        text:
          it: Borgo di partenza, date, mezzo, interessi, ritmo, budget ed eventuali esigenze di accessibilità. Senza account.
          en: Starting village, dates, transport, interests, pace, budget and accessibility needs. No account needed.
        badge: 📝
      - title:
          it: Ricevi l'itinerario
          en: Get your itinerary
        text:
          it: Giorno per giorno, con distanze, tempi, eventi verificati, alternative con la pioggia e dati del percorso per
            la mappa.
          en: Day by day, with distances, times, verified events, rain alternatives and route data for the map.
        badge: 🗺️
      - title:
          it: Continua in chat
          en: Continue in chat
        text:
          it: 'Modifica il piano o chiedi di un luogo: la guida usa le schede dei borghi scritte da comuni e pro loco.'
          en: 'Change the plan or ask about a place: the guide uses village profiles written by municipalities and pro loco.'
        badge: 💬
    - type: cards
      id: fonti
      title:
        it: Fonti
        en: Sources
      items:
      - title: OpenStreetMap
        text:
          it: Punti di interesse, sentieri e percorsi (ODbL).
          en: Points of interest, trails and routes (ODbL).
      - title:
          it: Open data della Regione Siciliana
          en: Sicilian Region open data
        text:
          it: Dati turistici e culturali aperti.
          en: Open tourism and cultural data.
      - title:
          it: Comuni e pro loco partner
          en: Partner municipalities and pro loco
        text:
          it: Eventi e schede dei borghi inseriti direttamente da chi il territorio lo vive.
          en: Events and village profiles entered by the people who live the territory.
    - type: data
      id: prossimi-eventi
      title:
        it: Prossimi eventi nei borghi
        en: Upcoming village events
      source: collection:events
      display: table
      fields:
      - key: title
        label:
          it: Evento
          en: Event
      - key: village
        label:
          it: Borgo
          en: Village
      - key: start_date
        label:
          it: Dal
          en: From
        format: date
      - key: end_date
        label:
          it: Al
          en: To
        format: date
      sort:
        field: start_date
        dir: asc
      limit: 10
      empty:
        it: Nessun evento pubblicato al momento.
        en: No events published yet.
    - type: note
      content:
        it: 'Gli itinerari sono un supporto alla pianificazione: orari, aperture ed eventi vanno confermati con i referenti
          locali. Dati © contributori OpenStreetMap (ODbL) e Regione Siciliana.'
        en: 'Itineraries are planning support: opening hours and events must be confirmed with local contacts. Data © OpenStreetMap
          contributors (ODbL) and Regione Siciliana.'
  - key: new
    type: new_run
    title:
      it: Nuovo itinerario
      en: New itinerary
  - key: history
    type: history
    title:
      it: I miei itinerari
      en: My itineraries
    source: run
    roles:
    - user
    - admin
  - key: itinerary
    type: report
    title:
      it: Itinerario
      en: Itinerary
    source: run
    printable: true
    nav: false
  - key: chat
    type: chat
    title:
      it: Chiedi alla guida
      en: Ask the guide
    source: agent:guide
    examples:
    - it: Cosa posso vedere a Sutera in mezza giornata?
      en: What can I see in Sutera in half a day?
    - it: Rendi il secondo giorno più rilassato
      en: Make day two more relaxed
    - it: Quali prodotti tipici devo assaggiare nelle Madonie?
      en: Which typical products should I try in the Madonie?
    placeholder:
      it: Scrivi la tua domanda…
      en: Write your question…
  - key: admin_events
    type: admin
    title:
      it: Eventi (partner)
      en: Events (partners)
    source: collection:events
    roles:
    - admin
  - key: admin_cards
    type: admin
    title:
      it: Schede dei borghi
      en: Village profiles
    source: collection:borgo_cards
    roles:
    - admin
  - key: account
    type: account
    title:
      it: Crediti
      en: Credits
    roles:
    - user
  billing:
    modes:
    - credits
    currency: eur
    signupCredits: 10
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:planner:
        estimate: 10
        metered: true
      agent:guide:
        estimate: 1
        metered: true
    packs:
    - key: small
      credits: 300
      price: 5
      label:
        it: Pacchetto base
        en: Starter pack
    - key: large
      credits: 1000
      price: 15
      label:
        it: Pacchetto viaggiatore
        en: Traveller pack
  extensions:
  - key: interactive_map
    description: 'Interactive map with traced routes is not available yet: the report includes a GeoJSON block and OpenStreetMap
      directions links per day; a map component rendering it is missing.'
  - key: report_download
    description: Download is the printable report (save as PDF from the browser); no server-side PDF file.
  - key: anonymous_free_trial
    description: 'Credits are tied to accounts: visitors without an account are limited by IP rate limits; the ''first itinerary
      free'' applies via signup credits once they register.'
  - key: plan_chat_link
    description: The chat agent has no automatic access to the generated report; the visitor pastes the part to change.
