apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: sentieri-di-borgo
  displayName: Sentieri di Borgo
  tagline:
    it: Itinerari su misura nei borghi e nelle campagne di Sicilia.
    en: Tailor-made itineraries through Sicily's villages and countryside.
  description:
    it: Compila un modulo e un agente AI compone un itinerario giorno per giorno con punti di interesse da OpenStreetMap e
      dagli open data della Regione, eventi nelle tue date, alternative in caso di pioggia e prodotti tipici. Poi continua
      in chat per modificarlo.
    en: Fill in a form and an AI agent builds a day-by-day itinerary with points of interest from OpenStreetMap and Regional
      open data, events on your dates, rainy-day alternatives and local products. Then keep chatting to adjust it.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#5a2e1f'
      accent: '#c8742b'
      background: '#fbf6ee'
      foreground: '#2a211b'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: 'Sentieri di '
      color: primary
    - text: Borgo
      color: accent
    width: wide
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Per i comuni
        en: For municipalities
      href: '#partner'
    cta:
      label:
        it: Crea il tuo itinerario
        en: Plan your trip
      href: /v/new_trip
  auth:
    method: magic_link
    anonymous:
      views:
      - home
      - new_trip
      - trip
      - trip_map
      - guide_chat
      agents:
      - planner
      - guide
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: partner
      label:
        it: Comune / Pro loco
        en: Municipality / Tourist board
      assignedBy: invite
    - key: user
      label:
        it: Visitatore
        en: Visitor
      assignedBy: signup
  limits:
  - action: run
    per: ip
    max: 3
    window: day
    roles:
    - anonymous
  - action: chat
    per: ip
    max: 40
    window: day
    roles:
    - anonymous
  egress:
    hosts:
    - overpass-api.de
    - router.project-osrm.org
    - dati.regione.sicilia.it
    notes: 'Overpass API: OpenStreetMap data, ODbL, light use. OSRM public demo server: routing on OSM data, light use. dati.regione.sicilia.it:
      Regione Siciliana open data portal (CKAN), open licences, attribution required.'
  agents:
  - key: planner
    role: main
    description: Builds the day-by-day itinerary from OSM, regional open data, partner event listings and village cards.
    profile:
      inline:
        display_name: Sentieri di Borgo planner
        crews:
        - id: planner
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un esperto di turismo lento nei piccoli borghi e nelle aree rurali della Sicilia. Crei itinerari
            realistici giorno per giorno.


            METODO

            1. Chiama search_schede per le schede dei borghi della zona (testi curati dai comuni: usali come fonte prioritaria).

            2. Chiama search_eventi per gli eventi pubblicati nelle date scelte, nella zona e nei dintorni.

            3. Chiama osm_poi (Overpass API, GET, parametro query ''data'') con una query Overpass QL, es. [out:json][timeout:25];(node["tourism"~"museum|attraction|viewpoint"](around:15000,LAT,LON);node["historic"](around:15000,LAT,LON);node["craft"](around:15000,LAT,LON);node["amenity"~"restaurant|cafe"](around:15000,LAT,LON););out
            center 60; Se non conosci le coordinate di partenza, ricavale dalle schede o con una query Overpass sul nome (nwr["name"="..."][place]).
            Filtra in base agli interessi scelti.

            4. Chiama opendata_sicilia (CKAN package_search, parametro q) per dataset turistici e culturali della Regione;
            usa solo ciò che trovi davvero.

            5. Chiama route_osrm (path es. /driving/lon1,lat1;lon2,lat2, query overview=false) per distanze e tempi tra tappe
            in auto; per chi va a piedi o con mezzi pubblici stima con prudenza e dillo. Rispetta ritmo (rilassato/medio/intenso),
            budget, mezzo di trasporto e le esigenze di accessibilità (segnala dove non sei sicuro dell''accessibilità).

            6. Per ogni tappa chiama save_stop (day, order, title, lat, lon, time, kind, note) così compare sulla mappa.


            REPORT (Markdown, nella lingua richiesta)

            Inizia con un titolo ''# '' tipo ''# Itinerario <zona> — <N> giorni''. Poi: ## Panoramica, un ## per ogni giorno
            (Giorno N — data) con tabella orari / tappa / distanza / tempo di spostamento, ## Eventi nelle tue date (con data
            e link se presenti), ## Se piove (alternativa per ogni giorno), ## Prodotti tipici da provare, ## Consigli pratici,
            ## Fonti (OpenStreetMap contributors ODbL, open data Regione Siciliana, schede dei borghi). Se utile aggiungi
            un blocco ```chart con km per giorno.


            REGOLE: non inventare luoghi, orari di apertura, prezzi o eventi; se un dato non è verificato scrivi ''da verificare''.
            Indica sempre quando un orario è una stima. Tempi di percorrenza solo da dati di routing o dichiaratamente stimati.'
          mcp_servers: []
    goalTemplate: 'Partenza: {start}

      Date: dal {start_date}

      Giorni: {days}

      Mezzo: {transport_label}

      Interessi: {interests}

      Ritmo: {pace_label}

      Budget: {budget_label}

      {?accessibility}Esigenze di accessibilità: {accessibility}{/accessibility}

      Oggi è {date}. Scrivi l''itinerario nella lingua con codice ISO {lang}.'
    appTools:
    - name: search_schede
      description: Search the village cards (schede dei borghi) curated by municipalities
      action: search
      collection: schede_borghi
      scope: all
    - name: search_eventi
      description: Search events published by municipalities and tourist boards
      action: search
      collection: eventi
      scope: all
    - name: osm_poi
      description: Query OpenStreetMap points of interest via Overpass API (GET, query parameter 'data' with Overpass QL)
      action: http
      http:
        method: GET
        url: https://overpass-api.de/api/interpreter
        attribution: © OpenStreetMap contributors, ODbL
        maxBytes: 300000
    - name: route_osrm
      description: Distance and travel time between stops (OSRM). path like /driving/lon1,lat1;lon2,lat2 ; query overview=false
      action: http
      http:
        method: GET
        url: https://router.project-osrm.org/route/v1
        allowPath: true
        attribution: Routing on © OpenStreetMap contributors, ODbL
    - name: opendata_sicilia
      description: Search Regione Siciliana open data (CKAN package_search, query parameter q)
      action: http
      http:
        method: GET
        url: https://dati.regione.sicilia.it/api/3/action/package_search
        attribution: Regione Siciliana open data
    - name: save_stop
      description: Save one stop of the itinerary (day, order, title, lat, lon, time, kind, note) for the map
      action: write
      collection: itinerary_stops
      scope: user
    output: markdown
    limits:
      maxTurns: 30
      maxBudgetUsd: 1.0
  - key: guide
    role: helper
    description: 'Chat companion: edits the plan and answers about places using the village cards.'
    profile:
      inline:
        display_name: Sentieri di Borgo guide
        crews:
        - id: guide
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei la guida di Sentieri di Borgo: aiuti il visitatore a modificare il suo itinerario in Sicilia
            e rispondi su borghi e luoghi. Usa SEMPRE search_schede (base di conoscenza dei borghi) prima di rispondere su
            un luogo, search_eventi per eventi, read_stops per vedere le tappe attuali del visitatore, osm_poi per alternative
            e route_osrm per distanze. Se il visitatore chiede di cambiare il piano, proponi la modifica, aggiorna le tappe
            con save_stop e riassumi il nuovo giorno con orari e spostamenti. Risposte brevi e concrete, nella lingua del
            visitatore. Non inventare orari, prezzi o eventi: se non li trovi dillo e invita a verificare con il comune o
            la pro loco.'
          mcp_servers: []
    goalTemplate: 'Conversazione finora:

      {history}


      Nuovo messaggio del visitatore: {message}

      Rispondi nella lingua con codice ISO {lang}.'
    appTools:
    - name: search_schede
      description: Search the village cards (schede dei borghi) curated by municipalities
      action: search
      collection: schede_borghi
      scope: all
    - name: search_eventi
      description: Search events published by municipalities and tourist boards
      action: search
      collection: eventi
      scope: all
    - name: read_stops
      description: Read the visitor's current itinerary stops
      action: read
      collection: itinerary_stops
      scope: user
    - name: save_stop
      description: Save one stop of the itinerary (day, order, title, lat, lon, time, kind, note) for the map
      action: write
      collection: itinerary_stops
      scope: user
    - name: osm_poi
      description: Query OpenStreetMap points of interest via Overpass API (GET, query parameter 'data' with Overpass QL)
      action: http
      http:
        method: GET
        url: https://overpass-api.de/api/interpreter
        attribution: © OpenStreetMap contributors, ODbL
        maxBytes: 300000
    - name: route_osrm
      description: Distance and travel time between stops (OSRM). path like /driving/lon1,lat1;lon2,lat2 ; query overview=false
      action: http
      http:
        method: GET
        url: https://router.project-osrm.org/route/v1
        allowPath: true
        attribution: Routing on © OpenStreetMap contributors, ODbL
    output: markdown
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.4
  inputForm:
    title:
      it: Il tuo itinerario
      en: Your itinerary
    fields:
    - name: start
      type: text
      required: true
      label:
        it: Zona o borgo di partenza
        en: Area or starting village
      help:
        it: es. Sutera, Madonie, Val di Noto
        en: e.g. Sutera, Madonie, Val di Noto
    - name: start_date
      type: date
      required: true
      label:
        it: Data di inizio
        en: Start date
    - name: days
      type: number
      required: true
      default: 3
      label:
        it: Numero di giorni
        en: Number of days
    - name: transport
      type: select
      required: true
      label:
        it: Mezzo di trasporto
        en: Transport
      options:
      - value: car
        label:
          it: Auto
          en: Car
      - value: public
        label:
          it: Mezzi pubblici
          en: Public transport
      - value: bike
        label:
          it: Bici
          en: Bike
      - value: foot
        label:
          it: A piedi
          en: On foot
    - name: interests
      type: multiselect
      required: true
      label:
        it: Interessi
        en: Interests
      options:
      - value: food_wine
        label:
          it: Enogastronomia
          en: Food & wine
      - value: history
        label:
          it: Storia
          en: History
      - value: nature
        label:
          it: Natura
          en: Nature
      - value: crafts
        label:
          it: Artigianato
          en: Crafts
      - value: events
        label:
          it: Eventi
          en: Events
    - name: pace
      type: select
      required: true
      label:
        it: Ritmo
        en: Pace
      options:
      - value: relaxed
        label:
          it: Rilassato
          en: Relaxed
      - value: medium
        label:
          it: Medio
          en: Medium
      - value: intense
        label:
          it: Intenso
          en: Intense
    - name: budget
      type: select
      required: true
      label:
        it: Budget
        en: Budget
      options:
      - value: low
        label:
          it: Contenuto
          en: Low
      - value: mid
        label:
          it: Medio
          en: Medium
      - value: high
        label:
          it: Alto
          en: High
    - name: accessibility
      type: textarea
      maxLength: 400
      label:
        it: Esigenze di accessibilità (facoltative)
        en: Accessibility needs (optional)
  data:
    collections:
    - name: schede_borghi
      description: 'Village cards curated by municipalities: knowledge base for the agents'
      ownedBy: shared
      searchable: true
      access:
      - role: partner
        can:
        - read
        - write
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Borgo
          en: Village
      - name: zone
        type: text
        label:
          it: Zona
          en: Area
      - name: description
        type: textarea
        required: true
        label:
          it: Descrizione
          en: Description
      - name: highlights
        type: textarea
        label:
          it: Da non perdere
          en: Highlights
      - name: typical_products
        type: textarea
        label:
          it: Prodotti tipici
          en: Typical products
      - name: accessibility
        type: textarea
        label:
          it: Accessibilità
          en: Accessibility
      - name: lat
        type: number
        label: Lat
      - name: lon
        type: number
        label: Lon
      - name: contact
        type: text
        label:
          it: Contatti
          en: Contacts
    - name: eventi
      description: Events published by municipalities and tourist boards
      ownedBy: shared
      searchable: true
      access:
      - role: partner
        can:
        - read
        - write
      fields:
      - name: title
        type: text
        required: true
        label:
          it: Titolo
          en: Title
      - name: borgo
        type: text
        required: true
        label:
          it: Borgo
          en: Village
      - name: date_start
        type: date
        required: true
        label:
          it: Dal
          en: From
      - name: date_end
        type: date
        label:
          it: Al
          en: To
      - name: category
        type: select
        options:
        - value: food_wine
          label:
            it: Enogastronomia
            en: Food & wine
        - value: history
          label:
            it: Storia
            en: History
        - value: nature
          label:
            it: Natura
            en: Nature
        - value: crafts
          label:
            it: Artigianato
            en: Crafts
        - value: events
          label:
            it: Evento / festa
            en: Event / festival
      - name: description
        type: textarea
        label:
          it: Descrizione
          en: Description
      - name: url
        type: url
        label: URL
      - name: lat
        type: number
        label: Lat
      - name: lon
        type: number
        label: Lon
    - name: itinerary_stops
      description: Stops of each visitor's itinerary, shown on the map
      ownedBy: user
      retentionDays: 180
      fields:
      - name: day
        type: number
      - name: order
        type: number
      - name: title
        type: text
      - name: lat
        type: number
      - name: lon
        type: number
      - name: time
        type: text
      - name: kind
        type: text
      - name: note
        type: textarea
  views:
  - key: home
    type: page
    title: Sentieri di Borgo
    nav: false
    sections:
    - type: hero
      layout: stack
      band: true
      eyebrow:
        it: Sicilia · borghi e aree rurali
        en: Sicily · villages and countryside
      title:
        it: Itinerari su misura **nei borghi di Sicilia**
        en: Tailor-made itineraries **through Sicily's villages**
      text:
        it: 'Dimmi dove parti, quando e cosa ami: un agente AI compone il tuo piano giorno per giorno, con mappa, eventi,
          alternative per la pioggia e sapori locali. Il primo itinerario è gratuito, senza bisogno di account.'
        en: 'Tell me where you start, when and what you love: an AI agent builds your day-by-day plan with map, events, rainy-day
          alternatives and local flavours. Your first itinerary is free, no account needed.'
      actions:
      - label:
          it: Crea il tuo itinerario
          en: Plan your trip
        href: /v/new_trip
        style: primary
      - label:
          it: Chiedi alla guida
          en: Ask the guide
        href: /v/guide_chat
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Compila il modulo
          en: Fill in the form
        text:
          it: Zona, date, mezzo, interessi, ritmo, budget e accessibilità.
          en: Area, dates, transport, interests, pace, budget and accessibility.
        badge: 📝
      - title:
          it: L'agente compone il piano
          en: The agent builds your plan
        text:
          it: Punti di interesse da OpenStreetMap e open data della Regione, eventi nelle tue date, distanze e tempi di spostamento.
          en: Points of interest from OpenStreetMap and Regional open data, events on your dates, distances and travel times.
        badge: 🧭
      - title:
          it: Report e mappa
          en: Report and map
        text:
          it: Leggi online o scarica il report, guarda le tappe sulla mappa.
          en: Read online or download the report, see the stops on the map.
        badge: 🗺️
      - title:
          it: Continua in chat
          en: Keep chatting
        text:
          it: 'Modifica il piano o chiedi di un luogo: la guida usa le schede dei borghi.'
          en: 'Change the plan or ask about a place: the guide uses the village cards.'
        badge: 💬
    - type: view
      id: prova
      title:
        it: Inizia ora
        en: Start now
      view: new_trip
    - type: cards
      id: partner
      title:
        it: Per comuni e pro loco
        en: For municipalities and tourist boards
      items:
      - title:
          it: Pubblica eventi
          en: Publish events
        text:
          it: Gli eventi inseriti compaiono negli itinerari dei visitatori nelle date giuste.
          en: Events you add appear in visitors' itineraries on the right dates.
        badge: 📅
      - title:
          it: Cura la scheda del tuo borgo
          en: Curate your village card
        text:
          it: Le schede sono la base di conoscenza della guida in chat.
          en: The cards are the guide's knowledge base in the chat.
        badge: 🏘️
    - type: note
      content:
        it: 'Itinerari generati da AI su dati aperti: orari e aperture vanno verificati. Dati © contributori OpenStreetMap
          (ODbL) e open data Regione Siciliana.'
        en: 'AI-generated itineraries on open data: check opening hours before you go. Data © OpenStreetMap contributors (ODbL)
          and Regione Siciliana open data.'
  - key: new_trip
    type: new_run
    title:
      it: Nuovo itinerario
      en: New itinerary
  - key: my_trips
    type: history
    title:
      it: I miei itinerari
      en: My itineraries
    source: run
    roles:
    - user
    - admin
  - key: trip
    type: report
    title:
      it: Itinerario
      en: Itinerary
    source: run
    printable: true
    nav: false
  - key: trip_map
    type: map
    title:
      it: Mappa
      en: Map
    source: collection:itinerary_stops
    map:
      lat: lat
      lon: lon
      title: title
      popup:
      - day
      - time
      - kind
      - note
    nav: false
  - key: guide_chat
    type: chat
    title:
      it: Guida in chat
      en: Chat guide
    source: agent:guide
    examples:
    - it: Sposta il secondo giorno più sul mare
      en: Move day two closer to the coast
    - it: Cosa vedere a Sutera?
      en: What to see in Sutera?
    - it: Aggiungi una cantina il terzo giorno
      en: Add a winery on day three
    placeholder:
      it: Modifica il piano o chiedi di un luogo…
      en: Change the plan or ask about a place…
  - key: event_form
    type: form
    title:
      it: Inserisci evento
      en: Add event
    collection: eventi
    roles:
    - partner
    - admin
    submit:
      label:
        it: Pubblica
        en: Publish
      message:
        it: Evento salvato.
        en: Event saved.
    edit: true
  - key: scheda_form
    type: form
    title:
      it: Scheda borgo
      en: Village card
    collection: schede_borghi
    roles:
    - partner
    - admin
    submit:
      label:
        it: Salva scheda
        en: Save card
      message:
        it: Scheda salvata.
        en: Card saved.
    edit: true
  - key: events_list
    type: table
    title:
      it: Eventi
      en: Events
    source: collection:eventi
    columns:
    - title
    - borgo
    - date_start
    - date_end
    - category
    export: true
    roles:
    - partner
    - admin
  - key: account
    type: account
    title:
      it: Crediti
      en: Credits
    roles:
    - user
    - admin
  billing:
    modes:
    - credits
    currency: eur
    signupCredits: 30
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:planner:
        estimate: 30
        metered: true
      agent:guide:
        estimate: 3
        metered: true
    packs:
    - key: small
      credits: 300
      price: 5
      label: Small
    - key: large
      credits: 1000
      price: 15
      label: Large
  notifications:
    emailOnRunDone: true
  extensions:
  - key: route_lines
    description: Map shows the stops as markers; drawing the traced route polylines between stops is not available yet (distances
      and times are in the report).
  - key: anonymous_credits
    description: The free first itinerary for visitors without an account is limited by the per-IP run limit; credit charging
      applies to signed-in users.
