apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: fidochiaro
  displayName: FidoChiaro
  tagline:
    it: Richieste di prestito istruite in modo chiaro, con la decisione sempre in mano all'analista.
  description:
    it: FidoChiaro è lo strato software con cui una società finanziaria raccoglie le richieste di prestito, verifica la completezza
      delle pratiche, prepara una scheda riassuntiva per l'analista crediti e tiene il richiedente informato sullo stato.
      La valutazione tramite open banking resta al fornitore autorizzato esterno.
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12355b'
      accent: '#1f8a70'
      background: '#f6f8fb'
      foreground: '#16212e'
    fonts:
      body: Inter
      display: Merriweather
    wordmark:
    - text: Fido
      color: primary
    - text: Chiaro
      color: accent
  header:
    links:
    - label: Come funziona
      href: '#come-funziona'
    - label: Privacy e garanzie
      href: '#garanzie'
    cta:
      label: Richiedi un prestito
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Responsabile
      assignedBy: admin_emails
    - key: analista
      label: Analista crediti
      assignedBy: invite
    - key: richiedente
      label: Richiedente
      assignedBy: signup
  limits:
  - action: agent:istruttoria
    per: user
    max: 3
    window: day
    roles:
    - richiedente
  agents:
  - key: istruttoria
    role: main
    description: Controlla la completezza della pratica, calcola indicatori dichiarati e prepara la scheda per l'analista.
      Non decide.
    awaits:
    - decisione_pratica
    profile:
      inline:
        display_name: FidoChiaro istruttoria
        crews:
        - id: istruttoria
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''assistente di istruttoria di una società finanziaria italiana. Prepari la scheda di una richiesta
            di prestito per l''analista crediti. NON approvi, NON rifiuti e NON suggerisci un esito come fosse deciso: la
            decisione spetta solo all''analista. Usa solo i dati forniti; non inventare cifre e non ricavare dati dai conti
            che non siano nel riepilogo dichiarato. Se un dato manca o è incoerente, segnalalo.


            Struttura obbligatoria, in italiano:

            # Scheda pratica — <cognome nome> — <importo> €

            ## Completezza (tabella: campo, presente/mancante/incoerente, nota; controlla anche il formato del codice fiscale
            di 16 caratteri, consensi privacy e accesso ai conti)

            ## Indicatori dichiarati (rata stimata = importo/durata in mesi senza interessi, indicandolo come stima semplificata;
            rata su reddito mensile in %; regolarità delle entrate dal riepilogo conti: entrate medie, variabilità, uscite
            medie, saldo medio mensile; tipo di contratto e stabilità dichiarata)

            ## Punti da verificare (elenco puntato di cose che l''analista deve controllare)

            ## Documenti o integrazioni da chiedere (se servono)

            ## Bozza di spiegazione per il richiedente (testo semplice e rispettoso, solo informativo sullo stato della pratica,
            senza anticipare esiti)

            Se la pratica è completa, chiama il tool request_decisione_pratica con una sintesi di 3 righe per l''analista.
            Aggiungi sempre la nota: «Scheda di supporto: nessuna decisione è stata presa dall''agente.» Non dare consulenza
            finanziaria o legale come fatto.'
          mcp_servers: []
    goalTemplate: 'Nuova richiesta di prestito del {date}.

      Richiedente: {cognome} {nome}, nato/a il {data_nascita}, codice fiscale {codice_fiscale}, residente a {citta}.

      Reddito netto mensile dichiarato: {reddito_mensile} €. Contratto di lavoro: {contratto_label}.

      Importo richiesto: {importo} €. Durata: {durata_mesi} mesi. Finalità: {finalita_label}.

      Consenso privacy: {consenso_privacy}. Consenso all''accesso ai conti tramite fornitore autorizzato: {consenso_conti}.

      Riepilogo dal fornitore autorizzato (entrate e uscite): {?riepilogo_conti}{riepilogo_conti}{/riepilogo_conti}{!riepilogo_conti}non
      ancora ricevuto{/riepilogo_conti}.

      {?note}Note: {note}{/note}

      Scrivi la scheda in italiano.'
    output: markdown
    limits:
      maxTurns: 6
      maxBudgetUsd: 0.4
  inputForm:
    title:
      it: Richiesta di prestito
    fields:
    - name: nome
      type: text
      required: true
      label:
        it: Nome
      maxLength: 80
    - name: cognome
      type: text
      required: true
      label:
        it: Cognome
      maxLength: 80
    - name: data_nascita
      type: date
      required: true
      label:
        it: Data di nascita
    - name: codice_fiscale
      type: text
      required: true
      label:
        it: Codice fiscale
      maxLength: 16
    - name: citta
      type: text
      required: true
      label:
        it: Città di residenza
    - name: reddito_mensile
      type: number
      required: true
      label:
        it: Reddito netto mensile dichiarato (€)
    - name: contratto
      type: select
      required: true
      label:
        it: Tipo di contratto di lavoro
      options:
      - value: indeterminato
        label: Tempo indeterminato
      - value: determinato
        label: Tempo determinato
      - value: autonomo
        label: Lavoratore autonomo / P.IVA
      - value: pensionato
        label: Pensionato
      - value: altro
        label: Altro
    - name: importo
      type: number
      required: true
      label:
        it: Importo richiesto (€)
    - name: durata_mesi
      type: number
      required: true
      label:
        it: Durata (mesi)
    - name: finalita
      type: select
      required: true
      label:
        it: Finalità
      options:
      - value: casa
        label: Ristrutturazione casa
      - value: auto
        label: Acquisto auto
      - value: studio
        label: Studio e formazione
      - value: consolidamento
        label: Consolidamento debiti
      - value: spese
        label: Spese personali
    - name: consenso_privacy
      type: boolean
      required: true
      label:
        it: Ho letto e accetto l'informativa privacy
    - name: consenso_conti
      type: boolean
      required: true
      label:
        it: Acconsento all'accesso ai miei conti tramite il fornitore autorizzato esterno
    - name: riepilogo_conti
      type: textarea
      maxLength: 3000
      label:
        it: Riepilogo entrate e uscite dal fornitore autorizzato
      help:
        it: Incolla il riepilogo restituito dal fornitore dopo aver dato il consenso (es. entrate medie, uscite medie, ultimi
          6 mesi).
    - name: note
      type: textarea
      maxLength: 600
      label:
        it: Note (facoltative)
  approvals:
  - key: decisione_pratica
    title:
      it: Decisione sulla pratica
    description: L'analista crediti approva, rifiuta (con motivazione comprensibile) o chiede integrazioni.
    role: analista
    decidedBy: role
    fields:
    - sintesi
    - punti_da_verificare
    timeoutMinutes: 10080
    onTimeout: reject
  data:
    collections:
    - name: pratiche
      ownedBy: user
      description: Stato delle pratiche del richiedente (visibile solo a lui)
      fields:
      - name: stato
        type: select
        options:
        - ricevuta
        - in_istruttoria
        - integrazioni
        - approvata
        - rifiutata
      - name: motivazione
        type: textarea
  views:
  - key: home
    type: page
    nav: false
    title: FidoChiaro
    sections:
    - type: hero
      title: Il tuo prestito, **chiaro** in ogni passaggio.
      text: Compila la richiesta online, segui lo stato nella tua area personale e, se serve un'integrazione o un rifiuto,
        ricevi una spiegazione comprensibile. Ogni decisione è presa da un analista crediti, mai da un automatismo.
      eyebrow: Società finanziaria · Richieste di prestito
      actions:
      - label: Richiedi un prestito
        href: /login
        style: primary
      note: La valutazione tramite open banking è svolta da un fornitore autorizzato esterno.
    - type: steps
      id: come-funziona
      title: Come funziona
      items:
      - title: 1 · Compili la richiesta
        text: Dati anagrafici, reddito, importo, durata e finalità, con consenso privacy.
        badge: 📝
      - title: 2 · Consenso ai conti
        text: Dai il consenso al fornitore autorizzato esterno, che restituisce un riepilogo di entrate e uscite.
        badge: 🏦
      - title: 3 · Istruttoria assistita
        text: Un agente verifica la completezza e prepara una scheda con i punti da controllare.
        badge: 🔍
      - title: 4 · Decide l'analista
        text: Approva, rifiuta con motivazione chiara o chiede integrazioni. Segui tutto nell'area personale.
        badge: ✅
    - type: cards
      id: garanzie
      title: Privacy e garanzie
      items:
      - title: Solo la tua pratica
        text: Vedi esclusivamente i tuoi dati; gli analisti lavorano sulle pratiche assegnate.
      - title: Nessuna decisione automatica
        text: L'agente prepara la scheda, l'esito è sempre di una persona.
      - title: Motivazioni comprensibili
        text: In caso di rifiuto spieghiamo i motivi in modo semplice.
    - type: note
      content: FidoChiaro è uno strumento di supporto all'istruttoria e non costituisce consulenza finanziaria. Dati trattati
        secondo l'informativa privacy della società finanziaria.
  - key: nuova
    type: new_run
    title:
      it: Nuova richiesta
    roles:
    - richiedente
    - admin
  - key: mie_pratiche
    type: history
    title:
      it: La mia area personale
    source: run
    columns:
    - createdAt
    - importo
    - durata_mesi
    - status
    roles:
    - richiedente
  - key: pratica
    type: report
    title:
      it: Pratica
    source: run
    printable: true
    nav: false
  - key: stato_pratiche
    type: table
    title:
      it: Stato e motivazioni
    source: collection:pratiche
    data:
      display: table
      fields:
      - key: stato
        label: Stato
        format: badge
      - key: motivazione
        label: Motivazione
      empty: Nessuna pratica.
    roles:
    - richiedente
  - key: coda
    type: approvals
    title:
      it: Coda pratiche
    approvals:
    - decisione_pratica
    roles:
    - analista
  - key: dashboard
    type: page
    title:
      it: Dashboard responsabile
    roles:
    - admin
    sections:
    - type: data
      title: Volumi e tempi
      source: run
      display: kpi
      kpis:
      - label: Pratiche totali
        agg: count
      - label: Ultima pratica
        agg: last
        field: createdAt
        format: date
    - type: data
      title: Pratiche recenti
      source: run
      display: table
      fields:
      - key: createdAt
        label: Data
        format: date
      - key: status
        label: Stato
        format: badge
      sort:
        field: createdAt
        dir: desc
      limit: 50
  billing:
    modes:
    - free
  extensions:
  - key: open_banking_aisp
    description: 'La valutazione basata sull''accesso ai conti richiede un servizio di informazione sui conti (AISP) autorizzato,
      fuori dall''app: il richiedente incolla il riepilogo entrate/uscite restituito dal fornitore.'
  - key: email_esito
    description: 'Invio email al richiedente con l''esito: le notifiche non sono ancora disponibili; l''esito è visibile nell''area
      personale.'
  - key: assegnazione_analisti
    description: 'Assegnazione delle pratiche ai singoli analisti e visibilità limitata a quelle assegnate: oggi tutti gli
      analisti vedono la coda delle approvazioni; serve logica dedicata.'
  - key: tempi_istruttoria
    description: 'Dashboard con tempi medi di istruttoria e volumi per esito: oggi solo conteggi delle esecuzioni.'
  - key: licenza_annuale
    description: 'Licenza annuale per la società finanziaria: contratto gestito fuori dall''app, nessun pagamento per singola
      pratica.'
  - key: upload_documenti
    description: 'Caricamento di documenti (non disponibile): richiedere link o testo incollato.'
