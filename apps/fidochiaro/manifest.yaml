apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: fidochiaro
  displayName: FidoChiaro
  tagline:
    it: Pratiche di prestito chiare, istruite con metodo, decise da persone.
  description:
    it: 'Lo strato software per gestire le richieste di prestito: modulo online, scheda di istruttoria preparata da un agente
      AI, coda per gli analisti crediti, esiti via email e dashboard per il responsabile. La valutazione tramite open banking
      resta al fornitore di servizi di informazione sui conti autorizzato, esterno all''app.'
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12355b'
      accent: '#1f8a70'
      background: '#f6f8fb'
      foreground: '#16202c'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Fido
      color: primary
    - text: Chiaro
      color: accent
  header:
    links:
    - label: Come funziona
      href: '#come-funziona'
    - label: Privacy
      href: '#privacy'
    cta:
      label: Richiedi un prestito
      href: /v/apply
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Responsabile
      assignedBy: admin_emails
    - key: analyst
      label: Analista crediti
      assignedBy: derived
      from: collection:applications.analyst_email
    - key: user
      label: Richiedente
      assignedBy: signup
  agents:
  - key: screener
    role: main
    description: Controlla la completezza della pratica, calcola indicatori dichiarati e prepara la scheda per l'analista.
      Non decide.
    profile:
      inline:
        display_name: FidoChiaro istruttoria
        crews:
        - id: screener
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un assistente di istruttoria per una società finanziaria italiana. Prepari la scheda riassuntiva
            di una pratica di prestito per l''analista crediti. NON decidi, non approvi, non rifiuti e non suggerisci l''esito:
            segnali solo fatti e punti da verificare.


            Procedura:

            1. Leggi la pratica con read_application.

            2. Completezza: verifica che anagrafica, codice fiscale (16 caratteri, formato plausibile), reddito, tipo di contratto,
            importo, durata, finalità, informativa privacy e consenso all''accesso ai conti siano presenti. Elenca ciò che
            manca o è incoerente.

            3. Indicatori DICHIARATI (semplici, senza interessi né costi, dichiaralo): rata indicativa = importo / mesi; rapporto
            rata/reddito mensile in percentuale; regolarità delle entrate in base al tipo di contratto dichiarato (indeterminato,
            determinato, autonomo, pensione, altro) e, se presenti i campi bank_*, confronto con il riepilogo entrate/uscite
            del fornitore esterno (altrimenti scrivi ''riepilogo conti non ancora ricevuto'').

            4. Punti da verificare: incongruenze, importi elevati rispetto al reddito, contratto a termine, dati mancanti,
            documenti da chiedere.

            5. Salva con save_screening i campi screening_summary (la scheda in Markdown, con titolo ''# Scheda pratica —
            <cognome nome>'' e sezioni ## Completezza, ## Indicatori dichiarati, ## Punti da verificare, ## Avvertenza), completeness
            (''completa'' o ''incompleta'') e installment_ratio (numero, percentuale), e status ''in_review'' se la pratica
            è completa, ''integration_requested'' non va mai impostato da te.


            Non inventare mai cifre. Se un dato manca, dillo. Le tue sono indicazioni di supporto: la decisione spetta all''analista.
            Scrivi in italiano.'
          mcp_servers: []
    goalTemplate: 'Istruisci la pratica con codice fiscale {record.tax_code} (richiedente {record.last_name} {record.first_name}).
      Importo {record.amount} euro, durata {record.months} mesi, reddito mensile dichiarato {record.monthly_income} euro,
      contratto {record.contract_type}. Data di oggi: {date}. Usa read_application e poi save_screening.'
    appTools:
    - name: read_application
      description: Legge la pratica del richiedente
      action: read
      collection: applications
      scope: user
    - name: save_screening
      description: Salva scheda, completezza e indicatori nella pratica
      action: write
      collection: applications
      scope: user
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.3
  data:
    collections:
    - name: applications
      description: 'Pratiche di prestito: dati del richiedente, istruttoria, decisione'
      ownedBy: user
      retentionDays: 1095
      access:
      - role: analyst
        where:
          analyst_email: '{user.email}'
        can:
        - read
        - write
      fields:
      - name: first_name
        type: text
        required: true
        label: Nome
      - name: last_name
        type: text
        required: true
        label: Cognome
      - name: birth_date
        type: date
        required: true
        label: Data di nascita
      - name: tax_code
        type: text
        required: true
        maxLength: 16
        label: Codice fiscale
      - name: email
        type: email
        required: true
        label: Email
      - name: phone
        type: text
        label: Telefono
      - name: monthly_income
        type: number
        required: true
        label: Reddito mensile netto dichiarato (€)
      - name: contract_type
        type: select
        required: true
        label: Tipo di contratto di lavoro
        options:
        - value: indeterminato
          label: Tempo indeterminato
        - value: determinato
          label: Tempo determinato
        - value: autonomo
          label: Autonomo / partita IVA
        - value: pensione
          label: Pensionato
        - value: altro
          label: Altro
      - name: amount
        type: number
        required: true
        label: Importo richiesto (€)
      - name: months
        type: number
        required: true
        label: Durata (mesi)
      - name: purpose
        type: select
        required: true
        label: Finalità
        options:
        - value: casa
          label: Casa / ristrutturazione
        - value: auto
          label: Auto / veicoli
        - value: consumi
          label: Beni e consumi
        - value: spese_mediche
          label: Spese mediche / formazione
        - value: altro
          label: Altro
      - name: privacy_accepted
        type: boolean
        required: true
        label: Ho letto e accetto l'informativa privacy
      - name: open_banking_consent
        type: boolean
        required: true
        label: Acconsento all'accesso ai miei conti tramite il fornitore autorizzato esterno
      - name: status
        type: select
        default: submitted
        label: Stato
        options:
        - value: submitted
          label: Ricevuta
        - value: in_review
          label: In istruttoria
        - value: integration_requested
          label: Integrazione richiesta
        - value: approved
          label: Approvata
        - value: rejected
          label: Rifiutata
      - name: analyst_email
        type: email
        label: Analista assegnato
      - name: completeness
        type: text
        label: Completezza
      - name: installment_ratio
        type: number
        label: Rata/reddito dichiarato (%)
      - name: screening_summary
        type: textarea
        label: Scheda di istruttoria (interna)
      - name: bank_income_avg
        type: number
        label: Entrate medie mensili (fornitore esterno)
      - name: bank_expenses_avg
        type: number
        label: Uscite medie mensili (fornitore esterno)
      - name: bank_income_regularity
        type: text
        label: Regolarità entrate (fornitore esterno)
      - name: integration_request
        type: textarea
        label: Integrazione richiesta al richiedente
      - name: decision_reason
        type: textarea
        label: Motivazione dell'esito, in linguaggio chiaro per il richiedente
      - name: analyst_notes
        type: textarea
        label: Note interne dell'analista
      - name: decision_date
        type: date
        label: Data decisione
      - name: turnaround_days
        type: number
        label: Giorni di istruttoria
  triggers:
  - key: screen_new
    description: Avvia l'istruttoria automatica a ogni nuova pratica
    'on':
      collection: applications
      op: insert
      where:
        status: submitted
    start:
      agent: screener
    goal: Istruisci la pratica con codice fiscale {record.tax_code} (richiedente {record.last_name} {record.first_name}).
      Importo {record.amount} euro, durata {record.months} mesi, reddito mensile dichiarato {record.monthly_income} euro,
      contratto {record.contract_type}.
    asUser: true
  - key: aisp_summary
    description: Riepilogo entrate/uscite restituito dal fornitore autorizzato esterno
    'on':
      webhook: true
    write:
      collection: applications
      fields:
        tax_code: tax_code
        bank_income_avg: summary.income_avg
        bank_expenses_avg: summary.expenses_avg
        bank_income_regularity: summary.regularity
      keyBy: tax_code
  - key: notify_received
    'on':
      collection: applications
      op: insert
    notify:
      to:
      - record.email
      subject:
        it: 'FidoChiaro: abbiamo ricevuto la tua richiesta'
      body:
        it: 'Gentile {record.first_name} {record.last_name},

          abbiamo ricevuto la tua richiesta di prestito. Un analista la esaminerà; puoi seguire lo stato nella tua area personale.'
      link: my_applications
  - key: notify_approved
    'on':
      collection: applications
      op: update
      where:
        status: approved
    notify:
      to:
      - record.email
      subject:
        it: 'FidoChiaro: la tua richiesta è stata approvata'
      body:
        it: 'Gentile {record.first_name} {record.last_name},

          la tua richiesta di prestito è stata approvata.

          {record.decision_reason}

          Troverai i dettagli nella tua area personale.'
      link: my_applications
  - key: notify_rejected
    'on':
      collection: applications
      op: update
      where:
        status: rejected
    notify:
      to:
      - record.email
      subject:
        it: 'FidoChiaro: esito della tua richiesta'
      body:
        it: 'Gentile {record.first_name} {record.last_name},

          purtroppo non possiamo accogliere la tua richiesta di prestito. Ti spieghiamo i motivi:

          {record.decision_reason}

          Puoi presentare una nuova richiesta quando la situazione cambia.'
      link: my_applications
  - key: notify_integration
    'on':
      collection: applications
      op: update
      where:
        status: integration_requested
    notify:
      to:
      - record.email
      subject:
        it: 'FidoChiaro: servono altre informazioni per la tua pratica'
      body:
        it: 'Gentile {record.first_name} {record.last_name},

          per proseguire con la tua pratica ci serve quanto segue:

          {record.integration_request}'
      link: my_applications
  - key: notify_manager_new
    'on':
      collection: applications
      op: insert
    notify:
      to:
      - admins
      subject:
        it: Nuova pratica da assegnare
      body:
        it: È arrivata una nuova pratica ({record.last_name} {record.first_name}). Assegnala a un analista.
      link: assign
  views:
  - key: home
    type: page
    nav: false
    title: FidoChiaro
    sections:
    - type: hero
      title: Il tuo prestito, **chiaro** fin dall'inizio.
      text: Compila la richiesta online, segui lo stato della pratica nella tua area personale e ricevi l'esito via email,
        con motivazioni spiegate in modo comprensibile. Ogni decisione è presa da un analista, mai da un automatismo.
      actions:
      - label: Richiedi un prestito
        href: /v/apply
        style: primary
      - label: Accedi
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title: Come funziona
      items:
      - title: 1 · Compili il modulo
        text: Dati anagrafici, reddito, importo e durata, finalità. Accetti l'informativa privacy.
      - title: 2 · Consenso ai conti
        text: Se vuoi, acconsenti all'accesso ai conti tramite un fornitore autorizzato esterno, che restituisce solo un riepilogo
          di entrate e uscite.
      - title: 3 · Istruttoria
        text: Un agente AI controlla la completezza e prepara una scheda; un analista crediti la valuta e decide.
      - title: 4 · Esito
        text: Ricevi l'esito via email e lo trovi nella tua area personale.
    - type: note
      id: privacy
      content: L'accesso ai conti tramite open banking è gestito da un fornitore di servizi di informazione sui conti autorizzato,
        esterno a FidoChiaro. L'agente AI supporta l'istruttoria ma non decide. Gli indicatori sono calcolati su dati dichiarati
        e sono indicativi.
  - key: apply
    type: form
    title: Richiedi un prestito
    collection: applications
    fields:
    - first_name
    - last_name
    - birth_date
    - tax_code
    - email
    - phone
    - monthly_income
    - contract_type
    - amount
    - months
    - purpose
    - privacy_accepted
    - open_banking_consent
    submit:
      label: Invia la richiesta
      message: Richiesta inviata. Riceverai una email di conferma.
      redirect: my_applications
    edit: false
    roles:
    - user
  - key: my_applications
    type: list
    title: Le mie pratiche
    source: collection:applications
    columns:
    - last_name
    - amount
    - months
    - purpose
    - status
    - integration_request
    - decision_reason
    - decision_date
    roles:
    - user
  - key: queue
    type: table
    title: Coda pratiche
    source: collection:applications
    columns:
    - last_name
    - first_name
    - amount
    - months
    - monthly_income
    - contract_type
    - installment_ratio
    - completeness
    - status
    - analyst_email
    export: true
    roles:
    - analyst
    - admin
  - key: review
    type: form
    title: Istruttoria e decisione
    collection: applications
    fields:
    - status
    - integration_request
    - decision_reason
    - analyst_notes
    - decision_date
    - turnaround_days
    submit:
      label: Salva
      message: Pratica aggiornata.
      redirect: queue
    edit: true
    roles:
    - analyst
    - admin
  - key: assign
    type: form
    title: Assegnazione pratiche
    collection: applications
    fields:
    - analyst_email
    submit:
      label: Assegna
      message: Pratica assegnata.
      redirect: queue
    edit: true
    roles:
    - admin
  - key: dashboard
    type: page
    title: Dashboard
    roles:
    - admin
    sections:
    - type: data
      title: Indicatori
      source: collection:applications
      display: kpi
      kpis:
      - label: Pratiche
        agg: count
      - label: Giorni medi di istruttoria
        agg: avg
        field: turnaround_days
        format: number
    - type: data
      title: Pratiche per stato
      source: collection:applications
      display: chart
      chart: bar
      fields:
      - key: status
        label: Stato
      - key: count
        label: Pratiche
      groupBy:
        field: status
        aggs: []
    - type: data
      title: Volumi e tempi per mese
      source: collection:applications
      display: chart
      chart: line
      fields:
      - key: decision_date
        label: Mese
      - key: count
        label: Pratiche decise
      - key: avg_days
        label: Giorni medi
      groupBy:
        field: decision_date
        bucket: month
        aggs:
        - key: avg_days
          agg: avg
          field: turnaround_days
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: licenza_annuale
      price: 12000
      interval: year
      label: Licenza annuale FidoChiaro
      includes:
      - Pratiche illimitate
      - Analisti e responsabile
      - Istruttoria assistita da agente AI
      roles:
      - admin
  extensions:
  - key: open_banking_provider
    description: 'La valutazione tramite open banking richiede un fornitore di servizi di informazione sui conti autorizzato
      (AISP), esterno all''app: deve chiamare il webhook /api/hooks/aisp_summary con codice fiscale e riepilogo (income_avg,
      expenses_avg, regularity). Il flusso di consenso presso il fornitore non è nell''app.'
  - key: applicant_internal_fields
    description: La scheda interna e le note dell'analista sono nella pratica ma nascoste al richiedente solo dalle colonne
      delle viste; per una separazione rigida servirebbe una collezione dedicata.
  - key: license_price
    description: 'Il prezzo della licenza annuale è indicativo: va fissato dal fornitore; la fatturazione a una sola società
      finanziaria può essere gestita fuori dall''app.'
