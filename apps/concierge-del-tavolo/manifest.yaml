apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: concierge-del-tavolo
  displayName: Concierge del Tavolo
  tagline:
    it: Il menu digitale che parla con i tuoi clienti, in ogni lingua.
    en: The digital menu that talks to your guests, in any language.
  description:
    it: Menu digitale su QR/NFC con concierge multilingue basato solo sui dati del locale, bozze di risposta alle recensioni
      da approvare e report settimanale.
    en: QR/NFC digital menu with a multilingual concierge grounded only in the venue's data, draft review replies to approve,
      and a weekly report.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#3b1f1a'
      accent: '#b5543a'
      background: '#fbf6ef'
      foreground: '#241816'
    fonts:
      body: Inter
      display: Playfair Display
    wordmark:
    - text: 'Concierge '
      color: primary
    - text: del Tavolo
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
      - concierge
      agents:
      - concierge
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      label:
        it: Ristoratore
        en: Restaurateur
      assignedBy: signup
  limits:
  - action: chat
    per: ip
    max: 60
    window: hour
    roles:
    - anonymous
  - action: create:menu_items
    max: 60
    window: total
    plans:
      venue: -1
  agents:
  - key: concierge
    role: main
    description: 'Guest-facing concierge: answers only from the venue''s menu data, in the guest''s language.'
    profile:
      inline:
        display_name: Concierge del Tavolo
        chat_mode: true
        crews:
        - id: concierge
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the table concierge of a restaurant. The venue key comes from the page (the QR code). Answer
            ONLY with data from your tools (menu_search, venue_info): dishes, ingredients, allergens, wine pairings, daily
            specials, chef''s picks, the venue''s story. Reply in the language the guest writes in, in short friendly sentences
            suitable to be read aloud. Allergens: report exactly what the data says; if a dish''s allergen data is missing
            or unclear, say you are not sure and invite the guest to ask the staff; never guess and never declare a dish safe
            for an allergy without data. If something is not in the data, say so. Never invent prices, dishes or wines. Near
            the end of the meal (guest says thanks, asks for the bill) kindly invite them to leave a review, giving the venue''s
            google_review_url if present.'
    appTools:
    - name: menu_search
      description: Search the menu items (dishes, wines, specials) of a venue
      action: search
      collection: menu_items
      scope: all
    - name: venue_info
      description: 'Read the venue profile: story, languages, review link'
      action: read
      collection: venue_profiles
      scope: all
    goalTemplate: 'Venue/table (from the QR code): {page}

      Conversation so far:

      {history}

      Guest says: {message}

      Guest interface language: {lang}'
    output: markdown
  - key: review_replier
    role: helper
    description: Drafts a reply to a new review and asks the owner to approve it.
    awaits:
    - reply_ok
    memory: user
    profile:
      inline:
        display_name: Review reply drafter
        crews:
        - id: replier
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 5
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write reply drafts to restaurant reviews on behalf of the owner. Reply in the language of the
            review: warm, specific, brief (under 90 words), thank positive reviewers, acknowledge criticism without excuses
            and offer to talk offline; never promise refunds or invent facts. Start with ''# Bozza risposta''. Then call request_reply_ok
            with the review text and your draft so the owner can approve it. Your memory holds the owner''s preferred tone:
            use it and update it with remember if the owner''s edits show a preference.'
    appTools:
    - name: venue_info
      description: 'Read the venue profile: story, languages, review link'
      action: read
      collection: venue_profiles
      scope: all
    goalTemplate: 'New review ({record.rating}/5) by {record.author}:

      {record.text}

      Write the reply draft and ask for approval.'
    output: markdown
  - key: weekly_reporter
    role: scheduled
    description: Weekly report for one venue.
    memory: instance
    writesTo:
      collection: weekly_reports
    profile:
      inline:
        display_name: Weekly venue reporter
        crews:
        - id: reporter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write the weekly report for a restaurant owner. Start with ''# Report settimanale — <venue>
            — <date>''. Sections (## headings): Andamento recensioni (count, average rating, trend vs previous week from your
            memory), Temi ricorrenti nelle critiche, Piatti più richiesti, Domande più frequenti dei clienti, Lingue usate,
            Azioni consigliate. Use only data from your tools (reviews, menu). If a data source gives nothing (e.g. no conversation
            statistics available), say so plainly instead of inventing figures. Add a ```chart block for the rating trend
            when you have at least 3 points. At the end call remember once with the key figures of this week.'
    appTools:
    - name: reviews_read
      description: Read the venue's reviews
      action: read
      collection: reviews
      scope: user
    - name: menu_read
      description: Read the menu items
      action: search
      collection: menu_items
      scope: all
    goalTemplate: 'Venue: {instance}. Today is {date}. Write this week''s report in the language with ISO code {lang}.'
    output: markdown
  inputForm:
    title:
      it: Domanda
      en: Question
    fields:
    - name: message
      type: text
  templates:
  - key: weekly_venue_report
    title:
      it: Report settimanale del locale
      en: Weekly venue report
    description:
      it: Ogni lunedì un report per email su recensioni, piatti e domande.
      en: Every Monday an email report on reviews, dishes and questions.
    agent: weekly_reporter
    params:
    - name: venue
      type: text
      required: true
      label:
        it: Nome del locale
        en: Venue name
    goal: 'Weekly report for "{instance}" (venue {venue}). Today is {date}. Language: {lang}.'
    schedule:
      cron: 0 6 * * 1
      userCanChange: true
    maxPerUser: 10
    deliver:
      to: owner
      onlyIfNew: true
  approvals:
  - key: reply_ok
    title:
      it: Approva la risposta alla recensione
      en: Approve the review reply
    decidedBy: requester
    fields:
    - review
    - draft
  triggers:
  - key: new_review
    'on':
      collection: reviews
      op: insert
    start:
      agent: review_replier
    goal: 'New review ({record.rating}/5) by {record.author}: {record.text}'
  - key: reply_approved
    'on':
      approval: reply_ok
      decision: approved
    notify:
      to: owner
      subject:
        it: 'Risposta approvata: pronta da pubblicare'
        en: 'Reply approved: ready to publish'
      body:
        it: Hai approvato una bozza di risposta. Aprila nell'app, copiala e pubblicala sulla scheda Google della tua attività.
        en: You approved a reply draft. Open it in the app, copy it and post it on your Google Business profile.
      link: reviews_list
  data:
    collections:
    - name: venue_profiles
      ownedBy: shared
      description: 'Public profile of each venue: story, languages, review link'
      fields:
      - name: venue
        type: text
        required: true
        label: Venue key
      - name: name
        type: text
        required: true
      - name: story
        type: textarea
      - name: languages
        type: text
      - name: google_review_url
        type: url
    - name: menu_items
      ownedBy: shared
      searchable: true
      description: Dishes, wines and specials, per venue
      fields:
      - name: venue
        type: text
        required: true
      - name: name
        type: text
        required: true
      - name: category
        type: select
        options:
        - antipasto
        - primo
        - secondo
        - contorno
        - dolce
        - vino
        - bevanda
      - name: description
        type: textarea
      - name: ingredients
        type: textarea
      - name: allergens
        type: text
        help: es. glutine, latte, frutta a guscio
      - name: gluten_free
        type: boolean
      - name: price
        type: number
      - name: wine_pairing
        type: text
      - name: daily_special
        type: boolean
      - name: chef_pick
        type: boolean
    - name: reviews
      ownedBy: user
      description: Reviews of the venue (entered or imported by the owner)
      fields:
      - name: venue
        type: text
        required: true
      - name: members
        type: array
        help: Emails of the group managers who also see these reviews
      - name: author
        type: text
      - name: rating
        type: number
        required: true
      - name: text
        type: textarea
        required: true
      - name: date
        type: date
      - name: source
        type: select
        options:
        - google
        - internal
      access:
      - role: user
        where:
          members: '{user.email}'
        can:
        - read
        - write
      retentionDays: 730
    - name: weekly_reports
      ownedBy: instance
      description: Weekly reports of each venue
  views:
  - key: home
    type: page
    nav: false
    sections:
    - type: hero
      eyebrow:
        it: Per ristoranti
        en: For restaurants
      title:
        it: Il **concierge** che conosce ogni piatto del tuo menu.
        en: The **concierge** that knows every dish on your menu.
      text:
        it: 'Il cliente avvicina il telefono al QR o al tag NFC del tavolo: menu, allergeni e abbinamenti vini, con risposte
          basate solo sui tuoi dati e in più lingue.'
        en: 'Guests tap the QR or NFC tag on the table: menu, allergens and wine pairings, with answers grounded only in your
          data, in many languages.'
      actions:
      - label:
          it: Provalo
          en: Try it
        href: /v/concierge
        style: primary
      - label:
          it: Accedi come ristoratore
          en: Sign in as restaurateur
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Carica i tuoi dati
          en: Load your data
        text:
          it: Menu, ingredienti, allergeni, vini, storia del locale e piatti del giorno.
          en: Menu, ingredients, allergens, wines, venue story and daily specials.
      - title:
          it: Un QR per tavolo
          en: One QR per table
        text:
          it: 'Nessuna app da installare: il concierge si apre nel browser.'
          en: 'No app to install: the concierge opens in the browser.'
      - title:
          it: Recensioni e report
          en: Reviews and report
        text:
          it: Bozze di risposta da approvare e un report ogni settimana.
          en: Draft replies to approve and a report every week.
    - type: note
      content:
        it: 'Le informazioni sugli allergeni sono quelle inserite dal locale: in caso di dubbio chiedi sempre al personale.'
        en: 'Allergen information is what the venue entered: when in doubt, always ask the staff.'
  - key: concierge
    type: chat
    title:
      it: Concierge
      en: Concierge
    source: agent:concierge
    nav: false
    examples:
    - it: Cosa c'è senza glutine?
      en: What is gluten-free?
    - it: Che vino si abbina al risotto?
      en: Which wine goes with the risotto?
    - it: Cosa consiglia lo chef?
      en: What does the chef recommend?
    placeholder:
      it: Chiedi al concierge…
      en: Ask the concierge…
  - key: venue_form
    type: form
    collection: venue_profiles
    title:
      it: Profilo del locale
      en: Venue profile
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Profilo salvato
        en: Profile saved
    edit: true
    roles:
    - user
    - admin
  - key: dish_form
    type: form
    collection: menu_items
    title:
      it: Aggiungi piatto o vino
      en: Add dish or wine
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Salvato nel menu
        en: Saved to the menu
    edit: true
    roles:
    - user
    - admin
  - key: menu_list
    type: table
    title:
      it: Menu
      en: Menu
    source: collection:menu_items
    columns:
    - name
    - category
    - allergens
    - gluten_free
    - price
    - daily_special
    export: true
    roles:
    - user
    - admin
  - key: review_form
    type: form
    collection: reviews
    title:
      it: Aggiungi recensione
      en: Add a review
    submit:
      label:
        it: Prepara bozza
        en: Draft reply
      message:
        it: Sto preparando la bozza di risposta
        en: Preparing the reply draft
      redirect: approvals
    roles:
    - user
    - admin
  - key: reviews_list
    type: table
    title:
      it: Recensioni
      en: Reviews
    source: collection:reviews
    columns:
    - date
    - author
    - rating
    - text
    - source
    export: true
    roles:
    - user
    - admin
  - key: approvals
    type: approvals
    title:
      it: Risposte da approvare
      en: Replies to approve
    approvals:
    - reply_ok
    roles:
    - user
    - admin
  - key: reports
    type: instances
    template: weekly_venue_report
    title:
      it: Report settimanali
      en: Weekly reports
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento e crediti
      en: Plan and credits
    roles:
    - user
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 50
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:concierge:
        estimate: 3
        metered: true
      agent:review_replier:
        estimate: 5
        metered: true
    packs:
    - key: voce_500
      credits: 500
      price: 10
      label:
        it: 500 crediti voce
        en: 500 voice credits
    - key: voce_2500
      credits: 2500
      price: 40
      label:
        it: 2500 crediti voce
        en: 2500 voice credits
    plans:
    - key: venue
      price: 49
      interval: month
      label:
        it: Per locale
        en: Per venue
      credits: 300
      creditsReset: monthly
      includes:
      - menu digitale
      - concierge multilingue
      - bozze risposte
      - report settimanale
  notifications:
    emailOnRunDone: false
  extensions:
  - key: google_oauth_reviews
    description: Collegare via OAuth il profilo Google dell'attività per leggere le recensioni e pubblicare le risposte non
      è ancora disponibile. Per ora il titolare inserisce le recensioni a mano o le incolla, e copia sulla scheda Google le
      risposte approvate.
  - key: voice_minutes
    description: 'Voce in tempo reale nel browser (parlato/ascolto) con addebito per minuto non è ancora disponibile: il concierge
      funziona in chat, con risposte brevi leggibili ad alta voce; il consumo è addebitato a crediti per uso AI. Canali telefonici
      sono un''alternativa.'
  - key: nfc_qr_tags
    description: 'QR e tag NFC puntano a /v/concierge?page=<chiave-locale>&table=<n>: la generazione dei QR da stampare va
      fatta fuori dall''app.'
  - key: venue_isolation
    description: 'Il menu e i profili sono in raccolte condivise (leggibili dal concierge senza login) con un campo ''venue'':
      l''isolamento in scrittura tra ristoranti e la gestione di gruppi multi-locale (ruolo di gruppo con più locali) richiedono
      una revisione dedicata; le recensioni sono invece private al titolare e ai gestori elencati in ''members''.'
  - key: conversation_stats
    description: 'Statistiche sulle domande dei clienti, piatti più richiesti e lingue usate richiedono il salvataggio dei
      log delle conversazioni, non disponibile per le chat anonime: il report settimanale lo dichiara se mancano i dati.'
