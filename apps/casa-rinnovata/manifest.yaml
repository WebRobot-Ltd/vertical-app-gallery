apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: casarinnovata
  displayName: CasaRinnovata
  tagline:
    it: Dalla valutazione al preventivo della tua ristrutturazione, in un solo posto.
  description:
    it: 'Descrivi l''immobile e gli interventi: un agente prepara il computo metrico stimato con i prezzari regionali, un
      secondo agente valuta le agevolazioni fiscali, e un tecnico CasaRinnovata rivede il preventivo prima che ti arrivi.'
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#2f3e46'
      accent: '#c8693a'
      background: '#faf8f5'
      foreground: '#1f2629'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Casa
      color: primary
    - text: Rinnovata
      color: accent
    button: accent
  header:
    links:
    - label:
        it: Come funziona
      href: '#come-funziona'
    - label:
        it: Fonti
      href: '#fonti'
    cta:
      label:
        it: Richiedi un preventivo
      href: /v/nuova_pratica
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Amministratore
      assignedBy: admin_emails
    - key: tecnico
      label:
        it: Tecnico
      assignedBy: invite
    - key: user
      label:
        it: Cliente
      assignedBy: signup
  limits:
  - action: run
    per: user
    max: 5
    window: day
    roles:
    - user
  egress:
    hosts:
    - www.agenziaentrate.gov.it
    - www.enea.it
    notes: Solo consultazione di guide ufficiali pubbliche (Agenzia delle Entrate, ENEA) e di prezzari regionali e valori
      OMI pubblicati da enti pubblici. Nessuno scraping di portali di annunci immobiliari.
  agents:
  - key: computista
    role: main
    description: Redige il computo metrico stimato e la proposta di preventivo con voci, tempi e fasi; chiede le agevolazioni
      all'altro agente e sottopone il preventivo al tecnico.
    profile:
      inline:
        display_name: CasaRinnovata computista
        crews:
        - id: computista
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'Sei il computista di CasaRinnovata, impresa di ristrutturazioni chiavi in mano. Dai dati del modulo
            redigi un computo metrico ESTIMATIVO e una proposta di preventivo.


            Fonti: SOLO prezzari regionali ufficiali delle opere edili (pubblicati da Regioni, Provveditorati, Camere di Commercio)
            e valori OMI dell''Agenzia delle Entrate. Per consultarli usa il tool MCP webrobot su pagine pubbliche. NON raccogliere
            annunci da portali immobiliari. Cita per ogni gruppo di voci il prezzario e l''anno/edizione; se non trovi il
            prezzario della regione, dillo e indica un intervallo di mercato con affidabilità bassa. Non inventare codici
            di voce né cifre: ciò che è stima va marcato come stima.


            I link a foto e planimetria possono non essere leggibili: se non lo sono, dichiaralo e lavora sui dati dichiarati.


            Chiedi al collega agevolazioni (tool ask_agevolazioni) la valutazione delle detrazioni passando comune, tipo immobile,
            interventi e importo stimato dei lavori; inserisci la sua risposta nella sezione dedicata.


            Struttura del report (titolo di primo livello obbligatorio):

            # Preventivo ristrutturazione — <indirizzo/comune>

            ## Sintesi (importo stimato con forbice min–max, durata)

            ## Dati dell''immobile e ipotesi

            ## Computo metrico estimativo (tabella: voce, unità, quantità, prezzo unitario, importo, fonte)

            ## Fasi e tempi (cronoprogramma per settimane)

            ## Agevolazioni fiscali e risparmio possibile

            ## Idea di resa finale (descrizione testuale dell''ambiente rinnovato: materiali, colori, luce, disposizione,
            adatta a un render)

            ## Rischi e cose da verificare (sopralluogo, vincoli, conformità impianti, pratiche edilizie)

            ## Fonti

            Aggiungi un grafico a barre dell''incidenza per categoria di lavoro con un blocco ```chart (JSON, solo cifre reali
            della tua stima).


            È una stima non vincolante: il preventivo definitivo richiede sopralluogo e revisione di un tecnico. Alla fine
            chiama il tool request_revisione_preventivo con sintesi e importo, affinché un tecnico lo riveda prima dell''invio
            al cliente. Non dare consulenza fiscale o legale come certezza. Scrivi in italiano.'
    goalTemplate: 'Nuova pratica di ristrutturazione.

      Indirizzo: {indirizzo}, {comune} (regione: {regione})

      Tipo di immobile: {tipo_label}

      Metratura: {metratura} mq

      {?anno}Anno di costruzione: {anno}{/anno}

      Stato attuale: {stato_label}

      Interventi desiderati: {interventi}

      {?planimetria}Link planimetria: {planimetria}{/planimetria}

      {?foto}Link foto: {foto}{/foto}

      {?note}Note del proprietario: {note}{/note}

      Data: {date}. Scrivi in italiano.'
    delegates:
    - agevolazioni
    awaits:
    - revisione_preventivo
    output: markdown
    limits:
      maxTurns: 40
      maxBudgetUsd: 1.5
  - key: agevolazioni
    role: analyst
    description: Valuta le agevolazioni fiscali applicabili consultando guide ufficiali Agenzia delle Entrate ed ENEA e i
      valori OMI, e spiega il risparmio possibile.
    profile:
      inline:
        display_name: CasaRinnovata agevolazioni
        crews:
        - id: agevolazioni
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'Sei l''esperto di agevolazioni fiscali per l''edilizia di CasaRinnovata. Ricevi comune, tipo di
            immobile, interventi e importo stimato dei lavori. Consulta, tramite il tool MCP webrobot, SOLO fonti ufficiali
            pubbliche: guide dell''Agenzia delle Entrate, portale ENEA (Ecobonus, Bonus ristrutturazioni, pratiche ENEA) e
            valori OMI per la zona dell''immobile. Non usare portali di annunci.


            Produci: elenco delle agevolazioni potenzialmente applicabili per ciascun intervento (bonus ristrutturazioni,
            ecobonus, bonus mobili, eventuali altre), aliquote e massimali in vigore alla data odierna con riferimento alla
            fonte consultata, requisiti e adempimenti (es. comunicazione ENEA, bonifici dedicati), un calcolo indicativo del
            risparmio in tabella (spesa, aliquota, detrazione totale, rata annuale, anni di recupero) e il contesto OMI della
            zona (intervallo €/mq, solo se trovato). Se un''aliquota o una regola non è verificabile alla fonte, scrivilo
            e non indovinarla; le norme cambiano ogni anno. Specifica che è un''indicazione informativa, non consulenza fiscale:
            l''utente deve confermare con il proprio commercialista. Rispondi in italiano, in modo conciso, con sezione Fonti
            con link.'
    output: markdown
    limits:
      maxTurns: 25
      maxBudgetUsd: 1.0
  approvals:
  - key: revisione_preventivo
    title:
      it: Revisione del preventivo
    description: Un tecnico CasaRinnovata verifica voci, importi e tempi prima dell'invio al cliente.
    role: tecnico
    decidedBy: role
    fields:
    - sintesi
    - importo
    timeoutMinutes: 10080
    onTimeout: reject
  inputForm:
    title:
      it: Nuova pratica
    fields:
    - name: indirizzo
      type: text
      required: true
      label:
        it: Indirizzo dell'immobile
    - name: comune
      type: text
      required: true
      label:
        it: Comune
    - name: regione
      type: select
      required: true
      label:
        it: Regione
      options:
      - Abruzzo
      - Basilicata
      - Calabria
      - Campania
      - Emilia-Romagna
      - Friuli-Venezia Giulia
      - Lazio
      - Liguria
      - Lombardia
      - Marche
      - Molise
      - Piemonte
      - Puglia
      - Sardegna
      - Sicilia
      - Toscana
      - Trentino-Alto Adige
      - Umbria
      - Valle d'Aosta
      - Veneto
    - name: tipo
      type: select
      required: true
      label:
        it: Tipo di immobile
      options:
      - value: appartamento
        label:
          it: Appartamento
      - value: villa
        label:
          it: Villa / casa indipendente
      - value: villetta
        label:
          it: Villetta a schiera
      - value: locale
        label:
          it: Locale commerciale
    - name: metratura
      type: number
      required: true
      label:
        it: Superficie (mq)
    - name: anno
      type: number
      label:
        it: Anno di costruzione (facoltativo)
    - name: stato
      type: select
      required: true
      label:
        it: Stato attuale
      options:
      - value: da_ristrutturare
        label:
          it: Da ristrutturare completamente
      - value: datato
        label:
          it: Abitabile ma datato
      - value: buono
        label:
          it: Buono, servono interventi mirati
    - name: interventi
      type: multiselect
      required: true
      label:
        it: Interventi desiderati
      options:
      - value: impianti
        label:
          it: Impianti (elettrico, idraulico, riscaldamento)
      - value: bagni
        label:
          it: Bagni
      - value: infissi
        label:
          it: Infissi
      - value: pavimenti
        label:
          it: Pavimenti
    - name: planimetria
      type: url
      label:
        it: Link alla planimetria (facoltativo)
      help:
        it: 'Il caricamento diretto dei file non è ancora disponibile: incolla un link (Drive, Dropbox…).'
    - name: foto
      type: urls
      label:
        it: Link alle foto (facoltativo)
      help:
        it: Incolla uno o più link alle foto dell'immobile.
    - name: note
      type: textarea
      maxLength: 800
      label:
        it: Note e desideri (facoltativo)
  data:
    collections: []
  views:
  - key: home
    type: page
    title: CasaRinnovata
    nav: false
    sections:
    - type: hero
      layout: stack
      band: true
      eyebrow:
        it: Ristrutturazioni chiavi in mano
      title:
        it: Il preventivo della tua **ristrutturazione**, gratis e con i numeri in chiaro.
      text:
        it: Descrivi l'immobile e gli interventi. Un agente prepara il computo metrico con i prezzari regionali, un secondo
          agente calcola le agevolazioni fiscali possibili e un tecnico rivede tutto prima che ti arrivi.
      actions:
      - label:
          it: Richiedi un preventivo
        href: /v/nuova_pratica
        style: primary
      - label:
          it: Accedi
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
      items:
      - title:
          it: Compili il modulo
        text:
          it: Indirizzo, metratura, stato attuale, interventi desiderati e link a foto e planimetria.
        badge: 📝
      - title:
          it: Computo e agevolazioni
        text:
          it: Voci, quantità, tempi e fasi con i prezzari regionali; detrazioni fiscali e risparmio possibile.
        badge: 📐
      - title:
          it: Revisione del tecnico
        text:
          it: Un tecnico CasaRinnovata controlla e approva il preventivo prima dell'invio.
        badge: ✅
    - type: cards
      id: fonti
      title:
        it: Fonti pubbliche
      items:
      - title:
          it: Prezzari regionali
        text:
          it: Prezzari ufficiali delle opere edili, con edizione indicata per ogni voce.
      - title:
          it: Agenzia delle Entrate ed ENEA
        text:
          it: Guide ufficiali sulle detrazioni e sugli adempimenti, e valori OMI della zona.
      - title:
          it: Nessun annuncio
        text:
          it: Non raccogliamo dati da portali di annunci immobiliari.
    - type: note
      content:
        it: 'Le stime sono indicative e non vincolanti; il preventivo definitivo richiede sopralluogo. Le informazioni fiscali
          non sono consulenza: confermale con il tuo commercialista. Il preventivo è gratuito; CasaRinnovata guadagna sui
          lavori affidati.'
  - key: nuova_pratica
    type: new_run
    title:
      it: Nuova pratica
    roles:
    - user
    - admin
  - key: pratiche
    type: history
    title:
      it: Le mie pratiche
    source: run
    roles:
    - user
    - tecnico
    - admin
  - key: pratica
    type: report
    title:
      it: Preventivo
    source: run
    printable: true
    nav: false
  - key: revisioni
    type: approvals
    title:
      it: Preventivi da rivedere
    approvals:
    - revisione_preventivo
    roles:
    - tecnico
    - admin
  billing:
    modes:
    - free
  extensions:
  - key: upload_file
    description: 'Il caricamento di foto e planimetria non è ancora disponibile: il modulo chiede link o testo incollato.'
  - key: render_immagine
    description: 'La generazione di un render grafico dell''ambiente non è disponibile: il report include una descrizione
      testuale della resa finale.'
  - key: invio_email
    description: 'L''invio del preventivo approvato al cliente via email non è disponibile: il cliente lo vede nella propria
      pratica dopo l''approvazione.'
  - key: assegnazione_tecnico
    description: L'assegnazione di una pratica a un tecnico specifico e la vista dei soli casi assegnati richiedono un ruolo
      derivato e dati condivisi tra cliente e tecnico; per ora i tecnici vedono le richieste di revisione.
