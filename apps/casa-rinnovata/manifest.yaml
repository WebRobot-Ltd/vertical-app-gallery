apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: casarinnovata
  displayName: CasaRinnovata
  tagline:
    it: Dalla valutazione al preventivo di ristrutturazione, con le agevolazioni fiscali già calcolate.
  description:
    it: 'Compila il modulo con i dati del tuo immobile: un agente redige il computo metrico stimato con i prezzari regionali,
      un secondo agente valuta le agevolazioni fiscali, un tecnico CasaRinnovata rivede il preventivo e te lo invia via email.
      Il preventivo è gratuito.'
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f3a5f'
      accent: '#d9822b'
      background: '#faf8f4'
      foreground: '#1d2330'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Casa
      color: primary
    - text: Rinnovata
      color: accent
  header:
    links:
    - label: Come funziona
      href: '#come-funziona'
    - label: Fonti
      href: '#fonti'
    cta:
      label: Richiedi un preventivo
      href: /v/new_practice
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Amministratore
      assignedBy: admin_emails
    - key: user
      label: Cliente
      assignedBy: signup
    - key: technician
      label: Tecnico
      assignedBy: derived
      from: collection:quotes.technician_email
  limits:
  - action: create:practices
    per: user
    max: 5
    window: day
    roles:
    - user
  agents:
  - key: estimator
    role: main
    description: Redige il computo metrico stimato e il preventivo; chiede all'agente fiscale le agevolazioni; assegna il
      tecnico e salva la bozza.
    delegates:
    - tax
    context:
    - key: email
      from: user.email
    mcpServers:
    - name: webrobot
      url: https://mcp-full.webrobot.eu/mcp
      allow: all
    appTools:
    - name: read_upload
      description: Legge una foto o la planimetria caricata dal cliente (OCR incluso) dato l'id del file
      action: read_file
    - name: read_technicians
      description: Elenco dei tecnici CasaRinnovata con email e province di competenza
      action: read
      collection: technicians
      scope: all
    - name: save_quote
      description: Salva la bozza di preventivo per la revisione del tecnico
      action: write
      collection: quotes
      scope: user
    profile:
      inline:
        display_name: CasaRinnovata - Preventivista
        crews:
        - id: estimator
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'Sei il preventivista di CasaRinnovata, azienda di ristrutturazioni chiavi in mano. Ricevi una pratica
            (indirizzo, regione, metratura, tipo di immobile, stato attuale, interventi desiderati, note, foto e planimetria).
            1) Se ci sono file, aprili con read_upload usando gli id e ricava dimensioni, stato e criticità visibili; non
            inventare ciò che non vedi. 2) Cerca con gli strumenti web le voci del PREZZARIO REGIONALE delle opere edili della
            regione indicata (fonti pubbliche ufficiali, edizione più recente) e usa SOLO fonti pubbliche: prezzari, OMI.
            Non raccogliere annunci da portali immobiliari. 3) Redigi il computo metrico estimativo: per ogni voce codice/descrizione
            del prezzario, unità di misura, quantità stimata, prezzo unitario, importo; indica sempre la fonte e l''edizione
            del prezzario. Se un prezzo non è reperibile, dillo e marca la voce come ''da verificare''. 4) Proponi fasi e
            tempi (cronoprogramma in settimane) e un totale con intervallo di incertezza (± %), spese tecniche e IVA indicate
            a parte. 5) Delega all''agente fiscale (strumento ask_tax) passando i dati della pratica e il totale per categoria
            di intervento, e inserisci il suo risultato nella sezione agevolazioni. 6) Aggiungi la sezione ''Idea di render'':
            descrivi in modo concreto stile, materiali, colori e disposizione proposti per gli ambienti (il render grafico
            verrà prodotto dal tecnico). 7) Con read_technicians scegli il tecnico la cui provincia di competenza corrisponde
            alla provincia dell''immobile (altrimenti il primo disponibile). 8) Chiama save_quote UNA volta con: customer_email
            = email del cliente, technician_email, address, title, body = il preventivo completo in Markdown, status = ''draft''.
            Struttura del body: ''# Preventivo ristrutturazione - <indirizzo>'', poi ## Sintesi della pratica, ## Computo
            metrico estimato (tabella), ## Fasi e tempi, ## Agevolazioni fiscali, ## Idea di render, ## Ipotesi e rischi da
            verificare. Aggiungi un grafico ```chart``` a barre con gli importi per categoria. Regole: mai inventare cifre
            o riferimenti normativi; è una stima non vincolante soggetta a sopralluogo e revisione del tecnico; non dare consulenza
            fiscale come certezza. Rispondi in italiano.'
  - key: tax
    role: helper
    description: Valuta le agevolazioni fiscali applicabili e il risparmio possibile.
    mcpServers:
    - name: webrobot
      url: https://mcp-full.webrobot.eu/mcp
      allow: all
    profile:
      inline:
        display_name: CasaRinnovata - Agevolazioni fiscali
        crews:
        - id: tax
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'Sei l''analista delle agevolazioni fiscali edilizie di CasaRinnovata. Ricevi i dati di un immobile
            e i costi stimati per categoria di intervento. Consulta SOLO le guide ufficiali dell''Agenzia delle Entrate (guide
            su detrazioni per ristrutturazioni, bonus mobili, ecobonus, sismabonus, aliquote IVA agevolate) e dell''ENEA (ecobonus,
            comunicazioni e requisiti tecnici), e i valori OMI dell''Agenzia delle Entrate per la zona dell''immobile (per
            contestualizzare il valore al mq prima/dopo, se utile). Non usare annunci di portali immobiliari. Per ogni agevolazione
            potenzialmente applicabile: nome, interventi coperti, aliquota e massimale in vigore per l''anno corrente (verifica
            sulla guida e cita titolo e data di aggiornamento della fonte), requisiti e adempimenti (es. comunicazione ENEA,
            bonifico dedicato, asseverazioni), e calcolo del risparmio possibile sulle cifre ricevute, con ripartizione in
            anni. Segnala le condizioni che dipendono dalla situazione del cliente (proprietario o locatario, prima casa,
            abitazione principale) e ciò che va verificato con un commercialista. Se le regole per l''anno corrente non sono
            verificabili, dillo chiaramente. Mai inventare aliquote, massimali o scadenze. Rispondi in italiano con una tabella
            riassuntiva seguita da note brevi, in massimo 400 parole.'
  inputForm:
    title: Nuova pratica
    fields: []
  data:
    collections:
    - name: practices
      description: Pratiche di ristrutturazione inviate dai proprietari
      ownedBy: user
      retentionDays: 1095
      fields:
      - name: address
        type: text
        required: true
        label: Indirizzo dell'immobile
      - name: city
        type: text
        required: true
        label: Comune
      - name: province
        type: text
        required: true
        label: Provincia (sigla)
        maxLength: 2
      - name: region
        type: select
        required: true
        label: Regione
        options:
        - Abruzzo
        - Basilicata
        - Calabria
        - Campania
        - Emilia-Romagna
        - Friuli-Venezia Giulia
        - Lazio
        - Liguria
        - Lombardia
        - Marche
        - Molise
        - Piemonte
        - Puglia
        - Sardegna
        - Sicilia
        - Toscana
        - Trentino-Alto Adige
        - Umbria
        - Valle d'Aosta
        - Veneto
      - name: surface_sqm
        type: number
        required: true
        label: Metratura (mq)
      - name: property_type
        type: select
        required: true
        label: Tipo di immobile
        options:
        - value: appartamento
          label: Appartamento
        - value: villa
          label: Villa / casa indipendente
        - value: rustico
          label: Rustico / casale
        - value: ufficio
          label: Ufficio / negozio
      - name: current_state
        type: select
        required: true
        label: Stato attuale
        options:
        - value: nuovo
          label: Buono, da aggiornare
        - value: datato
          label: Datato
        - value: da_ristrutturare
          label: Da ristrutturare
        - value: grezzo
          label: Al grezzo
      - name: works
        type: multiselect
        required: true
        label: Interventi desiderati
        options:
        - value: impianti
          label: Impianti (elettrico, idraulico, riscaldamento)
        - value: bagni
          label: Bagni
        - value: infissi
          label: Infissi
        - value: pavimenti
          label: Pavimenti
        - value: altro
          label: Altro (specificare nelle note)
      - name: notes
        type: textarea
        maxLength: 800
        label: Note e desideri (stile, budget, tempi)
      - name: photos
        type: file
        label: Foto dell'immobile
        accept:
        - jpg
        - jpeg
        - png
        - webp
        maxMb: 10
        multiple: true
      - name: floorplan
        type: file
        label: Planimetria
        accept:
        - pdf
        - jpg
        - jpeg
        - png
        maxMb: 10
        multiple: false
    - name: quotes
      description: 'Preventivi: bozza dell''agente, revisione del tecnico, invio al cliente quando lo stato è approved'
      ownedBy: user
      retentionDays: 1095
      fields:
      - name: title
        type: text
        label: Titolo
      - name: address
        type: text
        label: Indirizzo
      - name: customer_email
        type: email
        label: Email cliente
      - name: technician_email
        type: email
        label: Tecnico assegnato
      - name: body
        type: textarea
        label: Preventivo
        maxLength: 30000
      - name: status
        type: select
        label: Stato
        default: draft
        options:
        - value: draft
          label: Bozza in revisione
        - value: approved
          label: Approvato e inviato al cliente
      access:
      - role: technician
        where:
          technician_email: '{user.email}'
        can:
        - read
        - write
    - name: technicians
      description: Tecnici dell'azienda e province di competenza
      ownedBy: shared
      fields:
      - name: name
        type: text
        required: true
        label: Nome
      - name: email
        type: email
        required: true
        label: Email
      - name: provinces
        type: text
        label: Province di competenza (sigle separate da virgola)
  views:
  - key: home
    type: page
    nav: false
    title: CasaRinnovata
    sections:
    - type: hero
      title: La tua **ristrutturazione**, dal sopralluogo al preventivo.
      text: 'Descrivi il tuo immobile e carica foto e planimetria: ricevi un preventivo con computo metrico, fasi, tempi e
        agevolazioni fiscali, rivisto da un nostro tecnico. Il preventivo è gratuito.'
      actions:
      - label: Richiedi un preventivo
        href: /v/new_practice
        style: primary
      - label: Accedi
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title: Come funziona
      items:
      - title: 1 · Compili il modulo
        text: Indirizzo, metratura, tipo di immobile, stato attuale e interventi desiderati, con foto e planimetria.
        badge: 📝
      - title: 2 · Computo e agevolazioni
        text: Un agente redige il computo metrico con i prezzari regionali; un secondo valuta detrazioni e risparmio possibile.
        badge: 📐
      - title: 3 · Revisione del tecnico
        text: Un tecnico CasaRinnovata controlla il preventivo e lo approva prima dell'invio.
        badge: ✅
      - title: 4 · Ricevi il preventivo
        text: Lo trovi nella tua area e ti arriva via email.
        badge: 📧
    - type: cards
      id: fonti
      title: Fonti pubbliche
      items:
      - title: Prezzari regionali
        text: Prezzari ufficiali delle opere edili della tua regione.
      - title: Agenzia delle Entrate
        text: Guide fiscali sulle detrazioni e valori OMI della zona.
      - title: ENEA
        text: Guide e requisiti per l'ecobonus. Non usiamo annunci dei portali immobiliari.
    - type: note
      content: Il preventivo è una stima non vincolante, soggetta a sopralluogo. Le indicazioni sulle agevolazioni non sostituiscono
        la consulenza di un professionista fiscale.
  - key: new_practice
    type: form
    title: Nuova pratica
    collection: practices
    submit:
      label: Invia la richiesta
      message: 'Pratica ricevuta: stiamo preparando il preventivo, ti avviseremo via email.'
      redirect: my_practices
    roles:
    - user
    - admin
  - key: my_practices
    type: table
    title: Le mie pratiche
    source: collection:practices
    columns:
    - address
    - city
    - surface_sqm
    - works
    - created_at
    roles:
    - user
    - admin
  - key: my_quotes
    type: cards
    title: I miei preventivi
    source: collection:quotes
    data:
      display: cards
      fields:
      - key: title
        label: Preventivo
      - key: address
        label: Indirizzo
      - key: body
        label: Dettaglio
      filters:
      - field: status
        op: '='
        value: approved
      empty: 'Nessun preventivo ancora inviato: ti scriveremo quando il tecnico lo avrà approvato.'
    printable: true
    roles:
    - user
  - key: assigned
    type: table
    title: Pratiche assegnate
    source: collection:quotes
    columns:
    - title
    - address
    - customer_email
    - status
    roles:
    - technician
    - admin
  - key: review
    type: form
    title: Revisione preventivo
    collection: quotes
    fields:
    - title
    - body
    - status
    edit: true
    submit:
      label: Salva
      message: Salvato. Se lo stato è Approvato, il cliente riceve l'email.
      redirect: assigned
    nav: false
    roles:
    - technician
    - admin
  - key: add_technician
    type: form
    title: Aggiungi tecnico
    collection: technicians
    submit:
      label: Salva
      message: Tecnico salvato.
    roles:
    - admin
  - key: technicians_list
    type: table
    title: Tecnici
    source: collection:technicians
    columns:
    - name
    - email
    - provinces
    roles:
    - admin
  triggers:
  - key: new_practice_estimate
    description: Una nuova pratica avvia la stima del preventivo
    'on':
      collection: practices
      op: insert
    start:
      agent: estimator
    goal: 'Nuova pratica di ristrutturazione. Email del cliente: {email}. Indirizzo: {record.address}, {record.city} ({record.province}),
      regione {record.region}. Metratura: {record.surface_sqm} mq. Tipo di immobile: {record.property_type}. Stato attuale:
      {record.current_state}. Interventi desiderati: {record.works}. Note: {record.notes}. Id file foto: {record.photos}.
      Id file planimetria: {record.floorplan}. Data di oggi: {date}. Scrivi in italiano.'
    asUser: true
  - key: notify_technician
    description: Avvisa il tecnico di una nuova bozza da rivedere
    'on':
      collection: quotes
      op: insert
    notify:
      to: record.technician_email
      subject: 'Nuovo preventivo da rivedere: {record.address}'
      body: C'è una bozza di preventivo assegnata a te per {record.address}. Aprila, rivedila e imposta lo stato su Approvato
        per inviarla al cliente.
      link: assigned
  - key: send_quote
    description: Il preventivo approvato dal tecnico viene inviato al cliente
    'on':
      collection: quotes
      op: update
      where:
        status: approved
    notify:
      to: record.customer_email
      subject: Il tuo preventivo CasaRinnovata - {record.address}
      body: Ciao, il tuo preventivo di ristrutturazione per {record.address} è stato rivisto dal nostro tecnico ed è pronto.
        Lo trovi nella tua area personale, con computo, tempi e agevolazioni fiscali. Il preventivo è gratuito e non vincolante.
      link: my_quotes
  billing:
    modes:
    - free
  extensions:
  - key: render_ai
    description: 'Render grafico dell''ambiente dopo la ristrutturazione: la generazione di immagini non è ancora disponibile.
      Per ora l''agente scrive una descrizione dettagliata del render (stili, materiali, colori) e il tecnico produce l''immagine.'
  - key: job_revenue
    description: 'Il guadagno sui lavori affidati avviene fuori dall''app: nessun pagamento online per il preventivo.'
  - key: draft_visibility
    description: Il cliente vede solo i preventivi approvati tramite filtro di vista; le bozze sono visibili al tecnico assegnato.
