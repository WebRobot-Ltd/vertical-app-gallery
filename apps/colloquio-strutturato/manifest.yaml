apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: colloquio-strutturato
  displayName: Colloquio Strutturato
  tagline:
    it: Colloqui oggettivi, valutati con rubriche, decisi da persone.
    en: Objective interviews, scored on rubrics, decided by people.
  description:
    it: 'L''admin HR definisce posizioni e rubriche, il recruiter invita i candidati, un agente conduce il colloquio e propone
      punteggi motivati. Il recruiter rivede, corregge e decide: nessuna decisione è automatica.'
    en: 'HR defines positions and rubrics, the recruiter invites candidates, an agent runs the interview and proposes reasoned
      scores. The recruiter reviews, corrects and decides: no decision is automatic.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#1f3a5f'
      accent: '#2a8f7a'
      background: '#f6f8fa'
      foreground: '#17202a'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Colloquio
      color: primary
    - text: Strutturato
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: HR admin
      assignedBy: admin_emails
    - key: recruiter
      label: Recruiter
      assignedBy: derived
      from:
      - collection:positions.recruiter_email
      - collection:candidates.recruiter_email
    - key: candidate
      label:
        it: Candidato
        en: Candidate
      assignedBy: derived
      from: collection:candidates.email
  limits:
  - action: create:candidates
    per: app
    max: 20
    window: month
    plans:
      pro: 100
      business: -1
  - action: chat
    per: user
    max: 300
    window: day
    roles:
    - candidate
  agents:
  - key: interviewer
    role: main
    description: Conducts the structured interview with the candidate, once consent is recorded, and saves the transcript.
    context:
    - key: candidate
      from: collection:candidates
    - key: consent
      from: collection:consents
    appTools:
    - name: save_transcript
      description: Save the final transcript of the interview
      action: write
      collection: transcripts
      scope: user
    profile:
      inline:
        display_name: Colloquio Strutturato interviewer
        chat_mode: true
        crews:
        - id: interviewer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 60
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are a professional, courteous structured-interview agent. FIRST check the consent records in
            the goal: if there is no consent with accepted=true, do not interview; politely ask the candidate to give consent
            in the consent page first. Otherwise: greet the candidate, restate that the conversation is recorded and transcribed
            and that a human recruiter makes every decision. Run an interview of about twenty minutes in the language of the
            candidate: ask the same core behavioural (STAR: ''tell me about a time when…'') and situational (''what would
            you do if…'') questions for every candidate, covering each competency listed in the candidate record (competencies_summary),
            about 2 questions per competency. Ask one question at a time, listen, ask 1-2 follow-up probes for specifics (situation,
            your action, result), never hint at the scoring, never comment on quality, never ask about protected characteristics
            (age, health, origin, religion, family, politics). Keep track of time/number of questions; after ~10-12 questions
            thank the candidate, explain that the recruiter will review and they will get an answer, and call the tool save_transcript
            once with fields candidate_email, position, recruiter_email (from the candidate record), mode, and text = the
            full conversation as ''Q:'' / ''A:'' lines. Do not give any evaluation or outcome to the candidate. If the candidate
            asks to stop, stop and save what exists.'
          mcp_servers: []
    goalTemplate: 'Candidate record: {candidate}

      Consent records: {consent}

      Conversation so far:

      {history}

      New message from the candidate: {message}

      Reply in the language with ISO code {lang}. Date: {date}.'
    output: markdown
    limits:
      maxTurns: 60
      maxBudgetUsd: 1.0
  - key: evaluator
    role: analyst
    description: Scores each answer against the position's rubric with a rationale and proposes a total; the recruiter reviews.
    appTools:
    - name: read_position
      description: Read positions with their competencies and rubrics
      action: read
      collection: positions
      scope: all
    - name: read_transcript
      description: Read interview transcripts
      action: read
      collection: transcripts
      scope: all
    - name: write_evaluation
      description: Save the evaluation of a candidate
      action: write
      collection: evaluations
      scope: all
    profile:
      inline:
        display_name: Colloquio Strutturato evaluator
        crews:
        - id: evaluator
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You evaluate a structured-interview transcript against the rubric of the position. Use read_position
            to get the competencies (name, rubric levels 1-5, answer examples, weight) and read_transcript for the transcript.
            For EACH competency give a score 1-5 using ONLY the rubric, a short rationale, and one or two verbatim quotes
            from the candidate as evidence. If evidence is missing, say so and score conservatively rather than inventing.
            Judge content only: ignore accent, fluency of language unless communication is the competency, appearance and
            any protected characteristic. Compute total_ai as the weighted average (1 decimal). Then call write_evaluation
            once with: candidate_email, candidate_name, position, recruiter_email, scores (JSON list of {competency, score,
            rationale, evidence}), total_ai, total_final (equal to total_ai), summary (a candidate report in Markdown starting
            with ''# <Candidate> — <Position>'': strengths, gaps, suggested follow-up questions for next round), review_status
            ''pending''. You only PROPOSE: never state that the candidate passes or fails.'
          mcp_servers: []
    goalTemplate: 'Evaluate the interview of {record.candidate_email} for position {record.position}. Transcript record: {record.text}.
      Write in the language with ISO code {lang}.'
    output: markdown
  data:
    collections:
    - name: positions
      ownedBy: org
      description: Open positions with competencies and rubrics (HR admin)
      fields:
      - name: title
        type: text
        required: true
        label:
          it: Posizione
          en: Position
      - name: recruiter_email
        type: email
        required: true
        label:
          it: Recruiter assegnato
          en: Assigned recruiter
      - name: description
        type: textarea
        label:
          it: Descrizione
          en: Description
      - name: competencies
        type: array
        required: true
        label:
          it: Competenze e rubriche
          en: Competencies and rubrics
        fields:
        - name: name
          type: text
          required: true
          label:
            it: Competenza
            en: Competency
        - name: weight
          type: number
          label:
            it: Peso
            en: Weight
        - name: rubric
          type: textarea
          required: true
          label:
            it: Rubrica (livelli 1-5)
            en: Rubric (levels 1-5)
          help:
            it: 'Un livello per riga: 1 = …, 5 = …'
            en: 'One level per line: 1 = …, 5 = …'
        - name: examples
          type: textarea
          label:
            it: Esempi di risposta per livello
            en: Sample answers per level
      - name: status
        type: select
        options:
        - open
        - closed
        default: open
      access:
      - role: recruiter
        where:
          recruiter_email: '{user.email}'
        can:
        - read
    - name: candidates
      ownedBy: org
      description: Invited candidates and their status; the candidate sees their own
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome
          en: Name
      - name: email
        type: email
        required: true
        label: Email
      - name: position
        type: text
        required: true
        optionsFrom: collection:positions
        label:
          it: Posizione
          en: Position
      - name: competencies_summary
        type: textarea
        label:
          it: Competenze da valutare (nomi)
          en: Competencies to assess (names)
      - name: recruiter_email
        type: email
        required: true
        label:
          it: Recruiter
          en: Recruiter
      - name: mode
        type: select
        options:
        - value: voice
          label:
            it: Solo voce
            en: Voice only
        - value: video
          label:
            it: Voce con video registrato
            en: Voice with recorded video
        default: voice
        label:
          it: Modalità
          en: Mode
      - name: status
        type: select
        options:
        - invited
        - consented
        - interviewed
        - reviewed
        default: invited
      - name: outcome
        type: select
        options:
        - value: pending
          label:
            it: In valutazione
            en: Under review
        - value: next_round
          label:
            it: Passa al colloquio successivo
            en: Moves to next round
        - value: not_proceeding
          label:
            it: Non prosegue
            en: Not proceeding
        default: pending
        label:
          it: Decisione del recruiter
          en: Recruiter decision
      - name: feedback
        type: textarea
        label:
          it: Riscontro al candidato
          en: Feedback to the candidate
      access:
      - role: recruiter
        where:
          recruiter_email: '{user.email}'
        can:
        - read
        - write
      - role: candidate
        where:
          email: '{user.email}'
        can:
        - read
    - name: consents
      ownedBy: user
      description: Explicit consent of the candidate before the interview
      retentionDays: 730
      fields:
      - name: accepted
        type: boolean
        required: true
        label:
          it: Acconsento alla registrazione, trascrizione e valutazione assistita da AI del mio colloquio; ogni decisione
            è presa da una persona.
          en: I consent to the recording, transcription and AI-assisted scoring of my interview; every decision is made by
            a person.
      - name: video
        type: boolean
        label:
          it: Acconsento anche alla registrazione video
          en: I also consent to video recording
    - name: transcripts
      ownedBy: user
      description: Interview transcripts
      retentionDays: 180
      fields:
      - name: candidate_email
        type: email
      - name: position
        type: text
      - name: recruiter_email
        type: email
      - name: mode
        type: text
      - name: text
        type: textarea
      access:
      - role: recruiter
        where:
          recruiter_email: '{user.email}'
        can:
        - read
    - name: evaluations
      ownedBy: org
      description: AI-proposed scores with rationale, corrected by the recruiter
      retentionDays: 365
      fields:
      - name: candidate_email
        type: email
      - name: candidate_name
        type: text
        label:
          it: Candidato
          en: Candidate
      - name: position
        type: text
        label:
          it: Posizione
          en: Position
      - name: recruiter_email
        type: email
      - name: scores
        type: json
        label:
          it: Punteggi per competenza (modificabili)
          en: Scores per competency (editable)
      - name: total_ai
        type: number
        label:
          it: Totale AI
          en: AI total
      - name: total_final
        type: number
        label:
          it: Totale rivisto
          en: Reviewed total
      - name: summary
        type: textarea
        label:
          it: Report
          en: Report
      - name: recruiter_notes
        type: textarea
        label:
          it: Note del recruiter
          en: Recruiter notes
      - name: review_status
        type: select
        options:
        - pending
        - reviewed
        default: pending
      access:
      - role: recruiter
        where:
          recruiter_email: '{user.email}'
        can:
        - read
        - write
  views:
  - key: home
    type: page
    nav: false
    title: Colloquio Strutturato
    sections:
    - type: hero
      title:
        it: Colloqui **oggettivi**, decisioni umane.
        en: '**Objective** interviews, human decisions.'
      text:
        it: Un agente conduce lo stesso colloquio strutturato con ogni candidato e valuta le risposte su rubriche chiare.
          Tu rivedi, correggi e decidi.
        en: An agent runs the same structured interview with every candidate and scores answers on clear rubrics. You review,
          correct and decide.
      actions:
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Posizione e rubriche
          en: Position and rubrics
        text:
          it: L'HR definisce competenze, livelli 1-5 ed esempi.
          en: HR defines competencies, levels 1-5 and sample answers.
        badge: 📋
      - title:
          it: Invito
          en: Invitation
        text:
          it: Il recruiter invia il link via email; il candidato dà il consenso.
          en: The recruiter emails the link; the candidate gives consent.
        badge: ✉️
      - title:
          it: Colloquio
          en: Interview
        text:
          it: Circa 20 minuti con domande comportamentali e situazionali.
          en: About 20 minutes of behavioural and situational questions.
        badge: 🎙️
      - title:
          it: Revisione
          en: Review
        text:
          it: Punteggi motivati, classifica, correzioni e decisione del recruiter.
          en: Reasoned scores, ranking, corrections and the recruiter's decision.
        badge: ✅
    - type: note
      content:
        it: 'Nessuna decisione è automatica: l''AI propone, una persona decide. Il candidato vede solo il proprio colloquio
          e il riscontro finale.'
        en: 'No decision is automatic: AI proposes, a person decides. Candidates see only their own interview and final feedback.'
  - key: new_position
    type: form
    collection: positions
    title:
      it: Nuova posizione
      en: New position
    roles:
    - admin
    submit:
      label:
        it: Salva posizione
        en: Save position
      message:
        it: Posizione salvata
        en: Position saved
      redirect: positions
  - key: positions
    type: table
    source: collection:positions
    title:
      it: Posizioni
      en: Positions
    columns:
    - title
    - recruiter_email
    - status
    roles:
    - admin
    - recruiter
  - key: invite
    type: form
    collection: candidates
    title:
      it: Invita candidato
      en: Invite candidate
    fields:
    - name
    - email
    - position
    - competencies_summary
    - recruiter_email
    - mode
    roles:
    - admin
    - recruiter
    submit:
      label:
        it: Invia invito
        en: Send invitation
      message:
        it: Invito inviato via email
        en: Invitation emailed
      redirect: candidates
  - key: candidates
    type: table
    source: collection:candidates
    title:
      it: Candidati
      en: Candidates
    columns:
    - name
    - position
    - mode
    - status
    - outcome
    roles:
    - admin
    - recruiter
    export: true
  - key: decide
    type: form
    collection: candidates
    edit: true
    title:
      it: Decisione e riscontro
      en: Decision and feedback
    fields:
    - outcome
    - feedback
    roles:
    - admin
    - recruiter
    nav: false
    submit:
      label:
        it: Salva decisione
        en: Save decision
      message:
        it: Decisione salvata
        en: Decision saved
      redirect: candidates
  - key: consent
    type: form
    collection: consents
    title:
      it: Consenso
      en: Consent
    roles:
    - candidate
    submit:
      label:
        it: Acconsento e inizio
        en: I consent and start
      message:
        it: Consenso registrato
        en: Consent recorded
      redirect: interview
  - key: interview
    type: chat
    source: agent:interviewer
    title:
      it: Colloquio
      en: Interview
    roles:
    - candidate
    placeholder:
      it: Scrivi la tua risposta…
      en: Type your answer…
    examples:
    - it: Sono pronto, possiamo iniziare
      en: I'm ready, let's start
  - key: my_interview
    type: table
    source: collection:candidates
    title:
      it: Il mio colloquio
      en: My interview
    columns:
    - position
    - status
    - outcome
    - feedback
    roles:
    - candidate
  - key: evaluations
    type: table
    source: collection:evaluations
    title:
      it: Valutazioni
      en: Evaluations
    columns:
    - candidate_name
    - position
    - total_ai
    - total_final
    - review_status
    roles:
    - admin
    - recruiter
    export: true
  - key: review
    type: form
    collection: evaluations
    edit: true
    title:
      it: Rivedi e correggi punteggi
      en: Review and correct scores
    fields:
    - scores
    - total_final
    - recruiter_notes
    - review_status
    roles:
    - admin
    - recruiter
    nav: false
    submit:
      label:
        it: Salva revisione
        en: Save review
      message:
        it: Revisione salvata
        en: Review saved
      redirect: ranking
  - key: ranking
    type: table
    source: collection:evaluations
    title:
      it: Classifica per posizione
      en: Ranking by position
    columns:
    - position
    - candidate_name
    - total_final
    - total_ai
    - review_status
    query: sort total_final desc
    roles:
    - admin
    - recruiter
    export: true
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Plan
    roles:
    - admin
  triggers:
  - key: invite_email
    'on':
      collection: candidates
      op: insert
    notify:
      to:
      - record.email
      subject:
        it: 'Invito al colloquio: {record.position}'
        en: 'Interview invitation: {record.position}'
      body:
        it: Ciao {record.name}, sei invitato a un colloquio strutturato di circa 20 minuti per la posizione {record.position}.
          Accedi con questa email, leggi e dai il consenso, poi inizia quando vuoi.
        en: Hi {record.name}, you are invited to a structured interview of about 20 minutes for the position {record.position}.
          Sign in with this email, read and give your consent, then start whenever you like.
      link: consent
  - key: evaluate
    description: Score the transcript when the interview ends
    'on':
      collection: transcripts
      op: insert
    start:
      agent: evaluator
    goal: 'Evaluate the interview of {record.candidate_email} for position {record.position}; transcript: {record.text}'
    asUser: false
  - key: review_needed
    'on':
      collection: evaluations
      op: insert
    notify:
      to:
      - record.recruiter_email
      subject:
        it: 'Valutazione pronta: {record.candidate_name}'
        en: 'Evaluation ready: {record.candidate_name}'
      body:
        it: La valutazione proposta per {record.candidate_name} ({record.position}) è pronta. Rivedi i punteggi e decidi.
        en: The proposed evaluation for {record.candidate_name} ({record.position}) is ready. Review the scores and decide.
      link: evaluations
  - key: candidate_feedback
    'on':
      collection: candidates
      op: update
      where:
        outcome: next_round
    notify:
      to:
      - record.email
      subject:
        it: Esito del colloquio
        en: Interview outcome
      body:
        it: 'Grazie per il colloquio per {record.position}. Il recruiter ha deciso di proseguire: accedi per leggere il riscontro.'
        en: 'Thank you for your interview for {record.position}. The recruiter has decided to move you forward: sign in to
          read the feedback.'
      link: my_interview
  - key: candidate_feedback_no
    'on':
      collection: candidates
      op: update
      where:
        outcome: not_proceeding
    notify:
      to:
      - record.email
      subject:
        it: Esito del colloquio
        en: Interview outcome
      body:
        it: Grazie per il colloquio per {record.position}. Accedi per leggere il riscontro del recruiter.
        en: Thank you for your interview for {record.position}. Sign in to read the recruiter's feedback.
      link: my_interview
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: starter
      price: 99
      interval: month
      label:
        it: Starter — 20 colloqui/mese
        en: Starter — 20 interviews/month
      roles:
      - admin
    - key: pro
      price: 349
      interval: month
      label:
        it: Pro — 100 colloqui/mese
        en: Pro — 100 interviews/month
      roles:
      - admin
    - key: business
      price: 899
      interval: month
      label:
        it: Business — colloqui illimitati
        en: Business — unlimited interviews
      roles:
      - admin
  extensions:
  - key: browser_voice_video
    description: 'Voice conversation and recorded video in the candidate''s browser (microphone/camera capture, speech-to-text
      and text-to-speech) are not available yet: the interview currently runs as a text chat in the candidate view; the voice/video
      choice is saved in candidates.mode for when it is.'
  - key: ats_sync
    description: Sync of scores, reports and decisions with the company ATS needs the ATS to be named (API key or OAuth);
      for now results are exportable as CSV from the ranking and evaluations views. An org-scoped credential and an http tool
      can be added once the ATS and its API host are known.
