apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: eventi-aziendali
  displayName: Eventi Aziendali
  tagline:
    it: Location e fornitori per il tuo evento, con preventivi negoziati e confrontati.
  description:
    it: 'Descrivi l''evento: un team di agenti cerca location e fornitori, prepara le richieste di preventivo, legge le risposte,
      negozia e ti consegna il confronto delle offerte. Tu approvi ogni email e ogni accettazione.'
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1d2b4f'
      accent: '#e2733b'
      background: '#fbf8f4'
      foreground: '#1c1f26'
    fonts:
      body: Inter
      display: Fraunces
  header:
    links:
    - label: Come funziona
      href: '#come-funziona'
    cta:
      label: Organizza un evento
      href: /v/new_event
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  limits:
  - action: agent:scout
    per: user
    max: 5
    window: day
    roles:
    - user
  agents:
  - key: scout
    role: main
    description: Cerca location e fornitori sul web, li salva e prepara le bozze delle richieste di preventivo.
    profile:
      inline:
        display_name: Event scout
        crews:
        - id: scout
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'Sei un event planner aziendale. Dato un evento, cerchi sul web (con gli strumenti WebRobot) 5-8
            location e fornitori adatti per città, date, numero di persone, budget ed esigenze. Per ognuno chiama save_supplier
            con name, category, website, email di contatto (solo se pubblicata sul sito), city, notes e event_ref (titolo
            dell''evento). Poi per ogni fornitore con email chiama draft_email con event_ref, supplier_name, to_email, subject
            e body: una richiesta di preventivo cortese e precisa (date, persone, esigenze, budget indicativo, scadenza di
            risposta) e status draft. Non inviare nulla: il cliente approva ogni email. Non inventare email, prezzi o disponibilità.
            Chiudi con un report che inizia con un titolo di primo livello ''# Evento <tipo> a <città> — fornitori'', sezioni
            ## Fornitori trovati (tabella), ## Bozze email pronte da approvare, ## Prossimi passi (approva le bozze nella
            sezione Email da approvare).'
    goalTemplate: 'Evento: {event_type_label}

      Città: {city}

      Date: dal {date_from} al {date_to}

      Persone: {people}

      {?budget}Budget totale: {budget} EUR{/budget}

      {?needs}Esigenze: {needs}{/needs}

      {?notes}Note: {notes}{/notes}

      Scrivi in italiano. Oggi è {date}.'
    output: markdown
    appTools:
    - name: save_supplier
      description: Salva un fornitore o una location trovata
      action: write
      collection: suppliers
      scope: user
    - name: draft_email
      description: Crea la bozza di una email a un fornitore, da far approvare al cliente
      action: write
      collection: email_drafts
      scope: user
  - key: negotiator
    role: helper
    description: Legge le risposte dei fornitori, negozia in più giri e prepara il confronto delle offerte.
    awaits:
    - accept_offer
    profile:
      inline:
        display_name: Event negotiator
        crews:
        - id: negotiator
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 20
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei il negoziatore di eventi aziendali. Ricevi la risposta di un fornitore (email) nel messaggio.
            Leggi fornitori e offerte già note con read_suppliers e read_offers. Estrai prezzo, condizioni, scadenze e salvale
            con save_offer (supplier_name, event_ref, price, conditions, status received). Se c''è margine, chiama draft_email
            con una risposta di negoziazione cortese su prezzo e condizioni (anche più giri): il cliente deve approvarla prima
            dell''invio. Non accettare mai un''offerta da solo: per accettare usa lo strumento request_accept_offer e attendi
            la decisione. Quando ci sono più offerte, scrivi il confronto: titolo ''# Confronto offerte — <evento>'', tabella
            con prezzo, condizioni, pro e contro, raccomandazione motivata, e un grafico ```chart``` con i prezzi. Non inventare
            cifre.'
    goalTemplate: 'Nuova email da un fornitore:

      {message}

      Storia: {history}'
    output: markdown
    appTools:
    - name: read_suppliers
      description: Elenca i fornitori del cliente
      action: read
      collection: suppliers
      scope: user
    - name: read_offers
      description: Elenca le offerte ricevute
      action: read
      collection: offers
      scope: user
    - name: save_offer
      description: Salva o aggiorna un'offerta ricevuta
      action: write
      collection: offers
      scope: user
    - name: draft_email
      description: Crea la bozza di una email a un fornitore, da far approvare al cliente
      action: write
      collection: email_drafts
      scope: user
  approvals:
  - key: accept_offer
    title: Accettare l'offerta
    description: Il cliente conferma prima che il negoziatore accetti un'offerta
    decidedBy: requester
    fields:
    - supplier_name
    - price
    - conditions
  channels:
  - key: inbox
    type: email
    agent: negotiator
  triggers:
  - key: send_approved_email
    description: Invia al fornitore l'email approvata dal cliente
    'on':
      collection: email_drafts
      op: update
      where:
        status: approved
    notify:
      to:
      - record.to_email
      subject: '{record.subject}'
      body: '{record.body}'
  inputForm:
    title: Nuovo evento
    fields:
    - name: event_type
      type: select
      required: true
      label: Tipo di evento
      options:
      - value: offsite
        label: Offsite
      - value: team_dinner
        label: Cena di team
      - value: convention
        label: Convention
    - name: city
      type: text
      required: true
      label: Città
    - name: date_from
      type: date
      required: true
      label: Dal
    - name: date_to
      type: date
      required: true
      label: Al
    - name: people
      type: number
      required: true
      label: Numero di persone
    - name: budget
      type: number
      label: Budget totale (EUR)
    - name: needs
      type: multiselect
      label: Esigenze
      options:
      - value: sala riunioni
        label: Sala riunioni
      - value: catering
        label: Catering
      - value: accessibilità
        label: Accessibilità
    - name: notes
      type: textarea
      maxLength: 500
      label: Note (facoltative)
  data:
    collections:
    - name: suppliers
      ownedBy: user
      description: Location e fornitori trovati per gli eventi del cliente
      fields:
      - name: event_ref
        type: text
        label: Evento
      - name: name
        type: text
        label: Nome
      - name: category
        type: text
        label: Categoria
      - name: website
        type: url
        label: Sito
      - name: email
        type: email
        label: Email
      - name: city
        type: text
        label: Città
      - name: notes
        type: textarea
        label: Note
    - name: email_drafts
      ownedBy: user
      description: 'Email ai fornitori: bozza, approvata dal cliente, inviata'
      retentionDays: 365
      fields:
      - name: event_ref
        type: text
        label: Evento
      - name: supplier_name
        type: text
        label: Fornitore
      - name: to_email
        type: email
        label: A
      - name: subject
        type: text
        label: Oggetto
      - name: body
        type: textarea
        label: Testo
      - name: status
        type: select
        label: Stato
        default: draft
        options:
        - value: draft
          label: Bozza
        - value: approved
          label: 'Approvata: invia'
        - value: rejected
          label: Scartata
    - name: offers
      ownedBy: user
      description: Offerte ricevute dai fornitori
      fields:
      - name: event_ref
        type: text
        label: Evento
      - name: supplier_name
        type: text
        label: Fornitore
      - name: price
        type: number
        label: Prezzo (EUR)
      - name: conditions
        type: textarea
        label: Condizioni
      - name: status
        type: select
        label: Stato
        options:
        - value: received
          label: Ricevuta
        - value: negotiating
          label: In trattativa
        - value: accepted
          label: Accettata
        - value: declined
          label: Rifiutata
  views:
  - key: home
    type: page
    nav: false
    title: Eventi Aziendali
    sections:
    - type: hero
      title: Il tuo **evento aziendale**, organizzato dagli agenti.
      text: 'Descrivi offsite, cena di team o convention: cerchiamo location e fornitori, chiediamo i preventivi, negoziamo
        e ti consegniamo il confronto. Approvi tu ogni email e ogni accettazione.'
      actions:
      - label: Organizza un evento
        href: /v/new_event
        style: primary
      - label: Accedi
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title: Come funziona
      items:
      - title: Compili il modulo
        text: Tipo di evento, città, date, persone, budget ed esigenze.
      - title: Gli agenti cercano
        text: Trovano location e fornitori e preparano le richieste di preventivo.
      - title: Approvi e negozi
        text: Approvi le email, gli agenti leggono le risposte e negoziano più giri.
      - title: Confronti e scegli
        text: Ricevi il confronto delle offerte e confermi tu l'accettazione.
    - type: note
      content: 'Ogni cliente vede solo i propri eventi e fornitori. Strumento di supporto: verifica sempre condizioni e contratti.'
  - key: new_event
    type: new_run
    title: Nuovo evento
    roles:
    - user
    - admin
  - key: events
    type: history
    title: I miei eventi
    source: run
    roles:
    - user
    - admin
  - key: event_report
    type: report
    source: run
    printable: true
    nav: false
  - key: suppliers_list
    type: table
    title: I miei fornitori
    source: collection:suppliers
    columns:
    - event_ref
    - name
    - category
    - email
    - website
    export: true
    roles:
    - user
    - admin
  - key: drafts_list
    type: table
    title: Email da approvare
    source: collection:email_drafts
    columns:
    - event_ref
    - supplier_name
    - subject
    - status
    roles:
    - user
    - admin
  - key: drafts_edit
    type: form
    title: Rivedi e approva email
    collection: email_drafts
    edit: true
    submit:
      label: Salva
      message: Salvato. Se l'hai approvata, parte al fornitore.
      redirect: drafts_list
    nav: false
    roles:
    - user
    - admin
  - key: offers_list
    type: table
    title: Confronto offerte
    source: collection:offers
    columns:
    - event_ref
    - supplier_name
    - price
    - conditions
    - status
    export: true
    roles:
    - user
    - admin
  - key: decisions
    type: approvals
    title: Accettazioni
    approvals:
    - accept_offer
    roles:
    - user
    - admin
  - key: account
    type: account
    title: Crediti
    roles:
    - user
  billing:
    modes:
    - credits
    signupCredits: 100
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:scout:
        estimate: 150
        metered: true
      agent:negotiator:
        estimate: 20
        metered: true
    packs:
    - key: starter
      credits: 500
      price: 15
      label: Starter
    - key: pro
      credits: 2000
      price: 50
      label: Pro
  notifications:
    emailOnRunDone: true
  extensions:
  - key: inbound_routing
    description: Le risposte arrivano nella casella dell'app (canale email); associare ogni risposta al cliente giusto richiede
      che il fornitore risponda alla stessa conversazione. L'invio delle email avviene tramite la notifica della piattaforma
      verso l'indirizzo del fornitore salvato nel record.
