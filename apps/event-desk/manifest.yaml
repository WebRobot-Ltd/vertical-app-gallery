apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: event-desk
  displayName: Event Desk
  tagline:
    it: 'Location e fornitori per i tuoi eventi aziendali: preventivi, trattative e confronto, con la tua approvazione.'
  description:
    it: 'Descrivi l''evento aziendale: un team di agenti cerca location e fornitori, prepara le richieste di preventivo, negozia
      le risposte e confronta le offerte. Niente parte senza il tuo ok.'
    en: 'Describe your corporate event: a team of agents finds venues and suppliers, drafts quote requests, negotiates replies
      and compares offers. Nothing is sent without your approval.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f2a44'
      accent: '#d9622b'
      background: '#faf8f5'
      foreground: '#1b1f24'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Event
      color: primary
    - text: Desk
      color: accent
  header:
    links:
    - label:
        it: Come funziona
      href: '#come-funziona'
    - label:
        it: Approvazioni
      href: '#controllo'
    cta:
      label:
        it: Organizza un evento
      href: /v/new_event
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  limits:
  - action: agent:scout
    per: user
    max: 5
    window: day
    roles:
    - user
  egress:
    hosts: []
    notes: 'Nessuna API esterna: la ricerca avviene sul web tramite MCP WebRobot.'
  agents:
  - key: scout
    role: main
    description: Cerca location e fornitori adatti, li salva e prepara le bozze delle richieste di preventivo, da far approvare
      al cliente.
    profile:
      inline:
        display_name: Event Desk scout
        crews:
        - id: scout
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'Sei un event planner esperto di eventi aziendali in Italia. Dato un evento (tipo, città, date, persone,
            budget, esigenze) cerchi sul web 5-8 location e fornitori realmente esistenti e adatti (sala riunioni, catering,
            accessibilità se richiesta), usando gli strumenti WebRobot per leggere le loro pagine. Per ciascuno salva un record
            con lo strumento save_supplier (nome, categoria, sito, email di contatto trovata sul sito, perché è adatto, fonte).
            Non inventare mai email, prezzi o disponibilità: se l''email non è pubblica, lascia il campo vuoto e segnalalo.
            Poi, per ogni fornitore con email, scrivi una bozza di richiesta di preventivo in italiano, cortese e precisa
            (date, persone, esigenze, budget indicativo, scadenza risposta) e chiedi l''approvazione del cliente con request_send_email:
            nulla viene inviato senza il suo ok. Chiudi con un report che inizia con un titolo di livello 1 "# Ricerca fornitori
            — <tipo evento>, <città>", sezioni ## Fornitori trovati (tabella), ## Bozze in attesa di approvazione, ## Prossimi
            passi. Non dare consulenza legale o fiscale.'
    mcpServers:
    - name: webrobot
      url: https://mcp-full.webrobot.eu/mcp
      allow: all
    awaits:
    - send_email
    appTools:
    - name: save_event
      description: Salva o aggiorna l'evento del cliente
      action: write
      collection: events
      scope: user
    - name: save_supplier
      description: Salva un fornitore trovato
      action: write
      collection: suppliers
      scope: user
    - name: save_message
      description: Registra una bozza o un messaggio
      action: append
      collection: messages
      scope: user
    goalTemplate: 'Evento: {event_type_label}

      Città: {city}

      Date: {dates}

      Persone: {people}

      Budget totale: {budget} EUR

      Esigenze: {needs}

      {?notes}Note: {notes}{/notes}

      Oggi è {date}. Salva l''evento, cerca i fornitori e prepara le bozze di richiesta. Scrivi in italiano.'
    output: markdown
    limits:
      maxTurns: 40
      maxBudgetUsd: 1.5
  - key: negotiator
    role: helper
    description: Legge le risposte dei fornitori nella casella dell'app, prepara risposte di negoziazione (più giri) e registra
      le offerte.
    profile:
      inline:
        display_name: Event Desk negotiator
        crews:
        - id: negotiator
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei il negoziatore di un cliente che organizza un evento aziendale. Ricevi un''email di un fornitore.
            Leggi con read_event e read_messages evento, budget e storico della trattativa con quel fornitore. Estrai prezzo,
            cosa è incluso, condizioni (acconto, cancellazione, scadenza validità) e registra l''offerta con save_offer; mai
            inventare cifre non scritte nell''email. Se mancano informazioni o c''è margine di negoziazione rispetto al budget
            e alle altre offerte, scrivi una risposta cortese e ferma (sconto, servizi inclusi, condizioni di cancellazione)
            e chiedi l''approvazione con request_send_email prima di inviarla; massimo 3 giri per fornitore. Quando un''offerta
            è buona, non accettarla mai: proponi al cliente con request_accept_offer. Dopo ogni nuova offerta chiedi ad ask_comparer
            di aggiornare il confronto. Rispondi in italiano con un breve riepilogo.'
    memory: user
    delegates:
    - comparer
    awaits:
    - send_email
    - accept_offer
    appTools:
    - name: read_event
      description: Legge gli eventi del cliente
      action: read
      collection: events
      scope: user
    - name: read_messages
      description: Legge lo storico dei messaggi
      action: search
      collection: messages
      scope: user
    - name: save_message
      description: Registra un messaggio
      action: append
      collection: messages
      scope: user
    - name: save_offer
      description: Registra o aggiorna un'offerta
      action: write
      collection: offers
      scope: user
    goalTemplate: 'Nuovo messaggio dal fornitore: {event}

      Oggi è {date}.'
    output: markdown
    limits:
      maxTurns: 15
      maxBudgetUsd: 0.6
  - key: comparer
    role: helper
    description: Prepara il confronto delle offerte ricevute per un evento.
    profile:
      inline:
        display_name: Event Desk comparer
        crews:
        - id: comparer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Confronti le offerte dei fornitori per un evento aziendale. Leggi events e offers con gli strumenti.
            Il report inizia con "# Confronto offerte — <evento>"; poi ## Tabella di confronto (prezzo totale, prezzo a persona,
            cosa è incluso, condizioni, scadenza), ## Rispetto al budget, ## Raccomandazione con pro e contro, ## Da chiarire.
            Aggiungi un grafico con un blocco ```chart (bar, prezzo totale per fornitore, unità EUR) usando solo cifre reali
            delle offerte. Mai inventare dati mancanti: scrivili come "non indicato". Non accettare nulla: la decisione è
            del cliente.'
    appTools:
    - name: read_event
      description: Legge gli eventi
      action: read
      collection: events
      scope: user
    - name: read_offers
      description: Legge le offerte
      action: read
      collection: offers
      scope: user
    goalTemplate: Aggiorna il confronto delle offerte. Oggi è {date}.
    output: markdown
  inputForm:
    title:
      it: Nuovo evento
    fields:
    - name: event_type
      type: select
      required: true
      label:
        it: Tipo di evento
      options:
      - value: offsite
        label: Offsite
      - value: team_dinner
        label:
          it: Cena di team
      - value: convention
        label: Convention
    - name: city
      type: text
      required: true
      label:
        it: Città
    - name: dates
      type: text
      required: true
      label:
        it: Date
      help:
        it: es. 12-13 marzo 2027
    - name: people
      type: number
      required: true
      label:
        it: Numero di persone
    - name: budget
      type: number
      required: true
      label:
        it: Budget totale (EUR)
    - name: needs
      type: multiselect
      label:
        it: Esigenze
      options:
      - value: sala
        label:
          it: Sala riunioni
      - value: catering
        label: Catering
      - value: accessibilita
        label:
          it: Accessibilità
    - name: notes
      type: textarea
      maxLength: 600
      label:
        it: Note (facoltative)
  data:
    collections:
    - name: events
      ownedBy: user
      description: Gli eventi del cliente
      fields:
      - name: event_type
        type: text
      - name: city
        type: text
      - name: dates
        type: text
      - name: people
        type: number
      - name: budget
        type: number
      - name: needs
        type: text
    - name: suppliers
      ownedBy: user
      description: Location e fornitori trovati per il cliente
      fields:
      - name: event
        type: text
      - name: name
        type: text
      - name: category
        type: text
      - name: website
        type: url
      - name: email
        type: email
      - name: fit
        type: textarea
      - name: source
        type: url
      - name: status
        type: text
    - name: messages
      ownedBy: user
      description: Email in uscita (bozze approvate) e in arrivo
      fields:
      - name: event
        type: text
      - name: supplier
        type: text
      - name: direction
        type: text
      - name: subject
        type: text
      - name: body
        type: textarea
      - name: status
        type: text
    - name: offers
      ownedBy: user
      description: Offerte ricevute dai fornitori
      fields:
      - name: event
        type: text
      - name: supplier
        type: text
      - name: total_price
        type: number
      - name: price_per_person
        type: number
      - name: included
        type: textarea
      - name: conditions
        type: textarea
      - name: valid_until
        type: date
      - name: status
        type: text
  approvals:
  - key: send_email
    title:
      it: Approva l'email al fornitore
    decidedBy: requester
    fields:
    - supplier
    - subject
    - body
    timeoutMinutes: 10080
  - key: accept_offer
    title:
      it: Approva l'accettazione dell'offerta
    decidedBy: requester
    fields:
    - supplier
    - total_price
    - conditions
    timeoutMinutes: 10080
  channels:
  - key: inbox
    type: email
    agent: negotiator
  triggers:
  - key: on_reply
    description: Una risposta di un fornitore arriva e il negoziatore la legge
    'on':
      collection: messages
      op: insert
      where:
        direction: inbound
    start:
      agent: negotiator
    goal: 'Risposta in arrivo: {event}'
    asUser: true
  views:
  - key: home
    type: page
    nav: false
    title: Event Desk
    sections:
    - type: hero
      band: true
      eyebrow:
        it: Eventi aziendali
      title:
        it: Dalla richiesta al **miglior preventivo**, senza rincorrere i fornitori.
      text:
        it: 'Descrivi offsite, cene di team o convention: un team di agenti trova location e fornitori, chiede i preventivi,
          negozia e ti presenta il confronto.'
      actions:
      - label:
          it: Organizza un evento
        href: /v/new_event
        style: primary
      - label:
          it: Accedi
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
      items:
      - title:
          it: Compili il modulo
        text:
          it: Tipo di evento, città, date, persone, budget ed esigenze.
        badge: 📝
      - title:
          it: Gli agenti cercano
        text:
          it: Location e fornitori reali dal web, con le fonti.
        badge: 🔎
      - title:
          it: Preventivi e trattative
        text:
          it: Richieste, risposte lette e negoziate in più giri.
        badge: ✉️
      - title:
          it: Confronto
        text:
          it: Tabella e grafico delle offerte con una raccomandazione.
        badge: 📊
    - type: cards
      id: controllo
      title:
        it: Decidi sempre tu
      items:
      - title:
          it: Ogni email approvata
        text:
          it: Nessuna richiesta o risposta parte senza il tuo ok.
      - title:
          it: Accettazione approvata
        text:
          it: Un'offerta viene accettata solo se lo confermi.
      - title:
          it: I tuoi dati sono tuoi
        text:
          it: Ogni cliente vede solo i propri eventi e fornitori.
    - type: note
      content:
        it: Supporto alla decisione, non consulenza legale o fiscale. Verifica sempre disponibilità e condizioni con il fornitore.
  - key: new_event
    type: new_run
    title:
      it: Nuovo evento
    roles:
    - user
    - admin
  - key: events
    type: history
    title:
      it: I miei eventi
    source: run
    roles:
    - user
    - admin
  - key: event_report
    type: report
    source: run
    printable: true
    nav: false
  - key: approvals
    type: approvals
    title:
      it: Da approvare
    roles:
    - user
    - admin
  - key: my_suppliers
    type: table
    title:
      it: I miei fornitori
    source: collection:suppliers
    data:
      display: table
      fields:
      - key: name
        label:
          it: Nome
      - key: category
        label:
          it: Categoria
        format: badge
      - key: email
        label: Email
      - key: website
        label:
          it: Sito
        format: link
      - key: status
        label:
          it: Stato
        format: badge
      limit: 100
      empty:
        it: Nessun fornitore ancora.
    roles:
    - user
    - admin
  - key: thread
    type: table
    title:
      it: Corrispondenza
    source: collection:messages
    data:
      display: table
      fields:
      - key: supplier
        label:
          it: Fornitore
      - key: direction
        label:
          it: Direzione
        format: badge
      - key: subject
        label:
          it: Oggetto
      - key: status
        label:
          it: Stato
        format: badge
      limit: 200
    roles:
    - user
    - admin
  - key: compare
    type: chart
    title:
      it: Confronto offerte
    source: collection:offers
    data:
      display: chart
      chart: bar
      fields:
      - key: supplier
        label:
          it: Fornitore
      - key: total_price
        label:
          it: Totale
        format: money
      limit: 30
      empty:
        it: Nessuna offerta ricevuta.
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Crediti
    roles:
    - user
  billing:
    modes:
    - credits
    currency: eur
    signupCredits: 100
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:scout:
        estimate: 150
        metered: true
      agent:negotiator:
        estimate: 10
        metered: true
    packs:
    - key: small
      credits: 500
      price: 5
      label: Starter
    - key: pro
      credits: 3000
      price: 25
      label: Pro
  extensions:
  - key: email_outbound
    description: 'Invio reale delle email ai fornitori dopo l''approvazione: oggi non disponibile. Le bozze approvate restano
      in ''messages'' con stato approved e vanno inviate manualmente finché non esiste uno strumento di invio dall''app.'
  - key: email_inbox
    description: La casella email dell'app (channel email) legge le risposte dei fornitori; il collegamento con la creazione
      dei record 'messages' inbound e la casella dedicata vanno configurati alla pubblicazione.
