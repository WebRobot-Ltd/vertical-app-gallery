apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: anticipo-paga
  displayName: AnticipoPaga
  tagline:
    it: Il tuo maturato, quando ti serve.
  description:
    it: 'Portale software per l''anticipo dello stipendio: calcolo del maturato, richiesta e verifica dei limiti. L''erogazione
      è svolta da un partner finanziario autorizzato.'
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12355b'
      accent: '#1b9a78'
      background: '#f6f8fb'
      foreground: '#16222f'
    fonts:
      body: Inter
      display: Inter
  header:
    links:
    - label:
        it: Come funziona
      href: '#come-funziona'
    cta:
      label:
        it: Accedi
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: hr
      label:
        it: HR azienda
      assignedBy: derived
      from: collection:accruals.hr_email
    - key: user
      label:
        it: Dipendente
      assignedBy: signup
  limits:
  - action: create:advance_requests
    max: 10
    window: month
    roles:
    - user
  agents:
  - key: checker
    role: main
    description: Verifica i limiti di una richiesta di anticipo e la approva o la manda all'HR.
    awaits:
    - hr_review
    context:
    - key: email
      from: user.email
    goalTemplate: 'Verifica la richiesta di anticipo {record.id} del dipendente {email}: importo richiesto {record.amount}
      EUR. Data: {date}. Rispondi in italiano.'
    appTools:
    - name: read_accrual
      description: Legge il maturato e le regole aziendali del dipendente
      action: read
      collection: accruals
      scope: all
    - name: read_requests
      description: Legge le richieste di anticipo del dipendente
      action: read
      collection: advance_requests
      scope: all
    - name: update_request
      description: Aggiorna stato, motivazione e hr_email di una richiesta
      action: write
      collection: advance_requests
      scope: all
    output: markdown
    limits:
      maxTurns: 10
      maxBudgetUsd: 0.3
    profile:
      inline:
        display_name: Verificatore anticipi
        crews:
        - id: checker
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei il verificatore delle richieste di anticipo sullo stipendio. Sei solo uno strato software: NON
            eroghi credito, l''erogazione è svolta da un partner finanziario autorizzato e l''importo anticipato è conguagliato
            in busta a fine mese. Procedura: 1) con read_accrual leggi il maturato del mese, la percentuale massima (max_pct),
            la soglia di approvazione automatica (auto_threshold) e il numero massimo di richieste mensili (max_requests)
            del dipendente; 2) con read_requests conta le richieste e gli importi già anticipati nel mese (stati approved,
            pending_hr, paid); 3) calcola la capienza = maturato × max_pct/100 − già anticipato. Regole: se l''importo supera
            la capienza o le richieste del mese superano il massimo, imposta lo stato ''rejected'' con motivazione chiara;
            se è nei limiti e <= auto_threshold imposta ''approved''; se è nei limiti ma oltre soglia usa lo strumento request_hr_review
            e imposta ''pending_hr''. Con update_request scrivi sempre status, decision_reason e hr_email (copiato dal maturato,
            mai inventato). Non inventare cifre: se mancano i dati del maturato, imposta ''pending_hr'' e spiega. Chiudi con
            un report che inizia con un titolo "# Verifica anticipo — <esito>" e riporta maturato, capienza, importo e motivazione.'
  inputForm:
    title:
      it: Richiesta
    fields: []
  data:
    collections:
    - name: accruals
      ownedBy: org
      description: Maturato mensile per dipendente e regole aziendali, caricati dal sistema paghe (file o collegamento)
      fields:
      - name: employee_email
        type: email
        required: true
        label:
          it: Email dipendente
      - name: company
        type: text
        label:
          it: Azienda
      - name: hr_email
        type: email
        required: true
        label:
          it: Email HR
      - name: month
        type: text
        label:
          it: Mese (AAAA-MM)
      - name: accrued
        type: number
        required: true
        label:
          it: Maturato netto (€)
      - name: max_pct
        type: number
        label:
          it: '% massima anticipabile'
      - name: auto_threshold
        type: number
        label:
          it: Soglia approvazione automatica (€)
      - name: max_requests
        type: number
        label:
          it: Richieste massime al mese
      access:
      - role: hr
        where:
          hr_email: '{user.email}'
        can:
        - read
      - role: user
        where:
          employee_email: '{user.email}'
        can:
        - read
    - name: advance_requests
      ownedBy: user
      description: Richieste di anticipo dei dipendenti
      retentionDays: 1825
      fields:
      - name: amount
        type: number
        required: true
        label:
          it: Importo richiesto (€)
      - name: note
        type: textarea
        maxLength: 300
        label:
          it: Note
      - name: status
        type: select
        label:
          it: Stato
        options:
        - value: pending
          label: In verifica
        - value: approved
          label: Approvata
        - value: pending_hr
          label: Attesa HR
        - value: rejected
          label: Rifiutata
        - value: paid
          label: Erogata dal partner
        default: pending
      - name: decision_reason
        type: textarea
        label:
          it: Motivazione
      - name: hr_email
        type: email
        label:
          it: HR di riferimento
      access:
      - role: hr
        where:
          hr_email: '{user.email}'
        can:
        - read
        - write
    credentials: []
  triggers:
  - key: verify_request
    'on':
      collection: advance_requests
      op: insert
      where:
        status: pending
    start:
      agent: checker
    goal: Verifica la richiesta {record.id} di {record.amount} EUR.
    asUser: true
  - key: payroll_feed
    'on':
      webhook: true
    write:
      collection: accruals
      fields:
        employee_email: employee_email
        company: company
        hr_email: hr_email
        month: month
        accrued: accrued
        max_pct: max_pct
        auto_threshold: auto_threshold
        max_requests: max_requests
      keyBy: employee_email
  - key: advance_approved
    'on':
      collection: advance_requests
      op: update
      where:
        status: approved
    notify:
      to:
      - owner
      subject:
        it: Anticipo approvato
      body:
        it: La tua richiesta di anticipo di {record.amount} € è stata approvata. L'erogazione è eseguita dal partner finanziario;
          l'importo sarà conguagliato in busta a fine mese.
      link: my_requests
  - key: advance_rejected
    'on':
      collection: advance_requests
      op: update
      where:
        status: rejected
    notify:
      to:
      - owner
      subject:
        it: Anticipo non approvato
      body:
        it: 'La tua richiesta di {record.amount} € non è stata approvata: {record.decision_reason}'
      link: my_requests
  - key: hr_decided
    'on':
      approval: hr_review
      decision: any
    notify:
      to:
      - owner
      subject:
        it: Decisione HR sulla tua richiesta
      body:
        it: L'HR ha esaminato la tua richiesta di anticipo. Controlla lo stato nell'app.
      link: my_requests
  approvals:
  - key: hr_review
    title:
      it: Anticipo fuori soglia
    description: Richiesta di anticipo oltre la soglia di approvazione automatica
    role: hr
    decidedBy: role
    fields:
    - amount
    - accrued
    - month
    timeoutMinutes: 4320
    onTimeout: reject
  views:
  - key: home
    type: page
    nav: false
    title: AnticipoPaga
    sections:
    - type: hero
      eyebrow:
        it: Per le aziende e i loro dipendenti
      title:
        it: Vedi il tuo **maturato** e richiedi un anticipo in pochi minuti
      text:
        it: Il portale calcola quanto hai già maturato e quanto puoi richiedere secondo le regole della tua azienda. L'erogazione
          è svolta da un partner finanziario autorizzato; l'importo è conguagliato in busta a fine mese.
      actions:
      - label:
          it: Accedi
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
      items:
      - title:
          it: L'azienda aderisce
        text:
          it: Carica i dati di maturato dal sistema paghe, con file o collegamento, e imposta le regole.
        badge: 🏢
      - title:
          it: Il dipendente richiede
        text:
          it: Vede maturato e importo disponibile e invia la richiesta con un modulo.
        badge: 📝
      - title:
          it: Verifica automatica
        text:
          it: 'Un agente controlla i limiti: approva, rifiuta o passa all''HR i casi fuori soglia.'
        badge: ✅
      - title:
          it: Conguaglio in busta
        text:
          it: A fine mese l'anticipo è trattenuto in busta paga.
        badge: 💶
    - type: note
      content:
        it: 'AnticipoPaga è solo lo strato software di calcolo e richiesta. Non eroga credito: l''erogazione è un servizio
          regolamentato svolto da un partner autorizzato.'
  - key: my_accrual
    type: table
    title:
      it: Il mio maturato
    source: collection:accruals
    columns:
    - month
    - accrued
    - max_pct
    - auto_threshold
    - max_requests
    roles:
    - user
  - key: request
    type: form
    title:
      it: Richiedi un anticipo
    collection: advance_requests
    fields:
    - amount
    - note
    submit:
      label:
        it: Invia richiesta
      message:
        it: 'Richiesta inviata: l''agente la sta verificando.'
      redirect: my_requests
    roles:
    - user
  - key: my_requests
    type: table
    title:
      it: Le mie richieste
    source: collection:advance_requests
    columns:
    - amount
    - status
    - decision_reason
    - note
    roles:
    - user
  - key: company_requests
    type: table
    title:
      it: Richieste dell'azienda
    source: collection:advance_requests
    columns:
    - amount
    - status
    - decision_reason
    - hr_email
    export: true
    roles:
    - hr
    - admin
  - key: company_accruals
    type: table
    title:
      it: Maturato dipendenti
    source: collection:accruals
    columns:
    - employee_email
    - month
    - accrued
    - max_pct
    - auto_threshold
    - max_requests
    export: true
    roles:
    - hr
    - admin
  - key: approvals
    type: approvals
    title:
      it: Approvazioni HR
    approvals:
    - hr_review
    roles:
    - hr
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
    roles:
    - hr
    - admin
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: azienda_base
      price: 99
      interval: month
      label:
        it: Azienda Base
      includes:
      - fino a 50 dipendenti
      - approvazione HR
      roles:
      - hr
    - key: azienda_plus
      price: 299
      interval: month
      label:
        it: Azienda Plus
      includes:
      - fino a 500 dipendenti
      - esportazioni CSV
      - webhook dal sistema paghe
      roles:
      - hr
  notifications:
    emailOnRunDone: false
  extensions:
  - key: commissione_per_anticipo
    description: 'La commissione per anticipo a carico dell''azienda alternativa all''abbonamento richiede un addebito per
      azienda: non disponibile, per ora solo abbonamento.'
  - key: erogazione_partner
    description: L'invio dell'ordine di pagamento al partner finanziario autorizzato e il conguaglio in busta richiedono un'integrazione
      con API del partner e del sistema paghe, da collegare via webhook o chiave API; qui lo stato 'paid' è aggiornato dal
      partner.
  - key: oauth_paghe
    description: 'Il collegamento diretto con sistemi paghe basati su OAuth non è disponibile: i dati si caricano via file
      CSV nella pagina Dati o via webhook.'
