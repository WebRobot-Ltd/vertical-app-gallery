apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: camposano
  displayName: CampoSano
  tagline:
    it: 'Ogni appezzamento sotto controllo: vigore, meteo e rischio malattie, ogni giorno.'
    en: 'Every plot under control: vigour, weather and disease risk, every day.'
  description:
    it: 'Supporto alle decisioni per l''agricoltura di precisione: un agente per appezzamento incrocia indici satellitari,
      meteo e modelli agronomici e ti avvisa quando il rischio supera la soglia.'
    en: 'Decision support for precision farming: one agent per plot combines satellite indices, weather and agronomic models
      and alerts you when risk crosses the threshold.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: dashboard
  branding:
    theme: light
    palette:
      primary: '#2f5d3a'
      accent: '#c98a1b'
      background: '#f6f5ee'
      foreground: '#1d2a1f'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Campo
      color: primary
    - text: Sano
      color: accent
    tokens:
      green: '#2e7d4f'
      amber: '#d99a1c'
      red: '#b3402e'
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#how'
    - label:
        it: Fonti
        en: Sources
      href: '#sources'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      label:
        it: Azienda agricola
        en: Farm
      assignedBy: signup
    - key: consultant
      label:
        it: Consulente
        en: Consultant
      assignedBy: derived
      from: collection:plots.consultant_email
  limits:
  - action: create:plots
    max: 5
    window: total
    plans:
      farm_small: 30
      farm_medium: 150
      farm_large: -1
  - action: login
    per: ip
    max: 20
    window: hour
  agents:
  - key: plot_analyst
    role: scheduled
    description: 'Daily analysis of one plot: satellite vigour, weather, disease and water-stress risk.'
    memory: instance
    writesTo:
      collection: plot_readings
      parse: json_last
      keyBy: date
    output: markdown+json
    resultSchema:
      type: object
      properties:
        date:
          type: string
        plot:
          type: string
        consultant_email:
          type: string
        ndvi:
          type: number
        ndvi_trend:
          type: number
        rain_mm:
          type: number
        temp_mean:
          type: number
        et0_mm:
          type: number
        water_stress:
          type: number
        disease:
          type: string
        disease_risk:
          type: number
        risk_level:
          type: string
          enum:
          - green
          - amber
          - red
        advice:
          type: string
        summary:
          type: string
    limits:
      maxTurns: 30
      maxBudgetUsd: 0.8
    appTools:
    - name: read_plots
      description: Read the user's plots (crop, variety, key dates, coordinates, consultant)
      action: read
      collection: plots
      scope: user
    - name: weather_forecast
      description: 'Open-Meteo forecast: query latitude, longitude, daily, hourly, forecast_days, timezone'
      action: http
      http:
        method: GET
        url: https://api.open-meteo.com/v1/forecast
        attribution: Open-Meteo.com, CC BY 4.0
    - name: weather_history
      description: 'Open-Meteo historical archive: query latitude, longitude, start_date, end_date, daily, timezone'
      action: http
      http:
        method: GET
        url: https://archive-api.open-meteo.com/v1/archive
        attribution: Open-Meteo.com, CC BY 4.0
    mcpServers:
    - name: webrobot
      url: https://mcp-full.webrobot.eu/mcp
      allow: all
    profile:
      inline:
        display_name: CampoSano plot analyst
        crews:
        - id: plot_analyst
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You are an agronomy decision-support analyst. For ONE plot: (1) read it with read_plots (crop, variety,
            sowing and flowering dates, lat/lon, area, consultant). (2) Get weather: last 14 days with weather_history and
            7-day forecast with weather_forecast (daily temperature_2m_mean, precipitation_sum, et0_fao_evapotranspiration,
            relative_humidity_2m_mean; hourly leaf-wetness proxies from humidity and rain). Use the regional ARPA station
            data of the plot''s area through the WebRobot MCP when a public page/dataset is available. (3) Get the latest
            Copernicus Sentinel-2 NDVI/NDRE for the plot through the WebRobot MCP (public Copernicus Data Space pages/datasets);
            if unavailable, say so and set ndvi to null: never invent figures. (4) Apply standard agronomic models suited
            to crop, variety and phenological stage (e.g. downy mildew 3-10 rule and powdery mildew index for grapevine, late
            blight Smith/Hutton periods for potato and tomato, septoria and rust infection periods for wheat, water balance
            from ET0 minus rain for water stress). State the model used and the inputs. (5) Classify risk_level green (<40),
            amber (40-70), red (>70) on the highest disease_risk or water_stress. Advice must be practical and prudent (monitor,
            scout, consider treatment window); never prescribe a specific product or dose as certain, the agronomist decides.
            Report: first line ''# <plot> — <date>'', then ## Vigore (NDVI and trend), ## Meteo, ## Rischi, ## Consiglio,
            ## Fonti e limiti. Write in the language with ISO code given in the goal. Use a ```chart block (line) for NDVI
            or rain/ET0 when you have at least 5 real data points. Finish with ONE final fenced json block matching the result
            schema (date as YYYY-MM-DD, plot = plot name, consultant_email from the plot). Use memory: call remember once
            with the last NDVI, risk values and treatments mentioned, so tomorrow you report what changed.'
  templates:
  - key: plot_watch
    title:
      it: Monitoraggio appezzamento
      en: Plot monitoring
    description:
      it: Un'analisi quotidiana per l'appezzamento scelto, con alert email se il rischio è alto.
      en: A daily analysis for the chosen plot, with an email alert when risk is high.
    agent: plot_analyst
    params:
    - name: plot
      type: select
      required: true
      optionsFrom: collection:plots
      label:
        it: Appezzamento
        en: Plot
    goal: Analyse the plot "{plot}" (instance {instance}). Today is {date}. Write the report in the language with ISO code
      {lang}.
    schedule:
      cron: 0 5 * * *
      userCanChange: false
    maxPerUser: 200
  inputForm:
    title:
      it: Nuovo appezzamento
      en: New plot
    fields: []
  data:
    collections:
    - name: plots
      description: Plots (appezzamenti) of each farm with crop, variety and key dates
      ownedBy: user
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome appezzamento
          en: Plot name
      - name: farm
        type: text
        label:
          it: Azienda
          en: Farm
      - name: crop
        type: select
        required: true
        label:
          it: Coltura
          en: Crop
        options:
        - value: grapevine
          label:
            it: Vite
            en: Grapevine
        - value: wheat
          label:
            it: Frumento
            en: Wheat
        - value: potato
          label:
            it: Patata
            en: Potato
        - value: tomato
          label:
            it: Pomodoro
            en: Tomato
        - value: olive
          label:
            it: Olivo
            en: Olive
        - value: maize
          label:
            it: Mais
            en: Maize
        - value: other
          label:
            it: Altro
            en: Other
      - name: variety
        type: text
        label:
          it: Varietà
          en: Variety
      - name: sowing_date
        type: date
        label:
          it: Data semina/impianto
          en: Sowing/planting date
      - name: flowering_date
        type: date
        label:
          it: Data fioritura
          en: Flowering date
      - name: area_ha
        type: number
        required: true
        label:
          it: Superficie (ha)
          en: Area (ha)
      - name: lat
        type: number
        required: true
        label:
          it: Latitudine
          en: Latitude
      - name: lon
        type: number
        required: true
        label:
          it: Longitudine
          en: Longitude
      - name: boundary
        type: json
        label:
          it: Perimetro (GeoJSON)
          en: Boundary (GeoJSON)
      - name: alert_threshold
        type: number
        default: 70
        label:
          it: Soglia alert rischio (0-100)
          en: Risk alert threshold (0-100)
      - name: consultant_email
        type: email
        label:
          it: Email del consulente (facoltativa)
          en: Consultant email (optional)
      access:
      - role: consultant
        where:
          consultant_email: '{user.email}'
        can:
        - read
        - write
    - name: plot_readings
      description: Daily indices, weather and risk of each monitored plot
      ownedBy: instance
      retentionDays: 1095
      fields:
      - name: date
        type: date
      - name: plot
        type: text
      - name: consultant_email
        type: email
      - name: ndvi
        type: number
      - name: ndvi_trend
        type: number
      - name: rain_mm
        type: number
      - name: temp_mean
        type: number
      - name: et0_mm
        type: number
      - name: water_stress
        type: number
      - name: disease
        type: text
      - name: disease_risk
        type: number
      - name: risk_level
        type: select
        options:
        - green
        - amber
        - red
      - name: advice
        type: textarea
      - name: summary
        type: textarea
      access:
      - role: consultant
        where:
          consultant_email: '{user.email}'
  views:
  - key: home
    type: page
    nav: false
    title: CampoSano
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow:
        it: Agricoltura di precisione
        en: Precision farming
      title:
        it: Sai **cosa succede** in ogni appezzamento, ogni giorno.
        en: Know **what is happening** in every plot, every day.
      text:
        it: 'Satellite Copernicus, meteo Open-Meteo e stazioni ARPA, letti da un agente per ogni appezzamento: vigore, stress
          idrico e rischio malattie con un semaforo e il consiglio di intervento.'
        en: 'Copernicus satellite, Open-Meteo weather and ARPA stations, read by one agent per plot: vigour, water stress
          and disease risk with a traffic light and intervention advice.'
      actions:
      - label:
          it: Inizia
          en: Get started
        href: /login
        style: primary
      aside: '<div style="padding:16px"><b>Vigneto Nord</b><br>NDVI 0.71 ▲<br>Peronospora: <span style="color:#b3402e">rischio
        alto</span></div>'
    - type: steps
      id: how
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Registra i campi
          en: Add your plots
        text:
          it: Posizione, coltura, varietà, semina e fioritura.
          en: Location, crop, variety, sowing and flowering.
        badge: 🗺️
      - title:
          it: Monitoraggio quotidiano
          en: Daily monitoring
        text:
          it: Un agente analizza indici e meteo e applica i modelli agronomici.
          en: An agent analyses indices and weather and applies agronomic models.
        badge: 🛰️
      - title:
          it: Alert e consigli
          en: Alerts and advice
        text:
          it: Email quando il rischio supera la soglia, con l'intervento suggerito.
          en: Email when risk crosses the threshold, with suggested action.
        badge: 📧
    - type: cards
      id: sources
      title:
        it: Fonti
        en: Sources
      items:
      - title: Copernicus Sentinel-2
        text:
          it: Indici di vegetazione (NDVI).
          en: Vegetation indices (NDVI).
      - title: Open-Meteo
        text:
          it: Previsioni e storico meteo (CC BY 4.0).
          en: Forecast and historical weather (CC BY 4.0).
      - title: ARPA
        text:
          it: Stazioni meteo regionali.
          en: Regional weather stations.
    - type: note
      content:
        it: 'Supporto alle decisioni, non sostituisce l''agronomo: le scelte di trattamento restano a tuo carico.'
        en: 'Decision support, not a replacement for the agronomist: treatment decisions remain yours.'
  - key: dashboard
    type: page
    title:
      it: Dashboard
      en: Dashboard
    roles:
    - user
    - admin
    - consultant
    sections:
    - type: data
      title:
        it: Semaforo di rischio
        en: Risk traffic light
      source: collection:plot_readings
      display: table
      fields:
      - key: plot
        label:
          it: Appezzamento
          en: Plot
      - key: date
        format: date
        label: Data
      - key: risk_level
        format: badge
        label:
          it: Rischio
          en: Risk
      - key: disease
        label:
          it: Malattia
          en: Disease
      - key: disease_risk
        format: number
        label: '%'
      - key: water_stress
        format: number
        label:
          it: Stress idrico
          en: Water stress
      - key: advice
        label:
          it: Consiglio
          en: Advice
      sort:
        field: date
        dir: desc
      limit: 50
      empty:
        it: 'Nessun dato ancora: attiva il monitoraggio di un appezzamento.'
        en: 'No data yet: start monitoring a plot.'
    - type: data
      title:
        it: Andamento NDVI
        en: NDVI trend
      source: collection:plot_readings
      display: chart
      chart: line
      fields:
      - key: date
      - key: ndvi
        label: NDVI
      sort:
        field: date
        dir: asc
      limit: 120
    - type: data
      title:
        it: Pioggia ed evapotraspirazione
        en: Rain and evapotranspiration
      source: collection:plot_readings
      display: chart
      chart: bar
      fields:
      - key: date
      - key: rain_mm
        label: mm
      - key: et0_mm
        label: ET0
      sort:
        field: date
        dir: asc
      limit: 60
    - type: view
      title:
        it: Mappa appezzamenti
        en: Plots map
      view: plots_map
  - key: plots_map
    type: map
    title:
      it: Mappa
      en: Map
    source: collection:plots
    map:
      lat: lat
      lon: lon
      title: name
      popup:
      - farm
      - crop
      - variety
      - area_ha
    nav: false
    roles:
    - user
    - admin
    - consultant
  - key: add_plot
    type: form
    title:
      it: Nuovo appezzamento
      en: New plot
    collection: plots
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Appezzamento salvato. Attiva il monitoraggio in «Monitoraggi».
        en: Plot saved. Start monitoring in "Monitoring".
      redirect: plots
    edit: true
    roles:
    - user
    - admin
  - key: plots
    type: table
    title:
      it: I miei appezzamenti
      en: My plots
    source: collection:plots
    columns:
    - name
    - farm
    - crop
    - variety
    - sowing_date
    - flowering_date
    - area_ha
    - consultant_email
    export: true
    roles:
    - user
    - admin
    - consultant
  - key: watches
    type: instances
    template: plot_watch
    title:
      it: Monitoraggi
      en: Monitoring
    roles:
    - user
    - admin
  - key: readings
    type: table
    title:
      it: Storico analisi
      en: Analysis history
    source: collection:plot_readings
    columns:
    - date
    - plot
    - ndvi
    - rain_mm
    - et0_mm
    - disease
    - disease_risk
    - risk_level
    export: true
    roles:
    - user
    - admin
    - consultant
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - user
  triggers:
  - key: risk_alert
    description: Email when a plot reaches red risk
    'on':
      collection: plot_readings
      op: insert
      where:
        risk_level: red
    notify:
      to:
      - owner
      - record.consultant_email
      subject:
        it: 'CampoSano: rischio alto su {record.plot} ({record.disease})'
        en: 'CampoSano: high risk on {record.plot} ({record.disease})'
      body:
        it: 'Appezzamento: {record.plot}

          Malattia: {record.disease}

          Rischio: {record.disease_risk}%


          Consiglio: {record.advice}


          La decisione sul trattamento spetta all''agronomo.'
        en: 'Plot: {record.plot}

          Disease: {record.disease}

          Risk: {record.disease_risk}%


          Advice: {record.advice}


          Treatment decisions rest with the agronomist.'
      link: dashboard
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: farm_small
      price: 120
      interval: year
      label:
        it: Fino a 30 ha monitorati
        en: Up to 30 monitored ha
      includes:
      - 30 ha
    - key: farm_medium
      price: 480
      interval: year
      label:
        it: Fino a 150 ha monitorati
        en: Up to 150 monitored ha
      includes:
      - 150 ha
    - key: farm_large
      price: 1500
      interval: year
      label:
        it: Fino a 600 ha monitorati
        en: Up to 600 monitored ha
      includes:
      - 600 ha
  egress:
    hosts:
    - api.open-meteo.com
    - archive-api.open-meteo.com
    notes: 'Open-Meteo: free reuse with attribution, CC BY 4.0 (commercial use needs their API plan at volume).'
  notifications:
    emailOnRunDone: false
  extensions:
  - key: copernicus_auth
    description: 'Copernicus Data Space / Sentinel Hub statistics APIs need OAuth client credentials: not available yet. For
      now the agent reads public data via the WebRobot MCP; a direct NDVI tool needs OAuth support.'
  - key: polygon_drawing
    description: 'Drawing plot polygons on the map is not available yet: the plot is a point (lat/lon) plus an optional GeoJSON
      boundary field; a richer GIS layer is a future step.'
  - key: hectare_pricing
    description: Per-hectare annual pricing is approximated by plans with hectare tiers; exact per-ha billing and enforcement
      of total hectares is not available.
  - key: field_sensors
    description: 'Field sensors: future integration via a webhook trigger writing readings to a collection; not included yet.'
