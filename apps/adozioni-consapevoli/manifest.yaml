apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: casagiusta
  displayName: CasaGiusta
  tagline:
    it: La casa giusta per ogni animale, l'animale giusto per ogni casa.
  description:
    it: 'CasaGiusta aiuta le associazioni animaliste a trovare adottanti davvero compatibili: l''adottante compila un questionario
      pre-affido, un agente AI lo confronta con le schede degli animali e spiega compatibilità e incompatibilità. Il volontario
      valuta la candidatura con questionario e punteggio.'
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#2f5d50'
      accent: '#e07a3f'
      background: '#fbf8f3'
      foreground: '#1f2a27'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Casa
      color: primary
    - text: Giusta
      color: accent
    button: accent
  header:
    links:
    - label:
        it: Come funziona
      href: '#come-funziona'
    - label:
        it: Per le associazioni
      href: '#associazioni'
    cta:
      label:
        it: Accedi
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin piattaforma
      assignedBy: admin_emails
    - key: association
      label:
        it: Associazione
      assignedBy: admin
    - key: adopter
      label:
        it: Adottante
      assignedBy: signup
  limits:
  - action: agent:matcher
    per: user
    max: 5
    window: day
    roles:
    - adopter
  agents:
  - key: matcher
    role: main
    description: Confronta il questionario pre-affido con le schede degli animali e propone i più compatibili.
    profile:
      inline:
        display_name: CasaGiusta matcher
        crews:
        - id: matcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un consulente per le adozioni di animali, al servizio di associazioni animaliste. Ricevi il
            questionario pre-affido di una persona e cerchi tra le schede degli animali (strumento animals_search / animals_read)
            quelli più compatibili. Usa solo animali con stato ''disponibile''. Valuta: tipo di casa e giardino, ore fuori
            casa, esperienza, composizione della famiglia (bambini, età), altri animali in casa, esigenze sanitarie dell''animale
            rispetto a tempo e capacità dell''adottante. Non inventare dati: se una scheda è incompleta dillo. Struttura del
            report: titolo di primo livello "# Animali compatibili con te — <data>". Poi ## Sintesi del tuo profilo; ## I
            più compatibili: per ogni animale (max 5) un ### con nome, specie, associazione/canile, punteggio di compatibilità
            da 0 a 100, perché è adatto, ## Attenzione: incompatibilità e punti da verificare per quell''animale; ## Animali
            scartati e perché (breve); ## Prossimi passi (inviare la candidatura dalla scheda). Se nessun animale è adatto,
            dillo con onestà. Tono caldo ma sincero: il benessere dell''animale viene prima. Non dare consigli veterinari
            come certezze.'
          mcp_servers: []
    goalTemplate: 'Questionario pre-affido dell''adottante {user}:

      Specie desiderata: {species_label}

      Tipo di casa: {home_type_label}, metratura circa {home_sqm} m²

      Giardino o balcone: {outdoor_label}

      Ore al giorno fuori casa: {hours_away}

      Esperienza con animali: {experience_label}

      Famiglia: {household}

      Bambini in casa: {children_label}

      Altri animali in casa: {?other_pets}{other_pets}{/other_pets}{!other_pets}nessuno{/other_pets}

      {?notes}Note: {notes}{/notes}

      Data di oggi: {date}. Scrivi in italiano.'
    appTools:
    - name: animals_search
      description: Cerca schede di animali in adozione
      action: search
      collection: animals
      scope: all
    - name: animals_read
      description: Legge una scheda animale
      action: read
      collection: animals
      scope: all
    output: markdown
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.5
  - key: screener
    role: helper
    description: Prepara la scheda di valutazione di una candidatura (punteggio e punti da chiarire) e chiede la decisione
      al volontario dell'associazione.
    awaits:
    - adoption_decision
    profile:
      inline:
        display_name: CasaGiusta screener
        crews:
        - id: screener
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Ricevi una candidatura di adozione: scheda dell''animale e questionario pre-affido dell''adottante.
            Scrivi una valutazione per il volontario dell''associazione: titolo "# Candidatura — <nome animale>", poi ## Punteggio
            di compatibilità (0-100 con motivazione), ## Punti di forza, ## Incompatibilità e punti da chiarire, ## Domande
            suggerite per l''adottante. Non inventare dati e non decidere tu: alla fine usa lo strumento request_adoption_decision
            una volta, indicando animale, punteggio e questionario, così il volontario approva o rifiuta. Il benessere dell''animale
            viene prima.'
    goalTemplate: 'Valuta questa candidatura. Animale: {animal}. Questionario: {questionnaire}. Messaggio dell''adottante:
      {?message}{message}{/message}{!message}nessuno{/message}. Data: {date}. Scrivi in italiano.'
    output: markdown
    limits:
      maxTurns: 6
      maxBudgetUsd: 0.3
  - key: followup
    role: helper
    description: Prepara il promemoria dei controlli post-affido per ogni adozione.
    memory: instance
    writesTo:
      collection: followup_notes
    profile:
      inline:
        display_name: CasaGiusta follow-up
        crews:
        - id: followup
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 4
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Segui un animale adottato nei mesi dopo l''affido. Dalla data di adozione calcola in che fase siamo
            (prima settimana, primo mese, 3 mesi, 6 mesi, 1 anno). Scrivi un promemoria breve per l''adottante: inizia con
            "# Controllo post-affido — <nome animale>, <fase>", poi ## Cosa osservare, ## Domande da farti, ## Quando contattare
            l''associazione o il veterinario. Meno di 200 parole. Non dare diagnosi. Se la fase non richiede un controllo,
            scrivilo in una riga. Alla fine usa remember una volta con la fase raggiunta.'
  inputForm:
    title:
      it: Questionario pre-affido
    fields:
    - name: species
      type: select
      required: true
      label:
        it: Cosa cerchi
      options:
      - value: cane
        label: Cane
      - value: gatto
        label: Gatto
      - value: altro
        label:
          it: Altro / indifferente
    - name: home_type
      type: select
      required: true
      label:
        it: Tipo di casa
      options:
      - value: appartamento
        label: Appartamento
      - value: casa_indipendente
        label: Casa indipendente
      - value: cascina
        label:
          it: Casa di campagna
    - name: home_sqm
      type: number
      required: true
      label:
        it: Metri quadri
    - name: outdoor
      type: select
      required: true
      label:
        it: Giardino o balcone
      options:
      - value: giardino_recintato
        label:
          it: Giardino recintato
      - value: giardino
        label:
          it: Giardino non recintato
      - value: balcone
        label: Balcone
      - value: nessuno
        label: Nessuno
    - name: hours_away
      type: number
      required: true
      label:
        it: Ore fuori casa al giorno
    - name: experience
      type: select
      required: true
      label:
        it: Esperienza con animali
      options:
      - value: nessuna
        label: Nessuna
      - value: alcuna
        label:
          it: Qualche esperienza
      - value: molta
        label: Molta
    - name: household
      type: text
      required: true
      label:
        it: Composizione della famiglia
      help:
        it: es. 2 adulti, 1 bambino di 6 anni
    - name: children
      type: select
      required: true
      label:
        it: Bambini in casa
      options:
      - value: 'no'
        label:
          it: 'No'
      - value: piccoli
        label:
          it: Sì, sotto i 6 anni
      - value: grandi
        label:
          it: Sì, sopra i 6 anni
    - name: other_pets
      type: text
      label:
        it: Altri animali in casa
      help:
        it: specie, razza, età, carattere
    - name: notes
      type: textarea
      maxLength: 500
      label:
        it: Note (facoltative)
  data:
    collections:
    - name: animals
      ownedBy: shared
      searchable: true
      description: Schede degli animali in adozione, inserite dalle associazioni
      fields:
      - name: name
        type: text
        required: true
        label: Nome
      - name: association
        type: text
        required: true
        label: Associazione
      - name: shelter
        type: text
        label:
          it: Canile di provenienza
      - name: species
        type: select
        required: true
        label: Specie
        options:
        - cane
        - gatto
        - altro
      - name: breed
        type: text
        label: Razza
      - name: age_years
        type: number
        label:
          it: Età (anni)
      - name: size
        type: select
        label: Taglia
        options:
        - piccola
        - media
        - grande
      - name: temperament
        type: textarea
        label:
          it: Carattere
      - name: good_with_children
        type: select
        label:
          it: Compatibile con bambini
        options:
        - si
        - 'no'
        - non_so
      - name: good_with_animals
        type: select
        label:
          it: Compatibile con altri animali
        options:
        - si
        - 'no'
        - non_so
      - name: health_needs
        type: textarea
        label:
          it: Esigenze sanitarie
      - name: photo_url
        type: url
        label:
          it: Link alla foto
      - name: status
        type: select
        label: Stato
        options:
        - disponibile
        - in_valutazione
        - adottato
        default: disponibile
    - name: applications
      ownedBy: user
      sharing:
      - editor
      description: 'Candidature degli adottanti: questionario, punteggio e domande del volontario'
      fields:
      - name: animal
        type: relation
        relation: animals
        required: true
        label: Animale
      - name: association
        type: text
        label: Associazione
      - name: questionnaire
        type: json
        label: Questionario
      - name: score
        type: number
        label: Punteggio
      - name: message
        type: textarea
        label: Messaggio
      - name: questions
        type: array
        label: Domande e risposte
        fields:
        - name: from
          type: text
        - name: text
          type: text
      - name: status
        type: select
        label: Stato
        options:
        - inviata
        - in_valutazione
        - approvata
        - rifiutata
        default: inviata
    - name: followup_notes
      ownedBy: instance
      description: Promemoria dei controlli post-affido
  approvals:
  - key: adoption_decision
    title:
      it: Decisione sulla candidatura
    description: Il volontario approva o rifiuta la candidatura dopo aver visto questionario e punteggio
    role: association
    decidedBy: role
    fields:
    - animal
    - score
    - questionnaire
    timeoutMinutes: 10080
    onTimeout: reject
  templates:
  - key: post_adoption
    title:
      it: Controlli post-affido
    description:
      it: Promemoria periodici per seguire l'animale adottato.
    agent: followup
    params:
    - name: animal_name
      type: text
      required: true
      label:
        it: Nome dell'animale
    - name: adoption_date
      type: date
      required: true
      label:
        it: Data di adozione
    goal: 'Controllo post-affido di "{instance}": {animal_name}, adottato il {adoption_date}. Oggi è {date}. Scrivi in italiano.'
    schedule:
      cron: 0 8 * * 1
      userCanChange: false
    maxPerUser: 5
    roles:
    - adopter
  views:
  - key: home
    type: page
    nav: false
    title: CasaGiusta
    sections:
    - type: hero
      title:
        it: La **casa giusta** per ogni animale.
      text:
        it: Le associazioni pubblicano gli animali in adozione. Tu compili un questionario e un agente AI ti mostra quelli
          davvero compatibili, spiegando anche cosa non va. Gratis per chi adotta.
      actions:
      - label:
          it: Trova il tuo compagno
        href: /v/new_match
        style: primary
      - label:
          it: Accedi
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
      items:
      - title:
          it: Questionario
        text:
          it: Casa, giardino, ore fuori, esperienza, famiglia e altri animali.
        badge: 📝
      - title:
          it: Compatibilità
        text:
          it: L'agente confronta il questionario con le schede e spiega punti di forza e incompatibilità.
        badge: 🐾
      - title:
          it: Candidatura
        text:
          it: Invii la candidatura; il volontario vede questionario e punteggio, può farti domande e decide.
        badge: 💌
      - title:
          it: Dopo l'affido
        text:
          it: Promemoria per i controlli post-affido.
        badge: 🏡
    - type: cards
      id: associazioni
      title:
        it: Per le associazioni
      items:
      - title:
          it: Schede complete
        text:
          it: Specie, razza, età, taglia, carattere, compatibilità, esigenze sanitarie, foto e canile.
      - title:
          it: Candidati già valutati
        text:
          it: Ogni candidatura arriva con questionario e punteggio di compatibilità.
      - title:
          it: Abbonamento piccolo
        text:
          it: 9 € al mese, nessun costo per gli adottanti.
    - type: note
      content:
        it: 'Il punteggio è un supporto alla decisione: l''ultima parola spetta sempre all''associazione.'
  - key: new_match
    type: new_run
    title:
      it: Questionario pre-affido
    roles:
    - adopter
    - admin
  - key: matches
    type: history
    title:
      it: I miei abbinamenti
    source: run
    roles:
    - adopter
    - admin
  - key: match
    type: report
    source: run
    printable: true
    nav: false
  - key: catalog
    type: cards
    title:
      it: Animali in adozione
    source: collection:animals
    roles:
    - adopter
    - association
    - admin
    data:
      display: cards
      fields:
      - key: name
        label: Nome
      - key: species
        label: Specie
        format: badge
      - key: breed
        label: Razza
      - key: age_years
        label: Età
      - key: association
        label: Associazione
      filters:
      - field: status
        op: '='
        value: disponibile
      limit: 100
      empty:
        it: Nessun animale disponibile.
  - key: my_animals
    type: table
    title:
      it: I nostri animali
    source: collection:animals
    roles:
    - association
    - admin
    data:
      display: table
      fields:
      - key: name
        label: Nome
      - key: species
        label: Specie
      - key: breed
        label: Razza
      - key: age_years
        label: Età
      - key: size
        label: Taglia
      - key: shelter
        label: Canile
      - key: status
        label: Stato
        format: badge
      limit: 200
  - key: my_applications
    type: table
    title:
      it: Le mie candidature
    source: collection:applications
    roles:
    - adopter
    data:
      display: table
      fields:
      - key: animal
        label: Animale
      - key: score
        label: Punteggio
        format: number
      - key: status
        label: Stato
        format: badge
      limit: 100
  - key: incoming
    type: table
    title:
      it: Candidature ricevute
    source: collection:applications
    roles:
    - association
    - admin
    data:
      display: table
      fields:
      - key: animal
        label: Animale
      - key: score
        label: Punteggio
        format: number
      - key: status
        label: Stato
        format: badge
      - key: message
        label: Messaggio
      sort:
        field: score
        dir: desc
      limit: 100
  - key: decisions
    type: approvals
    title:
      it: Da approvare
    approvals:
    - adoption_decision
    roles:
    - association
    - admin
  - key: watches
    type: instances
    template: post_adoption
    title:
      it: Post-affido
    roles:
    - adopter
  - key: account
    type: account
    title:
      it: Abbonamento
    roles:
    - association
  - key: admin
    type: admin
    title: Admin
    roles:
    - admin
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: association_monthly
      price: 9
      interval: month
      label:
        it: Associazione
      includes:
      - schede animali illimitate
      - candidature con questionario e punteggio
      - approvazioni
      roles:
      - association
  extensions:
  - key: email_notifications
    description: 'Le email all''adottante a ogni passaggio (candidatura ricevuta, domanda, approvata, rifiutata) e i promemoria
      post-affido via email non sono ancora disponibili: i promemoria compaiono nella vista Post-affido, e lo stato nella
      vista Le mie candidature.'
  - key: photo_upload
    description: 'Il caricamento delle foto non è disponibile: la scheda ha un link alla foto.'
  - key: per_association_isolation
    description: Le schede animali sono in una raccolta condivisa perché gli adottanti devono confrontarle tutte; la separazione
      'ogni associazione vede solo i propri animali e candidati' e l'instradamento delle candidature all'associazione giusta
      richiedono un filtro per proprietario/associazione non ancora esprimibile nel manifest. Da completare con logica dedicata.
  - key: application_submit
    description: L'invio della candidatura per un animale e lo scambio di domande col volontario richiedono un modulo su collezione,
      non ancora disponibile come vista.
