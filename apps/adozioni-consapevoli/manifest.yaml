apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: casagiusta
  displayName: CasaGiusta
  tagline:
    it: L'animale giusto per la casa giusta.
  description:
    it: Le associazioni animaliste pubblicano gli animali in adozione; chi vuole adottare compila un questionario e un agente
      propone i più compatibili, spiegando anche le incompatibilità.
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#2f5d50'
      accent: '#e07a3f'
      background: '#fbf8f3'
      foreground: '#1f2a27'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Casa
      color: primary
    - text: Giusta
      color: accent
  header:
    links:
    - label:
        it: Come funziona
      href: '#come-funziona'
    cta:
      label:
        it: Accedi
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: user
      label:
        it: Adottante
      assignedBy: signup
    - key: association
      label:
        it: Associazione
      assignedBy: invite
    - key: adopter
      label:
        it: Adottante con questionario
      assignedBy: derived
      from: collection:questionnaires.email
  limits:
  - action: agent:matcher
    per: user
    max: 5
    window: day
  - action: create:animals
    max: 5
    window: total
    roles:
    - association
    plans:
      associazione: -1
  agents:
  - key: matcher
    role: main
    description: Confronta il questionario dell'adottante con le schede degli animali disponibili.
    context:
    - key: answers
      from: collection:questionnaires
    appTools:
    - name: search_animals
      description: Cerca gli animali disponibili per l'adozione
      action: search
      collection: animals
      scope: all
    profile:
      inline:
        display_name: CasaGiusta matcher
        crews:
        - id: matcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un esperto di adozioni responsabili di animali. Leggi il questionario pre-affido dell''adottante
            e, con lo strumento search_animals, le schede degli animali disponibili (status available). Proponi i 3-5 animali
            più compatibili. Il report inizia con il titolo di primo livello "# Gli animali più adatti a te". Per ogni animale:
            ## nome (specie, razza, età, taglia, associazione), punteggio di compatibilità da 0 a 100, perché è adatto, ##
            Incompatibilità e attenzioni (casa, giardino, ore fuori casa, bambini, altri animali, esigenze sanitarie), come
            candidarsi. Segnala sempre onestamente le incompatibilità, anche gravi. Non inventare dati che non sono nelle
            schede o nel questionario. Se il questionario manca, chiedi di compilarlo. Scrivi in italiano.'
    goalTemplate: 'Questionario pre-affido dell''adottante:

      {answers}

      {?notes}Desideri particolari: {notes}{/notes}

      Data: {date}. Proponi gli animali più compatibili, in italiano.'
    output: markdown
  - key: scorer
    role: helper
    description: Calcola il punteggio di compatibilità di una candidatura.
    appTools:
    - name: read_animal
      description: Legge le schede degli animali
      action: read
      collection: animals
      scope: all
    - name: read_questionnaire
      description: Legge il questionario dell'adottante
      action: read
      collection: questionnaires
      scope: user
    - name: update_application
      description: Aggiorna la candidatura con punteggio e stato
      action: write
      collection: applications
      scope: user
    profile:
      inline:
        display_name: CasaGiusta scorer
        crews:
        - id: scorer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Valuti una candidatura di adozione. Con read_animal trova la scheda dell''animale indicato in animal_ref,
            con read_questionnaire leggi il questionario dell''adottante. Poi chiama update_application sulla candidatura
            (id nell''evento) impostando: score (0-100), score_summary (3-5 righe sui punti di forza), incompatibilities (elenco
            onesto delle incompatibilità, o ''nessuna rilevata''), animal_name, association_email (copiato dalla scheda dell''animale)
            e per ultimo status = in_review. Non inventare dati; se qualcosa manca, dillo nel riassunto. Scrivi in italiano.'
    goalTemplate: 'Nuova candidatura. Evento: {event}

      Animale scelto: {record.animal_ref}. Calcola il punteggio e aggiorna la candidatura. Data: {date}.'
    output: markdown
  inputForm:
    title:
      it: Trova il tuo compagno
    fields:
    - name: notes
      type: textarea
      maxLength: 400
      label:
        it: Desideri particolari (facoltativo)
      help:
        it: es. cerco un cane tranquillo, adatto a un appartamento
  data:
    collections:
    - name: animals
      ownedBy: user
      description: Animali in adozione, inseriti dall'associazione
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome
      - name: species
        type: select
        required: true
        label:
          it: Specie
        options:
        - value: cane
          label: Cane
        - value: gatto
          label: Gatto
        - value: altro
          label: Altro
      - name: breed
        type: text
        label:
          it: Razza
      - name: age_years
        type: number
        label:
          it: Età (anni)
      - name: size
        type: select
        label:
          it: Taglia
        options:
        - value: piccola
          label: Piccola
        - value: media
          label: Media
        - value: grande
          label: Grande
      - name: temperament
        type: textarea
        label:
          it: Carattere
      - name: kids_ok
        type: select
        label:
          it: Compatibile con bambini
        options:
        - value: si
          label: Sì
        - value: 'no'
          label: 'No'
        - value: non_noto
          label: Non noto
      - name: animals_ok
        type: select
        label:
          it: Compatibile con altri animali
        options:
        - value: si
          label: Sì
        - value: 'no'
          label: 'No'
        - value: non_noto
          label: Non noto
      - name: health_needs
        type: textarea
        label:
          it: Esigenze sanitarie
      - name: photo
        type: file
        accept:
        - jpg
        - jpeg
        - png
        - webp
        maxMb: 8
        label:
          it: Foto
      - name: shelter
        type: text
        label:
          it: Canile di provenienza
      - name: association_name
        type: text
        label:
          it: Associazione
      - name: association_email
        type: email
        required: true
        label:
          it: Email di contatto dell'associazione
      - name: status
        type: select
        required: true
        default: available
        label:
          it: Stato
        options:
        - value: available
          label: Disponibile
        - value: reserved
          label: Prenotato
        - value: adopted
          label: Adottato
      access:
      - role: adopter
        where:
          status: available
        can:
        - read
    - name: questionnaires
      ownedBy: user
      description: Questionario pre-affido dell'adottante
      retentionDays: 1095
      fields:
      - name: email
        type: email
        required: true
        label:
          it: La tua email
      - name: home_type
        type: select
        required: true
        label:
          it: Tipo di casa
        options:
        - value: appartamento
          label: Appartamento
        - value: casa
          label: Casa indipendente
        - value: campagna
          label: Casa in campagna
      - name: garden
        type: select
        required: true
        label:
          it: Giardino
        options:
        - value: 'no'
          label: 'No'
        - value: piccolo
          label: Piccolo
        - value: grande
          label: Grande
      - name: hours_away
        type: number
        required: true
        label:
          it: Ore fuori casa al giorno
      - name: experience
        type: select
        required: true
        label:
          it: Esperienza con gli animali
        options:
        - value: nessuna
          label: Nessuna
        - value: poca
          label: Poca
        - value: molta
          label: Molta
      - name: household
        type: textarea
        required: true
        label:
          it: Composizione della famiglia (età dei bambini inclusa)
      - name: other_animals
        type: textarea
        label:
          it: Altri animali in casa
      - name: notes
        type: textarea
        label:
          it: Altro che vuoi dirci
    - name: applications
      ownedBy: user
      description: Candidature di adozione
      retentionDays: 1095
      fields:
      - name: animal_ref
        type: select
        required: true
        optionsFrom: collection:animals
        label:
          it: Animale
      - name: message
        type: textarea
        label:
          it: Messaggio per l'associazione
      - name: animal_name
        type: text
        label:
          it: Nome animale
      - name: association_email
        type: email
        label:
          it: Associazione
      - name: status
        type: select
        default: submitted
        label:
          it: Stato
        options:
        - value: submitted
          label: Inviata
        - value: in_review
          label: In valutazione
        - value: question
          label: Domanda del volontario
        - value: approved
          label: Approvata
        - value: rejected
          label: Rifiutata
      - name: score
        type: number
        label:
          it: Punteggio
      - name: score_summary
        type: textarea
        label:
          it: Sintesi compatibilità
      - name: incompatibilities
        type: textarea
        label:
          it: Incompatibilità
      - name: volunteer_question
        type: textarea
        label:
          it: Domanda del volontario
      - name: adopter_answer
        type: textarea
        label:
          it: Risposta dell'adottante
      - name: volunteer_notes
        type: textarea
        label:
          it: Note del volontario
      - name: followup_1
        type: date
        label:
          it: Primo controllo post-affido
      - name: followup_2
        type: date
        label:
          it: Secondo controllo post-affido
      access:
      - role: association
        where:
          association_email: '{user.email}'
        can:
        - read
        - write
  views:
  - key: home
    type: page
    nav: false
    sections:
    - type: hero
      eyebrow:
        it: Adozioni responsabili
      title:
        it: L'animale giusto per la **casa giusta**
      text:
        it: Compila il questionario, scopri gli animali più compatibili con la tua vita e candidati. Gratis per chi adotta.
      actions:
      - label:
          it: Inizia
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
      items:
      - title:
          it: Questionario
        text:
          it: Racconti casa, famiglia e abitudini.
        badge: 📝
      - title:
          it: Compatibilità
        text:
          it: Un agente propone gli animali più adatti, segnalando anche le incompatibilità.
        badge: 🐾
      - title:
          it: Candidatura
        text:
          it: Il volontario dell'associazione valuta, ti fa domande e decide. Ricevi un'email a ogni passaggio.
        badge: ✉️
      - title:
          it: Dopo l'adozione
        text:
          it: Promemoria per i controlli post-affido.
        badge: 🏡
    - type: note
      content:
        it: 'Il punteggio è un supporto: la decisione finale spetta sempre all''associazione.'
  - key: questionnaire
    type: form
    collection: questionnaires
    title:
      it: Questionario pre-affido
    edit: true
    submit:
      label:
        it: Salva questionario
      message:
        it: Questionario salvato.
      redirect: new_match
    roles:
    - user
    - admin
  - key: new_match
    type: new_run
    title:
      it: Trova il compagno giusto
    roles:
    - user
    - admin
  - key: matches
    type: history
    title:
      it: Le mie proposte
    source: run
    roles:
    - user
    - admin
  - key: match
    type: report
    source: run
    printable: true
    nav: false
  - key: browse
    type: cards
    title:
      it: Animali disponibili
    source: collection:animals
    data:
      display: cards
      fields:
      - key: name
        label:
          it: Nome
      - key: species
        label:
          it: Specie
        format: badge
      - key: breed
        label:
          it: Razza
      - key: age_years
        label:
          it: Età
      - key: size
        label:
          it: Taglia
      - key: association_name
        label:
          it: Associazione
      filters:
      - field: status
        op: '='
        value: available
    roles:
    - user
    - admin
  - key: apply
    type: form
    collection: applications
    fields:
    - animal_ref
    - message
    title:
      it: Candidati per un animale
    submit:
      label:
        it: Invia candidatura
      message:
        it: Candidatura inviata. Riceverai un'email a ogni passaggio.
      redirect: my_applications
    roles:
    - user
    - admin
  - key: my_applications
    type: table
    title:
      it: Le mie candidature
    source: collection:applications
    columns:
    - animal_name
    - status
    - score
    - volunteer_question
    - adopter_answer
    roles:
    - user
    - admin
  - key: answer
    type: form
    collection: applications
    fields:
    - adopter_answer
    edit: true
    nav: false
    submit:
      label:
        it: Invia risposta
      redirect: my_applications
    roles:
    - user
    - admin
  - key: animal_new
    type: form
    collection: animals
    title:
      it: Nuovo animale in adozione
    edit: true
    submit:
      label:
        it: Pubblica scheda
      message:
        it: Scheda salvata.
      redirect: my_animals
    roles:
    - association
    - admin
  - key: my_animals
    type: table
    title:
      it: I miei animali
    source: collection:animals
    columns:
    - name
    - species
    - breed
    - age_years
    - size
    - status
    export: true
    roles:
    - association
    - admin
  - key: candidates
    type: table
    title:
      it: Candidature ricevute
    source: collection:applications
    columns:
    - animal_name
    - status
    - score
    - score_summary
    - incompatibilities
    - volunteer_question
    - adopter_answer
    export: true
    roles:
    - association
    - admin
  - key: decide
    type: form
    collection: applications
    fields:
    - status
    - volunteer_question
    - volunteer_notes
    - followup_1
    - followup_2
    edit: true
    nav: false
    title:
      it: Valuta candidatura
    submit:
      label:
        it: Salva
      redirect: candidates
    roles:
    - association
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
    roles:
    - association
  triggers:
  - key: score_new
    'on':
      collection: applications
      op: insert
      where:
        status: submitted
    start:
      agent: scorer
    goal: 'Nuova candidatura {record.animal_ref}. Evento: {event}'
    asUser: true
  - key: app_in_review
    'on':
      collection: applications
      op: update
      where:
        status: in_review
    notify:
      to:
      - owner
      - record.association_email
      subject:
        it: 'Candidatura per {record.animal_name}: ricevuta'
      body:
        it: La candidatura per {record.animal_name} è stata ricevuta e valutata (punteggio {record.score}). Il volontario
          dell'associazione la esaminerà a breve.
      link: my_applications
  - key: app_question
    'on':
      collection: applications
      op: update
      where:
        status: question
    notify:
      to: owner
      subject:
        it: Una domanda sulla tua candidatura per {record.animal_name}
      body:
        it: 'Il volontario ti ha fatto una domanda: {record.volunteer_question}. Rispondi dall''app.'
      link: my_applications
  - key: app_approved
    'on':
      collection: applications
      op: update
      where:
        status: approved
    notify:
      to: owner
      subject:
        it: Candidatura approvata per {record.animal_name}!
      body:
        it: 'Buone notizie: la tua candidatura per {record.animal_name} è stata approvata. L''associazione ti contatterà per
          l''affido.'
      link: my_applications
  - key: app_rejected
    'on':
      collection: applications
      op: update
      where:
        status: rejected
    notify:
      to: owner
      subject:
        it: Esito della candidatura per {record.animal_name}
      body:
        it: Purtroppo la candidatura per {record.animal_name} non è stata accolta. Puoi guardare altri animali compatibili
          nell'app.
      link: new_match
  - key: followup_1
    'on':
      date:
        collection: applications
        field: followup_1
        offsetDays: 0
        hour: 8
      where:
        status: approved
    notify:
      to:
      - owner
      - record.association_email
      subject:
        it: 'Controllo post-affido: {record.animal_name}'
      body:
        it: Oggi è previsto il primo controllo post-affido per {record.animal_name}. Contatta l'associazione per un aggiornamento.
  - key: followup_2
    'on':
      date:
        collection: applications
        field: followup_2
        offsetDays: 0
        hour: 8
      where:
        status: approved
    notify:
      to:
      - owner
      - record.association_email
      subject:
        it: 'Secondo controllo post-affido: {record.animal_name}'
      body:
        it: Oggi è previsto il secondo controllo post-affido per {record.animal_name}.
  notifications:
    emailOnRunDone: true
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: associazione
      price: 9
      interval: month
      label:
        it: Associazione
      includes:
      - animali illimitati
      - gestione candidature
      - promemoria post-affido
      roles:
      - association
