apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: conciergedesk
  displayName: ConciergeDesk
  tagline:
    it: Il receptionist virtuale per hotel indipendenti, in 5 lingue.
    en: The virtual receptionist for independent hotels, in 5 languages.
  description:
    it: Un agente risponde agli ospiti in chat e al telefono, prepara preventivi con le tariffe dell'hotel, passa le richieste
      fuori standard al receptionist e registra le prenotazioni con caparra.
    en: An agent answers guests by chat and phone, prepares quotes with the hotel's own rates, routes non-standard requests
      to the human receptionist and records bookings with a deposit.
  langs:
  - it
  - en
  - de
  - fr
  - es
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#1f3a4d'
      accent: '#b8863b'
      background: '#faf8f4'
      foreground: '#1c2329'
    fonts:
      body: Inter
      display: Playfair Display
    wordmark:
    - text: Concierge
      color: primary
    - text: Desk
      color: accent
    buttonShape: rounded
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Chiedi al concierge
        en: Ask the concierge
      href: '#chat'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
      - ask
      agents:
      - faq
    roles:
    - key: admin
      label:
        it: Direttore
        en: Manager
      assignedBy: admin_emails
    - key: receptionist
      label:
        it: Receptionist
        en: Receptionist
      assignedBy: invite
    - key: user
      label:
        it: Ospite
        en: Guest
      assignedBy: signup
  limits:
  - action: chat
    per: ip
    max: 40
    window: hour
    roles:
    - anonymous
  - action: agent:concierge
    per: user
    max: 30
    window: day
    roles:
    - user
  agents:
  - key: faq
    role: helper
    description: 'Public multilingual assistant: answers FAQ, policies, rooms and indicative rates. Read-only.'
    profile:
      inline:
        display_name: ConciergeDesk FAQ
        chat_mode: true
        crews:
        - id: faq
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the virtual receptionist of an independent hotel. Always answer in the language the guest
            writes in (Italian, English, German, French or Spanish), warmly and briefly. Use ONLY the hotel''s data you read
            with your tools (hotel profile, FAQ, policies, room types, rates, extras): parking, pets, breakfast hours, check-in/out,
            cancellation. If the data does not contain the answer, say so and suggest contacting the front desk; never invent
            facts, prices or availability. You may quote indicative nightly rates from the rates table, but a binding quote
            with availability is only made by signed-in guests in the ''concierge'' chat: invite the guest to sign in for
            that. Do not take bookings or personal data here.'
    goalTemplate: 'Today is {date}. Reply in the guest''s language (default ISO {lang}).

      Conversation so far:

      {history}

      New message: {message}'
    appTools:
    - name: read_hotel
      description: 'Hotel profile: name, address, check-in/out times, description'
      action: read
      collection: hotel_profile
      scope: all
    - name: read_faqs
      description: FAQ entries (parking, pets, breakfast...)
      action: read
      collection: faqs
      scope: all
    - name: read_policies
      description: Cancellation and deposit policies
      action: read
      collection: policies
      scope: all
    - name: read_rooms
      description: Room types
      action: read
      collection: room_types
      scope: all
    - name: read_rates
      description: Seasonal nightly rates per room type
      action: read
      collection: rates
      scope: all
    - name: read_extras
      description: Extra services and prices
      action: read
      collection: extras
      scope: all
    output: markdown
  - key: concierge
    role: main
    description: 'Signed-in guest assistant: checks availability, computes quotes with the hotel''s rates, escalates non-standard
      requests to the receptionist, registers accepted offers.'
    awaits:
    - staff_review
    context:
    - key: email
      from: user.email
    profile:
      inline:
        display_name: ConciergeDesk concierge
        chat_mode: true
        crews:
        - id: concierge
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 14
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the virtual receptionist of an independent hotel, for a signed-in guest. Answer in the guest''s
            language (Italian, English, German, French or Spanish). Use only data from your tools; never invent prices, availability
            or policies.

            QUOTE FLOW: collect check-in and check-out dates, number of guests, number of rooms, room type and special requests.
            Check read_availability for each night of the stay and the room type; if unavailable, propose alternatives. Read
            read_rates and read_extras, then ALWAYS compute the price with the tool compute_price (args: check_in, check_out,
            rooms, rates = the matching rate rows [{from,to,price}] for that room type, extras_total, deposit_pct from the
            policies). Never do the arithmetic yourself. Save the quote with save_quote (status offered, reference Q-<yyyymmdd>-<3
            random digits>, guest_email from context) and present the offer: nights, total, deposit, cancellation policy.

            NON-STANDARD requests (groups of more than 4 rooms, discounts, late check-out, anything not covered by the tariff
            or policies): save the quote with status pending_staff and the request in special_requests, then call request_staff_review
            and tell the guest a human receptionist will reply shortly; do not promise anything. If the receptionist answers
            with an edit, present that version.

            ACCEPTANCE: when the guest accepts, set the quote status to accepted with update_quote and tell them the deposit
            is paid by card at the link in the confirmation email; the booking is registered once the deposit is paid.

            Be concise, polite and clear.'
    goalTemplate: 'Today is {date}. Guest account: {email}. Reply in the guest''s language (default ISO {lang}).

      Conversation so far:

      {history}

      New message: {message}'
    appTools:
    - name: read_hotel
      description: 'Hotel profile: name, address, check-in/out times, description'
      action: read
      collection: hotel_profile
      scope: all
    - name: read_faqs
      description: FAQ entries (parking, pets, breakfast...)
      action: read
      collection: faqs
      scope: all
    - name: read_policies
      description: Cancellation and deposit policies
      action: read
      collection: policies
      scope: all
    - name: read_rooms
      description: Room types
      action: read
      collection: room_types
      scope: all
    - name: read_rates
      description: Seasonal nightly rates per room type
      action: read
      collection: rates
      scope: all
    - name: read_extras
      description: Extra services and prices
      action: read
      collection: extras
      scope: all
    - name: read_availability
      description: Rooms left per room type and date, synced from the channel manager
      action: read
      collection: availability
      scope: all
    - name: compute_price
      description: Compute nights, total and deposit from the rate rows
      action: call
      slot: quote_price
    - name: save_quote
      description: Create a quote for this guest
      action: append
      collection: quotes
      scope: user
    - name: update_quote
      description: Update a quote of this guest
      action: write
      collection: quotes
      scope: user
    output: markdown
  slots:
  - key: quote_price
    description: Total and deposit from seasonal rate rows
    timeoutMs: 2000
    example:
      args:
        check_in: '2026-12-20'
        check_out: '2026-12-23'
        rooms: 1
        rates:
        - from: '2026-12-01'
          to: '2026-12-31'
          price: 140
        extras_total: 20
        deposit_pct: 30
    code: "from datetime import date, timedelta\n\ndef main(input):\n    a = input.get('args') or {}\n    try:\n        ci\
      \ = date.fromisoformat(a['check_in'])\n        co = date.fromisoformat(a['check_out'])\n    except Exception:\n    \
      \    return {'error': 'invalid dates'}\n    if co <= ci:\n        return {'error': 'check_out must be after check_in'}\n\
      \    rates = a.get('rates') or []\n    total = 0.0\n    d = ci\n    while d < co:\n        iso = d.isoformat()\n   \
      \     price = None\n        for r in rates:\n            if str(r.get('from')) <= iso <= str(r.get('to')):\n       \
      \         price = float(r.get('price'))\n                break\n        if price is None:\n            return {'error':\
      \ 'no rate for ' + iso}\n        total += price\n        d += timedelta(days=1)\n    rooms = int(a.get('rooms') or 1)\n\
      \    total = total * rooms + float(a.get('extras_total') or 0)\n    pct = float(a.get('deposit_pct') or 30)\n    return\
      \ {'nights': (co - ci).days, 'total': round(total, 2), 'deposit': round(total * pct / 100, 2)}\n"
  data:
    collections:
    - name: hotel_profile
      ownedBy: shared
      description: Property details filled by the manager
      fields:
      - name: name
        type: text
        required: true
      - name: address
        type: text
      - name: checkin_from
        type: text
      - name: checkout_until
        type: text
      - name: description
        type: textarea
    - name: room_types
      ownedBy: shared
      fields:
      - name: name
        type: text
        required: true
      - name: description
        type: textarea
      - name: max_guests
        type: number
      - name: rooms_total
        type: number
    - name: rates
      ownedBy: shared
      description: Seasonal nightly rates
      fields:
      - name: room_type
        type: select
        optionsFrom: collection:room_types
        required: true
      - name: season
        type: text
      - name: from
        type: date
        required: true
      - name: to
        type: date
        required: true
      - name: price
        type: number
        required: true
    - name: extras
      ownedBy: shared
      fields:
      - name: name
        type: text
        required: true
      - name: price
        type: number
      - name: unit
        type: select
        options:
        - per_stay
        - per_night
        - per_person
    - name: policies
      ownedBy: shared
      fields:
      - name: topic
        type: text
        required: true
      - name: text
        type: textarea
      - name: deposit_pct
        type: number
    - name: faqs
      ownedBy: shared
      fields:
      - name: topic
        type: text
        required: true
      - name: answer
        type: textarea
        required: true
    - name: availability
      ownedBy: shared
      description: Rooms left per type and date, from the channel manager webhook or by hand
      fields:
      - name: slot_key
        type: text
      - name: room_type
        type: text
        required: true
      - name: date
        type: date
        required: true
      - name: rooms_left
        type: number
        required: true
    - name: quotes
      ownedBy: user
      retentionDays: 730
      description: Quotes of each guest
      access:
      - role: receptionist
        can:
        - read
        - write
      fields:
      - name: reference
        type: text
      - name: guest_name
        type: text
      - name: guest_email
        type: email
      - name: lang
        type: text
      - name: check_in
        type: date
      - name: check_out
        type: date
      - name: guests
        type: number
      - name: rooms
        type: number
      - name: room_type
        type: text
      - name: extras
        type: text
      - name: special_requests
        type: textarea
      - name: total
        type: number
      - name: deposit
        type: number
      - name: status
        type: select
        default: draft
        options:
        - draft
        - pending_staff
        - offered
        - accepted
        - paid
        - declined
      - name: staff_note
        type: textarea
    - name: bookings
      ownedBy: user
      retentionDays: 1095
      description: Confirmed bookings; each guest sees only their own
      access:
      - role: receptionist
        can:
        - read
        - write
      fields:
      - name: reference
        type: text
      - name: guest_name
        type: text
      - name: guest_email
        type: email
      - name: lang
        type: text
      - name: room_type
        type: text
      - name: check_in
        type: date
      - name: check_out
        type: date
      - name: guests
        type: number
      - name: total
        type: number
      - name: deposit
        type: number
      - name: status
        type: select
        default: confirmed
        options:
        - confirmed
        - cancelled
        - checked_in
        - completed
  approvals:
  - key: staff_review
    title:
      it: Richiesta fuori standard
      en: Non-standard request
    description: Group, discount or late check-out requests that the receptionist approves or edits before the guest gets
      an answer.
    role: receptionist
    decidedBy: role
    fields:
    - reference
    - check_in
    - check_out
    - guests
    - special_requests
    timeoutMinutes: 1440
    onTimeout: reject
  triggers:
  - key: staff_new_request
    'on':
      collection: quotes
      op: insert
      where:
        status: pending_staff
    notify:
      to:
      - role:receptionist
      - admins
      subject:
        it: Nuova richiesta da approvare {record.reference}
        en: New request to review {record.reference}
      body:
        it: Un ospite ha fatto una richiesta fuori standard. Apri la coda approvazioni.
        en: A guest made a non-standard request. Open the approvals queue.
      link: approvals
  - key: staff_decided
    'on':
      approval: staff_review
      decision: any
    notify:
      to: owner
      subject:
        it: Risposta alla tua richiesta
        en: Reply to your request
        de: Antwort auf Ihre Anfrage
        fr: Réponse à votre demande
        es: Respuesta a su solicitud
      body:
        it: Il receptionist ha esaminato la tua richiesta. Riapri la chat per vedere la risposta.
        en: The receptionist reviewed your request. Reopen the chat to see the reply.
        de: Die Rezeption hat Ihre Anfrage geprüft. Öffnen Sie den Chat für die Antwort.
        fr: La réception a examiné votre demande. Rouvrez le chat pour voir la réponse.
        es: Recepción ha revisado su solicitud. Vuelva a abrir el chat para ver la respuesta.
      link: concierge
  - key: quote_offered
    'on':
      collection: quotes
      op: update
      where:
        status: offered
    notify:
      to:
      - record.guest_email
      subject:
        it: La tua offerta {record.reference}
        en: Your offer {record.reference}
        de: Ihr Angebot {record.reference}
        fr: Votre offre {record.reference}
        es: Su oferta {record.reference}
      body:
        it: 'La tua offerta è pronta: totale {record.total} EUR, caparra {record.deposit} EUR. Accettala nella chat.'
        en: 'Your offer is ready: total {record.total} EUR, deposit {record.deposit} EUR. Accept it in the chat.'
        de: 'Ihr Angebot ist bereit: Gesamt {record.total} EUR, Anzahlung {record.deposit} EUR. Im Chat annehmen.'
        fr: 'Votre offre est prête : total {record.total} EUR, acompte {record.deposit} EUR. Acceptez-la dans le chat.'
        es: 'Su oferta está lista: total {record.total} EUR, depósito {record.deposit} EUR. Acéptela en el chat.'
      link: concierge
  - key: quote_paid_to_booking
    description: When the deposit is paid the quote becomes a booking
    'on':
      collection: quotes
      op: update
      where:
        status: paid
    write:
      collection: bookings
      fields:
        reference: reference
        guest_name: guest_name
        guest_email: guest_email
        lang: lang
        room_type: room_type
        check_in: check_in
        check_out: check_out
        guests: guests
        total: total
        deposit: deposit
      keyBy: reference
  - key: booking_confirmation
    'on':
      collection: bookings
      op: insert
    notify:
      to:
      - record.guest_email
      subject:
        it: Prenotazione confermata {record.reference}
        en: Booking confirmed {record.reference}
        de: Buchung bestätigt {record.reference}
        fr: Réservation confirmée {record.reference}
        es: Reserva confirmada {record.reference}
      body:
        it: Grazie! Soggiorno dal {record.check_in} al {record.check_out}, caparra {record.deposit} EUR ricevuta.
        en: Thank you! Stay from {record.check_in} to {record.check_out}, deposit {record.deposit} EUR received.
        de: Danke! Aufenthalt vom {record.check_in} bis {record.check_out}, Anzahlung {record.deposit} EUR erhalten.
        fr: Merci ! Séjour du {record.check_in} au {record.check_out}, acompte {record.deposit} EUR reçu.
        es: ¡Gracias! Estancia del {record.check_in} al {record.check_out}, depósito {record.deposit} EUR recibido.
      link: bookings
  - key: booking_reminder
    'on':
      date:
        collection: bookings
        field: check_in
        offsetDays: -1
        hour: 8
    notify:
      to:
      - record.guest_email
      subject:
        it: Ti aspettiamo domani
        en: See you tomorrow
        de: Bis morgen
        fr: À demain
        es: Hasta mañana
      body:
        it: 'Promemoria: domani check-in, prenotazione {record.reference}.'
        en: 'Reminder: check-in tomorrow, booking {record.reference}.'
        de: 'Erinnerung: morgen Check-in, Buchung {record.reference}.'
        fr: 'Rappel : check-in demain, réservation {record.reference}.'
        es: 'Recordatorio: check-in mañana, reserva {record.reference}.'
      link: bookings
  - key: cm_availability
    description: Channel manager pushes availability here
    'on':
      webhook: true
    write:
      collection: availability
      fields:
        slot_key: key
        room_type: room_type
        date: date
        rooms_left: rooms_left
      keyBy: slot_key
  channels:
  - key: web
    type: web
    agent: faq
  - key: phone
    type: phone
    agent: faq
    greeting:
      it: Buongiorno, sono il receptionist virtuale dell'hotel. Come posso aiutarla?
      en: Hello, I am the hotel's virtual receptionist. How can I help you?
  views:
  - key: home
    type: page
    nav: false
    title: ConciergeDesk
    sections:
    - type: hero
      band: true
      title:
        it: Il tuo **receptionist virtuale**, sempre in servizio.
        en: Your **virtual receptionist**, always on duty.
      text:
        it: Risponde agli ospiti nella loro lingua, prepara preventivi con le tue tariffe e passa al receptionist ciò che
          richiede una persona.
        en: Answers guests in their language, prepares quotes with your rates and hands over to your receptionist whatever
          needs a human.
      actions:
      - label:
          it: Chiedi al concierge
          en: Ask the concierge
        href: '#chat'
        style: primary
      - label:
          it: Prenota / Accedi
          en: Book / Sign in
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Chiedi
          en: Ask
        text:
          it: 'Orari colazione, parcheggio, animali, tariffe: risposta immediata in IT, EN, DE, FR, ES.'
          en: 'Breakfast hours, parking, pets, rates: instant answers in IT, EN, DE, FR, ES.'
      - title:
          it: Preventivo
          en: Quote
        text:
          it: 'Accedi, indica date, ospiti e camera: ricevi l''offerta con prezzo e caparra.'
          en: 'Sign in, give dates, guests and room: get an offer with price and deposit.'
      - title:
          it: Conferma
          en: Confirm
        text:
          it: Paghi la caparra con carta, ricevi conferma e promemoria via email.
          en: Pay the deposit by card, get confirmation and a reminder by email.
    - type: view
      id: chat
      view: ask
    - type: note
      content:
        it: Le richieste speciali (gruppi, sconti, late check-out) sono verificate dal receptionist prima della risposta.
        en: Special requests (groups, discounts, late check-out) are reviewed by the receptionist before we reply.
  - key: ask
    type: chat
    title:
      it: Chiedi al concierge
      en: Ask the concierge
    source: agent:faq
    placeholder:
      it: Scrivi nella tua lingua…
      en: Write in your language…
    examples:
    - it: Fino a che ora è servita la colazione?
      en: Until what time is breakfast served?
    - it: Accettate animali?
      en: Do you accept pets?
    - it: C'è un parcheggio?
      en: Is there parking?
  - key: concierge
    type: chat
    title:
      it: Preventivo e prenotazione
      en: Quote and booking
    source: agent:concierge
    roles:
    - user
    - admin
    - receptionist
    placeholder:
      it: Date, ospiti, tipo di camera…
      en: Dates, guests, room type…
    examples:
    - it: Vorrei un preventivo per 2 adulti dal 20 al 23 dicembre
      en: I would like a quote for 2 adults from 20 to 23 December
    - it: Possiamo fare il late check-out?
      en: Can we have a late check-out?
  - key: bookings
    type: table
    title:
      it: Prenotazioni
      en: Bookings
    source: collection:bookings
    columns:
    - reference
    - guest_name
    - room_type
    - check_in
    - check_out
    - total
    - deposit
    - status
    roles:
    - user
    - admin
    - receptionist
    export: true
  - key: my_quotes
    type: table
    title:
      it: Preventivi
      en: Quotes
    source: collection:quotes
    columns:
    - reference
    - check_in
    - check_out
    - room_type
    - total
    - deposit
    - status
    roles:
    - user
    - admin
    - receptionist
  - key: approvals
    type: approvals
    title:
      it: Coda receptionist
      en: Receptionist queue
    approvals:
    - staff_review
    roles:
    - receptionist
    - admin
  - key: dashboard
    type: page
    title:
      it: Cruscotto
      en: Dashboard
    roles:
    - receptionist
    - admin
    sections:
    - type: data
      title:
        it: Preventivi aperti
        en: Open quotes
      source: collection:quotes
      display: kpi
      filters:
      - field: status
        op: '='
        value: offered
      kpis:
      - label:
          it: Offerte in attesa
          en: Pending offers
        agg: count
    - type: data
      title:
        it: 'Conversione: preventivi per stato'
        en: 'Conversion: quotes by status'
      source: collection:quotes
      display: chart
      chart: bar
      groupBy:
        field: status
        aggs: []
      fields:
      - key: status
      - key: count
    - type: data
      title:
        it: Prenotazioni per data di arrivo
        en: Bookings by arrival date
      source: collection:bookings
      display: table
      fields:
      - key: reference
      - key: guest_name
      - key: room_type
      - key: check_in
        format: date
      - key: check_out
        format: date
      - key: status
        format: badge
      sort:
        field: check_in
        dir: asc
      limit: 30
    - type: data
      title:
        it: Totale prenotazioni
        en: Total bookings
      source: collection:bookings
      display: kpi
      kpis:
      - label:
          it: Prenotazioni
          en: Bookings
        agg: count
      - label:
          it: Incasso totale
          en: Total value
        agg: sum
        field: total
        format: money
    - type: view
      title:
        it: Conversazioni
        en: Conversations
      view: conversations
  - key: conversations
    type: history
    title:
      it: Conversazioni
      en: Conversations
    source: run
    roles:
    - admin
    - receptionist
    nav: false
  - key: admin
    type: admin
    title:
      it: Configurazione
      en: Setup
    roles:
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - admin
  billing:
    modes:
    - subscription
    - per_transaction
    currency: eur
    transactionFeePct: 2.5
    plans:
    - key: property_monthly
      price: 99
      interval: month
      label:
        it: Per struttura / mese
        en: Per property / month
      includes:
      - Chat + telefono 5 lingue
      - Preventivi e coda receptionist
      - Commissione 2,5% sulle prenotazioni dirette
      roles:
      - admin
  extensions:
  - key: channel_manager_sync
    description: Live availability check and booking sync with the hotel's channel manager need a vendor-specific API (host
      and credentials). For now availability is read from the availability collection, which the channel manager can fill
      through the cm_availability webhook or the admins by CSV; pushing confirmed bookings back to the channel manager is
      not available yet.
  - key: whatsapp
    description: WhatsApp conversations are not available yet. The phone channel (voice) is declared on the FAQ agent; a phone
      caller who wants a quote is invited to sign in or continue on the website chat.
  - key: deposit_checkout
    description: 'Card payment of a per-quote deposit amount (dynamic Stripe Connect checkout) is not expressible yet: the
      quote moves to status ''paid'' (which creates the booking) when the payment is confirmed; this status change must be
      driven by the payment confirmation. The 2.5% direct-booking commission is declared as transactionFeePct.'
  - key: conversion_rate
    description: The dashboard shows quotes by status and booking counts; a computed conversion-rate percentage and a 'today's
      arrivals' filter on the current date are not available as aggregates yet.
