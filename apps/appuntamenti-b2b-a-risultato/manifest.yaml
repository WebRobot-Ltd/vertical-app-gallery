apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: incontrocerto
  displayName: IncontroCerto
  tagline:
    it: 'Appuntamenti B2B qualificati: paghi solo quelli fissati.'
    en: 'Qualified B2B meetings: you only pay for the ones booked.'
  description:
    it: 'Definisci il tuo cliente ideale e i segnali di acquisto: gli agenti AI li cercano ogni giorno su notizie, comunicati
      e pagine lavora con noi, trovano il decisore, scrivono la sequenza email, classificano le risposte e fissano l''appuntamento.'
    en: 'Define your ideal customer and buying signals: AI agents scan news, press releases and careers pages daily, find
      the decision maker, write the email sequence, classify replies and book the meeting.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: pipeline
  branding:
    theme: light
    palette:
      primary: '#12304a'
      accent: '#e07a1f'
      background: '#f7f8fa'
      foreground: '#16202b'
    fonts:
      body: Inter
      display: Manrope
    wordmark:
    - text: Incontro
      color: primary
    - text: Certo
      color: accent
    width: wide
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Prezzi
        en: Pricing
      href: '#prezzi'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  limits:
  - action: run
    per: user
    max: 30
    window: day
    roles:
    - user
  agents:
  - key: scout
    role: scheduled
    description: Cerca ogni giorno i segnali di acquisto e trova il decisore giusto.
    memory: instance
    mcpServers:
    - name: webrobot
      url: https://mcp-full.webrobot.eu/mcp
      allow: all
    appTools:
    - name: save_prospect
      description: Save a qualified prospect with its buying signal
      action: write
      collection: prospects
      scope: user
    - name: list_prospects
      description: List the prospects already saved, to avoid duplicates
      action: read
      collection: prospects
      scope: user
    profile:
      inline:
        display_name: IncontroCerto scout
        crews:
        - id: scout
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You are a B2B sales-signal scout. Given an ideal customer profile (sector, company size, area, decision-maker
            role, buying signals), use the WebRobot MCP to scrape ONLY public news sites, press releases and the ''careers
            / lavora con noi'' and ''news'' pages of company websites. NEVER scrape social networks (LinkedIn, Facebook, X,
            Instagram) or anything whose terms forbid extraction. Look for the requested signals from the last days (new funding,
            new office opening, hiring in a given department). For each company that matches the profile: first call list_prospects
            to skip those already saved; find the most likely decision maker (name, role) and a business email ONLY if published
            on the company''s own public pages or press releases - never guess or invent emails or names; leave the field
            empty if not found. Then call save_prospect with: company, website, signal_type, signal_summary, source_url, contact_name,
            contact_role, contact_email, status=''new''. Your memory holds the companies seen: call remember at the end with
            them. End with a short markdown summary starting with ''# Segnali del giorno'' listing what you saved. Never invent
            signals or sources.'
    output: markdown
  - key: writer
    role: helper
    description: Scrive la sequenza di email personalizzata e la sottopone all'approvazione del cliente.
    awaits:
    - sequence_ok
    appTools:
    - name: save_sequence
      description: Save the drafted email sequence
      action: write
      collection: sequences
      scope: user
    - name: read_prospect
      description: Read the prospects of the customer
      action: read
      collection: prospects
      scope: user
    profile:
      inline:
        display_name: IncontroCerto writer
        crews:
        - id: writer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write short, personalised B2B cold email sequences (3 emails: first contact, follow-up after
            3 days, last follow-up after 7 days) in the language of the prospect''s country (Italian for Italian companies,
            otherwise English). Each email: under 110 words, references the concrete buying signal and its source, one clear
            low-friction ask (a 20-minute call), no hype, no false claims, no invented facts about the prospect or the sender,
            include an easy opt-out line. Save the sequence with save_sequence (prospect_company, contact_email, subject_1,
            body_1, subject_2, body_2, subject_3, body_3, status=''pending_approval''), then call request_sequence_ok so the
            customer can approve it. End with a markdown report starting with ''# Sequenza per <company>''.'
    goalTemplate: Write the sequence for the prospect saved by the scout.
    output: markdown
  - key: replier
    role: helper
    description: Legge e classifica le risposte, propone orari dal calendario e fissa l'appuntamento, salvandolo nel CRM.
    appTools:
    - name: read_sequences
      description: Read the customer's sequences
      action: read
      collection: sequences
      scope: user
    - name: update_reply
      description: Save the classification on the reply record
      action: write
      collection: replies
      scope: user
    - name: save_appointment
      description: Save a confirmed appointment
      action: write
      collection: appointments
      scope: user
    - name: cal_slots
      description: 'Free slots of the seller''s calendar (Cal.com). Query: startTime, endTime (ISO), eventTypeId, timeZone'
      action: http
      http:
        method: GET
        url: https://api.cal.com/v2/slots
        headers:
          cal-api-version: '2024-09-04'
        attribution: Cal.com API
        credential:
          provider: calcom
    - name: cal_book
      description: 'Book a slot on the seller''s calendar (Cal.com). JSON body: start, eventTypeId, attendee{name,email,timeZone}'
      action: http
      http:
        method: POST
        url: https://api.cal.com/v2/bookings
        headers:
          cal-api-version: '2024-08-13'
        attribution: Cal.com API
        credential:
          provider: calcom
    - name: crm_create_contact
      description: 'Create the contact in the seller''s HubSpot CRM. JSON body: properties{email,firstname,lastname,company,jobtitle}'
      action: http
      http:
        method: POST
        url: https://api.hubapi.com/crm/v3/objects/contacts
        attribution: HubSpot API
        credential:
          provider: hubspot
    profile:
      inline:
        display_name: IncontroCerto replier
        crews:
        - id: replier
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 14
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You handle replies to B2B outreach. 1) Classify the reply: interested, not_now, no (also unsubscribe
            requests = no). Save it with update_reply (classification, summary, status=''processed''). 2) If not_now or no,
            stop; never contact someone who opted out. 3) If interested: call cal_slots for the next 7 working days and write
            a reply proposing 3 slots (text saved in update_reply as proposed_reply). If the reply already accepts a specific
            slot that is free, book it with cal_book, create the contact with crm_create_contact, and save the appointment
            with save_appointment (status=''confirmed'', start, contact data). If a tool says the calendar or CRM is not connected,
            say so in the report and do not invent bookings. Never invent availability. End with a markdown report starting
            with ''# Risposta da <company>''.'
    goalTemplate: 'Process the reply received from {record.contact_email} ({record.company}): {record.body}'
    output: markdown
  templates:
  - key: icp_watch
    title:
      it: Cliente ideale e segnali
      en: Ideal customer and signals
    description:
      it: Ogni giorno cerca aziende con i segnali di acquisto scelti.
      en: Every day finds companies showing your chosen buying signals.
    agent: scout
    params:
    - name: sector
      type: text
      required: true
      label:
        it: Settore
        en: Sector
    - name: size
      type: select
      required: true
      label:
        it: Dimensione
        en: Size
      options:
      - value: 1-10
        label: 1-10
      - value: 11-50
        label: 11-50
      - value: 51-250
        label: 51-250
      - value: 250+
        label: 250+
    - name: area
      type: text
      required: true
      label:
        it: Area geografica
        en: Area
    - name: role
      type: text
      required: true
      label:
        it: Ruolo del decisore
        en: Decision-maker role
    - name: signals
      type: multiselect
      required: true
      label:
        it: Segnali di acquisto
        en: Buying signals
      options:
      - value: funding
        label:
          it: Nuovo finanziamento
          en: New funding
      - value: new_office
        label:
          it: Apertura sede
          en: New office
      - value: hiring
        label:
          it: Assunzioni in un reparto
          en: Hiring in a department
    - name: department
      type: text
      label:
        it: Reparto per le assunzioni
        en: Hiring department
    goal: 'Ideal customer "{instance}": sector {sector}, size {size}, area {area}, decision maker {role}. Signals: {signals}.
      {?department}Hiring department: {department}.{/department} Today is {date}. Find new matching companies and save them.
      Write in the language with ISO code {lang}.'
    schedule:
      cron: 0 6 * * *
      userCanChange: true
    maxPerUser: 5
    cost:
      perRun: 10
  approvals:
  - key: sequence_ok
    title:
      it: Approva la sequenza email
      en: Approve the email sequence
    decidedBy: requester
    fields:
    - prospect_company
    - subject_1
    - body_1
    - subject_2
    - body_2
    - subject_3
    - body_3
  triggers:
  - key: prospect_found
    'on':
      collection: prospects
      op: insert
    start:
      agent: writer
    goal: 'Write the email sequence for the prospect {record.company} (signal: {record.signal_type} - {record.signal_summary},
      source {record.source_url}), contact {record.contact_name} {record.contact_role} {record.contact_email}.'
  - key: sequence_approved
    'on':
      approval: sequence_ok
      decision: approved
    notify:
      to: owner
      subject:
        it: Sequenza approvata
        en: Sequence approved
      body:
        it: Hai approvato la sequenza. Trovi lo stato in IncontroCerto.
        en: You approved the sequence. See its status in IncontroCerto.
      link: pipeline
  - key: reply_in
    'on':
      webhook: true
    write:
      collection: replies
      fields:
        contact_email: from
        company: company
        subject: subject
        body: body
        status: status
      keyBy: message_id
  - key: reply_received
    'on':
      collection: replies
      op: insert
      where:
        status: new
    start:
      agent: replier
    goal: 'Process the reply from {record.contact_email} ({record.company}): {record.body}'
  - key: meeting_fee
    'on':
      collection: appointments
      op: insert
      where:
        status: confirmed
    charge:
      credits: 150
      reason: confirmed appointment
  - key: meeting_reminder
    'on':
      date:
        collection: appointments
        field: start
        offsetDays: -1
        hour: 8
    notify:
      to: owner
      subject:
        it: Appuntamento domani con {record.company}
        en: Meeting tomorrow with {record.company}
      body:
        it: Domani hai un appuntamento con {record.contact_name} ({record.company}).
        en: Tomorrow you meet {record.contact_name} ({record.company}).
      link: appointments
  inputForm:
    title:
      it: Nuovo
      en: New
    fields: []
  data:
    collections:
    - name: prospects
      ownedBy: user
      description: Companies with a buying signal and their decision maker
      fields:
      - name: company
        type: text
        required: true
      - name: website
        type: url
      - name: signal_type
        type: text
      - name: signal_summary
        type: textarea
      - name: source_url
        type: url
      - name: contact_name
        type: text
      - name: contact_role
        type: text
      - name: contact_email
        type: email
      - name: status
        type: select
        options:
        - new
        - sequence_pending
        - contacted
        - interested
        - not_now
        - 'no'
        - booked
      retentionDays: 365
    - name: sequences
      ownedBy: user
      fields:
      - name: prospect_company
        type: text
      - name: contact_email
        type: email
      - name: subject_1
        type: text
      - name: body_1
        type: textarea
      - name: subject_2
        type: text
      - name: body_2
        type: textarea
      - name: subject_3
        type: text
      - name: body_3
        type: textarea
      - name: status
        type: select
        options:
        - pending_approval
        - approved
        - sent
      retentionDays: 365
    - name: replies
      ownedBy: user
      description: Inbound replies, classified. The webhook payload carries status 'new'; the replier sets 'processed'.
      fields:
      - name: contact_email
        type: email
      - name: company
        type: text
      - name: subject
        type: text
      - name: body
        type: textarea
      - name: status
        type: select
        options:
        - new
        - processed
      - name: classification
        type: select
        options:
        - interested
        - not_now
        - 'no'
      - name: summary
        type: textarea
      - name: proposed_reply
        type: textarea
      retentionDays: 180
    - name: appointments
      ownedBy: user
      fields:
      - name: company
        type: text
      - name: contact_name
        type: text
      - name: contact_email
        type: email
      - name: start
        type: date
      - name: status
        type: select
        options:
        - confirmed
        - cancelled
        - done
      - name: crm_id
        type: text
      retentionDays: 730
    credentials:
    - provider: calcom
      kind: api_key
      scope: user
      label: Cal.com
      help:
        it: Cal.com > Impostazioni > Chiavi API.
        en: Cal.com > Settings > API keys.
    - provider: hubspot
      kind: api_key
      scope: user
      label: HubSpot
      help:
        it: 'HubSpot > Impostazioni > Integrazioni > Private apps: copia il token.'
        en: 'HubSpot > Settings > Integrations > Private apps: copy the token.'
  egress:
    hosts:
    - api.cal.com
    - api.hubapi.com
    notes: The customer's own Cal.com and HubSpot accounts, via their API keys.
  views:
  - key: home
    type: page
    nav: false
    title: IncontroCerto
    sections:
    - type: hero
      title:
        it: Appuntamenti B2B **qualificati**. Paghi solo quelli fissati.
        en: '**Qualified** B2B meetings. Pay only for the ones booked.'
      text:
        it: 'Descrivi il cliente ideale e i segnali di acquisto: gli agenti AI trovano il contatto giusto, scrivono la sequenza,
          leggono le risposte e fissano l''appuntamento.'
        en: 'Describe your ideal customer and buying signals: AI agents find the right contact, write the sequence, read replies
          and book the meeting.'
      actions:
      - label:
          it: Inizia
          en: Start
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Definisci il target
          en: Define the target
        text:
          it: Settore, dimensione, area, ruolo e segnali di acquisto.
          en: Sector, size, area, role and buying signals.
      - title:
          it: Ogni giorno nuovi segnali
          en: New signals daily
        text:
          it: Notizie, comunicati e pagine «lavora con noi». Nessun social.
          en: News, press releases and careers pages. No social networks.
      - title:
          it: Approvi la sequenza
          en: You approve the sequence
        text:
          it: Controlli la prima sequenza email personalizzata.
          en: You review the first personalised email sequence.
      - title:
          it: Appuntamento in agenda
          en: Meeting booked
        text:
          it: Le risposte interessate diventano appuntamenti nel tuo calendario e CRM.
          en: Interested replies become meetings in your calendar and CRM.
    - type: cards
      id: prezzi
      title:
        it: Prezzi
        en: Pricing
      items:
      - title:
          it: Paghi a risultato
          en: Pay per result
        text:
          it: Un addebito automatico per ogni appuntamento confermato.
          en: One automatic charge for each confirmed meeting.
    - type: note
      content:
        it: 'Rispetta le norme su email commerciali e privacy (GDPR): ogni messaggio include la possibilità di opporsi.'
        en: 'Comply with commercial email and privacy rules (GDPR): every message includes an opt-out.'
  - key: icps
    type: instances
    template: icp_watch
    title:
      it: Cliente ideale
      en: Ideal customer
    roles:
    - user
    - admin
  - key: pipeline
    type: table
    title:
      it: Pipeline
      en: Pipeline
    source: collection:prospects
    columns:
    - company
    - signal_type
    - contact_name
    - contact_role
    - status
    export: true
    roles:
    - user
    - admin
  - key: sequences_view
    type: cards
    title:
      it: Sequenze
      en: Sequences
    source: collection:sequences
    roles:
    - user
    - admin
  - key: approvals_view
    type: approvals
    title:
      it: Da approvare
      en: To approve
    approvals:
    - sequence_ok
    roles:
    - user
    - admin
  - key: conversations
    type: table
    title:
      it: Conversazioni
      en: Conversations
    source: collection:replies
    columns:
    - company
    - contact_email
    - classification
    - summary
    roles:
    - user
    - admin
  - key: appointments
    type: table
    title:
      it: Appuntamenti
      en: Appointments
    source: collection:appointments
    columns:
    - company
    - contact_name
    - start
    - status
    export: true
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Account e crediti
      en: Account and credits
    roles:
    - user
  billing:
    modes:
    - credits
    signupCredits: 200
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:writer:
        estimate: 10
        metered: true
      agent:replier:
        estimate: 10
        metered: true
    packs:
    - key: start
      credits: 1500
      price: 15
      label: Start
    - key: growth
      credits: 8000
      price: 70
      label: Growth
  notifications:
    emailOnRunDone: false
  extensions:
  - key: mailbox_send
    description: Sending the approved sequence from the customer's connected mailbox (Gmail/Microsoft 365 via OAuth) is not
      available yet. Sequences are approved in the app; sending must be done manually or by an external tool.
  - key: mailbox_read
    description: Reading replies from the connected mailbox is not available yet (OAuth). Replies enter via the webhook /api/hooks/reply_in
      (e.g. from an inbound email forwarding service); the payload must include status 'new'.
  - key: oauth_calendar
    description: 'Google/Outlook calendar via OAuth is not available yet: the seller''s calendar is read and booked through
      a Cal.com API key.'
