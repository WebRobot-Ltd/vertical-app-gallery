apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: avventure-aperto
  displayName: Avventure all'Aperto
  tagline: Escursioni, kayak, arrampicata e cicloturismo con guide verificate.
  description: 'Marketplace di esperienze outdoor: le guide pubblicano, i clienti prenotano e pagano, la piattaforma trattiene
    una commissione.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f4d3a'
      accent: '#e07a2f'
      background: '#f6f4ee'
      foreground: '#1b2420'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Avventure
      color: primary
    - text: all'Aperto
      color: accent
  header:
    links:
    - label: Come funziona
      href: '#come-funziona'
    - label: Per le guide
      href: '#guide'
    cta:
      label: Esplora
      href: /v/experiences
  auth:
    method: magic_link
    anonymous:
      views:
      - home
      - experiences
      - map
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
    - key: guide
      label: Guida
      assignedBy: invite
  egress:
    hosts:
    - api.open-meteo.com
    notes: 'Open-Meteo: previsioni meteo gratuite, licenza CC BY 4.0, uso non commerciale/commerciale con attribuzione.'
  agents:
  - key: desk
    role: helper
    description: 'Completa ogni nuova prenotazione: guida, importo, scadenza di conferma, codice voucher.'
    profile:
      inline:
        display_name: Prenotazioni - desk
        crews:
        - id: desk
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei il desk prenotazioni di Avventure all''Aperto. Per la prenotazione ricevuta: leggi l''esperienza
            con read_experience, poi con update_booking imposta guide_email (dall''esperienza), experience_title, amount (prezzo
            x partecipanti), deadline_date (oggi + 2 giorni, YYYY-MM-DD), voucher_code (codice casuale di 10 caratteri maiuscoli)
            e status ''awaiting_guide''. Non inventare dati: se l''esperienza non esiste imposta status ''rejected''. Rispondi
            con un breve riepilogo che inizia con ''# Prenotazione elaborata''.'
    goalTemplate: Elabora la prenotazione {message}. Oggi è {date}.
    appTools:
    - name: read_experience
      description: Legge le esperienze del catalogo
      action: search
      collection: experiences
      scope: all
    - name: update_booking
      description: Aggiorna la prenotazione dell'utente
      action: write
      collection: bookings
      scope: user
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.2
  - key: rescuer
    role: helper
    description: Se la guida non conferma in 48 ore, rifiuta o il gruppo minimo non è raggiunto, propone un'alternativa o
      il rimborso.
    profile:
      inline:
        display_name: Prenotazioni - alternative
        crews:
        - id: rescuer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: Aiuti un cliente la cui prenotazione non può essere confermata (guida senza risposta in 48 ore, rifiuto
            o gruppo minimo non raggiunto). Leggi la prenotazione con read_booking. Se lo status NON è 'awaiting_guide' né
            'declined', non fare nulla e rispondi 'Nessuna azione'. Cerca con search_experiences e search_departures un'esperienza
            simile (stessa attività, stessa zona, difficoltà e prezzo comparabili) con date future. Se esiste, imposta con
            update_booking status 'alternative_proposed' e scrivi una proposta chiara. Se non esiste, imposta status 'refund_requested'
            (l'admin esegue il rimborso) e spiega che sarà rimborsato per intero. Il report inizia con '# Proposta per la
            tua prenotazione', massimo 150 parole, in italiano, senza inventare disponibilità.
    goalTemplate: Gestisci la prenotazione non confermata {message}.
    appTools:
    - name: read_booking
      description: Legge le prenotazioni dell'utente
      action: read
      collection: bookings
      scope: user
    - name: update_booking
      description: Aggiorna la prenotazione dell'utente
      action: write
      collection: bookings
      scope: user
    - name: search_experiences
      description: Cerca esperienze nel catalogo
      action: search
      collection: experiences
      scope: all
    - name: search_departures
      description: Cerca date disponibili
      action: search
      collection: departures
      scope: all
    writesTo:
      collection: proposals
      parse: whole
    output: markdown
    limits:
      maxTurns: 10
      maxBudgetUsd: 0.3
  - key: reminder
    role: helper
    description: Promemoria del giorno prima con le previsioni meteo.
    profile:
      inline:
        display_name: Promemoria con meteo
        crews:
        - id: reminder
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.15
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Scrivi il promemoria per un''esperienza outdoor che si svolge domani. Leggi la prenotazione e l''esperienza
            (luogo con lat/lon, attrezzatura). Se lo status della prenotazione non è ''confirmed'', rispondi ''Nessuna azione''.
            Chiama weather con query ''latitude=<lat>&longitude=<lon>&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max&timezone=Europe%2FRome&forecast_days=3''
            e usa il giorno dell''esperienza. Il testo inizia con ''# Promemoria: <titolo>'' e riporta ora e luogo di ritrovo,
            meteo (temperature, probabilità di pioggia, vento), attrezzatura da portare e il codice voucher. Non inventare
            dati meteo; se mancano dì che non sono disponibili. Fonte: Open-Meteo (CC BY 4.0). Max 150 parole, in italiano.'
    goalTemplate: Prepara il promemoria per la prenotazione {message}.
    appTools:
    - name: read_booking
      description: Legge le prenotazioni dell'utente
      action: read
      collection: bookings
      scope: user
    - name: search_experiences
      description: Cerca esperienze nel catalogo
      action: search
      collection: experiences
      scope: all
    - name: weather
      description: Previsioni meteo Open-Meteo
      action: http
      http:
        method: GET
        url: https://api.open-meteo.com/v1/forecast
        attribution: Open-Meteo.com, CC BY 4.0
    writesTo:
      collection: reminders
      parse: whole
    output: markdown
    limits:
      maxTurns: 6
      maxBudgetUsd: 0.15
  data:
    collections:
    - name: guide_applications
      ownedBy: org
      description: Candidature delle guide con tesserino (l'admin verifica e invita)
      fields:
      - name: full_name
        label: Nome e cognome
        type: text
        required: true
      - name: phone
        label: Telefono
        type: text
      - name: activities
        label: Attività
        type: multiselect
        options:
        - Escursioni
        - Kayak
        - Arrampicata
        - Cicloturismo
      - name: license
        label: Tesserino professionale
        type: file
        accept:
        - pdf
        - jpg
        - png
        maxMb: 10
        required: true
      - name: bio
        label: Presentazione
        type: textarea
    - name: guides
      ownedBy: shared
      description: Profili delle guide verificate (gestiti dall'admin); venditori con conto Stripe Connect
      fields:
      - name: email
        type: email
        required: true
      - name: name
        type: text
        required: true
      - name: bio
        type: textarea
      - name: license_verified
        type: boolean
    - name: experiences
      ownedBy: shared
      description: Catalogo delle esperienze pubblicate dalle guide
      fields:
      - name: guide_email
        label: Email guida
        type: email
        required: true
      - name: title
        label: Titolo
        type: text
        required: true
      - name: description
        label: Descrizione
        type: textarea
        required: true
      - name: activity
        label: Attività
        type: select
        required: true
        options:
        - value: hiking
          label: Escursione
        - value: kayak
          label: Kayak
        - value: climbing
          label: Arrampicata
        - value: cycling
          label: Cicloturismo
      - name: area
        label: Zona
        type: text
        required: true
      - name: meeting_point
        label: Luogo di ritrovo
        type: text
        required: true
      - name: lat
        label: Latitudine
        type: number
      - name: lon
        label: Longitudine
        type: number
      - name: duration_hours
        label: Durata (ore)
        type: number
        required: true
      - name: difficulty
        label: Difficoltà
        type: select
        options:
        - facile
        - media
        - difficile
      - name: min_participants
        label: Minimo partecipanti
        type: number
        required: true
      - name: max_participants
        label: Massimo partecipanti
        type: number
        required: true
      - name: equipment
        label: Attrezzatura
        type: textarea
      - name: price
        label: Prezzo a persona (EUR)
        type: number
        required: true
      - name: instructions
        label: Istruzioni per i clienti
        type: textarea
    - name: departures
      ownedBy: shared
      description: Date disponibili inserite dalle guide
      fields:
      - name: experience
        label: Esperienza
        type: select
        optionsFrom: collection:experiences
        required: true
      - name: guide_email
        type: email
        required: true
      - name: date
        label: Data
        type: date
        required: true
      - name: start_time
        label: Ora
        type: text
      - name: seats_left
        label: Posti
        type: number
    - name: bookings
      ownedBy: user
      description: Prenotazioni dei clienti; la guida vede solo le sue
      fields:
      - name: experience
        label: Esperienza
        type: select
        optionsFrom: collection:experiences
        required: true
      - name: date
        label: Data
        type: date
        required: true
      - name: participants
        label: Partecipanti
        type: number
        required: true
      - name: notes
        label: Note
        type: textarea
      - name: customer_email
        label: La tua email
        type: email
        required: true
      - name: guide_email
        type: email
      - name: experience_title
        type: text
      - name: amount
        type: number
      - name: deadline_date
        type: date
      - name: voucher_code
        type: text
      - name: status
        type: select
        default: new
        options:
        - new
        - awaiting_guide
        - confirmed
        - declined
        - alternative_proposed
        - refund_requested
        - completed
        - rejected
      access:
      - role: guide
        where:
          guide_email: '{user.email}'
        can:
        - read
        - write
    - name: gift_vouchers
      ownedBy: user
      description: Voucher regalo acquistati
      fields:
      - name: amount
        label: Importo (EUR)
        type: number
        required: true
      - name: recipient_name
        label: Destinatario
        type: text
      - name: recipient_email
        label: Email destinatario
        type: email
        required: true
      - name: message
        label: Messaggio
        type: textarea
      - name: code
        type: text
    - name: reviews
      ownedBy: user
      description: Recensioni dopo l'esperienza
      retentionDays: 1095
      fields:
      - name: booking_code
        label: Codice voucher
        type: text
        required: true
      - name: guide_email
        type: email
      - name: rating
        label: Voto (1-5)
        type: number
        required: true
      - name: comment
        label: Commento
        type: textarea
      access:
      - role: guide
        where:
          guide_email: '{user.email}'
        can:
        - read
    - name: proposals
      ownedBy: user
      description: Alternative o rimborsi proposti dall'agente
      fields:
      - name: title
        type: text
      - name: body
        type: textarea
    - name: reminders
      ownedBy: user
      description: Promemoria con meteo
      retentionDays: 90
      fields:
      - name: title
        type: text
      - name: body
        type: textarea
  inputForm:
    title: Prenota
    fields:
    - name: message
      type: text
      label: Prenotazione
  views:
  - key: home
    type: page
    nav: false
    title: Avventure all'Aperto
    sections:
    - type: hero
      title: Vivi la natura con **guide professioniste**
      text: 'Escursioni, kayak, arrampicata e cicloturismo: cerca per zona, data e attività, prenota e paga online.'
      actions:
      - label: Cerca esperienze
        href: /v/experiences
        style: primary
      - label: Accedi
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title: Come funziona
      items:
      - title: Cerca
        text: Filtra per zona, data e tipo di attività.
      - title: Prenota e paga
        text: La guida conferma entro 48 ore, altrimenti ti proponiamo un'alternativa o ti rimborsiamo.
      - title: Vivi l'esperienza
        text: Voucher con codice QR, istruzioni e promemoria con il meteo il giorno prima.
    - type: cards
      id: guide
      title: Sei una guida?
      items:
      - title: Candidati
        text: 'Carica il tesserino: dopo la verifica collega Stripe e pubblica le tue esperienze.'
        badge: 🧭
      - title: Ricevi i pagamenti
        text: Dopo l'esperienza ricevi il pagamento, al netto della commissione della piattaforma.
        badge: 💶
    - type: data
      source: collection:experiences
      display: cards
      title: Esperienze in evidenza
      fields:
      - key: title
      - key: area
      - key: activity
        format: badge
      - key: price
        format: money
      limit: 6
    - type: note
      content: 'Le attività outdoor comportano rischi: segui sempre le indicazioni della guida.'
  - key: experiences
    type: table
    title: Esperienze
    source: collection:experiences
    columns:
    - title
    - activity
    - area
    - difficulty
    - duration_hours
    - price
    export: false
  - key: departures_list
    type: table
    title: Date disponibili
    source: collection:departures
    columns:
    - experience
    - date
    - start_time
    - seats_left
  - key: map
    type: map
    title: Mappa
    source: collection:experiences
    map:
      lat: lat
      lon: lon
      title: title
      popup:
      - area
      - activity
      - price
  - key: book
    type: form
    title: Prenota
    collection: bookings
    fields:
    - experience
    - date
    - participants
    - customer_email
    - notes
    submit:
      label: Prenota e paga
      message: 'Richiesta inviata: la guida conferma entro 48 ore.'
      redirect: my_bookings
    roles:
    - user
    - admin
  - key: my_bookings
    type: table
    title: Le mie prenotazioni
    source: collection:bookings
    columns:
    - experience_title
    - date
    - participants
    - amount
    - status
    - voucher_code
    roles:
    - user
    - admin
  - key: proposals_list
    type: list
    title: Proposte
    source: collection:proposals
    roles:
    - user
  - key: reminders_list
    type: list
    title: Promemoria
    source: collection:reminders
    roles:
    - user
  - key: gift
    type: form
    title: Regala un voucher
    collection: gift_vouchers
    submit:
      label: Acquista
      message: Voucher regalo registrato.
    roles:
    - user
    - admin
  - key: review
    type: form
    title: Lascia una recensione
    collection: reviews
    nav: false
    submit:
      label: Invia
      message: Grazie!
    roles:
    - user
  - key: guide_apply
    type: form
    title: Candidati come guida
    collection: guide_applications
    submit:
      label: Invia candidatura
      message: Ti contatteremo dopo la verifica del tesserino.
    roles:
    - user
  - key: new_experience
    type: form
    title: Pubblica esperienza
    collection: experiences
    roles:
    - guide
    submit:
      label: Pubblica
      message: Esperienza pubblicata.
      redirect: experiences
  - key: add_departure
    type: form
    title: Aggiungi data
    collection: departures
    roles:
    - guide
    submit:
      label: Aggiungi
      message: Data aggiunta.
  - key: guide_bookings
    type: table
    title: Prenotazioni ricevute
    source: collection:bookings
    columns:
    - experience_title
    - date
    - participants
    - amount
    - status
    roles:
    - guide
    - admin
  - key: guide_confirm
    type: form
    title: Conferma o rifiuta
    collection: bookings
    fields:
    - status
    edit: true
    nav: false
    submit:
      label: Salva
      message: Aggiornato.
    roles:
    - guide
    - admin
  - key: guide_reviews
    type: table
    title: Recensioni
    source: collection:reviews
    columns:
    - rating
    - comment
    roles:
    - guide
    - admin
  - key: admin
    type: tabs
    title: Admin
    children:
    - admin_data
    roles:
    - admin
  - key: admin_data
    type: admin
    title: Dati
    roles:
    - admin
    nav: false
  triggers:
  - key: new_booking
    description: Completa la prenotazione appena creata
    'on':
      collection: bookings
      op: insert
      where:
        status: new
    start:
      agent: desk
    goal: 'Prenotazione {record.id}: esperienza {record.experience}, data {record.date}, partecipanti {record.participants}.'
  - key: notify_guide
    'on':
      collection: bookings
      op: update
      where:
        status: awaiting_guide
    notify:
      to:
      - record.guide_email
      subject: 'Nuova prenotazione: {record.experience_title}'
      body: Hai una nuova prenotazione per il {record.date} ({record.participants} partecipanti). Confermala entro 48 ore,
        altrimenti verrà proposta un'alternativa al cliente.
      link: guide_bookings
  - key: unconfirmed
    'on':
      date:
        collection: bookings
        field: deadline_date
        offsetDays: 0
        hour: 8
    start:
      agent: rescuer
    goal: Scadenza conferma per la prenotazione {record.id} ({record.experience_title}, {record.date}, stato attuale {record.status}).
      Agisci solo se lo stato è awaiting_guide.
  - key: declined
    'on':
      collection: bookings
      op: update
      where:
        status: declined
    start:
      agent: rescuer
    goal: La guida ha rifiutato o annullato (gruppo minimo non raggiunto) la prenotazione {record.id} ({record.experience_title},
      {record.date}).
  - key: proposal_ready
    'on':
      collection: proposals
      op: insert
    notify:
      to:
      - owner
      - admins
      subject: Aggiornamento sulla tua prenotazione
      body: 'La tua prenotazione non può essere confermata: abbiamo preparato una proposta (alternativa o rimborso).'
      link: proposals_list
  - key: confirmed
    'on':
      collection: bookings
      op: update
      where:
        status: confirmed
    notify:
      to:
      - record.customer_email
      subject: 'Prenotazione confermata: {record.experience_title}'
      body: 'La guida ha confermato per il {record.date}. Il tuo voucher: {record.voucher_code}. Mostra il codice QR dal voucher
        il giorno dell''esperienza.'
      link: my_bookings
  - key: day_before
    'on':
      date:
        collection: bookings
        field: date
        offsetDays: -1
        hour: 7
    start:
      agent: reminder
    goal: 'Promemoria per la prenotazione {record.id}: {record.experience_title} il {record.date}, voucher {record.voucher_code},
      stato {record.status}. Procedi solo se lo stato è confirmed.'
  - key: reminder_mail
    'on':
      collection: reminders
      op: insert
    notify:
      to:
      - owner
      subject: 'Domani la tua esperienza: promemoria e meteo'
      body: '{record.body}'
      link: reminders_list
  - key: review_request
    'on':
      date:
        collection: bookings
        field: date
        offsetDays: 1
        hour: 9
    notify:
      to:
      - record.customer_email
      subject: Com'è andata {record.experience_title}?
      body: 'Grazie per aver vissuto l''esperienza con noi. Lascia una recensione: ci aiuta molto. Codice voucher da indicare:
        {record.voucher_code}.'
      link: review
  billing:
    modes:
    - per_transaction
    currency: eur
    transactionFeePct: 12
    sellers: collection:guides
  notifications:
    emailOnRunDone: false
  extensions:
  - key: guide_calendar_sync
    description: 'Le date arrivano da un calendario della guida (Google/Microsoft): non disponibile (OAuth). Per ora la guida
      inserisce le date nella vista ''Aggiungi data''.'
  - key: stripe_onboarding_and_payout
    description: 'Onboarding Stripe Connect della guida, checkout al momento della prenotazione, incasso/pagamento dopo l''esperienza
      (ritenuta fino al giorno dopo) e rimborsi: da collegare nella configurazione dei pagamenti; i rimborsi vengono eseguiti
      dall''admin sullo stato refund_requested.'
  - key: voucher_qr
    description: 'Generazione dell''immagine QR del voucher e dei voucher regalo con codice univoco e riscatto: oggi il voucher
      mostra il codice testuale.'
  - key: search_filters
    description: Filtri interattivi per zona, data e attività sulla ricerca; oggi tabella e mappa con elenco date disponibili.
  - key: group_minimum
    description: 'Controllo automatico del gruppo minimo sommando le prenotazioni di più clienti: oggi la guida annulla (''declined'')
      se il minimo non è raggiunto e l''agente propone l''alternativa.'
  - key: date_trigger_status_filter
    description: 'I trigger a data non filtrano per stato: promemoria, scadenza e richiesta di recensione partono per ogni
      prenotazione con quella data; l''agente controlla lo stato, mentre l''email di recensione non è filtrata per stato ''confirmed''.'
