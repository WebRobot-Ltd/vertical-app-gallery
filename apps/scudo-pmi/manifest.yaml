apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: scudopmi
  displayName: ScudoPMI
  tagline:
    it: La sicurezza informatica della tua PMI, senza un reparto IT.
  description:
    it: Controlli passivi e leciti ogni settimana su domini, email e servizi esposti, un punteggio di rischio con le azioni
      in ordine di priorità, formazione mensile per i dipendenti e alert immediati.
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: dashboard
  branding:
    theme: light
    palette:
      primary: '#12304a'
      accent: '#e08a1e'
      background: '#f6f8fa'
      foreground: '#16212b'
    fonts:
      body: Inter
      display: Sora
    wordmark:
    - text: Scudo
      color: primary
    - text: PMI
      color: accent
    width: wide
  header:
    links:
    - label:
        it: Come funziona
      href: '#come-funziona'
    - label:
        it: Controlli
      href: '#controlli'
    - label:
        it: Formazione
      href: '#formazione'
    cta:
      label:
        it: Accedi
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: user
      label:
        it: Titolare
      assignedBy: signup
    - key: employee
      label:
        it: Dipendente
      assignedBy: derived
      from: collection:employees.email
  limits:
  - action: create:employees
    max: 10
    window: total
    plans:
      small: 50
      medium: 250
  agents:
  - key: scanner
    role: scheduled
    description: Esegue i controlli passivi settimanali su domini, email e servizi dichiarati.
    profile:
      inline:
        display_name: ScudoPMI scanner
        crews:
        - id: scanner
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 60
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'Sei il tecnico di sorveglianza di ScudoPMI. Esegui SOLO controlli passivi e leciti sui domini e
            sulle email indicati dal titolare. VIETATO: scansioni di porte, tentativi di login, exploit, fuzzing, qualsiasi
            test attivo. Con il MCP webrobot puoi fare al massimo UNA richiesta GET alla homepage pubblica di ciascun dominio
            per leggere intestazioni e banner (Server, X-Powered-By, generator).


            Per ogni dominio:

            1. Certificati SSL/TLS: usa crt_certs (q=<dominio>&output=json) per i certificati registrati nei log pubblici;
            riporta la data di scadenza più vicina del certificato in uso e segnala se scade entro 30 giorni (critico se entro
            7 o già scaduto).

            2. DNS e posta: con dns_lookup (name, type) leggi NS, MX, TXT, CAA. SPF: presente? termina con -all o ~all? meno
            di 10 lookup? DMARC: TXT su _dmarc.<dominio>, policy p=none/quarantine/reject e rua. DKIM: prova i selettori comuni
            (google, selector1, selector2, default, k1, s1) su <selettore>._domainkey.<dominio>. Se non trovi un selettore
            dì ''non verificabile'', non ''assente''.

            3. Banner e servizi: confronta le versioni software dei banner e dei servizi dichiarati dal titolare con il database
            CVE tramite nvd_cves (keywordSearch=<prodotto versione>, cvssV3Severity=CRITICAL o HIGH). Riporta solo CVE che
            si applicano davvero alla versione; se la versione non è certa dillo.

            4. Data breach: per ogni email dipendente (leggila con read_employees) usa hibp_breaches con path ''/<email codificata>''
            e query ''truncateResponse=false''. Una richiesta alla volta, con pazienza. Riporta solo nome del breach, data
            e tipo di dati esposti; mai password.


            Prima di scrivere gli alert chiama list_alerts: crea con write_alert (kind vuln|breach, severity, title, detail,
            domain, dedupe_key stabile come ''cve-2025-xxxx@dominio'' o ''breach-nome@email'') SOLO per vulnerabilità critiche
            (CVSS >= 9) o breach NUOVI non già in elenco. Non inventare nulla: se un controllo fallisce scrivilo come ''non
            eseguito''.


            Output: elenco strutturato per dominio con sezioni Certificati, Email (SPF/DKIM/DMARC), DNS, Software e CVE, Breach,
            ciascuna con stato OK/Attenzione/Critico e dati grezzi essenziali. In italiano.'
    appTools:
    - name: dns_lookup
      description: 'Interroga il DNS pubblico (DNS over HTTPS). Parametri query: name, type (A, MX, TXT, NS, CAA)'
      action: http
      http:
        method: GET
        url: https://dns.google/resolve
        attribution: Google Public DNS
    - name: crt_certs
      description: 'Certificati pubblici registrati nei log Certificate Transparency. Query: q=<dominio>&output=json'
      action: http
      http:
        method: GET
        url: https://crt.sh/
        attribution: crt.sh, Certificate Transparency logs
    - name: nvd_cves
      description: 'Cerca CVE nel National Vulnerability Database. Query: keywordSearch, cvssV3Severity'
      action: http
      http:
        method: GET
        url: https://services.nvd.nist.gov/rest/json/cves/2.0
        attribution: NVD, NIST
    - name: hibp_breaches
      description: 'Breach pubblici in cui compare un indirizzo email. Path: /<email>, query truncateResponse=false'
      action: http
      http:
        method: GET
        url: https://haveibeenpwned.com/api/v3/breachedaccount
        allowPath: true
        attribution: Have I Been Pwned
        credential:
          provider: hibp
          header: hibp-api-key
          format: '{secret}'
    - name: read_employees
      description: Elenco dei dipendenti dell'azienda
      action: read
      collection: employees
      scope: user
    - name: list_alerts
      description: Alert già emessi
      action: read
      collection: alerts
      scope: user
    - name: write_alert
      description: Registra un alert critico (vulnerabilità o breach nuovo)
      action: write
      collection: alerts
      scope: user
    output: markdown
  - key: analyst
    role: helper
    description: Trasforma i risultati in punteggio di rischio e report per non tecnici.
    profile:
      inline:
        display_name: ScudoPMI analista
        crews:
        - id: analyst
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''analista di rischio di ScudoPMI. Ricevi i risultati dei controlli passivi settimanali e scrivi
            un report comprensibile a un titolare non tecnico, in italiano, senza gergo (se usi SPF, DMARC, CVE spiegali in
            una frase).


            Punteggio di rischio 0-100 (100 = molto sicuro): parti da 100 e sottrai: vulnerabilità critica -20 ciascuna (max
            -40), alta -8, certificato scaduto -20 o in scadenza entro 7 giorni -10, SPF/DMARC assenti -10 ciascuno, DMARC
            p=none -5, breach con password esposte -8 per indirizzo (max -24), altri breach -3. Livello: >=80 Basso, 60-79
            Medio, 40-59 Alto, <40 Critico. Controlli ''non eseguiti'' non cambiano il punteggio ma vanno citati.


            Struttura: ''# Report sicurezza — <domini> — settimana del <data>'' (titolo di primo livello), poi ## Punteggio
            (numero, livello, una frase), un blocco ```chart``` bar con i punteggi per area (Certificati, Email, Software,
            Breach, ciascuno 0-100) con dati reali, ## Cosa fare, in ordine di priorità (numerato: azione, perché conta, chi
            la fa — il titolare o il fornitore del sito/hosting —, tempo stimato), ## Cosa va bene, ## Cosa non siamo riusciti
            a controllare, ## Dettagli per il tecnico (tabella dei riscontri). Non inventare dati e non dare consulenza legale.
            Alla fine chiama write_score una volta con date (AAAA-MM-GG), score, level.'
          mcp_servers: []
    appTools:
    - name: write_score
      description: Registra il punteggio di rischio della settimana (date, score, level)
      action: write
      collection: risk_scores
      scope: user
    output: markdown
  - key: trainer
    role: scheduled
    description: Prepara ogni mese lezione e quiz e li assegna a ciascun dipendente.
    profile:
      inline:
        display_name: ScudoPMI formatore
        crews:
        - id: trainer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei il formatore di ScudoPMI. Ogni mese scrivi una micro-lezione di sicurezza informatica per dipendenti
            non tecnici (max 250 parole, italiano semplice, esempi concreti di ufficio, 3 consigli pratici) e un quiz di 3
            domande a risposta multipla (A, B, C). Leggi i dipendenti con read_employees. Per ciascuno chiama write_training
            con: email, name, month (AAAA-MM), topic, lesson (testo della lezione), quiz (le 3 domande con le opzioni A/B/C),
            answer_key (risposte corrette con una riga di spiegazione), completed=false, due_date (14 giorni da oggi, AAAA-MM-GG).
            Stessa lezione per tutti. Non creare due volte lo stesso mese per la stessa email. Alla fine rispondi con ''#
            Formazione <mese>'' e un riepilogo di quanti dipendenti l''hanno ricevuta.'
    appTools:
    - name: read_employees
      description: Elenco dei dipendenti dell'azienda
      action: read
      collection: employees
      scope: user
    - name: write_training
      description: Assegna lezione e quiz a un dipendente
      action: write
      collection: training_results
      scope: user
    output: markdown
  teams:
  - key: weekly_watch
    mode: sequence
    title:
      it: Sorveglianza settimanale
    steps:
    - agent: scanner
    - agent: analyst
      after:
      - scanner
    maxMinutes: 40
    writesTo:
      collection: risk_reports
      parse: whole
  templates:
  - key: monitor
    title:
      it: Sorveglianza aziendale
    description:
      it: Ogni settimana controlli passivi sui tuoi domini, con punteggio di rischio e report via email.
    team: weekly_watch
    params:
    - name: domains
      type: textarea
      required: true
      label:
        it: Domini aziendali (uno per riga)
      help:
        it: es. azienda.it
    - name: services
      type: textarea
      label:
        it: Servizi esposti che conosci (facoltativo)
      help:
        it: es. sito WordPress 6.4, router VPN, gestionale web
    - name: confirm_owner
      type: boolean
      required: true
      label:
        it: Confermo che i domini sono dell'azienda e autorizzo solo controlli passivi
    goal: 'Sorveglianza settimanale "{instance}". Domini: {domains}

      {?services}Servizi esposti dichiarati: {services}{/services}

      Oggi è {date}. Solo controlli passivi, nessuna scansione attiva. Scrivi in italiano.'
    schedule:
      cron: 0 5 * * 1
      userCanChange: false
    maxPerUser: 3
    deliver:
      to: owner
      subject: 'ScudoPMI: il report settimanale'
      onlyIfNew: false
  - key: training_cycle
    title:
      it: Formazione mensile
    description:
      it: Ogni mese lezione e quiz via email a tutti i dipendenti.
    agent: trainer
    params:
    - name: topic
      type: select
      required: true
      label:
        it: Argomento
      options:
      - value: a rotazione (phishing, password, dispositivi, dati dei clienti, truffe al telefono)
        label:
          it: A rotazione
      - value: phishing ed email sospette
        label:
          it: Phishing
      - value: password e autenticazione a due fattori
        label:
          it: Password
      - value: sicurezza dei dispositivi e del lavoro da remoto
        label:
          it: Dispositivi e smart working
    goal: 'Prepara la formazione del mese corrente (oggi è {date}). Argomento: {topic}. Assegnala a tutti i dipendenti.'
    schedule:
      cron: 0 7 1 * *
      userCanChange: false
    maxPerUser: 1
  triggers:
  - key: critical_alert
    description: Alert immediato al titolare
    'on':
      collection: alerts
      op: insert
    notify:
      to: owner
      subject:
        it: 'ScudoPMI — ALERT: {record.title}'
      body:
        it: 'Abbiamo rilevato un problema urgente.


          {record.title}

          Dominio: {record.domain}


          {record.detail}


          Apri il report per le azioni da fare.'
      link: alerts
  - key: training_new
    description: Email al dipendente con lezione e quiz
    'on':
      collection: training_results
      op: insert
    notify:
      to:
      - record.email
      subject:
        it: 'Formazione sicurezza del mese: {record.topic}'
      body:
        it: 'Ciao {record.name},


          è disponibile la lezione di sicurezza del mese e un breve quiz. Ci vogliono 5 minuti. Accedi con questo indirizzo
          email, leggi la lezione e rispondi al quiz entro il {record.due_date}.'
      link: my_training
  data:
    collections:
    - name: employees
      ownedBy: user
      description: Dipendenti dell'azienda
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome e cognome
      - name: email
        type: email
        required: true
        label:
          it: Email aziendale
    - name: alerts
      ownedBy: user
      description: Alert su vulnerabilità critiche e breach
      retentionDays: 365
      fields:
      - name: kind
        type: select
        options:
        - value: vuln
          label:
            it: Vulnerabilità
        - value: breach
          label: Data breach
      - name: severity
        type: text
      - name: title
        type: text
      - name: detail
        type: textarea
      - name: domain
        type: text
      - name: dedupe_key
        type: text
    - name: risk_reports
      ownedBy: instance
      description: Report settimanali di rischio
      fields:
      - name: title
        type: text
      - name: content
        type: textarea
    - name: risk_scores
      ownedBy: user
      description: Storico del punteggio di rischio
      fields:
      - name: date
        type: date
      - name: score
        type: number
      - name: level
        type: text
    - name: training_results
      ownedBy: user
      description: Formazione assegnata ai dipendenti e completamento
      retentionDays: 730
      fields:
      - name: email
        type: email
      - name: name
        type: text
      - name: month
        type: text
      - name: topic
        type: text
      - name: lesson
        type: textarea
      - name: quiz
        type: textarea
      - name: answer_key
        type: textarea
      - name: a1
        type: select
        label:
          it: Risposta 1
        options:
        - A
        - B
        - C
      - name: a2
        type: select
        label:
          it: Risposta 2
        options:
        - A
        - B
        - C
      - name: a3
        type: select
        label:
          it: Risposta 3
        options:
        - A
        - B
        - C
      - name: completed
        type: boolean
        label:
          it: Ho letto la lezione e completato il quiz
      - name: due_date
        type: date
      access:
      - role: employee
        where:
          email: '{user.email}'
        can:
        - read
        - write
    credentials:
    - provider: hibp
      kind: api_key
      scope: org
      label:
        it: Chiave API Have I Been Pwned
      help:
        it: Chiave dell'abbonamento API su haveibeenpwned.com, impostata dall'amministratore
  egress:
    hosts:
    - dns.google
    - crt.sh
    - services.nvd.nist.gov
    - haveibeenpwned.com
    notes: 'dns.google: DNS pubblico (DoH). crt.sh: log Certificate Transparency pubblici. services.nvd.nist.gov: NVD, dati
      pubblici NIST. haveibeenpwned.com: API a pagamento con chiave dell''owner, uso commerciale con abbonamento.'
  views:
  - key: home
    type: page
    nav: false
    title: ScudoPMI
    sections:
    - type: hero
      band: true
      eyebrow:
        it: Sicurezza informatica per le PMI
      title:
        it: La **sicurezza** della tua azienda, senza un reparto IT.
      text:
        it: Ogni settimana controlli passivi e leciti su domini, email e servizi esposti. Un punteggio di rischio chiaro,
          le azioni da fare in ordine di priorità e la formazione mensile per i tuoi dipendenti.
      actions:
      - label:
          it: Inizia ora
        href: /login
        style: primary
      - label:
          it: Come funziona
        href: '#come-funziona'
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
      items:
      - title:
          it: Inserisci i dati
        text:
          it: Domini aziendali, email dei dipendenti e i servizi esposti che conosci.
        badge: '1'
      - title:
          it: Controlli ogni settimana
        text:
          it: Un agente verifica certificati, email e DNS, breach e versioni software.
        badge: '2'
      - title:
          it: Report comprensibile
        text:
          it: Punteggio di rischio e azioni in ordine di priorità, via email.
        badge: '3'
      - title:
          it: Alert immediato
        text:
          it: Se compare una vulnerabilità critica o un breach ti avvisiamo subito.
        badge: '4'
    - type: cards
      id: controlli
      title:
        it: Cosa controlliamo
      items:
      - title:
          it: Certificati SSL
        text:
          it: Scadenze in arrivo prima che il sito mostri errori ai clienti.
        badge: 🔒
      - title:
          it: SPF, DKIM e DMARC
        text:
          it: Protezione contro chi falsifica le email della tua azienda.
        badge: ✉️
      - title:
          it: Data breach
        text:
          it: Indirizzi aziendali comparsi in archivi pubblici di violazioni.
        badge: 🕵️
      - title:
          it: Software e CVE
        text:
          it: Versioni dichiarate dai banner pubblici confrontate con il database CVE.
        badge: 🛡️
    - type: cards
      id: formazione
      title:
        it: Formazione dei dipendenti
      intro:
        it: Ogni mese una breve lezione e un quiz via email. Tu vedi chi li ha completati, i dipendenti vedono solo la propria
          formazione.
      items:
      - title:
          it: 5 minuti al mese
        text:
          it: 'Phishing, password, dispositivi, truffe: in linguaggio semplice.'
        badge: 🎓
    - type: note
      content:
        it: ScudoPMI esegue solo controlli passivi su fonti pubbliche. Nessuna scansione attiva viene fatta senza autorizzazione
          scritta. Il servizio è un supporto alla decisione, non una garanzia di sicurezza né una consulenza legale.
  - key: monitors
    type: instances
    template: monitor
    title:
      it: Sorveglianza
    roles:
    - user
    - admin
  - key: reports
    type: list
    title:
      it: Report settimanali
    source: collection:risk_reports
    printable: true
    data:
      display: cards
      fields:
      - key: title
        label:
          it: Report
      - key: content
        label:
          it: Contenuto
      limit: 50
    roles:
    - user
    - admin
  - key: score
    type: chart
    title:
      it: Punteggio di rischio
    source: collection:risk_scores
    data:
      display: chart
      chart: line
      fields:
      - key: date
        label:
          it: Data
        format: date
      - key: score
        label:
          it: Punteggio
      sort:
        field: date
        dir: asc
      limit: 60
    roles:
    - user
    - admin
  - key: alerts
    type: table
    title:
      it: Alert
    source: collection:alerts
    columns:
    - title
    - domain
    - kind
    - severity
    - detail
    roles:
    - user
    - admin
  - key: add_employee
    type: form
    title:
      it: Aggiungi dipendente
    collection: employees
    fields:
    - name
    - email
    submit:
      label:
        it: Aggiungi
      message:
        it: Dipendente aggiunto.
      redirect: employees
    roles:
    - user
    - admin
    nav: false
  - key: employees
    type: table
    title:
      it: Dipendenti
    source: collection:employees
    columns:
    - name
    - email
    export: true
    roles:
    - user
    - admin
  - key: training_admin
    type: table
    title:
      it: 'Formazione: chi ha completato'
    source: collection:training_results
    columns:
    - name
    - email
    - month
    - topic
    - completed
    - due_date
    export: true
    roles:
    - user
    - admin
  - key: my_training
    type: list
    title:
      it: La mia formazione
    source: collection:training_results
    data:
      display: cards
      fields:
      - key: month
        label:
          it: Mese
      - key: topic
        label:
          it: Argomento
      - key: lesson
        label:
          it: Lezione
      - key: quiz
        label:
          it: Quiz
      - key: completed
        label:
          it: Completato
      sort:
        field: month
        dir: desc
      limit: 24
    roles:
    - employee
  - key: quiz
    type: form
    title:
      it: Quiz del mese
    collection: training_results
    fields:
    - a1
    - a2
    - a3
    - completed
    edit: true
    submit:
      label:
        it: Invia
      message:
        it: Grazie, formazione registrata.
      redirect: my_training
    roles:
    - employee
    nav: false
  - key: account
    type: account
    title:
      it: Abbonamento
    roles:
    - user
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: micro
      price: 29
      interval: month
      label:
        it: Micro — fino a 10 dipendenti
      includes:
      - fino a 10 dipendenti
      - report settimanale
      - formazione mensile
      - alert immediati
    - key: small
      price: 79
      interval: month
      label:
        it: Piccola — fino a 50 dipendenti
      includes:
      - fino a 50 dipendenti
      - report settimanale
      - formazione mensile
      - alert immediati
    - key: medium
      price: 199
      interval: month
      label:
        it: Media — fino a 250 dipendenti
      includes:
      - fino a 250 dipendenti
      - report settimanale
      - formazione mensile
      - alert immediati
  extensions:
  - key: employee_signup_role
    description: 'Un dipendente che accede riceve anche il ruolo ''user'' di signup: vede solo i propri dati (i record sono
      per utente) e la propria formazione, ma le voci di menu del titolare restano visibili e vuote.'
  - key: quiz_scoring
    description: 'Il quiz non ha correzione automatica: l''admin vede il completamento e le risposte; il punteggio automatico
      richiede una logica dedicata.'
