apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: scudopmi
  displayName: ScudoPMI
  tagline:
    it: La sicurezza informatica della tua PMI, senza un reparto IT.
  description:
    it: Controlli passivi e leciti ogni settimana su domini, email e servizi esposti, un punteggio di rischio con azioni in
      ordine di priorità e una formazione mensile per i dipendenti.
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: dashboard
  branding:
    theme: light
    palette:
      primary: '#0f2a43'
      accent: '#1c8c6e'
      background: '#f6f8fa'
      foreground: '#14202e'
    fonts:
      body: Inter
      display: Manrope
    wordmark:
    - text: Scudo
      color: primary
    - text: PMI
      color: accent
    button: accent
  header:
    links:
    - label:
        it: Come funziona
      href: '#come-funziona'
    - label:
        it: Controlli
      href: '#controlli'
    cta:
      label:
        it: Accedi
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label:
        it: Amministratore
      assignedBy: admin_emails
    - key: titolare
      label:
        it: Titolare
      assignedBy: signup
    - key: dipendente
      label:
        it: Dipendente
      assignedBy: invite
  limits:
  - action: agent:quiz
    per: user
    max: 5
    window: day
  egress:
    hosts:
    - dns.google
    - crt.sh
    - services.nvd.nist.gov
    notes: 'dns.google: DNS-over-HTTPS pubblico per record TXT/MX/NS (SPF, DKIM, DMARC). crt.sh: log pubblici Certificate
      Transparency, scadenza certificati. services.nvd.nist.gov: NVD, database CVE del NIST, dati pubblici riutilizzabili.
      Solo lettura passiva.'
  agents:
  - key: analyst
    role: scheduled
    description: Coordina il controllo settimanale di un'azienda, calcola il punteggio di rischio e scrive il report in italiano
      semplice.
    profile:
      inline:
        display_name: ScudoPMI analista
        crews:
        - id: analyst
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''analista di sicurezza di ScudoPMI, per piccole imprese senza reparto IT. Per ogni esecuzione
            chiedi allo scanner (tool ask_scanner) di eseguire i controlli passivi sui domini, email e servizi indicati, poi
            trasformi i risultati in un report per non tecnici. Struttura obbligatoria: titolo ''# Report sicurezza — <azienda/dominio>
            — settimana del <data>''; ''## Punteggio di rischio'' (da 0 a 100, 100 = rischio massimo, con livello Basso/Medio/Alto/Critico
            e spiegazione di due righe); ''## Cosa è cambiato'' rispetto alla memoria della settimana scorsa; ''## Alert critici''
            (nuove vulnerabilità critiche o breach, oppure ''Nessuno''); ''## Azioni da fare in ordine di priorità'' (elenco
            numerato: cosa fare, perché conta, chi può farlo, tempo stimato); ''## Dettaglio tecnico'' (tabella certificati,
            SPF/DKIM/DMARC, CVE); ''## Limiti del controllo''. Usa un linguaggio semplice, senza gergo non spiegato. Non inventare
            dati: se un controllo non è stato possibile dillo. Fai solo controlli passivi; non proporre mai scansioni attive
            senza autorizzazione scritta del titolare. Non dare consulenza legale. Aggiungi un blocco ```chart con l''andamento
            del punteggio se hai più di due settimane in memoria. Alla fine chiama una volta il tool remember con i 5 punti
            chiave e il punteggio.'
    delegates:
    - scanner
    memory: instance
    goalTemplate: 'Controllo settimanale di "{instance}". Data: {date}. Scrivi il report in italiano.'
    output: markdown
    writesTo:
      collection: weekly_reports
      parse: markdown_sections
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.6
  - key: scanner
    role: helper
    description: 'Esegue i controlli passivi: certificati, DNS/SPF/DKIM/DMARC, breach pubblici, banner e CVE.'
    profile:
      inline:
        display_name: ScudoPMI scanner passivo
        crews:
        - id: scanner
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'Sei lo scanner PASSIVO di ScudoPMI. Operi solo su domini e servizi forniti dal titolare, solo con
            fonti pubbliche. VIETATO: port scan, brute force, exploit, login, qualsiasi scansione attiva. Controlli: 1) Certificati:
            tool cert_search con query il dominio (output=json), ricava la data di scadenza più recente dei certificati attivi
            e segnala quelli che scadono entro 30 giorni. 2) DNS: tool dns_query (name, type) per TXT, MX, NS, CAA. SPF =
            TXT del dominio che inizia con v=spf1 (segnala assente, +all, ~all debole, più di 10 lookup). DMARC = TXT di _dmarc.<dominio>
            (segnala assente o p=none). DKIM = TXT di <selettore>._domainkey.<dominio> per selettori comuni (default, google,
            selector1, selector2, k1, mail); dichiara ''non verificabile'' se nessun selettore risponde, non ''assente''.
            3) Breach: con il MCP webrobot consulta fonti pubbliche di data breach e cerca gli indirizzi email forniti; riporta
            solo corrispondenze verificate con fonte e data, mai le password. 4) Servizi esposti: con il MCP webrobot leggi
            solo banner/versioni dichiarati pubblicamente nelle pagine dei servizi indicati; poi cerca i CVE con nvd_cves
            (keywordSearch=<prodotto versione>) e riporta CVE ID, gravità CVSS, se critica (>=9.0). Restituisci un elenco
            strutturato di rilievi con: controllo, oggetto, esito, gravità (info/bassa/media/alta/critica), fonte, data. Non
            inventare nulla; se una fonte non risponde scrivilo.'
    appTools:
    - name: cert_search
      description: 'Cerca i certificati pubblici di un dominio nei log Certificate Transparency (crt.sh). Query: q=<dominio>&output=json'
      action: http
      http:
        method: GET
        url: https://crt.sh/
        attribution: crt.sh, log Certificate Transparency pubblici
    - name: dns_query
      description: 'Interroga il DNS pubblico (Google DNS-over-HTTPS). Query: name=<nome>&type=<TXT|MX|NS|CAA|A>. Risposta
        JSON con campo Answer.'
      action: http
      http:
        method: GET
        url: https://dns.google/resolve
        attribution: Google Public DNS
    - name: nvd_cves
      description: 'Cerca CVE nel database NVD. Query: keywordSearch=<prodotto versione>&resultsPerPage=20. Risposta JSON
        con vulnerabilities[].cve (id, metrics, descriptions).'
      action: http
      http:
        method: GET
        url: https://services.nvd.nist.gov/rest/json/cves/2.0
        attribution: NVD, NIST, dati pubblici
    output: markdown
    limits:
      maxTurns: 30
      maxBudgetUsd: 1.0
  - key: trainer
    role: scheduled
    description: Ogni mese scrive la lezione di sicurezza e il quiz per i dipendenti.
    profile:
      inline:
        display_name: ScudoPMI formatore
        crews:
        - id: trainer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 4
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Scrivi la lezione mensile di sicurezza informatica per dipendenti di piccole imprese, non tecnici,
            in italiano. Struttura: titolo ''# Lezione <mese anno> — <tema>'' (temi a rotazione: phishing, password e MFA,
            ransomware, dispositivi mobili, lavoro da remoto, ingegneria sociale, privacy dei dati); ''## In breve'' (3 righe);
            ''## La lezione'' (max 300 parole con esempi concreti); ''## Quiz'' con 5 domande a risposta multipla numerate,
            opzioni A-D, SENZA soluzioni; ''## Soluzioni'' con le risposte corrette e una riga di spiegazione ciascuna. Non
            inventare statistiche.'
    goalTemplate: 'Scrivi la lezione e il quiz di questo mese. Data: {date}.'
    output: markdown
    writesTo:
      collection: training_lessons
      parse: whole
  - key: quiz
    role: main
    description: Corregge il quiz del dipendente e registra il completamento.
    profile:
      inline:
        display_name: ScudoPMI correttore quiz
        crews:
        - id: quiz
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 3
          max_budget_usd: 0.1
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Correggi un quiz di sicurezza informatica. Ricevi il testo della lezione con le soluzioni e le risposte
            del dipendente. Scrivi ''# Esito quiz — <titolo lezione>'', poi il punteggio su 5, per ogni domanda se è giusta
            e perché, e un incoraggiamento breve. Termina con un blocco JSON su una riga: {"lesson":"<titolo>","score":<n>,"completed":true}.
            Sii gentile e chiaro; non inventare domande.'
    goalTemplate: 'Lezione con soluzioni:

      {lesson_text}


      Risposte del dipendente:

      {answers}

      Dipendente: {user}. Data: {date}.'
    output: markdown+json
    writesTo:
      collection: training_results
      parse: json_last
  inputForm:
    title:
      it: Quiz del mese
    fields:
    - name: lesson_text
      type: textarea
      required: true
      maxLength: 6000
      label:
        it: Lezione e soluzioni (copiate dalla pagina Formazione)
    - name: answers
      type: textarea
      required: true
      maxLength: 600
      label:
        it: Le tue risposte (es. 1A 2C 3B 4D 5A)
  templates:
  - key: company_watch
    title:
      it: Sorveglianza azienda
    description:
      it: Ogni settimana controlli passivi e report di rischio per i tuoi domini.
    agent: analyst
    params:
    - name: company
      type: text
      required: true
      label:
        it: Nome azienda
    - name: domains
      type: textarea
      required: true
      label:
        it: Domini aziendali (uno per riga)
    - name: employee_emails
      type: textarea
      label:
        it: Email dei dipendenti da controllare nei breach (una per riga)
    - name: services
      type: textarea
      label:
        it: Servizi esposti che conosci (es. sito WordPress, VPN, mail server, con indirizzo)
    - name: authorization
      type: boolean
      required: true
      label:
        it: Confermo di essere titolare di questi domini e di autorizzare i controlli passivi
      help:
        it: Nessuna scansione attiva viene eseguita senza autorizzazione scritta separata.
    goal: 'Azienda: {company}. Domini: {domains}. Email dipendenti: {employee_emails}. Servizi esposti noti: {services}. Autorizzazione
      dichiarata dal titolare: {authorization}. Oggi è {date}. Esegui i soli controlli passivi con ask_scanner e scrivi il
      report settimanale in italiano.'
    schedule:
      cron: 0 6 * * 1
      userCanChange: false
    maxPerUser: 3
    roles:
    - titolare
    - admin
    cost:
      perRun: 10
  data:
    collections:
    - name: weekly_reports
      ownedBy: instance
      description: Report settimanali di sicurezza di ogni sorveglianza (punteggio, alert, azioni)
    - name: training_lessons
      ownedBy: app
      description: Lezioni e quiz mensili, uguali per tutti
    - name: training_results
      ownedBy: user
      description: Esiti dei quiz completati dal singolo dipendente
      fields:
      - name: lesson
        type: text
      - name: score
        type: number
      - name: completed
        type: boolean
  schedules:
  - agent: trainer
    cron: 0 6 1 * *
    action: run
    owner: app
  views:
  - key: home
    type: page
    nav: false
    title: ScudoPMI
    sections:
    - type: hero
      eyebrow:
        it: Sicurezza per le PMI
      title:
        it: La sicurezza informatica della tua azienda, **senza un reparto IT**.
      text:
        it: Ogni settimana controlliamo in modo passivo e lecito domini, email e servizi esposti. Tu ricevi un punteggio di
          rischio e le azioni da fare, in parole semplici. I tuoi dipendenti si formano ogni mese.
      actions:
      - label:
          it: Inizia ora
        href: /login
        style: primary
      - label:
          it: Come funziona
        href: '#come-funziona'
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
      items:
      - title:
          it: Inserisci i dati
        text:
          it: Domini, email dei dipendenti e servizi che conosci.
        badge: '1'
      - title:
          it: Controlli ogni settimana
        text:
          it: Un agente esegue solo verifiche passive su fonti pubbliche.
        badge: '2'
      - title:
          it: Report e priorità
        text:
          it: Punteggio di rischio e azioni in ordine di importanza.
        badge: '3'
      - title:
          it: Formazione mensile
        text:
          it: Una lezione breve e un quiz per ogni dipendente.
        badge: '4'
    - type: cards
      id: controlli
      title:
        it: Cosa controlliamo
      items:
      - title:
          it: Certificati SSL
        text:
          it: Avvisi prima della scadenza.
        badge: 🔒
      - title:
          it: 'Email: SPF, DKIM, DMARC'
        text:
          it: Per ridurre phishing e falsificazione del tuo dominio.
        badge: ✉️
      - title:
          it: Data breach
        text:
          it: Presenza degli indirizzi aziendali in archivi pubblici.
        badge: 🕵️
      - title:
          it: Software e CVE
        text:
          it: Versioni dichiarate pubblicamente confrontate con il database CVE.
        badge: 🛠️
    - type: note
      content:
        it: ScudoPMI esegue solo controlli passivi su fonti pubbliche. Nessuna scansione attiva senza autorizzazione scritta.
          Il servizio è un supporto e non sostituisce una consulenza professionale di sicurezza o legale.
  - key: watches
    type: instances
    template: company_watch
    title:
      it: Le mie aziende
    roles:
    - titolare
    - admin
  - key: reports
    type: cards
    title:
      it: Report di sicurezza
    source: collection:weekly_reports
    printable: true
    roles:
    - titolare
    - admin
  - key: lessons
    type: cards
    title:
      it: Formazione
    source: collection:training_lessons
    roles:
    - titolare
    - admin
    - dipendente
  - key: quiz_run
    type: new_run
    title:
      it: Fai il quiz
    roles:
    - titolare
    - admin
    - dipendente
  - key: my_training
    type: history
    title:
      it: La mia formazione
    source: collection:training_results
    roles:
    - titolare
    - admin
    - dipendente
  - key: account
    type: account
    title:
      it: Abbonamento
    roles:
    - titolare
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 20
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:quiz: 2
    packs:
    - key: extra
      credits: 500
      price: 10
      label:
        it: Controlli extra
    plans:
    - key: fino-10
      price: 29
      interval: month
      label:
        it: Fino a 10 dipendenti
      credits: 400
      creditsReset: monthly
      roles:
      - titolare
    - key: fino-50
      price: 79
      interval: month
      label:
        it: Fino a 50 dipendenti
      credits: 800
      creditsReset: monthly
      roles:
      - titolare
    - key: fino-200
      price: 199
      interval: month
      label:
        it: Fino a 200 dipendenti
      credits: 2000
      creditsReset: monthly
      roles:
      - titolare
  extensions:
  - key: email_alerts
    description: 'Gli alert immediati via email per nuove vulnerabilità critiche o breach non sono ancora disponibili: gli
      alert compaiono nella sezione ''Alert critici'' del report. Servono notifiche email.'
  - key: email_training
    description: 'L''invio mensile via email di lezione e quiz ai dipendenti non è ancora disponibile: i dipendenti, invitati
      come ruolo ''dipendente'', leggono la lezione in app nella pagina Formazione.'
  - key: company_training_overview
    description: 'La vista dell''admin con chi ha completato la formazione richiede di raggruppare gli utenti per azienda:
      oggi gli esiti sono per singolo utente (ownedBy user) e non vengono aggregati.'
  - key: breach_sources
    description: I breach sono cercati su fonti pubbliche tramite WebRobot MCP; servizi con chiave API (es. HIBP) richiedono
      credenziali non ancora supportate.
  - key: per_employee_pricing
    description: Il prezzo per numero di dipendenti è modellato con tre piani a fasce; il limite di dipendenti per fascia
      non è applicato dal runtime.
