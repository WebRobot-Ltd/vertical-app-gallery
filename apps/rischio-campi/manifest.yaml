apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: rischiocampi
  displayName: RischioCampi
  tagline:
    it: Rischio e danni sui campi assicurati, dai satelliti aperti e dal meteo.
    en: Risk and damage on insured fields, from open satellite and weather data.
  description:
    it: 'RischioCampi aiuta assicurazioni e consorzi di difesa agricola: per ogni campo della polizza calcola indici di vegetazione
      Sentinel-2, li confronta con la storia della zona e con i dati meteo aperti, assegna un punteggio di rischio e stima
      il danno dopo un evento. Dopo ogni evento estremo verifica i campi colpiti e prepara per il perito l''elenco da ispezionare
      in ordine di priorità, da approvare prima dell''invio.'
    en: 'RischioCampi helps insurers and agricultural defence consortia: for every insured field it computes Sentinel-2 vegetation
      indices, compares them with the zone''s history and open weather data, assigns a risk score and estimates damage after
      an event. After each extreme event it checks the affected fields and prepares a prioritised inspection list for the
      surveyor, to approve before sending.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#27471f'
      accent: '#c47f17'
      background: '#f7f6ef'
      foreground: '#1d2519'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Rischio
      color: primary
    - text: Campi
      color: accent
    width: wide
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Fonti
        en: Sources
      href: '#fonti'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: user
      label:
        it: Compagnia / consorzio
        en: Company / consortium
      assignedBy: signup
  limits:
  - action: agent:analyst
    per: user
    max: 10
    window: day
    roles:
    - user
  - action: chat
    per: user
    max: 60
    window: day
    roles:
    - user
  egress:
    hosts:
    - earth-search.aws.element84.com
    - archive-api.open-meteo.com
    notes: 'Earth Search STAC (Element84) indexes Sentinel-2 L2A scenes, Copernicus data free and open for reuse. Open-Meteo
      archive: open data CC BY 4.0; its free tier is for non-commercial use, so a commercial Open-Meteo licence must be acquired
      before going live.'
  agents:
  - key: importer
    role: helper
    description: Receives pasted policy lists in chat and saves each field in the company's own policies.
    profile:
      inline:
        display_name: RischioCampi importer
        chat_mode: true
        crews:
        - id: importer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You help an insurer load its policy list. The user pastes rows (policy number, holder, crop declared,
            coordinates lat/lon or cadastral parcel, hectares, sum insured). For each field call policies_write once with:
            policy_no, holder, crop, lat, lon, parcel, hectares, region, sum_insured. Use decimal degrees for coordinates.
            If a row has only cadastral parcels (foglio/particella/comune) and no coordinates, save it with the parcel and
            leave lat/lon empty, and tell the user that coordinates are needed for the satellite analysis (the parcel lookup
            is not available). Never invent coordinates or hectares: ask when something is missing or ambiguous. Files cannot
            be uploaded: ask for pasted text. At the end summarise how many fields were saved and which rows need fixing.
            Reply in the user''s language.'
    goalTemplate: 'Conversation so far:

      {history}

      New message from {user}:

      {message}'
    appTools:
    - name: policies_write
      description: Save one insured field in the company's policies
      action: write
      collection: policies
      scope: user
    - name: policies_read
      description: Read the company's saved policies
      action: read
      collection: policies
      scope: user
    output: markdown
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.5
  - key: analyst
    role: main
    description: Scores risk per field and estimates damage after an event; writes the prioritised inspection report.
    profile:
      inline:
        display_name: RischioCampi analyst
        crews:
        - id: analyst
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You are an agricultural risk analyst working for an insurer. Read the company''s fields with policies_read
            (only those matching the requested scope). For each field: 1) find Sentinel-2 L2A scenes with stac_search (POST,
            body e.g. {"collections":["sentinel-2-l2a"],"intersects":{"type":"Point","coordinates":[lon,lat]},"datetime":"<start>/<end>","query":{"eo:cloud_cover":{"lt":30}},"limit":10})
            to select clear scenes before and after the event and during the same period in previous years; 2) obtain the
            vegetation indices (NDVI, NDMI) for those scenes: use the WebRobot MCP to build and run a pipeline when you can
            reach the raster data; if you cannot compute the indices, say so explicitly and mark the field ''indices not available'',
            never invent values; 3) get weather with weather_archive (GET, query latitude, longitude, start_date, end_date,
            daily=temperature_2m_min,precipitation_sum,wind_gusts_10m_max,weather_code,et0_fao_evapotranspiration, timezone=auto):
            hail proxy = weather codes 96/99 and strong gusts, drought = low precipitation vs ET0 over 30-60 days, frost =
            minimum temperature <= 0 °C in sensitive growth stages of the declared crop. Compare indices against the zone''s
            historical mean (same period, previous years) and report the anomaly. Output: a level-1 title ''# Rischio campi
            — <event or period> — <date>''. Sections (##): Sintesi (counts per risk class, total hectares and sum insured
            exposed), Ispezioni in ordine di priorità (a table: priority, policy, holder, crop, hectares, risk score 0-100,
            estimated damage % with low-high range, main evidence, confidence), Evidenze per campo, Metodo e limiti (data
            used, dates, cloud cover, what was not available), Fonti. The damage estimate is a screening estimate for prioritising
            surveyor visits, not a loss adjustment: say so. Add one chart block of risk score for the top fields as ```chart
            {"type":"bar",...}``` with real figures only. Never invent figures. Before closing, call request_send_report with
            the summary so the surveyor approves before sending to the insurer. Write in the requested language.'
    goalTemplate: 'Scope: {scope_label}.

      {?crop}Crop filter: {crop}.{/crop}

      Event type: {event_type_label}.

      {?event_date}Event date: {event_date}.{/event_date}{!event_date}No specific event: produce a general seasonal risk score.{/event_date}

      {?notes}Notes: {notes}{/notes}

      Today is {date}. Write the report in the language with ISO code {lang}.'
    appTools:
    - name: policies_read
      description: Read the company's insured fields (policy, crop, coordinates, hectares)
      action: read
      collection: policies
      scope: user
    - name: stac_search
      description: Search Sentinel-2 L2A scenes (Earth Search STAC)
      action: http
      http:
        method: POST
        url: https://earth-search.aws.element84.com/v1/search
        attribution: Contains modified Copernicus Sentinel data, via Earth Search (Element84)
    - name: weather_archive
      description: Daily historical weather for a coordinate (Open-Meteo archive)
      action: http
      http:
        method: GET
        url: https://archive-api.open-meteo.com/v1/archive
        attribution: Weather data by Open-Meteo.com, CC BY 4.0
    awaits:
    - send_report
    output: markdown
    limits:
      maxTurns: 40
      maxBudgetUsd: 3
  - key: watcher
    role: scheduled
    description: 'Daily per-company check: detects extreme weather events on the company''s fields and verifies the ones hit.'
    memory: instance
    profile:
      inline:
        display_name: RischioCampi event watcher
        crews:
        - id: watcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You watch the insured fields of one company for extreme weather. Read the fields with policies_read.
            For the last 3 days check each distinct zone with weather_archive (GET: latitude, longitude, start_date, end_date,
            daily=temperature_2m_min,precipitation_sum,wind_gusts_10m_max,weather_code, timezone=auto): hail proxy (weather
            code 96/99, gusts > 90 km/h), frost (min <= -2 °C in a sensitive stage), extreme rain (> 80 mm/day). If the threshold
            given in the goal is not exceeded, reply with one line ''# Nessun evento estremo — <date>'' and stop. Otherwise,
            for the fields hit, look for clear Sentinel-2 scenes with stac_search (POST, collection sentinel-2-l2a, intersects
            Point, datetime range, eo:cloud_cover < 30) and, when you can reach the raster data through the WebRobot MCP,
            compare the vegetation indices (NDVI) with the zone''s historical mean; if the post-event scene is not yet available,
            say the check must be repeated. Never invent figures or indices. Your memory holds events already reported: do
            not report them again, and at the end call remember with the events handled. Output ''# Verifica evento — <type>
            — <date>'' with ## Evento, ## Campi da ispezionare in ordine di priorità (table: priority, policy, holder, crop,
            hectares, risk score, estimated damage % range, evidence, confidence), ## Limiti. Estimates are for prioritising
            visits, not loss adjustment. Then call request_send_report so the surveyor approves before it goes to the insurer.'
    goalTemplate: 'Check my fields for extreme weather events. Today is {date}. Sensitivity: {sensitivity}. Write in the language
      with ISO code {lang}.'
    appTools:
    - name: policies_read
      description: Read the company's insured fields
      action: read
      collection: policies
      scope: user
    - name: stac_search
      description: Search Sentinel-2 L2A scenes (Earth Search STAC)
      action: http
      http:
        method: POST
        url: https://earth-search.aws.element84.com/v1/search
        attribution: Contains modified Copernicus Sentinel data, via Earth Search (Element84)
    - name: weather_archive
      description: Daily historical weather for a coordinate (Open-Meteo archive)
      action: http
      http:
        method: GET
        url: https://archive-api.open-meteo.com/v1/archive
        attribution: Weather data by Open-Meteo.com, CC BY 4.0
    awaits:
    - send_report
    writesTo:
      collection: event_checks
      parse: whole
      keyBy: date
    output: markdown
    limits:
      maxTurns: 30
      maxBudgetUsd: 2
  inputForm:
    title:
      it: Nuova analisi di rischio
      en: New risk analysis
    fields:
    - name: scope
      type: select
      required: true
      label:
        it: Campi
        en: Fields
      default: all
      options:
      - value: all
        label:
          it: Tutte le polizze
          en: All policies
      - value: crop
        label:
          it: Solo una coltura
          en: One crop only
    - name: crop
      type: text
      label:
        it: Coltura (se filtrata)
        en: Crop (if filtered)
      visibleWhen: scope == 'crop'
    - name: event_type
      type: select
      required: true
      label:
        it: Evento
        en: Event
      options:
      - value: hail
        label:
          it: Grandine
          en: Hail
      - value: drought
        label:
          it: Siccità
          en: Drought
      - value: frost
        label:
          it: Gelata
          en: Frost
      - value: general
        label:
          it: Rischio generale stagionale
          en: General seasonal risk
    - name: event_date
      type: date
      label:
        it: Data dell'evento (facoltativa)
        en: Event date (optional)
    - name: notes
      type: textarea
      maxLength: 500
      label:
        it: Note (facoltative)
        en: Notes (optional)
  data:
    collections:
    - name: policies
      ownedBy: user
      description: Insured fields of each company; visible only to that company
      fields:
      - name: policy_no
        type: text
        required: true
        label: Polizza
      - name: holder
        type: text
        label: Contraente
      - name: crop
        type: text
        label: Coltura
      - name: lat
        type: number
        label: Lat
      - name: lon
        type: number
        label: Lon
      - name: parcel
        type: text
        label: Particella
      - name: hectares
        type: number
        label: Ettari
      - name: region
        type: text
        label: Zona
      - name: sum_insured
        type: number
        label: Somma assicurata
    - name: event_checks
      ownedBy: instance
      description: Automatic checks after extreme weather events, one per run
  templates:
  - key: event_watch
    title:
      it: Verifica automatica eventi
      en: Automatic event check
    description:
      it: 'Ogni giorno controlla i tuoi campi: se c''è stato un evento estremo, verifica i campi colpiti e prepara il report
        per il perito.'
      en: 'Every day checks your fields: after an extreme event, verifies the hit fields and prepares the report for the surveyor.'
    agent: watcher
    params:
    - name: sensitivity
      type: select
      required: true
      label:
        it: Sensibilità
        en: Sensitivity
      options:
      - value: standard
        label:
          it: Standard
          en: Standard
      - value: high
        label:
          it: Alta (soglie più basse)
          en: High (lower thresholds)
    goal: 'Check my fields for extreme weather events. Today is {date}. Sensitivity: {sensitivity}. Write in the language
      with ISO code {lang}.'
    schedule:
      cron: 0 6 * * *
      userCanChange: true
    maxPerUser: 1
    cost:
      perRun: 20
  approvals:
  - key: send_report
    title:
      it: Approva il report prima dell'invio alla compagnia
      en: Approve the report before sending to the insurer
    decidedBy: requester
    fields:
    - summary
    - fields_to_inspect
    timeoutMinutes: 4320
    onTimeout: reject
  views:
  - key: home
    type: page
    nav: false
    title: RischioCampi
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow:
        it: Per assicurazioni e consorzi di difesa
        en: For insurers and defence consortia
      title:
        it: Sai **quali campi ispezionare per primi** dopo la grandine.
        en: Know **which fields to inspect first** after hail.
      text:
        it: Carichi le polizze; l'agente calcola gli indici di vegetazione Sentinel-2, li confronta con la storia della zona
          e con il meteo aperto, e ti consegna un punteggio di rischio e una stima del danno. Dopo ogni evento estremo la
          verifica parte da sola.
        en: Load your policies; the agent computes Sentinel-2 vegetation indices, compares them with the zone's history and
          open weather data, and delivers a risk score and a damage estimate. After every extreme event the check starts by
          itself.
      actions:
      - label:
          it: Inizia
          en: Get started
        href: /login
        style: primary
      aside: <div style="padding:16px"><b>Esempio / Example</b><br>1. Campo 0412 — grano — 34 ha — rischio 86/100 — danno
        35–50%<br>2. Campo 0377 — vite — 12 ha — rischio 71/100 — danno 20–30%<br>3. Campo 0521 — mais — 21 ha — rischio 58/100</div>
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Carica le polizze
          en: Load policies
        text:
          it: 'Incolla l''elenco in chat: coordinate o particelle, coltura, ettari. Ogni compagnia vede solo le sue.'
          en: 'Paste the list in the chat: coordinates or parcels, crop, hectares. Each company sees only its own.'
        badge: 📋
      - title:
          it: L'agente analizza
          en: The agent analyses
        text:
          it: Indici di vegetazione, confronto con la media storica, grandine, siccità, gelate.
          en: Vegetation indices, comparison with the historical mean, hail, drought, frost.
        badge: 🛰️
      - title:
          it: Il perito approva
          en: The surveyor approves
        text:
          it: Report con i campi da ispezionare in ordine di priorità, approvato prima dell'invio.
          en: Report with fields to inspect in priority order, approved before sending.
        badge: ✅
    - type: cards
      id: fonti
      title:
        it: Fonti aperte
        en: Open sources
      items:
      - title: Sentinel-2 (Copernicus)
        text:
          it: Immagini satellitari aperte per gli indici di vegetazione.
          en: Open satellite imagery for vegetation indices.
      - title: Open-Meteo
        text:
          it: 'Meteo storico: precipitazioni, temperature minime, raffiche.'
          en: 'Historical weather: rainfall, minimum temperatures, gusts.'
    - type: note
      content:
        it: 'Le stime di danno servono a dare priorità alle ispezioni e non sostituiscono la perizia. Dati: Copernicus Sentinel,
          Open-Meteo (CC BY 4.0).'
        en: 'Damage estimates prioritise inspections and do not replace the loss adjustment. Data: Copernicus Sentinel, Open-Meteo
          (CC BY 4.0).'
  - key: import
    type: chat
    source: agent:importer
    title:
      it: Carica polizze
      en: Load policies
    placeholder:
      it: 'Incolla qui l''elenco: polizza, contraente, coltura, lat/lon o particella, ettari…'
      en: 'Paste the list here: policy, holder, crop, lat/lon or parcel, hectares…'
    examples:
    - Polizza 0412; Rossi; grano; 44.51,11.34; 34 ha; 60000 €
    - Mostrami le polizze salvate
    roles:
    - user
    - admin
  - key: policies
    type: table
    source: collection:policies
    title:
      it: Le mie polizze
      en: My policies
    columns:
    - policy_no
    - holder
    - crop
    - lat
    - lon
    - parcel
    - hectares
    - region
    - sum_insured
    roles:
    - user
    - admin
  - key: new
    type: new_run
    title:
      it: Nuova analisi
      en: New analysis
    roles:
    - user
    - admin
  - key: runs
    type: history
    source: run
    title:
      it: Le mie analisi
      en: My analyses
    roles:
    - user
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: watches
    type: instances
    template: event_watch
    title:
      it: Verifica automatica eventi
      en: Automatic event check
    roles:
    - user
    - admin
  - key: checks
    type: table
    source: collection:event_checks
    title:
      it: Verifiche dopo evento
      en: Post-event checks
    roles:
    - user
    - admin
  - key: to_approve
    type: approvals
    title:
      it: Da approvare
      en: To approve
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento e crediti
      en: Plan and credits
    roles:
    - user
  billing:
    modes:
    - credits
    signupCredits: 50
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:analyst:
        estimate: 10
        metered: true
    packs:
    - key: starter
      credits: 1000
      price: 10
      label: Starter
    - key: pro
      credits: 5000
      price: 45
      label: Pro
  extensions:
  - key: per_hectare_pricing
    description: 'Annual price per monitored hectare is not expressible yet: billing uses credit packs with metered runs;
      a per-hectare yearly plan needs custom logic.'
  - key: file_upload
    description: 'Policy files cannot be uploaded yet: policies are pasted as text in the chat.'
  - key: parcel_lookup
    description: 'Cadastral parcel to coordinates lookup is not available: coordinates are required for the satellite analysis.'
  - key: notifications
    description: 'Email notification when an event check finds affected fields is not available yet: users see them in the
      app.'
