apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: rischiocampi
  displayName: RischioCampi
  tagline:
    it: Rischio e danni sui campi assicurati, dai satelliti aperti e dal meteo.
    en: Risk and damage on insured fields, from open satellites and weather.
  description:
    it: 'Per assicurazioni e consorzi di difesa: carica le polizze, un agente calcola indici di vegetazione Sentinel-2, li
      confronta con la media storica e con i dati meteo aperti, e dopo ogni evento estremo verifica i campi colpiti. Il perito
      approva il report prima dell''invio alla compagnia.'
    en: 'For insurers and crop-protection consortia: upload policies, an agent computes Sentinel-2 vegetation indices, compares
      them with the historical average and open weather data, and checks the hit fields after every extreme event. The surveyor
      approves the report before it goes to the company.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f4d2b'
      accent: '#c98a1b'
      background: '#f7f6f0'
      foreground: '#1c241d'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Rischio
      color: primary
    - text: Campi
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Fonti
        en: Sources
      href: '#fonti'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  limits:
  - action: agent:analyst
    per: user
    max: 10
    window: day
    roles:
    - user
  agents:
  - key: analyst
    role: main
    description: 'Imports the uploaded policy list and scores every field: vegetation indices vs. zone history, weather hazards,
      risk score.'
    mcpServers:
    - name: webrobot
      url: https://mcp-full.webrobot.eu/mcp
      allow: all
    profile:
      inline:
        display_name: RischioCampi analyst
        crews:
        - id: analyst
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You are an agronomic risk analyst for insurers. Input: a policy list (CSV text) with policy number,
            holder, crop, hectares and either lat/lon or cadastral parcel. Steps: 1) save each policy with save_policies (policy_number,
            holder, crop, hectares, lat, lon, parcel). If only an address, comune or parcel is given, use geocode (Nominatim,
            max 1 request per second) for an approximate centroid and flag it as approximate. 2) For each field find recent
            Sentinel-2 L2A scenes with stac_search (collection sentinel-2-l2a, bbox around the point, low cloud cover) and
            compute NDVI (B08,B04) for the field and for the same weeks of previous years in the surrounding zone, by building
            and running a pipeline through the WebRobot MCP (never write code yourself). 3) Get weather with weather_archive
            (hail proxy: weather codes 96/99 and gusts; drought: precipitation sums and ET0 deficit; frost: daily minimum
            temperature below crop threshold). 4) Give each field a risk score 0-100 and, if an event occurred, a damage estimate
            in % of area with a range, and save with save_scores (policy_number, date, score, ndvi, ndvi_zone_avg, ndvi_delta_pct,
            main_hazard, damage_pct, confidence, note). Never invent figures: if imagery is cloudy or data missing, say so
            and lower confidence. This is decision support, not a loss adjustment. Report format: a level-1 title ''# Rischio
            portafoglio — <company> — <date>'', then ## Sintesi, ## Campi per priorità (table: policy, crop, ha, score, main
            hazard, damage estimate, confidence), ## Metodo e fonti, ## Limiti. Add a ```chart block (bar) with the top 10
            scores. Write in the requested language.'
    appTools:
    - name: save_policies
      description: Save a policy record for the user
      action: append
      collection: policies
      scope: user
    - name: read_policies
      description: Read the user's policies
      action: read
      collection: policies
      scope: user
    - name: save_scores
      description: Save the risk score of a field
      action: append
      collection: field_scores
      scope: user
    - name: stac_search
      description: Search Sentinel-2 L2A scenes (Earth Search STAC)
      action: http
      http:
        method: POST
        url: https://earth-search.aws.element84.com/v1/search
        attribution: Contains modified Copernicus Sentinel data, via Earth Search (Element 84)
    - name: weather_archive
      description: Historical daily weather (Open-Meteo archive)
      action: http
      http:
        method: GET
        url: https://archive-api.open-meteo.com/v1/archive
        attribution: Weather data by Open-Meteo.com, CC BY 4.0
    - name: geocode
      description: Geocode a comune or address (Nominatim)
      action: http
      http:
        method: GET
        url: https://nominatim.openstreetmap.org/search
        attribution: © OpenStreetMap contributors, ODbL
    goalTemplate: 'Compagnia: {company}.

      {?crop_filter}Solo coltura: {crop_filter}.{/crop_filter}

      Ettari totali dichiarati: {total_ha}.

      Elenco polizze (CSV):

      {portfolio_text}

      {?notes}Note: {notes}{/notes}

      Oggi è {date}. Scrivi il report in lingua ISO {lang}.'
    output: markdown
    limits:
      maxTurns: 40
      maxBudgetUsd: 3
  - key: scanner
    role: scheduled
    description: Daily scan of open weather data for extreme events (hail, drought, frost) over the agricultural provinces;
      writes public events.
    profile:
      inline:
        display_name: RischioCampi event scanner
        crews:
        - id: scanner
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You detect extreme weather events over the main Italian agricultural areas (use about 30 representative
            points across the plains and hills: Po valley, Veneto, Emilia-Romagna, Puglia, Sicily, etc.). For each point call
            weather_forecast with past_days=2 and daily/hourly variables: weather_code, wind_gusts_10m_max, precipitation_sum,
            temperature_2m_min. An event is: hail/severe thunderstorm (weather codes 96, 99 with strong gusts), frost (min
            below -2 °C in the growing season or below 0 after budburst), drought (use only when the 30-day precipitation
            is far below normal). For each new event call save_event once with: event_key (type-area-date), event_date (YYYY-MM-DD),
            type (hail|frost|drought|storm), area, lat, lon, radius_km, severity (1-5), source. Skip duplicates (read_events
            first). Never invent events; if nothing happened, save nothing and say so in one line.'
    appTools:
    - name: weather_forecast
      description: Recent and forecast weather (Open-Meteo)
      action: http
      http:
        method: GET
        url: https://api.open-meteo.com/v1/forecast
        attribution: Weather data by Open-Meteo.com, CC BY 4.0
    - name: read_events
      description: Events already recorded
      action: read
      collection: weather_events
      scope: all
    - name: save_event
      description: Record an extreme weather event
      action: append
      collection: weather_events
      scope: all
    output: markdown
  - key: watcher
    role: helper
    description: 'For one company: after a recorded extreme event, verifies the affected fields and prepares the inspection
      report, which the surveyor approves.'
    awaits:
    - send_to_company
    memory: instance
    profile:
      inline:
        display_name: RischioCampi post-event verifier
        crews:
        - id: watcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 2.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You verify insured fields after extreme weather events for one insurance company. 1) read_events
            and keep events from the last 3 days not already handled (your memory lists handled event_keys). If there are
            none, answer with one line ''# Nessun evento da verificare'' and stop. 2) read_policies and select the fields
            whose lat/lon fall within the event radius (plus 10 km margin). 3) For each, find the latest cloud-free Sentinel-2
            scenes before and after the event with stac_search and compute NDVI change and the anomaly against the zone''s
            historical average for the same period, by running a pipeline through the WebRobot MCP (never write code). Add
            weather_archive for the event day. 4) Estimate damage % per field with a range and a confidence; if the post-event
            imagery is still cloudy, say ''da riverificare'' and give a provisional estimate only from weather. Save each
            with save_scores. 5) Write the report: ''# Verifica post-evento — <event type> <area> — <date>'', ## Sintesi,
            ## Campi da ispezionare in ordine di priorità (table: priority, policy, holder, crop, ha, damage estimate, confidence,
            why), ## Metodo e fonti, ## Limiti. Save it with save_report (title, event_key, company_email, status ''pending'',
            body, fields_count) and then call request_send_to_company so the surveyor can approve. Never state figures you
            did not compute; this is decision support, not a loss adjustment. At the end call remember with the handled event_keys.'
    appTools:
    - name: read_events
      description: Recorded extreme events
      action: read
      collection: weather_events
      scope: all
    - name: read_policies
      description: Read the user's policies
      action: read
      collection: policies
      scope: user
    - name: save_scores
      description: Save the risk score of a field
      action: append
      collection: field_scores
      scope: user
    - name: save_report
      description: Save the inspection report
      action: append
      collection: inspection_reports
      scope: user
    - name: stac_search
      description: Search Sentinel-2 L2A scenes (Earth Search STAC)
      action: http
      http:
        method: POST
        url: https://earth-search.aws.element84.com/v1/search
        attribution: Contains modified Copernicus Sentinel data, via Earth Search (Element 84)
    - name: weather_archive
      description: Historical daily weather (Open-Meteo archive)
      action: http
      http:
        method: GET
        url: https://archive-api.open-meteo.com/v1/archive
        attribution: Weather data by Open-Meteo.com, CC BY 4.0
    output: markdown
  - key: dispatcher
    role: helper
    description: Marks an approved report as sent so the company is notified.
    profile:
      inline:
        display_name: RischioCampi dispatcher
        crews:
        - id: dispatcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You find the latest inspection report with status 'pending' (read_reports) and set it to status 'sent'
            with save_report_status (same record, status 'sent'). Answer in one line.
    appTools:
    - name: read_reports
      description: Read the user's inspection reports
      action: read
      collection: inspection_reports
      scope: user
    - name: save_report_status
      description: Update the status of an inspection report
      action: write
      collection: inspection_reports
      scope: user
    output: markdown
  inputForm:
    title:
      it: Analisi portafoglio
      en: Portfolio analysis
    fields:
    - name: company
      type: text
      required: true
      label:
        it: Compagnia / consorzio
        en: Company / consortium
    - name: portfolio
      type: file
      required: true
      accept:
      - csv
      - xlsx
      - txt
      maxMb: 10
      label:
        it: Elenco polizze (CSV/Excel)
        en: Policy list (CSV/Excel)
      help:
        it: 'Colonne: numero polizza, contraente, coltura, ettari, lat, lon oppure particella catastale'
        en: 'Columns: policy number, holder, crop, hectares, lat, lon or cadastral parcel'
    - name: total_ha
      type: number
      required: true
      label:
        it: Ettari totali
        en: Total hectares
    - name: crop_filter
      type: text
      label:
        it: Solo coltura (facoltativo)
        en: Only crop (optional)
    - name: notes
      type: textarea
      maxLength: 400
      label:
        it: Note (facoltative)
        en: Notes (optional)
  data:
    collections:
    - name: policies
      ownedBy: user
      description: Insured fields of each company
      fields:
      - name: policy_number
        type: text
        required: true
        label:
          it: Numero polizza
          en: Policy number
      - name: holder
        type: text
        label:
          it: Contraente
          en: Holder
      - name: crop
        type: text
        required: true
        label:
          it: Coltura
          en: Crop
      - name: hectares
        type: number
        required: true
        label:
          it: Ettari
          en: Hectares
      - name: parcel
        type: text
        label:
          it: Particella catastale
          en: Cadastral parcel
      - name: lat
        type: number
        label: Lat
      - name: lon
        type: number
        label: Lon
    - name: field_scores
      ownedBy: user
      description: Risk scores and damage estimates per field
      retentionDays: 1825
      fields:
      - name: policy_number
        type: text
      - name: date
        type: date
      - name: score
        type: number
      - name: ndvi
        type: number
      - name: ndvi_zone_avg
        type: number
      - name: ndvi_delta_pct
        type: number
      - name: main_hazard
        type: text
      - name: damage_pct
        type: number
      - name: confidence
        type: text
      - name: note
        type: textarea
    - name: weather_events
      ownedBy: app
      description: Extreme weather events detected from open data
      fields:
      - name: event_key
        type: text
      - name: event_date
        type: date
      - name: type
        type: text
      - name: area
        type: text
      - name: lat
        type: number
      - name: lon
        type: number
      - name: radius_km
        type: number
      - name: severity
        type: number
      - name: source
        type: text
    - name: inspection_reports
      ownedBy: user
      description: Post-event inspection reports, sent to the company after approval
      retentionDays: 1825
      fields:
      - name: title
        type: text
      - name: event_key
        type: text
      - name: company_email
        type: email
      - name: status
        type: select
        options:
        - pending
        - sent
      - name: fields_count
        type: number
      - name: body
        type: textarea
  views:
  - key: home
    type: page
    nav: false
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow:
        it: Per assicurazioni e consorzi di difesa
        en: For insurers and crop-protection consortia
      title:
        it: Sai **quali campi ispezionare**, prima che arrivi la denuncia.
        en: Know **which fields to inspect** before the claim arrives.
      text:
        it: 'Carica le polizze: un agente calcola indici di vegetazione da Sentinel-2, li confronta con la storia della zona
          e con il meteo aperto, e dopo ogni evento estremo ti consegna i campi da ispezionare in ordine di priorità.'
        en: 'Upload your policies: an agent computes Sentinel-2 vegetation indices, compares them with the zone''s history
          and open weather, and after each extreme event hands you the fields to inspect in priority order.'
      actions:
      - label:
          it: Inizia
          en: Start
        href: /v/new_analysis
        style: primary
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Carica le polizze
          en: Upload policies
        text:
          it: Coordinate o particelle, coltura ed ettari. Ogni compagnia vede solo le sue.
          en: Coordinates or parcels, crop and hectares. Each company sees only its own.
        badge: 📄
      - title:
          it: Punteggio di rischio
          en: Risk score
        text:
          it: NDVI contro la media storica della zona, più grandine, siccità e gelate.
          en: NDVI against the zone's historical average, plus hail, drought and frost.
        badge: 🛰️
      - title:
          it: Verifica dopo l'evento
          en: Post-event check
        text:
          it: Ogni giorno l'app controlla gli eventi estremi e verifica i campi colpiti.
          en: Every day the app checks extreme events and verifies the hit fields.
        badge: ⛈️
      - title:
          it: Il perito approva
          en: Surveyor approves
        text:
          it: Il report con le priorità parte verso la compagnia solo dopo la tua approvazione.
          en: The prioritised report goes to the company only after your approval.
        badge: ✅
    - type: cards
      id: fonti
      title:
        it: Fonti aperte
        en: Open sources
      items:
      - title: Sentinel-2
        text:
          it: Immagini Copernicus Sentinel-2 L2A (via Earth Search).
          en: Copernicus Sentinel-2 L2A imagery (via Earth Search).
      - title: Open-Meteo
        text:
          it: Meteo storico e recente, CC BY 4.0.
          en: Historical and recent weather, CC BY 4.0.
    - type: note
      content:
        it: Supporto alle decisioni del perito, non una perizia di danno. Le stime hanno un intervallo e un livello di confidenza.
        en: Decision support for the surveyor, not a loss adjustment. Estimates come with a range and a confidence level.
  - key: new_analysis
    type: new_run
    title:
      it: Nuova analisi
      en: New analysis
    roles:
    - user
    - admin
  - key: analyses
    type: history
    title:
      it: Le mie analisi
      en: My analyses
    source: run
    roles:
    - user
    - admin
  - key: analysis
    type: report
    source: run
    printable: true
    nav: false
  - key: add_policy
    type: form
    title:
      it: Aggiungi polizza
      en: Add policy
    collection: policies
    fields:
    - policy_number
    - holder
    - crop
    - hectares
    - parcel
    - lat
    - lon
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Polizza salvata
        en: Policy saved
      redirect: policies
    roles:
    - user
    - admin
  - key: policies
    type: table
    title:
      it: Polizze
      en: Policies
    source: collection:policies
    columns:
    - policy_number
    - holder
    - crop
    - hectares
    - parcel
    - lat
    - lon
    export: true
    roles:
    - user
    - admin
  - key: scores
    type: table
    title:
      it: Punteggi di rischio
      en: Risk scores
    source: collection:field_scores
    columns:
    - policy_number
    - date
    - score
    - ndvi
    - ndvi_zone_avg
    - ndvi_delta_pct
    - main_hazard
    - damage_pct
    - confidence
    export: true
    roles:
    - user
    - admin
  - key: map
    type: map
    title:
      it: Mappa campi
      en: Field map
    source: collection:policies
    map:
      lat: lat
      lon: lon
      title: policy_number
      popup:
      - holder
      - crop
      - hectares
    roles:
    - user
    - admin
  - key: watches
    type: instances
    template: event_watch
    title:
      it: Verifica automatica eventi
      en: Automatic event check
    roles:
    - user
    - admin
  - key: approvals
    type: approvals
    title:
      it: Da approvare
      en: To approve
    approvals:
    - send_to_company
    roles:
    - user
    - admin
  - key: reports
    type: table
    title:
      it: Report inviati
      en: Reports
    source: collection:inspection_reports
    columns:
    - title
    - event_key
    - fields_count
    - status
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Crediti
      en: Credits
    roles:
    - user
  templates:
  - key: event_watch
    title:
      it: Verifica eventi per compagnia
      en: Event check per company
    description:
      it: Ogni giorno controlla se un evento estremo ha colpito i tuoi campi e prepara il report da approvare.
      en: Every day checks whether an extreme event hit your fields and prepares the report to approve.
    agent: watcher
    params:
    - name: company
      type: text
      required: true
      label:
        it: Compagnia
        en: Company
    - name: company_email
      type: email
      required: true
      label:
        it: Email a cui inviare il report approvato
        en: Email for the approved report
    goal: 'Compagnia "{instance}": {company}. Email destinatario: {company_email}. Oggi è {date}. Verifica gli eventi estremi
      recenti sui campi delle polizze e prepara il report. Scrivi in lingua ISO {lang}.'
    schedule:
      cron: 0 8 * * *
      userCanChange: false
    maxPerUser: 3
    cost:
      perRun: 5
  approvals:
  - key: send_to_company
    title:
      it: Invia il report alla compagnia
      en: Send the report to the company
    description: The surveyor reviews the prioritised inspection list before it goes to the company
    decidedBy: requester
    timeoutMinutes: 10080
    onTimeout: reject
  triggers:
  - key: report_approved
    'on':
      approval: send_to_company
      decision: approved
    start:
      agent: dispatcher
    goal: 'Report approved: {event}. Mark it as sent.'
  - key: report_sent
    'on':
      collection: inspection_reports
      op: update
      where:
        status: sent
    notify:
      to:
      - record.company_email
      - owner
      subject:
        it: 'RischioCampi: {record.title}'
        en: 'RischioCampi: {record.title}'
      body:
        it: Il perito ha approvato il report di verifica post-evento ({record.fields_count} campi). Consultalo nell'app.
        en: The surveyor approved the post-event verification report ({record.fields_count} fields). Open it in the app.
      link: reports
  schedules:
  - agent: scanner
    cron: 0 6 * * *
    action: run
    owner: app
    goal: Today is {date}. Scan for extreme weather events over the last 2 days and record the new ones.
  notifications:
    emailOnRunDone: true
  egress:
    hosts:
    - earth-search.aws.element84.com
    - api.open-meteo.com
    - archive-api.open-meteo.com
    - nominatim.openstreetmap.org
    notes: 'Earth Search STAC: open Sentinel-2 metadata (Copernicus open licence). Open-Meteo: CC BY 4.0, free tier is non-commercial
      — a commercial plan is needed in production. Nominatim: ODbL, max 1 request/second, occasional geocoding only.'
  billing:
    modes:
    - credits
    signupCredits: 100
    costs:
      agent:analyst:
        perUnit:
          field: total_ha
          credits: 1
          min: 50
    packs:
    - key: s
      credits: 1000
      price: 900
      label: 1.000 ha
    - key: m
      credits: 10000
      price: 8000
      label: 10.000 ha
  extensions:
  - key: annual_per_hectare
    description: Pricing per monitored hectare per year is approximated with credits per hectare (1 credit = 1 ha-year); a
      real annual subscription billed on the hectares in the policy list is not available yet.
  - key: cadastral_parcels
    description: Cadastral parcels are only geocoded approximately (Nominatim centroid); exact parcel polygons from the Agenzia
      delle Entrate cadastre are not wired in — coordinates are preferable.
  - key: ndvi_via_pipeline
    description: NDVI is computed by the agent through a WebRobot pipeline over Sentinel-2 assets; results depend on cloud
      cover and are shown with a confidence level.
