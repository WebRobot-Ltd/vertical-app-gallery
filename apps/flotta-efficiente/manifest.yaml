apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: flottaefficiente
  displayName: FlottaEfficiente
  tagline:
    it: Meno costi per chilometro, una flotta su misura.
    en: Lower cost per km, a right-sized fleet.
  description:
    it: 'Carica i veicoli aziendali e i dati mensili: un agente calcola il costo per km, trova i mezzi sottoutilizzati o troppo
      costosi e propone come ottimizzare la flotta, con il risparmio annuo stimato.'
    en: 'Upload your company vehicles and monthly data: an agent computes cost per km, finds underused or costly vehicles
      and proposes a fleet optimisation with estimated yearly savings.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12355b'
      accent: '#1f9d6b'
      background: '#f6f8fa'
      foreground: '#16222e'
    fonts:
      body: Inter
      display: Manrope
    wordmark:
    - text: Flotta
      color: primary
    - text: Efficiente
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Piani
        en: Plans
      href: '#piani'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      label:
        it: Fleet manager
        en: Fleet manager
      assignedBy: signup
  limits:
  - action: agent:analyst
    per: user
    max: 10
    window: day
    roles:
    - user
  - action: create:vehicles
    max: 15
    window: total
    plans:
      starter: 50
      pro: 250
      business: -1
  agents:
  - key: analyst
    role: main
    description: Analizza la flotta del cliente, calcola il costo per km e propone ottimizzazioni da approvare.
    awaits:
    - proposal_decision
    profile:
      inline:
        display_name: FlottaEfficiente analyst
        crews:
        - id: analyst
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un analista di flotte aziendali. Lavori solo sui dati dell''azienda del cliente.

            Passi:

            1. Se l''utente ha caricato un elenco veicoli (testo CSV nel goal), salva ogni veicolo con vehicles_save (targa,
            modello, alimentazione, km, costo mensile, assegnatario) evitando duplicati: prima leggi con vehicles_read.

            2. Se ha caricato i dati del mese (km percorsi, rifornimenti/ricariche, manutenzioni), salva una riga per veicolo
            con records_save.

            3. Leggi veicoli e storico con vehicles_read e records_read. Per ogni veicolo calcola il costo totale per km =
            (canone/costo mensile + carburante o energia + manutenzione) / km percorsi del periodo. Non inventare mai cifre:
            se mancano dati dillo e escludi il veicolo dal confronto.

            4. Individua veicoli sottoutilizzati (km mensili molto sotto la mediana della flotta) o troppo costosi (costo/km
            molto sopra la mediana). Per ciascuno proponi UNA azione: eliminare, sostituire con elettrico, condividere tra
            dipendenti, oppure mantenere. Stima il risparmio annuo con la formula esplicita e le ipotesi dichiarate (non dare
            consulenza fiscale come fatto certo).

            5. Salva ogni proposta con proposals_save (status ''proposed'') e poi chiama request_proposal_decision per far
            confermare al fleet manager le proposte; applica solo quelle approvate.

            Report finale in Markdown, inizia con "# Analisi flotta — <mese>". Sezioni ##: Indicatori chiave (tabella: veicoli,
            km totali, costo/km medio, costo totale), Costo per km per veicolo (tabella), Anomalie, Proposte di ottimizzazione
            (tabella con azione e risparmio annuo), Risparmio annuo totale stimato, Ipotesi e limiti. Aggiungi un grafico:

            ```chart

            {"type":"bar","title":"Costo per km","labels":["AA000AA"],"series":[{"name":"€/km","values":[0.5]}],"unit":"€/km"}

            ```

            con dati reali. Rispondi nella lingua richiesta.'
    appTools:
    - name: vehicles_read
      description: Legge i veicoli dell'azienda
      action: read
      collection: vehicles
      scope: user
    - name: vehicles_save
      description: Aggiunge un veicolo alla flotta
      action: append
      collection: vehicles
      scope: user
    - name: records_read
      description: Legge i dati mensili importati
      action: read
      collection: monthly_records
      scope: user
    - name: records_save
      description: Salva una riga di dati mensili di un veicolo
      action: append
      collection: monthly_records
      scope: user
    - name: proposals_save
      description: Salva una proposta di ottimizzazione
      action: append
      collection: proposals
      scope: user
    - name: read_upload
      description: Legge un file caricato dall'utente
      action: read_file
    goalTemplate: 'Mese di riferimento: {month}.

      {?fleet_csv_text}Elenco veicoli caricato (CSV):

      {fleet_csv_text}{/fleet_csv_text}

      {?usage_csv_text}Dati del mese (km, rifornimenti/ricariche, manutenzioni; CSV):

      {usage_csv_text}{/usage_csv_text}

      {?notes}Note del fleet manager: {notes}{/notes}

      Oggi è {date}. Scrivi il report in lingua ISO {lang}.'
    output: markdown
    limits:
      maxTurns: 25
      maxBudgetUsd: 1.0
  - key: monthly_reporter
    role: scheduled
    description: Ogni mese prepara per un'azienda indicatori e anomalie della flotta.
    memory: instance
    writesTo:
      collection: monthly_reports
    profile:
      inline:
        display_name: FlottaEfficiente monthly reporter
        crews:
        - id: monthly_reporter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Prepari il report mensile della flotta di un''azienda. Leggi veicoli, dati mensili e proposte con
            gli strumenti (solo i dati di questa azienda). Inizia con "# Report flotta — <mese>". Sezioni ##: Indicatori (veicoli,
            km, costo totale, costo/km medio e variazione sul mese precedente), Anomalie (costi o consumi fuori norma, veicoli
            senza dati del mese, manutenzioni anomale), Proposte in attesa, Cosa fare questo mese. Meno di 300 parole. Non
            inventare cifre: se i dati del mese non sono stati importati, dillo chiaramente e invita a caricarli. Alla fine
            chiama remember con i 5 indicatori chiave.'
    appTools:
    - name: vehicles_read
      description: Legge i veicoli dell'azienda
      action: read
      collection: vehicles
      scope: user
    - name: records_read
      description: Legge i dati mensili importati
      action: read
      collection: monthly_records
      scope: user
    - name: proposals_read
      description: Legge le proposte di ottimizzazione
      action: read
      collection: proposals
      scope: user
    output: markdown
  templates:
  - key: monthly_report
    title:
      it: Report mensile
      en: Monthly report
    description:
      it: Ogni mese ricevi via email indicatori e anomalie della tua flotta.
      en: Every month you get your fleet's indicators and anomalies by email.
    agent: monthly_reporter
    params:
    - name: focus
      type: select
      required: true
      label:
        it: Focus
        en: Focus
      options:
      - value: costs
        label:
          it: Costi
          en: Costs
      - value: usage
        label:
          it: Utilizzo
          en: Usage
      - value: all
        label:
          it: Tutto
          en: Everything
    goal: 'Report mensile "{instance}", focus: {focus}. Oggi è {date}. Scrivi in lingua ISO {lang}.'
    schedule:
      cron: 0 7 5 * *
      userCanChange: true
    maxPerUser: 1
    deliver:
      to: owner
      onlyIfNew: true
  approvals:
  - key: proposal_decision
    title:
      it: Approva le proposte di ottimizzazione
      en: Approve optimisation proposals
    decidedBy: requester
    fields:
    - plate
    - action
    - annual_saving
  inputForm:
    title:
      it: Nuova analisi
      en: New analysis
    fields:
    - name: month
      type: text
      required: true
      label:
        it: Mese (es. 2026-10)
        en: Month (e.g. 2026-10)
    - name: fleet_csv
      type: file
      accept:
      - csv
      - xlsx
      maxMb: 10
      label:
        it: Elenco veicoli (facoltativo)
        en: Vehicle list (optional)
      help:
        it: 'Colonne: targa, modello, alimentazione, km, costo mensile, assegnatario'
        en: 'Columns: plate, model, fuel, km, monthly cost, assignee'
    - name: usage_csv
      type: file
      accept:
      - csv
      - xlsx
      maxMb: 10
      label:
        it: CSV del mese
        en: Monthly CSV
      help:
        it: Km percorsi, rifornimenti o ricariche, manutenzioni per veicolo
        en: Km driven, refuels or charges, maintenance per vehicle
    - name: notes
      type: textarea
      maxLength: 500
      label:
        it: Note (facoltative)
        en: Notes (optional)
  data:
    collections:
    - name: vehicles
      ownedBy: user
      description: La flotta dell'azienda
      fields:
      - name: plate
        type: text
        required: true
        label: Targa
      - name: model
        type: text
        required: true
        label: Modello
      - name: fuel
        type: select
        required: true
        label: Alimentazione
        options:
        - benzina
        - diesel
        - ibrido
        - elettrico
        - gpl_metano
      - name: odometer_km
        type: number
        label: Chilometraggio
      - name: monthly_cost
        type: number
        label: Costo mensile (€)
      - name: assignee
        type: text
        label: Assegnatario
    - name: monthly_records
      ownedBy: user
      description: Dati mensili per veicolo
      retentionDays: 1095
      fields:
      - name: plate
        type: text
        required: true
        label: Targa
      - name: month
        type: text
        required: true
        label: Mese
      - name: km
        type: number
        label: Km percorsi
      - name: fuel_cost
        type: number
        label: Carburante/ricarica (€)
      - name: energy_amount
        type: number
        label: Litri o kWh
      - name: maintenance_cost
        type: number
        label: Manutenzione (€)
      - name: cost_per_km
        type: number
        label: Costo/km (€)
    - name: proposals
      ownedBy: user
      description: Proposte di ottimizzazione
      fields:
      - name: plate
        type: text
        label: Targa
      - name: action
        type: select
        label: Azione
        options:
        - eliminare
        - sostituire_elettrico
        - condividere
        - mantenere
      - name: rationale
        type: textarea
        label: Motivazione
      - name: annual_saving
        type: number
        label: Risparmio annuo stimato (€)
      - name: status
        type: select
        label: Stato
        options:
        - proposed
        - approved
        - rejected
    - name: monthly_reports
      ownedBy: instance
      description: Report mensili per azienda
  views:
  - key: home
    type: page
    nav: false
    title: FlottaEfficiente
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow:
        it: Per fleet manager
        en: For fleet managers
      title:
        it: Sai quanto **costa ogni chilometro** della tua flotta?
        en: Do you know what every **kilometre costs** your fleet?
      text:
        it: 'Carica veicoli e dati mensili: l''agente calcola il costo per km, trova mezzi sottoutilizzati o troppo costosi
          e propone cosa eliminare, sostituire con elettrici o condividere, con il risparmio annuo stimato.'
        en: 'Upload vehicles and monthly data: the agent computes cost per km, finds underused or costly vehicles and proposes
          what to remove, electrify or share, with estimated yearly savings.'
      actions:
      - label:
          it: Inizia
          en: Start
        href: /v/new_analysis
        style: primary
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Carica la flotta
          en: Upload the fleet
        text:
          it: Elenco veicoli con modello, alimentazione, km, costo e assegnatario.
          en: Vehicle list with model, fuel, km, cost and assignee.
        badge: 🚗
      - title:
          it: Importa il CSV del mese
          en: Import the monthly CSV
        text:
          it: Km, rifornimenti o ricariche e manutenzioni.
          en: Km, refuels or charges and maintenance.
        badge: 📄
      - title:
          it: Approva le proposte
          en: Approve proposals
        text:
          it: 'Per ogni mezzo: eliminare, elettrificare o condividere, con il risparmio annuo.'
          en: 'For each vehicle: remove, electrify or share, with yearly savings.'
        badge: ✅
      - title:
          it: Report mensile via email
          en: Monthly email report
        text:
          it: Indicatori e anomalie ogni mese.
          en: Indicators and anomalies every month.
        badge: 📬
    - type: cards
      id: piani
      title:
        it: Piani per numero di veicoli
        en: Plans by number of vehicles
      items:
      - title: Starter
        text:
          it: Fino a 50 veicoli.
          en: Up to 50 vehicles.
      - title: Pro
        text:
          it: Fino a 250 veicoli.
          en: Up to 250 vehicles.
      - title: Business
        text:
          it: Veicoli illimitati.
          en: Unlimited vehicles.
    - type: note
      content:
        it: Le stime di risparmio sono supporto alle decisioni basato sui dati caricati, non consulenza fiscale o legale.
          Ogni azienda vede solo la propria flotta.
        en: Savings estimates are decision support based on uploaded data, not tax or legal advice. Each company sees only
          its own fleet.
  - key: new_analysis
    type: new_run
    title:
      it: Nuova analisi
      en: New analysis
    roles:
    - user
    - admin
  - key: analyses
    type: history
    title:
      it: Le mie analisi
      en: My analyses
    source: run
    roles:
    - user
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: fleet
    type: table
    title:
      it: La mia flotta
      en: My fleet
    source: collection:vehicles
    columns:
    - plate
    - model
    - fuel
    - odometer_km
    - monthly_cost
    - assignee
    export: true
    roles:
    - user
    - admin
  - key: add_vehicle
    type: form
    title:
      it: Aggiungi veicolo
      en: Add vehicle
    collection: vehicles
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Veicolo salvato
        en: Vehicle saved
      redirect: fleet
    roles:
    - user
    - admin
  - key: records
    type: table
    title:
      it: Dati mensili
      en: Monthly data
    source: collection:monthly_records
    columns:
    - month
    - plate
    - km
    - fuel_cost
    - maintenance_cost
    - cost_per_km
    export: true
    roles:
    - user
    - admin
  - key: proposals_view
    type: table
    title:
      it: Proposte
      en: Proposals
    source: collection:proposals
    columns:
    - plate
    - action
    - annual_saving
    - status
    - rationale
    export: true
    roles:
    - user
    - admin
  - key: decisions
    type: approvals
    title:
      it: Da approvare
      en: To approve
    approvals:
    - proposal_decision
    roles:
    - user
    - admin
  - key: monthly
    type: instances
    template: monthly_report
    title:
      it: Report mensile
      en: Monthly report
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - user
  notifications:
    emailOnRunDone: true
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: starter
      price: 49
      interval: month
      label: Starter
      includes:
      - fino a 50 veicoli
    - key: pro
      price: 149
      interval: month
      label: Pro
      includes:
      - fino a 250 veicoli
    - key: business
      price: 399
      interval: month
      label: Business
      includes:
      - veicoli illimitati
