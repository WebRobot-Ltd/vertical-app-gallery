apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: affitti-medio-lungo
  displayName: Affitti Medio-Lungo
  tagline:
    it: 'Cerca, candidati e prenota una visita: l''alloggio giusto per mesi o anni.'
    en: 'Search, apply and book a viewing: the right home for months or years.'
  description:
    it: 'Portale software per affitti a medio e lungo termine: gli inquilini cercano con l''aiuto di un agente AI, i gestori
      pubblicano gli alloggi e valutano le candidature. La trattativa e la firma del contratto restano all''operatore dell''agenzia,
      fuori dalla piattaforma.'
    en: 'Software portal for mid and long-term rentals: tenants search with the help of an AI agent, managers publish homes
      and review applications. Negotiation and contract signing stay with the agency operator, outside the platform.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f3a4d'
      accent: '#e0703a'
      background: '#faf8f5'
      foreground: '#1c2329'
    fonts:
      body: Inter
      display: DM Serif Display
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    cta:
      label:
        it: Cerca casa
        en: Find a home
      href: /v/search
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: manager
      label:
        it: Gestore
        en: Property manager
      assignedBy: admin
    - key: tenant
      label:
        it: Inquilino
        en: Tenant
      assignedBy: signup
  limits:
  - action: agent:matcher
    per: user
    max: 10
    window: day
    roles:
    - tenant
  agents:
  - key: matcher
    role: main
    description: Proposes the listings published on the platform that fit the tenant's request and explains why.
    profile:
      inline:
        display_name: Rental matcher
        crews:
        - id: matcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You help tenants find mid and long-term rentals. You may propose ONLY listings returned by the tool
            search_listings (read it with the tenant''s city, then filter by budget, dates, duration and preferences yourself).
            Never invent listings, prices or availability, and never suggest listings from other sources. Start with a level-1
            title "# Alloggi per te in <city>" (in the user''s language). Then: ## Riepilogo della richiesta; ## Alloggi consigliati
            (up to 5, each with title, rent, available from, minimum stay, and 2-3 bullet reasons it fits, plus any trade-off);
            ## Cosa non è stato trovato (unmet preferences); ## Prossimi passi (save favourites, apply, book a viewing from
            the listing). If nothing matches, say so plainly and suggest which criterion to relax. You are software support,
            not a real-estate agent: do not give legal advice or promise acceptance of an application. Use the listing id
            so the app can link it.'
    goalTemplate: 'Tenant request:

      City: {city}

      Max monthly budget: {budget} EUR

      Move-in date: {move_in}

      Duration (months): {duration_months}

      {?bedrooms}Minimum bedrooms: {bedrooms}{/bedrooms}

      {?preferences}Preferences: {preferences}{/preferences}

      Today is {date}. Write the answer in the language with ISO code {lang}.'
    appTools:
    - name: search_listings
      description: Read the published rental listings
      action: search
      collection: listings
      scope: all
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.4
  inputForm:
    title:
      it: Cerca un alloggio
      en: Find a home
    fields:
    - name: city
      type: city
      required: true
      label:
        it: Città
        en: City
    - name: budget
      type: number
      required: true
      label:
        it: Budget mensile massimo (€)
        en: Maximum monthly budget (€)
    - name: move_in
      type: date
      required: true
      label:
        it: Data di ingresso
        en: Move-in date
    - name: duration_months
      type: select
      required: true
      label:
        it: Durata
        en: Duration
      options:
      - value: '3'
        label:
          it: 3 mesi
          en: 3 months
      - value: '6'
        label:
          it: 6 mesi
          en: 6 months
      - value: '12'
        label:
          it: 12 mesi
          en: 12 months
      - value: '24'
        label:
          it: 24 mesi o più
          en: 24 months or more
    - name: bedrooms
      type: number
      label:
        it: Camere minime
        en: Minimum bedrooms
    - name: preferences
      type: textarea
      maxLength: 500
      label:
        it: Preferenze (facoltative)
        en: Preferences (optional)
      help:
        it: es. arredato, animali ammessi, vicino alla metro
        en: e.g. furnished, pets allowed, near the metro
  data:
    collections:
    - name: listings
      ownedBy: shared
      searchable: true
      description: Rental listings published by property managers
      fields:
      - name: title
        type: text
        required: true
      - name: city
        type: city
        required: true
      - name: address
        type: text
      - name: monthly_rent
        type: number
        required: true
      - name: bedrooms
        type: number
      - name: furnished
        type: boolean
      - name: available_from
        type: date
        required: true
      - name: min_months
        type: number
      - name: photo_urls
        type: urls
        help: Links to photos
      - name: description
        type: textarea
      - name: status
        type: select
        options:
        - draft
        - published
        - rented
      - name: manager_email
        type: email
    - name: favorites
      ownedBy: user
      description: Listings saved by the tenant
      fields:
      - name: listing
        type: relation
        relation: listings
      - name: note
        type: text
    - name: applications
      ownedBy: user
      sharing:
      - viewer
      description: Applications sent by the tenant
      fields:
      - name: listing
        type: relation
        relation: listings
        required: true
      - name: message
        type: textarea
      - name: documents_links
        type: urls
        help: Links to documents (ID, income proof)
      - name: status
        type: select
        options:
        - sent
        - in_review
        - accepted
        - rejected
        default: sent
    - name: viewings
      ownedBy: user
      sharing:
      - viewer
      description: Viewing requests
      fields:
      - name: listing
        type: relation
        relation: listings
        required: true
      - name: slot
        type: date
        required: true
      - name: status
        type: select
        options:
        - requested
        - confirmed
        - declined
        default: requested
  views:
  - key: home
    type: page
    nav: false
    title: Affitti Medio-Lungo
    sections:
    - type: hero
      title:
        it: La casa giusta per **mesi o anni**, senza giri a vuoto.
        en: The right home for **months or years**, without the runaround.
      text:
        it: 'Descrivi cosa cerchi: un agente AI ti propone gli alloggi pubblicati dai gestori sulla piattaforma e ti spiega
          perché. Poi salvi, ti candidi e prenoti la visita.'
        en: 'Describe what you need: an AI agent proposes homes published by managers on the platform and explains why. Then
          save, apply and book a viewing.'
      actions:
      - label:
          it: Cerca casa
          en: Find a home
        href: /v/search
        style: primary
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Cerca
          en: Search
        text:
          it: Città, budget, date, durata e preferenze.
          en: City, budget, dates, duration and preferences.
        badge: 🔎
      - title:
          it: Candidati
          en: Apply
        text:
          it: Salva i preferiti, invia la candidatura e prenota una visita.
          en: Save favourites, send your application and book a viewing.
        badge: 📝
      - title:
          it: Firma con l'agenzia
          en: Sign with the agency
        text:
          it: Il gestore valuta; un operatore dell'agenzia segue trattativa e contratto fuori dalla piattaforma.
          en: The manager reviews; an agency operator handles negotiation and contract outside the platform.
        badge: 🤝
    - type: note
      content:
        it: 'Questo è solo il portale software: l''attività di intermediazione immobiliare è svolta dall''agenzia. Gli annunci
          provengono solo dai gestori registrati.'
        en: 'This is the software portal only: real-estate brokerage is carried out by the agency. Listings come only from
          registered managers.'
  - key: search
    type: new_run
    title:
      it: Cerca casa
      en: Find a home
    roles:
    - tenant
    - admin
  - key: searches
    type: history
    title:
      it: Le mie ricerche
      en: My searches
    source: run
    roles:
    - tenant
    - admin
  - key: result
    type: report
    source: run
    printable: true
    nav: false
  - key: favorites_view
    type: table
    title:
      it: Preferiti
      en: Favourites
    source: collection:favorites
    roles:
    - tenant
  - key: my_applications
    type: table
    title:
      it: Le mie candidature
      en: My applications
    source: collection:applications
    data:
      display: table
      fields:
      - key: listing
        label:
          it: Alloggio
          en: Listing
      - key: status
        label:
          it: Stato
          en: Status
        format: badge
      - key: createdAt
        label:
          it: Data
          en: Date
        format: date
      sort:
        field: createdAt
        dir: desc
    roles:
    - tenant
  - key: my_viewings
    type: table
    title:
      it: Le mie visite
      en: My viewings
    source: collection:viewings
    roles:
    - tenant
  - key: my_listings
    type: table
    title:
      it: I miei alloggi
      en: My listings
    source: collection:listings
    roles:
    - manager
    - admin
  - key: received_applications
    type: table
    title:
      it: Candidature ricevute
      en: Received applications
    source: collection:applications
    roles:
    - manager
    - admin
  - key: received_viewings
    type: table
    title:
      it: Visite richieste
      en: Viewing requests
    source: collection:viewings
    roles:
    - manager
    - admin
  - key: admin_all
    type: tabs
    title: Admin
    children:
    - my_listings
    - received_applications
    - received_viewings
    roles:
    - admin
  billing:
    modes:
    - free
  extensions:
  - key: file_upload
    description: 'Document upload for applications and photo upload for listings are not available yet: tenants and managers
      paste links to documents and photos instead.'
  - key: email_updates
    description: Email updates to tenant and manager on application and viewing status are not available yet.
  - key: tenant_manager_chat
    description: Direct chat between tenant and manager (per listing/application) is not expressible yet; communication is
      via the status fields for now.
  - key: viewing_slots
    description: Slot picking against the manager's real availability needs a manager-defined slot calendar; for now the tenant
      proposes a date and the manager confirms.
  - key: manager_scoped_visibility
    description: Managers seeing only their own listings and the applications to them (and the tenant only their own) needs
      per-record ownership across users; the current collections give tenants their own records and shared listings, and the
      admin sees everything.
  - key: contract_commission
    description: The commission on concluded contracts is settled outside the platform by the agency operator after signing;
      the platform records the outcome only. Contract negotiation and signing are out of scope.
