apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: affitti-medio-lungo
  displayName: Affitti Medio-Lungo
  tagline:
    it: 'Cerca, candidati e prenota la visita: tutto in un portale.'
    en: Search, apply and book a viewing, all in one portal.
  description:
    it: 'Portale software per affitti a medio e lungo termine: ricerca guidata da un agente AI, candidature con documenti,
      prenotazione visite e gestione per i gestori. La trattativa e la firma del contratto avvengono fuori dalla piattaforma.'
    en: 'Software portal for mid and long-term rentals: AI-guided search, applications with documents, viewing bookings and
      management for property managers. Negotiation and contract signing happen outside the platform.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f3a4d'
      accent: '#e07a3f'
      background: '#fbf9f6'
      foreground: '#1c242b'
    fonts:
      body: Inter
      display: DM Serif Display
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    cta:
      label:
        it: Cerca casa
        en: Find a home
      href: /v/search
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: manager
      label:
        it: Gestore
        en: Property manager
      assignedBy: invite
    - key: agency
      label:
        it: Operatore agenzia
        en: Agency operator
      assignedBy: invite
    - key: user
      label:
        it: Inquilino
        en: Tenant
      assignedBy: signup
  limits:
  - action: agent:matcher
    per: user
    max: 10
    window: day
    roles:
    - user
  agents:
  - key: matcher
    role: main
    description: Proposes compatible listings from the platform catalogue and explains why.
    profile:
      inline:
        display_name: Rental matcher
        crews:
        - id: matcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You help tenants find mid/long-term rentals ONLY among the listings published on this platform.
            Use the tool search_listings to read them; never invent listings, prices or availability. Start with a level-1
            title "# Alloggi per te — <city>" (in the report language). Then: ## Riepilogo of the request, ## Alloggi consigliati
            (up to 5, each with title, rent, available dates, and a short ''why it fits'' and any trade-off; say the listing
            id so the user can open it), ## Non compatibili ma vicini (optional), ## Prossimi passi (save favourites, apply
            with documents, book a viewing). If nothing matches, say so plainly and suggest relaxing criteria. You are not
            a real-estate broker and give no legal advice; contract negotiation and signing are handled by an agency operator
            outside the platform.'
    goalTemplate: 'City: {city}

      Max monthly budget: {budget} EUR

      Move-in date: {start_date}

      Duration in months: {duration_months}

      {?preferences}Preferences: {preferences}{/preferences}

      Today is {date}. Write the report in the language with ISO code {lang}.'
    output: markdown
    appTools:
    - name: search_listings
      description: Search the published listings
      action: search
      collection: listings
      scope: all
  - key: screener
    role: helper
    description: Links a new application to the listing's manager and summarises it for them.
    profile:
      inline:
        display_name: Application screener
        crews:
        - id: screener
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You process a new rental application. Read the listing with read_listing, then update the application
            record with write_application: set manager_email from the listing''s manager_email and summary to a neutral 3-line
            summary of the applicant''s request versus the listing (rent, dates, documents provided). Do not rate or reject
            the person; the manager decides. Never invent data.'
    goalTemplate: 'New application {record.id} for listing {record.listing}. Record: {event}'
    appTools:
    - name: read_listing
      description: Read a listing
      action: read
      collection: listings
      scope: all
    - name: write_application
      description: Update the application record
      action: write
      collection: applications
      scope: user
  - key: assistant
    role: helper
    description: Answers questions about the platform, listings and the application process.
    profile:
      inline:
        display_name: Rental assistant
        crews:
        - id: assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 5
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You are the assistant of a mid/long-term rental portal. Help tenants and managers with listings (use
            chat_listings), applications and viewings. Answer in the user's language, briefly. Never invent listing data.
            Contract negotiation and signing are done by an agency operator outside the platform; give no legal advice.
    goalTemplate: 'Conversation so far:

      {history}

      New message: {message}

      Answer in the language with ISO code {lang}.'
    appTools:
    - name: chat_listings
      description: Search published listings
      action: search
      collection: listings
      scope: all
  inputForm:
    title:
      it: Cerca un alloggio
      en: Find a home
    fields:
    - name: city
      type: city
      required: true
      label:
        it: Città
        en: City
    - name: budget
      type: number
      required: true
      label:
        it: Budget mensile (€)
        en: Monthly budget (€)
    - name: start_date
      type: date
      required: true
      label:
        it: Data di ingresso
        en: Move-in date
    - name: duration_months
      type: number
      required: true
      label:
        it: Durata (mesi)
        en: Duration (months)
    - name: preferences
      type: textarea
      maxLength: 600
      label:
        it: Preferenze (facoltative)
        en: Preferences (optional)
  data:
    collections:
    - name: listings
      ownedBy: shared
      description: Listings published by property managers
      fields:
      - name: title
        type: text
        required: true
        label:
          it: Titolo
          en: Title
      - name: city
        type: city
        required: true
        label:
          it: Città
          en: City
      - name: address
        type: text
        label:
          it: Zona/indirizzo
          en: Area/address
      - name: rent
        type: number
        required: true
        label:
          it: Canone mensile (€)
          en: Monthly rent (€)
      - name: rooms
        type: number
        label:
          it: Locali
          en: Rooms
      - name: available_from
        type: date
        required: true
        label:
          it: Disponibile dal
          en: Available from
      - name: min_months
        type: number
        label:
          it: Durata minima (mesi)
          en: Minimum months
      - name: description
        type: textarea
        label:
          it: Descrizione
          en: Description
      - name: photos
        type: file
        accept:
        - jpg
        - jpeg
        - png
        - webp
        multiple: true
        maxMb: 10
        label:
          it: Foto
          en: Photos
      - name: required_docs
        type: text
        label:
          it: Documenti richiesti
          en: Required documents
      - name: manager_email
        type: email
        required: true
        label:
          it: Email gestore
          en: Manager email
      - name: status
        type: select
        options:
        - available
        - reserved
        - rented
        default: available
        label:
          it: Stato
          en: Status
    - name: favorites
      ownedBy: user
      fields:
      - name: listing
        type: relation
        relation: listings
        required: true
        optionsFrom: collection:listings
        label:
          it: Alloggio
          en: Listing
      - name: note
        type: text
        label:
          it: Nota
          en: Note
    - name: applications
      ownedBy: user
      description: Tenant applications
      fields:
      - name: listing
        type: relation
        relation: listings
        required: true
        optionsFrom: collection:listings
        label:
          it: Alloggio
          en: Listing
      - name: message
        type: textarea
        label:
          it: Presentazione
          en: Introduction
      - name: documents
        type: file
        accept:
        - pdf
        - jpg
        - png
        multiple: true
        maxMb: 10
        label:
          it: Documenti
          en: Documents
      - name: tenant_email
        type: email
        required: true
        label:
          it: La tua email
          en: Your email
      - name: manager_email
        type: email
      - name: summary
        type: textarea
      - name: status
        type: select
        options:
        - submitted
        - under_review
        - confirmed
        - rejected
        - contract_signed
        default: submitted
      access:
      - role: manager
        where:
          manager_email: '{user.email}'
        can:
        - read
        - write
      - role: agency
        can:
        - read
        - write
    - name: appointments
      ownedBy: user
      description: Viewing bookings
      fields:
      - name: notes
        type: text
        label:
          it: Note
          en: Notes
      - name: tenant_email
        type: email
      access:
      - role: agency
      - role: manager
  views:
  - key: home
    type: page
    nav: false
    title: Affitti Medio-Lungo
    sections:
    - type: hero
      title:
        it: Trova casa per **mesi o anni**, senza giri a vuoto.
        en: Find a home for **months or years**, no runaround.
      text:
        it: Un agente AI propone gli alloggi pubblicati dai gestori che fanno per te. Poi salvi i preferiti, ti candidi con
          i documenti e prenoti la visita.
        en: An AI agent suggests the listings published by managers that fit you. Then save favourites, apply with your documents
          and book a viewing.
      actions:
      - label:
          it: Cerca casa
          en: Find a home
        href: /v/search
        style: primary
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Cerca
          en: Search
        text:
          it: Indica città, budget, date e preferenze.
          en: Enter city, budget, dates and preferences.
        badge: 🔎
      - title:
          it: Candidati e visita
          en: Apply and view
        text:
          it: Carica i documenti e scegli uno slot per la visita.
          en: Upload documents and pick a viewing slot.
        badge: 📄
      - title:
          it: Conferma
          en: Confirmation
        text:
          it: Il gestore valuta; un operatore segue trattativa e firma fuori dalla piattaforma.
          en: The manager reviews; an operator handles negotiation and signing outside the platform.
        badge: ✅
    - type: note
      content:
        it: 'Questo è solo il portale software: l''attività di intermediazione immobiliare è svolta dall''agenzia, fuori dalla
          piattaforma. Commissione sul contratto concluso.'
        en: 'This is the software portal only: real-estate brokerage is carried out by the agency, outside the platform. A
          fee applies on concluded contracts.'
  - key: search
    type: new_run
    title:
      it: Cerca alloggio
      en: Find a home
    roles:
    - user
    - admin
  - key: history
    type: history
    title:
      it: Le mie ricerche
      en: My searches
    source: run
    roles:
    - user
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: browse
    type: cards
    title:
      it: Annunci
      en: Listings
    source: collection:listings
    columns:
    - title
    - city
    - rent
    - available_from
    - status
    roles:
    - user
    - manager
    - agency
    - admin
  - key: favorite
    type: form
    title:
      it: Salva preferito
      en: Save favourite
    collection: favorites
    submit:
      label:
        it: Salva
        en: Save
      redirect: my_favorites
    roles:
    - user
  - key: my_favorites
    type: list
    title:
      it: Preferiti
      en: Favourites
    source: collection:favorites
    roles:
    - user
  - key: apply
    type: form
    title:
      it: Candidati
      en: Apply
    collection: applications
    fields:
    - listing
    - message
    - documents
    - tenant_email
    submit:
      label:
        it: Invia candidatura
        en: Submit application
      message:
        it: Candidatura inviata. Riceverai aggiornamenti via email.
        en: Application sent. You will get updates by email.
      redirect: my_applications
    roles:
    - user
  - key: my_applications
    type: table
    title:
      it: Le mie candidature
      en: My applications
    source: collection:applications
    columns:
    - listing
    - status
    - summary
    roles:
    - user
  - key: book
    type: booking
    title:
      it: Prenota visita
      en: Book a viewing
    collection: appointments
    resources: collection:listings
    fields:
    - notes
    - tenant_email
    slots:
      days:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      from: 09:00
      to: '18:00'
      minutes: 30
      tz: Europe/Rome
      aheadDays: 21
      minNoticeHours: 12
      capacity: 1
    roles:
    - user
  - key: publish
    type: form
    title:
      it: Pubblica annuncio
      en: Publish listing
    collection: listings
    submit:
      label:
        it: Pubblica
        en: Publish
      redirect: browse
    edit: true
    roles:
    - manager
    - admin
  - key: received
    type: table
    title:
      it: Candidature ricevute
      en: Applications received
    source: collection:applications
    columns:
    - listing
    - tenant_email
    - summary
    - status
    export: true
    roles:
    - manager
    - agency
    - admin
  - key: review
    type: form
    title:
      it: Valuta candidatura
      en: Review application
    collection: applications
    fields:
    - status
    edit: true
    submit:
      label:
        it: Aggiorna
        en: Update
      redirect: received
    roles:
    - manager
    - agency
    - admin
    nav: false
  - key: bookings
    type: table
    title:
      it: Visite prenotate
      en: Booked viewings
    source: collection:appointments
    roles:
    - manager
    - agency
    - admin
  - key: chat
    type: chat
    title:
      it: Assistente
      en: Assistant
    source: agent:assistant
    examples:
    - it: Come mi candido?
      en: How do I apply?
    - it: Quali documenti servono?
      en: Which documents are needed?
    placeholder:
      it: Scrivi un messaggio…
      en: Write a message…
    roles:
    - user
    - manager
    - admin
  - key: account
    type: account
    title:
      it: Account
      en: Account
    roles:
    - user
  triggers:
  - key: screen_application
    'on':
      collection: applications
      op: insert
      where:
        status: submitted
    start:
      agent: screener
    goal: 'New application {record.id} for listing {record.listing}. Record: {event}'
  - key: notify_manager_new
    'on':
      collection: applications
      op: update
      where:
        status: submitted
    notify:
      to:
      - record.manager_email
      subject:
        it: Nuova candidatura ricevuta
        en: New application received
      body:
        it: Hai ricevuto una candidatura da {record.tenant_email}. Valutala nel portale.
        en: You received an application from {record.tenant_email}. Review it in the portal.
      link: received
  - key: tenant_confirmed
    'on':
      collection: applications
      op: update
      where:
        status: confirmed
    notify:
      to:
      - owner
      - record.tenant_email
      - role:agency
      subject:
        it: Candidatura confermata
        en: Application confirmed
      body:
        it: La tua candidatura è stata confermata dal gestore. Un operatore dell'agenzia ti contatterà per la trattativa e
          la firma, fuori dalla piattaforma.
        en: Your application was confirmed by the manager. An agency operator will contact you for negotiation and signing,
          outside the platform.
      link: my_applications
  - key: tenant_rejected
    'on':
      collection: applications
      op: update
      where:
        status: rejected
    notify:
      to:
      - record.tenant_email
      subject:
        it: Aggiornamento sulla candidatura
        en: Application update
      body:
        it: Il gestore non ha potuto accettare la tua candidatura. Puoi cercare altri alloggi.
        en: The manager could not accept your application. You can look for other homes.
      link: search
  - key: booking_confirmed
    'on':
      collection: appointments
      op: insert
    notify:
      to:
      - owner
      - record.tenant_email
      subject:
        it: Visita prenotata
        en: Viewing booked
      body:
        it: La tua visita è stata prenotata per il {record.start}.
        en: Your viewing is booked for {record.start}.
      link: book
  - key: viewing_reminder
    'on':
      date:
        collection: appointments
        field: start
        offsetDays: -1
        hour: 8
    notify:
      to:
      - owner
      subject:
        it: Promemoria visita domani
        en: 'Viewing reminder: tomorrow'
      body:
        it: Ricordati della visita prevista per domani.
        en: 'Reminder: your viewing is tomorrow.'
      link: book
  - key: success_fee
    'on':
      collection: applications
      op: update
      where:
        status: contract_signed
    charge:
      credits: 500
      reason: success fee on concluded contract
  billing:
    modes:
    - credits
    signupCredits: 100
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:matcher:
        estimate: 10
        metered: true
    packs:
    - key: small
      credits: 500
      price: 5
      label: Base
    - key: large
      credits: 2000
      price: 18
      label: Plus
  notifications:
    emailOnRunDone: true
  extensions:
  - key: manager_chat
    description: 'Direct human-to-human chat between tenant and manager is not available yet; the assistant chat is provided
      instead. Per-manager filtering of ''my listings'' is also not available: listings are a shared catalogue and each carries
      manager_email.'
  - key: contract_signing
    description: Contract negotiation and signing are done by an agency operator outside the platform; the operator marks
      the application contract_signed, which triggers the fee.
