apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: prestazione-in-campo
  displayName: Prestazione in Campo
  tagline:
    it: Carico, rischio e performance degli atleti, dopo ogni sessione.
    en: Load, risk and performance of your athletes, after every session.
  description:
    it: 'Strato di analisi e reportistica per dati da dispositivi indossabili e telecamere: carico acuto/cronico, confronto
      con la media personale, rischio sovraccarico e proposta di carico per la settimana successiva.'
    en: 'Analysis and reporting layer for wearable and camera data: acute/chronic load, comparison with each athlete''s own
      baseline, overload risk and a proposed load for next week.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#0b3d2e'
      accent: '#e4572e'
      background: '#f6f8f7'
      foreground: '#13201b'
    fonts:
      body: Inter
      display: Barlow Condensed
    wordmark:
    - text: 'Prestazione '
      color: primary
    - text: in Campo
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Ruoli e privacy
        en: Roles and privacy
      href: '#ruoli'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label:
        it: Preparatore atletico
        en: Strength & conditioning coach
      assignedBy: admin_emails
    - key: medico
      label:
        it: Medico
        en: Team doctor
      assignedBy: invite
    - key: allenatore
      label:
        it: Allenatore / staff tecnico
        en: Coach / technical staff
      assignedBy: invite
    - key: atleta
      label:
        it: Atleta
        en: Athlete
      assignedBy: derived
      from: collection:athletes_profile.email
  limits:
  - action: agent:analyst
    per: user
    max: 20
    window: day
  - action: chat
    per: user
    max: 60
    window: day
  agents:
  - key: analyst
    role: main
    description: 'Analizza una sessione: carico acuto/cronico, confronto con la media personale, rischio e proposta di carico.'
    profile:
      inline:
        display_name: Analista del carico
        crews:
        - id: analyst
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 14
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un analista della performance sportiva al servizio dello staff di una squadra. Ricevi i dati
            esportati dai dispositivi di una sessione (distanza, velocità, accelerazioni, frequenza cardiaca, carico) incollati
            come testo o con un link. Usa i tool: athletes_read per la rosa (nome, ruolo, età), load_read per lo storico,
            health_read per peso e storico infortuni (SOLO per tarare il rischio), load_write per salvare una riga per atleta
            con gli indicatori calcolati, risk_write per salvare gli avvisi di rischio. Calcola per ogni atleta: carico della
            sessione, carico acuto (ultimi 7 giorni), cronico (media settimanale delle ultime 4 settimane), rapporto ACWR,
            scostamento % rispetto alla sua media personale. Soglie indicative: ACWR >1.5 rischio alto, 1.3-1.5 attenzione,
            0.8-1.3 zona ottimale, <0.8 sottocarico. Se lo storico è insufficiente dillo e non stimare. Non inventare mai
            valori. REGOLA DI PRIVACY: il report è letto dallo staff tecnico, quindi NON riportare dati sanitari (peso, infortuni
            passati, note mediche): scrivi solo il livello di rischio e, se serve, ''valutazione medica consigliata''. I dettagli
            clinici vanno solo in risk_write (visibile al medico). Non fare diagnosi: sei un supporto alla decisione. Struttura
            del report: titolo ''# Sessione <tipo> — <data>''; ## Sintesi; ## Indicatori per atleta (tabella); ## Atleti a
            rischio sovraccarico; ## Confronto con la media personale; ## Proposta di modulazione del carico per la prossima
            settimana (per atleta o gruppo, con % rispetto al carico attuale); ## Limiti dei dati. Aggiungi un blocco ```chart
            (bar) con ACWR per atleta usando solo valori reali. Scrivi nella lingua richiesta.'
          mcp_servers: []
    appTools:
    - name: athletes_read
      description: 'Rosa: nome, ruolo, età'
      action: read
      collection: athletes_profile
      scope: all
    - name: health_read
      description: Dati sanitari degli atleti
      action: read
      collection: athlete_health
      scope: all
    - name: load_read
      description: Storico indicatori di carico
      action: read
      collection: load_metrics
      scope: all
    - name: load_write
      description: Salva gli indicatori di una sessione per atleta
      action: write
      collection: load_metrics
      scope: all
    - name: risk_write
      description: Salva un avviso di rischio per il medico
      action: write
      collection: risk_alerts
      scope: all
    goalTemplate: 'Sessione: {session_type_label} del {session_date}.

      {?session_name}Nome/avversario: {session_name}{/session_name}

      {?data_url}Link ai dati esportati: {data_url}{/data_url}

      {?data_text}Dati esportati:

      {data_text}{/data_text}

      {?notes}Note dello staff: {notes}{/notes}

      Scrivi il report nella lingua con codice ISO {lang}. Oggi è {date}.'
    output: markdown
    limits:
      maxTurns: 14
      maxBudgetUsd: 0.8
  - key: weekly
    role: scheduled
    description: Riepilogo settimanale per lo staff tecnico (solo indicatori di prestazione).
    profile:
      inline:
        display_name: Riepilogo settimanale
        crews:
        - id: weekly
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Scrivi il riepilogo settimanale per lo staff tecnico leggendo con load_read e athletes_read le sessioni
            degli ultimi 7 giorni. Inizia con ''# Riepilogo settimana <data>''. Sezioni: ## Carico di squadra, ## Atleti da
            monitorare (solo livello di rischio, nessun dato sanitario), ## Migliori e peggiori scostamenti dalla media personale,
            ## Piano di carico suggerito per la prossima settimana. Mai inventare valori; se mancano dati dillo. Italiano,
            poi un breve paragrafo in inglese.'
    appTools:
    - name: athletes_read
      description: 'Rosa: nome, ruolo, età'
      action: read
      collection: athletes_profile
      scope: all
    - name: load_read
      description: Storico indicatori di carico
      action: read
      collection: load_metrics
      scope: all
    goalTemplate: Settimana che termina il {date}. Scrivi il riepilogo.
    writesTo:
      collection: weekly_reports
      parse: whole
      keyBy: week
    output: markdown
  - key: assistant
    role: helper
    description: Chat per confronti tra giocatori o tra partite.
    profile:
      inline:
        display_name: Assistente performance
        crews:
        - id: assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Rispondi alle domande dello staff tecnico confrontando atleti o partite con load_read e athletes_read.
            Rispondi in modo breve, con tabelle quando confronti numeri e, se utile, un blocco ```chart. Non hai accesso ai
            dati sanitari: se te li chiedono, indica di rivolgersi al medico. Non inventare valori; se il dato manca dillo.
            Rispondi nella lingua dell''utente.'
    appTools:
    - name: athletes_read
      description: 'Rosa: nome, ruolo, età'
      action: read
      collection: athletes_profile
      scope: all
    - name: load_read
      description: Storico indicatori di carico
      action: read
      collection: load_metrics
      scope: all
    goalTemplate: 'Conversazione finora:

      {history}


      Nuovo messaggio: {message}

      Lingua: {lang}'
    output: markdown
  inputForm:
    title:
      it: Nuova sessione
      en: New session
    fields:
    - name: session_type
      type: select
      required: true
      label:
        it: Tipo
        en: Type
      options:
      - value: training
        label:
          it: Allenamento
          en: Training
      - value: match
        label:
          it: Partita
          en: Match
    - name: session_date
      type: date
      required: true
      label:
        it: Data
        en: Date
    - name: session_name
      type: text
      label:
        it: Nome / avversario
        en: Name / opponent
    - name: data_text
      type: textarea
      maxLength: 20000
      label:
        it: Dati esportati (CSV incollato)
        en: Exported data (pasted CSV)
      help:
        it: 'Il caricamento di file non è ancora disponibile: incolla il CSV o usa un link.'
        en: 'File upload is not available yet: paste the CSV or use a link.'
    - name: data_url
      type: url
      label:
        it: Link ai dati (alternativa)
        en: Data link (alternative)
    - name: notes
      type: textarea
      maxLength: 500
      label:
        it: Note (facoltative)
        en: Notes (optional)
  data:
    collections:
    - name: athletes_profile
      ownedBy: app
      description: 'Rosa: dati non sanitari'
      fields:
      - name: name
        type: text
        required: true
      - name: position
        type: text
      - name: age
        type: number
      - name: email
        type: email
    - name: athlete_health
      ownedBy: app
      description: 'Dati sanitari: solo medico e preparatore'
      fields:
      - name: athlete
        type: text
        required: true
      - name: weight_kg
        type: number
      - name: injury_history
        type: textarea
      - name: medical_notes
        type: textarea
    - name: load_metrics
      ownedBy: app
      description: Indicatori di prestazione per atleta e sessione
      fields:
      - name: athlete
        type: text
      - name: date
        type: date
      - name: session
        type: text
      - name: distance_m
        type: number
      - name: top_speed_kmh
        type: number
      - name: accelerations
        type: number
      - name: avg_hr
        type: number
      - name: session_load
        type: number
      - name: acute_load
        type: number
      - name: chronic_load
        type: number
      - name: acwr
        type: number
      - name: vs_baseline_pct
        type: number
      - name: risk_level
        type: text
    - name: risk_alerts
      ownedBy: app
      description: 'Avvisi di rischio con dettagli clinici: solo medico'
      fields:
      - name: athlete
        type: text
      - name: date
        type: date
      - name: risk_level
        type: text
      - name: detail
        type: textarea
    - name: weekly_reports
      ownedBy: app
      description: Riepiloghi settimanali
      fields:
      - name: week
        type: text
      - name: title
        type: text
      - name: body
        type: textarea
  views:
  - key: home
    type: page
    nav: false
    title: Prestazione in Campo
    sections:
    - type: hero
      title:
        it: Sai chi è a **rischio** prima che si faccia male.
        en: Know who is at **risk** before they get hurt.
      text:
        it: 'Carica i dati di allenamento e partita: un agente calcola carico acuto e cronico, confronta ogni atleta con la
          sua media e propone come modulare la settimana.'
        en: 'Upload training and match data: an agent computes acute and chronic load, compares each athlete with their own
          baseline and proposes how to adjust the week.'
      actions:
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Rosa
          en: Roster
        text:
          it: Il preparatore crea la rosa con ruolo, età, peso e storico infortuni.
          en: The coach creates the roster with role, age, weight and injury history.
        badge: '1'
      - title:
          it: Dati sessione
          en: Session data
        text:
          it: Dopo ogni sessione si incollano i dati esportati dai dispositivi (per ora manualmente).
          en: After each session the device export is pasted in (manual for now).
        badge: '2'
      - title:
          it: Report
          en: Report
        text:
          it: Report di sessione, riepilogo settimanale e chat per i confronti.
          en: Session report, weekly summary and chat for comparisons.
        badge: '3'
    - type: cards
      id: ruoli
      title:
        it: Ruoli e privacy
        en: Roles and privacy
      items:
      - title:
          it: Medico
          en: Doctor
        text:
          it: Vede i dati sanitari e gli avvisi di rischio.
          en: Sees health data and risk alerts.
      - title:
          it: Allenatore
          en: Coach
        text:
          it: Solo indicatori di prestazione, mai dati sanitari.
          en: Performance indicators only, never health data.
      - title:
          it: Atleta
          en: Athlete
        text:
          it: Solo i propri dati.
          en: Only their own data.
    - type: note
      content:
        it: Supporto alla decisione, non diagnosi medica. Sensori, telecamere ed elaborazione video sono forniti a parte.
        en: Decision support, not a medical diagnosis. Sensors, cameras and video processing are supplied separately.
  - key: new_session
    type: new_run
    title:
      it: Nuova sessione
      en: New session
    roles:
    - admin
    - allenatore
  - key: sessions
    type: history
    title:
      it: Sessioni
      en: Sessions
    source: run
    roles:
    - admin
    - allenatore
    - medico
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: weekly_view
    type: table
    title:
      it: Riepilogo settimanale
      en: Weekly summary
    source: collection:weekly_reports
    columns:
    - week
    - title
    - body
    roles:
    - admin
    - allenatore
    - medico
  - key: assistant_chat
    type: chat
    title:
      it: Chiedi ai dati
      en: Ask the data
    source: agent:assistant
    examples:
    - Confronta Rossi e Bianchi nelle ultime 3 partite
    - Chi ha l'ACWR più alto questa settimana?
    placeholder:
      it: Confronta giocatori o partite…
      en: Compare players or matches…
    roles:
    - admin
    - allenatore
  - key: roster
    type: table
    title:
      it: Rosa
      en: Roster
    source: collection:athletes_profile
    columns:
    - name
    - position
    - age
    - email
    roles:
    - admin
    - allenatore
    - medico
  - key: metrics
    type: table
    title:
      it: Indicatori di prestazione
      en: Performance indicators
    source: collection:load_metrics
    columns:
    - date
    - athlete
    - session
    - session_load
    - acwr
    - vs_baseline_pct
    - risk_level
    roles:
    - admin
    - allenatore
    - medico
    - atleta
  - key: health
    type: table
    title:
      it: Dati sanitari
      en: Health data
    source: collection:athlete_health
    columns:
    - athlete
    - weight_kg
    - injury_history
    - medical_notes
    roles:
    - admin
    - medico
  - key: risks
    type: table
    title:
      it: Avvisi di rischio
      en: Risk alerts
    source: collection:risk_alerts
    columns:
    - date
    - athlete
    - risk_level
    - detail
    roles:
    - admin
    - medico
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - admin
  schedules:
  - agent: weekly
    action: run
    cron: 0 6 * * 1
    owner: app
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 20
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:analyst:
        estimate: 10
        metered: true
    packs:
    - key: extra
      credits: 1000
      price: 10
      label: Extra
    plans:
    - key: season
      price: 1490
      interval: year
      label:
        it: Stagione — per squadra
        en: Season — per team
      credits: 20000
      creditsReset: monthly
      roles:
      - admin
  extensions:
  - key: file_upload
    description: 'I dati dei dispositivi si incollano o si linkano: il caricamento di file non è ancora disponibile.'
  - key: auto_ingest
    description: L'arrivo automatico dei dati da dispositivi/telecamere richiede connettori non ancora disponibili; per ora
      inserimento manuale.
  - key: athlete_own_data
    description: 'La vista ''metrics'' per il ruolo atleta deve essere filtrata ai soli record dell''atleta (match email/nome)
      e il ruolo medico non deve vedere la modifica della rosa: richiede filtro per utente a livello di runtime.'
  - key: record_editing
    description: 'Creazione e modifica di rosa e dati sanitari da parte del preparatore e del medico (form sulle collezioni):
      da completare nello studio.'
  - key: per_team_tenancy
    description: Una installazione per squadra; più squadre nello stesso deployment richiedono un campo team su tutte le collezioni.
  - key: notifications
    description: 'Invio automatico via email del report dopo ogni sessione e del riepilogo settimanale: notifiche non ancora
      disponibili, i report sono consultabili nell''app.'
