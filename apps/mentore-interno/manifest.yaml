apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: mentore-interno
  displayName: Mentore Interno
  tagline:
    it: Il coach AI privato per la crescita di ogni dipendente.
    en: A private AI coach for every employee's growth.
    es: El coach de IA privado para el crecimiento de cada empleado.
  description:
    it: Chat privata con un coach AI, piano di sviluppo trimestrale e check-in settimanale via email. Il manager vede solo
      gli obiettivi condivisi, l'HR solo statistiche anonime.
    en: A private chat with an AI coach, a quarterly development plan and a weekly email check-in. Managers see only shared
      goals, HR only anonymous statistics.
    es: Chat privado con un coach de IA, plan de desarrollo trimestral y check-in semanal por email. El manager solo ve los
      objetivos compartidos, RR. HH. solo estadísticas anónimas.
  langs:
  - it
  - en
  - es
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#1f3a5f'
      accent: '#e07a3f'
      background: '#f8f6f2'
      foreground: '#1c2430'
    fonts:
      body: Inter
      display: DM Serif Display
    wordmark:
    - text: Mentore
      color: primary
    - text: Interno
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
        es: Cómo funciona
      href: '#come-funziona'
    - label:
        it: Privacy
        en: Privacy
        es: Privacidad
      href: '#privacy'
    cta:
      label:
        it: Accedi
        en: Sign in
        es: Entrar
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: HR
      assignedBy: admin_emails
    - key: employee
      label:
        it: Dipendente
        en: Employee
        es: Empleado
      assignedBy: invite
    - key: manager
      label:
        it: Manager
        en: Manager
        es: Manager
      assignedBy: derived
      from: collection:employees.manager_email
  limits:
  - action: chat
    per: user
    max: 80
    window: day
  agents:
  - key: coach
    role: main
    description: Private coach chat for one employee.
    memory: user
    context:
    - key: profile
      from: collection:profiles
    - key: plan
      from: collection:plans
    goalTemplate: 'Language: {lang}. Today: {date}.

      Employee profile (JSON): {profile}

      Current development plan: {plan}

      Conversation so far:

      {history}

      New message from the employee:

      {message}'
    output: markdown
    appTools:
    - name: search_training
      description: Search the company's training content
      action: search
      collection: training_content
      scope: all
    - name: read_competencies
      description: Read the company competency model
      action: read
      collection: competencies
      scope: all
    - name: read_paths
      description: Read the company growth paths
      action: read
      collection: growth_paths
      scope: all
    - name: log_topic
      description: Record the theme and competency of this conversation, anonymised, for aggregate statistics. Call once per
        conversation turn that has a clear theme.
      action: append
      collection: usage_log
      scope: user
    profile:
      inline:
        display_name: Mentore Interno coach
        crews:
        - id: coach
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are Mentore, a warm, concrete and confidential workplace coach for one employee. Answer in the
            user''s language ({lang}). You help with: giving and receiving feedback, time management (respecting the employee''s
            preferred hours), preparing a difficult meeting (goal, key messages, likely objections, opening lines), and growth
            towards a new role. Ground your advice in the company''s own material: use search_training for training content,
            read_competencies for the competency model and read_paths for growth paths, and cite which content you used. Ask
            one or two clarifying questions when the situation is vague, then give 2-3 concrete next steps. After each substantive
            exchange call log_topic with theme (one of feedback, time, difficult_meeting, career, other), the competency worked
            on (name from the model, or empty) and today''s date; never put names or details of the conversation in it. You
            are not a therapist, lawyer or HR decision-maker: for harassment, health or legal matters point to the proper
            HR channel. Never invent company policies or training content. Never reveal anything about this conversation to
            managers or HR. Keep replies under 250 words unless asked for more.'
  - key: planner
    role: helper
    description: Builds the quarterly development plan of one employee.
    context:
    - key: profile
      from: collection:profiles
    goalTemplate: 'Build the quarterly development plan. Language: {lang}. Today: {date}.

      Profile (JSON): {profile}'
    output: markdown
    writesTo:
      collection: plans
      parse: whole
    appTools:
    - name: read_competencies
      description: Read the company competency model
      action: read
      collection: competencies
      scope: all
    - name: read_paths
      description: Read the company growth paths
      action: read
      collection: growth_paths
      scope: all
    - name: search_training
      description: Search the company's training content
      action: search
      collection: training_content
      scope: all
    profile:
      inline:
        display_name: Mentore Interno planner
        crews:
        - id: planner
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write a quarterly development plan for one employee, from their profile (role, professional
            goals, current difficulties, time preferences), the company competency model, the growth paths and the training
            content (use the tools; never invent content that is not there). Start with a level-1 title "# Piano di sviluppo
            — <quarter>" (translated to the report language). Sections with ## headings: Focus (2-3 competencies with why),
            Month 1, Month 2, Month 3 (each with 2-3 concrete actions, resources from the training content, and a measurable
            sign of progress), Weekly rhythm (fit the preferred time), How we will know it worked. Under 500 words. Be realistic
            about time available.'
  - key: checkin
    role: scheduled
    description: 'Weekly check-in for one employee: an exercise and a reflection question.'
    memory: instance
    writesTo:
      collection: checkins
      parse: whole
    appTools:
    - name: search_training
      description: Search the company's training content
      action: search
      collection: training_content
      scope: all
    profile:
      inline:
        display_name: Mentore Interno weekly check-in
        crews:
        - id: checkin
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 4
          max_budget_usd: 0.25
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write a short, friendly weekly check-in email for one employee. Start with "# Check-in — settimana
            del <date>" (translated to the language asked). Sections: ## Where you are (one or two lines tied to their plan
            and last week, from memory), ## This week''s exercise (one concrete exercise, 10-20 minutes, linked to a competency
            in their plan; use search_training when a company resource fits), ## Reflection question (exactly one). Under
            200 words, plain text friendly, no emojis overload. Never invent facts about the person. At the end call remember
            once with 3 key points of this check-in (exercise given, competency, question).'
  templates:
  - key: weekly_checkin
    title:
      it: Check-in settimanale
      en: Weekly check-in
      es: Check-in semanal
    description:
      it: Ogni settimana un'email con un esercizio e una domanda di riflessione.
      en: Every week an email with an exercise and a reflection question.
      es: Cada semana un email con un ejercicio y una pregunta de reflexión.
    agent: checkin
    params:
    - name: focus
      type: text
      maxLength: 200
      label:
        it: Competenza su cui vuoi lavorare (facoltativa)
        en: Competency you want to work on (optional)
        es: Competencia en la que quieres trabajar (opcional)
    goal: 'Weekly check-in "{instance}". {?focus}Requested focus: {focus}.{/focus} Today is {date}. Use the employee''s profile
      and plan from your memory and the training content. Write it in the language with ISO code {lang}.'
    schedule:
      cron: 0 7 * * 1
      userCanChange: true
    maxPerUser: 1
    deliver:
      to: owner
      onlyIfNew: false
  triggers:
  - key: plan_on_profile
    description: Build or refresh the quarterly plan when the profile is saved
    'on':
      collection: profiles
      op: any
    start:
      agent: planner
    goal: 'Build the quarterly development plan for an employee with role {record.role}, department {record.department}, goals:
      {record.goals}, difficulties: {record.difficulties}, preferred time: {record.preferred_time}. Today is {date}. Write
      it in the language with ISO code {lang}.'
  - key: hr_sync
    description: The company HR system posts employee changes (role, department, manager)
    'on':
      webhook: true
    write:
      collection: employees
      fields:
        email: email
        name: name
        role: role
        department: department
        manager_email: manager_email
      keyBy: email
  data:
    collections:
    - name: employees
      ownedBy: org
      description: 'Employee directory from the HR system: role, department, manager. Filled by HR (CSV) or by the HR webhook.'
      fields:
      - name: email
        type: email
        required: true
        label: Email
      - name: name
        type: text
        label: Nome
      - name: role
        type: text
        label: Ruolo
      - name: department
        type: text
        label: Reparto
      - name: manager_email
        type: email
        label: Email responsabile
    - name: competencies
      ownedBy: shared
      description: Company competency model
      fields:
      - name: name
        type: text
        required: true
      - name: area
        type: text
      - name: description
        type: textarea
      - name: levels
        type: textarea
    - name: growth_paths
      ownedBy: shared
      description: Growth paths between roles
      fields:
      - name: title
        type: text
        required: true
      - name: from_role
        type: text
      - name: to_role
        type: text
      - name: steps
        type: textarea
      - name: competencies
        type: text
    - name: training_content
      ownedBy: shared
      searchable: true
      description: Training content prepared by the company
      fields:
      - name: title
        type: text
        required: true
      - name: topic
        type: text
      - name: competency
        type: text
      - name: content
        type: textarea
      - name: link
        type: url
    - name: profiles
      ownedBy: user
      description: The employee's own profile. Private.
      fields:
      - name: role
        type: text
        required: true
        label:
          it: Ruolo attuale
          en: Current role
          es: Rol actual
      - name: department
        type: text
        label:
          it: Reparto
          en: Department
          es: Departamento
      - name: goals
        type: textarea
        required: true
        maxLength: 1200
        label:
          it: Obiettivi professionali
          en: Professional goals
          es: Objetivos profesionales
      - name: difficulties
        type: textarea
        maxLength: 1200
        label:
          it: Difficoltà attuali
          en: Current difficulties
          es: Dificultades actuales
      - name: preferred_time
        type: select
        label:
          it: Orari preferiti
          en: Preferred hours
          es: Horario preferido
        options:
        - value: morning
          label:
            it: Mattina
            en: Morning
            es: Mañana
        - value: lunch
          label:
            it: Pausa pranzo
            en: Lunch break
            es: Mediodía
        - value: afternoon
          label:
            it: Pomeriggio
            en: Afternoon
            es: Tarde
        - value: evening
          label:
            it: Fine giornata
            en: End of day
            es: Final del día
    - name: plans
      ownedBy: user
      description: Quarterly development plans, private to the employee
      fields:
      - name: title
        type: text
      - name: content
        type: textarea
      - name: date
        type: date
    - name: checkins
      ownedBy: instance
      description: Weekly check-ins of each instance
      fields:
      - name: title
        type: text
      - name: content
        type: textarea
      - name: date
        type: date
    - name: shared_goals
      ownedBy: user
      description: Goals the employee chooses to share with their manager. Never conversations.
      retentionDays: 730
      fields:
      - name: goal
        type: textarea
        required: true
        maxLength: 600
        label:
          it: Obiettivo da condividere
          en: Goal to share
          es: Objetivo a compartir
      - name: competency
        type: text
        label:
          it: Competenza
          en: Competency
          es: Competencia
      - name: manager_email
        type: email
        required: true
        label:
          it: Email del tuo responsabile
          en: Your manager's email
          es: Email de tu responsable
        help:
          it: Come indicato dall'HR
          en: As listed by HR
          es: Según RR. HH.
      - name: status
        type: select
        options:
        - value: active
          label: In corso / Active / En curso
        - value: done
          label: Done
      access:
      - role: manager
        where:
          manager_email: '{user.email}'
        can:
        - read
    - name: usage_log
      ownedBy: user
      retentionDays: 365
      description: Theme and competency of each coaching exchange, no content; only used in anonymous aggregates (min 5 people).
      fields:
      - name: theme
        type: select
        options:
        - feedback
        - time
        - difficult_meeting
        - career
        - other
      - name: competency
        type: text
      - name: date
        type: date
  inputForm:
    title: Coach
    fields:
    - name: message
      type: textarea
      label: Message
  views:
  - key: home
    type: page
    nav: false
    title: Mentore Interno
    sections:
    - type: hero
      title:
        it: Un coach **privato** per la crescita di ogni persona
        en: A **private** coach for every person's growth
        es: Un coach **privado** para el crecimiento de cada persona
      text:
        it: Chat con un coach AI, piano di sviluppo trimestrale e check-in settimanale, basati sui contenuti formativi della
          tua azienda.
        en: Chat with an AI coach, a quarterly development plan and a weekly check-in, based on your company's training content.
        es: Chat con un coach de IA, plan de desarrollo trimestral y check-in semanal, basados en los contenidos formativos
          de tu empresa.
      actions:
      - label:
          it: Accedi
          en: Sign in
          es: Entrar
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
        es: Cómo funciona
      items:
      - title:
          it: Il tuo profilo
          en: Your profile
          es: Tu perfil
        text:
          it: Ruolo, obiettivi, difficoltà e orari preferiti.
          en: Role, goals, difficulties and preferred hours.
          es: Rol, objetivos, dificultades y horario preferido.
      - title:
          it: Piano trimestrale
          en: Quarterly plan
          es: Plan trimestral
        text:
          it: Un piano su misura costruito sul modello di competenze aziendale.
          en: A tailored plan built on the company competency model.
          es: Un plan a medida sobre el modelo de competencias de la empresa.
      - title:
          it: Chat e check-in
          en: Chat and check-ins
          es: Chat y check-ins
        text:
          it: Feedback, tempo, riunioni difficili, nuovo ruolo; ogni lunedì un esercizio via email.
          en: Feedback, time, difficult meetings, a new role; every Monday an exercise by email.
          es: Feedback, tiempo, reuniones difíciles, nuevo rol; cada lunes un ejercicio por email.
    - type: cards
      id: privacy
      title: Privacy
      items:
      - title:
          it: Dipendente
          en: Employee
          es: Empleado
        text:
          it: Le conversazioni sono solo tue.
          en: Your conversations are yours alone.
          es: Tus conversaciones son solo tuyas.
      - title: Manager
        text:
          it: Vede solo gli obiettivi che scegli di condividere.
          en: Sees only the goals you choose to share.
          es: Solo ve los objetivos que decides compartir.
      - title: HR
        text:
          it: Solo statistiche aggregate e anonime (almeno 5 persone).
          en: Only aggregate, anonymous statistics (at least 5 people).
          es: Solo estadísticas agregadas y anónimas (mínimo 5 personas).
    - type: note
      content: Mentore Interno · powered by WebRobot
  - key: profile
    type: form
    collection: profiles
    edit: true
    title:
      it: Il mio profilo
      en: My profile
      es: Mi perfil
    roles:
    - employee
    - admin
    submit:
      label:
        it: Salva
        en: Save
        es: Guardar
      message:
        it: 'Profilo salvato: preparo il tuo piano.'
        en: 'Profile saved: preparing your plan.'
        es: 'Perfil guardado: preparo tu plan.'
      redirect: coach
  - key: coach
    type: chat
    source: agent:coach
    title: Coach
    roles:
    - employee
    - admin
    placeholder:
      it: Scrivi al tuo coach…
      en: Write to your coach…
      es: Escribe a tu coach…
    examples:
    - it: Devo dare un feedback difficile a un collega
      en: I must give difficult feedback to a colleague
      es: Debo dar un feedback difícil a un colega
    - it: Aiutami a prepararmi a una riunione complicata
      en: Help me prepare a difficult meeting
      es: Ayúdame a preparar una reunión difícil
    - it: Come mi preparo a un nuovo ruolo?
      en: How do I prepare for a new role?
      es: ¿Cómo me preparo para un nuevo rol?
  - key: plan
    type: table
    source: collection:plans
    title:
      it: Il mio piano
      en: My plan
      es: Mi plan
    roles:
    - employee
    - admin
    columns:
    - title
    - date
    - content
    printable: true
  - key: checkin_settings
    type: instances
    template: weekly_checkin
    title:
      it: Check-in settimanale
      en: Weekly check-in
      es: Check-in semanal
    roles:
    - employee
    - admin
  - key: share_goal
    type: form
    collection: shared_goals
    title:
      it: Condividi un obiettivo
      en: Share a goal
      es: Compartir un objetivo
    roles:
    - employee
    - admin
    submit:
      label:
        it: Condividi con il manager
        en: Share with my manager
        es: Compartir con mi manager
      message:
        it: Obiettivo condiviso.
        en: Goal shared.
        es: Objetivo compartido.
  - key: team_goals
    type: table
    source: collection:shared_goals
    title:
      it: Obiettivi del team
      en: Team goals
      es: Objetivos del equipo
    roles:
    - manager
    columns:
    - goal
    - competency
    - status
    - manager_email
  - key: hr_stats
    type: page
    title:
      it: Statistiche HR (anonime)
      en: HR statistics (anonymous)
      es: Estadísticas RR. HH. (anónimas)
    roles:
    - admin
    sections:
    - type: note
      content:
        it: 'Dati aggregati e anonimi: i gruppi con meno di 5 persone non sono mostrati. Le conversazioni non sono mai visibili.'
        en: 'Aggregate, anonymous data: groups under 5 people are hidden. Conversations are never visible.'
        es: 'Datos agregados y anónimos: los grupos de menos de 5 personas no se muestran. Las conversaciones nunca son visibles.'
    - type: data
      id: participation
      title:
        it: Partecipazione settimanale
        en: Weekly participation
        es: Participación semanal
      source: collection:usage_log
      display: chart
      chart: line
      fields:
      - key: date
        label: Week
      - key: count
        label: Sessions
      groupBy:
        field: date
        bucket: week
        aggs:
        - key: n
          agg: count
        minCount: 5
        acrossUsers: true
      empty:
        it: Dati insufficienti (minimo 5 persone).
        en: Not enough data (min 5 people).
        es: Datos insuficientes (mínimo 5 personas).
    - type: data
      id: themes
      title:
        it: Temi più frequenti
        en: Most frequent themes
        es: Temas más frecuentes
      source: collection:usage_log
      display: bar
      fields:
      - key: theme
        label: Theme
      - key: count
        label: Count
      groupBy:
        field: theme
        aggs:
        - key: n
          agg: count
        minCount: 5
        acrossUsers: true
      empty:
        it: Dati insufficienti.
        en: Not enough data.
        es: Datos insuficientes.
    - type: data
      id: competencies-worked
      title:
        it: Competenze su cui si lavora
        en: Competencies being worked on
        es: Competencias trabajadas
      source: collection:usage_log
      display: bar
      fields:
      - key: competency
        label: Competency
      - key: count
        label: Count
      groupBy:
        field: competency
        aggs:
        - key: n
          agg: count
        minCount: 5
        acrossUsers: true
      empty:
        it: Dati insufficienti.
        en: Not enough data.
        es: Datos insuficientes.
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
      es: Suscripción
    roles:
    - employee
    - manager
    - admin
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: seat
      price: 12
      interval: month
      label:
        it: Dipendente attivo
        en: Active employee
        es: Empleado activo
      includes:
      - Coach chat
      - Quarterly plan
      - Weekly check-in
      roles:
      - employee
      - manager
  extensions:
  - key: hr_system_sync
    description: Roles, departments and managers arrive automatically only if the company HR system can POST to the app webhook
      /api/hooks/hr_sync (email, name, role, department, manager_email); direct connectors to HR suites via OAuth are not
      available yet. Until then HR uploads the employee CSV on /admin/data.
  - key: manager_autofill
    description: The manager email in shared goals is typed by the employee; automatic pre-fill from the HR directory is not
      available yet.
  - key: per_seat_company_billing
    description: Billing per active employee is modelled as one monthly subscription per user; a single company invoice by
      number of active seats is not available yet.
