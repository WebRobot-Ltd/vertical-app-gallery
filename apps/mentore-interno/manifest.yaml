apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: mentore-interno
  displayName: Mentore Interno
  tagline:
    it: Il coach AI privato per la crescita di ogni dipendente.
    en: A private AI coach for every employee's growth.
    es: El coach de IA privado para el crecimiento de cada empleado.
  description:
    it: Chat privata con un coach AI basato sui contenuti formativi aziendali, piano di sviluppo trimestrale e check-in settimanale.
      Il manager vede solo gli obiettivi condivisi, l'HR solo statistiche aggregate e anonime.
    en: Private chat with an AI coach grounded in your company's training content, a quarterly development plan and a weekly
      check-in. Managers see only shared goals; HR sees only aggregate, anonymous statistics.
    es: Chat privado con un coach de IA basado en los contenidos formativos de la empresa, plan de desarrollo trimestral y
      check-in semanal. El manager ve solo los objetivos compartidos; RR. HH. solo estadísticas agregadas y anónimas.
  langs:
  - it
  - en
  - es
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#1f3a5f'
      accent: '#e07a3f'
      background: '#f7f8fa'
      foreground: '#1c2430'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Mentore
      color: primary
    - text: Interno
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
        es: Cómo funciona
      href: '#come-funziona'
    - label:
        it: Privacy
        en: Privacy
        es: Privacidad
      href: '#privacy'
    cta:
      label:
        it: Accedi
        en: Sign in
        es: Acceder
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: HR
      assignedBy: admin_emails
    - key: user
      label:
        it: Dipendente
        en: Employee
        es: Empleado
      assignedBy: invite
    - key: manager
      label: Manager
      assignedBy: derived
      from: collection:employees.manager_email
  limits:
  - action: chat
    per: user
    max: 60
    window: day
    roles:
    - user
  agents:
  - key: coach
    role: main
    description: Private coach in chat; uses the employee's own profile and plan and the company's training content.
    memory: user
    profile:
      inline:
        display_name: Mentore Interno coach
        chat_mode: true
        crews:
        - id: coach
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are Mentore, a warm, concrete and confidential career coach for one employee. You help with
            feedback (giving and receiving), time management, preparing a difficult meeting, and growth towards a new role.
            Before answering, read the employee''s profile and plan with your tools and search the company''s training content,
            competency model and growth paths; ground your advice in them and name the resource you use. Ask one clarifying
            question when needed, then give short, practical steps and, when useful, a small exercise or a script for a conversation.
            Reply in the language of the user''s message. You are not a therapist, lawyer or doctor: for health, legal or
            serious conflict matters suggest HR or a professional. Never invent company policies or content that are not in
            the tools. Conversations are private: never offer to share them with managers or HR. If the employee wants to
            share a goal with their manager, tell them to confirm it in the ''Shared goals'' section (you may save it with
            the tool propose_shared_goal only after they say yes). Remember key points with the tool remember.'
    goalTemplate: 'Conversation so far:

      {history}


      New message from {user}: {message}

      Today is {date}. Reply in the language with ISO code {lang} unless the user writes in another.'
    appTools:
    - name: read_profile
      description: The employee's own profile
      action: read
      collection: profiles
      scope: user
    - name: read_plan
      description: The employee's quarterly development plans
      action: read
      collection: plans
      scope: user
    - name: search_training
      description: Search the company's training content
      action: search
      collection: training_content
      scope: all
    - name: read_competencies
      description: Company competency model
      action: read
      collection: competency_model
      scope: all
    - name: read_paths
      description: Company growth paths
      action: read
      collection: growth_paths
      scope: all
    - name: propose_shared_goal
      description: Save a goal the employee explicitly agreed to share with their manager
      action: write
      collection: shared_goals
      scope: user
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.4
  - key: planner
    role: helper
    description: Saves the employee's profile and builds the quarterly development plan.
    profile:
      inline:
        display_name: Mentore Interno planner
        crews:
        - id: planner
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You build a quarterly development plan for one employee from their profile, the company competency
            model, growth paths and training content (read them with your tools). First save the profile with the tool save_profile.
            Then write the plan. Start with a level-1 title "# Piano di sviluppo — <Q and year>" (translated to the report
            language). Sections with ## headings: Where you are, Goals for the quarter (max 3, each with a measurable result),
            Competencies to work on (from the company model), Month by month (4-week blocks with concrete actions and recommended
            company training content), Time slots (respect the stated schedule preferences), How we will know it worked. Under
            600 words. Never invent company content, figures or promotions; if a competency or path is not in the tools, say
            so. The plan is private to the employee.'
    goalTemplate: 'Employee profile:

      Role: {role}

      Professional goals: {goals}

      Current difficulties: {difficulties}

      Schedule preferences: {schedule}

      Today is {date}. Write the plan in the language with ISO code {lang}.'
    appTools:
    - name: save_profile
      description: Save the employee's own profile
      action: write
      collection: profiles
      scope: user
    - name: read_competencies
      description: Company competency model
      action: read
      collection: competency_model
      scope: all
    - name: read_paths
      description: Company growth paths
      action: read
      collection: growth_paths
      scope: all
    - name: search_training
      description: Search the company's training content
      action: search
      collection: training_content
      scope: all
    awaits:
    - confirm_plan
    writesTo:
      collection: plans
      parse: whole
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.5
  - key: checkin
    role: scheduled
    description: 'Weekly check-in for one employee: an exercise and a reflection question.'
    memory: instance
    writesTo:
      collection: checkins
      parse: whole
    profile:
      inline:
        display_name: Mentore Interno weekly check-in
        crews:
        - id: checkin
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 5
          max_budget_usd: 0.25
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write the weekly check-in for one employee. Read their profile and current plan with your tools.
            Start with "# Check-in — week of <date>". Sections: ## Last week (one line recalling the previous focus from memory),
            ## This week''s exercise (one exercise of 10-20 minutes, tied to a plan goal and, when available, a company training
            resource), ## Reflection question (one question). Under 200 words, warm tone, never invent content. At the end
            call remember once with the focus of this week (it replaces the old one).'
    appTools:
    - name: read_profile
      description: The employee's own profile
      action: read
      collection: profiles
      scope: user
    - name: read_plan
      description: The employee's quarterly development plans
      action: read
      collection: plans
      scope: user
    - name: search_training
      description: Search the company's training content
      action: search
      collection: training_content
      scope: all
    output: markdown
    limits:
      maxTurns: 5
      maxBudgetUsd: 0.25
  inputForm:
    title:
      it: Il mio profilo
      en: My profile
      es: Mi perfil
    fields:
    - name: role
      type: text
      required: true
      maxLength: 120
      label:
        it: Ruolo attuale
        en: Current role
        es: Puesto actual
    - name: goals
      type: textarea
      required: true
      maxLength: 800
      label:
        it: Obiettivi professionali
        en: Professional goals
        es: Objetivos profesionales
    - name: difficulties
      type: textarea
      maxLength: 800
      label:
        it: Difficoltà attuali
        en: Current difficulties
        es: Dificultades actuales
    - name: schedule
      type: select
      required: true
      label:
        it: Preferenza di orario
        en: Schedule preference
        es: Preferencia de horario
      options:
      - value: morning
        label:
          it: Mattina
          en: Morning
          es: Mañana
      - value: lunch
        label:
          it: Pausa pranzo
          en: Lunch break
          es: Hora de comer
      - value: afternoon
        label:
          it: Pomeriggio
          en: Afternoon
          es: Tarde
      - value: flexible
        label:
          it: Flessibile
          en: Flexible
          es: Flexible
  data:
    collections:
    - name: profiles
      ownedBy: user
      description: Employee's private profile
      fields:
      - name: role
        type: text
      - name: goals
        type: textarea
      - name: difficulties
        type: textarea
      - name: schedule
        type: text
    - name: plans
      ownedBy: user
      description: Private quarterly development plans
    - name: shared_goals
      ownedBy: user
      description: Goals the employee chose to share with their manager
      fields:
      - name: goal
        type: textarea
      - name: competency
        type: text
      - name: manager_email
        type: email
    - name: checkins
      ownedBy: instance
      description: Weekly check-ins of each employee
    - name: employees
      ownedBy: org
      description: Roster uploaded by HR
      fields:
      - name: email
        type: email
        required: true
      - name: name
        type: text
      - name: department
        type: text
      - name: role
        type: text
      - name: manager_email
        type: email
    - name: competency_model
      ownedBy: shared
      description: Company competency model
      fields:
      - name: competency
        type: text
      - name: description
        type: textarea
      - name: levels
        type: textarea
    - name: growth_paths
      ownedBy: shared
      description: Growth paths between roles
      fields:
      - name: path
        type: text
      - name: from_role
        type: text
      - name: to_role
        type: text
      - name: requirements
        type: textarea
    - name: training_content
      ownedBy: shared
      searchable: true
      description: Training content prepared by the company
      fields:
      - name: title
        type: text
      - name: topic
        type: text
      - name: body
        type: textarea
      - name: link
        type: url
    - name: hr_stats
      ownedBy: org
      description: Aggregate anonymous statistics for HR (participation, frequent themes, competencies)
      fields:
      - name: period
        type: text
      - name: active_employees
        type: number
      - name: theme
        type: text
      - name: theme_count
        type: number
      - name: competency
        type: text
      - name: competency_count
        type: number
  approvals:
  - key: confirm_plan
    title:
      it: Conferma il tuo piano
      en: Confirm your plan
      es: Confirma tu plan
    decidedBy: requester
  templates:
  - key: weekly_checkin
    title:
      it: Check-in settimanale
      en: Weekly check-in
      es: Check-in semanal
    description:
      it: Ogni settimana un esercizio e una domanda di riflessione.
      en: Every week an exercise and a reflection question.
      es: Cada semana un ejercicio y una pregunta de reflexión.
    agent: checkin
    params:
    - name: focus
      type: text
      label:
        it: Tema su cui vuoi concentrarti (facoltativo)
        en: Focus topic (optional)
        es: Tema en el que centrarte (opcional)
    goal: 'Write this week''s check-in for "{instance}". {?focus}Requested focus: {focus}.{/focus} Today is {date}. Reply
      in the language with ISO code {lang}.'
    schedule:
      cron: 0 8 * * 1
      userCanChange: true
    maxPerUser: 1
    roles:
    - user
  views:
  - key: home
    type: page
    nav: false
    title: Mentore Interno
    sections:
    - type: hero
      title:
        it: Il tuo **coach** privato, sempre disponibile.
        en: Your private, always-available **coach**.
        es: Tu **coach** privado, siempre disponible.
      text:
        it: Feedback, gestione del tempo, riunioni difficili e crescita di ruolo, con i contenuti formativi della tua azienda.
        en: Feedback, time management, difficult meetings and career growth, grounded in your company's training content.
        es: Feedback, gestión del tiempo, reuniones difíciles y crecimiento profesional, con los contenidos formativos de
          tu empresa.
      actions:
      - label:
          it: Accedi
          en: Sign in
          es: Acceder
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
        es: Cómo funciona
      items:
      - title:
          it: Profilo
          en: Profile
          es: Perfil
        text:
          it: Ruolo, obiettivi, difficoltà e orari preferiti.
          en: Role, goals, difficulties and preferred hours.
          es: Puesto, objetivos, dificultades y horarios preferidos.
      - title:
          it: Piano trimestrale
          en: Quarterly plan
          es: Plan trimestral
        text:
          it: Un piano su misura basato sul modello di competenze.
          en: A tailored plan built on the competency model.
          es: Un plan a medida basado en el modelo de competencias.
      - title:
          it: Chat e check-in
          en: Chat and check-in
          es: Chat y check-in
        text:
          it: Parla col coach quando vuoi; ogni settimana un esercizio e una domanda.
          en: Talk to the coach any time; every week an exercise and a question.
          es: Habla con el coach cuando quieras; cada semana un ejercicio y una pregunta.
    - type: cards
      id: privacy
      title: Privacy
      items:
      - title:
          it: Conversazioni private
          en: Private conversations
          es: Conversaciones privadas
        text:
          it: Nessuno, né manager né HR, legge le tue chat.
          en: No one, neither managers nor HR, reads your chats.
          es: Nadie, ni managers ni RR. HH., lee tus chats.
        badge: 🔒
      - title:
          it: Il manager
          en: Managers
          es: Managers
        text:
          it: Vede solo gli obiettivi che scegli di condividere.
          en: See only the goals you choose to share.
          es: Ven solo los objetivos que decides compartir.
        badge: 👤
      - title: HR
        text:
          it: Solo statistiche aggregate e anonime.
          en: Only aggregate, anonymous statistics.
          es: Solo estadísticas agregadas y anónimas.
        badge: 📊
    - type: note
      content:
        it: Supporto alla crescita professionale, non consulenza psicologica, medica o legale.
        en: Professional development support, not psychological, medical or legal advice.
        es: Apoyo al desarrollo profesional, no asesoramiento psicológico, médico ni legal.
  - key: coach_chat
    type: chat
    title:
      it: Il mio coach
      en: My coach
      es: Mi coach
    source: agent:coach
    examples:
    - it: Come preparo una riunione difficile con il mio responsabile?
      en: How do I prepare a difficult meeting with my manager?
      es: ¿Cómo preparo una reunión difícil con mi responsable?
    - it: 'Voglio crescere verso un ruolo di team lead: da dove parto?'
      en: 'I want to grow into a team lead role: where do I start?'
      es: 'Quiero crecer hacia un rol de team lead: ¿por dónde empiezo?'
    placeholder:
      it: Scrivi al tuo coach…
      en: Write to your coach…
      es: Escribe a tu coach…
    roles:
    - user
  - key: profile_plan
    type: new_run
    title:
      it: Profilo e piano
      en: Profile and plan
      es: Perfil y plan
    roles:
    - user
  - key: plans
    type: history
    title:
      it: I miei piani
      en: My plans
      es: Mis planes
    source: run
    roles:
    - user
  - key: plan
    type: report
    source: run
    printable: true
    nav: false
  - key: checkins
    type: instances
    template: weekly_checkin
    title:
      it: Check-in settimanali
      en: Weekly check-ins
      es: Check-ins semanales
    roles:
    - user
  - key: my_shared_goals
    type: table
    title:
      it: Obiettivi condivisi
      en: Shared goals
      es: Objetivos compartidos
    source: collection:shared_goals
    columns:
    - goal
    - competency
    - manager_email
    roles:
    - user
  - key: approvals
    type: approvals
    title:
      it: Conferme
      en: Confirmations
      es: Confirmaciones
    roles:
    - user
  - key: hr_stats_view
    type: table
    title:
      it: Statistiche anonime
      en: Anonymous statistics
      es: Estadísticas anónimas
    source: collection:hr_stats
    columns:
    - period
    - active_employees
    - theme
    - theme_count
    - competency
    - competency_count
    roles:
    - admin
  - key: hr_employees
    type: table
    title:
      it: Dipendenti
      en: Employees
      es: Empleados
    source: collection:employees
    columns:
    - email
    - name
    - department
    - role
    - manager_email
    roles:
    - admin
  - key: hr_competencies
    type: table
    title:
      it: Modello di competenze
      en: Competency model
      es: Modelo de competencias
    source: collection:competency_model
    roles:
    - admin
  - key: hr_paths
    type: table
    title:
      it: Percorsi di crescita
      en: Growth paths
      es: Rutas de crecimiento
    source: collection:growth_paths
    roles:
    - admin
  - key: hr_training
    type: table
    title:
      it: Contenuti formativi
      en: Training content
      es: Contenidos formativos
    source: collection:training_content
    roles:
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
      es: Suscripción
    roles:
    - user
    - admin
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: employee_monthly
      price: 9
      interval: month
      label:
        it: Per dipendente attivo, al mese
        en: Per active employee, per month
        es: Por empleado activo, al mes
      includes:
      - private coach chat
      - quarterly plan
      - weekly check-in
      roles:
      - user
      - admin
  extensions:
  - key: hr_sync
    description: Roles, departments and managers coming automatically from the company HR system need a connector with the
      company's credentials (not available yet). For now HR enters or pastes the roster in the employees collection (no file
      upload yet).
  - key: email_checkin
    description: The weekly check-in by email needs notifications (not available yet). For now the check-in appears in the
      app under Weekly check-ins; the email delivery is to be added later.
  - key: manager_view
    description: Manager access to the shared goals of their reports (matched through employees.manager_email) needs cross-user
      read of shared_goals limited to that manager's reports; the manager role is derived from the roster, but the cross-user
      view must be implemented by the runtime. Conversations are never exposed.
  - key: hr_aggregates
    description: Anonymous aggregates (participation, frequent themes, competencies) must be computed by a privacy-preserving
      job over user records, with small groups suppressed (e.g. fewer than 5 people), and written to hr_stats; per-user records
      are never readable by HR.
  - key: per_active_employee_billing
    description: 'The subscription is per active employee: the runtime must count active users each month; the plan here is
      a per-user monthly price.'
