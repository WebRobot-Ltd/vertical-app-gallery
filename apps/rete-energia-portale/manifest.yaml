apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: energy-grid-cockpit
  displayName: Energy Grid Cockpit
  tagline:
    it: Produzione, consumo e batterie della tua rete locale, con un agente che ti consiglia.
    en: Production, consumption and batteries of your local grid, with an agent that advises you.
  description:
    it: 'Strato software per la gestione dell''energia rinnovabile: registra impianti, batterie e punti di consumo, collega
      il sistema di misura via webhook e ricevi dashboard, autoconsumo, suggerimenti basati sul meteo e segnalazioni per i
      tecnici. Non controlla i dispositivi hardware.'
    en: 'Software layer for renewable energy management: register plants, batteries and consumption points, connect your metering
      system by webhook and get a dashboard, self-consumption, weather-based suggestions and technician alarms. It does not
      control hardware devices.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: dashboard
  branding:
    theme: light
    palette:
      primary: '#0b3d3a'
      accent: '#f2a900'
      background: '#f6faf8'
      foreground: '#13211f'
    fonts:
      body: Inter
      display: Space Grotesk
    wordmark:
    - text: Energy
      color: primary
    - text: Grid
      color: accent
    button: primary
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#how'
    - label:
        it: Piani
        en: Plans
      href: '#plans'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: operator
      label:
        it: Gestore
        en: Operator
      assignedBy: signup
    - key: technician
      label:
        it: Tecnico
        en: Technician
      assignedBy: derived
      from: collection:alarms.technician_email
  limits:
  - action: login
    per: ip
    max: 20
    window: hour
  egress:
    hosts:
    - api.open-meteo.com
    notes: Open-Meteo weather forecast API, CC BY 4.0 attribution; free tier is for non-commercial use, a commercial Open-Meteo
      plan is needed for production.
  agents:
  - key: analyst
    role: main
    description: Reads new measurements sent by the operator's metering system, computes self-consumption, proposes use/storage
      plans from the weather forecast and opens alarms.
    memory: user
    awaits:
    - apply_suggestion
    profile:
      inline:
        display_name: Energy analyst
        crews:
        - id: analyst
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the software energy analyst of a local renewable grid. You only read data and advise: you
            never control hardware.

            You receive a measurement event (JSON) sent by the operator''s metering system: asset id, kind (plant, battery,
            load, grid), power kW, energy kWh, battery state of charge %, timestamp.

            Steps:

            1. Save the reading with the tool write_readings.

            2. Read the operator''s assets (read_assets) and the latest readings (read_readings) to get the picture: production,
            consumption, battery charge, import/export with the grid.

            3. Compute self-consumption = (production - export) / production, and self-sufficiency = (consumption - import)
            / consumption, using only real figures; if data is missing say so.

            4. Call open_meteo_forecast (GET, query: latitude, longitude from the asset, hourly=shortwave_radiation,cloud_cover,temperature_2m,
            forecast_days=1, timezone=auto). Response: JSON with hourly arrays. Estimate the next hours: when to consume directly,
            charge the batteries or shift flexible loads, using the consumption profile in the readings. State assumptions.

            5. If you have a useful recommendation, write it with write_suggestions (fields: asset, title, text, window, expected_gain_kwh,
            status ''proposed'') and then call request_apply_suggestion so the operator confirms. Never claim savings you
            cannot support with figures.

            6. If you detect anomalous operation (production near zero in daylight, battery not charging, sudden consumption
            spike, missing data for hours, SOC out of range), open an alarm with write_alarms (fields: asset, severity low|medium|high,
            description, evidence, status ''open'', technician_email if the asset record names one).

            Answer with a short Markdown summary starting with a level-1 ''# '' title containing the date. Attribution for
            weather: Open-Meteo.com, CC BY 4.0. Never invent measurements.'
          mcp_servers: []
    goalTemplate: 'Process the measurement event described in the task. Today is {date}. Language: {lang}.'
    appTools:
    - name: read_assets
      description: Plants, batteries and consumption points of the operator
      action: read
      collection: assets
      scope: user
    - name: read_readings
      description: Measurements of the operator
      action: read
      collection: readings
      scope: user
    - name: write_readings
      description: Store a measurement
      action: append
      collection: readings
      scope: user
    - name: write_suggestions
      description: Store a use/storage suggestion for the operator
      action: append
      collection: suggestions
      scope: user
    - name: write_alarms
      description: Open an alarm for the technician
      action: append
      collection: alarms
      scope: user
    - name: open_meteo_forecast
      description: Hourly weather forecast from Open-Meteo
      action: http
      http:
        method: GET
        url: https://api.open-meteo.com/v1/forecast
        attribution: Open-Meteo.com, CC BY 4.0
    output: markdown
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.5
  - key: reporter
    role: scheduled
    description: Writes the periodic report of self-consumption and savings for one operator's network.
    memory: instance
    writesTo:
      collection: reports
      parse: whole
    profile:
      inline:
        display_name: Energy reporter
        crews:
        - id: reporter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write the periodic energy report for one operator of a local renewable grid. Read readings (read_readings),
            assets (read_assets) and suggestions (read_suggestions) of the period. Start with ''# Energy report — <period>''.
            Sections: ## Summary (production, consumption, import/export, self-consumption %, self-sufficiency %), ## Savings
            (estimate using the tariff given in the goal, state the formula), ## Batteries, ## Alarms and suggestions, ##
            Next steps. Add a chart as a fenced block ```chart with real daily figures (bar, unit kWh). Use only data you
            read; say when data is incomplete; never invent figures.'
          mcp_servers: []
    appTools:
    - name: read_assets
      description: Plants, batteries and consumption points of the operator
      action: read
      collection: assets
      scope: user
    - name: read_readings
      description: Measurements of the operator
      action: read
      collection: readings
      scope: user
    - name: read_suggestions
      description: Suggestions of the operator
      action: read
      collection: suggestions
      scope: user
    goalTemplate: Write the periodic report as described in the task. Today is {date}. Write in the language with ISO code
      {lang}.
    output: markdown
  templates:
  - key: network_report
    title:
      it: Report periodico
      en: Periodic report
    description:
      it: Report con autoconsumo e risparmio della tua rete.
      en: Report with self-consumption and savings of your network.
    agent: reporter
    params:
    - name: period
      type: select
      required: true
      label:
        it: Periodo
        en: Period
      options:
      - value: last 7 days
        label:
          it: Ultimi 7 giorni
          en: Last 7 days
      - value: last 30 days
        label:
          it: Ultimi 30 giorni
          en: Last 30 days
    - name: tariff_eur_kwh
      type: number
      required: true
      label:
        it: Tariffa €/kWh
        en: Tariff €/kWh
      default: 0.25
    schedule:
      cron: 0 6 * * 1
      userCanChange: true
    maxPerUser: 2
    roles:
    - operator
    - admin
    goal: 'Report for "{instance}", period: {period}. Tariff {tariff_eur_kwh} EUR/kWh. Today is {date}. Write in the language
      with ISO code {lang}.'
  triggers:
  - key: measurement_hook
    description: The operator's metering system posts measurements here
    'on':
      webhook: true
    start:
      agent: analyst
    goal: 'New measurement event: {event}'
    asUser: true
  approvals:
  - key: apply_suggestion
    title:
      it: Applica il suggerimento
      en: Apply the suggestion
    description: The operator confirms a use/storage suggestion proposed by the agent
    decidedBy: requester
    fields:
    - title
    - text
    - window
    - expected_gain_kwh
    timeoutMinutes: 1440
  data:
    collections:
    - name: assets
      ownedBy: user
      description: Plants, batteries and consumption points of the operator
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome
          en: Name
      - name: kind
        type: select
        required: true
        label:
          it: Tipo
          en: Kind
        options:
        - value: plant
          label:
            it: Impianto
            en: Plant
        - value: battery
          label:
            it: Batteria
            en: Battery
        - value: load
          label:
            it: Punto di consumo
            en: Consumption point
      - name: power_kw
        type: number
        required: true
        label:
          it: Potenza kW
          en: Power kW
      - name: capacity_kwh
        type: number
        label:
          it: Capacità kWh
          en: Capacity kWh
      - name: latitude
        type: number
        label: Latitude
      - name: longitude
        type: number
        label: Longitude
      - name: technician_email
        type: email
        label:
          it: Email tecnico
          en: Technician email
    - name: readings
      ownedBy: user
      description: Measurements received from the metering system
      fields:
      - name: asset
        type: text
      - name: kind
        type: text
      - name: ts
        type: date
      - name: power_kw
        type: number
      - name: energy_kwh
        type: number
      - name: soc_pct
        type: number
      - name: grid_kw
        type: number
    - name: suggestions
      ownedBy: user
      description: Use or storage suggestions
      fields:
      - name: asset
        type: text
      - name: title
        type: text
      - name: text
        type: textarea
      - name: window
        type: text
      - name: expected_gain_kwh
        type: number
      - name: status
        type: text
    - name: alarms
      ownedBy: user
      description: Alarms opened for technicians
      fields:
      - name: asset
        type: text
      - name: severity
        type: text
      - name: description
        type: textarea
      - name: evidence
        type: textarea
      - name: status
        type: text
      - name: technician_email
        type: email
    - name: reports
      ownedBy: instance
      description: Periodic reports of each network report instance
  views:
  - key: home
    type: page
    nav: false
    title: Energy Grid Cockpit
    sections:
    - type: hero
      eyebrow:
        it: Software per l'energia rinnovabile
        en: Renewable energy software
      title:
        it: La tua rete locale, **sotto controllo**.
        en: Your local grid, **under control**.
      text:
        it: Registra impianti, batterie e consumi, collega il sistema di misura e lascia che un agente calcoli l'autoconsumo,
          legga il meteo e ti proponga come usare o accumulare l'energia.
        en: Register plants, batteries and loads, connect your metering system and let an agent compute self-consumption,
          read the weather and suggest how to use or store energy.
      actions:
      - label:
          it: Inizia
          en: Get started
        href: /login
        style: primary
      note:
        it: 'Solo software: nessun controllo diretto dei dispositivi.'
        en: 'Software only: no direct control of devices.'
    - type: steps
      id: how
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Registra la rete
          en: Register your grid
        text:
          it: Impianti, batterie e punti di consumo.
          en: Plants, batteries and consumption points.
        badge: 🏭
      - title:
          it: Collega le misure
          en: Connect measurements
        text:
          it: Il tuo sistema di misura invia i dati via webhook.
          en: Your metering system posts data by webhook.
        badge: 🔌
      - title:
          it: Ricevi suggerimenti
          en: Get suggestions
        text:
          it: Previsioni Open-Meteo e profili di consumo; tu confermi.
          en: Open-Meteo forecasts and consumption profiles; you confirm.
        badge: ☀️
      - title:
          it: Allarmi ai tecnici
          en: Technician alarms
        text:
          it: Le anomalie diventano segnalazioni assegnate.
          en: Anomalies become assigned alarms.
        badge: 🛠️
    - type: cards
      id: plans
      title:
        it: Piani in base alla potenza gestita
        en: Plans by managed power
      items:
      - title: Small
        text:
          it: Fino a 50 kW — 29 €/mese
          en: Up to 50 kW — €29/month
      - title: Medium
        text:
          it: Fino a 250 kW — 79 €/mese
          en: Up to 250 kW — €79/month
      - title: Large
        text:
          it: Fino a 1 MW — 199 €/mese
          en: Up to 1 MW — €199/month
    - type: note
      content:
        it: 'Previsioni meteo: Open-Meteo.com (CC BY 4.0). Le stime sono di supporto alle decisioni.'
        en: 'Weather data: Open-Meteo.com (CC BY 4.0). Estimates are decision support.'
  - key: overview
    type: dashboard
    title:
      it: Cruscotto
      en: Dashboard
    children:
    - power_chart
    - battery_cards
    - open_alarms
    roles:
    - operator
    - admin
  - key: power_chart
    type: chart
    title:
      it: Potenza per punto
      en: Power by asset
    source: collection:readings
    nav: false
    data:
      display: chart
      chart: line
      fields:
      - key: ts
        label:
          it: Ora
          en: Time
        format: date
      - key: power_kw
        label: kW
        format: number
      sort:
        field: ts
        dir: desc
      limit: 100
      kpis:
      - label:
          it: Ultima potenza
          en: Latest power
        agg: last
        field: power_kw
        format: number
      empty:
        it: Nessuna misura ancora.
        en: No measurements yet.
  - key: battery_cards
    type: cards
    title:
      it: Batterie
      en: Batteries
    source: collection:readings
    nav: false
    data:
      display: cards
      fields:
      - key: asset
        label: Asset
      - key: soc_pct
        label: SOC %
        format: percent
      - key: grid_kw
        label:
          it: Scambio rete kW
          en: Grid kW
        format: number
      filters:
      - field: kind
        op: '='
        value: battery
      sort:
        field: ts
        dir: desc
      limit: 12
  - key: open_alarms
    type: table
    title:
      it: Segnalazioni aperte
      en: Open alarms
    source: collection:alarms
    nav: false
    data:
      display: table
      fields:
      - key: asset
        label: Asset
      - key: severity
        label:
          it: Gravità
          en: Severity
        format: badge
      - key: description
        label:
          it: Descrizione
          en: Description
      filters:
      - field: status
        op: '='
        value: open
      limit: 50
  - key: assets_view
    type: table
    title:
      it: Impianti e punti
      en: Assets
    source: collection:assets
    roles:
    - operator
    - admin
    data:
      display: table
      fields:
      - key: name
        label:
          it: Nome
          en: Name
      - key: kind
        label:
          it: Tipo
          en: Kind
        format: badge
      - key: power_kw
        label: kW
        format: number
      - key: capacity_kwh
        label: kWh
        format: number
      limit: 200
  - key: suggestions_view
    type: approvals
    title:
      it: Suggerimenti
      en: Suggestions
    approvals:
    - apply_suggestion
    roles:
    - operator
    - admin
  - key: alarms_view
    type: table
    title:
      it: Allarmi assegnati
      en: Assigned alarms
    source: collection:alarms
    roles:
    - technician
    - operator
    - admin
    data:
      display: table
      fields:
      - key: asset
        label: Asset
      - key: severity
        label:
          it: Gravità
          en: Severity
        format: badge
      - key: description
        label:
          it: Descrizione
          en: Description
      - key: evidence
        label:
          it: Evidenze
          en: Evidence
      - key: status
        label:
          it: Stato
          en: Status
        format: badge
      limit: 100
  - key: reports_view
    type: instances
    title:
      it: Report periodici
      en: Periodic reports
    template: network_report
    roles:
    - operator
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - operator
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: small
      price: 29
      interval: month
      label:
        it: Small — fino a 50 kW
        en: Small — up to 50 kW
      includes:
      - up to 50 kW managed power
      roles:
      - operator
    - key: medium
      price: 79
      interval: month
      label:
        it: Medium — fino a 250 kW
        en: Medium — up to 250 kW
      includes:
      - up to 250 kW managed power
      roles:
      - operator
    - key: large
      price: 199
      interval: month
      label:
        it: Large — fino a 1 MW
        en: Large — up to 1 MW
      includes:
      - up to 1 MW managed power
      roles:
      - operator
  extensions:
  - key: email_report
    description: 'Sending the periodic report by email is not available yet: the report is generated on schedule and shown
      in the app.'
  - key: power_limit_enforcement
    description: Plan limits by managed kW (sum of assets power_kw) are not enforced automatically; the owner checks them
      for now.
  - key: technician_cross_user_alarms
    description: Technicians see alarms through the derived role on alarms.technician_email; visibility of alarms owned by
      another user's records needs runtime support or manual check.
  - key: webhook_user_mapping
    description: Each operator's metering system posts to /api/hooks/measurement_hook with the hook secret; mapping the secret
      to the operator account must be configured at publish.
