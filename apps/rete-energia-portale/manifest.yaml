apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: gridwise-energy
  displayName: GridWise Energy
  tagline:
    it: Cruscotto e agenti per la tua rete energetica locale.
    en: Dashboard and agents for your local energy network.
  description:
    it: 'Registra impianti, batterie e punti di consumo, collega il sistema di misura via webhook: gli agenti calcolano l''autoconsumo,
      suggeriscono quando usare o accumulare l''energia con le previsioni Open-Meteo e aprono segnalazioni per i tecnici.
      Solo software di monitoraggio: nessun controllo hardware.'
    en: 'Register plants, batteries and consumption points and connect your metering system by webhook: agents compute self-consumption,
      suggest when to use or store energy using Open-Meteo forecasts, and open tickets for technicians. Monitoring software
      only: no hardware control.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: dashboard
  branding:
    theme: light
    palette:
      primary: '#0b3d3a'
      accent: '#f29e1f'
      background: '#f6f9f7'
      foreground: '#14211f'
    fonts:
      body: Inter
      display: Manrope
    wordmark:
    - text: GridWise
      color: primary
    - text: Energy
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Piani
        en: Plans
      href: '#piani'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      label:
        it: Gestore
        en: Operator
      assignedBy: signup
    - key: technician
      label:
        it: Tecnico
        en: Technician
      assignedBy: derived
      from: collection:tickets.technician_email
  limits:
  - action: create:assets
    max: 5
    window: total
    plans:
      plan_s: 20
      plan_m: 100
      plan_l: -1
  agents:
  - key: advisor
    role: scheduled
    description: Analizza i dati di una rete, calcola l'autoconsumo, propone come usare o accumulare l'energia e apre segnalazioni
      per anomalie.
    memory: instance
    writesTo:
      collection: advice
      parse: whole
    profile:
      inline:
        display_name: Energy advisor
        crews:
        - id: advisor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You analyse the monitoring data of ONE local renewable energy network for its operator. You only
            read data and give suggestions: you never control devices. Steps: 1) read the assets (read_assets) and the latest
            readings (read_readings: production, consumption, battery state of charge, grid import/export). 2) Compute self-consumption
            = (production - grid export) / production, and self-sufficiency, over the last 24h, from real readings only. 3)
            Call weather_forecast (Open-Meteo, GET, query like latitude=..&longitude=..&hourly=cloud_cover,shortwave_radiation&forecast_days=2&timezone=auto)
            and combine with consumption profiles to estimate, for the next hours, when it is better to consume directly,
            charge batteries or avoid exporting. 4) Detect anomalous operation (production near zero in daylight with clear
            sky, battery not charging or discharging as expected, missing data, consumption spikes). For each anomaly call
            create_ticket once (fields: asset, severity low|medium|high, description, technician_email copied from the asset
            record, status ''open''); do not duplicate tickets already open (read_tickets first). Never invent figures: say
            when data is missing. Write in the language with ISO code given in the goal. Output: start with a level-1 title
            ''# Energy advice — <network> — <date>'', then sections ## Now (production, consumption, battery, grid), ## Self-consumption
            (with a chart block of hourly production vs consumption if data allow), ## Suggestions for the next hours (clear,
            as proposals the operator decides), ## Anomalies. Chart block format: ```chart {"type":"line","title":"...","labels":[...],"series":[{"name":"...","values":[...]}],"unit":"kW"```.
            At the end call remember with the 5 key points.'
    appTools:
    - name: read_assets
      description: List the operator's plants, batteries and consumption points
      action: read
      collection: assets
      scope: user
    - name: read_readings
      description: Read the operator's latest meter readings
      action: read
      collection: readings
      scope: user
    - name: read_tickets
      description: Read the operator's existing tickets
      action: read
      collection: tickets
      scope: user
    - name: create_ticket
      description: Open a ticket for a technician
      action: write
      collection: tickets
      scope: user
    - name: weather_forecast
      description: Open-Meteo hourly forecast for a location
      action: http
      http:
        method: GET
        url: https://api.open-meteo.com/v1/forecast
        attribution: Weather data by Open-Meteo.com, CC BY 4.0
    goalTemplate: 'Network: {instance}. Location: latitude {lat}, longitude {lon}. Electricity price {tariff} EUR/kWh. Today
      is {date}. Write in the language with ISO code {lang}.'
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.5
  - key: reporter
    role: scheduled
    description: Report periodico con autoconsumo e risparmio.
    memory: none
    writesTo:
      collection: reports
      parse: whole
    profile:
      inline:
        display_name: Energy reporter
        crews:
        - id: reporter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write the weekly report of ONE energy network for its operator. Read the readings of the last
            7 days (read_report_readings) and the tickets (read_report_tickets). Compute from real data only: production,
            consumption, self-consumption %, self-sufficiency %, grid import/export kWh, battery cycles if available, and
            the estimated saving = self-consumed kWh x the electricity price given plus exported kWh x the feed-in price given.
            State assumptions. Start with ''# Weekly energy report — <network> — <date>'', then ## Summary, ## Self-consumption
            and savings (table + a chart block bar of daily self-consumption), ## Anomalies and tickets, ## What to improve.
            Plain and concise, under 400 words; never invent figures.'
    appTools:
    - name: read_report_readings
      description: Read the operator's meter readings
      action: read
      collection: readings
      scope: user
    - name: read_report_tickets
      description: Read the operator's tickets
      action: read
      collection: tickets
      scope: user
    goalTemplate: 'Network: {instance}. Electricity price {tariff} EUR/kWh, feed-in price {feedin} EUR/kWh. Today is {date}.
      Write in the language with ISO code {lang}.'
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.3
  templates:
  - key: network_watch
    title:
      it: Analisi della rete
      en: Network analysis
    description:
      it: Un agente analizza ogni 3 ore la tua rete, propone suggerimenti e apre segnalazioni.
      en: An agent analyses your network every 3 hours, proposes suggestions and opens tickets.
    agent: advisor
    params:
    - name: lat
      type: number
      required: true
      label:
        it: Latitudine
        en: Latitude
    - name: lon
      type: number
      required: true
      label:
        it: Longitudine
        en: Longitude
    - name: tariff
      type: number
      required: true
      label:
        it: Prezzo energia (€/kWh)
        en: Energy price (€/kWh)
    schedule:
      cron: 0 */3 * * *
      userCanChange: false
    maxPerUser: 3
  - key: weekly_report
    title:
      it: Report settimanale
      en: Weekly report
    description:
      it: Ogni lunedì un'email con autoconsumo e risparmio.
      en: Every Monday an email with self-consumption and savings.
    agent: reporter
    params:
    - name: tariff
      type: number
      required: true
      label:
        it: Prezzo acquisto (€/kWh)
        en: Purchase price (€/kWh)
    - name: feedin
      type: number
      required: true
      label:
        it: Prezzo cessione (€/kWh)
        en: Feed-in price (€/kWh)
    schedule:
      cron: 0 6 * * 1
      userCanChange: true
    maxPerUser: 3
    deliver:
      to: owner
      onlyIfNew: true
  triggers:
  - key: meter_hook
    'on':
      webhook: true
    write:
      collection: readings
      fields:
        site: site
        asset: asset
        ts: timestamp
        production_kw: production_kw
        consumption_kw: consumption_kw
        battery_soc: battery_soc
        grid_import_kw: grid_import_kw
        grid_export_kw: grid_export_kw
  - key: ticket_opened
    'on':
      collection: tickets
      op: insert
    notify:
      to:
      - record.technician_email
      - owner
      subject:
        it: 'Nuova segnalazione: {record.asset}'
        en: 'New ticket: {record.asset}'
      body:
        it: 'Anomalia ({record.severity}) su {record.asset}: {record.description}'
        en: 'Anomaly ({record.severity}) on {record.asset}: {record.description}'
      link: tickets
  inputForm:
    title: '-'
    fields: []
  data:
    collections:
    - name: assets
      description: Plants, batteries and consumption points
      ownedBy: user
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome
          en: Name
      - name: kind
        type: select
        required: true
        label:
          it: Tipo
          en: Type
        options:
        - value: plant
          label:
            it: Impianto
            en: Plant
        - value: battery
          label:
            it: Batteria
            en: Battery
        - value: load
          label:
            it: Punto di consumo
            en: Consumption point
      - name: power_kw
        type: number
        label:
          it: Potenza (kW)
          en: Power (kW)
      - name: capacity_kwh
        type: number
        label:
          it: Capacità (kWh)
          en: Capacity (kWh)
      - name: technician_email
        type: email
        label:
          it: Email tecnico
          en: Technician email
    - name: readings
      description: Meter readings received by webhook
      ownedBy: user
      retentionDays: 365
      fields:
      - name: site
        type: text
      - name: asset
        type: text
      - name: ts
        type: date
      - name: production_kw
        type: number
      - name: consumption_kw
        type: number
      - name: battery_soc
        type: number
      - name: grid_import_kw
        type: number
      - name: grid_export_kw
        type: number
    - name: tickets
      description: Anomaly tickets for technicians
      ownedBy: user
      fields:
      - name: asset
        type: text
      - name: severity
        type: select
        options:
        - low
        - medium
        - high
      - name: description
        type: textarea
      - name: technician_email
        type: email
      - name: status
        type: select
        options:
        - open
        - in_progress
        - closed
      access:
      - role: technician
        where:
          technician_email: '{user.email}'
        can:
        - read
        - write
    - name: advice
      description: Suggestions of each network analysis
      ownedBy: instance
    - name: reports
      description: Weekly reports
      ownedBy: instance
  views:
  - key: home
    type: page
    nav: false
    title: GridWise Energy
    sections:
    - type: hero
      title:
        it: La tua rete energetica, **sotto controllo**.
        en: Your energy network, **under control**.
      text:
        it: Produzione, consumo, batterie e scambio con la rete in un cruscotto. Agenti AI che calcolano l'autoconsumo, suggeriscono
          come usare l'energia e avvisano i tecnici.
        en: Production, consumption, batteries and grid exchange in one dashboard. AI agents compute self-consumption, suggest
          how to use energy and alert technicians.
      actions:
      - label:
          it: Inizia
          en: Get started
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Registra
          en: Register
        text:
          it: Impianti, batterie e punti di consumo.
          en: Plants, batteries and consumption points.
        badge: '1'
      - title:
          it: Collega
          en: Connect
        text:
          it: Il tuo sistema di misura invia i dati via webhook.
          en: Your metering system sends data by webhook.
        badge: '2'
      - title:
          it: Decidi
          en: Decide
        text:
          it: Suggerimenti con previsioni Open-Meteo, segnalazioni ai tecnici, report via email.
          en: Suggestions using Open-Meteo forecasts, technician tickets, email reports.
        badge: '3'
    - type: cards
      id: piani
      title:
        it: Piani in base alla potenza gestita
        en: Plans by managed power
      items:
      - title: Small
        text:
          it: Fino a 50 kW — 29 €/mese
          en: Up to 50 kW — €29/month
      - title: Medium
        text:
          it: Fino a 500 kW — 99 €/mese
          en: Up to 500 kW — €99/month
      - title: Large
        text:
          it: Oltre 500 kW — 299 €/mese
          en: Over 500 kW — €299/month
    - type: note
      content:
        it: 'Solo strato software di monitoraggio: nessun controllo dei dispositivi. I suggerimenti sono stime da verificare.
          Dati meteo: Open-Meteo.com (CC BY 4.0).'
        en: 'Monitoring software layer only: no device control. Suggestions are estimates to verify. Weather data: Open-Meteo.com
          (CC BY 4.0).'
  - key: dashboard
    type: page
    title:
      it: Cruscotto
      en: Dashboard
    roles:
    - user
    - admin
    sections:
    - type: data
      title:
        it: Ultime misure
        en: Latest readings
      source: collection:readings
      display: kpi
      kpis:
      - label:
          it: Produzione (kW)
          en: Production (kW)
        agg: last
        field: production_kw
        format: number
      - label:
          it: Consumo (kW)
          en: Consumption (kW)
        agg: last
        field: consumption_kw
        format: number
      - label:
          it: Batteria (%)
          en: Battery (%)
        agg: last
        field: battery_soc
        format: number
      - label:
          it: Scambio rete (kW)
          en: Grid export (kW)
        agg: last
        field: grid_export_kw
        format: number
      sort:
        field: ts
        dir: desc
      limit: 100
    - type: data
      title:
        it: Produzione e consumo per giorno
        en: Production and consumption per day
      source: collection:readings
      display: chart
      chart: line
      fields:
      - key: ts
      - key: production_kw
        label:
          it: Produzione
          en: Production
      - key: consumption_kw
        label:
          it: Consumo
          en: Consumption
      groupBy:
        field: ts
        bucket: day
        aggs:
        - key: production_kw
          agg: avg
          field: production_kw
        - key: consumption_kw
          agg: avg
          field: consumption_kw
      limit: 30
    - type: data
      title:
        it: Ultimi suggerimenti
        en: Latest suggestions
      source: collection:advice
      display: list
      limit: 5
      empty:
        it: Crea un'analisi della rete per ricevere suggerimenti.
        en: Create a network analysis to receive suggestions.
  - key: add_asset
    type: form
    title:
      it: Aggiungi impianto/batteria/consumo
      en: Add plant/battery/load
    collection: assets
    roles:
    - user
    - admin
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Salvato.
        en: Saved.
      redirect: assets
  - key: assets
    type: table
    title:
      it: Impianti
      en: Assets
    source: collection:assets
    columns:
    - name
    - kind
    - power_kw
    - capacity_kwh
    - technician_email
    export: true
    roles:
    - user
    - admin
  - key: watches
    type: instances
    template: network_watch
    title:
      it: Analisi della rete
      en: Network analysis
    roles:
    - user
    - admin
  - key: reports_setup
    type: instances
    template: weekly_report
    title:
      it: Report via email
      en: Email reports
    roles:
    - user
    - admin
  - key: advice_list
    type: list
    title:
      it: Suggerimenti
      en: Suggestions
    source: collection:advice
    roles:
    - user
    - admin
  - key: tickets
    type: table
    title:
      it: Segnalazioni
      en: Tickets
    source: collection:tickets
    columns:
    - asset
    - severity
    - description
    - status
    - technician_email
    roles:
    - user
    - technician
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - user
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: plan_s
      price: 29
      interval: month
      label: Small
      includes:
      - up to 50 kW
    - key: plan_m
      price: 99
      interval: month
      label: Medium
      includes:
      - up to 500 kW
    - key: plan_l
      price: 299
      interval: month
      label: Large
      includes:
      - over 500 kW
  egress:
    hosts:
    - api.open-meteo.com
    notes: Open-Meteo forecast API, CC BY 4.0; commercial use needs an Open-Meteo API subscription.
  extensions:
  - key: webhook_owner
    description: The metering webhook must identify the operator (per-operator hook secret) so readings are saved in that
      operator's records; device hardware control is out of scope.
