apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: forfettario-facile
  displayName: ForfettarioFacile
  tagline:
    it: 'Il regime forfettario sotto controllo: imposte, contributi e scadenze sempre aggiornati.'
  description:
    it: 'Compila il tuo profilo fiscale, registra fatture e incassi: un agente AI calcola imposta sostitutiva, contributi,
      acconti e saldo, ti avvisa vicino alla soglia degli 85.000 euro e risponde alle tue domande fiscali. A fine anno prepara
      la bozza della dichiarazione, controllata da un commercialista.'
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12355b'
      accent: '#1f8a70'
      background: '#f6f8fa'
      foreground: '#16222e'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Forfettario
      color: primary
    - text: Facile
      color: accent
  header:
    links:
    - label: Come funziona
      href: '#come-funziona'
    - label: Prezzo
      href: '#prezzo'
    cta:
      label: Accedi
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Amministratore
      assignedBy: admin_emails
    - key: commercialista
      label: Commercialista
      assignedBy: invite
    - key: user
      label: Libero professionista
      assignedBy: signup
  limits:
  - action: agent:calculator
    per: user
    max: 20
    window: day
    roles:
    - user
  - action: chat
    per: user
    max: 60
    window: day
    roles:
    - user
  agents:
  - key: calculator
    role: main
    description: Calcola imposta sostitutiva, contributi, acconti, saldo e distanza dalla soglia di 85.000 euro.
    profile:
      inline:
        display_name: ForfettarioFacile – calcolo
        crews:
        - id: calculator
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un assistente fiscale per liberi professionisti in regime forfettario italiano. Ricevi il profilo
            (codice ATECO, anno di apertura della partita IVA, cassa previdenziale o gestione separata INPS, altri redditi)
            e l''anno di riferimento. Leggi con gli strumenti le fatture e gli incassi dell''utente. Applica il coefficiente
            di redditività del codice ATECO, l''aliquota sostitutiva (5% per i primi 5 anni di attività se i requisiti sono
            rispettati, altrimenti 15%), la deduzione dei contributi previdenziali versati, il metodo per cassa (contano gli
            incassi), acconti (prima rata 40% e seconda rata 60% del metodo storico) e saldo. Indica sempre le ipotesi usate
            e le aliquote/regole che applichi; se un dato manca o non sei certo di una regola, dillo chiaramente e non inventare
            cifre. Verifica i requisiti di permanenza: soglia di 85.000 euro di ricavi/compensi incassati (avvisa da 70.000
            in su, con un livello ''attenzione'' oltre l''80%; oltre 100.000 uscita immediata), e il limite per altri redditi
            da lavoro dipendente. Struttura del report: il primo rigo è un titolo di livello 1 ''# Situazione fiscale <anno>
            — <data>''. Poi sezioni ## Dati usati, ## Ricavi e soglia 85.000 €, ## Imposta sostitutiva, ## Contributi, ##
            Acconti e saldo (con tabella e prossime scadenze), ## Avvisi, ## Cosa fare ora. Aggiungi un grafico ```chart```
            a barre con ricavi incassati contro soglia quando hai i dati. Non sei un commercialista: i calcoli sono una stima
            a supporto della decisione. Scrivi in italiano.'
          mcp_servers: []
    appTools:
    - name: leggi_fatture
      description: Fatture dell'utente
      action: read
      collection: fatture
      scope: user
    - name: leggi_incassi
      description: Incassi dell'utente
      action: read
      collection: incassi
      scope: user
    - name: leggi_profilo
      description: Profilo fiscale dell'utente
      action: read
      collection: profilo_fiscale
      scope: user
    - name: salva_profilo
      description: Salva o aggiorna il profilo fiscale dell'utente
      action: write
      collection: profilo_fiscale
      scope: user
    goalTemplate: 'Anno di riferimento: {anno}.

      Codice ATECO: {ateco}.

      Anno di apertura della partita IVA: {anno_apertura}.

      Cassa previdenziale: {cassa_label}.

      {?altri_redditi}Altri redditi: {altri_redditi}{/altri_redditi}{!altri_redditi}Altri redditi: nessuno dichiarato.{/altri_redditi}

      Salva prima il profilo con salva_profilo, poi leggi fatture e incassi e calcola. Data di oggi: {date}.'
    output: markdown
    writesTo:
      collection: calcoli
      parse: whole
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.5
  - key: assistant
    role: helper
    description: 'Chat fiscale: risponde alle domande e registra fatture e incassi su richiesta.'
    profile:
      inline:
        display_name: ForfettarioFacile – chat
        crews:
        - id: assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''assistente fiscale di ForfettarioFacile per liberi professionisti in regime forfettario in
            Italia. Rispondi in italiano, in modo chiaro e breve. Usa gli strumenti per leggere il profilo, le fatture, gli
            incassi e l''ultimo calcolo dell''utente, e per registrare un incasso o una bozza di fattura quando l''utente
            lo chiede (conferma i dati prima di scrivere). Non inventare cifre né norme: se non sei sicuro, dillo e suggerisci
            di chiedere al commercialista della piattaforma. Non presentarti come consulente fiscale abilitato. Non puoi inviare
            fatture al Sistema di Interscambio né fare pagamenti.'
          mcp_servers: []
    appTools:
    - name: leggi_fatture
      description: Fatture dell'utente
      action: read
      collection: fatture
      scope: user
    - name: leggi_incassi
      description: Incassi dell'utente
      action: read
      collection: incassi
      scope: user
    - name: leggi_profilo
      description: Profilo fiscale dell'utente
      action: read
      collection: profilo_fiscale
      scope: user
    - name: leggi_calcoli
      description: Calcoli fiscali precedenti dell'utente
      action: read
      collection: calcoli
      scope: user
    - name: registra_incasso
      description: Registra un incasso
      action: append
      collection: incassi
      scope: user
    - name: registra_fattura
      description: Registra una fattura (bozza)
      action: append
      collection: fatture
      scope: user
    goalTemplate: 'Conversazione finora:

      {history}


      Nuovo messaggio dell''utente: {message}

      Data di oggi: {date}.'
    output: markdown
  - key: declaration
    role: helper
    description: Prepara la bozza della dichiarazione dei redditi (quadro LM) e la sottopone al commercialista.
    profile:
      inline:
        display_name: ForfettarioFacile – dichiarazione
        crews:
        - id: declaration
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Prepari la bozza della dichiarazione dei redditi di un libero professionista in regime forfettario
            (quadro LM e dati correlati). Leggi profilo, fatture, incassi e calcoli dell''utente. Primo rigo: ''# Bozza dichiarazione
            redditi <anno>''. Sezioni: ## Dati anagrafici e attività, ## Quadro LM (ricavi, coefficiente, reddito lordo, contributi
            dedotti, imposta sostitutiva, acconti versati, saldo), ## Dati mancanti o dubbi. Non inventare cifre: segnala
            quello che manca. Al termine chiedi la revisione con request_revisione_dichiarazione: solo dopo l''approvazione
            del commercialista la bozza è considerata pronta.'
          mcp_servers: []
    appTools:
    - name: leggi_fatture
      description: Fatture dell'utente
      action: read
      collection: fatture
      scope: user
    - name: leggi_incassi
      description: Incassi dell'utente
      action: read
      collection: incassi
      scope: user
    - name: leggi_profilo
      description: Profilo fiscale dell'utente
      action: read
      collection: profilo_fiscale
      scope: user
    - name: leggi_calcoli
      description: Calcoli fiscali precedenti dell'utente
      action: read
      collection: calcoli
      scope: user
    awaits:
    - revisione_dichiarazione
    goalTemplate: 'Prepara la bozza della dichiarazione per l''anno {anno}. Data di oggi: {date}.'
    output: markdown
    writesTo:
      collection: dichiarazioni
      parse: whole
  - key: deadline_watcher
    role: helper
    description: Per ogni utente, prepara prima di ogni scadenza l'importo da versare e il modello F24 da compilare.
    profile:
      inline:
        display_name: ForfettarioFacile – scadenze
        crews:
        - id: deadline_watcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Controlli la prossima scadenza fiscale di un libero professionista forfettario (saldo e primo acconto
            imposta sostitutiva e contributi, secondo acconto, rate INPS). Leggi profilo, incassi e calcoli dell''utente.
            Se la scadenza cade entro 21 giorni, scrivi: ''# Scadenza <data> — <importo> €'', poi ## Importo da pagare (dettaglio),
            ## F24 precompilato (tabella con sezione, codice tributo, anno di riferimento, importo a debito: usa solo codici
            tributo che conosci con certezza, es. 1792 saldo, 1790 primo acconto, 1791 secondo acconto imposta sostitutiva,
            e segnala di verificarli), ## Note. Se non c''è nessuna scadenza vicina scrivi ''# Nessuna scadenza imminente''
            e una riga. Non inventare cifre.'
          mcp_servers: []
    appTools:
    - name: leggi_incassi
      description: Incassi dell'utente
      action: read
      collection: incassi
      scope: user
    - name: leggi_profilo
      description: Profilo fiscale dell'utente
      action: read
      collection: profilo_fiscale
      scope: user
    - name: leggi_calcoli
      description: Calcoli fiscali precedenti dell'utente
      action: read
      collection: calcoli
      scope: user
    memory: instance
    writesTo:
      collection: scadenze
      parse: whole
    goalTemplate: 'Controlla la prossima scadenza per l''anno {anno}. Data di oggi: {date}.'
    output: markdown
  approvals:
  - key: revisione_dichiarazione
    title: Revisione della dichiarazione dei redditi
    description: Il commercialista della piattaforma controlla la bozza e la approva per la trasmissione.
    role: commercialista
    decidedBy: role
    timeoutMinutes: 10080
    onTimeout: reject
  templates:
  - key: promemoria_scadenze
    title: Promemoria scadenze
    description: Un controllo settimanale sulle tue scadenze fiscali, con importo e F24 precompilato.
    agent: deadline_watcher
    params:
    - name: anno
      type: number
      required: true
      label: Anno di riferimento
    goal: Controlla la prossima scadenza fiscale per l'anno {anno}. Oggi è {date}.
    schedule:
      cron: 0 7 * * 1
      userCanChange: false
    maxPerUser: 1
    roles:
    - user
  inputForm:
    title: Profilo fiscale e calcolo
    fields:
    - name: anno
      type: number
      required: true
      label: Anno di riferimento
      default: 2026
    - name: ateco
      type: text
      required: true
      label: Codice ATECO
      help: es. 62.01.00
    - name: anno_apertura
      type: number
      required: true
      label: Anno di apertura della partita IVA
      help: es. 2023
    - name: cassa
      type: select
      required: true
      label: Cassa previdenziale
      options:
      - value: gestione_separata
        label: Gestione separata INPS
      - value: artigiani
        label: Artigiani INPS
      - value: commercianti
        label: Commercianti INPS
      - value: cassa_professionale
        label: Cassa professionale di categoria
    - name: altri_redditi
      type: textarea
      maxLength: 500
      label: Altri redditi (facoltativo)
      help: es. lavoro dipendente 12.000 € annui
  data:
    collections:
    - name: profilo_fiscale
      ownedBy: user
      description: Profilo fiscale dell'utente
      fields:
      - name: ateco
        type: text
      - name: anno_apertura
        type: number
      - name: cassa
        type: text
      - name: altri_redditi
        type: textarea
    - name: fatture
      ownedBy: user
      description: Fatture emesse dall'utente
      fields:
      - name: numero
        type: text
      - name: data
        type: date
      - name: cliente
        type: text
      - name: importo
        type: number
      - name: stato
        type: text
    - name: incassi
      ownedBy: user
      description: Incassi registrati
      fields:
      - name: data
        type: date
      - name: importo
        type: number
      - name: fattura
        type: text
    - name: calcoli
      ownedBy: user
      description: Storico dei calcoli fiscali
    - name: dichiarazioni
      ownedBy: user
      description: Bozze della dichiarazione dei redditi
    - name: scadenze
      ownedBy: instance
      description: Promemoria di scadenza con importo e F24 precompilato
  views:
  - key: home
    type: page
    title: ForfettarioFacile
    nav: false
    sections:
    - type: hero
      eyebrow: Regime forfettario
      title: Il tuo **forfettario** sotto controllo, tutto l'anno.
      text: Registra fatture e incassi, vedi in ogni momento imposta sostitutiva, contributi, acconti e saldo, e ricevi un
        avviso quando ti avvicini alla soglia degli 85.000 euro.
      actions:
      - label: Inizia ora
        href: /login
        style: primary
      - label: Come funziona
        href: '#come-funziona'
        style: ghost
      band: true
    - type: steps
      id: come-funziona
      title: Come funziona
      items:
      - title: Compila il profilo
        text: Codice ATECO, anno di apertura della partita IVA, cassa previdenziale e altri redditi.
        badge: 📝
      - title: Registra fatture e incassi
        text: Dalla chat o dall'app, per avere sempre i numeri aggiornati.
        badge: 🧾
      - title: L'agente calcola
        text: Imposta sostitutiva, contributi, acconti, saldo e distanza dalla soglia.
        badge: 🧮
      - title: Dichiarazione a fine anno
        text: Bozza preparata dall'agente, controllata dal commercialista della piattaforma.
        badge: ✅
    - type: cards
      id: prezzo
      title: Abbonamento annuale
      intro: Un solo piano, pagato con carta. Ogni utente vede solo i propri dati.
      items:
      - title: Annuale
        text: Calcoli illimitati nei limiti d'uso, chat fiscale, promemoria delle scadenze e revisione della dichiarazione.
        badge: 💳
    - type: note
      content: 'Strumento di supporto alle decisioni: i calcoli sono stime basate sui dati inseriti. La dichiarazione è trasmessa
        solo dopo la revisione del commercialista.'
  - key: nuovo_calcolo
    type: new_run
    title: Profilo e calcolo
    roles:
    - user
    - admin
  - key: storico
    type: history
    title: I miei calcoli
    source: run
    roles:
    - user
    - admin
  - key: situazione
    type: report
    title: Situazione fiscale
    source: run
    printable: true
    nav: false
  - key: chat
    type: chat
    title: Domande fiscali
    source: agent:assistant
    examples:
    - Quanto manca alla soglia degli 85.000 euro?
    - Registra un incasso di 1.200 euro di oggi
    - Quando devo pagare il prossimo acconto?
    placeholder: Scrivi una domanda fiscale…
    roles:
    - user
    - admin
  - key: fatture_view
    type: table
    title: Fatture
    source: collection:fatture
    data:
      display: table
      fields:
      - key: numero
        label: N.
      - key: data
        label: Data
        format: date
      - key: cliente
        label: Cliente
      - key: importo
        label: Importo
        format: money
      - key: stato
        label: Stato
        format: badge
      sort:
        field: data
        dir: desc
      limit: 100
      empty: Nessuna fattura registrata.
    roles:
    - user
  - key: incassi_view
    type: table
    title: Incassi
    source: collection:incassi
    data:
      display: table
      fields:
      - key: data
        label: Data
        format: date
      - key: importo
        label: Importo
        format: money
      - key: fattura
        label: Fattura
      kpis:
      - label: Incassato
        agg: sum
        field: importo
        format: money
      sort:
        field: data
        dir: desc
      limit: 100
      empty: Nessun incasso registrato.
    roles:
    - user
  - key: scadenze_view
    type: instances
    title: Scadenze e F24
    template: promemoria_scadenze
    roles:
    - user
  - key: dichiarazioni_view
    type: table
    title: Dichiarazione dei redditi
    source: collection:dichiarazioni
    data:
      display: list
      fields:
      - key: title
        label: Bozza
      - key: createdAt
        label: Data
        format: date
      limit: 20
      empty: Nessuna bozza ancora.
    roles:
    - user
  - key: revisioni
    type: approvals
    title: Revisioni
    approvals:
    - revisione_dichiarazione
    roles:
    - commercialista
    - admin
  - key: account
    type: account
    title: Abbonamento
    roles:
    - user
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: annuale
      price: 120
      interval: year
      label: ForfettarioFacile annuale
      includes:
      - Calcolo fiscale
      - Chat fiscale
      - Promemoria scadenze
      - Bozza e revisione della dichiarazione
      roles:
      - user
    costs:
      agent:calculator:
        estimate: 0
        requiresPlan: annuale
      agent:declaration:
        estimate: 0
        requiresPlan: annuale
      chat:
        estimate: 0
        requiresPlan: annuale
  extensions:
  - key: fatturazione_sdi
    description: 'Emissione e invio delle fatture elettroniche al Sistema di Interscambio tramite intermediario abilitato:
      richiede un connettore con credenziali dell''intermediario, non ancora disponibile. Per ora fatture e incassi si registrano
      a mano o dalla chat.'
  - key: email_scadenze
    description: 'Email prima di ogni scadenza con importo e F24: le notifiche email non sono ancora disponibili. I promemoria
      appaiono nella vista Scadenze e F24.'
  - key: trasmissione_dichiarazione
    description: 'Trasmissione telematica della dichiarazione da parte del commercialista: la revisione è nell''app (approvazione),
      l''invio all''Agenzia delle Entrate avviene fuori dall''app.'
  - key: pdf_f24
    description: Il modello F24 precompilato è fornito come tabella di dati (codici tributo, importi), non come file PDF.
