apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: forfettariofacile
  displayName: ForfettarioFacile
  tagline: 'Il regime forfettario sotto controllo: fatture, imposte, scadenze e dichiarazione.'
  description: ForfettarioFacile aiuta i liberi professionisti in regime forfettario a registrare fatture e incassi, calcolare
    imposta sostitutiva, contributi, acconti e saldo, ricevere gli avvisi prima delle scadenze e preparare la dichiarazione
    dei redditi, controllata da un commercialista.
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12355b'
      accent: '#1f8a70'
      background: '#f6f8fb'
      foreground: '#16222e'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Forfettario
      color: primary
    - text: Facile
      color: accent
  header:
    links:
    - label: Come funziona
      href: '#come-funziona'
    - label: Cosa include
      href: '#cosa-include'
    cta:
      label: Accedi
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Amministratore
      assignedBy: admin_emails
    - key: commercialista
      label: Commercialista
      assignedBy: invite
    - key: user
      label: Utente
      assignedBy: signup
  limits:
  - action: run
    per: user
    max: 20
    window: day
    roles:
    - user
  - action: chat
    per: user
    max: 60
    window: day
    roles:
    - user
  agents:
  - key: calculator
    role: main
    when: azione == 'calcolo'
    description: Calcola imposta sostitutiva, contributi, acconti e saldo e controlla la soglia degli 85.000 euro.
    profile:
      inline:
        display_name: Calcolatore forfettario
        crews:
        - id: calculator
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'Sei un assistente fiscale specializzato nel regime forfettario italiano (L. 190/2014 e successive
            modifiche). Lavori sui dati dell''utente letti con gli strumenti read_profile (ATECO, anno di apertura partita
            IVA, cassa o gestione separata, altri redditi), read_invoices (fatture emesse) e read_incassi (incassi registrati).
            Nel forfettario vale il principio di cassa: il ricavo rilevante è quello INCASSATO nell''anno, non fatturato.


            Metodo: 1) leggi profilo, fatture e incassi dell''anno richiesto; 2) individua il coefficiente di redditività
            dal codice ATECO e dichiaralo; 3) reddito lordo = incassi x coefficiente; 4) contributi previdenziali secondo
            la cassa (gestione separata INPS, gestione artigiani/commercianti con minimale e riduzione del 35% se richiesta,
            oppure cassa professionale): spiega la base di calcolo; 5) imposta sostitutiva sul reddito al netto dei contributi
            versati: 5% per i primi 5 anni di attività se i requisiti sono rispettati, altrimenti 15%; verifica i requisiti
            dell''aliquota agevolata e segnala dubbi; 6) acconti (primo e secondo) e saldo con le scadenze dell''anno; 7)
            controllo soglia: 85.000 euro di ricavi incassati; segnala se sei oltre l''80%, se superi 85.000 (uscita dal regime
            dall''anno successivo) o 100.000 (uscita immediata, IVA dal momento del superamento); 8) considera gli altri redditi
            dichiarati (cause ostative, soglia di 30.000 euro di lavoro dipendente se prevista dalle regole vigenti).


            Usa il MCP webrobot per verificare i parametri dell''anno (aliquote INPS, scadenze, regole) su fonti ufficiali
            (agenziaentrate.gov.it, inps.it, mef.gov.it) quando non sei certo; cita la fonte. Non inventare cifre: se un dato
            manca, scrivi l''ipotesi fatta e chiedi di completarlo.


            Azioni sui dati: per ogni versamento calcolato chiama write_f24 (una riga per scadenza: tributo, codice_tributo,
            anno, scadenza AAAA-MM-GG, importo, stato da_pagare, note); evita duplicati leggendo prima le righe esistenti
            con read_f24 e aggiorna solo ciò che serve. Se i ricavi incassati superano l''80% della soglia, chiama write_avviso
            con livello (attenzione oppure superata), messaggio e importo incassato; non ripetere un avviso già emesso con
            lo stesso livello nello stesso anno.


            Report in italiano, con titolo di primo livello "# Situazione fiscale <anno> — <data>" e sezioni ## : Riepilogo,
            Ricavi incassati e soglia 85.000 euro, Imposta sostitutiva, Contributi, Acconti e saldo, Scadenze e importi, Ipotesi
            e punti da verificare. Aggiungi un grafico con blocco ```chart (tipo bar) che confronta incassi, soglia, imposta
            e contributi, con soli numeri reali. Chiudi con l''avvertenza: stima di supporto, non sostituisce la consulenza
            del commercialista.'
    goalTemplate: 'Calcola la situazione fiscale forfettaria per l''anno {anno}. Oggi è {date}. Leggi profilo, fatture e incassi
      con i tuoi strumenti.

      {?note}Note dell''utente: {note}{/note}

      Scrivi il report in italiano (lingua {lang}).'
    appTools:
    - name: read_profile
      description: Legge il profilo fiscale dell'utente
      action: read
      collection: profile
      scope: user
    - name: read_invoices
      description: Legge le fatture emesse dall'utente
      action: read
      collection: invoices
      scope: user
    - name: read_incassi
      description: Legge gli incassi registrati dall'utente
      action: read
      collection: incassi
      scope: user
    - name: read_f24
      description: Legge le scadenze e gli importi F24 già calcolati
      action: read
      collection: f24
      scope: user
    - name: write_f24
      description: Crea o aggiorna una scadenza di versamento F24
      action: write
      collection: f24
      scope: user
    - name: write_avviso
      description: Registra un avviso di soglia 85.000 euro
      action: write
      collection: avvisi
      scope: user
    output: markdown
    writesTo:
      collection: calcoli
      parse: whole
    limits:
      maxTurns: 25
      maxBudgetUsd: 1.0
  - key: dichiarazione
    role: main
    when: azione == 'dichiarazione'
    description: Prepara la bozza della dichiarazione dei redditi (Redditi PF, quadro LM) e la sottopone al commercialista.
    awaits:
    - revisione_dichiarazione
    profile:
      inline:
        display_name: Redattore dichiarazione
        crews:
        - id: dichiarazione
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 20
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un assistente fiscale che prepara la BOZZA della dichiarazione dei redditi di un contribuente
            in regime forfettario (Redditi Persone Fisiche, quadro LM e quadri collegati). Leggi profilo, fatture, incassi
            e versamenti F24 con read_profile, read_invoices, read_incassi, read_f24 per l''anno richiesto. Usa il principio
            di cassa. Riporta: dati anagrafici fiscali disponibili, codice ATECO, coefficiente di redditività, ricavi incassati,
            reddito lordo, contributi previdenziali dedotti, reddito netto, aliquota (5% o 15%), imposta sostitutiva dovuta,
            acconti versati, saldo o credito, altri redditi dichiarati. Elenca in una sezione ''Da verificare'' tutto ciò
            che manca o è incerto; non inventare mai cifre né dati personali. Salva la bozza con write_declaration (anno,
            bozza in testo, stato in_revisione) e poi chiama request_revisione_dichiarazione: la dichiarazione NON viene trasmessa
            finché il commercialista della piattaforma non l''ha controllata. Report in italiano con titolo "# Bozza dichiarazione
            dei redditi <anno>" e sezioni ## Dati del contribuente, Quadro LM, Imposta e saldo, Da verificare, Stato della
            revisione. Spiega all''utente che la trasmissione è fatta dal commercialista dopo il controllo.'
    goalTemplate: 'Prepara la bozza della dichiarazione dei redditi per l''anno d''imposta {anno}. Oggi è {date}. Leggi i
      dati con i tuoi strumenti, salva la bozza e chiedi la revisione.

      {?note}Note dell''utente: {note}{/note}

      Scrivi in italiano (lingua {lang}).'
    appTools:
    - name: read_profile
      description: Legge il profilo fiscale dell'utente
      action: read
      collection: profile
      scope: user
    - name: read_invoices
      description: Legge le fatture emesse dall'utente
      action: read
      collection: invoices
      scope: user
    - name: read_incassi
      description: Legge gli incassi registrati dall'utente
      action: read
      collection: incassi
      scope: user
    - name: read_f24
      description: Legge le scadenze e gli importi F24 già calcolati
      action: read
      collection: f24
      scope: user
    - name: write_declaration
      description: Salva la bozza della dichiarazione dei redditi
      action: write
      collection: declarations
      scope: user
    output: markdown
    limits:
      maxTurns: 20
      maxBudgetUsd: 1.0
  - key: consulente
    role: helper
    description: Risponde alle domande fiscali sul regime forfettario, sui dati dell'utente.
    profile:
      inline:
        display_name: Consulente forfettario
        crews:
        - id: consulente
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un consulente che risponde in italiano a domande sul regime forfettario (requisiti, soglie 85.000
            e 100.000 euro, coefficienti, aliquote 5% e 15%, contributi INPS, acconti, saldo, fatturazione elettronica, bollo,
            F24, dichiarazione). Puoi leggere il profilo, le fatture e gli incassi dell''utente con read_profile, read_invoices,
            read_incassi per rispondere in modo personalizzato. Sii chiaro e breve; indica l''anno a cui si riferisce la regola
            e dichiara quando non sei sicuro che sia ancora in vigore. Non inventare cifre e non presentare come certi pareri
            legali: per i casi dubbi suggerisci di chiedere al commercialista della piattaforma.'
    goalTemplate: 'Conversazione finora:

      {history}


      Nuovo messaggio dell''utente: {message}

      Rispondi in italiano.'
    appTools:
    - name: read_profile
      description: Legge il profilo fiscale dell'utente
      action: read
      collection: profile
      scope: user
    - name: read_invoices
      description: Legge le fatture emesse dall'utente
      action: read
      collection: invoices
      scope: user
    - name: read_incassi
      description: Legge gli incassi registrati dall'utente
      action: read
      collection: incassi
      scope: user
    output: markdown
  inputForm:
    title: Calcoli e dichiarazione
    fields:
    - name: azione
      type: select
      required: true
      label: Cosa vuoi fare
      default: calcolo
      options:
      - value: calcolo
        label: Calcola imposte, contributi e scadenze
      - value: dichiarazione
        label: Prepara la bozza della dichiarazione dei redditi
    - name: anno
      type: number
      required: true
      label: Anno d'imposta
      default: 2026
    - name: note
      type: textarea
      maxLength: 500
      label: Note (facoltative)
  data:
    collections:
    - name: profile
      description: Profilo fiscale dell'utente
      ownedBy: user
      access:
      - role: commercialista
      fields:
      - name: ateco
        type: text
        required: true
        label: Codice ATECO
        help: Es. 62.01.00
      - name: anno_apertura
        type: number
        required: true
        label: Anno di apertura della partita IVA
      - name: cassa
        type: select
        required: true
        label: Cassa previdenziale
        options:
        - value: gestione_separata
          label: Gestione separata INPS
        - value: artigiani
          label: Gestione artigiani INPS
        - value: commercianti
          label: Gestione commercianti INPS
        - value: cassa_professionale
          label: Cassa professionale
      - name: riduzione_35
        type: boolean
        label: Riduzione contributiva del 35% (artigiani/commercianti)
      - name: altri_redditi
        type: textarea
        maxLength: 600
        label: Altri redditi (lavoro dipendente, immobili, altro)
    - name: invoices
      description: Fatture elettroniche emesse
      ownedBy: user
      access:
      - role: commercialista
      fields:
      - name: numero
        type: text
        required: true
        label: Numero
      - name: data
        type: date
        required: true
        label: Data
      - name: cliente
        type: text
        required: true
        label: Cliente
      - name: cliente_piva_cf
        type: text
        required: true
        label: P.IVA / Codice fiscale cliente
      - name: codice_destinatario
        type: text
        label: Codice destinatario / PEC
        maxLength: 20
      - name: descrizione
        type: textarea
        required: true
        label: Descrizione
      - name: imponibile
        type: number
        required: true
        label: Importo (€)
      - name: bollo
        type: boolean
        label: Marca da bollo 2 €
      - name: stato
        type: select
        label: Stato
        default: bozza
        options:
        - value: bozza
          label: Bozza
        - value: inviata
          label: Inviata allo SdI
        - value: consegnata
          label: Consegnata
        - value: scartata
          label: Scartata
    - name: incassi
      description: Incassi registrati
      ownedBy: user
      access:
      - role: commercialista
      fields:
      - name: fattura
        type: text
        required: true
        label: Numero fattura
      - name: data
        type: date
        required: true
        label: Data incasso
      - name: importo
        type: number
        required: true
        label: Importo incassato (€)
      - name: metodo
        type: select
        label: Metodo
        options:
        - bonifico
        - carta
        - contanti
        - altro
    - name: f24
      description: Versamenti da effettuare, calcolati dall'agente
      ownedBy: user
      access:
      - role: commercialista
      fields:
      - name: tributo
        type: text
        label: Tributo
      - name: codice_tributo
        type: text
        label: Codice tributo
      - name: anno
        type: number
        label: Anno
      - name: scadenza
        type: date
        label: Scadenza
      - name: importo
        type: number
        label: Importo (€)
      - name: stato
        type: select
        label: Stato
        default: da_pagare
        options:
        - da_pagare
        - pagato
      - name: note
        type: textarea
        label: Note e righe del modello F24
    - name: avvisi
      description: Avvisi sulla soglia degli 85.000 euro
      ownedBy: user
      fields:
      - name: livello
        type: select
        options:
        - attenzione
        - superata
      - name: messaggio
        type: textarea
      - name: incassato
        type: number
      - name: anno
        type: number
    - name: calcoli
      description: Storico dei calcoli fiscali
      ownedBy: user
    - name: declarations
      description: Bozze della dichiarazione dei redditi
      ownedBy: user
      access:
      - role: commercialista
        can:
        - read
        - write
      fields:
      - name: anno
        type: number
        label: Anno d'imposta
      - name: bozza
        type: textarea
        label: Bozza
      - name: stato
        type: select
        label: Stato
        default: in_revisione
        options:
        - value: in_revisione
          label: In revisione
        - value: approvata
          label: Approvata
        - value: trasmessa
          label: Trasmessa
        - value: respinta
          label: Da correggere
      - name: note_commercialista
        type: textarea
        label: Note del commercialista
  views:
  - key: home
    type: page
    title: ForfettarioFacile
    nav: false
    sections:
    - type: hero
      eyebrow: Per liberi professionisti in regime forfettario
      title: Il forfettario **sotto controllo**, tutto l'anno.
      text: Emetti le fatture, registra gli incassi e sai sempre quanto devi di imposta sostitutiva e contributi. Ti avvisiamo
        prima di ogni scadenza e a fine anno la dichiarazione la controlla un commercialista.
      actions:
      - label: Inizia ora
        href: /login
        style: primary
      - label: Come funziona
        href: '#come-funziona'
        style: ghost
    - type: steps
      id: come-funziona
      title: Come funziona
      items:
      - title: Compila il profilo
        text: 'Codice ATECO, anno di apertura, cassa previdenziale e altri redditi: una sola volta.'
      - title: Fattura e incassa
        text: Emetti le fatture elettroniche, inviate allo SdI tramite un intermediario abilitato, e registra gli incassi.
      - title: Calcola e paga
        text: L'agente calcola imposta, contributi, acconti e saldo e ti manda l'email con l'importo prima di ogni scadenza.
      - title: Dichiara
        text: 'A fine anno prepara la bozza della dichiarazione: il commercialista la controlla e la trasmette.'
    - type: cards
      id: cosa-include
      title: Cosa include
      items:
      - title: Soglia 85.000 €
        text: Un avviso quando ti avvicini al limite dei ricavi incassati.
        badge: ⚠️
      - title: Scadenze F24
        text: Importi e codici tributo pronti per il versamento.
        badge: 📅
      - title: Chat fiscale
        text: Chiedi qualsiasi cosa sul regime forfettario.
        badge: 💬
      - title: I tuoi dati, solo tuoi
        text: Ogni utente vede soltanto i propri dati.
        badge: 🔒
    - type: note
      content: Abbonamento annuale con pagamento con carta. Le stime sono di supporto e non sostituiscono la consulenza di
        un professionista abilitato.
  - key: profilo
    type: form
    title: Il mio profilo fiscale
    collection: profile
    edit: true
    submit:
      label: Salva profilo
      message: Profilo salvato.
      redirect: nuova_fattura
    roles:
    - user
    - admin
  - key: nuova_fattura
    type: form
    title: Nuova fattura
    collection: invoices
    submit:
      label: Emetti fattura
      message: Fattura salvata.
      redirect: fatture
    roles:
    - user
    - admin
  - key: fatture
    type: table
    title: Le mie fatture
    source: collection:invoices
    columns:
    - numero
    - data
    - cliente
    - imponibile
    - stato
    export: true
    roles:
    - user
    - admin
  - key: nuovo_incasso
    type: form
    title: Registra incasso
    collection: incassi
    submit:
      label: Registra
      message: Incasso registrato.
      redirect: incassi_elenco
    roles:
    - user
    - admin
  - key: incassi_elenco
    type: table
    title: I miei incassi
    source: collection:incassi
    columns:
    - fattura
    - data
    - importo
    - metodo
    export: true
    roles:
    - user
    - admin
  - key: calcolo
    type: new_run
    title: Calcoli e dichiarazione
    roles:
    - user
    - admin
  - key: storico
    type: history
    title: Storico
    source: run
    roles:
    - user
    - admin
  - key: rapporto
    type: report
    source: run
    printable: true
    nav: false
  - key: scadenze
    type: table
    title: Scadenze e F24
    source: collection:f24
    columns:
    - scadenza
    - tributo
    - codice_tributo
    - importo
    - stato
    export: true
    roles:
    - user
    - admin
  - key: assistente
    type: chat
    title: Domande fiscali
    source: agent:consulente
    examples:
    - Quanto manca alla soglia degli 85.000 euro?
    - Quando scade il secondo acconto?
    - Posso dedurre i contributi versati?
    placeholder: Chiedi qualcosa sul regime forfettario
    roles:
    - user
    - admin
  - key: dichiarazioni
    type: table
    title: Dichiarazioni dei redditi
    source: collection:declarations
    columns:
    - anno
    - stato
    - note_commercialista
    roles:
    - user
    - commercialista
    - admin
  - key: revisione
    type: form
    title: Revisione dichiarazione
    collection: declarations
    edit: true
    submit:
      label: Salva revisione
      message: Revisione salvata.
    nav: false
    roles:
    - commercialista
    - admin
  - key: revisioni
    type: approvals
    title: Dichiarazioni da controllare
    approvals:
    - revisione_dichiarazione
    roles:
    - commercialista
    - admin
  - key: account
    type: account
    title: Abbonamento
    roles:
    - user
  approvals:
  - key: revisione_dichiarazione
    title: Revisione della dichiarazione dei redditi
    description: Il commercialista controlla la bozza e, se corretta, la trasmette.
    role: commercialista
    decidedBy: role
    fields:
    - anno
    - bozza
    timeoutMinutes: 10080
    onTimeout: reject
  triggers:
  - key: promemoria_f24
    description: Email una settimana prima di ogni scadenza con importo e dati F24
    'on':
      date:
        collection: f24
        field: scadenza
        offsetDays: -7
        hour: 8
      where:
        stato: da_pagare
    notify:
      to: owner
      subject: 'Scadenza fiscale {record.scadenza}: {record.tributo} — € {record.importo}'
      body: 'Ciao, il {record.scadenza} scade il versamento: {record.tributo}.

        Importo da pagare: € {record.importo}

        Codice tributo: {record.codice_tributo} (anno {record.anno})


        Righe precompilate del modello F24:

        {record.note}


        Paga con il modello F24 dal tuo home banking e segna il versamento come pagato nell''app.'
      link: scadenze
  - key: ricalcolo_incasso
    description: Ad ogni incasso ricalcola e controlla la soglia
    'on':
      collection: incassi
      op: insert
    start:
      agent: calculator
    goal: È stato registrato un incasso di {record.importo} euro in data {record.data}. Ricalcola la situazione fiscale dell'anno
      in corso, aggiorna le scadenze F24 e controlla la soglia degli 85.000 euro. Scrivi il report in italiano.
    asUser: true
  - key: avviso_soglia
    'on':
      collection: avvisi
      op: insert
    notify:
      to: owner
      subject: 'Attenzione: soglia degli 85.000 euro'
      body: '{record.messaggio}


        Incassato nell''anno: € {record.incassato}.

        Controlla il dettaglio nel tuo ultimo calcolo.'
      link: storico
  - key: dichiarazione_approvata
    'on':
      approval: revisione_dichiarazione
      decision: approved
    notify:
      to: owner
      subject: La tua dichiarazione è stata approvata
