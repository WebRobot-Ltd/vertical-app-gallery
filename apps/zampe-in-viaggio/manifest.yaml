apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: zampe-in-viaggio
  displayName: Zampe in Viaggio
  tagline:
    it: Viaggia con il tuo cane o gatto con la checklist giusta.
    en: Travel with your dog or cat with the right checklist.
  description:
    it: Crea il profilo dei tuoi animali, descrivi il viaggio e ricevi una checklist personalizzata basata sulle regole pubbliche
      di compagnie e autorità sanitarie. Solo informazioni, nessuna prenotazione.
    en: Create your pets' profiles, describe your trip and get a personalised checklist based on public carrier and health
      authority rules. Information only, no booking.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#2f4a3a'
      accent: '#e07a3f'
      background: '#fbf8f3'
      foreground: '#1f2622'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: 'Zampe in '
      color: primary
    - text: Viaggio
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Prezzi
        en: Pricing
      href: '#prezzi'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  limits:
  - action: agent:planner
    per: user
    max: 3
    window: total
    roles:
    - user
    plans:
      annual: -1
  - action: chat
    per: user
    max: 60
    window: day
    roles:
    - user
  agents:
  - key: planner
    role: main
    description: Builds the personalised travel checklist from the rules knowledge base.
    profile:
      inline:
        display_name: Zampe in Viaggio planner
        crews:
        - id: planner
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are a travel-with-pets advisor for dogs and cats. You ONLY use the rules knowledge base through
            the tool rules_search (search it several times: by carrier/mode, by destination country, by topic such as passport,
            rabies, microchip, tapeworm, breed restrictions) and the facts given in the goal. Never invent rules, sizes, deadlines
            or prices: if the knowledge base has no rule for something, say it is not in the knowledge base and tell the user
            to confirm with the carrier or the health authority. Always cite the source name and URL returned by the tool
            and the date it was last checked. Costs are indicative and must be labelled as such. You do not book anything
            and do not recommend hotels or booking portals.


            Report structure (write in the language with the ISO code given in the goal): a level-1 title ''# <Pet name> —
            <origin> → <destination>''. Then ## Verdict (cabin, hold, or not allowed, with the reason: weight with carrier,
            breed, brachycephalic restrictions, season/temperature embargoes), ## Carrier (allowed dimensions and weight,
            type), ## Documents and deadlines (a table: document, what it is, how many days before departure, status vs the
            pet''s data e.g. vaccination date, microchip), ## Entry requirements for the destination (and transit countries),
            ## Indicative costs (table), ## Timeline (a countdown from the departure date, with today''s date), ## Risks and
            things to verify, ## Sources. Be concrete and compact. Add that the rules can change and that this is information,
            not legal advice.'
    goalTemplate: 'Today is {date}. Write in the language with ISO code {lang}.

      Pet: {pet_name}, species {pet_species}, breed {pet_breed}, age {pet_age} years, weight with carrier {pet_weight} kg,
      microchip {pet_chip}, passport {pet_passport}, rabies vaccination date {pet_rabies}, vaccinations: {pet_vaccines}.

      Trip: from {origin} to {destination}, transport {mode_label}, departure {depart_date}{?return_date}, return {return_date}{/return_date}.

      {?carrier}Carrier or company: {carrier}{/carrier}

      {?notes}Notes: {notes}{/notes}'
    context:
    - key: pet_name
      from: collection:pets.name
    - key: pet_species
      from: collection:pets.species
    - key: pet_breed
      from: collection:pets.breed
    - key: pet_age
      from: collection:pets.age_years
    - key: pet_weight
      from: collection:pets.weight_with_carrier_kg
    - key: pet_chip
      from: collection:pets.microchip
    - key: pet_passport
      from: collection:pets.eu_passport
    - key: pet_rabies
      from: collection:pets.rabies_date
    - key: pet_vaccines
      from: collection:pets.vaccinations
    appTools:
    - name: rules_search
      description: Search the knowledge base of public rules (carriers and health authorities) by carrier, mode, country or
        topic
      action: search
      collection: rules
      scope: all
    output: markdown
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.6
  - key: assistant
    role: helper
    description: Answers follow-up questions about the user's pets and trips.
    profile:
      inline:
        display_name: Zampe in Viaggio assistant
        crews:
        - id: assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You answer questions from people travelling with dogs and cats. Use rules_search for carrier and
            health-authority rules and my_pets for the user''s own pets. Never invent rules or figures: when the knowledge
            base does not cover it, say so and suggest confirming with the carrier or authority. Cite sources. Keep answers
            short, friendly and practical. You give information only: no bookings, no hotel advice, no veterinary or legal
            advice as fact.'
    goalTemplate: 'Language: {lang}. Today: {date}.

      Conversation so far:

      {history}

      New message from the user: {message}'
    appTools:
    - name: rules_search
      description: Search the knowledge base of public rules (carriers and health authorities) by carrier, mode, country or
        topic
      action: search
      collection: rules
      scope: all
    - name: my_pets
      description: Read the signed-in user's pets
      action: read
      collection: pets
      scope: user
    output: markdown
  - key: rules_updater
    role: scheduled
    description: Weekly re-checks the public rules of airlines, railways, ferry operators and health authorities and updates
      the knowledge base.
    profile:
      inline:
        display_name: Zampe in Viaggio rules updater
        crews:
        - id: updater
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You maintain a knowledge base of PUBLIC rules on transporting dogs and cats: major airlines (cabin/hold,
            carrier size and weight, breed and season restrictions, fees), railways (Trenitalia, Italo, SNCF, DB, Eurostar
            and similar), ferry operators (Grimaldi, Moby, Tirrenia, GNV, Corsica Ferries and similar), car travel rules,
            and official health authority pages (EU pet passport, rabies vaccination and titre, microchip, tapeworm treatment,
            entry requirements of the most visited countries: EU, UK, Switzerland, Norway, USA, Canada, Australia, UAE, Turkey).
            Use the WebRobot MCP to read the official public pages; use only official sources and respect their terms. Never
            invent: record only what the page says.


            Output: one Markdown section per rule set, each starting with ''## <Entity> — <topic>'' (unique, e.g. ''## Lufthansa
            — cabin and hold''). Under each heading write these lines exactly: ''mode:'' (air|train|ferry|car|authority),
            ''entity:'', ''country:'', ''topic:'', ''summary:'' (the concrete rule: sizes, weights, days of notice, fees,
            documents), ''source_url:'', ''checked:'' (today''s date, ISO). If a rule changed with respect to what you read
            in the previous version, add a line ''change:'' saying what changed. Start the output with ''# Rules update <date>''.'
    writesTo:
      collection: rules
      parse: markdown_sections
      keyBy: title
    output: markdown
    limits:
      maxTurns: 40
      maxBudgetUsd: 2
      timeoutSeconds: 3000
  - key: watcher
    role: helper
    description: Weekly checks one saved trip against the current rules and reports what changed.
    memory: instance
    writesTo:
      collection: watch_reports
    profile:
      inline:
        display_name: Zampe in Viaggio trip watcher
        crews:
        - id: watcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You watch one saved trip of one person travelling with a pet. Use my_pets to read the pet, and rules_search
            to find the rules for the carrier/mode, the destination country and any transit. Your memory holds the key rules
            you saw last time: compare them with the current ones. Write ''# <Pet> — <destination>: rules update <date>''.
            If a rule that affects THIS trip changed (carrier size/weight, fees, documents, deadlines, entry requirements),
            write ## What changed (old vs new, with source URL) and ## What to do now (with deadlines relative to the departure
            date). If nothing relevant changed, write exactly one short paragraph saying so, and keep the text identical to
            the previous ''no changes'' wording so no email is sent. Never invent rules. At the end call remember once with
            the 6 key rules of this trip (they replace the old ones). Information only, not legal advice.'
    goalTemplate: Check the saved trip "{instance}". Today is {date}. Write in the language with ISO code {lang}.
    appTools:
    - name: rules_search
      description: Search the knowledge base of public rules (carriers and health authorities) by carrier, mode, country or
        topic
      action: search
      collection: rules
      scope: all
    - name: my_pets
      description: Read the signed-in user's pets
      action: read
      collection: pets
      scope: user
    output: markdown
  inputForm:
    title:
      it: Nuovo viaggio
      en: New trip
    fields:
    - name: pet
      type: select
      required: true
      optionsFrom: collection:pets
      label:
        it: Animale
        en: Pet
    - name: origin
      type: text
      required: true
      label:
        it: Partenza
        en: Departure
    - name: destination
      type: text
      required: true
      label:
        it: Destinazione
        en: Destination
    - name: depart_date
      type: date
      required: true
      label:
        it: Data di partenza
        en: Departure date
    - name: return_date
      type: date
      label:
        it: Data di ritorno
        en: Return date
    - name: mode
      type: select
      required: true
      label:
        it: Mezzo
        en: Transport
      options:
      - value: air
        label:
          it: Aereo
          en: Plane
      - value: train
        label:
          it: Treno
          en: Train
      - value: ferry
        label:
          it: Traghetto
          en: Ferry
      - value: car
        label:
          it: Auto
          en: Car
    - name: carrier
      type: text
      label:
        it: Compagnia (facoltativo)
        en: Carrier (optional)
    - name: notes
      type: textarea
      maxLength: 500
      label:
        it: Note (facoltative)
        en: Notes (optional)
  data:
    collections:
    - name: pets
      ownedBy: user
      description: The user's pets
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome
          en: Name
      - name: species
        type: select
        required: true
        label:
          it: Specie
          en: Species
        options:
        - value: dog
          label:
            it: Cane
            en: Dog
        - value: cat
          label:
            it: Gatto
            en: Cat
      - name: breed
        type: text
        required: true
        label:
          it: Razza
          en: Breed
      - name: weight_with_carrier_kg
        type: number
        required: true
        label:
          it: Peso con trasportino (kg)
          en: Weight with carrier (kg)
      - name: age_years
        type: number
        label:
          it: Età (anni)
          en: Age (years)
      - name: microchip
        type: text
        label:
          it: Microchip
          en: Microchip
      - name: eu_passport
        type: boolean
        label:
          it: Passaporto europeo
          en: EU passport
      - name: rabies_date
        type: date
        label:
          it: Data antirabbica
          en: Rabies vaccination date
      - name: vaccinations
        type: textarea
        maxLength: 800
        label:
          it: Altre vaccinazioni
          en: Other vaccinations
    - name: rules
      ownedBy: app
      description: Knowledge base of public rules, updated weekly
      fields:
      - name: title
        type: text
      - name: mode
        type: text
      - name: entity
        type: text
      - name: country
        type: text
      - name: topic
        type: text
      - name: summary
        type: textarea
      - name: source_url
        type: url
      - name: checked
        type: date
      - name: change
        type: textarea
    - name: watch_reports
      ownedBy: instance
      description: Weekly rule updates of each saved trip
  views:
  - key: home
    type: page
    nav: false
    title: Zampe in Viaggio
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow:
        it: Cani e gatti in viaggio
        en: Dogs and cats on the move
      title:
        it: Viaggia con il tuo **cane o gatto**, senza sorprese.
        en: Travel with your **dog or cat**, no surprises.
      text:
        it: 'Crea il profilo del tuo animale, descrivi il viaggio e ricevi una checklist personalizzata: cabina o stiva, trasportino,
          documenti con le scadenze e costi indicativi. Basata sulle regole pubbliche di compagnie e autorità sanitarie.'
        en: 'Create your pet''s profile, describe the trip and get a personalised checklist: cabin or hold, carrier, documents
          with deadlines and indicative costs. Based on public carrier and health authority rules.'
      actions:
      - label:
          it: Inizia gratis
          en: Start free
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Profilo dell'animale
          en: Pet profile
        text:
          it: Specie, razza, peso con trasportino, età, microchip e vaccinazioni.
          en: Species, breed, weight with carrier, age, microchip and vaccinations.
        badge: 🐾
      - title:
          it: Il tuo viaggio
          en: Your trip
        text:
          it: 'Partenza, destinazione, date e mezzo: aereo, treno, traghetto o auto.'
          en: 'Departure, destination, dates and transport: plane, train, ferry or car.'
        badge: 🧳
      - title:
          it: Checklist e chat
          en: Checklist and chat
        text:
          it: Ricevi il report e fai domande all'assistente.
          en: Get the report and ask the assistant your questions.
        badge: ✅
      - title:
          it: Avvisi
          en: Alerts
        text:
          it: 'Le regole sono ricontrollate ogni settimana: se cambia qualcosa per un viaggio salvato, ti scriviamo.'
          en: 'Rules are re-checked weekly: if something changes for a saved trip, we email you.'
        badge: 📧
    - type: cards
      id: prezzi
      title:
        it: Prezzi
        en: Pricing
      items:
      - title:
          it: Gratis
          en: Free
        text:
          it: 3 checklist base e domande in chat.
          en: 3 basic checklists and chat questions.
      - title:
          it: Annuale
          en: Annual
        text:
          it: Viaggi illimitati e avvisi email quando cambiano le regole.
          en: Unlimited trips and email alerts when rules change.
    - type: note
      content:
        it: 'Solo informazioni, non consulenza legale o veterinaria. Le regole possono cambiare: conferma sempre con la compagnia
          e l''autorità sanitaria. Nessuna prenotazione.'
        en: 'Information only, not legal or veterinary advice. Rules can change: always confirm with the carrier and health
          authority. No booking.'
  - key: pets
    type: table
    title:
      it: I miei animali
      en: My pets
    source: collection:pets
    columns:
    - name
    - species
    - breed
    - weight_with_carrier_kg
    - age_years
    - rabies_date
    roles:
    - user
    - admin
  - key: pet_form
    type: form
    title:
      it: Aggiungi animale
      en: Add a pet
    collection: pets
    edit: true
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Animale salvato
        en: Pet saved
      redirect: pets
    roles:
    - user
    - admin
  - key: new
    type: new_run
    title:
      it: Nuovo viaggio
      en: New trip
    roles:
    - user
    - admin
  - key: trips
    type: history
    title:
      it: Le mie checklist
      en: My checklists
    source: run
    roles:
    - user
    - admin
  - key: checklist
    type: report
    source: run
    printable: true
    nav: false
  - key: ask
    type: chat
    title:
      it: Chiedi all'assistente
      en: Ask the assistant
    source: agent:assistant
    placeholder:
      it: Es. Posso portare il mio cane in cabina su Lufthansa?
      en: E.g. Can my dog travel in the cabin on Lufthansa?
    examples:
    - it: Quali documenti servono per entrare nel Regno Unito con un gatto?
      en: Which documents do I need to enter the UK with a cat?
    - it: Quanti giorni prima serve l'antirabbica?
      en: How many days before travel is the rabies shot needed?
    roles:
    - user
    - admin
  - key: watches
    type: instances
    template: trip_watch
    title:
      it: Viaggi con avvisi
      en: Trips with alerts
    roles:
    - user
    - admin
  - key: rules_kb
    type: table
    title:
      it: Regole monitorate
      en: Monitored rules
    source: collection:rules
    columns:
    - entity
    - topic
    - country
    - summary
    - checked
    - source_url
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - user
  schedules:
  - agent: rules_updater
    cron: 0 4 * * 1
    action: run
    owner: app
    goal: Re-check this week the public rules for pet transport (airlines, railways, ferries, car) and the health authority
      entry requirements, and write the updated knowledge base. Today is {date}.
  templates:
  - key: trip_watch
    title:
      it: Avvisi di viaggio
      en: Trip alerts
    description:
      it: Ogni settimana ricontrolla le regole del tuo viaggio e ti scrive se cambia qualcosa.
      en: Every week re-checks the rules for your trip and emails you if something changes.
    agent: watcher
    params:
    - name: pet
      type: select
      required: true
      optionsFrom: collection:pets
      label:
        it: Animale
        en: Pet
    - name: origin
      type: text
      required: true
      label:
        it: Partenza
        en: Departure
    - name: destination
      type: text
      required: true
      label:
        it: Destinazione
        en: Destination
    - name: depart_date
      type: date
      required: true
      label:
        it: Data di partenza
        en: Departure date
    - name: mode
      type: select
      required: true
      label:
        it: Mezzo
        en: Transport
      options:
      - value: air
        label:
          it: Aereo
          en: Plane
      - value: train
        label:
          it: Treno
          en: Train
      - value: ferry
        label:
          it: Traghetto
          en: Ferry
      - value: car
        label:
          it: Auto
          en: Car
    - name: carrier
      type: text
      label:
        it: Compagnia (facoltativo)
        en: Carrier (optional)
    goal: 'Check the saved trip "{instance}": pet {pet}, from {origin} to {destination}, transport {mode}, departure {depart_date}{?carrier},
      carrier {carrier}{/carrier}. Today is {date}. Write in the language with ISO code {lang}.'
    schedule:
      cron: 0 7 * * 2
      userCanChange: false
    maxPerUser: 10
    deliver:
      to: owner
      subject:
        it: 'Zampe in Viaggio: aggiornamento regole per il tuo viaggio'
        en: 'Zampe in Viaggio: rules update for your trip'
      onlyIfNew: true
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: annual
      price: 19
      interval: year
      label:
        it: Annuale — viaggi illimitati e avvisi
        en: Annual — unlimited trips and alerts
      includes:
      - unlimited checklists
      - weekly rule alerts by email
  extensions:
  - key: alerts_plan_gate
    description: Trip alerts (templates) are meant for annual subscribers only; the manifest limits free checklists to 3 but
      cannot yet restrict creating trip_watch instances to a plan.
