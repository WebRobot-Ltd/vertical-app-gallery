apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: zampe-in-viaggio
  displayName: Zampe in Viaggio
  tagline:
    it: 'Viaggia con il tuo cane o gatto senza sorprese: la checklist giusta per il tuo viaggio.'
    en: 'Travel with your dog or cat without surprises: the right checklist for your trip.'
  description:
    it: Crea il profilo dei tuoi animali, descrivi il viaggio e ricevi una checklist personalizzata costruita sulle regole
      pubbliche di compagnie aeree, ferroviarie, di navigazione e delle autorità sanitarie.
    en: Create your pets' profiles, describe your trip and get a personalised checklist based on the public rules of airlines,
      railways, ferry operators and health authorities.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f4e5f'
      accent: '#e07a3f'
      background: '#fbf8f3'
      foreground: '#1d2a30'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: 'Zampe in '
      color: primary
    - text: Viaggio
      color: accent
    buttonShape: pill
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Prezzi
        en: Pricing
      href: '#prezzi'
    cta:
      label:
        it: Inizia
        en: Start
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  limits:
  - action: agent:checklist
    per: user
    max: 3
    window: month
    roles:
    - user
  - action: chat
    per: user
    max: 40
    window: day
    roles:
    - user
  agents:
  - key: checklist
    role: main
    description: Writes the personalised travel checklist from the rules knowledge base and the pet's profile.
    profile:
      inline:
        display_name: Zampe in Viaggio – checklist
        crews:
        - id: checklist
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 14
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are a travel-with-pets advisor for dogs and cats. You get a pet profile and a trip (origin,
            destination, dates, transport mode). Use the tool search_rules to find the relevant rules in the knowledge base
            (carrier/airline/rail/ferry pet policies, EU pet passport, rabies vaccination and titre tests, microchip, entry
            requirements of the destination country, tapeworm treatment where required). Run several searches: one per transport
            mode and one for the destination country. Use read_pets if some pet detail is missing.


            Write the report with a level-1 title "# <Pet name> — <origin> → <destination>". Sections with ## headings: Verdict
            (can the pet travel in cabin, in hold, or must it ride as cargo / not at all — with the reason), Carrier (type,
            maximum dimensions and total weight pet+carrier, as stated by the rule), Documents (a table: document, what it
            is, how many days before departure, status given the pet''s data: ok / to do / to check), Timeline (day-by-day
            countdown from today to departure), Indicative costs (a table; label every figure as indicative and give the source),
            Risks and things to verify, Sources (rule name, authority/company, link, date checked).


            Rules: use ONLY what the knowledge base returns; cite the source for each rule. If a rule is missing, outdated
            or conflicting, say so plainly and tell the user to confirm with the carrier or the destination''s authority.
            Never invent figures, deadlines or fees. This is information, not veterinary or legal advice. Flag brachycephalic
            breeds and heat/season restrictions. Do not suggest or search for hotels or bookings. Write in the language with
            ISO code given in the goal.'
    goalTemplate: 'Pet: {pet_name}, species {pet_species}, breed {pet_breed}, weight {pet_weight} kg, weight of the pet with
      carrier {pet_carrier_weight} kg, age {pet_age}, microchip {pet_microchip}, vaccinations: {pet_vaccinations}.

      Trip: from {origin} to {destination}, departure {depart_date}{?return_date}, return {return_date}{/return_date}. Transport
      mode: {mode_label}.

      {?notes}Notes: {notes}{/notes}

      Today is {date}. Write the report in the language with ISO code {lang}.'
    context:
    - key: pet_name
      from: collection:pets.name
    - key: pet_species
      from: collection:pets.species
    - key: pet_breed
      from: collection:pets.breed
    - key: pet_weight
      from: collection:pets.weight_kg
    - key: pet_carrier_weight
      from: collection:pets.weight_with_carrier_kg
    - key: pet_age
      from: collection:pets.age_years
    - key: pet_microchip
      from: collection:pets.microchip
    - key: pet_vaccinations
      from: collection:pets.vaccinations
    appTools:
    - name: search_rules
      description: Search the weekly-updated knowledge base of public pet-travel rules (airlines, railways, ferries, health
        authorities, country entry requirements)
      action: search
      collection: rules_kb
      scope: all
    - name: read_pets
      description: Read the signed-in user's pet profiles
      action: read
      collection: pets
      scope: user
    output: markdown
    limits:
      maxTurns: 14
      maxBudgetUsd: 0.6
  - key: assistant
    role: helper
    description: Answers follow-up questions about the user's pets and trips, based on the rules knowledge base.
    profile:
      inline:
        display_name: Zampe in Viaggio – assistente
        chat_mode: true
        crews:
        - id: assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You are the assistant of Zampe in Viaggio, helping people who travel with dogs and cats. Answer follow-up
            questions about the user's pets, trips and checklists. Use search_rules to find rules in the knowledge base (carriers,
            EU pet passport, rabies, entry requirements) and read_pets / read_trips for the user's own data. Cite the source
            of each rule and say when it was checked. If the knowledge base does not cover the question, say so and point
            to the carrier or the competent authority; never invent figures or deadlines. You give information, not veterinary
            or legal advice. Do not help with hotel or booking portals. Be concise and friendly; answer in the user's language.
    goalTemplate: 'Conversation so far:

      {history}


      New message from {user}: {message}

      Today is {date}. Answer in the language with ISO code {lang}.'
    appTools:
    - name: search_rules
      description: Search the knowledge base of public pet-travel rules
      action: search
      collection: rules_kb
      scope: all
    - name: read_pets
      description: Read the signed-in user's pet profiles
      action: read
      collection: pets
      scope: user
    - name: read_trips
      description: Read the signed-in user's saved trips
      action: read
      collection: trips
      scope: user
    output: markdown
  - key: rules_updater
    role: scheduled
    description: Every week re-reads the public rules and updates the knowledge base.
    profile:
      inline:
        display_name: Zampe in Viaggio – rules updater
        crews:
        - id: rules_updater
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 60
          max_budget_usd: 2.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You maintain a knowledge base of PUBLIC rules for travelling with dogs and cats. Using the WebRobot
            MCP, scrape (build and run the pipelines through the MCP, never write code yourself) the official public pages
            of: major airlines (cabin/hold/cargo pet policies, carrier size and weight limits, breed restrictions, fees),
            railways (Trenitalia, Italo, SNCF, Deutsche Bahn, Renfe, etc.), ferry operators serving the Mediterranean and
            Northern Europe, the European Commission (pet movements, EU pet passport, rabies, microchip, tapeworm), the Italian
            Ministry of Health, and the entry requirements of the most visited destination countries (UK, Ireland, Malta,
            Norway, Switzerland, USA, Canada, Australia, UAE, etc.). Use only pages whose terms allow reading; always keep
            the source URL.


            Answer with a short level-1 title "# Rules update <date>" and then ONE final fenced JSON block: {"week":"<YYYY-Www>","checked_at":"<date>","rules":[{"id":"<stable-slug,
            e.g. ryanair-cabin-pets>","kind":"airline|rail|ferry|health|country","authority":"...","scope":"carrier or country","summary":"the
            rule in 2-4 sentences with numbers (dimensions, weights, days, fees) exactly as published","source_url":"https://...","changed":true|false,"change_note":"what
            changed vs last week, if known"}]}. Never invent figures; if a page cannot be read, omit the rule and list it
            in a field "unreadable".'
    goalTemplate: Update the pet-travel rules knowledge base. Today is {date}. Mark as changed the rules that differ from
      the previous week.
    output: markdown+json
    writesTo:
      collection: rules_kb
      parse: json_last
      keyBy: week
    limits:
      maxTurns: 60
      maxBudgetUsd: 2.5
      timeoutSeconds: 3000
  - key: watcher
    role: helper
    description: Every week re-checks one saved trip of one user against the latest rules and says what changed.
    memory: instance
    profile:
      inline:
        display_name: Zampe in Viaggio – trip watcher
        crews:
        - id: watcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You watch one saved trip of one person. Use search_rules to read the latest rules for the trip''s
            transport mode, carrier and destination, and read_pets for the pet profile. Start with "# <Pet> — <origin> → <destination>:
            week of <date>". Sections: ## Changes affecting your trip (only rules that changed and really matter for this
            pet and these dates; say what to do and by when; write exactly "No relevant changes this week." if none), ## Still
            to do (the next 3 documents/steps with deadlines), ## Sources. Under 250 words; never invent figures; information,
            not veterinary or legal advice. Your memory holds what you said last time: lead with what is different. At the
            end call remember once with the 5 key points (they replace the old ones).'
    appTools:
    - name: search_rules
      description: Search the knowledge base of public pet-travel rules
      action: search
      collection: rules_kb
      scope: all
    - name: read_pets
      description: Read the user's pet profiles
      action: read
      collection: pets
      scope: user
    writesTo:
      collection: trip_alerts
      parse: whole
    output: markdown
  inputForm:
    title:
      it: Nuovo viaggio
      en: New trip
    fields:
    - name: pet
      type: relation
      relation: pets
      required: true
      label:
        it: Animale
        en: Pet
      help:
        it: Crea prima il profilo dell'animale in «I miei animali».
        en: Create the pet's profile first in "My pets".
    - name: origin
      type: text
      required: true
      label:
        it: Partenza
        en: Departure
      help:
        it: es. Milano, Italia
        en: e.g. Milan, Italy
    - name: destination
      type: text
      required: true
      label:
        it: Destinazione
        en: Destination
      help:
        it: es. Dublino, Irlanda
        en: e.g. Dublin, Ireland
    - name: depart_date
      type: date
      required: true
      label:
        it: Data di partenza
        en: Departure date
    - name: return_date
      type: date
      label:
        it: Data di ritorno (facoltativa)
        en: Return date (optional)
    - name: mode
      type: select
      required: true
      label:
        it: Mezzo
        en: Transport
      options:
      - value: plane
        label:
          it: Aereo
          en: Plane
      - value: train
        label:
          it: Treno
          en: Train
      - value: ferry
        label:
          it: Traghetto
          en: Ferry
      - value: car
        label:
          it: Auto
          en: Car
    - name: notes
      type: textarea
      maxLength: 400
      label:
        it: Compagnia o note (facoltative)
        en: Carrier or notes (optional)
  data:
    collections:
    - name: pets
      ownedBy: user
      description: The user's pets
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome
          en: Name
      - name: species
        type: select
        required: true
        label:
          it: Specie
          en: Species
        options:
        - value: dog
          label:
            it: Cane
            en: Dog
        - value: cat
          label:
            it: Gatto
            en: Cat
      - name: breed
        type: text
        label:
          it: Razza
          en: Breed
      - name: weight_kg
        type: number
        required: true
        label:
          it: Peso (kg)
          en: Weight (kg)
      - name: weight_with_carrier_kg
        type: number
        label:
          it: Peso con trasportino (kg)
          en: Weight with carrier (kg)
      - name: age_years
        type: number
        label:
          it: Età (anni)
          en: Age (years)
      - name: microchip
        type: text
        label:
          it: Microchip
          en: Microchip
      - name: vaccinations
        type: textarea
        maxLength: 800
        label:
          it: Vaccinazioni (tipo e data, antirabbica inclusa)
          en: Vaccinations (type and date, incl. rabies)
    - name: trips
      ownedBy: user
      description: The user's saved trips
      fields:
      - name: pet
        type: relation
        relation: pets
        required: true
        label:
          it: Animale
          en: Pet
      - name: origin
        type: text
        required: true
        label:
          it: Partenza
          en: Departure
      - name: destination
        type: text
        required: true
        label:
          it: Destinazione
          en: Destination
      - name: depart_date
        type: date
        required: true
        label:
          it: Partenza il
          en: Departure date
      - name: return_date
        type: date
        label:
          it: Ritorno il
          en: Return date
      - name: mode
        type: select
        options:
        - plane
        - train
        - ferry
        - car
        label:
          it: Mezzo
          en: Transport
    - name: rules_kb
      ownedBy: app
      searchable: true
      description: Public pet-travel rules, re-checked every week by the rules updater
      fields:
      - name: week
        type: text
      - name: checked_at
        type: text
      - name: rules
        type: json
    - name: trip_alerts
      ownedBy: instance
      description: Weekly re-check of each watched trip
  templates:
  - key: trip_watch
    title:
      it: Avviso viaggio
      en: Trip alert
    description:
      it: Ogni settimana ricontrolla le regole per il tuo viaggio e ti dice cosa è cambiato.
      en: Every week re-checks the rules for your trip and tells you what changed.
    agent: watcher
    params:
    - name: pet
      type: relation
      relation: pets
      required: true
      label:
        it: Animale
        en: Pet
    - name: origin
      type: text
      required: true
      label:
        it: Partenza
        en: Departure
    - name: destination
      type: text
      required: true
      label:
        it: Destinazione
        en: Destination
    - name: depart_date
      type: date
      required: true
      label:
        it: Data di partenza
        en: Departure date
    - name: mode
      type: select
      required: true
      label:
        it: Mezzo
        en: Transport
      options:
      - value: plane
        label:
          it: Aereo
          en: Plane
      - value: train
        label:
          it: Treno
          en: Train
      - value: ferry
        label:
          it: Traghetto
          en: Ferry
      - value: car
        label:
          it: Auto
          en: Car
    goal: 'Watch the trip "{instance}": pet id {pet}, from {origin} to {destination}, departing {depart_date}, by {mode}.
      Today is {date}. Write this week''s check in the language with ISO code {lang}.'
    schedule:
      cron: 0 7 * * 1
      userCanChange: false
    maxPerUser: 10
    cost:
      perRun: 0
  schedules:
  - agent: rules_updater
    cron: 0 3 * * 0
    action: run
    owner: app
  views:
  - key: home
    type: page
    nav: false
    title: Zampe in Viaggio
    sections:
    - type: hero
      band: true
      eyebrow:
        it: Per chi viaggia con cani e gatti
        en: For people travelling with dogs and cats
      title:
        it: Viaggia con **il tuo animale** senza sorprese.
        en: Travel with **your pet** without surprises.
      text:
        it: 'Descrivi il tuo animale e il viaggio: ricevi una checklist personalizzata con cabina o stiva, trasportino, documenti
          con le scadenze e costi indicativi, basata sulle regole pubbliche di compagnie e autorità sanitarie.'
        en: 'Describe your pet and your trip: get a personalised checklist with cabin or hold, carrier, documents with deadlines
          and indicative costs, based on the public rules of carriers and health authorities.'
      actions:
      - label:
          it: Crea la tua checklist
          en: Create your checklist
        href: /login
        style: primary
      - label:
          it: Come funziona
          en: How it works
        href: '#come-funziona'
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Il profilo dei tuoi animali
          en: Your pets' profiles
        text:
          it: Specie, razza, peso con trasportino, età, microchip e vaccinazioni.
          en: Species, breed, weight with carrier, age, microchip and vaccinations.
        badge: 🐾
      - title:
          it: Il tuo viaggio
          en: Your trip
        text:
          it: 'Partenza, destinazione, date e mezzo: aereo, treno, traghetto o auto.'
          en: 'Departure, destination, dates and transport: plane, train, ferry or car.'
        badge: 🧳
      - title:
          it: Checklist personalizzata
          en: Personalised checklist
        text:
          it: Cabina o stiva, trasportino, documenti e anticipi, costi indicativi, con le fonti.
          en: Cabin or hold, carrier, documents and lead times, indicative costs, with sources.
        badge: ✅
      - title:
          it: Domande in chat
          en: Ask in chat
        text:
          it: Dopo il report puoi chiedere chiarimenti all'assistente.
          en: After the report you can ask the assistant follow-up questions.
        badge: 💬
    - type: cards
      id: fonti
      title:
        it: Regole sempre ricontrollate
        en: Rules always re-checked
      intro:
        it: La base di conoscenza si aggiorna ogni settimana da fonti pubbliche.
        en: The knowledge base is refreshed every week from public sources.
      items:
      - title:
          it: Compagnie
          en: Carriers
        text:
          it: 'Aerei, treni e traghetti: ammissione, trasportini, limiti di peso, tariffe.'
          en: 'Planes, trains and ferries: admission, carriers, weight limits, fees.'
      - title:
          it: Autorità sanitarie
          en: Health authorities
        text:
          it: Passaporto europeo, antirabbica, microchip, requisiti di ingresso nei paesi.
          en: EU pet passport, rabies, microchip, country entry requirements.
      - title:
          it: Avvisi sul viaggio
          en: Trip alerts
        text:
          it: Con l'abbonamento, ogni settimana ricontrolliamo i tuoi viaggi salvati.
          en: With the subscription, we re-check your saved trips every week.
    - type: cards
      id: prezzi
      title:
        it: Prezzi
        en: Pricing
      items:
      - title:
          it: Gratis
          en: Free
        text:
          it: 'Checklist base: fino a 3 al mese.'
          en: 'Basic checklist: up to 3 per month.'
      - title:
          it: Annuale
          en: Annual
        text:
          it: Viaggi illimitati e avvisi settimanali sulle regole dei tuoi viaggi. 19 € all'anno.
          en: Unlimited trips and weekly alerts on the rules for your trips. €19 per year.
    - type: note
      content:
        it: Zampe in Viaggio fornisce informazioni basate su fonti pubbliche, non consulenza veterinaria o legale. Verifica
          sempre con la compagnia e con l'autorità del paese di destinazione. Non gestiamo prenotazioni alberghiere.
        en: Zampe in Viaggio gives information based on public sources, not veterinary or legal advice. Always confirm with
          the carrier and the destination country's authority. We do not handle hotel bookings.
  - key: pets
    type: table
    title:
      it: I miei animali
      en: My pets
    source: collection:pets
    columns:
    - name
    - species
    - breed
    - weight_kg
    - weight_with_carrier_kg
    - age_years
    - microchip
    roles:
    - user
    - admin
  - key: new_trip
    type: new_run
    title:
      it: Nuovo viaggio
      en: New trip
    roles:
    - user
    - admin
  - key: trips_history
    type: history
    title:
      it: I miei viaggi
      en: My trips
    source: run
    roles:
    - user
    - admin
  - key: checklist_report
    type: report
    title:
      it: Checklist
      en: Checklist
    source: run
    printable: true
    nav: false
  - key: ask
    type: chat
    title:
      it: Chiedi all'assistente
      en: Ask the assistant
    source: agent:assistant
    placeholder:
      it: Es. Posso portare il mio gatto in cabina?
      en: E.g. Can I take my cat in the cabin?
    examples:
    - it: Quanti giorni prima serve l'antirabbica?
      en: How many days before do I need the rabies shot?
    - it: Che trasportino serve in cabina?
      en: What carrier do I need in the cabin?
    - it: Cosa serve per entrare nel Regno Unito?
      en: What do I need to enter the UK?
    roles:
    - user
    - admin
  - key: watches
    type: instances
    template: trip_watch
    title:
      it: Avvisi sui viaggi
      en: Trip alerts
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - user
  billing:
    modes:
    - free
    - subscription
    currency: eur
    plans:
    - key: annual
      price: 19
      interval: year
      label:
        it: Zampe in Viaggio — annuale
        en: Zampe in Viaggio — annual
      includes:
      - unlimited trips
      - weekly rule alerts on saved trips
      roles:
      - user
    costs:
      agent:watcher:
        estimate: 0
        requiresPlan: annual
  extensions:
  - key: email_alerts
    description: 'Email to the user when a rule affecting a saved trip changes is not available yet: alerts are shown in the
      app (Trip alerts view) for now; the weekly watch runs and the email digest must be added when notifications are supported.'
  - key: plan_aware_limits
    description: Free users are limited to 3 checklists per month; lifting the limit (and enabling trip alerts) for annual
      subscribers needs plan-aware limits, to be configured in the studio.
