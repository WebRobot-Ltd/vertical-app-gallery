apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: museoincloud
  displayName: MuseoInCloud
  tagline:
    it: Il gestionale web per musei piccoli e medi, fondazioni e siti culturali.
    en: The web management suite for small and mid-size museums, foundations and cultural sites.
  description:
    it: Anagrafica visitatori e CRM, calendario di mostre ed eventi con capienza, biglietteria online, prenotazioni scolastiche,
      newsletter mensile approvata dalla comunicazione e report settimanale. Ogni museo ha i propri dati e il proprio staff.
    en: Visitor CRM, calendar of exhibitions and events with capacity, online ticketing, school bookings, a monthly newsletter
      approved by communications and a weekly report. Each museum has its own data and staff.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#5b1a2e'
      accent: '#b8863b'
      background: '#faf6f0'
      foreground: '#241a1c'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Museo
      color: primary
    - text: InCloud
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Programma
        en: Programme
      href: /v/calendar
    cta:
      label:
        it: Acquista i biglietti
        en: Buy tickets
      href: /v/buy_ticket
  auth:
    method: magic_link
    anonymous:
      views:
      - home
      - calendar
      - buy_ticket
      - school_booking
    roles:
    - key: admin
      label:
        it: Direttore
        en: Director
      assignedBy: admin_emails
    - key: ticketing
      label:
        it: Biglietteria
        en: Ticket office
      assignedBy: invite
    - key: education
      label:
        it: Responsabile didattica
        en: Education manager
      assignedBy: invite
    - key: communication
      label:
        it: Comunicazione
        en: Communications
      assignedBy: invite
    - key: user
      label:
        it: Visitatore
        en: Visitor
      assignedBy: signup
  limits:
  - action: login
    per: ip
    max: 20
    window: hour
  agents:
  - key: newsletter
    role: main
    description: Prepares the monthly newsletter draft with exhibitions and events, segmented by interest; waits for the communications
      approval.
    awaits:
    - newsletter_ok
    profile:
      inline:
        display_name: MuseoInCloud newsletter
        crews:
        - id: newsletter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the communications editor of a museum. Read the events in the programme for the requested
            month with read_events, and the visitors with read_visitors ONLY to count how many opted in to marketing per interest
            (never write emails or personal data in the output). Write the newsletter draft in the requested language. Start
            with a level-1 title "# Newsletter <Month Year>". Then: ## Intro (2 sentences), ## In programma (exhibitions,
            events and workshops with date and how to book, only those found in the data), and one section per audience segment
            (## Per le famiglie, ## Per gli appassionati d''arte, ## Per le scuole and any other interest found) with a tailored
            subject line and 2-3 lines of copy, plus the number of opted-in contacts of that segment. Never invent events,
            dates or prices. When the draft is complete, call request_newsletter_ok with the draft title and wait for the
            decision.'
    appTools:
    - name: read_events
      description: Read exhibitions, events and workshops of the programme
      action: read
      collection: events
      scope: all
    - name: read_visitors
      description: Read the visitor records (use only for counting opted-in contacts per interest)
      action: read
      collection: visitors
      scope: all
    goalTemplate: 'Prepare the newsletter for the month: {month}.

      {?focus}Editorial focus: {focus}{/focus}

      Today is {date}. Write in the language with ISO code {lang}.'
    output: markdown
    writesTo:
      collection: newsletters
      parse: whole
    limits:
      maxTurns: 10
      maxBudgetUsd: 0.4
  - key: reporter
    role: scheduled
    description: 'Every Monday: visitors, takings by ticket type, event fill rate and year-on-year comparison.'
    profile:
      inline:
        display_name: MuseoInCloud weekly reporter
        crews:
        - id: reporter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write the weekly management report of a museum for its director. Use read_tickets and read_events.
            Start with "# Report settimanale — settimana del <date>". Sections: ## Sintesi (3 bullets), ## Visitatori (people
            admitted or sold last week, week before, and same week of the previous year), ## Incassi per tipologia (a table
            intero/ridotto/scuole/gruppi with quantity and euro, plus a chart), ## Riempimento eventi (booked/capacity per
            event of the week, flag those above 90%), ## Confronto con l''anno precedente (deltas in % with the figures they
            come from), ## Da fare. Add the chart as a fenced block ```chart {"type":"bar","title":"...","labels":[...],"series":[{"name":"...","values":[...]}],"unit":"€"}```.
            Use only real figures from the data; when a previous-year comparison has no data say so. Never invent numbers.'
    appTools:
    - name: read_tickets
      description: Read ticket sales (type, quantity, total, visit date, event, status)
      action: read
      collection: tickets
      scope: all
    - name: read_events
      description: Read events with capacity and booked seats
      action: read
      collection: events
      scope: all
    goalTemplate: Produce the weekly report for the week ending {date}. Write in the language with ISO code {lang}.
    output: markdown
    writesTo:
      collection: weekly_reports
      parse: whole
      keyBy: date
    limits:
      maxTurns: 10
      maxBudgetUsd: 0.5
  - key: capacity
    role: helper
    description: After every ticket sale updates the booked seats of the event and flags it as almost full.
    profile:
      inline:
        display_name: MuseoInCloud capacity watcher
        crews:
        - id: capacity
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.1
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You keep the seat count of events correct. Given a new ticket (event id, quantity), read the event
            with find_event, add the quantity to booked using update_event, and set status: open if booked < 85% of capacity,
            almost_full if between 85% and 99%, sold_out if booked >= capacity. Change only booked and status. Answer with
            one line.'
    appTools:
    - name: find_event
      description: Read events with capacity and booked seats
      action: read
      collection: events
      scope: all
    - name: update_event
      description: Update booked and status of an event
      action: write
      collection: events
      scope: all
    goalTemplate: 'New ticket sold: event {event_id}, quantity {quantity}. Update the event.'
    output: markdown
  inputForm:
    title:
      it: Nuova newsletter
      en: New newsletter
    fields:
    - name: month
      type: text
      required: true
      label:
        it: Mese (es. dicembre 2026)
        en: Month (e.g. December 2026)
    - name: focus
      type: textarea
      maxLength: 400
      label:
        it: Taglio editoriale (facoltativo)
        en: Editorial focus (optional)
  data:
    collections:
    - name: visitors
      ownedBy: org
      description: Visitor CRM
      retentionDays: 1825
      fields:
      - name: full_name
        type: text
        required: true
        label:
          it: Nome e cognome
          en: Full name
      - name: email
        type: email
        label: Email
      - name: phone
        type: text
        label:
          it: Telefono
          en: Phone
      - name: marketing_consent
        type: boolean
        label:
          it: Consenso marketing
          en: Marketing consent
      - name: interests
        type: multiselect
        label:
          it: Interessi
          en: Interests
        options:
        - value: famiglie
          label:
            it: Famiglie
            en: Families
        - value: arte
          label:
            it: Arte
            en: Art
        - value: storia
          label:
            it: Storia
            en: History
        - value: scuole
          label:
            it: Scuole
            en: Schools
        - value: laboratori
          label:
            it: Laboratori
            en: Workshops
      - name: membership
        type: select
        label: Membership
        options:
        - value: none
          label:
            it: Nessuna
            en: None
        - value: friend
          label:
            it: Amico del museo
            en: Friend
        - value: patron
          label:
            it: Sostenitore
            en: Patron
      - name: visits
        type: number
        label:
          it: Numero visite
          en: Visits
      - name: last_visit
        type: date
        label:
          it: Ultima visita
          en: Last visit
      access:
      - role: ticketing
        can:
        - read
        - write
      - role: communication
    - name: events
      ownedBy: shared
      description: Exhibitions, events and workshops with capacity per time slot
      fields:
      - name: title
        type: text
        required: true
        label:
          it: Titolo
          en: Title
      - name: kind
        type: select
        required: true
        label:
          it: Tipo
          en: Type
        options:
        - value: exhibition
          label:
            it: Mostra
            en: Exhibition
        - value: event
          label:
            it: Evento
            en: Event
        - value: workshop
          label:
            it: Laboratorio
            en: Workshop
      - name: date
        type: date
        required: true
        label: Data
      - name: slot
        type: text
        label:
          it: Fascia oraria (es. 10:00-11:30)
          en: Time slot (e.g. 10:00-11:30)
      - name: description
        type: textarea
        label:
          it: Descrizione
          en: Description
      - name: capacity
        type: number
        required: true
        label:
          it: Capienza
          en: Capacity
      - name: booked
        type: number
        default: 0
        label:
          it: Prenotati
          en: Booked
      - name: price
        type: number
        label:
          it: Prezzo intero €
          en: Full price €
      - name: status
        type: select
        default: open
        label:
          it: Stato
          en: Status
        options:
        - open
        - almost_full
        - sold_out
      access:
      - role: ticketing
        can:
        - read
        - write
      - role: education
        can:
        - read
        - write
      - role: communication
        can:
        - read
        - write
    - name: tickets
      ownedBy: org
      description: Online tickets sold
      retentionDays: 1825
      fields:
      - name: event_id
        type: text
        required: true
        label:
          it: Evento
          en: Event
      - name: visit_date
        type: date
        required: true
        label:
          it: Data della visita
          en: Visit date
      - name: ticket_type
        type: select
        required: true
        label:
          it: Tipologia
          en: Ticket type
        options:
        - value: full
          label:
            it: Intero
            en: Full
        - value: reduced
          label:
            it: Ridotto
            en: Reduced
        - value: school
          label:
            it: Scuole
            en: Schools
        - value: group
          label:
            it: Gruppi
            en: Groups
      - name: quantity
        type: number
        required: true
        label:
          it: Quantità
          en: Quantity
      - name: total
        type: number
        label:
          it: Totale €
          en: Total €
      - name: buyer_name
        type: text
        required: true
        label:
          it: Nome
          en: Name
      - name: buyer_email
        type: email
        required: true
        label: Email
      - name: status
        type: select
        default: paid
        label:
          it: Stato
          en: Status
        options:
        - paid
        - validated
        - cancelled
      access:
      - role: ticketing
        can:
        - read
        - write
      - role: communication
    - name: school_bookings
      ownedBy: org
      description: School visit requests
      retentionDays: 730
      fields:
      - name: school
        type: text
        required: true
        label:
          it: Istituto
          en: School
      - name: class_name
        type: text
        required: true
        label:
          it: Classe
          en: Class
      - name: students
        type: number
        required: true
        label:
          it: Numero alunni
          en: Number of students
      - name: preferred_date
        type: date
        required: true
        label:
          it: Data preferita
          en: Preferred date
      - name: workshop
        type: text
        label:
          it: Laboratorio scelto
          en: Chosen workshop
      - name: contact_name
        type: text
        required: true
        label:
          it: Referente
          en: Contact person
      - name: contact_email
        type: email
        required: true
        label:
          it: Email del referente
          en: Contact email
      - name: status
        type: select
        default: requested
        label:
          it: Stato
          en: Status
        options:
        - value: requested
          label:
            it: Richiesta
            en: Requested
        - value: confirmed
          label:
            it: Confermata
            en: Confirmed
        - value: rescheduled
          label:
            it: Altra data proposta
            en: New date proposed
      - name: proposed_date
        type: date
        label:
          it: Data proposta
          en: Proposed date
      access:
      - role: education
        can:
        - read
        - write
    - name: newsletters
      ownedBy: org
      description: Newsletter drafts
      fields:
      - name: title
        type: text
      - name: body
        type: textarea
      - name: date
        type: date
      access:
      - role: communication
        can:
        - read
        - write
    - name: weekly_reports
      ownedBy: org
      description: Weekly management reports
      fields:
      - name: title
        type: text
      - name: body
        type: textarea
      - name: date
        type: date
      access:
      - role: ticketing
  views:
  - key: home
    type: page
    title: MuseoInCloud
    nav: false
    sections:
    - type: hero
      layout: stack
      band: true
      title:
        it: Il tuo museo, **in cloud**.
        en: Your museum, **in the cloud**.
      text:
        it: Programma, biglietteria con QR, scuole, CRM, newsletter e report settimanali in un solo posto.
        en: Programme, ticketing with QR, schools, CRM, newsletter and weekly reports in one place.
      actions:
      - label:
          it: Acquista i biglietti
          en: Buy tickets
        href: /v/buy_ticket
        style: primary
      - label:
          it: Prenota una visita scolastica
          en: Book a school visit
        href: /v/school_booking
        style: ghost
      - label:
          it: Accesso staff
          en: Staff sign in
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Programma e capienza
          en: Programme and capacity
        text:
          it: Mostre, eventi e laboratori con posti per fascia oraria e avviso quando sono quasi esauriti.
          en: Exhibitions, events and workshops with seats per slot and an alert when almost sold out.
        badge: 📅
      - title:
          it: Biglietti e scuole
          en: Tickets and schools
        text:
          it: Biglietti online per tipologia e moduli per le scuole, confermati dalla didattica.
          en: Online tickets by type and school forms confirmed by the education team.
        badge: 🎟️
      - title:
          it: Newsletter e report
          en: Newsletter and reports
        text:
          it: Gli agenti preparano la newsletter segmentata (approvata dalla comunicazione) e il report del lunedì.
          en: Agents draft the segmented newsletter (approved by communications) and the Monday report.
        badge: ✉️
    - type: note
      content:
        it: Ogni museo ha i propri dati e il proprio staff, separati dagli altri.
        en: Each museum has its own data and staff, separate from all others.
  - key: calendar
    type: cards
    title:
      it: Programma
      en: Programme
    source: collection:events
    data:
      display: cards
      fields:
      - key: title
        label:
          it: Titolo
          en: Title
      - key: kind
        format: badge
      - key: date
        format: date
      - key: slot
      - key: capacity
        format: number
      - key: booked
        format: number
      - key: status
        format: badge
      sort:
        field: date
        dir: asc
      limit: 100
  - key: buy_ticket
    type: form
    title:
      it: Biglietti
      en: Tickets
    collection: tickets
    fields:
    - event_id
    - visit_date
    - ticket_type
    - quantity
    - buyer_name
    - buyer_email
    submit:
      label:
        it: Acquista
        en: Buy
      message:
        it: Grazie! Riceverai la conferma via email.
        en: Thank you! You will receive a confirmation by email.
  - key: school_booking
    type: form
    title:
      it: Visite scolastiche
      en: School visits
    collection: school_bookings
    fields:
    - school
    - class_name
    - students
    - preferred_date
    - workshop
    - contact_name
    - contact_email
    submit:
      label:
        it: Invia richiesta
        en: Send request
      message:
        it: 'Richiesta inviata: la didattica ti risponderà via email.'
        en: 'Request sent: the education team will reply by email.'
  - key: event_edit
    type: form
    title:
      it: Gestisci evento
      en: Manage event
    collection: events
    edit: true
    submit:
      label:
        it: Salva
        en: Save
      redirect: calendar
    roles:
    - admin
    - ticketing
    - communication
    - education
  - key: school_requests
    type: table
    title:
      it: Richieste scuole
      en: School requests
    source: collection:school_bookings
    export: true
    roles:
    - admin
    - education
  - key: school_review
    type: form
    title:
      it: Conferma o riprogramma
      en: Confirm or reschedule
    collection: school_bookings
    fields:
    - status
    - proposed_date
    edit: true
    submit:
      label:
        it: Salva e avvisa la scuola
        en: Save and notify the school
      redirect: school_requests
    nav: false
    roles:
    - admin
    - education
  - key: visitors_table
    type: table
    title:
      it: Visitatori (CRM)
      en: Visitors (CRM)
    source: collection:visitors
    export: true
    roles:
    - admin
    - ticketing
    - communication
  - key: visitor_edit
    type: form
    title:
      it: Scheda visitatore
      en: Visitor record
    collection: visitors
    edit: true
    submit:
      label:
        it: Salva
        en: Save
      redirect: visitors_table
    roles:
    - admin
    - ticketing
  - key: tickets_table
    type: table
    title:
      it: Biglietti venduti
      en: Tickets sold
    source: collection:tickets
    export: true
    roles:
    - admin
    - ticketing
    data:
      display: table
      fields:
      - key: visit_date
        format: date
      - key: ticket_type
        format: badge
      - key: quantity
        format: number
      - key: total
        format: money
      - key: status
        format: badge
      groupBy:
        field: visit_date
        bucket: month
        aggs:
        - key: qty
          agg: sum
          field: quantity
        - key: revenue
          agg: sum
          field: total
  - key: new_newsletter
    type: new_run
    title:
      it: Nuova newsletter
      en: New newsletter
    roles:
    - admin
    - communication
  - key: newsletters_list
    type: table
    title:
      it: Newsletter
      en: Newsletters
    source: collection:newsletters
    roles:
    - admin
    - communication
  - key: newsletter_run
    type: report
    source: run
    printable: true
    nav: false
  - key: decisions
    type: approvals
    title:
      it: Approvazioni
      en: Approvals
    approvals:
    - newsletter_ok
    roles:
    - admin
    - communication
  - key: reports
    type: table
    title:
      it: Report settimanali
      en: Weekly reports
    source: collection:weekly_reports
    roles:
    - admin
    - ticketing
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - admin
  schedules:
  - agent: reporter
    action: run
    cron: 0 6 * * 1
    owner: app
    goal: Produce the weekly report for the week that just ended.
    deliver:
      to: admins
      onlyIfNew: true
  approvals:
  - key: newsletter_ok
    title:
      it: Approva la newsletter
      en: Approve the newsletter
    description: Communications approves the monthly newsletter draft before it is sent.
    role: communication
    timeoutMinutes: 10080
  triggers:
  - key: ticket_sold
    'on':
      collection: tickets
      op: insert
    start:
      agent: capacity
    goal: 'New ticket sold: event {record.event_id}, quantity {record.quantity}. Update the event.'
    asUser: false
  - key: ticket_confirmation
    'on':
      collection: tickets
      op: insert
    notify:
      to:
      - record.buyer_email
      subject:
        it: Il tuo biglietto
        en: Your ticket
      body:
        it: Grazie {record.buyer_name}, abbiamo registrato {record.quantity} biglietto/i per il {record.visit_date}.
        en: Thank you {record.buyer_name}, we registered {record.quantity} ticket(s) for {record.visit_date}.
  - key: almost_full
    'on':
      collection: events
      op: update
      where:
        status: almost_full
    notify:
      to:
      - admins
      - role:ticketing
      - role:communication
      subject:
        it: 'Evento quasi esaurito: {record.title}'
        en: 'Event almost sold out: {record.title}'
      body:
        it: L'evento {record.title} del {record.date} ha raggiunto l'85% della capienza.
        en: The event {record.title} on {record.date} has reached 85% of capacity.
      link: calendar
  - key: school_confirmed
    'on':
      collection: school_bookings
      op: update
      where:
        status: confirmed
    notify:
      to:
      - record.contact_email
      subject:
        it: 'Visita confermata: {record.school}'
        en: 'Visit confirmed: {record.school}'
      body:
        it: La visita della classe {record.class_name} è confermata per il {record.preferred_date}.
        en: The visit of class {record.class_name} is confirmed for {record.preferred_date}.
  - key: school_rescheduled
    'on':
      collection: school_bookings
      op: update
      where:
        status: rescheduled
    notify:
      to:
      - record.contact_email
      subject:
        it: 'Nuova data proposta: {record.school}'
        en: 'New date proposed: {record.school}'
      body:
        it: 'Non possiamo ospitarvi il {record.preferred_date}. Vi proponiamo il {record.proposed_date}: rispondete a questa
          email per confermare.'
        en: 'We cannot host you on {record.preferred_date}. We propose {record.proposed_date}: reply to this email to confirm.'
  - key: school_new
    'on':
      collection: school_bookings
      op: insert
    notify:
      to:
      - role:education
      subject:
        it: 'Nuova richiesta scuola: {record.school}'
        en: 'New school request: {record.school}'
      body:
        it: '{record.school}, classe {record.class_name}, {record.students} alunni, data preferita {record.preferred_date}.'
        en: '{record.school}, class {record.class_name}, {record.students} students, preferred date {record.preferred_date}.'
      link: school_requests
  - key: newsletter_approved
    'on':
      approval: newsletter_ok
      decision: approved
    notify:
