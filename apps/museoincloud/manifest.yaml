apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: museoincloud
  displayName: MuseoInCloud
  tagline:
    it: Il gestionale web per musei piccoli e medi.
    en: The web management system for small and mid-sized museums.
  description:
    it: Visitatori e CRM, calendario di mostre ed eventi con capienza, biglietteria online, prenotazioni scolastiche, newsletter
      mensile e report settimanale preparati da agenti AI.
    en: Visitors and CRM, exhibitions and events calendar with capacity, online ticketing, school bookings, and a monthly
      newsletter and weekly report prepared by AI agents.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: dashboard
  branding:
    theme: light
    palette:
      primary: '#2b2a4c'
      accent: '#b5532f'
      background: '#f8f5ef'
      foreground: '#1d1c25'
    fonts:
      body: Inter
      display: Playfair Display
    wordmark:
    - text: Museo
      color: primary
    - text: InCloud
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Programma
        en: Programme
      href: '#programma'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
      - programme
    roles:
    - key: admin
      label:
        it: Direttore
        en: Director
      assignedBy: admin_emails
    - key: ticketing
      label:
        it: Biglietteria
        en: Ticket office
      assignedBy: invite
    - key: education
      label:
        it: Responsabile didattica
        en: Education manager
      assignedBy: invite
    - key: communications
      label:
        it: Comunicazione
        en: Communications
      assignedBy: invite
    - key: user
      label:
        it: Visitatore / scuola
        en: Visitor / school
      assignedBy: signup
  limits:
  - action: run
    per: user
    max: 5
    window: day
    roles:
    - user
  agents:
  - key: school_desk
    role: main
    description: Takes a school visit request, checks it and asks the education manager to confirm or propose another date.
    awaits:
    - school_visit
    writesTo:
      collection: school_requests
      parse: whole
    profile:
      inline:
        display_name: School visits desk
        crews:
        - id: school_desk
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You handle educational visit requests for a museum. Start with a level-1 title "# Richiesta visita
            — <istituto>, <classe>". Then sections ## Richiesta (institute, class, number of pupils, preferred date, chosen
            workshop), ## Verifiche (check that the number of pupils is plausible for a workshop group, flag anything missing),
            ## Proposta per la responsabile didattica (a short note and one alternative date to offer if the preferred one
            is unavailable). Never confirm a date yourself and never invent availability: call request_school_visit so that
            the education manager decides. Write in the language with the ISO code given in the goal. Under 200 words.'
    goalTemplate: 'School visit request.

      Institute: {institute}

      Class: {class_name}

      Pupils: {pupils}

      Preferred date: {preferred_date}

      Workshop: {workshop_label}

      {?notes}Notes: {notes}{/notes}

      Contact: {user}. Today is {date}. Language: {lang}.'
    output: markdown
  - key: newsletter
    role: scheduled
    description: Prepares the monthly newsletter with exhibitions and events, segmented by interest; the communications team
      approves it before sending.
    awaits:
    - newsletter_send
    writesTo:
      collection: newsletters
      parse: whole
      keyBy: date
    appTools:
    - name: read_events
      description: Read upcoming exhibitions, events and workshops
      action: read
      collection: events
      scope: all
    - name: read_segments
      description: Read the visitor interest segments (counts, no personal data)
      action: read
      collection: segments
      scope: all
    profile:
      inline:
        display_name: Newsletter editor
        crews:
        - id: newsletter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the editor of a museum''s monthly newsletter. Use read_events to get next month''s exhibitions,
            events and workshops and read_segments to get the interest segments. Start with "# Newsletter — <month year>".
            Then one section per segment (## Famiglie, ## Appassionati d''arte, ## Scuole e docenti, ## Soci, as present in
            the data), each with a subject line, a 60-word intro and the 2-4 relevant items with date, time and price. Finish
            with ## Note per l''approvazione listing the sources used. Use only data returned by the tools; never invent dates,
            prices or events. Provide Italian first, then English. Then call request_newsletter_send. Sending is done only
            after approval.'
  - key: weekly_report
    role: scheduled
    description: 'Every Monday: visitors, revenue by ticket type, event fill rate, comparison with the previous year.'
    writesTo:
      collection: weekly_reports
      parse: whole
      keyBy: date
    appTools:
    - name: read_orders
      description: Read ticket orders (type, amount, date, event)
      action: read
      collection: orders
      scope: all
    - name: read_events
      description: Read events with capacity and booked seats
      action: read
      collection: events
      scope: all
    - name: read_history
      description: Read the previous-year weekly figures
      action: read
      collection: yearly_figures
      scope: all
    profile:
      inline:
        display_name: Weekly museum analyst
        crews:
        - id: weekly_report
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write the Monday report for the museum''s director. Read last week''s orders, the events and
            the previous-year figures with the tools. Start with "# Report settimanale — settimana del <date>". Sections:
            ## Visitatori, ## Incassi per tipologia (intero, ridotto, scuole, gruppi) with a small table, ## Tasso di riempimento
            degli eventi (flag events above 90% as almost sold out), ## Confronto con l''anno precedente, ## Da fare questa
            settimana. Add a chart block for revenue by ticket type:

            ```chart

            {"type":"bar","title":"Incassi per tipologia","labels":["Intero"],"series":[{"name":"EUR","values":[0]}],"unit":"EUR"}

            ```

            (with real figures). Never invent numbers: if data is missing, say so. Write in Italian, with English headings
            in brackets.'
  inputForm:
    title:
      it: Prenotazione visita didattica
      en: School visit booking
    fields:
    - name: institute
      type: text
      required: true
      label:
        it: Istituto
        en: Institute
    - name: class_name
      type: text
      required: true
      label:
        it: Classe
        en: Class
    - name: pupils
      type: number
      required: true
      label:
        it: Numero alunni
        en: Number of pupils
    - name: preferred_date
      type: date
      required: true
      label:
        it: Data preferita
        en: Preferred date
    - name: workshop
      type: select
      required: true
      label:
        it: Laboratorio
        en: Workshop
      options:
      - value: guided
        label:
          it: Visita guidata
          en: Guided tour
      - value: art_lab
        label:
          it: Laboratorio d'arte
          en: Art workshop
      - value: history_lab
        label:
          it: Laboratorio di storia
          en: History workshop
    - name: notes
      type: textarea
      maxLength: 500
      label:
        it: Note (facoltative)
        en: Notes (optional)
  approvals:
  - key: school_visit
    title:
      it: Conferma visita scolastica
      en: Confirm school visit
    role: education
    decidedBy: role
    fields:
    - institute
    - class_name
    - pupils
    - preferred_date
    timeoutMinutes: 10080
  - key: newsletter_send
    title:
      it: Approva newsletter
      en: Approve newsletter
    role: communications
    decidedBy: role
    timeoutMinutes: 4320
    onTimeout: reject
  data:
    collections:
    - name: events
      ownedBy: shared
      description: Exhibitions, events and workshops with time slots and capacity
      searchable: true
      fields:
      - name: title
        type: text
        required: true
      - name: kind
        type: select
        options:
        - exhibition
        - event
        - workshop
      - name: date
        type: date
      - name: slot
        type: text
      - name: capacity
        type: number
      - name: booked
        type: number
      - name: interest
        type: text
    - name: visitors
      ownedBy: org
      description: Visitor registry and CRM
      fields:
      - name: name
        type: text
      - name: email
        type: email
      - name: marketing_consent
        type: boolean
      - name: interests
        type: text
      - name: visits
        type: number
      - name: membership
        type: select
        options:
        - none
        - friend
        - member
        - patron
    - name: segments
      ownedBy: org
      description: Interest segments of consenting visitors (counts only)
      fields:
      - name: segment
        type: text
      - name: recipients
        type: number
    - name: orders
      ownedBy: org
      description: Online and desk ticket orders
      fields:
      - name: date
        type: date
      - name: event
        type: text
      - name: ticket_type
        type: select
        options:
        - full
        - reduced
        - school
        - group
      - name: quantity
        type: number
      - name: amount
        type: number
      - name: validated
        type: boolean
    - name: yearly_figures
      ownedBy: org
      description: Previous-year weekly visitors and revenue
      fields:
      - name: week
        type: text
      - name: visitors
        type: number
      - name: revenue
        type: number
    - name: school_requests
      ownedBy: user
      description: School visit requests and decisions
    - name: newsletters
      ownedBy: org
      description: Newsletter drafts and approved issues
    - name: weekly_reports
      ownedBy: org
      description: Monday reports for the director
  views:
  - key: home
    type: page
    nav: false
    title: MuseoInCloud
    sections:
    - type: hero
      title:
        it: Il tuo museo, **in cloud**.
        en: Your museum, **in the cloud**.
      text:
        it: 'Visitatori, mostre ed eventi, biglietti con QR, visite scolastiche, newsletter e report settimanali: tutto in
          un solo posto, con i dati separati per ogni museo.'
        en: Visitors, exhibitions and events, QR tickets, school visits, newsletters and weekly reports in one place, with
          each museum's data kept separate.
      actions:
      - label:
          it: Vedi il programma
          en: See the programme
        href: /v/programme
        style: primary
      - label:
          it: Prenota una visita scolastica
          en: Book a school visit
        href: /v/school_booking
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Programma e capienza
          en: Programme and capacity
        text:
          it: Mostre, eventi e laboratori con posti per fascia oraria.
          en: Exhibitions, events and workshops with seats per time slot.
        badge: 🗓️
      - title:
          it: Biglietti e ingresso
          en: Tickets and entry
        text:
          it: Intero, ridotto, scuole, gruppi; biglietto con QR da validare all'ingresso.
          en: Full, reduced, school, group; a QR ticket validated at the entrance.
        badge: 🎟️
      - title:
          it: Agenti al lavoro
          en: Agents at work
        text:
          it: Newsletter mensile approvata dalla comunicazione e report ogni lunedì.
          en: A monthly newsletter approved by communications and a report every Monday.
        badge: 🤖
    - type: data
      id: programma
      title:
        it: Prossimi appuntamenti
        en: Upcoming
      source: collection:events
      display: cards
      fields:
      - key: title
        label:
          it: Titolo
          en: Title
      - key: date
        label: Data
        format: date
      - key: slot
        label: Slot
      - key: kind
        format: badge
      sort:
        field: date
        dir: asc
      limit: 12
    - type: note
      content:
        it: Ogni museo vede solo i propri dati.
        en: Each museum sees only its own data.
  - key: programme
    type: table
    title:
      it: Programma
      en: Programme
    source: collection:events
    data:
      display: table
      fields:
      - key: title
        label:
          it: Titolo
          en: Title
      - key: kind
        format: badge
      - key: date
        format: date
      - key: slot
      - key: capacity
        format: number
      - key: booked
        format: number
      sort:
        field: date
        dir: asc
      limit: 100
  - key: school_booking
    type: new_run
    title:
      it: Visita scolastica
      en: School visit
    roles:
    - user
    - education
    - admin
  - key: my_requests
    type: history
    title:
      it: Le mie richieste
      en: My requests
    source: run
    roles:
    - user
  - key: request
    type: report
    source: run
    printable: true
    nav: false
  - key: approvals
    type: approvals
    title:
      it: Approvazioni
      en: Approvals
    roles:
    - education
    - communications
    - admin
  - key: visitors_crm
    type: table
    title:
      it: Visitatori e CRM
      en: Visitors and CRM
    source: collection:visitors
    roles:
    - admin
    - ticketing
    - communications
    data:
      display: table
      fields:
      - key: name
      - key: email
      - key: marketing_consent
        format: badge
      - key: interests
      - key: visits
        format: number
      - key: membership
        format: badge
      limit: 200
  - key: sales
    type: table
    title:
      it: Biglietti venduti
      en: Tickets sold
    source: collection:orders
    roles:
    - admin
    - ticketing
    data:
      display: table
      fields:
      - key: date
        format: date
      - key: event
      - key: ticket_type
        format: badge
      - key: quantity
        format: number
      - key: amount
        format: money
      - key: validated
        format: badge
      sort:
        field: date
        dir: desc
      limit: 200
  - key: newsletters
    type: list
    title:
      it: Newsletter
      en: Newsletters
    source: collection:newsletters
    roles:
    - admin
    - communications
  - key: reports
    type: list
    title:
      it: Report settimanali
      en: Weekly reports
    source: collection:weekly_reports
    roles:
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - admin
  schedules:
  - agent: newsletter
    cron: 0 7 25 * *
    action: run
    owner: app
    goal: Prepare the newsletter for next month. Today is the run date; use the language blocks Italian then English.
  - agent: weekly_report
    cron: 0 6 * * 1
    action: run
    owner: app
    goal: Write the report for the week that just ended, compared with the same week last year.
  billing:
    modes:
    - subscription
    - per_transaction
    currency: eur
    transactionFeePct: 2
    plans:
    - key: museum_monthly
      price: 79
      interval: month
      label:
        it: MuseoInCloud — abbonamento museo
        en: MuseoInCloud — museum plan
      roles:
      - admin
      includes:
      - staff accounts
      - CRM
      - ticketing
      - weekly report
      - monthly newsletter
  extensions:
  - key: online_ticketing
    description: 'Card checkout per ticket type, QR code issuing and entrance validation, with the commission on online sales:
      needs custom logic not yet expressible. The orders collection is ready to receive them.'
  - key: capacity_alert_email
    description: 'Email alert when an event is almost sold out: notifications are not available yet. For now the weekly report
      flags events above 90%.'
  - key: newsletter_delivery
    description: 'Sending the approved newsletter by email is not available yet: after approval the issue is available to
      copy into the mailing tool.'
  - key: school_booking_decision_record
    description: Per-museum tenancy is provided by deploying one app per museum; the approved or proposed date is stored on
      the run, not yet on the school's record.
