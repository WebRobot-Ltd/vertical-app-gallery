apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: fornitori-ai
  displayName: Fornitori AI
  tagline:
    it: Trova, verifica e confronta i fornitori giusti, dalla richiesta all'offerta.
  description:
    it: 'Descrivi cosa devi comprare: un agente cerca fornitori, verifica P.IVA e certificazioni, tu approvi la shortlist
      e la richiesta di offerta. L''app invia le richieste, sollecita chi non risponde e confronta le offerte ricevute.'
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12304a'
      accent: '#0f8b8d'
      background: '#f6f8fa'
      foreground: '#16202a'
    fonts:
      body: Inter
      display: Manrope
    wordmark:
    - text: Fornitori
      color: primary
    - text: AI
      color: accent
    width: wide
  header:
    links:
    - label:
        it: Come funziona
      href: '#come-funziona'
    cta:
      label:
        it: Nuova richiesta
      href: /v/new_request
  auth:
    method: magic_link
    anonymous:
      views:
      - home
      - optout
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  limits:
  - action: agent:sourcer
    per: user
    max: 3
    window: month
    roles:
    - user
    plans:
      team: 15
      business: 60
  agents:
  - key: sourcer
    role: main
    description: Cerca fornitori sul web, verifica P.IVA (VIES) e certificazioni, propone la shortlist e chiede l'approvazione.
    awaits:
    - rfq_ok
    profile:
      inline:
        display_name: Fornitori AI - ricercatore
        crews:
        - id: sourcer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 60
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'Sei un analista acquisti. Dato un fabbisogno, cerchi nuovi fornitori sul web e nei loro siti aziendali
            (usa gli strumenti WebRobot per cercare e leggere le pagine). Per ogni candidato: raccogli ragione sociale, sito,
            email commerciale (solo se pubblicata sul sito), paese, partita IVA se pubblicata; verifica la P.IVA con lo strumento
            vies_check (path /<PAESE>/vat/<numero>, es. /IT/vat/12345678901) e riporta valido/non valido/non verificabile;
            controlla le certificazioni richieste (ISO 9001, ISO 14001...) sul sito e indica se sono dichiarate, verificate
            con evidenza (numero certificato, ente) o non trovate. Non inventare mai dati, email o certificazioni: se manca,
            scrivilo. Prima controlla con read_suppliers se il database già contiene fornitori adatti e riusali. Salva ogni
            fornitore con write_supplier e la richiesta con write_rfq (status ''in_approvazione''). Poi proponi una shortlist
            di 5-8 fornitori con il perché di ciascuno e redigi il testo della richiesta di offerta (oggetto e corpo in italiano,
            con specifiche, quantità, area, certificazioni, scadenza per rispondere, e richiesta esplicita di prezzo, tempi
            di consegna, condizioni di pagamento e allegati). Includi solo fornitori con email trovata nella shortlist. Chiama
            request_rfq_ok con shortlist (nome, email, motivo, esito P.IVA, certificazioni), oggetto e testo, id della richiesta,
            nome del buyer e azienda. Il report finale inizia con ''# Shortlist fornitori - <categoria>'' e contiene: riepilogo
            del fabbisogno, tabella shortlist, scartati con motivo, bozza della richiesta, avvertenze.'
    goalTemplate: 'Categoria: {category}

      Specifiche tecniche: {specs}

      Quantità: {quantity}

      Area geografica: {area}

      {?certifications}Certificazioni richieste: {certifications}{/certifications}

      {?deadline}Scadenza per le offerte: {deadline}{/deadline}

      Buyer: {buyer_name}, azienda {company}

      {?notes}Note: {notes}{/notes}

      Oggi è {date}. Scrivi in lingua {lang}.'
    output: markdown
    appTools:
    - name: vies_check
      description: 'Verifica una partita IVA UE su VIES. Path: /<CC>/vat/<numero>'
      action: http
      http:
        method: GET
        url: https://ec.europa.eu/taxation_customs/vies/rest-api/ms
        allowPath: true
        attribution: VIES, Commissione europea
    - name: read_suppliers
      description: Legge i fornitori già nel database dell'azienda
      action: read
      collection: suppliers
      scope: user
    - name: write_supplier
      description: Salva o aggiorna un fornitore
      action: write
      collection: suppliers
      scope: user
    - name: write_rfq
      description: Salva la richiesta di acquisto
      action: write
      collection: rfqs
      scope: user
    limits:
      maxTurns: 60
      maxBudgetUsd: 1.5
  - key: dispatcher
    role: helper
    description: Dopo l'approvazione registra i destinatari; l'invio e i solleciti sono email automatiche.
    profile:
      inline:
        display_name: Fornitori AI - invio richieste
        crews:
        - id: dispatcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Ricevi l''evento di approvazione della shortlist con i fornitori approvati, oggetto e testo della
            richiesta di offerta (eventualmente modificati dal buyer). Per ogni fornitore approvato che ha un''email, controlla
            con read_optouts che l''email non sia tra chi ha chiesto di non ricevere messaggi: se c''è, salta il fornitore.
            Per gli altri crea un record con write_recipient: rfq_id, supplier_name, supplier_email, why, rfq_subject, rfq_text,
            buyer_name, buyer_company, sent_on = data di oggi (YYYY-MM-DD), status ''sent''. Il salvataggio fa partire l''email.
            Aggiorna la richiesta con write_rfq status ''inviata''. Chiudi con un report che inizia con ''# Richiesta inviata''
            e elenca inviati e saltati (con motivo). Non inventare email.'
    goalTemplate: 'Approvazione ricevuta. Evento: {event}

      Oggi è {date}.'
    output: markdown
    appTools:
    - name: read_optouts
      description: Email che non vogliono più ricevere richieste
      action: read
      collection: optouts
      scope: all
    - name: write_recipient
      description: Crea o aggiorna un destinatario della richiesta
      action: write
      collection: rfq_recipients
      scope: user
    - name: write_rfq
      description: Salva la richiesta di acquisto
      action: write
      collection: rfqs
      scope: user
  - key: reader
    role: helper
    description: Legge le risposte dei fornitori nella casella e compila la tabella comparativa.
    profile:
      inline:
        display_name: Fornitori AI - lettore offerte
        crews:
        - id: reader
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 20
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Leggi un''email di risposta di un fornitore a una richiesta di offerta. Individua la richiesta e
            il fornitore con read_recipients (per email del mittente) e read_rfqs. Estrai: prezzo (numero) e valuta, tempi
            di consegna in giorni, condizioni (pagamento, resa, validità, minimi), allegati (solo i nomi dei file citati o
            presenti: il contenuto degli allegati non è leggibile, quindi se il prezzo o altri dati sono solo nell''allegato
            segnalalo in ''missing''). Registra con write_offer (rfq_id, supplier_name, price, currency, lead_time_days, terms,
            attachments, missing, received_on, summary). In ''missing'' elenca i dati mancanti o ambigui (es. prezzo non indicato,
            consegna assente, certificazioni non confermate). Non inventare nulla: lascia vuoto ciò che non c''è. Poi aggiorna
            il destinatario con write_recipient status ''replied'' così non riceve altri solleciti. Se il mittente chiede
            di non ricevere più email, segnalalo nel riepilogo. Riepilogo finale che inizia con ''# Offerta ricevuta - <fornitore>''.'
    goalTemplate: 'Nuova email ricevuta:

      {message}

      Oggi è {date}.'
    output: markdown
    appTools:
    - name: read_recipients
      description: Legge i destinatari delle richieste
      action: read
      collection: rfq_recipients
      scope: user
    - name: read_rfqs
      description: Legge le richieste di acquisto
      action: read
      collection: rfqs
      scope: user
    - name: write_offer
      description: Salva un'offerta estratta
      action: write
      collection: offers
      scope: user
    - name: write_recipient
      description: Crea o aggiorna un destinatario della richiesta
      action: write
      collection: rfq_recipients
      scope: user
  inputForm:
    title:
      it: Nuova richiesta di acquisto
    fields:
    - name: category
      type: text
      required: true
      label:
        it: Categoria merceologica
    - name: specs
      type: textarea
      required: true
      maxLength: 2000
      label:
        it: Specifiche tecniche
    - name: quantity
      type: text
      required: true
      label:
        it: Quantità
    - name: area
      type: text
      required: true
      label:
        it: Area geografica
      help:
        it: es. Nord Italia, UE, Lombardia
    - name: certifications
      type: multiselect
      label:
        it: Certificazioni richieste
      options:
      - ISO 9001
      - ISO 14001
      - ISO 45001
      - ISO 27001
      - CE
      - FSC
    - name: deadline
      type: date
      label:
        it: Scadenza offerte
    - name: buyer_name
      type: text
      required: true
      label:
        it: Il tuo nome
    - name: company
      type: text
      required: true
      label:
        it: Azienda
    - name: notes
      type: textarea
      maxLength: 600
      label:
        it: Note (facoltative)
  data:
    collections:
    - name: suppliers
      ownedBy: user
      description: Database fornitori dell'azienda, cresce a ogni richiesta
      searchable: true
      fields:
      - name: company
        type: text
        label:
          it: Ragione sociale
      - name: website
        type: url
        label:
          it: Sito
      - name: email
        type: email
        label:
          it: Email
      - name: country
        type: text
        label:
          it: Paese
      - name: vat
        type: text
        label:
          it: P.IVA
      - name: vat_status
        type: select
        label:
          it: Esito VIES
        options:
        - valida
        - non valida
        - non verificabile
      - name: category
        type: text
        label:
          it: Categoria
      - name: certifications
        type: text
        label:
          it: Certificazioni
      - name: notes
        type: textarea
        label:
          it: Note
    - name: rfqs
      ownedBy: user
      description: Richieste di acquisto
      fields:
      - name: title
        type: text
      - name: category
        type: text
      - name: specs
        type: textarea
      - name: quantity
        type: text
      - name: area
        type: text
      - name: certifications
        type: text
      - name: deadline
        type: date
      - name: status
        type: select
        options:
        - in_approvazione
        - inviata
        - chiusa
    - name: rfq_recipients
      ownedBy: user
      description: Fornitori a cui è stata inviata la richiesta
      fields:
      - name: rfq_id
        type: text
      - name: supplier_name
        type: text
      - name: supplier_email
        type: email
      - name: why
        type: textarea
      - name: rfq_subject
        type: text
      - name: rfq_text
        type: textarea
      - name: buyer_name
        type: text
      - name: buyer_company
        type: text
      - name: sent_on
        type: date
      - name: status
        type: select
        options:
        - sent
        - replied
        - opted_out
    - name: offers
      ownedBy: user
      description: Offerte estratte dalle risposte
      fields:
      - name: rfq_id
        type: text
        label:
          it: Richiesta
      - name: supplier_name
        type: text
        label:
          it: Fornitore
      - name: price
        type: number
        label:
          it: Prezzo
      - name: currency
        type: text
        label:
          it: Valuta
      - name: lead_time_days
        type: number
        label:
          it: Consegna (giorni)
      - name: terms
        type: textarea
        label:
          it: Condizioni
      - name: attachments
        type: text
        label:
          it: Allegati
      - name: missing
        type: textarea
        label:
          it: Dati mancanti
      - name: received_on
        type: date
        label:
          it: Ricevuta il
      - name: summary
        type: textarea
        label:
          it: Sintesi
      retentionDays: 730
    - name: optouts
      ownedBy: org
      description: Indirizzi che non vogliono più ricevere richieste
      fields:
      - name: email
        type: email
        required: true
        label:
          it: Email
  approvals:
  - key: rfq_ok
    title:
      it: Approva shortlist e richiesta di offerta
    description: Il buyer conferma i fornitori e il testo della richiesta prima dell'invio
    decidedBy: requester
    fields:
    - shortlist
    - subject
    - text
  triggers:
  - key: send_rfq
    description: Dopo l'approvazione registra i destinatari
    'on':
      approval: rfq_ok
      decision: approved
    start:
      agent: dispatcher
    goal: 'Approvazione ricevuta. Evento: {event}'
  - key: rfq_first
    description: Prima email di richiesta offerta
    'on':
      collection: rfq_recipients
      op: insert
      where:
        status: sent
    notify:
      to: record.supplier_email
      subject:
        it: '{record.rfq_subject}'
      body:
        it: 'Buongiorno {record.supplier_name},


          {record.rfq_text}


          Cordiali saluti,

          {record.buyer_name}

          {record.buyer_company}


          Per non ricevere più richieste di offerta tramite questa piattaforma usi il link sotto.'
      link: optout
  - key: rfq_remind_3
    description: Sollecito dopo 3 giorni
    'on':
      date:
        collection: rfq_recipients
        field: sent_on
        offsetDays: 3
        hour: 8
      where:
        status: sent
    notify:
      to: record.supplier_email
      subject:
        it: 'Sollecito: {record.rfq_subject}'
      body:
        it: 'Buongiorno {record.supplier_name},


          le scriviamo di nuovo in merito alla richiesta di offerta inviata 3 giorni fa. Resto in attesa di un suo riscontro.


          {record.rfq_text}


          Cordiali saluti,

          {record.buyer_name}

          {record.buyer_company}


          Per non ricevere più richieste usi il link sotto.'
      link: optout
  - key: rfq_remind_7
    description: Secondo sollecito dopo 7 giorni
    'on':
      date:
        collection: rfq_recipients
        field: sent_on
        offsetDays: 7
        hour: 8
      where:
        status: sent
    notify:
      to: record.supplier_email
      subject:
        it: 'Ultimo sollecito: {record.rfq_subject}'
      body:
        it: 'Buongiorno {record.supplier_name},


          ultimo sollecito sulla nostra richiesta di offerta di 7 giorni fa. Se non è interessato, la ringraziamo comunque.


          {record.rfq_text}


          Cordiali saluti,

          {record.buyer_name}

          {record.buyer_company}


          Per non ricevere più richieste usi il link sotto.'
      link: optout
  channels:
  - key: inbox
    type: email
    agent: reader
  egress:
    hosts:
    - ec.europa.eu
    notes: 'VIES (Commissione europea): verifica P.IVA, dati pubblici, riuso consentito con attribuzione.'
  views:
  - key: home
    type: page
    nav: false
    sections:
    - type: hero
      title:
        it: Trova i fornitori giusti, **senza ricerche infinite**.
      text:
        it: Descrivi cosa devi comprare. Un agente AI cerca fornitori, verifica P.IVA e certificazioni, tu approvi, l'app
          invia le richieste, sollecita e confronta le offerte.
      actions:
      - label:
          it: Nuova richiesta
        href: /v/new_request
        style: primary
      - label:
          it: Accedi
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
      items:
      - title:
          it: Descrivi il fabbisogno
        text:
          it: Categoria, specifiche, quantità, area, certificazioni, scadenza.
        badge: 📝
      - title:
          it: Shortlist verificata
        text:
          it: Ricerca sul web e sui siti aziendali, controllo VIES e certificazioni, con il perché di ogni fornitore.
        badge: 🔎
      - title:
          it: Approvi e invii
        text:
          it: Approvi shortlist e testo; la richiesta parte a tuo nome, con solleciti dopo 3 e 7 giorni.
        badge: ✉️
      - title:
          it: Offerte a confronto
        text:
          it: Le risposte vengono lette e messe in tabella, con i dati mancanti segnalati.
        badge: 📊
    - type: note
      content:
        it: 'Fornitori AI è un supporto alle decisioni: verifica sempre i dati prima di firmare un ordine. Le certificazioni
          sono controllate sulle informazioni pubbliche disponibili.'
  - key: new_request
    type: new_run
    title:
      it: Nuova richiesta
    roles:
    - user
    - admin
  - key: requests
    type: history
    title:
      it: Le mie richieste
    source: run
    roles:
    - user
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: approvals
    type: approvals
    title:
      it: Da approvare
    approvals:
    - rfq_ok
    roles:
    - user
    - admin
  - key: offers_table
    type: table
    title:
      it: Confronto offerte
    source: collection:offers
    columns:
    - rfq_id
    - supplier_name
    - price
    - currency
    - lead_time_days
    - terms
    - attachments
    - missing
    - received_on
    export: true
    roles:
    - user
    - admin
  - key: recipients
    type: table
    title:
      it: Invii e solleciti
    source: collection:rfq_recipients
    columns:
    - rfq_id
    - supplier_name
    - supplier_email
    - sent_on
    - status
    roles:
    - user
    - admin
  - key: suppliers_table
    type: table
    title:
      it: Database fornitori
    source: collection:suppliers
    columns:
    - company
    - country
    - vat
    - vat_status
    - certifications
    - website
    - email
    - category
    export: true
    roles:
    - user
    - admin
  - key: optout
    type: form
    title:
      it: Non ricevere più richieste di offerta
    collection: optouts
    fields:
    - email
    submit:
      label:
        it: Cancellami
      message:
        it: 'Fatto: non riceverai più richieste di offerta.'
    nav: false
  - key: account
    type: account
    title:
      it: Piano
    roles:
    - user
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: team
      price: 149
      interval: month
      label:
        it: Team - 15 richieste/mese
      includes:
      - 15 richieste di acquisto al mese
      - database fornitori illimitato
      roles:
      - user
    - key: business
      price: 449
      interval: month
      label:
        it: Business - 60 richieste/mese
      includes:
      - 60 richieste di acquisto al mese
      - database fornitori illimitato
      roles:
      - user
  notifications:
    emailOnRunDone: true
  extensions:
  - key: optout_enforcement
    description: Il link di disiscrizione registra l'email in una lista; i nuovi invii la rispettano, ma i solleciti già programmati
      non la controllano automaticamente. Servirebbe una regola che escluda gli indirizzi in lista dai solleciti.
  - key: reply_to_buyer
    description: Le email partono dalla piattaforma a nome del buyer (nome e azienda nel testo); il Reply-To personalizzato
      con l'indirizzo del buyer e l'inoltro automatico alla casella dell'app non sono configurabili nel manifest.
  - key: attachment_reading
    description: 'Gli allegati delle email di risposta non sono leggibili dall''agente (la lettura file funziona solo per
      i file caricati dai moduli): i dati presenti solo negli allegati sono segnalati come mancanti.'
