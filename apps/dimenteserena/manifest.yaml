apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: mentesena
  displayName: MenteSerena
  tagline:
    it: Prenota una seduta con uno psicologo o medico iscritto all'albo, in modo semplice e riservato.
    en: Book a session with a licensed psychologist or physician, simply and privately.
  description:
    it: 'MenteSerena è solo lo strato software di prenotazione e gestione: le sedute sono svolte da professionisti iscritti
      agli albi e la videochiamata è un servizio esterno. Non offre diagnosi né valutazioni cliniche.'
    en: 'MenteSerena is only the booking and management software layer: sessions are delivered by licensed professionals and
      the video call is an external service. It offers no diagnosis or clinical assessment.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#2f5d62'
      accent: '#e07a5f'
      background: '#f7f5f0'
      foreground: '#1f2a2c'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Mente
      color: primary
    - text: Serena
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Privacy
        en: Privacy
      href: '#privacy'
    cta:
      label:
        it: Inizia
        en: Start
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: user
      label:
        it: Utente
        en: User
      assignedBy: signup
    - key: professional
      label:
        it: Professionista
        en: Professional
      assignedBy: invite
    - key: company
      label:
        it: Azienda convenzionata
        en: Partner company
      assignedBy: invite
  limits:
  - action: agent:matcher
    per: user
    max: 5
    window: day
    roles:
    - user
  agents:
  - key: matcher
    role: main
    description: Matches the user's questionnaire to three compatible professionals. No clinical evaluation.
    profile:
      inline:
        display_name: MenteSerena matcher
        crews:
        - id: matcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are an administrative matching assistant for MenteSerena, a booking platform. You are NOT a
            clinician: never diagnose, assess, interpret symptoms or suggest treatments. You only compare the stated preferences
            in the user''s questionnaire (gender preference, approach, language, available time slots, company agreement)
            with the professionals'' public profiles, which you find with the tool search_professionals (use it with filters
            on language and approach, then read the results). Never invent professionals or details.

            URGENCY: first read the questionnaire answers. If the reason or the notes mention suicidal thoughts, self-harm,
            violence, abuse, a crisis or immediate danger, begin the report with a section ''## Se hai bisogno di aiuto subito
            / If you need help now'' with: emergency number 112 (Italy, any emergency), 118 (medical emergency), Telefono
            Amico Italia 02 2327 2327, and tell the person to call now, before choosing anyone. Do not comment on the content
            further.

            REPORT: a level-1 title ''# Your three suggested professionals'' (in the user''s language), then the urgency section
            if needed, then exactly three professionals (fewer only if the catalogue has fewer), each as a ## heading with
            name, role (psychologist or doctor), professional register number if present, languages, approach, a one-line
            reason of compatibility based only on stated preferences, and next step ''Book from the Professionals page''.
            Add a note that the platform does not provide clinical evaluations and the choice is the user''s. Write in the
            user''s language. Do not repeat sensitive details of the questionnaire in the report beyond the preferences used.'
          mcp_servers: []
    appTools:
    - name: search_professionals
      description: Search the catalogue of professionals available on the platform
      action: search
      collection: professionals
      scope: all
    context:
    - key: answers
      from: collection:intake
    goalTemplate: 'Questionnaire answers of the user (JSON lines, latest last):

      {answers}

      Today is {date}. Write the report in the language with ISO code {lang}.'
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.3
  data:
    collections:
    - name: intake
      ownedBy: user
      retentionDays: 1095
      description: Initial questionnaire (special-category data, visible only to the user)
      fields:
      - name: consent_health
        type: boolean
        required: true
        label:
          it: Acconsento esplicitamente al trattamento dei miei dati sulla salute per l'abbinamento e il servizio
          en: I explicitly consent to the processing of my health data for matching and the service
      - name: reason
        type: select
        required: true
        label:
          it: Motivo della richiesta
          en: Reason for the request
        options:
        - value: anxiety
          label:
            it: Ansia o stress
            en: Anxiety or stress
        - value: mood
          label:
            it: Umore
            en: Mood
        - value: relationships
          label:
            it: Relazioni
            en: Relationships
        - value: work
          label:
            it: Lavoro e burnout
            en: Work and burnout
        - value: grief
          label:
            it: Lutto o cambiamenti
            en: Grief or life changes
        - value: other
          label:
            it: Altro
            en: Other
      - name: reason_notes
        type: textarea
        maxLength: 800
        label:
          it: Vuoi aggiungere qualcosa? (facoltativo)
          en: Anything to add? (optional)
      - name: pref_gender
        type: select
        label:
          it: Preferenza sul genere del professionista
          en: Professional's gender preference
        options:
        - value: any
          label:
            it: Indifferente
            en: No preference
        - value: female
          label:
            it: Donna
            en: Woman
        - value: male
          label:
            it: Uomo
            en: Man
      - name: pref_approach
        type: select
        label:
          it: Approccio preferito
          en: Preferred approach
        options:
        - value: any
          label:
            it: Non so / indifferente
            en: Not sure / any
        - value: cbt
          label:
            it: Cognitivo-comportamentale
            en: Cognitive-behavioural
        - value: psychodynamic
          label:
            it: Psicodinamico
            en: Psychodynamic
        - value: systemic
          label:
            it: Sistemico-relazionale
            en: Systemic
        - value: humanistic
          label:
            it: Umanistico
            en: Humanistic
      - name: pref_language
        type: select
        required: true
        label:
          it: Lingua delle sedute
          en: Session language
        options:
        - value: it
          label: Italiano
        - value: en
          label: English
      - name: availability
        type: multiselect
        required: true
        label:
          it: Fasce orarie disponibili
          en: Available time slots
        options:
        - value: morning
          label:
            it: Mattina
            en: Morning
        - value: afternoon
          label:
            it: Pomeriggio
            en: Afternoon
        - value: evening
          label:
            it: Sera
            en: Evening
        - value: weekend
          label:
            it: Weekend
            en: Weekend
      - name: company_code
        type: text
        maxLength: 40
        label:
          it: Codice convenzione aziendale (facoltativo)
          en: Company agreement code (optional)
    - name: professionals
      ownedBy: shared
      description: Public profiles of licensed professionals (no patient data)
      fields:
      - name: name
        type: text
        required: true
      - name: role
        type: select
        options:
        - psychologist
        - doctor
      - name: register_number
        type: text
        label:
          it: N. iscrizione all'albo
          en: Register number
      - name: gender
        type: select
        options:
        - female
        - male
        - other
      - name: approach
        type: select
        options:
        - cbt
        - psychodynamic
        - systemic
        - humanistic
      - name: languages
        type: multiselect
        options:
        - it
        - en
      - name: bio
        type: textarea
      - name: email
        type: email
    - name: appointments
      ownedBy: user
      description: Bookings (agenda). No clinical content.
      fields:
      - name: start
        type: date
      - name: end
        type: date
      - name: date
        type: date
      - name: resource
        type: text
      - name: status
        type: select
        options:
        - booked
        - cancelled
      - name: professional_email
        type: email
      - name: notes
        type: text
        maxLength: 200
        label:
          it: Note organizzative (non cliniche)
          en: Organisational notes (non-clinical)
      access:
      - role: professional
        where:
          professional_email: '{user.email}'
        can:
        - read
    - name: care_relations
      ownedBy: user
      description: Which professional follows which patient; therapist change proposals
      fields:
      - name: professional_email
        type: email
        required: true
      - name: professional_name
        type: text
      - name: status
        type: select
        options:
        - active
        - change_proposed
        - closed
      - name: change_note
        type: textarea
        maxLength: 400
        label:
          it: Motivo organizzativo del cambio (non clinico)
          en: Organisational reason for the change (non-clinical)
      access:
      - role: professional
        where:
          professional_email: '{user.email}'
        can:
        - read
        - write
    - name: clinical_notes
      ownedBy: user
      description: Private clinical notes written by a professional; owned by the professional only
      fields:
      - name: patient_email
        type: email
        required: true
      - name: session_date
        type: date
        required: true
      - name: note
        type: textarea
        required: true
  views:
  - key: home
    type: page
    nav: false
    sections:
    - type: hero
      layout: stack
      band: true
      eyebrow:
        it: Prenotazione e gestione
        en: Booking and management
      title:
        it: Trova il professionista giusto, **prenota** e inizia
        en: Find the right professional, **book** and begin
      text:
        it: Compili un breve questionario, ricevi tre professionisti compatibili con le tue preferenze, scegli, prenoti uno
          slot e paghi online. La seduta si svolge in videochiamata.
        en: Fill in a short questionnaire, get three professionals matching your preferences, choose, book a slot and pay
          online. The session takes place by video call.
      actions:
      - label:
          it: Accedi e inizia
          en: Sign in and start
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Questionario
          en: Questionnaire
        text:
          it: Motivo, preferenze, orari e consenso esplicito.
          en: Reason, preferences, times and explicit consent.
        badge: 📝
      - title:
          it: Abbinamento
          en: Matching
        text:
          it: Tre professionisti compatibili con le tue preferenze, senza valutazioni cliniche.
          en: Three professionals matching your preferences, with no clinical evaluation.
        badge: 🤝
      - title:
          it: Prenota e paga
          en: Book and pay
        text:
          it: Scegli uno slot dal calendario e paga con carta; email e promemoria con il link alla videochiamata.
          en: Pick a slot from the calendar and pay by card; email and reminders with the video call link.
        badge: 📅
    - type: cards
      id: privacy
      title:
        it: Privacy e dati sanitari
        en: Privacy and health data
      items:
      - title:
          it: Consenso esplicito
          en: Explicit consent
        text:
          it: 'I dati sanitari sono categoria particolare: li trattiamo solo con il tuo consenso.'
          en: 'Health data is a special category: we process it only with your consent.'
      - title:
          it: Solo il tuo professionista
          en: Only your professional
        text:
          it: Il professionista vede solo i propri pazienti. L'amministrazione vede agenda e pagamenti, non dati clinici.
          en: The professional sees only their own patients. Administration sees agenda and payments, not clinical data.
      - title:
          it: 'Aziende: solo numeri aggregati'
          en: 'Companies: aggregate numbers only'
        text:
          it: Le aziende convenzionate vedono statistiche anonime.
          en: Partner companies see anonymous statistics.
    - type: note
      content:
        it: MenteSerena è solo un servizio software. Non fornisce diagnosi né consulenza clinica. In caso di emergenza chiama
          il 112.
        en: MenteSerena is a software service only. It provides no diagnosis or clinical advice. In an emergency call 112.
  - key: intake_form
    type: form
    title:
      it: Questionario iniziale
      en: Initial questionnaire
    collection: intake
    roles:
    - user
    submit:
      label:
        it: Invia e trova i professionisti
        en: Submit and find professionals
      message:
        it: Grazie. Stiamo preparando i tuoi abbinamenti.
        en: Thank you. We are preparing your matches.
      redirect: matches
  - key: matches
    type: history
    title:
      it: I miei abbinamenti
      en: My matches
    source: run
    roles:
    - user
  - key: match
    type: report
    source: run
    printable: false
    nav: false
  - key: professionals_list
    type: cards
    title:
      it: Professionisti
      en: Professionals
    source: collection:professionals
    roles:
    - user
    - admin
    data:
      display: cards
      fields:
      - key: name
        label:
          it: Nome
          en: Name
      - key: role
        format: badge
      - key: approach
        format: badge
      - key: languages
      - key: bio
  - key: book
    type: booking
    title:
      it: Prenota una seduta
      en: Book a session
    collection: appointments
    resources: collection:professionals
    fields:
    - notes
    roles:
    - user
    slots:
      days:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      from: 09:00
      to: '20:00'
      minutes: 50
      tz: Europe/Rome
      aheadDays: 21
      minNoticeHours: 12
      capacity: 1
  - key: my_appointments
    type: table
    title:
      it: I miei appuntamenti
      en: My appointments
    source: collection:appointments
    roles:
    - user
    - professional
    data:
      display: table
      fields:
      - key: date
        format: date
      - key: resource
      - key: status
        format: badge
      sort:
        field: date
        dir: asc
  - key: my_patients
    type: table
    title:
      it: I miei pazienti
      en: My patients
    source: collection:care_relations
    roles:
    - professional
    data:
      display: table
      fields:
      - key: status
        format: badge
      - key: change_note
  - key: propose_change
    type: form
    title:
      it: Proponi cambio di terapeuta
      en: Propose a therapist change
    collection: care_relations
    fields:
    - status
    - change_note
    edit: true
    roles:
    - professional
    nav: false
    submit:
      label:
        it: Invia proposta
        en: Send proposal
      message:
        it: Proposta registrata.
        en: Proposal recorded.
      redirect: my_patients
  - key: new_note
    type: form
    title:
      it: Nuova nota clinica privata
      en: New private clinical note
    collection: clinical_notes
    roles:
    - professional
    submit:
      label:
        it: Salva nota
        en: Save note
      message:
        it: Nota salvata.
        en: Note saved.
  - key: usage
    type: dashboard
    title:
      it: Utilizzo e agenda
      en: Usage and agenda
    children:
    - usage_table
    - payments_admin
    roles:
    - admin
  - key: usage_table
    type: table
    source: collection:appointments
    nav: false
    roles:
    - admin
    data:
      display: chart
      chart: bar
      fields:
      - key: date
        label:
          it: Mese
          en: Month
      - key: total
        label:
          it: Sedute
          en: Sessions
      groupBy:
        field: date
        bucket: month
        aggs:
        - key: total
          agg: count
  - key: payments_admin
    type: admin
    title:
      it: Pagamenti
      en: Payments
    roles:
    - admin
    nav: false
  - key: company_stats
    type: table
    title:
      it: Statistiche aziendali anonime
      en: Anonymous company statistics
    source: collection:intake
    roles:
    - company
    - admin
    data:
      display: table
      fields:
      - key: company_code
        label:
          it: Convenzione
          en: Agreement
      - key: count
        label:
          it: Richieste
          en: Requests
      groupBy:
        field: company_code
        aggs: []
        minCount: 5
        acrossUsers: true
  - key: account
    type: account
    title:
      it: Crediti e abbonamento
      en: Credits and plan
    roles:
    - user
  triggers:
  - key: match_on_intake
    'on':
      collection: intake
      op: insert
    start:
      agent: matcher
    goal: A new questionnaire was submitted. Read the user's questionnaire answers from your context and write the match report
      in the user's language.
    asUser: true
  - key: charge_session
    'on':
      collection: appointments
      op: insert
      where:
        status: booked
    charge:
      credits: 50
      reason: therapy session
  - key: booking_confirmation
    'on':
      collection: appointments
      op: insert
      where:
        status: booked
    notify:
      to:
      - owner
      subject:
        it: Seduta prenotata il {record.date}
        en: Session booked for {record.date}
      body:
        it: La tua seduta è confermata. Il link alla videochiamata è nella pagina I miei appuntamenti. Per qualsiasi emergenza
          chiama il 112.
        en: Your session is confirmed. The video call link is on the My appointments page. In any emergency call 112.
      link: my_appointments
  - key: booking_professional
    'on':
      collection: appointments
      op: insert
      where:
        status: booked
    notify:
      to:
      - record.professional_email
      subject:
        it: Nuova prenotazione il {record.date}
        en: New booking for {record.date}
      body:
        it: Hai una nuova seduta in agenda.
        en: You have a new session on your agenda.
      link: my_appointments
  - key: session_reminder
    'on':
      date:
        collection: appointments
        field: start
        offsetDays: -1
        hour: 8
    notify:
      to:
      - owner
      - record.professional_email
      subject:
        it: 'Promemoria: seduta domani'
        en: 'Reminder: session tomorrow'
      body:
        it: Ricordiamo la seduta di domani. Trovi il link alla videochiamata in I miei appuntamenti.
        en: A reminder of tomorrow's session. You'll find the video call link in My appointments.
      link: my_appointments
  - key: change_proposed_notice
    'on':
      collection: care_relations
      op: update
      where:
        status: change_proposed
    notify:
      to:
      - owner
      - admins
      subject:
        it: Proposta di cambio terapeuta
        en: Therapist change proposed
      body:
        it: Il professionista ha proposto un cambio di terapeuta. Accedi per scegliere un nuovo abbinamento.
        en: The professional proposed a therapist change. Sign in to choose a new match.
      link: matches
  billing:
    modes:
    - credits
    - subscription
    currency: eur
    signupCredits: 10
    costs:
      agent:matcher: 5
    packs:
    - key: session
      credits: 50
      price: 60
      label:
        it: Seduta singola
        en: Single session
    - key: package5
      credits: 250
      price: 270
      label:
        it: Pacchetto 5 sedute
        en: 5-session package
    plans:
    - key: monthly
      price: 199
      interval: month
      credits: 200
      creditsReset: monthly
      label:
        it: Abbonamento mensile (4 sedute)
        en: Monthly plan (4 sessions)
  notifications:
    emailOnRunDone: true
  extensions:
  - key: health_data_controls
    description: 'Needed beyond the manifest: encryption at rest of clinical_notes, an access log of who read special-category
      records, and excluding admins from intake, care_relations and clinical_notes (the runtime lets admins reach user records
      by default). Also a DPA/DPIA with the hosting provider.'
  - key: professional_onboarding
    description: Professional profiles (professionals) are loaded by the owner; role professional is assigned by invite. appointments.professional_email
      must be copied from the booked professional's email, and the video call link (external service) is stored on the professional's
      record; per-professional slots are set in the record's slots field.
  - key: company_scoping
    description: Company statistics are aggregated with minCount 5, but a view limited to the viewer's own company agreement
      is not expressible yet; it needs a per-company filter.
  - key: video_call_and_sms
    description: The video call is an external service. SMS/WhatsApp reminders are not available; only email. The session
      reminder cannot skip cancelled bookings (date triggers have no where filter).
