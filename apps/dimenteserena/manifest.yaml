apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: dimenteserena
  displayName: Di MenteSerena
  tagline:
    it: Prenota la seduta giusta con psicologi e medici iscritti agli albi.
    en: Book the right session with licensed psychologists and doctors.
  description:
    it: Di MenteSerena è solo lo strato software di abbinamento, prenotazione e gestione. Le sedute sono svolte da professionisti
      iscritti ai relativi albi; la videochiamata è un servizio esterno.
    en: Di MenteSerena is only the software layer for matching, booking and management. Sessions are delivered by professionals
      registered with their professional boards; the video call is an external service.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#2f4f5f'
      accent: '#5fa8a0'
      background: '#f7faf9'
      foreground: '#1c2b33'
    fonts:
      body: Inter
      display: Lora
    wordmark:
    - text: Di Mente
      color: primary
    - text: Serena
      color: accent
    buttonShape: rounded
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Privacy
        en: Privacy
      href: '#privacy'
    cta:
      label:
        it: Inizia
        en: Start
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: user
      label:
        it: Utente
        en: User
      assignedBy: signup
    - key: professional
      label:
        it: Professionista
        en: Professional
      assignedBy: invite
    - key: company
      label:
        it: Azienda convenzionata
        en: Partner company
      assignedBy: invite
  limits:
  - action: agent:matcher
    per: user
    max: 5
    window: day
    roles:
    - user
  agents:
  - key: matcher
    role: main
    description: Reads the intake questionnaire only to match the user with three compatible professionals. No clinical assessment.
    profile:
      inline:
        display_name: Di MenteSerena matcher
        crews:
        - id: matcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the matching assistant of Di MenteSerena, a booking platform. You are NOT a clinician: never
            diagnose, assess, interpret symptoms or suggest therapies. You only use the questionnaire to match preferences
            (gender, approach, language, availability, corporate agreement) with the professionals returned by the tool search_professionals.


            URGENCY FIRST: if the free-text reason mentions self-harm, suicide, violence, abuse, or an immediate danger, start
            the report with a section ''## Se sei in pericolo adesso / If you are in danger now'' with: 112 (emergency number
            in Italy and the EU), Telefono Amico Italia 02 2327 2327, and the advice to go to the nearest emergency room.
            Then still offer the matching, without commenting on the content.


            Structure: a level-1 title ''# I tuoi tre professionisti / Your three professionals'' (in the user''s language),
            a short neutral intro, then for each of exactly three professionals (only those found by the tool; fewer if fewer
            exist, never invent any) a ''## '' heading with name and title, registration board and number as given, approach,
            languages, why they match (only on stated preferences), next available slots as given, session price. End with
            the next step: open ''Prenota'' to choose a slot, and a reminder that the platform does not provide medical or
            psychological advice and that sessions are delivered by licensed professionals. Never repeat sensitive details
            of the reason for the request beyond what is needed. Write in the language with ISO code from the goal.'
          mcp_servers: []
    appTools:
    - name: search_professionals
      description: Search the catalogue of active professionals (profile, approach, languages, gender, price, next slots)
      action: search
      collection: professionals
      scope: all
    - name: save_intake
      description: Store the user's questionnaire in their own private records
      action: write
      collection: intake
      scope: user
    goalTemplate: 'Language: {lang}. Today: {date}.

      Reason for the request (free text, use only for matching and urgency signals): {reason}

      Preferred gender of the professional: {pref_gender_label}

      Preferred approach: {pref_approach_label}

      Preferred language of the sessions: {pref_language_label}

      Availability: {availability_label}

      {?company_code}Corporate agreement or bonus code: {company_code}{/company_code}

      Explicit consent to processing of health data given: {consent}.

      First save the questionnaire with save_intake, then search the professionals and write the report.'
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.3
  - key: rematcher
    role: helper
    description: 'Handles a therapist change proposed by a professional: records the proposal and asks the patient to confirm.
      No clinical assessment.'
    awaits:
    - therapist_change
    profile:
      inline:
        display_name: Di MenteSerena therapist change
        crews:
        - id: rematcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You handle therapist-change proposals for Di MenteSerena. You are NOT a clinician: never assess
            or comment on clinical matters. Given a proposal from a professional (generic reason, suggested professional),
            use search_professionals to check the suggested professional exists, record the proposal with save_change_request,
            then call request_therapist_change so the patient can confirm or decline. Start the output with ''# Proposta di
            cambio terapeuta / Therapist change proposal'' and summarise neutrally in the user''s language. Never invent professionals
            or reveal clinical details.'
          mcp_servers: []
    appTools:
    - name: search_professionals
      description: Search the catalogue of active professionals
      action: search
      collection: professionals
      scope: all
    - name: save_change_request
      description: Record the therapist-change proposal
      action: write
      collection: change_requests
      scope: user
    goalTemplate: 'Language: {lang}. Today: {date}.

      A professional proposes a therapist change.

      Generic reason: {reason_generic}

      Suggested professional: {suggested_professional}

      Record the proposal and ask the patient to confirm.'
    output: markdown
    limits:
      maxTurns: 6
      maxBudgetUsd: 0.2
  inputForm:
    title:
      it: Questionario iniziale
      en: Intake questionnaire
    fields:
    - name: reason
      type: textarea
      required: true
      maxLength: 800
      label:
        it: Motivo della richiesta
        en: Reason for your request
      help:
        it: Scrivi solo ciò che vuoi condividere. Il testo è visibile solo a te e all'abbinamento.
        en: Share only what you wish. Only you and the matching step can read it.
    - name: pref_gender
      type: select
      label:
        it: Genere del professionista
        en: Professional's gender
      default: any
      options:
      - value: any
        label:
          it: Indifferente
          en: No preference
      - value: female
        label:
          it: Donna
          en: Woman
      - value: male
        label:
          it: Uomo
          en: Man
    - name: pref_approach
      type: select
      label:
        it: Approccio
        en: Approach
      default: any
      options:
      - value: any
        label:
          it: Nessuna preferenza
          en: No preference
      - value: cbt
        label:
          it: Cognitivo-comportamentale
          en: Cognitive-behavioural
      - value: psychodynamic
        label:
          it: Psicodinamico
          en: Psychodynamic
      - value: systemic
        label:
          it: Sistemico-relazionale
          en: Systemic
      - value: humanistic
        label:
          it: Umanistico
          en: Humanistic
    - name: pref_language
      type: select
      required: true
      label:
        it: Lingua delle sedute
        en: Session language
      default: it
      options:
      - value: it
        label:
          it: Italiano
          en: Italian
      - value: en
        label:
          it: Inglese
          en: English
    - name: availability
      type: select
      required: true
      label:
        it: Fascia oraria disponibile
        en: Available time slot
      options:
      - value: morning
        label:
          it: Mattina
          en: Morning
      - value: afternoon
        label:
          it: Pomeriggio
          en: Afternoon
      - value: evening
        label:
          it: Sera
          en: Evening
      - value: weekend
        label:
          it: Weekend
          en: Weekend
    - name: company_code
      type: text
      maxLength: 60
      label:
        it: Codice convenzione o bonus aziendale (facoltativo)
        en: Corporate agreement or bonus code (optional)
    - name: consent
      type: boolean
      required: true
      label:
        it: Acconsento esplicitamente al trattamento dei miei dati sulla salute (art. 9 GDPR)
        en: I explicitly consent to the processing of my health data (Art. 9 GDPR)
  data:
    collections:
    - name: intake
      ownedBy: user
      description: The user's questionnaire and consent record; visible only to the user (and, by invitation, to the chosen
        professional)
      sharing:
      - viewer
      fields:
      - name: reason
        type: textarea
      - name: pref_gender
        type: text
      - name: pref_approach
        type: text
      - name: pref_language
        type: text
      - name: availability
        type: text
      - name: company_code
        type: text
      - name: consent
        type: boolean
    - name: professionals
      ownedBy: shared
      searchable: true
      description: 'Public catalogue of professionals: profile data only, no patient data'
      fields:
      - name: name
        type: text
        required: true
      - name: title
        type: text
      - name: board
        type: text
        help: Professional board and registration number
      - name: email
        type: email
      - name: gender
        type: text
      - name: approach
        type: text
      - name: languages
        type: text
      - name: bio
        type: textarea
      - name: price
        type: number
      - name: next_slots
        type: textarea
        help: Open slots from the professional's calendar
      - name: active
        type: boolean
    - name: bookings
      ownedBy: user
      description: The user's bookings; the professional sees only the bookings made with them
      sharing:
      - viewer
      fields:
      - name: professional
        type: relation
        relation: professionals
      - name: slot
        type: date
      - name: kind
        type: select
        options:
        - single
        - package
      - name: status
        type: select
        options:
        - requested
        - confirmed
        - done
        - cancelled
      - name: paid
        type: boolean
      - name: video_link
        type: url
    - name: clinical_notes
      ownedBy: user
      description: Private notes written by the professional about their own patients; owned by the professional, never visible
        to admin or companies
      fields:
      - name: patient_ref
        type: text
      - name: session_date
        type: date
      - name: note
        type: textarea
    - name: change_requests
      ownedBy: user
      description: A professional's proposal to change therapist, to be confirmed by the patient
      sharing:
      - viewer
      fields:
      - name: patient_ref
        type: text
      - name: reason_generic
        type: text
      - name: suggested_professional
        type: relation
        relation: professionals
      - name: status
        type: select
        options:
        - proposed
        - accepted
        - declined
  approvals:
  - key: therapist_change
    title:
      it: Cambio di terapeuta
      en: Change of therapist
    description: The patient confirms or declines a therapist change proposed by their professional
    decidedBy: requester
    fields:
    - suggested_professional
    - reason_generic
  views:
  - key: home
    type: page
    title: Di MenteSerena
    nav: false
    sections:
    - type: hero
      layout: stack
      band: true
      eyebrow:
        it: Prenotazione e gestione sedute
        en: Session booking and management
      title:
        it: Trova il professionista giusto, **con calma**.
        en: Find the right professional, **calmly**.
      text:
        it: Compili un breve questionario, ti proponiamo tre professionisti compatibili, prenoti uno slot e paghi online.
          La seduta è in videochiamata.
        en: Fill in a short questionnaire, get three compatible professionals, book a slot and pay online. Sessions are held
          by video call.
      actions:
      - label:
          it: Inizia il questionario
          en: Start the questionnaire
        href: /login
        style: primary
      note:
        it: 'In caso di emergenza chiama il 112. Telefono Amico: 02 2327 2327.'
        en: 'In an emergency call 112. Telefono Amico (Italy): 02 2327 2327.'
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Questionario
          en: Questionnaire
        text:
          it: Motivo, preferenze, fasce orarie ed eventuale convenzione aziendale.
          en: Reason, preferences, time slots and any company agreement.
        badge: 📝
      - title:
          it: Abbinamento
          en: Matching
        text:
          it: 'Un agente confronta solo le tue preferenze con i profili: nessuna valutazione clinica.'
          en: 'An agent compares only your preferences with profiles: no clinical assessment.'
        badge: 🤝
      - title:
          it: Prenota e paga
          en: Book and pay
        text:
          it: Scegli uno slot dal calendario e paga la seduta o il pacchetto con carta.
          en: Pick a slot from the calendar and pay for the session or package by card.
        badge: 📅
      - title:
          it: Seduta in video
          en: Video session
        text:
          it: Ricevi il link alla videochiamata, un servizio esterno.
          en: You receive the link to the video call, an external service.
        badge: 💻
    - type: cards
      id: privacy
      title:
        it: Dati sulla salute e privacy
        en: Health data and privacy
      items:
      - title:
          it: Consenso esplicito
          en: Explicit consent
        text:
          it: Nessun dato è trattato senza il tuo consenso (art. 9 GDPR).
          en: No data is processed without your consent (Art. 9 GDPR).
      - title:
          it: Il professionista vede solo i suoi pazienti
          en: Professionals see only their patients
        text:
          it: Le note cliniche sono private. L'admin vede solo agenda, pagamenti e utilizzo.
          en: Clinical notes are private. The admin sees only calendar, payments and usage.
      - title:
          it: 'Aziende: solo numeri anonimi'
          en: 'Companies: anonymous numbers only'
        text:
          it: Le aziende convenzionate vedono solo dati aggregati.
          en: Partner companies see aggregated anonymous figures only.
    - type: note
      content:
        it: 'Di MenteSerena è solo una piattaforma software: non fornisce prestazioni sanitarie né consulenza clinica. Le
          sedute sono svolte da professionisti iscritti agli albi.'
        en: 'Di MenteSerena is a software platform only: it provides no healthcare services or clinical advice. Sessions are
          delivered by professionals registered with their boards.'
  - key: match
    type: new_run
    title:
      it: Questionario e abbinamento
      en: Questionnaire and matching
    roles:
    - user
  - key: matches
    type: history
    title:
      it: I miei abbinamenti
      en: My matches
    source: run
    roles:
    - user
  - key: match_report
    type: report
    source: run
    printable: true
    nav: false
  - key: professionals_list
    type: cards
    title:
      it: Professionisti
      en: Professionals
    source: collection:professionals
    roles:
    - user
    - admin
    data:
      display: cards
      fields:
      - key: name
        label:
          it: Nome
          en: Name
      - key: title
        label:
          it: Titolo
          en: Title
      - key: approach
        label:
          it: Approccio
          en: Approach
      - key: languages
        label:
          it: Lingue
          en: Languages
      - key: price
        label:
          it: Prezzo
          en: Price
        format: money
      - key: next_slots
        label:
          it: Prossimi slot
          en: Next slots
      filters:
      - field: active
        op: '='
        value: true
      limit: 50
  - key: my_bookings
    type: table
    title:
      it: Le mie prenotazioni
      en: My bookings
    source: collection:bookings
    roles:
    - user
    data:
      display: table
      fields:
      - key: professional
        label:
          it: Professionista
          en: Professional
      - key: slot
        label:
          it: Data
          en: Date
        format: date
      - key: status
        label:
          it: Stato
          en: Status
        format: badge
      - key: paid
        label:
          it: Pagato
          en: Paid
      - key: video_link
        label: Video
        format: link
      sort:
        field: slot
        dir: asc
  - key: my_patients
    type: table
    title:
      it: I miei pazienti
      en: My patients
    source: collection:bookings
    roles:
    - professional
    data:
      display: table
      fields:
      - key: slot
        label:
          it: Data
          en: Date
        format: date
      - key: status
        label:
          it: Stato
          en: Status
        format: badge
      - key: paid
        label:
          it: Pagato
          en: Paid
      sort:
        field: slot
        dir: asc
  - key: notes
    type: table
    title:
      it: Note cliniche (private)
      en: Clinical notes (private)
    source: collection:clinical_notes
    roles:
    - professional
    data:
      display: table
      fields:
      - key: patient_ref
      - key: session_date
        format: date
      - key: note
      sort:
        field: session_date
        dir: desc
  - key: changes
    type: table
    title:
      it: Proposte di cambio terapeuta
      en: Therapist change proposals
    source: collection:change_requests
    roles:
    - professional
    - user
    data:
      display: table
      fields:
      - key: patient_ref
      - key: suggested_professional
      - key: status
        format: badge
  - key: approvals
    type: approvals
    title:
      it: Da confermare
      en: To confirm
    approvals:
    - therapist_change
    roles:
    - user
  - key: usage
    type: dashboard
    title:
      it: Utilizzo
      en: Usage
    roles:
    - admin
    children:
    - usage_runs
  - key: usage_runs
    type: table
    title:
      it: Abbinamenti eseguiti
      en: Matches run
    source: run
    nav: false
    roles:
    - admin
    data:
      display: kpi
      kpis:
      - label:
          it: Abbinamenti
          en: Matches
        agg: count
  - key: company_dashboard
    type: page
    title:
      it: Numeri aziendali (aggregati)
      en: Company figures (aggregated)
    roles:
    - company
    sections:
    - type: text
      title:
        it: Dati aggregati anonimi
        en: Anonymous aggregated data
      content:
        it: Qui compariranno solo totali anonimi (sedute fruite, tasso di utilizzo), mai dati individuali.
        en: Only anonymous totals (sessions used, utilisation rate) will appear here, never individual data.
  - key: account
    type: account
    title:
      it: Crediti e abbonamento
      en: Credits and plan
    roles:
    - user
  billing:
    modes:
    - credits
    - subscription
    currency: eur
    signupCredits: 10
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:matcher:
        estimate: 10
        metered: true
    packs:
    - key: session
      credits: 6000
      price: 60
      label:
        it: Seduta singola
        en: Single session
    - key: package4
      credits: 22000
      price: 220
      label:
        it: Pacchetto 4 sedute
        en: 4-session package
    plans:
    - key: monthly
      price: 199
      interval: month
      label:
        it: Abbonamento mensile (4 sedute)
        en: Monthly plan (4 sessions)
      credits: 20000
      creditsReset: monthly
      roles:
      - user
  extensions:
  - key: calendar_booking
    description: Per-professional calendar with slot selection, locking and cancellation; for now slots are listed in the
      professionals catalogue and bookings are records.
  - key: email_reminders
    description: Confirmation emails and reminders with the video-call link are not available yet (no notifications); the
      link is shown in the bookings view.
  - key: encrypted_clinical_notes
    description: End-to-end encryption of clinical notes, access logging and per-patient access restricted to the assigned
      professional need runtime support (field encryption, audit log); consent text must be reviewed by the data protection
      officer.
  - key: admin_clinical_isolation
    description: 'Admin must not read intake, notes or change requests: requires role-level exclusion of these collections
      in the admin views and API.'
  - key: company_aggregates
    description: Anonymous aggregates for partner companies (minimum cohort size) need a platform-side aggregation; no agent
      reads all users' records.
  - key: video_service
    description: Video call is an external service; the link is set manually on each booking.
  - key: per_session_payment
    description: Per-session card payment is modelled with credit packs; direct per-booking checkout and payout to professionals
      is a gap.
