apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: turismoinsight
  displayName: TurismoInsight
  tagline:
    it: Decision intelligence per destinazioni turistiche, consorzi e catene alberghiere.
    en: Decision intelligence for tourist destinations, consortia and hotel chains.
  description:
    it: 'Definisci un territorio e i mercati di provenienza: ogni settimana gli agenti raccolgono dati ISTAT/Eurostat, eventi,
      voli e notizie, calcolano trend e sentiment e ti danno dashboard, chat sui dati e un report mensile.'
    en: 'Define a territory and source markets: every week agents collect ISTAT/Eurostat data, events, flights and news, compute
      trends and sentiment, and give you a dashboard, data chat and a monthly report.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: dashboard
  branding:
    theme: light
    palette:
      primary: '#0b3c5d'
      accent: '#e07a1f'
      background: '#f6f8fa'
      foreground: '#14202b'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Turismo
      color: primary
    - text: Insight
      color: accent
    width: wide
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Fonti
        en: Sources
      href: '#fonti'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  limits:
  - action: chat
    per: user
    max: 60
    window: day
    roles:
    - user
  agents:
  - key: analyst
    role: scheduled
    description: 'Coordinates the weekly update of one territory: asks the collector for data, computes trends, seasonality
      and peer comparison, asks the sentiment agent, writes the weekly brief.'
    memory: instance
    delegates:
    - collector
    - sentiment
    writesTo:
      collection: territory_reports
    appTools:
    - name: obs_search
      description: Search the territory's archive of observations
      action: search
      collection: observations
      scope: session
    output: markdown
    limits:
      maxTurns: 30
      maxBudgetUsd: 1.5
    profile:
      inline:
        display_name: TurismoInsight analyst
        crews:
        - id: analyst
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are a tourism-intelligence analyst for one territory. Steps: 1) call ask_collector with the
            territory, municipalities and source markets to refresh the archive; 2) search the archive (obs_search) for arrivals
            and presences by market and period; compute year-on-year and month-on-month trends, seasonality, and compare with
            similar destinations when data exist; 3) call ask_sentiment to score news and public press releases; 4) write
            the weekly brief. Start with a level-1 title "# <Territory> — settimana del <date>". Sections ## Sintesi, ## Trend
            per mercato, ## Stagionalità e confronto con destinazioni simili, ## Eventi e voli in arrivo, ## Sentiment, ##
            Rischi e opportunità, ## Fonti. Add a ```chart block with real figures for the main market comparison. Use only
            figures present in the archive; never invent numbers; say plainly when data are missing. Never use TripAdvisor
            or Booking reviews. Your memory holds the key points of last week: lead with what changed. At the end call remember
            once with the 5 key points. Write in the language with ISO code given in the goal.'
  - key: collector
    role: helper
    description: Collects ISTAT/Eurostat arrivals and presences, local event calendars, flight data and sector news from open
      sources and indexes them.
    appTools:
    - name: obs_write
      description: Save one observation in the territory's archive
      action: write
      collection: observations
      scope: session
    - name: obs_search
      description: Search the territory's archive of observations
      action: search
      collection: observations
      scope: session
    - name: eurostat_data
      description: Eurostat dissemination API (tourism statistics, e.g. dataset tour_occ_arn2); append the dataset code as
        path, filters in query
      action: http
      http:
        method: GET
        url: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data
        allowPath: true
        attribution: Eurostat, CC BY 4.0
    - name: istat_data
      description: ISTAT SDMX API (movimento turistico); append the path of the data query
      action: http
      http:
        method: GET
        url: https://esploradati.istat.it/SDMXWS/rest/data
        allowPath: true
        attribution: ISTAT, CC BY 4.0
    mcpServers:
    - name: webrobot
      url: https://mcp-full.webrobot.eu/mcp
      allow: all
    output: markdown
    limits:
      maxTurns: 40
      maxBudgetUsd: 2
    profile:
      inline:
        display_name: TurismoInsight collector
        crews:
        - id: collector
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You collect open data for one tourist territory and its source markets, then index each item with
            obs_write. Sources: arrivals and presences by country of origin and month from ISTAT (istat_data) and Eurostat
            (eurostat_data); event calendars published by local authorities and tourism boards; flight and airport traffic
            data from open sources; sector news and press releases. For web pages use the WebRobot MCP (scrape pages, run
            pipelines); respect robots.txt and terms. Never use TripAdvisor or Booking reviews. Each observation: kind (arrivals|events|flights|news),
            date (YYYY-MM-DD, month start for monthly stats), market (ISO country or empty), value (number, e.g. arrivals
            or presences), metric, title, text (short summary), url (source), lat and lon for events when known. Avoid duplicates:
            use obs_search first. Report to the caller a short list of what you saved and what was unavailable. Never invent
            data.'
  - key: sentiment
    role: helper
    description: Scores the sentiment of news and public releases about the territory.
    appTools:
    - name: obs_search
      description: Search the territory's archive of observations
      action: search
      collection: observations
      scope: session
    - name: obs_write
      description: Save one observation in the territory's archive
      action: write
      collection: observations
      scope: session
    output: markdown
    limits:
      maxTurns: 15
      maxBudgetUsd: 0.6
    profile:
      inline:
        display_name: TurismoInsight sentiment
        crews:
        - id: sentiment
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You assess the sentiment of news items and public press releases about a territory, as seen by tourists
            and the trade. Search the archive for kind news without a sentiment score, and for each save an observation of
            kind sentiment with the same date, title, url, market and a numeric value between -1 (very negative) and +1 (very
            positive), plus a one-line reason in text. Then answer with the average score, the most positive and the most
            negative topics, and how many items you scored. Only news and public releases: never reviews from TripAdvisor
            or Booking. Do not invent items.'
  - key: reporter
    role: scheduled
    description: Writes the monthly executive report for one territory.
    writesTo:
      collection: territory_reports
    appTools:
    - name: obs_search
      description: Search the territory's archive of observations
      action: search
      collection: observations
      scope: session
    output: markdown
    limits:
      maxTurns: 15
      maxBudgetUsd: 0.8
    profile:
      inline:
        display_name: TurismoInsight monthly reporter
        crews:
        - id: reporter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write the monthly report for the executives of a destination or hotel group, printable as PDF.
            Read the archive with obs_search. Start with "# <Territory> — report mensile <month>". Sections: ## Sintesi per
            i dirigenti (5 bullets), ## Arrivi e presenze per mercato (table plus a ```chart block), ## Stagionalità e confronto,
            ## Eventi e collegamenti aerei dei prossimi mesi, ## Sentiment di stampa e comunicati, ## Raccomandazioni, ##
            Fonti e limiti dei dati. Real figures only from the archive; flag gaps. No TripAdvisor or Booking data. Write
            in the language with ISO code given.'
  - key: chat_analyst
    role: main
    description: Answers analysts' questions about their territories' data.
    appTools:
    - name: chat_search
      description: Search the user's archive of observations
      action: search
      collection: observations
      scope: user
    - name: chat_reports
      description: Read the user's weekly and monthly reports
      action: read
      collection: territory_reports
      scope: user
    goalTemplate: 'Conversation so far:

      {history}


      New question: {message}

      Answer in the language with ISO code {lang}.'
    output: markdown
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.5
    profile:
      inline:
        display_name: TurismoInsight chat
        chat_mode: true
        crews:
        - id: chat_analyst
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You answer tourism analysts' questions using only the user's own archive (chat_search) and reports
            (chat_reports). Cite source, date and market for every figure. If the data do not cover the question, say so and
            suggest what to add; never invent numbers. Be concise; add a table or a ```chart block when comparing markets
            or periods.
  templates:
  - key: territory_watch
    title:
      it: Territorio
      en: Territory
    description:
      it: 'Un territorio monitorato ogni settimana: raccolta dati, analisi e sentiment.'
      en: 'A territory monitored every week: data collection, analysis and sentiment.'
    agent: analyst
    params:
    - name: territory
      type: text
      required: true
      label:
        it: Nome del territorio
        en: Territory name
    - name: area
      type: textarea
      required: true
      maxLength: 500
      label:
        it: Comuni o provincia
        en: Municipalities or province
    - name: markets
      type: text
      required: true
      label:
        it: Mercati di provenienza (es. DE, FR, US)
        en: Source markets (e.g. DE, FR, US)
    - name: peers
      type: text
      label:
        it: Destinazioni simili (facoltativo)
        en: Similar destinations (optional)
    goal: 'Territory "{instance}": {territory}. Area: {area}. Source markets: {markets}. {?peers}Similar destinations: {peers}.{/peers}
      Today is {date}. Run the weekly update and write the brief in the language with ISO code {lang}.'
    schedule:
      cron: 0 5 * * 1
      userCanChange: false
    maxPerUser: 20
  - key: monthly_report
    title:
      it: Report mensile
      en: Monthly report
    description:
      it: Report mensile in PDF per i dirigenti, inviato via email.
      en: Monthly executive report, sent by email.
    agent: reporter
    params:
    - name: territory
      type: text
      required: true
      label:
        it: Territorio
        en: Territory
    - name: markets
      type: text
      label:
        it: Mercati
        en: Markets
    goal: 'Write the monthly report for "{instance}" ({territory}), markets {markets}. Today is {date}. Language: ISO code
      {lang}.'
    schedule:
      cron: 0 6 1 * *
      userCanChange: false
    maxPerUser: 20
    deliver:
      to: owner
      subject: TurismoInsight — {title}
      onlyIfNew: true
  data:
    collections:
    - name: observations
      ownedBy: instance
      searchable: true
      description: Searchable archive of arrivals, events, flights, news and sentiment scores for each territory
      retentionDays: 1095
      fields:
      - name: kind
        type: select
        options:
        - arrivals
        - events
        - flights
        - news
        - sentiment
      - name: date
        type: date
      - name: market
        type: text
      - name: metric
        type: text
      - name: value
        type: number
      - name: title
        type: text
      - name: text
        type: textarea
      - name: url
        type: url
      - name: lat
        type: number
      - name: lon
        type: number
    - name: territory_reports
      ownedBy: instance
      description: Weekly briefs and monthly reports of each territory
      retentionDays: 1095
  views:
  - key: home
    type: page
    nav: false
    title: TurismoInsight
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow:
        it: Decision intelligence per il turismo
        en: Tourism decision intelligence
      title:
        it: Capisci dove va il tuo **territorio**, mercato per mercato.
        en: Understand where your **territory** is heading, market by market.
      text:
        it: Arrivi e presenze ISTAT/Eurostat, eventi, voli e notizie in un archivio ricercabile, con trend, stagionalità,
          sentiment e un report mensile per i dirigenti.
        en: ISTAT/Eurostat arrivals and stays, events, flights and news in a searchable archive, with trends, seasonality,
          sentiment and a monthly executive report.
      actions:
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Definisci il territorio
          en: Define the territory
        text:
          it: Comuni o provincia e mercati di provenienza.
          en: Municipalities or province and source markets.
      - title:
          it: Raccolta settimanale
          en: Weekly collection
        text:
          it: Gli agenti raccolgono e indicizzano i dati da fonti aperte.
          en: Agents collect and index data from open sources.
      - title:
          it: Dashboard, chat e report
          en: Dashboard, chat and report
        text:
          it: Grafici, mappe, domande in chat e un PDF mensile via email.
          en: Charts, maps, chat questions and a monthly PDF by email.
    - type: cards
      id: fonti
      title:
        it: Fonti
        en: Sources
      items:
      - title: ISTAT · Eurostat
        text:
          it: 'Movimento turistico: arrivi e presenze (licenza CC BY 4.0).'
          en: 'Tourist movement: arrivals and stays (CC BY 4.0).'
      - title:
          it: Enti locali e aeroporti
          en: Local authorities and airports
        text:
          it: Calendari eventi e dati sui voli da fonti aperte.
          en: Event calendars and flight data from open sources.
      - title:
          it: Notizie e comunicati
          en: News and press releases
        text:
          it: Nessuna recensione di TripAdvisor o Booking.
          en: No TripAdvisor or Booking reviews.
    - type: note
      content:
        it: Supporto alle decisioni, non consulenza. I dati provengono da fonti pubbliche citate nei report.
        en: Decision support, not advice. Data come from public sources cited in the reports.
  - key: territories
    type: instances
    template: territory_watch
    title:
      it: I miei territori
      en: My territories
    roles:
    - user
    - admin
  - key: monthly
    type: instances
    template: monthly_report
    title:
      it: Report mensili
      en: Monthly reports
    roles:
    - user
    - admin
  - key: dashboard
    type: page
    title:
      it: Dashboard
      en: Dashboard
    roles:
    - user
    - admin
    sections:
    - type: data
      id: kpi
      source: collection:observations
      display: kpi
      filters:
      - field: kind
        op: '='
        value: arrivals
      kpis:
      - label:
          it: Osservazioni
          en: Observations
        agg: count
      - label:
          it: Arrivi totali
          en: Total arrivals
        agg: sum
        field: value
        format: number
    - type: data
      title:
        it: Arrivi per mese
        en: Arrivals by month
      source: collection:observations
      display: chart
      chart: line
      filters:
      - field: kind
        op: '='
        value: arrivals
      groupBy:
        field: date
        bucket: month
        aggs:
        - key: arrivi
          agg: sum
          field: value
      fields:
      - key: date
      - key: arrivi
    - type: data
      title:
        it: Arrivi per mercato
        en: Arrivals by market
      source: collection:observations
      display: chart
      chart: bar
      filters:
      - field: kind
        op: '='
        value: arrivals
      groupBy:
        field: market
        aggs:
        - key: arrivi
          agg: sum
          field: value
      fields:
      - key: market
      - key: arrivi
    - type: data
      title:
        it: Sentiment medio per mese
        en: Average sentiment by month
      source: collection:observations
      display: chart
      chart: line
      filters:
      - field: kind
        op: '='
        value: sentiment
      groupBy:
        field: date
        bucket: month
        aggs:
        - key: sentiment
          agg: avg
          field: value
      fields:
      - key: date
      - key: sentiment
    - type: view
      title:
        it: Mappa degli eventi
        en: Events map
      view: events_map
  - key: events_map
    type: map
    source: collection:observations
    nav: false
    map:
      lat: lat
      lon: lon
      title: title
      popup:
      - date
      - text
      - url
  - key: archive
    type: table
    title:
      it: Archivio dati
      en: Data archive
    source: collection:observations
    columns:
    - date
    - kind
    - market
    - metric
    - value
    - title
    - url
    export: true
    roles:
    - user
    - admin
  - key: reports
    type: table
    title:
      it: Report
      en: Reports
    source: collection:territory_reports
    printable: true
    roles:
    - user
    - admin
  - key: chat
    type: chat
    title:
      it: Chiedi ai dati
      en: Ask the data
    source: agent:chat_analyst
    examples:
    - it: Come sono cambiati gli arrivi tedeschi rispetto all'anno scorso?
      en: How did German arrivals change versus last year?
    - it: Quali eventi dei prossimi due mesi possono muovere i mercati chiave?
      en: Which events in the next two months could move key markets?
    placeholder:
      it: Fai una domanda sui tuoi territori…
      en: Ask about your territories…
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - user
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: territorio_annuale
      price: 1490
      interval: year
      label:
        it: Per territorio · annuale
        en: Per territory · annual
      includes:
      - 1 territory
      - weekly collection and analysis
      - dashboard and map
      - data chat
      - monthly PDF report by email
  notifications:
    emailOnRunDone: false
  egress:
    hosts:
    - ec.europa.eu
    - esploradati.istat.it
    notes: Eurostat dissemination API (reuse allowed, CC BY 4.0) and ISTAT SDMX API (CC BY 4.0) for tourist arrivals and stays.
  extensions:
  - key: per_territory_billing
    description: 'Annual price multiplied by the number of territories (quantity-based subscription) is not expressible: the
      plan is one territory; maxPerUser on the templates limits how many instances exist. A territory-to-plan check must be
      handled by the owner.'
  - key: executive_recipients
    description: The monthly PDF goes to the instance owner; delivery to a list of executives' emails is not available yet
      (the owner can forward it).
  - key: flight_data
    description: Flight data come from open airport/authority pages through the WebRobot MCP; no dedicated flight API is declared.
