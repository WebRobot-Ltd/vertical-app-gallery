apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: museovoce
  displayName: MuseoVoce
  tagline:
    it: Audioguide multilingua che rispondono solo con i materiali del tuo museo.
    en: Multilingual audio guides that answer only from your museum's own materials.
  description:
    it: Il curatore registra le opere e carica testi di sala e schede; un agente scrive il racconto per adulti o bambini e
      lo traduce. Dopo l'approvazione, il visitatore inquadra il QR code e ascolta e chiede a voce, con risposte che citano
      la fonte.
    en: Curators register works and upload room texts and notes; an agent writes the story for adults or children and translates
      it. After approval, visitors scan the QR code, listen and ask questions, with answers citing the source.
  langs:
  - it
  - en
  - fr
  - de
  - es
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#3b1f2b'
      accent: '#b8863b'
      background: '#faf6ef'
      foreground: '#1f1a1c'
    fonts:
      body: Inter
      display: Cormorant Garamond
    wordmark:
    - text: Museo
      color: primary
    - text: Voce
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Licenze
        en: Licences
      href: '#licenze'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
      - listen
      agents:
      - guide_chat
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      label:
        it: Curatore
        en: Curator
      assignedBy: signup
  limits:
  - action: create:artworks
    max: 5
    window: total
    plans:
      museum_s: 50
      museum_m: 250
      museum_l: -1
  - action: chat
    per: ip
    max: 60
    window: hour
    roles:
    - anonymous
  - action: agent:narrator
    per: user
    max: 40
    window: day
    roles:
    - user
  agents:
  - key: narrator
    role: main
    description: Writes the spoken story of a work from the museum's own materials and translates it.
    awaits:
    - publish_guide
    writesTo:
      collection: drafts
      parse: whole
    context:
    - key: art_title
      from: collection:artworks.title
    - key: art_artist
      from: collection:artworks.artist
    - key: art_year
      from: collection:artworks.year
    - key: art_code
      from: collection:artworks.code
    - key: materials
      from: collection:materials
    - key: museum_email
      from: user.email
    appTools:
    - name: read_upload
      description: Read a file the curator attached to a material (PDF, scan, image)
      action: read_file
    profile:
      inline:
        display_name: MuseoVoce narrator
        crews:
        - id: narrator
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write audio-guide scripts for museums. Use ONLY the museum''s materials given in the goal (and
            files you open with read_upload); never invent dates, attributions or facts. If the materials lack something,
            leave it out and list it under ''Gaps''. Tone: for audience ''adults'' informative and warm; for ''children''
            simple, playful, short sentences, with a question to look at the work. Each script is 120-200 words, written to
            be spoken (no lists, no markdown inside the script). Output: a level-1 title ''# <Work title> — <code>''; then
            for the source language and each requested language a ''## <language code>'' section with the script, followed
            by a line ''Sources: <titles of the materials used>''. End with ''## Gaps''. Then call request_publish_guide once
            so the curator can review and approve the texts before publication.'
    goalTemplate: 'Work: {art_title} (code {art_code}) by {art_artist}, {art_year}.

      Audience: {audience_label}.

      Write the script in language code {source_lang} and translate it into: {target_langs}.

      Museum materials (one JSON per line):

      {materials}

      Curator: {museum_email}. Today is {date}.'
    output: markdown
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.6
  - key: publisher
    role: helper
    description: After approval, publishes the approved texts to the public guide catalogue visitors read.
    appTools:
    - name: read_drafts
      description: Read the curator's drafts
      action: read
      collection: drafts
      scope: user
    - name: publish_guide_text
      description: Write one published guide text (one per work and language)
      action: write
      collection: guides
      scope: all
    profile:
      inline:
        display_name: MuseoVoce publisher
        crews:
        - id: publisher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You publish approved audio-guide texts. Read the latest draft with read_drafts. For each language
            section call publish_guide_text once with fields: museum (the curator email given in the goal), artwork_code,
            title, lang, audience, text (the script only, unchanged), sources (the ''Sources'' line) and status ''published''.
            Never alter the approved text. Reply with a short list of what you published.'
    goalTemplate: The curator {record.email} approved the latest draft. Publish it.
    output: markdown
  - key: guide_chat
    role: main
    description: 'Visitor''s voice/chat guide: answers only from the museum''s published texts, citing the source.'
    profile:
      inline:
        display_name: MuseoVoce guide
        chat_mode: true
        crews:
        - id: guide
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.15
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the audio guide of a museum, talking to a visitor who scanned the QR code of a work. Look
            up the published texts with search_guides (work code from the page, language of the visitor). Answer ONLY from
            those texts, in the visitor''s language, in short spoken sentences (max 80 words, no markdown), and end with ''Fonte:
            <source>'' translated into their language. If the texts do not contain the answer, say you do not know and suggest
            asking museum staff; never guess. Greet briefly and offer to explain the work at the first message.'
    appTools:
    - name: search_guides
      description: Search the museum's published guide texts
      action: search
      collection: guides
      scope: all
    goalTemplate: 'Language of the visitor: {lang}. Page/work: {page}.

      Conversation so far:

      {history}

      Visitor: {message}'
    output: markdown
  approvals:
  - key: publish_guide
    title:
      it: Approva i testi per la pubblicazione
      en: Approve texts for publication
    decidedBy: requester
    description: The curator reviews the texts and translations before visitors can hear them.
  triggers:
  - key: on_publish
    'on':
      approval: publish_guide
      decision: approved
    start:
      agent: publisher
    goal: The curator {record.email} approved the latest draft. Publish it.
  inputForm:
    title:
      it: Genera racconto
      en: Generate story
    fields:
    - name: artwork
      type: select
      required: true
      label:
        it: Opera
        en: Work
      optionsFrom: collection:artworks
    - name: audience
      type: select
      required: true
      label:
        it: Pubblico
        en: Audience
      options:
      - value: adults
        label:
          it: Adulti
          en: Adults
      - value: children
        label:
          it: Bambini
          en: Children
    - name: source_lang
      type: select
      required: true
      label:
        it: Lingua del racconto
        en: Story language
      default: it
      options:
      - value: it
        label: Italiano
      - value: en
        label: English
      - value: fr
        label: Français
      - value: de
        label: Deutsch
      - value: es
        label: Español
    - name: target_langs
      type: multiselect
      required: true
      label:
        it: Traduci in
        en: Translate into
      options:
      - value: en
        label: English
      - value: fr
        label: Français
      - value: de
        label: Deutsch
      - value: es
        label: Español
      - value: it
        label: Italiano
      - value: pt
        label: Português
      - value: zh
        label: 中文
      - value: ja
        label: 日本語
      - value: ar
        label: العربية
  data:
    collections:
    - name: artworks
      ownedBy: user
      description: The museum's works
      fields:
      - name: code
        type: text
        required: true
        label:
          it: Codice (nel QR)
          en: Code (in QR)
      - name: title
        type: text
        required: true
        label:
          it: Titolo
          en: Title
      - name: artist
        type: text
        label:
          it: Autore
          en: Artist
      - name: year
        type: text
        label:
          it: Data
          en: Date
      - name: room
        type: text
        label:
          it: Sala
          en: Room
    - name: materials
      ownedBy: user
      description: 'Room texts, notes and in-depth materials: the knowledge base'
      fields:
      - name: artwork_code
        type: text
        required: true
        label:
          it: Codice opera
          en: Work code
      - name: kind
        type: select
        label:
          it: Tipo
          en: Type
        options:
        - value: room_text
          label:
            it: Testo di sala
            en: Room text
        - value: card
          label:
            it: Scheda
            en: Catalogue card
        - value: essay
          label:
            it: Approfondimento
            en: In-depth
      - name: title
        type: text
        required: true
        label:
          it: Titolo fonte
          en: Source title
      - name: text
        type: textarea
        label:
          it: Testo
          en: Text
      - name: document
        type: file
        accept:
        - pdf
        - docx
        - txt
        - jpg
        - png
        maxMb: 15
        label:
          it: Documento
          en: Document
    - name: drafts
      ownedBy: user
      description: Generated texts awaiting the curator's review
    - name: guides
      ownedBy: shared
      searchable: true
      description: Approved, published guide texts read by visitors
      fields:
      - name: museum
        type: text
      - name: artwork_code
        type: text
      - name: title
        type: text
      - name: lang
        type: text
      - name: audience
        type: text
      - name: text
        type: textarea
      - name: sources
        type: text
      - name: status
        type: text
  views:
  - key: home
    type: page
    nav: false
    title: MuseoVoce
    sections:
    - type: hero
      layout: stack
      title:
        it: L'audioguida che **risponde** con i materiali del tuo museo.
        en: The audio guide that **answers** from your museum's materials.
      text:
        it: Racconti parlati in molte lingue, per adulti o bambini, approvati dal curatore. Il visitatore inquadra il QR code,
          ascolta e fa domande a voce.
        en: Spoken stories in many languages, for adults or children, approved by the curator. Visitors scan the QR code,
          listen and ask questions.
      actions:
      - label:
          it: Accedi come curatore
          en: Curator sign-in
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Registra opere e materiali
          en: Add works and materials
        text:
          it: Carichi testi di sala, schede e approfondimenti.
          en: Upload room texts, cards and in-depth materials.
        badge: 📚
      - title:
          it: Genera e approva
          en: Generate and approve
        text:
          it: L'agente scrive e traduce; tu rivedi e pubblichi.
          en: The agent writes and translates; you review and publish.
        badge: ✅
      - title:
          it: Il visitatore ascolta e chiede
          en: Visitors listen and ask
        text:
          it: Risposte solo dalle tue fonti, con citazione.
          en: Answers only from your sources, with citation.
        badge: 🎧
    - type: cards
      id: licenze
      title:
        it: Licenza annuale per museo
        en: Annual licence per museum
      items:
      - title: Small
        text:
          it: Fino a 50 opere
          en: Up to 50 works
      - title: Medium
        text:
          it: Fino a 250 opere
          en: Up to 250 works
      - title: Large
        text:
          it: Opere illimitate
          en: Unlimited works
    - type: note
      content:
        it: Le risposte si basano esclusivamente sui materiali pubblicati dal museo.
        en: Answers rely only on materials published by the museum.
  - key: listen
    type: chat
    title:
      it: Audioguida
      en: Audio guide
    source: agent:guide_chat
    placeholder:
      it: Chiedi qualcosa sull'opera…
      en: Ask about the work…
    examples:
    - Chi l'ha dipinto?
    - Perché questi colori?
    - Who made this?
    nav: false
  - key: artworks_form
    type: form
    title:
      it: Nuova opera
      en: New work
    collection: artworks
    submit:
      label:
        it: Salva opera
        en: Save work
      redirect: artworks
    roles:
    - user
    - admin
  - key: artworks
    type: table
    title:
      it: Collezione
      en: Collection
    source: collection:artworks
    columns:
    - code
    - title
    - artist
    - year
    - room
    export: true
    roles:
    - user
    - admin
  - key: material_form
    type: form
    title:
      it: Carica materiale
      en: Upload material
    collection: materials
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Materiale aggiunto alla base di conoscenza.
        en: Material added to the knowledge base.
    roles:
    - user
    - admin
  - key: materials
    type: table
    title:
      it: Materiali
      en: Materials
    source: collection:materials
    columns:
    - artwork_code
    - kind
    - title
    roles:
    - user
    - admin
  - key: new_story
    type: new_run
    title:
      it: Genera racconto
      en: Generate story
    roles:
    - user
    - admin
  - key: history
    type: history
    title:
      it: Racconti generati
      en: Generated stories
    source: run
    roles:
    - user
    - admin
  - key: story
    type: report
    source: run
    printable: true
    nav: false
  - key: review
    type: approvals
    title:
      it: Da approvare
      en: To approve
    approvals:
    - publish_guide
    roles:
    - user
    - admin
  - key: published
    type: table
    title:
      it: Pubblicati
      en: Published
    source: collection:guides
    columns:
    - artwork_code
    - title
    - lang
    - audience
    - status
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Licenza
      en: Licence
    roles:
    - user
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: museum_s
      price: 490
      interval: year
      label:
        it: Small — fino a 50 opere
        en: Small — up to 50 works
      includes:
      - 50 works
    - key: museum_m
      price: 1290
      interval: year
      label:
        it: Medium — fino a 250 opere
        en: Medium — up to 250 works
      includes:
      - 250 works
    - key: museum_l
      price: 2900
      interval: year
      label:
        it: Large — opere illimitate
        en: Large — unlimited works
      includes:
      - unlimited works
  notifications:
    emailOnRunDone: true
  extensions:
  - key: voice_io
    description: Speech-to-text and text-to-speech for the visitor's voice chat (browser or TTS service) are not yet available
      as manifest features; the chat is text-based for now.
  - key: usage_analytics
    description: Most-listened works and most-asked questions need logging of visitor chats/plays into a per-museum collection;
      anonymous agents cannot write records yet. Not available.
  - key: qr_codes
    description: QR codes pointing to /v/listen?page=<work code> must be generated and printed by the museum; no QR generator
      in the manifest.
  - key: museum_scoping
    description: Published guides sit in one shared catalogue with a museum field; strict per-museum separation of visitor
      lookups needs the QR link to carry the museum and code.
