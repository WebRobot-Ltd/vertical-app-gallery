apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: passo-avanti-studio
  displayName: Passo Avanti Studio
  tagline:
    it: Il tuo piano di studio, il tuo tutor, i tuoi progressi.
    en: Your study plan, your tutor, your progress.
  description:
    it: 'Preparazione per studenti delle superiori, test d''ingresso universitari e concorsi pubblici: piano settimanale,
      tutor in chat, quiz e simulazioni corretti automaticamente, dashboard dei progressi.'
    en: 'Preparation for high-school students, university entrance tests and public competitions: weekly plan, chat tutor,
      auto-graded quizzes and mock exams, progress dashboard.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f3a8a'
      accent: '#f59e0b'
      background: '#f8fafc'
      foreground: '#0f172a'
    fonts:
      body: Inter
      display: Poppins
    wordmark:
    - text: Passo Avanti
      color: primary
    - text: ' Studio'
      color: accent
    button: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Obiettivi
        en: Goals
      href: '#obiettivi'
    cta:
      label:
        it: Inizia
        en: Start
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: editor
      label:
        it: Docente redazione
        en: Editorial teacher
      assignedBy: invite
    - key: user
      label:
        it: Studente
        en: Student
      assignedBy: signup
    - key: parent
      label:
        it: Genitore
        en: Parent
      assignedBy: derived
      from: collection:guardians.parent_email
  limits:
  - action: chat
    per: user
    max: 60
    window: day
    roles:
    - user
  - action: run
    per: user
    max: 10
    window: day
    roles:
    - user
  agents:
  - key: planner
    role: main
    when: mode == 'plan'
    description: Builds the weekly study plan from official programmes and calls for applications.
    profile:
      inline:
        display_name: Passo Avanti planner
        crews:
        - id: planner
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'Sei un tutor-pianificatore per studenti italiani (superiori, test d''ingresso universitari come
            Medicina, concorsi per insegnanti e per enti pubblici). Se serve, consulta tramite il MCP le pagine ufficiali
            del MIM (programmi e indicazioni nazionali), del MUR (bandi e test d''ingresso) e dei bandi di concorso (es. inPA,
            Gazzetta Ufficiale) per l''obiettivo scelto, e cita le fonti con link. Non inventare date, posti, punteggi o requisiti:
            se non li trovi, dillo e invita a verificare il bando. Produci un report in Markdown che inizia con un titolo
            di livello 1 "# Piano di studio — <obiettivo>". Sezioni (##): Sintesi dell''obiettivo e fonti, Settimane fino
            all''esame (tabella: settimana, argomenti, ore, attività), Piano dettagliato della prossima settimana giorno per
            giorno, Quiz e simulazioni previste, Come adattiamo il piano, Prossimi passi. Rispetta le ore settimanali disponibili
            e il livello di partenza; se l''esame è vicino, dai priorità agli argomenti a più alto peso. Aggiungi un blocco
            ```chart con le ore per settimana. Tono incoraggiante, sii onesto sui tempi irrealistici. Le lezioni dal vivo
            con insegnanti reali si prenotano fuori dall''app: menzionale solo come suggerimento. Nessuna garanzia di risultato.'
    goalTemplate: 'Obiettivo: {goal_label}

      {?subject}Materia/area: {subject}{/subject}

      Data esame: {exam_date}

      Ore disponibili a settimana: {hours}

      Livello di partenza: {level_label}

      Oggi è {date}. Scrivi il piano nella lingua con codice ISO {lang}.'
    output: markdown
    limits:
      maxTurns: 25
      maxBudgetUsd: 1.0
  - key: grader
    role: helper
    when: mode == 'grade'
    description: Grades a quiz or mock exam answered by the student and records the score.
    profile:
      inline:
        display_name: Passo Avanti grader
        crews:
        - id: grader
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Correggi un quiz a risposta multipla. Lo studente incolla le domande (con le opzioni) e le sue risposte,
            oppure la chiave del quiz. Inizia con "# Correzione — <materia>". Sezioni (##): Punteggio, Correzione domanda
            per domanda (risposta corretta e spiegazione breve), Punteggio per argomento (tabella), Argomenti da rinforzare,
            Come cambia il piano. Se manca la chiave di risposta, ricavala solo se la domanda è inequivocabile, altrimenti
            segnala la domanda come dubbia e non conteggiarla. Mai inventare punteggi. In fondo aggiungi un unico blocco ```json
            con {"subject":string,"score_pct":number,"correct":number,"total":number,"weakest_topic":string,"topic_scores":string,"date":"YYYY-MM-DD"}.'
    goalTemplate: 'Materia: {subject}

      Obiettivo: {goal_label}

      Quiz e risposte dello studente:

      {answers}

      Data: {date}. Lingua ISO {lang}.'
    output: markdown+json
    resultSchema:
      type: object
      properties:
        subject:
          type: string
        score_pct:
          type: number
        correct:
          type: number
        total:
          type: number
        weakest_topic:
          type: string
        topic_scores:
          type: string
        date:
          type: string
    writesTo:
      collection: scores
      parse: json_last
    limits:
      maxTurns: 6
      maxBudgetUsd: 0.3
  - key: tutor
    role: helper
    description: Step-by-step tutor chat grounded in the editorial knowledge base.
    profile:
      inline:
        display_name: Passo Avanti tutor
        chat_mode: true
        crews:
        - id: tutor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei il tutor di Passo Avanti Studio. Spiega gli argomenti passo per passo, con esempi e una domanda
            di verifica alla fine di ogni passo. Prima cerca nella base di conoscenza con lessons_search e usa i contenuti
            della redazione citandone il titolo; se non trovi nulla, spiega con le tue conoscenze dicendolo chiaramente. Non
            dare la soluzione di un esercizio subito: guida lo studente. Non inventare dati di bandi o programmi. Se lo studente
            ritiene sbagliata una domanda di quiz, usa flag_question per segnalarla ai docenti. Puoi leggere i punteggi dello
            studente con scores_read per adattare le spiegazioni. Risposte brevi e chiare, nella lingua dello studente. Per
            lezioni dal vivo con insegnanti reali, spiega che si prenotano nel calendario fuori dall''app.'
    goalTemplate: 'Conversazione finora:

      {history}


      Nuovo messaggio dello studente: {message}'
    appTools:
    - name: lessons_search
      description: Search the editorial knowledge base of lessons
      action: search
      collection: lessons
      scope: all
    - name: scores_read
      description: Read the student's own quiz scores
      action: read
      collection: scores
      scope: user
    - name: flag_question
      description: Report a quiz question as wrong, for editorial review
      action: write
      collection: question_flags
      scope: all
    output: markdown
  - key: weekly_coach
    role: scheduled
    description: 'Every week, for one student: new quiz, mock exam and adapted plan based on scores.'
    memory: instance
    profile:
      inline:
        display_name: Passo Avanti weekly coach
        crews:
        - id: coach
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Ogni settimana prepari il lavoro per UNO studente. Leggi i suoi punteggi con scores_read e cerca
            materiale con lessons_search. Inizia con "# Settimana del <data> — <obiettivo>". Sezioni (##): Piano adattato
            della settimana (giorni, argomenti, ore), Quiz della settimana (10 domande a risposta multipla A-D, sugli argomenti
            più deboli), Simulazione d''esame (domande e tempo consigliato in minuti, adatti all''obiettivo), Chiave di risposta
            (sotto un''intestazione ## Chiave di risposta, argomento per ogni domanda). Mai inventare dati di bandi; se la
            data dell''esame è vicina intensifica le simulazioni. Rispetta le ore settimanali. La tua memoria contiene argomenti
            e domande già usate: non ripeterle. Alla fine chiama remember una volta con i 5 punti chiave (argomenti coperti,
            punti deboli).'
    goalTemplate: 'Obiettivo: {goal}. Materia: {subject}. Esame: {exam_date}. Ore a settimana: {hours}. Livello: {level}.
      Oggi {date}. Lingua ISO {lang}.'
    appTools:
    - name: scores_read
      description: Read the student's own quiz scores
      action: read
      collection: scores
      scope: user
    - name: lessons_search
      description: Search the editorial knowledge base of lessons
      action: search
      collection: lessons
      scope: all
    writesTo:
      collection: weekly_work
      parse: whole
    output: markdown
  templates:
  - key: weekly_path
    title:
      it: Percorso settimanale
      en: Weekly path
    description:
      it: 'Ogni lunedì: piano adattato, quiz e simulazione in base ai tuoi punteggi.'
      en: 'Every Monday: adapted plan, quiz and mock exam based on your scores.'
    agent: weekly_coach
    params:
    - name: goal
      type: select
      required: true
      label:
        it: Obiettivo
        en: Goal
      options:
      - value: recupero
        label:
          it: Recupero di una materia
          en: Subject catch-up
      - value: medicina
        label:
          it: Test di Medicina
          en: Medicine entrance test
      - value: concorso_docenti
        label:
          it: Concorso per insegnanti
          en: Teachers' competition
      - value: concorso_enti
        label:
          it: Concorso enti pubblici
          en: Public bodies competition
    - name: subject
      type: text
      label:
        it: Materia / prova
        en: Subject / test
    - name: exam_date
      type: date
      required: true
      label:
        it: Data esame
        en: Exam date
    - name: hours
      type: number
      required: true
      label:
        it: Ore a settimana
        en: Hours per week
    - name: level
      type: select
      required: true
      label:
        it: Livello
        en: Level
      options:
      - base
      - intermedio
      - avanzato
    goal: 'Studente: {instance}. Obiettivo: {goal}. Materia: {subject}. Esame: {exam_date}. Ore a settimana: {hours}. Livello:
      {level}. Oggi {date}. Lingua ISO {lang}.'
    schedule:
      cron: 0 5 * * 1
      userCanChange: false
    maxPerUser: 2
    roles:
    - user
    cost:
      perRun: 15
  inputForm:
    title:
      it: Nuova richiesta
      en: New request
    fields:
    - name: mode
      type: select
      required: true
      label:
        it: Cosa vuoi fare
        en: What to do
      default: plan
      options:
      - value: plan
        label:
          it: Creare un piano di studio
          en: Build a study plan
      - value: grade
        label:
          it: Correggere un quiz o una simulazione
          en: Grade a quiz or mock exam
    - name: goal
      type: select
      required: true
      label:
        it: Obiettivo
        en: Goal
      options:
      - value: recupero
        label:
          it: Recupero di una materia
          en: Subject catch-up
      - value: medicina
        label:
          it: Test di Medicina
          en: Medicine entrance test
      - value: concorso_docenti
        label:
          it: Concorso per insegnanti
          en: Teachers' competition
      - value: concorso_enti
        label:
          it: Concorso enti pubblici
          en: Public bodies competition
    - name: subject
      type: text
      label:
        it: Materia / prova
        en: Subject / test
    - name: exam_date
      type: date
      visibleWhen: mode == 'plan'
      label:
        it: Data dell'esame
        en: Exam date
    - name: hours
      type: number
      visibleWhen: mode == 'plan'
      label:
        it: Ore disponibili a settimana
        en: Hours per week
    - name: level
      type: select
      visibleWhen: mode == 'plan'
      label:
        it: Livello di partenza
        en: Starting level
      options:
      - value: base
        label:
          it: Base
          en: Beginner
      - value: intermedio
        label:
          it: Intermedio
          en: Intermediate
      - value: avanzato
        label:
          it: Avanzato
          en: Advanced
    - name: answers
      type: textarea
      maxLength: 8000
      visibleWhen: mode == 'grade'
      label:
        it: Domande e risposte
        en: Questions and answers
      help:
        it: Incolla le domande con le tue risposte (e la chiave, se l'hai).
        en: Paste the questions with your answers (and the key, if you have it).
  data:
    collections:
    - name: scores
      ownedBy: user
      description: Quiz and mock exam scores per student
      sharing:
      - viewer
      fields:
      - name: date
        type: date
        label: Data
      - name: subject
        type: text
        label: Materia
      - name: score_pct
        type: number
        label: Punteggio %
      - name: correct
        type: number
      - name: total
        type: number
      - name: weakest_topic
        type: text
      - name: topic_scores
        type: text
    - name: weekly_work
      ownedBy: instance
      description: Weekly plan, quiz and mock exam of each path
    - name: guardians
      ownedBy: user
      description: Parents allowed to read a minor student's progress
      fields:
      - name: parent_email
        type: email
        required: true
        label: Email genitore
    - name: lessons
      ownedBy: shared
      searchable: true
      description: Editorial knowledge base of teaching content
      fields:
      - name: title
        type: text
        required: true
      - name: subject
        type: text
      - name: topic
        type: text
      - name: body
        type: textarea
    - name: question_flags
      ownedBy: org
      description: Quiz questions reported as wrong, for editorial review
      fields:
      - name: question
        type: textarea
      - name: reason
        type: textarea
      - name: status
        type: select
        options:
        - open
        - fixed
        - rejected
  views:
  - key: home
    type: page
    title: Passo Avanti Studio
    nav: false
    sections:
    - type: hero
      title:
        it: Un **passo avanti** ogni settimana verso il tuo esame.
        en: One **step forward** every week towards your exam.
      text:
        it: Piano di studio su programmi MIM e bandi MUR e concorsi, tutor in chat, quiz e simulazioni corretti, progressi
          sempre sotto controllo.
        en: Study plan based on MIM programmes and MUR and competition calls, chat tutor, graded quizzes and mock exams, progress
          at a glance.
      actions:
      - label:
          it: Inizia ora
          en: Start now
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Scegli l'obiettivo
          en: Pick your goal
        text:
          it: Data dell'esame, ore a settimana e livello di partenza.
          en: Exam date, weekly hours and starting level.
        badge: 🎯
      - title:
          it: Ricevi il piano
          en: Get your plan
        text:
          it: Un piano settimanale basato su programmi e bandi ufficiali.
          en: A weekly plan based on official programmes and calls.
        badge: 🗓️
      - title:
          it: Studia col tutor
          en: Study with the tutor
        text:
          it: Spiegazioni passo per passo dai contenuti della redazione.
          en: Step-by-step explanations from editorial content.
        badge: 💬
      - title:
          it: Quiz e progressi
          en: Quizzes and progress
        text:
          it: Ogni settimana quiz e simulazioni, correzione e piano riadattato.
          en: Weekly quizzes and mock exams, grading and a re-adapted plan.
        badge: 📈
    - type: cards
      id: obiettivi
      title:
        it: Obiettivi
        en: Goals
      items:
      - title:
          it: Recupero di una materia
          en: Subject catch-up
        text:
          it: Per le superiori.
          en: For high school.
      - title:
          it: Test di Medicina
          en: Medicine test
        text:
          it: Test d'ingresso universitari.
          en: University entrance tests.
      - title:
          it: Concorsi
          en: Competitions
        text:
          it: Insegnanti ed enti pubblici.
          en: Teachers and public bodies.
      - title:
          it: Lezioni dal vivo
          en: Live lessons
        text:
          it: Con insegnanti reali, da prenotare in calendario (fuori dall'app per ora).
          en: With real teachers, booked in a calendar (outside the app for now).
    - type: note
      content:
        it: 'Strumento di supporto allo studio: nessuna garanzia di risultato. Verifica sempre date e requisiti sui bandi
          ufficiali.'
        en: 'Study support tool: no guarantee of results. Always check dates and requirements in the official calls.'
  - key: new
    type: new_run
    title:
      it: Nuova richiesta
      en: New request
    roles:
    - user
    - admin
  - key: history
    type: history
    title:
      it: I miei piani e correzioni
      en: My plans and gradings
    source: run
    roles:
    - user
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: tutor_chat
    type: chat
    title: Tutor
    source: agent:tutor
    examples:
    - Spiegami le equazioni di secondo grado passo per passo
    - Come si risolve un quesito di logica del test di Medicina?
    placeholder:
      it: Chiedi al tutor...
      en: Ask the tutor...
    roles:
    - user
    - admin
  - key: paths
    type: instances
    template: weekly_path
    title:
      it: Percorso settimanale
      en: Weekly path
    roles:
    - user
    - admin
  - key: progress
    type: page
    title:
      it: I miei progressi
      en: My progress
    roles:
    - user
    - parent
    - admin
    sections:
    - type: data
      title:
        it: Punteggi nel tempo
        en: Scores over time
      source: collection:scores
      display: chart
      chart: line
      fields:
      - key: date
        label: Data
      - key: score_pct
        label: '%'
      sort:
        field: date
        dir: asc
      limit: 60
      empty:
        it: Nessun quiz ancora corretto.
        en: No graded quiz yet.
    - type: data
      source: collection:scores
      display: kpi
      kpis:
      - label:
          it: Quiz svolti
          en: Quizzes done
        agg: count
      - label:
          it: Media %
          en: Average %
        agg: avg
        field: score_pct
        format: number
      - label:
          it: Ultimo %
          en: Latest %
        agg: last
        field: score_pct
        format: number
    - type: data
      title:
        it: Dettaglio
        en: Details
      source: collection:scores
      display: table
      fields:
      - key: date
        label: Data
        format: date
      - key: subject
        label: Materia
      - key: score_pct
        label: '%'
        format: number
      - key: weakest_topic
        label: Da rinforzare
      sort:
        field: date
        dir: desc
      limit: 50
  - key: guardians_view
    type: table
    title:
      it: Accesso genitori
      en: Parent access
    source: collection:guardians
    roles:
    - user
  - key: flagged
    type: table
    title:
      it: Domande segnalate
      en: Flagged questions
    source: collection:question_flags
    roles:
    - editor
    - admin
  - key: kb
    type: table
    title:
      it: Base di conoscenza
      en: Knowledge base
    source: collection:lessons
    roles:
    - editor
    - admin
  - key: account
    type: account
    title:
      it: Crediti e abbonamento
      en: Credits and plan
    roles:
    - user
  billing:
    modes:
    - credits
    - subscription
    currency: eur
    signupCredits: 30
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:planner:
        estimate: 40
        metered: true
      agent:grader:
        estimate: 10
        metered: true
      agent:tutor:
        estimate: 10
        metered: true
    packs:
    - key: small
      credits: 500
      price: 9
      label: Starter
    - key: large
      credits: 2000
      price: 29
      label: Plus
    plans:
    - key: monthly
      price: 19
      interval: month
      credits: 1000
      creditsReset: monthly
      label:
        it: Abbonamento mensile
        en: Monthly plan
      roles:
      - user
  extensions:
  - key: live_lessons
    description: Live lessons with real teachers and calendar booking are not in the app yet; handled outside it.
  - key: parent_access
    description: Read-only parent access relies on per-record viewer sharing and the guardians collection; a dedicated invitation
      flow and age check for minors are not available yet.
  - key: timed_mock_exam
    description: Mock exams state a recommended time but the app has no countdown timer or interactive quiz answering; answers
      are pasted into the grading form.
  - key: editorial_upload
    description: Editors add lessons as text records; uploading files (PDF, slides) is not available yet.
  - key: notifications
    description: No email reminders for weekly quizzes or exam dates yet.
