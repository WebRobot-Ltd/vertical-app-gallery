apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: passo-avanti-studio
  displayName: Passo Avanti Studio
  tagline: 'Dal piano di studio all''esame: tutor AI, quiz e progressi, passo dopo passo.'
  description: Preparazione per studenti delle superiori, test d'ingresso universitari e concorsi pubblici, con piano settimanale,
    tutor in chat, quiz e dashboard dei progressi.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f3a5f'
      accent: '#e07a2f'
      background: '#f7f8fb'
      foreground: '#16202e'
    fonts:
      body: Inter
      display: Poppins
    wordmark:
    - text: 'Passo Avanti '
      color: primary
    - text: Studio
      color: accent
  header:
    links:
    - label: Come funziona
      href: '#come-funziona'
    - label: Per i genitori
      href: '#genitori'
    cta:
      label: Inizia
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      label: Studente
      assignedBy: signup
    - key: teacher
      label: Docente della redazione
      assignedBy: invite
    - key: parent
      label: Genitore
      assignedBy: derived
      from: collection:profiles.parent_email
  limits:
  - action: chat
    per: user
    max: 200
    window: day
    roles:
    - user
  - action: agent:planner
    per: user
    max: 5
    window: day
    roles:
    - user
  agents:
  - key: planner
    role: main
    description: Costruisce il piano di studio settimanale dal profilo dello studente, sui programmi MIM e sui bandi MUR/concorsi.
    profile:
      inline:
        display_name: Pianificatore di studio
        crews:
        - id: planner
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'Sei un pianificatore di studio per studenti italiani. Costruisci un piano settimanale realistico
            basandoti sulle Indicazioni nazionali e sui programmi del MIM (superiori), sui bandi e sulle prove del MUR (test
            d''ingresso) o sui bandi dei concorsi (insegnanti, enti pubblici). Se serve verificare un programma o un bando,
            consultalo sul sito ufficiale con il tuo strumento web; cita la fonte e non inventare date, posti o argomenti:
            se un dato non è verificabile dillo. Usa kb_search per agganciare ogni argomento ai contenuti della redazione
            e scores_read per partire dai punteggi già registrati. Rispetta le ore settimanali indicate e il tempo fino all''esame.
            Struttura del report: titolo di primo livello ''# Piano di studio — <obiettivo>, settimana del <data>''; ## Punto
            di partenza; ## Calendario della settimana (tabella giorno, argomento, ore, attività); ## Obiettivi misurabili;
            ## Prossime settimane (sintesi fino all''esame); ## Fonti. Alla fine salva il piano con plan_write (week_start,
            goal, plan in Markdown, parent_email dal profilo se presente). Non dare garanzie di superamento dell''esame. Tono
            incoraggiante e chiaro, adatto a uno studente.'
    goalTemplate: 'Obiettivo: {goal}.

      {?subject}Materia o ambito: {subject}.{/subject}

      Data dell''esame: {exam_date}. Ore disponibili a settimana: {hours_per_week}. Livello di partenza: {level}.

      {?parent_email}Email del genitore (da riportare nel piano salvato): {parent_email}{/parent_email}

      {?week_note}Note dello studente per questa settimana: {week_note}{/week_note}

      Oggi è {date}. Scrivi il piano nella lingua con codice ISO {lang}.'
    context:
    - key: goal
      from: collection:profiles.goal
    - key: subject
      from: collection:profiles.subject
    - key: exam_date
      from: collection:profiles.exam_date
    - key: hours_per_week
      from: collection:profiles.hours_per_week
    - key: level
      from: collection:profiles.level
    - key: parent_email
      from: collection:profiles.parent_email
    appTools:
    - name: kb_search
      description: Cerca nella base di conoscenza didattica della redazione
      action: search
      collection: lessons_kb
      scope: all
    - name: scores_read
      description: Legge i punteggi per argomento dello studente
      action: read
      collection: scores
      scope: user
    - name: plan_write
      description: Salva il piano di studio della settimana
      action: write
      collection: study_plans
      scope: user
    output: markdown
    limits:
      maxTurns: 25
      maxBudgetUsd: 0.8
  - key: tutor
    role: helper
    description: 'Tutor in chat: spiega passo per passo, fa quiz e registra i punteggi.'
    profile:
      inline:
        display_name: Tutor Passo Avanti
        crews:
        - id: tutor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: Sei un tutor paziente per studenti delle superiori, test d'ingresso e concorsi pubblici. Spiega gli
            argomenti passo per passo, con esempi e piccole domande di verifica, e adatta il livello alle risposte. Per prima
            cosa cerca con kb_search i contenuti della redazione e basa la spiegazione su quelli; se non trovi nulla dillo
            e spiega con la tua conoscenza generale, senza inventare norme, formule o date. Se lo studente chiede un quiz,
            usa quizzes_read per le domande preparate, oppure creane di nuove a risposta multipla (4 opzioni, una corretta),
            proponile una alla volta, correggi con spiegazione e a fine serie registra il risultato con scores_write (topic,
            subject, score da 0 a 100, kind quiz, date, parent_email dal profilo se presente). Per una simulazione d'esame
            ricorda allo studente il tempo massimo e di cronometrarsi da sé. Se lo studente pensa che una domanda sia sbagliata,
            usa report_question per segnalarla ai docenti. Non fare i compiti al posto dello studente quando si tratta di
            verifiche valutate. Sii breve e incoraggiante.
    goalTemplate: 'Obiettivo dello studente: {goal}, esame il {exam_date}, livello {level}. Email genitore: {parent_email}.

      Conversazione finora:

      {history}

      Nuovo messaggio dello studente: {message}

      Rispondi nella lingua con codice ISO {lang}.'
    context:
    - key: goal
      from: collection:profiles.goal
    - key: exam_date
      from: collection:profiles.exam_date
    - key: level
      from: collection:profiles.level
    - key: parent_email
      from: collection:profiles.parent_email
    appTools:
    - name: kb_search
      description: Cerca nella base di conoscenza didattica della redazione
      action: search
      collection: lessons_kb
      scope: all
    - name: quizzes_read
      description: Legge i quiz preparati per lo studente
      action: read
      collection: quizzes
      scope: user
    - name: scores_read
      description: Legge i punteggi per argomento dello studente
      action: read
      collection: scores
      scope: user
    - name: scores_write
      description: Registra il punteggio di un quiz o di una simulazione
      action: write
      collection: scores
      scope: user
    - name: report_question
      description: Segnala una domanda sbagliata ai docenti
      action: append
      collection: reported_questions
      scope: user
    output: markdown
    limits:
      maxTurns: 10
      maxBudgetUsd: 0.4
  - key: coach
    role: scheduled
    description: Ogni settimana genera quiz, legge i punteggi e riadatta il piano di studio.
    memory: instance
    profile:
      inline:
        display_name: Coach settimanale
        crews:
        - id: coach
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei il coach settimanale di uno studente. Leggi i punteggi con scores_read e il piano precedente
            con plans_read: individua gli argomenti deboli e quelli solidi. Crea 10 quiz a risposta multipla basati sui contenuti
            trovati con kb_search, pesati sugli argomenti deboli, e salvali uno per uno con quiz_write (topic, subject, question,
            options come elenco A-D, correct, explanation, week). Poi scrivi il piano riadattato per la settimana e salvalo
            con plan_write (week_start, goal, plan, parent_email). Nel report: titolo ''# Settimana del <data> — rivista del
            piano''; ## Cosa è andato bene; ## Da rinforzare; ## Piano della settimana; ## Quiz pronti (chiedi al tutor di
            farli). Non inventare punteggi: se non ci sono dati, dillo e parti dal livello dichiarato. Usa la memoria per
            ricordare cosa avevi proposto.'
    goalTemplate: 'Revisione settimanale. Obiettivo: {goal}, esame il {exam_date}, ore a settimana {hours_per_week}, livello
      {level}. Email genitore: {parent_email}.

      {?focus}Richiesta dello studente: {focus}{/focus}

      Oggi è {date}. Scrivi nella lingua con codice ISO {lang}.'
    context:
    - key: goal
      from: collection:profiles.goal
    - key: exam_date
      from: collection:profiles.exam_date
    - key: hours_per_week
      from: collection:profiles.hours_per_week
    - key: level
      from: collection:profiles.level
    - key: parent_email
      from: collection:profiles.parent_email
    appTools:
    - name: kb_search
      description: Cerca nella base di conoscenza didattica della redazione
      action: search
      collection: lessons_kb
      scope: all
    - name: scores_read
      description: Legge i punteggi per argomento dello studente
      action: read
      collection: scores
      scope: user
    - name: plans_read
      description: Legge i piani di studio precedenti
      action: read
      collection: study_plans
      scope: user
    - name: quiz_write
      description: Salva una domanda di quiz per lo studente
      action: write
      collection: quizzes
      scope: user
    - name: plan_write
      description: Salva il piano di studio della settimana
      action: write
      collection: study_plans
      scope: user
    output: markdown
    limits:
      maxTurns: 15
      maxBudgetUsd: 0.6
  templates:
  - key: weekly_review
    title: Revisione settimanale
    description: 'Ogni lunedì: nuovi quiz, analisi dei punteggi e piano riadattato.'
    agent: coach
    params:
    - name: focus
      type: textarea
      maxLength: 300
      label: Su cosa vuoi concentrarti (facoltativo)
    schedule:
      cron: 0 6 * * 1
      userCanChange: true
    maxPerUser: 1
    roles:
    - user
    cost:
      perRun: 10
    deliver:
      to: owner
      onlyIfNew: true
  inputForm:
    title: Nuovo piano di studio
    fields:
    - name: week_note
      type: textarea
      maxLength: 400
      label: Note per questa settimana (facoltative)
      help: Es. verifica lunedì, settimana con meno ore
  data:
    collections:
    - name: profiles
      ownedBy: user
      description: Obiettivo, data d'esame, ore e livello dello studente
      fields:
      - name: goal
        type: select
        required: true
        label: Obiettivo
        options:
        - value: recupero materia
          label: Recupero di una materia
        - value: test di medicina
          label: Test di medicina
        - value: concorso insegnanti
          label: Concorso per insegnanti
        - value: concorso enti pubblici
          label: Concorso per enti pubblici
      - name: subject
        type: text
        label: Materia o ambito (facoltativo)
      - name: exam_date
        type: date
        required: true
        label: Data dell'esame
      - name: hours_per_week
        type: number
        required: true
        label: Ore disponibili a settimana
      - name: level
        type: select
        required: true
        label: Livello di partenza
        options:
        - value: base
          label: Base
        - value: intermedio
          label: Intermedio
        - value: avanzato
          label: Avanzato
      - name: minor
        type: boolean
        label: Sono minorenne
      - name: parent_email
        type: email
        label: Email del genitore (accesso in sola lettura)
    - name: study_plans
      ownedBy: user
      description: Piani di studio settimanali
      fields:
      - name: week_start
        type: date
        label: Settimana dal
      - name: goal
        type: text
        label: Obiettivo
      - name: plan
        type: textarea
        label: Piano
      - name: parent_email
        type: email
      access:
      - role: parent
        where:
          parent_email: '{user.email}'
        can:
        - read
    - name: quizzes
      ownedBy: user
      description: Domande a risposta multipla preparate per lo studente
      fields:
      - name: topic
        type: text
        label: Argomento
      - name: subject
        type: text
        label: Materia
      - name: question
        type: textarea
        label: Domanda
      - name: options
        type: textarea
        label: Opzioni
      - name: correct
        type: text
        label: Risposta corretta
      - name: explanation
        type: textarea
        label: Spiegazione
      - name: week
        type: date
        label: Settimana
      retentionDays: 365
    - name: scores
      ownedBy: user
      description: Punteggi per argomento di quiz e simulazioni
      fields:
      - name: topic
        type: text
        label: Argomento
      - name: subject
        type: text
        label: Materia
      - name: score
        type: number
        label: Punteggio (0-100)
      - name: kind
        type: select
        label: Tipo
        options:
        - value: quiz
          label: Quiz
        - value: simulation
          label: Simulazione
      - name: date
        type: date
        label: Data
      - name: parent_email
        type: email
      access:
      - role: parent
        where:
          parent_email: '{user.email}'
        can:
        - read
    - name: lessons_kb
      ownedBy: shared
      searchable: true
      description: Contenuti didattici caricati dalla redazione
      fields:
      - name: title
        type: text
        required: true
        label: Titolo
      - name: subject
        type: text
        required: true
        label: Materia
      - name: topic
        type: text
        label: Argomento
      - name: audience
        type: select
        label: Percorso
        options:
        - superiori
        - medicina
        - concorso insegnanti
        - concorso enti pubblici
      - name: content
        type: textarea
        required: true
        label: Contenuto
      - name: source
        type: text
        label: Fonte
      access:
      - role: teacher
        can:
        - read
        - write
    - name: reported_questions
      ownedBy: org
      description: Domande segnalate come sbagliate, da rivedere
      fields:
      - name: question
        type: textarea
        required: true
        label: Domanda
      - name: reason
        type: textarea
        required: true
        label: Perché è sbagliata
      - name: status
        type: select
        label: Stato
        options:
        - aperta
        - corretta
        - respinta
        default: aperta
      - name: reviewer_note
        type: textarea
        label: Nota del docente
      access:
      - role: teacher
        can:
        - read
        - write
      retentionDays: 730
  views:
  - key: home
    type: page
    nav: false
    title: Passo Avanti Studio
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow: Superiori · Test d'ingresso · Concorsi
      title: Arriva all'esame **preparato**, un passo alla volta.
      text: Un piano di studio settimanale su misura, un tutor AI che ti spiega ogni argomento, quiz e simulazioni che si
        adattano ai tuoi punteggi.
      actions:
      - label: Crea il tuo piano
        href: /login
        style: primary
      - label: Come funziona
        href: '#come-funziona'
        style: ghost
    - type: steps
      id: come-funziona
      title: Come funziona
      items:
      - title: Scegli l'obiettivo
        text: 'Recupero, test di medicina, concorsi: indica data d''esame, ore e livello.'
        badge: 🎯
      - title: Ricevi il piano
        text: Basato sui programmi MIM e sui bandi MUR e dei concorsi.
        badge: 🗓️
      - title: Studia con il tutor
        text: Spiegazioni passo per passo dai contenuti della redazione.
        badge: 💬
      - title: Quiz e riadattamento
        text: Ogni settimana nuovi quiz; il piano si adatta ai tuoi punti deboli.
        badge: 📈
    - type: cards
      id: genitori
      title: Per genitori e docenti
      items:
      - title: Accesso per i genitori
        text: I genitori di studenti minorenni vedono piani e progressi in sola lettura.
      - title: Redazione
        text: I docenti caricano i contenuti e rivedono le domande segnalate.
      - title: Lezioni dal vivo
        text: Le lezioni con insegnanti reali fanno parte dell'offerta e si prenotano con la segreteria.
    - type: note
      content: 'Strumento di supporto allo studio: non garantisce il superamento di esami o concorsi.'
  - key: profile
    type: form
    title: Il mio obiettivo
    collection: profiles
    edit: false
    submit:
      label: Salva e crea il piano
      message: Profilo salvato.
      redirect: new_plan
    roles:
    - user
  - key: new_plan
    type: new_run
    title: Nuovo piano
    roles:
    - user
    - admin
  - key: plans
    type: history
    title: I miei piani
    source: run
    roles:
    - user
    - admin
  - key: plan
    type: report
    source: run
    printable: true
    nav: false
  - key: tutor_chat
    type: chat
    title: Tutor
    source: agent:tutor
    placeholder: Chiedi al tutor un argomento o un quiz…
    examples:
    - Spiegami le equazioni di secondo grado
    - Fammi un quiz di biologia
    - Simulazione di logica da 20 domande
    roles:
    - user
    - admin
  - key: progress
    type: page
    title: I miei progressi
    roles:
    - user
    - admin
    sections:
    - type: data
      title: Punteggio medio per argomento
      source: collection:scores
      display: chart
      chart: bar
      fields:
      - key: topic
        label: Argomento
      - key: avg_score
        label: Media
      groupBy:
        field: topic
        aggs:
        - key: avg_score
          agg: avg
          field: score
    - type: data
      title: Andamento
      source: collection:scores
      display: chart
      chart: line
      fields:
      - key: date
        label: Mese
      - key: avg_score
        label: Media
      groupBy:
        field: date
        bucket: month
        aggs:
        - key: avg_score
          agg: avg
          field: score
    - type: data
      title: Ultimi risultati
      source: collection:scores
      display: table
      fields:
      - key: date
        label: Data
        format: date
      - key: topic
        label: Argomento
      - key: kind
        label: Tipo
        format: badge
      - key: score
        label: Punteggio
        format: number
      sort:
        field: date
        dir: desc
      limit: 30
      empty: 'Ancora nessun punteggio: fai un quiz con il tutor.'
  - key: weekly
    type: instances
    template: weekly_review
    title: Revisione settimanale
    roles:
    - user
  - key: family
    type: page
    title: Area genitori
    roles:
    - parent
    sections:
    - type: data
      title: Progressi dello studente
      source: collection:scores
      display: table
      fields:
      - key: date
        label: Data
        format: date
      - key: topic
        label: Argomento
      - key: score
        label: Punteggio
        format: number
      sort:
        field: date
        dir: desc
      limit: 50
    - type: data
      title: Piani di studio
      source: collection:study_plans
      display: list
      fields:
      - key: week_start
        label: Settimana
        format: date
      - key: goal
        label: Obiettivo
      - key: plan
        label: Piano
      sort:
        field: week_start
        dir: desc
      limit: 8
  - key: report_form
    type: form
    title: Segnala una domanda
    collection: reported_questions
    fields:
    - question
    - reason
    submit:
      label: Invia ai docenti
      message: Grazie, la redazione la rivedrà.
    roles:
    - user
  - key: review
    type: table
    title: Domande segnalate
    source: collection:reported_questions
    columns:
    - question
    - reason
    - status
    - reviewer_note
    export: true
    roles:
    - teacher
    - admin
  - key: review_edit
    type: form
    title: Rivedi una domanda
    collection: reported_questions
    fields:
    - status
    - reviewer_note
    edit: true
    submit:
      label: Salva revisione
      redirect: review
    roles:
    - teacher
    - admin
    nav: false
  - key: kb_add
    type: form
    title: Aggiungi contenuto didattico
    collection: lessons_kb
    edit: true
    submit:
      label: Pubblica
      message: Contenuto salvato.
    roles:
    - teacher
    - admin
  - key: kb_list
    type: table
    title: Base di conoscenza
    source: collection:lessons_kb
    columns:
    - title
    - subject
    - topic
    - audience
    roles:
    - teacher
    - admin
    - user
  - key: account
    type: account
    title: Crediti e abbonamento
    roles:
    - user
  triggers:
  - key: question_reported
    'on':
      collection: reported_questions
      op: insert
    notify:
      to:
      - role:teacher
      subject: Nuova domanda segnalata
      body: Uno studente ha segnalato una domanda come sbagliata. Apri la revisione per controllarla.
      link: review
  billing:
    modes:
    - credits
    - subscription
    signupCredits: 30
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:planner:
        estimate: 10
        metered: true
      agent:tutor:
        estimate: 5
        metered: true
    packs:
    - key: ore_tutor_20
      credits: 200
      price: 9
      label: Pacchetto 20 ore tutor
    - key: ore_tutor_100
      credits: 1000
      price: 39
      label: Pacchetto 100 ore tutor
    plans:
    - key: studio
      price: 19
      interval: month
      label: Abbonamento Studio
      credits: 500
      creditsReset: monthly
      includes:
      - Crediti tutor mensili
      - Revisione settimanale automatica
  notifications:
    emailOnRunDone: true
  extensions:
  - key: live_lessons_booking
    description: Le lezioni dal vivo con insegnanti reali vanno prenotate in calendario ma per ora restano fuori dall'app;
      si può aggiungere in seguito una vista di tipo booking con i docenti come risorse.
  - key: timed_exam_simulation
    description: 'Il cronometro delle simulazioni d''esame non è disponibile: il tutor ricorda il tempo massimo e lo studente
      si cronometra da sé.'
  - key: minor_parent_consent
