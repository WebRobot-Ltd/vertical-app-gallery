apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: catalogo-brillante
  displayName: CatalogoBrillante
  tagline:
    it: Cataloghi prodotto più completi e più vendibili.
    en: More complete, more sellable product catalogs.
  description:
    it: 'Carica il feed prodotti: un agente trova i problemi, propone titoli, descrizioni, categorie e attributi migliori.
      Tu approvi e riesporti il feed corretto.'
    en: 'Upload your product feed: an agent finds the issues and proposes better titles, descriptions, categories and attributes.
      You approve and re-export the corrected feed.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f2a44'
      accent: '#e0a526'
      background: '#fbfaf6'
      foreground: '#1b1f24'
    fonts:
      body: Inter
      display: Poppins
    wordmark:
    - text: Catalogo
      color: primary
    - text: Brillante
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#how'
    cta:
      label:
        it: Inizia
        en: Start
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  limits:
  - action: agent:optimizer
    per: user
    max: 10
    window: day
    roles:
    - user
  agents:
  - key: optimizer
    role: main
    description: Analyzes the uploaded feed, proposes improvements and saves them as products awaiting approval. Originals
      are never overwritten.
    awaits:
    - approve_all
    profile:
      inline:
        display_name: CatalogoBrillante optimizer
        crews:
        - id: optimizer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are an e-commerce catalog optimization expert. You receive the text of a product feed (CSV/Excel)
            with titles, descriptions, categories, attributes and image URLs. For EACH product: detect issues (description
            too short or duplicated, missing attributes, wrong category, unclear title) and propose a better title, a search-optimized
            description, the correct category and missing attributes deduced ONLY from existing data (never invent specs,
            sizes, materials, certifications or claims; if unsure leave blank and flag it). Keep the original text in the
            original_* fields and never alter it. Save every product with the tool save_product (fields: sku, catalog, original_title,
            original_description, original_category, original_attributes, new_title, new_description, new_category, new_attributes,
            issues, status=''proposed''). If the feed is a photo or scan, use read_upload with the file id. Write titles and
            descriptions in the language of the feed (or the language requested). After saving all products, call request_approve_all
            once. Final report: start with a level-1 ''# '' title ''Catalog optimization — <catalog name>'', then ## Summary
            (counts of issues by type), ## Highlights (5 examples before/after in a table), ## Next steps (review the table,
            approve, export). No invented figures.'
    goalTemplate: 'Catalog name: {catalog_name}

      {?feed_url}Connected feed URL (only mention, use file text): {feed_url}{/feed_url}

      Feed text:

      {feed_text}

      {?focus}Focus: {focus_label}{/focus}

      Store language: {store_lang_label}. Report language ISO: {lang}. Today is {date}.'
    appTools:
    - name: read_upload
      description: Read a file the user uploaded (images, scans)
      action: read_file
    - name: save_product
      description: Save a product with original and proposed content
      action: write
      collection: products
      scope: user
    output: markdown
    limits:
      maxTurns: 40
      maxBudgetUsd: 1.5
  - key: exporter
    role: helper
    description: After approval, marks proposed products approved and produces the corrected feed as CSV.
    profile:
      inline:
        display_name: CatalogoBrillante exporter
        crews:
        - id: exporter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 20
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You prepare the corrected feed. Read the user''s products with list_products. For products with
            status ''proposed'' or ''approved'' (not ''rejected''), set status to ''approved'' using save_product. Then output
            the final feed: start with ''# Corrected feed — <catalog>'', then a fenced csv block with columns sku,title,description,category,attributes:
            use new_* values for approved products and original_* values for rejected ones. Never invent content.'
    goalTemplate: Prepare the corrected feed of all my products. Today is {date}. Language ISO {lang}.
    appTools:
    - name: list_products
      description: Read the user's products
      action: read
      collection: products
      scope: user
    - name: save_product
      description: Save a product with original and proposed content
      action: write
      collection: products
      scope: user
    output: markdown
  - key: watcher
    role: helper
    description: Periodically rechecks a connected feed for new products.
    memory: instance
    writesTo:
      collection: new_findings
    profile:
      inline:
        display_name: CatalogoBrillante watcher
        crews:
        - id: watcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 1
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You recheck a store''s product feed. Fetch the feed URL through the WebRobot MCP. Your memory holds
            the SKUs seen last time: identify only NEW products and check each for issues (short or duplicate description,
            missing attributes, wrong category, unclear title) and suggest improved title/description without inventing specs.
            Start with ''# <Feed> — new products <date>'', then ## New products (table: sku, issue, suggested title), ## Suggestions.
            If none are new, say so. At the end call remember once with the list of all SKUs seen.'
  inputForm:
    title:
      it: Nuovo catalogo da ottimizzare
      en: New catalog to optimize
    fields:
    - name: catalog_name
      type: text
      required: true
      label:
        it: Nome catalogo
        en: Catalog name
    - name: feed
      type: file
      accept:
      - csv
      - xlsx
      - txt
      - json
      - xml
      maxMb: 15
      label:
        it: Feed prodotti (CSV o Excel)
        en: Product feed (CSV or Excel)
    - name: feed_url
      type: url
      label:
        it: Oppure URL del feed
        en: Or feed URL
    - name: store_lang
      type: select
      required: true
      label:
        it: Lingua dei contenuti
        en: Content language
      options:
      - value: it
        label: Italiano
      - value: en
        label: English
    - name: focus
      type: select
      label:
        it: Priorità
        en: Priority
      options:
      - value: all
        label:
          it: Tutto
          en: Everything
      - value: descriptions
        label:
          it: Descrizioni
          en: Descriptions
      - value: categories
        label:
          it: Categorie
          en: Categories
      - value: attributes
        label:
          it: Attributi
          en: Attributes
  data:
    collections:
    - name: products
      ownedBy: user
      description: Products with original and proposed content
      fields:
      - name: sku
        type: text
        required: true
      - name: catalog
        type: text
      - name: original_title
        type: text
      - name: original_description
        type: textarea
      - name: original_category
        type: text
      - name: original_attributes
        type: textarea
      - name: new_title
        type: text
      - name: new_description
        type: textarea
      - name: new_category
        type: text
      - name: new_attributes
        type: textarea
      - name: issues
        type: textarea
      - name: status
        type: select
        options:
        - proposed
        - approved
        - rejected
        default: proposed
    - name: new_findings
      ownedBy: instance
      description: Weekly findings on new products of a connected feed
  templates:
  - key: feed_watch
    title:
      it: Controllo nuovi prodotti
      en: New products check
    description:
      it: Ogni settimana ricontrolla il tuo feed e segnala i nuovi prodotti da migliorare.
      en: Every week rechecks your feed and flags new products to improve.
    agent: watcher
    params:
    - name: feed_url
      type: url
      required: true
      label:
        it: URL del feed
        en: Feed URL
    goal: 'Watch "{instance}": feed {feed_url}. Today is {date}. Write in the language with ISO code {lang}.'
    schedule:
      cron: 0 6 * * 1
      userCanChange: true
    maxPerUser: 5
    cost:
      perRun: 15
  approvals:
  - key: approve_all
    title:
      it: Approva le modifiche proposte
      en: Approve proposed changes
    decidedBy: requester
    fields:
    - catalog
  triggers:
  - key: on_approved
    'on':
      approval: approve_all
      decision: approved
    start:
      agent: exporter
    goal: Prepare the corrected feed now.
  views:
  - key: home
    type: page
    nav: false
    sections:
    - type: hero
      title:
        it: Schede prodotto **complete** e pronte a vendere
        en: '**Complete** product pages ready to sell'
      text:
        it: Carica il feed, l'agente trova i problemi e propone titoli, descrizioni, categorie e attributi migliori. Tu approvi,
          poi riesporti.
        en: Upload your feed, the agent finds issues and proposes better titles, descriptions, categories and attributes.
          You approve, then re-export.
      actions:
      - label:
          it: Ottimizza il catalogo
          en: Optimize your catalog
        href: /login
        style: primary
    - type: steps
      id: how
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Carica
          en: Upload
        text:
          it: CSV, Excel o feed collegato.
          en: CSV, Excel or connected feed.
        badge: 📤
      - title:
          it: Rivedi
          en: Review
        text:
          it: Tabella prima/dopo, originali sempre conservati.
          en: Before/after table, originals always kept.
        badge: 🔍
      - title:
          it: Approva ed esporta
          en: Approve and export
        text:
          it: Feed corretto pronto per store e marketplace.
          en: Corrected feed ready for your store and marketplaces.
        badge: ✅
    - type: note
      content:
        it: Ogni negozio vede solo i propri cataloghi. Gli attributi sono dedotti solo dai dati esistenti.
        en: Each shop sees only its own catalogs. Attributes are deduced only from existing data.
  - key: new
    type: new_run
    title:
      it: Nuova ottimizzazione
      en: New optimization
    roles:
    - user
    - admin
  - key: runs
    type: history
    title:
      it: Le mie ottimizzazioni
      en: My optimizations
    source: run
    roles:
    - user
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: products_table
    type: table
    title:
      it: Prima e dopo
      en: Before and after
    source: collection:products
    columns:
    - sku
    - original_title
    - new_title
    - original_description
    - new_description
    - original_category
    - new_category
    - issues
    - status
    export: true
    roles:
    - user
    - admin
  - key: review
    type: form
    title:
      it: Modifica/approva prodotto
      en: Edit/approve product
    collection: products
    fields:
    - new_title
    - new_description
    - new_category
    - new_attributes
    - status
    edit: true
    submit:
      label:
        it: Salva
        en: Save
      redirect: products_table
    nav: false
    roles:
    - user
    - admin
  - key: approvals
    type: approvals
    title:
      it: Approvazioni
      en: Approvals
    approvals:
    - approve_all
    roles:
    - user
    - admin
  - key: watches
    type: instances
    template: feed_watch
    title:
      it: Controllo nuovi prodotti
      en: New products watch
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Crediti e piano
      en: Credits and plan
    roles:
    - user
  billing:
    modes:
    - credits
    - subscription
    signupCredits: 100
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:optimizer:
        estimate: 50
        metered: true
      agent:exporter: 5
    packs:
    - key: small
      credits: 1000
      price: 12
      label: Small
    - key: large
      credits: 6000
      price: 60
      label: Large
    plans:
    - key: pro
      price: 49
      interval: month
      credits: 5000
      creditsReset: monthly
      label:
        it: Pro mensile
        en: Pro monthly
  notifications:
    emailOnRunDone: true
