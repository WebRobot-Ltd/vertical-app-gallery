apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: agrosensori
  displayName: AgroSensori
  tagline:
    it: Lo stato delle tue piante, letto dai sensori e anticipato dal meteo.
    en: Your plants' health, read from sensors and anticipated by the weather.
  description:
    it: 'Cruscotto software per il monitoraggio delle piante: dati dalle centraline via webhook, analisi AI di stress idrico
      e anomalie, incrocio con Open-Meteo, semaforo per campo, alert email e report settimanale.'
    en: 'Software dashboard for plant monitoring: station data via webhook, AI analysis of water stress and anomalies, Open-Meteo
      forecasts, a traffic light per field, email alerts and a weekly report.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: dashboard
  branding:
    theme: light
    palette:
      primary: '#1f4d2b'
      accent: '#6a9f2f'
      background: '#f6f8f2'
      foreground: '#18241b'
    fonts:
      body: Inter
      display: Fraunces
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
    - key: consultant
      label:
        it: Consulente
        en: Consultant
      assignedBy: derived
      from: collection:fields.consultant_email
  limits:
  - action: create:stations
    max: 3
    window: total
    plans:
      s10: 10
      s50: 50
      s200: -1
  agents:
  - key: analyst
    role: main
    description: Analyses sensor series with the weather forecast and writes the status of a field.
    memory: instance
    writesTo:
      collection: assessments
      parse: json_last
    output: markdown+json
    resultSchema:
      type: object
      properties:
        field_name:
          type: string
        status:
          type: string
          enum:
          - green
          - yellow
          - red
        summary:
          type: string
        advice:
          type: string
    profile:
      inline:
        display_name: AgroSensori analyst
        crews:
        - id: analyst
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are an agronomy analyst. For the given field, read its stations (read_stations), their latest
            readings (read_readings: soil_moisture, water_stress, temperature, humidity) and the field coordinates and crop
            (read_fields). Call weather_forecast with query latitude, longitude, daily=precipitation_sum,temperature_2m_max,et0_fao_evapotranspiration&forecast_days=5&timezone=auto.
            Detect water stress, abnormal drops and out-of-threshold values (station thresholds), and cross them with the
            forecast to anticipate problems. Write a short report in the requested language that starts with a level-1 title
            ''# <Field> - stato piante'' and has sections Stato, Anomalie, Previsioni meteo, Consiglio (irrigation or intervention).
            Never invent figures; say when data are missing. Finish with ONE final JSON object on its own: {"field_name":...,"status":"green|yellow|red","summary":"2
            sentences","advice":"1-2 sentences"}. Add a ```chart block when comparing series.'
    appTools:
    - name: read_readings
      description: Sensor readings of the user's stations
      action: read
      collection: readings
      scope: user
    - name: read_stations
      description: The user's stations with thresholds
      action: read
      collection: stations
      scope: user
    - name: read_fields
      description: The user's fields
      action: read
      collection: fields
      scope: user
    - name: weather_forecast
      description: Open-Meteo forecast
      action: http
      http:
        method: GET
        url: https://api.open-meteo.com/v1/forecast
        attribution: Weather data by Open-Meteo.com, CC BY 4.0
  - key: weekly
    role: scheduled
    description: Weekly summary of a field.
    memory: instance
    writesTo:
      collection: weekly_reports
      parse: markdown_sections
    output: markdown
    profile:
      inline:
        display_name: AgroSensori weekly
        crews:
        - id: weekly
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write the weekly report of one field. Read stations, readings of the last 7 days and fields
            with the tools. Start with ''# <Field> - settimana del <date>''. Sections: Andamento, Episodi di stress, Interventi
            consigliati, Prossima settimana (use weather_forecast for 7 days). Include one chart block with the weekly trend
            of soil moisture. Real figures only, under 350 words.'
    appTools:
    - name: read_readings
      description: Sensor readings of the user's stations
      action: read
      collection: readings
      scope: user
    - name: read_stations
      description: The user's stations with thresholds
      action: read
      collection: stations
      scope: user
    - name: read_fields
      description: The user's fields
      action: read
      collection: fields
      scope: user
    - name: weather_forecast
      description: Open-Meteo forecast
      action: http
      http:
        method: GET
        url: https://api.open-meteo.com/v1/forecast
        attribution: Weather data by Open-Meteo.com, CC BY 4.0
  templates:
  - key: field_watch
    title:
      it: Monitoraggio campo
      en: Field monitoring
    description:
      it: Analisi giornaliera dei sensori di un campo con semaforo e alert.
      en: Daily sensor analysis of a field with traffic light and alerts.
    agent: analyst
    params:
    - name: field_name
      type: select
      required: true
      optionsFrom: collection:fields
      label:
        it: Campo
        en: Field
    goal: Analyse the field "{field_name}". Today is {date}. Write in the language with ISO code {lang}.
    schedule:
      cron: 0 5 * * *
      userCanChange: true
    maxPerUser: 50
  - key: weekly_watch
    title:
      it: Report settimanale
      en: Weekly report
    description:
      it: Riassunto settimanale per email.
      en: Weekly summary by email.
    agent: weekly
    params:
    - name: field_name
      type: select
      required: true
      optionsFrom: collection:fields
      label:
        it: Campo
        en: Field
    goal: Write the weekly report of the field "{field_name}". Today is {date}. Write in the language with ISO code {lang}.
    schedule:
      cron: 0 6 * * 1
      userCanChange: true
    maxPerUser: 50
    deliver:
      to: owner
      onlyIfNew: true
  data:
    collections:
    - name: fields
      description: Plots of the farm
      ownedBy: user
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome appezzamento
          en: Field name
      - name: crop
        type: text
        label:
          it: Coltura
          en: Crop
      - name: lat
        type: number
        required: true
        label: Lat
      - name: lon
        type: number
        required: true
        label: Lon
      - name: hectares
        type: number
        label:
          it: Ettari
          en: Hectares
      - name: consultant_email
        type: email
        label:
          it: Email consulente
          en: Consultant email
      access:
      - role: consultant
        where:
          consultant_email: '{user.email}'
        can:
        - read
    - name: stations
      description: Sensor stations
      ownedBy: user
      fields:
      - name: station_id
        type: text
        required: true
        label:
          it: ID centralina
          en: Station ID
      - name: field_name
        type: select
        required: true
        optionsFrom: collection:fields
        label:
          it: Campo
          en: Field
      - name: min_moisture
        type: number
        label:
          it: Soglia min umidità suolo %
          en: Min soil moisture %
      - name: max_temperature
        type: number
        label:
          it: Soglia max temperatura °C
          en: Max temperature °C
      - name: consultant_email
        type: email
        label:
          it: Email consulente
          en: Consultant email
      access:
      - role: consultant
        where:
          consultant_email: '{user.email}'
        can:
        - read
    - name: readings
      description: Sensor measurements arriving by webhook
      ownedBy: user
      retentionDays: 730
      fields:
      - name: station_id
        type: text
      - name: field_name
        type: text
      - name: ts
        type: date
      - name: soil_moisture
        type: number
      - name: water_stress
        type: number
      - name: temperature
        type: number
      - name: humidity
        type: number
      - name: consultant_email
        type: email
      access:
      - role: consultant
        where:
          consultant_email: '{user.email}'
        can:
        - read
    - name: assessments
      description: Daily status of each field
      ownedBy: instance
      fields:
      - name: field_name
        type: text
      - name: status
        type: text
      - name: summary
        type: textarea
      - name: advice
        type: textarea
    - name: weekly_reports
      description: Weekly reports
      ownedBy: instance
  triggers:
  - key: sensor_data
    'on':
      webhook: true
    write:
      collection: readings
      fields:
        station_id: station_id
        field_name: field_name
        ts: ts
        soil_moisture: soil_moisture
        water_stress: water_stress
        temperature: temperature
        humidity: humidity
        consultant_email: consultant_email
  - key: red_alert
    'on':
      collection: assessments
      op: insert
      where:
        status: red
    notify:
      to:
      - owner
      subject:
        it: 'Alert piante: {record.field_name}'
        en: 'Plant alert: {record.field_name}'
      body:
        it: 'Parametri fuori soglia nel campo {record.field_name}.

          {record.summary}

          Consiglio: {record.advice}'
        en: 'Out-of-threshold values in field {record.field_name}.

          {record.summary}

          Advice: {record.advice}'
      link: dashboard
  views:
  - key: home
    type: page
    nav: false
    title: AgroSensori
    sections:
    - type: hero
      title:
        it: Le tue piante, **sotto controllo** dai sensori.
        en: Your plants, **under control** through sensors.
      text:
        it: Dati delle centraline, analisi AI dello stress idrico, previsioni meteo e alert via email con il consiglio di
          intervento.
        en: Station data, AI analysis of water stress, weather forecasts and email alerts with intervention advice.
      actions:
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Registra campi e centraline
          en: Register fields and stations
        text:
          it: I dati arrivano alla piattaforma via webhook.
          en: Data reach the platform via webhook.
      - title:
          it: L'agente analizza
          en: The agent analyses
        text:
          it: Stress, cali anomali e previsioni Open-Meteo.
          en: Stress, abnormal drops and Open-Meteo forecasts.
      - title:
          it: Semaforo e alert
          en: Traffic light and alerts
        text:
          it: Email quando un parametro esce dalla soglia, report ogni settimana.
          en: Email when a parameter leaves its threshold, weekly report.
    - type: note
      content:
        it: 'Solo software di monitoraggio: sensori e installazione sono un prodotto a parte. Dati meteo: Open-Meteo.com (CC
          BY 4.0). I consigli sono di supporto, non sostituiscono l''agronomo.'
        en: 'Monitoring software only: sensors and installation are a separate product. Weather data: Open-Meteo.com (CC BY
          4.0). Advice is decision support, not a substitute for the agronomist.'
  - key: dashboard
    type: page
    title:
      it: Cruscotto
      en: Dashboard
    roles:
    - user
    - consultant
    - admin
    sections:
    - type: data
      title:
        it: Semaforo per campo
        en: Traffic light per field
      source: collection:assessments
      display: cards
      fields:
      - key: field_name
        label:
          it: Campo
          en: Field
      - key: status
        label:
          it: Stato
          en: Status
        format: badge
      - key: summary
        label:
          it: Sintesi
          en: Summary
      - key: advice
        label:
          it: Consiglio
          en: Advice
      sort:
        field: createdAt
        dir: desc
      limit: 30
    - type: data
      title:
        it: Umidità del suolo e temperatura
        en: Soil moisture and temperature
      source: collection:readings
      display: chart
      chart: line
      fields:
      - key: ts
      - key: soil_moisture
        label:
          it: Umidità suolo
          en: Soil moisture
      - key: temperature
        label:
          it: Temperatura
          en: Temperature
      sort:
        field: ts
        dir: asc
      limit: 200
    - type: data
      title:
        it: Ultime misure per centralina
        en: Latest readings per station
      source: collection:readings
      display: table
      fields:
      - key: station_id
        label:
          it: Centralina
          en: Station
      - key: field_name
        label:
          it: Campo
          en: Field
      - key: ts
        format: date
      - key: soil_moisture
      - key: water_stress
      - key: temperature
      - key: humidity
      sort:
        field: ts
        dir: desc
      limit: 50
  - key: new_field
    type: form
    title:
      it: Nuovo campo
      en: New field
    collection: fields
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Campo salvato
        en: Field saved
      redirect: fields_list
    roles:
    - user
    - admin
  - key: new_station
    type: form
    title:
      it: Nuova centralina
      en: New station
    collection: stations
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Centralina salvata
        en: Station saved
      redirect: stations_list
    roles:
    - user
    - admin
  - key: fields_list
    type: table
    title:
      it: Campi
      en: Fields
    source: collection:fields
    columns:
    - name
    - crop
    - hectares
    - consultant_email
    export: true
    roles:
    - user
    - consultant
    - admin
  - key: stations_list
    type: table
    title:
      it: Centraline
      en: Stations
    source: collection:stations
    columns:
    - station_id
    - field_name
    - min_moisture
    - max_temperature
    roles:
    - user
    - consultant
    - admin
  - key: watches
    type: instances
    template: field_watch
    title:
      it: Monitoraggi
      en: Monitoring
    roles:
    - user
    - admin
  - key: weekly_watches
    type: instances
    template: weekly_watch
    title:
      it: Report settimanali
      en: Weekly reports
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - user
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: s10
      price: 290
      interval: year
      label:
        it: Fino a 10 centraline
        en: Up to 10 stations
    - key: s50
      price: 1190
      interval: year
      label:
        it: Fino a 50 centraline
        en: Up to 50 stations
    - key: s200
      price: 3900
      interval: year
      label:
        it: Centraline illimitate
        en: Unlimited stations
  egress:
    hosts:
    - api.open-meteo.com
    notes: Open-Meteo forecast API, CC BY 4.0, attribution required.
  extensions:
  - key: consultant_assessments
    description: Consultants read fields, stations and readings of followed clients; the per-instance analysis reports remain
      with the farm owner.
