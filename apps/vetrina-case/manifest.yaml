apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: vetrina-case
  displayName: Vetrina Case
  tagline:
    it: Annunci immobiliari delle agenzie, con stima automatica del valore.
  description:
    it: 'Portale di annunci pubblicati dalle agenzie, ricerca su mappa, ricerche salvate con avviso email e stima del valore
      basata sulle quotazioni OMI e sugli annunci del portale. Solo strato software: nessuna attività di mediazione.'
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f3a4d'
      accent: '#d2691e'
      background: '#faf8f4'
      foreground: '#1c242b'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Vetrina
      color: primary
    - text: Case
      color: accent
  header:
    links:
    - label:
        it: Come funziona
      href: '#come-funziona'
    - label:
        it: Per le agenzie
      href: '#agenzie'
    cta:
      label:
        it: Stima gratis
      href: /v/new_valuation
  auth:
    method: magic_link
    anonymous:
      views:
      - home
      - map
      - listings
      - contact
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  limits:
  - action: create:listings
    max: 5
    window: total
    plans:
      agency_s: 50
      agency_m: 200
      agency_l: -1
  - action: agent:valuer
    per: user
    max: 10
    window: day
    roles:
    - user
  agents:
  - key: valuer
    role: main
    description: Stima l'intervallo di valore di un immobile da quotazioni OMI e annunci del portale.
    profile:
      inline:
        display_name: Vetrina Case valuer
        crews:
        - id: valuer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 1
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'Sei un analista di valutazioni immobiliari. Stimi un intervallo di valore (minimo, centrale, massimo,
            in euro e euro/mq) per un immobile in Italia. Metodo: 1) cerca con search_listings gli annunci comparabili del
            portale nella stessa zona (prezzi richiesti, che sono sempre sopra i prezzi di chiusura: applica uno sconto di
            trattativa dichiarato); 2) recupera la quotazione OMI (Osservatorio del Mercato Immobiliare, Agenzia delle Entrate)
            della zona e dello stato conservativo tramite gli strumenti WebRobot MCP, citando semestre e fascia; 3) correggi
            per piano, stato e anno di costruzione spiegando ogni correzione. Non inventare cifre: se mancano dati o i comparabili
            sono meno di 3, dillo e allarga l''intervallo. Non è una perizia né consulenza. Struttura del report: iniziare
            con ''# Stima di valore — <indirizzo>'', poi ## Intervallo stimato (tabella), ## Quotazioni OMI, ## Annunci comparabili,
            ## Correzioni applicate, ## Affidabilità e limiti. Aggiungi un blocco ```chart bar con minimo/centrale/massimo.
            Se il campo di consenso è sì, chiama write_lead una volta con zone, indirizzo, intervallo e email del richiedente.'
    goalTemplate: 'Indirizzo: {address}

      Superficie: {sqm} mq

      Piano: {floor}

      Stato: {condition_label}

      Anno di costruzione: {year_built}

      Il proprietario {?contact_ok}ACCETTA{/contact_ok}{!contact_ok}NON accetta{/contact_ok} di essere contattato da un''agenzia
      della zona. Email: {email}

      Data: {date}. Scrivi in lingua {lang}.'
    context:
    - key: email
      from: user.email
    appTools:
    - name: search_listings
      description: Search the portal's published listings
      action: search
      collection: public_listings
      scope: all
    - name: write_lead
      description: Save an owner who agreed to be contacted by a local agency
      action: write
      collection: valuation_leads
      scope: all
    output: markdown
    limits:
      maxTurns: 25
      maxBudgetUsd: 1
  - key: checker
    role: scheduled
    description: Ogni giorno cerca annunci duplicati o con dati incoerenti e li segnala all'admin.
    profile:
      inline:
        display_name: Vetrina Case quality checker
        crews:
        - id: checker
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 20
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Controlli la qualità degli annunci del portale. Leggi gli annunci con read_listings. Cerca (a) duplicati:
            stesso indirizzo/coordinate, superficie e prezzo simili, anche da agenzie diverse; (b) dati incoerenti: prezzo
            al mq fuori scala per la zona, superficie o locali impossibili, coordinate lontane dalla città indicata, classe
            energetica non valida, foto mancanti. Per ogni problema chiama write_flag una volta con listing_ref, kind (duplicate|inconsistent),
            detail (motivo breve e concreto) e se_non_certo. Non segnalare due volte lo stesso annuncio per lo stesso motivo
            (controlla con read_flags). Non modificare né cancellare annunci. Chiudi con ''# Controllo qualità — <data>''
            e un riepilogo di poche righe.'
    appTools:
    - name: read_listings
      description: Read the published listings
      action: read
      collection: public_listings
      scope: all
    - name: read_flags
      description: Read existing flags
      action: read
      collection: listing_flags
      scope: all
    - name: write_flag
      description: Flag a duplicate or inconsistent listing for the admin
      action: write
      collection: listing_flags
      scope: all
    output: markdown
  - key: matcher
    role: helper
    description: Per una ricerca salvata, trova gli annunci nuovi compatibili.
    memory: instance
    writesTo:
      collection: search_hits
    profile:
      inline:
        display_name: Vetrina Case search alert
        crews:
        - id: matcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Segui una ricerca salvata di un visitatore. Con find_listings cerca gli annunci che rispettano zona,
            prezzo massimo, locali minimi e tipologia. La tua memoria contiene i riferimenti già comunicati: elenca solo annunci
            nuovi. Se non ce ne sono, scrivi ''# Nessun annuncio nuovo'' e una riga. Altrimenti ''# Nuovi annunci — <nome
            ricerca>'' con per ognuno titolo, zona, prezzo, mq, locali, classe energetica e riferimento. Non inventare annunci.
            Alla fine chiama remember una volta con i riferimenti di tutti gli annunci già comunicati (sostituiscono i vecchi).'
    appTools:
    - name: find_listings
      description: Search the portal's published listings
      action: search
      collection: public_listings
      scope: all
  inputForm:
    title:
      it: Stima del valore
    fields:
    - name: address
      type: text
      required: true
      label:
        it: Indirizzo
    - name: sqm
      type: number
      required: true
      label:
        it: Superficie (mq)
    - name: floor
      type: select
      required: true
      label:
        it: Piano
      options:
      - value: terra
        label: Terra
      - value: intermedio
        label: Intermedio
      - value: ultimo
        label: Ultimo
    - name: condition
      type: select
      required: true
      label:
        it: Stato
      options:
      - value: nuovo
        label: Nuovo / ristrutturato
      - value: buono
        label: Buono
      - value: da_ristrutturare
        label: Da ristrutturare
    - name: year_built
      type: number
      required: true
      label:
        it: Anno di costruzione
    - name: contact_ok
      type: boolean
      label:
        it: Voglio essere contattato da un'agenzia della zona
  data:
    collections:
    - name: listings
      description: Annunci caricati da ciascuna agenzia
      ownedBy: user
      fields:
      - name: external_id
        type: text
        label: Rif. gestionale
      - name: title
        type: text
        required: true
        label: Titolo
      - name: description
        type: textarea
        label: Descrizione
      - name: address
        type: text
        required: true
        label: Indirizzo
      - name: zone
        type: text
        required: true
        label: Zona
      - name: lat
        type: number
        label: Latitudine
      - name: lon
        type: number
        label: Longitudine
      - name: price
        type: number
        required: true
        label: Prezzo
      - name: sqm
        type: number
        required: true
        label: Superficie
      - name: rooms
        type: number
        required: true
        label: Locali
      - name: kind
        type: select
        label: Tipologia
        options:
        - appartamento
        - villa
        - attico
        - ufficio
        - box
      - name: energy_class
        type: select
        label: Classe energetica
        options:
        - A4
        - A3
        - A2
        - A1
        - B
        - C
        - D
        - E
        - F
        - G
      - name: features
        type: multiselect
        label: Caratteristiche
        options:
        - balcone
        - terrazzo
        - giardino
        - ascensore
        - box
        - cantina
      - name: photos
        type: file
        accept:
        - jpg
        - jpeg
        - png
        - webp
        maxMb: 10
        multiple: true
        label: Foto
      - name: floorplan
        type: file
        accept:
        - pdf
        - jpg
        - png
        maxMb: 10
        label: Planimetria
      - name: agency_name
        type: text
        label: Agenzia
      - name: agency_email
        type: email
        required: true
        label: Email agenzia
    - name: public_listings
      description: Annunci pubblicati, visibili a tutti (da form agenzia o feed del gestionale)
      ownedBy: app
      searchable: true
      fields:
      - name: external_id
        type: text
      - name: title
        type: text
      - name: description
        type: textarea
      - name: address
        type: text
      - name: zone
        type: text
      - name: lat
        type: number
      - name: lon
        type: number
      - name: price
        type: number
      - name: sqm
        type: number
      - name: rooms
        type: number
      - name: kind
        type: text
      - name: energy_class
        type: text
      - name: features
        type: multiselect
        options:
        - balcone
        - terrazzo
        - giardino
        - ascensore
        - box
        - cantina
      - name: photos
        type: file
        multiple: true
      - name: floorplan
        type: file
      - name: agency_name
        type: text
      - name: agency_email
        type: email
    - name: contacts
      description: Richieste di contatto dei visitatori verso le agenzie
      ownedBy: org
      retentionDays: 365
      fields:
      - name: listing_ref
        type: text
        required: true
        label: Annuncio (rif. o titolo)
      - name: agency_email
        type: email
        required: true
        label: Email dell'agenzia dell'annuncio
      - name: name
        type: text
        required: true
        label: Nome
      - name: email
        type: email
        required: true
        label: La tua email
      - name: phone
        type: text
        label: Telefono
      - name: message
        type: textarea
        required: true
        label: Messaggio
      access:
      - role: user
        where:
          agency_email: '{user.email}'
        can:
        - read
    - name: valuation_leads
      description: Proprietari che vogliono essere contattati da un'agenzia
      ownedBy: org
      retentionDays: 180
      fields:
      - name: address
        type: text
      - name: zone
        type: text
      - name: range
        type: text
      - name: email
        type: email
    - name: listing_flags
      description: Annunci duplicati o incoerenti segnalati dall'agente
      ownedBy: org
      fields:
      - name: listing_ref
        type: text
      - name: kind
        type: select
        options:
        - duplicate
        - inconsistent
      - name: detail
        type: textarea
      - name: se_non_certo
        type: boolean
    - name: search_hits
      description: Risultati di ogni ricerca salvata
      ownedBy: instance
  views:
  - key: home
    type: page
    nav: false
    title: Vetrina Case
    sections:
    - type: hero
      layout: stack
      band: true
      eyebrow:
        it: Annunci delle agenzie
      title:
        it: Trova casa sulla mappa. Scopri quanto **vale** la tua.
      text:
        it: Annunci pubblicati direttamente dalle agenzie, avvisi email sulle tue ricerche e una stima del valore basata su
          quotazioni OMI e prezzi reali del portale.
      actions:
      - label:
          it: Cerca sulla mappa
        href: /v/map
        style: primary
      - label:
          it: Stima la tua casa
        href: /v/new_valuation
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
      items:
      - title:
          it: Cerca
        text:
          it: Zona sulla mappa, prezzo, locali e caratteristiche.
        badge: 🔎
      - title:
          it: Salva e ricevi avvisi
        text:
          it: Un'email quando compare un annuncio nuovo compatibile.
        badge: 🔔
      - title:
          it: Contatta l'agenzia
        text:
          it: Un modulo e la tua richiesta arriva all'agenzia.
        badge: ✉️
      - title:
          it: Stima gratuita
        text:
          it: Intervallo di valore con OMI e annunci del portale.
        badge: 📊
    - type: cards
      id: agenzie
      title:
        it: Per le agenzie
      intro:
        it: Abbonamento mensile in base al numero di annunci.
      items:
      - title:
          it: Carica o importa
        text:
          it: Form con foto e planimetria, oppure feed dal tuo gestionale.
      - title:
          it: I tuoi annunci e contatti
        text:
          it: Vedi solo i tuoi, con le richieste dei visitatori.
      - title:
          it: Qualità controllata
        text:
          it: Un agente segnala duplicati e dati incoerenti.
    - type: note
      content:
        it: 'Vetrina Case è uno strumento software: non svolge attività di mediazione. La stima non è una perizia.'
  - key: map
    type: map
    title:
      it: Mappa
    source: collection:public_listings
    map:
      lat: lat
      lon: lon
      title: title
      popup:
      - address
      - price
      - sqm
      - rooms
      - energy_class
  - key: listings
    type: table
    title:
      it: Annunci
    source: collection:public_listings
    columns:
    - title
    - zone
    - price
    - sqm
    - rooms
    - energy_class
    - agency_name
    export: false
  - key: contact
    type: form
    title:
      it: Contatta l'agenzia
    collection: contacts
    submit:
      label:
        it: Invia richiesta
      message:
        it: Richiesta inviata all'agenzia.
      redirect: listings
  - key: new_valuation
    type: new_run
    title:
      it: Stima del valore
    roles:
    - user
    - admin
  - key: valuations
    type: history
    title:
      it: Le mie stime
    source: run
    roles:
    - user
    - admin
  - key: valuation
    type: report
    source: run
    printable: true
    nav: false
  - key: searches
    type: instances
    template: saved_search
    title:
      it: Ricerche salvate
    roles:
    - user
    - admin
  - key: new_listing
    type: form
    title:
      it: Nuovo annuncio
    collection: listings
    edit: true
    submit:
      label:
        it: Pubblica
      message:
        it: Annuncio salvato e pubblicato.
      redirect: my_listings
    roles:
    - user
    - admin
  - key: my_listings
    type: table
    title:
      it: I miei annunci
    source: collection:listings
    columns:
    - title
    - zone
    - price
    - sqm
    - rooms
    - energy_class
    roles:
    - user
    - admin
    export: true
  - key: my_contacts
    type: table
    title:
      it: Contatti ricevuti
    source: collection:contacts
    columns:
    - listing_ref
    - name
    - email
    - phone
    - message
    roles:
    - user
    - admin
    export: true
  - key: flags
    type: table
    title:
      it: Segnalazioni qualità
    source: collection:listing_flags
    columns:
    - listing_ref
    - kind
    - detail
    - se_non_certo
    roles:
    - admin
  - key: leads
    type: table
    title:
      it: Proprietari da contattare
    source: collection:valuation_leads
    columns:
    - address
    - zone
    - range
    - email
    roles:
    - admin
    export: true
  - key: account
    type: account
    title:
      it: Abbonamento
    roles:
    - user
  templates:
  - key: saved_search
    title:
      it: Ricerca salvata
    description:
      it: Ricevi un'email quando compare un annuncio nuovo compatibile.
    agent: matcher
    params:
    - name: zone
      type: text
      required: true
      label:
        it: Zona / città
    - name: max_price
      type: number
      label:
        it: Prezzo massimo
    - name: min_rooms
      type: number
      label:
        it: Locali minimi
    - name: features
      type: text
      label:
        it: Caratteristiche desiderate
    goal: 'Ricerca "{instance}": zona {zone}, prezzo massimo {max_price}, locali minimi {min_rooms}, caratteristiche {features}.
      Oggi è {date}. Scrivi in lingua {lang}.'
    schedule:
      cron: 0 7 * * *
      userCanChange: false
    maxPerUser: 5
    cost:
      perRun: 0
    deliver:
      to: owner
      subject: Nuovi annunci per la tua ricerca
      onlyIfNew: true
  triggers:
  - key: publish_listing
    description: Pubblica sul portale ogni annuncio caricato da un'agenzia
    'on':
      collection: listings
      op: insert
    write:
      collection: public_listings
  - key: feed_import
    description: Feed dal gestionale dell'agenzia
    'on':
      webhook: true
    write:
      collection: public_listings
      keyBy: external_id
  - key: contact_notify
    'on':
      collection: contacts
      op: insert
    notify:
      to:
      - record.agency_email
      subject:
        it: Nuova richiesta per {record.listing_ref}
      body:
        it: 'Ciao, {record.name} ({record.email}, {record.phone}) ha scritto: {record.message}'
      link: my_contacts
  - key: flag_notify
    'on':
      collection: listing_flags
      op: insert
    notify:
      to: admins
      subject:
        it: 'Annuncio segnalato: {record.listing_ref}'
      body:
        it: 'Tipo: {record.kind}. {record.detail}'
      link: flags
  - key: lead_notify
    'on':
      collection: valuation_leads
      op: insert
    notify:
      to: admins
      subject:
        it: 'Proprietario da contattare: {record.address}'
      body:
        it: Zona {record.zone}, stima {record.range}, email {record.email}.
      link: leads
  schedules:
  - agent: checker
    action: run
    cron: 0 5 * * *
    owner: app
    goal: 'Controlla gli annunci pubblicati: duplicati e dati incoerenti. Oggi è {date}.'
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 30
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:valuer:
        estimate: 10
        metered: true
    packs:
    - key: stime
      credits: 300
      price: 5
      label:
        it: 10 stime
    plans:
    - key: agency_s
      price: 29
      interval: month
      label:
        it: Agenzia S — fino a 50 annunci
      includes:
      - 50 annunci
      - contatti illimitati
    - key: agency_m
      price: 79
      interval: month
      label:
        it: Agenzia M — fino a 200 annunci
      includes:
      - 200 annunci
      - feed dal gestionale
    - key: agency_l
      price: 199
      interval: month
      label:
        it: Agenzia L — annunci illimitati
      includes:
      - annunci illimitati
      - feed dal gestionale
  notifications:
    emailOnRunDone: true
  extensions:
  - key: listing_sync
    description: Le modifiche e le cancellazioni di un annuncio dal form non si propagano ancora alla copia pubblica; il feed
      webhook aggiorna per external_id. Geocodifica automatica dell'indirizzo (lat/lon) e precompilazione dell'agenzia nel
      modulo contatto dal singolo annuncio non sono ancora disponibili.
  - key: lead_routing
    description: 'I proprietari che chiedono di essere contattati arrivano all''admin, che li inoltra alle agenzie della zona:
      l''assegnazione automatica per zona non è ancora disponibile. I dati OMI vengono letti dall''agente via WebRobot MCP
      (nessuna API ufficiale).'
