apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: cibo-cani-abbonamento
  displayName: PappaSu
  tagline:
    it: Il piano alimentare su misura per il tuo cane, in abbonamento.
  description:
    it: 'Inserisci i dati del tuo cane: un agente calcola fabbisogno e razioni, ti propone i prodotti giusti e, quando confermi,
      attiva le forniture ricorrenti. Pausa, modifica e promemoria prima di ogni rinnovo.'
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#3b2f2f'
      accent: '#e07a2f'
      background: '#fdf8f2'
      foreground: '#2a2220'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Pappa
      color: primary
    - text: Su
      color: accent
  header:
    links:
    - label:
        it: Come funziona
      href: '#come-funziona'
    - label:
        it: Piani
      href: '#piani'
    cta:
      label:
        it: Inizia
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  limits:
  - action: agent:nutritionist
    per: user
    max: 3
    window: month
    roles:
    - user
    plans:
      base: 10
      plus: 50
  - action: create:dogs
    max: 1
    window: total
    plans:
      base: 3
      plus: 10
  agents:
  - key: nutritionist
    role: main
    description: Calcola fabbisogno calorico e propone il piano alimentare con razioni e prodotti dal catalogo.
    profile:
      inline:
        display_name: Nutrizionista canino
        crews:
        - id: nutritionist
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un esperto di nutrizione canina che prepara piani alimentari personalizzati. Leggi il catalogo
            con lo strumento read_products e consiglia SOLO prodotti presenti nel catalogo, escludendo quelli che contengono
            gli allergeni indicati. Calcola RER = 70 x peso_kg^0.75 e il fabbisogno giornaliero (MER) con un fattore adeguato
            a età, attività e obiettivo (mantenimento ~1.4-1.8; dimagrimento ~1.0-1.2 sul peso ideale; cuccioli fattori più
            alti). Mostra i passaggi del calcolo. Struttura del report: titolo di primo livello "# Piano alimentare — <nome
            cane>", poi ## Fabbisogno, ## Razioni giornaliere (tabella con pasti, grammi per prodotto, kcal), ## Prodotti
            consigliati, ## Perché queste scelte, ## Quando rivedere il piano. Non inventare dati nutrizionali che non sono
            nel catalogo; non fare diagnosi: per patologie o dubbi rimanda al veterinario. Al termine aggiungi un blocco JSON
            finale con: dog_name, kcal_day, grams_day, meals_per_day, products (testo breve), summary.'
          mcp_servers: []
    goalTemplate: 'Cane: {dog_name}, razza {breed}, età {age_months} mesi, peso {weight_kg} kg, attività {activity}, obiettivo
      {goal}. Allergie: {allergies}. {?notes}Note: {notes}{/notes} Data: {date}. Scrivi in italiano.'
    context:
    - key: dog_name
      from: collection:dogs.name
    - key: breed
      from: collection:dogs.breed
    - key: age_months
      from: collection:dogs.age_months
    - key: weight_kg
      from: collection:dogs.weight_kg
    - key: activity
      from: collection:dogs.activity
    - key: goal
      from: collection:dogs.goal
    - key: allergies
      from: collection:dogs.allergies
    appTools:
    - name: read_products
      description: Legge il catalogo prodotti (ingredienti, allergeni, kcal per 100 g)
      action: read
      collection: products
      scope: all
    output: markdown+json
    resultSchema:
      type: object
      properties:
        dog_name:
          type: string
        kcal_day:
          type: number
        grams_day:
          type: number
        meals_per_day:
          type: number
        products:
          type: string
        summary:
          type: string
    writesTo:
      collection: feeding_plans
      parse: json_last
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.4
  - key: calendar
    role: helper
    description: Genera e aggiorna il calendario delle consegne previste di un abbonamento.
    profile:
      inline:
        display_name: Pianificatore consegne
        crews:
        - id: calendar
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Gestisci il calendario delle consegne di un abbonamento. Con lo strumento read_deliveries guarda
            le consegne già previste per quel cane. Se l''abbonamento è attivo, assicurati che esistano le prossime 4 consegne
            con write_delivery (campi: dog_name, date YYYY-MM-DD, status ''prevista''), a partire da next_renewal e con la
            cadenza scelta (settimanale = 7 giorni, quindicinale = 14, mensile = 28). Non duplicare date esistenti. Se l''abbonamento
            è in pausa o cancellato, non creare nulla e scrivi consegne future con status ''sospesa'' per le date già previste.
            Rispondi con un breve riepilogo in italiano, titolo ''# Calendario consegne''.'
          mcp_servers: []
    appTools:
    - name: read_deliveries
      description: Legge le consegne dell'utente
      action: read
      collection: deliveries
      scope: user
    - name: write_delivery
      description: Crea o aggiorna una consegna prevista
      action: write
      collection: deliveries
      scope: user
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.2
  inputForm:
    title:
      it: Nuovo piano alimentare
    fields:
    - name: dog
      type: select
      required: true
      optionsFrom: collection:dogs
      label:
        it: Il tuo cane
      help:
        it: Prima registra il cane nella sezione I miei cani
    - name: notes
      type: textarea
      maxLength: 400
      label:
        it: Note (facoltative)
  data:
    collections:
    - name: dogs
      ownedBy: user
      description: I cani del padrone
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome
      - name: breed
        type: text
        required: true
        label:
          it: Razza
      - name: age_months
        type: number
        required: true
        label:
          it: Età (mesi)
      - name: weight_kg
        type: number
        required: true
        label:
          it: Peso (kg)
      - name: activity
        type: select
        required: true
        label:
          it: Livello di attività
        options:
        - value: bassa
          label:
            it: Bassa
        - value: moderata
          label:
            it: Moderata
        - value: alta
          label:
            it: Alta
      - name: allergies
        type: textarea
        label:
          it: Allergie e intolleranze
      - name: goal
        type: select
        required: true
        label:
          it: Obiettivo
        options:
        - value: mantenimento
          label:
            it: Mantenimento
        - value: dimagrimento
          label:
            it: Dimagrimento
    - name: feeding_plans
      ownedBy: user
      description: Piani alimentari calcolati dall'agente
      fields:
      - name: dog_name
        type: text
        label:
          it: Cane
      - name: kcal_day
        type: number
        label:
          it: Kcal al giorno
      - name: grams_day
        type: number
        label:
          it: Grammi al giorno
      - name: meals_per_day
        type: number
        label:
          it: Pasti al giorno
      - name: products
        type: text
        label:
          it: Prodotti
      - name: summary
        type: textarea
        label:
          it: Sintesi
    - name: subscriptions
      ownedBy: user
      description: Abbonamenti alle forniture
      fields:
      - name: dog
        type: select
        required: true
        optionsFrom: collection:dogs
        label:
          it: Cane
      - name: frequency
        type: select
        required: true
        label:
          it: Frequenza forniture
        options:
        - value: settimanale
          label:
            it: Ogni settimana
        - value: quindicinale
          label:
            it: Ogni 2 settimane
        - value: mensile
          label:
            it: Ogni 4 settimane
      - name: status
        type: select
        required: true
        default: attivo
        label:
          it: Stato
        options:
        - value: attivo
          label:
            it: Attivo
        - value: in_pausa
          label:
            it: In pausa
        - value: cancellato
          label:
            it: Cancellato
      - name: next_renewal
        type: date
        required: true
        label:
          it: Prossimo rinnovo
      - name: address
        type: textarea
        required: true
        label:
          it: Indirizzo di consegna
    - name: deliveries
      ownedBy: user
      description: Calendario consegne previste
      fields:
      - name: dog_name
        type: text
        label:
          it: Cane
      - name: date
        type: date
        label:
          it: Data prevista
      - name: status
        type: select
        label:
          it: Stato
        options:
        - prevista
        - sospesa
        - consegnata
        - annullata
    - name: products
      ownedBy: shared
      description: Catalogo prodotti gestito dall'admin
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Prodotto
      - name: kind
        type: select
        label:
          it: Tipo
        options:
        - secco
        - umido
        - snack
        - integratore
      - name: kcal_100g
        type: number
        label:
          it: Kcal per 100 g
      - name: ingredients
        type: textarea
        label:
          it: Ingredienti
      - name: allergens
        type: text
        label:
          it: Allergeni
      - name: life_stage
        type: select
        label:
          it: Fase di vita
        options:
        - cucciolo
        - adulto
        - senior
        - tutte
      - name: price_eur
        type: number
        label:
          it: Prezzo (€)
  views:
  - key: home
    type: page
    nav: false
    title: PappaSu
    sections:
    - type: hero
      title:
        it: Il piano alimentare **su misura** per il tuo cane
      text:
        it: 'Raccontaci razza, età, peso e allergie: calcoliamo razioni e prodotti giusti, tu confermi e ricevi le forniture
          con la frequenza che preferisci.'
      actions:
      - label:
          it: Crea il piano
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
      items:
      - title:
          it: Registra il cane
        text:
          it: Dati, attività, allergie e obiettivo.
        badge: 🐶
      - title:
          it: Ricevi il piano
        text:
          it: Fabbisogno calorico, razioni giornaliere e prodotti spiegati.
        badge: 📋
      - title:
          it: Attiva l'abbonamento
        text:
          it: Scegli la frequenza, metti in pausa o modifica quando vuoi.
        badge: 📦
      - title:
          it: Promemoria e aggiornamenti
        text:
          it: Email prima di ogni rinnovo; il piano si ricalcola se il cane cambia.
        badge: 🔔
    - type: cards
      id: piani
      title:
        it: Piani
      items:
      - title: Base
        text:
          it: Fino a 3 cani, 10 piani al mese.
      - title: Plus
        text:
          it: Fino a 10 cani, 50 piani al mese.
    - type: note
      content:
        it: Il piano è un supporto e non sostituisce il parere del veterinario.
  - key: new_plan
    type: new_run
    title:
      it: Nuovo piano
    roles:
    - user
    - admin
  - key: plans_history
    type: history
    title:
      it: I miei piani
    source: run
    roles:
    - user
    - admin
  - key: plan_report
    type: report
    source: run
    printable: true
    nav: false
  - key: dog_form
    type: form
    title:
      it: Aggiungi / modifica cane
    collection: dogs
    edit: true
    submit:
      label:
        it: Salva cane
      message:
        it: Cane salvato.
      redirect: my_dogs
    roles:
    - user
    - admin
  - key: my_dogs
    type: table
    title:
      it: I miei cani
    source: collection:dogs
    columns:
    - name
    - breed
    - age_months
    - weight_kg
    - activity
    - goal
    roles:
    - user
    - admin
  - key: subscribe
    type: form
    title:
      it: Abbonamento
    collection: subscriptions
    edit: true
    submit:
      label:
        it: Conferma abbonamento
      message:
        it: Abbonamento salvato. Calendario in aggiornamento.
      redirect: my_subs
    roles:
    - user
    - admin
  - key: my_subs
    type: table
    title:
      it: I miei abbonamenti
    source: collection:subscriptions
    columns:
    - dog
    - frequency
    - status
    - next_renewal
    roles:
    - user
    - admin
  - key: my_deliveries
    type: table
    title:
      it: Calendario consegne
    source: collection:deliveries
    columns:
    - dog_name
    - date
    - status
    roles:
    - user
    - admin
  - key: products_list
    type: table
    title:
      it: Catalogo prodotti
    source: collection:products
    columns:
    - name
    - kind
    - kcal_100g
    - life_stage
    - price_eur
    export: true
    roles:
    - user
    - admin
  - key: product_admin
    type: form
    title:
      it: Gestione prodotti
    collection: products
    edit: true
    submit:
      label:
        it: Salva prodotto
      message:
        it: Prodotto salvato.
    roles:
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento e fatturazione
    roles:
    - user
  triggers:
  - key: calendar_sync
    'on':
      collection: subscriptions
      op: any
    start:
      agent: calendar
    goal: 'Abbonamento aggiornato: cane {record.dog}, frequenza {record.frequency}, stato {record.status}, prossimo rinnovo
      {record.next_renewal}. Aggiorna il calendario delle consegne. Oggi è {date}.'
  - key: replan_on_change
    'on':
      collection: dogs
      op: update
    start:
      agent: nutritionist
    goal: 'Il cane è cambiato: {record.name}, razza {record.breed}, età {record.age_months} mesi, peso {record.weight_kg}
      kg, attività {record.activity}, obiettivo {record.goal}, allergie {record.allergies}. Ricalcola fabbisogno e razioni
      e proponi il piano aggiornato. Scrivi in italiano.'
  - key: renewal_reminder
    'on':
      date:
        collection: subscriptions
        field: next_renewal
        offsetDays: -3
        hour: 8
      where:
        status: attivo
    notify:
      to: owner
      subject:
        it: Tra 3 giorni si rinnova la fornitura per {record.dog}
      body:
        it: 'Ciao, il {record.next_renewal} è previsto il rinnovo della fornitura (frequenza: {record.frequency}). Se vuoi
          mettere in pausa o modificare il piano, fallo prima da PappaSu.'
      link: my_subs
  notifications:
    emailOnRunDone: true
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: base
      price: 19
      interval: month
      label: Base
      includes:
      - Fino a 3 cani
      - 10 piani al mese
    - key: plus
      price: 39
      interval: month
      label: Plus
      includes:
      - Fino a 10 cani
      - 50 piani al mese
  extensions:
  - key: card_delivery_note
    description: Il pagamento ricorrente con carta dell'abbonamento è gestito da Stripe Connect tramite i piani di fatturazione;
      il costo dei prodotti inviati e la logistica fisica sono fuori dall'app.
