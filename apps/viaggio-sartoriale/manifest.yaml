apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: viaggio-sartoriale
  displayName: ViaggioSartoriale
  tagline:
    it: Viaggi su misura, rifiniti da un esperto locale.
    en: Tailor-made trips, refined by a local expert.
  description:
    it: 'Racconta il viaggio che vuoi: tre proposte di itinerario basate su open data, riviste e approvate da un esperto locale.'
    en: 'Tell us the trip you want: three itinerary proposals built on open data, reviewed and approved by a local expert.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f3a4d'
      accent: '#c8693a'
      background: '#faf6f0'
      foreground: '#1d2429'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Viaggio
      color: primary
    - text: Sartoriale
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Fonti
        en: Sources
      href: '#fonti'
    cta:
      label:
        it: Richiedi un viaggio
        en: Request a trip
      href: /v/request
  auth:
    method: magic_link
    anonymous:
      views:
      - home
      - request
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
    - key: expert
      label:
        it: Esperto locale
        en: Local expert
      assignedBy: derived
      from: collection:experts.email
  limits:
  - action: run
    per: app
    max: 100
    window: day
  egress:
    hosts:
    - overpass-api.de
    - nominatim.openstreetmap.org
    - query.wikidata.org
    notes: OpenStreetMap data (ODbL) via Overpass and Nominatim within their usage policies; Wikidata is CC0. Tourism board
      open data is read through the WebRobot MCP. No online travel agency data.
  agents:
  - key: planner
    role: main
    description: A team that researches places, distances and events from open data and writes three different itineraries,
      assigned to a local expert.
    profile:
      inline:
        display_name: ViaggioSartoriale planning team
        crews:
        - id: researcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You are the research desk of a bespoke travel service. For the requested destination and interests,
            collect only verifiable facts from OPEN sources: tourism board open data portals (scrape their public pages with
            the WebRobot MCP), OpenStreetMap (osm_overpass for points of interest, osm_geocode for coordinates) and Wikidata
            (wikidata_sparql for landmarks, events and festivals). NEVER use online travel agencies or booking sites. Output
            a structured fact sheet: places (name, type, coordinates, source), approximate distances/transfer times between
            them, events in the travel dates, seasonal notes. Cite the source of each item. Never invent facts: mark unknowns
            as ''to verify''.'
        - id: composer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the itinerary designer of ViaggioSartoriale. From the researcher''s fact sheet and the traveler''s
            request, write THREE clearly different itinerary proposals (for example: classic, off the beaten path, slow/in-depth),
            each respecting dates, group size, budget, interests and pace. Each proposal: title, day-by-day plan, rough cost
            range (state it is an estimate), distances, sources. Do not recommend specific hotels or restaurants: the local
            expert adds trusted places. Then use the tool read_experts to find the registered expert whose zones cover the
            destination (match by zone/region text); if none matches, leave expert_email empty. Start with a level-1 title
            ''# Proposte per <destination>''. Write in the traveler''s language ({lang}). Finish with ONE final fenced json
            block: {"request_id":"…","traveler_email":"…","destination":"…","zone":"…","expert_email":"…","option_a":"markdown
            of proposal 1","option_b":"markdown of proposal 2","option_c":"markdown of proposal 3","status":"draft"}. Never
            invent figures or give legal/visa advice as fact.'
        orchestration:
          type: dag
          entry: research
          nodes:
          - id: research
            crew: researcher
          - id: compose
            crew: composer
          edges:
          - from: research
            to: compose
    goalTemplate: 'Prepare three itinerary proposals for this request (id {record.id}).

      Traveler email: {record.email}

      Destination/region: {record.destination}

      Dates: {record.date_from} - {record.date_to}

      People: {record.people}

      Budget (EUR): {record.budget}

      Interests: {record.interests}

      Pace: {record.pace}

      Notes: {record.notes}

      Today is {date}. Language: {lang}.'
    output: markdown+json
    resultSchema:
      type: object
      properties:
        request_id:
          type: string
        traveler_email:
          type: string
        destination:
          type: string
        zone:
          type: string
        expert_email:
          type: string
        option_a:
          type: string
        option_b:
          type: string
        option_c:
          type: string
        status:
          type: string
    writesTo:
      collection: proposals
      parse: json_last
      keyBy: request_id
    appTools:
    - name: read_experts
      description: List the registered local experts with their zones
      action: read
      collection: experts
      scope: all
    - name: osm_overpass
      description: 'OpenStreetMap Overpass API: pass the Overpass QL query in `query` as data=<ql>'
      action: http
      http:
        method: GET
        url: https://overpass-api.de/api/interpreter
        attribution: © OpenStreetMap contributors, ODbL
    - name: osm_geocode
      description: 'Nominatim geocoding: query like q=<place>&format=json&limit=3'
      action: http
      http:
        method: GET
        url: https://nominatim.openstreetmap.org/search
        attribution: © OpenStreetMap contributors, ODbL
    - name: wikidata_sparql
      description: 'Wikidata SPARQL: query like query=<SPARQL>&format=json'
      action: http
      http:
        method: GET
        url: https://query.wikidata.org/sparql
        attribution: Wikidata, CC0
    limits:
      maxTurns: 40
      maxBudgetUsd: 1.5
      timeoutSeconds: 900
  data:
    collections:
    - name: requests
      ownedBy: org
      description: Trip requests sent by travelers (also without an account)
      retentionDays: 730
      fields:
      - name: email
        type: email
        required: true
        label:
          it: La tua email
          en: Your email
      - name: destination
        type: text
        required: true
        label:
          it: Destinazione o regione
          en: Destination or region
      - name: date_from
        type: date
        required: true
        label:
          it: Dal
          en: From
      - name: date_to
        type: date
        required: true
        label:
          it: Al
          en: To
      - name: people
        type: number
        required: true
        label:
          it: Numero di persone
          en: Number of people
      - name: budget
        type: number
        required: true
        label:
          it: Budget totale (EUR)
          en: Total budget (EUR)
      - name: interests
        type: multiselect
        required: true
        label:
          it: Interessi
          en: Interests
        options:
        - value: food_wine
          label:
            it: Enogastronomia
            en: Food & wine
        - value: art
          label:
            it: Arte
            en: Art
        - value: nature
          label:
            it: Natura
            en: Nature
        - value: sport
          label:
            it: Sport
            en: Sport
      - name: pace
        type: select
        required: true
        label:
          it: Ritmo
          en: Pace
        options:
        - value: relaxed
          label:
            it: Rilassato
            en: Relaxed
        - value: balanced
          label:
            it: Equilibrato
            en: Balanced
        - value: intense
          label:
            it: Intenso
            en: Intense
      - name: notes
        type: textarea
        maxLength: 800
        label:
          it: Note (facoltative)
          en: Notes (optional)
      access:
      - role: user
        where:
          email: '{user.email}'
        can:
        - read
    - name: experts
      ownedBy: org
      description: Registered local experts and their zones (managed by the admins)
      fields:
      - name: name
        type: text
        required: true
      - name: email
        type: email
        required: true
      - name: zones
        type: text
        required: true
        help:
          it: Regioni/zone coperte, separate da virgola
          en: Covered regions/areas, comma separated
      - name: languages
        type: text
      - name: bio
        type: textarea
    - name: proposals
      ownedBy: org
      description: The three itinerary proposals of a request, reviewed by the local expert
      retentionDays: 730
      fields:
      - name: request_id
        type: text
      - name: traveler_email
        type: email
      - name: expert_email
        type: email
      - name: destination
        type: text
      - name: zone
        type: text
      - name: option_a
        type: textarea
        label:
          it: Proposta A
          en: Proposal A
      - name: option_b
        type: textarea
        label:
          it: Proposta B
          en: Proposal B
      - name: option_c
        type: textarea
        label:
          it: Proposta C
          en: Proposal C
      - name: expert_notes
        type: textarea
        label:
          it: Consigli personali dell'esperto
          en: Expert's personal tips
      - name: trusted_places
        type: textarea
        label:
          it: Strutture di fiducia
          en: Trusted places
      - name: status
        type: select
        label:
          it: Stato
          en: Status
        options:
        - value: draft
          label:
            it: In revisione
            en: In review
        - value: approved
          label:
            it: Approvata
            en: Approved
        - value: chosen
          label:
            it: Scelta
            en: Chosen
        - value: confirmed
          label:
            it: Confermata
            en: Confirmed
      - name: chosen
        type: select
        label:
          it: Proposta scelta
          en: Chosen proposal
        options:
        - A
        - B
        - C
      - name: change_request
        type: textarea
        label:
          it: Richieste di modifica
          en: Change requests
      - name: expert_reply
        type: textarea
        label:
          it: Risposta dell'esperto
          en: Expert's reply
      - name: deposit_eur
        type: number
        label:
          it: Acconto (EUR)
          en: Deposit (EUR)
      access:
      - role: expert
        where:
          expert_email: '{user.email}'
        can:
        - read
        - write
      - role: user
        where:
          traveler_email: '{user.email}'
        can:
        - read
        - write
  views:
  - key: home
    type: page
    nav: false
    title: ViaggioSartoriale
    sections:
    - type: hero
      layout: stack
      band: true
      eyebrow:
        it: Viaggi su misura
        en: Tailor-made trips
      title:
        it: Il tuo viaggio, **disegnato con un esperto locale**.
        en: Your trip, **designed with a local expert**.
      text:
        it: 'Raccontaci destinazione, date e interessi: ricevi via email tre proposte di itinerario riviste e approvate da
          chi vive il territorio, entro 24 ore.'
        en: 'Tell us destination, dates and interests: within 24 hours you get by email three itinerary proposals reviewed
          and approved by someone who knows the place.'
      actions:
      - label:
          it: Richiedi un viaggio
          en: Request a trip
        href: /v/request
        style: primary
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Compili il modulo
          en: Fill in the form
        text:
          it: 'Anche senza account: destinazione, date, persone, budget, interessi e ritmo.'
          en: 'No account needed: destination, dates, people, budget, interests and pace.'
        badge: 📝
      - title:
          it: Tre proposte
          en: Three proposals
        text:
          it: Una squadra di agenti prepara tre itinerari diversi; un esperto locale li rivede e aggiunge consigli e indirizzi
            di fiducia.
          en: A team of agents prepares three different itineraries; a local expert reviews them and adds tips and trusted
            places.
        badge: 🗺️
      - title:
          it: Scegli e conferma
          en: Choose and confirm
        text:
          it: Ricevi l'email, scegli una proposta, chiedi modifiche all'esperto e versa l'acconto con carta.
          en: Get the email, pick a proposal, ask the expert for changes and pay the deposit by card.
        badge: 💳
    - type: cards
      id: fonti
      title:
        it: Fonti aperte
        en: Open sources
      items:
      - title: OpenStreetMap
        text:
          it: Luoghi e distanze (licenza ODbL).
          en: Places and distances (ODbL).
      - title: Wikidata
        text:
          it: Luoghi di interesse ed eventi (CC0).
          en: Points of interest and events (CC0).
      - title:
          it: Enti turistici
          en: Tourism boards
        text:
          it: Open data ufficiali. Nessun dato di agenzie di viaggio online.
          en: Official open data. No online travel agency data.
    - type: note
      content:
        it: Le stime di costo sono indicative. L'acconto è versato a ViaggioSartoriale; l'esperto riceve la sua parte, al
          netto della commissione.
        en: Cost figures are estimates. The deposit is paid via ViaggioSartoriale; the expert receives their share net of
          our commission.
  - key: request
    type: form
    title:
      it: Richiedi un viaggio
      en: Request a trip
    collection: requests
    submit:
      label:
        it: Invia la richiesta
        en: Send request
      message:
        it: Grazie! Riceverai le tre proposte via email entro 24 ore.
        en: Thank you! You will get the three proposals by email within 24 hours.
  - key: my_requests
    type: table
    title:
      it: Le mie richieste
      en: My requests
    source: collection:requests
    columns:
    - destination
    - date_from
    - date_to
    - people
    - budget
    roles:
    - user
    - admin
  - key: trips
    type: table
    title:
      it: Proposte di viaggio
      en: Trip proposals
    source: collection:proposals
    columns:
    - destination
    - traveler_email
    - expert_email
    - status
    - chosen
    roles:
    - user
    - expert
    - admin
    export: true
  - key: review
    type: form
    title:
      it: Revisione / scelta
      en: Review / choose
    collection: proposals
    edit: true
    nav: false
    roles:
    - user
    - expert
    - admin
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Salvato.
        en: Saved.
      redirect: trips
  - key: expert_admin
    type: form
    title:
      it: Esperti
      en: Experts
    collection: experts
    roles:
    - admin
    submit:
      label:
        it: Aggiungi esperto
        en: Add expert
      message:
        it: Esperto registrato.
        en: Expert registered.
  - key: experts_list
    type: table
    title:
      it: Elenco esperti
      en: Expert list
    source: collection:experts
    columns:
    - name
    - email
    - zones
    - languages
    roles:
    - admin
  - key: all_requests
    type: table
    title:
      it: Tutte le richieste
      en: All requests
    source: collection:requests
    columns:
    - email
    - destination
    - date_from
    - date_to
    - people
    - budget
    roles:
    - admin
    export: true
  triggers:
  - key: plan_request
    'on':
      collection: requests
      op: insert
    start:
      agent: planner
    asUser: false
    goal: 'Prepare three itinerary proposals for request {record.id}: traveler {record.email}, destination {record.destination},
      {record.date_from} to {record.date_to}, {record.people} people, budget {record.budget} EUR, interests {record.interests},
      pace {record.pace}, notes {record.notes}.'
  - key: expert_assigned
    'on':
      collection: proposals
      op: insert
    notify:
      to:
      - record.expert_email
      - admins
      subject:
        it: 'Nuove proposte da rivedere: {record.destination}'
        en: 'New proposals to review: {record.destination}'
      body:
        it: Ci sono tre proposte di itinerario per {record.destination} da rivedere. Aggiungi i tuoi consigli e le strutture
          di fiducia, poi approva entro 24 ore.
        en: Three itinerary proposals for {record.destination} are waiting for your review. Add your tips and trusted places,
          then approve within 24 hours.
      link: trips
  - key: proposals_approved
    'on':
      collection: proposals
      op: update
      where:
        status: approved
    notify:
      to:
      - record.traveler_email
      subject:
        it: 'Le tue tre proposte di viaggio: {record.destination}'
        en: 'Your three trip proposals: {record.destination}'
      body:
        it: Le tre proposte per {record.destination}, riviste dal nostro esperto locale, sono pronte. Accedi con questa email
          per sceglierne una e chiedere modifiche.
        en: The three proposals for {record.destination}, reviewed by our local expert, are ready. Sign in with this email
          to pick one and ask for changes.
      link: trips
  - key: proposal_chosen
    'on':
      collection: proposals
      op: update
      where:
        status: chosen
    notify:
      to:
      - record.expert_email
      subject:
        it: 'Il viaggiatore ha scelto una proposta: {record.destination}'
        en: 'The traveler chose a proposal: {record.destination}'
      body:
        it: Il viaggiatore ha scelto la proposta {record.chosen}. Controlla le richieste di modifica e rispondi.
        en: The traveler chose proposal {record.chosen}. Check the change requests and reply.
      link: trips
  - key: trip_confirmed
    'on':
      collection: proposals
      op: update
      where:
        status: confirmed
    notify:
      to:
      - record.traveler_email
      - record.expert_email
      subject:
        it: 'Viaggio confermato: {record.destination}'
        en: 'Trip confirmed: {record.destination}'
      body:
        it: Il viaggio per {record.destination} è confermato e l'acconto è stato ricevuto.
        en: The trip to {record.destination} is confirmed and the deposit has been received.
      link: trips
  billing:
    modes:
    - per_transaction
    currency: eur
    transactionFeePct: 15
    sellers: collection:experts
  extensions:
  - key: expert_chat
    description: 'A live chat between traveler and human expert is not available yet: change requests and replies go through
      the change_request and expert_reply fields of the proposal, with email notifications.'
  - key: deposit_checkout
    description: The card deposit on confirmation and the payout to the expert (via Stripe Connect on the experts' accounts)
      must be wired in the studio; the expert must connect their payout account.
