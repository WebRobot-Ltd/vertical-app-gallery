apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: shoppilot
  displayName: ShopPilot
  tagline:
    it: Il CRM marketing del tuo e-commerce, guidato da un agente AI.
    en: The marketing CRM for your online store, run by an AI agent.
  description:
    it: 'Collega Shopify o WooCommerce: ShopPilot importa clienti, ordini e catalogo e ogni lunedì propone un piano di campagne
      email e WhatsApp. Tu approvi, modifichi o rifiuti: niente parte senza il tuo via libera.'
    en: 'Connect Shopify or WooCommerce: ShopPilot imports customers, orders and catalog and every Monday proposes a plan
      of email and WhatsApp campaigns. You approve, edit or reject: nothing is sent without your approval.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: dashboard
  branding:
    theme: light
    palette:
      primary: '#16324f'
      accent: '#e4572e'
      background: '#f7f9fb'
      foreground: '#17212b'
    fonts:
      body: Inter
      display: Manrope
    wordmark:
    - text: Shop
      color: primary
    - text: Pilot
      color: accent
    width: wide
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Funzioni
        en: Features
      href: '#funzioni'
    - label:
        it: Assistente
        en: Assistant
      href: '#assistente'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
      - chat_public
      agents:
      - assistant
    roles:
    - key: admin
      label:
        it: Titolare
        en: Owner
      assignedBy: admin_emails
    - key: user
      label:
        it: Collaboratore
        en: Team member
      assignedBy: signup
  limits:
  - action: chat
    per: ip
    max: 30
    window: hour
    roles:
    - anonymous
  - action: agent:importer
    per: org
    max: 6
    window: day
  agents:
  - key: importer
    role: setup
    description: Imports customers, orders and catalog from Shopify or WooCommerce into the app's collections, with marketing
      consent flags.
    profile:
      inline:
        display_name: ShopPilot importer
        crews:
        - id: importer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: You import e-commerce data for a shop. Using the WebRobot MCP and the shop credentials the owner
            connected, build and run the ETL that reads customers, orders (with line items) and the product catalog from the
            given platform (Shopify or WooCommerce), then store them with the app tools write_customers, write_orders, write_products.
            Always carry over each customer's marketing consent per channel (email, whatsapp) exactly as the shop reports
            it; if consent is unknown, set it to false. Never invent records. Finish with a Markdown report starting with
            a level-1 title '# Import — <shop>' with counts imported, counts with email consent and WhatsApp consent, and
            any problems.
    appTools:
    - name: write_customers
      description: Upsert customers
      action: write
      collection: customers
      scope: all
    - name: write_orders
      description: Upsert orders
      action: write
      collection: orders
      scope: all
    - name: write_products
      description: Upsert products
      action: write
      collection: products
      scope: all
    goalTemplate: 'Platform: {platform_label}

      Shop URL: {shop_url}

      {?note}Notes: {note}{/note}

      Import customers, orders and catalog. Date: {date}. Write the report in the language with ISO code {lang}.'
    output: markdown
    limits:
      maxTurns: 40
      maxBudgetUsd: 1.5
  - key: planner
    role: scheduled
    description: Every Monday proposes the weekly campaign plan; every campaign is a proposal awaiting owner approval.
    profile:
      inline:
        display_name: ShopPilot weekly planner
        crews:
        - id: planner
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 20
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the marketing strategist of an online store. Using read_customers, read_orders, read_products
            and read_reports, propose the plan for the coming week: 3 to 6 campaigns, each on channel email or whatsapp. For
            each campaign give: a name, the segment as a plain-language rule (e.g. ''bought shoes in the last 90 days, no
            repurchase'') with estimated size computed from real data, 3-5 catalog products with their real names and prices,
            a message text in the shop''s language (WhatsApp short, email with subject), goal and expected rationale. HARD
            RULES: only customers with the consent flag for that channel are in a segment; exclude those without consent and
            mention how many were excluded; every campaign has status ''proposed'' — you never send or approve anything; never
            invent figures or products not in the catalog; no misleading urgency. Output: a Markdown summary starting with
            ''# Piano settimanale — <date>'' then, at the end, one JSON object in a fenced block: {"week":"YYYY-MM-DD","campaigns":[{"id":"<week>-<n>","name":"","kind":"campaign","channel":"email|whatsapp","segment":"","audience_size":0,"products":[""],"subject":"","message":"","rationale":"","status":"proposed"}]}'
    appTools:
    - name: read_customers
      description: Read customers with consent flags
      action: search
      collection: customers
      scope: all
    - name: read_orders
      description: Read orders
      action: search
      collection: orders
      scope: all
    - name: read_products
      description: Read catalog
      action: search
      collection: products
      scope: all
    - name: read_reports
      description: Read past weekly revenue reports
      action: read
      collection: weekly_reports
      scope: all
    goalTemplate: Today is {date}. Prepare the weekly marketing plan. Write texts in the language with ISO code {lang}.
    output: markdown+json
    writesTo:
      collection: plans
      parse: json_last
      keyBy: week
    limits:
      maxTurns: 20
      maxBudgetUsd: 1.0
  - key: flows
    role: scheduled
    description: 'Daily: prepares messages for the automatic flows (abandoned cart, post-purchase, repurchase) for approved
      flow templates.'
    profile:
      inline:
        display_name: ShopPilot automation flows
        crews:
        - id: flows
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You manage three automatic flows for an online store: abandoned cart (cart left 1-24h ago, not purchased),
            post-purchase (thank-you and usage tips 3-7 days after delivery, review request) and repurchase (customers whose
            typical reorder interval has elapsed). Use read_customers, read_orders, read_products and read_campaigns. A flow
            may only send to customers with the channel''s marketing consent, and only if the owner has an APPROVED campaign
            of kind ''flow'' with the same flow name; if no approved template exists, propose one (status ''proposed'') and
            send nothing. Never invent customers, orders or products. Output a Markdown summary starting with ''# Flussi —
            <date>'' and then a fenced JSON {"date":"YYYY-MM-DD","flows":[{"id":"<date>-<flow>","name":"","kind":"flow","flow":"abandoned_cart|post_purchase|repurchase","channel":"email|whatsapp","segment":"","audience_size":0,"products":[""],"subject":"","message":"","rationale":"","status":"proposed"}]}'
    appTools:
    - name: read_customers
      description: Read customers with consent flags
      action: search
      collection: customers
      scope: all
    - name: read_orders
      description: Read orders and carts
      action: search
      collection: orders
      scope: all
    - name: read_products
      description: Read catalog
      action: search
      collection: products
      scope: all
    - name: read_campaigns
      description: Read approved campaigns and flow templates
      action: search
      collection: plans
      scope: all
    goalTemplate: Today is {date}. Run the daily check of the automatic flows. Language ISO code {lang}.
    output: markdown+json
    writesTo:
      collection: plans
      parse: json_last
      keyBy: date
    limits:
      maxTurns: 15
      maxBudgetUsd: 0.6
  - key: reporter
    role: scheduled
    description: Weekly revenue report by campaign.
    profile:
      inline:
        display_name: ShopPilot revenue reporter
        crews:
        - id: reporter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write the weekly revenue report of an online store''s marketing. Using read_orders and read_campaigns,
            attribute revenue of the last 7 days to campaigns that were actually sent (orders carrying a campaign id or placed
            within 7 days of a send by a recipient); say clearly when attribution is approximate. Never invent figures. Structure:
            ''# Ricavi per campagna — settimana del <date>'' then ## Sintesi (total revenue, share from campaigns, orders),
            ## Per campagna (table: campaign, channel, sent, orders, revenue), ## Cosa ha funzionato / cosa no, ## Suggerimenti
            per la prossima settimana. Add a chart block ```chart {"type":"bar","title":"Revenue per campaign","labels":[...],"series":[{"name":"Revenue","values":[...]}],"unit":"EUR"}
            ``` with real numbers. End with a JSON fenced block {"week":"YYYY-MM-DD","total_revenue":0,"campaign_revenue":0,"orders":0}.'
    appTools:
    - name: read_orders
      description: Read orders
      action: search
      collection: orders
      scope: all
    - name: read_campaigns
      description: Read campaigns and their status
      action: search
      collection: plans
      scope: all
    goalTemplate: Today is {date}. Write the weekly revenue report. Language ISO code {lang}.
    output: markdown+json
    writesTo:
      collection: weekly_reports
      parse: json_last
      keyBy: week
    limits:
      maxTurns: 15
      maxBudgetUsd: 0.6
  - key: assistant
    role: helper
    description: Answers shoppers on the site and WhatsApp about orders, shipping, returns and product advice.
    profile:
      inline:
        display_name: ShopPilot customer assistant
        chat_mode: true
        crews:
        - id: assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the friendly customer assistant of an online store. Help with order status, shipping, returns
            and product recommendations. Use find_product to recommend from the real catalog and lookup_order only after the
            shopper gives the order number AND the email on the order; reveal nothing else and never show other customers''
            data. Never invent stock, delivery dates, prices or policies: if you do not know, say so and offer to pass the
            question to the shop team. Do not promise refunds; explain the return policy only as stored. Do not send marketing;
            if asked to unsubscribe, say the request is passed to the team. Reply briefly, in the shopper''s language.'
    appTools:
    - name: find_product
      description: Search the catalog
      action: search
      collection: products
      scope: all
    - name: lookup_order
      description: Find one order by number and email
      action: search
      collection: orders
      scope: all
    goalTemplate: 'Conversation so far:

      {history}


      New message from the shopper: {message}'
    output: markdown
  inputForm:
    title:
      it: Collega il tuo shop
      en: Connect your shop
    fields:
    - name: platform
      type: select
      required: true
      label:
        it: Piattaforma
        en: Platform
      options:
      - value: shopify
        label: Shopify
      - value: woocommerce
        label: WooCommerce
    - name: shop_url
      type: url
      required: true
      label:
        it: Indirizzo dello shop
        en: Shop URL
    - name: note
      type: textarea
      maxLength: 400
      label:
        it: Note (facoltative)
        en: Notes (optional)
  collections:
  - name: customers
    ownedBy: org
    description: Shop customers
    fields:
    - name: email
      type: email
    - name: name
      type: text
    - name: phone
      type: text
    - name: consent_email
      type: boolean
    - name: consent_whatsapp
      type: boolean
    - name: total_spent
      type: number
    - name: last_order_at
      type: date
  - name: orders
    ownedBy: org
    fields:
    - name: number
      type: text
    - name: customer_email
      type: email
    - name: total
      type: number
    - name: status
      type: text
    - name: items
      type: json
    - name: campaign_id
      type: text
    - name: placed_at
      type: date
  - name: products
    ownedBy: org
    fields:
    - name: name
      type: text
    - name: category
      type: text
    - name: price
      type: number
    - name: stock
      type: number
    - name: url
      type: url
  - name: plans
    ownedBy: org
    description: Proposed campaigns and flows awaiting approval
    fields:
    - name: name
      type: text
    - name: kind
      type: select
      options:
      - campaign
      - flow
    - name: channel
      type: select
      options:
      - email
      - whatsapp
    - name: segment
      type: textarea
    - name: audience_size
      type: number
    - name: products
      type: json
    - name: subject
      type: text
    - name: message
      type: textarea
    - name: rationale
      type: textarea
    - name: status
      type: select
      options:
      - proposed
      - approved
      - rejected
      - sent
  - name: weekly_reports
    ownedBy: org
    fields:
    - name: week
      type: date
    - name: total_revenue
      type: number
    - name: campaign_revenue
      type: number
    - name: orders
      type: number
  credentials:
  - provider: shopify
    label: Shopify
    kind: api_key
    scope: org
  - provider: woocommerce
    label: WooCommerce
    kind: api_key
    scope: org
  views:
  - key: home
    type: page
    title: ShopPilot
    nav: false
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow:
        it: CRM marketing con agente AI
        en: AI-agent marketing CRM
      title:
        it: Ogni lunedì un **piano di campagne** pronto da approvare.
        en: Every Monday a **campaign plan** ready to approve.
      text:
        it: 'Collega Shopify o WooCommerce. ShopPilot propone campagne email e WhatsApp con segmenti, prodotti e testi. Tu
          decidi: niente parte senza la tua approvazione.'
        en: 'Connect Shopify or WooCommerce. ShopPilot proposes email and WhatsApp campaigns with segments, products and copy.
          You decide: nothing is sent without your approval.'
      actions:
      - label:
          it: Inizia
          en: Get started
        href: /login
        style: primary
      - label:
          it: Come funziona
          en: How it works
        href: '#come-funziona'
        style: ghost
      aside: '<div style="padding:16px"><strong>Lunedì · Monday</strong><p>Riacquisto scarpe · Shoes repurchase</p><p>Segmento:
        acquisto scarpe negli ultimi 90 giorni, nessun riacquisto — 214 clienti con consenso WhatsApp</p><p><strong>In attesa
        di approvazione · Awaiting approval</strong></p></div>'
      note:
        it: Abbonamento mensile per negozio.
        en: Monthly subscription per store.
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Collega lo shop
          en: Connect your shop
        text:
          it: Importiamo clienti, ordini, catalogo e il consenso marketing di ogni cliente.
          en: We import customers, orders, catalog and each customer's marketing consent.
        badge: 🔌
      - title:
          it: Rivedi il piano
          en: Review the plan
        text:
          it: Ogni lunedì l'agente propone campagne, segmenti, prodotti e testi. Approvi, modifichi o rifiuti.
          en: Every Monday the agent proposes campaigns, segments, products and copy. You approve, edit or reject.
        badge: ✅
      - title:
          it: Misura i ricavi
          en: Measure revenue
        text:
          it: Report settimanale dei ricavi per campagna.
          en: Weekly revenue report per campaign.
        badge: 📈
    - type: cards
      id: funzioni
      title:
        it: Funzioni
        en: Features
      items:
      - title:
          it: Solo con consenso
          en: Consent only
        text:
          it: I messaggi marketing escludono chi non ha dato il consenso sul canale.
          en: Marketing messages exclude anyone without consent on that channel.
        badge: 🔒
      - title:
          it: Flussi automatici
          en: Automatic flows
        text:
          it: Carrello abbandonato, post-acquisto e riacquisto, con modelli approvati da te.
          en: Abandoned cart, post-purchase and repurchase, using templates you approve.
        badge: 🔁
      - title:
          it: Email e WhatsApp
          en: Email and WhatsApp
        text:
          it: Testi pronti per entrambi i canali, con prodotti reali del catalogo.
          en: Copy ready for both channels, with real catalog products.
        badge: 💬
    - type: text
      id: assistente
      title:
        it: Assistente per i tuoi clienti
        en: Assistant for your customers
      content:
        it: Risponde su ordini, spedizioni, resi e consigli di prodotto, sul sito e su WhatsApp.
        en: Answers about orders, shipping, returns and product advice, on your site and WhatsApp.
    - type: view
      view: chat_public
    - type: note
      content:
        it: ShopPilot · powered by WebRobot. Gli invii richiedono sempre l'approvazione del titolare e il consenso del destinatario.
        en: ShopPilot · powered by WebRobot. Sends always require owner approval and recipient consent.
  - key: chat_public
    type: chat
    title:
      it: Assistente
      en: Assistant
    source: agent:assistant
    examples:
    - it: Dov'è il mio ordine?
      en: Where is my order?
    - it: Come faccio un reso?
      en: How do I return an item?
    - it: Che scarpe mi consigli per camminare?
      en: Which shoes do you recommend for walking?
    placeholder:
      it: Scrivi un messaggio…
      en: Write a message…
    nav: false
  - key: setup
    type: new_run
    title:
      it: Collega lo shop
      en: Connect shop
    roles:
    - admin
  - key: imports
    type: history
    title:
      it: Importazioni
      en: Imports
    source: run
    roles:
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: approvals
    type: review
    title:
      it: Campagne da approvare
      en: Campaigns to approve
    source: collection:plans
    roles:
    - admin
    data:
      display: cards
      fields:
      - key: name
        label:
          it: Campagna
          en: Campaign
      - key: channel
        label:
          it: Canale
          en: Channel
        format: badge
      - key: segment
        label:
          it: Segmento
          en: Segment
      - key: audience_size
        label:
          it: Destinatari
          en: Recipients
        format: number
      - key: subject
        label:
          it: Oggetto
          en: Subject
      - key: message
        label:
          it: Messaggio
          en: Message
      - key: status
        label: Status
        format: badge
      sort:
        field: week
        dir: desc
      limit: 50
      empty:
        it: 'Nessuna campagna: il prossimo piano arriva lunedì.'
        en: 'No campaigns yet: the next plan arrives on Monday.'
  - key: revenue
    type: dashboard
    title:
      it: Ricavi
      en: Revenue
    children:
    - revenue_table
    roles:
    - admin
    - user
  - key: revenue_table
    type: chart
    source: collection:weekly_reports
    nav: false
    data:
      display: chart
      chart: bar
      fields:
      - key: week
        label:
          it: Settimana
          en: Week
        format: date
      - key: total_revenue
        label:
          it: Ricavi totali
          en: Total revenue
      - key: campaign_revenue
        label:
          it: Da campagne
          en: From campaigns
      sort:
        field: week
        dir: asc
      limit: 26
  - key: assistant_chat
    type: chat
    title:
      it: Prova l'assistente
      en: Try the assistant
    source: agent:assistant
    roles:
    - admin
    - user
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - admin
  schedules:
  - agent: planner
    action: run
    cron: 0 6 * * 1
    owner: app
  - agent: reporter
    action: run
    cron: 0 5 * * 1
    owner: app
  - agent: flows
    action: run
    cron: 0 8 * * *
    owner: app
  notifications:
    emailOnRunDone: true
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: shop_monthly
      price: 49
      interval: month
      label:
        it: ShopPilot — per negozio
        en: ShopPilot — per store
      includes:
      - weekly plan
      - automatic flows
      - customer assistant
      - weekly revenue report
      roles:
      - admin
