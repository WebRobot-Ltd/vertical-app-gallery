apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: shoppilot
  displayName: ShopPilot
  tagline:
    it: Il CRM marketing del tuo e-commerce, guidato da un agente AI.
    en: The marketing CRM for your online shop, run by an AI agent.
  description:
    it: Collega Shopify, ogni lunedì ricevi un piano di campagne per segmenti di clienti con consenso, approvi tu, niente
      parte senza il tuo via libera.
    en: Connect Shopify, get a weekly campaign plan for consented customer segments every Monday. You approve; nothing goes
      out without your OK.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#16324f'
      accent: '#e4572e'
      background: '#fbf9f6'
      foreground: '#1c2430'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Shop
      color: primary
    - text: Pilot
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#how'
    - label:
        it: Prezzi
        en: Pricing
      href: '#pricing'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  limits:
  - action: chat
    per: user
    max: 200
    window: day
    roles:
    - user
  agents:
  - key: planner
    role: main
    description: Syncs the shop, proposes the weekly campaign plan and the revenue report; drafts automatic flows. Sends nothing
      without approval.
    memory: user
    awaits:
    - campaign_ok
    profile:
      inline:
        display_name: ShopPilot planner
        crews:
        - id: planner
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the marketing CRM manager of one online shop. Steps: 1) If the shop is connected, import
            recent customers, orders and products with shop_customers, shop_orders, shop_products and store them with save_customer,
            save_order, save_product (keep the marketing consent flag exactly as the shop reports it; if unknown, consent=false).
            If not connected, say so and work with stored data. 2) Read the stored customers, orders, products. 3) Propose
            3-6 campaigns for the week (email or whatsapp), each with: a segment described in words and as a rule (e.g. bought
            shoes in the last 90 days, no reorder), the number of consented customers it reaches, 1-3 products from the catalogue,
            and the message text (short, in the customer language, with an opt-out line). Also cover the flows: abandoned
            cart, post-purchase, reorder. 4) Save each campaign with save_campaign (status ''proposed'') and ask the owner
            with request_campaign_ok; never mark a campaign as approved yourself. HARD RULE: only customers with consent=true
            may be counted or targeted; never invent customers, figures or products. 5) Final report starts with ''# Piano
            settimanale — <date>'' (or ''# Weekly plan — <date>'' in English). Sections: ## Revenue by campaign last week
            (from orders with a campaign field; add a ```chart block with bar type, real figures only), ## Proposed campaigns
            (table), ## Notes. For a single-event goal (abandoned cart of one record) draft only that one message and save
            it as ''proposed''.'
          mcp_servers: []
    appTools:
    - name: shop_customers
      description: List customers of the connected Shopify shop
      action: http
      http:
        method: GET
        url: https://{host}/admin/api/2025-01/customers.json
        allowPath: false
        credential:
          provider: shopify
          header: X-Shopify-Access-Token
          format: '{secret}'
    - name: shop_orders
      description: List orders of the connected Shopify shop
      action: http
      http:
        method: GET
        url: https://{host}/admin/api/2025-01/orders.json
        allowPath: false
        credential:
          provider: shopify
          header: X-Shopify-Access-Token
          format: '{secret}'
    - name: shop_products
      description: List products of the connected Shopify shop
      action: http
      http:
        method: GET
        url: https://{host}/admin/api/2025-01/products.json
        allowPath: false
        credential:
          provider: shopify
          header: X-Shopify-Access-Token
          format: '{secret}'
    - name: save_customer
      description: Store a customer
      action: write
      collection: customers
      scope: user
    - name: save_order
      description: Store an order
      action: write
      collection: orders
      scope: user
    - name: save_product
      description: Store a catalogue product
      action: write
      collection: products
      scope: user
    - name: save_campaign
      description: Store a proposed campaign
      action: write
      collection: campaigns
      scope: user
    - name: read_customers
      description: Read stored customers
      action: read
      collection: customers
      scope: user
    - name: read_orders
      description: Read stored orders
      action: read
      collection: orders
      scope: user
    - name: read_products
      description: Read stored catalogue
      action: read
      collection: products
      scope: user
    - name: read_campaigns
      description: Read past campaigns
      action: read
      collection: campaigns
      scope: user
    goalTemplate: Prepare the weekly plan for the shop. Today is {date}. Write in the language with ISO code {lang}.
    output: markdown
    limits:
      maxTurns: 40
      maxBudgetUsd: 1.5
  - key: assistant
    role: helper
    description: Answers customers' questions about orders, shipping, returns and product advice.
    profile:
      inline:
        display_name: ShopPilot assistant
        crews:
        - id: assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You are the customer-care assistant of an online shop. Answer on order status, shipping, returns
            and product advice, in the language of the customer. Look up orders with shop_orders and the catalogue with read_products.
            Ask for the order number and email before giving order details. Never invent tracking data, prices or policies;
            if you do not know, say a human will follow up. Never promise refunds. Be brief and friendly.
    appTools:
    - name: shop_orders
      description: List orders of the connected Shopify shop
      action: http
      http:
        method: GET
        url: https://{host}/admin/api/2025-01/orders.json
        allowPath: false
        credential:
          provider: shopify
          header: X-Shopify-Access-Token
          format: '{secret}'
    - name: read_products
      description: Read stored catalogue
      action: read
      collection: products
      scope: user
    goalTemplate: 'Conversation so far:

      {history}

      New customer message: {message}

      Reply in the language with ISO code {lang}.'
    output: markdown
  templates:
  - key: weekly_plan
    title:
      it: Piano settimanale
      en: Weekly plan
    description:
      it: Ogni lunedì un piano di campagne da approvare e il report ricavi.
      en: Every Monday a campaign plan to approve plus the revenue report.
    agent: planner
    params:
    - name: tone
      type: select
      required: true
      label:
        it: Tono dei messaggi
        en: Message tone
      options:
      - value: friendly
        label:
          it: Amichevole
          en: Friendly
      - value: premium
        label:
          it: Premium
          en: Premium
      - value: direct
        label:
          it: Diretto
          en: Direct
    - name: focus
      type: textarea
      maxLength: 400
      label:
        it: Obiettivi o vincoli (facoltativo)
        en: Goals or constraints (optional)
    goal: 'Weekly plan "{instance}". Tone: {tone}. {?focus}Owner notes: {focus}{/focus} Today is {date}. Write in the language
      with ISO code {lang}.'
    schedule:
      cron: 0 6 * * 1
      userCanChange: true
    maxPerUser: 1
    deliver:
      to: owner
      onlyIfNew: true
  inputForm:
    title:
      it: Piano ora
      en: Plan now
    fields:
    - name: note
      type: textarea
      maxLength: 400
      label:
        it: Note (facoltative)
        en: Notes (optional)
  approvals:
  - key: campaign_ok
    title:
      it: Approva campagna
      en: Approve campaign
    decidedBy: requester
    fields:
    - title
    - channel
    - segment
    - message
    timeoutMinutes: 10080
    onTimeout: reject
  triggers:
  - key: cart_in
    'on':
      webhook: true
    write:
      collection: abandoned_carts
      fields:
        email: email
        items: items
        total: total
        cart_url: cart_url
  - key: cart_flow
    'on':
      collection: abandoned_carts
      op: insert
    start:
      agent: planner
    goal: 'Abandoned cart flow: draft ONE recovery message for the cart of {record.email} (items {record.items}, total {record.total},
      link {record.cart_url}) only if that customer has consent=true in the stored customers; otherwise do nothing. Save it
      as a proposed campaign and ask for approval. Language ISO {lang}.'
    asUser: true
  data:
    collections:
    - name: customers
      ownedBy: user
      description: Shop customers with marketing consent
      fields:
      - name: email
        type: email
        required: true
      - name: name
        type: text
      - name: consent
        type: boolean
        default: false
      - name: consent_channels
        type: multiselect
        options:
        - email
        - whatsapp
      - name: orders_count
        type: number
      - name: total_spent
        type: number
      - name: last_order_date
        type: date
      - name: tags
        type: text
      retentionDays: 730
    - name: orders
      ownedBy: user
      fields:
      - name: order_number
        type: text
        required: true
      - name: email
        type: email
      - name: date
        type: date
      - name: total
        type: number
      - name: items
        type: text
      - name: status
        type: text
      - name: campaign
        type: text
      retentionDays: 730
    - name: products
      ownedBy: user
      fields:
      - name: sku
        type: text
      - name: name
        type: text
        required: true
      - name: category
        type: text
      - name: price
        type: number
      - name: url
        type: url
    - name: campaigns
      ownedBy: user
      fields:
      - name: title
        type: text
        required: true
        label:
          it: Titolo
          en: Title
      - name: channel
        type: select
        options:
        - email
        - whatsapp
        label:
          it: Canale
          en: Channel
      - name: segment
        type: textarea
        label:
          it: Segmento
          en: Segment
      - name: audience_size
        type: number
      - name: products
        type: text
        label:
          it: Prodotti
          en: Products
      - name: message
        type: textarea
        label:
          it: Messaggio
          en: Message
      - name: status
        type: select
        options:
        - proposed
        - approved
        - rejected
        - sent
      - name: revenue
        type: number
      - name: week
        type: date
    - name: abandoned_carts
      ownedBy: user
      fields:
      - name: email
        type: email
      - name: items
        type: text
      - name: total
        type: number
      - name: cart_url
        type: url
      retentionDays: 30
    credentials:
    - provider: shopify
      kind: api_key
      scope: user
      required: true
      label:
        it: Shopify (token Admin API)
        en: Shopify (Admin API token)
      help:
        it: Shopify > Impostazioni > App > Sviluppa app > token Admin API (lettura clienti, ordini, prodotti).
        en: Shopify > Settings > Apps > Develop apps > Admin API token (read customers, orders, products).
      hostLabel:
        it: il-tuo-negozio.myshopify.com
        en: your-shop.myshopify.com
  egress:
    hosts:
    - '*.myshopify.com'
    notes: Each store's own Shopify Admin API, called with the store's own token.
  views:
  - key: home
    type: page
    nav: false
    sections:
    - type: hero
      title:
        it: Il CRM marketing del tuo shop, **guidato da un agente AI**
        en: Your shop's marketing CRM, **run by an AI agent**
      text:
        it: Ogni lunedì un piano di campagne per i segmenti giusti, con prodotti e testi pronti. Tu approvi, niente parte
          senza di te.
        en: Every Monday a campaign plan for the right segments, with products and copy ready. You approve; nothing goes out
          without you.
      actions:
      - label:
          it: Inizia
          en: Get started
        href: /login
        style: primary
    - type: steps
      id: how
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Collega lo shop
          en: Connect your shop
        text:
          it: Importiamo clienti, ordini e catalogo da Shopify.
          en: We import customers, orders and catalogue from Shopify.
      - title:
          it: Ricevi il piano
          en: Get the plan
        text:
          it: Campagne, segmenti, prodotti e testi, ogni lunedì.
          en: Campaigns, segments, products and copy, every Monday.
      - title:
          it: Approvi tu
          en: You approve
        text:
          it: Approva, modifica o rifiuta ogni campagna.
          en: Approve, edit or reject each campaign.
      - title:
          it: Misura i ricavi
          en: Track revenue
        text:
          it: Report settimanale dei ricavi per campagna.
          en: Weekly revenue by campaign.
    - type: cards
      id: pricing
      title:
        it: Prezzi
        en: Pricing
      items:
      - title: Shop
        badge: €49/mese
        text:
          it: Un negozio, piano settimanale, flussi automatici, assistente.
          en: One shop, weekly plan, automatic flows, assistant.
    - type: note
      content:
        it: I messaggi marketing sono pensati solo per clienti che hanno dato il consenso.
        en: Marketing messages are only for customers who gave consent.
  - key: plans
    type: instances
    template: weekly_plan
    title:
      it: Piano settimanale
      en: Weekly plan
    roles:
    - user
    - admin
  - key: new
    type: new_run
    title:
      it: Piano ora
      en: Plan now
    roles:
    - user
    - admin
  - key: history
    type: history
    source: run
    title:
      it: Piani e report
      en: Plans and reports
    roles:
    - user
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: approve
    type: approvals
    title:
      it: Da approvare
      en: To approve
    approvals:
    - campaign_ok
    roles:
    - user
    - admin
  - key: campaigns
    type: table
    source: collection:campaigns
    title:
      it: Campagne
      en: Campaigns
    columns:
    - title
    - channel
    - segment
    - audience_size
    - status
    - revenue
    export: true
    roles:
    - user
    - admin
  - key: edit_campaign
    type: form
    collection: campaigns
    title:
      it: Modifica campagna
      en: Edit campaign
    fields:
    - title
    - channel
    - segment
    - products
    - message
    edit: true
    submit:
      label:
        it: Salva
        en: Save
      redirect: campaigns
    nav: false
    roles:
    - user
    - admin
  - key: revenue
    type: page
    title:
      it: Ricavi per campagna
      en: Revenue by campaign
    sections:
    - type: data
      source: collection:campaigns
      display: chart
      chart: bar
      fields:
      - key: title
        label:
          it: Campagna
          en: Campaign
      - key: revenue
        label:
          it: Ricavi
          en: Revenue
        format: money
      sort:
        field: revenue
        dir: desc
      limit: 20
    roles:
    - user
    - admin
  - key: customers
    type: table
    source: collection:customers
    title:
      it: Clienti
      en: Customers
    columns:
    - email
    - name
    - consent
    - orders_count
    - total_spent
    - last_order_date
    export: true
    roles:
    - user
    - admin
  - key: chat
    type: chat
    source: agent:assistant
    title:
      it: Assistente clienti
      en: Customer assistant
    examples:
    - it: Dov'è il mio ordine?
      en: Where is my order?
    - it: Come faccio un reso?
      en: How do I return an item?
    placeholder:
      it: Scrivi un messaggio…
      en: Write a message…
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento e shop
      en: Plan and shop
    roles:
    - user
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: shop
      price: 49
      interval: month
      label:
        it: ShopPilot — per negozio
        en: ShopPilot — per shop
      includes:
      - weekly plan
      - automatic flows
      - customer assistant
  notifications:
    emailOnRunDone: true
  extensions:
  - key: campaign_sending
    description: 'Email campaign sending to lists and WhatsApp messages (sending and customer replies on WhatsApp) are not
      available yet: approved campaigns are stored and exportable (CSV of consented customers) but not delivered by the platform.'
  - key: woocommerce
    description: 'WooCommerce connection not available: its hosts are arbitrary per store and the egress allow-list only supports
      named hosts or Shopify wildcard. Shopify only for now.'
  - key: public_widget
    description: Embeddable site chat widget for the shop's own visitors (anonymous, per-shop data) is not available yet;
      the assistant runs in the signed-in chat view.
