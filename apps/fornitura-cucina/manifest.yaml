apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: fornitura-fresca
  displayName: Fornitura Fresca
  tagline:
    it: Il portale di ordinazione tra ristoratori e produttori di prodotti freschi.
  description:
    it: 'Sfoglia il catalogo dei produttori, componi l''ordine con l''aiuto di un assistente, ricevi conferme, fatture e documenti
      di consegna. Solo il livello software: la logistica resta ai produttori.'
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#24472f'
      accent: '#d9822b'
      background: '#faf8f3'
      foreground: '#1d2a20'
    fonts:
      body: Inter
      display: Fraunces
  header:
    links:
    - label:
        it: Come funziona
      href: '#come-funziona'
    cta:
      label:
        it: Accedi
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: user
      label:
        it: Ristoratore
      assignedBy: signup
    - key: producer
      label:
        it: Produttore
      assignedBy: invite
  agents:
  - key: assistant
    role: main
    description: Aiuta il ristoratore a comporre gli ordini, suggerisce i ricorrenti e avvisa su stagionalità e disponibilità.
    profile:
      inline:
        display_name: Assistente ordini
        crews:
        - id: assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''assistente di ordinazione di un portale che mette in contatto ristoratori e produttori di
            prodotti freschi. Ti occupi solo dell''ordine, non di logistica o consegna fisica. Con gli strumenti leggi il
            catalogo (products) e lo storico ordini del ristoratore (orders). Aiuti a comporre l''ordine: prodotto, quantità,
            data di consegna desiderata. Prima di proporre, leggi lo storico e suggerisci i prodotti ricorrenti. Avvisa chiaramente
            se un prodotto è fuori stagione (campo season_months) o se la quantità supera la disponibilità (available_qty)
            o se non è attivo. Non inventare prodotti, prezzi o disponibilità: usa solo il catalogo. Quando il ristoratore
            conferma esplicitamente, crea con il tool write_order UN record per ciascun produttore coinvolto, con status "sent",
            restaurant_email, restaurant_name se noto, producer_email, producer_name, delivery_date (YYYY-MM-DD), lines (elenco
            di prodotto, quantità, unità, prezzo) e total calcolato dai prezzi del catalogo. Dopo aver inviato, riassumi cosa
            è partito e a chi. Rispondi sempre in italiano, in modo breve e pratico.'
          mcp_servers: []
    goalTemplate: 'Utente: {email}. Data di oggi: {date}.

      Conversazione finora:

      {history}

      Nuovo messaggio del ristoratore: {message}'
    context:
    - key: email
      from: user.email
    appTools:
    - name: read_products
      description: Legge il catalogo dei prodotti dei produttori
      action: read
      collection: products
      scope: all
    - name: read_orders
      description: Legge lo storico ordini del ristoratore
      action: read
      collection: orders
      scope: user
    - name: write_order
      description: Invia un ordine a un produttore
      action: write
      collection: orders
      scope: user
    output: markdown
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.5
  - key: reminder
    role: helper
    description: Ricorda al ristoratore di riordinare un prodotto consumato spesso.
    memory: instance
    writesTo:
      collection: reorder_suggestions
    profile:
      inline:
        display_name: Promemoria riordino
        crews:
        - id: reminder
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Controlli se il ristoratore deve riordinare un prodotto che consuma di frequente. Leggi lo storico
            ordini (read_orders) e il catalogo (read_products). Inizia con "# Promemoria riordino — <prodotto>". Sezioni ##
            Ultimo ordine, ## Disponibilità e stagione, ## Suggerimento (quantità tipica dallo storico, data di consegna consigliata).
            Se il prodotto è fuori stagione o non disponibile, dillo e proponi alternative dal catalogo. Meno di 150 parole;
            non inventare dati. Usa la tua memoria per non ripetere lo stesso avviso e alla fine chiama remember una volta
            con i punti chiave.'
          mcp_servers: []
    appTools:
    - name: read_products
      description: Legge il catalogo dei prodotti dei produttori
      action: read
      collection: products
      scope: all
    - name: read_orders
      description: Legge lo storico ordini del ristoratore
      action: read
      collection: orders
      scope: user
  - key: invoicer
    role: helper
    description: Genera fattura e documento di consegna quando un produttore conferma un ordine.
    profile:
      inline:
        display_name: Documenti ordine
        crews:
        - id: invoicer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Ricevi i dati di un ordine confermato. Con il tool write_invoice crea DUE record: uno con doc_type
            "invoice" e uno con doc_type "delivery_note", entrambi con restaurant_email, producer_email, producer_name, order_date,
            delivery_date, total e content (testo del documento in Markdown: intestazione, righe confermate con quantità e
            prezzi, totale; per il documento di consegna solo righe e quantità, senza prezzi). Usa solo i dati ricevuti, in
            particolare le righe confermate dal produttore se presenti; non inventare importi né aliquote IVA. Poi rispondi
            con una riga di conferma.'
          mcp_servers: []
    goalTemplate: 'Ordine confermato. Ristorante: {record.restaurant_email}. Produttore: {record.producer_name} ({record.producer_email}).
      Consegna: {record.delivery_date}. Righe ordinate: {record.lines}. Righe confermate dal produttore: {record.confirmed_lines}.
      Totale: {record.total}. Note: {record.producer_notes}. Genera fattura e documento di consegna.'
    appTools:
    - name: write_invoice
      description: Crea un documento (fattura o documento di consegna)
      action: write
      collection: invoices
      scope: all
    output: markdown
  templates:
  - key: reorder_watch
    title:
      it: Promemoria di riordino
    description:
      it: Ti ricorda ogni settimana di riordinare i prodotti che consumi più spesso.
    agent: reminder
    params:
    - name: product
      type: text
      required: true
      label:
        it: Prodotto
    - name: every_days
      type: number
      label:
        it: Ogni quanti giorni lo consumi
    goal: 'Promemoria "{instance}": prodotto {product}, riordino tipico ogni {every_days} giorni. Oggi è {date}. Scrivi in
      italiano.'
    schedule:
      cron: 0 7 * * 1
      userCanChange: true
    maxPerUser: 10
    deliver:
      to: owner
      onlyIfNew: true
  data:
    collections:
    - name: producers
      ownedBy: user
      description: Profilo del produttore
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Ragione sociale
      - name: email
        type: email
        required: true
        label:
          it: Email
      - name: area
        type: text
        label:
          it: Zona di attività
      - name: min_order
        type: number
        label:
          it: Ordine minimo (€)
    - name: products
      ownedBy: shared
      description: Catalogo prodotti dei produttori
      searchable: true
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Prodotto
      - name: category
        type: select
        label:
          it: Categoria
        options:
        - value: verdura
          label: Verdura
        - value: frutta
          label: Frutta
        - value: carne
          label: Carne
        - value: pesce
          label: Pesce
        - value: latticini
          label: Latticini
        - value: altro
          label: Altro
      - name: producer_name
        type: text
        required: true
        label:
          it: Produttore
      - name: producer_email
        type: email
        required: true
        label:
          it: Email produttore
      - name: unit
        type: text
        label:
          it: Unità (kg, cassa…)
      - name: price
        type: number
        required: true
        label:
          it: Prezzo (€)
      - name: available_qty
        type: number
        label:
          it: Quantità disponibile
      - name: season_months
        type: text
        label:
          it: Mesi di stagione (es. 5,6,7,8)
      - name: origin
        type: text
        label:
          it: Origine
      - name: active
        type: boolean
        default: true
        label:
          it: In vendita
    - name: orders
      ownedBy: user
      description: Un ordine per produttore
      fields:
      - name: restaurant_email
        type: email
        label:
          it: Email ristorante
      - name: restaurant_name
        type: text
        label:
          it: Ristorante
      - name: producer_email
        type: email
        label:
          it: Email produttore
      - name: producer_name
        type: text
        label:
          it: Produttore
      - name: delivery_date
        type: date
        label:
          it: Consegna desiderata
      - name: lines
        type: json
        label:
          it: Righe ordine
      - name: total
        type: number
        label:
          it: Totale (€)
      - name: status
        type: select
        label:
          it: Stato
        options:
        - value: sent
          label: Inviato
        - value: confirmed
          label: Confermato
        - value: partial
          label: Evasione parziale
        - value: rejected
          label: Rifiutato
        - value: delivered
          label: Consegnato
      - name: confirmed_lines
        type: textarea
        label:
          it: Righe che puoi evadere
      - name: producer_notes
        type: textarea
        label:
          it: Note del produttore
      access:
      - role: producer
        where:
          producer_email: '{user.email}'
        can:
        - read
        - write
    - name: invoices
      ownedBy: user
      description: Fatture e documenti di consegna
      fields:
      - name: doc_type
        type: select
        label:
          it: Tipo
        options:
        - value: invoice
          label: Fattura
        - value: delivery_note
          label: Documento di consegna
      - name: restaurant_email
        type: email
      - name: producer_email
        type: email
      - name: producer_name
        type: text
        label:
          it: Produttore
      - name: order_date
        type: date
        label:
          it: Data ordine
      - name: delivery_date
        type: date
        label:
          it: Consegna
      - name: total
        type: number
        label:
          it: Totale (€)
      - name: content
        type: textarea
        label:
          it: Documento
      access:
      - role: user
        where:
          restaurant_email: '{user.email}'
      - role: producer
        where:
          producer_email: '{user.email}'
      retentionDays: 3650
    - name: reorder_suggestions
      ownedBy: instance
      description: Promemoria di riordino generati
  views:
  - key: home
    type: page
    nav: false
    title: Fornitura Fresca
    sections:
    - type: hero
      eyebrow: Ristoratori e produttori
      title: Ordina il **fresco** direttamente dai produttori.
      text: Catalogo con prezzi e disponibilità, un assistente che ricorda cosa ordini di solito e ti avvisa su stagionalità,
        conferme dei produttori, fatture e documenti di consegna in un unico posto.
      actions:
      - label: Accedi e ordina
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title: Come funziona
      items:
      - title: Sfoglia e componi
        text: 'Scegli dal catalogo o chiedi all''assistente: quantità e data di consegna desiderata.'
        badge: 🥬
      - title: Il produttore conferma
        text: L'ordine arriva ai produttori interessati, che indicano cosa possono evadere.
        badge: ✅
      - title: Documenti e storico
        text: Fatture e documenti di consegna nella tua area personale e via email, con lo storico di spesa.
        badge: 🧾
    - type: note
      content: Il portale gestisce ordini e documenti; la consegna fisica è a carico dei produttori. Sugli ordini transati
        si applica una commissione.
  - key: shop
    type: chat
    title:
      it: Assistente ordini
    source: agent:assistant
    placeholder:
      it: Cosa ti serve per la prossima settimana?
    examples:
    - it: Riordina quello che prendo di solito, consegna venerdì
    - it: Cosa c'è di stagione in verdura?
    - it: Mi servono 10 kg di pomodori per martedì
    roles:
    - user
    - admin
  - key: catalog
    type: table
    title:
      it: Catalogo
    source: collection:products
    columns:
    - name
    - category
    - producer_name
    - unit
    - price
    - available_qty
    - season_months
    roles:
    - user
    - admin
    - producer
  - key: my_orders
    type: table
    title:
      it: I miei ordini
    source: collection:orders
    columns:
    - delivery_date
    - producer_name
    - total
    - status
    - producer_notes
    export: true
    roles:
    - user
    - admin
  - key: spend
    type: page
    title:
      it: Storico di spesa
    roles:
    - user
    - admin
    sections:
    - type: data
      source: collection:orders
      display: kpi
      kpis:
      - label: Spesa totale
        agg: sum
        field: total
        format: money
      - label: Ordini
        agg: count
    - type: data
      title: Spesa per mese
      source: collection:orders
      display: chart
      chart: bar
      groupBy:
        field: delivery_date
        bucket: month
        aggs:
        - key: spesa
          agg: sum
          field: total
      fields:
      - key: delivery_date
      - key: spesa
  - key: invoices_view
    type: table
    title:
      it: Fatture e documenti
    source: collection:invoices
    columns:
    - doc_type
    - producer_name
    - order_date
    - delivery_date
    - total
    export: true
    roles:
    - user
    - admin
    - producer
  - key: reorders
    type: instances
    template: reorder_watch
    title:
      it: Promemoria di riordino
    roles:
    - user
    - admin
  - key: received
    type: table
    title:
      it: Ordini ricevuti
    source: collection:orders
    columns:
    - delivery_date
    - restaurant_name
    - total
    - status
    - lines
    roles:
    - producer
    - admin
  - key: confirm
    type: form
    title:
      it: Conferma ordine
    collection: orders
    fields:
    - status
    - confirmed_lines
    - producer_notes
    edit: true
    submit:
      label:
        it: Salva risposta
      message:
        it: Risposta registrata.
      redirect: received
    nav: false
    roles:
    - producer
    - admin
  - key: add_product
    type: form
    title:
      it: Nuovo prodotto
    collection: products
    submit:
      label:
        it: Pubblica
      message:
        it: Prodotto pubblicato nel catalogo.
      redirect: my_products
    roles:
    - producer
    - admin
  - key: my_products
    type: table
    title:
      it: I miei prodotti
    source: collection:products
    query: producer_email = {user.email}
    columns:
    - name
    - category
    - unit
    - price
    - available_qty
    - season_months
    - active
    roles:
    - producer
    - admin
  - key: producer_profile
    type: form
    title:
      it: Profilo produttore
    collection: producers
    submit:
      label:
        it: Salva
      message:
        it: Profilo salvato.
    roles:
    - producer
  - key: account
    type: account
    title:
      it: Area personale
    roles:
    - user
    - producer
  - key: admin
    type: admin
    title: Admin
    roles:
    - admin
  triggers:
  - key: order_to_producer
    'on':
      collection: orders
      op: insert
    notify:
      to:
      - record.producer_email
      subject:
        it: Nuovo ordine da {record.restaurant_name}
      body:
        it: Hai ricevuto un nuovo ordine per la consegna del {record.delivery_date}. Aprilo per confermare cosa puoi evadere.
      link: received
  - key: order_answered
    'on':
      collection: orders
      op: update
    notify:
      to:
      - record.restaurant_email
      subject:
        it: Risposta del produttore {record.producer_name}
      body:
        it: 'L''ordine per il {record.delivery_date} è ora in stato: {record.status}. Note: {record.producer_notes}'
      link: my_orders
  - key: documents_on_confirm
    'on':
      collection: orders
      op: update
      where:
        status: confirmed
    start:
      agent: invoicer
    goal: 'Ordine confermato: genera fattura e documento di consegna.'
    asUser: true
  - key: document_mail
    'on':
      collection: invoices
      op: insert
    notify:
      to:
      - record.restaurant_email
      - record.producer_email
      subject:
        it: Nuovo documento da {record.producer_name}
      body:
        it: È disponibile un nuovo documento ({record.doc_type}) per la consegna del {record.delivery_date}, totale {record.total}
          €. Lo trovi nella tua area personale.
      link: invoices_view
  billing:
    modes:
    - per_transaction
    currency: eur
    transactionFeePct: 5
    sellers: collection:producers
  extensions:
  - key: pdf_documents
    description: Fatture e documenti sono testo nell'app e nell'email; PDF fiscali e fatturazione elettronica (SDI) non sono
      disponibili.
  - key: payment_flow
    description: Il pagamento dell'ordine tra ristorante e produttore con commissione richiede che ogni produttore colleghi
      il proprio account Stripe.
