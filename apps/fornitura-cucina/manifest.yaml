apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: forniture-ho-re-ca
  displayName: Mercato Fresco
  tagline:
    it: Il portale di ordini tra ristoranti e produttori di prodotti freschi.
  description:
    it: 'Sfoglia il catalogo dei produttori, componi l''ordine con l''aiuto di un assistente AI e segui conferme, storico
      di spesa e documenti. Solo il livello software: logistica e consegna restano ai produttori.'
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#2f5233'
      accent: '#d9822b'
      background: '#fbf8f1'
      foreground: '#1d2a1f'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Mercato
      color: primary
    - text: Fresco
      color: accent
    button: accent
  header:
    links:
    - label:
        it: Come funziona
      href: '#come-funziona'
    - label:
        it: Per chi
      href: '#per-chi'
    cta:
      label:
        it: Accedi
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: ristoratore
      label:
        it: Ristoratore
      assignedBy: signup
    - key: produttore
      label:
        it: Produttore
      assignedBy: admin
  limits:
  - action: chat
    per: user
    max: 100
    window: day
  agents:
  - key: ordini
    role: main
    description: Aiuta il ristoratore a comporre l'ordine, suggerisce i ricorrenti e segnala fuori stagione o non disponibile.
    memory: none
    awaits:
    - conferma_ordine
    profile:
      inline:
        display_name: Assistente ordini
        chat_mode: true
        crews:
        - id: ordini
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''assistente di ordinazione di un ristoratore. Usi gli strumenti: cerca_catalogo (prodotti
            con produttore, prezzo, unità, disponibilità, stagionalità), storico_ordini (ordini passati dell''utente), crea_ordine
            (salva la bozza d''ordine). Procedura: 1) capisci cosa serve e la data di consegna desiderata; 2) proponi prodotti
            ricorrenti in base allo storico; 3) per ogni riga verifica nel catalogo disponibilità e stagionalità: se un prodotto
            è fuori stagione o non disponibile dillo chiaramente e proponi un''alternativa; 4) riepiloga righe (prodotto,
            produttore, quantità, prezzo unitario, totale) e chiedi conferma; 5) a conferma, chiama crea_ordine con stato
            ''inviato'' e poi request_conferma_ordine per i produttori. Non inventare prodotti, prezzi o disponibilità che
            non sono nel catalogo. Non ti occupi di logistica o consegna fisica. Rispondi in italiano, breve e concreto.'
    goalTemplate: 'Conversazione finora:

      {history}


      Nuovo messaggio del ristoratore {user}: {message}

      Oggi è {date}. Rispondi in italiano.'
    appTools:
    - name: cerca_catalogo
      description: Cerca prodotti nel catalogo dei produttori
      action: search
      collection: prodotti
      scope: all
    - name: storico_ordini
      description: Ordini passati dell'utente
      action: read
      collection: ordini
      scope: user
    - name: crea_ordine
      description: Salva l'ordine dell'utente
      action: write
      collection: ordini
      scope: user
    output: markdown
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.5
  - key: produttore
    role: helper
    description: Aiuta il produttore a gestire prodotti, disponibilità e conferma degli ordini.
    profile:
      inline:
        display_name: Assistente produttore
        chat_mode: true
        crews:
        - id: produttore
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Assisti un produttore di prodotti freschi. Con carica_prodotto inserisci o aggiorni prodotti (nome,
            categoria, unità, prezzo, disponibilità, mesi di stagione, produttore = nome del produttore che ti scrive). Con
            ordini_ricevuti leggi gli ordini: mostra SOLO le righe che riguardano il produttore che ti scrive, mai quelle
            di altri produttori né dati di altri clienti oltre il nome del locale. Con aggiorna_ordine registri cosa può evadere
            (quantità confermate per riga). Chiedi sempre i dati mancanti, non inventare prezzi. Non gestisci consegna o logistica.
            Rispondi in italiano.'
    goalTemplate: 'Conversazione finora:

      {history}


      Messaggio del produttore {user}: {message}

      Oggi è {date}.'
    appTools:
    - name: carica_prodotto
      description: Crea o aggiorna un prodotto del catalogo
      action: write
      collection: prodotti
      scope: all
    - name: ordini_ricevuti
      description: Ordini ricevuti
      action: read
      collection: ordini
      scope: all
    - name: aggiorna_ordine
      description: Registra la conferma e le quantità evadibili
      action: write
      collection: ordini
      scope: all
    output: markdown
  - key: promemoria
    role: scheduled
    description: Ricorda al ristoratore cosa riordinare in base allo storico.
    memory: instance
    writesTo:
      collection: promemoria_riordino
    profile:
      inline:
        display_name: Promemoria riordino
        crews:
        - id: promemoria
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Guardi lo storico ordini del ristoratore (storico_ordini) e il catalogo (cerca_catalogo). Scrivi
            un promemoria che inizia con ''# Da riordinare — <data>''. Sezioni ## Prodotti consumati di frequente da riordinare
            (con cadenza stimata dallo storico), ## Attenzione (fuori stagione o non disponibili, con alternative), ## Prossimo
            passo. Max 200 parole. Non inventare quantità: usa solo lo storico. Alla fine chiama remember con i 5 punti chiave.'
    appTools:
    - name: storico_ordini
      description: Ordini passati dell'utente
      action: read
      collection: ordini
      scope: user
    - name: cerca_catalogo
      description: Cerca prodotti nel catalogo dei produttori
      action: search
      collection: prodotti
      scope: all
    output: markdown
  templates:
  - key: riordino
    title:
      it: Promemoria di riordino
    description:
      it: Ogni settimana ti ricorda i prodotti che consumi più spesso.
    agent: promemoria
    params:
    - name: focus
      type: select
      label:
        it: Categoria
      options:
      - value: tutto
        label:
          it: Tutte
      - value: verdura
        label:
          it: Verdura e frutta
      - value: carne
        label:
          it: Carne
      - value: pesce
        label:
          it: Pesce
      - value: latticini
        label:
          it: Latticini
    goal: 'Promemoria "{instance}": categoria {focus}. Oggi è {date}. Scrivi in italiano.'
    schedule:
      cron: 0 6 * * 1
      userCanChange: true
    maxPerUser: 4
    roles:
    - ristoratore
  approvals:
  - key: conferma_ordine
    title:
      it: Conferma ordine
    description: Il produttore conferma l'ordine e indica cosa può evadere
    role: produttore
    fields:
    - ristorante
    - data_consegna
    - righe
    timeoutMinutes: 2880
    onTimeout: reject
  data:
    collections:
    - name: prodotti
      ownedBy: shared
      searchable: true
      description: Catalogo dei produttori
      fields:
      - name: nome
        type: text
        required: true
      - name: produttore
        type: text
        required: true
      - name: categoria
        type: select
        options:
        - verdura
        - frutta
        - carne
        - pesce
        - latticini
        - altro
      - name: unita
        type: text
      - name: prezzo
        type: number
      - name: disponibilita
        type: number
      - name: mesi_stagione
        type: text
        help: es. 4-9
    - name: produttori
      ownedBy: shared
      description: Anagrafica produttori
      fields:
      - name: nome
        type: text
        required: true
      - name: email
        type: email
    - name: ordini
      ownedBy: user
      description: Ordini del ristoratore
      fields:
      - name: ristorante
        type: text
      - name: data_consegna
        type: date
      - name: righe
        type: json
        help: prodotto, produttore, quantità, prezzo, quantità confermata
      - name: totale
        type: number
      - name: stato
        type: select
        options:
        - bozza
        - inviato
        - confermato
        - parziale
        - rifiutato
      - name: data
        type: date
    - name: documenti
      ownedBy: user
      description: Fatture e documenti di consegna (link)
      fields:
      - name: tipo
        type: select
        options:
        - fattura
        - ddt
      - name: numero
        type: text
      - name: data
        type: date
      - name: link
        type: url
    - name: promemoria_riordino
      ownedBy: instance
      description: Promemoria settimanali di riordino
  views:
  - key: home
    type: page
    nav: false
    title: Mercato Fresco
    sections:
    - type: hero
      title:
        it: Ordina dai produttori in **pochi minuti**.
      text:
        it: Catalogo di prodotti freschi con prezzi e disponibilità, un assistente che suggerisce i ricorrenti e avvisa su
          stagionalità, conferma diretta dei produttori.
      actions:
      - label:
          it: Accedi e ordina
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
      items:
      - title:
          it: Sfoglia
        text:
          it: Catalogo dei produttori con prezzi e disponibilità.
        badge: 🥬
      - title:
          it: Ordina
        text:
          it: 'Indica quantità e data di consegna: l''assistente controlla stagione e disponibilità.'
        badge: 🧾
      - title:
          it: Conferma
        text:
          it: I produttori confermano e indicano cosa possono evadere.
        badge: ✅
      - title:
          it: Riordina
        text:
          it: Un promemoria settimanale per i prodotti che usi di più.
        badge: 🔁
    - type: cards
      id: per-chi
      title:
        it: Per chi
      items:
      - title:
          it: Ristoratori
        text:
          it: Ordini, storico di spesa, fatture e documenti di consegna.
      - title:
          it: Produttori
        text:
          it: I tuoi prodotti e gli ordini ricevuti, in un solo posto.
    - type: note
      content:
        it: 'Mercato Fresco è il portale software di ordinazione: logistica e consegna fisica restano ai produttori. Commissione
          sugli ordini transati.'
  - key: nuovo_ordine
    type: chat
    title:
      it: Nuovo ordine
    source: agent:ordini
    examples:
    - Che prodotti mi consigli di riordinare?
    - 'Ordine per venerdì: 10 kg pomodori, 5 kg zucchine'
    - Cosa è di stagione questo mese?
    placeholder: Scrivi cosa ti serve e per quando…
    roles:
    - ristoratore
    - admin
  - key: catalogo
    type: cards
    title:
      it: Catalogo
    source: collection:prodotti
    data:
      display: cards
      fields:
      - key: nome
        label: Prodotto
      - key: produttore
        label: Produttore
      - key: prezzo
        label: Prezzo
        format: money
      - key: unita
        label: Unità
      - key: disponibilita
        label: Disponibilità
        format: number
      - key: mesi_stagione
        label: Stagione
      sort:
        field: nome
        dir: asc
      limit: 200
    roles:
    - ristoratore
    - produttore
    - admin
  - key: ordini
    type: table
    title:
      it: I miei ordini
    source: collection:ordini
    data:
      display: table
      fields:
      - key: data
        label: Data
        format: date
      - key: data_consegna
        label: Consegna
        format: date
      - key: totale
        label: Totale
        format: money
      - key: stato
        label: Stato
        format: badge
      sort:
        field: data
        dir: desc
      limit: 100
    roles:
    - ristoratore
    - admin
  - key: spesa
    type: page
    title:
      it: Storico di spesa
    roles:
    - ristoratore
    - admin
    sections:
    - type: data
      source: collection:ordini
      display: kpi
      kpis:
      - label: Spesa totale
        agg: sum
        field: totale
        format: money
      - label: Ordini
        agg: count
      - label: Ordine medio
        agg: avg
        field: totale
        format: money
    - type: data
      title: Spesa per ordine
      source: collection:ordini
      display: chart
      chart: bar
      fields:
      - key: data
      - key: totale
        label: Totale
      sort:
        field: data
        dir: asc
      limit: 60
  - key: promemoria
    type: instances
    template: riordino
    title:
      it: Promemoria di riordino
    roles:
    - ristoratore
  - key: documenti
    type: table
    title:
      it: Fatture e documenti
    source: collection:documenti
    data:
      display: table
      fields:
      - key: tipo
        label: Tipo
        format: badge
      - key: numero
        label: Numero
      - key: data
        label: Data
        format: date
      - key: link
        label: Documento
        format: link
      sort:
        field: data
        dir: desc
    roles:
    - ristoratore
    - admin
  - key: area_produttore
    type: chat
    title:
      it: Miei prodotti e ordini
    source: agent:produttore
    examples:
    - Aggiungi pomodori San Marzano a 2,40 €/kg, 200 kg disponibili
    - Mostrami gli ordini da confermare
    - Posso evadere solo 8 kg di zucchine
    placeholder: Gestisci prodotti e ordini…
    roles:
    - produttore
    - admin
  - key: ordini_ricevuti
    type: table
    title:
      it: Ordini ricevuti
    source: collection:ordini
    data:
      display: table
      fields:
      - key: ristorante
        label: Locale
      - key: data_consegna
        label: Consegna
        format: date
      - key: totale
        label: Totale
        format: money
      - key: stato
        label: Stato
        format: badge
      sort:
        field: data
        dir: desc
    roles:
    - produttore
    - admin
  - key: conferme
    type: approvals
    title:
      it: Ordini da confermare
    approvals:
    - conferma_ordine
    roles:
    - produttore
    - admin
  billing:
    modes:
    - per_transaction
    currency: eur
    transactionFeePct: 4
    sellers: collection:produttori
  extensions:
  - key: record_visibility_produttori
    description: 'Gli ordini sono dei ristoratori (ownedBy user): il produttore li vede tramite l''agente e le viste con ruolo,
      non c''è ancora un filtro per produttore a livello di record. Da restringere quando disponibile.'
  - key: email_documenti
    description: 'Invio email di fatture e DDT non disponibile: i documenti si consultano nell''area personale come link inseriti
      in ''documenti''.'
  - key: upload_file
    description: 'Il caricamento di file (fatture, DDT, immagini prodotto) non è disponibile: si usano link.'
  - key: notifiche_ordini
    description: 'Notifiche email ai produttori per nuovi ordini non disponibili: vedono gli ordini in ''Ordini da confermare''.'
