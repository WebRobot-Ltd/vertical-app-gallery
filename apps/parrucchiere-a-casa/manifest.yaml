apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: bellezzaacasa
  displayName: BellezzaACasa
  tagline:
    it: Parrucchieri ed estetiste a domicilio, prenotati in un minuto.
    en: Hairdressers and beauticians at your door, booked in a minute.
  description:
    it: Scegli servizio, indirizzo e fascia oraria, confronta i professionisti disponibili con le loro valutazioni, prenota
      e paga con carta. Il professionista conferma la richiesta.
    en: Pick a service, address and time slot, compare available professionals with their ratings, book and pay by card. The
      professional confirms the request.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#7a2e4d'
      accent: '#d98a7a'
      background: '#fbf6f3'
      foreground: '#2a1f24'
    fonts:
      body: Inter
      display: Playfair Display
    wordmark:
    - text: Bellezza
      color: primary
    - text: ACasa
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Assistente
        en: Assistant
      href: '#assistente'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
      - assistant
      - professionals
      agents:
      - assistant
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: customer
      label:
        it: Cliente
        en: Customer
      assignedBy: signup
    - key: pro
      label:
        it: Professionista
        en: Professional
      assignedBy: derived
      from: collection:professionals.email
  limits:
  - action: chat
    per: ip
    max: 30
    window: hour
    roles:
    - anonymous
  agents:
  - key: assistant
    role: main
    description: Answers customers' questions on services and prices, finds available professionals and prepares booking requests.
    memory: none
    awaits:
    - confirm_booking
    profile:
      inline:
        display_name: BellezzaACasa assistant
        chat_mode: true
        crews:
        - id: assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''assistente di BellezzaACasa, servizio di parrucchieri ed estetiste a domicilio. Rispondi
            nella lingua del cliente, in modo breve e cordiale. Usa solo lo strumento search_professionals per conoscere servizi,
            prezzi, zone coperte, disponibilità e valutazioni: non inventare mai prezzi, orari o recensioni. Se un dato manca,
            dillo. Se il cliente vuole prenotare, chiedi servizio, indirizzo (città/CAP) e fascia oraria, proponi i professionisti
            compatibili con prezzo e valutazione, poi registra la richiesta con create_booking (stato ''richiesta''). Il professionista
            la conferma e il pagamento con carta avviene dalla pagina di prenotazione. Non dare consigli medici o dermatologici;
            per allergie o pelli sensibili invita a parlarne con il professionista.'
    appTools:
    - name: search_professionals
      description: Search professionals by service, area, price and rating
      action: search
      collection: professionals
      scope: all
    - name: create_booking
      description: Create a booking request for the signed-in customer
      action: write
      collection: bookings
      scope: user
    - name: my_bookings
      description: Read the signed-in customer's own bookings
      action: read
      collection: bookings
      scope: user
    goalTemplate: 'Conversazione finora:

      {history}


      Nuovo messaggio del cliente: {message}

      Oggi è {date}. Rispondi in lingua {lang}.'
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.3
  approvals:
  - key: confirm_booking
    title:
      it: Conferma prenotazione
      en: Confirm booking
    description: Il professionista conferma o rifiuta la richiesta del cliente.
    role: pro
    fields:
    - service
    - address
    - slot
    - price
    timeoutMinutes: 1440
    onTimeout: reject
    decidedBy: role
  data:
    collections:
    - name: professionals
      ownedBy: shared
      description: 'Profili dei professionisti: servizi, prezzi, zona, disponibilità settimanale, valutazione media'
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome
          en: Name
      - name: email
        type: email
        required: true
      - name: category
        type: select
        options:
        - value: hair
          label:
            it: Parrucchiere
            en: Hairdresser
        - value: beauty
          label:
            it: Estetista
            en: Beautician
      - name: services
        type: array
        label:
          it: Servizi e prezzi
          en: Services and prices
        fields:
        - name: service
          type: text
        - name: price
          type: number
        - name: minutes
          type: number
      - name: area
        type: text
        label:
          it: Zona coperta (città, CAP)
          en: Coverage area
      - name: availability
        type: textarea
        label:
          it: Disponibilità settimanale
          en: Weekly availability
      - name: rating
        type: number
      - name: reviews_count
        type: number
    - name: bookings
      ownedBy: user
      sharing:
      - viewer
      description: Prenotazioni del cliente; il professionista incaricato le vede come invitato
      fields:
      - name: professional
        type: relation
        relation: professionals
      - name: service
        type: text
      - name: address
        type: text
      - name: slot
        type: text
      - name: price
        type: number
      - name: status
        type: select
        options:
        - richiesta
        - confermata
        - rifiutata
        - pagata
        - completata
    - name: reviews
      ownedBy: user
      description: Recensioni lasciate dal cliente dopo l'appuntamento
      fields:
      - name: professional
        type: relation
        relation: professionals
      - name: stars
        type: number
      - name: comment
        type: textarea
        maxLength: 600
  views:
  - key: home
    type: page
    nav: false
    title: BellezzaACasa
    sections:
    - type: hero
      eyebrow:
        it: Beauty a domicilio
        en: Beauty at home
      title:
        it: '**Parrucchieri ed estetiste** a casa tua'
        en: '**Hairdressers and beauticians** at your home'
      text:
        it: Scegli servizio, indirizzo e fascia oraria. Vedi chi è disponibile, con prezzi e valutazioni. Prenota e paga con
          carta.
        en: Choose service, address and time slot. See who is available, with prices and ratings. Book and pay by card.
      actions:
      - label:
          it: Chiedi all'assistente
          en: Ask the assistant
        href: '#assistente'
        style: primary
      - label:
          it: Sei un professionista? Registrati
          en: Are you a professional? Join
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Scegli
          en: Choose
        text:
          it: Servizio, indirizzo e fascia oraria.
          en: Service, address and time slot.
        badge: 💇
      - title:
          it: Prenota e paga
          en: Book and pay
        text:
          it: Confronta professionisti e valutazioni, paga con carta.
          en: Compare professionals and ratings, pay by card.
        badge: 💳
      - title:
          it: Conferma
          en: Confirmation
        text:
          it: Il professionista riceve la richiesta e la conferma.
          en: The professional receives the request and confirms it.
        badge: ✅
      - title:
          it: Recensisci
          en: Review
        text:
          it: Dopo l'appuntamento lasci la tua valutazione.
          en: After the appointment you leave your rating.
        badge: ⭐
    - type: view
      id: assistente
      title:
        it: Domande su servizi e prezzi
        en: Questions on services and prices
      view: assistant
    - type: note
      content:
        it: Il pagamento è tra cliente e professionista tramite BellezzaACasa, che trattiene una commissione sulla prenotazione.
        en: Payment is between customer and professional through BellezzaACasa, which keeps a commission on each booking.
  - key: assistant
    type: chat
    source: agent:assistant
    title:
      it: Assistente
      en: Assistant
    examples:
    - Quanto costa un taglio e piega a Bologna?
    - Cerco un'estetista per manicure sabato pomeriggio
    - Che servizi offrite?
    placeholder:
      it: Scrivi la tua domanda…
      en: Type your question…
  - key: professionals
    type: cards
    title:
      it: Professionisti
      en: Professionals
    source: collection:professionals
    data:
      display: cards
      fields:
      - key: name
        label:
          it: Nome
          en: Name
      - key: category
        format: badge
      - key: area
        label:
          it: Zona
          en: Area
      - key: rating
        label:
          it: Valutazione
          en: Rating
        format: number
      sort:
        field: rating
        dir: desc
      limit: 60
      empty:
        it: Nessun professionista ancora.
        en: No professionals yet.
  - key: my_profile
    type: list
    title:
      it: Il mio profilo professionale
      en: My professional profile
    source: collection:professionals
    roles:
    - pro
    - admin
  - key: my_bookings
    type: table
    title:
      it: Le mie prenotazioni
      en: My bookings
    source: collection:bookings
    roles:
    - customer
    - pro
    - admin
    data:
      display: table
      fields:
      - key: service
        label:
          it: Servizio
          en: Service
      - key: slot
        label:
          it: Fascia
          en: Slot
      - key: address
        label:
          it: Indirizzo
          en: Address
      - key: price
        format: money
      - key: status
        format: badge
      sort:
        field: slot
        dir: desc
  - key: requests
    type: approvals
    title:
      it: Richieste da confermare
      en: Requests to confirm
    approvals:
    - confirm_booking
    roles:
    - pro
  - key: my_reviews
    type: table
    title:
      it: Recensioni
      en: Reviews
    source: collection:reviews
    roles:
    - customer
    - admin
  - key: account
    type: account
    title:
      it: Pagamenti
      en: Payments
    roles:
    - customer
    - pro
  billing:
    modes:
    - per_transaction
    currency: eur
    transactionFeePct: 15
    sellers: collection:professionals
  egress:
    hosts: []
    notes: Nessuna API esterna.
  extensions:
  - key: pro_self_registration
    description: 'Il professionista crea e modifica solo il proprio profilo nel catalogo condiviso ''professionals'' (scrittura
      limitata al proprio record) e vede come invitato solo le prenotazioni a lui assegnate: richiede una regola di scrittura
      per record non ancora generica nel manifest.'
  - key: booking_payment_flow
    description: Pagamento con carta della singola prenotazione via Stripe Connect sul conto del professionista, con commissione;
      richiede che ogni professionista colleghi il proprio Stripe.
  - key: review_email
    description: 'Email al cliente dopo l''appuntamento con il link per la recensione: le notifiche email non sono ancora
      disponibili. Per ora il cliente trova ''Recensioni'' nel menu.'
  - key: availability_matching
    description: Il match automatico tra fascia oraria richiesta e disponibilità settimanale è fatto dall'agente leggendo
      il testo della disponibilità; un calendario strutturato è un'estensione futura.
