apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: bellezzeacasa
  displayName: BellezzaACasa
  tagline:
    it: Parrucchieri ed estetiste a casa tua, prenotati in un minuto.
    en: Hairdressers and beauticians at your door, booked in a minute.
  description:
    it: Scegli servizio, indirizzo e orario, vedi i professionisti disponibili con le valutazioni, prenota e paga con carta.
    en: Pick a service, address and time, see available professionals with ratings, book and pay by card.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#7a2e4d'
      accent: '#d98b6a'
      background: '#fdf8f5'
      foreground: '#2b1d24'
    fonts:
      body: Inter
      display: Playfair Display
    wordmark:
    - text: Bellezza
      color: primary
    - text: ACasa
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Assistente
        en: Assistant
      href: '#assistente'
    cta:
      label:
        it: Prenota
        en: Book
      href: /v/book
  auth:
    method: magic_link
    anonymous:
      views:
      - home
      - professionals
      - chat
      agents:
      - assistant
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: pro
      label:
        it: Professionista
        en: Professional
      assignedBy: derived
      from: collection:professionals.email
    - key: user
      label:
        it: Cliente
        en: Customer
      assignedBy: signup
  limits:
  - action: chat
    per: ip
    max: 30
    window: hour
    roles:
    - anonymous
  agents:
  - key: assistant
    role: main
    description: Answers customers' questions about services, prices and available professionals.
    profile:
      inline:
        display_name: BellezzaACasa assistant
        crews:
        - id: assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the friendly assistant of BellezzaACasa, a service that books hairdressers and beauticians
            at home. Answer questions about services, prices, areas covered and ratings using ONLY the data returned by your
            tools (professionals and reviews). Never invent prices, availability or ratings: if the data is missing, say so.
            To book, send the customer to the Book page (/v/book). Do not take payments or promise confirmations: the professional
            confirms each request. Reply briefly, in the customer''s language.'
    goalTemplate: 'Conversation so far:

      {history}


      New message from the customer: {message}

      Reply in the language with ISO code {lang}.'
    appTools:
    - name: search_professionals
      description: Search professionals with services, prices, area and weekly availability
      action: search
      collection: professionals
      scope: all
    - name: search_reviews
      description: Read customer reviews and ratings of professionals
      action: search
      collection: reviews
      scope: all
    output: markdown
    limits:
      maxTurns: 6
      maxBudgetUsd: 0.2
  data:
    collections:
    - name: professionals
      ownedBy: shared
      description: 'Professional profiles: services, prices, area covered, weekly availability'
      searchable: true
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome
          en: Name
      - name: email
        type: email
        required: true
        label: Email
      - name: category
        type: select
        required: true
        label:
          it: Categoria
          en: Category
        options:
        - value: hair
          label:
            it: Parrucchiere/a
            en: Hairdresser
        - value: beauty
          label:
            it: Estetista
            en: Beautician
      - name: services
        type: textarea
        required: true
        label:
          it: Servizi e prezzi (es. Taglio 35€)
          en: Services and prices
      - name: area
        type: text
        required: true
        label:
          it: Zona coperta (città, CAP)
          en: Area covered
      - name: availability
        type: textarea
        label:
          it: Disponibilità settimanale
          en: Weekly availability
      - name: rating
        type: number
        label:
          it: Valutazione media
          en: Average rating
    - name: appointments
      ownedBy: user
      description: Home bookings; each has start, end, date, resource (the professional), status
      fields:
      - name: service
        type: text
        required: true
        label:
          it: Servizio
          en: Service
      - name: address
        type: text
        required: true
        label:
          it: Indirizzo
          en: Address
      - name: notes
        type: textarea
        label:
          it: Note
          en: Notes
      access:
      - role: pro
        where:
          resource: '{user.email}'
        can:
        - read
        - write
      retentionDays: 730
    - name: reviews
      ownedBy: shared
      description: Customer reviews after the appointment
      fields:
      - name: professional
        type: text
        required: true
        label:
          it: Professionista
          en: Professional
      - name: rating
        type: number
        required: true
        label:
          it: Voto (1-5)
          en: Rating (1-5)
      - name: comment
        type: textarea
        label:
          it: Commento
          en: Comment
  views:
  - key: home
    type: page
    title: BellezzaACasa
    nav: false
    sections:
    - type: hero
      title:
        it: '**Bellezza** a casa tua'
        en: '**Beauty** at your door'
      text:
        it: 'Scegli servizio, indirizzo e orario: vedi i professionisti disponibili con le valutazioni, prenota e paga con
          carta.'
        en: 'Pick a service, address and time: see available professionals with ratings, book and pay by card.'
      actions:
      - label:
          it: Prenota ora
          en: Book now
        href: /v/book
        style: primary
      - label:
          it: Sei un professionista?
          en: Are you a professional?
        href: /v/pro_profile
        style: ghost
      band: true
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Scegli
          en: Choose
        text:
          it: Servizio, indirizzo e fascia oraria.
          en: Service, address and time slot.
        badge: 💇
      - title:
          it: Prenota e paga
          en: Book and pay
        text:
          it: Il professionista riceve la richiesta e la conferma.
          en: The professional receives the request and confirms.
        badge: 💳
      - title:
          it: Recensisci
          en: Review
        text:
          it: Dopo l'appuntamento ricevi un'email per lasciare una recensione.
          en: After the appointment you get an email to leave a review.
        badge: ⭐
    - type: view
      id: assistente
      title:
        it: Chiedi all'assistente
        en: Ask the assistant
      view: chat
    - type: note
      content:
        it: Sulle prenotazioni si applica una commissione di servizio.
        en: A service fee applies to bookings.
  - key: chat
    type: chat
    source: agent:assistant
    title:
      it: Assistente
      en: Assistant
    examples:
    - it: Quanto costa un taglio donna?
      en: How much is a women's haircut?
    - it: Chi copre la zona di Bologna?
      en: Who covers Bologna?
    placeholder:
      it: Chiedi di servizi e prezzi…
      en: Ask about services and prices…
  - key: professionals
    type: cards
    title:
      it: Professionisti
      en: Professionals
    source: collection:professionals
    data:
      display: cards
      fields:
      - key: name
        label:
          it: Nome
          en: Name
      - key: category
        format: badge
      - key: services
        label:
          it: Servizi
          en: Services
      - key: area
        label:
          it: Zona
          en: Area
      - key: rating
        label:
          it: Valutazione
          en: Rating
        format: number
      sort:
        field: rating
        dir: desc
      limit: 60
  - key: book
    type: booking
    title:
      it: Prenota
      en: Book
    collection: appointments
    resources: collection:professionals
    fields:
    - service
    - address
    - notes
    slots:
      days:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      from: 09:00
      to: '19:00'
      minutes: 60
      tz: Europe/Rome
      aheadDays: 21
      minNoticeHours: 4
      capacity: 1
    roles:
    - user
    - admin
  - key: my_bookings
    type: table
    title:
      it: Le mie prenotazioni
      en: My bookings
    source: collection:appointments
    columns:
    - date
    - start
    - service
    - address
    - resource
    - status
    roles:
    - user
  - key: agenda
    type: table
    title:
      it: I miei appuntamenti
      en: My appointments
    source: collection:appointments
    columns:
    - date
    - start
    - service
    - address
    - status
    roles:
    - pro
  - key: pro_profile
    type: form
    title:
      it: Profilo professionista
      en: Professional profile
    collection: professionals
    submit:
      label:
        it: Salva profilo
        en: Save profile
      message:
        it: Profilo salvato.
        en: Profile saved.
      redirect: professionals
    edit: true
  - key: review
    type: form
    title:
      it: Lascia una recensione
      en: Leave a review
    collection: reviews
    fields:
    - professional
    - rating
    - comment
    submit:
      label:
        it: Invia
        en: Send
      message:
        it: Grazie per la recensione!
        en: Thanks for your review!
      redirect: professionals
    nav: false
    roles:
    - user
  triggers:
  - key: booking_received
    'on':
      collection: appointments
      op: insert
    notify:
      to: owner
      subject:
        it: Richiesta di prenotazione inviata
        en: Booking request sent
      body:
        it: Abbiamo inviato la tua richiesta del {record.date} per {record.service}. Il professionista la confermerà a breve.
        en: Your request for {record.service} on {record.date} was sent. The professional will confirm shortly.
      link: my_bookings
  - key: review_request
    'on':
      date:
        collection: appointments
        field: date
        offsetDays: 1
        hour: 9
    notify:
      to: owner
      subject:
        it: Com'è andato il tuo appuntamento?
        en: How was your appointment?
      body:
        it: Grazie per aver scelto BellezzaACasa. Lascia una recensione per {record.service}.
        en: Thanks for choosing BellezzaACasa. Please review your {record.service} appointment.
      link: review
  billing:
    modes:
    - per_transaction
    currency: eur
    transactionFeePct: 15
    sellers: collection:professionals
  extensions:
  - key: card_payment_per_booking
    description: Card payment at booking split to each professional's Stripe Connect account (per_transaction) needs each
      professional to connect Stripe; the studio owner connects the platform account.
  - key: pro_confirmation_and_zone_match
    description: Professional's explicit confirmation of a request, matching the customer's address to the professional's
      covered area, and the average rating being updated from reviews are not expressible yet; professional email is assumed
      to be the booking resource id.
  - key: review_email_only_for_booked
    description: The review reminder email cannot be filtered by booking status (on.date has no where), so it is also sent
      for cancelled bookings.
