apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: studiasmart
  displayName: StudiaSmart
  tagline:
    it: Trasforma appunti e dispense in mappe, flashcard e quiz.
    en: Turn notes and handouts into maps, flashcards and quizzes.
    es: Convierte apuntes y materiales en mapas, tarjetas y cuestionarios.
  description:
    it: 'Carica appunti, PDF, slide o foto: StudiaSmart estrae i concetti chiave, crea mappe concettuali, flashcard e quiz,
      ti fa ripassare ogni giorno e risponde alle tue domande citando i tuoi materiali. Pensata anche per studenti con DSA.'
    en: 'Upload notes, PDFs, slides or photos: StudiaSmart extracts key concepts, builds concept maps, flashcards and quizzes,
      schedules daily reviews and answers questions citing your own materials. Designed with dyslexic learners in mind.'
    es: 'Sube apuntes, PDF, diapositivas o fotos: StudiaSmart extrae los conceptos clave, crea mapas, tarjetas y cuestionarios,
      programa repasos diarios y responde citando tus materiales.'
  langs:
  - it
  - en
  - es
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#2b3a67'
      accent: '#f28c28'
      background: '#fffdf7'
      foreground: '#1d2433'
    fonts:
      body: Lexend
      display: Lexend
    wordmark:
    - text: Studia
      color: primary
    - text: Smart
      color: accent
    buttonShape: rounded
    width: wide
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
        es: Cómo funciona
      href: '#come-funziona'
    - label:
        it: Per chi
        en: Who it is for
        es: Para quién
      href: '#per-chi'
    cta:
      label:
        it: Inizia
        en: Start
        es: Empezar
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: student
      label:
        it: Studente
        en: Student
        es: Estudiante
      assignedBy: signup
    - key: teacher
      label:
        it: Docente
        en: Teacher
        es: Docente
      assignedBy: invite
    - key: parent
      label:
        it: Famiglia
        en: Family
        es: Familia
      assignedBy: derived
      from: collection:student_profiles.parent_email
  limits:
  - action: agent:builder
    per: user
    max: 5
    window: month
    roles:
    - student
    plans:
      student: -1
      school: -1
  - action: chat
    per: user
    max: 100
    window: day
    roles:
    - student
  agents:
  - key: builder
    role: main
    description: Reads an uploaded or pasted study material and builds concept map nodes, flashcards and quiz questions.
    profile:
      inline:
        display_name: StudiaSmart builder
        crews:
        - id: builder
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are a study assistant for high-school and university students, including students with dyslexia
            (DSA). Use short sentences, plain words and clear structure. You receive a study material (pasted text, extracted
            file text, or photos/scans: for those call read_upload with the file id). Never invent content that is not in
            the material; if the text is unreadable, say so.

            Steps: 1) call save_material once with subject, title and the full text. 2) Extract 8-25 key concepts: call save_concept
            for each with subject, label, summary (max 25 words), color (a hex), icon (one emoji), relates_to (lines ''this
            -> relation -> other concept'') and quote (short literal excerpt from the material, with page or section when
            known). 3) Create 10-20 flashcards with save_flashcard (subject, front, back, due = today''s date YYYY-MM-DD,
            interval_days 1, reps 0). 4) Create 8-12 multiple-choice questions with save_question (subject, question, options
            as a JSON array of 4 strings, answer = the correct option text, explanation of why it is right and why the others
            are wrong, quote). Write all content in the language of the material unless asked otherwise.

            Final answer: Markdown report starting with a level-1 title ''# <Subject> — <material title>'', then ## Key concepts
            (bullet list), ## Relationships (a table: concept, relation, concept), ## Flashcards created (count and 3 examples),
            ## Quiz (count), ## Next steps. Add a ```chart bar block only if the material has real numbers. Keep it short.'
          mcp_servers: []
    goalTemplate: 'Subject: {subject}

      Material title: {title}

      Today: {date}

      {?material}Uploaded files: {material}

      {?material_text}Text of the files:

      {material_text}{/material_text}{/material}

      {?pasted}Pasted text:

      {pasted}{/pasted}

      Write the report in the language with ISO code {lang}.'
    appTools:
    - name: read_upload
      description: Read a file the user uploaded (photos and scans included)
      action: read_file
    - name: save_material
      description: Save the study material
      action: write
      collection: materials
      scope: user
    - name: save_concept
      description: Save a concept map node with its relations
      action: write
      collection: concepts
      scope: user
    - name: save_flashcard
      description: Save a flashcard
      action: write
      collection: flashcards
      scope: user
    - name: save_question
      description: Save a quiz question
      action: write
      collection: quiz_questions
      scope: user
    output: markdown
    limits:
      maxTurns: 30
      maxBudgetUsd: 0.8
  - key: tutor
    role: helper
    description: Chats with the student's own materials citing them, runs spaced-repetition reviews and quizzes, records results.
    context:
    - key: student_email
      from: user.email
    - key: parent_email
      from: collection:student_profiles.parent_email
    profile:
      inline:
        display_name: StudiaSmart tutor
        chat_mode: true
        crews:
        - id: tutor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are a patient tutor for a student, also suited to students with dyslexia: short sentences, simple
            words, one idea at a time, examples and analogies. Answer ONLY using the student''s own materials: call search_materials
            and read_concepts first, and cite the source as ''(da: <material title>, <quote or section>)''. If the material
            does not cover the question, say so and offer a general explanation clearly labelled as outside the material.
            Never invent quotes.

            Review mode: when asked to review, call read_flashcards, show cards whose due date is today or earlier one at
            a time, ask the student to recall, then after the answer update the card with save_flashcard (reps+1, interval_days
            doubled when correct or reset to 1 when wrong, due = today + interval). Quiz mode: ask questions from read_questions
            one at a time, explain the answer; at the end call save_result with subject, score, total, student_email, parent_email
            (from context, may be empty), teacher_email (from read_classes if the subject''s material belongs to a class,
            else empty) and taken = today. Be encouraging, never judgmental.'
          mcp_servers: []
    goalTemplate: 'Student: {user} ({student_email}). Parent email: {parent_email}. Today: {date}. Reply in language {lang}.

      Conversation so far:

      {history}

      New message: {message}'
    appTools:
    - name: search_materials
      description: Search the student's study materials
      action: search
      collection: materials
      scope: user
    - name: read_concepts
      description: Read the student's concepts
      action: read
      collection: concepts
      scope: user
    - name: read_flashcards
      description: Read the student's flashcards
      action: read
      collection: flashcards
      scope: user
    - name: save_flashcard
      description: Save a flashcard
      action: write
      collection: flashcards
      scope: user
    - name: read_questions
      description: Read the student's quiz questions
      action: read
      collection: quiz_questions
      scope: user
    - name: read_classes
      description: Read the classes the student belongs to
      action: read
      collection: classes
      scope: user
    - name: save_result
      description: Save a quiz result
      action: write
      collection: quiz_results
      scope: user
    output: markdown
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.4
  inputForm:
    title:
      it: Nuovo materiale
      en: New material
      es: Nuevo material
    fields:
    - name: subject
      type: text
      required: true
      label:
        it: Materia
        en: Subject
        es: Asignatura
      optionsFrom: collection:subjects
    - name: title
      type: text
      required: true
      label:
        it: Titolo del materiale
        en: Material title
        es: Título del material
    - name: material
      type: file
      accept:
      - pdf
      - docx
      - txt
      - md
      - jpg
      - jpeg
      - png
      maxMb: 15
      multiple: true
      label:
        it: Appunti, PDF, slide o foto
        en: Notes, PDF, slides or photos
        es: Apuntes, PDF, diapositivas o fotos
    - name: pasted
      type: textarea
      maxLength: 20000
      label:
        it: Oppure incolla il testo
        en: Or paste the text
        es: O pega el texto
  data:
    collections:
    - name: subjects
      ownedBy: user
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome materia
          en: Subject name
          es: Asignatura
      - name: level
        type: select
        options:
        - high_school
        - university
        label:
          it: Livello
          en: Level
          es: Nivel
    - name: student_profiles
      ownedBy: user
      description: 'Optional family link: lets a parent follow a minor''s progress'
      fields:
      - name: display_name
        type: text
        label:
          it: Nome
          en: Name
          es: Nombre
      - name: is_minor
        type: boolean
        label:
          it: Minorenne
          en: Minor
          es: Menor de edad
      - name: parent_email
        type: email
        label:
          it: Email del genitore
          en: Parent email
          es: Email del tutor
        help:
          it: Solo il genitore indicato vedrà i tuoi progressi, non i tuoi appunti.
          en: Only this parent will see your progress, never your notes.
          es: Solo este tutor verá tu progreso, nunca tus apuntes.
    - name: materials
      ownedBy: user
      searchable: true
      fields:
      - name: subject
        type: text
      - name: title
        type: text
      - name: content
        type: textarea
    - name: concepts
      ownedBy: user
      fields:
      - name: subject
        type: text
      - name: label
        type: text
        required: true
      - name: summary
        type: textarea
      - name: relates_to
        type: textarea
      - name: color
        type: text
      - name: icon
        type: text
      - name: quote
        type: textarea
    - name: flashcards
      ownedBy: user
      fields:
      - name: subject
        type: text
      - name: front
        type: textarea
        required: true
      - name: back
        type: textarea
        required: true
      - name: due
        type: date
      - name: interval_days
        type: number
      - name: reps
        type: number
    - name: quiz_questions
      ownedBy: user
      fields:
      - name: subject
        type: text
      - name: question
        type: textarea
      - name: options
        type: json
      - name: answer
        type: text
      - name: explanation
        type: textarea
      - name: quote
        type: textarea
    - name: quiz_results
      ownedBy: user
      retentionDays: 730
      fields:
      - name: subject
        type: text
      - name: score
        type: number
      - name: total
        type: number
      - name: taken
        type: date
      - name: student_email
        type: email
      - name: parent_email
        type: email
      - name: teacher_email
        type: email
      access:
      - role: teacher
        where:
          teacher_email: '{user.email}'
        can:
        - read
      - role: parent
        where:
          parent_email: '{user.email}'
        can:
        - read
    - name: classes
      ownedBy: user
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome classe
          en: Class name
          es: Nombre de la clase
      - name: teacher_email
        type: email
        required: true
      - name: students
        type: array
        label:
          it: Email degli studenti
          en: Student emails
          es: Emails de los estudiantes
      access:
      - role: student
        where:
          students: '{user.email}'
        can:
        - read
    - name: shared_materials
      ownedBy: user
      fields:
      - name: class_name
        type: text
        required: true
      - name: title
        type: text
        required: true
      - name: content
        type: textarea
      - name: students
        type: array
      access:
      - role: student
        where:
          students: '{user.email}'
        can:
        - read
  views:
  - key: home
    type: page
    nav: false
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow:
        it: Per studenti, anche con DSA
        en: For students, DSA-friendly
        es: Para estudiantes, también con DSA
      title:
        it: Studia con **mappe, flashcard e quiz** creati dai tuoi appunti.
        en: Study with **maps, flashcards and quizzes** built from your notes.
        es: Estudia con **mapas, tarjetas y cuestionarios** creados de tus apuntes.
      text:
        it: Carica PDF, slide o foto, oppure incolla il testo. Chatta con i tuoi materiali e ripassa ogni giorno.
        en: Upload PDFs, slides or photos, or paste text. Chat with your materials and review every day.
        es: Sube PDF, diapositivas o fotos, o pega el texto. Chatea con tus materiales y repasa cada día.
      actions:
      - label:
          it: Inizia gratis
          en: Start free
          es: Empieza gratis
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
        es: Cómo funciona
      items:
      - title:
          it: Carica
          en: Upload
          es: Sube
        text:
          it: Crea una materia e carica i materiali.
          en: Create a subject and add your materials.
          es: Crea una asignatura y añade materiales.
        badge: 📄
      - title:
          it: Studia
          en: Study
          es: Estudia
        text:
          it: Concetti, relazioni, flashcard e quiz con spiegazioni.
          en: Concepts, relations, flashcards and quizzes with explanations.
          es: Conceptos, relaciones, tarjetas y cuestionarios con explicaciones.
        badge: 🧠
      - title:
          it: Ripassa
          en: Review
          es: Repasa
        text:
          it: Ripetizione spaziata con promemoria ogni giorno.
          en: Spaced repetition with a daily reminder.
          es: Repetición espaciada con recordatorio diario.
        badge: 🔔
    - type: cards
      id: per-chi
      title:
        it: Per chi
        en: Who it is for
        es: Para quién
      items:
      - title:
          it: Studenti
          en: Students
          es: Estudiantes
        text:
          it: Font ad alta leggibilità e testi semplici.
          en: High-legibility font and plain text.
          es: Fuente muy legible y textos sencillos.
      - title:
          it: Docenti
          en: Teachers
          es: Docentes
        text:
          it: Condividi materiali con la classe e vedi i risultati aggregati, mai gli appunti privati.
          en: Share materials with the class and see quiz results, never private notes.
          es: Comparte materiales y ve los resultados, nunca los apuntes privados.
      - title:
          it: Famiglie
          en: Families
          es: Familias
        text:
          it: Segui i progressi del figlio minorenne.
          en: Follow a minor child's progress.
          es: Sigue el progreso de tu hijo menor.
    - type: note
      content:
        it: Strumento di studio, non sostituisce l'insegnante. Le risposte citano i tuoi materiali.
        en: A study aid, not a replacement for your teacher. Answers cite your own materials.
        es: Herramienta de estudio; no sustituye al docente. Las respuestas citan tus materiales.
  - key: new_material
    type: new_run
    title:
      it: Nuovo materiale
      en: New material
      es: Nuevo material
    roles:
    - student
    - admin
  - key: history
    type: history
    source: run
    title:
      it: I miei materiali
      en: My materials
      es: Mis materiales
    roles:
    - student
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: subjects_form
    type: form
    collection: subjects
    title:
      it: Nuova materia
      en: New subject
      es: Nueva asignatura
    submit:
      label:
        it: Salva
        en: Save
        es: Guardar
      redirect: new_material
    roles:
    - student
  - key: concepts_table
    type: table
    source: collection:concepts
    title:
      it: Concetti e mappa
      en: Concepts and map
      es: Conceptos y mapa
    columns:
    - icon
    - label
    - summary
    - relates_to
    - color
    - quote
    roles:
    - student
  - key: concept_edit
    type: form
    collection: concepts
    edit: true
    nav: false
    submit:
      label: OK
    roles:
    - student
  - key: cards_table
    type: table
    source: collection:flashcards
    title:
      it: Flashcard
      en: Flashcards
      es: Tarjetas
    columns:
    - subject
    - front
    - back
    - due
    - reps
    export: true
    roles:
    - student
  - key: quiz_table
    type: table
    source: collection:quiz_questions
    title:
      it: Quiz
      en: Quiz
      es: Cuestionario
    columns:
    - subject
    - question
    - answer
    - explanation
    roles:
    - student
  - key: chat
    type: chat
    source: agent:tutor
    title:
      it: Chatta e ripassa
      en: Chat and review
      es: Chatea y repasa
    examples:
    - it: Spiegami meglio la fotosintesi con un esempio
      en: Explain photosynthesis better with an example
      es: Explícame mejor la fotosíntesis con un ejemplo
    - it: Facciamo il ripasso di oggi
      en: Let's do today's review
      es: Hagamos el repaso de hoy
    - it: Interrogami con un quiz
      en: Quiz me
      es: Hazme un cuestionario
    placeholder:
      it: Fai una domanda sui tuoi materiali…
      en: Ask about your materials…
      es: Pregunta sobre tus materiales…
    roles:
    - student
  - key: profile
    type: form
    collection: student_profiles
    edit: false
    title:
      it: Profilo e famiglia
      en: Profile and family
      es: Perfil y familia
    submit:
      label: OK
    roles:
    - student
  - key: class_new
    type: form
    collection: classes
    title:
      it: Crea classe
      en: Create class
      es: Crear clase
    submit:
      label:
        it: Crea
        en: Create
        es: Crear
    roles:
    - teacher
  - key: class_share
    type: form
    collection: shared_materials
    title:
      it: Condividi con la classe
      en: Share with the class
      es: Compartir con la clase
    submit:
      label:
        it: Condividi
        en: Share
        es: Compartir
    roles:
    - teacher
  - key: class_results
    type: table
    source: collection:quiz_results
    title:
      it: Risultati quiz
      en: Quiz results
      es: Resultados
    columns:
    - subject
    - student_email
    - score
    - total
    - taken
    export: true
    roles:
    - teacher
  - key: class_stats
    type: table
    source: collection:quiz_results
    title:
      it: Medie per materia
      en: Averages by subject
      es: Medias por asignatura
    data:
      display: chart
      chart: bar
      fields:
      - key: subject
      - key: avg_score
      groupBy:
        field: subject
        aggs:
        - key: avg_score
          agg: avg
          field: score
    roles:
    - teacher
  - key: family
    type: table
    source: collection:quiz_results
    title:
      it: Progressi
      en: Progress
      es: Progreso
    columns:
    - subject
    - score
    - total
    - taken
    roles:
    - parent
  - key: account
    type: account
    title:
      it: Piano
      en: Plan
      es: Plan
    roles:
    - student
    - teacher
  triggers:
  - key: daily_review
    description: Reminds the student of flashcards due today
    'on':
      date:
        collection: flashcards
        field: due
        offsetDays: 0
        hour: 7
    notify:
      to: owner
      subject:
        it: Hai flashcard da ripassare oggi
        en: You have flashcards to review today
        es: Tienes tarjetas para repasar hoy
      body:
        it: 'È ora del ripasso: la carta "{record.front}" ti aspetta. Apri StudiaSmart e scrivi "Facciamo il ripasso di oggi".'
        en: 'Time to review: the card "{record.front}" is waiting. Open StudiaSmart and say "Let''s do today''s review".'
        es: 'Hora de repasar: la tarjeta "{record.front}" te espera. Abre StudiaSmart y escribe "Hagamos el repaso de hoy".'
      link: chat
  notifications:
    emailOnRunDone: true
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: student
      price: 39
      interval: year
      label:
        it: Studente annuale
        en: Student yearly
        es: Estudiante anual
      includes:
      - unlimited documents
      - chat
      - spaced repetition
      roles:
      - student
    - key: school
      price: 990
      interval: year
      label:
        it: Licenza scuola
        en: School licence
        es: Licencia escolar
      includes:
      - teacher classes
      - student seats
      - aggregate results
      roles:
      - teacher
      - admin
  extensions:
  - key: concept_map_canvas
    description: Interactive drag-and-drop concept map canvas (nodes, links, colours, icons). For now concepts and relations
      are shown and edited as table/form rows.
  - key: read_aloud
    description: Read-aloud (text-to-speech) is a browser feature, not yet a manifest option; the high-legibility Lexend font
      is set in branding.
  - key: student_seat_licensing
    description: School licence seats and linking students to a school are not modelled yet; teachers add students by email
      in their class.
  - key: daily_digest
    description: The daily reminder is sent per card due today (capped per day by the platform); a single per-user digest
      needs a per-user scheduled run.
