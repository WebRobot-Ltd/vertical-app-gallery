apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: studiasmart
  displayName: StudiaSmart
  tagline:
    it: Trasforma i tuoi appunti in mappe, flashcard e quiz.
    en: Turn your notes into maps, flashcards and quizzes.
    es: Convierte tus apuntes en mapas, tarjetas y cuestionarios.
  description:
    it: StudiaSmart legge i tuoi materiali di studio, ne estrae concetti e relazioni e genera mappa concettuale, flashcard
      e quiz con spiegazioni. Puoi chattare con i tuoi materiali, con risposte che citano il testo. Pensata anche per studenti
      con DSA.
    en: StudiaSmart reads your study material, extracts concepts and relations and builds a concept map, flashcards and a
      quiz with explanations. Chat with your material and get answers that cite the text. Designed with dyslexia and other
      learning differences in mind.
    es: StudiaSmart lee tu material de estudio, extrae conceptos y relaciones y crea un mapa conceptual, tarjetas y un cuestionario
      con explicaciones. Chatea con tu material y recibe respuestas que citan el texto.
  langs:
  - it
  - en
  - es
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#2b3a67'
      accent: '#f28f3b'
      background: '#fbf9f4'
      foreground: '#1d2433'
    fonts:
      body: Atkinson Hyperlegible
      display: Lexend
    wordmark:
    - text: Studia
      color: primary
    - text: Smart
      color: accent
    buttonShape: rounded
    width: wide
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
        es: Cómo funciona
      href: '#come-funziona'
    - label:
        it: Per chi
        en: Who it is for
        es: Para quién
      href: '#per-chi'
    - label:
        it: Prezzi
        en: Pricing
        es: Precios
      href: '#prezzi'
    cta:
      label:
        it: Inizia
        en: Start
        es: Empezar
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: student
      label:
        it: Studente
        en: Student
        es: Estudiante
      assignedBy: signup
    - key: teacher
      label:
        it: Docente
        en: Teacher
        es: Docente
      assignedBy: invite
    - key: family
      label:
        it: Famiglia
        en: Family
        es: Familia
      assignedBy: derived
      from: collection:guardians.guardian_email
  limits:
  - action: agent:builder
    per: user
    max: 5
    window: month
    roles:
    - student
  - action: chat
    per: user
    max: 60
    window: day
    roles:
    - student
  agents:
  - key: builder
    role: main
    description: Reads the pasted study material and produces concept map, flashcards and quiz; saves them in the student's
      own collections.
    profile:
      inline:
        display_name: StudiaSmart builder
        crews:
        - id: builder
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are a study coach who turns a student''s own material into visual study tools. Readers may have
            dyslexia or other learning differences: use short sentences, plain words, one idea per line, no dense paragraphs.


            Work only from the supplied text; never add facts that are not in it (if you add context mark it ''extra''). First
            call save_document once with the subject, title and full text so it can be searched later. Then extract 8-20 key
            concepts and their relations.


            Call save_map once with a JSON map: nodes [{id,label,color,icon}] and edges [{from,to,label}] (color a hex, icon
            a single emoji). Call save_cards once per card (4-20 cards) with front, back, subject, due = today''s date, interval_days
            = 1, source = the passage it comes from.


            Final answer is the report in Markdown, in the requested language. Start with a level-1 title ''# <Subject> —
            <topic>''. Then sections with ## headings: Summary (max 5 bullets), Concept map (an indented outline of nodes
            with the relations written as ''A → relation → B''), Flashcards (table front | back), Quiz (8 multiple-choice
            questions, options A-D, then for each the correct answer and a 1-2 sentence explanation that quotes the passage),
            What to review first. Never invent figures or quotes.'
          mcp_servers: []
    appTools:
    - name: save_document
      description: Save the study material of the student
      action: write
      collection: documents
      scope: user
    - name: save_map
      description: Save the concept map (nodes and edges as JSON)
      action: write
      collection: concept_maps
      scope: user
    - name: save_card
      description: Add one flashcard
      action: append
      collection: flashcards
      scope: user
    goalTemplate: 'Subject: {subject}

      Title: {title}

      Level: {level_label}

      Material (pasted by the student):

      {material}

      {?focus}Focus on: {focus}{/focus}

      Today is {date}. Write everything in the language with ISO code {lang}.'
    output: markdown
    limits:
      maxTurns: 10
      maxBudgetUsd: 0.6
  - key: tutor
    role: helper
    description: Chat with the student's own materials, citing the passage.
    profile:
      inline:
        display_name: StudiaSmart tutor
        crews:
        - id: tutor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You are a patient tutor. Answer the student's question using the material found with search_docs.
            Always cite the document title and quote the relevant passage in a blockquote. If the material does not cover
            it, say so plainly, then give a short general explanation marked 'Not in your notes'. Use short sentences, simple
            words, and a concrete example when asked. Never invent quotes or figures.
    appTools:
    - name: search_docs
      description: Search the student's own documents
      action: search
      collection: documents
      scope: user
    - name: read_map
      description: Read the student's concept maps
      action: read
      collection: concept_maps
      scope: user
    goalTemplate: 'Conversation so far:

      {history}

      New message: {message}

      Answer in the language with ISO code {lang}.'
    output: markdown
  - key: reviewer
    role: scheduled
    description: Every day picks the flashcards due for one subject of one student.
    memory: instance
    writesTo:
      collection: daily_review
      parse: whole
      keyBy: date
    profile:
      inline:
        display_name: StudiaSmart daily review
        crews:
        - id: reviewer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 5
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You run spaced repetition for one subject of one student. Use read_cards to get their flashcards
            for the subject; pick those whose due date is today or earlier (max 15), hardest first. Start with '# Review —
            <subject> — <date>'. List each card as front, then the answer hidden under 'Answer:'. End with a line of encouragement.
            Use remember to store which cards you proposed. Never invent cards.
          mcp_servers: []
    appTools:
    - name: read_cards
      description: Read the student's flashcards
      action: read
      collection: flashcards
      scope: user
  templates:
  - key: daily_review
    title:
      it: Ripasso quotidiano
      en: Daily review
      es: Repaso diario
    description:
      it: Ogni giorno le flashcard da ripassare per una materia.
      en: Every day, the flashcards to review for a subject.
      es: Cada día, las tarjetas a repasar de una asignatura.
    agent: reviewer
    params:
    - name: subject
      type: text
      required: true
      label:
        it: Materia
        en: Subject
        es: Asignatura
    goal: 'Daily review of "{instance}": subject {subject}. Today is {date}. Write in the language with ISO code {lang}.'
    schedule:
      cron: 0 6 * * *
      userCanChange: true
    maxPerUser: 8
    roles:
    - student
    cost:
      perRun: 2
  inputForm:
    title:
      it: Nuovo materiale
      en: New material
      es: Nuevo material
    fields:
    - name: subject
      type: text
      required: true
      label:
        it: Materia
        en: Subject
        es: Asignatura
    - name: title
      type: text
      required: true
      label:
        it: Titolo
        en: Title
        es: Título
    - name: material
      type: textarea
      required: true
      maxLength: 20000
      label:
        it: Testo degli appunti
        en: Notes text
        es: Texto de los apuntes
      help:
        it: Incolla qui il testo (il caricamento di file non è ancora disponibile).
        en: Paste the text here (file upload is not available yet).
        es: Pega aquí el texto (la subida de archivos aún no está disponible).
    - name: level
      type: select
      required: true
      default: high
      label:
        it: Livello
        en: Level
        es: Nivel
      options:
      - value: high
        label:
          it: Superiori
          en: High school
          es: Secundaria
      - value: uni
        label:
          it: Università
          en: University
          es: Universidad
    - name: focus
      type: text
      maxLength: 200
      label:
        it: Cosa ti serve di più (facoltativo)
        en: What you need most (optional)
        es: Lo que más necesitas (opcional)
  data:
    collections:
    - name: documents
      ownedBy: user
      searchable: true
      description: Study material of each student
      fields:
      - name: subject
        type: text
      - name: title
        type: text
      - name: text
        type: textarea
    - name: concept_maps
      ownedBy: user
      description: Editable concept maps (nodes, edges, colours, icons)
      fields:
      - name: subject
        type: text
      - name: title
        type: text
      - name: nodes
        type: json
      - name: edges
        type: json
    - name: flashcards
      ownedBy: user
      description: Flashcards with spaced repetition schedule
      fields:
      - name: subject
        type: text
      - name: front
        type: textarea
      - name: back
        type: textarea
      - name: due
        type: date
      - name: interval_days
        type: number
      - name: source
        type: textarea
    - name: daily_review
      ownedBy: instance
      description: The cards proposed each day for a subject
    - name: guardians
      ownedBy: user
      description: Parent or guardian of a minor student
      fields:
      - name: guardian_email
        type: email
        required: true
    - name: classes
      ownedBy: shared
      description: Classes created by teachers
      fields:
      - name: name
        type: text
      - name: code
        type: text
      - name: teacher_email
        type: email
    - name: class_materials
      ownedBy: shared
      description: Materials and maps a teacher shares with a class
      fields:
      - name: class_code
        type: text
      - name: title
        type: text
      - name: content
        type: textarea
    - name: quiz_results
      ownedBy: shared
      description: Quiz scores only (no notes) for class aggregates
      fields:
      - name: class_code
        type: text
      - name: quiz_title
        type: text
      - name: score_pct
        type: number
      - name: student_alias
        type: text
  views:
  - key: home
    type: page
    nav: false
    title: StudiaSmart
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow:
        it: Per scuole superiori e università, anche con DSA
        en: For high school and university, DSA-friendly
        es: Para secundaria y universidad, apto para DSA
      title:
        it: Dai tuoi appunti a **mappe, flashcard e quiz**.
        en: From your notes to **maps, flashcards and quizzes**.
        es: De tus apuntes a **mapas, tarjetas y cuestionarios**.
      text:
        it: 'Incolla il testo, l''agente estrae i concetti e prepara gli strumenti per studiare. Poi chiedi ai tuoi materiali:
          le risposte citano il testo.'
        en: 'Paste your text, the agent extracts the concepts and prepares your study tools. Then ask your material: answers
          quote the text.'
        es: 'Pega tu texto, el agente extrae los conceptos y prepara tus herramientas. Luego pregunta a tu material: las respuestas
          citan el texto.'
      actions:
      - label:
          it: Prova gratis
          en: Try for free
          es: Prueba gratis
        href: /login
        style: primary
      aside: <div style="padding:16px"><b>Fotosintesi</b><br>🌱 Luce → clorofilla → glucosio<br>❓ Quiz 8 domande<br>🃏 12 flashcard</div>
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
        es: Cómo funciona
      items:
      - title:
          it: Crea la materia
          en: Create a subject
          es: Crea la asignatura
        text:
          it: Incolla appunti o testo delle slide.
          en: Paste notes or slide text.
          es: Pega apuntes o texto de diapositivas.
        badge: 📚
      - title:
          it: Ottieni gli strumenti
          en: Get your tools
          es: Obtén tus herramientas
        text:
          it: Mappa concettuale, flashcard e quiz con spiegazioni.
          en: Concept map, flashcards and a quiz with explanations.
          es: Mapa conceptual, tarjetas y cuestionario con explicaciones.
        badge: 🗺️
      - title:
          it: Ripassa ogni giorno
          en: Review daily
          es: Repasa cada día
        text:
          it: Ripetizione spaziata e chat con i tuoi materiali.
          en: Spaced repetition and chat with your material.
          es: Repetición espaciada y chat con tu material.
        badge: 🔁
    - type: cards
      id: per-chi
      title:
        it: Per chi
        en: Who it is for
        es: Para quién
      items:
      - title:
          it: Studenti
          en: Students
          es: Estudiantes
        text:
          it: Font ad alta leggibilità, frasi brevi, lettura ad alta voce.
          en: High-legibility font, short sentences, read aloud.
          es: Fuente muy legible, frases cortas, lectura en voz alta.
      - title:
          it: Docenti
          en: Teachers
          es: Docentes
        text:
          it: Classi, materiali condivisi, risultati aggregati dei quiz. Mai gli appunti privati.
          en: Classes, shared material, aggregated quiz results. Never private notes.
          es: Clases, material compartido, resultados agregados. Nunca los apuntes privados.
      - title:
          it: Famiglie
          en: Families
          es: Familias
        text:
          it: Solo i progressi del figlio minorenne.
          en: Only the progress of your minor child.
          es: Solo el progreso de tu hijo menor.
    - type: cards
      id: prezzi
      title:
        it: Prezzi
        en: Pricing
        es: Precios
      items:
      - title: Free
        text:
          it: Alcuni documenti al mese.
          en: A few documents per month.
          es: Algunos documentos al mes.
      - title:
          it: Studente annuale
          en: Student yearly
          es: Estudiante anual
        text:
          it: Più documenti e crediti ogni mese.
          en: More documents and monthly credits.
          es: Más documentos y créditos mensuales.
      - title:
          it: Licenza scuola
          en: School licence
          es: Licencia escolar
        text:
          it: Per classi e istituti.
          en: For classes and schools.
          es: Para clases y centros.
    - type: note
      content:
        it: Strumento di studio, non sostituisce docenti o diagnosi. I contenuti generati vanno verificati sul materiale.
        en: A study aid; it does not replace teachers or diagnosis. Check generated content against your material.
        es: Ayuda de estudio; no sustituye a docentes ni diagnósticos. Verifica el contenido con tu material.
  - key: new
    type: new_run
    title:
      it: Nuovo materiale
      en: New material
      es: Nuevo material
    roles:
    - student
    - admin
  - key: history
    type: history
    title:
      it: I miei materiali
      en: My materials
      es: Mis materiales
    source: run
    roles:
    - student
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: maps
    type: cards
    title:
      it: Le mie mappe
      en: My maps
      es: Mis mapas
    source: collection:concept_maps
    data:
      display: cards
      fields:
      - key: subject
        label:
          it: Materia
          en: Subject
          es: Asignatura
      - key: title
        label:
          it: Titolo
          en: Title
          es: Título
      - key: nodes
        label: Nodes
      - key: edges
        label: Edges
    roles:
    - student
  - key: cards
    type: table
    title:
      it: Flashcard
      en: Flashcards
      es: Tarjetas
    source: collection:flashcards
    data:
      display: table
      fields:
      - key: subject
        label: Subject
      - key: front
        label: Front
      - key: back
        label: Back
      - key: due
        label: Due
        format: date
      sort:
        field: due
        dir: asc
      limit: 100
    roles:
    - student
  - key: chat
    type: chat
    title:
      it: Chiedi ai tuoi materiali
      en: Ask your material
      es: Pregunta a tu material
    source: agent:tutor
    examples:
    - Spiegami meglio la fotosintesi con un esempio
    - Riassumi il capitolo 2 in 5 punti
    - Explícame este concepto con un ejemplo
    placeholder:
      it: Fai una domanda sui tuoi appunti…
      en: Ask about your notes…
      es: Pregunta sobre tus apuntes…
    roles:
    - student
  - key: reviews
    type: instances
    template: daily_review
    title:
      it: Ripasso quotidiano
      en: Daily review
      es: Repaso diario
    roles:
    - student
  - key: class_list
    type: table
    title:
      it: Le mie classi
      en: My classes
      es: Mis clases
    source: collection:classes
    data:
      display: table
      fields:
      - key: name
        label: Name
      - key: code
        label: Code
    roles:
    - teacher
    - admin
  - key: class_shared
    type: list
    title:
      it: Materiali di classe
      en: Class material
      es: Material de clase
    source: collection:class_materials
    data:
      display: list
      fields:
      - key: class_code
        label: Class
      - key: title
        label: Title
    roles:
    - teacher
    - student
    - admin
  - key: class_results
    type: chart
    title:
      it: Risultati dei quiz
      en: Quiz results
      es: Resultados de cuestionarios
    source: collection:quiz_results
    data:
      display: bar
      fields:
      - key: quiz_title
        label: Quiz
      - key: score_pct
        label: Avg %
      kpis:
      - label: Avg %
        agg: avg
        field: score_pct
        format: number
    roles:
    - teacher
    - admin
  - key: family_progress
    type: table
    title:
      it: Progressi di mio figlio
      en: My child's progress
      es: Progreso de mi hijo
    source: collection:quiz_results
    data:
      display: table
      fields:
      - key: quiz_title
        label: Quiz
      - key: score_pct
        label: '%'
    roles:
    - family
  - key: account
    type: account
    title:
      it: Crediti e piano
      en: Credits and plan
      es: Créditos y plan
    roles:
    - student
    - teacher
  billing:
    modes:
    - credits
    - subscription
    currency: eur
    signupCredits: 50
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:builder:
        estimate: 10
        metered: true
      agent:tutor:
        estimate: 2
        metered: true
    packs:
    - key: small
      credits: 300
      price: 4
      label: '300'
    plans:
    - key: student_year
      price: 39
      interval: year
      label:
        it: Studente annuale
        en: Student yearly
        es: Estudiante anual
      credits: 400
      creditsReset: monthly
      roles:
      - student
    - key: school
      price: 490
      interval: year
      label:
        it: Licenza scuola
        en: School licence
        es: Licencia escolar
      credits: 5000
      creditsReset: monthly
      roles:
      - teacher
  extensions:
  - key: file_upload
    description: 'Upload of PDF, slides and photos of pages (with OCR) is not available yet: the student pastes text.'
  - key: daily_notification
    description: 'The daily push/email reminder for flashcards is not available yet: the student opens the Daily review view.'
  - key: read_aloud_and_accessibility
    description: Read-aloud (speech synthesis), dyslexia font toggle and size/spacing controls are client features not expressible
      in the manifest; the base font is already high-legibility.
  - key: interactive_map_editor
    description: A visual node-link editor (drag nodes, colours, icons) for concept_maps; today maps are stored as JSON nodes/edges
      and shown as cards.
  - key: class_scoping_and_family_view
    description: Per-class visibility (teacher sees only own classes and only aggregated quiz scores) and per-child filtering
      for the family role need cross-user record scoping the runtime does not offer yet; quiz_results holds only scores and
      aliases, never notes.
  - key: spaced_repetition_grading
    description: Updating each card's due date and interval after the student rates it (SM-2) needs a small slot or client
      action.
