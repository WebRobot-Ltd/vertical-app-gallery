apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: protezionefamiglia
  displayName: ProtezioneFamiglia
  tagline:
    it: Quanto serve davvero alla tua famiglia se un giorno non ci sei?
    en: How much would your family really need if you were gone?
  description:
    it: 'Rispondi a poche domande su reddito, mutuo, figli e spese: un calcolo stima il capitale e la durata di una polizza
      vita temporanea caso morte e un agente te lo spiega in modo semplice. Se vuoi, un intermediario iscritto all''albo può
      ricontattarti. L''app non vende polizze.'
    en: 'Answer a few questions about income, mortgage, children and expenses: a calculation estimates the capital and term
      of a term life policy and an agent explains it simply. If you want, a registered intermediary can contact you. The app
      does not sell policies.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#17405e'
      accent: '#2f8f83'
      background: '#f7f9fb'
      foreground: '#1a2430'
    fonts:
      body: Inter
      display: Merriweather
    wordmark:
    - text: Protezione
      color: primary
    - text: Famiglia
      color: accent
    width: normal
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Intermediario
        en: Intermediary
      href: '#intermediario'
    cta:
      label:
        it: Inizia
        en: Start
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
    - key: intermediary
      label:
        it: Intermediario iscritto all'albo
        en: Registered intermediary
      assignedBy: invite
  limits:
  - action: agent:advisor
    per: user
    max: 10
    window: day
    roles:
    - user
  slots:
  - key: needs_calc
    description: Capital needed and recommended term from the family's figures
    timeoutMs: 2000
    example:
      values:
        age: 38
        partner_income: 15000
        mortgage_balance: 120000
        mortgage_years: 20
        children: 2
        youngest_age: 4
        savings: 20000
        monthly_expenses: 2400
      lang: it
    code: "def num(v, d=0.0):\n    try:\n        return float(v)\n    except Exception:\n        return d\n\ndef main(input):\n\
      \    v = input.get('values') or {}\n    age = num(v.get('age'), 40)\n    partner = num(v.get('partner_income'))\n  \
      \  mortgage = num(v.get('mortgage_balance'))\n    m_years = num(v.get('mortgage_years'))\n    kids = int(num(v.get('children')))\n\
      \    youngest = num(v.get('youngest_age'))\n    savings = num(v.get('savings'))\n    monthly = num(v.get('monthly_expenses'))\n\
      \    kid_years = max(0.0, 25 - youngest) if kids > 0 else 0.0\n    duration = max(m_years, kid_years)\n    duration\
      \ = max(5, min(30, round(duration)))\n    duration = int(max(5, min(duration, 75 - age)))\n    support_years = max(3.0,\
      \ min(20.0, kid_years)) if kids > 0 else 3.0\n    gap_year = max(0.0, monthly * 12 - partner)\n    support = gap_year\
      \ * support_years\n    education = kids * 20000.0\n    final = 8000.0\n    gross = mortgage + support + education +\
      \ final\n    need = max(0.0, gross - savings)\n    capital = int(round(need / 5000.0) * 5000)\n    return {\n      \
      \  'capital': capital,\n        'duration': duration,\n        'support_years': int(support_years),\n        'part_mortgage':\
      \ int(mortgage),\n        'part_support': int(support),\n        'part_education': int(education),\n        'part_final':\
      \ int(final),\n        'part_savings': int(savings)\n    }\n"
  agents:
  - key: advisor
    role: main
    description: Explains the calculated capital and term in plain language; asks the intermediary queue for a recontact only
      when the user consents.
    awaits:
    - contact_request
    context:
    - key: calc
      from: slot:needs_calc
    goalTemplate: 'Dati della famiglia: età {age}, reddito netto annuo del partner/altri redditi {partner_income} €, mutuo
      residuo {mortgage_balance} € per {mortgage_years} anni, figli {children} (il più piccolo ha {youngest_age} anni), risparmi
      liquidi {savings} €, spese familiari mensili {monthly_expenses} €.

      RISULTATO DEL CALCOLO (non modificarlo): capitale consigliato {capital} €, durata consigliata {duration} anni. Componenti:
      mutuo {part_mortgage} €, sostegno al reddito per {support_years} anni {part_support} €, studi dei figli {part_education}
      €, spese finali {part_final} €, meno risparmi {part_savings} €.

      {?contact_consent}L''utente ha dato il consenso a essere ricontattato da un intermediario iscritto all''albo. Recapito:
      {contact_info}. Dopo il report chiama request_contact_request con riepilogo, capitale, durata e recapito.{/contact_consent}{!contact_consent}L''utente
      NON ha chiesto di essere ricontattato: non chiamare request_contact_request.{/contact_consent}

      Data: {date}. Scrivi in lingua con codice ISO {lang}.'
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.5
    profile:
      inline:
        display_name: ProtezioneFamiglia advisor
        crews:
        - id: advisor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un divulgatore assicurativo che spiega in linguaggio semplice a una persona il risultato di
            una stima per una polizza vita temporanea caso morte. Il capitale e la durata ti sono dati già calcolati: usali,
            non rifarli né cambiarli e non inventare cifre. Struttura del report, iniziando con un titolo di livello 1 "#
            La protezione per la tua famiglia: <capitale> € per <durata> anni". Poi sezioni ## : Il risultato in breve; Da
            cosa nasce questa cifra (una tabella con le componenti e un blocco chart di tipo bar con le componenti, formato
            ```chart con JSON {"type":"bar","title":"...","labels":[...],"series":[{"name":"...","values":[...]}],"unit":"€"});
            Due esempi concreti (cosa succederebbe alla famiglia con e senza la copertura, usando solo i numeri dati); Cosa
            può cambiare la stima (altri redditi, coperture già esistenti, inflazione, tasso del mutuo); Cosa chiedere a un
            intermediario; Prossimi passi. Meno di 500 parole. Regole: è una stima indicativa, non una consulenza assicurativa,
            finanziaria o legale personalizzata; non raccomandare compagnie, prodotti o prezzi; non promettere premi; non
            vendere nulla. Dì chiaramente che l''app non vende polizze. Se l''utente ha dato il consenso, dopo il report chiama
            request_contact_request una sola volta, con i campi riepilogo, capitale, durata, recapito; altrimenti non chiamarlo
            mai.'
  approvals:
  - key: contact_request
    title:
      it: Richiesta di ricontatto
      en: Contact request
    description: A user who consented asks to be contacted by a registered intermediary. Approving means the intermediary
      takes charge of the contact.
    role: intermediary
    decidedBy: role
    fields:
    - riepilogo
    - capitale
    - durata
    - recapito
    timeoutMinutes: 10080
    onTimeout: reject
  inputForm:
    title:
      it: La tua situazione familiare
      en: Your family situation
    fields:
    - name: age
      type: number
      required: true
      label:
        it: La tua età
        en: Your age
    - name: partner_income
      type: number
      required: true
      default: 0
      label:
        it: Altri redditi netti annui in famiglia (€)
        en: Other net yearly household income (€)
      help:
        it: Reddito del partner o altro che resterebbe; 0 se nessuno
        en: Partner or other income that would remain; 0 if none
    - name: mortgage_balance
      type: number
      required: true
      default: 0
      label:
        it: Mutuo residuo (€)
        en: Remaining mortgage (€)
    - name: mortgage_years
      type: number
      required: true
      default: 0
      label:
        it: Anni residui del mutuo
        en: Mortgage years left
    - name: children
      type: number
      required: true
      default: 0
      label:
        it: Numero di figli a carico
        en: Dependent children
    - name: youngest_age
      type: number
      default: 0
      label:
        it: Età del figlio più piccolo
        en: Age of the youngest child
    - name: savings
      type: number
      required: true
      default: 0
      label:
        it: Risparmi liquidi (€)
        en: Liquid savings (€)
    - name: monthly_expenses
      type: number
      required: true
      label:
        it: Spese familiari mensili (€)
        en: Monthly family expenses (€)
    - name: contact_consent
      type: boolean
      default: false
      label:
        it: Voglio essere ricontattato da un intermediario iscritto all'albo
        en: I want to be contacted by a registered intermediary
      help:
        it: Acconsento a condividere questa simulazione e il mio recapito con un intermediario. L'app non vende polizze.
        en: I agree to share this simulation and my contact details with an intermediary. The app does not sell policies.
    - name: contact_info
      type: text
      visibleWhen: contact_consent == true
      maxLength: 200
      label:
        it: Telefono o email per il ricontatto
        en: Phone or email for contact
  views:
  - key: home
    type: page
    nav: false
    title: ProtezioneFamiglia
    sections:
    - type: hero
      band: true
      eyebrow:
        it: Polizza vita temporanea caso morte
        en: Term life insurance
      title:
        it: Quanto serve **davvero** alla tua famiglia?
        en: How much does your family **really** need?
      text:
        it: Rispondi a poche domande su reddito, mutuo, figli e spese. Un calcolo stima il capitale e la durata della copertura
          e un agente te lo spiega in parole semplici, con esempi. Gratuito.
        en: Answer a few questions about income, mortgage, children and expenses. A calculation estimates the capital and
          term, and an agent explains it simply. Free.
      actions:
      - label:
          it: Inizia la simulazione
          en: Start the simulation
        href: /login
        style: primary
      note:
        it: Stima indicativa, non è consulenza assicurativa.
        en: Indicative estimate, not insurance advice.
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Rispondi
          en: Answer
        text:
          it: Reddito, mutuo, figli, risparmi e spese mensili.
          en: Income, mortgage, children, savings and monthly expenses.
      - title:
          it: Ricevi il calcolo
          en: Get the calculation
        text:
          it: Capitale che servirebbe e durata consigliata, con le voci che lo compongono.
          en: Capital needed and recommended term, with its components.
      - title:
          it: Salva e, se vuoi, fatti ricontattare
          en: Save and, if you want, get contacted
        text:
          it: Le simulazioni restano private, solo tue. Puoi chiedere di essere ricontattato da un intermediario iscritto
            all'albo.
          en: Simulations stay private to you. You can ask a registered intermediary to contact you.
    - type: cards
      id: intermediario
      title:
        it: Per gli intermediari
        en: For intermediaries
      items:
      - title:
          it: Coda di richieste qualificate
          en: Qualified request queue
        text:
          it: Ricevi solo richieste di utenti che hanno dato il consenso, con simulazione, capitale e durata. Il compenso
            è per contatto qualificato.
          en: You only receive requests from consenting users, with simulation, capital and term. Fee per qualified contact.
    - type: note
      content:
        it: ProtezioneFamiglia non vende né intermedia polizze. Le stime sono indicative e non sostituiscono la consulenza
          di un intermediario iscritto all'albo.
        en: ProtezioneFamiglia does not sell or broker policies. Estimates are indicative and do not replace the advice of
          a registered intermediary.
  - key: new
    type: new_run
    title:
      it: Nuova simulazione
      en: New simulation
    roles:
    - user
    - admin
  - key: simulations
    type: history
    title:
      it: Le mie simulazioni
      en: My simulations
    source: run
    roles:
    - user
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: queue
    type: approvals
    title:
      it: Coda richieste di ricontatto
      en: Contact request queue
    approvals:
    - contact_request
    roles:
    - intermediary
    - admin
  billing:
    modes:
    - free
  extensions:
  - key: intermediary_fee
    description: 'Per-qualified-contact fee charged to intermediaries is not supported by billing yet: invoice outside the
      app, counting approved contact_request items.'
  - key: intermediary_email
    description: 'Email notification to intermediaries on new requests is not available yet: they check the queue view.'
