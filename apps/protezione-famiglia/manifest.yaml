apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: protezionefamiglia
  displayName: ProtezioneFamiglia
  tagline:
    it: Quanto serve davvero alla tua famiglia se un giorno non ci fossi?
    en: How much would your family really need if you were gone?
  description:
    it: Simulazione gratuita del capitale e della durata di una polizza vita temporanea caso morte, spiegata in parole semplici.
      Puoi chiedere di essere ricontattato da un intermediario iscritto all'albo. L'app non vende polizze.
    en: Free simulation of the cover amount and term of a term life policy, explained in plain words. You can ask to be contacted
      by a registered intermediary. The app does not sell policies.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#17405e'
      accent: '#e07a3f'
      background: '#f8f6f2'
      foreground: '#1c2530'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Protezione
      color: primary
    - text: Famiglia
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    cta:
      label:
        it: Inizia
        en: Start
      href: /v/new_sim
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
    - key: intermediary
      label:
        it: Intermediario iscritto all'albo
        en: Registered intermediary
      assignedBy: invite
  limits:
  - action: agent:advisor
    per: user
    max: 10
    window: day
    roles:
    - user
  slots:
  - key: calc
    description: Capital needed and recommended term from the family data
    timeoutMs: 2000
    example:
      values:
        monthly_expenses: 2500
        mortgage_balance: 150000
        mortgage_years: 20
        children: 2
        youngest_age: 4
        savings: 20000
        existing_cover: 0
        partner_income: 20000
        income: 40000
      lang: it
    code: "def num(v):\n    try:\n        return float(v)\n    except Exception:\n        return 0.0\n\ndef main(input):\n\
      \    v = input.get('values') or {}\n    exp = num(v.get('monthly_expenses')) * 12\n    income = num(v.get('income'))\n\
      \    partner = num(v.get('partner_income'))\n    mort = num(v.get('mortgage_balance'))\n    my = num(v.get('mortgage_years'))\n\
      \    kids = int(num(v.get('children')))\n    age = num(v.get('youngest_age'))\n    sav = num(v.get('savings'))\n   \
      \ cover = num(v.get('existing_cover'))\n    kid_years = max(0.0, 25 - age) if kids > 0 else 0.0\n    years = int(round(max(kid_years,\
      \ my, 5)))\n    years = min(years, 35)\n    gap = max(0.0, exp * 0.8 - partner)\n    income_part = gap * min(years,\
      \ 10)\n    edu = 15000.0 * kids\n    capital = income_part + mort + edu + 10000.0 - sav - cover\n    capital = max(0.0,\
      \ capital)\n    capital = int(round(capital / 5000.0) * 5000)\n    return {\n        'capital': capital,\n        'years':\
      \ years,\n        'income_part': int(round(income_part)),\n        'mortgage_part': int(round(mort)),\n        'education_part':\
      \ int(round(edu)),\n        'buffer_part': 10000,\n        'savings_used': int(round(sav + cover)),\n        'annual_gap':\
      \ int(round(gap))\n    }\n"
  agents:
  - key: advisor
    role: main
    description: Explains the calculated cover and term in plain language with examples.
    context:
    - key: capital
      from: slot:calc
    - key: years
      from: slot:calc
    - key: income_part
      from: slot:calc
    - key: mortgage_part
      from: slot:calc
    - key: education_part
      from: slot:calc
    - key: buffer_part
      from: slot:calc
    - key: savings_used
      from: slot:calc
    - key: annual_gap
      from: slot:calc
    goalTemplate: 'Dati della famiglia: reddito annuo netto {income} EUR; reddito annuo del partner {partner_income} EUR;
      spese familiari mensili {monthly_expenses} EUR; mutuo residuo {mortgage_balance} EUR per {mortgage_years} anni; figli
      {children}, età del più piccolo {youngest_age}; risparmi {savings} EUR; coperture vita già esistenti {existing_cover}
      EUR.

      Risultato del calcolo (non modificarlo): capitale consigliato {capital} EUR, durata consigliata {years} anni. Componenti:
      sostegno al reddito {income_part} EUR (gap annuo {annual_gap} EUR), mutuo {mortgage_part} EUR, studi dei figli {education_part}
      EUR, riserva {buffer_part} EUR, risparmi ed esistenti detratti {savings_used} EUR.

      Data di oggi: {date}. Scrivi il report nella lingua con codice ISO {lang}.'
    output: markdown+json
    resultSchema:
      type: object
      properties:
        capital:
          type: number
        years:
          type: number
        summary:
          type: string
    writesTo:
      collection: simulations
      parse: json_last
    limits:
      maxTurns: 4
      maxBudgetUsd: 0.3
    profile:
      inline:
        display_name: ProtezioneFamiglia advisor
        crews:
        - id: advisor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 4
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un consulente informativo che aiuta le famiglie a capire quanto capitale e per quanti anni servirebbe
            con una polizza vita temporanea caso morte. Il calcolo è già stato fatto: usa ESATTAMENTE capitale e durata ricevuti,
            non ricalcolarli e non inventare cifre. Struttura del report: titolo di livello 1 "# La tua simulazione: <capitale>
            € per <durata> anni"; poi sezioni ## In breve, ## Come abbiamo ottenuto la cifra (tabella con le componenti),
            ## Un esempio concreto (cosa significherebbe per la famiglia, anno per anno, in modo semplice), ## Cosa puoi fare
            ora (verificare coperture esistenti, confrontare offerte, parlare con un intermediario iscritto all''albo; invita
            a usare il pulsante di richiesta di ricontatto). Linguaggio semplice, senza gergo, sotto 450 parole. Aggiungi
            un blocco ```chart di tipo pie con le componenti del capitale. Non vendere polizze, non indicare prodotti, compagnie
            o premi, non dare consulenza assicurativa o finanziaria personalizzata: è una stima indicativa. Se i dati sembrano
            incoerenti dillo. Alla fine, dopo il report, emetti un unico blocco JSON con {"capital": numero, "years": numero,
            "summary": "frase di una riga"}.'
  inputForm:
    title:
      it: Nuova simulazione
      en: New simulation
    fields:
    - name: income
      type: number
      required: true
      label:
        it: Il tuo reddito annuo netto (€)
        en: Your net annual income (€)
    - name: partner_income
      type: number
      default: 0
      label:
        it: Reddito annuo netto del partner (€)
        en: Partner's net annual income (€)
    - name: monthly_expenses
      type: number
      required: true
      label:
        it: Spese familiari mensili (€)
        en: Monthly family expenses (€)
    - name: mortgage_balance
      type: number
      default: 0
      label:
        it: Mutuo residuo (€)
        en: Remaining mortgage (€)
    - name: mortgage_years
      type: number
      default: 0
      label:
        it: Anni residui del mutuo
        en: Years left on mortgage
    - name: children
      type: number
      required: true
      default: 0
      label:
        it: Numero di figli
        en: Number of children
    - name: youngest_age
      type: number
      default: 0
      label:
        it: Età del figlio più piccolo
        en: Age of youngest child
    - name: savings
      type: number
      default: 0
      label:
        it: Risparmi liquidi (€)
        en: Liquid savings (€)
    - name: existing_cover
      type: number
      default: 0
      label:
        it: Coperture vita già attive (€)
        en: Existing life cover (€)
  data:
    collections:
    - name: simulations
      ownedBy: user
      description: Saved simulations; each user sees only their own
      retentionDays: 730
      fields:
      - name: capital
        type: number
        label:
          it: Capitale (€)
          en: Cover (€)
      - name: years
        type: number
        label:
          it: Durata (anni)
          en: Term (years)
      - name: summary
        type: text
        label:
          it: Sintesi
          en: Summary
    - name: callbacks
      ownedBy: user
      description: Requests to be contacted by a registered intermediary (queue)
      retentionDays: 365
      fields:
      - name: full_name
        type: text
        required: true
        label:
          it: Nome e cognome
          en: Full name
      - name: contact_email
        type: email
        required: true
        label: Email
      - name: phone
        type: text
        required: true
        label:
          it: Telefono
          en: Phone
      - name: capital
        type: number
        label:
          it: Capitale simulato (€)
          en: Simulated cover (€)
      - name: years
        type: number
        label:
          it: Durata simulata (anni)
          en: Simulated term (years)
      - name: preferred_time
        type: select
        label:
          it: Quando preferisci essere chiamato
          en: Preferred time
        options:
        - value: morning
          label:
            it: Mattina
            en: Morning
        - value: afternoon
          label:
            it: Pomeriggio
            en: Afternoon
        - value: evening
          label:
            it: Sera
            en: Evening
      - name: consent
        type: boolean
        required: true
        label:
          it: Acconsento a essere contattato da un intermediario iscritto all'albo e alla condivisione dei dati della simulazione
          en: I agree to be contacted by a registered intermediary and to share my simulation data
      - name: status
        type: select
        default: new
        label:
          it: Stato
          en: Status
        options:
        - value: new
          label:
            it: Nuova
            en: New
        - value: contacted
          label:
            it: Contattata
            en: Contacted
        - value: qualified
          label:
            it: Qualificata
            en: Qualified
        - value: closed
          label:
            it: Chiusa
            en: Closed
      - name: notes
        type: textarea
        label:
          it: Note dell'intermediario
          en: Intermediary notes
      access:
      - role: intermediary
        can:
        - read
        - write
  views:
  - key: home
    type: page
    nav: false
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow:
        it: Polizza vita temporanea caso morte
        en: Term life insurance
      title:
        it: Quanto serve **davvero** alla tua famiglia?
        en: How much does your family **really** need?
      text:
        it: 'Rispondi a poche domande su reddito, mutuo, figli e spese: calcoliamo il capitale e la durata consigliati e te
          li spieghiamo in parole semplici. Gratis.'
        en: 'Answer a few questions about income, mortgage, children and expenses: we calculate the recommended cover and
          term and explain them in plain words. Free.'
      actions:
      - label:
          it: Inizia la simulazione
          en: Start the simulation
        href: /v/new_sim
        style: primary
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Rispondi
          en: Answer
        text:
          it: Reddito, mutuo, figli, risparmi e spese familiari.
          en: Income, mortgage, children, savings and family expenses.
        badge: 📝
      - title:
          it: Calcolo e spiegazione
          en: Calculation and explanation
        text:
          it: Un calcolo determina capitale e durata; un agente AI te li spiega con esempi concreti.
          en: A calculation sets cover and term; an AI agent explains them with concrete examples.
        badge: 🧮
      - title:
          it: Salva e, se vuoi, fatti richiamare
          en: Save and, if you wish, get a call
        text:
          it: Le simulazioni sono solo tue. Puoi chiedere il ricontatto di un intermediario iscritto all'albo.
          en: Simulations are yours alone. You can ask a registered intermediary to contact you.
        badge: 🤝
    - type: note
      content:
        it: ProtezioneFamiglia fornisce stime indicative a scopo informativo e non vende polizze né fornisce consulenza assicurativa.
          L'eventuale proposta è di competenza di un intermediario iscritto all'albo.
        en: ProtezioneFamiglia gives indicative estimates for information only; it does not sell policies or give insurance
          advice. Any proposal is made by a registered intermediary.
  - key: new_sim
    type: new_run
    title:
      it: Nuova simulazione
      en: New simulation
    roles:
    - user
    - admin
  - key: history
    type: history
    title:
      it: Le mie simulazioni
      en: My simulations
    source: run
    roles:
    - user
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: callback
    type: form
    collection: callbacks
    title:
      it: Fatti ricontattare
      en: Request a call
    fields:
    - full_name
    - contact_email
    - phone
    - capital
    - years
    - preferred_time
    - consent
    submit:
      label:
        it: Invia richiesta
        en: Send request
      message:
        it: 'Richiesta inviata: un intermediario ti contatterà.'
        en: 'Request sent: an intermediary will contact you.'
      redirect: history
    roles:
    - user
    - admin
  - key: queue
    type: table
    title:
      it: Coda richieste
      en: Request queue
    source: collection:callbacks
    columns:
    - full_name
    - contact_email
    - phone
    - capital
    - years
    - preferred_time
    - status
    - notes
    export: true
    roles:
    - intermediary
    - admin
  - key: handle
    type: form
    collection: callbacks
    title:
      it: Gestisci richiesta
      en: Handle request
    fields:
    - status
    - notes
    edit: true
    submit:
      label:
        it: Salva
        en: Save
      redirect: queue
    roles:
    - intermediary
    - admin
    nav: false
  triggers:
  - key: new_callback
    'on':
      collection: callbacks
      op: insert
    notify:
      to:
      - role:intermediary
      subject:
        it: Nuova richiesta di ricontatto
        en: New callback request
      body:
        it: C'è una nuova richiesta di ricontatto da {record.full_name}. Aprila nella coda per gestirla.
        en: There is a new callback request from {record.full_name}. Open the queue to handle it.
      link: queue
  notifications:
    emailOnRunDone: true
  billing:
    modes:
    - free
  extensions:
  - key: qualified_contact_fee
    description: 'Fee paid by the intermediary for each qualified contact (status qualified) is invoiced to the intermediary
      outside the app: automatic charging of a non-customer user is not available yet.'
