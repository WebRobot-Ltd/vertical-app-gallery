apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: comunita-energia
  displayName: ComunitaEnergia
  tagline:
    it: 'Gestisci la tua comunità energetica rinnovabile: ripartizione, incentivi e rendiconti.'
  description:
    it: 'Registra membri e impianti, carica i dati di produzione e consumo: un agente ripartisce l''energia condivisa, calcola
      l''autoconsumo collettivo e prepara ogni mese rendiconto e bozza degli incentivi, che approvi prima di comunicarli ai
      membri.'
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#14532d'
      accent: '#f59e0b'
      background: '#f7faf5'
      foreground: '#1a2a1f'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Comunità
      color: primary
    - text: Energia
      color: accent
  header:
    links:
    - label: Come funziona
      href: '#come-funziona'
    - label: Per i membri
      href: '#membri'
    cta:
      label: Accedi
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Amministratore piattaforma
      assignedBy: admin_emails
    - key: user
      label: Amministratore della comunità
      assignedBy: signup
    - key: member
      label: Membro
      assignedBy: derived
      from: collection:members.member_email
  limits:
  - action: agent:analyst
    per: user
    max: 10
    window: day
    roles:
    - user
  - action: create:members
    max: 20
    window: total
    plans:
      comunita_media: 100
      comunita_grande: -1
  egress:
    hosts:
    - api.open-meteo.com
    notes: 'Open-Meteo: previsioni meteo e irraggiamento, CC BY 4.0. L''API gratuita è per uso non commerciale: per un uso
      commerciale serve un piano a pagamento di Open-Meteo.'
  agents:
  - key: analyst
    role: main
    description: Ripartisce l'energia condivisa, calcola l'autoconsumo collettivo, stima benefici e bozza incentivi del mese.
    awaits:
    - incentive_approval
    profile:
      inline:
        display_name: Analista CER
        crews:
        - id: analyst
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''analista di una comunità energetica rinnovabile (CER) italiana. Ricevi i dati di produzione
            e consumo orari o quartorari (CSV) del mese. Procedi così: 1) leggi membri, regole incentivi e dati della comunità
            con gli strumenti. 2) Per ogni intervallo calcola l''energia condivisa come min(produzione totale degli impianti,
            prelievo totale dei punti di prelievo della comunità); ripartiscila tra i membri secondo le regole della comunità
            (quote di produzione per i produttori, quota di consumo per i consumatori). 3) Calcola la quota di autoconsumo
            collettivo (condivisa / prodotta) e la quota che dà diritto agli incentivi. 4) Stima il beneficio economico della
            comunità e di ogni membro usando SOLO le tariffe e le regole fornite dalla comunità o dall''utente; se mancano,
            dichiara chiaramente le ipotesi e non inventare cifre. 5) Se la comunità ha coordinate, chiama open_meteo_forecast
            (GET, query: latitude, longitude, daily=shortwave_radiation_sum,cloud_cover_mean,temperature_2m_max, forecast_days=7,
            timezone=Europe/Rome) e stima la produzione dei prossimi giorni in modo indicativo, dichiarando l''incertezza.
            6) Individua andamenti anomali (impianto che produce molto meno del previsto, consumi anomali, dati mancanti)
            e registrali con append_alerts. 7) Scrivi una riga per membro con append_allocations (member_email, month, produced_kwh,
            consumed_kwh, shared_kwh, savings_eur, incentive_eur, status=draft) e il rendiconto con append_statements. 8)
            Chiedi l''approvazione con request_incentive_approval prima di concludere: la bozza degli incentivi non va comunicata
            senza approvazione. Se un file è una scansione o un''immagine usa read_upload. Non dare consulenza fiscale o legale
            come fatto; i calcoli sono stime da verificare con il GSE. Il report inizia con un titolo ''# Rendiconto CER —
            <mese>'' e ha le sezioni ## Sintesi, ## Energia condivisa e autoconsumo, ## Ripartizione per membro (tabella),
            ## Bozza distribuzione incentivi, ## Anomalie, ## Previsione produzione, ## Ipotesi e limiti. Aggiungi un grafico
            ```chart con la ripartizione per membro (valori reali). Scrivi in italiano.'
    goalTemplate: 'Mese: {month}.

      Note dell''amministratore: {?notes}{notes}{/notes}{!notes}nessuna{/notes}

      Dati della comunità: {community}

      Produzione:

      {production} {?production_text}{production_text}{/production_text}

      Consumi:

      {consumption} {?consumption_text}{consumption_text}{/consumption_text}

      Oggi è {date}. Scrivi il rendiconto in italiano.'
    context:
    - key: community
      from: collection:community
    appTools:
    - name: read_members
      description: Membri, punti di prelievo e impianti della comunità
      action: read
      collection: members
      scope: user
    - name: read_rules
      description: Regole di ripartizione degli incentivi decise dalla comunità
      action: read
      collection: incentive_rules
      scope: user
    - name: append_allocations
      description: Salva la ripartizione mensile di un membro
      action: append
      collection: allocations
      scope: user
    - name: append_statements
      description: Salva il rendiconto mensile
      action: append
      collection: statements
      scope: user
    - name: append_alerts
      description: Registra un andamento anomalo
      action: append
      collection: alerts
      scope: user
    - name: open_meteo_forecast
      description: Previsioni meteo e irraggiamento Open-Meteo
      action: http
      http:
        method: GET
        url: https://api.open-meteo.com/v1/forecast
        attribution: Open-Meteo.com, CC BY 4.0
    - name: read_upload
      description: Legge un file caricato dall'utente
      action: read_file
    output: markdown
    limits:
      maxTurns: 30
      maxBudgetUsd: 1.5
  - key: publisher
    role: helper
    description: Dopo l'approvazione segna come approvata la ripartizione del mese.
    profile:
      inline:
        display_name: Pubblicatore incentivi
        crews:
        - id: publisher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: L'amministratore ha approvato la bozza degli incentivi di un mese. Leggi le righe di allocations
            del mese indicato con read_allocations e per ognuna ancora in stato draft usa update_allocations per impostare
            status=approved, senza cambiare altro. Chiudi con '# Incentivi comunicati' e il numero di righe aggiornate. Non
            inventare dati.
    goalTemplate: 'Approvazione deciso: {event}. Imposta come approvate le ripartizioni del mese indicato.'
    appTools:
    - name: read_allocations
      description: Ripartizioni dei membri
      action: read
      collection: allocations
      scope: user
    - name: update_allocations
      description: Aggiorna lo stato di una ripartizione
      action: write
      collection: allocations
      scope: user
    output: markdown
    limits:
      maxTurns: 15
      maxBudgetUsd: 0.3
  approvals:
  - key: incentive_approval
    title: Approva la bozza di distribuzione degli incentivi
    decidedBy: requester
    fields:
    - month
    timeoutMinutes: 10080
  triggers:
  - key: on_incentive_approved
    'on':
      approval: incentive_approval
      decision: approved
    start:
      agent: publisher
    goal: 'La bozza incentivi è stata approvata: {event}. Segna come approved le ripartizioni del mese.'
  - key: member_notice
    'on':
      collection: allocations
      op: update
      where:
        status: approved
    notify:
      to:
      - record.member_email
      subject: Il tuo rendiconto CER di {record.month} è disponibile
      body: 'Ciao, il rendiconto di ripartizione dell''energia condivisa per {record.month} è pronto: energia condivisa {record.shared_kwh}
        kWh, risparmio stimato {record.savings_eur} €, incentivo previsto {record.incentive_eur} €. Trovi i dettagli nella
        tua area.'
      link: my_share
  - key: anomaly_alert
    'on':
      collection: alerts
      op: insert
    notify:
      to: owner
      subject: 'Avviso CER: andamento anomalo'
      body: '{record.message} (mese {record.month}, gravità {record.severity}). Controlla l''area comunità.'
  inputForm:
    title: Nuovo rendiconto mensile
    fields:
    - name: month
      type: text
      required: true
      label: Mese (AAAA-MM)
      help: es. 2026-10
    - name: production
      type: file
      required: true
      label: Dati di produzione (CSV/Excel)
      accept:
      - csv
      - xlsx
      - pdf
      maxMb: 15
      multiple: true
    - name: consumption
      type: file
      required: true
      label: Dati di consumo/prelievo (CSV/Excel)
      accept:
      - csv
      - xlsx
      - pdf
      maxMb: 15
      multiple: true
    - name: notes
      type: textarea
      maxLength: 600
      label: Note (facoltative)
      help: es. tariffa incentivo, fermo impianto, guasti
  data:
    collections:
    - name: community
      description: 'Dati della comunità: nome, località, coordinate, tariffe'
      ownedBy: user
      fields:
      - name: name
        type: text
        required: true
        label: Nome della comunità
      - name: cabina
        type: text
        label: Cabina primaria
      - name: latitude
        type: number
        label: Latitudine
      - name: longitude
        type: number
        label: Longitudine
      - name: incentive_tariff
        type: number
        label: Tariffa incentivo (€/MWh)
      - name: energy_price
        type: number
        label: Prezzo energia (€/kWh)
    - name: members
      description: 'Membri: produttori, consumatori, prosumer, con POD e impianti'
      ownedBy: user
      fields:
      - name: name
        type: text
        required: true
        label: Nome
      - name: member_email
        type: email
        required: true
        label: Email
      - name: kind
        type: select
        required: true
        label: Tipo
        options:
        - value: producer
          label: Produttore
        - value: consumer
          label: Consumatore
        - value: prosumer
          label: Prosumer
      - name: pod
        type: text
        label: POD (punto di prelievo)
      - name: plant_kw
        type: number
        label: Potenza impianto (kW)
      - name: plant_id
        type: text
        label: Codice impianto
      access:
      - role: member
        where:
          member_email: '{user.email}'
        can:
        - read
    - name: incentive_rules
      description: Regole decise dalla comunità per distribuire gli incentivi
      ownedBy: user
      fields:
      - name: title
        type: text
        required: true
        label: Titolo
      - name: rule
        type: textarea
        required: true
        label: Regola (es. 50% ai produttori, 30% ai consumatori, 20% al fondo sociale)
    - name: allocations
      description: Ripartizione mensile per membro
      ownedBy: user
      retentionDays: 1825
      fields:
      - name: member_email
        type: email
      - name: member_name
        type: text
      - name: month
        type: text
      - name: produced_kwh
        type: number
      - name: consumed_kwh
        type: number
      - name: shared_kwh
        type: number
      - name: savings_eur
        type: number
      - name: incentive_eur
        type: number
      - name: status
        type: select
        options:
        - draft
        - approved
      access:
      - role: member
        where:
          member_email: '{user.email}'
          status: approved
        can:
        - read
    - name: statements
      description: Rendiconti mensili della comunità
      ownedBy: user
      fields:
      - name: month
        type: text
      - name: shared_kwh
        type: number
      - name: self_consumption_pct
        type: number
      - name: community_benefit_eur
        type: number
      - name: summary
        type: textarea
    - name: alerts
      description: Andamenti anomali rilevati
      ownedBy: user
      fields:
      - name: month
        type: text
      - name: message
        type: textarea
      - name: severity
        type: select
        options:
        - info
        - warning
        - critical
  views:
  - key: home
    type: page
    nav: false
    title: ComunitaEnergia
    sections:
    - type: hero
      title: La tua **comunità energetica** sotto controllo, mese dopo mese.
      text: 'Registra membri e impianti, carica produzione e consumi: l''agente ripartisce l''energia condivisa, calcola l''autoconsumo
        collettivo e prepara rendiconto e bozza incentivi, che approvi tu.'
      actions:
      - label: Accedi
        href: /login
        style: primary
      - label: Come funziona
        href: '#come-funziona'
        style: ghost
    - type: steps
      id: come-funziona
      title: Come funziona
      items:
      - title: Registra la comunità
        text: Membri, punti di prelievo, impianti e regole sugli incentivi.
      - title: Carica i dati
        text: File di produzione e consumo del mese.
      - title: Rendiconto e bozza incentivi
        text: L'agente ripartisce l'energia, stima i benefici e segnala anomalie con le previsioni Open-Meteo.
      - title: Approvi e comunichi
        text: Dopo la tua approvazione ogni membro riceve la sua quota.
    - type: cards
      id: membri
      title: Per i membri
      items:
      - title: La tua quota
        text: Energia condivisa, risparmi e pagamenti previsti nella tua area.
      - title: Avvisi via email
        text: Rendiconto mensile e avvisi sugli andamenti anomali.
    - type: note
      content: 'Le cifre sono stime a supporto della gestione, non consulenza fiscale o legale: verifica con il GSE. Previsioni
        meteo: Open-Meteo.com (CC BY 4.0).'
  - key: new_run
    type: new_run
    title: Nuovo rendiconto
    roles:
    - user
    - admin
  - key: runs
    type: history
    title: Rendiconti generati
    source: run
    roles:
    - user
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: approvals
    type: approvals
    title: Approvazioni
    roles:
    - user
    - admin
  - key: community_form
    type: form
    title: La mia comunità
    collection: community
    edit: true
    submit:
      label: Salva
      message: Comunità salvata
    roles:
    - user
    - admin
  - key: member_form
    type: form
    title: Nuovo membro
    collection: members
    submit:
      label: Registra membro
      message: Membro registrato
    roles:
    - user
    - admin
  - key: members_list
    type: table
    title: Membri
    source: collection:members
    export: true
    roles:
    - user
    - admin
  - key: rules_form
    type: form
    title: Regole incentivi
    collection: incentive_rules
    submit:
      label: Salva regola
      message: Regola salvata
    roles:
    - user
    - admin
  - key: overview
    type: page
    title: Comunità
    roles:
    - user
    - admin
    sections:
    - type: data
      title: Energia condivisa per mese
      source: collection:statements
      display: chart
      chart: bar
      fields:
      - key: month
        label: Mese
      - key: shared_kwh
        label: kWh condivisi
      sort:
        field: month
        dir: asc
      limit: 24
    - type: data
      title: Rendiconti
      source: collection:statements
      display: table
      fields:
      - key: month
        label: Mese
      - key: shared_kwh
        label: kWh condivisi
        format: number
      - key: self_consumption_pct
        label: Autoconsumo %
        format: percent
      - key: community_benefit_eur
        label: Beneficio €
        format: money
      sort:
        field: month
        dir: desc
    - type: data
      title: Avvisi
      source: collection:alerts
      display: list
      fields:
      - key: month
      - key: severity
        format: badge
      - key: message
      limit: 20
  - key: my_share
    type: table
    title: La mia quota
    source: collection:allocations
    columns:
    - month
    - produced_kwh
    - consumed_kwh
    - shared_kwh
    - savings_eur
    - incentive_eur
    - status
    export: true
    roles:
    - member
    - user
    - admin
  - key: account
    type: account
    title: Abbonamento
    roles:
    - user
  notifications:
    emailOnRunDone: true
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: comunita_piccola
      price: 290
      interval: year
      label: Comunità fino a 20 membri
      includes:
      - fino a 20 membri
      - rendiconti mensili illimitati
      roles:
      - user
    - key: comunita_media
      price: 690
      interval: year
      label: Comunità fino a 100 membri
      includes:
      - fino a 100 membri
      - rendiconti mensili illimitati
      roles:
      - user
    - key: comunita_grande
      price: 1490
      interval: year
      label: Comunità oltre 100 membri
      includes:
      - membri illimitati
      - rendiconti mensili illimitati
      roles:
      - user
  extensions:
  - key: data_link
    description: 'Collegamento automatico ai dati di misura (portale distributore/GSE) non disponibile: i dati si caricano
      come file.'
