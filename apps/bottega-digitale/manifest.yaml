apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: bottega-digitale
  displayName: Bottega Digitale
  tagline:
    it: Il marketing della tua piccola impresa, gestito da un team di agenti AI.
    en: Your small business marketing, run by a team of AI agents.
  description:
    it: 'Descrivi la tua attività: un team di agenti prepara ogni mese post con calendario editoriale, proposte per Google
      Ads, risposte alle recensioni e un report. Tu approvi tutto prima che vada online.'
    en: 'Describe your business: a team of agents prepares monthly posts with an editorial calendar, Google Ads proposals,
      review replies and a report. You approve everything before it goes live.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f3a5f'
      accent: '#e07a1f'
      background: '#fbf8f3'
      foreground: '#1c2430'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Bottega
      color: primary
    - text: Digitale
      color: accent
    button: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Prezzi
        en: Pricing
      href: '#prezzi'
    cta:
      label:
        it: Inizia
        en: Start
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: consultant
      label:
        it: Consulente
        en: Consultant
      assignedBy: invite
    - key: user
      label:
        it: Titolare
        en: Owner
      assignedBy: signup
  limits:
  - action: agent:planner
    per: user
    max: 3
    window: day
    roles:
    - user
  - action: chat
    per: user
    max: 40
    window: day
    roles:
    - user
  agents:
  - key: planner
    role: main
    description: 'Team that prepares the monthly plan: social posts, Google Ads proposals, review replies and a summary.'
    memory: user
    awaits:
    - post_approval
    - budget_approval
    profile:
      inline:
        display_name: Bottega Digitale monthly team
        crews:
        - id: social
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: Sei il social media manager di una piccola impresa locale. Leggi il profilo dell'attività e scrivi
            i post per Instagram e Facebook del mese con un calendario editoriale (data, canale, testo, hashtag, idea visiva).
            Tono adatto al settore e ai clienti tipici, mai promesse false, mai prezzi o sconti inventati. Salva ogni post
            in plan_items con kind=post e status=proposed, poi chiedi l'approvazione del titolare con request_post_approval.
            Non dare per pubblicato nulla.
        - id: ads
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei lo specialista Google Ads per piccole imprese locali. Dal profilo (zona, budget mensile, obiettivi)
            proponi 1-3 campagne: obiettivo, parole chiave, annunci di esempio, targeting locale, budget giornaliero. Resta
            entro il budget mensile indicato; non inventare stime di risultato come certe, indica intervalli prudenti. Salva
            ogni proposta in plan_items con kind=campaign, status=proposed e chiedi l''approvazione con request_budget_approval.
            Ogni variazione di budget richiede approvazione.'
        - id: reviews
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Controlli le recensioni dell''attività presenti nella collezione reviews (incollate dal titolare).
            Per ognuna: sentimento, tema, e una bozza di risposta cortese, onesta e personalizzata. Mai inventare fatti sull''attività.
            Salva le bozze in plan_items con kind=review_reply, status=proposed.'
        - id: summary
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 4
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''autore del piano mensile. Riassumi il lavoro degli altri agenti in un documento Markdown
            che inizia con "# Piano di marketing — <mese> — <nome attività>". Sezioni ##: Obiettivi, Calendario editoriale
            (tabella), Campagne Google Ads proposte (con budget), Recensioni e risposte, Cosa approvare, Prossimi passi. Linguaggio
            semplice. Se confronti numeri aggiungi un blocco ```chart``` con valori reali. Non inventare cifre.'
        orchestration:
          type: dag
          entry: social
          nodes:
          - id: social
            crew: social
          - id: ads
            crew: ads
          - id: reviews
            crew: reviews
          - id: summary
            crew: summary
          edges:
          - from: social
            to: ads
          - from: ads
            to: reviews
          - from: reviews
            to: summary
    appTools:
    - name: read_business
      description: Read the owner's business profile
      action: read
      collection: business_profile
      scope: user
    - name: read_reviews
      description: Read the owner's reviews
      action: read
      collection: reviews
      scope: user
    - name: save_item
      description: Save a proposed post, campaign or review reply
      action: write
      collection: plan_items
      scope: user
    context:
    - key: profile
      from: collection:business_profile.sector
    goalTemplate: 'Prepara il piano di marketing per il mese di {month_label}. Leggi il profilo dell''attività con read_business.
      {?focus}Priorità del titolare: {focus}{/focus}

      Data di oggi: {date}. Scrivi in lingua con codice ISO {lang}.'
    output: markdown
    limits:
      maxTurns: 40
      maxBudgetUsd: 2.5
  - key: weekly
    role: helper
    description: 'Every Monday writes a simple report for one business: results, spend, advice.'
    memory: instance
    writesTo:
      collection: weekly_reports
    profile:
      inline:
        display_name: Bottega Digitale weekly reporter
        crews:
        - id: weekly
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 5
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Scrivi il report settimanale semplice per il titolare di una piccola impresa. Inizia con "# Report
            settimanale — <data>". Sezioni ##: Risultati, Spesa, Consigli per questa settimana (max 3). Usa solo i dati della
            collezione plan_items e quelli che il titolare ha inserito; se mancano dati di risultati dillo chiaramente e non
            inventare numeri. Max 250 parole. Alla fine chiama remember con i 5 punti chiave.'
    appTools:
    - name: read_items
      description: Read the owner's plan items
      action: read
      collection: plan_items
      scope: user
  - key: advisor
    role: helper
    description: 'Chat: what is worth doing now.'
    memory: user
    profile:
      inline:
        display_name: Bottega Digitale advisor
        chat_mode: true
        crews:
        - id: advisor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: Sei il consulente di marketing di una piccola impresa. Rispondi in modo breve, concreto e in linguaggio
            semplice, basandoti sul profilo, sul piano e sui report del titolare (strumenti di lettura). Dì cosa conviene
            fare adesso e perché. Non inventare numeri, non promettere risultati, non dare consulenza legale o fiscale. Ogni
            pubblicazione o variazione di budget va approvata dal titolare.
    appTools:
    - name: read_business
      description: Read the owner's business profile
      action: read
      collection: business_profile
      scope: user
    - name: read_items
      description: Read the owner's plan items
      action: read
      collection: plan_items
      scope: user
    - name: read_reports
      description: Read weekly reports
      action: read
      collection: weekly_reports
      scope: user
    goalTemplate: 'Conversazione finora:

      {history}


      Nuovo messaggio del titolare: {message}

      Rispondi in lingua {lang}.'
  inputForm:
    title:
      it: Nuovo piano mensile
      en: New monthly plan
    fields:
    - name: month
      type: select
      required: true
      label:
        it: Mese
        en: Month
      options:
      - value: 2026-11
        label:
          it: Novembre 2026
          en: November 2026
      - value: 2026-12
        label:
          it: Dicembre 2026
          en: December 2026
      - value: 2027-01
        label:
          it: Gennaio 2027
          en: January 2027
    - name: focus
      type: textarea
      maxLength: 500
      label:
        it: Priorità del mese (facoltativo)
        en: Priority this month (optional)
  data:
    collections:
    - name: business_profile
      ownedBy: user
      description: The owner's business description
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome attività
          en: Business name
      - name: sector
        type: select
        required: true
        label:
          it: Settore
          en: Sector
        options:
        - value: shop
          label:
            it: Negozio
            en: Shop
        - value: craft
          label:
            it: Artigiano
            en: Craftsperson
        - value: professional
          label:
            it: Studio professionale
            en: Professional practice
        - value: other
          label:
            it: Altro
            en: Other
      - name: area
        type: text
        required: true
        label:
          it: Zona
          en: Area
      - name: customers
        type: textarea
        label:
          it: Clienti tipici
          en: Typical customers
      - name: monthly_budget
        type: number
        label:
          it: Budget mensile (€)
          en: Monthly budget (€)
      - name: goal
        type: select
        required: true
        label:
          it: Obiettivo
          en: Goal
        options:
        - value: leads
          label:
            it: Più contatti
            en: More leads
        - value: visits
          label:
            it: Più visite in negozio
            en: More store visits
        - value: online
          label:
            it: Più vendite online
            en: More online sales
    - name: plan_items
      ownedBy: user
      description: Proposed posts, campaigns and review replies with their approval status
      fields:
      - name: kind
        type: select
        options:
        - post
        - campaign
        - review_reply
      - name: title
        type: text
      - name: body
        type: textarea
      - name: date
        type: date
      - name: channel
        type: text
      - name: budget
        type: number
      - name: status
        type: select
        options:
        - proposed
        - approved
        - rejected
    - name: reviews
      ownedBy: user
      description: Customer reviews pasted by the owner
      fields:
      - name: source
        type: text
      - name: stars
        type: number
      - name: text
        type: textarea
    - name: weekly_reports
      ownedBy: instance
      description: Monday reports of each weekly watch
  approvals:
  - key: post_approval
    title:
      it: Approva i post
      en: Approve posts
    decidedBy: requester
    fields:
    - title
    - body
    - date
    - channel
    timeoutMinutes: 10080
  - key: budget_approval
    title:
      it: Approva campagna / budget
      en: Approve campaign / budget
    decidedBy: requester
    fields:
    - title
    - body
    - budget
    timeoutMinutes: 10080
  templates:
  - key: weekly_watch
    title:
      it: Report del lunedì
      en: Monday report
    description:
      it: Ogni lunedì un report semplice con risultati, spesa e consigli.
      en: Every Monday a simple report with results, spend and advice.
    agent: weekly
    params:
    - name: business
      type: text
      required: true
      label:
        it: Nome attività
        en: Business name
    - name: notes
      type: textarea
      label:
        it: Numeri della settimana (contatti, visite, vendite, spesa)
        en: This week's numbers (leads, visits, sales, spend)
    goal: 'Report settimanale per "{instance}" ({business}). Dati inseriti dal titolare: {notes}. Oggi è {date}. Scrivi in
      lingua {lang}.'
    schedule:
      cron: 0 7 * * 1
      userCanChange: false
    maxPerUser: 1
    cost:
      perRun: 5
  views:
  - key: home
    type: page
    nav: false
    title: Bottega Digitale
    sections:
    - type: hero
      title:
        it: Il marketing della tua bottega, **senza pensieri**.
        en: Your shop's marketing, **worry-free**.
      text:
        it: Descrivi la tua attività. Un team di agenti prepara post, campagne Google Ads, risposte alle recensioni e un report.
          Tu approvi, sempre.
        en: Describe your business. A team of agents prepares posts, Google Ads campaigns, review replies and a report. You
          always approve.
      actions:
      - label:
          it: Inizia ora
          en: Start now
        href: /login
        style: primary
      band: true
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Racconta la tua attività
          en: Describe your business
        text:
          it: Settore, zona, clienti, budget e obiettivi.
          en: Sector, area, customers, budget and goals.
        badge: 📝
      - title:
          it: Il team prepara il piano
          en: The team prepares the plan
        text:
          it: Post con calendario, campagne, risposte alle recensioni.
          en: Posts with calendar, campaigns, review replies.
        badge: 🤖
      - title:
          it: Approvi e ricevi il report
          en: You approve and get the report
        text:
          it: Nulla va online senza il tuo ok. Ogni lunedì un report semplice.
          en: Nothing goes live without your OK. A simple report every Monday.
        badge: ✅
    - type: cards
      id: prezzi
      title:
        it: Prezzi
        en: Pricing
      intro:
        it: Abbonamento mensile a fasce. La spesa pubblicitaria si paga a parte direttamente a Google e ai social.
        en: Monthly tiers. Ad spend is paid separately, directly to Google and the social networks.
      items:
      - title: Start
        text:
          it: 29 €/mese — 1 piano mensile e report settimanale
          en: €29/month — 1 monthly plan and weekly report
      - title: Pro
        text:
          it: 79 €/mese — più piani, chat illimitata
          en: €79/month — more plans, extended chat
      - title: Studio
        text:
          it: 149 €/mese — per attività con più sedi
          en: €149/month — for multi-site businesses
    - type: note
      content:
        it: Supporto alle decisioni, non consulenza legale o fiscale. Nessun risultato è garantito.
        en: Decision support, not legal or tax advice. No result is guaranteed.
  - key: profile
    type: list
    title:
      it: La mia attività
      en: My business
    source: collection:business_profile
    roles:
    - user
    - admin
  - key: new_plan
    type: new_run
    title:
      it: Nuovo piano
      en: New plan
    roles:
    - user
    - admin
  - key: plans
    type: history
    title:
      it: I miei piani
      en: My plans
    source: run
    roles:
    - user
    - admin
  - key: plan
    type: report
    source: run
    printable: true
    nav: false
  - key: to_approve
    type: approvals
    title:
      it: Da approvare
      en: To approve
    approvals:
    - post_approval
    - budget_approval
    roles:
    - user
  - key: calendar
    type: table
    title:
      it: Calendario e campagne
      en: Calendar and campaigns
    source: collection:plan_items
    data:
      display: table
      fields:
      - key: date
        label:
          it: Data
          en: Date
        format: date
      - key: kind
        label:
          it: Tipo
          en: Type
        format: badge
      - key: channel
        label:
          it: Canale
          en: Channel
      - key: title
        label:
          it: Titolo
          en: Title
      - key: status
        label:
          it: Stato
          en: Status
        format: badge
      sort:
        field: date
        dir: asc
      limit: 100
    roles:
    - user
    - admin
  - key: reviews_list
    type: list
    title:
      it: Recensioni
      en: Reviews
    source: collection:reviews
    roles:
    - user
    - admin
  - key: watches
    type: instances
    template: weekly_watch
    title:
      it: Report del lunedì
      en: Monday report
    roles:
    - user
    - admin
  - key: ask
    type: chat
    title:
      it: Chiedi al consulente
      en: Ask the advisor
    source: agent:advisor
    examples:
    - it: Cosa conviene fare questa settimana?
      en: What should I do this week?
    - it: Come sto spendendo il budget?
      en: How is my budget going?
    placeholder:
      it: Scrivi la tua domanda…
      en: Type your question…
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Plan
    roles:
    - user
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 50
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:planner:
        estimate: 150
        metered: true
      chat: 2
    packs:
    - key: extra
      credits: 500
      price: 6
      label: Extra
    plans:
    - key: start
      price: 29
      interval: month
      label: Start
      credits: 500
      creditsReset: monthly
      roles:
      - user
    - key: pro
      price: 79
      interval: month
      label: Pro
      credits: 1800
      creditsReset: monthly
      roles:
      - user
    - key: studio
      price: 149
      interval: month
      label: Studio
      credits: 4000
      creditsReset: monthly
      roles:
      - user
  extensions:
  - key: oauth_publishing
    description: 'Collegamento OAuth degli account Instagram/Facebook e Google Ads del cliente e pubblicazione reale di post
      e campagne dopo l''approvazione: non ancora disponibile. Per ora gli agenti producono contenuti e proposte approvate,
      da pubblicare a mano.'
  - key: email_report
    description: 'Invio email del report del lunedì: le notifiche non sono ancora disponibili. Il report è consultabile nella
      vista ''Report del lunedì''.'
  - key: consultant_multi_business
    description: 'Un consulente della rete che segue più imprese, con accesso in sola lettura ai dati di ciascuna impresa
      invitante e nessun accesso incrociato, richiede condivisione per record tra utenti: da progettare. Il ruolo consultant
      (su invito) è già previsto.'
  - key: ad_spend_separate
    description: La spesa pubblicitaria è pagata dal cliente direttamente a Google e ai social; l'app fattura solo l'abbonamento
      e i crediti.
  - key: reviews_import
    description: Le recensioni vanno incollate dal titolare (nessuna connessione automatica a Google Business Profile per
      ora).
