apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: bottega-digitale
  displayName: Bottega Digitale
  tagline:
    it: Marketing e operazioni quotidiane per la tua piccola impresa, con un team di agenti AI.
    en: Marketing and daily operations for your small business, run by a team of AI agents.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#2b3a55'
      accent: '#d9622b'
      background: '#fbf8f3'
      foreground: '#1f2430'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Bottega
      color: primary
    - text: Digitale
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Piani
        en: Plans
      href: '#piani'
    cta:
      label:
        it: Inizia
        en: Start
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
    - key: consultant
      label:
        it: Consulente
        en: Consultant
      assignedBy: derived
      from: collection:businesses.consultant_email
  limits:
  - action: agent:planner
    per: user
    max: 2
    window: month
    roles:
    - user
    plans:
      pro: 4
      studio: 10
  agents:
  - key: planner
    role: main
    description: Coordinates the team and prepares the monthly plan; asks the owner to approve every post and budget change.
    profile:
      inline:
        display_name: Bottega Digitale planner
        crews:
        - id: planner
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 20
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the coordinator of a small-business marketing team. You receive the business profile (sector,
            area, typical customers, monthly budget, goals). Delegate: ask_social for the editorial calendar and post texts,
            ask_ads for the Google Ads proposal, ask_reviews for review replies, ask_reporter for the results summary. Then
            write the monthly plan. Start with a level-1 title "# Piano di marzo — <business>" using the real month. Sections
            with ## headings: Obiettivi, Calendario editoriale (table: date, channel, post), Campagne Google Ads (budget split,
            keywords, ad copy), Recensioni, Risultati attesi e cosa misureremo, Da approvare. Save each proposed post with
            the tool save_post (status proposed) and each budget change with save_budget_change (status proposed), then call
            request_post_approval and request_budget_approval. NOTHING goes online without the owner''s approval. Never invent
            figures or guaranteed results; state assumptions. Advertising spend is paid by the owner directly to the ad platform
            and is not part of the subscription.'
    delegates:
    - social
    - ads
    - reviews
    - reporter
    awaits:
    - post_approval
    - budget_approval
    context:
    - key: profile
      from: collection:businesses
    - key: email
      from: user.email
    appTools:
    - name: save_post
      description: Save a proposed social post
      action: write
      collection: posts
      scope: user
    - name: save_budget_change
      description: Save a proposed ad budget change
      action: write
      collection: budget_changes
      scope: user
    - name: read_reviews
      description: Read the customer reviews the owner recorded
      action: read
      collection: reviews
      scope: user
    goalTemplate: 'Business profile (JSON lines): {profile}

      Month: {month_label}

      {?notes}Owner notes: {notes}{/notes}

      Owner email: {email}

      Today is {date}. Write in the language with ISO code {lang}.'
    output: markdown
    writesTo:
      collection: plans
      parse: whole
    limits:
      maxTurns: 20
      maxBudgetUsd: 1.5
  - key: social
    role: helper
    description: Writes Instagram and Facebook posts with an editorial calendar.
    profile:
      inline:
        display_name: Social writer
        crews:
        - id: social
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 4
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write posts for Instagram and Facebook for a small local business. Output a month calendar:
            3 posts a week, each with date, channel, text, hashtags and a photo idea. Tone fits the sector and customers.
            No invented offers, prices or claims.'
  - key: ads
    role: helper
    description: Proposes and optimizes Google Ads campaigns.
    profile:
      inline:
        display_name: Ads specialist
        crews:
        - id: ads
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 4
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You propose Google Ads campaigns for a small local business within its monthly ad budget: campaign
            types, local targeting, keywords, negative keywords, two ad texts, daily budget. Any budget change must be explicit
            (from, to, reason) so the owner can approve it. Never promise results or invent figures.'
  - key: reviews
    role: helper
    description: Checks reviews and drafts replies.
    profile:
      inline:
        display_name: Review manager
        crews:
        - id: reviews
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 4
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You read customer reviews of a small business and draft polite, specific replies: thank positive
            reviewers, de-escalate negative ones with an offer to talk offline. Flag recurring problems. Never admit legal
            liability or invent facts.'
  - key: reporter
    role: helper
    description: Produces the results report.
    profile:
      inline:
        display_name: Report writer
        crews:
        - id: reporter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 4
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write simple, plain-language reports for a shop owner: results, spend, advice. Use only the
            figures you are given; if there are none, say so and list what to record. Never invent numbers.'
  - key: weekly
    role: scheduled
    description: Monday report for one business.
    memory: instance
    writesTo:
      collection: weekly_reports
    context:
    - key: profile
      from: collection:businesses
    profile:
      inline:
        display_name: Weekly reporter
        crews:
        - id: weekly
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 4
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write the Monday email report for a small business owner. Start with "# Report settimanale —
            <date>". Sections: Risultati, Spesa, Consigli (max 3, concrete). Under 250 words, plain text friendly. Use only
            data you have (post and plan records, notes); never invent figures. Your memory holds last week: say what changed.
            At the end call remember with the 5 key points.'
    goalTemplate: 'Business: {profile}

      Week of {date}. Write the report in the language with ISO code {lang}.'
  - key: advisor
    role: helper
    description: 'Chat: what is worth doing now.'
    profile:
      inline:
        display_name: Advisor
        chat_mode: true
        crews:
        - id: advisor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You advise the owner of a small business on marketing and daily operations, in short practical answers.
            Use the business profile and recent plans. Never invent figures; do not give legal or tax advice as fact. Remind
            that posts and budget changes need their approval.
    context:
    - key: profile
      from: collection:businesses
    - key: plans
      from: collection:plans
    goalTemplate: 'Business: {profile}

      Recent plans: {plans}

      Conversation so far:

      {history}

      New message: {message}

      Answer in the language with ISO code {lang}.'
    appTools:
    - name: read_posts
      description: Read the user's posts
      action: read
      collection: posts
      scope: user
  inputForm:
    title:
      it: Nuovo piano mensile
      en: New monthly plan
    fields:
    - name: month
      type: select
      required: true
      label:
        it: Mese
        en: Month
      options:
      - value: next
        label:
          it: Prossimo mese
          en: Next month
      - value: current
        label:
          it: Mese in corso
          en: Current month
    - name: notes
      type: textarea
      maxLength: 600
      label:
        it: Note (facoltative)
        en: Notes (optional)
  data:
    collections:
    - name: businesses
      ownedBy: user
      description: The business profile
      retentionDays: 3650
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome attività
          en: Business name
      - name: sector
        type: text
        required: true
        label:
          it: Settore
          en: Sector
      - name: area
        type: text
        required: true
        label:
          it: Zona
          en: Area
      - name: customers
        type: textarea
        label:
          it: Clienti tipici
          en: Typical customers
      - name: budget
        type: number
        label:
          it: Budget mensile pubblicità (€)
          en: Monthly ad budget (€)
      - name: goal
        type: select
        required: true
        label:
          it: Obiettivo
          en: Goal
        options:
        - value: leads
          label:
            it: Più contatti
            en: More leads
        - value: visits
          label:
            it: Più visite in negozio
            en: More store visits
        - value: sales
          label:
            it: Più vendite online
            en: More online sales
      - name: consultant_email
        type: email
        label:
          it: Email del consulente
          en: Consultant email
      access:
      - role: consultant
        where:
          consultant_email: '{user.email}'
        can:
        - read
        - write
    - name: plans
      ownedBy: user
      description: Monthly plans
      fields:
      - name: consultant_email
        type: email
      access:
      - role: consultant
        where:
          consultant_email: '{user.email}'
        can:
        - read
    - name: posts
      ownedBy: user
      description: Proposed and approved posts
      fields:
      - name: date
        type: date
      - name: channel
        type: select
        options:
        - instagram
        - facebook
      - name: text
        type: textarea
      - name: status
        type: select
        options:
        - proposed
        - approved
        - rejected
      - name: consultant_email
        type: email
      access:
      - role: consultant
        where:
          consultant_email: '{user.email}'
        can:
        - read
    - name: budget_changes
      ownedBy: user
      description: Proposed ad budget changes
      fields:
      - name: campaign
        type: text
      - name: from_amount
        type: number
      - name: to_amount
        type: number
      - name: reason
        type: textarea
      - name: status
        type: select
        options:
        - proposed
        - approved
        - rejected
      - name: consultant_email
        type: email
      access:
      - role: consultant
        where:
          consultant_email: '{user.email}'
        can:
        - read
    - name: reviews
      ownedBy: user
      description: Customer reviews recorded by the owner
      retentionDays: 730
      fields:
      - name: source
        type: select
        options:
        - google
        - facebook
        - other
        label:
          it: Fonte
          en: Source
      - name: rating
        type: number
        label:
          it: Voto
          en: Rating
      - name: text
        type: textarea
        required: true
        label:
          it: Testo
          en: Text
    - name: weekly_reports
      ownedBy: instance
      description: Monday reports
  views:
  - key: home
    type: page
    nav: false
    sections:
    - type: hero
      title:
        it: Il marketing della tua **bottega**, gestito da un team di agenti.
        en: Your shop's **marketing**, run by a team of agents.
      text:
        it: 'Descrivi la tua attività: ogni mese ricevi un piano con post, campagne Google Ads e risposte alle recensioni.
          Approvi tu ogni post e ogni variazione di budget. Ogni lunedì un report semplice via email.'
        en: 'Describe your business: every month you get a plan with posts, Google Ads campaigns and review replies. You approve
          every post and budget change. A simple email report every Monday.'
      actions:
      - label:
          it: Inizia
          en: Start
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Descrivi l'attività
          en: Describe your business
        text:
          it: Settore, zona, clienti, budget, obiettivi.
          en: Sector, area, customers, budget, goals.
      - title:
          it: Il team prepara il piano
          en: The team prepares the plan
        text:
          it: Social, Google Ads, recensioni e report.
          en: Social, Google Ads, reviews and reporting.
      - title:
          it: Approvi tu
          en: You approve
        text:
          it: Nulla va online senza il tuo ok.
          en: Nothing goes live without your OK.
    - type: cards
      id: piani
      title:
        it: Piani mensili
        en: Monthly plans
      intro:
        it: La spesa pubblicitaria è pagata a parte alle piattaforme.
        en: Ad spend is paid separately to the platforms.
      items:
      - title: Starter
        text: €29 / mese
      - title: Pro
        text: €59 / mese
      - title: Studio
        text: €119 / mese
    - type: note
      content:
        it: Supporto alle decisioni, nessun risultato garantito.
        en: Decision support, no guaranteed results.
  - key: profile
    type: form
    collection: businesses
    title:
      it: La mia attività
      en: My business
    edit: true
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Profilo salvato
        en: Profile saved
      redirect: new_plan
    roles:
    - user
    - admin
  - key: new_plan
    type: new_run
    title:
      it: Nuovo piano
      en: New plan
    roles:
    - user
    - admin
  - key: plans_history
    type: history
    title:
      it: I miei piani
      en: My plans
    source: run
    roles:
    - user
    - admin
  - key: plan
    type: report
    source: run
    printable: true
    nav: false
  - key: approve
    type: approvals
    title:
      it: Da approvare
      en: To approve
    roles:
    - user
    - admin
  - key: posts_list
    type: table
    title: Post
    source: collection:posts
    columns:
    - date
    - channel
    - text
    - status
    roles:
    - user
    - admin
  - key: add_review
    type: form
    collection: reviews
    title:
      it: Aggiungi recensione
      en: Add a review
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Recensione salvata
        en: Review saved
    roles:
    - user
    - admin
  - key: watch
    type: instances
    template: weekly_report
    title:
      it: Report del lunedì
      en: Monday report
    roles:
    - user
    - admin
  - key: assistant
    type: chat
    source: agent:advisor
    title:
      it: Cosa conviene fare?
      en: What should I do?
    examples:
    - it: Su cosa investo il budget questo mese?
      en: Where should I put the budget this month?
    placeholder:
      it: Chiedi un consiglio
      en: Ask for advice
    roles:
    - user
    - admin
  - key: clients
    type: table
    title:
      it: Imprese seguite
      en: My clients
    source: collection:businesses
    columns:
    - name
    - sector
    - area
    - budget
    - goal
    roles:
    - consultant
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Plan
    roles:
    - user
  templates:
  - key: weekly_report
    title:
      it: Report del lunedì
      en: Monday report
    agent: weekly
    params:
    - name: focus
      type: select
      label:
        it: Focus
        en: Focus
      options:
      - value: all
        label:
          it: Tutto
          en: Everything
      - value: social
        label: Social
      - value: ads
        label: Google Ads
    goal: Report for "{instance}", focus {focus}. Today is {date}. Language ISO code {lang}.
    schedule:
      cron: 0 7 * * 1
      userCanChange: false
    maxPerUser: 1
    deliver:
      to: owner
      onlyIfNew: true
  approvals:
  - key: post_approval
    title:
      it: Approva i post
      en: Approve posts
    decidedBy: requester
    timeoutMinutes: 10080
  - key: budget_approval
    title:
      it: Approva la variazione di budget
      en: Approve budget change
    decidedBy: requester
    timeoutMinutes: 10080
  notifications:
    emailOnRunDone: true
  billing:
    modes:
    - subscription
    plans:
    - key: starter
      price: 29
      interval: month
      label: Starter
    - key: pro
      price: 59
      interval: month
      label: Pro
    - key: studio
      price: 119
      interval: month
      label: Studio
  extensions:
  - key: oauth_publishing
    description: 'OAuth connection of Instagram, Facebook and Google Ads accounts is not available yet: approved posts and
      budget changes are recorded and ready, but real publishing on the platforms needs that integration.'
