apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: cantiere-in-conto
  displayName: Cantiere in Conto
  tagline:
    it: Preventivi, commesse e margini per la tua impresa edile.
    en: Quotes, jobs and margins for your construction company.
  description:
    it: Dalla richiesta di preventivo al computo metrico con il prezzario regionale, dal preventivo in PDF alla commessa con
      costi previsti, avanzamento e fatture dei fornitori, fino al report settimanale dei margini.
    en: From quote request to bill of quantities based on the regional price list, from the PDF quote to the job with planned
      costs, progress and supplier invoices, to the weekly margin report.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f2d3d'
      accent: '#e07b00'
      background: '#f6f4ef'
      foreground: '#1b1f24'
    fonts:
      body: Inter
      display: Barlow Condensed
    wordmark:
    - text: 'Cantiere in '
      color: primary
    - text: Conto
      color: accent
    byline: by WebRobot
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Prezzi
        en: Pricing
      href: '#prezzi'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: owner
      label:
        it: Titolare
        en: Owner
      assignedBy: signup
    - key: foreman
      label:
        it: Capocantiere
        en: Site foreman
      assignedBy: invite
  limits:
  - action: agent:estimator
    per: user
    max: 20
    window: day
    roles:
    - owner
  - action: chat
    per: user
    max: 100
    window: day
  agents:
  - key: estimator
    role: main
    description: Builds the bill of quantities from the regional public-works price list, applies the company markups and
      writes the quote.
    profile:
      inline:
        display_name: Cantiere in Conto - preventivista
        crews:
        - id: estimator
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'Sei un computista di un''impresa edile italiana. Dalla richiesta (tipo di lavoro, indirizzo, misure,
            lavorazioni, materiali) ricavi la regione del cantiere e usi il prezzario regionale delle opere pubbliche ufficiale
            e più recente di quella regione, che consulti sul web tramite gli strumenti WebRobot (raccolta pagine/PDF pubblici).
            Per ogni voce riporta codice articolo del prezzario, descrizione, unità di misura, quantità calcolata dalle misure,
            prezzo unitario e importo. Se una voce non è nel prezzario, marcala ''voce extra - prezzo da verificare'' e stimala
            solo se dichiari chiaramente la fonte; non inventare mai codici o prezzi. Applica i ricarichi dell''impresa indicati
            nella richiesta (spese generali, utile, eventuali altri) in modo esplicito e separato. Lettura delle misure: mostra
            i calcoli. Struttura obbligatoria: primo rigo ''# Preventivo - <tipo lavoro> - <indirizzo>''. Poi ## Dati del
            cantiere, ## Computo metrico (tabella), ## Riepilogo economico (costo da prezzario, spese generali, utile, totale
            IVA esclusa, IVA indicativa), ## Costi previsti per categoria (materiali, manodopera, noli, subappalti) e subito
            dopo un blocco ```chart bar con i costi previsti per categoria (solo cifre reali), ## Condizioni e validità (30
            giorni, esclusioni, tempi), ## Fonti (nome, regione, anno ed edizione del prezzario). Il documento è inviato al
            cliente: tono professionale, nessuna nota interna nel testo. Alla fine, se l''utente conferma, puoi chiedere l''approvazione
            ''accettazione preventivo''. Non dare consulenza legale o fiscale come fatto certo.'
          max_turns_hint: 40
    mcpServers:
    - name: webrobot
      url: https://mcp-full.webrobot.eu/mcp
      allow: all
    goalTemplate: 'Richiesta di preventivo.

      Tipo di lavoro: {work_type_label}

      Indirizzo del cantiere: {address}

      Regione (se indicata): {region_label}

      Cliente: {client}

      Misure: {measures}

      Lavorazioni: {works}

      {?materials}Materiali richiesti: {materials}{/materials}

      Ricarichi dell''impresa: spese generali {overhead_pct}%, utile {profit_pct}%.

      {?notes}Note: {notes}{/notes}

      Data: {date}. Scrivi il preventivo in lingua con codice ISO {lang}.'
    awaits:
    - quote_accepted
    output: markdown
    limits:
      maxTurns: 40
      maxBudgetUsd: 1.5
  - key: opener
    role: helper
    description: When a quote is accepted, opens the job (commessa) with planned costs.
    profile:
      inline:
        display_name: Cantiere in Conto - apertura commessa
        crews:
        - id: opener
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Quando un preventivo viene accettato crei la commessa con lo strumento write_commesse: nome, cliente,
            indirizzo, status ''aperta'', ricavo previsto (totale IVA esclusa), costo previsto per categoria (materiali, manodopera,
            noli, subappalti), costo reale 0, avanzamento 0 e riferimento al preventivo. Usa solo i dati del preventivo ricevuto;
            non inventare cifre. Rispondi con un breve riepilogo in Markdown che inizia con ''# Commessa aperta - <nome>''.'
    appTools:
    - name: write_commesse
      description: Create or update a job
      action: write
      collection: commesse
      scope: user
    goalTemplate: 'Un preventivo è stato accettato. Apri la commessa. Data: {date}. Scrivi in lingua con codice ISO {lang}.'
    output: markdown
  - key: desk
    role: helper
    description: 'Chat assistant: registers supplier invoices pasted by the owner, matches them to the right job and updates
      real costs; records site progress (SAL) from the foreman.'
    profile:
      inline:
        display_name: Cantiere in Conto - segreteria di cantiere
        crews:
        - id: desk
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei la segreteria di cantiere di un''impresa edile. Fai due cose. 1) Fatture fornitori: l''utente
            incolla il testo di una fattura (o un link). Estrai fornitore, numero, data, imponibile, IVA, totale, descrizione;
            cerca la commessa giusta con read_commesse (indirizzo, cliente, riferimenti in fattura, materiali); registra la
            fattura con write_invoices e aggiorna il costo reale della commessa con write_commesse sommando l''imponibile.
            Se l''abbinamento non è sicuro (meno di una commessa plausibile) chiedi conferma prima di scrivere e non scrivere
            mai a caso. Evita duplicati: controlla con read_invoices fornitore e numero. 2) Avanzamento (SAL): quando il capocantiere
            descrive lo stato dei lavori o dà un link a foto, registra con write_progress: commessa, data, testo, percentuale
            di avanzamento, link foto se presente, e aggiorna la percentuale della commessa. Non puoi ricevere file: se l''utente
            vuole allegare foto chiedi un link. Rispondi breve, in italiano o nella lingua dell''utente, con cosa hai registrato.
            Non inventare importi.'
          max_turns_hint: 12
    appTools:
    - name: read_commesse
      description: List jobs
      action: read
      collection: commesse
      scope: user
    - name: write_commesse
      description: Create or update a job
      action: write
      collection: commesse
      scope: user
    - name: read_invoices
      description: List supplier invoices
      action: read
      collection: supplier_invoices
      scope: user
    - name: write_invoices
      description: Register a supplier invoice
      action: write
      collection: supplier_invoices
      scope: user
    - name: write_progress
      description: Record a progress update
      action: append
      collection: progress_updates
      scope: user
    goalTemplate: 'Conversazione finora:

      {history}


      Nuovo messaggio da {user}: {message}

      Data: {date}.'
    output: markdown
  - key: weekly_analyst
    role: scheduled
    description: Weekly margin report for the user's jobs.
    profile:
      inline:
        display_name: Cantiere in Conto - report settimanale
        crews:
        - id: weekly_analyst
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei il controller di un''impresa edile. Leggi commesse, fatture e avanzamenti con gli strumenti
            di lettura. Primo rigo ''# Margini - settimana del <data>''. Sezioni: ## Sintesi, ## Margine per commessa (tabella:
            ricavo previsto, costo previsto, costo reale, margine previsto, margine attuale, avanzamento) con un blocco ```chart
            bar dei margini, ## Scostamenti rispetto al preventivo (evidenzia dove il costo reale supera il previsto in rapporto
            all''avanzamento), ## Fatture da emettere (in base a avanzamento e stati; indica che sono proposte da verificare),
            ## Azioni della settimana. Usa solo cifre presenti nei dati; segnala i dati mancanti (es. fatture non abbinate).
            Nessuna consulenza fiscale come fatto certo. Meno di 450 parole.'
    appTools:
    - name: read_commesse
      description: List jobs
      action: read
      collection: commesse
      scope: user
    - name: read_invoices
      description: List supplier invoices
      action: read
      collection: supplier_invoices
      scope: user
    - name: read_progress
      description: List progress updates
      action: read
      collection: progress_updates
      scope: user
    memory: instance
    writesTo:
      collection: weekly_reports
    output: markdown
  approvals:
  - key: quote_accepted
    title:
      it: Preventivo accettato dal cliente
      en: Quote accepted by the client
    description: 'Il titolare conferma che il cliente ha accettato il preventivo: si apre la commessa.'
    decidedBy: requester
  triggers:
  - key: open_job
    description: Open the job when the quote is accepted
    'on':
      approval: quote_accepted
      decision: approved
    start:
      agent: opener
    goal: 'Preventivo accettato: {event}. Apri la commessa.'
    asUser: true
  templates:
  - key: weekly_margin
    title:
      it: Report settimanale margini
      en: Weekly margin report
    description:
      it: Ogni settimana il margine di ogni commessa, gli scostamenti e le fatture da emettere.
      en: Every week the margin of each job, variances and invoices to issue.
    agent: weekly_analyst
    params:
    - name: focus
      type: select
      required: true
      label:
        it: Focus
        en: Focus
      options:
      - value: all
        label:
          it: Tutte le commesse
          en: All jobs
      - value: open
        label:
          it: Solo aperte
          en: Open only
    goal: 'Report ''{instance}'': commesse da considerare: {focus}. Oggi è {date}. Scrivi in lingua con codice ISO {lang}.'
    schedule:
      cron: 0 6 * * 1
      userCanChange: true
    maxPerUser: 2
    roles:
    - owner
    - admin
    cost:
      perRun: 15
  inputForm:
    title:
      it: Nuova richiesta di preventivo
      en: New quote request
    fields:
    - name: work_type
      type: select
      required: true
      label:
        it: Tipo di lavoro
        en: Type of work
      options:
      - value: ristrutturazione
        label:
          it: Ristrutturazione
          en: Renovation
      - value: nuova_costruzione
        label:
          it: Nuova costruzione
          en: New build
      - value: facciate_cappotto
        label:
          it: Facciate e cappotto
          en: Facades and insulation
      - value: impianti
        label:
          it: Impianti
          en: Systems
      - value: copertura
        label:
          it: Copertura
          en: Roofing
      - value: altro
        label:
          it: Altro
          en: Other
    - name: client
      type: text
      required: true
      label:
        it: Cliente
        en: Client
    - name: address
      type: text
      required: true
      label:
        it: Indirizzo del cantiere (con comune)
        en: Site address (with town)
    - name: region
      type: select
      label:
        it: Regione (se non ovvia dall'indirizzo)
        en: Region (if not clear from address)
      options:
      - value: auto
        label:
          it: Dall'indirizzo
          en: From address
      - value: lombardia
        label: Lombardia
      - value: piemonte
        label: Piemonte
      - value: veneto
        label: Veneto
      - value: emilia_romagna
        label: Emilia-Romagna
      - value: toscana
        label: Toscana
      - value: lazio
        label: Lazio
      - value: campania
        label: Campania
      - value: puglia
        label: Puglia
      - value: sicilia
        label: Sicilia
      default: auto
    - name: measures
      type: textarea
      required: true
      maxLength: 1500
      label:
        it: Misure
        en: Measurements
      help:
        it: es. appartamento 85 m², pareti 210 m², 2 bagni
        en: e.g. flat 85 m², walls 210 m², 2 bathrooms
    - name: works
      type: textarea
      required: true
      maxLength: 2500
      label:
        it: Descrizione delle lavorazioni
        en: Description of works
    - name: materials
      type: textarea
      maxLength: 1500
      label:
        it: Materiali (facoltativo)
        en: Materials (optional)
    - name: overhead_pct
      type: number
      required: true
      default: 15
      label:
        it: Spese generali %
        en: Overheads %
    - name: profit_pct
      type: number
      required: true
      default: 10
      label:
        it: Utile d'impresa %
        en: Profit %
    - name: notes
      type: textarea
      maxLength: 600
      label:
        it: Note (facoltative)
        en: Notes (optional)
  data:
    collections:
    - name: commesse
      ownedBy: user
      sharing:
      - editor
      description: 'Jobs opened from accepted quotes: planned and real costs, progress. The owner invites each foreman on
        his own sites.'
      fields:
      - name: name
        type: text
        required: true
      - name: client
        type: text
      - name: address
        type: text
      - name: status
        type: select
        options:
        - aperta
        - in_corso
        - chiusa
      - name: planned_revenue
        type: number
      - name: planned_cost
        type: number
      - name: planned_materials
        type: number
      - name: planned_labour
        type: number
      - name: planned_equipment
        type: number
      - name: planned_subcontracts
        type: number
      - name: actual_cost
        type: number
      - name: progress_pct
        type: number
      - name: quote_run
        type: text
    - name: supplier_invoices
      ownedBy: user
      description: Supplier invoices matched to jobs
      fields:
      - name: supplier
        type: text
      - name: number
        type: text
      - name: date
        type: date
      - name: net_amount
        type: number
      - name: total
        type: number
      - name: commessa
        type: text
      - name: match_status
        type: select
        options:
        - abbinata
        - da_verificare
      - name: description
        type: textarea
    - name: progress_updates
      ownedBy: user
      sharing:
      - editor
      description: Progress reports (SAL) from the site
      fields:
      - name: commessa
        type: text
      - name: date
        type: date
      - name: note
        type: textarea
      - name: progress_pct
        type: number
      - name: photo_url
        type: url
    - name: weekly_reports
      ownedBy: instance
      description: Weekly margin reports
  views:
  - key: home
    type: page
    nav: false
    title: Cantiere in Conto
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow:
        it: Per imprese edili piccole e medie
        en: For small and mid-size builders
      title:
        it: Dal preventivo al **margine** di ogni commessa.
        en: From quote to the **margin** of every job.
      text:
        it: Computo metrico sul prezzario regionale, preventivo da mandare al cliente, commesse con costi previsti e reali,
          fatture dei fornitori abbinate e un report dei margini ogni settimana.
        en: Bill of quantities on the regional price list, a quote ready for the client, jobs with planned and real costs,
          matched supplier invoices and a weekly margin report.
      actions:
      - label:
          it: Crea un preventivo
          en: Create a quote
        href: /v/new_quote
        style: primary
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Richiesta
          en: Request
        text:
          it: Inserisci lavoro, indirizzo, misure e lavorazioni.
          en: Enter work, address, measures and works.
        badge: 📝
      - title:
          it: Preventivo
          en: Quote
        text:
          it: 'L''agente compone il computo con il prezzario regionale e applica i tuoi ricarichi: stampa il PDF.'
          en: 'The agent builds the bill of quantities from the regional price list and applies your markups: print the PDF.'
        badge: 📐
      - title:
          it: Commessa
          en: Job
        text:
          it: Accettato il preventivo si apre la commessa; fatture e avanzamenti aggiornano i costi reali.
          en: Once accepted the job opens; invoices and progress update real costs.
        badge: 🏗️
      - title:
          it: Margini
          en: Margins
        text:
          it: Ogni lunedì margini, scostamenti e fatture da emettere.
          en: Every Monday margins, variances and invoices to issue.
        badge: 📊
    - type: cards
      id: prezzi
      title:
        it: Abbonamento
        en: Pricing
      items:
      - title:
          it: Mensile per utente
          en: Monthly per user
        text:
          it: Un abbonamento mensile per ogni utente (titolare, capocantiere), con crediti inclusi per i preventivi e i report.
          en: One monthly subscription per user (owner, foreman), with credits included for quotes and reports.
    - type: note
      content:
        it: 'Strumento di supporto: i prezzi derivano dal prezzario regionale citato nel documento e vanno verificati dal
          tecnico prima dell''invio. Non è consulenza fiscale o legale.'
        en: 'Decision support: prices come from the regional price list cited in the document and must be checked by a technician
          before sending. Not tax or legal advice.'
  - key: new_quote
    type: new_run
    title:
      it: Nuovo preventivo
      en: New quote
    roles:
    - owner
    - admin
  - key: quotes
    type: history
    title:
      it: Preventivi
      en: Quotes
    source: run
    roles:
    - owner
    - admin
  - key: quote
    type: report
    source: run
    printable: true
    nav: false
  - key: approvals
    type: approvals
    title:
      it: Accettazioni
      en: Acceptances
    roles:
    - owner
    - admin
  - key: jobs
    type: table
    title:
      it: Commesse
      en: Jobs
    source: collection:commesse
    data:
      display: table
      fields:
      - key: name
        label:
          it: Commessa
          en: Job
      - key: client
        label:
          it: Cliente
          en: Client
      - key: status
        label: Stato
        format: badge
      - key: planned_revenue
        label: Ricavo previsto
        format: money
      - key: planned_cost
        label: Costo previsto
        format: money
      - key: actual_cost
        label: Costo reale
        format: money
      - key: progress_pct
        label: Avanzamento %
        format: number
      limit: 100
    roles:
    - owner
    - foreman
    - admin
  - key: progress
    type: table
    title:
      it: Avanzamenti
      en: Progress
    source: collection:progress_updates
    data:
      display: table
      fields:
      - key: date
        label: Data
        format: date
      - key: commessa
        label: Commessa
      - key: note
        label: Nota
      - key: progress_pct
        label: '%'
        format: number
      - key: photo_url
        label: Foto
        format: link
      sort:
        field: date
        dir: desc
      limit: 100
    roles:
    - owner
    - foreman
    - admin
  - key: invoices
    type: table
    title:
      it: Fatture fornitori
      en: Supplier invoices
    source: collection:supplier_invoices
    data:
      display: table
      fields:
      - key: date
        label: Data
        format: date
      - key: supplier
        label: Fornitore
      - key: number
        label: Numero
      - key: net_amount
        label: Imponibile
        format: money
      - key: commessa
        label: Commessa
      - key: match_status
        label: Abbinamento
        format: badge
      sort:
        field: date
        dir: desc
      limit: 100
    roles:
    - owner
    - admin
  - key: desk_chat
    type: chat
    title:
      it: Segreteria di cantiere
      en: Site desk
    source: agent:desk
    examples:
    - 'Registra la fattura: Edilmat Srl n. 245 del 3/11, imponibile 1.820,00 € per intonaco, cantiere via Roma 12'
    - 'SAL via Roma 12: demolizioni finite, avanzamento 30%, foto: https://...'
    placeholder:
      it: Incolla una fattura o scrivi lo stato dei lavori…
      en: Paste an invoice or write the site status…
    roles:
    - owner
    - foreman
    - admin
  - key: weekly
    type: instances
    template: weekly_margin
    title:
      it: Report settimanale
      en: Weekly report
    roles:
    - owner
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - owner
    - foreman
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 30
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:estimator:
        estimate: 60
        metered: true
      agent:desk:
        estimate: 3
        metered: true
      agent:opener:
        estimate: 5
        metered: true
    packs:
    - key: extra
      credits: 1000
      price: 12
      label: Crediti extra
    plans:
    - key: user_month
      price: 39
      interval: month
      label:
        it: Utente mensile
        en: Per user monthly
      credits: 2000
      creditsReset: monthly
      roles:
      - owner
      - foreman
  extensions:
  - key: accounting_oauth
    description: 'OAuth connection of the accounting software and of the company''s bank accounts to reconcile payments and
      receipts: needs per-customer credentials, not available yet. Meanwhile invoices are pasted in the site desk chat.'
  - key: mailbox_ingest
    description: Reading supplier invoices from a connected mailbox is not available yet (no email connectors); invoices are
      pasted as text or link in the desk chat.
  - key: photo_upload
    description: 'Photo and document upload from the foreman''s phone is not available yet (no file fields): the foreman gives
      a link or writes text.'
  - key: pdf_and_email
    description: The quote PDF is the printable report (print / save as PDF); sending it to the client by email is not available
      yet.
  - key: foreman_scope
    description: 'The foreman sees only the sites shared with him: the owner invites him as editor on each job and progress
      record; a company-wide team model is not yet declarative.'
