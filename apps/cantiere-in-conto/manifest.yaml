apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: cantiere-in-conto
  displayName: Cantiere in Conto
  tagline:
    it: Dal preventivo alla commessa, con il margine sempre sotto controllo.
    en: From quote to job, with your margin always under control.
  description:
    it: 'Sistema operativo per piccole e medie imprese edili: preventivi con computo metrico dal prezzario regionale, commesse,
      lettura delle fatture fornitori, avanzamento lavori dal telefono e report settimanale dei margini.'
    en: 'Operating system for small and medium building firms: quotes with bills of quantities from the regional price list,
      jobs, supplier invoice reading, progress updates from the phone and a weekly margin report.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f3a4d'
      accent: '#e08a1e'
      background: '#f7f5f1'
      foreground: '#1c2329'
    fonts:
      body: Inter
      display: Barlow Condensed
    wordmark:
    - text: 'Cantiere in '
      color: primary
    - text: Conto
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label:
        it: Titolare
        en: Owner
      assignedBy: admin_emails
    - key: user
      label:
        it: Tecnico
        en: Technician
      assignedBy: signup
    - key: foreman
      label:
        it: Capocantiere
        en: Site foreman
      assignedBy: derived
      from: collection:jobs.foreman_email
  limits:
  - action: agent:estimator
    per: user
    max: 20
    window: day
    roles:
    - user
  agents:
  - key: estimator
    role: main
    description: Compone il computo metrico con il prezzario regionale delle opere pubbliche, applica i ricarichi e scrive
      il preventivo.
    profile:
      inline:
        display_name: Estimator — computo metrico
        crews:
        - id: estimator
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'Sei un computista di un''impresa edile italiana. Dalla richiesta (tipo di lavoro, indirizzo, regione,
            misure, lavorazioni, materiali) componi un preventivo. Cerca con gli strumenti web il prezzario regionale delle
            opere pubbliche in vigore della regione indicata (edizione più recente) e usa le voci reali con codice, descrizione,
            unità di misura e prezzo unitario. Non inventare mai codici o prezzi: se una voce non è nel prezzario, segnala
            ''voce fuori prezzario'' e proponi una stima chiaramente marcata come tale. Struttura del documento: un titolo
            di primo livello ''# Preventivo — <tipo di lavoro> — <indirizzo>''; poi ## Dati del cantiere; ## Computo metrico
            (tabella: codice, descrizione, u.m., quantità, prezzo unitario, importo); ## Riepilogo costi (totale lavorazioni,
            spese generali, utile d''impresa, eventuale ricarico materiali, imponibile, IVA indicativa); ## Note e esclusioni;
            ## Condizioni e validità (30 giorni). Applica i ricarichi dell''impresa indicati nel contesto (spese generali
            %, utile %, ricarico materiali %). Aggiungi un blocco ```chart``` a barre con l''incidenza dei capitoli di costo
            (valori reali). Non dare consulenza legale o fiscale come fatto certo. Scrivi nella lingua richiesta.'
    context:
    - key: company_name
      from: collection:company_profile.company_name
    - key: overhead_pct
      from: collection:company_profile.overhead_pct
    - key: profit_pct
      from: collection:company_profile.profit_pct
    - key: materials_markup_pct
      from: collection:company_profile.materials_markup_pct
    goalTemplate: 'Impresa: {company_name}. Ricarichi: spese generali {overhead_pct}%, utile {profit_pct}%, ricarico materiali
      {materials_markup_pct}%.

      Tipo di lavoro: {job_type_label}

      Indirizzo del cantiere: {address}

      Regione (prezzario): {region_label}

      Misure: {measures}

      Lavorazioni: {description}

      {?materials}Materiali: {materials}{/materials}

      Oggi è {date}. Scrivi il preventivo nella lingua con codice ISO {lang}.'
    output: markdown
    limits:
      maxTurns: 40
      maxBudgetUsd: 1.5
  - key: invoice_reader
    role: helper
    description: Legge una fattura fornitore, la abbina alla commessa giusta e aggiorna i costi reali.
    profile:
      inline:
        display_name: Lettore fatture fornitori
        crews:
        - id: invoice_reader
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: Leggi la fattura di un fornitore con lo strumento read_upload (passa l'id del file; funziona anche
            per scansioni e foto). Estrai fornitore, numero, data, imponibile, IVA, totale e righe. Con read_jobs cerca la
            commessa giusta (codice commessa citato, indirizzo del cantiere, riferimenti nelle righe). Se la corrispondenza
            è certa, aggiorna la fattura con update_invoice (job_code, stato 'abbinata', importo, data) e aggiorna il costo
            reale della commessa con update_job_cost (somma dei costi reali precedenti più questa fattura, senza contarla
            due volte). Se è dubbia, imposta lo stato 'da verificare' e spiega perché nel campo note. Non inventare mai importi.
            Chiudi con un breve riepilogo in Markdown che inizia con '# Fattura <numero> — <fornitore>'.
    appTools:
    - name: read_upload
      description: Legge un file caricato (OCR incluso)
      action: read_file
    - name: read_jobs
      description: Elenca le commesse
      action: read
      collection: jobs
      scope: all
    - name: update_job_cost
      description: Aggiorna il costo reale di una commessa
      action: write
      collection: jobs
      scope: all
    - name: update_invoice
      description: Aggiorna la fattura con l'abbinamento
      action: write
      collection: supplier_invoices
      scope: all
    goalTemplate: 'Nuova fattura fornitore: {record.supplier}, numero {record.number}, importo dichiarato {record.amount},
      file {record.file}, id fattura {record.id}. Commessa indicata a mano: {record.job_code}. Abbina e aggiorna i costi.'
    output: markdown
    limits:
      maxTurns: 10
      maxBudgetUsd: 0.4
  - key: weekly
    role: scheduled
    description: 'Report settimanale: margine per commessa, scostamenti, fatture da emettere.'
    writesTo:
      collection: weekly_reports
      parse: whole
    profile:
      inline:
        display_name: Controllo margini settimanale
        crews:
        - id: weekly
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei il controller dell''impresa edile. Con gli strumenti leggi commesse, fatture e avanzamenti.
            Scrivi un report che inizia con ''# Margini commesse — settimana del <data>''. Sezioni: ## Sintesi; ## Margine
            per commessa (tabella: commessa, ricavo previsto, costi previsti, costi reali, avanzamento %, margine previsto,
            margine stimato a finire); ## Scostamenti rispetto al preventivo (segnala dove i costi reali superano la quota
            di avanzamento); ## Fatture da emettere (stati avanzamento maturati non ancora fatturati al cliente); ## Fatture
            fornitori da verificare; ## Azioni consigliate. Aggiungi un grafico ```chart``` a barre con il margine per commessa.
            Usa solo dati presenti: se mancano, dillo. Nessun dato inventato.'
    appTools:
    - name: weekly_jobs
      description: Legge le commesse
      action: read
      collection: jobs
      scope: all
    - name: weekly_invoices
      description: Legge le fatture fornitori
      action: read
      collection: supplier_invoices
      scope: all
    - name: weekly_updates
      description: Legge gli avanzamenti lavori
      action: read
      collection: site_updates
      scope: all
    goalTemplate: 'Prepara il report settimanale dei margini. Oggi è {date}. Lingua: codice ISO {lang}.'
    output: markdown
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.6
  inputForm:
    title:
      it: Nuova richiesta di preventivo
      en: New quote request
    fields:
    - name: job_type
      type: select
      required: true
      label:
        it: Tipo di lavoro
        en: Job type
      options:
      - value: ristrutturazione
        label:
          it: Ristrutturazione
          en: Renovation
      - value: nuova_costruzione
        label:
          it: Nuova costruzione
          en: New build
      - value: bagno_cucina
        label:
          it: Bagno / cucina
          en: Bathroom / kitchen
      - value: facciata_cappotto
        label:
          it: Facciata / cappotto
          en: Facade / insulation
      - value: copertura
        label:
          it: Copertura / tetto
          en: Roofing
      - value: impianti
        label:
          it: Impianti
          en: Systems
      - value: altro
        label:
          it: Altro
          en: Other
    - name: address
      type: text
      required: true
      label:
        it: Indirizzo del cantiere
        en: Site address
    - name: region
      type: select
      required: true
      label:
        it: Regione del cantiere
        en: Site region
      options:
      - value: abruzzo
        label: Abruzzo
      - value: basilicata
        label: Basilicata
      - value: calabria
        label: Calabria
      - value: campania
        label: Campania
      - value: emilia-romagna
        label: Emilia-Romagna
      - value: friuli-venezia-giulia
        label: Friuli-Venezia Giulia
      - value: lazio
        label: Lazio
      - value: liguria
        label: Liguria
      - value: lombardia
        label: Lombardia
      - value: marche
        label: Marche
      - value: molise
        label: Molise
      - value: piemonte
        label: Piemonte
      - value: puglia
        label: Puglia
      - value: sardegna
        label: Sardegna
      - value: sicilia
        label: Sicilia
      - value: toscana
        label: Toscana
      - value: trentino-alto-adige
        label: Trentino-Alto Adige
      - value: umbria
        label: Umbria
      - value: valle-d-aosta
        label: Valle d'Aosta
      - value: veneto
        label: Veneto
    - name: measures
      type: textarea
      required: true
      maxLength: 1500
      label:
        it: Misure
        en: Measures
      help:
        it: es. 3 vani, 85 mq calpestabili, altezza 2,70 m
        en: e.g. 3 rooms, 85 sqm, height 2.70 m
    - name: description
      type: textarea
      required: true
      maxLength: 3000
      label:
        it: Descrizione delle lavorazioni
        en: Work description
    - name: materials
      type: textarea
      maxLength: 1500
      label:
        it: Materiali (facoltativo)
        en: Materials (optional)
  data:
    collections:
    - name: company_profile
      ownedBy: user
      description: Dati dell'impresa e ricarichi applicati ai preventivi
      fields:
      - name: company_name
        type: text
        required: true
        label:
          it: Ragione sociale
          en: Company name
      - name: vat_number
        type: text
        label:
          it: Partita IVA
          en: VAT number
      - name: overhead_pct
        type: number
        required: true
        default: 15
        label:
          it: Spese generali %
          en: Overhead %
      - name: profit_pct
        type: number
        required: true
        default: 10
        label:
          it: Utile d'impresa %
          en: Profit %
      - name: materials_markup_pct
        type: number
        default: 0
        label:
          it: Ricarico materiali %
          en: Materials markup %
    - name: jobs
      ownedBy: org
      description: Commesse nate da preventivi accettati
      fields:
      - name: code
        type: text
        required: true
        label:
          it: Codice commessa
          en: Job code
      - name: title
        type: text
        required: true
        label:
          it: Cantiere
          en: Site
      - name: client
        type: text
        required: true
        label:
          it: Cliente
          en: Client
      - name: address
        type: text
        label:
          it: Indirizzo
          en: Address
      - name: foreman_email
        type: email
        label:
          it: Email capocantiere
          en: Foreman email
      - name: revenue
        type: number
        required: true
        label:
          it: Importo preventivo (€)
          en: Quoted amount (€)
      - name: planned_cost
        type: number
        required: true
        label:
          it: Costi previsti (€)
          en: Planned cost (€)
      - name: actual_cost
        type: number
        default: 0
        label:
          it: Costi reali (€)
          en: Actual cost (€)
      - name: progress_pct
        type: number
        default: 0
        label:
          it: Avanzamento %
          en: Progress %
      - name: billed
        type: number
        default: 0
        label:
          it: Già fatturato al cliente (€)
          en: Billed to client (€)
      - name: status
        type: select
        default: aperta
        label:
          it: Stato
          en: Status
        options:
        - value: aperta
          label:
            it: Aperta
            en: Open
        - value: sospesa
          label:
            it: Sospesa
            en: Suspended
        - value: chiusa
          label:
            it: Chiusa
            en: Closed
      - name: documents
        type: file
        multiple: true
        accept:
        - pdf
        - docx
        - xlsx
        - jpg
        - png
        maxMb: 15
        label:
          it: Documenti (contratto, preventivo, permessi)
          en: Documents
      access:
      - role: foreman
        where:
          foreman_email: '{user.email}'
        can:
        - read
    - name: site_updates
      ownedBy: org
      description: Foto e stati di avanzamento caricati dal capocantiere
      fields:
      - name: job_code
        type: text
        required: true
        label:
          it: Codice commessa
          en: Job code
      - name: foreman_email
        type: email
        required: true
        label:
          it: La tua email
          en: Your email
      - name: date
        type: date
        required: true
        label:
          it: Data
          en: Date
      - name: progress_pct
        type: number
        required: true
        label:
          it: Avanzamento complessivo %
          en: Overall progress %
      - name: notes
        type: textarea
        label:
          it: Lavori svolti / note
          en: Work done / notes
      - name: photos
        type: file
        multiple: true
        accept:
        - jpg
        - jpeg
        - png
        - webp
        - pdf
        maxMb: 15
        label:
          it: Foto e documenti
          en: Photos and documents
      access:
      - role: foreman
        where:
          foreman_email: '{user.email}'
        can:
        - read
      retentionDays: 1825
    - name: supplier_invoices
      ownedBy: org
      description: Fatture dei fornitori da abbinare alle commesse
      fields:
      - name: supplier
        type: text
        required: true
        label:
          it: Fornitore
          en: Supplier
      - name: number
        type: text
        required: true
        label:
          it: Numero
          en: Number
      - name: date
        type: date
        label:
          it: Data
          en: Date
      - name: amount
        type: number
        label:
          it: Importo (€)
          en: Amount (€)
      - name: job_code
        type: text
        label:
          it: Commessa (se nota)
          en: Job (if known)
      - name: file
        type: file
        accept:
        - pdf
        - jpg
        - png
        - xml
        maxMb: 15
        label:
          it: Fattura
          en: Invoice
      - name: status
        type: select
        default: nuova
        label:
          it: Stato
          en: Status
        options:
        - value: nuova
          label: Nuova
        - value: abbinata
          label: Abbinata
        - value: da verificare
          label: Da verificare
      - name: note
        type: textarea
        label:
          it: Note
          en: Notes
    - name: weekly_reports
      ownedBy: org
      description: Report settimanali dei margini
      fields:
      - name: title
        type: text
      - name: content
        type: textarea
      - name: date
        type: date
  views:
  - key: home
    type: page
    nav: false
    title: Cantiere in Conto
    sections:
    - type: hero
      layout: stack
      band: true
      eyebrow:
        it: Per imprese edili
        en: For building firms
      title:
        it: Dal preventivo alla commessa, con il **margine** sempre sotto controllo.
        en: From quote to job, with your **margin** always under control.
      text:
        it: Computo metrico dal prezzario regionale, commesse, fatture dei fornitori abbinate in automatico, avanzamenti dal
          telefono e un report settimanale dei margini.
        en: Bills of quantities from the regional price list, jobs, supplier invoices matched automatically, progress from
          the phone and a weekly margin report.
      actions:
      - label:
          it: Accedi e inizia
          en: Sign in and start
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Preventivo
          en: Quote
        text:
          it: 'Inserisci lavori, misure e materiali: l''agente compone il computo con il prezzario regionale e i tuoi ricarichi,
            e ottieni un PDF per il cliente.'
          en: 'Enter works, measures and materials: the agent builds the bill of quantities from the regional price list and
            your markups, as a PDF for the client.'
        badge: 📝
      - title:
          it: Commessa
          en: Job
        text:
          it: Il preventivo accettato diventa commessa con costi previsti, avanzamento e documenti. Il capocantiere vede solo
            i suoi cantieri.
          en: An accepted quote becomes a job with planned costs, progress and documents. The foreman sees only their own
            sites.
        badge: 🏗️
      - title:
          it: Costi reali
          en: Actual costs
        text:
          it: Le fatture dei fornitori vengono lette e abbinate alla commessa giusta, aggiornando i costi reali.
          en: Supplier invoices are read and matched to the right job, updating actual costs.
        badge: 🧾
      - title:
          it: Report settimanale
          en: Weekly report
        text:
          it: Margine per commessa, scostamenti e fatture da emettere, ogni lunedì.
          en: Margin per job, deviations and invoices to issue, every Monday.
        badge: 📊
    - type: note
      content:
        it: 'I preventivi sono un supporto al lavoro del tecnico: verifica sempre voci e prezzi prima di inviarli al cliente.'
        en: 'Quotes support the technician''s work: always check items and prices before sending to the client.'
  - key: profile
    type: form
    collection: company_profile
    title:
      it: Dati impresa e ricarichi
      en: Company and markups
    edit: true
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Dati salvati.
        en: Saved.
      redirect: new_quote
    roles:
    - admin
    - user
  - key: new_quote
    type: new_run
    title:
      it: Nuovo preventivo
      en: New quote
    roles:
    - admin
    - user
  - key: quotes
    type: history
    title:
      it: I miei preventivi
      en: My quotes
    source: run
    roles:
    - admin
    - user
  - key: quote
    type: report
    source: run
    printable: true
    nav: false
  - key: new_job
    type: form
    collection: jobs
    title:
      it: Nuova commessa
      en: New job
    submit:
      label:
        it: Crea commessa
        en: Create job
      message:
        it: Commessa creata.
        en: Job created.
      redirect: jobs
    edit: true
    roles:
    - admin
  - key: jobs
    type: table
    source: collection:jobs
    title:
      it: Commesse
      en: Jobs
    columns:
    - code
    - title
    - client
    - revenue
    - planned_cost
    - actual_cost
    - progress_pct
    - billed
    - status
    export: true
    roles:
    - admin
    - foreman
  - key: site_update
    type: form
    collection: site_updates
    title:
      it: Avanzamento lavori
      en: Site progress
    submit:
      label:
        it: Invia
        en: Send
      message:
        it: Avanzamento registrato.
        en: Progress saved.
    roles:
    - admin
    - foreman
  - key: updates
    type: list
    source: collection:site_updates
    title:
      it: Storico avanzamenti
      en: Progress log
    columns:
    - date
    - job_code
    - progress_pct
    - notes
    roles:
    - admin
    - foreman
  - key: new_invoice
    type: form
    collection: supplier_invoices
    title:
      it: Carica fattura fornitore
      en: Upload supplier invoice
    submit:
      label:
        it: Carica
        en: Upload
      message:
        it: 'Fattura ricevuta: l''agente la sta abbinando.'
        en: 'Invoice received: the agent is matching it.'
      redirect: invoices
    roles:
    - admin
  - key: invoices
    type: table
    source: collection:supplier_invoices
    title:
      it: Fatture fornitori
      en: Supplier invoices
    columns:
    - date
    - supplier
    - number
    - amount
    - job_code
    - status
    - note
    export: true
    roles:
    - admin
  - key: reports
    type: list
    source: collection:weekly_reports
    title:
      it: Report settimanali
      en: Weekly reports
    columns:
    - date
    - title
    - content
    roles:
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - admin
    - user
  triggers:
  - key: invoice_in
    description: Una fattura caricata viene letta e abbinata
    'on':
      collection: supplier_invoices
      op: insert
      where:
        status: nuova
    start:
      agent: invoice_reader
    goal: 'Nuova fattura fornitore: {record.supplier}, numero {record.number}, importo dichiarato {record.amount}, file {record.file}.
      Commessa indicata a mano: {record.job_code}. Abbina e aggiorna i costi.'
  - key: job_assigned
    description: Avvisa il capocantiere della nuova commessa
    'on':
      collection: jobs
      op: insert
    notify:
      to:
      - record.foreman_email
      subject:
        it: 'Nuova commessa assegnata: {record.title}'
        en: 'New job assigned: {record.title}'
      body:
        it: Ti è stata assegnata la commessa {record.code} – {record.title}. Carica da qui foto e avanzamenti.
        en: You have been assigned job {record.code} – {record.title}. Upload photos and progress here.
      link: site_update
  - key: progress_in
    description: Avvisa il titolare di un nuovo avanzamento
    'on':
      collection: site_updates
      op: insert
    notify:
      to: admins
      subject:
        it: 'Avanzamento {record.job_code}: {record.progress_pct}%'
        en: 'Progress {record.job_code}: {record.progress_pct}%'
      body:
        it: Nuovo avanzamento sulla commessa {record.job_code}.
        en: New progress on job {record.job_code}.
      link: updates
  schedules:
  - agent: weekly
    action: run
    cron: 0 6 * * 1
    owner: app
    goal: Prepara il report settimanale dei margini.
    deliver:
      to: admins
      subject: Margini commesse — {date}
      onlyIfNew: true
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: pro
      price: 39
      interval: month
      label:
        it: Cantiere in Conto — per utente
        en: Cantiere in Conto — per user
      includes:
      - Preventivi con prezzario regionale
      - Commesse e avanzamenti
      - Lettura fatture fornitori
      - Report settimanale margini
  notifications:
    emailOnRunDone: true
  extensions:
  - key: oauth_accounting_bank
    description: 'Collegamento OAuth al gestionale contabile e ai conti bancari per riconciliare pagamenti e incassi: non
      disponibile per ora (OAuth verso altri servizi non è supportato). Nel frattempo i costi si aggiornano dalle fatture
      caricate.'
  - key: mailbox_intake
    description: 'Lettura automatica della casella email collegata per le fatture dei fornitori: non disponibile per ora.
      Le fatture si caricano dal modulo (o si inoltrano al caricamento) e l''agente le abbina alla commessa.'
  - key: quote_to_job
    description: La conversione del preventivo accettato in commessa è un passaggio manuale tramite il modulo Nuova commessa;
      l'invio del PDF al cliente avviene dal report stampabile.
