apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: collaudo-collettivo
  displayName: Collaudo Collettivo
  tagline:
    it: 'Crowdtesting gestito: campagne, tester giusti, bug già filtrati.'
    en: 'Managed crowdtesting: campaigns, the right testers, pre-triaged bugs.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1d2b53'
      accent: '#e4572e'
      background: '#f7f8fb'
      foreground: '#16181d'
    fonts:
      body: Inter
      display: Space Grotesk
    wordmark:
    - text: Collaudo
      color: primary
    - text: Collettivo
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: pm
      label:
        it: Project manager
        en: Project manager
      assignedBy: invite
    - key: user
      assignedBy: signup
  limits:
  - action: create:campaigns
    max: 20
    window: month
    roles:
    - user
  agents:
  - key: matcher
    role: helper
    description: Selects suitable testers for a new campaign and creates the invitations.
    profile:
      inline:
        display_name: Collaudo tester matcher
        crews:
        - id: matcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You select testers for a crowdtesting campaign. Read the testers with the tool search_testers (only
            active ones). Pick those whose device, operating system and country match the campaign requirements, preferring
            higher experience; cover every requested device/OS with at least 2 testers when possible and invite at most 15
            in total. For each chosen tester call add_invitation with campaign_id, campaign_name, tester_email and status
            'invited'. Then call set_campaign_testers once with the comma-separated emails of all invited testers and status
            'running'. Start the final answer with a level-1 title '# Inviti - <campaign>' and list who was invited and why,
            and any uncovered requirement. Never invent testers.
    appTools:
    - name: search_testers
      description: Read the tester database
      action: search
      collection: testers
      scope: all
    - name: add_invitation
      description: Create an invitation for a tester
      action: write
      collection: invitations
      scope: all
    - name: set_campaign_testers
      description: Update the campaign with the invited testers
      action: write
      collection: campaigns
      scope: all
    goalTemplate: 'New campaign id {record.id}: {record.name}. Product: {record.product}. Link or build: {record.url}. Devices:
      {record.devices}. Operating systems: {record.os}. Countries: {record.countries}. Scenarios: {record.scenarios}. Deadline:
      {record.deadline}. Customer: {record.customer_email}. Select the testers and send the invitations.'
    output: markdown
    limits:
      maxTurns: 15
      maxBudgetUsd: 0.5
  - key: triager
    role: helper
    description: 'Checks each bug report: duplicates, completeness of steps, priority, summary.'
    profile:
      inline:
        display_name: Collaudo bug triager
        crews:
        - id: triager
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You triage a bug report submitted by a tester. First call list_campaign_bugs to read the other reports
            of the same campaign. Decide: (1) duplicate: same defect as an earlier report, then give its id as duplicate_of;
            (2) complete: steps to reproduce are clear, ordered, with expected and actual result; if not, list what is missing;
            (3) priority P1-P4 from severity and impact; (4) a two-sentence summary for the project manager. If the report
            has a screenshot or video, open it with read_bug_file when it is an image. Then call save_triage once with the
            report''s id, triage_status (ok | duplicate | incomplete), priority, summary, duplicate_of, missing_info. You
            never approve a bug: the project manager does. Start the final answer with ''# Triage - <bug title>'' and be concise.
            Never invent facts that are not in the report.'
    appTools:
    - name: list_campaign_bugs
      description: Read the bug reports of the app
      action: search
      collection: bugs
      scope: all
    - name: save_triage
      description: Save the triage result on the bug report
      action: write
      collection: bugs
      scope: all
    - name: read_bug_file
      description: Read a screenshot the tester uploaded
      action: read_file
    goalTemplate: 'Triage this bug report. Id: {record.id}. Campaign: {record.campaign_id}. Title: {record.title}. Steps:
      {record.steps}. Severity: {record.severity}. Device: {record.device}. Attachment ids: {record.attachment}.'
    output: markdown
    limits:
      maxTurns: 10
      maxBudgetUsd: 0.4
  - key: ticketer
    role: helper
    description: Creates the Jira issue for an approved bug in the customer's Jira.
    profile:
      inline:
        display_name: Collaudo ticket sender
        crews:
        - id: ticketer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You send an approved bug to the customer''s Jira Cloud. Call jira_create_issue (POST) with a JSON
            body: {"fields":{"project":{"key":"<project_key>"},"summary":"<title>","issuetype":{"name":"Bug"},"description":{"type":"doc","version":1,"content":[{"type":"paragraph","content":[{"type":"text","text":"<steps,
            severity, device, priority>"}]}]}}}. If the tool says the user has not connected Jira, stop and say so. On success
            call mark_sent with the bug id, status ''sent'' and jira_key from the response key. Start the final answer with
            ''# Ticket - <bug title>''. Never invent a key.'
    appTools:
    - name: jira_create_issue
      description: Create an issue in the customer's Jira Cloud
      action: http
      http:
        method: POST
        url: https://{host}/rest/api/3/issue
        allowPath: false
        attribution: Jira Cloud REST API
        credential:
          provider: jira
          header: Authorization
          format: Basic {secret}
    - name: mark_sent
      description: Record the Jira key on the bug
      action: write
      collection: bugs
      scope: all
    goalTemplate: 'Send this approved bug to Jira. Bug id: {record.id}. Title: {record.title}. Steps: {record.steps}. Severity:
      {record.severity}. Priority: {record.priority}. Device: {record.device}. Summary: {record.summary}.'
    output: markdown
    limits:
      maxTurns: 6
      maxBudgetUsd: 0.2
  data:
    collections:
    - name: campaigns
      description: Test campaigns created by customers
      ownedBy: user
      access:
      - role: pm
        can:
        - read
        - write
      - role: user
        where:
          tester_emails: '{user.email}'
        can:
        - read
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome campagna
          en: Campaign name
      - name: product
        type: text
        required: true
        label:
          it: Prodotto
          en: Product
      - name: url
        type: url
        required: true
        label:
          it: Link o build
          en: Link or build
      - name: devices
        type: multiselect
        required: true
        label:
          it: Dispositivi
          en: Devices
        options:
        - value: iphone
          label: iPhone
        - value: android_phone
          label: Android phone
        - value: tablet
          label: Tablet
        - value: desktop
          label: Desktop
      - name: os
        type: multiselect
        required: true
        label:
          it: Sistemi operativi
          en: Operating systems
        options:
        - iOS
        - Android
        - Windows
        - macOS
        - Linux
      - name: countries
        type: text
        required: true
        label:
          it: Paesi (es. IT, DE)
          en: Countries (e.g. IT, DE)
      - name: scenarios
        type: textarea
        required: true
        label:
          it: Scenari da eseguire
          en: Scenarios to run
      - name: deadline
        type: date
        required: true
        label:
          it: Scadenza
          en: Deadline
      - name: customer_email
        type: email
        label: Email
      - name: status
        type: select
        default: new
        label:
          it: Stato
          en: Status
        options:
        - new
        - running
        - closed
      - name: tester_emails
        type: array
        label:
          it: Tester invitati
          en: Invited testers
    - name: testers
      description: Tester database, managed elsewhere
      ownedBy: org
      access:
      - role: pm
        can:
        - read
        - write
      fields:
      - name: name
        type: text
      - name: email
        type: email
        required: true
      - name: device
        type: select
        options:
        - iphone
        - android_phone
        - tablet
        - desktop
      - name: os
        type: select
        options:
        - iOS
        - Android
        - Windows
        - macOS
        - Linux
      - name: country
        type: country
      - name: experience
        type: select
        options:
        - junior
        - mid
        - senior
      - name: active
        type: boolean
        default: true
    - name: invitations
      description: Invitations sent to testers
      ownedBy: org
      access:
      - role: pm
      - role: user
        where:
          tester_email: '{user.email}'
        can:
        - read
      fields:
      - name: campaign_id
        type: text
      - name: campaign_name
        type: text
      - name: tester_email
        type: email
      - name: status
        type: select
        options:
        - invited
        - accepted
        - declined
        - done
    - name: bugs
      description: Bug reports from testers
      ownedBy: user
      retentionDays: 730
      access:
      - role: pm
        can:
        - read
        - write
      - role: user
        where:
          customer_email: '{user.email}'
        can:
        - read
      fields:
      - name: campaign_id
        type: text
        required: true
        label:
          it: ID campagna
          en: Campaign id
      - name: customer_email
        type: email
        label: Customer
      - name: title
        type: text
        required: true
        label:
          it: Titolo
          en: Title
      - name: steps
        type: textarea
        required: true
        label:
          it: Passi per riprodurlo
          en: Steps to reproduce
      - name: severity
        type: select
        required: true
        label:
          it: Gravità
          en: Severity
        options:
        - value: critical
          label:
            it: Critica
            en: Critical
        - value: high
          label:
            it: Alta
            en: High
        - value: medium
          label:
            it: Media
            en: Medium
        - value: low
          label:
            it: Bassa
            en: Low
      - name: device
        type: select
        required: true
        label:
          it: Dispositivo
          en: Device
        options:
        - iphone
        - android_phone
        - tablet
        - desktop
      - name: attachment
        type: file
        accept:
        - jpg
        - jpeg
        - png
        - webp
        - gif
        maxMb: 15
        multiple: true
        label:
          it: Screenshot
          en: Screenshots
      - name: video_link
        type: url
        label:
          it: Link al video
          en: Video link
      - name: tester_email
        type: email
      - name: triage_status
        type: select
        options:
        - pending
        - ok
        - duplicate
        - incomplete
        default: pending
      - name: priority
        type: select
        options:
        - P1
        - P2
        - P3
        - P4
      - name: summary
        type: textarea
      - name: duplicate_of
        type: text
      - name: missing_info
        type: textarea
      - name: status
        type: select
        default: pending
        label:
          it: Esito PM
          en: PM decision
        options:
        - pending
        - approved
        - rejected
        - sent
      - name: jira_key
        type: text
    credentials:
    - provider: jira
      kind: api_key
      scope: user
      label: Jira Cloud
      help:
        it: Incolla email:API token in Base64 (id.atlassian.com, Security, API token).
        en: Paste email:API token in Base64 (id.atlassian.com, Security, API token).
      hostLabel:
        it: tuaazienda.atlassian.net
        en: yourcompany.atlassian.net
  egress:
    hosts:
    - '*.atlassian.net'
    notes: Customer's own Jira Cloud, called with the customer's API token.
  triggers:
  - key: match_testers
    'on':
      collection: campaigns
      op: insert
      where:
        status: new
    start:
      agent: matcher
    goal: 'New campaign id {record.id}: {record.name}. Product: {record.product}. Link or build: {record.url}. Devices: {record.devices}.
      Operating systems: {record.os}. Countries: {record.countries}. Scenarios: {record.scenarios}. Deadline: {record.deadline}.
      Customer: {record.customer_email}. Select the testers and send the invitations.'
    asUser: false
  - key: campaign_fee
    'on':
      collection: campaigns
      op: insert
    charge:
      credits: 200
      reason: campaign fee
  - key: invite_mail
    'on':
      collection: invitations
      op: insert
    notify:
      to:
      - record.tester_email
      subject:
        it: 'Invito a testare: {record.campaign_name}'
        en: 'Invitation to test: {record.campaign_name}'
      body:
        it: Sei stato selezionato per la campagna {record.campaign_name}. Accedi per vedere scenari e scadenza.
        en: You were selected for campaign {record.campaign_name}. Sign in to see scenarios and deadline.
      link: my_campaigns
  - key: triage_bug
    'on':
      collection: bugs
      op: insert
      where:
        triage_status: pending
    start:
      agent: triager
    goal: 'Triage this bug report. Id: {record.id}. Campaign: {record.campaign_id}. Title: {record.title}. Steps: {record.steps}.
      Severity: {record.severity}. Device: {record.device}. Attachment ids: {record.attachment}.'
    asUser: false
  - key: send_ticket
    'on':
      collection: bugs
      op: update
      where:
        status: approved
    start:
      agent: ticketer
    goal: 'Send this approved bug to Jira. Bug id: {record.id}. Title: {record.title}. Steps: {record.steps}. Severity: {record.severity}.
      Priority: {record.priority}. Device: {record.device}. Summary: {record.summary}.'
    asUser: false
  inputForm:
    title:
      it: Nuova campagna
      en: New campaign
    fields: []
  views:
  - key: home
    type: page
    nav: false
    title: Collaudo Collettivo
    sections:
    - type: hero
      title:
        it: Test reali, su **dispositivi reali**, con bug già filtrati.
        en: Real tests on **real devices**, with bugs already triaged.
      text:
        it: 'Crea una campagna: scegliamo i tester giusti, controlliamo ogni segnalazione e inviamo solo i bug validi al tuo
          Jira.'
        en: 'Create a campaign: we pick the right testers, check every report and send only valid bugs to your Jira.'
      actions:
      - label:
          it: Crea una campagna
          en: Create a campaign
        href: /v/new_campaign
        style: primary
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Campagna
          en: Campaign
        text:
          it: Indichi prodotto, build, dispositivi, paesi, scenari e scadenza.
          en: You give product, build, devices, countries, scenarios and deadline.
        badge: '1'
      - title:
          it: Tester e bug
          en: Testers and bugs
        text:
          it: Un agente invita i tester adatti; loro eseguono gli scenari e segnalano i bug.
          en: An agent invites suitable testers; they run the scenarios and report bugs.
        badge: '2'
      - title:
          it: Revisione e ticket
          en: Review and tickets
        text:
          it: Duplicati eliminati, priorità assegnata, il project manager approva e Jira riceve il ticket.
          en: Duplicates removed, priority set, the project manager approves and Jira gets the ticket.
        badge: '3'
    - type: note
      content:
        it: Community di tester e pagamenti ai tester gestiti a parte.
        en: Tester community and tester payouts are handled separately.
  - key: new_campaign
    type: form
    title:
      it: Nuova campagna
      en: New campaign
    collection: campaigns
    fields:
    - name
    - product
    - url
    - devices
    - os
    - countries
    - scenarios
    - deadline
    - customer_email
    submit:
      label:
        it: Avvia campagna
        en: Launch campaign
      message:
        it: 'Campagna creata: stiamo selezionando i tester.'
        en: 'Campaign created: we are selecting testers.'
      redirect: campaigns
    edit: false
    roles:
    - user
    - admin
  - key: campaigns
    type: table
    title:
      it: Campagne
      en: Campaigns
    source: collection:campaigns
    columns:
    - name
    - product
    - deadline
    - status
    roles:
    - user
    - pm
    - admin
    export: true
  - key: my_campaigns
    type: table
    title:
      it: Le mie campagne da tester
      en: My test campaigns
    source: collection:invitations
    columns:
    - campaign_name
    - status
    roles:
    - user
  - key: report_bug
    type: form
    title:
      it: Segnala un bug
      en: Report a bug
    collection: bugs
    fields:
    - campaign_id
    - customer_email
    - title
    - steps
    - severity
    - device
    - attachment
    - video_link
    - tester_email
    submit:
      label:
        it: Invia segnalazione
        en: Submit report
      message:
        it: Segnalazione ricevuta.
        en: Report received.
      redirect: my_bugs
    edit: false
    roles:
    - user
  - key: my_bugs
    type: table
    title:
      it: Le mie segnalazioni
      en: My reports
    source: collection:bugs
    columns:
    - title
    - severity
    - triage_status
    - priority
    - status
    roles:
    - user
  - key: pm_review
    type: table
    title:
      it: Revisione bug
      en: Bug review
    source: collection:bugs
    columns:
    - title
    - severity
    - priority
    - triage_status
    - summary
    - duplicate_of
    - status
    roles:
    - pm
    - admin
    export: true
  - key: decide_bug
    type: form
    title:
      it: Decisione sul bug
      en: Bug decision
    collection: bugs
    fields:
    - priority
    - summary
    - status
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Decisione salvata.
        en: Decision saved.
      redirect: pm_review
    edit: true
    nav: false
    roles:
    - pm
    - admin
  - key: severity_chart
    type: page
    nav: false
    title: Chart
    sections:
    - type: data
      title:
        it: Bug per gravità
        en: Bugs by severity
      source: collection:bugs
      display: chart
      chart: bar
      fields:
      - key: severity
      - key: count
      groupBy:
        field: severity
        aggs: []
    - type: data
      title:
        it: Copertura dispositivi
        en: Device coverage
      source: collection:bugs
      display: chart
      chart: pie
      fields:
      - key: device
      - key: count
      groupBy:
        field: device
        aggs: []
    - type: data
      title:
        it: 'Report finale: bug approvati'
        en: 'Final report: approved bugs'
      source: collection:bugs
      display: table
      fields:
      - key: title
        label:
          it: Titolo
          en: Title
      - key: severity
        format: badge
      - key: priority
        format: badge
      - key: device
      - key: jira_key
      filters:
      - field: status
        op: '='
        value: sent
      limit: 100
  - key: dashboard
    type: dashboard
    title:
      it: Dashboard
      en: Dashboard
    children:
    - severity_chart
    - campaigns
    roles:
    - user
    - pm
    - admin
  - key: account
    type: account
    title:
      it: Crediti e Jira
      en: Credits and Jira
    roles:
    - user
  billing:
    modes:
    - credits
    signupCredits: 200
    packs:
    - key: campaign
      credits: 200
      price: 290
      label:
        it: 1 campagna
        en: 1 campaign
    - key: campaign5
      credits: 1000
      price: 1250
      label:
        it: 5 campagne
        en: 5 campaigns
  notifications:
    emailOnRunDone: false
  extensions:
  - key: tester_payout
    description: Payment of testers per approved bug is handled outside the app. Approved bugs (status approved/sent) can
      be exported by the PM as CSV from the bug review view.
  - key: jira_per_customer
    description: The Jira ticket is created with the Jira key of the user the event belongs to; per-customer routing of the
      ticket to the campaign owner's Jira, and the Jira project key, need a field on the campaign (to be added) and review.
