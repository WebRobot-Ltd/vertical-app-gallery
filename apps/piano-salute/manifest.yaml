apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: piano-salute
  displayName: Piano Salute
  tagline:
    it: Un anno di prevenzione, a partire dal tuo check-up.
  description:
    it: Questionario, referti del sangue e un piano di prevenzione personalizzato, rivisto e firmato da un medico della rete.
      Follow-up mensile via email.
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#0f4c5c'
      accent: '#2a9d8f'
      background: '#f6faf9'
      foreground: '#16282d'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: 'Piano '
      color: primary
    - text: Salute
      color: accent
  header:
    links:
    - label:
        it: Come funziona
      href: '#come-funziona'
    - label:
        it: Privacy
      href: '#privacy'
    cta:
      label:
        it: Inizia
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      label:
        it: Paziente
      assignedBy: signup
    - key: doctor
      label:
        it: Medico
      assignedBy: derived
      from: collection:profiles.doctor_email
  limits:
  - action: agent:analyst
    per: user
    max: 3
    window: month
    roles:
    - user
  agents:
  - key: analyst
    role: main
    description: Legge i referti, confronta con le linee guida pubbliche e prepara la bozza di piano per la revisione del
      medico.
    profile:
      inline:
        display_name: Piano Salute analista
        crews:
        - id: analyst
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'Sei un assistente di prevenzione che prepara BOZZE di piano per la revisione di un medico. Non sei
            un medico: non fai diagnosi, non prescrivi terapie, non modifichi farmaci. Leggi i referti (testo fornito; per
            scansioni o foto usa read_upload con l''id del file) e il questionario. Confronta i valori solo con le linee guida
            pubbliche dell''Istituto Superiore di Sanità (iss.it) e del Ministero della Salute (salute.gov.it): se serve consultale
            con gli strumenti web, citando la fonte. Non inventare valori né soglie; se un dato manca o è illeggibile, scrivilo.
            Struttura: un titolo di primo livello ''# Bozza piano prevenzione — <data>'', poi ## Sintesi dei valori (tabella
            valore / risultato / riferimento / nota), ## Esami consigliati, ## Obiettivi alimentazione, ## Obiettivi movimento
            e abitudini, ## Scadenze, ## Punti per il medico (dubbi, valori fuori range, interazioni con i farmaci), ## Fonti.
            Tono semplice, in italiano. Alla fine, dopo il report, un unico blocco ```json con le chiavi: title, summary,
            exams, goals, deadlines, doctor_notes (testi), status (sempre "draft"), doctor_email (quello ricevuto nel contesto).'
          disallowed_tools_note: nessuna scrittura locale
    context:
    - key: profile
      from: collection:profiles
    - key: doctor_email
      from: collection:profiles.doctor_email
    goalTemplate: 'Prepara la bozza del piano di prevenzione per {user}. Data: {date}.

      Questionario e profilo (JSON): {profile}

      Email del medico assegnato: {doctor_email}

      Referti caricati (id file): {referti}

      {?referti_text}Testo dei referti:

      {referti_text}{/referti_text}

      {?notes}Note dell''utente: {notes}{/notes}

      Scrivi in italiano.'
    appTools:
    - name: read_upload
      description: Legge un file caricato dall'utente (PDF scansionati, foto), OCR incluso
      action: read_file
    output: markdown+json
    resultSchema:
      type: object
      properties:
        title:
          type: string
        summary:
          type: string
        exams:
          type: string
        goals:
          type: string
        deadlines:
          type: string
        doctor_notes:
          type: string
        status:
          type: string
        doctor_email:
          type: string
    writesTo:
      collection: plans
      parse: json_last
    limits:
      maxTurns: 25
      maxBudgetUsd: 1.0
  - key: followup
    role: helper
    description: Follow-up mensile con promemoria e domande brevi.
    memory: instance
    writesTo:
      collection: followups
    profile:
      inline:
        display_name: Piano Salute follow-up
        crews:
        - id: followup
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 4
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Scrivi il follow-up mensile di un piano di prevenzione. Usa SOLO il piano con status signed (firmato
            dal medico); se non ce n''è, di'' che il piano è in revisione. Inizia con ''# Follow-up — <mese>''. Sezioni: ##
            Promemoria del mese (esami e scadenze del piano), ## Obiettivi su cui lavorare, ## Tre domande veloci (rispondibili
            in una riga, su abitudini e sintomi nuovi), ## Quando sentire il medico. Max 220 parole, tono caldo e semplice.
            Non fare diagnosi né cambiare terapie; per sintomi preoccupanti invita a contattare il medico. Hai una memoria
            di ciò che hai detto il mese scorso: non ripetere. Alla fine chiama remember con 4 punti chiave.'
    context:
    - key: plans
      from: collection:plans
    - key: profile
      from: collection:profiles
    goalTemplate: 'Follow-up di {date} per {user}.

      Piani: {plans}

      Profilo: {profile}

      Scrivi in italiano.'
  templates:
  - key: monthly_followup
    title:
      it: Follow-up mensile
    description:
      it: Ogni mese una email con promemoria e domande brevi sul tuo piano.
    agent: followup
    params:
    - name: note
      type: text
      label:
        it: Cosa ti interessa seguire (facoltativo)
    goal: 'Follow-up mensile "{instance}". {?note}Interesse dell''utente: {note}{/note} Oggi è {date}. Scrivi in italiano.'
    schedule:
      cron: 0 8 1 * *
      userCanChange: false
    maxPerUser: 1
    roles:
    - user
    deliver:
      to: owner
      subject: Il tuo follow-up mensile — Piano Salute
      onlyIfNew: true
  inputForm:
    title:
      it: Nuovo check-up
    fields:
    - name: referti
      type: file
      required: true
      label:
        it: Referti esami del sangue (PDF)
      accept:
      - pdf
      - jpg
      - png
      maxMb: 10
      multiple: true
    - name: notes
      type: textarea
      maxLength: 600
      label:
        it: Note per il medico (facoltative)
  data:
    collections:
    - name: profiles
      description: Consenso e questionario di ogni paziente; doctor_email è il medico assegnato
      ownedBy: user
      fields:
      - name: consent
        type: boolean
        required: true
        label:
          it: Acconsento al trattamento dei miei dati sanitari per il piano di prevenzione
      - name: age
        type: number
        required: true
        label:
          it: Età
      - name: sex
        type: select
        required: true
        label:
          it: Sesso
        options:
        - value: f
          label: Femminile
        - value: m
          label: Maschile
        - value: other
          label: Altro
      - name: weight_kg
        type: number
        required: true
        label:
          it: Peso (kg)
      - name: height_cm
        type: number
        required: true
        label:
          it: Altezza (cm)
      - name: smoking
        type: select
        label:
          it: Fumo
        options:
        - value: never
          label: Mai
        - value: former
          label: Ex fumatore
        - value: current
          label: Fumatore
      - name: alcohol
        type: select
        label:
          it: Alcol
        options:
        - value: none
          label: Mai
        - value: occasional
          label: Occasionale
        - value: daily
          label: Quotidiano
      - name: activity
        type: select
        label:
          it: Attività fisica
        options:
        - value: low
          label: Sedentario
        - value: moderate
          label: 1-3 volte a settimana
        - value: high
          label: 4+ volte a settimana
      - name: sleep_hours
        type: number
        label:
          it: Ore di sonno per notte
      - name: family_history
        type: multiselect
        label:
          it: Familiarità
        options:
        - value: cardio
          label: Malattie cardiovascolari
        - value: diabetes
          label: Diabete
        - value: cancer
          label: Tumori
        - value: thyroid
          label: Tiroide
        - value: none
          label: Nessuna nota
      - name: medications
        type: textarea
        maxLength: 600
        label:
          it: Farmaci che assumi
      - name: last_update
        type: date
        required: true
        label:
          it: Data di compilazione
      - name: doctor_email
        type: email
        label:
          it: Medico assegnato
      access:
      - role: doctor
        where:
          doctor_email: '{user.email}'
        can:
        - read
    - name: plans
      description: 'Piani di prevenzione: bozza dell''agente, revisione e firma del medico'
      ownedBy: user
      fields:
      - name: title
        type: text
        label:
          it: Titolo
      - name: summary
        type: textarea
        label:
          it: Sintesi
      - name: exams
        type: textarea
        label:
          it: Esami consigliati
      - name: goals
        type: textarea
        label:
          it: Obiettivi
      - name: deadlines
        type: textarea
        label:
          it: Scadenze
      - name: doctor_notes
        type: textarea
        label:
          it: Note del medico
      - name: status
        type: select
        required: true
        label:
          it: Stato
        options:
        - value: draft
          label: Bozza
        - value: signed
          label: Firmato
      - name: signed_at
        type: date
        label:
          it: Data firma
      - name: doctor_email
        type: email
      access:
      - role: doctor
        where:
          doctor_email: '{user.email}'
        can:
        - read
        - write
    - name: followups
      description: Follow-up mensili di ogni osservatore
      ownedBy: instance
      retentionDays: 730
  views:
  - key: home
    type: page
    nav: false
    title: Piano Salute
    sections:
    - type: hero
      eyebrow:
        it: Prevenzione
      title:
        it: Un **anno di prevenzione**, a partire dal tuo check-up.
      text:
        it: Compili un questionario, carichi i referti del sangue e ricevi un piano personalizzato rivisto e firmato da un
          medico. Poi ti accompagniamo ogni mese.
      actions:
      - label:
          it: Inizia il check-up
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
      items:
      - title:
          it: 1 · Questionario e consenso
        text:
          it: Dati, abitudini, familiarità e farmaci, con il tuo consenso esplicito.
      - title:
          it: 2 · Referti
        text:
          it: Carichi i PDF degli esami; un agente li confronta con le linee guida di ISS e Ministero della Salute.
      - title:
          it: 3 · Il medico firma
        text:
          it: Un medico della rete rivede e firma la bozza prima che tu la veda.
      - title:
          it: 4 · Follow-up
        text:
          it: Ogni mese una email con promemoria e domande brevi; ogni tre mesi aggiorniamo i dati.
    - type: cards
      id: privacy
      title:
        it: Privacy
      items:
      - title:
          it: Solo tu e il tuo medico
        text:
          it: I dati clinici sono visibili a te e al medico assegnato. Puoi cancellarli in ogni momento.
    - type: note
      content:
        it: Piano Salute offre supporto alla prevenzione, non è un servizio di diagnosi né sostituisce il parere del medico.
  - key: questionnaire
    type: form
    title:
      it: Questionario
    collection: profiles
    fields:
    - consent
    - age
    - sex
    - weight_kg
    - height_cm
    - smoking
    - alcohol
    - activity
    - sleep_hours
    - family_history
    - medications
    - last_update
    submit:
      label:
        it: Salva
      message:
        it: Questionario salvato.
      redirect: new_checkup
    edit: true
    roles:
    - user
  - key: new_checkup
    type: new_run
    title:
      it: Carica i referti
    roles:
    - user
  - key: my_plan
    type: table
    title:
      it: Il mio piano
    source: collection:plans
    data:
      display: cards
      fields:
      - key: title
        label:
          it: Piano
      - key: summary
        label:
          it: Sintesi
      - key: exams
        label:
          it: Esami consigliati
      - key: goals
        label:
          it: Obiettivi
      - key: deadlines
        label:
          it: Scadenze
      - key: doctor_notes
        label:
          it: Note del medico
      - key: signed_at
        label:
          it: Firmato il
        format: date
      filters:
      - field: status
        op: '='
        value: signed
      sort:
        field: signed_at
        dir: desc
      limit: 1
      empty:
        it: Il tuo piano è in revisione da parte del medico.
    roles:
    - user
  - key: history
    type: table
    title:
      it: Storico
    source: collection:plans
    data:
      display: table
      fields:
      - key: title
        label:
          it: Piano
      - key: signed_at
        label:
          it: Firmato il
        format: date
      - key: deadlines
        label:
          it: Scadenze
      filters:
      - field: status
        op: '='
        value: signed
      sort:
        field: signed_at
        dir: desc
      limit: 50
      empty:
        it: Nessun piano firmato per ora.
    export: true
    roles:
    - user
  - key: followups_setup
    type: instances
    template: monthly_followup
    title:
      it: Follow-up mensile
    roles:
    - user
  - key: patients
    type: table
    title:
      it: I miei pazienti
    source: collection:profiles
    data:
      display: table
      fields:
      - key: age
        label:
          it: Età
      - key: sex
        label:
          it: Sesso
      - key: weight_kg
        label: Kg
      - key: height_cm
        label: Cm
      - key: smoking
        label:
          it: Fumo
      - key: alcohol
        label:
          it: Alcol
      - key: activity
        label:
          it: Attività
      - key: medications
        label:
          it: Farmaci
      - key: last_update
        label:
          it: Aggiornato
        format: date
      limit: 100
    roles:
    - doctor
  - key: to_review
    type: table
    title:
      it: Bozze da rivedere
    source: collection:plans
    data:
      display: table
      fields:
      - key: title
        label:
          it: Piano
      - key: status
        label:
          it: Stato
        format: badge
      - key: summary
        label:
          it: Sintesi
      filters:
      - field: status
        op: '='
        value: draft
      limit: 100
      empty:
        it: Nessuna bozza in attesa.
    roles:
    - doctor
  - key: review_plan
    type: form
    title:
      it: Rivedi e firma
    collection: plans
    fields:
    - title
    - summary
    - exams
    - goals
    - deadlines
    - doctor_notes
    - status
    - signed_at
    submit:
      label:
        it: Salva
      message:
        it: Piano salvato. Se lo stato è Firmato, il paziente lo vedrà.
      redirect: to_review
    edit: true
    roles:
    - doctor
  - key: account
    type: account
    title:
      it: Abbonamento
    roles:
    - user
  notifications:
    emailOnRunDone: false
  triggers:
  - key: draft_ready
    'on':
      collection: plans
      op: insert
      where:
        status: draft
    notify:
      to:
      - record.doctor_email
      subject:
        it: Nuova bozza di piano da rivedere
      body:
        it: Una bozza di piano di prevenzione è pronta per la tua revisione e firma.
      link: to_review
  - key: plan_signed
    'on':
      collection: plans
      op: update
      where:
        status: signed
    notify:
      to:
      - owner
      subject:
        it: Il tuo piano di prevenzione è pronto
      body:
        it: Il medico ha rivisto e firmato il tuo piano. Puoi consultarlo nell'app.
      link: my_plan
  - key: quarterly_update
    'on':
      date:
        collection: profiles
        field: last_update
        offsetDays: 90
        hour: 8
    notify:
      to:
      - owner
      subject:
        it: È ora di aggiornare i tuoi dati
      body:
        it: 'Sono passati tre mesi: aggiorna il questionario (peso, abitudini, farmaci) per tenere il piano aggiornato.'
      link: questionnaire
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: annual
      price: 89
      interval: year
      label:
        it: Piano annuale
      includes:
      - Check-up con revisione medica
      - Follow-up mensile via email
      - Aggiornamento trimestrale dei dati
      roles:
      - user
    costs:
      agent:analyst:
        requiresPlan: annual
  extensions:
  - key: lab_results_feed
    description: 'Ricezione diretta dei risultati dal laboratorio convenzionato (futuro): si potrà usare un trigger webhook
      che salva i valori in una collezione dedicata.'
  - key: admin_no_clinical_access
    description: Il runtime concede comunque agli admin la lettura dei record; l'esclusione dei dati clinici per gli admin
      va garantita con una politica dell'app (nessuna vista admin) e va verificata. L'assegnazione del medico (doctor_email)
      è fatta dall'admin nello studio.
  - key: draft_hidden_from_patient
    description: La bozza è nascosta al paziente tramite filtro status=signed nelle viste; un vero blocco a livello di dati
      non è disponibile.
  - key: health_data_compliance
    description: 'Dati sanitari (GDPR art. 9): servono informativa, DPIA e nomina dei medici come autorizzati; il consenso
      è registrato nel questionario.'
