apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: traducicatalogo
  displayName: TraduciCatalogo
  tagline:
    it: Schede prodotto tradotte in 17 lingue, con revisione automatica e umana.
    en: Product sheets translated into 17 languages, with automatic and human review.
  description:
    it: 'Incolla il tuo catalogo, scegli lingue, tono e glossario: un agente traduce riga per riga, un secondo agente revisiona
      terminologia, lunghezze e unità di misura.'
    en: 'Paste your catalog, choose languages, tone and glossary: one agent translates row by row, a second agent checks terminology,
      lengths and units.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#16324f'
      accent: '#e07a1f'
      background: '#f8f9fb'
      foreground: '#1a2230'
    fonts:
      body: Inter
      display: Sora
    wordmark:
    - text: Tradu
      color: primary
    - text: Catalogo
      color: accent
    button: accent
    width: wide
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Lingue
        en: Languages
      href: '#lingue'
    cta:
      label:
        it: Inizia
        en: Start
      href: /v/new_project
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: reviewer
      label:
        it: Revisore madrelingua
        en: Native reviewer
      assignedBy: invite
    - key: user
      label:
        it: Cliente
        en: Customer
      assignedBy: signup
  limits:
  - action: agent:translator
    per: user
    max: 20
    window: day
    roles:
    - user
  agents:
  - key: translator
    role: main
    description: Translates the catalog row by row keeping its structure, then hands it to the reviewer.
    profile:
      inline:
        display_name: TraduciCatalogo translator
        crews:
        - id: translator
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are a professional product-catalog translator. You receive catalog rows (SKU, title, short description,
            long description, materials, sizes...) pasted as CSV/TSV text, a list of rows, or a link to a public page. Translate
            each row field by field into every target language, keeping the row structure, SKUs, numbers, HTML tags and placeholders
            untouched. Never translate terms in the glossary. Respect the requested tone (technical, luxury, colloquial) and
            the character limit per field: if a translation would exceed the limit, shorten it rather than cut it. Convert
            units only if asked; otherwise keep them. Never invent product facts. After translating, ask the reviewer (tool
            ask_reviewer) to check your work and apply its corrections. If the customer asked for human review, call request_human_review
            with the flagged rows. Output: a level-1 title ''# Translation — <project name>'', then for each target language
            a ''## <language>'' section with a Markdown table with columns SKU | Field | Original | Translation | Status (ok
            / flagged: reason). End with ''## Summary'' listing words translated per language, number of flagged rows and
            the reviewer''s notes. If the input is only a link you cannot read, say so plainly and ask for pasted text.'
    delegates:
    - reviewer
    awaits:
    - human_review
    goalTemplate: 'Project: {project_name}

      Source language: {source_lang_label}

      Target languages: {target_langs}

      Tone: {tone_label}

      {?glossary}Glossary — do NOT translate these terms:

      {glossary}{/glossary}

      {?max_chars}Maximum characters per field: {max_chars}{/max_chars}

      {?human_review}The customer wants flagged rows to go to a human native reviewer before delivery.{/human_review}

      {?catalog_text}Catalog content:

      {catalog_text}{/catalog_text}

      {?store_url}Online store / catalog link: {store_url}{/store_url}

      Today is {date}. Write notes in the language with ISO code {lang}.'
    output: markdown
    limits:
      maxTurns: 12
      maxBudgetUsd: 1.5
  - key: reviewer
    role: helper
    description: Checks glossary consistency, lengths and units; flags doubtful rows.
    profile:
      inline:
        display_name: TraduciCatalogo reviewer
        crews:
        - id: reviewer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are a meticulous translation reviewer for product catalogs. Given the original rows, the translations,
            the glossary and the character limit, check: (1) glossary terms preserved untouched and used consistently across
            rows; (2) character limits per field; (3) units of measure, sizes, numbers and SKUs identical to the source; (4)
            tone as requested; (5) omissions or additions. Reply with a corrected version of any wrong cell and a list of
            flagged rows as ''SKU | language | field | reason''. Flag as doubtful only what truly needs a human; never invent
            facts.'
  - key: cell_fixer
    role: helper
    description: Produces a new version of a single cell on request.
    when: mode == 'cell'
    profile:
      inline:
        display_name: TraduciCatalogo cell fixer
        crews:
        - id: cell_fixer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 3
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You re-translate ONE catalog cell. Start with '# Cell — <SKU> / <language>'. Give 3 alternative translations
            in a table (Version | Text | Characters), respecting the glossary, tone and character limit, then recommend one
            in one sentence. Never invent product facts.
    goalTemplate: 'Re-translate one cell.

      Source language: {source_lang_label}

      Target language: {target_langs}

      Tone: {tone_label}

      {?glossary}Do not translate: {glossary}{/glossary}

      {?max_chars}Character limit: {max_chars}{/max_chars}

      Original text and notes on what to change:

      {catalog_text}

      Write notes in the language with ISO code {lang}.'
    output: markdown
  approvals:
  - key: human_review
    title:
      it: Revisione umana madrelingua
      en: Native human review
    description: Flagged rows are checked by a native reviewer of the team before delivery.
    role: reviewer
    decidedBy: role
    fields:
    - language
    - flagged_rows
    timeoutMinutes: 2880
    onTimeout: approve
  inputForm:
    title:
      it: Nuovo progetto di traduzione
      en: New translation project
    fields:
    - name: project_name
      type: text
      required: true
      maxLength: 80
      label:
        it: Nome del progetto
        en: Project name
    - name: mode
      type: select
      required: true
      default: full
      label:
        it: Cosa vuoi fare
        en: What to do
      options:
      - value: full
        label:
          it: Tradurre il catalogo
          en: Translate the catalog
      - value: cell
        label:
          it: Nuova versione di una singola cella
          en: New version of a single cell
    - name: catalog_text
      type: textarea
      maxLength: 60000
      label:
        it: Catalogo incollato (CSV/TSV con intestazioni)
        en: Pasted catalog (CSV/TSV with headers)
      help:
        it: 'Copia le righe da CSV o Excel: SKU, titolo, descrizioni, materiali, taglie.'
        en: 'Copy the rows from your CSV or Excel: SKU, title, descriptions, materials, sizes.'
    - name: store_url
      type: url
      visibleWhen: mode == 'full'
      label:
        it: Oppure link al catalogo / store online (pubblico)
        en: Or link to a public catalog / online store
    - name: source_lang
      type: select
      required: true
      default: it
      label:
        it: Lingua di partenza
        en: Source language
      options:
      - value: it
        label: Italiano
      - value: en
        label: English
      - value: fr
        label: Français
      - value: de
        label: Deutsch
      - value: es
        label: Español
    - name: target_langs
      type: multiselect
      required: true
      label:
        it: Lingue di destinazione
        en: Target languages
      options:
      - value: en
        label: English
      - value: it
        label: Italiano
      - value: fr
        label: Français
      - value: de
        label: Deutsch
      - value: es
        label: Español
      - value: pt
        label: Português
      - value: nl
        label: Nederlands
      - value: pl
        label: Polski
      - value: sv
        label: Svenska
      - value: ro
        label: Română
      - value: el
        label: Ελληνικά
      - value: tr
        label: Türkçe
      - value: ru
        label: Русский
      - value: ja
        label: 日本語
      - value: zh
        label: 中文
      - value: ko
        label: 한국어
      - value: vi
        label: Tiếng Việt
    - name: tone
      type: select
      required: true
      default: technical
      label:
        it: Tono
        en: Tone
      options:
      - value: technical
        label:
          it: Tecnico
          en: Technical
      - value: luxury
        label:
          it: Lusso
          en: Luxury
      - value: casual
        label:
          it: Colloquiale
          en: Casual
    - name: glossary
      type: textarea
      maxLength: 3000
      label:
        it: 'Glossario: termini da non tradurre (uno per riga)'
        en: 'Glossary: terms not to translate (one per line)'
    - name: max_chars
      type: number
      label:
        it: Limite di caratteri per campo
        en: Character limit per field
    - name: human_review
      type: boolean
      default: false
      visibleWhen: mode == 'full'
      label:
        it: Le righe dubbie passano da un revisore umano madrelingua
        en: Send flagged rows to a native human reviewer
  views:
  - key: home
    type: page
    nav: false
    title: TraduciCatalogo
    sections:
    - type: hero
      eyebrow:
        it: Per e-commerce, editori e produttori
        en: For e-commerce, publishers and manufacturers
      title:
        it: Il tuo catalogo in **17 lingue**, coerente riga per riga.
        en: Your catalog in **17 languages**, consistent row by row.
      text:
        it: Un agente traduce mantenendo la struttura, un secondo controlla glossario, lunghezze e unità di misura. Tu correggi
          cosa vuoi e scarichi il risultato.
        en: One agent translates keeping the structure, a second checks glossary, lengths and units of measure. You fix what
          you want and download the result.
      actions:
      - label:
          it: Crea un progetto
          en: Create a project
        href: /v/new_project
        style: primary
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Carica
          en: Provide
        text:
          it: Incolla le righe del catalogo (da CSV o Excel) o indica il link allo store.
          en: Paste your catalog rows (from CSV or Excel) or give your store link.
        badge: 📥
      - title:
          it: Traduci e revisiona
          en: Translate and review
        text:
          it: Traduttore e revisore lavorano con il tuo glossario, tono e limiti di caratteri.
          en: Translator and reviewer work with your glossary, tone and character limits.
        badge: 🌍
      - title:
          it: Correggi e scarica
          en: Fix and download
        text:
          it: Tabella originale/traduzione per lingua, nuova versione di una cella, revisione umana opzionale.
          en: Original/translation table per language, new version of a single cell, optional human review.
        badge: ✅
    - type: cards
      id: lingue
      title:
        it: Lingue
        en: Languages
      items:
      - title:
          it: Europa
          en: Europe
        text: English, Italiano, Français, Deutsch, Español, Português, Nederlands, Polski, Svenska, Română, Ελληνικά, Türkçe,
          Русский
      - title:
          it: Asia
          en: Asia
        text: 日本語, 中文, 한국어, Tiếng Việt
    - type: note
      content:
        it: 'Pagamento a crediti prepagati, scalati in base alle parole e alle lingue. Le traduzioni automatiche possono contenere
          errori: per testi critici usa la revisione umana.'
        en: 'Prepaid credits, charged by words and languages. Machine translations may contain errors: use human review for
          critical text.'
  - key: new_project
    type: new_run
    title:
      it: Nuovo progetto
      en: New project
    roles:
    - user
    - admin
  - key: projects
    type: history
    title:
      it: I miei progetti
      en: My projects
    source: run
    columns:
    - createdAt
    - project_name
    - target_langs
    - status
    roles:
    - user
    - admin
  - key: project
    type: report
    title:
      it: Traduzione
      en: Translation
    source: run
    printable: true
    nav: false
  - key: reviews
    type: approvals
    title:
      it: Revisioni umane
      en: Human reviews
    approvals:
    - human_review
    roles:
    - reviewer
    - admin
  - key: account
    type: account
    title:
      it: Crediti
      en: Credits
    roles:
    - user
  billing:
    modes:
    - credits
    currency: eur
    signupCredits: 50
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:translator:
        estimate: 100
        metered: true
      agent:cell_fixer:
        estimate: 5
        metered: true
    packs:
    - key: small
      credits: 1000
      price: 10
      label: Starter
    - key: large
      credits: 6000
      price: 50
      label: Pro
  extensions:
  - key: file_upload
    description: 'Uploading CSV/XLSX files is not available yet: the user pastes the rows or gives a public link.'
  - key: file_download
    description: 'Downloading the same CSV/XLSX file with the translated columns is not available yet: the report is shown
      as tables to copy or print.'
  - key: email_on_done
    description: Email when the project is delivered is not available yet (notifications).
  - key: cell_editing
    description: Manual editing of cells in a side-by-side grid is not available yet; single-cell new versions are requested
      through the 'single cell' mode of the form.
  - key: store_connectors
    description: Connecting an online store with the customer's own credentials (Shopify, WooCommerce) is not available yet;
      only public links.
  - key: per_word_pricing
    description: Credits are metered on real usage (AI tokens and compute), which scales with words and languages; a fixed
      per-word-per-language tariff would need custom logic.
