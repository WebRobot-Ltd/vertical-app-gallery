apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: traducicatalogo
  displayName: TraduciCatalogo
  tagline:
    it: Schede prodotto tradotte in 17 lingue, con revisione automatica e umana.
    en: Product sheets translated into 17 languages, with automatic and human review.
  langs:
  - it
  - en
  defaultLang: it
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12355b'
      accent: '#e07a1f'
      background: '#f8f9fb'
      foreground: '#16202b'
    fonts:
      body: Inter
      display: Manrope
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
    - key: native_reviewer
      label:
        it: Revisore madrelingua
        en: Native reviewer
      assignedBy: invite
  limits:
  - action: run
    per: user
    max: 20
    window: day
    roles:
    - user
  agents:
  - key: translator
    role: main
    description: Translates the catalog row by row, keeping the structure, then hands over to the reviewer.
    delegates:
    - reviewer
    profile:
      inline:
        display_name: Catalog translator
        crews:
        - id: translator
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are a professional product-catalog translator. You receive the catalog text (CSV/XLSX content
            or pasted text), the source language, the target languages, the tone, a glossary of terms that must NOT be translated,
            and a maximum character limit per field. Work row by row and field by field, keeping the structure: SKU and other
            codes are never translated. Respect the tone, keep glossary terms verbatim, keep units of measure correct (convert
            only the formatting, never the values), and never exceed the character limit of a field. For each translated cell
            call the tool save_translation with project, sku, field, lang, source, translation. When all rows are saved, call
            ask_reviewer with the project name and the languages. Finish with a report starting with a level-1 title "# Traduzione
            completata — <project>" listing rows, languages, words translated, and the cells flagged by the reviewer. Never
            invent product data; if a field is ambiguous, translate literally and add it to the notes.'
    appTools:
    - name: save_translation
      description: Save one translated cell
      action: write
      collection: translations
      scope: user
    goalTemplate: 'Project: {project}

      Source language: {source_lang_label}

      Target languages: {target_langs}

      Tone: {tone_label}

      {?glossary}Glossary (do not translate): {glossary}{/glossary}

      {?max_chars}Maximum characters per field: {max_chars}{/max_chars}

      {?human_review}Rows flagged by the reviewer must go through the native human reviewer.{/human_review}

      {?catalog_text}Catalog file content:

      {catalog_text}{/catalog_text}

      {?pasted}Pasted text:

      {pasted}{/pasted}

      {?store_url}Online store to read: {store_url}{/store_url}

      Report language: {lang}.'
    output: markdown
    limits:
      maxTurns: 30
      maxBudgetUsd: 2
  - key: reviewer
    role: helper
    description: Checks terminology, lengths and units; flags doubtful rows.
    awaits:
    - native_review
    profile:
      inline:
        display_name: Catalog reviewer
        crews:
        - id: reviewer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 20
          max_budget_usd: 1
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You review translations of product catalogs. Read the project's translations with list_translations.
            Check terminology consistency, that glossary terms are kept verbatim, the character limits, and that units of
            measure and numbers match the source. For each doubtful row call update_translation setting status to flagged
            and a short note; set status ok otherwise. If the user asked for human review and there are flagged rows, call
            request_native_review once. Reply with a short summary of the findings.
    appTools:
    - name: list_translations
      description: Read the user's translations
      action: read
      collection: translations
      scope: user
    - name: update_translation
      description: Update status and note of a translation
      action: write
      collection: translations
      scope: user
  - key: cell_editor
    role: helper
    description: Regenerates a single cell on request.
    profile:
      inline:
        display_name: Cell editor
        crews:
        - id: cell_editor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You help the user improve one translated catalog cell at a time. Find the cell with find_cells, produce
            a new version following the requested change, keeping glossary terms, units and character limits, and save it
            with update_cell. Answer briefly with the new text.
    appTools:
    - name: find_cells
      description: Read the user's translations
      action: search
      collection: translations
      scope: user
    - name: update_cell
      description: Save the new translation of a cell
      action: write
      collection: translations
      scope: user
    goalTemplate: 'Conversation so far:

      {history}

      New message: {message}'
  inputForm:
    title:
      it: Nuovo progetto di traduzione
      en: New translation project
    fields:
    - name: project
      type: text
      required: true
      label:
        it: Nome progetto
        en: Project name
    - name: catalog
      type: file
      accept:
      - csv
      - xlsx
      maxMb: 15
      label:
        it: File catalogo (CSV o XLSX)
        en: Catalog file (CSV or XLSX)
    - name: pasted
      type: textarea
      label:
        it: Oppure incolla il testo
        en: Or paste the text
    - name: store_url
      type: url
      label:
        it: Oppure collega lo store online
        en: Or link your online store
    - name: source_lang
      type: select
      required: true
      label:
        it: Lingua di partenza
        en: Source language
      options:
      - value: it
        label: Italiano
      - value: en
        label: English
      - value: fr
        label: Français
      - value: de
        label: Deutsch
      - value: es
        label: Español
      - value: pt
        label: Português
      - value: nl
        label: Nederlands
      - value: pl
        label: Polski
      - value: sv
        label: Svenska
      - value: el
        label: Ελληνικά
      - value: cs
        label: Čeština
      - value: ro
        label: Română
      - value: hu
        label: Magyar
      - value: tr
        label: Türkçe
      - value: ja
        label: 日本語
      - value: zh
        label: 中文
      - value: ko
        label: 한국어
    - name: target_langs
      type: multiselect
      required: true
      label:
        it: Lingue di destinazione
        en: Target languages
      options:
      - value: it
        label: Italiano
      - value: en
        label: English
      - value: fr
        label: Français
      - value: de
        label: Deutsch
      - value: es
        label: Español
      - value: pt
        label: Português
      - value: nl
        label: Nederlands
      - value: pl
        label: Polski
      - value: sv
        label: Svenska
      - value: el
        label: Ελληνικά
      - value: cs
        label: Čeština
      - value: ro
        label: Română
      - value: hu
        label: Magyar
      - value: tr
        label: Türkçe
      - value: ja
        label: 日本語
      - value: zh
        label: 中文
      - value: ko
        label: 한국어
    - name: tone
      type: select
      required: true
      label:
        it: Tono
        en: Tone
      options:
      - value: technical
        label:
          it: Tecnico
          en: Technical
      - value: luxury
        label:
          it: Lusso
          en: Luxury
      - value: casual
        label:
          it: Colloquiale
          en: Casual
    - name: glossary
      type: textarea
      maxLength: 2000
      label:
        it: 'Glossario: termini da non tradurre'
        en: 'Glossary: terms not to translate'
    - name: max_chars
      type: number
      label:
        it: Limite di caratteri per campo
        en: Character limit per field
    - name: human_review
      type: boolean
      label:
        it: Righe dubbie al revisore umano madrelingua
        en: Send flagged rows to a native human reviewer
  data:
    collections:
    - name: translations
      ownedBy: user
      description: 'One translated cell per row: project, SKU, field, language'
      retentionDays: 365
      access:
      - role: native_reviewer
        can:
        - read
        - write
      fields:
      - name: project
        type: text
        label: Project
      - name: sku
        type: text
        label: SKU
      - name: field
        type: text
        label: Field
      - name: lang
        type: text
        label: Lang
      - name: source
        type: textarea
        label: Original
      - name: translation
        type: textarea
        label: Translation
      - name: status
        type: select
        label: Status
        options:
        - ok
        - flagged
        - reviewed
      - name: note
        type: text
        label: Note
  views:
  - key: home
    type: page
    nav: false
    title: TraduciCatalogo
    sections:
    - type: hero
      title:
        it: Il tuo catalogo in **17 lingue**, rivisto da un secondo agente.
        en: Your catalog in **17 languages**, checked by a second agent.
      text:
        it: 'Carica CSV o XLSX, scegli lingue, tono e glossario: ottieni lo stesso file con le colonne tradotte.'
        en: 'Upload CSV or XLSX, choose languages, tone and glossary: get back the same file with translated columns.'
      actions:
      - label:
          it: Inizia
          en: Start
        href: /v/new
        style: primary
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: ghost
    - type: steps
      id: how
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Carica
          en: Upload
        text:
          it: File, testo incollato o store online.
          en: File, pasted text or online store.
        badge: 📄
      - title:
          it: Traduzione e revisione
          en: Translate and review
        text:
          it: Un agente traduce, un altro controlla glossario, lunghezze e unità.
          en: One agent translates, another checks glossary, lengths and units.
        badge: 🌍
      - title:
          it: Correggi e scarica
          en: Edit and download
        text:
          it: Tabella affiancata, correzioni a mano, file finale.
          en: Side-by-side table, manual edits, final file.
        badge: ⬇️
    - type: note
      content:
        it: Crediti prepagati, scalati per parola e per lingua.
        en: Prepaid credits, charged per word and per language.
  - key: new
    type: new_run
    title:
      it: Nuovo progetto
      en: New project
    roles:
    - user
    - admin
  - key: projects
    type: history
    title:
      it: I miei progetti
      en: My projects
    source: run
    roles:
    - user
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: side_by_side
    type: table
    title:
      it: Originale / traduzione
      en: Original / translation
    source: collection:translations
    columns:
    - project
    - sku
    - field
    - lang
    - source
    - translation
    - status
    - note
    export: true
    roles:
    - user
    - admin
    - native_reviewer
  - key: edit_cell
    type: form
    title:
      it: Correggi una cella
      en: Edit a cell
    collection: translations
    fields:
    - translation
    - status
    - note
    edit: true
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Cella salvata
        en: Cell saved
      redirect: side_by_side
    nav: false
    roles:
    - user
    - admin
    - native_reviewer
  - key: regenerate
    type: chat
    title:
      it: Nuova versione di una cella
      en: Re-translate a cell
    source: agent:cell_editor
    examples:
    - it: Rifai la descrizione breve dello SKU 1001 in tedesco, più formale
      en: Redo the short description of SKU 1001 in German, more formal
    placeholder:
      it: Indica SKU, campo e lingua
      en: Give SKU, field and language
    roles:
    - user
    - admin
  - key: reviews
    type: approvals
    title:
      it: Revisioni madrelingua
      en: Native reviews
    approvals:
    - native_review
    roles:
    - native_reviewer
    - admin
  - key: account
    type: account
    title:
      it: Crediti
      en: Credits
    roles:
    - user
  approvals:
  - key: native_review
    title:
      it: Revisione umana madrelingua
      en: Native human review
    role: native_reviewer
    timeoutMinutes: 4320
    onTimeout: approve
  triggers:
  - key: review_done
    'on':
      approval: native_review
      decision: any
    notify:
      to: owner
      subject:
        it: Revisione completata
        en: Review completed
      body:
        it: Il revisore madrelingua ha concluso il controllo. Scarica il file tradotto.
        en: The native reviewer has finished. Download your translated file.
      link: side_by_side
  notifications:
    emailOnRunDone: true
  billing:
    modes:
    - credits
    signupCredits: 50
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:translator:
        estimate: 100
        metered: true
    packs:
    - key: starter
      credits: 1000
      price: 12
      label: Starter
    - key: pro
      credits: 6000
      price: 60
      label: Pro
  extensions:
  - key: store_connection
    description: Direct connection to online stores (Shopify, WooCommerce) needs per-store API keys; for now the store URL
      is read by the agent and XLSX/CSV is the supported path.
  - key: file_export
    description: The download of the original file with added translated columns is provided as a CSV export of the translations
      table; a re-assembled XLSX is not yet available.
