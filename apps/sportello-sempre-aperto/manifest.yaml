apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: sportello-sempre-aperto
  displayName: Sportello Sempre Aperto
  tagline:
    it: Il servizio clienti della tua azienda, aperto 24 ore su 24.
    en: Your company's customer service, open around the clock.
  description:
    it: Un unico agente risponde ai clienti per telefono, email e dal sito usando la tua base di conoscenza, apre i ticket
      e passa agli operatori i casi complessi con un riassunto.
    en: One agent answers your customers by phone, email and from your website using your knowledge base, opens tickets and
      hands complex cases to operators with a summary.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#12355b'
      accent: '#1f9d8a'
      background: '#f6f8fb'
      foreground: '#16212e'
    fonts:
      body: Inter
      display: Manrope
    wordmark:
    - text: 'Sportello '
      color: primary
    - text: Sempre Aperto
      color: accent
    buttonShape: rounded
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Canali
        en: Channels
      href: '#canali'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      label:
        it: Azienda
        en: Company
      assignedBy: signup
  limits:
  - action: chat
    per: user
    max: 500
    window: day
    roles:
    - user
  egress:
    hosts: []
    notes: No external APIs.
  agents:
  - key: support
    role: main
    description: 'Customer-service agent for chat and voice: answers from the company knowledge base, collects data, opens
      the ticket, escalates.'
    profile:
      inline:
        display_name: Sportello support agent
        chat_mode: true
        crews:
        - id: support
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the customer-service agent of a service company (local utility, medical centre...). You
            answer the end customer in their language, politely and briefly (voice replies: short sentences).

            Procedure for every contact: 1) understand the request (information, contract, billing, appointment, complaint,
            fault); 2) call kb_search and answer ONLY from what the knowledge base says; if it does not cover the question,
            say so and do not invent prices, hours, deadlines or contract terms; never give medical or legal advice; 3) politely
            collect the customer number (or name) and the reason for contact if missing; 4) call ticket_save once with channel,
            customer_number, customer_name, reason, status, priority, summary and transcript; 5) ESCALATE when the matter
            is complex, outside the knowledge base, involves a dispute or an emergency, the customer asks for a person, or
            the customer is angry: set status "escalated", escalated true, write in summary a handover for the operator (who,
            what, what was already said, what is needed, mood) and tell the customer that an operator will contact them. Otherwise
            set status "resolved" or "open". Never reveal other customers'' data.'
    goalTemplate: 'Conversation so far:

      {history}


      New customer message: {message}

      Reply in the customer''s language (default {lang}). Today is {date}.'
    appTools:
    - name: kb_search
      description: Search the company knowledge base (FAQ, price lists, procedures, hours, contract terms)
      action: search
      collection: knowledge
      scope: user
    - name: ticket_save
      description: Open or update a ticket for this contact
      action: write
      collection: tickets
      scope: user
    output: markdown
    limits:
      maxTurns: 10
      maxBudgetUsd: 0.4
  - key: mailer
    role: helper
    description: Reads incoming support emails, opens the ticket and prepares a draft reply the operator approves with one
      click.
    awaits:
    - email_reply
    profile:
      inline:
        display_name: Sportello email agent
        crews:
        - id: mailer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You handle the support mailbox of a service company. For each incoming email: 1) identify the request
            and the customer number if present; 2) call kb_search and base the reply ONLY on the knowledge base; never invent
            prices, deadlines or terms; 3) call ticket_save (channel "email", customer_number, customer_name, reason, priority,
            summary, transcript = the email text, status "waiting_approval"; "escalated" with escalated true and a handover
            summary if the case is complex, a complaint, or the sender is angry); 4) write a courteous reply draft in the
            sender''s language and call request_email_reply with the draft and the ticket reference so the operator can approve
            it with one click. If a piece of information is missing, the draft asks the customer for it. Sign as the company''s
            customer service team.'
    goalTemplate: 'Incoming email:

      {message}

      Today is {date}.'
    appTools:
    - name: kb_search
      description: Search the company knowledge base (FAQ, price lists, procedures, hours, contract terms)
      action: search
      collection: knowledge
      scope: user
    - name: ticket_save
      description: Open or update a ticket for this contact
      action: write
      collection: tickets
      scope: user
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.4
  channels:
  - key: web
    type: web
    agent: support
  - key: voice
    type: phone
    agent: support
    greeting:
      it: Buongiorno, sono l'assistente virtuale del servizio clienti. Come posso aiutarla?
      en: Hello, I'm the customer service virtual assistant. How can I help you?
    language: it
  - key: mailbox
    type: email
    agent: mailer
  approvals:
  - key: email_reply
    title:
      it: Bozza di risposta email
      en: Email reply draft
    description: The operator approves the drafted reply to a customer email.
    decidedBy: requester
    fields:
    - ticket
    - customer
    - draft
    timeoutMinutes: 1440
    onTimeout: reject
  data:
    collections:
    - name: knowledge
      ownedBy: user
      searchable: true
      description: 'Company knowledge base: FAQ, price lists, procedures, hours, contract terms'
      fields:
      - name: title
        type: text
        required: true
        label:
          it: Titolo
          en: Title
      - name: category
        type: select
        label:
          it: Categoria
          en: Category
        options:
        - value: faq
          label: FAQ
        - value: pricing
          label:
            it: Listino
            en: Price list
        - value: procedure
          label:
            it: Procedura
            en: Procedure
        - value: hours
          label:
            it: Orari
            en: Hours
        - value: contract
          label:
            it: Condizioni contrattuali
            en: Contract terms
      - name: content
        type: textarea
        required: true
        label:
          it: Contenuto (testo incollato)
          en: Content (pasted text)
      - name: source_url
        type: url
        label:
          it: Link alla fonte
          en: Source link
    - name: tickets
      ownedBy: user
      description: Single ticket queue with transcripts, across all channels
      fields:
      - name: channel
        type: select
        options:
        - phone
        - whatsapp
        - email
        - web
      - name: customer_number
        type: text
        label:
          it: Numero cliente
          en: Customer number
      - name: customer_name
        type: text
        label:
          it: Cliente
          en: Customer
      - name: reason
        type: text
        label:
          it: Motivo
          en: Reason
      - name: status
        type: select
        options:
        - open
        - waiting_approval
        - escalated
        - resolved
      - name: priority
        type: select
        options:
        - low
        - normal
        - high
      - name: escalated
        type: boolean
      - name: summary
        type: textarea
        label:
          it: Riassunto
          en: Summary
      - name: transcript
        type: textarea
        label:
          it: Trascrizione
          en: Transcript
      - name: minutes
        type: number
        label:
          it: Minuti
          en: Minutes
      - name: response_minutes
        type: number
        label:
          it: Tempo di risposta (min)
          en: Response time (min)
      - name: csat
        type: number
        label:
          it: Soddisfazione (1-5)
          en: Satisfaction (1-5)
  views:
  - key: home
    type: page
    nav: false
    title: Sportello Sempre Aperto
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow:
        it: Servizio clienti con agenti AI
        en: Customer service with AI agents
      title:
        it: Il tuo **sportello clienti**, sempre aperto.
        en: Your **customer desk**, always open.
      text:
        it: 'Per utility locali, centri medici e aziende di servizi: un solo agente risponde per telefono, email e dal sito
          con la tua base di conoscenza, apre i ticket e passa agli operatori i casi difficili con un riassunto.'
        en: 'For local utilities, medical centres and service companies: one agent answers by phone, email and on your website
          from your knowledge base, opens tickets and hands difficult cases to your operators with a summary.'
      actions:
      - label:
          it: Inizia
          en: Get started
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Carica la conoscenza
          en: Load your knowledge
        text:
          it: 'FAQ, listini, procedure, orari e condizioni contrattuali: l''agente risponde solo da qui.'
          en: 'FAQs, price lists, procedures, hours and contract terms: the agent answers only from here.'
      - title:
          it: L'agente risponde
          en: The agent answers
        text:
          it: Riconosce la richiesta, raccoglie numero cliente e motivo, apre il ticket.
          en: It recognises the request, collects customer number and reason, opens the ticket.
      - title:
          it: Gli operatori intervengono
          en: Operators step in
        text:
          it: Casi complessi o clienti arrabbiati passano a una persona con il riassunto; le bozze email si approvano con
            un clic.
          en: Complex cases or angry customers go to a person with a summary; email drafts are approved in one click.
    - type: cards
      id: canali
      title:
        it: Canali
        en: Channels
      items:
      - title:
          it: Telefono
          en: Phone
        badge: 📞
        text:
          it: Risponde al numero aziendale con la voce.
          en: Answers your company number by voice.
      - title: Email
        badge: ✉️
        text:
          it: Legge la casella di assistenza e prepara la bozza.
          en: Reads the support mailbox and drafts the reply.
      - title:
          it: 'Sito: voce e chat'
          en: 'Website: voice and chat'
        badge: 💬
        text:
          it: Lo stesso agente, nel tuo sito.
          en: The same agent, on your website.
    - type: note
      content:
        it: L'agente risponde solo dalla base di conoscenza e non fornisce consulenza medica o legale.
        en: The agent answers only from the knowledge base and gives no medical or legal advice.
  - key: knowledge_base
    type: table
    title:
      it: Base di conoscenza
      en: Knowledge base
    source: collection:knowledge
    roles:
    - user
    - admin
    data:
      display: table
      fields:
      - key: title
        label:
          it: Titolo
          en: Title
      - key: category
        format: badge
        label:
          it: Categoria
          en: Category
      - key: source_url
        format: link
        label: Link
      limit: 200
  - key: queue
    type: table
    title:
      it: Coda ticket
      en: Ticket queue
    source: collection:tickets
    roles:
    - user
    - admin
    data:
      display: table
      fields:
      - key: channel
        format: badge
        label:
          it: Canale
          en: Channel
      - key: customer_number
        label:
          it: N. cliente
          en: Customer no.
      - key: reason
        label:
          it: Motivo
          en: Reason
      - key: status
        format: badge
        label:
          it: Stato
          en: Status
      - key: priority
        format: badge
        label:
          it: Priorità
          en: Priority
      - key: summary
        label:
          it: Riassunto
          en: Summary
      - key: transcript
        label:
          it: Trascrizione
          en: Transcript
      sort:
        field: createdAt
        dir: desc
      limit: 100
  - key: drafts
    type: approvals
    title:
      it: Bozze da approvare
      en: Drafts to approve
    approvals:
    - email_reply
    roles:
    - user
    - admin
  - key: kpis
    type: cards
    title:
      it: Indicatori
      en: KPIs
    source: collection:tickets
    nav: false
    data:
      display: kpi
      kpis:
      - label:
          it: Ticket
          en: Tickets
        agg: count
      - label:
          it: Minuti di voce
          en: Voice minutes
        agg: sum
        field: minutes
        format: number
      - label:
          it: Tempo medio di risposta (min)
          en: Avg response time (min)
        agg: avg
        field: response_minutes
        format: number
      - label:
          it: Soddisfazione media
          en: Avg satisfaction
        agg: avg
        field: csat
        format: number
  - key: by_channel
    type: chart
    title:
      it: Ticket per canale
      en: Tickets by channel
    source: collection:tickets
    nav: false
    data:
      display: table
      fields:
      - key: channel
        label:
          it: Canale
          en: Channel
      - key: status
        label:
          it: Stato
          en: Status
      - key: response_minutes
        format: number
        label:
          it: Tempo (min)
          en: Time (min)
      - key: csat
        format: number
        label:
          it: CSAT
          en: CSAT
      limit: 200
  - key: dashboard
    type: dashboard
    title:
      it: Dashboard responsabile
      en: Manager dashboard
    children:
    - kpis
    - by_channel
    roles:
    - user
    - admin
  - key: test_chat
    type: chat
    title:
      it: Prova l'agente
      en: Try the agent
    source: agent:support
    examples:
    - Quali sono gli orari di apertura?
    - Vorrei sapere il costo del servizio
    - Sono molto arrabbiato, voglio parlare con una persona
    placeholder:
      it: Scrivi come un cliente…
      en: Write like a customer…
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento e crediti
      en: Plan and credits
    roles:
    - user
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 100
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:support:
        estimate: 10
        metered: true
      agent:mailer:
        estimate: 10
        metered: true
    packs:
    - key: minutes_small
      credits: 1000
      price: 10
      label: Starter
    - key: minutes_large
      credits: 6000
      price: 50
      label: Pro
    plans:
    - key: base
      price: 49
      interval: month
      label:
        it: Canone base
        en: Base fee
      credits: 500
      creditsReset: monthly
      includes:
      - Knowledge base
      - Ticket queue
      - Dashboard
  extensions:
  - key: whatsapp_channel
    description: 'WhatsApp is not available yet: it needs each company''s own WhatsApp Business credentials. Use phone, email
      and web for now.'
  - key: file_upload
    description: 'File upload is not available: the knowledge base is entered as pasted text or links.'
  - key: public_web_widget
    description: A public website widget for the company's end customers (anonymous, tied to one company's data) is not available
      yet; the chat view here is for testing and internal use.
  - key: operator_roles
    description: 'Separate operator and manager roles seeing the company''s tickets are not expressible yet: operators use
      the company account. Approvals are decided by the company user.'
  - key: voice_minute_billing
    description: Billing per voice minute is approximated by metered credits (tokens and compute); an explicit per-minute
      rate is not available. Notifications to the operator on escalation are not available.
