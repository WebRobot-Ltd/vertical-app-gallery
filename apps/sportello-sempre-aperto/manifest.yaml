apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: sportello-sempre-aperto
  displayName: Sportello Sempre Aperto
  tagline:
    it: Il servizio clienti che risponde sempre, su ogni canale.
    en: Customer service that always answers, on every channel.
  description:
    it: Un agente unico risponde a telefono, email e chat dal sito usando la base di conoscenza dell'azienda, apre ticket
      e passa all'operatore con un riassunto.
    en: One agent answers by phone, email and website chat from the company knowledge base, opens tickets and hands over to
      a human with a summary.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#12355b'
      accent: '#1f8a70'
      background: '#f6f8fa'
      foreground: '#17212b'
    fonts:
      body: Inter
      display: Manrope
    wordmark:
    - text: Sportello
      color: primary
    - text: Sempre Aperto
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Canali
        en: Channels
      href: '#canali'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin azienda
      assignedBy: admin_emails
    - key: operator
      label:
        it: Operatore
        en: Operator
      assignedBy: invite
    - key: manager
      label:
        it: Responsabile
        en: Manager
      assignedBy: invite
    - key: user
      label:
        it: Cliente
        en: Customer
      assignedBy: signup
  limits:
  - action: chat
    per: user
    max: 200
    window: day
    roles:
    - user
  agents:
  - key: support
    role: main
    description: 'Agente unico di assistenza: risponde dalla base di conoscenza, raccoglie i dati, apre il ticket e passa
      all''operatore.'
    memory: user
    profile:
      inline:
        display_name: Sportello agent
        chat_mode: true
        crews:
        - id: support
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''assistente del servizio clienti di un''azienda di servizi (utility, centro medico). Rispondi
            nella lingua del cliente, con tono cortese e conciso. Per ogni richiesta: 1) cerca nella base di conoscenza con
            kb_search e rispondi SOLO con ciò che trovi; se non trovi la risposta dillo e non inventare prezzi, orari, condizioni
            o consigli medici/legali. 2) Raccogli numero cliente, motivo del contatto e un recapito, chiedendo una cosa alla
            volta. 3) Apri un ticket con ticket_write: campi subject, customer_number, reason, channel (voice, whatsapp, email
            o web), transcript (trascrizione sintetica ma fedele), summary, status. Usa status ''open'' per richieste risolte
            o semplici, ''handoff'' se la questione è complessa, riguarda reclami formali, dati sensibili o urgenze, oppure
            se il cliente è arrabbiato o lo chiede: in tal caso avvisa il cliente che un operatore lo ricontatterà e scrivi
            nel summary motivo, dati raccolti e cosa è già stato detto. 4) Alla fine chiedi una valutazione da 1 a 5 e salvala
            nel ticket (csat). Non confermare mai operazioni contrattuali o pagamenti: spettano agli operatori. Nelle chiamate
            vocali usa frasi brevi.'
          mcp_servers: []
    goalTemplate: 'Conversazione finora:

      {history}


      Nuovo messaggio del cliente ({user}): {message}

      Data: {date}. Rispondi in lingua {lang} salvo diversa lingua del cliente.'
    output: markdown
    appTools:
    - name: kb_search
      description: Cerca nella base di conoscenza aziendale (FAQ, listini, procedure, orari, condizioni)
      action: search
      collection: knowledge
      scope: all
    - name: ticket_write
      description: Apre o aggiorna un ticket del cliente
      action: write
      collection: tickets
      scope: user
    - name: ticket_read
      description: Legge i ticket precedenti del cliente
      action: read
      collection: tickets
      scope: user
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.5
  - key: email_drafter
    role: helper
    description: Legge le email in arrivo, apre il ticket e prepara una bozza di risposta da approvare.
    awaits:
    - reply_approval
    profile:
      inline:
        display_name: Sportello email drafter
        crews:
        - id: email_drafter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei il redattore delle risposte email del servizio clienti. Per ogni email: cerca nella base di
            conoscenza con kb_search, apri un ticket con ticket_write (channel ''email'', subject, customer_number se presente,
            reason, transcript con il testo dell''email, summary, customer_email, draft_reply con la bozza, status ''draft'').
            Scrivi una bozza cortese, accurata, solo con informazioni della base di conoscenza; se mancano, chiedi i dati
            necessari al cliente nella bozza e segnala all''operatore cosa verificare. Poi chiama request_reply_approval con
            ticket, bozza e note per l''operatore. Se il cliente è arrabbiato o il caso è complesso, metti status ''handoff''
            e spiega nel summary. Non inventare mai prezzi, scadenze o impegni contrattuali.'
          mcp_servers: []
    goalTemplate: 'Email in arrivo da {user}:

      {message}

      Data: {date}. Lingua di risposta: stessa dell''email.'
    output: markdown
    appTools:
    - name: kb_search
      description: Cerca nella base di conoscenza aziendale (FAQ, listini, procedure, orari, condizioni)
      action: search
      collection: knowledge
      scope: all
    - name: ticket_write
      description: Apre o aggiorna un ticket del cliente
      action: write
      collection: tickets
      scope: user
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.4
  channels:
  - key: web
    type: web
    agent: support
  - key: voce
    type: phone
    agent: support
    greeting:
      it: Buongiorno, sono l'assistente virtuale del servizio clienti. Come posso aiutarla?
      en: Hello, I'm the virtual customer service assistant. How can I help?
    language: it
  - key: assistenza
    type: email
    agent: email_drafter
  approvals:
  - key: reply_approval
    title:
      it: Approva la risposta email
      en: Approve the email reply
    description: Bozza di risposta a un'email del cliente, da approvare con un clic.
    role: operator
    fields:
    - ticket
    - draft_reply
    - notes
    timeoutMinutes: 1440
    onTimeout: reject
  triggers:
  - key: handoff_alert
    description: Avvisa gli operatori quando un ticket passa a una persona
    'on':
      collection: tickets
      op: any
      where:
        status: handoff
    notify:
      to:
      - role:operator
      subject:
        it: 'Ticket da gestire: {record.subject}'
        en: 'Ticket to handle: {record.subject}'
      body:
        it: 'Un ticket richiede un operatore.

          Motivo: {record.reason}

          Riassunto: {record.summary}'
        en: 'A ticket needs a human operator.

          Reason: {record.reason}

          Summary: {record.summary}'
      link: tickets
  - key: reply_sent
    description: Invia al cliente la risposta approvata
    'on':
      approval: reply_approval
      decision: approved
    notify:
      to:
      - record.customer_email
      subject:
        it: Risposta alla tua richiesta
        en: Reply to your request
      body:
        it: '{record.draft_reply}'
        en: '{record.draft_reply}'
  inputForm:
    title:
      it: Contatto
      en: Contact
    fields:
    - name: message
      type: textarea
      label:
        it: Messaggio
        en: Message
  data:
    collections:
    - name: knowledge
      description: 'Base di conoscenza aziendale: FAQ, listini, procedure, orari, condizioni contrattuali'
      ownedBy: shared
      searchable: true
      fields:
      - name: title
        type: text
        required: true
        label:
          it: Titolo
          en: Title
      - name: category
        type: select
        required: true
        label:
          it: Categoria
          en: Category
        options:
        - value: faq
          label: FAQ
        - value: pricing
          label:
            it: Listino
            en: Price list
        - value: procedure
          label:
            it: Procedura
            en: Procedure
        - value: hours
          label:
            it: Orari
            en: Hours
        - value: terms
          label:
            it: Condizioni contrattuali
            en: Contract terms
      - name: content
        type: textarea
        label:
          it: Contenuto
          en: Content
      - name: document
        type: file
        accept:
        - pdf
        - docx
        - xlsx
        - csv
        - txt
        - md
        maxMb: 15
        label:
          it: Documento
          en: Document
    - name: tickets
      description: Ticket di assistenza con trascrizione, riassunto e valutazione; ogni cliente vede i propri, gli operatori
        la coda unica
      ownedBy: user
      retentionDays: 730
      fields:
      - name: subject
        type: text
        required: true
        label:
          it: Oggetto
          en: Subject
      - name: customer_number
        type: text
        label:
          it: Numero cliente
          en: Customer number
      - name: customer_email
        type: email
        label: Email
      - name: reason
        type: text
        label:
          it: Motivo
          en: Reason
      - name: channel
        type: select
        label:
          it: Canale
          en: Channel
        options:
        - voice
        - whatsapp
        - email
        - web
      - name: status
        type: select
        label:
          it: Stato
          en: Status
        default: open
        options:
        - draft
        - open
        - handoff
        - in_progress
        - resolved
      - name: summary
        type: textarea
        label:
          it: Riassunto
          en: Summary
      - name: transcript
        type: textarea
        label:
          it: Trascrizione
          en: Transcript
      - name: draft_reply
        type: textarea
        label:
          it: Bozza di risposta
          en: Draft reply
      - name: handled_by
        type: email
        label:
          it: Operatore
          en: Operator
      - name: voice_minutes
        type: number
        label:
          it: Minuti di voce
          en: Voice minutes
      - name: first_response_min
        type: number
        label:
          it: Minuti alla prima risposta
          en: Minutes to first response
      - name: csat
        type: number
        label:
          it: Soddisfazione (1-5)
          en: Satisfaction (1-5)
      - name: date
        type: date
        label: Data
      access:
      - role: operator
        can:
        - read
        - write
      - role: manager
  views:
  - key: home
    type: page
    title: Sportello Sempre Aperto
    nav: false
    sections:
    - type: hero
      title:
        it: Un servizio clienti **sempre aperto**, su ogni canale.
        en: Customer service that is **always open**, on every channel.
      text:
        it: Un solo agente risponde a telefono, email e chat dal sito con la tua base di conoscenza, apre il ticket e passa
          all'operatore quando serve.
        en: One agent answers by phone, email and website chat from your knowledge base, opens the ticket and hands over to
          a human when needed.
      actions:
      - label:
          it: Contattaci
          en: Contact us
        href: /v/assistant
        style: primary
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Carica la conoscenza
          en: Load knowledge
        text:
          it: FAQ, listini, procedure, orari e condizioni contrattuali.
          en: FAQs, price lists, procedures, hours and contract terms.
        badge: 📚
      - title:
          it: L'agente risponde
          en: The agent answers
        text:
          it: Riconosce la richiesta, raccoglie numero cliente e motivo, apre il ticket.
          en: Understands the request, collects customer number and reason, opens the ticket.
        badge: 🤖
      - title:
          it: L'operatore chiude
          en: The operator closes
        text:
          it: Casi complessi o clienti arrabbiati passano a una persona con un riassunto.
          en: Complex cases or angry customers go to a person with a summary.
        badge: 🧑‍💼
    - type: cards
      id: canali
      title:
        it: Canali
        en: Channels
      items:
      - title:
          it: Telefono
          en: Phone
        text:
          it: Chiamata al numero aziendale.
          en: Call the company number.
        badge: 📞
      - title: Email
        text:
          it: Bozza di risposta approvabile con un clic.
          en: Draft reply approved with one click.
        badge: ✉️
      - title:
          it: Sito
          en: Website
        text:
          it: Chat e voce dal sito.
          en: Chat and voice from the website.
        badge: 💬
    - type: note
      content:
        it: Il canale WhatsApp non è ancora disponibile. L'assistente non sostituisce consulenza medica o legale.
        en: The WhatsApp channel is not available yet. The assistant does not replace medical or legal advice.
  - key: assistant
    type: chat
    title:
      it: Assistenza
      en: Support
    source: agent:support
    placeholder:
      it: Scrivi la tua richiesta…
      en: Write your request…
    examples:
    - it: Quali sono gli orari di apertura?
      en: What are your opening hours?
    - it: Vorrei contestare l'ultima fattura
      en: I'd like to dispute my last invoice
    roles:
    - user
    - admin
    - operator
    - manager
  - key: my_tickets
    type: table
    title:
      it: I miei ticket
      en: My tickets
    source: collection:tickets
    columns:
    - date
    - subject
    - channel
    - status
    roles:
    - user
  - key: knowledge_new
    type: form
    title:
      it: Aggiungi conoscenza
      en: Add knowledge
    collection: knowledge
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Salvato nella base di conoscenza.
        en: Saved to the knowledge base.
      redirect: knowledge
    edit: true
    roles:
    - admin
  - key: knowledge
    type: table
    title:
      it: Base di conoscenza
      en: Knowledge base
    source: collection:knowledge
    columns:
    - title
    - category
    roles:
    - admin
  - key: tickets
    type: table
    title:
      it: Coda ticket
      en: Ticket queue
    source: collection:tickets
    columns:
    - date
    - subject
    - customer_number
    - channel
    - status
    - handled_by
    - csat
    export: true
    roles:
    - operator
    - manager
    - admin
  - key: ticket_edit
    type: form
    title:
      it: Gestisci ticket
      en: Handle ticket
    collection: tickets
    fields:
    - status
    - handled_by
    - summary
    - transcript
    - draft_reply
    edit: true
    submit:
      label:
        it: Aggiorna
        en: Update
      redirect: tickets
    roles:
    - operator
    - admin
    nav: false
  - key: approvals
    type: approvals
    title:
      it: Bozze email da approvare
      en: Email drafts to approve
    approvals:
    - reply_approval
    roles:
    - operator
    - admin
  - key: dashboard
    type: page
    title: Dashboard
    roles:
    - manager
    - admin
    sections:
    - type: data
      title:
        it: Panoramica
        en: Overview
      source: collection:tickets
      display: kpi
      kpis:
      - label:
          it: Ticket totali
          en: Total tickets
        agg: count
      - label:
          it: Soddisfazione media
          en: Avg satisfaction
        agg: avg
        field: csat
        format: number
      - label:
          it: Minuti alla prima risposta
          en: Minutes to first response
        agg: avg
        field: first_response_min
        format: number
      - label:
          it: Minuti di voce
          en: Voice minutes
        agg: sum
        field: voice_minutes
        format: number
    - type: data
      title:
        it: Volumi per giorno
        en: Volume per day
      source: collection:tickets
      display: chart
      chart: bar
      fields:
      - key: date
      - key: count
      groupBy:
        field: date
        bucket: day
        aggs:
        - key: csat_avg
          agg: avg
          field: csat
    - type: data
      title:
        it: Per canale
        en: By channel
      source: collection:tickets
      display: chart
      chart: pie
      fields:
      - key: channel
      - key: count
      groupBy:
        field: channel
        aggs:
        - key: minutes
          agg: avg
          field: first_response_min
  - key: account
    type: account
    title:
      it: Abbonamento e consumi
      en: Plan and usage
    roles:
    - admin
    - manager
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 50
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:support:
        estimate: 10
        metered: true
      agent:email_drafter:
        estimate: 8
        metered: true
    packs:
    - key: minuti_500
      credits: 500
      price: 5
      label:
        it: 500 crediti (voce e conversazioni)
        en: 500 credits (voice and conversations)
    - key: minuti_3000
      credits: 3000
      price: 25
      label:
        it: 3000 crediti
        en: 3000 credits
    plans:
    - key: canone
      price: 99
      interval: month
      label:
        it: Canone base mensile
        en: Monthly base fee
      credits: 1000
      creditsReset: monthly
      roles:
      - admin
      includes:
      - Tutti i canali
      - Dashboard
      - Operatori illimitati
  notifications:
    emailOnRunDone: false
  extensions:
  - key: whatsapp_channel
    description: 'Canale WhatsApp per i messaggi dei clienti: non ancora disponibile (SMS/WhatsApp/push). Per ora telefono,
      email e chat dal sito.'
  - key: voice_minutes_metering
    description: 'Fatturazione a minuti di voce: oggi il consumo è misurato in crediti (token e calcolo); il conteggio dei
      minuti di chiamata va registrato nel campo voice_minutes del ticket.'
  - key: multi_company
    description: Ogni azienda corrisponde a una propria istanza dell'app, così vede solo i propri clienti e ticket.
