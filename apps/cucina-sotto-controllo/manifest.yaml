apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: cucina-sotto-controllo
  displayName: Cucina sotto Controllo
  tagline: Food cost, scorte e ordini sotto controllo, ogni giorno, per ogni locale.
  description: 'Gestionale con agenti per ristoranti: ricette, fornitori e magazzino, vendite dalla cassa o inserite a fine
    servizio, food cost reale contro teorico, ordini ai fornitori approvati dal titolare e report settimanale con margini
    e previsione coperti.'
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#2b2118'
      accent: '#c2410c'
      background: '#faf6f0'
      foreground: '#1f1a16'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: 'Cucina sotto '
      color: primary
    - text: Controllo
      color: accent
  header:
    links:
    - label: Come funziona
      href: '#come-funziona'
    - label: Chi vede cosa
      href: '#ruoli'
    cta:
      label: Accedi
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Amministratore
      assignedBy: admin_emails
    - key: user
      label: Titolare
      assignedBy: signup
    - key: chef
      label: Chef
      assignedBy: derived
      from: collection:locali.chef_email
    - key: sala
      label: Sala
      assignedBy: derived
      from: collection:locali.sala_email
  limits:
  - action: create:locali
    max: 1
    window: total
    plans:
      locale: 1
      gruppo: 5
  - action: run
    per: user
    max: 20
    window: day
    roles:
    - user
  agents:
  - key: controllore
    role: scheduled
    description: 'Ogni giorno, per un locale: food cost reale vs teorico, scarico scorte, sprechi, differenze inventariali,
      ordini sotto soglia.'
    awaits:
    - ordine_fornitore
    appTools:
    - name: leggi_ricette
      description: Legge le ricette (ingredienti e grammature) del titolare
      action: read
      collection: ricette
      scope: user
    - name: leggi_vendite
      description: Legge le vendite giornaliere (coperti e piatti venduti)
      action: read
      collection: vendite
      scope: user
    - name: leggi_giacenze
      description: Legge le giacenze di magazzino con soglie e prezzi
      action: read
      collection: giacenze
      scope: user
    - name: leggi_fornitori
      description: Legge i fornitori con listini
      action: read
      collection: fornitori
      scope: user
    - name: aggiorna_giacenze
      description: Aggiorna la quantità in giacenza di un ingrediente
      action: write
      collection: giacenze
      scope: user
    - name: registra_segnalazione
      description: Registra una segnalazione (spreco, differenza inventariale, sotto soglia)
      action: append
      collection: segnalazioni
      scope: user
    profile:
      inline:
        display_name: Controllore di cucina
        crews:
        - id: controllore
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei il controllore di gestione di un ristorante. Lavori su UN locale (campo locale) e sul giorno
            di servizio precedente. Usa solo i dati letti con gli strumenti: non inventare mai quantità, prezzi o vendite.
            Passi: 1) leggi con leggi_vendite le vendite del locale di ieri; se mancano, dillo chiaramente e fermati sul calcolo,
            controllando comunque le soglie. 2) leggi ricette, giacenze e fornitori del locale. 3) Per ogni piatto venduto
            calcola il food cost teorico (grammature x prezzo unitario dell''ingrediente, listino del fornitore o ultimo prezzo
            di giacenza) e il consumo teorico per ingrediente. 4) Calcola il food cost reale usando il consumo effettivo (scarico
            dalle giacenze incluse eventuali conteggi di magazzino e prezzi realmente pagati) e confrontalo col teorico: indica
            scostamento in euro e in punti percentuali per piatto. 5) Scala le scorte con aggiorna_giacenze secondo il consumo
            teorico; se esiste un conteggio recente (ultimo_conteggio), la differenza tra atteso e contato è una differenza
            inventariale: registrala con registra_segnalazione (tipo differenza). Uno scostamento di consumo non spiegato
            dalle vendite è un possibile spreco (tipo spreco). 6) Per ogni ingrediente sotto soglia raggruppa per fornitore
            e chiedi UNA approvazione per fornitore con lo strumento request_ordine_fornitore, indicando locale, fornitore,
            testo dell''ordine (righe con quantità e unità, scegliendo quantità fino al livello di riordino) e totale stimato
            dal listino; non inviare mai nulla direttamente. Registra anche la segnalazione sotto_soglia. Rapporto finale
            in italiano, inizia con un titolo di primo livello ''# Controllo <locale> — <data>'' e le sezioni ## Food cost
            per piatto (tabella teorico, reale, scostamento), ## Scorte scalate, ## Sprechi e differenze, ## Ordini proposti.
            Concludi con un blocco ```chart di tipo bar con food cost teorico e reale per piatto (solo cifre reali). Niente
            consulenza legale o fiscale.'
  - key: ordinante
    role: helper
    description: Dopo l'approvazione del titolare crea il record dell'ordine, che parte via email al fornitore.
    appTools:
    - name: crea_ordine
      description: Crea il record dell'ordine al fornitore
      action: append
      collection: ordini
      scope: user
    - name: leggi_fornitori_ordine
      description: Legge i fornitori per trovare l'indirizzo email
      action: read
      collection: fornitori
      scope: user
    profile:
      inline:
        display_name: Addetto agli ordini
        crews:
        - id: ordinante
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Ricevi un ordine al fornitore già approvato dal titolare. Cerca il fornitore con leggi_fornitori_ordine
            per ottenere la sua email, poi chiama UNA volta crea_ordine con i campi: locale, fornitore, email_fornitore, testo
            (messaggio cortese e chiaro in italiano con elenco righe, quantità, unità e richiesta di conferma consegna; firmato
            dal locale), totale, data odierna, status ''approvato''. Non modificare quantità né prezzi approvati. Se l''email
            del fornitore manca, crea l''ordine con status ''proposto'' e spiega il problema nel messaggio finale. Rispondi
            con ''# Ordine <fornitore>'' e due righe di riepilogo.'
  - key: analista
    role: analyst
    description: 'Ogni lunedì: margine per piatto, piatti da rivedere nel prezzo, previsione coperti, quantità da ordinare,
      consolidato di gruppo.'
    appTools:
    - name: leggi_ricette
      description: Legge le ricette (ingredienti e grammature) del titolare
      action: read
      collection: ricette
      scope: user
    - name: leggi_vendite
      description: Legge le vendite giornaliere (coperti e piatti venduti)
      action: read
      collection: vendite
      scope: user
    - name: leggi_giacenze
      description: Legge le giacenze di magazzino con soglie e prezzi
      action: read
      collection: giacenze
      scope: user
    - name: leggi_fornitori
      description: Legge i fornitori con listini
      action: read
      collection: fornitori
      scope: user
    - name: leggi_segnalazioni
      description: Legge sprechi e differenze inventariali segnalati
      action: read
      collection: segnalazioni
      scope: user
    profile:
      inline:
        display_name: Analista settimanale
        crews:
        - id: analista
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''analista di gestione di un gruppo di ristoranti. Leggi con gli strumenti ricette, vendite
            (almeno le ultime 8 settimane disponibili), giacenze, fornitori e segnalazioni di TUTTI i locali del titolare
            (campo locale). Non inventare cifre: se i dati sono pochi, dillo e indica l''affidabilità. Scrivi in italiano
            un report che inizia con ''# Report settimanale — settimana del <data>'' e contiene: ## Sintesi di gruppo (consolidato:
            ricavi stimati, coperti, food cost medio, margine per locale), poi per ogni locale ## <Locale> con: margine per
            piatto (tabella prezzo, food cost, margine in € e %), piatti da rivedere nel prezzo (margine sotto soglia o food
            cost reale in deriva, con prezzo suggerito motivato), previsione dei coperti della settimana giorno per giorno
            (basata su stagionalità per giorno della settimana e trend, con intervallo e metodo dichiarato), quantità da ordinare
            per fornitore (consumo previsto meno giacenza, più scorta di sicurezza), sprechi e differenze inventariali della
            settimana. Aggiungi un blocco ```chart di tipo bar per i margini per locale e uno per la previsione coperti, con
            cifre reali. Nessuna consulenza fiscale o finanziaria come fatto.'
  templates:
  - key: controllo_locale
    title: Controllo giornaliero del locale
    description: Ogni giorno calcola food cost reale vs teorico, scala le scorte e prepara gli ordini sotto soglia per un
      locale.
    agent: controllore
    params:
    - name: locale
      type: text
      required: true
      label: Nome del locale
    goal: Controllo del locale "{locale}" ({instance}) per il giorno di servizio precedente a {date}. Scrivi il rapporto in
      italiano.
    schedule:
      cron: 0 5 * * *
      userCanChange: true
    maxPerUser: 10
    roles:
    - user
    - admin
  - key: report_settimanale
    title: Report settimanale di gruppo
    description: Ogni lunedì il report con margini, prezzi da rivedere, previsione coperti e ordini, con consolidato di gruppo.
    agent: analista
    params:
    - name: note
      type: textarea
      maxLength: 400
      label: Note o priorità (facoltative)
    goal: Produci il report settimanale di tutti i locali del gruppo ({instance}). Oggi è {date}. {note}
    schedule:
      cron: 0 5 * * 1
      userCanChange: true
    maxPerUser: 1
    roles:
    - user
    - admin
    deliver:
      to: owner
      onlyIfNew: true
  approvals:
  - key: ordine_fornitore
    title: Ordine al fornitore
    description: Il titolare approva l'ordine prima dell'invio via email al fornitore.
    decidedBy: requester
    fields:
    - locale
    - fornitore
    - testo
    - totale
    timeoutMinutes: 4320
    onTimeout: reject
  triggers:
  - key: pos_vendite
    description: Vendite giornaliere inviate dalla cassa o dal POS
    'on':
      webhook: true
    write:
      collection: vendite
      fields:
        locale: locale
        data: date
        coperti: covers
        piatti: items
        fonte: source
  - key: ordine_approvato
    'on':
      approval: ordine_fornitore
      decision: approved
    start:
      agent: ordinante
    goal: 'Il titolare ha approvato questo ordine al fornitore: {event}. Crea il record dell''ordine con status approvato.'
  - key: ordine_email
    'on':
      collection: ordini
      op: insert
      where:
        status: approvato
    notify:
      to:
      - record.email_fornitore
      - owner
      subject: Ordine da {record.locale}
      body: '{record.testo}


        Totale stimato: {record.totale}'
      link: ordini
  inputForm:
    title: Nuova analisi
    fields: []
  data:
    collections:
    - name: locali
      description: I locali del gruppo e il personale invitato
      ownedBy: user
      fields:
      - name: nome
        type: text
        required: true
        label: Nome del locale
      - name: citta
        type: city
        label: Città
      - name: chef_email
        type: email
        label: Email dello chef
      - name: sala_email
        type: email
        label: Email del personale di sala
    - name: ricette
      description: Ricette con ingredienti e grammature
      ownedBy: user
      fields:
      - name: locale
        type: select
        required: true
        optionsFrom: collection:locali
        label: Locale
      - name: nome
        type: text
        required: true
        label: Piatto
      - name: categoria
        type: select
        label: Categoria
        options:
        - antipasto
        - primo
        - secondo
        - contorno
        - dolce
        - bevanda
      - name: prezzo_vendita
        type: number
        required: true
        label: Prezzo di vendita (€)
      - name: ingredienti
        type: array
        required: true
        label: Ingredienti
        fields:
        - name: ingrediente
          type: text
          required: true
          label: Ingrediente
        - name: grammi
          type: number
          required: true
          label: Grammi (o ml) a porzione
        - name: scarto_pct
          type: number
          label: Scarto %
      - name: members
        type: array
        label: Email del personale con accesso
      access:
      - role: chef
        where:
          members: '{user.email}'
        can:
        - read
        - write
      - role: user
        where:
          members: '{user.email}'
        can:
        - read
        - write
    - name: fornitori
      description: Fornitori con listini
      ownedBy: user
      fields:
      - name: locale
        type: select
        optionsFrom: collection:locali
        label: Locale
      - name: nome
        type: text
        required: true
        label: Fornitore
      - name: email
        type: email
        required: true
        label: Email ordini
      - name: giorni_consegna
        type: text
        label: Giorni di consegna
      - name: listino
        type: array
        label: Listino
        fields:
        - name: ingrediente
          type: text
          required: true
          label: Ingrediente
        - name: unita
          type: select
          label: Unità
          options:
          - kg
          - l
          - pz
        - name: prezzo
          type: number
          required: true
          label: Prezzo (€)
    - name: giacenze
      description: 'Magazzino: giacenze, soglie e conteggi'
      ownedBy: user
      fields:
      - name: locale
        type: select
        required: true
        optionsFrom: collection:locali
        label: Locale
      - name: ingrediente
        type: text
        required: true
        label: Ingrediente
      - name: unita
        type: select
        label: Unità
        options:
        - kg
        - l
        - pz
      - name: quantita
        type: number
        required: true
        label: Giacenza
      - name: soglia
        type: number
        label: Soglia di riordino
      - name: fornitore
        type: text
        label: Fornitore abituale
      - name: prezzo_unitario
        type: number
        label: Ultimo prezzo unitario (€)
      - name: ultimo_conteggio
        type: number
        label: Ultimo conteggio fisico
      - name: data_conteggio
        type: date
        label: Data conteggio
      - name: members
        type: array
        label: Email del personale con accesso
      access:
      - role: chef
        where:
          members: '{user.email}'
        can:
        - read
        - write
      - role: user
        where:
          members: '{user.email}'
        can:
        - read
        - write
    - name: vendite
      description: Vendite giornaliere dalla cassa/POS o inserite dal personale
      ownedBy: user
      retentionDays: 1095
      fields:
      - name: locale
        type: select
        required: true
        optionsFrom: collection:locali
        label: Locale
      - name: data
        type: date
        required: true
        label: Data del servizio
      - name: coperti
        type: number
        required: true
        label: Coperti
      - name: piatti
        type: array
        required: true
        label: Piatti venduti
        fields:
        - name: piatto
          type: text
          required: true
          label: Piatto
        - name: quantita
          type: number
          required: true
          label: Quantità
      - name: fonte
        type: select
        label: Fonte
        options:
        - value: pos
          label: Cassa/POS
        - value: manuale
          label: Inserimento manuale
        default: manuale
      - name: members
        type: array
        label: Email del titolare e dello chef
      access:
      - role: sala
        where:
          members: '{user.email}'
        can:
        - read
        - write
      - role: chef
        where:
          members: '{user.email}'
        can:
        - read
      - role: user
        where:
          members: '{user.email}'
        can:
        - read
        - write
    - name: segnalazioni
      description: Sprechi, differenze inventariali, sotto soglia
      ownedBy: user
      retentionDays: 365
      fields:
      - name: locale
        type: text
        label: Locale
      - name: data
        type: date
        label: Data
      - name: tipo
        type: select
        label: Tipo
        options:
        - spreco
        - differenza
        - sotto_soglia
      - name: ingrediente
        type: text
        label: Ingrediente
      - name: descrizione
        type: textarea
        label: Dettaglio
      - name: members
        type: array
        label: Email con accesso
      access:
      - role: chef
        where:
          members: '{user.email}'
        can:
        - read
    - name: ordini
      description: Ordini ai fornitori approvati e inviati
      ownedBy: user
      fields:
      - name: locale
        type: text
        label: Locale
      - name: fornitore
        type: text
        label: Fornitore
      - name: email_fornitore
        type: email
        label: Email fornitore
      - name: testo
        type: textarea
        label: Messaggio dell'ordine
      - name: totale
        type: number
        label: Totale stimato (€)
      - name: data
        type: date
        label: Data
      - name: status
        type: select
        label: Stato
        options:
        - proposto
        - approvato
    - name: controlli_giornalieri
      description: Rapporti giornalieri di controllo, per istanza
      ownedBy: instance
    - name: report_settimane
      description: Report settimanali di gruppo, per istanza
      ownedBy: instance
  views:
  - key: home
    type: page
    title: Cucina sotto Controllo
    nav: false
    sections:
    - type: hero
      title: Il **food cost** reale di ogni piatto, ogni giorno.
      text: 'Ricette, fornitori e magazzino in un posto solo. Gli agenti controllano vendite e scorte, segnalano sprechi e
        preparano gli ordini: tu approvi con un clic.'
      actions:
      - label: Accedi
        href: /login
        style: primary
      - label: Come funziona
        href: '#come-funziona'
        style: ghost
      band: true
    - type: steps
      id: come-funziona
      title: Come funziona
      items:
      - title: Inserisci i dati
        text: Ricette con grammature, fornitori con listini, giacenze e soglie.
      - title: Le vendite arrivano
        text: Dalla cassa o dal POS in automatico; oppure la sala inserisce coperti e piatti a fine servizio.
      - title: L'agente controlla
        text: Food cost reale contro teorico, scorte scalate, sprechi e differenze inventariali. Sotto soglia prepara l'ordine.
      - title: Approvi e invii
        text: Il titolare approva l'ordine e parte l'email al fornitore. Ogni lunedì il report con margini e previsione coperti.
    - type: cards
      id: ruoli
      title: Chi vede cosa
      items:
      - title: Titolare
        text: Tutto, margini e report consolidato di gruppo inclusi.
      - title: Chef
        text: Ricette e scorte, senza i margini.
      - title: Sala
        text: Solo l'inserimento delle vendite di fine servizio.
      - title: Più locali
        text: Dati separati per locale, un report consolidato per il gruppo. Abbonamento mensile per locale.
    - type: note
      content: 'Cucina sotto Controllo è un supporto alla gestione: verifica sempre i dati prima di decisioni su prezzi e
        acquisti.'
  - key: vendite_form
    type: form
    title: Inserisci vendite
    collection: vendite
    fields:
    - locale
    - data
    - coperti
    - piatti
    - members
    submit:
      label: Salva vendite
      message: Vendite registrate.
    edit: false
    roles:
    - sala
    - user
    - admin
  - key: vendite_storico
    type: table
    title: Vendite
    source: collection:vendite
    columns:
    - data
    - locale
    - coperti
    - fonte
    export: true
    roles:
    - user
    - admin
    - chef
  - key: ricette_form
    type: form
    title: Nuova ricetta
    collection: ricette
    submit:
      label: Salva ricetta
      message: Ricetta salvata.
      redirect: ricette
    edit: true
    roles:
    - chef
    - user
    - admin
    nav: false
  - key: ricette
    type: table
    title: Ricette
    source: collection:ricette
    columns:
    - nome
    - locale
    - categoria
    - prezzo_vendita
    roles:
    - chef
    - user
    - admin
  - key: fornitori_form
    type: form
    title: Nuovo fornitore
    collection: fornitori
    submit:
      label: Salva fornitore
      message: Fornitore salvato.
      redirect: fornitori
    edit: true
    roles:
    - user
    - admin
    nav: false
  - key: fornitori
    type: table
    title: Fornitori e listini
    source: collection:fornitori
    columns:
    - nome
    - locale
    - email
    - giorni_consegna
    roles:
    - user
    - admin
  - key: giacenze_form
    type: form
    title: Giacenza
    collection: giacenze
    submit:
      label: Salva giacenza
      message: Giacenza salvata.
      redirect: giacenze
    edit: true
    roles:
    - chef
    - user
    - admin
    nav: false
  - key: giacenze
    type: table
    title: Magazzino
    source: collection:giacenze
    columns:
    - ingrediente
    - locale
    - quantita
    - unita
    - soglia
    - fornitore
    export: true
    roles:
    - chef
    - user
    - admin
  - key: locali_form
    type: form
    title: Nuovo locale
    collection: locali
    submit:
      label: Salva locale
      message: Locale salvato.
    edit: true
    roles:
    - user
    - admin
  - key: segnalazioni
    type: table
    title: Sprechi e differenze
    source: collection:segnalazioni
    columns:
    - data
    - locale
    - tipo
    - ingrediente
    - descrizione
    roles:
    - chef
    - user
    - admin
  - key: approvazioni
    type: approvals
    title: Ordini da approvare
    approvals:
    - ordine_fornitore
    roles:
    - user
    - admin
  - key: ordini
    type: table
    title: Ordini inviati
    source: collection:ordini
    columns:
    - data
    - locale
    - fornitore
    - totale
    - status
    export: true
