apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: selezionechat
  displayName: SelezioneChat
  tagline:
    it: Selezione del personale in chat, dal link al colloquio fissato.
    en: Chat-based candidate screening, from link to booked interview.
    ro: Selecție de personal prin chat, de la link la interviu programat.
    es: Selección de personal por chat, del enlace a la entrevista fijada.
  description:
    it: Il recruiter crea una posizione; i candidati arrivano da un link o QR, parlano con un agente che fa lo screening,
      valuta l'aderenza, raccoglie il CV e fissa il colloquio.
    en: The recruiter creates a position; candidates arrive from a link or QR, talk to an agent that screens them, scores
      the fit, collects the CV and books the interview.
  langs:
  - it
  - en
  - ro
  - es
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#0f3d3e'
      accent: '#25a06b'
      background: '#f6faf8'
      foreground: '#14211f'
    fonts:
      body: Inter
      display: Manrope
    wordmark:
    - text: Selezione
      color: primary
    - text: Chat
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
        ro: Cum funcționează
        es: Cómo funciona
      href: '#come-funziona'
    cta:
      label:
        it: Accedi
        en: Sign in
        ro: Autentificare
        es: Entrar
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
    - key: recruiter
      label:
        it: Recruiter
        en: Recruiter
        ro: Recruiter
        es: Reclutador
      assignedBy: derived
      from: collection:positions.recruiter_email
  limits:
  - action: create:positions
    max: 1
    window: total
    plans:
      start: 5
      growth: 25
      scale: -1
  - action: chat
    per: user
    max: 300
    window: day
  agents:
  - key: screener
    role: main
    description: Presents the open position, asks the screening questions, collects availability, scores the fit and guides
      the candidate to the CV upload and the interview booking.
    context:
    - key: email
      from: user.email
    goalTemplate: 'Candidate email: {email}

      Page: {page}

      Conversation so far:

      {history}

      New message from the candidate:

      {message}

      Today is {date}. Reply in the candidate''s language (default ISO code {lang}).'
    appTools:
    - name: search_positions
      description: List the open positions (title, location, requirements, shifts, salary, screening questions, threshold,
        recruiter_email)
      action: search
      collection: positions
      scope: all
    - name: read_candidate
      description: Read the candidate's own application records
      action: read
      collection: candidates
      scope: user
    - name: update_candidate
      description: Create or update the candidate's application record (answers, availability, score, status)
      action: write
      collection: candidates
      scope: user
    profile:
      inline:
        display_name: SelezioneChat screener
        crews:
        - id: screener
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are a friendly, concise recruiting assistant talking to a job candidate in chat. Always answer
            in the candidate''s language (Italian, English, Romanian or Spanish). Steps: 1) call search_positions and identify
            the position the candidate applies for (ask if unclear); 2) present the offer briefly: role, location, shifts,
            salary; 3) ask the screening questions one or two at a time, then availability (days, shifts, start date); 4)
            after each useful answer call update_candidate with position_id, position_title, recruiter_email (copied from
            the position), name, email, phone, answers, availability, language, status screening; 5) when done, compute a
            fit score 0-100 against the position''s requirements only (never on age, gender, origin, health or other protected
            traits) and save score and status: qualified if score >= the position threshold, otherwise rejected. 6) If qualified:
            tell the candidate to send their CV (photo or document) on the page /v/send_cv and then choose an interview slot
            on /v/book. If rejected: thank them kindly and say that a courtesy message follows. Never promise a job, never
            invent details of the offer, and do not ask for sensitive personal data. Keep replies under 90 words.'
  - key: cv_reader
    role: helper
    description: Reads an uploaded CV (photo or document) and adds a summary to the candidate's record.
    appTools:
    - name: read_upload
      description: Read a file the user uploaded
      action: read_file
    - name: read_candidate
      description: Read the candidate's own application records
      action: read
      collection: candidates
      scope: user
    - name: update_candidate
      description: Create or update the candidate's application record (answers, availability, score, status)
      action: write
      collection: candidates
      scope: user
    profile:
      inline:
        display_name: SelezioneChat CV reader
        crews:
        - id: cv_reader
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You read a candidate's CV with the read_upload tool (call it with the file id; it reads images and
            OCR). Write a factual summary of at most 120 words limited to work experience, skills, languages and certifications
            relevant to the job. Ignore and do not record age, photo, gender, nationality, marital status or health. Then
            call read_candidate and update_candidate to store the summary in cv_summary of the candidate's latest record.
            Never invent information. Start your final answer with a level-1 title '# CV summary'.
  views:
  - key: home
    type: page
    nav: false
    title: SelezioneChat
    sections:
    - type: hero
      eyebrow:
        it: Per chi assume molto
        en: For high-volume hiring
        ro: Pentru angajări în volum mare
        es: Para contratación masiva
      title:
        it: Dal link al **colloquio fissato**, in chat.
        en: From link to **booked interview**, in chat.
        ro: De la link la **interviu programat**, în chat.
        es: Del enlace a la **entrevista fijada**, por chat.
      text:
        it: Crea una posizione, condividi link o QR. Un agente presenta l'offerta, fa lo screening, valuta l'aderenza e fissa
          il colloquio.
        en: Create a position and share a link or QR. An agent presents the offer, screens, scores the fit and books the interview.
        ro: Creează o poziție și distribuie linkul sau codul QR. Un agent prezintă oferta, face screeningul, evaluează potrivirea
          și programează interviul.
        es: Crea una posición y comparte enlace o QR. Un agente presenta la oferta, filtra, puntúa el encaje y fija la entrevista.
      actions:
      - label:
          it: Inizia
          en: Start
          ro: Începe
          es: Empezar
        href: /login
        style: primary
      band: true
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
        ro: Cum funcționează
        es: Cómo funciona
      items:
      - title:
          it: Crea la posizione
          en: Create the position
          ro: Creează poziția
          es: Crea la posición
        text:
          it: Requisiti, sede, turni, stipendio, domande e soglia.
          en: Requirements, site, shifts, salary, questions and threshold.
          ro: Cerințe, locație, ture, salariu, întrebări și prag.
          es: Requisitos, sede, turnos, salario, preguntas y umbral.
        badge: 📝
      - title:
          it: Il candidato chatta
          en: Candidates chat
          ro: Candidatul discută
          es: El candidato chatea
        text:
          it: Screening, disponibilità e CV come foto o documento.
          en: Screening, availability and CV as photo or document.
          ro: Screening, disponibilitate și CV ca fotografie sau document.
          es: Cribado, disponibilidad y CV como foto o documento.
        badge: 💬
      - title:
          it: Pipeline e colloquio
          en: Pipeline and interview
          ro: Pipeline și interviu
          es: Pipeline y entrevista
        text:
          it: Punteggio, stato, slot del responsabile e promemoria il giorno prima.
          en: Score, status, manager slots and a reminder the day before.
          ro: Scor, stare, intervale libere ale managerului și memento cu o zi înainte.
          es: Puntuación, estado, huecos del responsable y recordatorio el día antes.
        badge: 📅
    - type: note
      content:
        it: 'I dati dei candidati sono visibili solo all''azienda titolare e cancellati dopo 12 mesi. Il punteggio è un supporto:
          la decisione resta al recruiter.'
        en: 'Candidate data is visible only to the hiring company and deleted after 12 months. The score is decision support:
          the recruiter decides.'
  - key: chat
    type: chat
    source: agent:screener
    title:
      it: Candidati
      en: Apply
      ro: Aplică
      es: Candidatura
    placeholder:
      it: Scrivi qui…
      en: Write here…
      ro: Scrie aici…
      es: Escribe aquí…
    examples:
    - it: Mi interessa il posto aperto
      en: I'm interested in the open job
      ro: Mă interesează postul deschis
      es: Me interesa el puesto abierto
    roles:
    - user
    - admin
  - key: send_cv
    type: form
    collection: cv_files
    title:
      it: Invia il CV
      en: Send your CV
      ro: Trimite CV-ul
      es: Envía tu CV
    submit:
      label:
        it: Invia
        en: Send
        ro: Trimite
        es: Enviar
      message:
        it: CV ricevuto! Torna alla chat o scegli lo slot del colloquio.
        en: CV received! Go back to the chat or pick your interview slot.
        ro: CV primit! Revino în chat sau alege intervalul interviului.
        es: ¡CV recibido! Vuelve al chat o elige tu hueco de entrevista.
      redirect: book
    roles:
    - user
    - admin
  - key: book
    type: booking
    collection: interviews
    resources: collection:managers
    fields:
    - notes
    title:
      it: Fissa il colloquio
      en: Book the interview
      ro: Programează interviul
      es: Reserva la entrevista
    slots:
      days:
      - 1
      - 2
      - 3
      - 4
      - 5
      from: 09:00
      to: '18:00'
      minutes: 30
      tz: Europe/Rome
      aheadDays: 14
      minNoticeHours: 4
      capacity: 1
    roles:
    - user
    - admin
  - key: new_position
    type: form
    collection: positions
    title:
      it: Nuova posizione
      en: New position
      ro: Poziție nouă
      es: Nueva posición
    submit:
      label:
        it: Pubblica
        en: Publish
        ro: Publică
        es: Publicar
      message:
        it: Posizione salvata. Condividi il link della chat o un QR.
        en: Position saved. Share the chat link or a QR code.
        ro: Poziție salvată. Distribuie linkul chatului sau un cod QR.
        es: Posición guardada. Comparte el enlace del chat o un QR.
      redirect: positions
    edit: true
    roles:
    - user
    - admin
  - key: positions
    type: table
    source: collection:positions
    title:
      it: Le mie posizioni
      en: My positions
      ro: Pozițiile mele
      es: Mis posiciones
    columns:
    - title
    - location
    - salary
    - threshold
    - status
    roles:
    - user
    - admin
  - key: pipeline
    type: table
    source: collection:candidates
    title:
      it: Pipeline candidati
      en: Candidate pipeline
      ro: Pipeline candidați
      es: Pipeline de candidatos
    columns:
    - position_title
    - name
    - score
    - status
    - availability
    - cv_summary
    export: true
    roles:
    - recruiter
    - admin
  - key: interviews_list
    type: table
    source: collection:interviews
    title:
      it: Colloqui
      en: Interviews
      ro: Interviuri
      es: Entrevistas
    columns:
    - start
    - resource
    - status
    roles:
    - recruiter
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
      ro: Abonament
      es: Suscripción
    roles:
    - user
    - admin
  data:
    collections:
    - name: positions
      ownedBy: user
      description: Open positions created by each hiring company
      fields:
      - name: title
        type: text
        required: true
        label:
          it: Posizione
          en: Position
      - name: location
        type: text
        required: true
        label:
          it: Sede
          en: Site
      - name: requirements
        type: textarea
        required: true
        label:
          it: Requisiti
          en: Requirements
      - name: shifts
        type: textarea
        label:
          it: Turni
          en: Shifts
      - name: salary
        type: text
        label:
          it: Stipendio
          en: Salary
      - name: screening_questions
        type: textarea
        required: true
        label:
          it: Domande di screening
          en: Screening questions
      - name: threshold
        type: number
        required: true
        default: 60
        label:
          it: Soglia di aderenza (0-100)
          en: Fit threshold (0-100)
      - name: recruiter_email
        type: email
        required: true
        label:
          it: Email del recruiter
          en: Recruiter email
      - name: status
        type: select
        required: true
        default: open
        options:
        - value: open
          label:
            it: Aperta
            en: Open
        - value: closed
          label:
            it: Chiusa
            en: Closed
        label:
          it: Stato
          en: Status
      access:
      - role: user
        where:
          status: open
        can:
        - read
    - name: managers
      ownedBy: shared
      description: Hiring managers whose free slots are offered to candidates; kept by the app admins on the data page
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome
          en: Name
      - name: email
        type: email
        label:
          it: Email
          en: Email
      - name: recruiter_email
        type: email
        label:
          it: Email del recruiter
          en: Recruiter email
      - name: active
        type: boolean
        default: true
        label:
          it: Attivo
          en: Active
    - name: candidates
      ownedBy: user
      retentionDays: 365
      description: Applications with answers and fit score
      fields:
      - name: position_id
        type: text
      - name: position_title
        type: text
      - name: recruiter_email
        type: email
      - name: name
        type: text
      - name: email
        type: email
      - name: phone
        type: text
      - name: language
        type: text
      - name: answers
        type: textarea
      - name: availability
        type: textarea
      - name: cv_summary
        type: textarea
      - name: score
        type: number
      - name: status
        type: select
        options:
        - new
        - screening
        - qualified
        - interview
        - rejected
        - hired
      access:
      - role: recruiter
        where:
          recruiter_email: '{user.email}'
        can:
        - read
        - write
    - name: cv_files
      ownedBy: user
      retentionDays: 365
      description: CV uploads of candidates
      fields:
      - name: cv
        type: file
        required: true
        accept:
        - pdf
        - docx
        - jpg
        - jpeg
        - png
        - webp
        maxMb: 10
        label:
          it: CV (foto o documento)
          en: CV (photo or document)
    - name: interviews
      ownedBy: user
      retentionDays: 365
      description: Booked interviews
      fields:
      - name: notes
        type: textarea
        label:
          it: Note
          en: Notes
      access:
      - role: recruiter
  triggers:
  - key: cv_received
    'on':
      collection: cv_files
      op: insert
    start:
      agent: cv_reader
    goal: 'A candidate uploaded a CV. File id(s): {record.cv}. Read it, summarize it and store the summary on the candidate''s
      latest record.'
  - key: rejected_courtesy
    'on':
      collection: candidates
      op: update
      where:
        status: rejected
    notify:
      to:
      - record.email
      subject:
        it: Grazie per la tua candidatura
        en: Thank you for your application
        ro: Mulțumim pentru candidatură
        es: Gracias por tu candidatura
      body:
        it: Ciao {record.name}, grazie per l'interesse per {record.position_title}. Per questa posizione abbiamo deciso di
          proseguire con altri profili. Ti auguriamo il meglio.
        en: Hi {record.name}, thank you for your interest in {record.position_title}. We have decided to move forward with
          other profiles for this role. We wish you all the best.
        ro: Salut {record.name}, mulțumim pentru interesul față de {record.position_title}. Pentru acest post am decis să
          continuăm cu alte profiluri. Îți urăm succes.
        es: Hola {record.name}, gracias por tu interés en {record.position_title}. Para este puesto hemos decidido continuar
          con otros perfiles. Te deseamos lo mejor.
  - key: qualified_alert
    'on':
      collection: candidates
      op: update
      where:
        status: qualified
    notify:
      to:
      - record.recruiter_email
      subject:
        it: 'Nuovo candidato idoneo: {record.position_title}'
        en: 'New qualified candidate: {record.position_title}'
      body:
        it: '{record.name} ha superato la soglia (punteggio {record.score}).'
        en: '{record.name} passed the threshold (score {record.score}).'
      link: pipeline
  - key: interview_booked
    'on':
      collection: interviews
      op: insert
    notify:
      to:
      - owner
      subject:
        it: Colloquio confermato
        en: Interview confirmed
        ro: Interviu confirmat
        es: Entrevista confirmada
      body:
        it: Il tuo colloquio è fissato per {record.start}.
        en: Your interview is booked for {record.start}.
        ro: Interviul tău este programat pentru {record.start}.
        es: Tu entrevista está fijada para {record.start}.
  - key: interview_reminder
    'on':
      date:
        collection: interviews
        field: start
        offsetDays: -1
        hour: 8
    notify:
      to:
      - owner
      subject:
        it: 'Promemoria: colloquio domani'
        en: 'Reminder: interview tomorrow'
        ro: 'Memento: interviu mâine'
        es: 'Recordatorio: entrevista mañana'
      body:
        it: 'Ti ricordiamo il colloquio di domani: {record.start}.'
        en: 'A reminder of your interview tomorrow: {record.start}.'
        ro: 'Îți amintim interviul de mâine: {record.start}.'
        es: 'Te recordamos tu entrevista de mañana: {record.start}.'
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: start
      price: 49
      interval: month
      label: Start · 5 posizioni attive
      includes:
      - 5 active positions
    - key: growth
      price: 149
      interval: month
      label: Growth · 25 posizioni attive
      includes:
      - 25 active positions
    - key: scale
      price: 399
      interval: month
      label: Scale · illimitate
      includes:
      - unlimited active positions
  extensions:
  - key: whatsapp_channel
    description: 'WhatsApp is not available yet: candidates chat on the web (link or QR, magic-link sign-in). WhatsApp conversations,
      CV by WhatsApp and WhatsApp reminders need that channel; reminders go by email for now.'
  - key: manager_calendar_sync
    description: Syncing the manager's Google/Microsoft calendar needs OAuth, not available yet. Interviewers (managers) are
      entered by the app admins on the data page; free slots come from the in-app booking view.
  - key: recruiter_takeover
    description: Recruiters read the candidate's record and CV summary in the pipeline; live takeover inside the conversation
      is not available yet.
  - key: per_position_kanban
    description: The pipeline is a table with a status column, filterable per position; a drag-and-drop board is not available.
