apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: selezionechat
  displayName: SelezioneChat
  tagline:
    it: 'Selezione del personale in chat: screening, punteggio e colloquio fissato.'
    en: 'Hiring by chat: screening, scoring and interview booked.'
    ro: 'Recrutare prin chat: screening, scor și interviu programat.'
    es: 'Selección de personal por chat: cribado, puntuación y entrevista agendada.'
  description:
    it: 'Per aziende che assumono molto (retail, logistica, ristorazione): il candidato parla con un agente, che presenta
      l''offerta, fa le domande di screening, raccoglie disponibilità e CV, assegna un punteggio e propone gli slot del responsabile.'
    en: 'For high-volume employers (retail, logistics, food service): the candidate chats with an agent that presents the
      job, asks screening questions, collects availability and CV, scores fit and offers the manager''s interview slots.'
  langs:
  - it
  - en
  - ro
  - es
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#0f3d3e'
      accent: '#25a06b'
      background: '#f6faf8'
      foreground: '#14242a'
    fonts:
      body: Inter
      display: Manrope
    wordmark:
    - text: Selezione
      color: primary
    - text: Chat
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
        ro: Cum funcționează
        es: Cómo funciona
      href: '#come-funziona'
    cta:
      label:
        it: Accedi
        en: Sign in
        ro: Autentificare
        es: Acceder
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: recruiter
      label:
        it: Recruiter
        en: Recruiter
      assignedBy: signup
  limits:
  - action: chat
    per: user
    max: 200
    window: day
  agents:
  - key: screener
    role: main
    description: 'Talks with candidates: presents the job, screens, scores, books the interview.'
    memory: user
    writesTo:
      collection: candidates
      parse: json_last
      keyBy: candidate_id
    profile:
      inline:
        display_name: SelezioneChat screener
        chat_mode: true
        crews:
        - id: screener
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are a friendly, concise recruiting assistant for one company''s open position. Reply in the
            candidate''s language (Italian, English, Romanian or Spanish). Steps: 1) present the job (role, site, shifts,
            salary) using the position record; 2) ask the screening questions one at a time; 3) collect weekly availability;
            4) ask for the CV as a link or pasted text (file upload is not supported yet); 5) compute a fit score 0-100 against
            the requirements and explain it briefly in notes. If the score is at or above the position''s threshold, read
            the free interview slots with the slots tool and offer 3 of them, then book the one chosen. If below, send a polite,
            kind closing message and never reveal the score. Never invent job details, never promise a job, never ask for
            sensitive data (health, religion, origin, politics). Tell candidates their data is kept 12 months and seen only
            by the hiring company. At the end of each relevant turn, end your reply with a fenced JSON block with fields:
            candidate_id, position, name, answers, availability, cv, score, status (new|screening|qualified|interview|rejected),
            interview_slot, notes.'
    goalTemplate: 'Conversation so far:

      {history}


      New candidate message: {message}

      Today is {date}. Reply in the language with ISO code {lang}.'
    appTools:
    - name: read_position
      description: Read the open position the candidate is applying for
      action: read
      collection: positions
      scope: all
    - name: free_slots
      description: List the interview slots still free
      action: search
      collection: interview_slots
      scope: all
    - name: book_slot
      description: Book an interview slot for the candidate
      action: write
      collection: interview_slots
      scope: all
    - name: read_candidate
      description: Read this candidate's record
      action: read
      collection: candidates
      scope: session
  views:
  - key: home
    type: page
    nav: false
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow:
        it: Per aziende che assumono molto
        en: For high-volume employers
      title:
        it: Dal link al **colloquio fissato**, senza telefonate.
        en: From link to **interview booked**, no phone tag.
        ro: De la link la **interviu programat**.
        es: Del enlace a la **entrevista agendada**.
      text:
        it: 'Pubblica una posizione, condividi link o QR: un agente fa screening, punteggio e prenotazione. Tu vedi la pipeline
          e intervieni quando vuoi.'
        en: 'Publish a position, share a link or QR: an agent screens, scores and books. You see the pipeline and step in
          whenever you want.'
      actions:
      - label:
          it: Inizia
          en: Get started
          ro: Începe
          es: Empezar
        href: /login
        style: primary
      aside: <div style="padding:16px"><b>Esempio / Example</b><p>🤖 Ciao! Cerchiamo un addetto vendite a Torino, turni 9-17.
        Posso farti 4 domande?</p><p>👤 Sì!</p></div>
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Crea la posizione
          en: Create the position
        text:
          it: Requisiti, sede, turni, stipendio, domande e soglia.
          en: Requirements, site, shifts, salary, questions and threshold.
        badge: 📝
      - title:
          it: Il candidato chatta
          en: Candidate chats
        text:
          it: Screening, disponibilità e CV in conversazione.
          en: Screening, availability and CV in conversation.
        badge: 💬
      - title:
          it: Pipeline e colloquio
          en: Pipeline and interview
        text:
          it: Chi supera la soglia sceglie uno slot libero; gli altri ricevono un messaggio di cortesia.
          en: Those above the threshold pick a free slot; the others get a courtesy message.
        badge: 📅
    - type: note
      content:
        it: 'I dati dei candidati sono visibili solo all''azienda titolare. Supporto alla decisione: la scelta finale resta
          al recruiter.'
        en: 'Candidate data is visible only to the hiring company. Decision support: the final choice stays with the recruiter.'
  - key: positions
    type: table
    title:
      it: Posizioni
      en: Positions
      ro: Poziții
      es: Posiciones
    source: collection:positions
    data:
      display: table
      fields:
      - key: title
        label: Titolo
      - key: site
        label: Sede
      - key: shifts
        label: Turni
      - key: salary
        label: Stipendio
      - key: threshold
        label: Soglia
        format: number
      - key: active
        label: Attiva
        format: badge
      limit: 100
    roles:
    - recruiter
    - admin
  - key: pipeline
    type: table
    title:
      it: Pipeline candidati
      en: Candidate pipeline
      ro: Pipeline candidați
      es: Pipeline de candidatos
    source: collection:candidates
    data:
      display: table
      fields:
      - key: name
        label: Nome
      - key: position
        label: Posizione
      - key: status
        label: Stato
        format: badge
      - key: score
        label: Punteggio
        format: number
      - key: interview_slot
        label: Colloquio
        format: date
      - key: notes
        label: Note
      sort:
        field: score
        dir: desc
      limit: 200
      empty:
        it: Nessun candidato ancora.
        en: No candidates yet.
    roles:
    - recruiter
    - admin
  - key: slots
    type: table
    title:
      it: Slot colloquio
      en: Interview slots
      ro: Sloturi interviu
      es: Franjas de entrevista
    source: collection:interview_slots
    data:
      display: table
      fields:
      - key: start
        label: Inizio
        format: date
      - key: position
        label: Posizione
      - key: booked_by
        label: Prenotato da
      sort:
        field: start
        dir: asc
      limit: 200
    roles:
    - recruiter
    - admin
  - key: chat
    type: chat
    title:
      it: 'Candidati: chat'
      en: Candidate chat
      ro: Chat candidat
      es: Chat del candidato
    source: agent:screener
    examples:
    - Ciao, mi interessa la posizione
    - Hi, I'd like to apply
    - Bună, vreau să aplic
    - Hola, quiero postularme
    placeholder:
      it: Scrivi un messaggio…
      en: Type a message…
      ro: Scrie un mesaj…
      es: Escribe un mensaje…
    roles:
    - recruiter
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Plan
      ro: Abonament
      es: Suscripción
    roles:
    - recruiter
  data:
    collections:
    - name: positions
      ownedBy: user
      description: Open positions of the company
      fields:
      - name: title
        type: text
        required: true
      - name: requirements
        type: textarea
      - name: site
        type: text
      - name: shifts
        type: text
      - name: salary
        type: text
      - name: screening_questions
        type: textarea
      - name: threshold
        type: number
        default: 70
      - name: manager_email
        type: email
      - name: active
        type: boolean
        default: true
    - name: candidates
      ownedBy: user
      description: Candidates of the hiring company only; to be deleted 12 months after creation
      fields:
      - name: candidate_id
        type: text
      - name: position
        type: relation
        relation: positions
      - name: name
        type: text
      - name: answers
        type: json
      - name: availability
        type: text
      - name: cv
        type: textarea
      - name: score
        type: number
      - name: status
        type: select
        options:
        - new
        - screening
        - qualified
        - interview
        - rejected
      - name: interview_slot
        type: date
      - name: notes
        type: textarea
    - name: interview_slots
      ownedBy: user
      description: Free interview slots entered by the manager, and their bookings
      fields:
      - name: start
        type: date
        required: true
      - name: position
        type: relation
        relation: positions
      - name: booked_by
        type: text
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: start
      price: 49
      interval: month
      label: Start — 3 posizioni attive
      includes:
      - 3 active positions
      - unlimited candidate chats
      roles:
      - recruiter
    - key: growth
      price: 149
      interval: month
      label: Growth — 15 posizioni attive
      includes:
      - 15 active positions
      - unlimited candidate chats
      roles:
      - recruiter
  extensions:
  - key: whatsapp_channel
    description: WhatsApp is not available yet (needs the company's WhatsApp Business credentials). Candidates chat in the
      web chat opened from the link/QR code.
  - key: candidate_access_and_ownership
    description: Candidates reaching the chat without an account and their records landing in the hiring company's private
      archive needs runtime support not available yet; for now the chat runs for signed-in users.
  - key: calendar_connector
    description: 'Google/Outlook calendar sync needs credentials: the manager enters free slots in the interview_slots collection
      and the agent books those.'
  - key: reminders
    description: Day-before reminders to candidates need notifications (not available yet).
  - key: cv_upload
    description: 'CV as photo or document is not supported yet: the agent asks for a link or pasted text.'
  - key: retention_12_months
    description: Automatic deletion of candidate records after 12 months is not expressible yet; must be implemented as a
      platform retention rule.
  - key: courtesy_message_delivery
    description: Rejection messages are sent inside the chat only; no email or WhatsApp push.
  - key: active_position_quota
    description: Plans limit active positions, but quota enforcement per plan is not expressible in the manifest.
