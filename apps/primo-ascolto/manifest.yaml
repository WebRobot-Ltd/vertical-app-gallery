apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: primo-ascolto
  displayName: Primo Ascolto
  tagline:
    it: Trova lo psicologo giusto per un primo colloquio, in modo riservato.
    en: Find the right psychologist for a first session, in full confidentiality.
  description:
    it: Primo Ascolto è lo strato di abbinamento, prenotazione e pagamento per psicologi iscritti all'albo. Un questionario,
      due o tre professionisti compatibili spiegati, e il primo colloquio prenotato. Non offre terapia né consigli clinici.
    en: Primo Ascolto is the matching, booking and payment layer for licensed psychologists. One questionnaire, two or three
      compatible professionals explained, and your first session booked. It offers no therapy or clinical advice.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#2f4f4f'
      accent: '#d98c5f'
      background: '#f8f5f0'
      foreground: '#1f2a2a'
    fonts:
      body: Inter
      display: Lora
    wordmark:
    - text: Primo
      color: primary
    - text: Ascolto
      color: accent
    button: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Riservatezza
        en: Privacy
      href: '#riservatezza'
    - label:
        it: Assistenza
        en: Support
      href: /v/support
    cta:
      label:
        it: Inizia
        en: Start
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
      - support
      agents:
      - support
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: psychologist
      label:
        it: Psicologo
        en: Psychologist
      assignedBy: invite
    - key: user
      label:
        it: Persona
        en: Client
      assignedBy: signup
  limits:
  - action: agent:matcher
    per: user
    max: 5
    window: day
    roles:
    - user
  - action: chat
    per: ip
    max: 30
    window: hour
    roles:
    - anonymous
  agents:
  - key: matcher
    role: main
    description: Propone 2-3 psicologi compatibili usando solo i profili inseriti dai professionisti, e propone uno slot per
      il primo colloquio.
    profile:
      inline:
        display_name: Primo Ascolto matcher
        crews:
        - id: matcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''assistente di abbinamento di Primo Ascolto, una piattaforma che mette in contatto persone
            e psicologi iscritti all''albo. NON sei uno psicologo: non fai diagnosi, non dai consigli clinici, non interpreti
            il disagio della persona. Tratti dati sanitari: usa solo ciò che la persona ha indicato nel questionario e non
            ripeterlo oltre il necessario.


            Procedura: 1) con lo strumento list_psychologists leggi i profili dei professionisti (specializzazioni, approccio,
            lingue, genere, tariffa, presentazione). 2) con list_slots leggi le disponibilità libere. 3) scegli 2 o 3 professionisti
            compatibili con motivo, preferenze (genere, approccio, lingua), fasce orarie e budget. Usa ESCLUSIVAMENTE ciò
            che i professionisti hanno scritto nel loro profilo: non inventare titoli, esperienze, risultati o numeri di albo.
            Se meno di due professionisti sono compatibili, dillo e indica quale preferenza allentare. 4) per ogni scelta
            spiega in 2-3 frasi il perché, citando i campi del profilo, e indica il prossimo slot libero compatibile e la
            tariffa.


            Struttura del report: un titolo di primo livello "# I tuoi professionisti consigliati"; poi per ciascuno una sezione
            "## Nome" con Perché è compatibile, Approccio e lingue, Tariffa, Primo slot disponibile; poi "## Come proseguire"
            (scegli, conferma lo slot, paga con carta, la prima seduta si svolge in videochiamata nella piattaforma); poi
            una nota: "Primo Ascolto non offre terapia né consulenza clinica. In caso di emergenza chiama il 112." Se la persona
            esprime rischio per sé o per altri, interrompi l''abbinamento e indica solo di chiamare il 112 o il servizio di
            emergenza locale. Quando la persona lo chiede, usa request_confirm_booking per proporre il colloquio con il professionista
            e lo slot scelti. Rispondi nella lingua indicata.'
          mcp_servers: []
    goalTemplate: 'Questionario della persona (consenso al trattamento dei dati sanitari: {consent_label}).

      Motivo della richiesta: {reason_label}

      {?gender_pref}Preferenza di genere del professionista: {gender_pref_label}{/gender_pref}

      {?approach_pref}Approccio preferito: {approach_pref_label}{/approach_pref}

      Lingua: {language_label}

      Fasce orarie: {time_windows}

      {?budget}Budget massimo a seduta: {budget} EUR{/budget}

      {?notes}Note: {notes}{/notes}

      Data di oggi: {date}. Scrivi in lingua ISO {lang}.'
    appTools:
    - name: list_psychologists
      description: Public profiles entered by the psychologists
      action: read
      collection: psychologists
      scope: all
    - name: list_slots
      description: Free appointment slots
      action: read
      collection: slots
      scope: all
    awaits:
    - confirm_booking
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.4
  - key: support
    role: helper
    description: 'Servizio clienti: prezzi, cambio terapeuta, disdette. Mai consigli clinici.'
    profile:
      inline:
        display_name: Primo Ascolto support
        chat_mode: true
        crews:
        - id: support
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 4
          max_budget_usd: 0.15
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei il servizio clienti di Primo Ascolto. Rispondi su prezzi, commissioni, come prenotare, cambio
            di terapeuta, disdette e rimborsi, usando solo le regole lette con lo strumento read_policies. Se la risposta
            non c''è, dillo e indica di scrivere all''assistenza. Non dai MAI consigli clinici, non commenti sintomi o terapie,
            non chiedi dati sanitari: se la persona ne parla, rispondi con gentilezza che non puoi aiutare su questo e che
            il suo psicologo è la persona giusta; in caso di emergenza indica il 112. Risposte brevi, nella lingua della persona.'
    goalTemplate: 'Conversazione finora:

      {history}


      Nuovo messaggio: {message}'
    appTools:
    - name: read_policies
      description: Prices, cancellation and therapist-change rules
      action: read
      collection: policies
      scope: all
    output: markdown
  inputForm:
    title:
      it: Questionario iniziale
      en: Initial questionnaire
    fields:
    - name: consent
      type: select
      required: true
      label:
        it: Consenso al trattamento dei dati sanitari
        en: Consent to processing of health data
      help:
        it: Usiamo le risposte solo per l'abbinamento. Senza consenso non possiamo procedere.
        en: We use your answers only for matching. We cannot proceed without consent.
      options:
      - value: 'yes'
        label:
          it: Acconsento esplicitamente
          en: I explicitly consent
    - name: reason
      type: select
      required: true
      label:
        it: Motivo della richiesta
        en: Reason for the request
      options:
      - value: anxiety
        label:
          it: Ansia
          en: Anxiety
      - value: relationships
        label:
          it: Relazioni
          en: Relationships
      - value: work
        label:
          it: Lavoro
          en: Work
      - value: grief
        label:
          it: Lutto
          en: Grief
    - name: gender_pref
      type: select
      label:
        it: Genere del professionista
        en: Professional's gender
      options:
      - value: any
        label:
          it: Indifferente
          en: No preference
      - value: f
        label:
          it: Donna
          en: Woman
      - value: m
        label:
          it: Uomo
          en: Man
    - name: approach_pref
      type: select
      label:
        it: Approccio
        en: Approach
      options:
      - value: any
        label:
          it: Nessuna preferenza
          en: No preference
      - value: cbt
        label:
          it: Cognitivo-comportamentale
          en: Cognitive-behavioural
      - value: psychodynamic
        label:
          it: Psicodinamico
          en: Psychodynamic
      - value: systemic
        label:
          it: Sistemico-relazionale
          en: Systemic
      - value: humanistic
        label:
          it: Umanistico
          en: Humanistic
    - name: language
      type: select
      required: true
      label:
        it: Lingua delle sedute
        en: Session language
      options:
      - value: it
        label: Italiano
      - value: en
        label: English
    - name: time_windows
      type: multiselect
      required: true
      label:
        it: Fasce orarie disponibili
        en: Available time windows
      options:
      - value: weekday_morning
        label:
          it: Feriali mattina
          en: Weekday mornings
      - value: weekday_afternoon
        label:
          it: Feriali pomeriggio
          en: Weekday afternoons
      - value: weekday_evening
        label:
          it: Feriali sera
          en: Weekday evenings
      - value: weekend
        label:
          it: Weekend
          en: Weekend
    - name: budget
      type: number
      label:
        it: Budget massimo a seduta (EUR, facoltativo)
        en: Maximum budget per session (EUR, optional)
    - name: notes
      type: textarea
      maxLength: 400
      label:
        it: Altre indicazioni (facoltative, evita dettagli clinici)
        en: Other notes (optional, avoid clinical details)
  data:
    collections:
    - name: psychologists
      ownedBy: shared
      description: Public profile entered by each psychologist (no clinical data)
      fields:
      - name: email
        type: email
        required: true
      - name: display_name
        type: text
        required: true
      - name: gender
        type: select
        options:
        - f
        - m
        - other
      - name: approach
        type: select
        options:
        - cbt
        - psychodynamic
        - systemic
        - humanistic
      - name: specializations
        type: multiselect
        options:
        - anxiety
        - relationships
        - work
        - grief
      - name: languages
        type: multiselect
        options:
        - it
        - en
      - name: fee_eur
        type: number
      - name: register_number
        type: text
        help: Numero di iscrizione all'albo, verificato dallo staff
      - name: bio
        type: textarea
        maxLength: 800
    - name: slots
      ownedBy: shared
      description: Free appointment slots published by psychologists
      fields:
      - name: psychologist
        type: relation
        relation: psychologists
      - name: starts_at
        type: date
      - name: duration_min
        type: number
      - name: window
        type: select
        options:
        - weekday_morning
        - weekday_afternoon
        - weekday_evening
        - weekend
      - name: status
        type: select
        options:
        - free
        - booked
    - name: bookings
      ownedBy: user
      description: The client's own bookings (no clinical content)
      fields:
      - name: psychologist
        type: relation
        relation: psychologists
      - name: slot
        type: relation
        relation: slots
      - name: status
        type: select
        options:
        - proposed
        - confirmed
        - paid
        - done
        - cancelled
      - name: fee_eur
        type: number
    - name: policies
      ownedBy: shared
      description: Prices, cancellation and therapist-change rules for customer service
      fields:
      - name: topic
        type: text
      - name: text
        type: textarea
  approvals:
  - key: confirm_booking
    title:
      it: Conferma il primo colloquio
      en: Confirm your first session
    decidedBy: requester
    fields:
    - psychologist
    - slot
    - fee_eur
    timeoutMinutes: 1440
  views:
  - key: home
    type: page
    nav: false
    title: Primo Ascolto
    sections:
    - type: hero
      eyebrow:
        it: Psicologi iscritti all'albo
        en: Licensed psychologists
      title:
        it: Il **primo passo** verso il professionista giusto
        en: The **first step** toward the right professional
      text:
        it: Rispondi a un breve questionario, ricevi due o tre psicologi compatibili con le spiegazioni, prenota il primo
          colloquio e incontrali in videochiamata. Riservato, con il tuo consenso esplicito.
        en: Answer a short questionnaire, get two or three compatible psychologists with explanations, book your first session
          and meet them by video. Confidential, with your explicit consent.
      actions:
      - label:
          it: Trova il mio psicologo
          en: Find my psychologist
        href: /v/new_match
        style: primary
      - label:
          it: Assistenza
          en: Support
        href: /v/support
        style: ghost
      band: true
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Questionario
          en: Questionnaire
        text:
          it: Motivo, preferenze, orari e budget.
          en: Reason, preferences, times and budget.
        badge: 📝
      - title:
          it: Abbinamento
          en: Matching
        text:
          it: Due o tre professionisti, scelti solo dai profili che hanno compilato.
          en: Two or three professionals, chosen only from the profiles they filled in.
        badge: 🤝
      - title:
          it: Prenota e paga
          en: Book and pay
        text:
          it: Scegli lo slot, conferma e paga con carta.
          en: Pick a slot, confirm and pay by card.
        badge: 💳
      - title:
          it: Videochiamata
          en: Video session
        text:
          it: La seduta si svolge nella piattaforma.
          en: The session takes place inside the platform.
        badge: 🎥
    - type: cards
      id: riservatezza
      title:
        it: Riservatezza
        en: Privacy
      items:
      - title:
          it: Consenso esplicito
          en: Explicit consent
        text:
          it: I dati del questionario sono usati solo per l'abbinamento.
          en: Questionnaire data is used only for matching.
      - title:
          it: Note cliniche protette
          en: Protected clinical notes
        text:
          it: Solo il professionista le gestisce; nessun altro, staff compreso.
          en: Only the professional manages them; nobody else, staff included.
      - title:
          it: Niente consigli clinici
          en: No clinical advice
        text:
          it: Né l'abbinamento né l'assistenza clienti danno consigli clinici.
          en: Neither matching nor customer support gives clinical advice.
    - type: note
      content:
        it: Primo Ascolto non eroga terapia. In emergenza chiama il 112.
        en: Primo Ascolto does not provide therapy. In an emergency call 112.
  - key: new_match
    type: new_run
    title:
      it: Trova il tuo psicologo
      en: Find your psychologist
    roles:
    - user
    - admin
  - key: matches
    type: history
    title:
      it: Le mie proposte
      en: My matches
    source: run
    roles:
    - user
  - key: match
    type: report
    source: run
    printable: true
    nav: false
  - key: confirmations
    type: approvals
    title:
      it: Conferma colloqui
      en: Confirm sessions
    approvals:
    - confirm_booking
    roles:
    - user
  - key: my_bookings
    type: table
    title:
      it: Le mie prenotazioni
      en: My bookings
    source: collection:bookings
    data:
      display: table
      fields:
      - key: psychologist
        label:
          it: Psicologo
          en: Psychologist
      - key: status
        label:
          it: Stato
          en: Status
        format: badge
      - key: fee_eur
        label:
          it: Tariffa
          en: Fee
        format: money
      sort:
        field: createdAt
        dir: desc
    roles:
    - user
  - key: my_profile
    type: table
    title:
      it: Il mio profilo professionale
      en: My professional profile
    source: collection:psychologists
    roles:
    - psychologist
    - admin
  - key: my_slots
    type: table
    title:
      it: La mia agenda
      en: My calendar
    source: collection:slots
    roles:
    - psychologist
    - admin
  - key: support
    type: chat
    title:
      it: Assistenza
      en: Support
    source: agent:support
    examples:
    - it: Quanto costa il primo colloquio?
      en: How much is the first session?
    - it: Come cambio terapeuta?
      en: How do I change therapist?
    - it: Come disdico una seduta?
      en: How do I cancel a session?
    placeholder:
      it: Scrivi la tua domanda su prezzi, cambi o disdette
      en: Ask about prices, changes or cancellations
  - key: account
    type: account
    title:
      it: Crediti
      en: Credits
    roles:
    - user
  billing:
    modes:
    - credits
    - per_transaction
    signupCredits: 20
    transactionFeePct: 15
    sellers: collection:psychologists
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:matcher:
        estimate: 10
        metered: true
    packs:
    - key: match
      credits: 200
      price: 2
      label:
        it: Altri abbinamenti
        en: More matches
  extensions:
  - key: booking_calendar
    description: 'Calendario per scegliere e prenotare uno slot e pagare la seduta con carta (Stripe Connect verso lo psicologo,
      commissione trattenuta): il manifest dichiara collezioni, approvazione e commissione, ma serve un modulo di prenotazione
      e checkout per singola seduta.'
  - key: video_sessions
    description: 'Videochiamata dentro la piattaforma: non disponibile.'
  - key: reminders
    description: 'Promemoria via email e notifica prima di ogni seduta: notifiche non ancora disponibili.'
  - key: clinical_notes_isolation
    description: 'Note cliniche visibili solo allo psicologo autore, nemmeno all''admin, con cifratura dedicata e gestione
      dei pazienti per professionista: non esprimibile con i ruoli attuali, quindi nessuna collezione di note è stata creata.'
  - key: professional_vetting
    description: Verifica dell'iscrizione all'albo e onboarding Stripe dei professionisti da parte dello staff; i dati sanitari
      richiedono DPA, informativa GDPR e registro dei trattamenti.
