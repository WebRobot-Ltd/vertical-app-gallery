apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: primo-ascolto
  displayName: Primo Ascolto
  tagline:
    it: Trova lo psicologo giusto e prenota il primo colloquio.
    en: Find the right psychologist and book your first session.
  description:
    it: Piattaforma di abbinamento, prenotazione e pagamento per psicologi iscritti all'albo. Questionario iniziale, due o
      tre proposte motivate, prenotazione da calendario e pagamento con carta.
    en: Matching, booking and payment platform for licensed psychologists. Intake questionnaire, two or three reasoned suggestions,
      calendar booking and card payment.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#2f4858'
      accent: '#3a8f85'
      background: '#f7f5f1'
      foreground: '#1f2a30'
    fonts:
      body: Inter
      display: Fraunces
    buttonShape: rounded
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Privacy
        en: Privacy
      href: '#privacy'
    cta:
      label:
        it: Inizia
        en: Start
      href: /v/match
  auth:
    method: magic_link
    anonymous:
      views:
      - home
      - support
      agents:
      - support
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
    - key: psychologist
      label:
        it: Psicologo
        en: Psychologist
      assignedBy: derived
      from: collection:psychologists.email
  limits:
  - action: agent:matcher
    per: user
    max: 5
    window: day
    roles:
    - user
  - action: chat
    per: ip
    max: 30
    window: hour
  agents:
  - key: matcher
    role: main
    description: Proposes two or three compatible psychologists using only the profiles they entered.
    profile:
      inline:
        display_name: Primo Ascolto matcher
        crews:
        - id: matcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You help people choose a licensed psychologist on the Primo Ascolto platform. You only match: you
            never give clinical advice, diagnoses or opinions on the person''s condition. First call the tool list_psychologists
            to read the catalogue. Use ONLY what the psychologists wrote in their profiles (specializations, approach, languages,
            gender, rates, availability): never invent qualifications or details. Propose 2 or 3 psychologists, ranked, and
            for each explain in plain, warm language why it fits the stated reason, preferences, time slots and budget; say
            clearly when a preference is not met. If fewer than 2 fit, say so and propose the closest. If the request suggests
            an emergency or risk of self-harm, start with a short note to contact 112 or the local emergency service, and
            do not continue the matching. Format: a level-1 title "# I tuoi abbinamenti" (or "# Your matches" if the language
            is English), then one ## section per psychologist (name, why, approach, languages, price per session), then ##
            Come prenotare / How to book: choose one and book the first session from the booking page (/v/book). Under 400
            words. Do not repeat the person''s sensitive details beyond what is needed.'
    goalTemplate: 'The person gives explicit consent to process these health-related data only to find a match.

      Reason for the request: {reason_label}

      {?gender_pref}Preferred gender of the professional: {gender_pref_label}{/gender_pref}

      {?approach_pref}Preferred approach: {approach_pref_label}{/approach_pref}

      {?language}Language: {language_label}{/language}

      Available time slots: {slots}

      {?budget}Budget per session (EUR): {budget}{/budget}

      Write the answer in the language with ISO code {lang}.'
    appTools:
    - name: list_psychologists
      description: List the psychologists' profiles (specializations, approach, languages, gender, rate, availability)
      action: search
      collection: psychologists
      scope: all
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.3
  - key: support
    role: helper
    description: 'Customer service chat: prices, therapist change, cancellations. No clinical advice.'
    profile:
      inline:
        display_name: Primo Ascolto support
        crews:
        - id: support
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 4
          max_budget_usd: 0.1
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the customer service of Primo Ascolto, a booking platform for licensed psychologists. You
            answer ONLY about: session prices (call the tool price_list to read each professional''s rate), how booking and
            card payment work, how to change therapist (the person can repeat the questionnaire at /v/match and book with
            another professional), and cancellations (the person cancels from their bookings page; refer to the cancellation
            terms published by the platform and say when you do not know a rule: never invent policies or refunds). You NEVER
            give clinical or psychological advice, never comment on symptoms or therapy, and you never ask for health details.
            If someone describes distress or risk, reply with empathy, suggest contacting their psychologist or, in an emergency,
            112 or the local emergency service. Short, kind answers in the user''s language.'
    goalTemplate: 'Conversation so far:

      {history}

      New message: {message}

      Answer in the language with ISO code {lang}.'
    appTools:
    - name: price_list
      description: Read the psychologists' name and session rate
      action: search
      collection: psychologists
      scope: all
    output: markdown
    limits:
      maxTurns: 4
      maxBudgetUsd: 0.1
  inputForm:
    title:
      it: Questionario iniziale
      en: Intake questionnaire
    fields:
    - name: reason
      type: select
      required: true
      label:
        it: Motivo della richiesta
        en: Reason for the request
      options:
      - value: anxiety
        label:
          it: Ansia
          en: Anxiety
      - value: relationships
        label:
          it: Relazioni
          en: Relationships
      - value: work
        label:
          it: Lavoro
          en: Work
      - value: grief
        label:
          it: Lutto
          en: Grief
    - name: gender_pref
      type: select
      label:
        it: Genere del professionista
        en: Professional's gender
      options:
      - value: any
        label:
          it: Indifferente
          en: No preference
      - value: f
        label:
          it: Donna
          en: Woman
      - value: m
        label:
          it: Uomo
          en: Man
    - name: approach_pref
      type: select
      label:
        it: Approccio
        en: Approach
      options:
      - value: any
        label:
          it: Indifferente
          en: No preference
      - value: cbt
        label:
          it: Cognitivo-comportamentale
          en: Cognitive-behavioural
      - value: psychodynamic
        label:
          it: Psicodinamico
          en: Psychodynamic
      - value: systemic
        label:
          it: Sistemico-relazionale
          en: Systemic
      - value: humanistic
        label:
          it: Umanistico
          en: Humanistic
    - name: language
      type: select
      label:
        it: Lingua
        en: Language
      options:
      - value: it
        label:
          it: Italiano
          en: Italian
      - value: en
        label:
          it: Inglese
          en: English
      - value: es
        label:
          it: Spagnolo
          en: Spanish
      - value: fr
        label:
          it: Francese
          en: French
    - name: slots
      type: multiselect
      required: true
      label:
        it: Fasce orarie disponibili
        en: Available time slots
      options:
      - value: weekday_morning
        label:
          it: Feriali mattina
          en: Weekday mornings
      - value: weekday_afternoon
        label:
          it: Feriali pomeriggio
          en: Weekday afternoons
      - value: weekday_evening
        label:
          it: Feriali sera
          en: Weekday evenings
      - value: weekend
        label:
          it: Fine settimana
          en: Weekends
    - name: budget
      type: number
      label:
        it: Budget a seduta in € (facoltativo)
        en: Budget per session in € (optional)
    - name: consent
      type: boolean
      required: true
      label:
        it: Acconsento esplicitamente al trattamento dei miei dati relativi alla salute per trovare un professionista adatto
        en: I explicitly consent to the processing of my health-related data to find a suitable professional
      help:
        it: Senza consenso non possiamo procedere. Puoi revocarlo in qualsiasi momento.
        en: We cannot proceed without consent. You can withdraw it at any time.
  data:
    collections:
    - name: psychologists
      ownedBy: shared
      description: 'Catalogue of licensed psychologists, kept by the admins from /admin/data: name, email, albo_number, gender,
        approach, languages, specializations, bio, rate, availability. The email makes the person hold the psychologist role.'
      fields:
      - name: name
        type: text
        required: true
        label: Nome
      - name: email
        type: email
        required: true
      - name: albo_number
        type: text
        required: true
        label: N. iscrizione albo
      - name: gender
        type: select
        options:
        - f
        - m
        - other
      - name: approach
        type: select
        options:
        - cbt
        - psychodynamic
        - systemic
        - humanistic
      - name: languages
        type: text
      - name: specializations
        type: text
        help: anxiety, relationships, work, grief…
      - name: bio
        type: textarea
        maxLength: 1200
      - name: rate
        type: number
        label: Tariffa seduta (EUR)
      - name: availability
        type: text
    - name: appointments
      ownedBy: user
      description: Bookings of first sessions and follow-ups (start, end, date, resource, status). Contains no clinical notes.
      retentionDays: 1825
      access:
      - role: psychologist
        where:
          resource: '{user.email}'
        can:
        - read
        - write
  views:
  - key: home
    type: page
    nav: false
    sections:
    - type: hero
      layout: stack
      title:
        it: Il **primo ascolto** giusto, con un professionista iscritto all'albo.
        en: The right **first session**, with a licensed professional.
      text:
        it: Rispondi a un breve questionario, ricevi due o tre proposte motivate, prenota il colloquio e paga online. La terapia
          la svolgono psicologi iscritti all'albo.
        en: Answer a short questionnaire, get two or three reasoned suggestions, book your session and pay online. Therapy
          is delivered by licensed psychologists.
      actions:
      - label:
          it: Inizia il questionario
          en: Start the questionnaire
        href: /v/match
        style: primary
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Questionario
          en: Questionnaire
        text:
          it: Motivo, preferenze, orari e budget, con il tuo consenso esplicito.
          en: Reason, preferences, time slots and budget, with your explicit consent.
      - title:
          it: Proposte
          en: Suggestions
        text:
          it: Un assistente ti propone 2-3 psicologi spiegando perché, usando solo i profili che hanno compilato.
          en: An assistant suggests 2-3 psychologists and explains why, using only the profiles they filled in.
      - title:
          it: Prenota e paga
          en: Book and pay
        text:
          it: Scegli lo slot dal calendario e paga con carta.
          en: Pick a slot from the calendar and pay by card.
      - title:
          it: Promemoria
          en: Reminders
        text:
          it: Ricevi un'email prima di ogni seduta.
          en: You get an email before every session.
    - type: cards
      id: privacy
      title:
        it: Riserbo e tutele
        en: Privacy and safeguards
      items:
      - title:
          it: Dati sanitari protetti
          en: Protected health data
        text:
          it: Solo tu e il professionista che scegli vedete i tuoi dati di prenotazione. Le note cliniche non sono mai conservate
            dalla piattaforma.
          en: Only you and the professional you choose see your booking data. Clinical notes are never stored by the platform.
      - title:
          it: Nessun consiglio clinico
          en: No clinical advice
        text:
          it: Assistente e servizio clienti non danno consigli clinici.
          en: The assistant and customer service never give clinical advice.
    - type: view
      title:
        it: Serve aiuto? Scrivici
        en: Need help? Write to us
      view: support
    - type: note
      content:
        it: Primo Ascolto è un servizio di abbinamento e prenotazione, non un servizio di emergenza. In caso di emergenza
          chiama il 112.
        en: Primo Ascolto is a matching and booking service, not an emergency service. In an emergency call 112.
  - key: match
    type: new_run
    title:
      it: Trova il tuo psicologo
      en: Find your psychologist
    roles:
    - user
    - admin
  - key: matches
    type: history
    title:
      it: Le mie proposte
      en: My matches
    source: run
    roles:
    - user
  - key: match_report
    type: report
    source: run
    printable: false
    nav: false
  - key: book
    type: booking
    title:
      it: Prenota il colloquio
      en: Book your session
    collection: appointments
    resources: collection:psychologists
    slots:
      days:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      from: 09:00
      to: '20:00'
      minutes: 50
      tz: Europe/Rome
      aheadDays: 21
      minNoticeHours: 12
      capacity: 1
    roles:
    - user
  - key: my_sessions
    type: table
    title:
      it: Le mie sedute
      en: My sessions
    source: collection:appointments
    columns:
    - date
    - start
    - resource
    - status
    roles:
    - user
  - key: agenda
    type: table
    title:
      it: La mia agenda
      en: My agenda
    source: collection:appointments
    columns:
    - date
    - start
    - end
    - status
    roles:
    - psychologist
  - key: support
    type: chat
    title:
      it: Assistenza
      en: Support
    source: agent:support
    examples:
    - it: Quanto costa una seduta?
      en: How much is a session?
    - it: Come cambio terapeuta?
      en: How do I change therapist?
    - it: Come disdico una seduta?
      en: How do I cancel a session?
    placeholder:
      it: Scrivi la tua domanda su prezzi, cambi o disdette
      en: Ask about prices, changes or cancellations
  - key: account
    type: account
    title:
      it: Account e pagamenti
      en: Account and payments
    roles:
    - user
    - psychologist
  triggers:
  - key: booking_confirmed
    'on':
      collection: appointments
      op: insert
    notify:
      to:
      - owner
      subject:
        it: Colloquio prenotato il {record.date}
        en: Session booked for {record.date}
      body:
        it: Il tuo colloquio è confermato per il {record.date}. La seduta si svolge in videochiamata dalla piattaforma.
        en: Your session is confirmed for {record.date}. The session takes place by video call on the platform.
      link: my_sessions
  - key: session_reminder
    'on':
      date:
        collection: appointments
        field: start
        offsetDays: -1
        hour: 8
    notify:
      to:
      - owner
      subject:
        it: 'Promemoria: seduta domani'
        en: 'Reminder: session tomorrow'
      body:
        it: Ti ricordiamo la seduta di domani ({record.date}).
        en: A reminder of your session tomorrow ({record.date}).
      link: my_sessions
  - key: session_reminder_today
    'on':
      date:
        collection: appointments
        field: start
        offsetDays: 0
        hour: 7
    notify:
      to:
      - owner
      subject:
        it: Oggi hai una seduta
        en: You have a session today
      body:
        it: Oggi hai una seduta ({record.date}). Accedi alla piattaforma all'orario previsto.
        en: You have a session today ({record.date}). Sign in at the scheduled time.
      link: my_sessions
  billing:
    modes:
    - per_transaction
    currency: eur
    transactionFeePct: 20
    sellers: collection:psychologists
  egress:
    hosts: []
    notes: No external APIs.
  extensions:
  - key: video_sessions
    description: 'Video calls inside the platform are not available yet: the session link must be added by other means.'
  - key: push_notifications
    description: Push notifications before a session are not available yet; only email reminders are sent.
  - key: clinical_notes
    description: 'The platform deliberately stores no clinical notes: a notes feature visible only to the author psychologist
      (not even admins) is not expressible; use the professional''s own tool.'
  - key: checkout_at_booking
    description: Card payment at booking time with the commission split to the psychologist's Stripe Connect account (per_transaction,
      seller = psychologists) needs the checkout wiring in the studio; the psychologists' appointments rule assumes the booking
      resource holds the psychologist's email.
  - key: patient_management
    description: The psychologist sees only the agenda of their bookings; a richer patient list is not covered.
