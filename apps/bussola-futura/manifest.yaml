apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: bussola-futura
  displayName: BussolaFutura
  tagline:
    it: La bussola per scegliere università e lavoro.
  description:
    it: Un questionario, una squadra di agenti AI che analizza i dati aperti MUR, USTAT e ISTAT, un mentor che rivede il report
      e un assistente di orientamento per le tue domande.
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12355b'
      accent: '#e8833a'
      background: '#f7f9fc'
      foreground: '#16202c'
    fonts:
      body: Inter
      display: Poppins
    wordmark:
    - text: Bussola
      color: primary
    - text: Futura
      color: accent
    button: accent
  header:
    links:
    - label:
        it: Come funziona
      href: '#come-funziona'
    - label:
        it: Fonti dei dati
      href: '#fonti'
    cta:
      label:
        it: Accedi
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Amministratore
      assignedBy: admin_emails
    - key: mentor
      label: Mentor
      assignedBy: invite
    - key: docente
      label: Docente referente
      assignedBy: invite
    - key: studente
      label: Studente
      assignedBy: invite
  limits:
  - action: agent:orientatore
    per: user
    max: 3
    window: day
    roles:
    - studente
  - action: chat
    per: user
    max: 60
    window: day
    roles:
    - studente
  egress:
    hosts:
    - esploradati.istat.it
    notes: 'ISTAT, dati su occupazione e retribuzioni dei laureati: riuso consentito con attribuzione (CC BY 3.0 IT). I dati
      MUR e USTAT (IODL 2.0) sono raccolti tramite il WebRobot MCP.'
  agents:
  - key: orientatore
    role: main
    description: 'Squadra di due agenti: l''analista raccoglie e incrocia i dati aperti, l''estensore scrive il report personale
      e lo invia alla revisione del mentor.'
    awaits:
    - revisione_mentor
    profile:
      inline:
        display_name: BussolaFutura – squadra report
        crews:
        - id: analista
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'Sei l''analista dati di BussolaFutura. Ricevi il questionario di uno studente delle superiori. Raccogli,
            tramite il WebRobot MCP, i dati aperti MUR e USTAT sui corsi di laurea (classi di laurea, atenei, accesso programmato,
            iscritti) e, con lo strumento istat_sdmx, i dati ISTAT su tasso di occupazione e retribuzioni dei laureati per
            area disciplinare. Non costruire pipeline YAML a mano: usa gli strumenti MCP. Individua i 10 percorsi più coerenti
            con interessi, materie, voti, ambizioni, vincoli economici e geografici, poi riduci a 5 con motivazione. Per ciascuno
            elenca: classe di laurea, atenei che lo offrono (nel raggio dei vincoli geografici), numero chiuso o meno, costi
            indicativi, dati di occupazione e retribuzione con anno di riferimento e fonte. Non inventare mai cifre né atenei:
            se un dato manca scrivilo. Consegna una nota di lavoro strutturata all''estensore.'
        - id: estensore
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''estensore dei report di BussolaFutura, rivolto a uno studente di 16-19 anni: tono chiaro,
            incoraggiante, onesto. Scrivi in italiano. Inizia con un titolo di primo livello "# Il tuo percorso: <nome o profilo
            sintetico> – <data>". Sezioni ## : Il tuo profilo (sintesi del questionario), Cinque percorsi consigliati (per
            ciascuno ### con: perché ti si addice, Pro, Contro, Atenei che lo offrono, Prospettive di lavoro con dati ISTAT),
            Confronto (aggiungi un grafico in blocco ```chart con occupazione o retribuzione dei cinque percorsi, solo cifre
            reali dell''analista), Prossimi passi, Fonti (MUR e USTAT licenza IODL 2.0; ISTAT CC BY 3.0 IT, con anni). Non
            dare garanzie di successo né consulenza legale; non inventare dati. Aggiungi in fondo la nota: "Report in revisione:
            sarà consegnato dopo la verifica del tuo mentor." Dopo aver scritto il report chiama lo strumento request_revisione_mentor
            con il titolo e un riassunto di tre righe.'
        orchestration:
          type: dag
          entry: analista
          nodes:
          - id: analista
            crew: analista
          - id: estensore
            crew: estensore
          edges:
          - from: analista
            to: estensore
    appTools:
    - name: istat_sdmx
      description: Interroga l'API SDMX di ISTAT (occupazione e retribuzioni dei laureati). Percorso es. data/<flow>/<chiave>;
        formato JSON.
      action: http
      http:
        method: GET
        url: https://esploradati.istat.it/SDMXWS/rest
        allowPath: true
        headers:
          Accept: application/json
        attribution: ISTAT, CC BY 3.0 IT
    goalTemplate: 'Studente: {user}. Anno di corso: {anno_label}.

      Interessi: {interessi}

      Materie preferite: {materie}

      {?media_voti}Media dei voti: {media_voti}{/media_voti}

      Ambizioni: {ambizioni}

      Vincoli economici: {budget_label}

      Mobilità geografica: {mobilita_label}{?regioni} ({regioni}){/regioni}

      {?note}Note: {note}{/note}

      Data: {date}. Scrivi il report in italiano.'
    output: markdown
    writesTo:
      collection: report
      parse: whole
    limits:
      maxTurns: 40
      maxBudgetUsd: 1.5
  - key: assistente
    role: helper
    description: Assistente di orientamento in chat che conosce i report dello studente.
    memory: user
    appTools:
    - name: leggi_report
      description: Legge i report approvati dello studente.
      action: read
      collection: report
      scope: user
    profile:
      inline:
        display_name: BussolaFutura – assistente
        chat_mode: true
        crews:
        - id: assistente
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''assistente di orientamento di BussolaFutura per studenti delle superiori. Rispondi in italiano,
            con tono amichevole e concreto, in meno di 200 parole. Usa leggi_report per riferirti ai percorsi consigliati
            allo studente. Aiuta a confrontare corsi, capire test di ingresso, costi, borse di studio e sbocchi. Non inventare
            cifre o requisiti: se non sei sicuro, dillo e suggerisci di parlarne con il mentor. Non promettere esiti. Con
            ansia o disagio forte, invita a parlarne con il docente referente o il mentor. Con lo strumento remember conserva
            i punti chiave.'
    goalTemplate: 'Conversazione finora:

      {history}


      Nuovo messaggio dello studente: {message}'
    output: markdown
  approvals:
  - key: revisione_mentor
    title:
      it: Revisione del report
    description: Il mentor assegnato verifica il report prima della consegna allo studente.
    role: mentor
    decidedBy: role
    fields:
    - title
    - summary
    timeoutMinutes: 10080
    onTimeout: reject
  inputForm:
    title:
      it: Il tuo questionario
    fields:
    - name: anno
      type: select
      required: true
      label:
        it: Anno di corso
      options:
      - value: '3'
        label: Terzo
      - value: '4'
        label: Quarto
      - value: '5'
        label: Quinto
    - name: interessi
      type: textarea
      required: true
      maxLength: 800
      label:
        it: I tuoi interessi
      help:
        it: Cosa ti appassiona, hobby, attività extrascolastiche
    - name: materie
      type: textarea
      required: true
      maxLength: 400
      label:
        it: Materie preferite
    - name: media_voti
      type: number
      label:
        it: Media dei voti (facoltativo)
    - name: ambizioni
      type: textarea
      required: true
      maxLength: 800
      label:
        it: Ambizioni e lavoro dei sogni
    - name: budget
      type: select
      required: true
      label:
        it: Vincoli economici
      options:
      - value: bassi
        label: Servono borse e costi contenuti
      - value: medi
        label: Budget medio
      - value: nessuno
        label: Nessun vincolo particolare
    - name: mobilita
      type: select
      required: true
      label:
        it: Vincoli geografici
      options:
      - value: casa
        label: Resto vicino a casa
      - value: regione
        label: Nella mia regione
      - value: italia
        label: Tutta Italia
      - value: estero
        label: Anche all'estero
    - name: regioni
      type: text
      maxLength: 120
      label:
        it: Regioni o città preferite (facoltativo)
    - name: note
      type: textarea
      maxLength: 400
      label:
        it: Altro che vuoi dirci (facoltativo)
  data:
    collections:
    - name: report
      ownedBy: user
      description: Report di orientamento dello studente (consegnati dopo revisione)
    - name: colloqui
      ownedBy: user
      description: Colloqui prenotati dal mentor con lo studente
      fields:
      - name: data
        type: date
        required: true
      - name: modalita
        type: select
        options:
        - in presenza
        - online
      - name: note
        type: textarea
    - name: avanzamento_classe
      ownedBy: app
      description: 'Avanzamento aggregato per classe: questionari compilati, report revisionati, colloqui. Nessun dato individuale.'
      fields:
      - name: scuola
        type: text
      - name: classe
        type: text
      - name: iscritti
        type: number
      - name: questionari
        type: number
      - name: report_consegnati
        type: number
      - name: colloqui
        type: number
  views:
  - key: home
    type: page
    nav: false
    title: BussolaFutura
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow:
        it: Orientamento per le scuole superiori
      title:
        it: 'Trova il tuo percorso: **università** e lavoro, con i dati.'
      text:
        it: 'Rispondi a un questionario: una squadra di agenti AI incrocia i dati aperti sui corsi di laurea e sull''occupazione
          dei laureati e ti prepara cinque percorsi su misura, rivisti da un mentor.'
      actions:
      - label:
          it: Accedi con l'invito della scuola
        href: /login
        style: primary
      - label:
          it: Come funziona
        href: '#come-funziona'
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
      items:
      - title:
          it: Questionario
        text:
          it: Interessi, materie, voti, ambizioni, vincoli economici e geografici.
        badge: 📝
      - title:
          it: Analisi dei dati
        text:
          it: Gli agenti consultano MUR, USTAT e ISTAT e scelgono cinque percorsi.
        badge: 📊
      - title:
          it: Revisione del mentor
        text:
          it: Il mentor della tua scuola controlla il report prima della consegna.
        badge: 🧑‍🏫
      - title:
          it: Chat e colloquio
        text:
          it: Fai domande all'assistente e, se serve, prenota un colloquio.
        badge: 💬
    - type: cards
      id: fonti
      title:
        it: Fonti dei dati
      items:
      - title: MUR e USTAT
        text:
          it: Corsi di laurea, atenei, iscritti. Dati aperti, licenza IODL 2.0.
      - title: ISTAT
        text:
          it: Occupazione e retribuzioni dei laureati. Licenza CC BY 3.0 IT.
    - type: note
      content:
        it: BussolaFutura è uno strumento di supporto alla scelta, non una garanzia di esiti. Accesso solo su invito della
          scuola. Ogni studente vede solo i propri dati; il docente referente vede solo dati aggregati.
  - key: nuovo
    type: new_run
    title:
      it: Nuovo questionario
    roles:
    - studente
  - key: miei_report
    type: history
    title:
      it: I miei report
    source: run
    roles:
    - studente
  - key: rapporto
    type: report
    source: run
    printable: true
    nav: false
  - key: assistente_chat
    type: chat
    title:
      it: Assistente di orientamento
    source: agent:assistente
    examples:
    - Che differenza c'è tra Economia e Management?
    - Come funziona il test di ingresso a Medicina?
    - Quali borse di studio posso chiedere?
    placeholder:
      it: Scrivi la tua domanda…
    roles:
    - studente
  - key: revisioni
    type: approvals
    title:
      it: Report da rivedere
    approvals:
    - revisione_mentor
    roles:
    - mentor
  - key: colloqui_lista
    type: table
    title:
      it: Colloqui
    source: collection:colloqui
    data:
      display: table
      fields:
      - key: data
        label: Data
        format: date
      - key: modalita
        label: Modalità
      - key: note
        label: Note
      sort:
        field: data
        dir: asc
      empty:
        it: Nessun colloquio prenotato.
    roles:
    - mentor
    - studente
  - key: classe
    type: page
    title:
      it: Avanzamento della classe
    roles:
    - docente
    sections:
    - type: data
      source: collection:avanzamento_classe
      display: kpi
      kpis:
      - label: Studenti iscritti
        agg: sum
        field: iscritti
        format: number
      - label: Questionari compilati
        agg: sum
        field: questionari
        format: number
      - label: Report consegnati
        agg: sum
        field: report_consegnati
        format: number
      - label: Colloqui
        agg: sum
        field: colloqui
        format: number
    - type: data
      title:
        it: Per classe
      source: collection:avanzamento_classe
      display: table
      fields:
      - key: classe
        label: Classe
      - key: iscritti
        label: Iscritti
        format: number
      - key: questionari
        label: Questionari
        format: number
      - key: report_consegnati
        label: Report
        format: number
      - key: colloqui
        label: Colloqui
        format: number
      sort:
        field: classe
        dir: asc
      empty:
        it: Ancora nessun dato.
  - key: account
    type: account
    title:
      it: Abbonamento della scuola
    roles:
    - docente
    - admin
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 0
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:orientatore:
        estimate: 150
        metered: true
      chat: 2
    plans:
    - key: scuola_50
      price: 490
      interval: year
      label: Scuola fino a 50 studenti
      credits: 10000
      creditsReset: never
      roles:
      - docente
    - key: scuola_150
      price: 1290
      interval: year
      label: Scuola fino a 150 studenti
      credits: 30000
      creditsReset: never
      roles:
      - docente
    - key: scuola_400
      price: 2990
      interval: year
      label: Scuola fino a 400 studenti
      credits: 80000
      creditsReset: never
      roles:
      - docente
  extensions:
  - key: assegnazione_scuole
    description: Collegare studenti, mentor e docente alla stessa scuola/classe (inviti con scuola e classe), così che il
      mentor veda solo i report dei suoi studenti e il docente solo l'aggregato della sua scuola. Oggi i report sono dello
      studente e la collezione avanzamento_classe va popolata e filtrata per scuola da codice.
  - key: limite_studenti
    description: Il numero di studenti invitabili per scuola va fatto rispettare in base al piano acquistato.
  - key: prenotazione_colloqui
    description: La prenotazione del colloquio da parte del mentor sul calendario dello studente, e la visibilità reciproca,
      non sono generiche; mancano notifiche email di invito, promemoria e consegna del report approvato.
