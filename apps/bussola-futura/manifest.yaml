apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: bussolafutura
  displayName: BussolaFutura
  tagline:
    it: La bussola per scegliere università e lavoro dopo le superiori.
  description:
    it: Un questionario, una squadra di agenti che incrocia i dati aperti MUR, USTAT e ISTAT, un report personale rivisto
      da un mentor umano e un assistente per le tue domande.
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#17375e'
      accent: '#e07a1f'
      background: '#f7f9fc'
      foreground: '#18212b'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Bussola
      color: primary
    - text: Futura
      color: accent
    buttonShape: rounded
  header:
    links:
    - label:
        it: Come funziona
      href: '#come-funziona'
    - label:
        it: Fonti dei dati
      href: '#fonti'
    - label:
        it: Per le scuole
      href: '#scuole'
    cta:
      label:
        it: Accedi
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Amministratore
      assignedBy: admin_emails
    - key: student
      label:
        it: Studente
      assignedBy: invite
    - key: mentor
      label:
        it: Mentor
      assignedBy: invite
    - key: teacher
      label:
        it: Docente referente
      assignedBy: invite
  limits:
  - action: agent:orientatore
    per: user
    max: 2
    window: total
    roles:
    - student
  - action: chat
    per: user
    max: 40
    window: day
    roles:
    - student
  egress:
    hosts:
    - dati-ustat.mur.gov.it
    - esploradati.istat.it
    notes: Dati aperti MUR/USTAT sui corsi di laurea (licenza IODL 2.0, citare la fonte) e dati ISTAT su occupazione e retribuzioni
      dei laureati (CC BY 3.0 IT).
  agents:
  - key: orientatore
    role: main
    description: Legge il questionario dello studente, chiede i dati all'analista e scrive il report con cinque percorsi.
      Il report va al mentor per la revisione.
    delegates:
    - analista
    profile:
      inline:
        display_name: Orientatore BussolaFutura
        crews:
        - id: orientatore
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un orientatore scolastico e universitario che scrive per uno studente di scuola superiore italiano.
            Ricevi le risposte al questionario (interessi, materie, voti, ambizioni, vincoli economici e geografici). Per
            i dati reali chiami lo strumento ask_analista descrivendo i corsi di laurea candidati e le regioni di interesse:
            l''analista consulta i dati aperti MUR/USTAT (corsi, atenei, iscritti) e ISTAT (occupazione e retribuzioni dei
            laureati) e ti restituisce cifre con fonte. Non inventare mai cifre, atenei o percentuali: se un dato manca, scrivilo.
            Non dare certezze sul futuro, parla di prospettive. Rispetta i vincoli economici e geografici indicati.


            Il report va SOLO al mentor per la revisione: lo studente non lo vede finché non è approvato. Il testo visibile
            della tua risposta deve quindi essere solo: "# Questionario inviato" seguito da una riga che dice che il mentor
            rivedrà il report e arriverà una email. Poi chiudi con un blocco finale JSON con questi campi: student_email,
            school, class, mentor_email, teacher_email (copiali dal contesto), title ("Il tuo report di orientamento"), status
            (sempre "in_revisione") e body. Il body è il report in Markdown, in italiano, con questa struttura: ''# Il tuo
            percorso: report di orientamento'', ''## Chi sei'' (sintesi di interessi, punti di forza, vincoli), ''## I cinque
            percorsi consigliati'' con per ciascuno un ''### '' contenente: perché è adatto a te, pro, contro, atenei che
            lo offrono (con città e se coerenti con il vincolo geografico), costo indicativo rispetto al budget, prospettive
            di lavoro (tasso di occupazione e retribuzione dei laureati ISTAT con anno), poi ''## Confronto'' con una tabella
            e un grafico, ''## Prossimi passi'' (open day, test di ammissione, borse di studio), ''## Fonti'' (MUR/USTAT licenza
            IODL 2.0, ISTAT) e una riga di avvertenza: il report è un supporto alla decisione, non una garanzia. Per il confronto
            aggiungi un blocco ```chart con JSON {"type":"bar","title":"…","labels":[…],"series":[{"name":"…","values":[…]}],"unit":"%"}
            solo con dati reali.'
    goalTemplate: 'Studente: {email}

      Scuola: {scuola}, classe {classe}. Mentor: {mentor}. Docente referente: {docente}.

      Interessi: {interessi}

      Materie preferite: {materie}

      Voti: {voti_label}

      Ambizioni: {ambizioni}

      Budget familiare per l''università: {budget_label}

      Mobilità: {mobilita_label}

      {?note}Altre note: {note}{/note}

      Oggi è {date}. Scrivi in lingua {lang}.'
    context:
    - key: email
      from: user.email
    - key: scuola
      from: collection:students.school
    - key: classe
      from: collection:students.class
    - key: mentor
      from: collection:students.mentor_email
    - key: docente
      from: collection:students.teacher_email
    output: final_block
    resultSchema:
      type: object
      required:
      - student_email
      - title
      - status
      - body
      properties:
        student_email:
          type: string
        school:
          type: string
        class:
          type: string
        mentor_email:
          type: string
        teacher_email:
          type: string
        title:
          type: string
        status:
          type: string
        body:
          type: string
    writesTo:
      collection: drafts
      parse: final_block
      keyBy: student_email
    limits:
      maxTurns: 12
      maxBudgetUsd: 1.0
      timeoutSeconds: 600
  - key: analista
    role: helper
    description: Consulta i dati aperti MUR/USTAT e ISTAT e restituisce cifre con fonte.
    profile:
      inline:
        display_name: Analista dati BussolaFutura
        crews:
        - id: analista
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un analista di dati pubblici sull''istruzione superiore e il lavoro in Italia. Ricevi una richiesta
            su corsi di laurea e regioni. Usi mur_ustat_cerca per trovare i dataset e le risorse del portale open data MUR/USTAT
            (API CKAN: package_search con parametro q, ad es. q=iscritti corsi di studio atenei) e istat_dati per i dati ISTAT
            (servizio SDMX: usa path come data/<flusso>/<chiave> e query come startPeriod=2020&format=jsondata; cerca flussi
            su occupazione e retribuzione dei laureati). Restituisci una lista breve: per ogni corso gli atenei, le città,
            gli iscritti o immatricolati se disponibili, il tasso di occupazione e la retribuzione dei laureati con anno e
            fonte. Se un dato non è raggiungibile scrivi ''dato non disponibile''; non stimare e non inventare mai. Cita sempre
            la fonte: MUR/USTAT (IODL 2.0), ISTAT.'
          mcp_servers: []
    appTools:
    - name: mur_ustat_cerca
      description: Cerca dataset sui corsi di laurea nel portale open data MUR/USTAT (CKAN package_search)
      action: http
      http:
        method: GET
        url: https://dati-ustat.mur.gov.it/api/3/action/package_search
        attribution: MUR/USTAT, licenza IODL 2.0
    - name: istat_dati
      description: Interroga i dati ISTAT (SDMX REST) su occupazione e retribuzioni dei laureati
      action: http
      http:
        method: GET
        url: https://esploradati.istat.it/SDMXWS/rest
        allowPath: true
        attribution: ISTAT, CC BY 3.0 IT
    output: markdown
    limits:
      maxTurns: 10
      maxBudgetUsd: 0.6
  - key: assistente
    role: helper
    description: 'Assistente di orientamento in chat: risponde alle domande dello studente a partire dal suo report approvato.'
    memory: user
    profile:
      inline:
        display_name: Assistente di orientamento
        chat_mode: true
        crews:
        - id: assistente
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 4
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''assistente di orientamento di BussolaFutura e parli con uno studente di scuola superiore:
            tono chiaro, rispettoso, incoraggiante e concreto, in italiano. Rispondi a partire dal report approvato dello
            studente (se non c''è ancora, dillo e spiega che il mentor lo sta rivedendo). Aiuta a confrontare percorsi, capire
            test di ammissione, borse di studio e sbocchi. Non inventare cifre né scadenze: se non le conosci, dillo e indica
            il sito dell''ateneo o il mentor. Non dare garanzie sul futuro e non decidere al posto dello studente. Se lo studente
            vuole parlare con il mentor, suggerisci la pagina ''Prenota un colloquio''.'
    goalTemplate: 'Conversazione finora:

      {history}


      Report approvato dello studente:

      {report}


      Nuovo messaggio: {message}'
    context:
    - key: report
      from: collection:drafts
    output: markdown
  inputForm:
    title:
      it: Questionario di orientamento
    fields:
    - name: interessi
      type: textarea
      required: true
      maxLength: 800
      label:
        it: Cosa ti appassiona?
      help:
        it: Hobby, attività, argomenti che ti incuriosiscono
    - name: materie
      type: multiselect
      required: true
      label:
        it: Materie preferite
      options:
      - value: matematica
        label: Matematica
      - value: fisica
        label: Fisica
      - value: chimica_biologia
        label: Chimica e biologia
      - value: informatica
        label: Informatica
      - value: italiano_storia
        label: Italiano e storia
      - value: lingue
        label: Lingue
      - value: filosofia
        label: Filosofia
      - value: economia_diritto
        label: Economia e diritto
      - value: arte_design
        label: Arte e design
      - value: scienze_motorie
        label: Scienze motorie
    - name: voti
      type: select
      required: true
      label:
        it: Media dei voti
      options:
      - value: sotto6
        label: Sotto il 6
      - value: '6_7'
        label: Tra 6 e 7
      - value: '7_8'
        label: Tra 7 e 8
      - value: '8_9'
        label: Tra 8 e 9
      - value: sopra9
        label: Sopra il 9
    - name: ambizioni
      type: textarea
      required: true
      maxLength: 800
      label:
        it: Che lavoro o che vita immagini tra 10 anni?
    - name: budget
      type: select
      required: true
      label:
        it: Budget della famiglia per l'università
      options:
      - value: basso
        label: 'Limitato: servono borse e alloggi economici'
      - value: medio
        label: 'Medio: posso sostenere un fuorisede'
      - value: alto
        label: Nessun vincolo particolare
    - name: mobilita
      type: select
      required: true
      label:
        it: Dove puoi studiare?
      options:
      - value: casa
        label: Solo vicino a casa (pendolare)
      - value: regione
        label: Nella mia regione
      - value: italia
        label: Ovunque in Italia
      - value: estero
        label: Anche all'estero
    - name: note
      type: textarea
      maxLength: 400
      label:
        it: Altro che vuoi dirci (facoltativo)
  data:
    collections:
    - name: students
      description: Profilo scolastico dello studente (nessuna risposta al questionario)
      ownedBy: user
      fields:
      - name: school
        type: text
        required: true
        label:
          it: Scuola
      - name: class
        type: text
        required: true
        label:
          it: Classe
      - name: mentor_email
        type: email
        required: true
        label:
          it: Email del mentor della scuola
      - name: teacher_email
        type: email
        required: true
        label:
          it: Email del docente referente
    - name: drafts
      description: Report in revisione e approvati; lo studente vede solo quelli approvati
      ownedBy: org
      retentionDays: 730
      fields:
      - name: student_email
        type: email
      - name: school
        type: text
      - name: class
        type: text
      - name: mentor_email
        type: email
      - name: teacher_email
        type: email
      - name: title
        type: text
      - name: body
        type: textarea
      - name: status
        type: select
        label:
          it: Stato
        options:
        - value: in_revisione
          label: In revisione
        - value: approvato
          label: Approvato
        - value: da_rivedere
          label: Da rivedere
        default: in_revisione
      - name: mentor_notes
        type: textarea
        label:
          it: Note del mentor
      access:
      - role: student
        where:
          student_email: '{user.email}'
          status: approvato
        can:
        - read
      - role: mentor
        where:
          mentor_email: '{user.email}'
        can:
        - read
        - write
    - name: progress
      description: Avanzamento aggregabile per classe, senza contenuti dei report
      ownedBy: org
      retentionDays: 730
      fields:
      - name: student_email
        type: email
      - name: school
        type: text
      - name: class
        type: text
      - name: teacher_email
        type: email
      - name: stage
        type: text
      access:
      - role: teacher
        where:
          teacher_email: '{user.email}'
        can:
        - read
    - name: mentors
      description: Mentor prenotabili
      ownedBy: shared
      fields:
      - name: name
        type: text
      - name: email
        type: email
    - name: appointments
      description: Colloqui prenotati con il mentor
      ownedBy: user
      fields:
      - name: notes
        type: textarea
        label:
          it: Di cosa vuoi parlare?
  views:
  - key: home
    type: page
    title: BussolaFutura
    nav: false
    sections:
    - type: hero
      eyebrow:
        it: Orientamento per le scuole superiori
      title:
        it: Trova la tua strada con **dati veri**, non a caso.
      text:
        it: 'Rispondi a un questionario: un team di agenti AI incrocia i dati ufficiali su corsi, atenei, occupazione e stipendi
          e prepara per te cinque percorsi. Un mentor della tua scuola rivede il report prima che lo ricevi.'
      actions:
      - label:
          it: Accedi con l'invito della scuola
        href: /login
        style: primary
      - label:
          it: Come funziona
        href: '#come-funziona'
        style: ghost
      note:
        it: Serve l'invito della tua scuola.
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
      items:
      - title:
          it: Questionario
        text:
          it: Interessi, materie, voti, ambizioni, vincoli economici e geografici.
        badge: 📝
      - title:
          it: Analisi dei dati
        text:
          it: Gli agenti consultano i dati aperti sui corsi di laurea e sul lavoro dei laureati.
        badge: 📊
      - title:
          it: Revisione del mentor
        text:
          it: Una persona esperta controlla il report prima della consegna.
        badge: 🧑‍🏫
      - title:
          it: Report e chat
        text:
          it: Ricevi cinque percorsi con pro, contro, atenei e prospettive; poi fai domande all'assistente o prenota un colloquio.
        badge: 💬
    - type: cards
      id: fonti
      title:
        it: Fonti dei dati
      items:
      - title: MUR / USTAT
        text:
          it: Corsi di laurea, atenei, iscritti. Dati aperti, licenza IODL 2.0.
      - title: ISTAT
        text:
          it: Occupazione e retribuzioni dei laureati.
    - type: cards
      id: scuole
      title:
        it: Per le scuole
      intro:
        it: Abbonamento annuale in base al numero di studenti. Il docente referente vede l'avanzamento della classe in forma
          aggregata, il mentor i report dei suoi studenti, lo studente solo il proprio.
      items:
      - title:
          it: Privacy
        text:
          it: I dati personali sono conservati per un tempo limitato e visibili solo a chi serve.
    - type: note
      content:
        it: BussolaFutura è un supporto alla decisione, non una garanzia sul futuro. I dati sono quelli pubblicati dalle fonti
          ufficiali citate nei report.
  - key: profile
    type: form
    title:
      it: La mia scuola
    collection: students
    edit: false
    submit:
      label:
        it: Salva
      message:
        it: Profilo salvato. Ora puoi compilare il questionario.
      redirect: new
    roles:
    - student
  - key: new
    type: new_run
    title:
      it: Questionario
    roles:
    - student
  - key: reports
    type: cards
    title:
      it: Il mio report
    source: collection:drafts
    columns:
    - title
    - body
    - status
    printable: true
    roles:
    - student
  - key: coach
    type: chat
    title:
      it: Chiedi all'assistente
    source: agent:assistente
    examples:
    - it: Quale dei cinque percorsi ha più sbocchi?
    - it: Come mi preparo al test di ammissione?
    - it: Ci sono borse di studio per il mio budget?
    placeholder:
      it: Scrivi la tua domanda…
    roles:
    - student
  - key: book
    type: booking
    title:
      it: Prenota un colloquio
    collection: appointments
    resources: collection:mentors
    fields:
    - notes
    slots:
      days:
      - 1
      - 2
      - 3
      - 4
      - 5
      from: '14:00'
      to: '18:00'
      minutes: 30
      tz: Europe/Rome
      aheadDays: 21
      minNoticeHours: 24
      capacity: 1
    roles:
    - student
  - key: to_review
    type: table
    title:
      it: Report da rivedere
    source: collection:drafts
    columns:
    - student_email
    - class
    - title
    - status
    - body
    roles:
    - mentor
  - key: review
    type: form
    title:
      it: Revisione del report
    collection: drafts
    fields:
    - body
    - status
    - mentor_notes
    edit: true
    submit:
      label:
        it: Salva revisione
      message:
        it: Revisione salvata. Se approvato, lo studente riceve una email.
      redirect: to_review
    nav: false
    roles:
    - mentor
  - key: class_progress
    type: dashboard
    title:
      it: Avanzamento della classe
    children:
    - progress_stage
    - progress_class
    roles:
    - teacher
  - key: progress_stage
    type: chart
    title:
      it: Per stato
    source: collection:progress
    data:
      display: chart
      chart: pie
      fields:
      - key: stage
        label:
          it: Stato
      - key: n
        label:
          it: Studenti
      groupBy:
        field: stage
        aggs:
        - key: n
          agg: count
    nav: false
  - key: progress_class
    type: table
    title:
      it: Per classe
    source: collection:progress
    data:
      display: table
      fields:
      - key: class
        label:
          it: Classe
      - key: n
        label:
          it: Studenti con questionario
      groupBy:
        field: class
        aggs:
        - key: n
          agg: count
    nav: false
  - key: schools
    type: table
    title:
      it: Report di tutte le scuole
    source: collection:drafts
    columns:
    - school
    - class
    - status
    export: true
    roles:
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento della scuola
    roles:
    - teacher
    - admin
  triggers:
  - key: nuovo_report
    description: Avvisa il mentor che c'è un report da rivedere
    'on':
      collection: drafts
      op: insert
    notify:
      to: record.mentor_email
      subject:
        it: 'Nuovo report da rivedere: {record.student_email}'
      body:
        it: Un nuovo report di orientamento è pronto per la tua revisione.
      link: to_review
  - key: report_approvato
    'on':
      collection: drafts
      op: update
      where:
        status: approvato
    notify:
      to: record.student_email
      subject:
        it: Il tuo report di orientamento è pronto
      body:
        it: Il tuo mentor ha rivisto il report. Puoi leggerlo e fare domande all'assistente.
      link: reports
  - key: avanzamento
    description: Tiene aggiornato l'avanzamento aggregabile per il docente
    'on':
      collection: drafts
      op: any
    write:
      collection: progress
      fields:
        student_email: student_email
        school: school
        class: class
        teacher_email: teacher_email
        stage: status
      keyBy: student_email
  - key: colloquio_confermato
    'on':
      collection: appointments
      op: insert
    notify:
      to: owner
      subject:
        it: Colloquio con il mentor confermato
      body:
        it: Il tuo colloquio è stato prenotato.
      link: book
  - key: colloquio_promemoria
    'on':
      date:
        collection: appointments
        field: start
        offsetDays: -1
        hour: 7
    notify:
      to: owner
      subject:
        it: Domani hai il colloquio con il mentor
      body:
        it: Ricordati il colloquio di domani. Porta le tue domande sul report.
      link: book
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: scuola_100
      price: 900
      interval: year
      label:
        it: Scuola fino a 100 studenti
      includes:
      - fino a 100 studenti
      - mentor e docente referente inclusi
      roles:
      - teacher
    - key: scuola_300
      price: 2400
      interval: year
      label:
        it: Scuola fino a 300 studenti
      includes:
      - fino a 300 studenti
      - mentor e docente referente inclusi
      roles:
      - teacher
    - key: scuola_600
      price: 4200
      interval: year
      label:
        it: Scuola fino a 600 studenti
      includes:
      - fino a 600 studenti
      - mentor e docente referente inclusi
      roles:
      - teacher
  extensions:
  - key: seat_limit
    description: 'Il limite di studenti per piano scolastico (100/300/600) non è applicato automaticamente: l''amministratore
      invita gli studenti entro il numero acquistato.'
  - key: school_mentor_assignment
    description: L'assegnazione del mentor e del docente alla scuola avviene all'invito da parte dell'amministratore; lo studente
      indica nel profilo le email già comunicate dalla scuola.
