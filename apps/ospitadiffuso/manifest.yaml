apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: ospitadiffuso
  displayName: OspitaDiffuso
  tagline:
    it: Una rete di alloggi nei piccoli borghi, gestita come un unico hotel.
    en: A network of village stays, run like a single hotel.
    de: Ein Netz von Unterkünften in kleinen Dörfern, geführt wie ein einziges Hotel.
  description:
    it: 'Software per la rete OspitaDiffuso: gli ospiti cercano e prenotano, i proprietari registrano gli immobili, i gestori
      locali approvano e coordinano, l''admin vede l''occupazione. Pulizie e accoglienza sul posto sono dei partner locali.'
    en: 'Software for the OspitaDiffuso network: guests search and book, owners list their homes, local managers approve and
      coordinate, the admin sees occupancy. On-site cleaning and welcome are done by local partners.'
    de: 'Software für das OspitaDiffuso-Netz: Gäste suchen und buchen, Eigentümer erfassen ihre Häuser, lokale Verwalter prüfen
      und koordinieren, der Admin sieht die Auslastung. Reinigung und Empfang vor Ort übernehmen lokale Partner.'
  langs:
  - it
  - en
  - de
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#3b4a3a'
      accent: '#b5532f'
      background: '#f8f4ec'
      foreground: '#222622'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Ospita
      color: primary
    - text: Diffuso
      color: accent
    width: wide
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
        de: So funktioniert's
      href: '#come-funziona'
    - label:
        it: Alloggi
        en: Stays
        de: Unterkünfte
      href: /v/listings
    cta:
      label:
        it: Accedi
        en: Sign in
        de: Anmelden
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
      - listings
      - map
    roles:
    - key: admin
      label: Admin di rete
      assignedBy: admin_emails
    - key: owner
      label:
        it: Proprietario
        en: Owner
        de: Eigentümer
      assignedBy: invite
    - key: manager
      label:
        it: Gestore locale
        en: Local manager
        de: Lokaler Verwalter
      assignedBy: derived
      from: collection:properties.manager_email
    - key: user
      label:
        it: Ospite
        en: Guest
        de: Gast
      assignedBy: signup
  limits:
  - action: chat
    per: user
    max: 100
    window: day
  egress:
    hosts:
    - nominatim.openstreetmap.org
    notes: OpenStreetMap Nominatim geocoding of property addresses, within its usage policy (max 1 req/s, identify the app);
      data ODbL.
  agents:
  - key: concierge
    role: main
    description: 'Chat concierge for the guest: property info, territory, local events and experiences; reports issues to
      the local manager.'
    profile:
      inline:
        display_name: OspitaDiffuso concierge
        crews:
        - id: concierge
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the concierge of OspitaDiffuso, a network of stays in small Italian villages run like one
            hotel. You help the guest during their stay. Answer in the guest''s language (it, en or de). Use ONLY the tools:
            read_listing for the property (rules, amenities, services), read_events for opening hours, restaurants, and municipal
            events, read_experiences for local experiences offered by partners. The guest''s own bookings are in the context
            (stays). Never invent opening hours, prices, events or phone numbers: if a tool does not have it, say so and suggest
            asking the local manager. Suggest 1-3 local experiences when relevant, with the reason. Share the access code
            and arrival instructions only from the guest''s own stay. If the guest reports a problem (no hot water, noise,
            broken item, cleaning), call report_issue with the stay''s listing name, the manager_email of the stay, a short
            description and an urgency (low|normal|high), then tell the guest the local manager has been warned. Keep answers
            short and friendly. Do not give medical or legal advice; for emergencies give 112.'
    appTools:
    - name: read_listing
      description: Search the published stays of the network
      action: search
      collection: listings
      scope: all
    - name: read_events
      description: Local events, opening hours and restaurants from public municipal sources
      action: search
      collection: events
      scope: all
    - name: read_experiences
      description: Experiences proposed by local partners
      action: search
      collection: experiences
      scope: all
    - name: report_issue
      description: Open an issue for the local manager of the stay
      action: write
      collection: issues
      scope: all
    context:
    - key: stays
      from: collection:stays
    goalTemplate: 'Today is {date}. Reply in the language with ISO code {lang}.

      Guest: {user}

      Guest''s stays (JSON lines): {stays}

      Conversation so far:

      {history}

      New message: {message}'
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.4
  - key: publisher
    role: helper
    description: When a manager approves a property, publishes it in the catalogue and stores the private arrival data.
    profile:
      inline:
        display_name: OspitaDiffuso publisher
        crews:
        - id: publisher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You publish approved properties. Given the property data: 1) call geocode (GET, query q=<address>,
            <borgo>, Italy, format=json, limit=1) once to get lat and lon; if it fails leave them empty. 2) call write_listing
            once with: name, borgo, lat, lon (numbers), beds, amenities, rules, price_night, owner_email, manager_email and
            a 2-sentence description in Italian written only from the given data. 3) call write_arrival_info once with listing_name,
            instructions (the arrival instructions, verbatim), owner_email, manager_email. Never put arrival instructions
            in the listing. Never invent data. Finish with a one-line summary.'
    appTools:
    - name: geocode
      description: Geocode an address with OpenStreetMap Nominatim
      action: http
      http:
        method: GET
        url: https://nominatim.openstreetmap.org/search
        attribution: © OpenStreetMap contributors, ODbL
    - name: write_listing
      description: Create the public catalogue entry
      action: write
      collection: listings
      scope: all
    - name: write_arrival_info
      description: Store the private arrival instructions of a listing
      action: write
      collection: arrival_info
      scope: all
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.3
  - key: arrival
    role: helper
    description: When a stay is paid, computes the total, creates the access code and the arrival instructions.
    profile:
      inline:
        display_name: OspitaDiffuso arrival
        crews:
        - id: arrival
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You prepare a paid stay. Given the stay record: call find_listing with its listing name to get price_night,
            owner_email, manager_email; call find_arrival_info for the instructions. Compute nights = check_out minus check_in
            (dates YYYY-MM-DD) and total = nights x price_night. Pick a random 6-digit access code. Then call update_stay
            once with the stay''s id and: nights, total, owner_email, manager_email, access_code, arrival_instructions (the
            instructions plus the code and the check-in date), and status "ready". If data is missing or the dates are invalid,
            do not set "ready": set status "problem" and say why. Never invent prices.'
    appTools:
    - name: find_listing
      description: Read the published listing
      action: search
      collection: listings
      scope: all
    - name: find_arrival_info
      description: Read the private arrival instructions
      action: search
      collection: arrival_info
      scope: all
    - name: update_stay
      description: Update the stay record
      action: write
      collection: stays
      scope: all
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.2
  - key: events_scout
    role: scheduled
    description: Weekly collects events, opening hours and restaurants from the public municipal pages of each village.
    profile:
      inline:
        display_name: OspitaDiffuso events scout
        crews:
        - id: events_scout
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: You keep the territory information of the network up to date. Call list_borghi; for each village
            read its source_url (public municipal pages) through the WebRobot MCP (scrape the page; build and run a pipeline
            only if needed). Extract events of the next 45 days, market days, and listed restaurants/shops with opening hours,
            only what is written on the page. For each item call add_event with borgo, type (event|restaurant|service|market),
            title, date (YYYY-MM-DD, empty if recurring), details (hours, place), url. Do not invent anything; skip a village
            whose page cannot be read. Respect the sites' terms and robots rules. Finish with a short count per village.
    appTools:
    - name: list_borghi
      description: The villages of the network with their public source pages
      action: read
      collection: borghi
      scope: all
    - name: add_event
      description: Add a territory item
      action: append
      collection: events
      scope: all
    goalTemplate: Today is {date}. Update the events and local information of every village.
    output: markdown
    limits:
      maxTurns: 40
      maxBudgetUsd: 1.5
  - key: pricer
    role: helper
    description: Suggests the nightly price to the owner by season and events; the owner always confirms.
    memory: instance
    awaits:
    - price_confirm
    writesTo:
      collection: price_suggestions
      parse: whole
    profile:
      inline:
        display_name: OspitaDiffuso pricing advisor
        crews:
        - id: pricer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You advise a property owner on the price per night. MODE A (suggestion, the goal names a property):
            read the property with read_property, similar stays with read_listings (same borgo), events with read_events for
            the next 90 days. Reason on seasonality (high season, weekends, holidays) and events, never on invented market
            data. Write the report: start with "# Prezzo suggerito — <property> — <date>", then ## Base e stagionalità, ##
            Eventi che pesano, ## Proposta (a small table by period with price per night in EUR and a one-line reason), ##
            Rischi. Add a chart block ```chart {"type":"bar",...}``` of the proposed prices by period. Say clearly these are
            suggestions and that the owner decides. Then call request_price_confirm once with property, suggested_price (the
            standard price per night) and rationale. NEVER change a price yourself in this mode. Your memory holds the last
            confirmed price and reasons: mention what changed; at the end call remember with 5 key points. MODE B (the goal
            contains an approval decision "approved"): apply the approved price with set_property_price and set_listing_price
            (same listing name), then reply with one line. If rejected, do nothing.'
    appTools:
    - name: read_property
      description: The owner's own property records
      action: read
      collection: properties
      scope: user
    - name: read_listings
      description: Published listings, for comparison
      action: search
      collection: listings
      scope: all
    - name: read_events
      description: Territory events
      action: search
      collection: events
      scope: all
    - name: set_property_price
      description: Set price_night of the owner's property after approval
      action: write
      collection: properties
      scope: user
    - name: set_listing_price
      description: Set price_night in the published listing after approval
      action: write
      collection: listings
      scope: all
    goalTemplate: 'Today is {date}. Property: {instance}. Write in the language with ISO code {lang}.'
    output: markdown
    limits:
      maxTurns: 10
      maxBudgetUsd: 0.5
  templates:
  - key: price_watch
    title:
      it: Prezzo consigliato
      en: Price advisor
      de: Preisberater
    description:
      it: Ogni settimana un suggerimento di prezzo per notte per un tuo immobile. Il prezzo lo confermi tu.
      en: Every week a nightly price suggestion for one of your properties. You confirm the price.
      de: Jede Woche ein Preisvorschlag pro Nacht für Ihr Objekt. Den Preis bestätigen Sie.
    agent: pricer
    params:
    - name: property
      type: select
      required: true
      optionsFrom: collection:properties
      label:
        it: Immobile
        en: Property
        de: Objekt
    goal: Suggest the price per night for the property {property} (instance "{instance}"). Today is {date}. Write in the language
      with ISO code {lang}.
    schedule:
      cron: 0 6 * * 1
      userCanChange: true
    maxPerUser: 10
    roles:
    - owner
    - admin
  approvals:
  - key: price_confirm
    title:
      it: Conferma il prezzo per notte
      en: Confirm the nightly price
      de: Preis pro Nacht bestätigen
    decidedBy: requester
    fields:
    - property
    - suggested_price
    - rationale
  data:
    collections:
    - name: borghi
      description: Villages of the network with their public municipal source pages
      ownedBy: shared
      fields:
      - name: name
        type: text
        required: true
      - name: region
        type: text
      - name: description
        type: textarea
      - name: source_url
        type: url
      - name: lat
        type: number
      - name: lon
        type: number
    - name: properties
      description: Properties registered by their owners; the local manager approves after a survey
      ownedBy: user
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome dell'alloggio
          en: Property name
          de: Name der Unterkunft
      - name: borgo
        type: select
        required: true
        optionsFrom: collection:borghi
        label:
          it: Borgo
          en: Village
          de: Dorf
      - name: address
        type: text
        required: true
        label:
          it: Indirizzo
          en: Address
          de: Adresse
      - name: beds
        type: number
        required: true
        label:
          it: Posti letto
          en: Beds
          de: Schlafplätze
      - name: amenities
        type: multiselect
        options:
        - value: wifi
          label: Wi-Fi
        - value: kitchen
          label:
            it: Cucina
            en: Kitchen
            de: Küche
        - value: heating
          label:
            it: Riscaldamento
            en: Heating
            de: Heizung
        - value: parking
          label:
            it: Parcheggio
            en: Parking
            de: Parkplatz
        - value: pets
          label:
            it: Animali ammessi
            en: Pets allowed
            de: Haustiere erlaubt
        - value: fireplace
          label:
            it: Camino
            en: Fireplace
            de: Kamin
        label:
          it: Servizi
          en: Amenities
          de: Ausstattung
      - name: rules
        type: textarea
        label:
          it: Regole della casa
          en: House rules
          de: Hausregeln
      - name: photos
        type: file
        accept:
        - jpg
        - jpeg
        - png
        - webp
        maxMb: 10
        multiple: true
        label:
          it: Foto
          en: Photos
          de: Fotos
      - name: availability
        type: textarea
        label:
          it: Calendario di disponibilità (periodi liberi)
          en: Availability calendar (open periods)
          de: Verfügbarkeitskalender (freie Zeiträume)
      - name: arrival_instructions
        type: textarea
        label:
          it: Istruzioni di arrivo (private)
          en: Arrival instructions (private)
          de: Anreiseanweisungen (privat)
      - name: price_night
        type: number
        label:
          it: Prezzo per notte (EUR)
          en: Price per night (EUR)
          de: Preis pro Nacht (EUR)
      - name: owner_email
        type: email
        required: true
        label:
          it: Email del proprietario
          en: Owner email
          de: E-Mail des Eigentümers
      - name: manager_email
        type: email
        required: true
        label:
          it: Email del gestore locale del borgo
          en: Local manager email
          de: E-Mail des lokalen Verwalters
      - name: status
        type: select
        default: submitted
        options:
        - submitted
        - approved
        - rejected
      - name: survey_notes
        type: textarea
        label:
          it: Note del sopralluogo
          en: Survey notes
          de: Notizen der Besichtigung
      access:
      - role: manager
        where:
          manager_email: '{user.email}'
        can:
        - read
        - write
    - name: listings
      description: Published stays everyone can search (no private data)
      ownedBy: shared
      fields:
      - name: name
        type: text
      - name: borgo
        type: text
      - name: description
        type: textarea
      - name: lat
        type: number
      - name: lon
        type: number
      - name: beds
        type: number
      - name: amenities
        type: text
      - name: rules
        type: textarea
      - name: price_night
        type: number
      - name: owner_email
        type: email
      - name: manager_email
        type: email
    - name: arrival_info
      description: Private arrival instructions per listing, read only by the app's agents
      ownedBy: org
      fields:
      - name: listing_name
        type: text
      - name: instructions
        type: textarea
      - name: owner_email
        type: email
      - name: manager_email
        type: email
    - name: stays
      description: Bookings of the guests
      ownedBy: user
      retentionDays: 730
      fields:
      - name: listing
        type: relation
        relation: listings
        required: true
        label:
          it: Alloggio
          en: Stay
          de: Unterkunft
      - name: check_in
        type: date
        required: true
        label:
          it: Arrivo
          en: Check-in
          de: Anreise
      - name: check_out
        type: date
        required: true
        label:
          it: Partenza
          en: Check-out
          de: Abreise
      - name: guests
        type: number
        required: true
        label:
          it: Ospiti
          en: Guests
          de: Gäste
      - name: notes
        type: textarea
        label:
          it: Note
          en: Notes
          de: Notizen
      - name: status
        type: select
        default: requested
        options:
        - requested
        - paid
        - ready
        - problem
        - cancelled
      - name: nights
        type: number
      - name: total
        type: number
      - name: owner_email
        type: email
      - name: manager_email
        type: email
      - name: access_code
        type: text
      - name: arrival_instructions
        type: textarea
      access:
      - role: owner
        where:
          owner_email: '{user.email}'
      - role: manager
        where:
          manager_email: '{user.email}'
    - name: issues
      description: Reports and daily tasks for the local managers
      ownedBy: org
      retentionDays: 365
      fields:
      - name: listing_name
        type: text
      - name: manager_email
        type: email
      - name: description
        type: textarea
      - name: urgency
        type: select
        options:
        - low
        - normal
        - high
      - name: status
        type: select
        default: open
        options:
        - open
        - done
      access:
      - role: manager
        where:
          manager_email: '{user.email}'
        can:
        - read
        - write
    - name: events
      description: Events, opening hours and restaurants from public municipal sources
      ownedBy: shared
      retentionDays: 120
      fields:
      - name: borgo
        type: text
      - name: type
        type: select
        options:
        - event
        - restaurant
        - service
        - market
      - name: title
        type: text
      - name: date
        type: date
      - name: details
        type: textarea
      - name: url
        type: url
    - name: experiences
      description: Experiences offered by local partners
      ownedBy: shared
      fields:
      - name: borgo
        type: text
      - name: title
        type: text
        required: true
      - name: description
        type: textarea
      - name: price
        type: number
      - name: season
        type: text
      - name: partner_contact
        type: text
    - name: price_suggestions
      description: Weekly price suggestions of each price advisor instance
      ownedBy: instance
  views:
  - key: home
    type: page
    nav: false
    title: OspitaDiffuso
    sections:
    - type: hero
      layout: stack
      band: true
      eyebrow:
        it: Alloggi diffusi nei borghi
        en: Village stays
        de: Verstreute Unterkünfte in Dörfern
      title:
        it: Un borgo intero, **un solo hotel**.
        en: A whole village, **one hotel**.
        de: Ein ganzes Dorf, **ein einziges Hotel**.
      text:
        it: Cerca per borgo e date, scegli l'alloggio sulla mappa, prenota e paga con carta. Riceverai le istruzioni di arrivo
          e il codice di accesso, e un concierge AI ti accompagna durante il soggiorno.
        en: Search by village and dates, pick a home on the map, book and pay by card. You get arrival instructions and an
          access code, and an AI concierge helps during your stay.
        de: Suchen Sie nach Dorf und Datum, wählen Sie auf der Karte, buchen und zahlen Sie per Karte. Sie erhalten Anreiseinfos
          und einen Zugangscode, und ein KI-Concierge begleitet Sie.
      actions:
      - label:
          it: Cerca alloggi
          en: Find stays
          de: Unterkünfte finden
        href: /v/listings
        style: primary
      - label:
          it: Accedi
          en: Sign in
          de: Anmelden
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
        de: So funktioniert's
      items:
      - title:
          it: Il proprietario registra
          en: Owner lists
          de: Eigentümer erfasst
        text:
          it: Foto, posti letto, servizi, regole e calendario.
          en: Photos, beds, amenities, rules and calendar.
          de: Fotos, Betten, Ausstattung, Regeln und Kalender.
        badge: 🏡
      - title:
          it: Il gestore locale approva
          en: Local manager approves
          de: Lokaler Verwalter genehmigt
        text:
          it: Dopo un sopralluogo l'alloggio entra nella rete.
          en: After a survey the home joins the network.
          de: Nach einer Besichtigung wird die Unterkunft aufgenommen.
        badge: ✅
      - title:
          it: L'ospite prenota
          en: Guest books
          de: Gast bucht
        text:
          it: Mappa, date, pagamento con carta, codice di accesso via email.
          en: Map, dates, card payment, access code by email.
          de: Karte, Daten, Kartenzahlung, Zugangscode per E-Mail.
        badge: 🗺️
      - title:
          it: Il concierge risponde
          en: The concierge helps
          de: Der Concierge hilft
        text:
          it: Orari, ristoranti, eventi del comune ed esperienze locali.
          en: Hours, restaurants, municipal events and local experiences.
          de: Öffnungszeiten, Restaurants, Gemeindeveranstaltungen und lokale Erlebnisse.
        badge: 💬
    - type: note
      content:
        it: 'Software di rete: pulizie, accoglienza e gestione fisica delle case sono svolte dai partner locali. Commissione
          sulle prenotazioni.'
        en: 'Network software: cleaning, welcome and physical management are done by local partners. Commission on bookings.'
        de: 'Netzwerk-Software: Reinigung, Empfang und physische Verwaltung übernehmen lokale Partner. Provision auf Buchungen.'
  - key: listings
    type: cards
    title:
      it: Alloggi
      en: Stays
      de: Unterkünfte
    source: collection:listings
    data:
      display: cards
      fields:
      - key: name
        label:
          it: Alloggio
          en: Stay
          de: Unterkunft
      - key: borgo
        label:
          it: Borgo
          en: Village
          de: Dorf
      - key: beds
        label:
          it: Posti letto
          en: Beds
          de: Betten
        format: number
      - key: price_night
        label:
          it: Per notte
          en: Per night
          de: Pro Nacht
        format: money
      - key: description
      sort:
        field: borgo
        dir: asc
      limit: 100
      empty:
        it: Nessun alloggio pubblicato.
        en: No stays published yet.
        de: Noch keine Unterkünfte veröffentlicht.
  - key: map
    type: map
    title:
      it: Mappa
      en: Map
      de: Karte
    source: collection:listings
    map:
      lat: lat
      lon: lon
      title: name
      popup:
      - borgo
      - beds
      - price_night
  - key: book
    type: form
    title:
      it: Prenota
      en: Book
      de: Buchen
    collection: stays
    fields:
    - listing
    - check_in
    - check_out
    - guests
    - notes
    submit:
      label:
        it: Prenota e paga
        en: Book and pay
        de: Buchen und bezahlen
      message:
        it: Prenotazione registrata. Dopo il pagamento riceverai le istruzioni di arrivo.
        en: Booking saved. After payment you will receive the arrival instructions.
        de: Buchung gespeichert. Nach der Zahlung erhalten Sie die Anreiseinfos.
      redirect: my_stays
    roles:
    - user
    - owner
    - admin
  - key: my_stays
    type: table
    title:
      it: Le mie prenotazioni
      en: My bookings
      de: Meine Buchungen
    source: collection:stays
    columns:
    - listing
    - check_in
    - check_out
    - guests
    - status
    - total
    - access_code
    roles:
    - user
    - owner
    - admin
  - key: concierge_chat
    type: chat
    title: Concierge
    source: agent:concierge
    placeholder:
      it: Chiedi al concierge…
      en: Ask the concierge…
      de: Fragen Sie den Concierge…
    examples:
    - it: Dove si cena stasera in paese?
      en: Where can I have dinner tonight?
      de: Wo kann ich heute Abend essen?
    - it: Ci sono eventi questo fine settimana?
      en: Any events this weekend?
      de: Gibt es dieses Wochenende Veranstaltungen?
    - it: Non c'è acqua calda
      en: There is no hot water
      de: Es gibt kein warmes Wasser
    roles:
    - user
    - owner
    - admin
  - key: property_new
    type: form
    title:
      it: Registra immobile
      en: List a property
      de: Objekt erfassen
    collection: properties
    edit: true
    submit:
      label:
        it: Invia per approvazione
        en: Submit for approval
        de: Zur Genehmigung senden
      message:
        it: Inviato. Il gestore locale fisserà un sopralluogo.
        en: Submitted. The local manager will schedule a survey.
        de: Gesendet. Der lokale Verwalter vereinbart eine Besichtigung.
      redirect: my_properties
    roles:
    - owner
    - admin
  - key: my_properties
    type: table
    title:
      it: I miei immobili
      en: My properties
      de: Meine Objekte
    source: collection:properties
    columns:
    - name
    - borgo
    - beds
    - price_night
    - status
    roles:
    - owner
    - manager
    - admin
  - key: property_review
    type: form
    title:
      it: Sopralluogo e approvazione
      en: Survey and approval
      de: Besichtigung und Genehmigung
    collection: properties
    fields:
    - status
    - survey_notes
    edit: true
    submit:
      label:
        it: Salva
        en: Save
        de: Speichern
    roles:
    - manager
    - admin
  - key: price_watches
    type: instances
    template: price_watch
    title:
      it: Prezzo consigliato
      en: Price advisor
      de: Preisberater
    roles:
    - owner
    - admin
  - key: price_approvals
    type: approvals
    title:
      it: Prezzi da confermare
      en: Prices to confirm
      de: Preise bestätigen
    approvals:
    - price_confirm
    roles:
    - owner
    - admin
  - key: earnings
    type: table
    title:
      it: Incassi
      en: Earnings
      de: Einnahmen
    source: collection:stays
    export: true
    data:
      display: table
      groupBy:
        field: check_in
        bucket: month
        aggs:
        - key: revenue
          agg: sum
          field: total
        - key: nights
          agg: sum
          field: nights
      fields:
      - key: check_in
        label:
          it: Mese
          en: Month
          de: Monat
        format: date
      - key: count
        label:
          it: Prenotazioni
          en: Bookings
          de: Buchungen
      - key: revenue
        label:
          it: Incassi lordi
          en: Gross revenue
          de: Bruttoeinnahmen
        format: money
      - key: nights
        label:
          it: Notti
          en: Nights
          de: Nächte
    roles:
    - owner
  - key: manager_today
    type: table
    title:
      it: Attività dei miei borghi
      en: Tasks in my villages
      de: Aufgaben in meinen Dörfern
    source: collection:stays
    columns:
    - listing
    - check_in
    - check_out
    - guests
    - status
    data:
      display: table
      sort:
        field: check_in
        dir: asc
      limit: 100
    roles:
    - manager
  - key: manager_issues
    type: table
    title:
      it: Segnalazioni
      en: Issues
      de: Meldungen
    source: collection:issues
    columns:
    - listing_name
    - description
    - urgency
    - status
    roles:
    - manager
    - admin
  - key: admin_dashboard
    type: page
    title:
      it: Occupazione
      en: Occupancy
      de: Auslastung
    roles:
    - admin
    sections:
    - type: data
      title:
        it: Numeri della rete
        en: Network numbers
        de: Netz in Zahlen
      source: collection:stays
      display: kpi
      kpis:
      - label:
          it: Prenotazioni
          en: Bookings
          de: Buchungen
        agg: count
      - label:
          it: Notti vendute
          en: Nights sold
          de: Verkaufte Nächte
        agg: sum
        field: nights
      - label:
          it: Volume lordo
          en: Gross volume
          de: Bruttovolumen
        agg: sum
        field: total
        format: money
    - type: data
      title:
        it: Notti per mese
        en: Nights per month
        de: Nächte pro Monat
      source: collection:stays
      display: chart
      chart: bar
      groupBy:
        field: check_in
        bucket: month
        aggs:
        - key: nights
          agg: sum
          field: nights
      fields:
      - key: check_in
      - key: nights
    - type: data
      title:
        it: Alloggi per borgo
        en: Stays per village
        de: Unterkünfte pro Dorf
      source: collection:listings
      display: chart
      chart: pie
      groupBy:
        field: borgo
        aggs: []
      fields:
      - key: borgo
      - key: count
  - key: account
    type: account
    title:
      it: Account e pagamenti
      en: Account and payments
      de: Konto und Zahlungen
    roles:
    - owner
    - user
  schedules:
  - cron: 0 5 * * 1
    agent: events_scout
    action: run
    owner: app
    goal: Update events, opening hours and restaurants of every village from the public municipal pages.
  triggers:
  - key: property_submitted
    'on':
      collection: properties
      op: insert
    notify:
      to:
      - record.manager_email
      - admins
      subject:
        it: 'Nuovo immobile da visitare: {record.name}'
        en: 'New property to survey: {record.name}'
        de: 'Neues Objekt zur Besichtigung: {record.name}'
      body:
        it: Un proprietario ha registrato {record.name}. Fissa il sopralluogo e approva o rifiuta l'inserimento.
        en: An owner listed {record.name}. Schedule the survey and approve or reject it.
        de: Ein Eigentümer hat {record.name} erfasst. Besichtigung planen und genehmigen oder ablehnen.
      link: property_review
  - key: property_approved_publish
    'on':
      collection: properties
      op: update
      where:
        status: approved
    start:
      agent: publisher
    asUser: false
    goal: 'Publish the approved property. name: {record.name}; borgo: {record.borgo}; address: {record.address}; beds: {record.beds};
      amenities: {record.amenities}; rules: {record.rules}; price_night: {record.price_night}; owner_email: {record.owner_email};
      manager_email: {record.manager_email}; arrival_instructions: {record.arrival_instructions}'
  - key: property_approved_mail
    'on':
      collection: properties
      op: update
      where:
        status: approved
    notify:
      to:
      - record.owner_email
      subject:
        it: '{record.name} è entrato nella rete'
        en: '{record.name} joined the network'
        de: '{record.name} ist im Netz'
      body:
        it: 'Dopo il sopralluogo il gestore locale ha approvato il tuo immobile: ora è visibile agli ospiti. Attiva il consulente
          prezzi per scegliere la tariffa per notte.'
        en: 'After the survey the local manager approved your property: guests can now see it. Turn on the price advisor to
          choose the nightly rate.'
        de: 'Nach der Besichtigung hat der lokale Verwalter Ihr Objekt genehmigt: Gäste können es jetzt sehen. Aktivieren
          Sie den Preisberater für den Nachtpreis.'
      link: price_watches
  - key: stay_paid
    'on':
      collection: stays
      op: update
      where:
        status: paid
    start:
      agent: arrival
    asUser: false
    goal: 'Prepare this paid stay. id: {record.id}; listing: {record.listing}; check_in: {record.check_in}; check_out: {record.check_out};
      guests: {record.guests}'
  - key: stay_ready_mail
    'on':
      collection: stays
      op: update
      where:
        status: ready
    notify:
      to:
      - owner
      subject:
        it: La tua prenotazione è confermata — istruzioni di arrivo
        en: Your booking is confirmed — arrival instructions
        de: Ihre Buchung ist bestätigt — Anreiseinfos
      body:
        it: 'Arrivo {record.check_in}, partenza {record.check_out}.

          Codice di accesso: {record.access_code}


          {record.arrival_instructions}


          Per ogni domanda scrivi al concierge nell''app.'
        en: 'Check-in {record.check_in}, check-out {record.check_out}.

          Access code: {record.access_code}


          {record.arrival_instructions}


          Ask the concierge in the app for anything you need.'
        de: 'Anreise {record.check_in}, Abreise {record.check_out}.

          Zugangscode: {record.access_code}


          {record.arrival_instructions}


          Fragen Sie den Concierge in der App.'
      link: concierge_chat
  - key: checkin_reminder
    'on':
      date:
        collection: stays
        field: check_in
        offsetDays: -1
        hour: 8
      where:
        status: ready
    notify:
      to:
      - owner
      subject:
        it: Domani il tuo arrivo
        en: Your arrival is tomorrow
        de: Morgen ist Ihre Anreise
      body:
        it: Ti aspettiamo domani. Il codice di accesso è {record.access_code}.
        en: We expect you tomorrow. Your access code is {record.access_code}.
        de: Wir erwarten Sie morgen. Ihr Zugangscode ist {record.access_code}.
      link: my_stays
  - key: manager_checkin_today
    'on':
      date:
        collection: stays
        field: check_in
        offsetDays: 0
        hour: 5
      where:
        status: ready
    notify:
      to:
      - record.manager_email
      subject:
        it: 'Check-in oggi: {record.listing}'
        en: 'Check-in today: {record.listing}'
        de: 'Check-in heute: {record.listing}'
      body:
        it: Oggi arrivano {record.guests} ospiti ({record.listing}). Coordina l'accoglienza con il partner locale.
        en: '{record.guests} guests arrive today ({record.listing}). Coordinate the welcome with the local partner.'
        de: Heute reisen {record.guests} Gäste an ({record.listing}). Empfang mit dem lokalen Partner abstimmen.
      link: manager_today
  - key: manager_cleaning_today
    'on':
      date:
        collection: stays
        field: check_out
        offsetDays: 0
        hour: 5
      where:
        status: ready
    notify:
      to:
      - record.manager_email
      subject:
        it: 'Pulizie oggi: {record.listing}'
        en: 'Cleaning today: {record.listing}'
        de: 'Reinigung heute: {record.listing}'
      body:
        it: 'Check-out oggi per {record.listing}: attiva le pulizie del partner locale.'
        en: 'Check-out today for {record.listing}: trigger the local partner''s cleaning.'
        de: 'Check-out heute für {record.listing}: Reinigung durch den lokalen Partner anstoßen.'
      link: manager_today
  - key: issue_opened
    'on':
      collection: issues
      op: insert
    notify:
      to:
      - record.manager_email
      subject:
        it: 'Segnalazione: {record.listing_name}'
        en: 'Issue: {record.listing_name}'
        de: 'Meldung: {record.listing_name}'
      body:
        it: 'Urgenza {record.urgency}: {record.description}'
        en: 'Urgency {record.urgency}: {record.description}'
        de: 'Dringlichkeit {record.urgency}: {record.description}'
      link: manager_issues
  - key: price_decided
    'on':
      approval: price_confirm
      decision: approved
    start:
      agent: pricer
    goal: 'MODE B. The owner approved the price. Apply it. Event: {event}'
  billing:
    modes:
    - per_transaction
    currency: eur
    transactionFeePct: 12
    sellers: collection:properties
  notifications:
    emailOnRunDone: true
  extensions:
  - key: stay_payment_confirmation
    description: Card checkout for a booking and the switch of the stay to status paid (which starts the arrival agent) must
      be wired to the Stripe Connect payment; the manifest only declares the commission (12%) and the sellers.
  - key: availability_search
    description: Search by date range excluding already booked nights and overlapping bookings is not expressible yet; the
      owner's availability calendar is free text and double-booking checks need custom logic.
  - key: property_photos_public
    description: Owner photos are private files of the owner; showing them to guests in the listing needs a public asset copy.
  - key: local_partner_sms
    description: SMS/WhatsApp notifications to local partners (cleaning, welcome) are not available yet; the manager receives
      email.
