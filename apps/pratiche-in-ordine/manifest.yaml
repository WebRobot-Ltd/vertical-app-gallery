apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: pratiche-in-ordine
  displayName: Pratiche in Ordine
  tagline: I tuoi documenti fiscali diventano una pratica pronta da approvare.
  description: 'Carica CU, spese mediche, ricevute, contratti e fatture: un agente AI li legge, li abbina alle detrazioni,
    segnala cosa manca e prepara la bozza. Un professionista dello studio partner la controlla e la approva, tu la confermi
    e lo studio la trasmette.'
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f3a5f'
      accent: '#2a8f6a'
      background: '#f7f8fa'
      foreground: '#18222e'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: 'Pratiche in '
      color: primary
    - text: Ordine
      color: accent
  header:
    links:
    - label: Come funziona
      href: '#come-funziona'
    - label: Privacy
      href: '#privacy'
    cta:
      label: Accedi
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Amministratore
      assignedBy: admin_emails
    - key: user
      label: Contribuente
      assignedBy: signup
    - key: consultant
      label: Professionista dello studio
      assignedBy: derived
      from: collection:taxpayers.consultant_email
  limits:
  - action: agent:analyst
    per: user
    max: 5
    window: day
    roles:
    - user
  agents:
  - key: analyst
    role: main
    description: Legge e classifica i documenti, li abbina alle detrazioni, segnala i mancanti e prepara la bozza della pratica.
    memory: user
    awaits:
    - professional_review
    - client_confirm
    profile:
      inline:
        display_name: Analista pratiche fiscali
        crews:
        - id: analyst
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''analista di Pratiche in Ordine: prepari la bozza di una pratica fiscale (es. dichiarazione
            dei redditi) per un contribuente italiano, che un professionista abilitato controllerà. Procedi così: 1) per ogni
            file caricato usa read_upload con l''id del file (foto e scansioni comprese) e il testo estratto; 2) classifica
            il documento (CU, spesa medica, ricevuta, affitto, fattura, estratto conto, altro), estrai data, emittente, importo,
            anno; salva ogni documento con save_document, copiando consultant_email dal contesto; 3) per ogni spesa cerca
            nelle istruzioni ufficiali indicizzate con search_instructions la voce di detrazione giusta (rigo/codice, aliquota,
            limiti, franchigia) e citala; se non trovi la norma dillo, non inventare; 4) elenca i documenti mancanti o dubbi
            e le domande per il contribuente (potrà rispondere nella chat); 5) calcola il risparmio stimato solo da importi
            letti nei documenti, indicando le ipotesi; 6) salva la bozza con save_practice (status ''bozza'', consultant_email
            dal contesto) e poi chiedi la revisione con request_professional_review. Dopo l''ok del professionista chiedi
            la conferma del cliente con request_client_confirm. Non trasmettere nulla, non dare mai consulenza come fatto
            certo: sono stime da verificare. Non ripetere dati personali oltre il necessario. Il report inizia con un titolo
            ''# '' (es. ''# Pratica 2025 — bozza''), poi sezioni ## Riepilogo e risparmio stimato, ## Documenti letti (tabella),
            ## Detrazioni e oneri abbinati, ## Documenti mancanti e domande, ## Note per il professionista. Aggiungi un blocco
            chart (bar) con le detrazioni per categoria se ci sono cifre reali.'
          mcp_servers: []
    goalTemplate: 'Anno d''imposta: {tax_year_label}

      Data di oggi: {date}. Lingua: {lang}.

      Documenti caricati (file e id): {docs}

      {?docs_text}Testo dei documenti leggibili:

      {docs_text}{/docs_text}

      {?notes}Note del contribuente: {notes}{/notes}

      Scheda del contribuente: {profile}

      Professionista assegnato (consultant_email): {consultant}

      Prepara la bozza della pratica.'
    context:
    - key: profile
      from: collection:taxpayers
    - key: consultant
      from: collection:taxpayers.consultant_email
    appTools:
    - name: read_upload
      description: Legge un file caricato dall'utente (OCR incluso)
      action: read_file
    - name: search_instructions
      description: Cerca nelle istruzioni ufficiali indicizzate (detrazioni, righi, limiti)
      action: search
      collection: instructions
      scope: all
    - name: read_documents
      description: Legge i documenti già salvati del contribuente
      action: read
      collection: documents
      scope: user
    - name: save_document
      description: Salva un documento classificato con importi e date
      action: write
      collection: documents
      scope: user
    - name: save_practice
      description: Salva o aggiorna la bozza della pratica
      action: write
      collection: practices
      scope: user
    output: markdown
    limits:
      maxTurns: 40
      maxBudgetUsd: 1.5
      timeoutSeconds: 900
  - key: clarifier
    role: helper
    description: Chat con il contribuente per chiarire dubbi e documenti mancanti.
    memory: user
    profile:
      inline:
        display_name: Assistente pratica
        crews:
        - id: clarifier
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Aiuti il contribuente a completare la sua pratica fiscale. Leggi i suoi documenti (read_documents)
            e la bozza, chiedi con gentilezza i chiarimenti mancanti (una o due domande per volta), spiega in parole semplici
            perché un documento serve, e quando l''utente risponde aggiorna il documento con save_document. Usa search_instructions
            per le regole. Non inventare norme né importi, non promettere risparmi: la bozza è controllata da un professionista.
            Non trasmetti nulla.'
    goalTemplate: 'Conversazione finora:

      {history}

      Nuovo messaggio di {user}: {message}

      Dati del contribuente: {profile}

      Consulente: {consultant}

      Rispondi in lingua {lang}.'
    context:
    - key: profile
      from: collection:taxpayers
    - key: consultant
      from: collection:taxpayers.consultant_email
    appTools:
    - name: read_documents
      description: Legge i documenti già salvati del contribuente
      action: read
      collection: documents
      scope: user
    - name: save_document
      description: Salva un documento classificato con importi e date
      action: write
      collection: documents
      scope: user
    - name: search_instructions
      description: Cerca nelle istruzioni ufficiali indicizzate (detrazioni, righi, limiti)
      action: search
      collection: instructions
      scope: all
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.4
  inputForm:
    title: Nuova pratica
    fields:
    - name: tax_year
      type: select
      required: true
      label: Anno d'imposta
      options:
      - value: '2025'
        label: '2025'
      - value: '2024'
        label: '2024'
    - name: docs
      type: file
      required: true
      label: Documenti (CU, scontrini, ricevute, contratti, fatture, estratti conto)
      help: Anche foto dal telefono. Massimo 10 file da 15 MB.
      accept:
      - pdf
      - jpg
      - jpeg
      - png
      - webp
      - docx
      - xlsx
      - csv
      maxMb: 15
      multiple: true
    - name: notes
      type: textarea
      maxLength: 600
      label: Note (facoltative)
      help: Es. figli a carico, mutuo, cambio di lavoro
  data:
    collections:
    - name: taxpayers
      ownedBy: user
      description: Scheda del contribuente e studio/professionista scelto
      retentionDays: 1825
      fields:
      - name: full_name
        type: text
        required: true
        label: Nome e cognome
      - name: tax_code
        type: text
        required: true
        maxLength: 16
        label: Codice fiscale
      - name: household
        type: textarea
        maxLength: 500
        label: Familiari a carico e situazione (facoltativo)
      - name: consultant_email
        type: select
        required: true
        optionsFrom: collection:professionals
        label: Professionista dello studio partner
      access:
      - role: consultant
        where:
          consultant_email: '{user.email}'
        can:
        - read
    - name: documents
      ownedBy: user
      description: Documenti letti e classificati dall'agente
      retentionDays: 1825
      fields:
      - name: doc_type
        type: select
        label: Tipo
        options:
        - CU
        - spesa_medica
        - ricevuta
        - affitto
        - fattura
        - estratto_conto
        - altro
      - name: doc_date
        type: date
        label: Data
      - name: issuer
        type: text
        label: Emittente
      - name: amount
        type: number
        label: Importo
      - name: tax_year
        type: text
        label: Anno
      - name: deduction_item
        type: text
        label: Voce di detrazione / rigo
      - name: status
        type: select
        label: Stato
        options:
        - letto
        - da_chiarire
        - mancante
      - name: notes
        type: textarea
        label: Note
      - name: consultant_email
        type: email
        label: Professionista
      access:
      - role: consultant
        where:
          consultant_email: '{user.email}'
        can:
        - read
    - name: practices
      ownedBy: user
      description: Bozze di pratica e loro stato
      retentionDays: 1825
      fields:
      - name: tax_year
        type: text
        label: Anno
      - name: status
        type: select
        label: Stato
        options:
        - bozza
        - in_revisione
        - modifiche_richieste
        - approvata
        - confermata
        - trasmessa
      - name: estimated_saving
        type: number
        label: Risparmio stimato (€)
      - name: summary
        type: textarea
        label: Riepilogo
      - name: missing
        type: textarea
        label: Documenti mancanti
      - name: consultant_email
        type: email
        label: Professionista
      access:
      - role: consultant
        where:
          consultant_email: '{user.email}'
        can:
        - read
        - write
    - name: instructions
      ownedBy: shared
      searchable: true
      description: Istruzioni ufficiali indicizzate (detrazioni, righi, limiti)
      fields:
      - name: topic
        type: text
        label: Argomento
      - name: year
        type: text
        label: Anno
      - name: text
        type: textarea
        label: Testo
      - name: source_url
        type: url
        label: Fonte
    - name: professionals
      ownedBy: shared
      description: Professionisti abilitati dello studio partner
      fields:
      - name: name
        type: text
        label: Nome
      - name: email
        type: email
        label: Email
  views:
  - key: home
    type: page
    nav: false
    title: Pratiche in Ordine
    sections:
    - type: hero
      title: Dai documenti alla pratica **pronta da approvare**.
      text: Carica CU, spese mediche, ricevute e fatture, anche con una foto. Un agente AI le legge, le abbina alle detrazioni
        giuste e prepara la bozza. Un professionista la controlla, tu confermi, lo studio trasmette.
      actions:
      - label: Inizia una pratica
        href: /login
        style: primary
      note: Prezzo fisso per pratica, mostrato prima di iniziare.
    - type: steps
      id: come-funziona
      title: Come funziona
      items:
      - title: Carica
        text: Documenti e foto dal telefono, in un solo passaggio.
        badge: 📄
      - title: L'agente lavora
        text: Classifica, estrae importi e date, cita le istruzioni ufficiali e ti chiede in chat ciò che manca.
        badge: 🤖
      - title: Revisione dello studio
        text: Il professionista assegnato controlla la bozza, può chiedere modifiche e la approva.
        badge: ✅
      - title: Conferma e invio
        text: Solo dopo la tua conferma lo studio trasmette la pratica.
        badge: 📬
    - type: text
      id: privacy
      title: Riservatezza
      content: I documenti sono visibili solo a te e al professionista che ti è assegnato, e vengono cancellati automaticamente
        dopo 5 anni. Il recupero automatico dal cassetto fiscale con delega non è ancora disponibile.
    - type: note
      content: Le stime sono un supporto e non sostituiscono la revisione del professionista abilitato.
  - key: profile
    type: form
    collection: taxpayers
    title: La mia scheda
    edit: true
    submit:
      label: Salva
      message: Scheda salvata.
      redirect: new_practice
    roles:
    - user
    - admin
  - key: new_practice
    type: new_run
    title: Nuova pratica
    roles:
    - user
    - admin
  - key: practices_history
    type: history
    title: Le mie pratiche
    source: run
    roles:
    - user
    - admin
  - key: practice_report
    type: report
    source: run
    printable: true
    nav: false
  - key: my_practices
    type: table
    title: Stato delle pratiche
    source: collection:practices
    columns:
    - tax_year
    - status
    - estimated_saving
    - missing
    roles:
    - user
    - consultant
    - admin
  - key: my_documents
    type: table
    title: Documenti
    source: collection:documents
    columns:
    - doc_type
    - doc_date
    - issuer
    - amount
    - deduction_item
    - status
    export: true
    roles:
    - user
    - consultant
    - admin
  - key: clients
    type: table
    title: I miei clienti
    source: collection:taxpayers
    columns:
    - full_name
    - tax_code
    roles:
    - consultant
    - admin
  - key: assistant
    type: chat
    title: Chiarimenti
    source: agent:clarifier
    examples:
    - Quali documenti mancano?
    - Questa ricevuta è detraibile?
    placeholder: Scrivi qui la tua risposta o domanda
    roles:
    - user
    - admin
  - key: decisions
    type: approvals
    title: Approvazioni
    roles:
    - user
    - consultant
    - admin
  - key: account
    type: account
    title: Pagamenti
    roles:
    - user
  approvals:
  - key: professional_review
    title: Revisione del professionista
    description: Il professionista controlla la bozza e la approva o chiede modifiche.
    role: consultant
    fields:
    - tax_year
    - estimated_saving
    - summary
    - missing
    timeoutMinutes: 10080
    onTimeout: reject
  - key: client_confirm
    title: Conferma del cliente
    description: Il cliente conferma la pratica approvata prima della trasmissione.
    decidedBy: requester
    fields:
    - tax_year
    - estimated_saving
    - summary
    timeoutMinutes: 10080
    onTimeout: reject
  triggers:
  - key: practice_assigned
    'on':
      collection: practices
      op: insert
    notify:
      to: role:consultant
      subject: Nuova bozza di pratica da controllare
      body: Una nuova bozza di pratica di un tuo cliente è in attesa di revisione.
      link: decisions
  - key: review_approved
    'on':
      approval: professional_review
      decision: approved
    notify:
      to: owner
      subject: La tua pratica è stata approvata dal professionista
      body: Il professionista ha approvato la bozza. Ora puoi confermarla per l'invio.
      link: decisions
  - key: review_changes
    'on':
      approval: professional_review
      decision: rejected
    notify:
      to: owner
      subject: Il professionista chiede modifiche alla tua pratica
      body: Il professionista ha chiesto modifiche o documenti. Apri la chat per rispondere.
      link: assistant
  - key: client_confirmed
    'on':
      approval: client_confirm
      decision: approved
    notify:
      to: role:consultant
      subject: 'Pratica confermata dal cliente: da trasmettere'
      body: Il cliente ha confermato la pratica approvata. Puoi procedere alla trasmissione.
      link: my_practices
  billing:
    modes:
    - credits
    signupCredits: 0
    costs:
      agent:analyst: 100
    packs:
    - key: pratica
      credits: 100
      price: 79
      label: 1 pratica (prezzo fisso)
  notifications:
    emailOnRunDone: true
  extensions:
  - key: cassetto_fiscale
    description: 'Recupero automatico dei dati dal cassetto fiscale con delega: richiede accesso con SPID/CIE/Entratel e deleghe,
      non disponibile (nessun OAuth o accesso senza chiave API). Per ora l''utente carica i documenti.'
  - key: trasmissione
    description: La trasmissione all'Agenzia delle Entrate resta a carico dello studio partner, fuori dall'app.
  - key: istruzioni_ufficiali
    description: La collezione 'instructions' va popolata dagli admin con le istruzioni ufficiali (es. Agenzia delle Entrate)
      per anno; l'elenco 'professionals' con i professionisti dello studio.
