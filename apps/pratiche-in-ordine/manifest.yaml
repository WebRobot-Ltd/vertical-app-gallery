apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: pratiche-in-ordine
  displayName: Pratiche in Ordine
  tagline: Dai tuoi documenti fiscali a una pratica pronta da approvare.
  description: Carichi i documenti fiscali, un agente li legge, li classifica e li abbina alle detrazioni giuste, ti chiede
    chiarimenti in chat e prepara la bozza con il risparmio stimato. Un professionista dello studio partner la controlla e
    la approva; poi la confermi tu e lo studio la trasmette.
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#16365c'
      accent: '#1f8a70'
      background: '#f6f8fb'
      foreground: '#18222e'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: 'Pratiche in '
      color: primary
    - text: Ordine
      color: accent
    width: wide
  header:
    links:
    - label: Come funziona
      href: '#come-funziona'
    - label: Prezzo
      href: '#prezzo'
    cta:
      label: Inizia
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Amministratore
      assignedBy: admin_emails
    - key: user
      label: Contribuente
      assignedBy: signup
    - key: professional
      label: Professionista dello studio
      assignedBy: invite
  limits:
  - action: agent:drafter
    per: user
    max: 5
    window: day
    roles:
    - user
  - action: chat
    per: user
    max: 100
    window: day
    roles:
    - user
  agents:
  - key: intake
    role: helper
    description: Legge e classifica i documenti incollati dal contribuente, estrae importi e date e fa domande di chiarimento
      in chat.
    memory: user
    profile:
      inline:
        display_name: Pratiche in Ordine - istruttoria documenti
        chat_mode: true
        crews:
        - id: intake
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''assistente istruttore di Pratiche in Ordine, per contribuenti italiani (privati e professionisti).
            Il contribuente ti incolla il testo dei suoi documenti fiscali (CU, scontrini e fatture mediche, ricevute, contratti
            di affitto, fatture, estratti conto) o un link. Per ciascun documento: 1) classificalo (tipo); 2) estrai emittente,
            data, importo, anno d''imposta, modalità di pagamento se presente; 3) proponi la voce di detrazione o deduzione
            plausibile consultando lo strumento di ricerca delle istruzioni ufficiali indicizzate (non citare a memoria aliquote
            o limiti); 4) salvalo con lo strumento di scrittura dei documenti, con stato ''ok'' o ''da_chiarire''. Se manca
            un dato, un importo è illeggibile o la tracciabilità del pagamento è dubbia, fai UNA domanda chiara alla volta.
            Segnala i documenti che di solito mancano (es. CU del datore di lavoro, spese mediche con pagamento tracciabile,
            interessi del mutuo, canone di locazione). Non inventare mai importi, date o norme; se non sei sicuro dillo. Non
            dare consulenza fiscale come certezza: la decisione finale spetta al professionista dello studio. Non chiedere
            mai password o credenziali fiscali. Il caricamento di file e foto non è ancora disponibile: chiedi di incollare
            il testo o di indicare un link. Rispondi in italiano, in modo breve e cortese.'
          mcp_servers: []
    appTools:
    - name: save_document
      description: Salva o aggiorna un documento classificato del contribuente
      action: write
      collection: documents
      scope: user
    - name: list_documents
      description: Elenca i documenti già salvati del contribuente
      action: read
      collection: documents
      scope: user
    - name: search_instructions
      description: Cerca nelle istruzioni ufficiali indicizzate (detrazioni, oneri deducibili, limiti)
      action: search
      collection: instructions
      scope: all
    goalTemplate: 'Cronologia:

      {history}


      Nuovo messaggio del contribuente: {message}

      Data di oggi: {date}. Lingua: {lang}.'
    output: markdown
    limits:
      maxTurns: 10
      maxBudgetUsd: 0.5
  - key: drafter
    role: main
    description: Compila la bozza della pratica dai documenti salvati e chiede la revisione allo studio.
    profile:
      inline:
        display_name: Pratiche in Ordine - redattore pratica
        crews:
        - id: drafter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei il redattore di pratiche fiscali di Pratiche in Ordine. Leggi tutti i documenti del contribuente
            con lo strumento di lettura, verifica le voci con la ricerca nelle istruzioni ufficiali indicizzate e compila
            la bozza della pratica (es. dichiarazione dei redditi) per l''anno indicato. Struttura obbligatoria in Markdown:
            titolo di primo livello "# Pratica <tipo> <anno> - <nome contribuente se noto>"; poi ## Riepilogo del risparmio
            (tabella: voce, spesa documentata, detrazione/deduzione stimata, riferimento alle istruzioni; totale stimato);
            ## Dati e redditi (da CU e altri documenti); ## Spese e detrazioni, documento per documento; ## Documenti mancanti
            o da chiarire; ## Punti per il professionista (rischi, dubbi, tracciabilità dei pagamenti); ## Prossimi passi.
            Aggiungi un grafico con un blocco ```chart (bar) dei risparmi per voce, solo con cifre reali. Non inventare importi,
            aliquote o limiti: se un dato manca, scrivilo come da verificare. Le cifre sono stime in attesa di revisione.
            Alla fine salva la pratica con lo stato ''in_revisione'' e chiama request_studio_review con il riepilogo per il
            professionista dello studio. Non trasmettere nulla: solo lo studio trasmette, dopo la conferma del cliente.'
          mcp_servers: []
    appTools:
    - name: list_documents
      description: Elenca i documenti già salvati del contribuente
      action: read
      collection: documents
      scope: user
    - name: search_instructions
      description: Cerca nelle istruzioni ufficiali indicizzate (detrazioni, oneri deducibili, limiti)
      action: search
      collection: instructions
      scope: all
    - name: save_practice
      description: Salva la pratica del contribuente
      action: write
      collection: practices
      scope: user
    awaits:
    - studio_review
    - client_confirm
    context: []
    goalTemplate: 'Prepara la bozza della pratica.

      Anno d''imposta: {tax_year}.

      Tipo di pratica: {practice_kind_label}.

      {?household}Situazione familiare e note: {household}{/household}

      {?pasted_documents}Altri documenti incollati:

      {pasted_documents}{/pasted_documents}

      Data di oggi: {date}. Scrivi in italiano.'
    writesTo:
      collection: practices
      parse: whole
    output: markdown
    limits:
      maxTurns: 15
      maxBudgetUsd: 1.0
  inputForm:
    title: Nuova pratica
    fields:
    - name: tax_year
      type: select
      required: true
      label: Anno d'imposta
      options:
      - value: '2025'
        label: 2025 (dichiarazione 2026)
      - value: '2024'
        label: '2024'
    - name: practice_kind
      type: select
      required: true
      label: Tipo di pratica
      options:
      - value: '730'
        label: Dichiarazione dei redditi 730
      - value: redditi_pf
        label: Redditi Persone Fisiche (professionisti)
    - name: household
      type: textarea
      maxLength: 800
      label: Situazione familiare (facoltativo)
      help: Familiari a carico, mutuo, affitto, ecc.
    - name: pasted_documents
      type: textarea
      maxLength: 6000
      label: Documenti incollati (facoltativo)
      help: Puoi anche usare la chat per caricarli uno alla volta. Il caricamento di file e foto non è ancora disponibile.
  data:
    collections:
    - name: documents
      ownedBy: user
      description: Documenti fiscali del contribuente (riservati)
      fields:
      - name: kind
        type: select
        label: Tipo
        options:
        - cu
        - spesa_medica
        - ricevuta
        - affitto
        - fattura
        - estratto_conto
        - altro
      - name: issuer
        type: text
        label: Emittente
      - name: doc_date
        type: date
        label: Data
      - name: amount
        type: number
        label: Importo
      - name: deduction_item
        type: text
        label: Voce di detrazione
      - name: status
        type: select
        label: Stato
        options:
        - ok
        - da_chiarire
      - name: source_text
        type: textarea
        label: Testo del documento
      - name: notes
        type: textarea
        label: Note
    - name: practices
      ownedBy: user
      description: Pratiche del contribuente e loro stato
      fields:
      - name: title
        type: text
        label: Pratica
      - name: tax_year
        type: text
        label: Anno
      - name: status
        type: select
        label: Stato
        options:
        - in_revisione
        - modifiche_richieste
        - approvata_studio
        - confermata
        - trasmessa
      - name: estimated_saving
        type: number
        label: Risparmio stimato
      - name: content
        type: textarea
        label: Bozza
    - name: instructions
      ownedBy: shared
      searchable: true
      description: Istruzioni ufficiali indicizzate su detrazioni e oneri deducibili
      fields:
      - name: topic
        type: text
      - name: year
        type: text
      - name: text
        type: textarea
      - name: source_url
        type: url
  approvals:
  - key: studio_review
    title: Revisione dello studio
    description: Il professionista abilitato controlla la bozza, può chiedere modifiche e la approva.
    role: professional
    decidedBy: role
    fields:
    - summary
    - estimated_saving
    - missing_documents
    timeoutMinutes: 10080
    onTimeout: reject
  - key: client_confirm
    title: Conferma del cliente
    description: Dopo l'approvazione dello studio, confermi la pratica prima della trasmissione.
    decidedBy: requester
    fields:
    - summary
    - estimated_saving
    timeoutMinutes: 10080
    onTimeout: reject
  triggers:
  - key: after_studio_approval
    description: Quando lo studio approva, chiede la conferma al cliente
    'on':
      approval: studio_review
      decision: approved
    start:
      agent: drafter
    goal: 'Lo studio ha approvato la pratica. Aggiorna lo stato a ''approvata_studio'' e chiama request_client_confirm con
      il riepilogo e il risparmio stimato. Evento: {event}'
    asUser: true
  - key: after_studio_changes
    description: Se lo studio rifiuta, la bozza va rivista
    'on':
      approval: studio_review
      decision: rejected
    start:
      agent: drafter
    goal: 'Lo studio ha chiesto modifiche. Leggi le note nell''evento, correggi la bozza, imposta lo stato ''in_revisione''
      e richiedi di nuovo la revisione. Evento: {event}'
    asUser: true
  views:
  - key: home
    type: page
    title: Pratiche in Ordine
    nav: false
    sections:
    - type: hero
      layout: stack
      band: true
      eyebrow: Per privati e professionisti
      title: Dai documenti alla **pratica pronta da approvare**.
      text: Racconti i tuoi documenti fiscali, un agente li classifica e li abbina alle detrazioni giuste, ti dice cosa manca
        e prepara la bozza con il risparmio stimato. Un professionista abilitato la controlla prima di tutto.
      actions:
      - label: Inizia una pratica
        href: /login
        style: primary
      - label: Come funziona
        href: '#come-funziona'
        style: ghost
    - type: steps
      id: come-funziona
      title: Come funziona
      items:
      - title: 1 · Registrati e porta i documenti
        text: 'CU, spese mediche, ricevute, affitti, fatture, estratti conto: incolla il testo o un link e chatta con l''assistente.'
        badge: 📄
      - title: 2 · L'agente classifica e abbina
        text: Estrae importi e date, li collega alle voci di detrazione secondo le istruzioni ufficiali e segnala cosa manca.
        badge: 🔎
      - title: 3 · Bozza con il risparmio
        text: Una pratica compilata con il riepilogo di quanto risparmi.
        badge: 🧾
      - title: 4 · Lo studio controlla e approva
        text: Un professionista abilitato rivede la bozza, può chiedere modifiche e la approva.
        badge: ✅
      - title: 5 · Confermi e lo studio trasmette
        text: Solo dopo la tua conferma lo studio trasmette la pratica.
        badge: 📨
    - type: cards
      id: prezzo
      title: Prezzo fisso a pratica
      intro: 'Il prezzo è mostrato prima di iniziare: nessuna sorpresa.'
      items:
      - title: Una pratica
        text: 39 € per pratica, comprese l'istruttoria in chat, la bozza e la revisione dello studio.
        badge: 💶
      - title: Riservatezza
        text: I tuoi documenti sono visibili solo a te e al professionista a cui è assegnata la tua pratica.
        badge: 🔒
    - type: note
      content: 'Pratiche in Ordine è un supporto alla preparazione: le cifre sono stime fino all''approvazione del professionista
        abilitato dello studio partner. Non chiederemo mai le tue password fiscali.'
  - key: new
    type: new_run
    title: Nuova pratica
    roles:
    - user
  - key: assistant
    type: chat
    title: Assistente documenti
    source: agent:intake
    examples:
    - 'Ecco la mia CU 2025: ...'
    - Ho una fattura del dentista da 450 euro, come la inserisco?
    - Che documenti mi mancano per il 730?
    placeholder: Incolla un documento o fai una domanda
    roles:
    - user
  - key: documents
    type: table
    title: I miei documenti
    source: collection:documents
    roles:
    - user
    data:
      display: table
      fields:
      - key: kind
        label: Tipo
        format: badge
      - key: issuer
        label: Emittente
      - key: doc_date
        label: Data
        format: date
      - key: amount
        label: Importo
        format: money
      - key: deduction_item
        label: Voce
      - key: status
        label: Stato
        format: badge
      sort:
        field: doc_date
        dir: desc
      limit: 100
      empty: 'Nessun documento: inizia dall''assistente.'
  - key: practices
    type: history
    title: Le mie pratiche
    source: run
    roles:
    - user
  - key: practice
    type: report
    title: Pratica
    source: run
    printable: true
    nav: false
    roles:
    - user
    - professional
    - admin
  - key: approvals
    type: approvals
    title: Approvazioni
    roles:
    - user
    - professional
  - key: account
    type: account
    title: Crediti e pagamenti
    roles:
    - user
  billing:
    modes:
    - credits
    currency: eur
    signupCredits: 0
    costs:
      agent:drafter: 100
    packs:
    - key: pratica
      credits: 100
      price: 39
      label: Una pratica - 39 €
  extensions:
  - key: cassetto_fiscale
    description: 'Recupero automatico dei dati dal cassetto fiscale con delega del contribuente: richiede credenziali/delega
      di ogni cliente, non ancora disponibile. Per ora i dati si incollano in chat.'
  - key: file_upload
    description: 'Caricamento di file e foto dal telefono non ancora disponibile: il contribuente incolla il testo del documento
      o un link.'
  - key: client_assignment
    description: 'Assegnazione dei clienti ai professionisti (il professionista vede solo i clienti assegnati) e visibilità
      dei documenti del cliente al professionista assegnato: oggi il professionista vede le richieste di revisione a lui destinate,
      non l''archivio; serve un meccanismo di assegnazione.'
  - key: transmission
    description: 'Trasmissione della pratica da parte dello studio dopo la conferma del cliente: avviene fuori dall''app;
      lo stato ''trasmessa'' è aggiornato dallo studio.'
  - key: notifications
    description: Email di avviso a cliente e studio (bozza pronta, modifiche richieste, conferma) non ancora disponibili.
  - key: confidential_storage
    description: Cifratura e conservazione riservata dei documenti, retention e consensi privacy (GDPR) da configurare a livello
      di piattaforma.
