apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: venditorechat
  displayName: VenditoreChat
  tagline:
    it: Un agente di vendita per il tuo shop Shopify, sempre in chat.
    en: A sales agent for your Shopify store, always on chat.
  description:
    it: 'Collega il tuo shop Shopify: l''agente consiglia prodotti, risponde su taglie, spedizioni e resi, crea il carrello
      con il link di pagamento, ricontatta i carrelli abbandonati e avvisa sulle spedizioni. Tu vedi conversazioni e vendite
      e puoi prendere in mano ogni chat.'
    en: 'Connect your Shopify store: the agent recommends products, answers on sizes, shipping and returns, builds the cart
      with a payment link, follows up on abandoned carts and sends shipping updates. You see conversations and sales and can
      take over any chat.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#0f3d3e'
      accent: '#e4572e'
      background: '#f7f5f0'
      foreground: '#1a2326'
    fonts:
      body: Inter
      display: Sora
    wordmark:
    - text: Venditore
      color: primary
    - text: Chat
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      label:
        it: Negoziante
        en: Merchant
      assignedBy: signup
  agents:
  - key: seller
    role: main
    description: 'Sales agent in chat: recommends products, answers, builds carts, proposes refunds for approval.'
    memory: user
    awaits:
    - refund_approval
    profile:
      inline:
        display_name: VenditoreChat seller
        chat_mode: true
        crews:
        - id: seller
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 14
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the sales assistant of an online shop, chatting with the shop''s customers. Reply in the
            customer''s language (Italian or English), short, friendly, never pushy. Use shop_products to find products, variants,
            prices and availability: recommend only what is in stock and never invent prices, sizes or stock. Use shop_orders
            to check order status. Answer on shipping and returns only from the shop''s data or what the merchant told you
            (memory); if you do not know, say so and offer a human operator. To sell: confirm product, variant and quantity,
            create a draft order with shop_draft_order (POST body: {"draft_order":{"line_items":[{"variant_id":<id>,"quantity":<n>}],"email":"<customer
            email>"}}), then give the customer the invoice_url as payment link and save the cart with save_cart (status open,
            remind_on = tomorrow''s date YYYY-MM-DD). Always record the conversation with save_conversation (customer, channel,
            last_message, summary, status ''agent''). If the conversation status is ''operator'', do not reply: a human has
            taken over. When a sale is paid, record it with log_sale. Refunds: NEVER promise or perform a refund yourself;
            collect order number and reason, then call request_refund_approval and tell the customer an operator will decide.
            Only ask for marketing consent explicitly and record the answer with save_consent. Do not give legal advice.'
        mcp_servers: []
    goalTemplate: 'Conversation so far:

      {history}


      New customer message: {message}

      Today is {date}. Reply in the language with ISO code {lang}.'
    appTools:
    - name: shop_products
      description: List the shop's products with variants, prices and inventory
      action: http
      http:
        method: GET
        url: https://{host}/admin/api/2025-01/products.json
        attribution: Shopify Admin API (merchant's own store)
        credential:
          provider: shopify
          header: X-Shopify-Access-Token
          format: '{secret}'
    - name: shop_orders
      description: List the shop's orders and their fulfilment status
      action: http
      http:
        method: GET
        url: https://{host}/admin/api/2025-01/orders.json
        attribution: Shopify Admin API (merchant's own store)
        credential:
          provider: shopify
          header: X-Shopify-Access-Token
          format: '{secret}'
    - name: shop_draft_order
      description: Create a draft order (cart) and get its payment link
      action: http
      http:
        method: POST
        url: https://{host}/admin/api/2025-01/draft_orders.json
        attribution: Shopify Admin API (merchant's own store)
        credential:
          provider: shopify
          header: X-Shopify-Access-Token
          format: '{secret}'
    - name: save_conversation
      description: Create or update the record of a conversation
      action: write
      collection: conversations
      scope: user
    - name: read_conversation
      description: Read conversations (to check if an operator took over)
      action: read
      collection: conversations
      scope: user
    - name: save_cart
      description: Save a cart with its payment link and reminder date
      action: write
      collection: carts
      scope: user
    - name: log_sale
      description: Record a sale generated by the agent
      action: write
      collection: agent_sales
      scope: user
    - name: save_consent
      description: Record a customer's marketing consent
      action: write
      collection: consents
      scope: user
  data:
    credentials:
    - provider: shopify
      kind: api_key
      scope: user
      label:
        it: Shopify (token di accesso Admin API)
        en: Shopify (Admin API access token)
      help:
        it: 'In Shopify: Impostazioni > App > Sviluppa app > crea un''app, abilita lettura prodotti/ordini e scrittura bozze
          d''ordine, copia il token.'
        en: 'In Shopify: Settings > Apps > Develop apps > create an app, enable read products/orders and write draft orders,
          copy the token.'
      hostLabel:
        it: il-tuo-negozio.myshopify.com
        en: your-store.myshopify.com
      required: true
    collections:
    - name: conversations
      ownedBy: user
      retentionDays: 365
      description: Customer conversations; status agent|operator for takeover
      fields:
      - name: customer
        type: text
        label:
          it: Cliente
          en: Customer
      - name: channel
        type: select
        options:
        - web
        - whatsapp
      - name: status
        type: select
        options:
        - agent
        - operator
        - closed
        default: agent
      - name: last_message
        type: textarea
      - name: summary
        type: textarea
    - name: carts
      ownedBy: user
      retentionDays: 180
      fields:
      - name: customer_email
        type: email
      - name: items
        type: textarea
      - name: total
        type: number
      - name: checkout_url
        type: url
      - name: status
        type: select
        options:
        - open
        - paid
        - abandoned
        default: open
      - name: remind_on
        type: date
    - name: agent_sales
      ownedBy: user
      fields:
      - name: order_id
        type: text
      - name: customer
        type: text
      - name: amount
        type: number
      - name: date
        type: date
    - name: consents
      ownedBy: user
      fields:
      - name: email
        type: email
        required: true
      - name: marketing
        type: boolean
      - name: date
        type: date
    - name: shipments
      ownedBy: user
      retentionDays: 180
      fields:
      - name: order_id
        type: text
      - name: email
        type: email
      - name: status
        type: text
      - name: tracking_url
        type: url
  approvals:
  - key: refund_approval
    title:
      it: Richiesta di rimborso
      en: Refund request
    decidedBy: requester
    fields:
    - order
    - reason
    - amount
    timeoutMinutes: 4320
    onTimeout: reject
  triggers:
  - key: cart_reminder
    description: Reminds the customer of an open cart
    'on':
      date:
        collection: carts
        field: remind_on
        offsetDays: 0
        hour: 9
      where:
        status: open
    notify:
      to: record.customer_email
      subject:
        it: Hai dimenticato qualcosa nel carrello
        en: You left something in your cart
      body:
        it: 'Il tuo carrello ti aspetta. Completa l''acquisto qui: {record.checkout_url}'
        en: 'Your cart is waiting. Complete your purchase here: {record.checkout_url}'
  - key: shipping_hook
    description: Shopify fulfilment webhook saved as a record
    'on':
      webhook: true
    write:
      collection: shipments
      fields:
        order_id: order_id
        email: email
        status: status
        tracking_url: tracking_url
      keyBy: order_id
  - key: shipping_update
    'on':
      collection: shipments
      op: any
    notify:
      to: record.email
      subject:
        it: Aggiornamento sul tuo ordine {record.order_id}
        en: Update on your order {record.order_id}
      body:
        it: 'Stato dell''ordine: {record.status}. Tracking: {record.tracking_url}'
        en: 'Order status: {record.status}. Tracking: {record.tracking_url}'
  - key: sale_fee
    description: Fee for each sale generated by the agent
    'on':
      collection: agent_sales
      op: insert
    charge:
      credits: 10
      reason: agent sale fee
  views:
  - key: home
    type: page
    nav: false
    title: VenditoreChat
    sections:
    - type: hero
      layout: stack
      band: true
      title:
        it: Il tuo **venditore** che non dorme mai
        en: Your **salesperson** that never sleeps
      text:
        it: Collega Shopify e lascia che l'agente consigli, venda e segua i clienti in chat. Tu controlli tutto e puoi intervenire
          quando vuoi.
        en: Connect Shopify and let the agent advise, sell and follow up with customers in chat. You stay in control and can
          step in anytime.
      actions:
      - label:
          it: Inizia
          en: Get started
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Collega lo shop
          en: Connect your shop
        text:
          it: 'Incolla il token Shopify: prodotti, varianti, prezzi, disponibilità e ordini.'
          en: 'Paste your Shopify token: products, variants, prices, stock and orders.'
        badge: 🔗
      - title:
          it: L'agente vende
          en: The agent sells
        text:
          it: Consiglia, risponde su taglie, spedizioni e resi, crea il carrello e il link di pagamento.
          en: Recommends, answers on sizes, shipping and returns, builds the cart and payment link.
        badge: 💬
      - title:
          it: Tu controlli
          en: You stay in control
        text:
          it: Dashboard con vendite e conversione, presa in carico delle chat, rimborsi sempre approvati da te.
          en: Dashboard with sales and conversion, chat takeover, refunds always approved by you.
        badge: 📊
    - type: note
      content:
        it: Abbonamento mensile più una commissione sulle vendite generate dall'agente.
        en: Monthly subscription plus a fee on sales generated by the agent.
  - key: dashboard
    type: page
    title:
      it: Dashboard
      en: Dashboard
    roles:
    - user
    - admin
    sections:
    - type: data
      title:
        it: Risultati
        en: Results
      source: collection:agent_sales
      display: kpi
      fields:
      - key: amount
        format: money
      kpis:
      - label:
          it: Vendite generate
          en: Sales generated
        agg: count
      - label:
          it: Fatturato
          en: Revenue
        agg: sum
        field: amount
        format: money
    - type: data
      title:
        it: Conversazioni
        en: Conversations
      source: collection:conversations
      display: kpi
      fields:
      - key: status
      kpis:
      - label:
          it: Conversazioni
          en: Conversations
        agg: count
    - type: data
      title:
        it: Vendite per mese
        en: Sales per month
      source: collection:agent_sales
      display: chart
      chart: bar
      fields:
      - key: date
      - key: amount
      groupBy:
        field: date
        bucket: month
        aggs:
        - key: amount
          agg: sum
          field: amount
    - type: data
      title:
        it: Carrelli
        en: Carts
      source: collection:carts
      display: table
      fields:
      - key: customer_email
      - key: total
        format: money
      - key: status
        format: badge
      - key: remind_on
        format: date
      limit: 50
  - key: assistant
    type: chat
    source: agent:seller
    title:
      it: Chat agente
      en: Agent chat
    roles:
    - user
    - admin
    examples:
    - it: Cerco una giacca impermeabile taglia M
      en: I'm looking for a waterproof jacket, size M
    - it: Quanto costa la spedizione?
      en: How much is shipping?
    placeholder:
      it: Scrivi come un cliente…
      en: Write as a customer…
  - key: conversations
    type: table
    source: collection:conversations
    title:
      it: Conversazioni
      en: Conversations
    roles:
    - user
    - admin
    columns:
    - customer
    - channel
    - status
    - last_message
    export: true
  - key: takeover
    type: form
    collection: conversations
    title:
      it: Prendi in mano una chat
      en: Take over a chat
    fields:
    - customer
    - status
    - last_message
    edit: true
    roles:
    - user
    - admin
    nav: false
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Chat aggiornata
        en: Chat updated
      redirect: conversations
  - key: consents
    type: form
    collection: consents
    title:
      it: Consensi marketing
      en: Marketing consents
    roles:
    - user
    - admin
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Consenso salvato
        en: Consent saved
  - key: approvals
    type: approvals
    title:
      it: Rimborsi da approvare
      en: Refunds to approve
    approvals:
    - refund_approval
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Shopify e abbonamento
      en: Shopify and plan
    roles:
    - user
    - admin
  billing:
    modes:
    - subscription
    - credits
    signupCredits: 50
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:seller:
        estimate: 5
        metered: true
    packs:
    - key: credits_small
      credits: 1000
      price: 10
      label: 1000 crediti
    plans:
    - key: shop
      price: 49
      interval: month
      credits: 500
      creditsReset: monthly
      label:
        it: Abbonamento negozio
        en: Shop plan
      includes:
      - agent
      - dashboard
      - takeover
      - refund approvals
  limits:
  - action: chat
    per: user
    max: 300
    window: day
  egress:
    hosts:
    - '*.myshopify.com'
    notes: Merchant's own Shopify store via the Admin API with the merchant's access token.
  extensions:
  - key: whatsapp_channel
    description: 'WhatsApp conversations are not available yet: only the in-app/web chat works. Customer-facing public chat
      widget on the merchant''s site (using the merchant''s Shopify key for anonymous visitors) also needs a custom integration.'
  - key: marketing_campaigns
    description: New-product campaigns to consented customers (WhatsApp/email lists) are not available yet; consents are recorded
      for future use.
  - key: percentage_commission
    description: The sales commission is approximated by a fixed credit fee per agent sale; a true percentage of sale value
      is not expressible yet.
  - key: hourly_cart_reminder
    description: Abandoned-cart reminders fire on a date (09:00 the day set in remind_on), not a few hours after abandonment.
  - key: shopify_oauth
    description: Shopify connects through an Admin API access token pasted by the merchant, not OAuth install.
