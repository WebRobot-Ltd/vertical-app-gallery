apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: venditorechat
  displayName: VenditoreChat
  tagline:
    it: Un agente di vendita per il tuo negozio online, sempre in chat.
    en: A sales agent for your online shop, always on chat.
  description:
    it: VenditoreChat consiglia prodotti, risponde su taglie, spedizioni e resi, prepara il carrello con il link di pagamento
      e ricontatta i carrelli abbandonati. Il gestore vede conversazioni e vendite e approva i rimborsi.
    en: VenditoreChat recommends products, answers on sizes, shipping and returns, builds the cart with the payment link and
      follows up on abandoned carts. The operator sees conversations and sales and approves refunds.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#12372a'
      accent: '#25a35a'
      background: '#f7faf8'
      foreground: '#16201b'
    fonts:
      body: Inter
      display: Poppins
    wordmark:
    - text: Venditore
      color: primary
    - text: Chat
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Prezzi
        en: Pricing
      href: '#prezzi'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
      - shop_chat
      agents:
      - sales
    roles:
    - key: admin
      label: Operatore
      assignedBy: admin_emails
    - key: user
      label:
        it: Negoziante
        en: Merchant
      assignedBy: signup
  limits:
  - action: chat
    per: ip
    max: 40
    window: hour
    roles:
    - anonymous
  agents:
  - key: sales
    role: main
    description: 'Sales assistant talking with shop customers: recommends, answers, builds carts, asks for refund approval.'
    profile:
      inline:
        display_name: VenditoreChat sales agent
        chat_mode: true
        crews:
        - id: sales
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''agente di vendita di un negozio online. Parli con i clienti in modo cordiale, breve e onesto,
            nella loro lingua. Usa SEMPRE lo strumento di ricerca catalogo per consigliare prodotti: cita solo prodotti, varianti,
            prezzi e disponibilità che trovi lì, mai inventati. Per taglie, spedizioni e resi usa solo le informazioni del
            catalogo e delle policy del negozio; se non le hai, dillo e offri di passare la chat a un operatore. Quando il
            cliente vuole acquistare, crea il carrello con lo strumento dedicato e invia il link di pagamento restituito.
            Non promettere mai un rimborso: per ogni richiesta di rimborso usa lo strumento request_refund e spiega che deve
            approvarlo un operatore. Invia aggiornamenti o campagne solo a clienti che hanno dato consenso esplicito. Se il
            cliente chiede una persona, scrivi ''Passo la chat a un operatore'' e registra la conversazione come da riprendere.
            Registra ogni scambio nello strumento conversazioni.'
    goalTemplate: 'Conversazione finora:

      {history}


      Nuovo messaggio del cliente: {message}

      Rispondi nella lingua del cliente (default ISO {lang}).'
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.3
    awaits:
    - refund
    appTools:
    - name: search_catalog
      description: Search products, variants, prices and stock
      action: search
      collection: catalog
      scope: all
    - name: create_cart
      description: Create a cart with items and payment link
      action: write
      collection: carts
      scope: user
    - name: log_conversation
      description: Record a message exchange and its status
      action: append
      collection: conversations
      scope: user
  approvals:
  - key: refund
    title:
      it: Richiesta di rimborso
      en: Refund request
    role: admin
    fields:
    - order
    - amount
    - reason
    timeoutMinutes: 2880
    onTimeout: reject
  data:
    collections:
    - name: catalog
      ownedBy: shared
      searchable: true
      description: Products, variants, prices, stock (imported from the shop)
      fields:
      - name: title
        type: text
      - name: variants
        type: text
      - name: price
        type: number
      - name: stock
        type: number
      - name: url
        type: url
    - name: carts
      ownedBy: user
      fields:
      - name: customer
        type: text
      - name: items
        type: text
      - name: total
        type: number
      - name: payment_link
        type: url
      - name: status
        type: select
        options:
        - open
        - paid
        - abandoned
      - name: consent
        type: boolean
    - name: conversations
      ownedBy: user
      fields:
      - name: customer
        type: text
      - name: channel
        type: text
      - name: summary
        type: text
      - name: status
        type: select
        options:
        - agent
        - handoff
        - closed
  views:
  - key: home
    type: page
    nav: false
    title: VenditoreChat
    sections:
    - type: hero
      title:
        it: Il tuo **venditore** che risponde in chat, 24 ore su 24.
        en: Your **salesperson** answering on chat, 24/7.
      text:
        it: Consiglia prodotti, risponde su taglie, spedizioni e resi, prepara il carrello e manda il link di pagamento.
        en: Recommends products, answers on sizes, shipping and returns, builds the cart and sends the payment link.
      actions:
      - label:
          it: Prova la chat
          en: Try the chat
        href: '#prova'
        style: primary
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Catalogo
          en: Catalog
        text:
          it: Prodotti, varianti, prezzi e disponibilità del tuo negozio.
          en: Products, variants, prices and stock from your shop.
      - title:
          it: Chat
          en: Chat
        text:
          it: L'agente risponde e vende; tu puoi prendere in mano una chat in qualsiasi momento.
          en: The agent answers and sells; you can take over any chat at any time.
      - title:
          it: Controllo
          en: Control
        text:
          it: Dashboard con conversazioni e vendite; i rimborsi passano sempre da te.
          en: Dashboard with conversations and sales; refunds always go through you.
    - type: view
      id: prova
      view: shop_chat
    - type: cards
      id: prezzi
      title:
        it: Prezzi
        en: Pricing
      items:
      - title: Standard
        text:
          it: 29 € al mese più 2% sulle vendite generate dall'agente.
          en: €29 per month plus 2% on sales generated by the agent.
        badge: 💶
    - type: note
      content:
        it: L'agente non decide rimborsi. Le campagne vanno solo ai clienti con consenso.
        en: The agent never decides refunds. Campaigns go only to customers who gave consent.
  - key: shop_chat
    type: chat
    source: agent:sales
    title:
      it: Chat negozio
      en: Shop chat
    nav: false
    examples:
    - Cerco una giacca impermeabile taglia M
    - Quanto costa la spedizione?
    - Come funzionano i resi?
    placeholder:
      it: Scrivi un messaggio…
      en: Write a message…
  - key: dashboard
    type: dashboard
    title:
      it: Dashboard
      en: Dashboard
    children:
    - kpis
    - conversations_list
    - carts_list
    roles:
    - user
    - admin
  - key: kpis
    type: cards
    title:
      it: Vendite e conversione
      en: Sales and conversion
    source: collection:carts
    nav: false
    data:
      display: kpi
      kpis:
      - label:
          it: Carrelli
          en: Carts
        agg: count
      - label:
          it: Vendite generate
          en: Generated sales
        agg: sum
        field: total
        format: money
      filters:
      - field: status
        op: '='
        value: paid
  - key: conversations_list
    type: table
    title:
      it: Conversazioni
      en: Conversations
    source: collection:conversations
    nav: false
    columns:
    - customer
    - channel
    - summary
    - status
  - key: carts_list
    type: table
    title:
      it: Carrelli
      en: Carts
    source: collection:carts
    nav: false
    columns:
    - customer
    - total
    - status
    - payment_link
  - key: refunds
    type: approvals
    title:
      it: Rimborsi
      en: Refunds
    approvals:
    - refund
    roles:
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Plan
    roles:
    - user
  billing:
    modes:
    - subscription
    - per_transaction
    currency: eur
    transactionFeePct: 2
    plans:
    - key: standard
      price: 29
      interval: month
      label: Standard
      includes:
      - agent chat
      - dashboard
      - refund approvals
      transactionFeePct: 2
  egress:
    hosts: []
    notes: No external API at the moment.
  extensions:
  - key: shopify_connector
    description: 'Not available yet: importing catalog, variants, stock and orders from Shopify needs each merchant''s credentials.
      For now the catalog is filled in manually or by pasted data.'
  - key: whatsapp_channel
    description: 'Not available yet: WhatsApp channel. Only the web chat works for now.'
  - key: notifications
    description: 'Not available yet: order shipping updates, new-product campaigns and abandoned-cart messages sent to customers.'
  - key: abandoned_cart_followup
    description: 'Not available yet: the scheduled abandoned-cart follow-up was removed, because carts and conversations are
      now private records of the user (needed for the public chat) and one app-wide scheduled agent cannot read them. Open
      carts are listed in the dashboard.'
  - key: human_takeover
    description: Operator taking over a live chat is not available yet; conversations flagged 'handoff' are listed in the
      dashboard.
  - key: multi_merchant
    description: One merchant per app instance. The sales commission is applied through per_transaction billing.
