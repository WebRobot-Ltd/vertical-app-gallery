apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: biglietti-tra-fan
  displayName: Biglietti tra Fan
  tagline:
    it: Rivendi o cerca un biglietto al prezzo originale, senza sovrapprezzi.
  description:
    it: Il portale che mette in contatto chi non può più usare un biglietto e chi lo cerca, a un prezzo mai superiore a quello
      pagato. Ogni inserzione è controllata da un agente e moderata da un operatore prima della pubblicazione.
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f2a5a'
      accent: '#e4572e'
      background: '#f7f7fb'
      foreground: '#161a2b'
    fonts:
      body: Inter
      display: Poppins
  header:
    links:
    - label:
        it: Come funziona
      href: '#come-funziona'
    - label:
        it: Regole
      href: '#regole'
    cta:
      label:
        it: Accedi
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
    - key: operator
      label:
        it: Operatore
      assignedBy: invite
    - key: seller
      label:
        it: Venditore
      assignedBy: derived
      from: collection:orders.seller_email
  limits:
  - action: create:tickets
    per: user
    max: 20
    window: day
    roles:
    - user
  agents:
  - key: moderator
    role: helper
    description: Verifica il limite di prezzo e segnala le inserzioni sospette prima della moderazione.
    profile:
      inline:
        display_name: Controllo inserzioni
        crews:
        - id: moderator
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Controlli le inserzioni di una piattaforma di rivendita di biglietti tra fan. Regola: il prezzo
            richiesto non può superare il prezzo originale pagato. Leggi il biglietto con read_tickets (stato in_revisione).
            Calcola se asking_price <= price_paid. Segnala come sospette: prezzo oltre il limite, dati del titolo mancanti
            o incoerenti, data dell''evento già passata, descrizioni che suggeriscono duplicati o truffe, importi anomali.
            Non inventare fatti: se non sei sicuro scrivilo. Con write_tickets aggiorna il biglietto: flags (elenco sintetico
            dei problemi, oppure ''nessuna anomalia'') e price_ok (true/false). Poi chiama SEMPRE request_publish_listing:
            nessuna inserzione si pubblica senza l''operatore. Termina con un breve rapporto che inizia con ''# Controllo
            inserzione'' e riporta esito e motivi.'
    appTools:
    - name: read_tickets
      description: Legge i biglietti registrati dal venditore
      action: read
      collection: tickets
      scope: user
    - name: write_tickets
      description: Aggiorna i campi di un biglietto del venditore
      action: write
      collection: tickets
      scope: user
    awaits:
    - publish_listing
    goalTemplate: 'Controlla il biglietto appena registrato. Evento: {event}. Prezzo pagato: {price_paid}. Prezzo richiesto:
      {asking_price}.'
    output: markdown
  - key: publisher
    role: helper
    description: Pubblica nel catalogo l'inserzione approvata dall'operatore.
    profile:
      inline:
        display_name: Pubblicazione inserzioni
        crews:
        - id: publisher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Pubblichi un''inserzione già approvata da un operatore. Leggi i biglietti dell''utente con read_tickets,
            prendi quello in stato in_revisione più recente e crea con write_listing un record nel catalogo con: event, event_date,
            section, asking_price, original_price (il prezzo pagato), seller_email, status ''disponibile''. NON copiare i
            dati del titolo (ticket_data). Poi con write_tickets imposta lo stato del biglietto a ''pubblicato''. Se asking_price
            supera price_paid non pubblicare e imposta lo stato ''rifiutato''. Rispondi con una riga che inizia con ''# Pubblicata''.'
    appTools:
    - name: read_tickets
      description: Legge i biglietti registrati dal venditore
      action: read
      collection: tickets
      scope: user
    - name: write_tickets
      description: Aggiorna i campi di un biglietto del venditore
      action: write
      collection: tickets
      scope: user
    - name: write_listing
      description: Crea o aggiorna un'inserzione nel catalogo pubblico
      action: write
      collection: listings
      scope: all
    goalTemplate: 'L''operatore ha approvato l''inserzione. Pubblicala nel catalogo. Dettagli evento: {event}.'
    output: markdown
  - key: settler
    role: helper
    description: 'Registra la vendita: collega l''ordine all''inserzione, calcola la commissione e riserva il biglietto.'
    profile:
      inline:
        display_name: Gestione ordini
        crews:
        - id: settler
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Gestisci un nuovo ordine di un compratore. Leggi gli ordini dell''utente con read_orders (stato
            in_attesa, il più recente) e l''inserzione scelta con read_listing. Se l''inserzione è ''disponibile'': con write_orders
            compila event, price (asking_price), seller_email, fee (5% del prezzo, arrotondata ai centesimi) e status ''pagamento_in_corso'';
            con write_listing imposta l''inserzione a ''riservata''. Se non è disponibile imposta l''ordine a ''annullato''.
            Non gestisci denaro né il trasferimento del titolo: li eseguono la piattaforma di pagamento e l''operatore secondo
            le regole dell''organizzatore. Rispondi con ''# Ordine'' e un breve riepilogo.'
    appTools:
    - name: read_orders
      description: Legge gli ordini del compratore
      action: read
      collection: orders
      scope: user
    - name: write_orders
      description: Aggiorna un ordine del compratore
      action: write
      collection: orders
      scope: user
    - name: read_listing
      description: Legge le inserzioni del catalogo
      action: read
      collection: listings
      scope: all
    - name: write_listing
      description: Crea o aggiorna un'inserzione nel catalogo pubblico
      action: write
      collection: listings
      scope: all
    goalTemplate: 'Elabora il nuovo ordine. Inserzione scelta: {record.listing}.'
    output: markdown
  - key: watcher
    role: helper
    description: Cerca nel catalogo biglietti che corrispondono all'avviso dell'utente.
    memory: instance
    writesTo:
      collection: alert_hits
    profile:
      inline:
        display_name: Avvisi biglietti
        crews:
        - id: watcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Controlli ogni giorno il catalogo con read_listing cercando biglietti ''disponibile'' per l''evento
            dell''avviso, entro il prezzo massimo indicato. Se non ce ne sono, rispondi esattamente con ''# Nessun biglietto
            disponibile ancora'' e una riga. Se ce ne sono, rispondi con ''# Biglietti disponibili: <evento>'' e un elenco
            con data, settore e prezzo, e invita ad aprire il catalogo per acquistare. Nella memoria (remember) tieni gli
            ID già segnalati e non ripeterli. Non inventare inserzioni.'
    appTools:
    - name: read_listing
      description: Legge le inserzioni del catalogo
      action: read
      collection: listings
      scope: all
    goalTemplate: 'Avviso: evento {event}, prezzo massimo {max_price} euro.'
    output: markdown
  templates:
  - key: ticket_alert
    title:
      it: Avviso biglietto
    description:
      it: Ricevi un'email quando compare un biglietto disponibile per il tuo evento.
    agent: watcher
    params:
    - name: event
      type: text
      required: true
      label:
        it: Evento
    - name: max_price
      type: number
      label:
        it: Prezzo massimo (€)
    goal: 'Avviso "{instance}": evento {event}, prezzo massimo {max_price} euro. Oggi è {date}.'
    schedule:
      cron: 0 */6 * * *
      userCanChange: false
    maxPerUser: 5
    deliver:
      to: owner
      subject:
        it: Novità per il tuo avviso
      onlyIfNew: true
  inputForm:
    title:
      it: Nuovo controllo
      en: New check
    fields:
    - name: note
      type: textarea
      maxLength: 300
      label:
        it: Note
  data:
    collections:
    - name: tickets
      description: Biglietti registrati dai venditori
      ownedBy: user
      access:
      - role: operator
        can:
        - read
        - write
      fields:
      - name: event
        type: text
        required: true
        label:
          it: Evento
      - name: event_date
        type: date
        required: true
        label:
          it: Data evento
      - name: section
        type: text
        required: true
        label:
          it: Settore
      - name: price_paid
        type: number
        required: true
        label:
          it: Prezzo pagato (€)
      - name: asking_price
        type: number
        required: true
        label:
          it: Prezzo richiesto (€)
        help:
          it: Non può superare il prezzo pagato.
      - name: ticket_data
        type: textarea
        required: true
        label:
          it: Dati del titolo
        help:
          it: 'Intestatario, codice, organizzatore: visibili solo a te e agli operatori.'
      - name: proof
        type: file
        accept:
        - pdf
        - jpg
        - png
        maxMb: 10
        label:
          it: Prova d'acquisto
      - name: seller_email
        type: email
        label:
          it: Email venditore
      - name: status
        type: select
        options:
        - in_revisione
        - pubblicato
        - rifiutato
        - venduto
        default: in_revisione
        label:
          it: Stato
      - name: price_ok
        type: boolean
        label:
          it: Prezzo nei limiti
      - name: flags
        type: textarea
        label:
          it: Segnalazioni
      retentionDays: 1095
    - name: listings
      description: Catalogo pubblico delle inserzioni approvate
      ownedBy: shared
      fields:
      - name: event
        type: text
        label:
          it: Evento
      - name: event_date
        type: date
        label:
          it: Data
      - name: section
        type: text
        label:
          it: Settore
      - name: asking_price
        type: number
        label:
          it: Prezzo (€)
      - name: original_price
        type: number
        label:
          it: Prezzo originale (€)
      - name: seller_email
        type: email
        label:
          it: Venditore
      - name: status
        type: select
        options:
        - disponibile
        - riservata
        - venduta
        default: disponibile
        label:
          it: Stato
    - name: orders
      description: Acquisti dei compratori
      ownedBy: user
      access:
      - role: seller
        where:
          seller_email: '{user.email}'
        can:
        - read
      - role: operator
        can:
        - read
        - write
      fields:
      - name: listing
        type: select
        optionsFrom: collection:listings
        required: true
        label:
          it: Biglietto
      - name: note
        type: textarea
        label:
          it: Note
      - name: event
        type: text
        label:
          it: Evento
      - name: price
        type: number
        label:
          it: Prezzo (€)
      - name: fee
        type: number
        label:
          it: Commissione (€)
      - name: seller_email
        type: email
        label:
          it: Venditore
      - name: status
        type: select
        options:
        - in_attesa
        - pagamento_in_corso
        - pagato
        - titolo_trasferito
        - contestato
        - rimborsato
        - annullato
        default: in_attesa
        label:
          it: Stato
      retentionDays: 1825
    - name: disputes
      description: Contestazioni e richieste di rimborso
      ownedBy: user
      access:
      - role: operator
        can:
        - read
        - write
      fields:
      - name: order_ref
        type: text
        required: true
        label:
          it: Evento o riferimento ordine
      - name: reason
        type: select
        required: true
        options:
        - titolo_non_valido
        - titolo_non_ricevuto
        - evento_annullato
        - altro
        label:
          it: Motivo
      - name: details
        type: textarea
        required: true
        label:
          it: Descrizione
      - name: status
        type: select
        options:
        - aperta
        - in_esame
        - rimborsata
        - respinta
        default: aperta
        label:
          it: Stato
      retentionDays: 1825
    - name: alert_hits
      description: Esiti degli avvisi
      ownedBy: instance
  views:
  - key: home
    type: page
    nav: false
    sections:
    - type: hero
      eyebrow:
        it: Biglietti tra fan
      title:
        it: Rivendi o trova un biglietto al **prezzo originale**.
      text:
        it: 'Nessun bagarinaggio: il prezzo non supera mai quello pagato. Ogni inserzione è verificata e moderata prima di
          essere pubblicata.'
      actions:
      - label:
          it: Cerca un biglietto
        href: /v/listings
        style: primary
      - label:
          it: Vendi un biglietto
        href: /v/sell
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
      items:
      - title:
          it: 1 · Registra
        text:
          it: Il venditore inserisce evento, data, settore, prezzo pagato e dati del titolo.
      - title:
          it: 2 · Controllo e moderazione
        text:
          it: Un agente verifica il limite di prezzo e segnala i casi sospetti; un operatore approva.
      - title:
          it: 3 · Avviso
        text:
          it: Chi cerca imposta un avviso e riceve un'email appena compare un biglietto.
      - title:
          it: 4 · Acquisto protetto
        text:
          it: Il pagamento passa dalla piattaforma e il titolo è trasferito secondo le regole dell'organizzatore.
    - type: cards
      id: regole
      title:
        it: Le regole
      items:
      - title:
          it: Prezzo massimo
        text:
          it: Mai oltre il prezzo originale.
      - title:
          it: Commissione
        text:
          it: Una piccola commissione di servizio sulla transazione.
      - title:
          it: Contestazioni
        text:
          it: Un operatore gestisce dispute e rimborsi.
    - type: note
      content:
        it: 'Il portale non è una biglietteria ufficiale: il trasferimento del titolo segue le regole di ciascun organizzatore.'
  - key: sell
    type: form
    collection: tickets
    title:
      it: Vendi un biglietto
    fields:
    - event
    - event_date
    - section
    - price_paid
    - asking_price
    - ticket_data
    - proof
    - seller_email
    submit:
      label:
        it: Invia per la verifica
      message:
        it: 'Biglietto ricevuto: sarà controllato e moderato prima della pubblicazione.'
      redirect: my_tickets
    roles:
    - user
    - admin
  - key: my_tickets
    type: table
    title:
      it: I miei biglietti
    source: collection:tickets
    columns:
    - event
    - event_date
    - section
    - asking_price
    - status
    - flags
    roles:
    - user
    - admin
  - key: listings
    type: cards
    title:
      it: Biglietti disponibili
    source: collection:listings
    query: status = disponibile
    columns:
    - event
    - event_date
    - section
    - asking_price
    - original_price
    roles:
    - user
    - admin
  - key: buy
    type: form
    collection: orders
    title:
      it: Acquista
    fields:
    - listing
    - note
    submit:
      label:
        it: Conferma acquisto
      message:
        it: Ordine ricevuto. Procedi al pagamento tramite la piattaforma.
      redirect: my_orders
    roles:
    - user
    - admin
  - key: my_orders
    type: table
    title:
      it: I miei acquisti
    source: collection:orders
    columns:
    - event
    - price
    - fee
    - status
    roles:
    - user
    - admin
  - key: my_sales
    type: table
    title:
      it: Le mie vendite
    source: collection:orders
    columns:
    - event
    - price
    - status
    roles:
    - seller
    - admin
  - key: alerts
    type: instances
    template: ticket_alert
    title:
      it: I miei avvisi
    roles:
    - user
    - admin
  - key: dispute
    type: form
    collection: disputes
    title:
      it: Apri una contestazione
    submit:
      label:
        it: Invia
      message:
        it: 'Contestazione ricevuta: un operatore la esaminerà.'
    roles:
    - user
    - admin
  - key: my_disputes
    type: table
    title:
      it: Le mie contestazioni
    source: collection:disputes
    columns:
    - order_ref
    - reason
    - status
    roles:
    - user
    - admin
  - key: moderation
    type: approvals
    title:
      it: Moderazione
    approvals:
    - publish_listing
    roles:
    - operator
    - admin
  - key: ops_tickets
    type: table
    title:
      it: Tutti i biglietti
    source: collection:tickets
    columns:
    - event
    - event_date
    - price_paid
    - asking_price
    - price_ok
    - status
    - flags
    export: true
    roles:
    - operator
    - admin
  - key: ops_orders
    type: table
    title:
      it: Tutti gli ordini
    source: collection:orders
    columns:
    - event
    - price
    - fee
    - seller_email
    - status
    export: true
    roles:
    - operator
    - admin
  - key: ops_disputes
    type: table
    title:
      it: Contestazioni e rimborsi
    source: collection:disputes
    columns:
    - order_ref
    - reason
    - details
    - status
    roles:
    - operator
    - admin
  approvals:
  - key: publish_listing
    title:
      it: Pubblica inserzione
    description: L'operatore verifica l'inserzione segnalata dall'agente prima della pubblicazione
    role: operator
    decidedBy: role
    fields:
    - event
    - asking_price
    - price_paid
    - flags
    timeoutMinutes: 4320
    onTimeout: reject
  triggers:
  - key: ticket_submitted
    'on':
      collection: tickets
      op: insert
      where:
        status: in_revisione
    start:
      agent: moderator
    goal: 'Controlla il biglietto: evento {record.event}, prezzo pagato {record.price_paid}, prezzo richiesto {record.asking_price}.'
    asUser: true
  - key: listing_approved
    'on':
      approval: publish_listing
      decision: approved
    start:
      agent: publisher
    goal: Pubblica l'inserzione approvata. {event}
    asUser: true
  - key: listing_rejected
    'on':
      approval: publish_listing
      decision: rejected
    notify:
      to: owner
      subject:
        it: Inserzione non pubblicata
      body:
        it: La tua inserzione non è stata approvata dall'operatore. Controlla il prezzo e i dati del titolo e riprova.
      link: my_tickets
  - key: order_created
    'on':
      collection: orders
      op: insert
      where:
        status: in_attesa
    start:
      agent: settler
    goal: 'Elabora il nuovo ordine. Inserzione scelta: {record.listing}.'
    asUser: true
  - key: order_alert_ops
    'on':
      collection: orders
      op: insert
    notify:
      to:
      - admins
      - role:operator
      subject:
        it: Nuovo ordine
      body:
        it: È stato effettuato un nuovo ordine di biglietti. Controlla lo stato del pagamento e del trasferimento del titolo.
      link: ops_orders
  - key: dispute_opened
    'on':
      collection: disputes
      op: insert
    notify:
      to:
      - admins
      - role:operator
      subject:
        it: Nuova contestazione
      body:
        it: 'Un utente ha aperto una contestazione: {record.reason}. Esaminala nella sezione contestazioni.'
      link: ops_disputes
  - key: order_refunded
    'on':
      collection: orders
      op: update
      where:
        status: titolo_trasferito
    notify:
      to:
      - owner
      - record.seller_email
      subject:
        it: 'Titolo trasferito: {record.event}'
      body:
        it: Il titolo per {record.event} è stato trasferito al compratore. Grazie per aver usato Biglietti tra Fan.
      link: my_orders
  - key: fee_on_transfer
    'on':
      collection: orders
      op: update
      where:
        status: titolo_trasferito
    charge:
      credits: 1
      reason: registrazione commissione di servizio
  billing:
    modes:
    - per_transaction
    currency: eur
    transactionFeePct: 5
  extensions:
  - key: pagamento_e_titolo
    description: 'Incasso dal compratore, pagamento al venditore al netto della commissione, rimborsi e trasferimento effettivo
      del titolo secondo le regole dell''organizzatore non sono automatizzabili con gli strumenti attuali: l''operatore aggiorna
      lo stato dell''ordine (pagato, titolo_trasferito, rimborsato) e la piattaforma di pagamento gestisce i fondi.'
  - key: privacy_venditore
    description: 'L''email del venditore è memorizzata nel catalogo condiviso per collegare gli ordini: le viste non la mostrano,
      ma serve un meccanismo di riferimento anonimo.'
