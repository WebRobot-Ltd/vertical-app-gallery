apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: conformita-guidata
  displayName: Conformità Guidata
  tagline:
    it: 'ISO 27001, NIS2 e AI Act: dal questionario al piano di lavoro.'
    en: 'ISO 27001, NIS2 and the AI Act: from questionnaire to work plan.'
  description:
    it: Un questionario guidato, un agente che stabilisce quali norme si applicano, calcola il gap per requisito e prepara
      piano, priorità, bozze di policy e responsabili. Un auditor esterno invitato rivede e firma.
    en: A guided questionnaire, an agent that decides which rules apply, computes the gap per requirement and prepares the
      plan, priorities, draft policies and owners. An invited external auditor reviews and signs off.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12355b'
      accent: '#1b7f6b'
      background: '#f6f8fb'
      foreground: '#162033'
    fonts:
      body: Inter
      display: Source Serif 4
    wordmark:
    - text: Conformità
      color: primary
    - text: Guidata
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Norme
        en: Frameworks
      href: '#norme'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: user
      label:
        it: Azienda
        en: Company
      assignedBy: signup
    - key: auditor
      label:
        it: Auditor esterno
        en: External auditor
      assignedBy: derived
      from: collection:audit_assignments.auditor_email
  limits:
  - action: agent:assessor
    per: user
    max: 5
    window: day
    roles:
    - user
  egress:
    hosts:
    - eur-lex.europa.eu
    notes: 'EUR-Lex: testi pubblici della normativa UE (NIS2 2022/2555, AI Act 2024/1689), riuso consentito con attribuzione
      (Decisione 2011/833/UE, CC BY 4.0). I testi ISO non sono accessibili: l''azienda incolla la propria copia licenziata.'
  agents:
  - key: assessor
    role: main
    description: Determines applicable frameworks, computes the gap per requirement and writes the work plan with draft policies.
    profile:
      inline:
        display_name: Conformità Guidata assessor
        crews:
        - id: assessor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 1.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un consulente di conformità per PMI europee (ISO/IEC 27001, direttiva NIS2, AI Act). Lavori
            solo su ciò che l''azienda ha dichiarato nel questionario e sulle evidenze che ha incollato o linkato. Per NIS2
            e AI Act leggi il testo pubblico con lo strumento eurlex_text (GET, query uri=CELEX:32022L2555 per NIS2, uri=CELEX:32024R1689
            per AI Act) e cita articoli e allegati. Per ISO 27001 usa SOLO il testo licenziato che l''azienda ha caricato
            (strumento read_licensed_texts); se manca, usa i titoli generici dei controlli senza riprodurre il testo della
            norma e chiedi di incollarlo. Non inventare mai requisiti, articoli o cifre. Non dare consulenza legale come fatto
            certo: indica sempre cosa va verificato con un legale. Una evidenza non fornita è un gap ''non dimostrato'', non
            ''conforme''. Struttura del report, iniziando con un titolo di livello 1 ''# Piano di conformità — <azienda>'':
            ## Norme applicabili (con motivazione e articoli), ## Gap per requisito (tabella: requisito, stato conforme/parziale/assente/non
            dimostrato, evidenza, gap), ## Piano di lavoro (priorità P1-P3, responsabile suggerito per ruolo, scadenza indicativa),
            ## Bozze di policy (una bozza breve per le policy mancanti più urgenti), ## Evidenze da raccogliere, ## Avvertenze.
            Aggiungi un blocco ```chart di tipo bar con il numero di requisiti per stato. Scrivi ogni controllo valutato con
            write_controls. Al termine chiama request_audit_signoff per far rivedere il risultato all''auditor, se l''azienda
            ne ha uno assegnato.'
          mcp_servers: []
    goalTemplate: 'Azienda: {company}

      Settore: {sector_label}

      Dimensione: {size_label}

      Servizi erogati: {services}

      Fornitori critici: {suppliers}

      Sistemi informatici: {systems}

      Uso di intelligenza artificiale: {ai_use}

      {?measures}Misure già in essere: {measures}{/measures}

      {?evidence}Evidenze fornite (testo o link): {evidence}{/evidence}

      Framework richiesti: {frameworks_label}

      Data: {date}. Scrivi il report nella lingua con codice ISO {lang}.'
    output: markdown
    limits:
      maxTurns: 25
      maxBudgetUsd: 1.2
    awaits:
    - audit_signoff
    appTools:
    - name: eurlex_text
      description: 'Legge un testo UE su EUR-Lex. Query: uri=CELEX:<numero>'
      action: http
      http:
        method: GET
        url: https://eur-lex.europa.eu/legal-content/IT/TXT/HTML/
        maxBytes: 900000
        attribution: EUR-Lex, Unione europea, CC BY 4.0
    - name: read_licensed_texts
      description: Testi di norme ISO caricati dall'azienda con la propria licenza
      action: read
      collection: licensed_texts
      scope: user
    - name: write_controls
      description: Registra la valutazione di un controllo/requisito
      action: write
      collection: controls
      scope: user
  - key: monitor
    role: helper
    description: Monthly re-check of one company's evidence against its controls.
    memory: instance
    writesTo:
      collection: monthly_reviews
    profile:
      inline:
        display_name: Conformità Guidata monitor
        crews:
        - id: monitor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Ricontrolli ogni mese lo stato dei controlli dell''azienda (strumento read_controls) e le evidenze
            aggiornate (read_evidence). Inizia con ''# Controllo mensile — <mese>''. Sezioni: ## Scostamenti (controlli peggiorati
            o evidenze scadute), ## Miglioramenti, ## Azioni per il mese prossimo. Non inventare dati: se le evidenze non
            sono cambiate, dillo. Usa la memoria: confronta con l''ultimo controllo e alla fine chiama remember con i 5 punti
            chiave.'
          mcp_servers: []
    appTools:
    - name: read_controls
      description: Controlli dell'azienda
      action: read
      collection: controls
      scope: user
    - name: read_evidence
      description: Evidenze incollate dall'azienda
      action: read
      collection: evidence_items
      scope: user
  templates:
  - key: monthly_check
    title:
      it: Controllo mensile
      en: Monthly check
    description:
      it: Ogni mese l'agente ricontrolla le evidenze e riporta gli scostamenti.
      en: Every month the agent re-checks the evidence and reports deviations.
    agent: monitor
    params:
    - name: framework
      type: select
      required: true
      label:
        it: Framework
        en: Framework
      options:
      - value: iso27001
        label: ISO 27001
      - value: nis2
        label: NIS2
      - value: ai_act
        label: AI Act
    goal: Ricontrolla il framework {framework} per "{instance}". Oggi è {date}. Scrivi nella lingua con codice ISO {lang}.
    schedule:
      cron: 0 6 1 * *
      userCanChange: false
    maxPerUser: 3
    cost:
      perRun: 15
  approvals:
  - key: audit_signoff
    title:
      it: Revisione e firma dell'auditor
      en: Auditor review and sign-off
    description: L'auditor rivede evidenze e controlli, approva o respinge e firma lo stato finale.
    role: auditor
    decidedBy: role
    fields:
    - framework
    - summary
    - controls
    timeoutMinutes: 10080
    onTimeout: reject
  inputForm:
    title:
      it: Questionario di conformità
      en: Compliance questionnaire
    fields:
    - name: company
      type: text
      required: true
      label:
        it: Ragione sociale
        en: Company name
    - name: sector
      type: select
      required: true
      label:
        it: Settore
        en: Sector
      options:
      - value: digital
        label:
          it: Servizi digitali / software
          en: Digital services / software
      - value: energy
        label:
          it: Energia
          en: Energy
      - value: health
        label:
          it: Sanità
          en: Health
      - value: transport
        label:
          it: Trasporti
          en: Transport
      - value: manufacturing
        label:
          it: Manifattura
          en: Manufacturing
      - value: finance
        label:
          it: Finanza
          en: Finance
      - value: other
        label:
          it: Altro
          en: Other
    - name: size
      type: select
      required: true
      label:
        it: Dimensione
        en: Size
      options:
      - value: micro
        label:
          it: Micro (<10 addetti)
          en: Micro (<10 staff)
      - value: small
        label:
          it: Piccola (10-49)
          en: Small (10-49)
      - value: medium
        label:
          it: Media (50-249)
          en: Medium (50-249)
    - name: frameworks
      type: select
      required: true
      label:
        it: Framework
        en: Framework
      options:
      - value: auto
        label:
          it: Stabilisci l'agente quali si applicano
          en: Let the agent decide
      - value: iso27001
        label: ISO 27001
      - value: nis2
        label: NIS2
      - value: ai_act
        label: AI Act
    - name: services
      type: textarea
      required: true
      maxLength: 800
      label:
        it: Servizi erogati
        en: Services provided
    - name: suppliers
      type: textarea
      maxLength: 600
      label:
        it: Fornitori critici
        en: Critical suppliers
    - name: systems
      type: textarea
      required: true
      maxLength: 800
      label:
        it: Sistemi informatici (cloud, identità, repository, backup)
        en: IT systems (cloud, identity, repository, backup)
    - name: ai_use
      type: textarea
      maxLength: 600
      label:
        it: Uso di intelligenza artificiale
        en: Use of AI
    - name: measures
      type: textarea
      maxLength: 1000
      label:
        it: Misure già in essere
        en: Measures already in place
    - name: evidence
      type: textarea
      maxLength: 4000
      label:
        it: 'Evidenze (incolla estratti o link: utenti, configurazioni, backup)'
        en: 'Evidence (paste excerpts or links: users, configs, backups)'
      help:
        it: Il collegamento automatico via OAuth non è ancora disponibile.
        en: Automatic OAuth collection is not available yet.
  data:
    collections:
    - name: company_profile
      ownedBy: user
      description: Profilo e risposte al questionario dell'azienda
      fields:
      - name: company
        type: text
      - name: sector
        type: text
      - name: size
        type: text
    - name: licensed_texts
      ownedBy: user
      description: Testi ISO incollati dall'azienda con la propria licenza
      fields:
      - name: standard
        type: text
        required: true
      - name: clause
        type: text
      - name: text
        type: textarea
    - name: evidence_items
      ownedBy: user
      description: Evidenze incollate o linkate
      fields:
      - name: source
        type: text
      - name: kind
        type: select
        options:
        - access_log
        - config
        - user_list
        - backup
        - other
      - name: content
        type: textarea
      - name: link
        type: url
      - name: collected_on
        type: date
    - name: controls
      ownedBy: user
      description: Requisiti valutati con gap, priorità e responsabile
      fields:
      - name: framework
        type: text
      - name: requirement
        type: text
      - name: status
        type: select
        options:
        - compliant
        - partial
        - missing
        - unproven
      - name: gap
        type: textarea
      - name: priority
        type: select
        options:
        - P1
        - P2
        - P3
      - name: owner
        type: text
      - name: draft_policy
        type: textarea
      - name: auditor_decision
        type: select
        options:
        - pending
        - approved
        - rejected
    - name: audit_assignments
      ownedBy: org
      description: Assegnazione auditor-cliente gestita dall'admin
      fields:
      - name: auditor_email
        type: email
        required: true
      - name: client_email
        type: email
        required: true
      - name: framework
        type: text
    - name: monthly_reviews
      ownedBy: instance
      description: Controlli mensili per istanza
  views:
  - key: home
    type: page
    nav: false
    title: Conformità Guidata
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow:
        it: Per le PMI
        en: For SMEs
      title:
        it: Dalla **conformità** confusa a un piano di lavoro chiaro.
        en: From confusing **compliance** to a clear work plan.
      text:
        it: 'Rispondi a un questionario: l''agente stabilisce quali norme ti riguardano (ISO 27001, NIS2, AI Act), calcola
          il gap per requisito e prepara priorità, bozze di policy e responsabili.'
        en: 'Answer a questionnaire: the agent decides which rules apply (ISO 27001, NIS2, AI Act), computes the gap per requirement
          and prepares priorities, draft policies and owners.'
      actions:
      - label:
          it: Inizia il questionario
          en: Start the questionnaire
        href: /v/new_assessment
        style: primary
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: ghost
      aside: <div style="padding:16px"><b>Piano di conformità</b><br>NIS2 · 18 requisiti · 6 gap P1<br>ISO 27001 · testo licenziato
        dell'azienda</div>
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Questionario
          en: Questionnaire
        text:
          it: Settore, dimensioni, servizi, fornitori, sistemi, uso di AI, misure in essere.
          en: Sector, size, services, suppliers, systems, AI use, measures in place.
        badge: 📝
      - title:
          it: Gap e piano
          en: Gap and plan
        text:
          it: Applicabilità, gap per requisito, priorità, policy in bozza e responsabili.
          en: Applicability, gap per requirement, priorities, draft policies and owners.
        badge: 📊
      - title:
          it: Controllo mensile e auditor
          en: Monthly check and auditor
        text:
          it: Ricontrollo mensile delle evidenze; l'auditor invitato approva e firma.
          en: Monthly evidence re-check; the invited auditor approves and signs off.
        badge: ✅
    - type: cards
      id: norme
      title:
        it: Norme coperte
        en: Frameworks covered
      items:
      - title: NIS2
        text:
          it: Direttiva (UE) 2022/2555, dal testo pubblico su EUR-Lex.
          en: Directive (EU) 2022/2555, from the public text on EUR-Lex.
      - title: AI Act
        text:
          it: Regolamento (UE) 2024/1689, dal testo pubblico su EUR-Lex.
          en: Regulation (EU) 2024/1689, from the public text on EUR-Lex.
      - title: ISO 27001
        text:
          it: 'Il testo della norma è protetto: carichi la tua copia licenziata.'
          en: 'The standard''s text is copyrighted: you provide your licensed copy.'
    - type: note
      content:
        it: Supporto alla conformità, non consulenza legale. Verifica sempre con un professionista.
        en: Compliance support, not legal advice. Always verify with a professional.
  - key: new_assessment
    type: new_run
    title:
      it: Nuova valutazione
      en: New assessment
    roles:
    - user
    - admin
  - key: assessments
    type: history
    title:
      it: Le mie valutazioni
      en: My assessments
    source: run
    roles:
    - user
    - admin
  - key: assessment
    type: report
    source: run
    printable: true
    nav: false
  - key: licensed
    type: table
    title:
      it: Testi ISO licenziati
      en: Licensed ISO texts
    source: collection:licensed_texts
    roles:
    - user
  - key: evidence
    type: table
    title:
      it: Evidenze
      en: Evidence
    source: collection:evidence_items
    roles:
    - user
  - key: controls_view
    type: table
    title:
      it: Controlli e piano
      en: Controls and plan
    source: collection:controls
    data:
      display: table
      fields:
      - key: framework
        label: Framework
      - key: requirement
        label:
          it: Requisito
          en: Requirement
      - key: status
        label:
          it: Stato
          en: Status
        format: badge
      - key: priority
        label:
          it: Priorità
          en: Priority
        format: badge
      - key: owner
        label:
          it: Responsabile
          en: Owner
      - key: auditor_decision
        label: Auditor
        format: badge
      limit: 200
    roles:
    - user
    - auditor
    - admin
  - key: checks
    type: instances
    template: monthly_check
    title:
      it: Controlli mensili
      en: Monthly checks
    roles:
    - user
    - admin
  - key: signoffs
    type: approvals
    title:
      it: Revisione auditor
      en: Auditor review
    approvals:
    - audit_signoff
    roles:
    - auditor
    - admin
  - key: assignments
    type: table
    title:
      it: Assegnazioni auditor
      en: Auditor assignments
    source: collection:audit_assignments
    roles:
    - admin
  - key: account
    type: account
    title:
      it: Abbonamenti
      en: Subscriptions
    roles:
    - user
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 50
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:assessor:
        estimate: 100
        metered: true
    packs:
    - key: credits_1000
      credits: 1000
      price: 10
      label: 1000 crediti
    plans:
    - key: iso27001_year
      price: 990
      interval: year
      label: ISO 27001 — annuale
      includes:
      - Valutazione, piano e controlli mensili ISO 27001
      credits: 2000
      creditsReset: never
      roles:
      - user
    - key: nis2_year
      price: 790
      interval: year
      label: NIS2 — annuale
      includes:
      - Valutazione, piano e controlli mensili NIS2
      credits: 2000
      creditsReset: never
      roles:
      - user
    - key: ai_act_year
      price: 790
      interval: year
      label: AI Act — annuale
      includes:
      - Valutazione, piano e controlli mensili AI Act
      credits: 2000
      creditsReset: never
      roles:
      - user
  extensions:
  - key: oauth_evidence
    description: 'Non ancora disponibile: raccolta automatica delle evidenze via OAuth (suite cloud, provider di identità,
      repository). Per ora l''azienda incolla estratti o link nella raccolta Evidenze.'
  - key: file_upload
    description: 'Non ancora disponibile: caricamento di file. Il testo ISO licenziato va incollato nella raccolta Testi ISO
      licenziati.'
  - key: email_alerts
    description: 'Non ancora disponibile: invio email degli scostamenti mensili. Per ora il controllo mensile appare in Controlli
      mensili.'
  - key: auditor_scope
    description: Il ruolo auditor è derivato da audit_assignments (gestita dall'admin). Il filtro per cui l'auditor vede solo
      i dati dei clienti assegnati e la firma finale per cliente richiedono logica dedicata; oggi l'auditor decide dalle richieste
      di approvazione ricevute.
