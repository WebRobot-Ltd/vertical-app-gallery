apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: conformita-guidata
  displayName: Conformità Guidata
  tagline: 'Dalla PMI alla certificazione: ISO 27001, NIS2 e AI Act, passo dopo passo.'
  description: Un questionario guidato, un agente che stabilisce le norme applicabili, calcola il gap per ogni requisito e
    prepara piano di lavoro e bozze di policy. Un auditor esterno rivede le evidenze e firma lo stato finale.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12304a'
      accent: '#1f7a6d'
      background: '#f6f8fa'
      foreground: '#17212b'
    fonts:
      body: Inter
      display: Source Serif 4
  header:
    links:
    - label: Come funziona
      href: '#come-funziona'
    - label: Framework
      href: '#framework'
    cta:
      label: Accedi
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
    - key: auditor
      label: Auditor esterno
      assignedBy: derived
      from: collection:company_profile.auditor_email
  limits:
  - action: agent:assessor
    per: user
    max: 3
    window: month
    roles:
    - user
    plans:
      iso27001_annual: 10
      nis2_annual: 10
      aiact_annual: 10
  egress:
    hosts:
    - eur-lex.europa.eu
    notes: 'Testi pubblici della normativa UE (NIS2 32022L2555, AI Act 32024R1689) da EUR-Lex; riutilizzo consentito dalla
      Decisione 2011/833/UE con citazione della fonte. I testi ISO sono protetti da copyright: solo la copia licenziata caricata
      dall''azienda.'
  agents:
  - key: assessor
    role: main
    description: Stabilisce le norme applicabili, calcola il gap per requisito, scrive il piano di lavoro e le bozze di policy.
    profile:
      inline:
        display_name: Assessor di conformità
        crews:
        - id: assessor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un consulente di conformità per PMI europee (ISO/IEC 27001, NIS2, AI Act). Procedi così: 1)
            leggi il profilo aziendale con read_profile e le evidenze con read_evidence; 2) stabilisci se e come il framework
            richiesto si applica (NIS2: settore, dimensione, soggetto essenziale/importante; AI Act: ruolo e categoria di
            rischio dei sistemi IA; ISO 27001: perimetro volontario), citando gli articoli; 3) per NIS2 e AI Act recupera
            il testo pubblico con eurlex_text (query ''uri=CELEX:32022L2555'' per NIS2, ''uri=CELEX:32024R1689'' per AI Act)
            e basati su quello; per ISO 27001 usa SOLO la copia licenziata caricata dall''azienda (elenco nel contesto, aprila
            con read_upload usando l''id del file); se manca, dillo e lavora sui temi generali senza riprodurre il testo della
            norma; 4) per ogni requisito salva un record con write_controls (framework, requirement_ref, title, gap: none|partial|full,
            priority: high|medium|low, owner, status: open, notes, auditor_email dal profilo); 5) salva le bozze di policy
            con write_policies (framework, title, body in Markdown, status: draft, auditor_email); 6) quando il piano è pronto,
            chiedi la revisione dell''auditor con request_control_review; al termine dell''audit usa request_final_signoff.
            Non inventare mai articoli o requisiti, non dare consulenza legale come fatto: indica le incertezze. Il report
            inizia con un titolo ''# '' e ha le sezioni: ## Norme applicabili, ## Gap per requisito (tabella), ## Piano di
            lavoro prioritizzato, ## Policy in bozza, ## Responsabili, ## Prossimi passi. Aggiungi un blocco chart bar con
            il numero di gap per priorità.'
          mcp_servers: []
    goalTemplate: 'Framework: {framework_label}.

      Profilo aziendale (JSON): {profile}

      Testi licenziati caricati dall''azienda: {licensed}

      {?focus}Priorità indicate dall''utente: {focus}{/focus}

      Data: {date}. Scrivi in lingua {lang}.'
    context:
    - key: profile
      from: collection:company_profile
    - key: licensed
      from: collection:licensed_standards
    appTools:
    - name: read_profile
      description: Legge il profilo aziendale compilato dal responsabile
      action: read
      collection: company_profile
      scope: user
    - name: read_evidence
      description: Legge le evidenze raccolte
      action: read
      collection: evidence
      scope: user
    - name: write_controls
      description: Crea o aggiorna il controllo di un requisito
      action: write
      collection: controls
      scope: user
    - name: write_policies
      description: Salva la bozza di una policy
      action: write
      collection: policies
      scope: user
    - name: eurlex_text
      description: 'Scarica il testo pubblico di un atto UE da EUR-Lex (query: uri=CELEX:<numero>)'
      action: http
      http:
        method: GET
        url: https://eur-lex.europa.eu/legal-content/IT/TXT/HTML/
        attribution: EUR-Lex, Unione europea
        maxBytes: 900000
    - name: read_upload
      description: Legge un file caricato dall'azienda (copia licenziata della norma, evidenze)
      action: read_file
    awaits:
    - control_review
    - final_signoff
    output: markdown
    limits:
      maxTurns: 40
      maxBudgetUsd: 1.5
  - key: monitor
    role: scheduled
    description: Ogni mese ricontrolla le evidenze del progetto e segnala gli scostamenti.
    memory: instance
    writesTo:
      collection: drift_reports
    profile:
      inline:
        display_name: Monitor di conformità
        crews:
        - id: monitor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Ricontrolli ogni mese lo stato di conformità di un''azienda per un framework. Leggi i controlli
            con read_controls e le evidenze con read_evidence (aprile con read_upload se sono file). Segnala: evidenze scadute
            o più vecchie di 90 giorni, controlli senza evidenza, scostamenti rispetto al mese scorso (la tua memoria contiene
            l''ultimo stato). Per ogni controllo peggiorato aggiornalo con write_controls (status: drift). Report: ''# Controllo
            mensile — <framework> — <data>'', sezioni ## Scostamenti, ## Invariato, ## Azioni consigliate; massimo 300 parole,
            nessun dato inventato. Alla fine chiama remember una volta con i 5 punti chiave.'
          mcp_servers: []
    appTools:
    - name: read_controls
      description: Legge i controlli del progetto
      action: read
      collection: controls
      scope: user
    - name: read_evidence
      description: Legge le evidenze raccolte
      action: read
      collection: evidence
      scope: user
    - name: write_controls
      description: Crea o aggiorna il controllo di un requisito
      action: write
      collection: controls
      scope: user
    - name: read_upload
      description: Legge un file caricato dall'azienda
      action: read_file
    output: markdown
  inputForm:
    title: Nuova analisi di conformità
    fields:
    - name: framework
      type: select
      required: true
      label: Framework
      options:
      - value: iso27001
        label: ISO/IEC 27001
        gatedBy: iso27001_annual
      - value: nis2
        label: NIS2
        gatedBy: nis2_annual
      - value: aiact
        label: AI Act
        gatedBy: aiact_annual
    - name: focus
      type: textarea
      maxLength: 500
      label: Priorità (facoltativo)
      help: es. certificazione entro giugno, cliente che la richiede
  data:
    collections:
    - name: company_profile
      ownedBy: user
      description: Questionario guidato dell'azienda
      access:
      - role: auditor
        where:
          auditor_email: '{user.email}'
        can:
        - read
      fields:
      - name: company_name
        type: text
        required: true
        label: Ragione sociale
      - name: sector
        type: text
        required: true
        label: Settore
      - name: size
        type: select
        required: true
        label: Dimensione
        options:
        - value: micro
          label: Micro (<10)
        - value: small
          label: Piccola (<50)
        - value: medium
          label: Media (<250)
        - value: large
          label: Grande
      - name: turnover_eur
        type: number
        label: Fatturato annuo (EUR)
      - name: services
        type: textarea
        required: true
        label: Servizi erogati
      - name: critical_suppliers
        type: textarea
        label: Fornitori critici
      - name: it_systems
        type: textarea
        required: true
        label: Sistemi informatici (cloud, identità, repository, backup)
      - name: uses_ai
        type: boolean
        label: Usa o fornisce sistemi di intelligenza artificiale
      - name: ai_systems
        type: textarea
        label: Sistemi IA e finalità
        visibleWhen: uses_ai == true
      - name: measures
        type: textarea
        label: Misure già in essere
      - name: auditor_email
        type: email
        label: Email dell'auditor esterno invitato
    - name: controls
      ownedBy: user
      description: Requisiti, gap, priorità, responsabili e decisione dell'auditor
      access:
      - role: auditor
        where:
          auditor_email: '{user.email}'
        can:
        - read
        - write
      fields:
      - name: framework
        type: select
        options:
        - iso27001
        - nis2
        - aiact
      - name: requirement_ref
        type: text
        label: Riferimento
      - name: title
        type: text
        label: Requisito
      - name: gap
        type: select
        label: Gap
        options:
        - none
        - partial
        - full
      - name: priority
        type: select
        label: Priorità
        options:
        - high
        - medium
        - low
      - name: owner
        type: text
        label: Responsabile
      - name: status
        type: select
        label: Stato
        options:
        - open
        - in_progress
        - submitted
        - drift
        - closed
      - name: notes
        type: textarea
        label: Note
      - name: auditor_decision
        type: select
        label: Decisione auditor
        options:
        - pending
        - approved
        - rejected
      - name: auditor_email
        type: email
    - name: evidence
      ownedBy: user
      description: 'Evidenze: log, configurazioni, elenchi utenti, backup'
      access:
      - role: auditor
        where:
          auditor_email: '{user.email}'
        can:
        - read
      fields:
      - name: control_ref
        type: text
        required: true
        label: Controllo collegato
      - name: source
        type: select
        label: Origine
        options:
        - cloud_suite
        - identity_provider
        - code_repository
        - backup
        - other
      - name: description
        type: textarea
        label: Descrizione
      - name: file
        type: file
        label: File
        accept:
        - pdf
        - csv
        - xlsx
        - txt
        - json
        - png
        - jpg
        maxMb: 15
        multiple: true
      - name: collected_on
        type: date
        label: Data raccolta
      - name: auditor_email
        type: email
        label: Email dell'auditor
    - name: licensed_standards
      ownedBy: user
      description: Copia licenziata delle norme ISO caricata dall'azienda (solo uso interno)
      retentionDays: 730
      fields:
      - name: standard
        type: text
        required: true
        label: Norma (es. ISO/IEC 27001:2022)
      - name: file
        type: file
        required: true
        label: Copia licenziata
        accept:
        - pdf
        - docx
        - txt
        maxMb: 15
    - name: policies
      ownedBy: user
      description: Bozze di policy
      access:
      - role: auditor
        where:
          auditor_email: '{user.email}'
        can:
        - read
      fields:
      - name: framework
        type: text
      - name: title
        type: text
      - name: body
        type: textarea
      - name: status
        type: select
        options:
        - draft
        - approved
      - name: auditor_email
        type: email
    - name: drift_reports
      ownedBy: instance
      description: Controlli mensili di ogni osservatorio
  views:
  - key: home
    type: page
    nav: false
    title: Conformità Guidata
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow: Per le PMI
      title: Certificazioni e adempimenti, **senza perdersi** tra le norme.
      text: Rispondi a un questionario, l'agente stabilisce quali norme ti riguardano, calcola il gap per ogni requisito e
        prepara piano, policy e responsabili. Un auditor esterno rivede e firma.
      actions:
      - label: Inizia
        href: /login
        style: primary
      - label: Come funziona
        href: '#come-funziona'
        style: ghost
    - type: steps
      id: come-funziona
      title: Come funziona
      items:
      - title: Questionario
        text: Settore, dimensioni, servizi, fornitori, sistemi, IA e misure già in essere.
      - title: Gap e piano
        text: Applicabilità dai testi UE pubblici, gap per requisito, priorità e policy in bozza.
      - title: Evidenze
        text: Carichi le evidenze; ogni mese un agente le ricontrolla e ti avvisa via email.
      - title: Audit
        text: L'auditor invitato approva o respinge i controlli e firma lo stato finale.
    - type: cards
      id: framework
      title: Framework (abbonamento annuale per framework)
      items:
      - title: ISO/IEC 27001
        text: Con la tua copia licenziata della norma.
      - title: NIS2
        text: Direttiva (UE) 2022/2555, dai testi EUR-Lex.
      - title: AI Act
        text: Regolamento (UE) 2024/1689, dai testi EUR-Lex.
    - type: note
      content: 'Supporto alla conformità, non consulenza legale. I testi ISO non sono inclusi: serve la copia licenziata dell''azienda.'
  - key: profile
    type: form
    title: Questionario
    collection: company_profile
    edit: true
    submit:
      label: Salva il profilo
      message: Profilo salvato. Ora avvia l'analisi.
      redirect: new_assessment
    roles:
    - user
    - admin
  - key: new_assessment
    type: new_run
    title: Nuova analisi
    roles:
    - user
    - admin
  - key: assessments
    type: history
    title: Le mie analisi
    source: run
    roles:
    - user
    - admin
  - key: assessment
    type: report
    source: run
    printable: true
    nav: false
  - key: controls_table
    type: table
    title: Controlli e piano
    source: collection:controls
    columns:
    - framework
    - requirement_ref
    - title
    - gap
    - priority
    - owner
    - status
    - auditor_decision
    export: true
    roles:
    - user
    - admin
  - key: evidence_upload
    type: form
    title: Carica evidenza
    collection: evidence
    submit:
      label: Salva
      message: Evidenza salvata.
    roles:
    - user
    - admin
  - key: evidence_table
    type: table
    title: Evidenze
    source: collection:evidence
    columns:
    - control_ref
    - source
    - collected_on
    - description
    roles:
    - user
    - admin
  - key: licensed_upload
    type: form
    title: Norme licenziate
    collection: licensed_standards
    submit:
      label: Carica
      message: Copia caricata, resta privata.
    roles:
    - user
    - admin
  - key: policies_table
    type: table
    title: Policy in bozza
    source: collection:policies
    columns:
    - framework
    - title
    - status
    roles:
    - user
    - admin
  - key: watches
    type: instances
    template: monthly_check
    title: Controllo mensile
    roles:
    - user
    - admin
  - key: audit_clients
    type: table
    title: 'Clienti assegnati: controlli'
    source: collection:controls
    columns:
    - framework
    - requirement_ref
    - title
    - gap
    - priority
    - status
    - auditor_decision
    roles:
    - auditor
  - key: audit_evidence
    type: table
    title: Evidenze da rivedere
    source: collection:evidence
    columns:
    - control_ref
    - source
    - collected_on
    - description
    roles:
    - auditor
  - key: audit_approvals
    type: approvals
    title: Approvazioni e firma
    approvals:
    - control_review
    - final_signoff
    roles:
    - auditor
    - admin
  - key: account
    type: account
    title: Abbonamento
    roles:
    - user
  templates:
  - key: monthly_check
    title: Controllo mensile
    description: Ogni mese ricontrolla le evidenze e ti scrive gli scostamenti.
    agent: monitor
    params:
    - name: framework
      type: select
      required: true
      label: Framework
      options:
      - value: iso27001
        label: ISO/IEC 27001
      - value: nis2
        label: NIS2
      - value: aiact
        label: AI Act
    goal: Controllo mensile "{instance}" per il framework {framework}. Oggi è {date}. Scrivi in lingua {lang}.
    schedule:
      cron: 0 6 1 * *
      userCanChange: false
    maxPerUser: 3
    deliver:
      to: owner
      onlyIfNew: false
  approvals:
  - key: control_review
    title: Revisione dei controlli
    role: auditor
    fields:
    - framework
    - requirement_ref
    - status
    timeoutMinutes: 10080
    onTimeout: reject
  - key: final_signoff
    title: Firma dello stato finale
    role: auditor
    fields:
    - framework
    - status
    timeoutMinutes: 10080
    onTimeout: reject
  triggers:
  - key: auditor_invited
    'on':
      collection: company_profile
      op: any
    notify:
      to:
      - record.auditor_email
      subject: 'Invito come auditor: {record.company_name}'
      body: '{record.company_name} ti ha indicato come auditor esterno su Conformità Guidata. Accedi con questa email per
        vedere i controlli assegnati.'
      link: audit_clients
  - key: control_submitted
    'on':
      collection: controls
      op: update
      where:
        status: submitted
    notify:
      to:
      - record.auditor_email
      subject: 'Controllo da rivedere: {record.title}'
      body: Il controllo {record.requirement_ref} è pronto per la tua revisione.
      link: audit_clients
  - key: control_rejected
    'on':
      collection: controls
      op: update
      where:
        auditor_decision: rejected
    notify:
      to:
      - owner
      subject: 'Controllo respinto: {record.title}'
      body: L'auditor ha respinto il controllo {record.requirement_ref}. Vedi le note e carica nuove evidenze.
      link: controls_table
  - key: control_drift
    'on':
      collection: controls
      op: update
      where:
        status: drift
    notify:
      to:
      - owner
      subject: 'Scostamento rilevato: {record.title}'
      body: Il controllo mensile ha rilevato uno scostamento su {record.requirement_ref}.
      link: controls_table
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: iso27001_annual
      price: 590
      interval: year
      label: ISO 27001 — annuale
      roles:
      - user
      includes:
      - analisi e gap ISO 27001
      - controllo mensile
      - revisione auditor
    - key: nis2_annual
      price: 590
      interval: year
      label: NIS2 — annuale
      roles:
      - user
      includes:
      - analisi e gap NIS2
      - controllo mensile
      - revisione auditor
    - key: aiact_annual
      price: 590
      interval: year
      label: AI Act — annuale
      roles:
      - user
      includes:
      - analisi e gap AI Act
      - controllo mensile
      - revisione auditor
  notifications:
    emailOnRunDone: true
  extensions:
  - key: oauth_evidence_connectors
    description: 'Raccolta automatica delle evidenze collegando via OAuth suite cloud (Google Workspace / Microsoft 365),
      provider di identità e repository del codice: l''OAuth verso altri servizi non è ancora disponibile. Per ora le evidenze
      si caricano dal modulo ''Carica evidenza''; appena disponibile si aggiungerà un connettore per servizio con le credenziali
      dell''utente.'
  - key: auditor_signature
    description: La firma dell'auditor è registrata come decisione di approvazione (final_signoff) con data e utente; una
      firma qualificata (eIDAS) non è disponibile.
