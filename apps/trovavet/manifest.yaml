apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: trovavet
  displayName: TrovaVet
  tagline:
    it: Il veterinario specialista giusto, vicino a casa tua.
  description:
    it: 'Descrivi il problema del tuo animale: TrovaVet individua la specializzazione adatta (senza fare diagnosi), ti mostra
      i veterinari verificati vicini a te, in lista e su mappa, e ti fa prenotare una visita.'
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1d4e5f'
      accent: '#e07a3f'
      background: '#f7f9f8'
      foreground: '#17262b'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Trova
      color: primary
    - text: Vet
      color: accent
  header:
    links:
    - label:
        it: Come funziona
      href: '#come-funziona'
    - label:
        it: Per le cliniche
      href: '#cliniche'
    cta:
      label:
        it: Trova un veterinario
      href: /v/find
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: owner
      label:
        it: Proprietario
      assignedBy: signup
    - key: vet
      label:
        it: Veterinario / clinica
      assignedBy: derived
      from: collection:vet_profiles.email
  limits:
  - action: agent:matcher
    per: user
    max: 10
    window: day
  agents:
  - key: matcher
    role: main
    description: Interpreta il problema, sceglie la specializzazione e ordina i veterinari per pertinenza e distanza.
    profile:
      inline:
        display_name: TrovaVet matcher
        crews:
        - id: matcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''assistente di TrovaVet. Aiuti il proprietario di un animale a trovare un veterinario specialista.
            NON fai diagnosi, non dai consigli terapeutici e non minimizzi i sintomi. Passi: 1) dalla descrizione scegli UNA
            specializzazione tra cardiologia, dermatologia, ortopedia, esotici (altrimenti ''medicina generale'') e spiega
            in una frase perche'', precisando che non e'' una diagnosi. 2) Con geocode (Nominatim: query q=<comune>, format=json,
            limit=1) ottieni lat/lon del comune. 3) Con search_vets cerca i professionisti pubblicati con quella specializzazione
            e che trattano la specie. 4) Stima la distanza in km tra comune e ogni veterinario dalle coordinate (formula approssimata)
            e scarta chi supera la distanza massima. 5) Ordina per pertinenza (specializzazione, specie, titoli) e poi distanza.
            Se l''urgenza e'' alta, scrivi in evidenza di contattare subito un pronto soccorso veterinario. Non inventare
            mai veterinari, tariffe o orari: usa solo i record trovati. Struttura: titolo ''# Veterinari per <specie> — <specializzazione>
            a <comune>'', sezioni ## Specializzazione consigliata, ## Veterinari consigliati (tabella: nome, clinica, indirizzo,
            km, tariffa indicativa, perche'' e'' pertinente, email), ## Come prenotare (vai su Prenota e scegli lo slot del
            veterinario), ## Avvertenze. Se non trovi nessuno, dillo e suggerisci di ampliare la distanza.'
    goalTemplate: 'Specie: {species_label}

      {?breed}Razza: {breed}{/breed}

      {?age}Eta'': {age} anni{/age}

      Problema o esame richiesto: {problem}

      Comune: {city}

      Distanza massima: {max_km} km

      Urgenza: {urgency_label}

      Oggi: {date}. Scrivi in italiano.'
    appTools:
    - name: geocode
      description: Geocodifica un comune con Nominatim (q=<comune>, format=json, limit=1)
      action: http
      http:
        method: GET
        url: https://nominatim.openstreetmap.org/search
        attribution: OpenStreetMap contributors, ODbL
    - name: search_vets
      description: Cerca i veterinari pubblicati
      action: search
      collection: vets
      scope: all
    output: markdown
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.5
  - key: publisher
    role: helper
    description: Pubblica nel catalogo il profilo di un veterinario verificato dall'admin.
    profile:
      inline:
        display_name: TrovaVet publisher
        crews:
        - id: publisher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Ricevi il profilo di un veterinario verificato. Geocodifica l''indirizzo con geocode (q=<indirizzo
            completo>, format=json, limit=1) per ottenere lat e lon numerici, poi chiama write_vet una sola volta sul catalogo
            con: email (chiave del record), name, clinic, specializations, species, address, city, lat, lon, hours, slots,
            fee_from, titles, phone. Copia i dati cosi'' come sono, senza inventare nulla. Rispondi con ''# Pubblicato'' e
            una riga di riepilogo.'
    appTools:
    - name: geocode
      description: Geocodifica un indirizzo con Nominatim (q=<indirizzo>, format=json, limit=1)
      action: http
      http:
        method: GET
        url: https://nominatim.openstreetmap.org/search
        attribution: OpenStreetMap contributors, ODbL
    - name: write_vet
      description: Scrive il profilo nel catalogo dei veterinari pubblicati
      action: write
      collection: vets
      scope: all
    output: markdown
    limits:
      maxTurns: 6
      maxBudgetUsd: 0.2
  inputForm:
    title:
      it: Cerca un veterinario specialista
    fields:
    - name: species
      type: select
      required: true
      label:
        it: Specie
      options:
      - value: cane
        label: Cane
      - value: gatto
        label: Gatto
      - value: coniglio
        label: Coniglio
      - value: uccello
        label: Uccello
      - value: rettile
        label: Rettile
      - value: altro
        label: Altro esotico
    - name: breed
      type: text
      label:
        it: Razza
    - name: age
      type: number
      label:
        it: Eta' (anni)
    - name: problem
      type: textarea
      required: true
      maxLength: 800
      label:
        it: Sintomo o esame richiesto
    - name: city
      type: text
      required: true
      label:
        it: Comune
    - name: max_km
      type: number
      required: true
      default: 30
      label:
        it: Distanza massima (km)
    - name: urgency
      type: select
      required: true
      label:
        it: Urgenza
      options:
      - value: bassa
        label: Controllo di routine
      - value: media
        label: Nei prossimi giorni
      - value: alta
        label: Urgente
  data:
    collections:
    - name: vet_profiles
      ownedBy: user
      description: Profilo inviato dal veterinario; pubblicato solo dopo la verifica dell'iscrizione all'ordine.
      fields:
      - name: email
        type: email
        required: true
        label: Email
      - name: name
        type: text
        required: true
        label: Nome e cognome
      - name: clinic
        type: text
        label: Clinica
      - name: order_number
        type: text
        required: true
        label: Numero di iscrizione all'ordine
      - name: order_province
        type: text
        required: true
        label: Ordine provinciale
      - name: specializations
        type: multiselect
        required: true
        label: Specializzazioni
        options:
        - cardiologia
        - dermatologia
        - ortopedia
        - esotici
        - medicina generale
      - name: species
        type: multiselect
        required: true
        label: Specie trattate
        options:
        - cane
        - gatto
        - coniglio
        - uccello
        - rettile
        - altro
      - name: address
        type: text
        required: true
        label: Indirizzo
      - name: city
        type: text
        required: true
        label: Comune
      - name: phone
        type: text
        label: Telefono
      - name: hours
        type: textarea
        label: Orari
      - name: slots
        type: json
        label: Slot prenotabili (giorni, orari, durata)
      - name: fee_from
        type: number
        label: Tariffa indicativa da (EUR)
      - name: titles
        type: textarea
        label: Titoli
      - name: status
        type: select
        label: Stato
        default: submitted
        options:
        - submitted
        - verified
        - rejected
      access:
      - role: admin
        can:
        - read
        - write
    - name: vets
      ownedBy: shared
      description: Catalogo dei veterinari verificati e pubblicati.
      searchable: true
      fields:
      - name: email
        type: email
      - name: name
        type: text
      - name: clinic
        type: text
      - name: specializations
        type: multiselect
        options:
        - cardiologia
        - dermatologia
        - ortopedia
        - esotici
        - medicina generale
      - name: species
        type: multiselect
        options:
        - cane
        - gatto
        - coniglio
        - uccello
        - rettile
        - altro
      - name: address
        type: text
      - name: city
        type: text
      - name: lat
        type: number
      - name: lon
        type: number
      - name: phone
        type: text
      - name: hours
        type: textarea
      - name: slots
        type: json
      - name: fee_from
        type: number
      - name: titles
        type: textarea
    - name: pets
      ownedBy: user
      description: Scheda degli animali del proprietario.
      retentionDays: 1825
      fields:
      - name: name
        type: text
        required: true
        label: Nome
      - name: species
        type: select
        required: true
        label: Specie
        options:
        - cane
        - gatto
        - coniglio
        - uccello
        - rettile
        - altro
      - name: breed
        type: text
        label: Razza
      - name: birth_year
        type: number
        label: Anno di nascita
      - name: notes
        type: textarea
        label: Note (allergie, terapie, storia)
    - name: appointments
      ownedBy: user
      description: Richieste di prenotazione; l'owner e' il proprietario, il veterinario vede quelle a lui indirizzate.
      retentionDays: 1095
      fields:
      - name: start
        type: date
        label: Inizio
      - name: end
        type: date
        label: Fine
      - name: date
        type: date
        label: Data
      - name: resource
        type: text
        label: Veterinario
      - name: owner_email
        type: email
        label: Email proprietario
      - name: pet
        type: text
        label: Animale
      - name: notes
        type: textarea
        label: Motivo della visita
      - name: phone
        type: text
        label: Cellulare per SMS (facoltativo)
      - name: status
        type: select
        label: Stato
        default: booked
        options:
        - booked
        - confirmed
        - proposed
        - cancelled
        - done
      - name: proposed_start
        type: date
        label: Orario alternativo proposto
      - name: vet_note
        type: textarea
        label: Nota del veterinario
      access:
      - role: vet
        where:
          resource: '{user.email}'
        can:
        - read
        - write
    - name: reviews
      ownedBy: user
      description: Recensioni dopo la visita, moderate dall'admin prima della pubblicazione.
      fields:
      - name: vet
        type: text
        required: true
        label: Veterinario (email)
      - name: rating
        type: number
        required: true
        label: Voto 1-5
      - name: text
        type: textarea
        label: Recensione
      - name: status
        type: select
        label: Moderazione
        default: pending
        options:
        - pending
        - approved
        - rejected
      access:
      - role: admin
        can:
        - read
        - write
  views:
  - key: home
    type: page
    nav: false
    title: TrovaVet
    sections:
    - type: hero
      layout: stack
      band: true
      eyebrow:
        it: Per proprietari di animali
      title:
        it: Il **veterinario specialista** giusto, vicino a casa tua.
      text:
        it: 'Descrivi il problema: un agente AI individua la specializzazione adatta (senza diagnosi), trova i professionisti
          verificati vicini a te e ti fa prenotare. Gratis per i proprietari.'
      actions:
      - label:
          it: Trova un veterinario
        href: /v/find
        style: primary
      - label:
          it: Accedi
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
      items:
      - title:
          it: 1 · Racconta il caso
        text:
          it: Specie, razza, eta', sintomo, comune, distanza e urgenza.
        badge: 📝
      - title:
          it: 2 · Ricevi la lista
        text:
          it: Veterinari verificati ordinati per pertinenza e distanza, anche su mappa.
        badge: 📍
      - title:
          it: 3 · Prenota
        text:
          it: Scegli uno slot libero; il veterinario conferma o propone un altro orario. Email di conferma e promemoria 24
            ore prima.
        badge: 📅
    - type: cards
      id: cliniche
      title:
        it: Per veterinari e cliniche
      intro:
        it: Crea il tuo profilo con specializzazioni, orari e titoli. Dopo la verifica dell'iscrizione all'ordine sarai visibile
          ai proprietari. Abbonamento mensile.
      items:
      - title:
          it: Profilo verificato
        text:
          it: Controlliamo l'iscrizione all'ordine prima della pubblicazione.
      - title:
          it: Solo le tue richieste
        text:
          it: Vedi e gestisci solo le prenotazioni a te indirizzate.
    - type: note
      content:
        it: TrovaVet non fornisce diagnosi ne' consigli terapeutici. In caso di emergenza contatta subito un pronto soccorso
          veterinario.
  - key: find
    type: new_run
    title:
      it: Cerca veterinario
    roles:
    - owner
    - admin
  - key: searches
    type: history
    title:
      it: Le mie ricerche
    source: run
    roles:
    - owner
    - admin
  - key: result
    type: report
    title:
      it: Risultato
    source: run
    printable: true
    nav: false
  - key: map
    type: map
    title:
      it: Mappa veterinari
    source: collection:vets
    map:
      lat: lat
      lon: lon
      title: name
      popup:
      - clinic
      - address
      - specializations
      - fee_from
    roles:
    - owner
    - admin
  - key: book
    type: booking
    title:
      it: Prenota una visita
    collection: appointments
    resources: collection:vets
    fields:
    - pet
    - notes
    - phone
    slots:
      days:
      - 1
      - 2
      - 3
      - 4
      - 5
      from: 09:00
      to: '18:00'
      minutes: 30
      tz: Europe/Rome
      aheadDays: 30
      minNoticeHours: 4
      capacity: 1
    roles:
    - owner
    - admin
  - key: my_bookings
    type: table
    title:
      it: Le mie prenotazioni
    source: collection:appointments
    columns:
    - date
    - resource
    - pet
    - status
    - proposed_start
    - vet_note
    roles:
    - owner
    - admin
  - key: pet_new
    type: form
    title:
      it: Nuovo animale
    collection: pets
    submit:
      label:
        it: Salva
      message:
        it: Scheda salvata.
      redirect: pets
    roles:
    - owner
    - admin
  - key: pets
    type: table
    title:
      it: I miei animali
    source: collection:pets
    columns:
    - name
    - species
    - breed
    - birth_year
    - notes
    roles:
    - owner
    - admin
  - key: review_new
    type: form
    title:
      it: Lascia una recensione
    collection: reviews
    fields:
    - vet
    - rating
    - text
    submit:
      label:
        it: Invia
      message:
        it: Grazie! La recensione sara' pubblicata dopo la moderazione.
    roles:
    - owner
  - key: vet_profile
    type: form
    title:
      it: Il mio profilo professionale
    collection: vet_profiles
    fields:
    - email
    - name
    - clinic
    - order_number
    - order_province
    - specializations
    - species
    - address
    - city
    - phone
    - hours
    - slots
    - fee_from
    - titles
    submit:
      label:
        it: Invia per la verifica
      message:
        it: 'Profilo ricevuto: sara'' pubblicato dopo la verifica dell''iscrizione all''ordine.'
    edit: true
  - key: vet_requests
    type: table
    title:
      it: Richieste ricevute
    source: collection:appointments
    columns:
    - date
    - pet
    - notes
    - status
    - proposed_start
    roles:
    - vet
    - admin
  - key: respond
    type: form
    title:
      it: Rispondi alla richiesta
    collection: appointments
    fields:
    - status
    - proposed_start
    - vet_note
    edit: true
    submit:
      label:
        it: Invia risposta
      message:
        it: Risposta inviata.
      redirect: vet_requests
    roles:
    - vet
    - admin
    nav: false
  - key: admin_vets
    type: table
    title:
      it: Verifica iscrizioni
    source: collection:vet_profiles
    columns:
    - name
    - clinic
    - order_number
    - order_province
    - specializations
    - status
    roles:
    - admin
    export: true
  - key: admin_verify
    type: form
    title:
      it: Verifica profilo
    collection: vet_profiles
    fields:
    - status
    edit: true
    submit:
      label:
        it: Salva
      redirect: admin_vets
    roles:
    - admin
    nav: false
  - key: admin_reviews
    type: table
    title:
      it: Moderazione recensioni
    source: collection:reviews
    columns:
    - vet
    - rating
    - text
    - status
    roles:
    - admin
  - key: admin_review_edit
    type: form
    title:
      it: Modera recensione
    collection: reviews
    fields:
    - status
    edit: true
    submit:
      label:
        it: Salva
      redirect: admin_reviews
    roles:
    - admin
    nav: false
  - key: admin_bookings
    type: table
    title:
      it: Tutte le prenotazioni
    source: collection:appointments
    columns:
    - date
    - resource
    - owner_email
    - status
    roles:
    - admin
    export: true
  - key: account
    type: account
    title:
      it: Abbonamento
    roles:
    - vet
  triggers:
  - key: publish_vet
    description: Quando l'admin verifica il profilo, lo pubblica nel catalogo.
    'on':
      collection: vet_profiles
      op: update
      where:
        status: verified
    start:
      agent: publisher
    asUser: false
    goal: 'Pubblica il profilo verificato: email {record.email}, nome {record.name}, clinica {record.clinic}, specializzazioni
      {record.specializations}, specie {record.species}, indirizzo {record.address}, comune {record.city}, telefono {record.phone},
      orari {record.hours}, slot {record.slots}, tariffa da {record.fee_from}, titoli {record.titles}.'
  - key: new_vet_to_admin
    'on':
      collection: vet_profiles
      op: insert
    notify:
      to: admins
      subject:
        it: Nuova iscrizione veterinario da verificare
      body:
        it: Un veterinario ha inviato il profilo ({record.name}, ordine {record.order_province} n. {record.order_number}).
          Verifica l'iscrizione e pubblicalo.
      link: admin_vets
  - key: vet_new_request
    'on':
      collection: appointments
      op: insert
    notify:
      to:
      - owner
      - record.resource
      subject:
        it: Richiesta di prenotazione inviata
      body:
        it: La richiesta di visita per il {record.date} e' stata inviata al veterinario. Riceverai conferma o una proposta
          di altro orario.
      link: my_bookings
  - key: booking_confirmed
    'on':
      collection: appointments
      op: update
      where:
        status: confirmed
    notify:
      to:
      - owner
      - record.owner_email
      subject:
        it: Visita confermata
      body:
        it: La visita del {record.date} con {record.resource} e' confermata.
      link: my_bookings
  - key: booking_proposed
    'on':
      collection: appointments
      op: update
      where:
        status: proposed
    notify:
      to:
      - owner
      - record.owner_email
      subject:
        it: Il veterinario propone un altro orario
      body:
        it: 'Per la visita del {record.date} il veterinario propone: {record.proposed_start}. Nota: {record.vet_note}'
      link: my_bookings
  - key: booking_reminder
    'on':
      date:
        collection: appointments
        field: start
        offsetDays: -1
        hour: 8
      where:
        status: confirmed
    notify:
      to:
      - owner
      - record.resource
      subject:
        it: 'Promemoria: visita veterinaria domani'
      body:
        it: Ricordiamo la visita di domani ({record.date}) con {record.resource}.
      link: my_bookings
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: clinic
      price: 29
      interval: month
      label:
        it: TrovaVet Clinica
      includes:
      - profilo pubblicato e verificato
      - calendario prenotazioni
      - gestione richieste
      roles:
      - vet
  extensions:
  - key: calendar_sync
    description: 'Sincronizzazione del calendario del veterinario con Google/Outlook: richiede OAuth, non ancora disponibile.
      Per ora gli slot sono definiti nel profilo (campo slots).'
  - key: sms_reminder
    description: 'SMS opzionale di conferma e promemoria: SMS non ancora disponibile; il cellulare e'' raccolto in prenotazione
      per uso futuro. Email attive.'
  - key: public_reviews
    description: 'Visualizzazione pubblica delle recensioni approvate nel catalogo e media voti per veterinario: da collegare
      al catalogo dopo la moderazione.'
  egress:
    hosts:
    - nominatim.openstreetmap.org
    notes: 'Geocodifica indirizzi e comuni con Nominatim (dati OpenStreetMap, ODbL), rispettando la usage policy: poche richieste,
      niente uso massivo.'
