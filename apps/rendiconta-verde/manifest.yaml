apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: rendicontaverde
  displayName: RendicontaVerde
  tagline:
    it: Il report di sostenibilità VSME per la tua PMI, pronto per la CSRD.
  description:
    it: Compili moduli guidati o carichi le bollette in PDF. Gli agenti AI calcolano le emissioni Scope 1 e 2 con i fattori
      ISPRA, valutano il rischio climatico fisico delle sedi e redigono la bozza del report VSME. Il responsabile ESG la rivede
      e la approva prima dell'esportazione in PDF.
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f5d3a'
      accent: '#7aa63c'
      background: '#f6f8f2'
      foreground: '#17261d'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Rendiconta
      color: primary
    - text: Verde
      color: accent
  header:
    links:
    - label: Come funziona
      href: '#come-funziona'
    - label: Standard e fonti
      href: '#fonti'
    cta:
      label: Accedi
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Amministratore
      assignedBy: admin_emails
    - key: user
      label: Azienda
      assignedBy: signup
    - key: consultant
      label: Consulente
      assignedBy: derived
      from: collection:company.consultant_email
  limits:
  - action: agent:vsme_editor
    per: user
    max: 10
    window: day
    roles:
    - user
  - action: chat
    per: user
    max: 60
    window: day
    roles:
    - user
  agents:
  - key: vsme_editor
    role: main
    description: Coordina la squadra (calcolo GHG, rischio climatico, redazione) e assembla la bozza del report VSME; chiede
      l'approvazione del responsabile ESG.
    profile:
      inline:
        display_name: Redattore capo VSME
        crews:
        - id: editor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei il redattore capo del report di sostenibilità VSME (standard volontario EFRAG per le PMI non
            quotate) di una PMI italiana. Coordini una squadra: chiedi a ask_ghg_calc di calcolare e salvare le emissioni
            Scope 1 e 2 dell''anno, a ask_climate_risk di valutare il rischio fisico delle sedi, a ask_drafter_env di scrivere
            le sezioni ambientali (B3-B7) e a ask_drafter_soc di scrivere le sezioni su impresa, lavoratori e governance (B1,
            B2, B8-B11; con il modulo Completo anche C1-C9 applicabili). Poi assembli un unico report coerente.

            Struttura: primo rigo ''# Report di sostenibilità VSME <anno> — <ragione sociale>'' (titolo di livello 1). Poi:
            ## Stato del documento (BOZZA in attesa di approvazione del responsabile ESG), ## Sintesi, ## B1-B2 Base di preparazione
            e pratiche, ## Ambiente (B3-B7), ## Rischio climatico fisico delle sedi, ## Persone e governance (B8-B11), ##
            Lacune dei dati e prossimi passi per la CSRD, ## Fonti e metodo (fattori ISPRA, IdroGEO, Copernicus). Aggiungi
            un grafico ```chart``` per le emissioni Scope 1 vs Scope 2 con i valori reali.

            Regole: non inventare mai cifre; se un dato manca scrivi ''dato non fornito'' e segnalalo nelle lacune. Non dare
            consulenza legale come fatto: indica cosa verificare con un consulente. Al termine chiama request_esg_signoff
            con un riepilogo della bozza; dopo l''approvazione consegna la versione finale senza la dicitura BOZZA. Scrivi
            in italiano.'
    goalTemplate: 'Redigi il report VSME per l''anno di rendicontazione {year}. Modulo: {module_label}.

      {?company}Profilo azienda: {company}{/company}{!company}Il profilo azienda non è stato compilato: segnalalo e prosegui
      con i dati disponibili.{/company}

      {?notes}Note dell''utente: {notes}{/notes}

      Data di oggi: {date}. Lingua del report: {lang}.'
    context:
    - key: company
      from: collection:company
    delegates:
    - ghg_calc
    - climate_risk
    - drafter_env
    - drafter_soc
    awaits:
    - esg_signoff
    output: markdown
    limits:
      maxTurns: 30
      maxBudgetUsd: 3
  - key: ghg_calc
    role: helper
    description: Calcola le emissioni GHG Scope 1 e 2 con i fattori ISPRA.
    profile:
      inline:
        display_name: Calcolo GHG Scope 1 e 2
        crews:
        - id: ghg
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un esperto di contabilità GHG (GHG Protocol) per PMI italiane. Leggi i consumi dell''anno con
            ghg_consumptions e i fattori di emissione con ghg_factors (tabella caricata dagli amministratori dai fattori ISPRA,
            con unità, fattore kgCO2e/unità, anno e fonte). Scope 1: gas naturale e carburanti aziendali. Scope 2: energia
            elettrica, sia location-based (fattore medio nazionale ISPRA) sia market-based se è presente il fattore del fornitore.
            Converti le unità con cura (Smc, kWh, litri, kg) e riporta formula e fattore usato per ogni riga. Se manca un
            fattore o un consumo, NON stimarlo: elencalo come lacuna. Salva il risultato dell''anno con ghg_save (anno, scope1_t,
            scope2_location_t, scope2_market_t, dettaglio, consultant_email copiato dai record di consumo). Restituisci una
            tabella in tonnellate di CO2e con totali e lacune.'
          mcp_servers: []
    appTools:
    - name: ghg_consumptions
      description: Consumi inseriti dall'azienda (energia, gas, carburanti, rifiuti, acqua)
      action: read
      collection: consumptions
      scope: user
    - name: ghg_factors
      description: Fattori di emissione ISPRA
      action: read
      collection: emission_factors
      scope: all
    - name: ghg_save
      description: Salva il risultato del calcolo GHG dell'anno
      action: write
      collection: ghg_results
      scope: user
    output: markdown
    limits:
      maxTurns: 15
      maxBudgetUsd: 0.8
  - key: climate_risk
    role: helper
    description: Valuta il rischio climatico fisico delle sedi (alluvioni, frane con IdroGEO; indicatori climatici con Copernicus
      CDS).
    profile:
      inline:
        display_name: Rischio climatico fisico
        crews:
        - id: risk
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 1.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Valuti il rischio climatico fisico delle sedi di una PMI italiana. Leggi le sedi con risk_sites.
            Per ogni sede: (1) con idrogeo_get interroga IdroGEO (ISPRA, indicatori di pericolosità da frana e alluvione per
            comune, tramite il codice ISTAT o il nome del comune; usa il path per esplorare l''API e ricava dai risultati
            le percentuali di territorio in classi di pericolosità P1-P3 / frana). (2) Con cds_submit e cds_job usa Copernicus
            Climate Data Store (API asincrona: invii una richiesta di processo su /retrieve/v1/processes/<dataset>/execution
            con body {"inputs":{...}} poi leggi lo stato su /retrieve/v1/jobs/<id>) per proiezioni o indicatori di caldo e
            precipitazioni; se la richiesta non si completa in pochi controlli, dichiaralo e non inventare. Classifica ogni
            pericolo (alluvione, frana, caldo estremo, siccità) come basso/medio/alto/non valutato, spiega la fonte e salva
            ogni sede con risk_save (sede, pericolo principale, livello, sintesi, fonti, consultant_email copiato dalla sede).
            Non inventare mai valori: se l''API non risponde, scrivi ''non valutato'' e il motivo. Cita sempre: IdroGEO, ISPRA;
            Copernicus Climate Data Store.'
          mcp_servers: []
    appTools:
    - name: risk_sites
      description: Sedi dell'azienda
      action: read
      collection: sites
      scope: user
    - name: idrogeo_get
      description: Interroga l'API IdroGEO di ISPRA (frane e alluvioni)
      action: http
      http:
        method: GET
        url: https://idrogeo.isprambiente.it/api
        allowPath: true
        attribution: IdroGEO, ISPRA — dati aperti, citare la fonte
        maxBytes: 200000
    - name: cds_submit
      description: Invia una richiesta al Copernicus Climate Data Store
      action: http
      http:
        method: POST
        url: https://cds.climate.copernicus.eu/api
        allowPath: true
        attribution: Copernicus Climate Change Service, licenza Copernicus
        credential:
          provider: copernicus
          header: PRIVATE-TOKEN
          format: '{secret}'
    - name: cds_job
      description: Legge lo stato o il risultato di una richiesta Copernicus CDS
      action: http
      http:
        method: GET
        url: https://cds.climate.copernicus.eu/api
        allowPath: true
        attribution: Copernicus Climate Change Service, licenza Copernicus
        credential:
          provider: copernicus
          header: PRIVATE-TOKEN
          format: '{secret}'
    - name: risk_save
      description: Salva la valutazione di rischio di una sede
      action: write
      collection: risk_assessments
      scope: user
    output: markdown
    limits:
      maxTurns: 25
      maxBudgetUsd: 1.2
  - key: drafter_env
    role: helper
    description: Scrive le sezioni ambientali B3-B7 del VSME.
    profile:
      inline:
        display_name: Redattore ambiente VSME
        crews:
        - id: env
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Redigi in italiano le sezioni ambientali del VSME: B3 energia ed emissioni GHG (Scope 1, 2, intensità
            per fatturato se disponibile), B4 inquinamento, B5 biodiversità, B6 acqua, B7 uso delle risorse ed economia circolare/rifiuti.
            Leggi consumi con env_consumptions, risultati GHG con env_ghg e rischi con env_risks. Usa solo i dati letti: cifre
            con unità e anno, ''dato non fornito'' dove mancano. Per ogni sezione indica le informazioni richieste dal VSME
            e quali mancano. Tono professionale, sintetico, senza consulenza legale.'
          mcp_servers: []
    appTools:
    - name: env_consumptions
      description: Consumi dell'azienda
      action: read
      collection: consumptions
      scope: user
    - name: env_ghg
      description: Risultati GHG calcolati
      action: read
      collection: ghg_results
      scope: user
    - name: env_risks
      description: Valutazioni di rischio climatico delle sedi
      action: read
      collection: risk_assessments
      scope: user
    output: markdown
    limits:
      maxTurns: 10
      maxBudgetUsd: 0.6
  - key: drafter_soc
    role: helper
    description: Scrive le sezioni su impresa, persone e governance del VSME.
    profile:
      inline:
        display_name: Redattore persone e governance VSME
        crews:
        - id: soc
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Redigi in italiano le sezioni VSME: B1 base di preparazione e perimetro, B2 pratiche, politiche
            e iniziative future, B8 lavoratori (caratteristiche), B9 salute e sicurezza, B10 retribuzione e contrattazione
            collettiva, B11 condanne per corruzione. Con il modulo Completo aggiungi C1-C9 solo se i dati lo consentono. Leggi
            il profilo con soc_company. Usa solo i dati presenti; dove mancano scrivi ''dato non fornito'' e indica cosa raccogliere.
            Nessuna consulenza legale come fatto.'
          mcp_servers: []
    appTools:
    - name: soc_company
      description: Profilo e dati sociali dell'azienda
      action: read
      collection: company
      scope: user
    output: markdown
    limits:
      maxTurns: 10
      maxBudgetUsd: 0.6
  - key: esrs_expert
    role: helper
    description: Risponde in chat ai dubbi su EFRAG, VSME ed ESRS.
    profile:
      inline:
        display_name: Esperto VSME / ESRS
        chat_mode: true
        crews:
        - id: expert
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 4
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un esperto degli standard EFRAG: VSME (moduli Base e Completo, disclosure B1-B11 e C1-C9), ESRS
            (set 1, ESRS 2, E1-E5, S1-S4, G1, doppia materialità) e della CSRD (calendario, soglie, effetto a cascata sulle
            PMI, direttive Omnibus). Rispondi in italiano a domande su cosa vada rendicontato, a chi si applica e come prepararsi.
            Sii preciso e breve, cita la disclosure o lo standard di riferimento. Se non sei certo o la norma può essere cambiata
            di recente (ad es. per l''Omnibus), dillo e invita a verificare con la fonte ufficiale o un consulente. Non dare
            consulenza legale come fatto e non inventare numeri di paragrafo.'
    goalTemplate: 'Conversazione finora:

      {history}

      {?company}Profilo azienda: {company}{/company}

      Nuova domanda: {message}

      Rispondi in italiano.'
    context:
    - key: company
      from: collection:company
    output: markdown
    limits:
      maxTurns: 4
      maxBudgetUsd: 0.3
  - key: bill_reader
    role: helper
    description: Legge le bollette PDF caricate e registra i consumi.
    profile:
      inline:
        display_name: Lettore bollette
        crews:
        - id: bills
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Leggi bollette di energia elettrica, gas, carburanti, acqua e rifiuti. Apri ogni file indicato con
            read_upload (id del file). Estrai: categoria (electricity, gas, fuel_diesel, fuel_petrol, water, waste), quantità
            consumata, unità (kWh, Smc, litri, m3, kg), periodo di fatturazione e fornitore. Se la bolletta copre più periodi,
            registra il consumo di ciascun periodo; se un valore non è leggibile o è ambiguo, NON indovinare: non registrarlo
            e spiegalo. Per ogni consumo certo chiama consumption_add con: site, year (anno di competenza), category, quantity,
            unit, source=''bill'', note (fornitore e periodo), consultant_email dal record. Non registrare importi in euro
            come consumi. Concludi con un riepilogo dei valori registrati e di quelli da verificare.'
          mcp_servers: []
    appTools:
    - name: read_upload
      description: Legge un file caricato dall'utente (OCR incluso)
      action: read_file
    - name: consumption_add
      description: Registra un consumo letto da una bolletta
      action: append
      collection: consumptions
      scope: user
    output: markdown
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.6
  inputForm:
    title: Nuovo report VSME
    fields:
    - name: year
      type: number
      required: true
      label: Anno di rendicontazione
      default: 2025
      help: Es. 2025
    - name: module
      type: select
      required: true
      label: Modulo VSME
      options:
      - value: basic
        label: Base (B1-B11)
      - value: comprehensive
        label: Base + Completo (B1-B11, C1-C9)
      default: basic
    - name: notes
      type: textarea
      maxLength: 600
      label: Note per la redazione (facoltative)
      help: Es. perimetro, cambiamenti dell'anno, richieste di clienti o banche
  data:
    credentials:
    - provider: copernicus
      kind: api_key
      scope: org
      label: Copernicus Climate Data Store (chiave API)
      help: Token personale del profilo CDS, impostato dagli amministratori dell'app.
    collections:
    - name: company
      description: Profilo dell'azienda, personale, salute e sicurezza, politiche adottate
      ownedBy: user
      fields:
      - name: name
        type: text
        required: true
        label: Ragione sociale
      - name: vat
        type: text
        label: Partita IVA
      - name: ateco
        type: text
        label: Codice ATECO
      - name: employees
        type: number
        required: true
        label: Numero di dipendenti
      - name: female_employees
        type: number
        label: Di cui donne
      - name: revenue
        type: number
        label: Fatturato annuo (EUR)
      - name: balance_total
        type: number
        label: Totale di bilancio (EUR)
      - name: accidents
        type: number
        label: Infortuni sul lavoro nell'anno
      - name: days_lost
        type: number
        label: Giorni persi per infortuni
      - name: collective_bargaining_pct
        type: number
        label: '% dipendenti con contratto collettivo'
      - name: convictions
        type: boolean
        label: Condanne per corruzione nell'anno
      - name: policies
        type: multiselect
        label: Politiche adottate
        options:
        - Politica ambientale
        - Codice etico
        - Politica anticorruzione
        - Politica diritti umani
        - Salute e sicurezza (ISO 45001)
        - Certificazione ambientale (ISO 14001)
        - Parità di genere
        - Welfare aziendale
      - name: consultant_email
        type: email
        label: Email del consulente (facoltativa)
        help: Il consulente indicato vedrà i dati della tua azienda.
      - name: next_update
        type: date
        label: Data del promemoria di aggiornamento annuale
      access:
      - role: consultant
        where:
          consultant_email: '{user.email}'
        can:
        - read
        - write
    - name: sites
      description: Sedi e stabilimenti
      ownedBy: user
      fields:
      - name: name
        type: text
        required: true
        label: Nome sede
      - name: address
        type: text
        required: true
        label: Indirizzo
      - name: city
        type: text
        required: true
        label: Comune
      - name: province
        type: text
        label: Provincia
      - name: lat
        type: number
        label: Latitudine
      - name: lon
        type: number
        label: Longitudine
      - name: consultant_email
        type: email
        label: Email del consulente (come nel profilo)
      access:
      - role: consultant
        where:
          consultant_email: '{user.email}'
        can:
        - read
        - write
    - name: consumptions
      description: Consumi di energia, gas, carburanti, rifiuti e acqua
      ownedBy: user
      fields:
      - name: site
        type: text
        label: Sede
      - name: year
        type: number
        required: true
        label: Anno
      - name: category
        type: select
        required: true
        label: Categoria
        options:
        - value: electricity
          label: Energia elettrica
        - value: gas
          label: Gas naturale
        - value: fuel_diesel
          label: Gasolio
        - value: fuel_petrol
          label: Benzina
        - value: water
          label: Acqua
        - value: waste
          label: Rifiuti
      - name: quantity
        type: number
        required: true
        label: Quantità
      - name: unit
        type: select
        required: true
        label: Unità
        options:
        - kWh
        - Smc
        - litri
        - m3
        - kg
      - name: source
        type: select
        label: Origine
        options:
        - value: manual
          label: Inserito a mano
        - value: bill
          label: Letto da bolletta
        default: manual
      - name: note
        type: text
        label: Note
      - name: consultant_email
        type: email
        label: Email del consulente (come nel profilo)
      access:
      - role: consultant
        where:
          consultant_email: '{user.email}'
        can:
        - read
        - write
    - name: bills
      description: Bollette PDF caricate, lette automaticamente
      ownedBy: user
      retentionDays: 730
      fields:
      - name: site
        type: text
        label: Sede
      - name: year
        type: number
        required: true
        label: Anno di competenza
      - name: bill
        type: file
        required: true
        label: Bollette (PDF o foto)
        accept:
        - pdf
        - jpg
        - jpeg
        - png
        maxMb: 10
        multiple: true
      - name: consultant_email
        type: email
        label: Email del consulente (come nel profilo)
      access:
      - role: consultant
        where:
          consultant_email: '{user.email}'
        can:
        - read
    - name: emission_factors
      description: Fattori di emissione ISPRA (caricati dagli amministratori in Dati)
      ownedBy: shared
      fields:
      - name: category
        type: text
        required: true
        label: Combustibile / vettore
      - name: unit
        type: text
        required: true
        label: Unità
      - name: kgco2e_per_unit
        type: number
        required: true
        label: kg CO2e per unità
      - name: scope
        type: text
        label: Scope
      - name: basis
        type: text
        label: Location / market based
      - name: year
        type: number
        label: Anno del fattore
      - name: source
        type: text
        label: Fonte (tabella ISPRA)
    - name: ghg_results
      description: Emissioni Scope 1 e 2 calcolate
      ownedBy: user
      fields:
      - name: year
        type: number
        label: Anno
      - name: scope1_t
        type: number
        label: Scope 1 (tCO2e)
      - name: scope2_location_t
        type: number
        label: Scope 2 location-based (tCO2e)
      - name: scope2_market_t
        type: number
        label: Scope 2 market-based (tCO2e)
      - name: detail
        type: textarea
        label: Dettaglio e lacune
      - name: consultant_email
        type: email
        label: Consulente
      access:
      - role: consultant
        where:
          consultant_email: '{user.email}'
        can:
        - read
    - name: risk_assessments
      description: Rischio climatico fisico per sede
      ownedBy: user
      fields:
      - name: site
        type: text
        label: Sede
      - name: hazard
        type: text
        label: Pericolo principale
      - name: level
        type: select
        label: Livello
        options:
        - basso
        - medio
        - alto
        - non valutato
      - name: summary
        type: textarea
        label: Sintesi
      - name: sources
        type: text
        label: Fonti
      - name: consultant_email
        type: email
        label: Consulente
      access:
      - role: consultant
        where:
          consultant_email: '{user.email}'
        can:
        - read
  views:
  - key: home
    type: page
    title: RendicontaVerde
    nav: false
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow: VSME · CSRD · PMI
      title: Il report di sostenibilità della tua PMI, **senza fogli di calcolo**.
      text: Compili moduli guidati o carichi le bollette in PDF. Gli agenti AI calcolano le emissioni Scope 1 e 2 con i fattori
        ISPRA, valutano il rischio climatico delle tue sedi e redigono la bozza del report VSME. Tu la rivedi e la approvi.
      actions:
      - label: Inizia ora
        href: /login
        style: primary
      - label: Come funziona
        href: '#come-funziona'
        style: ghost
      note: Ogni azienda vede solo i propri dati; i consulenti vedono solo i loro clienti.
    - type: steps
      id: come-funziona
      title: Come funziona
      items:
      - title: 1 · Inserisci i dati
        text: 'Profilo, dipendenti, politiche, sedi e consumi. Oppure carica le bollette in PDF: i valori vengono letti automaticamente.'
        badge: 📝
      - title: 2 · Gli agenti lavorano
        text: Emissioni Scope 1 e 2, rischio alluvioni e frane per sede, sezioni VSME B1-B11 (e C1-C9).
        badge: 🤖
      - title: 3 · Revisione e PDF
        text: Il responsabile ESG rivede la bozza, la approva ed esporta il PDF. Un promemoria annuale ti avvisa dell'aggiornamento.
        badge: ✅
    - type: cards
      id: fonti
      title: Standard e fonti
      items:
      - title: EFRAG VSME
        text: Moduli Base (B1-B11) e Completo (C1-C9), con indicazione delle lacune per la CSRD.
      - title: Fattori ISPRA
        text: Emissioni Scope 1 e 2 calcolate con i fattori di emissione nazionali, formula e fonte per ogni riga.
      - title: IdroGEO e Copernicus
        text: Pericolosità da frana e alluvione (ISPRA) e indicatori climatici del Copernicus Climate Data Store.
      - title: Assistente ESRS
        text: Una chat per i dubbi su cosa vada rendicontato in VSME, ESRS e CSRD.
    - type: note
      content: 'Strumento di supporto alla redazione: non è consulenza legale. Il report va verificato dal responsabile ESG
        prima dell''uso.'
  - key: overview
    type: page
    title: Panoramica
    roles:
    - user
    - admin
    - consultant
    sections:
    - type: data
      title: Emissioni GHG
      source: collection:ghg_results
      display: chart
      chart: bar
      fields:
      - key: year
        label: Anno
      - key: scope1_t
        label: Scope 1 (t)
      - key: scope2_location_t
        label: Scope 2 location (t)
      sort:
        field: year
        dir: asc
      empty: 'Nessun calcolo ancora: genera un report.'
    - type: data
      title: Rischio climatico per sede
      source: collection:risk_assessments
      display: table
      fields:
      - key: site
        label: Sede
      - key: hazard
        label: Pericolo
      - key: level
        label: Livello
        format: badge
      - key: summary
        label: Sintesi
      empty: Nessuna valutazione ancora.
  - key: company_form
    type: form
    title: Profilo e politiche
    collection: company
    edit: true
    roles:
    - user
    - admin
    submit:
      label: Salva profilo
      message: Profilo salvato.
      redirect: overview
  - key: site_form
    type: form
    title: Aggiungi una sede
    collection: sites
    roles:
    - user
    - admin
    submit:
      label: Salva sede
      message: Sede salvata.
      redirect: sites
  - key: sites
    type: table
    title: Le mie sedi
    source: collection:sites
    columns:
    - name
    - address
    - city
    - province
    roles:
    - user
    - admin
    - consultant
  - key: consumption_form
    type: form
    title: Inserisci un consumo
    collection: consumptions
    roles:
    - user
    - admin
    submit:
      label: Salva consumo
      message: Consumo salvato.
      redirect: consumptions
  - key: bill_upload
    type: form
    title: Carica bollette
    collection: bills
    roles:
    - user
    - admin
    submit:
      label: Carica e leggi
      message: 'Bollette caricate: i consumi letti compariranno tra poco in Consumi.'
      redirect: consumptions
  - key: consumptions
    type: table
    title: Consumi
    source: collection:consumptions
    columns:
    - year
    - site
    - category
    - quantity
    - unit
    - source
    - note
    export: true
    roles:
    - user
    - admin
    - consultant
  - key: new_report
    type: new_run
    title: Nuovo report VSME
    roles:
    - user
    - admin
  - key: reports
    type: history
    title: I miei report
    source: run
    roles:
    - user
    - admin
  - key: report
    type: report
    title: Report VSME
    source: run
    printable: true
    nav: false
  - key: signoff
    type: approvals
    title: Approvazione ESG
    approvals:
    - esg_signoff
    roles:
    - user
    - admin
  - key: esrs_chat
    type: chat
    title: Assistente ESRS
    source: agent:esrs_expert
    examples:
    - Cosa devo rendicontare nel modulo Base del VSME?
    - La mia PMI rientra nella CSRD?
    - Differenza tra Scope 2 location-based e market-based?
    - Cos'è la doppia materialità?
    placeholder: Chiedi su VSME, ESRS o CSRD…
    roles:
    - user
    - admin
  - key: clients
    type: table
    title: Aziende clienti
    source: collection:company
    columns:
    - name
    - vat
    - employees
    - ateco
    roles:
    - consultant
  - key: account
    type: account
    title: Crediti
    roles:
    - user
  approvals:
  - key: esg_signoff
    title: Approvazione della bozza VSME da parte del responsabile ESG
    description: Rivedi la bozza e approvala prima dell'esportazione in PDF.
    decidedBy: requester
  triggers:
  - key: read_bill
    description: Legge le bollette appena caricate
    'on':
      collection: bills
      op: insert
    start:
      agent: bill_reader
    goal: 'Sono state caricate delle bollette. File (id): {record.bill}. Sede: {record.site}. Anno di competenza: {record.year}.
      Consulente: {record.consultant_email}. Leggi ogni file e registra i consumi certi.'
  - key: signoff_done
    'on':
      approval: esg_signoff
      decision: approved
    notify:
      to: owner
      subject: 'Report VSME approvato: puoi esportare il PDF'
      body: La bozza del tuo report VSME è stata approvata. Apri il report e usa Stampa / Salva come PDF per l'esportazione.
      link: reports
  - key: annual_reminder
    'on':
      date:
        collection: company
        field: next_update
        offsetDays: 0
        hour: 8
    notify:
      to: owner
      subject: 'RendicontaVerde: è ora di aggiornare i dati di sostenibilità'
      body: È il momento dell'aggiornamento annuale. Aggiorna profilo, consumi e bollette dell'anno e genera il nuovo report
        VSME.
      link: new_report
  notifications:
    emailOnRunDone: true
  egress:
    hosts:
    - idrogeo.isprambiente.it
    - cds.climate.copernicus.eu
    notes: 'IdroGEO (ISPRA): dati aperti su pericolosità da frana e alluvione, con citazione della fonte. Copernicus Climate
      Data Store: accesso gratuito con licenza Copernicus e attribuzione, chiave API gestita dagli amministratori.'
  billing:
    modes:
    - credits
    currency: eur
    signupCredits: 0
    costs:
      agent:vsme_editor: 50
      agent:esrs_expert: 2
    packs:
    - key: report_1
      credits: 50
      price: 59
      label: 1 report VSME
    - key: report_3
      credits: 150
      price: 149
      label: 3 report VSME
  extensions:
  - key: consultant_runs
    description: I report generati (run) restano visibili solo all'azienda che li ha avviati; i consulenti vedono i dati dei
      clienti ma non i run. Per condividere il report con il consulente serve l'esportazione in PDF.
  - key: ispra_factors_load
    description: I fattori di emissione ISPRA vanno caricati dagli amministratori in /admin/data (CSV) nella collezione emission_factors
      e aggiornati ogni anno.
