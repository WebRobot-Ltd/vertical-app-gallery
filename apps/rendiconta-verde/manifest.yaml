apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: rendicontaverde
  displayName: RendicontaVerde
  tagline: Il report di sostenibilità VSME per la tua PMI, in bozza e pronto da approvare.
  description: RendicontaVerde guida le PMI nella raccolta dei dati ESG, calcola le emissioni di Scope 1 e 2 con i fattori
    ISPRA, valuta il rischio climatico fisico delle sedi, risponde ai dubbi su EFRAG ed ESRS e redige il report VSME in bozza.
    Il responsabile ESG lo rivede e lo approva prima dell'esportazione in PDF.
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#14532d'
      accent: '#2f9e5b'
      background: '#f6faf6'
      foreground: '#16231a'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Rendiconta
      color: primary
    - text: Verde
      color: accent
  header:
    links:
    - label: Come funziona
      href: '#come-funziona'
    - label: Cosa include
      href: '#cosa-include'
    cta:
      label: Accedi
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      label: Azienda
      assignedBy: signup
    - key: consultant
      label: Consulente
      assignedBy: invite
  limits:
  - action: agent:drafter
    per: user
    max: 5
    window: day
  - action: chat
    per: user
    max: 60
    window: day
  egress:
    hosts:
    - idrogeo.isprambiente.it
    - cds.climate.copernicus.eu
    notes: 'IdroGEO (ISPRA): mosaicature nazionali di pericolosità da frana e alluvione, dati aperti. Copernicus Climate Data
      Store: catalogo pubblico dei dataset climatici, licenza Copernicus (uso libero con attribuzione). Il download dei dati
      CDS richiede un token personale: vedi extensions.'
  agents:
  - key: drafter
    role: main
    description: Coordina la squadra e scrive la bozza completa del report VSME dai dati inseriti.
    delegates:
    - ghg_calc
    - climate_risk
    - editor
    awaits:
    - esg_approval
    writesTo:
      collection: vsme_reports
      parse: whole
    profile:
      inline:
        display_name: Redattore VSME
        crews:
        - id: drafter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 20
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei il capo redattore di report di sostenibilità VSME (standard volontario EFRAG per le PMI) per
            aziende italiane. Ricevi i dati inseriti dall''azienda. Procedi così: 1) chiedi a ask_ghg_calc il calcolo delle
            emissioni Scope 1 e 2 passando consumi di gas, carburanti ed energia elettrica; 2) chiedi a ask_climate_risk la
            valutazione del rischio fisico delle sedi; 3) scrivi la bozza completa; 4) chiedi a ask_editor una revisione di
            coerenza e completezza, e recepiscila; 5) chiama request_esg_approval con il titolo e un riassunto, così il responsabile
            ESG rivede la bozza prima dell''esportazione. Struttura del report: titolo di primo livello "# Report di sostenibilità
            VSME <anno> — <azienda>", poi ## Informazioni generali (Modulo Base B1-B11: perimetro, modello di business, pratiche
            e politiche, dipendenti, ambiente) e, se i dati lo permettono, ## Modulo Completo (C1-C9). Includi sezioni su
            energia ed emissioni GHG (con tabella e un blocco chart bar Scope 1/Scope 2), rischio climatico fisico, rifiuti,
            acqua, forza lavoro, politiche, ## Lacune e dati mancanti, ## Preparazione alla CSRD (cosa manca per eventuali
            ESRS), ## Fonti e ipotesi. Non inventare mai cifre: se un dato manca scrivilo come lacuna. Indica sempre fattori,
            anno e fonte. Il report è una bozza che richiede la revisione umana; non è consulenza legale né asseverazione.
            Scrivi in italiano.'
    goalTemplate: 'Azienda: {company_name} (P.IVA {vat})

      Settore: {sector}

      Anno di rendicontazione: {year}

      Modulo VSME: {module_label}

      Dipendenti: {employees} (di cui donne: {?women}{women}{/women}{!women}n.d.{/women}); infortuni: {?injuries}{injuries}{/injuries}{!injuries}n.d.{/injuries}

      Energia elettrica (kWh/anno): {electricity_kwh}; quota rinnovabile: {?renewable_pct}{renewable_pct}%{/renewable_pct}{!renewable_pct}n.d.{/renewable_pct}

      Gas naturale (Smc/anno): {gas_smc}

      Carburanti flotta: benzina {?petrol_l}{petrol_l}{/petrol_l}{!petrol_l}0{/petrol_l} L, diesel {?diesel_l}{diesel_l}{/diesel_l}{!diesel_l}0{/diesel_l}
      L

      Rifiuti (t/anno): {?waste_t}{waste_t}{/waste_t}{!waste_t}n.d.{/waste_t}; di cui pericolosi: {?hazardous_waste_t}{hazardous_waste_t}{/hazardous_waste_t}{!hazardous_waste_t}n.d.{/hazardous_waste_t}

      Prelievo idrico (m3/anno): {?water_m3}{water_m3}{/water_m3}{!water_m3}n.d.{/water_m3}

      Politiche adottate: {?policies}{policies}{/policies}{!policies}nessuna indicata{/policies}

      Sedi (nome, indirizzo, comune): {sites}

      {?notes}Note: {notes}{/notes}

      Oggi è {date}. Scrivi in italiano.'
    output: markdown
  - key: ghg_calc
    role: helper
    description: Calcola le emissioni GHG Scope 1 e 2 con i fattori ISPRA.
    profile:
      inline:
        display_name: Calcolatore GHG
        crews:
        - id: ghg_calc
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Calcoli le emissioni di gas serra Scope 1 (gas naturale, carburanti) e Scope 2 (energia elettrica,
            sia location-based sia market-based se la quota rinnovabile è nota) per una PMI italiana, secondo il GHG Protocol
            e i fattori di emissione ISPRA (Fattori di emissione per la produzione e il consumo di energia elettrica in Italia;
            tabella nazionale dei parametri standard per i combustibili). Per ogni voce mostra: quantità, unità, fattore usato
            (valore, unità, anno di riferimento, fonte ISPRA) e risultato in tCO2e, con una tabella e i totali. Se non sei
            certo del valore esatto o dell''anno più recente del fattore, dillo, indica il valore usato e invita a verificarlo
            sull''ultima edizione ISPRA. Non inventare consumi mancanti: segnalali come lacune. Rispondi in italiano, in modo
            conciso e preciso.'
  - key: climate_risk
    role: helper
    description: Valuta il rischio climatico fisico delle sedi (alluvioni, frane, eventi estremi) con IdroGEO e Copernicus
      CDS.
    appTools:
    - name: idrogeo_query
      description: Interroga l'API IdroGEO (ISPRA) su pericolosità e indicatori di frane e alluvioni per comune o area
      action: http
      http:
        method: GET
        url: https://idrogeo.isprambiente.it/api
        allowPath: true
        attribution: IdroGEO, ISPRA, dati aperti
    - name: cds_catalogue
      description: Consulta il catalogo pubblico del Copernicus Climate Data Store per dataset climatici (temperatura, precipitazioni
        estreme, proiezioni)
      action: http
      http:
        method: GET
        url: https://cds.climate.copernicus.eu/api/catalogue/v1
        allowPath: true
        attribution: Copernicus Climate Change Service (C3S), Climate Data Store
    profile:
      inline:
        display_name: Valutatore rischio climatico
        crews:
        - id: climate_risk
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 14
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Valuti il rischio climatico fisico di ciascuna sede aziendale in Italia (VSME C2/B-climate, ESRS
            E1 rischi fisici). Per ogni sede: usa idrogeo_query (GET, path sotto /api, query con il comune o il codice ISTAT)
            per ottenere pericolosità e popolazione/beni esposti da alluvioni e frane (livelli P1-P3 / pericolosità da frana
            PAI); usa cds_catalogue per indicare quali dataset Copernicus (es. proiezioni di temperatura e precipitazioni
            estreme) supportano l''analisi di caldo, siccità e precipitazioni intense. Se una chiamata fallisce o la risposta
            non contiene il dato, scrivilo e non stimare numeri. Output: tabella sede x pericolo (alluvione, frana, caldo,
            siccità) con livello basso/medio/alto e fonte, poi 3-5 azioni di adattamento per sede. Nota che il download dei
            dati CDS non è attivo: usa solo il catalogo. Cita le fonti con attribuzione. Non dare consulenza assicurativa
            o ingegneristica come fatto. In italiano.'
  - key: editor
    role: helper
    description: 'Revisore: coerenza, completezza VSME e tono della bozza.'
    profile:
      inline:
        display_name: Revisore VSME
        crews:
        - id: editor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 4
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Revisioni una bozza di report VSME. Controlla: coerenza tra numeri e testo, totali corretti, tutte
            le informazioni del Modulo Base B1-B11 presenti o segnalate come lacuna, assenza di dati inventati, tono professionale.
            Rispondi con un elenco puntato di correzioni concrete, ordinate per importanza, e con l''elenco delle lacune.
            In italiano.'
  - key: esrs_chat
    role: helper
    description: Risponde in chat ai dubbi su VSME, EFRAG, ESRS e CSRD.
    profile:
      inline:
        display_name: Esperto standard EFRAG/ESRS
        chat_mode: true
        crews:
        - id: esrs_chat
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 4
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un esperto degli standard di rendicontazione di sostenibilità: VSME di EFRAG (Modulo Base e
            Completo), ESRS, CSRD e la direttiva Omnibus. Rispondi in italiano ai dubbi di PMI su cosa vada rendicontato,
            quali metriche, quali soglie e quali scadenze. Sii concreto, cita il codice del datapoint (es. B3, C4, ESRS E1-6)
            quando serve. Distingui sempre ciò che è obbligatorio da ciò che è volontario e ricorda che l''ambito della CSRD
            è stato modificato di recente: invita a verificare la normativa vigente. Se non sei sicuro dillo. Non dare consulenza
            legale come fatto. Risposte brevi, con elenchi quando utile.'
    goalTemplate: 'Conversazione finora:

      {history}


      Nuovo messaggio dell''utente: {message}

      Rispondi in italiano.'
    output: markdown
  approvals:
  - key: esg_approval
    title: Approvazione del report da parte del responsabile ESG
    description: Il responsabile ESG rivede la bozza VSME e la approva prima dell'esportazione in PDF.
    decidedBy: requester
    timeoutMinutes: 10080
    onTimeout: reject
  inputForm:
    title: Nuovo report VSME
    fields:
    - name: company_name
      type: text
      required: true
      label: Ragione sociale
    - name: vat
      type: text
      label: Partita IVA
    - name: sector
      type: text
      required: true
      label: Settore di attività (ATECO o descrizione)
    - name: year
      type: number
      required: true
      label: Anno di rendicontazione
      default: 2025
    - name: module
      type: select
      required: true
      label: Modulo VSME
      default: base
      options:
      - value: base
        label: Base
      - value: base_complete
        label: Base + Completo
    - name: employees
      type: number
      required: true
      label: Dipendenti (FTE)
    - name: women
      type: number
      label: Di cui donne
    - name: injuries
      type: number
      label: Infortuni sul lavoro nell'anno
    - name: electricity_kwh
      type: number
      required: true
      label: Energia elettrica (kWh/anno)
      help: 'Dalle bollette: oggi da inserire a mano'
    - name: renewable_pct
      type: number
      label: Quota di energia rinnovabile (%)
    - name: gas_smc
      type: number
      label: Gas naturale (Smc/anno)
    - name: petrol_l
      type: number
      label: Benzina flotta (litri/anno)
    - name: diesel_l
      type: number
      label: Gasolio flotta (litri/anno)
    - name: waste_t
      type: number
      label: Rifiuti prodotti (tonnellate/anno)
    - name: hazardous_waste_t
      type: number
      label: Di cui pericolosi (tonnellate)
    - name: water_m3
      type: number
      label: Prelievo idrico (m³/anno)
    - name: policies
      type: textarea
      maxLength: 800
      label: Politiche adottate
      help: Es. codice etico, politica ambientale, salute e sicurezza, anticorruzione
    - name: sites
      type: textarea
      required: true
      maxLength: 800
      label: Sedi
      help: 'Una per riga: nome, indirizzo, comune'
    - name: notes
      type: textarea
      maxLength: 600
      label: Note (facoltative)
  views:
  - key: home
    type: page
    title: RendicontaVerde
    nav: false
    sections:
    - type: hero
      title: Il report di sostenibilità **VSME** per la tua PMI, senza partire da zero.
      text: Compili moduli guidati su energia, consumi, rifiuti, acqua, persone e politiche. Gli agenti AI calcolano le emissioni
        Scope 1 e 2 con i fattori ISPRA, valutano il rischio climatico delle sedi e scrivono la bozza del report. Il responsabile
        ESG rivede, approva ed esporta in PDF.
      actions:
      - label: Crea il tuo report
        href: /v/new_report
        style: primary
      - label: Accedi
        href: /login
        style: ghost
      note: 'Bozza di supporto: non sostituisce consulenza o asseverazione.'
    - type: steps
      id: come-funziona
      title: Come funziona
      items:
      - title: 1 · Inserisci i dati
        text: Dipendenti, energia, gas, carburanti, rifiuti, acqua, politiche e sedi.
      - title: 2 · Gli agenti lavorano
        text: Emissioni GHG, rischio fisico con IdroGEO e Copernicus, redazione e revisione.
      - title: 3 · Approva ed esporta
        text: Il responsabile ESG approva la bozza, poi stampi o salvi il PDF.
    - type: cards
      id: cosa-include
      title: Cosa include
      items:
      - title: Emissioni Scope 1 e 2
        text: Fattori ISPRA, con fonte e anno indicati per ogni voce.
        badge: 🌍
      - title: Rischio climatico fisico
        text: Alluvioni e frane da IdroGEO, scenari climatici dal catalogo Copernicus.
        badge: 🌊
      - title: Assistente EFRAG/ESRS
        text: Chiedi cosa va rendicontato e cosa è volontario.
        badge: 💬
      - title: Consulenti
        text: Condividi i report con il tuo consulente, che vede solo i suoi clienti.
        badge: 🤝
    - type: note
      content: RendicontaVerde · powered by WebRobot. Le bozze richiedono revisione umana; non sono consulenza legale.
  - key: new_report
    type: new_run
    title: Nuovo report
    roles:
    - user
    - consultant
    - admin
  - key: reports
    type: history
    title: I miei report
    source: run
    roles:
    - user
    - consultant
    - admin
  - key: report
    type: report
    title: Report VSME
    source: run
    printable: true
    nav: false
  - key: approvals_view
    type: approvals
    title: Approvazioni
    roles:
    - user
    - consultant
    - admin
  - key: clients_reports
    type: table
    title: Report condivisi
    source: collection:vsme_reports
    roles:
    - user
    - consultant
    - admin
    data:
      display: table
      fields:
      - key: title
        label: Report
      - key: year
        label: Anno
      - key: status
        label: Stato
        format: badge
      sort:
        field: year
        dir: desc
      empty: Nessun report ancora.
  - key: assistant
    type: chat
    title: Assistente standard
    source: agent:esrs_chat
    examples:
    - Cosa devo rendicontare nel Modulo Base VSME?
    - Quando una PMI rientra nella CSRD?
    - Cos'è lo Scope 2 market-based?
    - Quali politiche servono per il VSME?
    placeholder: Chiedi su VSME, ESRS, CSRD…
    roles:
    - user
    - consultant
    - admin
  - key: account
    type: account
    title: Crediti
    roles:
    - user
    - consultant
  data:
    collections:
    - name: vsme_reports
      ownedBy: user
      description: Bozze di report VSME e loro stato di approvazione; condivisibili con un consulente
      sharing:
      - viewer
      - editor
      fields:
      - name: title
        type: text
      - name: year
        type: number
      - name: status
        type: select
        options:
        - bozza
        - approvato
  billing:
    modes:
    - credits
    currency: eur
    signupCredits: 0
    costs:
      agent:drafter: 250
    packs:
    - key: report_1
      credits: 250
      price: 49
      label: 1 report VSME
    - key: report_3
      credits: 750
      price: 129
      label: 3 report VSME
  extensions:
  - key: bill_upload
    description: 'Caricamento delle bollette in PDF con lettura automatica dei consumi: non disponibile (i campi file non
      sono ancora supportati). Per ora i consumi si inseriscono a mano.'
  - key: annual_reminder
    description: 'Promemoria email annuale per l''aggiornamento dei dati: le notifiche email non sono ancora disponibili.'
  - key: cds_download
    description: 'Download dei dati Copernicus CDS: richiede un token personale per ogni richiesta; per ora l''agente usa
      solo il catalogo pubblico.'
  - key: consultant_clients
    description: 'Accesso del consulente ai propri clienti: oggi tramite condivisione per singolo report (viewer/editor) da
      parte dell''azienda; un''anagrafica clienti dedicata richiede logica personalizzata.'
