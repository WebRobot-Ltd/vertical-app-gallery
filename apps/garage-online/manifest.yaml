apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: garage-online
  displayName: Garage Online
  tagline:
    it: Vendi auto usate online con un assistente AI e consulenti umani.
    en: Sell used cars online with an AI assistant and human advisors.
  description:
    it: Lo stock della concessionaria, un assistente che guida il cliente nella scelta, la richiesta di prova su strada o
      valutazione, e il consulente che approva e richiama.
    en: Your dealership stock, an assistant that guides buyers, test-drive and trade-in requests, and an advisor who approves
      and calls back.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#16222e'
      accent: '#d9480f'
      background: '#f6f5f2'
      foreground: '#1a1d21'
    fonts:
      body: Inter
      display: Manrope
    wordmark:
    - text: Garage
      color: primary
    - text: Online
      color: accent
  header:
    links:
    - label: Come funziona
      href: '#come-funziona'
    - label: Stock
      href: /v/stock
    - label: Assistente
      href: /v/chat
    cta:
      label: Parla con l'assistente
      href: /v/chat
  auth:
    method: magic_link
    anonymous:
      views:
      - home
      - chat
      - stock
      - contact
      agents:
      - assistant
    roles:
    - key: admin
      label: Concessionaria
      assignedBy: admin_emails
    - key: consultant
      label: Consulente
      assignedBy: invite
  limits:
  - action: chat
    per: ip
    max: 60
    window: day
    roles:
    - anonymous
  - action: login
    per: ip
    max: 10
    window: hour
  agents:
  - key: assistant
    role: main
    description: 'Assistente di vendita: aiuta a scegliere nello stock e simula la rata.'
    profile:
      inline:
        display_name: Assistente Garage Online
        chat_mode: true
        crews:
        - id: assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''assistente di vendita di una concessionaria di auto usate. Aiuti il visitatore a scegliere
            in base a budget, uso, alimentazione e rata mensile desiderata. Proponi e confronta SOLO auto presenti nello stock,
            che leggi con lo strumento stock_search (solo auto con status available): mai auto di altri siti o portali, mai
            dati inventati. Per la rata usa lo strumento simulate_installment (prezzo, anticipo, mesi, TAN) e presentala sempre
            come simulazione indicativa, non un''offerta di finanziamento: la pratica vera viene girata alla finanziaria partner
            dal consulente. Confronta in tabelle brevi (prezzo, anno, km, alimentazione, garanzia, optional). Se il cliente
            è interessato, invitalo a compilare il modulo di contatto (/v/contact) per prova su strada, valutazione della
            sua auto, finanziamento o blocco con acconto; prima scrivigli un breve riassunto della conversazione (auto di
            interesse, budget, rata, uso) da incollare nel campo riassunto. Spiega che l''acconto con carta blocca l''auto
            ed è rimborsabile secondo le regole della concessionaria, senza inventarle: se non le conosci, rimanda al consulente.
            Non dare consulenza finanziaria o legale come fatto. Rispondi nella lingua dell''utente, in modo breve e cordiale.'
    goalTemplate: 'Conversazione finora:

      {history}


      Nuovo messaggio del visitatore: {message}

      Lingua: {lang}'
    appTools:
    - name: stock_search
      description: Cerca e leggi le auto dello stock della concessionaria
      action: search
      collection: cars
      scope: all
    - name: simulate_installment
      description: 'Simula la rata mensile indicativa: args price, down_payment, months, tan'
      action: call
      slot: installment
    output: markdown
  - key: screener
    role: helper
    description: Riassume la richiesta del cliente per il consulente e chiede la sua approvazione.
    profile:
      inline:
        display_name: Istruttore richieste
        crews:
        - id: screener
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: Ricevi una nuova richiesta di un cliente di una concessionaria. Leggi il record con lead_read, scrivi
            un riassunto operativo di massimo 120 parole (auto di interesse, tipo di richiesta, budget e rata, auto da valutare,
            urgenza, cosa chiedere al telefono) e salvalo nel campo conversation_summary con lead_write. Poi chiama request_callback_ok
            per far approvare la richiesta al consulente. Non inventare dati. Inizia la risposta con '# Richiesta <nome cliente>'.
    awaits:
    - callback_ok
    appTools:
    - name: lead_read
      description: Legge le richieste dei clienti
      action: read
      collection: leads
      scope: all
    - name: lead_write
      description: Aggiorna una richiesta
      action: write
      collection: leads
      scope: all
    output: markdown
  approvals:
  - key: callback_ok
    title: Approva la richiesta e richiama
    description: Il consulente verifica il riassunto e approva il richiamo del cliente.
    role: consultant
    fields:
    - name
    - phone
    - request_type
    - conversation_summary
    timeoutMinutes: 2880
    onTimeout: reject
  triggers:
  - key: new_lead
    description: Una nuova richiesta avvia l'istruttoria
    'on':
      collection: leads
      op: insert
    start:
      agent: screener
    goal: 'Nuova richiesta da istruire: {record.name}, telefono {record.phone}, tipo {record.request_type}, note {record.notes},
      riassunto del cliente {record.conversation_summary}. Data {date}.'
    asUser: false
  - key: new_lead_mail
    'on':
      collection: leads
      op: insert
    notify:
      to:
      - admins
      - role:consultant
      subject: Nuova richiesta {record.request_type} da {record.name}
      body: Nuova richiesta di {record.name} ({record.phone}). Aprila nella piattaforma per leggere il riassunto e approvare
        il richiamo.
      link: leads
  - key: callback_approved
    'on':
      approval: callback_ok
      decision: approved
    notify:
      to:
      - role:consultant
      subject: 'Richiesta approvata: richiama il cliente'
      body: La richiesta è stata approvata. Richiama il cliente entro la giornata.
      link: leads
  - key: sold_fee
    description: Commissione per auto venduta
    'on':
      collection: cars
      op: update
      where:
        status: sold
    charge:
      credits: 50
      reason: commissione auto venduta
  channels:
  - key: phone_assistant
    type: phone
    agent: assistant
    greeting: Buongiorno, sono l'assistente della concessionaria. Come posso aiutarla?
    language: it
  data:
    collections:
    - name: cars
      description: Stock della concessionaria
      ownedBy: shared
      searchable: true
      fields:
      - name: model
        type: text
        required: true
        label: Modello
      - name: year
        type: number
        required: true
        label: Anno
      - name: km
        type: number
        required: true
        label: Chilometri
      - name: price
        type: number
        required: true
        label: Prezzo
      - name: fuel
        type: select
        label: Alimentazione
        options:
        - value: petrol
          label: Benzina
        - value: diesel
          label: Diesel
        - value: hybrid
          label: Ibrida
        - value: electric
          label: Elettrica
        - value: lpg
          label: GPL/Metano
      - name: options
        type: textarea
        label: Optional
      - name: warranty
        type: text
        label: Garanzia
      - name: photos
        type: file
        accept:
        - jpg
        - jpeg
        - png
        - webp
        multiple: true
        maxMb: 10
        label: Foto
      - name: status
        type: select
        label: Stato
        default: available
        options:
        - value: available
          label: Disponibile
        - value: reserved
          label: Bloccata con acconto
        - value: sold
          label: Venduta
    - name: leads
      description: 'Richieste dei clienti: contatto, prova su strada, valutazione, finanziamento, acconto'
      ownedBy: org
      retentionDays: 730
      fields:
      - name: name
        type: text
        required: true
        label: Nome
      - name: phone
        type: text
        required: true
        label: Telefono
      - name: email
        type: email
        label: Email
      - name: request_type
        type: select
        required: true
        label: Richiesta
        options:
        - value: info
          label: Informazioni
        - value: test_drive
          label: Prova su strada
        - value: trade_in
          label: Valutazione della mia auto
        - value: financing
          label: Finanziamento
        - value: deposit
          label: Bloccare un'auto con acconto
      - name: car
        type: text
        label: Auto di interesse
      - name: trade_in_details
        type: textarea
        label: La mia auto (modello, anno, km)
      - name: notes
        type: textarea
        label: Note
      - name: conversation_summary
        type: textarea
        label: Riassunto della conversazione
      - name: consent
        type: boolean
        required: true
        label: Acconsento al trattamento dei dati per essere ricontattato
      - name: status
        type: select
        label: Stato
        default: new
        options:
        - value: new
          label: Nuova
        - value: approved
          label: Approvata
        - value: called
          label: Richiamato
        - value: closed
          label: Chiusa
      access:
      - role: consultant
        can:
        - read
        - write
  slots:
  - key: installment
    description: Rata mensile indicativa (ammortamento francese)
    timeoutMs: 2000
    example:
      args:
        price: 15000
        down_payment: 3000
        months: 48
        tan: 7.5
    code: "def main(input):\n    a = input.get('args') or input\n    price = float(a.get('price', 0))\n    down = float(a.get('down_payment',\
      \ 0) or 0)\n    n = int(a.get('months', 48) or 48)\n    tan = float(a.get('tan', 7.5) or 0)\n    p = max(price - down,\
      \ 0)\n    r = tan / 100 / 12\n    if n <= 0:\n        return {'error': 'mesi non validi'}\n    m = p / n if r == 0 else\
      \ p * r / (1 - (1 + r) ** -n)\n    return {'financed': round(p, 2), 'months': n, 'tan': tan, 'monthly_payment': round(m,\
      \ 2), 'total': round(m * n, 2), 'note': 'Simulazione indicativa, non un\\'offerta di finanziamento.'}\n"
  views:
  - key: home
    type: page
    nav: false
    title: Garage Online
    sections:
    - type: hero
      layout: stack
      band: true
      eyebrow: Auto usate selezionate
      title: Trova la tua prossima auto con un **assistente** e un consulente vero.
      text: 'Chatta in qualsiasi momento: l''assistente confronta solo le auto del nostro stock, calcola una rata indicativa
        e, quando sei pronto, un consulente ti richiama.'
      actions:
      - label: Parla con l'assistente
        href: /v/chat
        style: primary
      - label: Vedi lo stock
        href: /v/stock
        style: ghost
    - type: steps
      id: come-funziona
      title: Come funziona
      items:
      - title: Scegli
        text: 'Dici budget, uso, alimentazione e rata desiderata: l''assistente propone auto dello stock.'
        badge: 💬
      - title: Richiedi
        text: Lasci i contatti per prova su strada, valutazione della tua auto o finanziamento.
        badge: 📝
      - title: Il consulente ti richiama
        text: Un consulente riceve il riassunto, approva e ti chiama. Puoi bloccare l'auto con un acconto rimborsabile.
        badge: 📞
    - type: view
      view: chat
      title: Chiedi all'assistente
    - type: note
      content: 'Le rate sono simulazioni indicative, non offerte di finanziamento: la pratica viene gestita dalla finanziaria
        partner. Le regole di rimborso dell''acconto sono comunicate dal consulente prima del pagamento.'
  - key: chat
    type: chat
    title: Assistente
    source: agent:assistant
    placeholder: Es. cerco un'ibrida sotto 15.000 € con rata di 250 €/mese
    examples:
    - Cerco un'auto per la città, massimo 12.000 €
    - Quale diesel ho nello stock sotto i 20.000 km?
    - Con 3.000 € di anticipo, quanto sarebbe la rata in 48 mesi?
    - Confronta le due ibride più economiche
  - key: stock
    type: cards
    title: Stock
    source: collection:cars
    data:
      display: cards
      fields:
      - key: model
        label: Modello
      - key: year
        label: Anno
      - key: km
        label: Km
        format: number
      - key: price
        label: Prezzo
        format: money
      - key: fuel
        label: Alimentazione
        format: badge
      - key: warranty
        label: Garanzia
      filters:
      - field: status
        op: '='
        value: available
      sort:
        field: price
        dir: asc
      limit: 100
  - key: contact
    type: form
    title: Contattaci
    collection: leads
    fields:
    - name
    - phone
    - email
    - request_type
    - car
    - trade_in_details
    - notes
    - conversation_summary
    - consent
    submit:
      label: Invia richiesta
      message: Grazie! Un consulente ti richiamerà presto.
    edit: false
  - key: leads
    type: table
    title: Richieste clienti
    source: collection:leads
    roles:
    - admin
    - consultant
    export: true
    data:
      display: table
      fields:
      - key: name
        label: Cliente
      - key: phone
        label: Telefono
      - key: request_type
        label: Richiesta
        format: badge
      - key: car
        label: Auto
      - key: conversation_summary
        label: Riassunto
      - key: status
        label: Stato
        format: badge
      sort:
        field: name
        dir: asc
      limit: 100
  - key: approvals
    type: approvals
    title: Da approvare
    approvals:
    - callback_ok
    roles:
    - admin
    - consultant
  - key: stock_admin
    type: form
    title: Aggiungi auto
    collection: cars
    roles:
    - admin
    submit:
      label: Salva auto
      message: Auto salvata.
    edit: true
  - key: stock_manage
    type: table
    title: Gestione stock
    source: collection:cars
    roles:
    - admin
    export: true
    data:
      display: table
      fields:
      - key: model
        label: Modello
      - key: year
        label: Anno
      - key: km
        label: Km
        format: number
      - key: price
        label: Prezzo
        format: money
      - key: status
        label: Stato
        format: badge
      limit: 200
  - key: account
    type: account
    title: Abbonamento
    roles:
    - admin
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 0
    plans:
    - key: dealer
      price: 199
      interval: month
      label: Concessionaria
      includes:
      - assistente AI sul sito
      - stock illimitato
      - richieste e approvazioni dei consulenti
      credits: 200
      creditsReset: monthly
      roles:
      - admin
    packs:
    - key: credits_500
      credits: 500
      price: 25
      label: 500 crediti
  extensions:
  - key: deposit_card
    description: 'Acconto con carta per bloccare un''auto, con regole di rimborso: il pagamento dei visitatori al proprietario
      via Stripe Connect non è esprimibile come pagamento per singola auto; da configurare a parte, con le regole di rimborso
      scritte dalla concessionaria.'
  - key: phone_and_click_to_call
    description: Il canale telefonico dell'assistente è dichiarato in channels (richiede Activate phone); la chiamata del
      consulente dalla piattaforma non è ancora disponibile.
  - key: chat_summary_handoff
    description: 'L''assistente anonimo non può scrivere in una raccolta riservata: il riassunto della conversazione arriva
      nel modulo di contatto (compilato dal visitatore) e viene rifinito dall''agente istruttore.'
  - key: financing_partner
    description: La richiesta di finanziamento viene girata alla finanziaria partner dal consulente; nessuna integrazione
      API con la finanziaria.
  - key: per_dealer_isolation
    description: Ogni concessionaria è un'app separata (stock e clienti non condivisi); una nuova concessionaria si crea duplicando
      il manifest.
