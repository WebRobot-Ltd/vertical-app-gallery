apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: garage-online
  displayName: Garage Online
  tagline:
    it: Il tuo showroom online, con un assistente AI e consulenti veri.
    en: Your online showroom, with an AI assistant and real advisors.
  description:
    it: 'Per concessionarie di auto usate: il visitatore chatta con un assistente che consiglia solo le auto dello stock,
      simula la rata a titolo indicativo e passa la richiesta a un consulente.'
    en: 'For used-car dealers: visitors chat with an assistant that recommends only cars in your stock, simulates an indicative
      monthly payment and hands the request to a human advisor.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#12263a'
      accent: '#e0702b'
      background: '#f6f6f3'
      foreground: '#1c2530'
    fonts:
      body: Inter
      display: Sora
    wordmark:
    - text: Garage
      color: primary
    - text: Online
      color: accent
    buttonShape: rounded
  header:
    links:
    - label:
        it: Assistente
        en: Assistant
      href: '#assistente'
    - label:
        it: Auto disponibili
        en: Available cars
      href: '#stock'
    - label:
        it: Acconto
        en: Deposit
      href: '#acconto'
    cta:
      label:
        it: Richiedi contatto
        en: Request contact
      href: /v/new_request
  auth:
    method: magic_link
    anonymous:
      agents:
      - assistant
      views:
      - home
      - chat
      - stock
    roles:
    - key: admin
      label:
        it: Concessionaria
        en: Dealer
      assignedBy: admin_emails
    - key: advisor
      label:
        it: Consulente
        en: Advisor
      assignedBy: invite
    - key: user
      label:
        it: Cliente
        en: Customer
      assignedBy: signup
  limits:
  - action: chat
    per: ip
    max: 40
    window: hour
    roles:
    - anonymous
  - action: agent:intake
    per: user
    max: 10
    window: day
    roles:
    - user
  agents:
  - key: assistant
    role: main
    description: 'Chat assistant (web and phone): helps choose a car from the dealer''s stock only and simulates an indicative
      monthly payment.'
    profile:
      inline:
        display_name: Garage Online assistant
        chat_mode: true
        crews:
        - id: assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''assistente di vendita di una concessionaria di auto usate. Parli nella lingua dell''utente,
            con tono cordiale e concreto, risposte brevi.


            Cosa fai:

            - Capisci le esigenze con poche domande: budget, uso (città, famiglia, lunghe percorrenze), alimentazione (benzina,
            diesel, ibrida, elettrica, GPL/metano), rata mensile desiderata.

            - Cerchi SOLO nello stock della concessionaria con lo strumento search_stock e leggi i dettagli con read_stock.
            Non proporre mai auto che non sono nello stock, non usare dati di portali di annunci o altre fonti, non inventare
            caratteristiche: se un dato manca, dillo.

            - Proponi 2-3 auto e confrontale in una piccola tabella (modello, anno, km, prezzo, alimentazione, garanzia, optional
            principali). Proponi solo auto con stato ''available''.

            - Per la rata usa lo strumento loan_simulation (prezzo, anticipo, mesi, TAN). Se l''utente non indica il TAN usa
            7,0% e dillo. Presenta sempre il risultato come SIMULAZIONE INDICATIVA, non un''offerta: l''approvazione e le
            condizioni reali spettano alla finanziaria partner.

            - Se l''utente vuole contatti, prova su strada, valutazione della propria auto, finanziamento o bloccare un''auto,
            spiega che deve accedere (link /login) e compilare la richiesta in /v/new_request: un consulente la riceverà con
            il riassunto e lo richiamerà. Al telefono raccogli nome, numero e auto di interesse e di'' che un consulente richiamerà.

            - Per bloccare un''auto spiega che si versa un acconto con carta, rimborsabile secondo le regole pubblicate nella
            pagina iniziale; non inventare importi o regole diversi.


            Non dare consulenza legale o finanziaria come fatto, non promettere approvazioni di finanziamento, non garantire
            prezzi o disponibilità oltre lo stock mostrato. Se non sai, passa la richiesta a un consulente.'
    goalTemplate: 'Conversazione finora:

      {history}


      Nuovo messaggio del visitatore: {message}

      Oggi è {date}. Rispondi nella lingua del visitatore ({lang} se non chiaro).'
    appTools:
    - name: search_stock
      description: Search the dealer's stock (make, model, fuel, price, year, km)
      action: search
      collection: stock
      scope: all
    - name: read_stock
      description: Read the full record of a car in the stock
      action: read
      collection: stock
      scope: all
    - name: loan_simulation
      description: 'Indicative monthly payment: args price, down_payment, months, apr'
      action: call
      slot: loan_sim
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.2
  - key: intake
    role: helper
    description: Takes a signed-in customer's request (contact, test drive, trade-in valuation, financing, deposit) and sends
      the advisor a summary for approval.
    awaits:
    - advisor_review
    profile:
      inline:
        display_name: Garage Online intake
        crews:
        - id: intake
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Prepari la richiesta di un cliente per i consulenti di una concessionaria di auto usate. Usa read_stock
            per verificare l''auto indicata (se presente). Poi: 1) salva la richiesta con write_request (tipo, auto, contatti,
            orario preferito, auto da valutare, note, riassunto); 2) chiama request_advisor_review con un riassunto di massimo
            120 parole: esigenze del cliente, auto di interesse, budget/rata desiderata, richiesta specifica, contatti. Non
            inventare nulla: riporta solo quanto scritto dal cliente. Per richieste di finanziamento spiega che la pratica
            vera sarà girata dal consulente alla finanziaria partner; non promettere esiti. Termina con un report che inizia
            con un titolo ''# Richiesta <tipo> — <auto o ''generica''>'' e sezioni ## Riepilogo, ## Cosa succede ora (un consulente
            la approva e ti richiama), ## Acconto (se la richiesta è un blocco auto: il pagamento con carta avviene dopo la
            conferma del consulente, con le regole di rimborso pubblicate).'
    goalTemplate: 'Tipo richiesta: {kind_label}

      {?car}Auto: {car}{/car}

      Nome: {name}

      Telefono: {phone}

      {?email}Email: {email}{/email}

      {?preferred_time}Orario preferito: {preferred_time}{/preferred_time}

      {?own_car}Auto da valutare: {own_car}{/own_car}

      {?notes}Note: {notes}{/notes}

      {?conversation}Riassunto/conversazione con l''assistente: {conversation}{/conversation}

      Lingua del report: {lang}. Oggi: {date}.'
    appTools:
    - name: read_stock
      description: Read the full record of a car in the stock
      action: read
      collection: stock
      scope: all
    - name: write_request
      description: Save the customer's request
      action: write
      collection: requests
      scope: user
    output: markdown
    limits:
      maxTurns: 6
      maxBudgetUsd: 0.2
  inputForm:
    title:
      it: Nuova richiesta
      en: New request
    fields:
    - name: kind
      type: select
      required: true
      label:
        it: Cosa desideri
        en: What do you need
      options:
      - value: contact
        label:
          it: Essere richiamato
          en: Call back
      - value: test_drive
        label:
          it: Prova su strada
          en: Test drive
      - value: trade_in
        label:
          it: Valutazione della mia auto
          en: Trade-in valuation
      - value: financing
        label:
          it: Richiesta di finanziamento
          en: Financing request
      - value: reserve
        label:
          it: Bloccare un'auto con acconto
          en: Reserve a car with a deposit
    - name: car
      type: relation
      relation: stock
      label:
        it: Auto di interesse
        en: Car of interest
    - name: name
      type: text
      required: true
      label:
        it: Nome e cognome
        en: Full name
    - name: phone
      type: text
      required: true
      label:
        it: Telefono
        en: Phone
    - name: email
      type: email
      label: Email
    - name: preferred_time
      type: text
      label:
        it: Quando preferisci essere richiamato
        en: Preferred call time
    - name: own_car
      type: text
      visibleWhen: kind == 'trade_in'
      label:
        it: La tua auto (marca, modello, anno, km)
        en: Your car (make, model, year, km)
    - name: conversation
      type: textarea
      maxLength: 1500
      label:
        it: Riassunto della chat (facoltativo)
        en: Chat summary (optional)
    - name: notes
      type: textarea
      maxLength: 600
      label:
        it: Note
        en: Notes
  data:
    collections:
    - name: stock
      ownedBy: shared
      description: The dealer's used-car stock, read by the assistant and the site
      searchable: true
      fields:
      - name: make
        type: text
        required: true
        label:
          it: Marca
          en: Make
      - name: model
        type: text
        required: true
        label:
          it: Modello
          en: Model
      - name: year
        type: number
        required: true
        label:
          it: Anno
          en: Year
      - name: km
        type: number
        required: true
        label:
          it: Chilometri
          en: Mileage (km)
      - name: price
        type: number
        required: true
        label:
          it: Prezzo (EUR)
          en: Price (EUR)
      - name: fuel
        type: select
        required: true
        label:
          it: Alimentazione
          en: Fuel
        options:
        - value: petrol
          label:
            it: Benzina
            en: Petrol
        - value: diesel
          label: Diesel
        - value: hybrid
          label:
            it: Ibrida
            en: Hybrid
        - value: electric
          label:
            it: Elettrica
            en: Electric
        - value: lpg
          label: GPL/Metano
      - name: options
        type: textarea
        label:
          it: Optional
          en: Options
      - name: warranty
        type: text
        label:
          it: Garanzia
          en: Warranty
      - name: photos
        type: urls
        label:
          it: Link alle foto
          en: Photo links
      - name: status
        type: select
        required: true
        default: available
        label:
          it: Stato
          en: Status
        options:
        - value: available
          label:
            it: Disponibile
            en: Available
        - value: reserved
          label:
            it: Bloccata
            en: Reserved
        - value: sold
          label:
            it: Venduta
            en: Sold
    - name: requests
      ownedBy: user
      description: A customer's own requests (contact, test drive, trade-in, financing, deposit)
      fields:
      - name: kind
        type: text
      - name: car
        type: text
      - name: name
        type: text
      - name: phone
        type: text
      - name: email
        type: email
      - name: preferred_time
        type: text
      - name: own_car
        type: text
      - name: notes
        type: textarea
      - name: summary
        type: textarea
      - name: status
        type: text
        default: pending
  approvals:
  - key: advisor_review
    title:
      it: Richiesta cliente da approvare e richiamare
      en: Customer request to approve and call back
    description: An advisor reviews the summary of the customer's conversation and request, approves it and calls the customer
      back.
    role: advisor
    decidedBy: role
    fields:
    - kind
    - car
    - name
    - phone
    - email
    - preferred_time
    - own_car
    - summary
    timeoutMinutes: 2880
    onTimeout: reject
  channels:
  - key: web_chat
    type: web
    agent: assistant
  - key: phone_line
    type: phone
    agent: assistant
    language: it
    greeting:
      it: Buongiorno, sono l'assistente della concessionaria. Come posso aiutarla a scegliere la sua prossima auto?
      en: Hello, I'm the dealership's assistant. How can I help you choose your next car?
  slots:
  - key: loan_sim
    description: Indicative monthly payment from price, down payment, months and APR
    timeoutMs: 2000
    example:
      args:
        price: 15000
        down_payment: 3000
        months: 48
        apr: 7.0
    code: "def main(input):\n    a = input.get('args') or input.get('values') or {}\n    price = float(a.get('price') or 0)\n\
      \    down = float(a.get('down_payment') or 0)\n    months = int(a.get('months') or 48)\n    apr = float(a.get('apr')\
      \ if a.get('apr') is not None else 7.0)\n    if months < 6:\n        months = 6\n    principal = max(price - down, 0.0)\n\
      \    r = apr / 100.0 / 12.0\n    pay = principal / months if r == 0 else principal * r / (1 - (1 + r) ** (-months))\n\
      \    total = pay * months + down\n    return {\n        'principal': round(principal, 2),\n        'months': months,\n\
      \        'apr_percent': apr,\n        'monthly_payment': round(pay, 2),\n        'total_cost_incl_down_payment': round(total,\
      \ 2),\n        'note': 'Indicative simulation, not an offer. Real terms are set by the partner lender.'\n    }\n"
  views:
  - key: home
    type: page
    title: Garage Online
    nav: false
    sections:
    - type: hero
      title:
        it: Trova la tua prossima auto usata con **un assistente** e un consulente vero.
        en: Find your next used car with **an assistant** and a real advisor.
      text:
        it: 'Dimmi budget, uso, alimentazione e rata desiderata: l''assistente confronta le auto del nostro stock e simula
          la rata. Poi un consulente ti richiama.'
        en: 'Tell us your budget, use, fuel type and desired monthly payment: the assistant compares the cars in our stock
          and simulates the payment. Then an advisor calls you back.'
      actions:
      - label:
          it: Chatta con l'assistente
          en: Chat with the assistant
        href: '#assistente'
        style: primary
      - label:
          it: Richiedi contatto
          en: Request contact
        href: /v/new_request
        style: ghost
    - type: view
      id: assistente
      title:
        it: Assistente
        en: Assistant
      view: chat
    - type: data
      id: stock
      title:
        it: Auto disponibili
        en: Available cars
      source: collection:stock
      display: cards
      fields:
      - key: make
        label:
          it: Marca
          en: Make
      - key: model
        label:
          it: Modello
          en: Model
      - key: year
        label:
          it: Anno
          en: Year
      - key: km
        label: km
        format: number
      - key: price
        label:
          it: Prezzo
          en: Price
        format: money
      - key: fuel
        label:
          it: Alimentazione
          en: Fuel
        format: badge
      - key: warranty
        label:
          it: Garanzia
          en: Warranty
      filters:
      - field: status
        op: '='
        value: available
      sort:
        field: price
        dir: asc
      limit: 60
      empty:
        it: Nessuna auto disponibile al momento.
        en: No cars available right now.
    - type: steps
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Chatta
          en: Chat
        text:
          it: L'assistente ti aiuta a scegliere solo tra le auto dello stock e calcola una rata indicativa.
          en: The assistant helps you choose from our stock only and computes an indicative payment.
        badge: 💬
      - title:
          it: Lascia i contatti
          en: Leave your details
        text:
          it: Accedi e chiedi un richiamo, una prova su strada o la valutazione della tua auto.
          en: Sign in and ask for a call back, a test drive or a valuation of your car.
        badge: 📞
      - title:
          it: Un consulente ti richiama
          en: An advisor calls you
        text:
          it: Riceve il riassunto della conversazione, approva la richiesta e ti chiama.
          en: They get the chat summary, approve the request and call you.
        badge: 🤝
      - title:
          it: Blocca l'auto
          en: Reserve the car
        text:
          it: Con un acconto con carta, rimborsabile secondo regole chiare. Il finanziamento vero passa dalla finanziaria
            partner.
          en: With a refundable card deposit. Real financing goes through our partner lender.
        badge: 🔒
    - type: text
      id: acconto
      title:
        it: Regole dell'acconto
        en: Deposit rules
      content:
        it: '- L''acconto blocca l''auto per il periodo concordato con il consulente.

          - Rimborso totale se annulli entro 48 ore dal pagamento, se l''auto risulta non conforme alla descrizione o se la
          finanziaria partner non approva il finanziamento richiesto.

          - Se annulli dopo 48 ore l''acconto può essere trattenuto in parte, come indicato nel modulo che ricevi prima di
          pagare.

          - Se l''acquisto si conclude, l''acconto è scalato dal prezzo.


          _Le regole sono quelle della concessionaria: il consulente ti conferma importo e condizioni prima del pagamento._'
        en: '- The deposit holds the car for the period agreed with the advisor.

          - Full refund if you cancel within 48 hours of payment, if the car does not match its description, or if the partner
          lender declines the financing.

          - After 48 hours part of the deposit may be withheld, as stated in the form you receive before paying.

          - If the purchase completes, the deposit is deducted from the price.


          _These are the dealer''s rules: the advisor confirms amount and conditions before payment._'
    - type: note
      content:
        it: 'Le simulazioni di rata sono indicative e non costituiscono offerta né consulenza finanziaria: le condizioni reali
          sono della finanziaria partner. Le auto mostrate sono solo quelle dello stock della concessionaria.'
        en: 'Payment simulations are indicative and are neither an offer nor financial advice: real terms are set by the partner
          lender. Only the dealer''s own stock is shown.'
  - key: chat
    type: chat
    title:
      it: Assistente
      en: Assistant
    source: agent:assistant
    nav: false
    examples:
    - Ho 15.000 euro e voglio un'auto ibrida per la città
    - Qual è la rata di un'auto da 12.000 euro in 48 mesi con 2.000 di anticipo?
    - Confrontami le diesel sotto i 20.000 euro
    - Cerco un'auto per la famiglia con rata massima 250 euro al mese
    placeholder:
      it: 'Scrivi cosa cerchi: budget, uso, alimentazione, rata…'
      en: 'Tell us what you need: budget, use, fuel, monthly payment…'
  - key: stock
    type: cards
    title:
      it: Stock
      en: Stock
    source: collection:stock
    query: status = available
    nav: false
  - key: new_request
    type: new_run
    title:
      it: Nuova richiesta
      en: New request
    roles:
    - user
    - admin
  - key: my_requests
    type: history
    title:
      it: Le mie richieste
      en: My requests
    source: run
    roles:
    - user
  - key: request_report
    type: report
    source: run
    printable: true
    nav: false
  - key: review
    type: approvals
    title:
      it: Richieste da richiamare
      en: Requests to call back
    approvals:
    - advisor_review
    roles:
    - advisor
    - admin
  - key: stock_admin
    type: admin
    title:
      it: Gestione stock
      en: Stock management
    source: collection:stock
    roles:
    - admin
  - key: account
    type: account
    title:
      it: Acconti e pagamenti
      en: Deposits and payments
    roles:
    - user
  billing:
    modes:
    - per_transaction
    currency: eur
    transactionFeePct: 2
    packs:
    - key: deposit
      price: 500
      credits: 0
      label:
        it: Acconto per bloccare un'auto
        en: Deposit to reserve a car
  extensions:
  - key: dealer_isolation
    description: 'One app deployment per dealership: the stock is a shared catalogue so anonymous visitors can read it, which
      is only safe if each dealership has its own app. A multi-dealer marketplace in one app would need per-dealer stock visible
      to anonymous visitors, not available yet.'
  - key: consultant_calling
    description: 'Outbound calls by the advisor from the platform (click-to-call, call logging) are not available yet: the
      approval shows name and phone and the advisor calls from their own phone. The phone channel for the assistant is declared
      but the number must be activated in the studio.'
  - key: stock_photos
    description: 'Uploading photos is not available yet: the dealer pastes links to the photos in the stock records. Bulk
      stock import (CSV) also not available: records are entered one by one in the stock management view.'
  - key: deposit_payment
    description: The deposit is a fixed-price pack (EUR 500 by default, to be set by the dealer); per-car amounts, partial
      refunds and refund rules are applied manually by the dealer in Stripe. The text of the rules on the home is a proposal
      that the dealer must confirm.
  - key: finance_partner
    description: The real financing application is forwarded by the advisor to the partner lender; no automatic integration,
      as it needs the lender's credentials and APIs.
  - key: subscription_commission
    description: 'The dealer''s monthly subscription to the platform is a commercial agreement outside this manifest; transactionFeePct
      (2%) is a placeholder for the per-car-sold commission to be confirmed. Email notification to advisors when a request
      arrives is not available yet: they read the approvals view.'
