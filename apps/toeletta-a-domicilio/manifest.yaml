apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: toeletta-a-domicilio
  displayName: Toeletta a Domicilio
  tagline:
    it: Toelettatura professionale a casa tua, con il furgone attrezzato.
    en: Professional pet grooming at your door, in a fully equipped van.
  description:
    it: Registra la scheda del tuo animale, ricevi un preventivo con durata e prezzo, prenota lo slot più comodo e paga online.
    en: Create your pet's profile, get a quote with duration and price, book the best slot and pay online.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#0f6b6b'
      accent: '#f2994a'
      background: '#fbf8f3'
      foreground: '#1d2b2b'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: 'Toeletta a '
      color: primary
    - text: Domicilio
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Servizi
        en: Services
      href: '#servizi'
    cta:
      label:
        it: Prenota
        en: Book
      href: /v/new_quote
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: groomer
      label:
        it: Toelettatore
        en: Groomer
      assignedBy: invite
    - key: user
      label:
        it: Cliente
        en: Customer
      assignedBy: signup
  limits:
  - action: agent:quote
    per: user
    max: 10
    window: day
    roles:
    - user
  agents:
  - key: quote
    role: main
    description: Calcola durata e prezzo, verifica la zona coperta e propone gli slot che riducono i chilometri dei furgoni.
    profile:
      inline:
        display_name: Preventivi toelettatura
        crews:
        - id: quote
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 14
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''assistente di prenotazione di Toeletta a Domicilio, servizio di toelettatura con furgoni
            attrezzati. Produci un preventivo in italiano (o nella lingua richiesta) con questa struttura, iniziando con un
            titolo di livello 1 "# Preventivo per <nome animale> — <data>":

            ## Zona: usa read_zones per verificare se l''indirizzo (città/CAP) è coperto; se non lo è, dillo chiaramente,
            non proporre slot e fermati.

            ## Durata e prezzo: tabella servizio / minuti / prezzo e totale. Regole di tariffa indicative: classe di taglia
            dal peso (piccola <10 kg, media 10-25, grande 25-40, gigante >40); base bagno 35/45/60/80 EUR (60/75/100/130 min);
            tosatura 30/40/55/75 EUR (+45/60/80/100 min); unghie 10 EUR (15 min); antiparassitario 15/20/25/30 EUR (15 min).
            Maggiorazione 20% per pelo lungo, riccio o con nodi e 15% per carattere timido/aggressivo (tempo +25%). Per gatti
            +15% sul prezzo. Arrotonda la durata ai 30 minuti. Considera le note sanitarie e segnala se serve il parere di
            un veterinario.

            ## Slot proposti: leggi read_vans (furgoni, base, orari) e read_stops (tappe già prenotate con data, ora, furgone,
            lat/lon). Geocodifica l''indirizzo del cliente con geocode (query: q=<indirizzo>&format=json&limit=1; rispetta
            l''uso moderato di Nominatim). Proponi 3 slot nella data e fascia richieste (o i giorni vicini) liberi per la
            durata necessaria, preferendo il furgone che ha già una tappa vicina (minimo chilometraggio, stima in km) e evitando
            buchi nel giro. Non rivelare mai indirizzi o dati di altri clienti: di'' solo "giro già nella tua zona".

            ## Prossimi passi: invita a prenotare nella pagina Prenota scegliendo uno slot proposto e a pagare online.

            Non inventare tariffe diverse né disponibilità: se i dati mancano, dillo.'
          mcp_servers: []
    goalTemplate: 'Animale: {pet_name} ({pet_species}), razza {pet_breed}, peso {pet_weight} kg, pelo {pet_coat}, carattere
      {pet_temperament}.

      {?pet_health}Note sanitarie: {pet_health}{/pet_health}

      Indirizzo: {address}

      Servizi richiesti: {services}

      {?date}Data preferita: {date}{/date}

      Fascia: {window_label}

      {?notes}Note: {notes}{/notes}

      Oggi è {date_today}. Rispondi nella lingua con codice ISO {lang}.'
    context:
    - key: pet_name
      from: collection:pets.name
    - key: pet_species
      from: collection:pets.species
    - key: pet_breed
      from: collection:pets.breed
    - key: pet_weight
      from: collection:pets.weight_kg
    - key: pet_coat
      from: collection:pets.coat
    - key: pet_temperament
      from: collection:pets.temperament
    - key: pet_health
      from: collection:pets.health_notes
    appTools:
    - name: read_zones
      description: Zone coperte dal servizio (città, CAP)
      action: read
      collection: zones
      scope: all
    - name: read_vans
      description: Furgoni con base, giorni e orari
      action: read
      collection: vans
      scope: all
    - name: read_stops
      description: Tappe già prenotate dei furgoni (data, ora, furgone, coordinate)
      action: read
      collection: route_stops
      scope: all
    - name: geocode
      description: Geocodifica un indirizzo con Nominatim (OpenStreetMap)
      action: http
      http:
        method: GET
        url: https://nominatim.openstreetmap.org/search
        headers:
          Accept: application/json
        attribution: © OpenStreetMap contributors, ODbL
    output: markdown
    limits:
      maxTurns: 14
      maxBudgetUsd: 0.5
  - key: router
    role: helper
    description: Geocodifica ogni nuova prenotazione e la registra come tappa del giro del furgone.
    profile:
      inline:
        display_name: Geocodifica tappe
        crews:
        - id: router
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 4
          max_budget_usd: 0.1
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Ricevi una prenotazione. Geocodifica l''indirizzo con geocode (q=<indirizzo>&format=json&limit=1).
            Rispondi SOLO con un blocco JSON finale: {"key":"<data>-<ora>-<furgone>","date":"<YYYY-MM-DD>","start":"<ora di
            inizio>","van":"<furgone>","address":"<indirizzo>","lat":<numero>,"lon":<numero>}. Se non trovi l''indirizzo usa
            lat e lon null. Non inventare coordinate.'
    goalTemplate: 'Nuova prenotazione: data {record.date}, inizio {record.start}, furgone {record.resource}, indirizzo {record.address}.'
    appTools:
    - name: geocode
      description: Geocodifica un indirizzo con Nominatim (OpenStreetMap)
      action: http
      http:
        method: GET
        url: https://nominatim.openstreetmap.org/search
        headers:
          Accept: application/json
        attribution: © OpenStreetMap contributors, ODbL
    output: json
    writesTo:
      collection: route_stops
      parse: json_last
      keyBy: key
    limits:
      maxTurns: 4
      maxBudgetUsd: 0.1
  inputForm:
    title:
      it: Richiedi un preventivo
      en: Request a quote
    fields:
    - name: pet
      type: select
      required: true
      optionsFrom: collection:pets
      label:
        it: Animale
        en: Pet
    - name: address
      type: text
      required: true
      maxLength: 200
      label:
        it: Indirizzo completo
        en: Full address
    - name: services
      type: multiselect
      required: true
      label:
        it: Servizi
        en: Services
      options:
      - value: bagno
        label:
          it: Bagno
          en: Bath
      - value: tosatura
        label:
          it: Tosatura
          en: Clipping
      - value: unghie
        label:
          it: Unghie
          en: Nails
      - value: antiparassitario
        label:
          it: Trattamento antiparassitario
          en: Flea & tick treatment
    - name: date
      type: date
      label:
        it: Data preferita
        en: Preferred date
    - name: window
      type: select
      required: true
      label:
        it: Fascia oraria
        en: Time window
      options:
      - value: morning
        label:
          it: Mattina (8-12)
          en: Morning (8-12)
      - value: afternoon
        label:
          it: Primo pomeriggio (12-16)
          en: Early afternoon (12-16)
      - value: late
        label:
          it: Tardo pomeriggio (16-19)
          en: Late afternoon (16-19)
    - name: notes
      type: textarea
      maxLength: 400
      label:
        it: Note
        en: Notes
  data:
    collections:
    - name: pets
      ownedBy: user
      description: Schede degli animali
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome
          en: Name
      - name: species
        type: select
        required: true
        label:
          it: Specie
          en: Species
        options:
        - value: cane
          label: Cane
        - value: gatto
          label: Gatto
        - value: altro
          label: Altro
      - name: breed
        type: text
        required: true
        label:
          it: Razza
          en: Breed
      - name: weight_kg
        type: number
        required: true
        label:
          it: Peso (kg)
          en: Weight (kg)
      - name: coat
        type: select
        required: true
        label:
          it: Tipo di pelo
          en: Coat
        options:
        - value: corto
          label: Corto
        - value: medio
          label: Medio
        - value: lungo
          label: Lungo
        - value: riccio
          label: Riccio
        - value: duro
          label: Duro
      - name: temperament
        type: select
        label:
          it: Carattere
          en: Temperament
        options:
        - value: docile
          label: Docile
        - value: timido
          label: Timido
        - value: vivace
          label: Vivace
        - value: aggressivo
          label: Difficile
      - name: health_notes
        type: textarea
        maxLength: 600
        label:
          it: Note sanitarie
          en: Health notes
    - name: appointments
      ownedBy: user
      description: Prenotazioni dei clienti
      fields:
      - name: pet
        type: relation
        relation: pets
        label:
          it: Animale
          en: Pet
      - name: address
        type: text
        required: true
        label:
          it: Indirizzo
          en: Address
      - name: services
        type: multiselect
        label:
          it: Servizi
          en: Services
        options:
        - bagno
        - tosatura
        - unghie
        - antiparassitario
      - name: price_quoted
        type: number
        label:
          it: Prezzo da preventivo (EUR)
          en: Quoted price (EUR)
      - name: notes
        type: textarea
        maxLength: 400
        label:
          it: Note
          en: Notes
      access:
      - role: groomer
        can:
        - read
        - write
    - name: vans
      ownedBy: shared
      description: 'Furgoni: nome, targa, base, toelettatore'
      fields:
      - name: name
        type: text
        required: true
      - name: plate
        type: text
      - name: groomer_email
        type: email
      - name: base_address
        type: text
      - name: lat
        type: number
      - name: lon
        type: number
    - name: zones
      ownedBy: shared
      description: Zone coperte dal servizio
      fields:
      - name: city
        type: text
        required: true
      - name: postal_codes
        type: text
    - name: route_stops
      ownedBy: app
      description: Tappe dei giri dei furgoni (per ottimizzare i percorsi)
      retentionDays: 180
      fields:
      - name: key
        type: text
      - name: date
        type: date
      - name: start
        type: text
      - name: van
        type: text
      - name: address
        type: text
      - name: lat
        type: number
      - name: lon
        type: number
    - name: visits
      ownedBy: user
      description: 'Eventi del servizio inseriti dal toelettatore: in arrivo e servizio concluso'
      retentionDays: 730
      fields:
      - name: appointment_ref
        type: text
        label:
          it: Appuntamento
          en: Appointment
      - name: customer_email
        type: email
        required: true
        label:
          it: Email del cliente
          en: Customer email
      - name: status
        type: select
        required: true
        label:
          it: Stato
          en: Status
        options:
        - value: en_route
          label:
            it: Sto arrivando
            en: On my way
        - value: done
          label:
            it: Servizio concluso
            en: Service done
      - name: notes
        type: textarea
        label:
          it: Note
          en: Notes
      - name: photos
        type: file
        accept:
        - jpg
        - jpeg
        - png
        - webp
        maxMb: 10
        multiple: true
        label:
          it: Foto
          en: Photos
      - name: next_due
        type: date
        label:
          it: Prossima toelettatura consigliata
          en: Next grooming due
      access:
      - role: user
        where:
          customer_email: '{user.email}'
        can:
        - read
    - name: reviews
      ownedBy: user
      description: Recensioni dei clienti
      retentionDays: 1095
      fields:
      - name: appointment_ref
        type: text
        label:
          it: Appuntamento
          en: Appointment
      - name: rating
        type: number
        required: true
        label:
          it: Voto (1-5)
          en: Rating (1-5)
      - name: comment
        type: textarea
        label:
          it: Commento
          en: Comment
  views:
  - key: home
    type: page
    nav: false
    title: Toeletta a Domicilio
    sections:
    - type: hero
      layout: stack
      band: true
      eyebrow:
        it: Toelettatura a casa tua
        en: Grooming at your door
      title:
        it: Il tuo animale **coccolato** senza stress, a casa tua.
        en: Your pet **pampered** without stress, at home.
      text:
        it: Un furgone attrezzato arriva da te. Preventivo immediato in base a razza e servizi, slot scelti per ridurre i
          tempi di attesa, pagamento online.
        en: A fully equipped van comes to you. Instant quote by breed and services, slots chosen to cut waiting, online payment.
      actions:
      - label:
          it: Richiedi un preventivo
          en: Get a quote
        href: /v/new_quote
        style: primary
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Crea la scheda
          en: Create the profile
        text:
          it: Specie, razza, peso, pelo, carattere e note sanitarie.
          en: Species, breed, weight, coat, temperament and health notes.
        badge: 🐾
      - title:
          it: Preventivo e slot
          en: Quote and slots
        text:
          it: Durata, prezzo, verifica della zona e slot liberi.
          en: Duration, price, coverage check and free slots.
        badge: 🧮
      - title:
          it: Prenota e paga
          en: Book and pay
        text:
          it: Conferma lo slot e paga online a servizio o con abbonamento.
          en: Confirm the slot and pay online, per service or by subscription.
        badge: 💳
      - title:
          it: Foto e promemoria
          en: Photos and reminders
        text:
          it: Ti avvisiamo quando il furgone arriva, trovi foto e note e ricevi il promemoria per la prossima volta.
          en: We tell you when the van arrives, you get photos and notes and a reminder for next time.
        badge: 📸
    - type: cards
      id: servizi
      title:
        it: Servizi
        en: Services
      items:
      - title:
          it: Bagno
          en: Bath
        text:
          it: Shampoo adatto al pelo e asciugatura.
          en: Coat-appropriate shampoo and drying.
        badge: 🛁
      - title:
          it: Tosatura
          en: Clipping
        text:
          it: Taglio secondo la razza.
          en: Breed-appropriate cut.
        badge: ✂️
      - title:
          it: Unghie
          en: Nails
        text:
          it: Taglio e limatura.
          en: Trimming and filing.
        badge: 🐕
      - title:
          it: Antiparassitario
          en: Flea & tick
        text:
          it: Trattamento contro pulci e zecche.
          en: Treatment against fleas and ticks.
        badge: 🛡️
    - type: note
      content:
        it: I prezzi sono indicativi finché non confermi la prenotazione. Le note sanitarie non sostituiscono il parere del
          veterinario.
        en: Prices are indicative until you confirm. Health notes do not replace veterinary advice.
  - key: pets_new
    type: form
    collection: pets
    title:
      it: Nuovo animale
      en: New pet
    submit:
      label:
        it: Salva scheda
        en: Save profile
      message:
        it: Scheda salvata
        en: Profile saved
      redirect: pets
    roles:
    - user
  - key: pets
    type: table
    source: collection:pets
    title:
      it: I miei animali
      en: My pets
    columns:
    - name
    - species
    - breed
    - weight_kg
    - coat
    - temperament
    roles:
    - user
  - key: new_quote
    type: new_run
    title:
      it: Preventivo
      en: Quote
    roles:
    - user
    - admin
  - key: quotes
    type: history
    source: run
    title:
      it: I miei preventivi
      en: My quotes
    roles:
    - user
    - admin
  - key: quote_report
    type: report
    source: run
    printable: true
    nav: false
  - key: book
    type: booking
    collection: appointments
    resources: collection:vans
    title:
      it: Prenota
      en: Book
    fields:
    - pet
    - address
    - services
    - price_quoted
    - notes
    slots:
      days:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      from: 08:00
      to: '19:00'
      minutes: 60
      tz: Europe/Rome
      aheadDays: 21
      minNoticeHours: 12
      capacity: 1
    roles:
    - user
  - key: my_bookings
    type: table
    source: collection:appointments
    title:
      it: Le mie prenotazioni
      en: My bookings
    columns:
    - date
    - start
    - resource
    - address
    - services
    - status
    roles:
    - user
  - key: review_new
    type: form
    collection: reviews
    title:
      it: Lascia una recensione
      en: Leave a review
    submit:
      label:
        it: Invia
        en: Send
      message:
        it: Grazie!
        en: Thank you!
    roles:
    - user
  - key: account
    type: account
    title:
      it: Abbonamento e crediti
      en: Plan and credits
    roles:
    - user
  - key: route
    type: table
    source: collection:appointments
    title:
      it: Il mio giro
      en: My route
    columns:
    - date
    - start
    - resource
    - address
    - services
    - notes
    data:
      sort:
        field: start
        dir: asc
    roles:
    - groomer
    - admin
  - key: route_map
    type: map
    source: collection:route_stops
    title:
      it: Mappa dei giri
      en: Route map
    map:
      lat: lat
      lon: lon
      title: van
      popup:
      - date
      - start
      - address
    roles:
    - groomer
    - admin
  - key: visit_new
    type: form
    collection: visits
    title:
      it: Aggiorna il servizio
      en: Update the service
    submit:
      label:
        it: Invia
        en: Send
      message:
        it: Cliente avvisato
        en: Customer notified
    roles:
    - groomer
    - admin
  - key: admin_calendar
    type: table
    source: collection:appointments
    title:
      it: Calendario furgoni
      en: Van calendar
    columns:
    - date
    - start
    - resource
    - address
    - services
    - price_quoted
    - status
    data:
      sort:
        field: start
        dir: asc
    export: true
    roles:
    - admin
  - key: admin_reviews
    type: table
    source: collection:reviews
    title:
      it: Recensioni
      en: Reviews
    columns:
    - rating
    - comment
    - appointment_ref
    roles:
    - admin
  - key: admin_panel
    type: admin
    title:
      it: Incassi e utenti
      en: Revenue and users
    roles:
    - admin
  triggers:
  - key: booking_confirm
    description: Conferma di prenotazione al cliente
    'on':
      collection: appointments
      op: insert
    notify:
      to: owner
      subject:
        it: 'Prenotazione confermata: {record.date} alle {record.start}'
        en: 'Booking confirmed: {record.date} at {record.start}'
      body:
        it: La tua toelettatura a domicilio è prenotata per il {record.date} alle {record.start}, indirizzo {record.address}.
        en: Your home grooming is booked for {record.date} at {record.start}, address {record.address}.
      link: my_bookings
  - key: booking_stop
    description: Registra la tappa nel giro del furgone
    'on':
      collection: appointments
      op: insert
    start:
      agent: router
    goal: 'Nuova prenotazione: data {record.date}, inizio {record.start}, furgone {record.resource}, indirizzo {record.address}.'
    asUser: true
  - key: booking_fee
    description: Addebito del servizio in crediti
    'on':
      collection: appointments
      op: insert
    charge:
      credits: 50
      reason: servizio di toelettatura
  - key: booking_reminder
    description: Promemoria il giorno prima
    'on':
      date:
        collection: appointments
        field: start
        offsetDays: -1
        hour: 8
    notify:
      to: owner
      subject:
        it: Domani la toelettatura a domicilio
        en: Home grooming tomorrow
      body:
        it: 'Promemoria: domani alle {record.start} il furgone arriva a {record.address}.'
        en: 'Reminder: tomorrow at {record.start} the van arrives at {record.address}.'
      link: my_bookings
  - key: van_arriving
    description: Il furgone sta arrivando
    'on':
      collection: visits
      op: insert
      where:
        status: en_route
    notify:
      to: record.customer_email
      subject:
        it: Il furgone sta arrivando
        en: The van is on its way
      body:
        it: Il nostro furgone sta arrivando da te. A tra poco!
        en: Our van is on its way. See you soon!
  - key: service_done
    description: Servizio concluso con foto e note
    'on':
      collection: visits
      op: insert
      where:
        status: done
    notify:
      to: record.customer_email
      subject:
        it: 'Servizio concluso: foto e note'
        en: 'Service done: photos and notes'
      body:
