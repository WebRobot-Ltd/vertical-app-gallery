apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: soldisereni
  displayName: SoldiSereni
  tagline:
    it: Educazione finanziaria, spese sotto controllo e consulenza a parcella.
  description:
    it: Percorsi formativi con quiz, registro di entrate e spese con analisi dell'agente, assistente per domande generali
      e sessioni a pagamento con consulenti indipendenti iscritti all'albo.
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f4e5f'
      accent: '#e0a63a'
      background: '#f7f9f8'
      foreground: '#1b2a30'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Soldi
      color: primary
    - text: Sereni
      color: accent
  header:
    links:
    - label:
        it: Come funziona
      href: '#come-funziona'
    - label:
        it: Consulenza
      href: '#consulenza'
    cta:
      label:
        it: Accedi
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
    - key: consultant
      label:
        it: Consulente
      assignedBy: derived
      from: collection:shares.consultant_email
  limits:
  - action: agent:analyst
    per: user
    max: 3
    window: month
    roles:
    - user
    plans:
      pro: 60
  - action: chat
    per: user
    max: 30
    window: day
  agents:
  - key: analyst
    role: main
    description: Analizza le spese e le entrate registrate dall'utente e propone obiettivi di risparmio.
    profile:
      inline:
        display_name: Analista spese SoldiSereni
        crews:
        - id: analyst
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un analista di educazione finanziaria personale. Ricevi i movimenti (entrate e spese) registrati
            dall''utente, uno per riga in JSON. Scrivi il report in italiano. Inizia con un titolo di livello 1 "# Il tuo
            andamento — <periodo>". Sezioni con ## : Dove vanno i soldi, Andamento, Segnali da guardare, Obiettivi di risparmio
            proposti, Prossimi passi. Calcola solo da cifre presenti nei dati, non inventare importi. Se i dati sono pochi,
            dillo. Aggiungi un grafico come blocco chart con le spese per categoria: ```chart {"type":"pie","title":"Spese
            per categoria","labels":["A","B"],"series":[{"name":"Spese","values":[1,2]}],"unit":"EUR"} ``` con valori reali.
            Questa è educazione finanziaria, non consulenza: non dare raccomandazioni di investimento personalizzate e, per
            un parere personale, invita a prenotare una sessione con un consulente iscritto all''albo.'
    context:
    - key: movimenti
      from: collection:transactions
    goalTemplate: 'Periodo di interesse: {period_label}.

      {?focus}Domanda dell''utente: {focus}{/focus}

      Movimenti registrati (JSON, uno per riga):

      {movimenti}

      Oggi è {date}. Scrivi in lingua {lang}.'
    output: markdown
  - key: assistant
    role: helper
    description: Assistente di educazione finanziaria generale.
    profile:
      inline:
        display_name: Assistente SoldiSereni
        chat_mode: true
        crews:
        - id: assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 4
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: Sei l'assistente di SoldiSereni, app di educazione finanziaria. Rispondi in italiano, in modo chiaro
            e breve, a domande generali su budget, risparmio, interessi, inflazione, strumenti finanziari. Non dai raccomandazioni
            di investimento personalizzate, non dici cosa comprare o vendere né previsioni di rendimento. Se l'utente chiede
            un parere personale, spiega che serve un consulente indipendente iscritto all'albo e invita a prenotare una sessione
            dall'app. Non inventare cifre; dichiara quando non sei sicuro.
    goalTemplate: 'Conversazione finora:

      {history}


      Nuovo messaggio dell''utente: {message}

      Rispondi in lingua {lang}.'
    output: markdown
  inputForm:
    title:
      it: Nuova analisi
    fields:
    - name: period
      type: select
      required: true
      label:
        it: Periodo
      options:
      - value: mese
        label:
          it: Ultimo mese
      - value: trimestre
        label:
          it: Ultimi 3 mesi
      - value: anno
        label:
          it: Ultimo anno
    - name: focus
      type: textarea
      maxLength: 400
      label:
        it: Cosa vuoi capire? (facoltativo)
  data:
    collections:
    - name: transactions
      ownedBy: user
      description: Entrate e spese dell'utente
      retentionDays: 1095
      fields:
      - name: date
        type: date
        required: true
        label:
          it: Data
      - name: kind
        type: select
        required: true
        label:
          it: Tipo
        options:
        - value: entrata
          label:
            it: Entrata
        - value: spesa
          label:
            it: Spesa
      - name: amount
        type: number
        required: true
        label:
          it: Importo (EUR)
      - name: category
        type: select
        required: true
        label:
          it: Categoria
        options:
        - casa
        - cibo
        - trasporti
        - salute
        - svago
        - abbonamenti
        - stipendio
        - altro
      - name: note
        type: text
        maxLength: 200
        label:
          it: Nota
    - name: lessons
      ownedBy: shared
      description: Percorsi formativi
      fields:
      - name: title
        type: text
        label:
          it: Titolo
      - name: topic
        type: select
        label:
          it: Tema
        options:
        - budget
        - risparmio
        - investimenti
      - name: summary
        type: textarea
        label:
          it: Sintesi
      - name: content
        type: textarea
        label:
          it: Contenuto
    - name: quiz_results
      ownedBy: user
      description: Risultati dei quiz
      retentionDays: 1095
      fields:
      - name: lesson
        type: text
        required: true
        label:
          it: Lezione
      - name: score
        type: number
        required: true
        label:
          it: Punteggio (0-10)
    - name: consultants
      ownedBy: shared
      description: Consulenti indipendenti iscritti all'albo
      fields:
      - name: name
        type: text
        label:
          it: Nome
      - name: email
        type: email
        label:
          it: Email
      - name: albo
        type: text
        label:
          it: Iscrizione all'albo
      - name: bio
        type: textarea
        label:
          it: Profilo
      - name: fee
        type: number
        label:
          it: Parcella a sessione (EUR)
    - name: appointments
      ownedBy: user
      description: Sessioni prenotate
      retentionDays: 730
      fields:
      - name: notes
        type: textarea
        maxLength: 500
        label:
          it: Note per il consulente
    - name: shares
      ownedBy: user
      description: Dati che l'utente sceglie di condividere con il consulente scelto
      retentionDays: 365
      fields:
      - name: consultant_email
        type: email
        required: true
        label:
          it: Email del consulente
      - name: summary
        type: textarea
        required: true
        maxLength: 4000
        label:
          it: Cosa condividi (riepilogo di spese, obiettivi, domande)
      access:
      - role: consultant
        where:
          consultant_email: '{user.email}'
        can:
        - read
  views:
  - key: home
    type: page
    title: SoldiSereni
    nav: false
    sections:
    - type: hero
      title:
        it: 'Soldi **sereni**: capisci, tieni traccia, decidi.'
      text:
        it: Percorsi brevi con quiz, registro delle spese con analisi AI e, se vuoi un parere personale, una sessione con
          un consulente indipendente iscritto all'albo.
      actions:
      - label:
          it: Inizia gratis
        href: /login
        style: primary
      - label:
          it: Come funziona
        href: '#come-funziona'
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
      items:
      - title:
          it: Impara
        text:
          it: Percorsi su budget, risparmio e investimenti con quiz.
        badge: 📚
      - title:
          it: Traccia
        text:
          it: Registra entrate e spese; l'agente mostra dove vanno i soldi e propone obiettivi.
        badge: 📊
      - title:
          it: Chiedi
        text:
          it: Un assistente risponde alle domande generali di educazione finanziaria.
        badge: 💬
    - type: cards
      id: consulenza
      title:
        it: Consulenza a parcella
      items:
      - title:
          it: Fee-only
        text:
          it: Il consulente è indipendente, iscritto all'albo, e viene pagato solo da te a sessione.
      - title:
          it: Condividi solo ciò che vuoi
        text:
          it: Il consulente vede soltanto il riepilogo che decidi di condividere con lui.
    - type: note
      content:
        it: 'SoldiSereni fornisce educazione finanziaria e strumenti software. Non è consulenza finanziaria: la consulenza
          personalizzata è fornita esclusivamente da consulenti indipendenti iscritti all''albo.'
  - key: learn
    type: cards
    title:
      it: Percorsi
    source: collection:lessons
    roles:
    - user
    - admin
    data:
      display: cards
      fields:
      - key: title
        label:
          it: Titolo
      - key: topic
        label:
          it: Tema
        format: badge
      - key: summary
        label:
          it: Sintesi
      empty:
        it: Nessun percorso ancora.
  - key: quiz
    type: form
    title:
      it: Quiz
    collection: quiz_results
    fields:
    - lesson
    - score
    submit:
      label:
        it: Salva risultato
      message:
        it: Risultato salvato.
    roles:
    - user
    - admin
  - key: add_tx
    type: form
    title:
      it: Nuovo movimento
    collection: transactions
    submit:
      label:
        it: Salva
      message:
        it: Movimento registrato.
      redirect: movements
    roles:
    - user
    - admin
  - key: movements
    type: table
    title:
      it: I miei movimenti
    source: collection:transactions
    export: true
    roles:
    - user
    - admin
    data:
      display: table
      fields:
      - key: date
        label:
          it: Data
        format: date
      - key: kind
        label:
          it: Tipo
        format: badge
      - key: category
        label:
          it: Categoria
      - key: amount
        label:
          it: Importo
        format: money
      - key: note
        label:
          it: Nota
      sort:
        field: date
        dir: desc
      limit: 100
  - key: by_category
    type: chart
    title:
      it: Spese per categoria
    source: collection:transactions
    roles:
    - user
    - admin
    data:
      display: chart
      chart: pie
      filters:
      - field: kind
        op: '='
        value: spesa
      fields:
      - key: category
      - key: total
      groupBy:
        field: category
        aggs:
        - key: total
          agg: sum
          field: amount
  - key: new_analysis
    type: new_run
    title:
      it: Analizza le mie spese
    roles:
    - user
    - admin
  - key: analyses
    type: history
    title:
      it: Le mie analisi
    source: run
    roles:
    - user
    - admin
  - key: analysis
    type: report
    source: run
    printable: true
    nav: false
  - key: chat
    type: chat
    title:
      it: Assistente
    source: agent:assistant
    examples:
    - it: Che differenza c'è tra fondo di emergenza e risparmio?
    - it: Come si costruisce un budget 50/30/20?
    - it: Cos'è l'inflazione e come incide sui risparmi?
    placeholder:
      it: Chiedi qualcosa di educazione finanziaria
    roles:
    - user
    - admin
  - key: book
    type: booking
    title:
      it: Prenota un consulente
    collection: appointments
    resources: collection:consultants
    fields:
    - notes
    slots:
      days:
      - 1
      - 2
      - 3
      - 4
      - 5
      from: 09:00
      to: '18:00'
      minutes: 60
      tz: Europe/Rome
      aheadDays: 21
      minNoticeHours: 24
      capacity: 1
    roles:
    - user
    - admin
  - key: share
    type: form
    title:
      it: Condividi dati col consulente
    collection: shares
    submit:
      label:
        it: Condividi
      message:
        it: Condiviso con il consulente scelto.
    roles:
    - user
    - admin
  - key: clients
    type: table
    title:
      it: I miei clienti
    source: collection:shares
    roles:
    - consultant
    data:
      display: table
      fields:
      - key: summary
        label:
          it: Dati condivisi
      limit: 100
  - key: account
    type: account
    title:
      it: Piano e crediti
    roles:
    - user
  billing:
    modes:
    - credits
    - subscription
    signupCredits: 30
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:analyst:
        estimate: 10
        metered: true
    packs:
    - key: sessione
      credits: 0
      price: 80
      label:
        it: Sessione con consulente
      unlocks:
      - book
    - key: ricarica
      credits: 500
      price: 5
      label:
        it: Ricarica crediti
    plans:
    - key: pro
      price: 6.9
      interval: month
      label:
        it: Pro
      includes:
      - analisi avanzate
      - più analisi al mese
      credits: 300
      creditsReset: monthly
      roles:
      - user
  notifications:
    emailOnRunDone: true
  triggers:
  - key: nuova_condivisione
    'on':
      collection: shares
      op: insert
    notify:
      to:
      - record.consultant_email
      subject:
        it: Un cliente ha condiviso dei dati con te
      body:
        it: Un utente di SoldiSereni ha condiviso un riepilogo con te. Accedi per consultarlo.
      link: clients
  extensions:
  - key: open_banking
    description: 'Collegamento dei conti via open banking PSD2 per importare i movimenti: non disponibile ora (richiede OAuth/provider
      AISP). Per ora i movimenti si inseriscono a mano.'
  - key: pagamento_sessione
    description: Il pagamento a sessione usa il pack 'sessione'; l'accredito al consulente e la visibilità delle prenotazioni
      al consulente richiedono un'estensione dedicata.
