apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: soldisereni
  displayName: SoldiSereni
  tagline:
    it: Capisci i tuoi soldi, con calma. Educazione finanziaria e consulenza a parcella.
    en: Understand your money, calmly. Financial education and fee-only advice.
  description:
    it: 'Percorsi brevi con quiz su budget, risparmio e investimenti, registro di entrate e spese con analisi dell''agente
      e un assistente educativo. Per un parere personale puoi prenotare una sessione a pagamento con un consulente indipendente
      iscritto all''albo: la consulenza regolamentata la fornisce solo lui.'
    en: Short learning paths with quizzes, an income and expense ledger with AI analysis and an educational assistant. For
      a personal opinion, book a paid session with an independent registered advisor.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f4e5f'
      accent: '#e08a3c'
      background: '#f7f9f8'
      foreground: '#18262c'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Soldi
      color: primary
    - text: Sereni
      color: accent
    buttonShape: rounded
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Piani
        en: Plans
      href: '#piani'
    cta:
      label:
        it: Inizia gratis
        en: Start free
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: advisor
      label:
        it: Consulente iscritto all'albo
        en: Registered advisor
      assignedBy: invite
    - key: user
      label:
        it: Utente
        en: User
      assignedBy: signup
  limits:
  - action: agent:tutor
    per: user
    max: 40
    window: day
    roles:
    - user
  - action: agent:ledger
    per: user
    max: 60
    window: day
    roles:
    - user
  - action: agent:analyst
    per: user
    max: 5
    window: day
    roles:
    - user
  agents:
  - key: analyst
    role: main
    when: mode == 'analysis'
    description: Analizza le spese dell'utente, mostra dove vanno i soldi e suggerisce obiettivi di risparmio.
    profile:
      inline:
        display_name: SoldiSereni analista
        crews:
        - id: analyst
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''analista di SoldiSereni, app di educazione finanziaria. Leggi con il tool read_transactions
            le entrate e le spese registrate dall''utente (solo le sue) e con read_goals i suoi obiettivi. Scrivi il report
            in italiano, iniziando con un titolo di livello 1 "# Analisi spese — <periodo>". Sezioni ## Sintesi, ## Dove vanno
            i soldi (tabella per categoria con importo e % sul totale delle uscite), ## Andamento (confronto con il periodo
            precedente se i dati ci sono), ## Segnali da guardare, ## Obiettivi di risparmio suggeriti (2-3 obiettivi misurabili
            con importo mensile e scadenza, spiegando come calcolati; ricorda che può salvarli chiedendo all''assistente registro),
            ## Per approfondire (percorsi formativi utili). Aggiungi un blocco ```chart``` di tipo bar o pie con le spese
            per categoria, solo con cifre reali. Usa SOLO i dati registrati: se mancano o sono pochi dillo e non inventare
            cifre. Non dare raccomandazioni di investimento personalizzate né consulenza fiscale o legale: sei uno strumento
            educativo. Se servono consigli personali, invita a prenotare una sessione con un consulente iscritto all''albo.
            Chiudi con una nota breve: ''Contenuto educativo, non consulenza finanziaria.'''
    appTools:
    - name: read_transactions
      description: Legge le entrate e spese dell'utente
      action: read
      collection: transactions
      scope: user
    - name: read_goals
      description: Legge gli obiettivi di risparmio dell'utente
      action: read
      collection: goals
      scope: user
    goalTemplate: 'Analizza le mie entrate e spese. Periodo: {period_label}.

      {?deep}Approfondimento avanzato: confronta i mesi, individua spese ricorrenti e stima il risparmio mensile possibile.{/deep}

      {?focus}Mi interessa in particolare: {focus}{/focus}

      Data di oggi: {date}. Scrivi in lingua {lang}.'
    output: markdown
    limits:
      maxTurns: 10
      maxBudgetUsd: 0.4
  - key: dossier
    role: main
    when: mode == 'dossier'
    description: Prepara il riepilogo che l'utente decide di condividere con il consulente.
    profile:
      inline:
        display_name: SoldiSereni dossier
        crews:
        - id: dossier
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Prepari un dossier di sintesi per un consulente finanziario indipendente iscritto all''albo, a partire
            dai dati dell''utente (tool read_transactions e read_goals). Includi SOLO ciò che l''utente ha chiesto di condividere
            nel campo ''focus''. Inizia con "# Dossier per il consulente — <data>". Sezioni: ## Situazione in sintesi (entrate,
            uscite, risparmio medio mensile), ## Spese per categoria (tabella), ## Obiettivi dichiarati, ## Domande dell''utente.
            Solo cifre presenti nei dati, mai inventate. Non dare raccomandazioni: il parere spetta al consulente. L''utente
            potrà poi invitare il consulente scelto sul dossier.'
    appTools:
    - name: read_transactions
      description: Legge le entrate e spese dell'utente
      action: read
      collection: transactions
      scope: user
    - name: read_goals
      description: Legge gli obiettivi di risparmio dell'utente
      action: read
      collection: goals
      scope: user
    goalTemplate: 'Prepara il dossier per il consulente. Periodo: {period_label}.

      Cosa voglio condividere e le mie domande: {focus}

      Data: {date}. Lingua {lang}.'
    output: markdown
    writesTo:
      collection: advisor_dossiers
      parse: whole
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.3
  - key: ledger
    role: helper
    description: Chat per registrare e categorizzare entrate, spese e obiettivi in linguaggio naturale.
    profile:
      inline:
        display_name: SoldiSereni registro
        crews:
        - id: ledger
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.1
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''assistente registro di SoldiSereni. Aiuti l''utente a registrare entrate e spese (tool add_transaction:
            date in ISO, type ''entrata'' o ''spesa'', amount positivo in euro, category, note) e a salvare obiettivi di risparmio
            (tool add_goal). Se mancano importo o data, chiedili; se la data manca usa oggi. Proponi una categoria tra: casa,
            alimentari, trasporti, salute, svago, abbonamenti, istruzione, risparmio, stipendio, altro, e conferma in una
            riga cosa hai salvato. Con list_transactions puoi mostrare le ultime voci. Non inventare importi. Non dare consigli
            di investimento.'
    appTools:
    - name: add_transaction
      description: Registra una entrata o spesa
      action: append
      collection: transactions
      scope: user
    - name: add_goal
      description: Salva un obiettivo di risparmio
      action: append
      collection: goals
      scope: user
    - name: list_transactions
      description: Mostra le ultime voci dell'utente
      action: show
      collection: transactions
      scope: user
    goalTemplate: 'Conversazione finora:

      {history}


      Nuovo messaggio dell''utente: {message}

      Oggi è {date}. Rispondi in lingua {lang}.'
    output: markdown
  - key: tutor
    role: helper
    description: 'Assistente di educazione finanziaria: lezioni, quiz e domande generali, senza raccomandazioni personalizzate.'
    profile:
      inline:
        display_name: SoldiSereni tutor
        crews:
        - id: tutor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.1
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei il tutor di SoldiSereni: spieghi in italiano, con parole semplici ed esempi, budget, risparmio,
            fondo emergenze, interessi, inflazione, rischio e diversificazione. Puoi guidare i percorsi del catalogo (tool
            read_courses) lezione per lezione e fare quiz di 3 domande; al termine registra il risultato con save_progress
            (path, score da 0 a 100). Regole ferme: non dare raccomandazioni di investimento personalizzate (cosa comprare,
            vendere, in che quota), non consulenza fiscale o legale, non promettere rendimenti. Se l''utente chiede un parere
            personale, spiega che serve un consulente indipendente iscritto all''albo e indica la sezione ''Consulenti''.
            Se non sei sicuro, dillo. Risposte brevi.'
    appTools:
    - name: read_courses
      description: Legge il catalogo dei percorsi formativi
      action: read
      collection: courses
      scope: all
    - name: save_progress
      description: Salva il risultato di un quiz
      action: append
      collection: lesson_progress
      scope: user
    goalTemplate: 'Conversazione finora:

      {history}


      Nuovo messaggio: {message}

      Rispondi in lingua {lang}.'
    output: markdown
  inputForm:
    title:
      it: Nuova analisi
      en: New analysis
    fields:
    - name: mode
      type: select
      required: true
      default: analysis
      label:
        it: Cosa vuoi?
        en: What do you want?
      options:
      - value: analysis
        label:
          it: Analisi delle mie spese
          en: Analyse my spending
      - value: dossier
        label:
          it: Dossier da condividere col consulente
          en: Dossier to share with an advisor
    - name: period
      type: select
      required: true
      default: 3m
      label:
        it: Periodo
        en: Period
      options:
      - value: 1m
        label:
          it: Ultimo mese
          en: Last month
      - value: 3m
        label:
          it: Ultimi 3 mesi
          en: Last 3 months
      - value: 12m
        label:
          it: Ultimo anno
          en: Last year
    - name: focus
      type: textarea
      maxLength: 600
      label:
        it: Su cosa concentrarti / cosa condividere
        en: Focus / what to share
      help:
        it: Per il dossier indica cosa vuoi mostrare al consulente e le tue domande
        en: For the dossier, say what to show the advisor and your questions
    - name: deep
      type: boolean
      gatedBy: pro
      visibleWhen: mode == 'analysis'
      label:
        it: Analisi avanzata (piano Pro)
        en: Advanced analysis (Pro)
    examples:
    - mode: analysis
      period: 3m
      focus: Voglio capire quanto spendo in svago
  data:
    collections:
    - name: transactions
      ownedBy: user
      description: Entrate e spese dell'utente
      fields:
      - name: date
        type: date
        required: true
        label: Data
      - name: type
        type: select
        required: true
        label: Tipo
        options:
        - entrata
        - spesa
      - name: amount
        type: number
        required: true
        label: Importo €
      - name: category
        type: select
        label: Categoria
        options:
        - casa
        - alimentari
        - trasporti
        - salute
        - svago
        - abbonamenti
        - istruzione
        - risparmio
        - stipendio
        - altro
      - name: note
        type: text
        label: Nota
    - name: goals
      ownedBy: user
      description: Obiettivi di risparmio
      fields:
      - name: title
        type: text
        required: true
        label: Obiettivo
      - name: target_amount
        type: number
        label: Importo €
      - name: monthly_amount
        type: number
        label: Al mese €
      - name: deadline
        type: date
        label: Scadenza
    - name: lesson_progress
      ownedBy: user
      description: Risultati dei quiz
      fields:
      - name: path
        type: text
        label: Percorso
      - name: score
        type: number
        label: Punteggio
    - name: courses
      ownedBy: shared
      description: Catalogo dei percorsi formativi
      fields:
      - name: title
        type: text
        label: Titolo
      - name: level
        type: select
        label: Livello
        options:
        - base
        - intermedio
      - name: topic
        type: select
        label: Tema
        options:
        - budget
        - risparmio
        - investimenti
      - name: summary
        type: textarea
        label: Contenuto
    - name: advisors
      ownedBy: shared
      description: Consulenti indipendenti iscritti all'albo (profili pubblici)
      fields:
      - name: name
        type: text
        label: Nome
      - name: email
        type: email
        label: Email
      - name: albo_number
        type: text
        label: N. iscrizione albo
      - name: specialty
        type: text
        label: Specialità
      - name: session_price
        type: number
        label: Parcella sessione €
    - name: advisor_dossiers
      ownedBy: user
      sharing:
      - viewer
      description: Dossier che l'utente sceglie di condividere con il consulente, visibile solo a chi viene invitato
    - name: bookings
      ownedBy: user
      sharing:
      - viewer
      - editor
      description: Sessioni prenotate con un consulente
      fields:
      - name: advisor
        type: relation
        relation: advisors
        required: true
        label: Consulente
      - name: date
        type: date
        label: Data richiesta
      - name: topic
        type: textarea
        label: Argomento
      - name: status
        type: select
        label: Stato
        options:
        - richiesta
        - confermata
        - svolta
        - annullata
  views:
  - key: home
    type: page
    nav: false
    title: SoldiSereni
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow:
        it: Educazione finanziaria · consulenza a parcella
        en: Financial education · fee-only advice
      title:
        it: Capisci dove vanno i tuoi **soldi**, con serenità.
        en: Understand where your **money** goes.
      text:
        it: Impara con percorsi brevi e quiz, registra entrate e spese, lascia che un agente ti mostri l'andamento e, se vuoi
          un parere personale, prenota un consulente indipendente iscritto all'albo.
        en: Learn with short paths and quizzes, track income and expenses, and book an independent registered advisor for
          a personal opinion.
      actions:
      - label:
          it: Inizia gratis
          en: Start free
        href: /login
        style: primary
      - label:
          it: Come funziona
          en: How it works
        href: '#come-funziona'
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Impara
          en: Learn
        text:
          it: Percorsi brevi su budget, risparmio e investimenti, con quiz e un assistente per le tue domande.
          en: Short paths on budgeting, saving and investing, with quizzes and an assistant.
        badge: 🎓
      - title:
          it: Traccia
          en: Track
        text:
          it: Scrivi in chat "ho speso 12 € di spesa" e la voce viene registrata e categorizzata.
          en: Type "spent 12 € on groceries" and it is logged and categorised.
        badge: 🧾
      - title:
          it: Analizza
          en: Analyse
        text:
          it: Un agente mostra dove vanno i soldi e suggerisce obiettivi di risparmio.
          en: An agent shows where money goes and suggests savings goals.
        badge: 📊
      - title:
          it: Parla con un consulente
          en: Talk to an advisor
        text:
          it: 'Prenota e paga una sessione: il consulente vede solo i dati che scegli di condividere.'
          en: 'Book and pay a session: the advisor sees only what you share.'
        badge: 🤝
    - type: cards
      id: piani
      title:
        it: Piani
        en: Plans
      items:
      - title: Gratis
        text:
          it: Percorsi, quiz, registro spese, assistente e analisi base con i crediti di benvenuto.
          en: Paths, quizzes, ledger, assistant and basic analysis with welcome credits.
      - title: Pro
        text:
          it: 'Analisi avanzata: confronto tra mesi, spese ricorrenti, stima del risparmio possibile.'
          en: 'Advanced analysis: month comparison, recurring costs, savings estimate.'
      - title:
          it: Sessione con consulente
          en: Advisor session
        text:
          it: Pagamento a sessione, parcella decisa dal consulente.
          en: Pay per session, fee set by the advisor.
    - type: note
      content:
        it: SoldiSereni offre contenuti educativi e strumenti di tracciamento, non consulenza finanziaria. La consulenza personalizzata
          è fornita esclusivamente da consulenti indipendenti iscritti all'albo, sotto la loro responsabilità. Nessun rendimento
          è garantito.
        en: SoldiSereni provides educational content and tracking tools, not financial advice. Personal advice is provided
          solely by independent registered advisors under their own responsibility.
  - key: new
    type: new_run
    title:
      it: Analisi
      en: Analysis
    roles:
    - user
    - admin
  - key: history
    type: history
    title:
      it: Le mie analisi
      en: My analyses
    source: run
    roles:
    - user
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: ledger_chat
    type: chat
    title:
      it: Registra spese
      en: Log expenses
    source: agent:ledger
    examples:
    - Ho speso 45 € di spesa ieri
    - Stipendio 1800 € il 27
    - 'Obiettivo: 1200 € di fondo emergenze in 12 mesi'
    placeholder: Scrivi una spesa o un'entrata…
    roles:
    - user
    - admin
  - key: transactions
    type: table
    title:
      it: Movimenti
      en: Transactions
    source: collection:transactions
    data:
      display: table
      fields:
      - key: date
        label: Data
        format: date
      - key: type
        label: Tipo
        format: badge
      - key: amount
        label: Importo
        format: money
      - key: category
        label: Categoria
        format: badge
      - key: note
        label: Nota
      sort:
        field: date
        dir: desc
      limit: 100
      kpis:
      - label: Voci
        agg: count
      - label: Totale
        agg: sum
        field: amount
        format: money
      empty: 'Nessun movimento: scrivilo nella chat Registra spese.'
    roles:
    - user
    - admin
  - key: goals
    type: table
    title:
      it: Obiettivi
      en: Goals
    source: collection:goals
    data:
      display: cards
      fields:
      - key: title
        label: Obiettivo
      - key: target_amount
        label: Importo
        format: money
      - key: monthly_amount
        label: Al mese
        format: money
      - key: deadline
        label: Scadenza
        format: date
      empty: Nessun obiettivo ancora.
    roles:
    - user
    - admin
  - key: learn
    type: page
    title:
      it: Impara
      en: Learn
    sections:
    - type: view
      view: tutor_chat
      title:
        it: Il tutor
        en: The tutor
    - type: data
      source: collection:courses
      display: cards
      title:
        it: Percorsi
        en: Paths
      fields:
      - key: title
        label: Titolo
      - key: topic
        label: Tema
        format: badge
      - key: level
        label: Livello
        format: badge
      - key: summary
        label: Contenuto
      empty:
        it: Percorsi in arrivo.
        en: Paths coming soon.
    - type: data
      source: collection:lesson_progress
      display: table
      title:
        it: I miei quiz
        en: My quizzes
      fields:
      - key: path
        label: Percorso
      - key: score
        label: Punteggio
        format: number
    roles:
    - user
    - admin
  - key: tutor_chat
    type: chat
    title:
      it: Tutor
      en: Tutor
    source: agent:tutor
    examples:
    - Cos'è un fondo emergenze?
    - Facciamo il percorso sul budget
    - Interesse composto in parole semplici
    - Mettimi alla prova con un quiz sul risparmio
    placeholder: Chiedi o scrivi "inizia il percorso budget"…
    nav: false
    roles:
    - user
    - admin
  - key: advisors
    type: cards
    title:
      it: Consulenti
      en: Advisors
    source: collection:advisors
    data:
      display: cards
      fields:
      - key: name
        label: Nome
      - key: albo_number
        label: N. albo
      - key: specialty
        label: Specialità
      - key: session_price
        label: Parcella
        format: money
      empty: Nessun consulente disponibile al momento.
    roles:
    - user
    - admin
  - key: bookings
    type: table
    title:
      it: Le mie sessioni
      en: My sessions
    source: collection:bookings
    data:
      display: table
      fields:
      - key: advisor
        label: Consulente
      - key: date
        label: Data
        format: date
      - key: topic
        label: Argomento
      - key: status
        label: Stato
        format: badge
      sort:
        field: date
        dir: desc
    roles:
    - user
    - admin
  - key: dossiers
    type: table
    title:
      it: Dossier condivisi
      en: Shared dossiers
    source: collection:advisor_dossiers
    data:
      display: list
      fields:
      - key: title
        label: Dossier
      - key: createdAt
        label: Data
        format: date
    roles:
    - user
    - admin
  - key: clients
    type: table
    title:
      it: I miei clienti
      en: My clients
    source: collection:bookings
    data:
      display: table
      fields:
      - key: date
        label: Data
        format: date
      - key: topic
        label: Argomento
      - key: status
        label: Stato
        format: badge
      empty: Nessun cliente ti ha ancora scelto.
    roles:
    - advisor
  - key: client_dossiers
    type: table
    title:
      it: Dossier dei clienti
      en: Client dossiers
    source: collection:advisor_dossiers
    data:
      display: list
      fields:
      - key: title
        label: Dossier
      - key: createdAt
        label: Data
        format: date
      empty: Nessun dossier condiviso con te.
    roles:
    - advisor
  - key: account
    type: account
    title:
      it: Crediti e piano
      en: Credits and plan
    roles:
    - user
  billing:
    modes:
    - credits
    - subscription
    - per_transaction
    currency: eur
    signupCredits: 60
    metering:
      creditEur: 0.01
