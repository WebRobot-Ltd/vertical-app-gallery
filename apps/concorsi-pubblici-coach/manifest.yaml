apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: bandopronto
  displayName: BandoPronto
  tagline:
    it: Trova i bandi giusti, prepara il concorso, allenati ogni giorno.
  description:
    it: BandoPronto controlla ogni giorno inPA e la Gazzetta Ufficiale (serie concorsi), ti scrive ogni mattina i bandi compatibili
      con i tuoi filtri, ti ricorda le scadenze e ti prepara con piani di studio, quiz e un assistente che cita i testi ufficiali.
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12355b'
      accent: '#0f7a5c'
      background: '#f7f8fa'
      foreground: '#1a2230'
    fonts:
      body: Inter
      display: Source Serif 4
    wordmark:
    - text: Bando
      color: primary
    - text: Pronto
      color: accent
  header:
    links:
    - label:
        it: Come funziona
      href: '#come-funziona'
    - label:
        it: Piani
      href: '#piani'
    cta:
      label:
        it: Accedi
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  limits:
  - action: chat
    per: user
    max: 15
    window: day
    roles:
    - user
    plans:
      pro: 200
  - action: agent:study_planner
    per: user
    max: 10
    window: day
    roles:
    - user
  agents:
  - key: collector
    role: scheduled
    description: Ogni giorno raccoglie i nuovi bandi da inPA e Gazzetta Ufficiale 4a serie speciale, dopo aver verificato
      le condizioni d'uso.
    profile:
      inline:
        display_name: BandoPronto collector
        crews:
        - id: collector
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'Sei il raccoglitore di bandi di concorso pubblico di BandoPronto. Fonti: il portale inPA (www.inpa.gov.it)
            e la Gazzetta Ufficiale, 4a serie speciale Concorsi ed esami (www.gazzettaufficiale.it). PRIMA di raccogliere,
            per ciascuna fonte leggi con il tuo strumento di scraping robots.txt e le condizioni d''uso/licenza: se il riuso
            automatico non è consentito, NON raccogliere da quella fonte e dillo nel report. Usa lo strumento cerca_bandi
            per conoscere i bandi già presenti (campo codice) ed evita i duplicati. Estrai solo i bandi pubblicati nelle ultime
            48 ore e non ancora presenti. Per ogni bando estrai: codice (identificativo stabile: numero GU o id inPA), ente,
            profilo, posti (numero), regione (o ''nazionale''), titolo_studio (licenza media, diploma, laurea triennale, laurea
            magistrale), area (amministrativa, tecnica, sanitaria, istruzione, forze dell''ordine, informatica, altro), requisiti
            (sintesi), scadenza (YYYY-MM-DD), materie (elenco separato da virgole, dalle prove d''esame), url (link ufficiale),
            fonte, raccolto_il (data di oggi). Non inventare nulla: se un dato manca lascia il campo vuoto. Rispondi con un
            report che inizia con ''# Raccolta bandi — <data>'', un breve riepilogo (fonti consultate, esito della verifica
            delle condizioni d''uso, n. bandi nuovi) e alla fine UN solo blocco ```json con l''array degli oggetti dei bandi
            nuovi (array vuoto se non ce ne sono).'
    appTools:
    - name: cerca_bandi
      description: Cerca tra i bandi già raccolti
      action: search
      collection: bandi
      scope: all
    goalTemplate: Oggi è {date}. Raccogli i nuovi bandi di concorso pubblico da inPA e Gazzetta Ufficiale 4a serie speciale,
      rispettando le condizioni d'uso.
    output: markdown+json
    writesTo:
      collection: bandi
      parse: json_last
      keyBy: codice
    limits:
      maxTurns: 40
      maxBudgetUsd: 1.5
      timeoutSeconds: 1800
  - key: matcher
    role: helper
    description: Per ogni utente sceglie i bandi nuovi compatibili con i suoi filtri e scrive la mail del mattino.
    memory: none
    profile:
      inline:
        display_name: BandoPronto matcher
        crews:
        - id: matcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Selezioni per una persona i bandi di concorso nuovi compatibili con i suoi filtri (regione, titolo
            di studio, area). Usa lo strumento cerca_bandi per leggere i bandi. Considera nuovi quelli con raccolto_il uguale
            a oggi o a ieri e con scadenza non passata. Compatibile = regione uguale o ''nazionale'' (se il filtro è ''tutte''
            qualsiasi), titolo di studio richiesto pari o inferiore a quello posseduto, area uguale (o ''tutte''). Scrivi
            in italiano, testo semplice, iniziando con ''# Bandi nuovi per te — <data>''. Per ogni bando: ente, profilo, posti,
            scadenza, requisiti in una riga, materie, link ufficiale. Ordina per scadenza. Se non ce ne sono scrivi ''Nessun
            nuovo bando compatibile oggi.'' Non inventare dati: usa solo quanto restituito dallo strumento.'
    appTools:
    - name: cerca_bandi
      description: Cerca tra i bandi già raccolti
      action: search
      collection: bandi
      scope: all
    output: markdown
    writesTo:
      collection: abbinamenti
      parse: whole
  - key: study_planner
    role: main
    description: Genera il piano di studio sulle materie di un bando.
    profile:
      inline:
        display_name: BandoPronto study planner
        crews:
        - id: planner
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 4
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un tutor per concorsi pubblici italiani. Costruisci un piano di studio realistico sulle materie
            del bando indicato. Inizia con ''# Piano di studio — <profilo> (<ente>)''. Sezioni ##: Quadro del bando (posti,
            scadenza, giorni disponibili), Priorità delle materie (tabella con peso consigliato e ore), Calendario settimana
            per settimana (tempo disponibile dichiarato dall''utente), Risorse e testi normativi di riferimento (cita solo
            norme note, per nome e numero, senza inventare articoli), Strategia nelle ultime due settimane. Se la scadenza
            è troppo vicina per il tempo richiesto dillo chiaramente. Non garantire risultati. Aggiungi un grafico ```chart```
            a barre con le ore per materia.'
    context:
    - key: ente
      from: collection:bandi.ente
    - key: profilo
      from: collection:bandi.profilo
    - key: scadenza
      from: collection:bandi.scadenza
    - key: materie
      from: collection:bandi.materie
    - key: posti
      from: collection:bandi.posti
    goalTemplate: 'Bando: {profilo} presso {ente}, {posti} posti, scadenza {scadenza}.

      Materie d''esame: {materie}.

      Settimane a disposizione: {settimane}. Ore di studio a settimana: {ore_settimana}.

      {?livello}Livello di partenza: {livello_label}.{/livello}

      Oggi è {date}. Scrivi il piano in italiano.'
    output: markdown
  - key: quiz_coach
    role: helper
    description: Quiz a risposta multipla generati sulle materie, con punteggio e ripasso degli errori.
    profile:
      inline:
        display_name: BandoPronto quiz coach
        chat_mode: true
        crews:
        - id: quiz
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un allenatore di quiz per concorsi pubblici italiani. Materie: diritto amministrativo, diritto
            costituzionale, logica, informatica (puoi aggiungere altre materie richieste da un bando). Quando l''utente sceglie
            materia e numero di domande (default 10) proponi UNA domanda alla volta con 4 opzioni (A-D), aspetta la risposta,
            di'' se è corretta e spiega in due righe. Le domande sono originali, generate da te: non dire mai che sono quesiti
            ufficiali. Non inventare articoli o sentenze: se non sei sicuro della norma, scegli un''altra domanda. A fine
            sessione calcola il punteggio e chiama save_risultato (materia, domande, corrette, punteggio in percentuale, data
            odierna). Per ogni risposta sbagliata chiama save_errore (materia, domanda, risposta_data, risposta_corretta,
            spiegazione). Se l''utente chiede di ripassare gli errori, chiama leggi_errori e riproponi quelle domande in forma
            nuova, una alla volta. Rispondi in italiano.'
    appTools:
    - name: save_risultato
      description: Salva il punteggio di una sessione di quiz
      action: write
      collection: risultati
      scope: user
    - name: save_errore
      description: Salva una domanda sbagliata per il ripasso
      action: write
      collection: errori
      scope: user
    - name: leggi_errori
      description: Legge gli errori salvati dall'utente
      action: read
      collection: errori
      scope: user
    goalTemplate: 'Conversazione finora:

      {history}

      Oggi è {date}. Nuovo messaggio dell''utente: {message}'
    output: markdown
  - key: assistant
    role: helper
    description: Risponde su bandi e normativa citando i testi ufficiali indicizzati.
    profile:
      inline:
        display_name: BandoPronto assistente
        chat_mode: true
        crews:
        - id: assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''assistente di BandoPronto per chi prepara concorsi pubblici. Rispondi a domande sui bandi
            (strumento cerca_bandi) e sulla normativa (strumento cerca_norme). Cita sempre i testi ufficiali trovati dagli
            strumenti, indicando titolo, estremi e link alla fonte. Se gli strumenti non restituiscono nulla di pertinente,
            dillo e non rispondere a memoria su articoli, termini o requisiti. Non dare consulenza legale: per decisioni importanti
            rimanda al bando ufficiale. Rispondi in italiano, in modo breve e chiaro.'
    appTools:
    - name: cerca_bandi
      description: Cerca tra i bandi già raccolti
      action: search
      collection: bandi
      scope: all
    - name: cerca_norme
      description: Cerca nei testi normativi ufficiali indicizzati
      action: search
      collection: norme
      scope: all
    goalTemplate: 'Conversazione finora:

      {history}

      Oggi è {date}. Domanda: {message}'
    output: markdown
  - key: indexer
    role: scheduled
    description: Ogni settimana indicizza testi normativi ufficiali utili ai concorsi.
    profile:
      inline:
        display_name: BandoPronto indexer
        crews:
        - id: indexer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'Indicizzi testi normativi ufficiali per chi prepara concorsi pubblici: Costituzione, L. 241/1990,
            D.Lgs. 165/2001, D.Lgs. 82/2005 (CAD), D.Lgs. 33/2013, DPR 487/1994 e successive modifiche, D.Lgs. 36/2023, e
            altre norme citate nei bandi recenti. Prima verifica le condizioni d''uso della fonte (Normattiva, Gazzetta Ufficiale,
            sito del Governo): se non consentono il riuso automatico, non raccogliere e dillo. Aggiorna solo ciò che è cambiato
            (usa lo strumento cerca_norme per vedere cosa c''è). Per ogni norma: id (es. ''dlgs-165-2001''), titolo, estremi,
            testo (suddiviso per articolo, in forma sintetica fedele, senza inventare), fonte_url, aggiornato_il. Chiudi con
            ''# Indicizzazione norme — <data>'', un riepilogo e UN solo blocco ```json con l''array degli oggetti.'
    appTools:
    - name: cerca_norme
      description: Cerca nei testi normativi già indicizzati
      action: search
      collection: norme
      scope: all
    goalTemplate: Oggi è {date}. Aggiorna l'indice dei testi normativi.
    output: markdown+json
    writesTo:
      collection: norme
      parse: json_last
      keyBy: id
    limits:
      maxTurns: 40
      maxBudgetUsd: 1.5
      timeoutSeconds: 1800
  templates:
  - key: bandi_watch
    title:
      it: I miei filtri
    description:
      it: Ogni mattina una email con i bandi nuovi compatibili con regione, titolo di studio e area.
    agent: matcher
    params:
    - name: regione
      type: text
      required: true
      label:
        it: Regione (o «tutte»)
      help:
        it: es. Lombardia
    - name: titolo
      type: select
      required: true
      label:
        it: Titolo di studio
      options:
      - value: licenza media
        label:
          it: Licenza media
      - value: diploma
        label:
          it: Diploma
      - value: laurea triennale
        label:
          it: Laurea triennale
      - value: laurea magistrale
        label:
          it: Laurea magistrale
    - name: area
      type: select
      required: true
      label:
        it: Area
      options:
      - value: tutte
        label:
          it: Tutte
      - value: amministrativa
        label:
          it: Amministrativa
      - value: tecnica
        label:
          it: Tecnica
      - value: sanitaria
        label:
          it: Sanitaria
      - value: istruzione
        label:
          it: Istruzione
      - value: forze dell'ordine
        label:
          it: Forze dell'ordine
      - value: informatica
        label:
          it: Informatica
    goal: 'Filtro "{instance}": regione {regione}, titolo di studio posseduto {titolo}, area {area}. Oggi è {date}. Scrivi
      la mail del mattino con i bandi nuovi compatibili.'
    schedule:
      cron: 0 6 * * *
      userCanChange: false
    maxPerUser: 3
    deliver:
      to: owner
      subject: BandoPronto — bandi nuovi del {date}
      onlyIfNew: true
  schedules:
  - agent: collector
    action: run
    cron: 30 3 * * *
    owner: app
  - agent: indexer
    action: run
    cron: 0 2 * * 1
    owner: app
  triggers:
  - key: promemoria_scadenza
    description: Promemoria cinque giorni prima della scadenza di un bando salvato
    'on':
      date:
        collection: salvati
        field: scadenza
        offsetDays: -5
        hour: 6
    notify:
      to: owner
      subject:
        it: 'Scade tra 5 giorni: {record.bando}'
      body:
        it: Ciao, il termine per presentare domanda al bando «{record.bando}» scade il {record.scadenza}. Controlla i requisiti
          e invia la domanda sul portale ufficiale in tempo.
      link: salvati
  inputForm:
    title:
      it: Piano di studio per un bando
    fields:
    - name: bando
      type: select
      required: true
      optionsFrom: collection:bandi
      label:
        it: Bando
    - name: settimane
      type: number
      required: true
      label:
        it: Settimane a disposizione
      default: 8
    - name: ore_settimana
      type: number
      required: true
      label:
        it: Ore di studio a settimana
      default: 10
    - name: livello
      type: select
      label:
        it: Livello di partenza
      options:
      - value: base
        label:
          it: Base
      - value: intermedio
        label:
          it: Intermedio
      - value: avanzato
        label:
          it: Avanzato
  data:
    collections:
    - name: bandi
      ownedBy: app
      searchable: true
      description: Bandi raccolti ogni giorno da inPA e Gazzetta Ufficiale
      fields:
      - name: codice
        type: text
        required: true
      - name: ente
        type: text
        label:
          it: Ente
      - name: profilo
        type: text
        label:
          it: Profilo
      - name: posti
        type: number
        label:
          it: Posti
      - name: regione
        type: text
        label:
          it: Regione
      - name: titolo_studio
        type: text
        label:
          it: Titolo di studio
      - name: area
        type: text
        label:
          it: Area
      - name: requisiti
        type: textarea
        label:
          it: Requisiti
      - name: scadenza
        type: date
        label:
          it: Scadenza
      - name: materie
        type: textarea
        label:
          it: Materie d'esame
      - name: url
        type: url
        label:
          it: Link ufficiale
      - name: fonte
        type: text
      - name: raccolto_il
        type: date
    - name: norme
      ownedBy: app
      searchable: true
      description: Testi normativi ufficiali indicizzati
      fields:
      - name: id
        type: text
        required: true
      - name: titolo
        type: text
      - name: estremi
        type: text
      - name: testo
        type: textarea
      - name: fonte_url
        type: url
      - name: aggiornato_il
        type: date
    - name: abbinamenti
      ownedBy: instance
      retentionDays: 90
      description: Le mail del mattino di ogni filtro
      fields:
      - name: report
        type: textarea
    - name: salvati
      ownedBy: user
      description: Bandi che l'utente segue, per il promemoria
      fields:
      - name: bando
        type: select
        required: true
        optionsFrom: collection:bandi
        label:
          it: Bando
      - name: scadenza
        type: date
        required: true
        label:
          it: Scadenza del bando
        help:
          it: Come indicata nel bando
    - name: risultati
      ownedBy: user
      description: Punteggi delle sessioni di quiz
      fields:
      - name: materia
        type: text
      - name: domande
        type: number
      - name: corrette
        type: number
      - name: punteggio
        type: number
      - name: data
        type: date
    - name: errori
      ownedBy: user
      description: Domande sbagliate da ripassare
      fields:
      - name: materia
        type: text
      - name: domanda
        type: textarea
      - name: risposta_data
        type: text
      - name: risposta_corretta
        type: text
      - name: spiegazione
        type: textarea
    - name: corsi
      ownedBy: shared
      description: Catalogo dei corsi gestito dall'admin
      fields:
      - name: titolo
        type: text
        required: true
        label:
          it: Titolo
      - name: materia
        type: text
        label:
          it: Materia
      - name: livello
        type: select
        label:
          it: Livello
        options:
        - base
        - intermedio
        - avanzato
      - name: descrizione
        type: textarea
        label:
          it: Descrizione
      - name: url
        type: url
        label:
          it: Link
  views:
  - key: home
    type: page
    title: BandoPronto
    nav: false
    sections:
    - type: hero
      eyebrow:
        it: Concorsi pubblici
      title:
        it: I bandi giusti per te, **ogni mattina**.
      text:
        it: BandoPronto controlla inPA e la Gazzetta Ufficiale, ti scrive i bandi compatibili con i tuoi filtri, ti ricorda
          le scadenze e ti prepara con piani di studio, quiz e un assistente che cita i testi ufficiali.
      actions:
      - label:
          it: Inizia gratis
        href: /login
        style: primary
      - label:
          it: Come funziona
        href: '#come-funziona'
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
      items:
      - title:
          it: Imposta i filtri
        text:
          it: 'Regione, titolo di studio e area: una email ogni mattina con i bandi nuovi compatibili.'
      - title:
          it: Segui le scadenze
        text:
          it: Salva un bando e ricevi un promemoria cinque giorni prima del termine.
      - title:
          it: Prepara il concorso
        text:
          it: Piano di studio sulle materie del bando, quiz a risposta multipla, ripasso degli errori.
      - title:
          it: Chiedi all'assistente
        text:
          it: Domande su bandi e normativa, con citazione dei testi ufficiali indicizzati.
    - type: cards
      id: piani
      title:
        it: Piani
      items:
      - title:
          it: Gratuito
        text:
          it: Elenco dei bandi, filtri con email quotidiana, promemoria scadenze, assistente con limite giornaliero.
        badge: 0 €
      - title:
          it: Pro
        text:
          it: Piani di studio, quiz illimitati con punteggi e ripasso errori, corsi e più messaggi all'assistente.
        badge: 9,90 €/mese
    - type: note
      content:
        it: 'BandoPronto è uno strumento di supporto: i bandi ufficiali su inPA e Gazzetta Ufficiale fanno sempre fede. I
          quiz sono generati dall''AI e non sono quesiti ufficiali.'
  - key: bandi_elenco
    type: table
    title:
      it: Bandi
    source: collection:bandi
    columns:
    - ente
    - profilo
    - posti
    - regione
    - titolo_studio
    - area
    - scadenza
    - url
    roles:
    - user
    - admin
  - key: watches
    type: instances
    template: bandi_watch
    title:
      it: I miei filtri
    roles:
    - user
    - admin
  - key: mail
    type: table
    title:
      it: Le mie email del mattino
    source: collection:abbinamenti
    columns:
    - report
    roles:
    - user
    - admin
  - key: salva
    type: form
    title:
      it: Segui un bando
    collection: salvati
    fields:
    - bando
    - scadenza
    submit:
      label:
        it: Salva e ricordami
      message:
        it: Riceverai un promemoria cinque giorni prima della scadenza.
      redirect: salvati
    roles:
    - user
    - admin
  - key: salvati
    type: table
    title:
      it: Bandi che seguo
