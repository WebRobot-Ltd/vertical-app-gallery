apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: targetscope
  displayName: TargetScope
  tagline:
    it: 'Intelligence sui mercati privati: dalla tesi di investimento alle aziende target.'
    en: 'Private markets intelligence: from investment thesis to target companies.'
  description:
    it: Descrivi la tua tesi in linguaggio naturale e ottieni schede di aziende target con segnali e fonti citate. Gestisci
      la pipeline, carica i documenti, genera memo di investimento e confronti con i comparabili, ricevi alert settimanali.
      Solo fonti aperte e dati caricati da te.
    en: Describe your thesis in plain words and get target company profiles with signals and cited sources. Manage your pipeline,
      upload documents, generate investment memos and comparables, get weekly alerts. Open sources and your own uploaded data
      only.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12263f'
      accent: '#1f7a8c'
      background: '#f6f8fa'
      foreground: '#16212e'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Target
      color: primary
    - text: Scope
      color: accent
    width: wide
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#how'
    - label:
        it: Fonti
        en: Sources
      href: '#sources'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  limits:
  - action: agent:scout
    per: user
    max: 30
    window: month
    roles:
    - user
    plans:
      team: 200
  - action: agent:analyst
    per: user
    max: 20
    window: month
    roles:
    - user
    plans:
      team: 100
  - action: create:pipeline
    max: 50
    window: total
    plans:
      team: -1
  egress:
    hosts:
    - api.company-information.service.gov.uk
    - api.ted.europa.eu
    - dati.anticorruzione.it
    notes: 'Companies House UK: free public API (key set by the app admin), Open Government Licence. TED: reuse free incl.
      commercial, CC BY 4.0. ANAC open data: dati.anticorruzione.it, CC BY 4.0. Company websites and press releases are read
      through the WebRobot MCP.'
  agents:
  - key: scout
    role: main
    when: mode == 'search'
    description: Turns an investment thesis into a list of target companies with profiles, signals and sources.
    profile:
      inline:
        display_name: TargetScope scout
        crews:
        - id: scout
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You are a private-markets research analyst for PE funds, search funds and M&A advisors. Given an
            investment thesis, find real companies that fit it using ONLY open sources: Companies House UK (ted/anac for tenders),
            TED and ANAC for public procurement, company websites and press releases (scrape them with the WebRobot MCP).
            Never invent companies, figures or sources. If a figure is an estimate, say so and explain the basis. Every datum
            must carry its source URL; if you cannot source it, write ''n/d''.


            Output structure: start with a level-1 title ''# Target list — <thesis in 6 words>''. Then ''## Thesis read''
            (how you interpreted criteria and what you could not verify). Then ''## Targets'' with one ''### <Company>'' block
            per company (aim for the requested number): Description; Website; Sector; Country/HQ; Estimated size (revenue/employees,
            with basis); Ownership if known; Recent news (date + link); Signals (hiring, new plants, tenders won, patents)
            each with date and source; Fit with thesis (high/medium/low and why). Finish with ''## Sources'' listing all URLs
            and ''## Caveats''. Add a summary table of targets at the top of the Targets section. For UK companies use ch_company
            (search and profile) via path; for tenders use ted_search (POST JSON body query/fields/limit) and anac_open_data
            (CKAN datastore). If the user asked to save results, call save_target once per company with stage ''screening''.
            Do not give investment advice as fact; this is research support.'
          name: scout
    goalTemplate: 'Investment thesis: {thesis}

      {?max_results}Number of targets wanted: {max_results}.{/max_results}{!max_results}Number of targets wanted: 8.{/max_results}

      {?save}After the report, save every target to the user''s pipeline with save_target (stage screening).{/save}

      Today is {date}. Write the report in the language with ISO code {lang}.'
    output: markdown
    appTools:
    - name: ch_company
      description: 'Companies House UK: search or read a company (path e.g. /search/companies?q=... is passed in query; /company/{number}
        via path)'
      action: http
      http:
        method: GET
        url: https://api.company-information.service.gov.uk
        allowPath: true
        attribution: Companies House, Open Government Licence v3.0
        credential:
          provider: companies_house
          header: Authorization
          format: Basic {secret}
    - name: ted_search
      description: Search EU public tender notices (TED)
      action: http
      http:
        method: POST
        url: https://api.ted.europa.eu/v3/notices/search
        attribution: TED, Publications Office of the EU, CC BY 4.0
    - name: anac_open_data
      description: 'ANAC open data (Italian public procurement), CKAN API: path /api/3/action/datastore_search with query
        resource_id, q, limit'
      action: http
      http:
        method: GET
        url: https://dati.anticorruzione.it
        allowPath: true
        attribution: ANAC, CC BY 4.0
    - name: save_target
      description: Save a company in the user's pipeline (fields name, website, sector, country, size_estimate, stage, signals,
        sources)
      action: write
      collection: pipeline
      scope: user
  - key: analyst
    role: main
    when: mode != 'search'
    description: Writes an investment memo or a comparables comparison for a pipeline company, citing sources and uploaded
      documents.
    profile:
      inline:
        display_name: TargetScope analyst
        crews:
        - id: analyst
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You are an investment analyst at a private equity fund. You write either an INVESTMENT MEMO or a
            COMPARABLES comparison for one target company, using ONLY the documents the user uploaded (financial statements,
            memos, cap tables — read them with the provided text, read_documents and read_upload; photos and scans via read_upload
            with the file id) and open sources (Companies House UK, TED, ANAC, company websites and press releases via the
            WebRobot MCP). Never invent figures. Cite every fact inline as [Source: document name or URL]; mark estimates
            as estimates; list contradictions between sources.


            Memo structure: ''# Investment memo — <Company>'' then ## Executive summary, ## Business, ## Market and competition,
            ## Financials (from uploaded documents, with a chart block when comparing years), ## Ownership and cap table,
            ## Signals and recent news, ## Risks and diligence questions, ## Preliminary view, ## Sources. Comparables structure:
            ''# Comparables — <Company>'' then a table of 4-8 comparable companies (size, growth, margin where public, source),
            ## Positioning, ## Implied observations (no valuation stated as fact), ## Sources. For numeric comparisons add
            a fenced block ```chart {"type":"bar","title":"…","labels":[…],"series":[{"name":"…","values":[…]}]}``` with real
            figures only. This is research support, not financial advice.'
          name: analyst
    context:
    - key: company_name
      from: collection:pipeline.name
    - key: company_site
      from: collection:pipeline.website
    - key: company_signals
      from: collection:pipeline.signals
    goalTemplate: 'Task: {mode_label}

      Company: {company_name} ({company_site})

      {?company_signals}Known signals: {company_signals}{/company_signals}

      {?question}Specific request: {question}{/question}

      {?docs}Uploaded files: {docs}

      {/docs}{?docs_text}Text of the uploaded files:

      {docs_text}{/docs_text}

      Also use the user''s saved documents (read_documents).

      Today is {date}. Write in the language with ISO code {lang}.'
    output: markdown
    appTools:
    - name: read_documents
      description: Read the documents the user saved in the Documents section
      action: read
      collection: documents
      scope: user
    - name: read_upload
      description: Read a file the user uploaded (images and scans, OCR included)
      action: read_file
    - name: ch_company
      description: 'Companies House UK: search or read a company (path e.g. /search/companies?q=... is passed in query; /company/{number}
        via path)'
      action: http
      http:
        method: GET
        url: https://api.company-information.service.gov.uk
        allowPath: true
        attribution: Companies House, Open Government Licence v3.0
        credential:
          provider: companies_house
          header: Authorization
          format: Basic {secret}
    - name: ted_search
      description: Search EU public tender notices (TED)
      action: http
      http:
        method: POST
        url: https://api.ted.europa.eu/v3/notices/search
        attribution: TED, Publications Office of the EU, CC BY 4.0
    - name: anac_open_data
      description: 'ANAC open data (Italian public procurement), CKAN API: path /api/3/action/datastore_search with query
        resource_id, q, limit'
      action: http
      http:
        method: GET
        url: https://dati.anticorruzione.it
        allowPath: true
        attribution: ANAC, CC BY 4.0
  - key: watcher
    role: helper
    description: 'Weekly alert on the user''s pipeline companies: news, appointments, deals.'
    memory: instance
    writesTo:
      collection: alerts
    profile:
      inline:
        display_name: TargetScope watcher
        crews:
        - id: watcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You monitor the companies in one investor''s pipeline with open sources only (company websites,
            press releases, Companies House filings and officers, TED/ANAC tenders). For each company find what is NEW in
            the last 7 days: news, appointments or resignations of directors, transactions (acquisitions, capital raises,
            disposals), tenders won, new plants, hiring bursts. Never invent; cite the source URL and date for each item.
            Skip companies with nothing new, and list them in one line. Start with ''# Pipeline alert — week of <date>''.
            Sections: ## Highlights (max 5, most important first), ## By company (### name, bullets with date, event, source),
            ## Nothing new. Your memory holds the items you already reported: do not repeat them; at the end call remember
            once with the key items of this alert (they replace the old ones). Under 500 words.'
          name: watcher
    context:
    - key: pipeline
      from: collection:pipeline
    goalTemplate: 'Pipeline companies (JSON lines): {pipeline}

      Focus: {focus}

      Today is {date}. Write the alert in the language with ISO code {lang}.'
    output: markdown
    appTools:
    - name: ch_company
      description: 'Companies House UK: search or read a company (path e.g. /search/companies?q=... is passed in query; /company/{number}
        via path)'
      action: http
      http:
        method: GET
        url: https://api.company-information.service.gov.uk
        allowPath: true
        attribution: Companies House, Open Government Licence v3.0
        credential:
          provider: companies_house
          header: Authorization
          format: Basic {secret}
    - name: ted_search
      description: Search EU public tender notices (TED)
      action: http
      http:
        method: POST
        url: https://api.ted.europa.eu/v3/notices/search
        attribution: TED, Publications Office of the EU, CC BY 4.0
    - name: anac_open_data
      description: 'ANAC open data (Italian public procurement), CKAN API: path /api/3/action/datastore_search with query
        resource_id, q, limit'
      action: http
      http:
        method: GET
        url: https://dati.anticorruzione.it
        allowPath: true
        attribution: ANAC, CC BY 4.0
  templates:
  - key: pipeline_watch
    title:
      it: Alert settimanale pipeline
      en: Weekly pipeline alert
    description:
      it: Ogni settimana nuove notizie, nomine e operazioni sulle aziende della tua pipeline.
      en: Every week new news, appointments and deals on the companies in your pipeline.
    agent: watcher
    params:
    - name: focus
      type: select
      required: true
      label:
        it: Cosa monitorare
        en: What to watch
      options:
      - value: all
        label:
          it: Tutto
          en: Everything
      - value: news
        label:
          it: Notizie
          en: News
      - value: appointments
        label:
          it: Nomine
          en: Appointments
      - value: deals
        label:
          it: Operazioni e appalti
          en: Deals and tenders
    schedule:
      cron: 0 6 * * 1
      userCanChange: true
    maxPerUser: 1
    goal: 'Weekly alert "{instance}" on the user''s pipeline. Focus: {focus}. Today is {date}.'
    deliver:
      to: owner
      onlyIfNew: true
  inputForm:
    title:
      it: Nuova richiesta
      en: New request
    fields:
    - name: mode
      type: select
      required: true
      default: search
      label:
        it: Cosa vuoi fare
        en: What do you want
      options:
      - value: search
        label:
          it: Cercare aziende target da una tesi
          en: Find targets from a thesis
      - value: memo
        label:
          it: Memo di investimento
          en: Investment memo
      - value: comps
        label:
          it: Confronto con i comparabili
          en: Comparables comparison
    - name: thesis
      type: textarea
      maxLength: 1200
      visibleWhen: mode == 'search'
      label:
        it: Tesi di investimento
        en: Investment thesis
      help:
        it: es. PMI manifatturiere nel nord Italia, ricavi 10-50 milioni, controllo familiare, packaging
        en: e.g. family-controlled manufacturing SMEs in northern Italy, revenue €10-50m, packaging
    - name: max_results
      type: number
      visibleWhen: mode == 'search'
      default: 8
      label:
        it: Numero di target
        en: Number of targets
    - name: save
      type: boolean
      visibleWhen: mode == 'search'
      label:
        it: Salva i target nella pipeline
        en: Save targets to my pipeline
    - name: company
      type: select
      optionsFrom: collection:pipeline
      visibleWhen: mode != 'search'
      label:
        it: Azienda in pipeline
        en: Pipeline company
    - name: question
      type: textarea
      maxLength: 800
      visibleWhen: mode != 'search'
      label:
        it: Richiesta specifica (facoltativa)
        en: Specific request (optional)
    - name: docs
      type: file
      multiple: true
      accept:
      - pdf
      - docx
      - xlsx
      - csv
      - txt
      - jpg
      - png
      maxMb: 15
      visibleWhen: mode != 'search'
      label:
        it: Documenti (bilanci, memo, cap table)
        en: Documents (financials, memos, cap table)
  data:
    collections:
    - name: pipeline
      ownedBy: user
      description: Target companies saved by the user, with stage
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Azienda
          en: Company
      - name: website
        type: url
        label:
          it: Sito
          en: Website
      - name: sector
        type: text
        label:
          it: Settore
          en: Sector
      - name: country
        type: country
        label:
          it: Paese
          en: Country
      - name: size_estimate
        type: text
        label:
          it: Dimensione stimata
          en: Estimated size
      - name: stage
        type: select
        required: true
        default: screening
        label:
          it: Fase
          en: Stage
        options:
        - value: screening
          label:
            it: Screening
            en: Screening
        - value: analysis
          label:
            it: Analisi
            en: Analysis
        - value: approved
          label:
            it: Approvata
            en: Approved
        - value: contacted
          label:
            it: Contattata
            en: Contacted
        - value: due_diligence
          label:
            it: Due diligence
            en: Due diligence
      - name: signals
        type: textarea
        label:
          it: Segnali
          en: Signals
      - name: sources
        type: textarea
        label:
          it: Fonti
          en: Sources
      - name: notes
        type: textarea
        label:
          it: Note
          en: Notes
    - name: documents
      ownedBy: user
      description: Documents the user keeps for the analyst
      fields:
      - name: title
        type: text
        required: true
        label:
          it: Titolo
          en: Title
      - name: company
        type: text
        label:
          it: Azienda
          en: Company
      - name: kind
        type: select
        label:
          it: Tipo
          en: Type
        options:
        - value: financials
          label:
            it: Bilancio
            en: Financials
        - value: memo
          label: Memo
        - value: cap_table
          label: Cap table
        - value: other
          label:
            it: Altro
            en: Other
      - name: file
        type: file
        accept:
        - pdf
        - docx
        - xlsx
        - csv
        - txt
        maxMb: 15
        label:
          it: File
          en: File
      retentionDays: 730
    - name: alerts
      ownedBy: instance
      description: Weekly pipeline alerts
      retentionDays: 365
    credentials:
    - provider: companies_house
      kind: api_key
      scope: org
      label: Companies House UK
      help:
        it: 'Chiave API gratuita da developer.company-information.service.gov.uk: incolla il valore base64 di "CHIAVE:".'
        en: 'Free API key from developer.company-information.service.gov.uk: paste the base64 value of "KEY:".'
  views:
  - key: home
    type: page
    nav: false
    title: TargetScope
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow:
        it: Mercati privati
        en: Private markets
      title:
        it: Dalla tesi di investimento alle **aziende target**, con le fonti.
        en: From investment thesis to **target companies**, with sources.
      text:
        it: 'Scrivi la tesi in parole tue: TargetScope trova le aziende, ne prepara la scheda con segnali e fonti, ti aiuta
          con memo e comparabili e ti avvisa ogni settimana su cosa cambia nella tua pipeline.'
        en: 'Write your thesis in plain words: TargetScope finds companies, builds profiles with signals and sources, helps
          with memos and comparables, and alerts you weekly on what changes in your pipeline.'
      actions:
      - label:
          it: Inizia
          en: Get started
        href: /login
        style: primary
      aside: <div style="padding:16px"><b>PMI packaging, nord Italia</b><br>Ricavi 10-50 M€ · controllo familiare<br><br>1.
        Azienda A — fit alto<br>2. Azienda B — fit medio<br><i>ogni dato con la sua fonte</i></div>
    - type: steps
      id: how
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Cerca
          en: Search
        text:
          it: Descrivi la tesi e ricevi una lista di target con scheda, notizie e segnali.
          en: Describe the thesis and get a target list with profiles, news and signals.
        badge: 🔎
      - title:
          it: Gestisci la pipeline
          en: Manage the pipeline
        text:
          it: Screening, analisi, approvata, contattata, due diligence.
          en: Screening, analysis, approved, contacted, due diligence.
        badge: 📋
      - title:
          it: Analizza
          en: Analyse
        text:
          it: Carica bilanci e cap table e chiedi un memo o i comparabili, con fonti citate.
          en: Upload financials and cap tables and ask for a memo or comparables, with cited sources.
        badge: 📝
      - title:
          it: Resta aggiornato
          en: Stay updated
        text:
          it: Alert settimanale via email su notizie, nomine e operazioni.
          en: Weekly email alert on news, appointments and deals.
        badge: 🔔
    - type: cards
      id: sources
      title:
        it: Fonti aperte
        en: Open sources
      items:
      - title: Companies House UK
        text:
          it: Anagrafica, bilanci depositati, amministratori.
          en: Company data, filed accounts, officers.
      - title: TED · ANAC
        text:
          it: Appalti pubblici europei e italiani.
          en: European and Italian public procurement.
      - title:
          it: Web aziendale
          en: Company web
        text:
          it: Siti, comunicati stampa e i tuoi documenti caricati.
          en: Websites, press releases and your uploaded documents.
    - type: note
      content:
        it: Supporto alla ricerca, non consulenza finanziaria o d'investimento. Solo fonti aperte e dati caricati dall'utente.
        en: Research support, not financial or investment advice. Open sources and user-uploaded data only.
  - key: new_run
    type: new_run
    title:
      it: Nuova richiesta
      en: New request
    roles:
    - user
    - admin
  - key: history
    type: history
    title:
      it: Le mie ricerche
      en: My research
    source: run
    roles:
    - user
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: pipeline
    type: table
    title:
      it: Pipeline
      en: Pipeline
    source: collection:pipeline
    columns:
    - name
    - sector
    - country
    - size_estimate
    - stage
    - website
    export: true
    roles:
    - user
    - admin
  - key: add_target
    type: form
    title:
      it: Aggiungi / modifica azienda
      en: Add / edit company
    collection: pipeline
    edit: true
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Azienda salvata
        en: Company saved
      redirect: pipeline
    roles:
    - user
    - admin
  - key: add_document
    type: form
    title:
      it: Carica documento
      en: Upload document
    collection: documents
    submit:
      label:
        it: Carica
        en: Upload
      message:
        it: Documento salvato
        en: Document saved
      redirect: docs
    roles:
    - user
    - admin
  - key: docs
    type: table
    title:
      it: Documenti
      en: Documents
    source: collection:documents
    columns:
    - title
    - company
    - kind
    roles:
    - user
    - admin
  - key: watches
    type: instances
    template: pipeline_watch
    title:
      it: Alert settimanali
      en: Weekly alerts
    roles:
    - user
    - admin
  - key: alert_list
    type: table
    title:
      it: Storico alert
      en: Alert history
    source: collection:alerts
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - user
    - admin
  notifications:
    emailOnRunDone: true
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: solo
      price: 99
      interval: month
      label: Solo
      includes:
      - 30 searches / month
      - 20 memos / month
      - 50 companies in pipeline
      - weekly alerts
      roles:
      - user
    - key: team
      price: 249
      interval: month
      label: Team
      includes:
      - 200 searches / month
      - 100 memos / month
      - unlimited pipeline
      - weekly alerts
      roles:
      - user
  extensions:
  - key: companies_house_key
    description: 'Companies House needs an HTTP Basic credential: the admin pastes the base64 of "API_KEY:" once in the app
      credentials.'
  - key: pipeline_kanban
    description: A kanban board by stage is not available yet; the pipeline is a table filterable by stage.
