apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: targetscope
  displayName: TargetScope
  tagline:
    it: 'Intelligence sui mercati privati: dalla tesi di investimento alle aziende target, con le fonti.'
    en: 'Private markets intelligence: from investment thesis to target companies, with sources.'
  description:
    it: 'Scrivi la tua tesi in linguaggio naturale: TargetScope trova aziende target da fonti aperte, le schede con segnali
      e notizie, gestisce la pipeline, scrive memo di investimento e ti avvisa ogni settimana.'
    en: 'Write your thesis in plain language: TargetScope finds target companies from open sources, profiles them with signals
      and news, manages your pipeline, drafts investment memos and alerts you weekly.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#0f2b46'
      accent: '#1f7a8c'
      background: '#f6f8fa'
      foreground: '#142030'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Target
      color: primary
    - text: Scope
      color: accent
    width: wide
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Fonti
        en: Sources
      href: '#fonti'
    - label:
        it: Prezzi
        en: Pricing
      href: '#prezzi'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  limits:
  - action: run
    per: user
    max: 30
    window: day
    roles:
    - user
  agents:
  - key: scout
    role: main
    when: mode == 'screen'
    description: Turns a thesis into a list of target companies from open sources, with signals and a source for every datum.
    profile:
      inline:
        display_name: TargetScope scout
        crews:
        - id: scout
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You are a private-markets research analyst working for private equity funds, search funds and M&A
            advisors. Given an investment thesis in natural language, you identify target companies using ONLY open sources:
            Companies House UK API (free), TED and ANAC (public procurement), company websites, press releases, and public
            news. Use the WebRobot MCP to scrape and query these sources; do not write pipeline YAML by hand. Never invent
            companies, figures or news: if a datum is not found, write ''n/d'' and say so. Every datum must carry its source
            (URL and retrieval date). Size is always an ESTIMATE: state the basis (filed accounts, headcount, etc.) and a
            confidence level.


            Output structure: start with a level-1 title ''# Target screening — <thesis in 6 words>''. Then ''## Thesis interpretation''
            (criteria extracted, assumptions, geography, size, sector). Then ''## Summary table'' (company, country, sector,
            estimated size, key signal, fit score 1-5). Then one ''## <Company>'' section per target (aim for the requested
            number) with: Description; Website; Sector; Estimated size (basis, confidence); Ownership (family-controlled or
            not, if known); Recent news (dated, with source); Signals: hiring, new plants, tenders won, patents (each with
            source, or ''none found''); Fit with the thesis; Risks and open questions. Close with ''## Sources and limits''
            listing sources used and gaps. Add a ```chart block (type bar) of fit scores when there are 3 or more targets.
            This is research support, not investment advice.'
    goalTemplate: 'Investment thesis: {thesis}

      {?geography}Geography: {geography}{/geography}

      {?count}Number of targets wanted: {count}{/count}

      Today is {date}. Write the report in the language with ISO code {lang}. Use only open sources.'
    output: markdown
    limits:
      maxTurns: 40
      maxBudgetUsd: 2
  - key: memo
    role: main
    when: mode != 'screen'
    description: Writes an investment memo or a comparables comparison on one company, using the user's uploaded documents
      and open sources, with citations.
    profile:
      inline:
        display_name: TargetScope memo writer
        crews:
        - id: memo
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 2.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You are a senior investment associate at a private equity fund. You write either an INVESTMENT MEMO
            or a COMPARABLES comparison on one company, as requested. Sources allowed: documents the user uploaded (read them
            through the app tools: financial statements, memos, cap tables) and open sources (Companies House UK, TED, ANAC,
            company websites, press releases) via the WebRobot MCP. Cite every claim with a bracketed source number [1], [2]
            and end with a ''## Sources'' list (uploaded document name or URL + date). Never invent figures; label estimates
            as such and separate facts from assumptions. If documents are missing or unreadable, say so.


            Memo structure: ''# Investment memo — <Company>'' then ## Executive summary, ## Business and market, ## Financials
            (table; ratios computed only from real figures), ## Ownership and governance (cap table if provided), ## Growth
            signals, ## Risks and mitigants, ## Valuation considerations, ## Recommendation and next steps (diligence questions).
            Comparables structure: ''# Comparables — <Company>'' then ## Peer set and selection criteria, ## Comparison table,
            ## Positioning, ## Risks and gaps, ## Sources; add a ```chart block comparing a key metric across peers with real
            figures only. This is analytical support, not financial or legal advice.'
    goalTemplate: 'Task: {mode_label}

      Company: {company}

      {?website}Website: {website}{/website}

      {?notes}Instructions and focus: {notes}{/notes}

      Use the documents the user uploaded for this company (documents collection) plus open sources. Today is {date}. Write
      in the language with ISO code {lang}.'
    appTools:
    - name: read_documents
      description: Read the documents the user uploaded (financial statements, memos, cap tables)
      action: read
      collection: documents
      scope: user
    - name: read_pipeline
      description: Read the user's pipeline companies and notes
      action: read
      collection: pipeline
      scope: user
    output: markdown
    limits:
      maxTurns: 40
      maxBudgetUsd: 2.5
  - key: monitor
    role: scheduled
    description: 'Weekly: checks news, appointments and deals on the companies in the pipeline and writes an alert digest.'
    profile:
      inline:
        display_name: TargetScope monitor
        crews:
        - id: monitor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You monitor companies on a private-equity pipeline. Read the pipeline through the app tool, then
            for each company look for NEW items in the last 7 days from open sources only: news and press releases, board/management
            appointments (Companies House filings for UK), transactions (M&A, funding, disposals), tenders won (TED, ANAC),
            new plants, patents. Never invent items; if nothing new, say ''No news''. Each item has a date and a source URL.
            Output starts with ''# Weekly alerts — <date>'', then one ''## <Company> (<stage>)'' section per company with
            bullet items classified [News], [Appointment], [Deal], [Tender], [Signal], and a final ''## Priority'' listing
            the 3 most relevant items.'
    goalTemplate: 'Run the weekly alert for all companies in the pipeline. Date: {date}. Write in Italian and English (Italian
      first).'
    appTools:
    - name: read_pipeline
      description: Read all companies in the pipeline with their stage
      action: read
      collection: pipeline
      scope: all
    output: markdown
    writesTo:
      collection: alerts
      parse: markdown_sections
      keyBy: date
    limits:
      maxTurns: 40
      maxBudgetUsd: 2
  inputForm:
    title:
      it: Nuova ricerca
      en: New research
    fields:
    - name: mode
      type: select
      required: true
      default: screen
      label:
        it: Cosa vuoi fare
        en: What do you want
      options:
      - value: screen
        label:
          it: Cercare aziende target da una tesi
          en: Find target companies from a thesis
      - value: memo
        label:
          it: Memo di investimento su un'azienda
          en: Investment memo on a company
      - value: comps
        label:
          it: Confronto con i comparabili
          en: Comparables comparison
    - name: thesis
      type: textarea
      maxLength: 1200
      visibleWhen: mode == 'screen'
      label:
        it: Tesi di investimento
        en: Investment thesis
      help:
        it: es. PMI manifatturiere nel nord Italia, ricavi 10-50 milioni, a controllo familiare, settore packaging
        en: e.g. family-owned manufacturing SMEs in northern Italy, revenue €10-50m, packaging sector
    - name: geography
      type: text
      visibleWhen: mode == 'screen'
      label:
        it: Area geografica (facoltativa)
        en: Geography (optional)
    - name: count
      type: select
      default: '8'
      visibleWhen: mode == 'screen'
      label:
        it: Numero di target
        en: Number of targets
      options:
      - '5'
      - '8'
      - '12'
    - name: company
      type: text
      visibleWhen: mode != 'screen'
      label:
        it: Azienda
        en: Company
    - name: website
      type: url
      visibleWhen: mode != 'screen'
      label:
        it: Sito web (facoltativo)
        en: Website (optional)
    - name: notes
      type: textarea
      maxLength: 800
      visibleWhen: mode != 'screen'
      label:
        it: Focus e istruzioni (facoltativi)
        en: Focus and instructions (optional)
  collections:
  - name: pipeline
    description: Companies saved by the user, with their stage
    ownedBy: user
    searchable: true
    fields:
    - name: company
      type: text
      required: true
      label:
        it: Azienda
        en: Company
    - name: website
      type: url
      label:
        it: Sito
        en: Website
    - name: sector
      type: text
      label:
        it: Settore
        en: Sector
    - name: size
      type: text
      label:
        it: Dimensione stimata
        en: Estimated size
    - name: stage
      type: select
      required: true
      default: screening
      label:
        it: Fase
        en: Stage
      options:
      - value: screening
        label: Screening
      - value: analysis
        label:
          it: Analisi
          en: Analysis
      - value: approved
        label:
          it: Approvata
          en: Approved
      - value: contacted
        label:
          it: Contattata
          en: Contacted
      - value: due_diligence
        label: Due diligence
    - name: source
      type: url
      label:
        it: Fonte
        en: Source
    - name: notes
      type: textarea
      label:
        it: Note
        en: Notes
  - name: documents
    description: Documents uploaded by the user (financial statements, memos, cap tables)
    ownedBy: user
    fields:
    - name: name
      type: text
      required: true
      label:
        it: Nome
        en: Name
    - name: company
      type: relation
      relation: pipeline
      label:
        it: Azienda
        en: Company
    - name: kind
      type: select
      label:
        it: Tipo
        en: Type
      options:
      - value: financials
        label:
          it: Bilancio
          en: Financial statements
      - value: memo
        label: Memo
      - value: cap_table
        label: Cap table
      - value: other
        label:
          it: Altro
          en: Other
    - name: file
      type: file
      required: true
      label: File
  - name: alerts
    description: Weekly alert digests written by the scheduled monitor
    ownedBy: user
    fields:
    - name: date
      type: date
      label: Data
    - name: title
      type: text
      label:
        it: Titolo
        en: Title
    - name: body
      type: textarea
      label:
        it: Contenuto
        en: Content
  schedules:
  - agent: monitor
    action: run
    cron: 0 7 * * 1
    owner: app
  views:
  - key: home
    type: page
    nav: false
    title: TargetScope
    sections:
    - type: hero
      band: true
      eyebrow:
        it: Per PE, search fund e advisor M&A
        en: For PE, search funds and M&A advisors
      title:
        it: Dalla **tesi di investimento** alle aziende target, con le fonti.
        en: From **investment thesis** to target companies, with sources.
      text:
        it: 'Descrivi la tesi in parole tue: TargetScope trova le aziende, le scheda con notizie e segnali, gestisce la tua
          pipeline, scrive memo e comparabili e ti avvisa ogni settimana. Solo fonti aperte e i tuoi documenti.'
        en: 'Describe your thesis in your own words: TargetScope finds companies, profiles them with news and signals, runs
          your pipeline, writes memos and comparables, and alerts you weekly. Open sources and your own documents only.'
      actions:
      - label:
          it: Inizia una ricerca
          en: Start a search
        href: /v/new
        style: primary
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Scrivi la tesi
          en: Write the thesis
        text:
          it: 'Settore, geografia, dimensione, assetto proprietario: in linguaggio naturale.'
          en: 'Sector, geography, size, ownership: in natural language.'
        badge: 🎯
      - title:
          it: Ricevi le schede
          en: Get the profiles
        text:
          it: Descrizione, sito, dimensione stimata, notizie e segnali (assunzioni, stabilimenti, appalti, brevetti), ognuno
            con la sua fonte.
          en: Description, website, estimated size, news and signals (hiring, plants, tenders, patents), each with its source.
        badge: 📄
      - title:
          it: Gestisci la pipeline
          en: Run the pipeline
        text:
          it: Salva i target e spostali tra screening, analisi, approvata, contattata, due diligence.
          en: Save targets and move them across screening, analysis, approved, contacted, due diligence.
        badge: 📊
      - title:
          it: Memo e alert
          en: Memos and alerts
        text:
          it: Carica bilanci e cap table, chiedi memo o comparabili con fonti citate, e ricevi alert settimanali.
          en: Upload financials and cap tables, ask for memos or comparables with cited sources, and get weekly alerts.
        badge: 🔔
    - type: cards
      id: fonti
      title:
        it: Fonti aperte
        en: Open sources
      items:
      - title: Companies House UK
        text:
          it: Anagrafica, bilanci depositati, nomine.
          en: Company data, filed accounts, appointments.
      - title: TED · ANAC
        text:
          it: Appalti pubblici europei e italiani vinti.
          en: European and Italian public tenders won.
      - title:
          it: Siti e comunicati
          en: Websites and press
        text:
          it: Siti aziendali, comunicati stampa, notizie pubbliche.
          en: Company websites, press releases, public news.
      - title:
          it: I tuoi documenti
          en: Your documents
        text:
          it: Bilanci, memo e cap table caricati da te.
          en: Financials, memos and cap tables you upload.
    - type: cards
      id: prezzi
      title:
        it: Prezzi
        en: Pricing
      items:
      - title: Pro
        text:
          it: Abbonamento per utente al mese, con crediti mensili per ricerche, memo e comparabili.
          en: Per-user monthly subscription with monthly credits for searches, memos and comparables.
        badge: €99
    - type: note
      content:
        it: TargetScope è un supporto alla ricerca, non consulenza finanziaria o legale. Le dimensioni sono stime; verifica
          sempre le fonti citate.
        en: TargetScope is research support, not financial or legal advice. Sizes are estimates; always verify the cited sources.
  - key: new
    type: new_run
    title:
      it: Nuova ricerca
      en: New research
    roles:
    - user
    - admin
  - key: runs
    type: history
    title:
      it: Le mie ricerche
      en: My research
    source: run
    roles:
    - user
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: pipeline
    type: table
    title: Pipeline
    source: collection:pipeline
    columns:
    - company
    - sector
    - size
    - stage
    - website
    - source
    - notes
    data:
      display: table
      fields:
      - key: company
        label:
          it: Azienda
          en: Company
      - key: sector
        label:
          it: Settore
          en: Sector
      - key: size
        label:
          it: Dimensione
          en: Size
      - key: stage
        label:
          it: Fase
          en: Stage
        format: badge
      - key: website
        label:
          it: Sito
          en: Website
        format: link
      - key: source
        label:
          it: Fonte
          en: Source
        format: link
      sort:
        field: stage
        dir: asc
      limit: 200
      empty:
        it: Nessuna azienda in pipeline.
        en: No companies in the pipeline yet.
    roles:
    - user
    - admin
  - key: documents
    type: list
    title:
      it: Documenti
      en: Documents
    source: collection:documents
    data:
      display: table
      fields:
      - key: name
        label:
          it: Nome
          en: Name
      - key: company
        label:
          it: Azienda
          en: Company
      - key: kind
        label:
          it: Tipo
          en: Type
        format: badge
      limit: 200
      empty:
        it: Carica bilanci, memo o cap table.
        en: Upload financials, memos or cap tables.
    roles:
    - user
    - admin
  - key: alerts
    type: list
    title:
      it: Alert settimanali
      en: Weekly alerts
    source: collection:alerts
    data:
      display: list
      fields:
      - key: date
        label: Data
        format: date
      - key: title
        label:
          it: Titolo
          en: Title
      - key: body
        label:
          it: Contenuto
          en: Content
      sort:
        field: date
        dir: desc
      limit: 52
      empty:
        it: 'Nessun alert ancora: il primo arriva lunedì.'
        en: 'No alerts yet: the first arrives on Monday.'
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - user
  notifications:
    emailOnRunDone: true
    digest: 0 8 * * 1
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 30
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:scout:
        estimate: 10
        metered: true
      agent:memo:
        estimate: 10
        metered: true
    packs:
    - key: extra
      credits: 1000
      price: 12
      label:
        it: Crediti extra
        en: Extra credits
    plans:
    - key: pro
      price: 99
      interval: month
      label: Pro
      credits: 1500
      creditsReset: monthly
      includes:
      - pipeline
      - documents
      - weekly alerts
      roles:
      - user
