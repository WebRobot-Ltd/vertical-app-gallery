apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: noleggioconfronto
  displayName: NoleggioConfronto
  tagline:
    it: Confronta il noleggio auto a lungo termine e scopri quale conviene a te.
  description:
    it: 'Compila il modulo con l''auto che cerchi e il tuo profilo: un agente AI confronta le offerte autorizzate da operatori
      e concessionari e ti restituisce una classifica con canone, servizi inclusi, anticipo e costo totale.'
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12304a'
      accent: '#e07a1f'
      background: '#f6f8fa'
      foreground: '#18222d'
    fonts:
      body: Inter
      display: Poppins
    wordmark:
    - text: Noleggio
      color: primary
    - text: Confronto
      color: accent
  header:
    links:
    - label:
        it: Come funziona
      href: '#come-funziona'
    - label:
        it: Le offerte
      href: '#fonti'
    cta:
      label:
        it: Confronta ora
      href: /v/new_search
  auth:
    method: magic_link
    anonymous:
      views:
      - home
      - contact
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: operator
      label:
        it: Operatore
      assignedBy: invite
    - key: user
      assignedBy: signup
  limits:
  - action: agent:comparator
    per: user
    max: 10
    window: day
    roles:
    - user
  agents:
  - key: comparator
    role: main
    description: Confronta le offerte autorizzate e le ordina per il profilo dell'utente.
    profile:
      inline:
        display_name: Comparatore noleggio
        crews:
        - id: comparator
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un consulente indipendente per il noleggio auto a lungo termine. Usi SOLO le offerte restituite
            dallo strumento search_offers (feed autorizzati da operatori e concessionari): non inventare mai offerte, cifre
            o servizi e non usare altre fonti. Cerca con i filtri di categoria, alimentazione, cambio, durata e uso (privato
            o partita IVA); se poche offerte corrispondono, allarga con criterio e dillo chiaramente. Escludi le offerte scadute
            (valid_until passata) e quelle con anticipo oltre il massimo. Calcola il costo totale = anticipo + canone mensile
            x mesi e, se il chilometraggio annuo dell''offerta è inferiore a quello richiesto, segnalalo come rischio di extra-km.
            Struttura del report: un titolo di primo livello "# Noleggio <categoria> — classifica per il tuo profilo"; poi
            ## Le migliori offerte con una tabella (posizione, operatore, modello, canone mensile, anticipo, durata, km/anno,
            manutenzione, assicurazione, pneumatici, costo totale); ## Quale conviene a te con la spiegazione secondo il profilo
            (per la partita IVA considera deducibilità e detraibilità solo in termini generali, senza consulenza fiscale);
            ## Attenzione a (extra-km, penali, franchigie, scadenza dell''offerta); ## Prossimi passi (invito a lasciare un
            contatto o a impostare un avviso di prezzo). Aggiungi un grafico dei costi totali come blocco ```chart con valori
            reali. Se non ci sono offerte adatte, dillo e suggerisci quali criteri allentare. Non è consulenza finanziaria
            o fiscale. Scrivi in italiano.'
    appTools:
    - name: search_offers
      description: Cerca le offerte di noleggio a lungo termine autorizzate (feed degli operatori)
      action: search
      collection: offers
      scope: all
    goalTemplate: 'Categoria: {category_label}

      Alimentazione: {fuel_label}

      Cambio: {gearbox_label}

      Chilometri all''anno: {km_year}

      Durata: {months_label}

      Anticipo massimo: {max_down} euro

      Uso: {usage_label}

      {?notes}Note: {notes}{/notes}

      Data di oggi: {date}. Confronta le offerte e scrivi la classifica in italiano.'
    output: markdown
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.5
  - key: alerter
    role: helper
    description: Controlla ogni giorno se esce un'offerta sotto la soglia di canone per la categoria scelta.
    writesTo:
      collection: alert_hits
    profile:
      inline:
        display_name: Avviso prezzo noleggio
        crews:
        - id: alerter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Controlli per una persona se esistono offerte di noleggio a lungo termine con canone mensile sotto
            la soglia indicata per la categoria indicata. Usa SOLO lo strumento search_offers; non inventare offerte né cifre.
            Ignora le offerte scadute (valid_until passata). Se ne trovi, scrivi "# Offerta sotto soglia: <categoria>" poi
            una tabella (operatore, modello, canone, anticipo, durata, km/anno, servizi inclusi, link) e due righe su quale
            è la più interessante. Se non ne trovi, scrivi "# Nessuna offerta sotto soglia" e una riga. In italiano, breve.'
    appTools:
    - name: search_offers
      description: Cerca le offerte di noleggio a lungo termine autorizzate (feed degli operatori)
      action: search
      collection: offers
      scope: all
    goalTemplate: Cerca offerte della categoria {category} con canone mensile sotto {max_fee} euro. Oggi è {date}.
    output: markdown
  inputForm:
    title:
      it: Nuova ricerca
    fields:
    - name: category
      type: select
      required: true
      label:
        it: Categoria
      options:
      - value: city_car
        label:
          it: Citycar
      - value: compact
        label:
          it: Compatta
      - value: sedan
        label:
          it: Berlina
      - value: suv
        label: SUV
      - value: station_wagon
        label:
          it: Station wagon
      - value: van
        label:
          it: Monovolume / Van
    - name: fuel
      type: select
      required: true
      label:
        it: Alimentazione
      options:
      - value: petrol
        label:
          it: Benzina
      - value: diesel
        label: Diesel
      - value: hybrid
        label:
          it: Ibrida
      - value: phev
        label: Plug-in
      - value: electric
        label:
          it: Elettrica
      - value: any
        label:
          it: Indifferente
    - name: gearbox
      type: select
      required: true
      label:
        it: Cambio
      options:
      - value: manual
        label:
          it: Manuale
      - value: automatic
        label:
          it: Automatico
      - value: any
        label:
          it: Indifferente
    - name: km_year
      type: number
      required: true
      label:
        it: Chilometri all'anno
      help:
        it: es. 15000
    - name: months
      type: select
      required: true
      label:
        it: Durata del contratto
      options:
      - value: '24'
        label:
          it: 24 mesi
      - value: '36'
        label:
          it: 36 mesi
      - value: '48'
        label:
          it: 48 mesi
      - value: '60'
        label:
          it: 60 mesi
    - name: max_down
      type: number
      required: true
      label:
        it: Anticipo massimo (euro)
      help:
        it: 0 se non vuoi anticipo
    - name: usage
      type: select
      required: true
      label:
        it: Uso
      options:
      - value: private
        label:
          it: Privato
      - value: vat
        label:
          it: Partita IVA
    - name: notes
      type: textarea
      maxLength: 400
      label:
        it: Note (facoltative)
  data:
    collections:
    - name: offers
      ownedBy: shared
      description: Offerte di noleggio a lungo termine ricevute dai feed autorizzati degli operatori
      fields:
      - name: offer_id
        type: text
        required: true
        label:
          it: ID offerta
      - name: operator
        type: text
        required: true
        label:
          it: Operatore
      - name: model
        type: text
        required: true
        label:
          it: Modello
      - name: category
        type: text
        label:
          it: Categoria
      - name: fuel
        type: text
        label:
          it: Alimentazione
      - name: gearbox
        type: text
        label:
          it: Cambio
      - name: monthly_fee
        type: number
        required: true
        label:
          it: Canone mensile
      - name: down_payment
        type: number
        label:
          it: Anticipo
      - name: months
        type: number
        label:
          it: Durata (mesi)
      - name: km_year
        type: number
        label:
          it: Km/anno
      - name: usage
        type: text
        label:
          it: Uso (private, vat, both)
      - name: maintenance
        type: boolean
        label:
          it: Manutenzione inclusa
      - name: insurance
        type: boolean
        label:
          it: Assicurazione inclusa
      - name: tires
        type: boolean
        label:
          it: Pneumatici inclusi
      - name: valid_until
        type: date
        label:
          it: Valida fino al
      - name: url
        type: url
        label: Link
    - name: leads
      ownedBy: org
      description: Richieste di contatto da passare agli operatori
      retentionDays: 365
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome e cognome
      - name: email
        type: email
        required: true
        label: Email
      - name: phone
        type: text
        label:
          it: Telefono
      - name: offer_ref
        type: text
        label:
          it: Offerta o operatore di interesse
      - name: usage
        type: select
        label:
          it: Uso
        options:
        - value: private
          label:
            it: Privato
        - value: vat
          label:
            it: Partita IVA
      - name: message
        type: textarea
        maxLength: 800
        label:
          it: Messaggio
      - name: consent
        type: boolean
        required: true
        label:
          it: Acconsento a essere contattato dall'operatore
      - name: status
        type: select
        label:
          it: Stato
        default: new
        options:
        - value: new
          label:
            it: Nuova
        - value: sent
          label:
            it: Inviata all'operatore
        - value: qualified
          label:
            it: Qualificata
        - value: rejected
          label:
            it: Scartata
    - name: alert_hits
      ownedBy: instance
      description: Risultati di ogni avviso di prezzo
      retentionDays: 180
  views:
  - key: home
    type: page
    nav: false
    title: NoleggioConfronto
    sections:
    - type: hero
      layout: stack
      band: true
      eyebrow:
        it: Noleggio a lungo termine
      title:
        it: Trova il noleggio che conviene **davvero** al tuo profilo.
      text:
        it: Dici che auto cerchi, quanti chilometri fai e se ti serve per uso privato o partita IVA. Un agente AI confronta
          le offerte e ti dà una classifica con canone, servizi inclusi, anticipo e costo totale. Gratis.
      actions:
      - label:
          it: Confronta le offerte
        href: /v/new_search
        style: primary
      - label:
          it: Sono interessato a un'offerta
        href: /v/contact
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
      items:
      - title:
          it: Compili il modulo
        text:
          it: Categoria, alimentazione, cambio, km all'anno, durata, anticipo massimo e uso.
        badge: '1'
      - title:
          it: Ricevi la classifica
        text:
          it: Canone mensile, manutenzione, assicurazione, pneumatici, anticipo e costo totale, con la spiegazione di quale
            conviene.
        badge: '2'
      - title:
          it: Salvi e ti fai avvisare
        text:
          it: Le tue ricerche restano nel tuo archivio. Imposta un avviso e ricevi un'email quando esce un'offerta sotto la
            tua soglia.
        badge: '3'
      - title:
          it: Lasci un contatto
        text:
          it: Se un'offerta ti interessa, la tua richiesta passa all'operatore.
        badge: '4'
    - type: cards
      id: fonti
      title:
        it: Da dove vengono le offerte
      intro:
        it: Solo feed e accordi con operatori e concessionari che ne autorizzano l'uso. Non copiamo dati da siti che lo vietano.
      items:
      - title:
          it: Feed autorizzati
        text:
          it: Gli operatori ci inviano le loro offerte e ne autorizzano l'uso nel comparatore.
          badge: ✅
      - title:
          it: Trasparenza
        text:
          it: Ogni risultato indica operatore, durata, km e servizi inclusi. Controlla sempre le condizioni di contratto.
      - title:
          it: Gratis per te
        text:
          it: 'Il servizio non costa nulla: ci finanziamo con una commissione sui contatti qualificati agli operatori.'
    - type: note
      content:
        it: 'NoleggioConfronto è uno strumento di supporto alla scelta, non consulenza finanziaria, fiscale o assicurativa.
          Le offerte possono cambiare o scadere: verifica sempre le condizioni con l''operatore.'
  - key: new_search
    type: new_run
    title:
      it: Nuova ricerca
    roles:
    - user
    - admin
  - key: searches
    type: history
    title:
      it: Le mie ricerche
    source: run
    columns:
    - createdAt
    - category
    - fuel
    - months
    - max_down
    - usage
    - status
    roles:
    - user
    - admin
  - key: search_report
    type: report
    title:
      it: Classifica
    source: run
    printable: true
    nav: false
  - key: offers_list
    type: table
    title:
      it: Offerte disponibili
    source: collection:offers
    data:
      display: table
      fields:
      - key: operator
        label:
          it: Operatore
      - key: model
        label:
          it: Modello
      - key: monthly_fee
        label:
          it: Canone
        format: money
      - key: down_payment
        label:
          it: Anticipo
        format: money
      - key: months
        label:
          it: Mesi
        format: number
      - key: km_year
        label:
          it: Km/anno
        format: number
      - key: valid_until
        label:
          it: Valida fino al
        format: date
      sort:
        field: monthly_fee
        dir: asc
      limit: 100
    roles:
    - user
    - admin
  - key: alerts
    type: instances
    template: price_alert
    title:
      it: I miei avvisi
    roles:
    - user
    - admin
  - key: contact
    type: form
    title:
      it: Sono interessato
    collection: leads
    fields:
    - name
    - email
    - phone
    - offer_ref
    - usage
    - message
    - consent
    submit:
      label:
        it: Invia richiesta
      message:
        it: Grazie! Abbiamo passato la tua richiesta all'operatore, che ti ricontatterà.
    edit: false
  - key: leads_admin
    type: table
    title:
      it: Richieste ricevute
    source: collection:leads
    export: true
    roles:
    - admin
  templates:
  - key: price_alert
    title:
      it: Avviso di prezzo
    description:
      it: Ricevi un'email quando esce un'offerta sotto il canone che indichi per la categoria scelta.
    agent: alerter
    params:
    - name: category
      type: select
      required: true
      label:
        it: Categoria
      options:
      - value: city_car
        label:
          it: Citycar
      - value: compact
        label:
          it: Compatta
      - value: sedan
        label:
          it: Berlina
      - value: suv
        label: SUV
      - value: station_wagon
        label:
          it: Station wagon
      - value: van
        label:
          it: Monovolume / Van
    - name: max_fee
      type: number
      required: true
      default: 300
      label:
        it: Canone mensile massimo (euro)
    goal: 'Avviso "{instance}": cerca offerte della categoria {category} con canone mensile sotto {max_fee} euro. Oggi è {date}.
      Scrivi in italiano.'
    schedule:
      cron: 0 7 * * *
      userCanChange: false
    maxPerUser: 5
    deliver:
      to: owner
      subject:
        it: 'NoleggioConfronto: {title}'
      onlyIfNew: true
  triggers:
  - key: offer_feed
    description: Gli operatori autorizzati inviano le loro offerte (una per chiamata)
    'on':
      webhook: true
    write:
      collection: offers
      keyBy: offer_id
  - key: new_lead
    'on':
      collection: leads
      op: insert
    notify:
      to:
      - admins
      - role:operator
      subject:
        it: 'Nuova richiesta di contatto: {record.name}'
      body:
        it: 'Nuova richiesta di contatto.

          Nome: {record.name}

          Email: {record.email}

          Telefono: {record.phone}

          Offerta di interesse: {record.offer_ref}

          Messaggio: {record.message}'
      link: leads_admin
  notifications:
    emailOnRunDone: false
  billing:
    modes:
    - free
  extensions:
  - key: lead_commission
    description: La commissione sui contatti qualificati agli operatori si fattura fuori dall'app (accordo con ciascun operatore);
      in app si segue solo lo stato della richiesta (nuova, inviata, qualificata, scartata).
  - key: feed_terms_check
    description: Prima di attivare un feed o un accordo con un operatore, verificare e archiviare i termini d'uso che ne autorizzano
      l'uso nel comparatore; nessuna copia di dati da siti che lo vietano.
