apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: venditoregiusto
  displayName: VenditoreGiusto
  tagline:
    it: Trova il commerciale giusto, con punteggi motivati e decisione sempre tua.
  description:
    it: 'Crei la posizione, carichi i CV e un team di agenti AI estrae esperienze e risultati di vendita, assegna un punteggio
      di aderenza motivato e prepara le domande di approfondimento. Tu vedi la classifica e decidi chi invitare al colloquio:
      nessun candidato viene scartato senza la tua conferma.'
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12304a'
      accent: '#d9622b'
      background: '#f7f8fa'
      foreground: '#1a2230'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Venditore
      color: primary
    - text: Giusto
      color: accent
  header:
    links:
    - label: Come funziona
      href: '#come-funziona'
    - label: Privacy
      href: '#privacy'
    cta:
      label: Accedi
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      label: Azienda
      assignedBy: signup
  limits:
  - action: agent:screener
    per: user
    max: 20
    window: day
    roles:
    - user
  agents:
  - key: screener
    role: main
    description: Team che legge i CV, li valuta, prepara le domande di approfondimento e aggiorna il punteggio con le risposte.
    profile:
      inline:
        display_name: VenditoreGiusto screener
        crews:
        - id: extractor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un analista HR specializzato in ruoli commerciali. Per ogni CV ricevuto (testo incollato) estrai:
            nome, anni di esperienza in vendita, settori, tipo di vendita (B2B/B2C, field/inside), ruoli, e soprattutto risultati
            di vendita misurabili (fatturato, quota raggiunta, clienti acquisiti) con l''azienda e il periodo. Riporta solo
            ciò che è scritto nel CV: non inventare mai cifre. Segnala le informazioni mancanti. Non usare mai età, genere,
            nazionalità, foto o stato familiare.'
        - id: scorer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Confronti ogni candidato con la posizione (ruolo, settore, zona, esperienza, competenze, retribuzione,
            risposte di screening). Assegni un punteggio di aderenza da 0 a 100 con motivazione in 2-4 punti verificabili
            sul CV, punti di forza e dubbi. Usa solo criteri legati al lavoro. Non scartare né proporre di scartare nessuno:
            il punteggio è un supporto, la decisione è del recruiter. Per i migliori candidati (punteggio >= 70) scrivi 3-5
            domande di approfondimento mirate. Se ricevi le risposte del candidato, rileggile e aggiorna punteggio e motivazione
            indicando cosa è cambiato.'
        - id: reporter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 4
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Scrivi in italiano la classifica finale. Inizia con un titolo di livello 1 "# Classifica — <ruolo>
            — <data>". Poi una tabella ordinata per punteggio (posizione, candidato, punteggio, riassunto in una riga), e
            per ogni candidato una scheda con: sintesi, esperienze e risultati di vendita, motivazione del punteggio, dubbi,
            bozza dell''email di approfondimento con le domande (per i punteggi >= 70). Aggiungi un blocco ```chart``` bar
            con i punteggi. Chiudi con la nota: "Il punteggio è un supporto: nessun candidato è scartato senza la tua conferma."
            Mai inventare dati.'
        orchestration:
          type: dag
          entry: extractor
          nodes:
          - id: extractor
            crew: extractor
          - id: scorer
            crew: scorer
          - id: reporter
            crew: reporter
          edges:
          - from: extractor
            to: scorer
          - from: scorer
            to: reporter
    goalTemplate: 'Posizione: {position}

      Settore: {sector}

      Zona: {area}

      Esperienza richiesta: {experience}

      Competenze: {skills}

      Retribuzione: {salary}

      {?screening}Domande di screening: {screening}{/screening}


      CV dei candidati (testo incollato, separati da ---):

      {cvs}


      {?answers}Risposte di approfondimento ricevute (aggiorna i punteggi):

      {answers}{/answers}

      Data: {date}. Scrivi in italiano.'
    output: markdown
    limits:
      maxTurns: 30
      maxBudgetUsd: 1.5
    appTools:
    - name: save_candidates
      description: Salva candidati, punteggi e riassunti dell'azienda
      action: write
      collection: candidates
      scope: user
    - name: read_candidates
      description: Legge i candidati dell'azienda
      action: read
      collection: candidates
      scope: user
    awaits:
    - invite_candidates
  inputForm:
    title: Nuova valutazione
    fields:
    - name: position
      type: text
      required: true
      label: Ruolo
      help: es. Account manager B2B
    - name: sector
      type: text
      required: true
      label: Settore
    - name: area
      type: text
      required: true
      label: Zona
    - name: experience
      type: select
      required: true
      label: Esperienza richiesta
      options:
      - value: 0-2 anni
        label: 0-2 anni
      - value: 3-5 anni
        label: 3-5 anni
      - value: 6-10 anni
        label: 6-10 anni
      - value: oltre 10 anni
        label: Oltre 10 anni
    - name: skills
      type: textarea
      required: true
      maxLength: 600
      label: Competenze
    - name: salary
      type: text
      label: Fascia di retribuzione
      help: es. 35-45k RAL + variabile
    - name: screening
      type: textarea
      maxLength: 800
      label: Domande di screening
    - name: cvs
      type: textarea
      required: true
      label: CV dei candidati (testo incollato, separati da ---)
      help: 'Il caricamento dei PDF non è ancora disponibile: incolla il testo dei CV.'
    - name: answers
      type: textarea
      label: Risposte di approfondimento (facoltative)
  approvals:
  - key: invite_candidates
    title: Candidati da invitare al colloquio
    description: Conferma chi invitare. Nessun candidato è scartato senza la tua decisione.
    decidedBy: requester
    fields:
    - candidato
    - punteggio
    - riassunto
  data:
    collections:
    - name: candidates
      ownedBy: user
      description: Candidati dell'azienda con punteggio motivato (da cancellare dopo sei mesi)
      fields:
      - name: name
        type: text
      - name: position
        type: text
      - name: score
        type: number
      - name: summary
        type: textarea
      - name: motivation
        type: textarea
      - name: status
        type: select
        options:
        - nuovo
        - approfondimento
        - da invitare
        - invitato
  views:
  - key: home
    type: page
    nav: false
    title: VenditoreGiusto
    sections:
    - type: hero
      title: Trova il **venditore giusto**, non solo il più veloce a candidarsi.
      text: 'Descrivi la posizione, carica i CV: un team di agenti AI estrae i risultati di vendita, li valuta con punteggi
        motivati e prepara le domande di approfondimento. Tu decidi chi incontrare.'
      actions:
      - label: Inizia
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title: Come funziona
      items:
      - title: Crea la posizione
        text: Ruolo, settore, zona, esperienza, competenze, retribuzione e domande di screening.
      - title: Gli agenti leggono i CV
        text: Esperienze, risultati di vendita e punteggio di aderenza motivato.
      - title: Approfondisci
        text: Domande mirate per i migliori; le risposte aggiornano il punteggio.
      - title: Decidi tu
        text: 'Classifica con riassunti: scegli chi invitare al colloquio.'
    - type: text
      id: privacy
      title: Trattamento dei dati
      content: 'I dati dei candidati sono trattati solo per la selezione, visibili solo all''azienda che ha aperto la posizione
        e cancellati dopo sei mesi. Il punteggio è un supporto automatizzato: nessun candidato è scartato senza la conferma
        di una persona. I candidati hanno diritto di accesso, rettifica e cancellazione.'
  - key: new
    type: new_run
    title: Nuova valutazione
    roles:
    - user
    - admin
  - key: runs
    type: history
    title: Le mie classifiche
    source: run
    roles:
    - user
    - admin
  - key: ranking
    type: report
    source: run
    printable: true
    nav: false
  - key: cands
    type: table
    title: Candidati
    source: collection:candidates
    data:
      display: table
      fields:
      - key: name
        label: Candidato
      - key: position
        label: Posizione
      - key: score
        label: Punteggio
        format: number
      - key: summary
        label: Riassunto
      - key: status
        label: Stato
        format: badge
      sort:
        field: score
        dir: desc
      limit: 100
    roles:
    - user
    - admin
  - key: invites
    type: approvals
    title: Inviti ai colloqui
    approvals:
    - invite_candidates
    roles:
    - user
    - admin
  - key: account
    type: account
    title: Piano e crediti
    roles:
    - user
  billing:
    modes:
    - credits
    - subscription
    currency: eur
    signupCredits: 50
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:screener:
        estimate: 10
        metered: true
    packs:
    - key: posizione
      credits: 1500
      price: 49
      label: Una posizione aperta
    plans:
    - key: mensile
      price: 149
      interval: month
      label: Abbonamento mensile
      credits: 6000
      creditsReset: monthly
  extensions:
  - key: public_application
    description: 'Pagina pubblica di candidatura con caricamento del CV in PDF e risposte allo screening: non disponibile
      (niente file, e i visitatori anonimi non possono scrivere nei dati di un''azienda). Per ora il recruiter incolla il
      testo dei CV.'
  - key: candidate_emails
    description: 'Invio automatico delle email di approfondimento e lettura delle risposte: non disponibile. L''agente prepara
      la bozza con le domande; il recruiter la invia e incolla le risposte per aggiornare il punteggio.'
  - key: retention_6_months
    description: 'Cancellazione automatica dei dati dei candidati dopo sei mesi: da configurare come regola di conservazione
      sulla collezione candidates.'
  - key: position_entity
    description: Le posizioni sono parametri della valutazione; una collezione dedicata con candidature per posizione è un'evoluzione
      successiva.
