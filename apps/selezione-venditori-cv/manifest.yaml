apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: venditoregiusto
  displayName: VenditoreGiusto
  tagline:
    it: Trova il commerciale giusto, con punteggi motivati e decisione sempre tua.
  description:
    it: 'Per le aziende che assumono commerciali: gli agenti AI leggono i CV, estraggono esperienze e risultati di vendita,
      assegnano un punteggio di aderenza motivato e preparano le domande di approfondimento. Il recruiter decide chi invitare;
      nessun candidato viene scartato in automatico.'
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: pipeline
  branding:
    theme: light
    palette:
      primary: '#1f3a5f'
      accent: '#d9622b'
      background: '#f7f8fa'
      foreground: '#1a2230'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Venditore
      color: primary
    - text: Giusto
      color: accent
  header:
    links:
    - label: Come funziona
      href: '#come-funziona'
    - label: Privacy
      href: /v/privacy
    cta:
      label: Accedi
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
      - privacy
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  limits:
  - action: create:positions
    max: 1
    window: total
    plans:
      pro: -1
      posizione: 3
  agents:
  - key: screener
    role: main
    description: Legge i CV caricati, estrae esperienze e risultati di vendita e assegna un punteggio motivato.
    profile:
      inline:
        display_name: VenditoreGiusto screener
        crews:
        - id: screener
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un analista HR specializzato nella selezione di profili commerciali. Per ogni file CV ricevuto:
            1) leggi la posizione con read_positions; 2) apri il CV con read_upload (usa l''id del file); 3) estrai nome,
            email, esperienze (azienda, ruolo, durata, settore), risultati di vendita quantificati (fatturato, quota, crescita,
            clienti) e competenze; 4) assegna un punteggio di aderenza da 0 a 100 rispetto a ruolo, settore, zona, esperienza,
            competenze e fascia retributiva della posizione, con motivazione di 3-5 righe che cita fatti del CV; 5) salva
            con save_candidate (status "screened"; summary = riassunto di 4 righe; experience; sales_results; score; score_rationale;
            email se presente). Non inventare mai dati o cifre: se mancano scrivi ''non indicato''. Non usare età, sesso,
            nazionalità o altre caratteristiche protette. Non scartare nessuno: il punteggio è solo un supporto, la decisione
            spetta al recruiter. Chiudi con un report che inizia con ''# Screening CV — <posizione>'' e una tabella nome/punteggio.'
          mcp_servers: []
    goalTemplate: 'Posizione (id): {record.position}

      File CV (id): {record.cv}

      Leggi ogni CV, valutalo e salva un candidato per ciascun file. Data: {date}. Scrivi in italiano.'
    appTools:
    - name: read_positions
      description: Leggi le posizioni aperte dell'azienda
      action: read
      collection: positions
      scope: user
    - name: read_upload
      description: Leggi un CV caricato (PDF, anche scansionato)
      action: read_file
    - name: save_candidate
      description: Salva un candidato valutato
      action: append
      collection: candidates
      scope: user
    output: markdown
    limits:
      maxTurns: 30
      maxBudgetUsd: 1.5
  - key: question_writer
    role: helper
    description: Prepara domande di approfondimento per i candidati migliori (bozza, da approvare).
    profile:
      inline:
        display_name: VenditoreGiusto domande
        crews:
        - id: question_writer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Ricevi un candidato già valutato. Se il punteggio è inferiore a 70 non fare nulla e rispondi ''Nessuna
            domanda: punteggio sotto soglia'' (il candidato resta in classifica, non viene scartato). Altrimenti leggi la
            posizione con read_positions e scrivi un''email cordiale in italiano con 4-5 domande di approfondimento mirate
            (risultati di vendita da verificare, motivazioni, disponibilità, aspettative retributive, più le domande di screening
            della posizione se utili). Salva il testo con update_candidate nel campo followup_questions e imposta status "questions_ready"
            (il recruiter deve approvare l''invio). Non promettere assunzioni o colloqui. Chiudi con ''# Domande per <nome>''.'
          mcp_servers: []
    goalTemplate: 'Candidato id {record.id}: {record.name}, posizione {record.position}, punteggio {record.score}.

      Riassunto: {record.summary}

      Motivazione: {record.score_rationale}

      Scrivi la bozza delle domande se il punteggio è almeno 70.'
    appTools:
    - name: read_positions
      description: Leggi le posizioni aperte dell'azienda
      action: read
      collection: positions
      scope: user
    - name: update_candidate
      description: Aggiorna un candidato
      action: write
      collection: candidates
      scope: user
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.3
  - key: rescorer
    role: helper
    description: Legge le risposte del candidato e aggiorna il punteggio.
    profile:
      inline:
        display_name: VenditoreGiusto rivalutazione
        crews:
        - id: rescorer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Ricevi un candidato, le domande inviate e la sua risposta. Rileggi la posizione con read_positions,
            valuta la risposta e aggiorna con update_candidate: score (0-100, ricalcolato), score_rationale (motivazione che
            spiega cosa è cambiato e perché), summary aggiornato, status "rescored". Non inventare dati, non usare caratteristiche
            protette, non scartare nessuno: la decisione finale spetta al recruiter. Chiudi con ''# Rivalutazione <nome>''
            e il nuovo punteggio.'
          mcp_servers: []
    goalTemplate: 'Candidato id {record.id}: {record.name}, posizione {record.position}, punteggio attuale {record.score}.

      Domande inviate:

      {record.followup_questions}

      Risposta del candidato:

      {record.reply_text}

      Rivaluta e aggiorna il punteggio.'
    appTools:
    - name: read_positions
      description: Leggi le posizioni aperte dell'azienda
      action: read
      collection: positions
      scope: user
    - name: update_candidate
      description: Aggiorna un candidato
      action: write
      collection: candidates
      scope: user
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.3
  data:
    collections:
    - name: positions
      ownedBy: user
      description: Posizioni aperte dell'azienda
      retentionDays: 180
      fields:
      - name: title
        type: text
        required: true
        label: Ruolo
      - name: sector
        type: text
        required: true
        label: Settore
      - name: area
        type: text
        required: true
        label: Zona
      - name: experience_years
        type: number
        label: Anni di esperienza richiesti
      - name: skills
        type: textarea
        label: Competenze richieste
      - name: salary_range
        type: text
        label: Fascia di retribuzione
      - name: screening_questions
        type: textarea
        label: Domande di screening
    - name: uploads
      ownedBy: user
      description: Caricamenti in blocco di CV
      retentionDays: 180
      fields:
      - name: position
        type: select
        required: true
        label: Posizione
        optionsFrom: collection:positions
      - name: cv
        type: file
        required: true
        label: CV (PDF)
        accept:
        - pdf
        - docx
        maxMb: 10
        multiple: true
    - name: candidates
      ownedBy: user
      description: Candidati valutati, visibili solo all'azienda che li ha caricati
      retentionDays: 180
      fields:
      - name: name
        type: text
        label: Nome
      - name: email
        type: email
        label: Email
      - name: position
        type: text
        label: Posizione
      - name: summary
        type: textarea
        label: Riassunto
      - name: experience
        type: textarea
        label: Esperienze
      - name: sales_results
        type: textarea
        label: Risultati di vendita
      - name: score
        type: number
        label: Punteggio
      - name: score_rationale
        type: textarea
        label: Motivazione del punteggio
      - name: followup_questions
        type: textarea
        label: Domande di approfondimento
      - name: reply_text
        type: textarea
        label: Risposta del candidato (incolla)
      - name: recruiter_note
        type: textarea
        label: Note del recruiter
      - name: status
        type: select
        label: Stato
        default: screened
        options:
        - value: screened
          label: Valutato
        - value: questions_ready
          label: Domande pronte
        - value: approved_send
          label: Invia domande
        - value: sent
          label: Domande inviate
        - value: replied
          label: Risposta ricevuta
        - value: rescored
          label: Rivalutato
        - value: invite
          label: Invitato al colloquio
        - value: declined
          label: Non proseguire (deciso dal recruiter)
  views:
  - key: home
    type: page
    nav: false
    sections:
    - type: hero
      layout: stack
      band: true
      title: Trova il **venditore giusto**, non solo il CV più bello.
      text: Gli agenti AI leggono i CV, estraggono esperienze e risultati di vendita e danno a ogni candidato un punteggio
        motivato. Tu decidi chi invitare.
      actions:
      - label: Inizia
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title: Come funziona
      items:
      - title: Crea la posizione
        text: Ruolo, settore, zona, esperienza, competenze, retribuzione e domande di screening.
      - title: Carica i CV
        text: 'Carica in blocco i CV già ricevuti: ogni file viene letto e valutato.'
      - title: Classifica motivata
        text: Riassunto, risultati di vendita e punteggio di aderenza con spiegazione.
      - title: Approfondisci e decidi
        text: Approvi le domande di approfondimento, le risposte aggiornano il punteggio, tu scegli chi invitare.
    - type: cards
      title: Le nostre garanzie
      items:
      - title: Nessuno scartato in automatico
        text: Ogni esclusione richiede la tua conferma.
      - title: Solo i tuoi candidati
        text: Ogni azienda vede esclusivamente i propri dati.
      - title: Dati cancellati dopo 6 mesi
        text: I candidati sono informati sul trattamento dei dati.
    - type: note
      content: 'Supporto alle decisioni: il punteggio non sostituisce la valutazione umana. [Informativa privacy](/v/privacy)'
  - key: privacy
    type: page
    title: Privacy
    nav: false
    sections:
    - type: text
      title: Trattamento dei dati dei candidati
      content: 'I dati dei CV sono trattati dall''azienda che ha aperto la posizione (titolare) per valutare l''idoneità alla
        selezione, con l''ausilio di sistemi di intelligenza artificiale a supporto, mai come decisione automatica: ogni scelta
        finale è presa da una persona. I dati sono conservati per 6 mesi e poi cancellati. Puoi chiedere accesso, rettifica
        o cancellazione all''azienda.'
  - key: new_position
    type: form
    title: Nuova posizione
    collection: positions
    submit:
      label: Salva posizione
      message: Posizione creata.
      redirect: upload_cv
    roles:
    - user
    - admin
  - key: positions_list
    type: table
    title: Le mie posizioni
    source: collection:positions
    columns:
    - title
    - sector
    - area
    - experience_years
    - salary_range
    roles:
    - user
    - admin
  - key: upload_cv
    type: form
    title: Carica CV
    collection: uploads
    submit:
      label: Avvia la valutazione
      message: 'CV caricati: la valutazione è in corso, trovi i risultati in classifica.'
      redirect: ranking
    roles:
    - user
    - admin
  - key: ranking
    type: table
    title: Classifica candidati
    source: collection:candidates
    columns:
    - name
    - position
    - score
    - status
    - summary
    - score_rationale
    export: true
    roles:
    - user
    - admin
  - key: candidate
    type: form
    title: Scheda candidato
    collection: candidates
    fields:
    - status
    - followup_questions
    - reply_text
    - recruiter_note
    edit: true
    submit:
      label: Aggiorna
      message: Aggiornato.
      redirect: ranking
    nav: false
    roles:
    - user
    - admin
  - key: account
    type: account
    title: Crediti e abbonamento
    roles:
    - user
  triggers:
  - key: screen_uploads
    'on':
      collection: uploads
      op: insert
    start:
      agent: screener
    goal: 'Posizione (id): {record.position}

      File CV (id): {record.cv}

      Leggi ogni CV, valutalo e salva un candidato per ciascun file.'
  - key: write_questions
    'on':
      collection: candidates
      op: insert
      where:
        status: screened
    start:
      agent: question_writer
    goal: 'Candidato id {record.id}: {record.name}, posizione {record.position}, punteggio {record.score}.

      Riassunto: {record.summary}

      Motivazione: {record.score_rationale}'
  - key: privacy_notice
    'on':
      collection: candidates
      op: insert
    notify:
      to: record.email
      subject: Informativa sul trattamento dei tuoi dati
      body: 'Gentile {record.name}, il tuo CV è stato ricevuto per la selezione per la posizione {record.position}. I tuoi
        dati sono trattati dall''azienda che seleziona, con strumenti di intelligenza artificiale a supporto e senza decisioni
        automatiche: ogni scelta è presa da una persona. Saranno conservati per 6 mesi e poi cancellati. Puoi chiedere accesso,
        rettifica o cancellazione rispondendo a questa email.'
  - key: send_questions
    'on':
      collection: candidates
      op: update
      where:
        status: approved_send
    notify:
      to: record.email
      subject: Alcune domande sulla tua candidatura
      body: 'Gentile {record.name},


        grazie per la candidatura per {record.position}. Per conoscerti meglio ti chiediamo di rispondere a queste domande:


        {record.followup_questions}


        Cordiali saluti'
  - key: rescore_reply
    'on':
      collection: candidates
      op: update
      where:
        status: replied
    start:
      agent: rescorer
    goal: 'Candidato id {record.id}: {record.name}, posizione {record.position}, punteggio attuale {record.score}.

      Domande inviate:

      {record.followup_questions}

      Risposta:

      {record.reply_text}'
  notifications:
    emailOnRunDone: false
  billing:
    modes:
    - credits
    - subscription
    currency: eur
    signupCredits: 50
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:screener:
        estimate: 20
        metered: true
      agent:question_writer:
        estimate: 5
        metered: true
      agent:rescorer:
        estimate: 5
        metered: true
    packs:
    - key: posizione
      credits: 3000
      price: 49
      label: Posizione aperta (fino a ~150 CV)
    plans:
    - key: pro
      price: 149
      interval: month
      label: Abbonamento mensile
      credits: 15000
      creditsReset: monthly
      includes:
      - posizioni illimitate
      - 15000 crediti al mese
  extensions:
  - key: public_apply_page
    description: 'Pagina pubblica di candidatura (CV PDF + domande di screening) che salva il candidato direttamente nei dati
      dell''azienda che ha aperto la posizione: oggi un visitatore anonimo può scrivere solo in una casella dell''owner dell''app,
      non nei dati di una singola azienda. Per ora i CV ricevuti si caricano in blocco dal recruiter.'
  - key: inbound_email_replies
    description: 'Lettura automatica delle risposte email dei candidati: per ora il recruiter incolla la risposta nella scheda
      candidato e l''agente aggiorna il punteggio.'
