apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: studiofisco-assist
  displayName: StudioFisco Assist
  tagline:
    it: L'assistente fiscale che cita sempre la fonte.
    en: The tax assistant that always cites its source.
  description:
    it: Chat per commercialisti e consulenti del lavoro su IVA, regime forfettario, scadenze e crediti d'imposta, basata su
      circolari, risoluzioni e interpelli dell'Agenzia delle Entrate e sui testi di legge di Normattiva, aggiornata ogni notte.
    en: A chat for accountants and labour consultants on VAT, flat-rate regime, deadlines and tax credits, built on Agenzia
      delle Entrate circulars, resolutions and rulings and on Normattiva legislation, refreshed every night.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#1f3a5f'
      accent: '#2a7f6f'
      background: '#f7f8fa'
      foreground: '#1b2430'
    fonts:
      body: Inter
      display: Source Serif 4
    wordmark:
    - text: StudioFisco
      color: primary
    - text: ' Assist'
      color: accent
    button: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Fonti
        en: Sources
      href: '#fonti'
    - label:
        it: Prezzi
        en: Pricing
      href: '#prezzi'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label:
        it: Admin dello studio
        en: Firm admin
      assignedBy: admin_emails
    - key: professional
      label:
        it: Professionista
        en: Professional
      assignedBy: invite
  limits:
  - action: chat
    per: user
    max: 200
    window: day
    roles:
    - professional
  - action: login
    per: ip
    max: 20
    window: hour
  agents:
  - key: assistant
    role: main
    description: Risponde a domande fiscali cercando nella base di conoscenza e citando sempre fonte, link e data.
    profile:
      inline:
        display_name: StudioFisco Assist
        chat_mode: true
        crews:
        - id: assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei StudioFisco Assist, assistente per commercialisti e consulenti del lavoro italiani. Rispondi
            in italiano, in modo tecnico e conciso, su IVA, regimi forfettari, scadenze, crediti d''imposta e materie correlate.


            METODO

            1. Per ogni domanda usa SEMPRE lo strumento kb_search (anche più volte, con termini diversi) sulla base di conoscenza
            composta da circolari, risoluzioni e risposte a interpello dell''Agenzia delle Entrate e da testi di legge di
            Normattiva. Usa kb_read per leggere un documento completo.

            2. Rispondi solo con ciò che trovi nei documenti. Ogni affermazione normativa deve avere la fonte: tipo e numero
            del documento, data, link (url del record). Chiudi con una sezione ''## Fonti'' con elenco puntato: titolo, data
            di pubblicazione, link.

            3. Se un documento ha un campo modified_at recente (ultimi 90 giorni) o amended_note, segnala in evidenza: ''⚠️
            Norma modificata di recente'' con data e natura della modifica.

            4. Se non trovi fonti pertinenti, se le fonti sono in conflitto o se non sei sicuro, dillo chiaramente e suggerisci
            di verificare sul testo originale (Normattiva o sito dell''Agenzia delle Entrate). Non inventare MAI articoli,
            numeri di circolare, importi, aliquote, scadenze o date.

            5. Distingui sempre fatto normativo, prassi dell''Agenzia e tua interpretazione. Le tue risposte sono un supporto
            al professionista, non un parere.

            6. Se l''utente chiede di salvare una risposta, usa folders_read per vedere le cartelle cliente, create_folder
            se serve una nuova cartella, poi save_answer con cartella, domanda, risposta e fonti. Non salvare nulla senza
            richiesta esplicita.

            7. Non chiedere né conservare dati personali dei clienti dello studio oltre a quanto serve per nominare la cartella.


            Formato: risposta diretta in alto, poi dettaglio, poi ''## Fonti''. Per la prima risposta di una conversazione
            non serve un titolo; per un documento da esportare usa un titolo ''# '' di livello 1.'
    goalTemplate: 'Conversazione finora:

      {history}


      Nuova domanda del professionista: {message}

      Data di oggi: {date}. Rispondi in italiano.'
    appTools:
    - name: kb_search
      description: Cerca nella base di conoscenza (circolari, risoluzioni, interpelli, leggi) per parole chiave
      action: search
      collection: kb_documents
      scope: all
    - name: kb_read
      description: Legge un documento della base di conoscenza
      action: read
      collection: kb_documents
      scope: all
    - name: folders_read
      description: Elenca le cartelle cliente dell'utente
      action: read
      collection: client_folders
      scope: user
    - name: create_folder
      description: Crea una cartella cliente per l'utente
      action: write
      collection: client_folders
      scope: user
    - name: save_answer
      description: Salva una risposta in una cartella cliente dell'utente
      action: write
      collection: saved_answers
      scope: user
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.4
  - key: indexer
    role: scheduled
    description: Ogni notte raccoglie i nuovi documenti dell'Agenzia delle Entrate e di Normattiva e aggiorna l'indice.
    profile:
      inline:
        display_name: StudioFisco indexer
        crews:
        - id: indexer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 2.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''agente che aggiorna ogni notte la base di conoscenza fiscale. Fonti: sito dell''Agenzia delle
            Entrate (circolari, risoluzioni, risposte a interpello, provvedimenti) e Normattiva (testi di legge su fisco,
            IVA, forfettario, lavoro e crediti d''imposta). Usa gli strumenti WebRobot MCP per raccogliere le pagine nuove
            o modificate dall''ultimo aggiornamento (costruisci ed esegui tu la pipeline tramite MCP). Per ogni documento
            ricava: id stabile (es. ade-circolare-2026-12), type (circolare, risoluzione, interpello, legge, provvedimento),
            number, title, source (ade|normattiva), url ufficiale, published_at, modified_at, topics (IVA, forfettario, scadenze,
            crediti_imposta, lavoro...), summary (max 120 parole, fedele al testo), text (estratto utile) e amended_note quando
            una norma risulta modificata, abrogata o integrata di recente. Prima usa kb_search per verificare se esiste già:
            aggiorna con kb_upsert, non duplicare. Non inventare nulla: se un campo non è nel testo lascialo vuoto. Termina
            con un rapporto che inizia con ''# Aggiornamento indice <data>'' e elenca documenti nuovi, modificati ed eventuali
            errori di raccolta, con i conteggi.'
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
    goalTemplate: 'Aggiorna l''indice con i documenti pubblicati o modificati dall''ultimo aggiornamento. Data di oggi: {date}.'
    appTools:
    - name: kb_search
      description: Cerca nella base di conoscenza (circolari, risoluzioni, interpelli, leggi) per parole chiave
      action: search
      collection: kb_documents
      scope: all
    - name: kb_upsert
      description: Scrive o aggiorna un documento nella base di conoscenza
      action: write
      collection: kb_documents
      scope: all
    output: markdown
    writesTo:
      collection: kb_updates
      parse: whole
      keyBy: date
    limits:
      maxTurns: 40
      maxBudgetUsd: 2.0
      timeoutSeconds: 3000
  data:
    collections:
    - name: kb_documents
      ownedBy: app
      searchable: true
      description: 'Base di conoscenza: circolari, risoluzioni, interpelli AdE e testi di legge Normattiva'
      fields:
      - name: doc_id
        type: text
        required: true
      - name: type
        type: text
      - name: source
        type: text
      - name: number
        type: text
      - name: title
        type: text
      - name: url
        type: url
      - name: published_at
        type: date
      - name: modified_at
        type: date
      - name: amended_note
        type: text
      - name: topics
        type: text
      - name: summary
        type: textarea
      - name: text
        type: textarea
    - name: kb_updates
      ownedBy: app
      description: Rapporto dell'aggiornamento notturno dell'indice
    - name: client_folders
      ownedBy: user
      description: Cartelle per cliente del professionista
      fields:
      - name: name
        type: text
        required: true
      - name: notes
        type: textarea
    - name: saved_answers
      ownedBy: user
      description: Risposte salvate dal professionista nelle cartelle cliente
      fields:
      - name: folder
        type: relation
        relation: client_folders
        required: true
      - name: question
        type: textarea
      - name: answer
        type: textarea
      - name: sources
        type: textarea
      - name: saved_at
        type: date
  views:
  - key: home
    type: page
    title: StudioFisco Assist
    nav: false
    sections:
    - type: hero
      eyebrow:
        it: Per commercialisti e consulenti del lavoro
        en: For accountants and labour consultants
      title:
        it: Risposte fiscali **con la fonte**, sempre.
        en: Tax answers **with the source**, always.
      text:
        it: 'Chiedi di IVA, forfettario, scadenze e crediti d''imposta: l''assistente cerca in circolari, risoluzioni, interpelli
          e leggi, cita link e data e ti avvisa quando una norma è cambiata da poco.'
        en: 'Ask about VAT, flat-rate regime, deadlines and tax credits: the assistant searches circulars, resolutions, rulings
          and laws, cites link and date and warns you when a rule changed recently.'
      actions:
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: primary
      - label:
          it: Come funziona
          en: How it works
        href: '#come-funziona'
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Fai una domanda
          en: Ask a question
        text:
          it: Scrivi in italiano nella chat, come a un collega.
          en: Write in Italian in the chat, like to a colleague.
        badge: 💬
      - title:
          it: Ricevi risposta con fonti
          en: Get an answer with sources
        text:
          it: Ogni risposta cita documento, data e link; se non è sicura te lo dice.
          en: Every answer cites document, date and link; if unsure, it says so.
        badge: 📎
      - title:
          it: Salva e allega
          en: Save and attach
        text:
          it: Salva le risposte nelle cartelle per cliente ed esportale in PDF per il parere.
          en: Save answers in client folders and export them as PDF for your opinion.
        badge: 📁
    - type: cards
      id: fonti
      title:
        it: Fonti
        en: Sources
      items:
      - title: Agenzia delle Entrate
        text:
          it: Circolari, risoluzioni, risposte a interpello e provvedimenti.
          en: Circulars, resolutions, rulings and orders.
      - title: Normattiva
        text:
          it: Testi di legge vigenti su fisco, IVA, forfettario e lavoro.
          en: Current legislation on tax, VAT, flat-rate regime and labour.
      - title:
          it: Aggiornata ogni notte
          en: Updated every night
        text:
          it: Un agente indicizza i nuovi documenti pubblicati.
          en: An agent indexes newly published documents.
    - type: cards
      id: prezzi
      title:
        it: Prezzi
        en: Pricing
      intro:
        it: Una domanda = un credito. Pagamento con carta.
        en: One question = one credit. Pay by card.
      items:
      - title: '200'
        text:
          it: 200 domande al mese
          en: 200 questions per month
      - title: '1000'
        text:
          it: 1000 domande al mese
          en: 1000 questions per month
    - type: note
      content:
        it: Supporto al professionista, non un parere. Verifica sempre sul testo originale della norma. Accesso solo su invito
          dello studio.
        en: Support for the professional, not an opinion. Always verify against the original text. Access by firm invitation
          only.
  - key: chat
    type: chat
    title:
      it: Chiedi all'assistente
      en: Ask the assistant
    source: agent:assistant
    examples:
    - Quali sono i requisiti di accesso al regime forfettario nel 2026?
    - Quando scade il versamento dell'IVA trimestrale?
    - Come si usa il credito d'imposta per investimenti in beni strumentali?
    - Ci sono modifiche recenti alla cause di esclusione dal forfettario?
    placeholder:
      it: Scrivi la tua domanda fiscale…
      en: Type your tax question…
    roles:
    - professional
  - key: history
    type: history
    title:
      it: Le mie conversazioni
      en: My conversations
    source: run
    roles:
    - professional
  - key: conversation
    type: report
    source: run
    printable: true
    nav: false
    roles:
    - professional
  - key: folders
    type: table
    title:
      it: Cartelle clienti
      en: Client folders
    source: collection:client_folders
    data:
      display: table
      fields:
      - key: name
        label:
          it: Cliente
          en: Client
      - key: notes
        label:
          it: Note
          en: Notes
      empty:
        it: 'Nessuna cartella: chiedi all''assistente di crearne una.'
        en: No folders yet.
    roles:
    - professional
  - key: saved
    type: list
    title:
      it: Risposte salvate
      en: Saved answers
    source: collection:saved_answers
    printable: true
    data:
      display: cards
      fields:
      - key: folder
        label:
          it: Cartella
          en: Folder
      - key: question
        label:
          it: Domanda
          en: Question
      - key: answer
        label:
          it: Risposta
          en: Answer
      - key: sources
        label:
          it: Fonti
          en: Sources
      - key: saved_at
        label:
          it: Salvata il
          en: Saved on
        format: date
      sort:
        field: saved_at
        dir: desc
      limit: 100
      empty:
        it: Nessuna risposta salvata.
        en: No saved answers.
    roles:
    - professional
  - key: account
    type: account
    title:
      it: Crediti e abbonamento
      en: Credits and plan
    roles:
    - professional
    - admin
  - key: admin
    type: tabs
    title:
      it: Studio
      en: Firm
    children:
    - admin_overview
    - admin_users
    roles:
    - admin
  - key: admin_overview
    type: admin
    title:
      it: Consumi
      en: Usage
    roles:
    - admin
    nav: false
  - key: admin_users
    type: admin
    title:
      it: Collaboratori
      en: Team
    roles:
    - admin
    nav: false
  schedules:
  - agent: indexer
    action: run
    cron: 0 2 * * *
    owner: app
    goal: Aggiorna l'indice con i nuovi documenti AdE e Normattiva.
  billing:
    modes:
    - credits
    - subscription
    currency: eur
    signupCredits: 5
    costs:
      agent:assistant: 1
    packs: []
    plans:
    - key: studio_200
      price: 19
      interval: month
      label:
        it: 200 domande al mese
        en: 200 questions per month
      credits: 200
      creditsReset: monthly
      roles:
      - professional
      - admin
    - key: studio_1000
      price: 79
      interval: month
      label:
        it: 1000 domande al mese
        en: 1000 questions per month
      credits: 1000
      creditsReset: monthly
      roles:
      - professional
      - admin
  extensions:
  - key: pdf_export
    description: L'esportazione in PDF usa la stampa del browser sulle viste stampabili (risposte salvate, conversazione);
      non c'è un generatore PDF dedicato.
  - key: admin_usage_only
    description: L'admin vede solo consumi e collaboratori tramite le viste admin; il contenuto delle conversazioni non è
      esposto e va verificato nel runtime.
  - key: invites
    description: Gli inviti ai collaboratori sono gestiti dall'admin nella vista Collaboratori; l'email di invito non è disponibile
      (notifiche non ancora supportate), il link va condiviso a mano.
