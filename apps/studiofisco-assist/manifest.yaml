apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: studiofisco-assist
  displayName: StudioFisco Assist
  tagline:
    it: L'assistente per commercialisti e consulenti del lavoro, con fonti sempre citate.
    en: The assistant for accountants and labour consultants, always citing sources.
  description:
    it: Chat in italiano su IVA, regime forfettario, scadenze e crediti d'imposta, basata su circolari, risoluzioni e interpelli
      dell'Agenzia delle Entrate e sui testi di legge di Normattiva.
    en: Italian-language chat on VAT, flat-rate regime, deadlines and tax credits, grounded in Agenzia delle Entrate circulars,
      rulings and Normattiva legislation.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#16324f'
      accent: '#0f766e'
      background: '#f7f8fa'
      foreground: '#18212b'
    fonts:
      body: Inter
      display: Source Serif 4
    wordmark:
    - text: 'StudioFisco '
      color: primary
    - text: Assist
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Fonti
        en: Sources
      href: '#fonti'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label:
        it: Admin dello studio
        en: Firm admin
      assignedBy: admin_emails
    - key: user
      label:
        it: Professionista
        en: Professional
      assignedBy: invite
  limits:
  - action: chat
    per: user
    max: 200
    window: day
    roles:
    - user
  agents:
  - key: assistant
    role: main
    description: Risponde a domande fiscali cercando nella base di conoscenza, citando sempre fonte, link e data; salva le
      risposte nelle cartelle cliente.
    profile:
      inline:
        display_name: StudioFisco Assist
        chat_mode: true
        crews:
        - id: assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei StudioFisco Assist, assistente per commercialisti e consulenti del lavoro italiani. Rispondi
            sempre in italiano, in modo tecnico e conciso.


            METODO

            1. Per ogni domanda chiama kb_search (anche più volte, con parole chiave diverse) e basa la risposta SOLO sui
            documenti trovati. Non usare memoria personale per citare numeri di circolare, articoli, importi o scadenze.

            2. Cita sempre ogni fonte: tipo e numero (circolare, risoluzione, interpello, articolo di legge), data di pubblicazione,
            titolo e link (campo url). Formato: [Circolare n. X/E del GG/MM/AAAA](url).

            3. Ogni documento ha i campi modified_at, status e modification_note. Se una norma è stata modificata negli ultimi
            90 mesi... meglio: negli ultimi 90 giorni rispetto alla data di oggi, o se status indica modificata/abrogata,
            aggiungi un riquadro "⚠️ Norma modificata di recente" con data e natura della modifica.

            4. Se non trovi fonti pertinenti, o sono ambigue, datate o in contrasto, DILLO chiaramente ("Non sono sicuro")
            e invita a verificare sulla norma originale (Normattiva / sito dell''Agenzia delle Entrate). Non inventare mai
            norme, importi, aliquote, date o link.

            5. Distingui la norma dalla prassi amministrativa e dall''interpretazione. Indica quando la risposta dipende da
            fatti del cliente non noti e chiedi i dati mancanti.

            6. Non fornisci un parere definitivo: il professionista resta responsabile. Termina con una riga "Fonti consultate"
            con l''elenco.


            SALVATAGGIO

            Se l''utente chiede di salvare una risposta: chiama list_folders; se la cartella cliente non esiste chiama create_folder;
            poi save_answer con folder, question, answer (testo completo con fonti) e sources. Conferma in una riga.'
          mcp_servers: []
    goalTemplate: 'Conversazione finora:

      {history}


      Nuova domanda del professionista ({user}): {message}

      Data di oggi: {date}. Rispondi in italiano.'
    output: markdown
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.5
    appTools:
    - name: kb_search
      description: Cerca nella base di conoscenza (circolari, risoluzioni, interpelli, norme)
      action: search
      collection: kb_documents
      scope: all
    - name: kb_read
      description: Legge un documento della base di conoscenza
      action: read
      collection: kb_documents
      scope: all
    - name: list_folders
      description: Elenca le cartelle cliente dell'utente
      action: read
      collection: client_folders
      scope: user
    - name: create_folder
      description: Crea una cartella cliente
      action: write
      collection: client_folders
      scope: user
    - name: save_answer
      description: Salva una risposta in una cartella cliente
      action: write
      collection: saved_answers
      scope: user
  - key: indexer
    role: scheduled
    description: Ogni notte cerca nuovi documenti dell'Agenzia delle Entrate e di Normattiva e aggiorna l'indice.
    profile:
      inline:
        display_name: StudioFisco indexer
        crews:
        - id: indexer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 60
          max_budget_usd: 3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''agente di indicizzazione di StudioFisco Assist. Ogni notte raccogli i documenti pubblicati
            o modificati nelle ultime 48 ore da: (1) Agenzia delle Entrate: circolari, risoluzioni, risposte a interpello
            (sezione normativa e prassi del sito agenziaentrate.gov.it); (2) Normattiva (normattiva.it): testi di legge in
            materia tributaria e di lavoro, e le loro modifiche. Usa il WebRobot MCP per leggere le pagine pubbliche e, se
            serve, costruire ed eseguire una pipeline di raccolta; rispetta robots.txt e i termini d''uso, con ritmo moderato.


            Per ogni documento prima chiama kb_read/kb_search per vedere se esiste già (chiave doc_id: es. ''circolare-12E-2026'').
            Poi chiama kb_write con i campi: doc_id, type (circolare|risoluzione|interpello|legge|decreto), number, title,
            published_at (AAAA-MM-GG), modified_at, status (vigente|modificata|abrogata), modification_note (cosa è cambiato
            e da quale atto, se noto), url (link ufficiale), source (agenzia_entrate|normattiva), topics (parole chiave: IVA,
            forfettario, scadenze, crediti d''imposta, lavoro...), text (testo o sintesi fedele, max 6000 caratteri). Se un
            documento già indicizzato risulta modificato, aggiornalo e valorizza modification_note. Non inventare mai contenuti
            o link: se una pagina non è leggibile, saltala e annotalo. Chiudi con un breve riepilogo: nuovi documenti, aggiornati,
            errori.'
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
    goalTemplate: 'Aggiorna l''indice con i documenti pubblicati o modificati nelle ultime 48 ore. Data di oggi: {date}.'
    output: markdown
    limits:
      maxTurns: 60
      maxBudgetUsd: 3
    appTools:
    - name: kb_search
      description: Cerca nella base di conoscenza (circolari, risoluzioni, interpelli, norme)
      action: search
      collection: kb_documents
      scope: all
    - name: kb_read
      description: Legge un documento della base di conoscenza
      action: read
      collection: kb_documents
      scope: all
    - name: kb_write
      description: Aggiunge o aggiorna un documento nella base di conoscenza
      action: write
      collection: kb_documents
      scope: all
  schedules:
  - agent: indexer
    action: run
    cron: 0 2 * * *
    owner: app
    goal: Aggiorna l'indice con i nuovi documenti di Agenzia delle Entrate e Normattiva.
  data:
    collections:
    - name: kb_documents
      ownedBy: app
      searchable: true
      description: 'Base di conoscenza: circolari, risoluzioni, interpelli, norme, aggiornata ogni notte'
      fields:
      - name: doc_id
        type: text
        required: true
      - name: type
        type: select
        options:
        - circolare
        - risoluzione
        - interpello
        - legge
        - decreto
      - name: number
        type: text
      - name: title
        type: text
      - name: published_at
        type: date
      - name: modified_at
        type: date
      - name: status
        type: select
        options:
        - vigente
        - modificata
        - abrogata
      - name: modification_note
        type: textarea
      - name: url
        type: url
      - name: source
        type: select
        options:
        - agenzia_entrate
        - normattiva
      - name: topics
        type: text
      - name: text
        type: textarea
    - name: client_folders
      ownedBy: user
      description: Cartelle per cliente del professionista
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Cliente
          en: Client
      - name: notes
        type: textarea
        label:
          it: Note
          en: Notes
    - name: saved_answers
      ownedBy: user
      description: Risposte salvate dalla chat, per cartella cliente
      fields:
      - name: folder
        type: relation
        relation: client_folders
        required: true
        label:
          it: Cartella cliente
          en: Client folder
      - name: question
        type: textarea
        label:
          it: Domanda
          en: Question
      - name: answer
        type: textarea
        label:
          it: Risposta
          en: Answer
      - name: sources
        type: textarea
        label:
          it: Fonti
          en: Sources
      - name: saved_at
        type: date
        label:
          it: Data
          en: Date
  views:
  - key: home
    type: page
    nav: false
    title: StudioFisco Assist
    sections:
    - type: hero
      title:
        it: Risposte fiscali con **fonte, link e data**.
        en: Tax answers with **source, link and date**.
      text:
        it: Chiedi in italiano di IVA, regime forfettario, scadenze e crediti d'imposta. L'assistente cerca in circolari,
          risoluzioni, interpelli e testi di legge, cita sempre la fonte e ti dice quando non è sicuro.
        en: Ask in Italian about VAT, flat-rate regime, deadlines and tax credits. The assistant searches circulars, rulings
          and legislation, always cites sources and tells you when it is unsure.
      actions:
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Chiedi
          en: Ask
        text:
          it: Apri la chat e scrivi la domanda del cliente.
          en: Open the chat and write the client's question.
      - title:
          it: Verifica le fonti
          en: Check the sources
        text:
          it: Ogni risposta cita documento, data e link, e segnala le norme modificate di recente.
          en: Every answer cites document, date and link, and flags recently amended rules.
      - title:
          it: Salva ed esporta
          en: Save and export
        text:
          it: Archivia le risposte nelle cartelle per cliente ed esportale in PDF per il parere.
          en: File answers in client folders and export them to PDF for your opinion.
    - type: cards
      id: fonti
      title:
        it: Fonti
        en: Sources
      items:
      - title: Agenzia delle Entrate
        text:
          it: Circolari, risoluzioni e risposte a interpello, aggiornate ogni notte.
          en: Circulars, rulings and interpretation answers, updated nightly.
      - title: Normattiva
        text:
          it: Testi di legge e relative modifiche.
          en: Legislation and its amendments.
    - type: note
      content:
        it: Strumento di supporto al professionista, non un parere. Verifica sempre la norma originale.
        en: A support tool for professionals, not an opinion. Always verify the original rule.
  - key: chat
    type: chat
    source: agent:assistant
    title:
      it: Chat
      en: Chat
    roles:
    - user
    - admin
    placeholder:
      it: Scrivi la tua domanda fiscale…
      en: Type your tax question…
    examples:
    - it: Quali sono i limiti di ricavi per il regime forfettario nel 2026?
      en: Revenue limits for the flat-rate regime in 2026?
    - it: Scadenze IVA del prossimo trimestre
      en: VAT deadlines next quarter
    - it: Come si usa in compensazione un credito d'imposta?
      en: How to offset a tax credit?
  - key: folders
    type: table
    source: collection:client_folders
    title:
      it: Clienti
      en: Clients
    roles:
    - user
    - admin
  - key: new_folder
    type: form
    collection: client_folders
    title:
      it: Nuova cartella cliente
      en: New client folder
    submit:
      label:
        it: Crea cartella
        en: Create folder
      message:
        it: Cartella creata
        en: Folder created
      redirect: folders
    roles:
    - user
    - admin
  - key: saved
    type: cards
    source: collection:saved_answers
    title:
      it: Risposte salvate
      en: Saved answers
    printable: true
    export: true
    roles:
    - user
    - admin
    data:
      display: cards
      fields:
      - key: folder
        label:
          it: Cliente
          en: Client
      - key: question
        label:
          it: Domanda
          en: Question
      - key: answer
        label:
          it: Risposta
          en: Answer
      - key: sources
        label:
          it: Fonti
          en: Sources
      - key: saved_at
        label:
          it: Data
          en: Date
        format: date
      sort:
        field: saved_at
        dir: desc
      limit: 100
  - key: admin
    type: admin
    title:
      it: Consumi
      en: Usage
    roles:
    - admin
  - key: account
    type: account
    title:
      it: Crediti
      en: Credits
    roles:
    - user
    - admin
  billing:
    modes:
    - credits
    - subscription
    currency: eur
    signupCredits: 5
    costs:
      agent:assistant: 1
    plans:
    - key: studio_200
      price: 19
      interval: month
      label:
        it: 200 domande al mese
        en: 200 questions a month
      credits: 200
      creditsReset: monthly
    - key: studio_1000
      price: 79
      interval: month
      label:
        it: 1000 domande al mese
        en: 1000 questions a month
      credits: 1000
      creditsReset: monthly
  extensions:
  - key: pdf_export
    description: L'esportazione in PDF usa la stampa del browser sulla vista 'saved' (printable); un PDF generato lato server
      con intestazione dello studio non è disponibile.
  - key: admin_usage_only
    description: 'La vista admin mostra solo statistiche d''uso (utenti, domande, crediti consumati); il contenuto delle conversazioni
      resta del singolo professionista. Gli admin tecnicamente rientrano tra chi può leggere i record: va verificato in fase
      di pubblicazione.'
