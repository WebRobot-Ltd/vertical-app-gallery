apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: agevolapmi
  displayName: AgevolaPMI
  tagline:
    it: Trova i bandi giusti, prepara la domanda, rendiconta senza errori.
    en: Find the right grants, draft the application, report without errors.
  description:
    it: 'Per piccole imprese e consulenti di finanza agevolata: bandi monitorati ogni giorno, classifica di compatibilità,
      bozza della domanda approvata dal consulente e verifica della rendicontazione.'
    en: 'For small businesses and grant consultants: daily grant monitoring, compatibility ranking, application drafts approved
      by the consultant and expense report checks.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12355b'
      accent: '#1f8a70'
      background: '#f6f8fb'
      foreground: '#17212b'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Agevola
      color: primary
    - text: PMI
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Per chi
        en: Who it is for
      href: '#per-chi'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      label:
        it: Impresa
        en: Business
      assignedBy: signup
    - key: consultant
      label:
        it: Consulente
        en: Consultant
      assignedBy: derived
      from: collection:clients.consultant_email
  limits:
  - action: agent:matcher
    per: user
    max: 5
    window: day
    roles:
    - user
  agents:
  - key: scout
    role: scheduled
    description: Ogni giorno consulta i bandi pubblicati e li salva come schede.
    mcpServers:
    - name: webrobot
      url: https://mcp-full.webrobot.eu/mcp
      allow: all
    profile:
      inline:
        display_name: AgevolaPMI scout
        crews:
        - id: scout
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'Sei un analista di finanza agevolata. Ogni giorno consulti, tramite il MCP WebRobot, i bandi pubblicati
            da ministeri (MIMIT, MASAF...), regioni, camere di commercio e dal portale incentivi.gov.it, e individui i bandi
            nuovi o aggiornati nelle ultime 48 ore e quelli ancora aperti. Per ogni bando scrivi una sezione ''## <titolo
            del bando>'' con righe ''Ente:'', ''Scadenza: AAAA-MM-GG'', ''Regioni:'', ''Codici ATECO ammessi:'', ''Dimensione
            impresa:'', ''Spese ammissibili:'', ''Intensita agevolazione:'', ''Requisiti:'', ''Link:''. Apri sempre la pagina
            ufficiale: non inventare mai importi, scadenze o requisiti; se un dato manca scrivi ''non indicato''. Inizia con
            un titolo ''# Bandi del <data>''. Non leggi dati di imprese o clienti.'
    goalTemplate: Oggi e {date}. Raccogli i bandi aperti o pubblicati di recente da ministeri, regioni, camere di commercio
      e incentivi.gov.it.
    output: markdown
    writesTo:
      collection: grants
      parse: markdown_sections
      keyBy: title
    limits:
      maxTurns: 40
      maxBudgetUsd: 1.5
  - key: matcher
    role: main
    description: Confronta il profilo dell'impresa con i bandi e propone una classifica motivata.
    appTools:
    - name: read_grants
      description: Legge i bandi raccolti
      action: read
      collection: grants
      scope: all
    context:
    - key: c_name
      from: collection:clients.company_name
    - key: c_vat
      from: collection:clients.vat
    - key: c_ateco
      from: collection:clients.ateco
    - key: c_region
      from: collection:clients.region
    - key: c_employees
      from: collection:clients.employees
    - key: c_revenue
      from: collection:clients.revenue
    - key: c_project
      from: collection:clients.project
    - key: c_investment
      from: collection:clients.investment
    - key: c_timeline
      from: collection:clients.timeline
    - key: c_expense
      from: collection:clients.expense_type
    profile:
      inline:
        display_name: AgevolaPMI matcher
        crews:
        - id: matcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un consulente di finanza agevolata. Leggi i bandi con lo strumento read_grants e confrontali
            con il profilo dell''impresa (ATECO, regione, dimensione, fatturato, progetto, spese, tempi). Scarta i bandi non
            compatibili o scaduti. Scrivi il report iniziando con ''# Bandi compatibili per <impresa>''. Poi una tabella in
            classifica (bando, ente, scadenza, intensita, punteggio 0-100) e per ciascuno dei primi 5 una sezione con: motivazione
            della compatibilita, spese ammissibili che coprono il progetto, requisiti da verificare, scadenza. Aggiungi un
            grafico ```chart``` a barre dei punteggi. Non inventare mai requisiti, importi o scadenze: se un dato manca nella
            scheda scrivilo. Sono indicazioni di supporto, la verifica finale spetta al consulente.'
    goalTemplate: 'Impresa: {c_name} (P.IVA {c_vat}). ATECO {c_ateco}, regione {c_region}, dipendenti {c_employees}, fatturato
      {c_revenue} EUR.

      Progetto: {c_project}. Investimento {c_investment} EUR, tempi {c_timeline}, tipo di spesa {c_expense}.

      {?focus}Priorita dell''utente: {focus}{/focus}

      Oggi e {date}. Scrivi in lingua {lang}.'
    output: markdown
    limits:
      maxTurns: 15
      maxBudgetUsd: 0.8
  - key: project_writer
    role: helper
    description: Scrive la descrizione del progetto per la domanda.
    appTools:
    - name: read_grants
      description: Legge i bandi raccolti
      action: read
      collection: grants
      scope: all
    - name: read_clients
      description: Legge i dati dell'impresa
      action: read
      collection: clients
      scope: user
    - name: read_applications
      description: Legge le pratiche
      action: read
      collection: applications
      scope: user
    - name: write_application
      description: Aggiorna la pratica
      action: write
      collection: applications
      scope: user
    profile:
      inline:
        display_name: Redattore progetto
        crews:
        - id: project_writer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Scrivi la sezione ''Descrizione del progetto'' della domanda per il bando scelto: obiettivi, contesto
            aziendale, coerenza con le finalita del bando, risultati attesi. Usa solo i dati dell''impresa e del bando letti
            con gli strumenti; non inventare cifre. Salva il testo nel campo project_section della pratica con write_application.'
    goalTemplate: Scrivi la descrizione del progetto per la pratica indicata nel compito.
  - key: cost_planner
    role: helper
    description: Costruisce il piano dei costi in base alle spese ammissibili.
    appTools:
    - name: read_grants
      description: Legge i bandi raccolti
      action: read
      collection: grants
      scope: all
    - name: read_clients
      description: Legge i dati dell'impresa
      action: read
      collection: clients
      scope: user
    - name: read_applications
      description: Legge le pratiche
      action: read
      collection: applications
      scope: user
    - name: write_application
      description: Aggiorna la pratica
      action: write
      collection: applications
      scope: user
    profile:
      inline:
        display_name: Pianificatore costi
        crews:
        - id: cost_planner
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Prepara il piano dei costi: voci di spesa suddivise per categorie ammissibili del bando, importo,
            quota agevolata secondo l''intensita indicata, quota a carico dell''impresa. Parti dall''investimento previsto
            dall''impresa; segnala le voci non ammissibili. Non inventare importi non forniti: usa ''da definire con preventivo''.
            Salva in cost_plan della pratica con write_application.'
    goalTemplate: Scrivi il piano dei costi per la pratica indicata nel compito.
  - key: schedule_writer
    role: helper
    description: Scrive il cronoprogramma coerente con i termini del bando.
    appTools:
    - name: read_grants
      description: Legge i bandi raccolti
      action: read
      collection: grants
      scope: all
    - name: read_clients
      description: Legge i dati dell'impresa
      action: read
      collection: clients
      scope: user
    - name: read_applications
      description: Legge le pratiche
      action: read
      collection: applications
      scope: user
    - name: write_application
      description: Aggiorna la pratica
      action: write
      collection: applications
      scope: user
    profile:
      inline:
        display_name: Redattore cronoprogramma
        crews:
        - id: schedule_writer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: Scrivi il cronoprogramma del progetto in fasi con date di inizio e fine, coerente con i tempi dell'impresa
            e con i termini di avvio e conclusione del bando. Segnala eventuali incompatibilita. Salva in schedule_plan della
            pratica con write_application.
    goalTemplate: Scrivi il cronoprogramma per la pratica indicata nel compito.
  - key: editor
    role: helper
    description: Assembla la bozza e la sottopone al consulente.
    awaits:
    - consultant_review
    appTools:
    - name: read_applications
      description: Legge le pratiche
      action: read
      collection: applications
      scope: user
    - name: write_application
      description: Aggiorna la pratica
      action: write
      collection: applications
      scope: user
    profile:
      inline:
        display_name: Editor domanda
        crews:
        - id: editor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: Leggi la pratica, controlla coerenza tra descrizione, piano dei costi e cronoprogramma, assembla
            la bozza completa in campo draft e imposta status 'review'. Poi chiedi l'approvazione del consulente con request_consultant_review,
            elencando i punti dubbi.
    goalTemplate: Assembla la bozza della pratica indicata nel compito e chiedi la revisione del consulente.
  - key: auditor
    role: helper
    description: Verifica che fatture e quietanze corrispondano al piano approvato.
    appTools:
    - name: read_upload
      description: Legge un file caricato dall'utente
      action: read_file
    - name: read_applications
      description: Legge le pratiche
      action: read
      collection: applications
      scope: user
    - name: write_expense
      description: Aggiorna il documento di spesa
      action: write
      collection: expenses
      scope: user
    profile:
      inline:
        display_name: Verificatore rendicontazione
        crews:
        - id: auditor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Apri i documenti caricati (fatture, quietanze, contratti) con read_upload. Estrai fornitore, data,
            importo, causale, pagamento. Confrontali con il piano dei costi approvato nella pratica: voce corrispondente,
            importo entro il piano, data nel periodo ammissibile, quietanza presente. Scrivi l''esito nel campo check_result
            del documento con write_expense e imposta check_status a ok, da_verificare o non_conforme. Non inventare dati
            illeggibili: segnalalo.'
    goalTemplate: Verifica il nuovo documento di rendicontazione indicato nel compito rispetto al piano approvato.
  teams:
  - key: drafter
    mode: sequence
    title:
      it: Squadra bozza domanda
      en: Application drafting team
    steps:
    - agent: project_writer
    - agent: cost_planner
      after:
      - project_writer
    - agent: schedule_writer
      after:
      - cost_planner
    - agent: editor
      after:
      - schedule_writer
    maxMinutes: 30
    goalTemplate: Prepara la bozza della domanda per la pratica {event}.
  approvals:
  - key: consultant_review
    title:
      it: Revisione della domanda
      en: Application review
    role: consultant
    decidedBy: role
    fields:
    - client_name
    - grant
    timeoutMinutes: 10080
  triggers:
  - key: draft_start
    'on':
      collection: applications
      op: insert
    start:
      team: drafter
    goal: 'Pratica {record.client_name} per il bando {record.grant}. Dettagli: {event}'
  - key: audit_start
    'on':
      collection: expenses
      op: insert
      where:
        check_status: pending
    start:
      agent: auditor
    goal: 'Documento: {record.description}, file {record.document}. Pratica {record.application}. Evento: {event}'
  - key: review_done
    'on':
      approval: consultant_review
      decision: approved
    notify:
      to:
      - owner
      subject:
        it: La tua domanda è stata approvata dal consulente
        en: Your application was approved by the consultant
      body:
        it: Il consulente ha approvato la bozza della domanda. Puoi procedere all'invio.
        en: The consultant approved the application draft. You can proceed to submit it.
      link: applications
  - key: review_rejected
    'on':
      approval: consultant_review
      decision: rejected
    notify:
      to:
      - owner
      subject:
        it: Domanda da correggere
        en: Application needs changes
      body:
        it: Il consulente ha richiesto correzioni alla bozza. Apri la pratica per i dettagli.
        en: The consultant requested changes to the draft. Open the file for details.
      link: applications
  - key: new_grant
    'on':
      collection: grants
      op: insert
    notify:
      to: role:user
      subject:
        it: 'Nuovo bando: {record.title}'
        en: 'New grant: {record.title}'
      body:
        it: 'È stato pubblicato un nuovo bando: {record.title}. Avvia una nuova ricerca per vedere se è compatibile con la
          tua impresa.'
        en: 'A new grant was published: {record.title}. Run a new match to see if it fits your business.'
      link: new_match
  - key: deadline_alert
    'on':
      date:
        collection: grants
        field: deadline
        offsetDays: -7
        hour: 8
    notify:
      to:
      - role:user
      - role:consultant
      subject:
        it: 'Scadenza tra 7 giorni: {record.title}'
        en: 'Deadline in 7 days: {record.title}'
      body:
        it: Il bando {record.title} scade tra una settimana ({record.deadline}).
        en: The grant {record.title} closes in a week ({record.deadline}).
      link: history
  - key: success_fee
    'on':
      collection: applications
      op: update
      where:
        status: granted
    charge:
      credits: 300
      reason: Commissione pratica approvata
  schedules:
  - agent: scout
    cron: 0 5 * * *
    action: run
    owner: app
    goal: Raccogli i bandi aperti o pubblicati di recente.
  - cron: '*/10 * * * *'
    action: settle
    owner: app
  inputForm:
    title:
      it: Nuova ricerca bandi
      en: New grant match
    fields:
    - name: client
      type: select
      required: true
      optionsFrom: collection:clients
      label:
        it: Impresa
        en: Business
    - name: focus
      type: textarea
      maxLength: 400
      label:
        it: Priorità (facoltativo)
        en: Priorities (optional)
      help:
        it: es. solo contributi a fondo perduto, scadenza entro 60 giorni
        en: e.g. grants only, deadline within 60 days
  data:
    collections:
    - name: grants
      ownedBy: app
      description: Bandi raccolti ogni giorno
      retentionDays: 730
      fields:
      - name: title
        type: text
        label: Titolo
      - name: body
        type: textarea
        label: Scheda
      - name: deadline
        type: date
        label: Scadenza
    - name: clients
      ownedBy: user
      description: Profilo delle imprese
      access:
      - role: consultant
        where:
          consultant_email: '{user.email}'
        can:
        - read
        - write
      fields:
      - name: company_name
        type: text
        required: true
        label:
          it: Ragione sociale
          en: Company name
      - name: vat
        type: text
        required: true
        label:
          it: Partita IVA
          en: VAT number
      - name: ateco
        type: text
        required: true
        label:
          it: Codice ATECO
          en: ATECO code
      - name: region
        type: select
        required: true
        label:
          it: Regione
          en: Region
        options:
        - Abruzzo
        - Basilicata
        - Calabria
        - Campania
        - Emilia-Romagna
        - Friuli-Venezia Giulia
        - Lazio
        - Liguria
        - Lombardia
        - Marche
        - Molise
        - Piemonte
        - Puglia
        - Sardegna
        - Sicilia
        - Toscana
        - Trentino-Alto Adige
        - Umbria
        - Valle d'Aosta
        - Veneto
      - name: employees
        type: number
        required: true
        label:
          it: Dipendenti
          en: Employees
      - name: revenue
        type: number
        required: true
        label:
          it: Fatturato annuo (EUR)
          en: Annual revenue (EUR)
      - name: project
        type: textarea
        required: true
        maxLength: 2000
        label:
          it: Descrizione del progetto
          en: Project description
      - name: investment
        type: number
        label:
          it: Investimento previsto (EUR)
          en: Planned investment (EUR)
      - name: timeline
        type: text
        label:
          it: Tempi previsti
          en: Timeline
      - name: expense_type
        type: select
        label:
          it: Tipo di spesa
          en: Expense type
        options:
        - value: macchinari
          label:
            it: Macchinari e impianti
            en: Machinery
        - value: digitale
          label:
            it: Digitalizzazione
            en: Digital
        - value: energia
          label:
            it: Efficienza energetica
            en: Energy efficiency
        - value: personale
          label:
            it: Assunzioni e formazione
            en: Hiring and training
        - value: ricerca
          label:
            it: Ricerca e sviluppo
            en: R&D
        - value: export
          label:
            it: Internazionalizzazione
            en: Export
      - name: consultant_email
        type: email
        label:
          it: Email del consulente
          en: Consultant email
    - name: applications
      ownedBy: user
      description: Pratiche di domanda
      access:
      - role: consultant
        where:
          consultant_email: '{user.email}'
        can:
        - read
        - write
      fields:
      - name: client_name
        type: text
        required: true
        label:
          it: Impresa
          en: Business
        optionsFrom: collection:clients
      - name: grant
        type: text
        required: true
        label:
          it: Bando
          en: Grant
        optionsFrom: collection:grants
      - name: consultant_email
        type: email
        label:
          it: Email del consulente
          en: Consultant email
      - name: notes
        type: textarea
        label:
          it: Note
          en: Notes
      - name: status
        type: select
        default: draft
        label:
          it: Stato
          en: Status
        options:
        - draft
        - review
        - approved
        - submitted
        - granted
        - rejected
      - name: project_section
        type: textarea
        label: Progetto
      - name: cost_plan
        type: textarea
        label: Piano dei costi
      - name: schedule_plan
        type: textarea
        label: Cronoprogramma
      - name: draft
        type: textarea
        label: Bozza
    - name: expenses
      ownedBy: user
      description: Documenti di rendicontazione
      retentionDays: 3650
      access:
      - role: consultant
        where:
          consultant_email: '{user.email}'
        can:
        - read
        - write
      fields:
      - name: application
        type: text
        required: true
        label:
          it: Pratica
          en: Application
        optionsFrom: collection:applications
      - name: description
        type: text
        required: true
        label:
          it: Descrizione
          en: Description
      - name: document
        type: file
        required: true
        accept:
        - pdf
        - jpg
        - png
        - xlsx
        - docx
        maxMb: 10
        multiple: true
        label:
          it: Fatture, quietanze, contratti
          en: Invoices, receipts, contracts
      - name: consultant_email
        type: email
        label:
          it: Email del consulente
          en: Consultant email
      - name: check_status
        type: select
        default: pending
        options:
        - pending
        - ok
        - da_verificare
        - non_conforme
        label: Esito
      - name: check_result
        type: textarea
        label: Dettaglio verifica
  views:
  - key: home
    type: page
    nav: false
    title: AgevolaPMI
    sections:
    - type: hero
      layout: split
      band: true
      title:
        it: Trova il **bando giusto** per la tua impresa, prepara la domanda e rendiconta senza errori.
        en: Find the **right grant** for your business, draft the application and report without errors.
      text:
        it: Un agente legge ogni giorno i bandi di ministeri, regioni, camere di commercio e incentivi.gov.it, li confronta
          con il tuo profilo e ti propone una classifica motivata. Il consulente rivede la domanda prima dell'invio.
        en: An agent reads grants daily from ministries, regions, chambers of commerce and incentivi.gov.it, matches them
          with your profile and ranks them. Your consultant reviews the application before submission.
      actions:
      - label:
          it: Inizia
          en: Start
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: 1 · Profilo
          en: 1 · Profile
        text:
          it: Inserisci P.IVA, ATECO, regione, dipendenti, fatturato e progetto.
          en: Enter VAT, ATECO, region, employees, revenue and project.
      - title:
          it: 2 · Classifica
          en: 2 · Ranking
        text:
          it: I bandi compatibili in ordine di pertinenza, con requisiti, spese ammissibili, intensità e scadenze.
          en: Compatible grants ranked, with requirements, eligible costs, aid intensity and deadlines.
      - title:
          it: 3 · Domanda
          en: 3 · Application
        text:
          it: Una squadra di agenti scrive progetto, piano dei costi e cronoprogramma; il consulente approva o corregge.
          en: A team of agents writes project, cost plan and schedule; the consultant approves or corrects.
      - title:
          it: 4 · Rendicontazione
          en: 4 · Reporting
        text:
          it: Carichi fatture e quietanze e l'agente verifica la coerenza con il piano approvato.
          en: Upload invoices and receipts; the agent checks them against the approved plan.
    - type: cards
      id: per-chi
      title:
        it: Per chi
        en: Who it is for
      items:
      - title:
          it: Piccole imprese
          en: Small businesses
        text:
          it: Vedi solo i tuoi dati e ricevi alert email su nuovi bandi e scadenze.
          en: You see only your own data and get email alerts on new grants and deadlines.
      - title:
          it: Consulenti
          en: Consultants
        text:
          it: Tutti i tuoi clienti in un unico posto, con revisione delle bozze.
          en: All your clients in one place, with draft review.
    - type: note
      content:
        it: Supporto alla decisione, non consulenza legale o fiscale. Verifica sempre il testo ufficiale del bando.
        en: Decision support, not legal or tax advice. Always check the official call text.
