apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: doppiaggio-espressivo
  displayName: Doppiaggio Espressivo
  tagline:
    it: Doppia i tuoi video in altre lingue senza perdere l'emozione.
    en: Dub your videos into other languages without losing the emotion.
  description:
    it: 'Gestione dei progetti di doppiaggio per studi di post-produzione e creatori: copione tradotto con tempi, parlanti
      ed emozioni, revisione del dialoghista, anteprime per il cliente e consegna finale.'
    en: 'Dubbing project management for post-production studios and creators: timed translated script with speakers and emotions,
      dialogue editor review, client previews and final delivery.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f2a44'
      accent: '#e4572e'
      background: '#f8f6f2'
      foreground: '#1a1d26'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: 'Doppiaggio '
      color: primary
    - text: Espressivo
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      label:
        it: Studio / creatore
        en: Studio / creator
      assignedBy: signup
  limits:
  - action: run
    per: user
    max: 20
    window: day
    roles:
    - user
  agents:
  - key: adapter
    role: main
    description: Transcribes the dialogue from the provided material, separates speakers, translates adapting length to lip-sync
      and pauses, annotates emotion and intensity, then asks the dialogue editor for approval.
    awaits:
    - script_approval
    profile:
      inline:
        display_name: Adattatore di doppiaggio
        crews:
        - id: adapter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are a dubbing adaptation specialist. From the transcript or timed dialogue provided (with timecodes
            and speakers when present), you produce a translated dubbing script. Rules: keep the original timecodes; separate
            speakers and map them to the listed characters; for each target language adapt each line so its spoken length
            fits the original line (similar syllable count, respecting pauses and lip movements on open vowels and labials);
            annotate for each line the emotion (e.g. joy, anger, fear, sadness, irony, neutral) and an intensity from 1 to
            5. Never invent dialogue that is not in the source; if the material has no usable transcript (only a video link
            or audio), say clearly that the transcript must be supplied and do not make one up. Save every line with the tool
            write_line (fields: project, line_no, start, end, speaker, source_text, target_lang, translated_text, emotion,
            intensity, status=''draft''). When all lines are saved, call request_script_approval with the project title so
            the dialogue editor can review and approve. Finish with a report that starts with a level-1 title ''# Copione
            — <project title>'' containing: summary table (characters, languages, number of lines, estimated minutes), adaptation
            notes, doubtful passages to check. Write in the language with the ISO code given in the goal.'
    appTools:
    - name: write_line
      description: Save one line of the translated script
      action: write
      collection: script_lines
      scope: user
    goalTemplate: 'Project: {title}

      Source language: {source_lang_label}

      Target languages: {target_langs}

      Characters (name: description / voice notes):

      {characters}

      Duration in minutes: {minutes}

      {?source_url}Original video/audio link: {source_url}{/source_url}

      {?transcript_file_text}Timed transcript supplied by the user:

      {transcript_file_text}{/transcript_file_text}

      {!transcript_file_text}No transcript supplied.{/transcript_file_text}

      Write the report in the language with ISO code {lang}. Today is {date}.'
    output: markdown
    limits:
      maxTurns: 25
      maxBudgetUsd: 1.5
  - key: dubber
    role: helper
    description: After approval, assigns a consistent voice to each character, prepares the render jobs for the voice engine
      and the re-assembly instructions, and records the preview.
    profile:
      inline:
        display_name: Regista del doppiaggio
        crews:
        - id: dubber
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the dubbing director. Read the approved lines of the project with read_lines (only status
            approved, or redo for lines flagged by the client). For each character and target language assign one consistent
            voice profile (gender, age range, timbre, base style) and keep it for the whole project; for each line prepare
            the render instruction for the external voice engine (text, voice profile, emotion, intensity, target duration
            from start/end). Never claim that audio was generated or that a file exists unless a tool result confirms it:
            if the voice engine connection is not available, record the preview with status ''pending_engine'' and list the
            jobs ready to send. Save the preview with the tool save_preview (fields: project, target_lang, client_email, version,
            status, cast, notes). Report starts with ''# Doppiaggio — <project title>'' and lists the cast sheet, the number
            of lines ready, lines to redo and the next step.'
    appTools:
    - name: read_lines
      description: Read the script lines of the user's projects
      action: read
      collection: script_lines
      scope: user
    - name: read_revisions
      description: Read the client's redo requests
      action: read
      collection: revision_requests
      scope: user
    - name: save_preview
      description: Save a preview record for a project
      action: write
      collection: previews
      scope: user
    goalTemplate: 'Approval event: {event}

      Prepare the dubbing for the project of the approved script ({record.project}). Language of the report: {lang}. Today
      is {date}.'
    output: markdown
    limits:
      maxTurns: 15
      maxBudgetUsd: 1.0
  approvals:
  - key: script_approval
    title:
      it: Approvazione copione tradotto
      en: Translated script approval
    description: The studio's dialogue editor confirms the translated script before voice synthesis.
    decidedBy: requester
    timeoutMinutes: 10080
  triggers:
  - key: start_dubbing
    description: Once the script is approved, start voice assignment and rendering preparation
    'on':
      approval: script_approval
      decision: approved
    start:
      agent: dubber
    goal: 'The script was approved: {event}. Assign voices, prepare the render jobs and the preview.'
    asUser: true
  - key: preview_ready
    'on':
      collection: previews
      op: insert
    notify:
      to:
      - record.client_email
      subject:
        it: 'Anteprima doppiaggio disponibile: {record.project}'
        en: 'Dubbing preview available: {record.project}'
      body:
        it: È disponibile una nuova anteprima del doppiaggio ({record.target_lang}). Accedi per ascoltarla e segnalare le
          battute da rifare.
        en: A new dubbing preview ({record.target_lang}) is available. Sign in to listen and flag the lines to redo.
      link: previews
  - key: redo_requested
    'on':
      collection: revision_requests
      op: insert
    notify:
      to:
      - owner
      subject:
        it: Il cliente chiede di rifare delle battute
        en: The client asks to redo some lines
      body:
        it: 'Nuova segnalazione sul progetto {record.project}: {record.comment}'
        en: 'New request on project {record.project}: {record.comment}'
      link: revisions
  inputForm:
    title:
      it: Nuovo progetto di doppiaggio
      en: New dubbing project
    fields:
    - name: title
      type: text
      required: true
      label:
        it: Titolo del progetto
        en: Project title
    - name: source_url
      type: url
      label:
        it: Link al video o alla traccia originale
        en: Link to the original video or audio
      help:
        it: 'Il caricamento diretti di video e audio non è ancora disponibile: usa un link.'
        en: 'Direct video/audio upload is not available yet: use a link.'
    - name: transcript_file
      type: file
      accept:
      - txt
      - docx
      - pdf
      - csv
      - json
      maxMb: 10
      label:
        it: Trascrizione con tempi (SRT/testo, facoltativa)
        en: Timed transcript (SRT/text, optional)
    - name: source_lang
      type: select
      required: true
      label:
        it: Lingua di partenza
        en: Source language
      options:
      - value: it
        label: Italiano
      - value: en
        label: English
      - value: es
        label: Español
      - value: fr
        label: Français
      - value: de
        label: Deutsch
      - value: pt
        label: Português
    - name: target_langs
      type: multiselect
      required: true
      label:
        it: Lingue di arrivo
        en: Target languages
      options:
      - value: it
        label: Italiano
      - value: en
        label: English
      - value: es
        label: Español
      - value: fr
        label: Français
      - value: de
        label: Deutsch
      - value: pt
        label: Português
    - name: characters
      type: textarea
      required: true
      maxLength: 1500
      label:
        it: 'Personaggi (nome: descrizione e note sulla voce)'
        en: 'Characters (name: description and voice notes)'
    - name: minutes
      type: number
      required: true
      label:
        it: Durata in minuti
        en: Length in minutes
    - name: client_email
      type: email
      label:
        it: Email del cliente per le anteprime (facoltativa)
        en: Client email for previews (optional)
  data:
    collections:
    - name: script_lines
      description: Timed, translated dubbing lines with speaker, emotion and intensity
      ownedBy: user
      fields:
      - name: project
        type: text
      - name: line_no
        type: number
      - name: start
        type: text
      - name: end
        type: text
      - name: speaker
        type: text
      - name: source_text
        type: textarea
      - name: target_lang
        type: text
      - name: translated_text
        type: textarea
      - name: emotion
        type: text
      - name: intensity
        type: number
      - name: status
        type: select
        options:
        - draft
        - approved
        - redo
    - name: previews
      description: Dubbing previews shared with a client
      ownedBy: user
      fields:
      - name: project
        type: text
      - name: target_lang
        type: text
      - name: client_email
        type: email
      - name: version
        type: number
      - name: status
        type: select
        options:
        - pending_engine
        - ready
        - approved
        - final
      - name: cast
        type: textarea
      - name: notes
        type: textarea
      access:
      - role: user
        where:
          client_email: '{user.email}'
        can:
        - read
    - name: revision_requests
      description: Lines the client wants redone, with a comment
      ownedBy: user
      fields:
      - name: project
        type: text
      - name: line_no
        type: number
      - name: comment
        type: textarea
      - name: client_email
        type: email
      - name: status
        type: select
        options:
        - open
        - done
      access:
      - role: user
        where:
          client_email: '{user.email}'
        can:
        - read
        - write
  views:
  - key: home
    type: page
    title: Doppiaggio Espressivo
    nav: false
    sections:
    - type: hero
      title:
        it: Doppia in altre lingue, **mantenendo l'emozione**.
        en: Dub into other languages, **keeping the emotion**.
      text:
        it: Copione tradotto con tempi, parlanti ed emozioni; revisione del dialoghista; anteprime per il cliente; consegna
          finale.
        en: Translated script with timing, speakers and emotions; dialogue editor review; client previews; final delivery.
      actions:
      - label:
          it: Nuovo progetto
          en: New project
        href: /v/new_project
        style: primary
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Carica e descrivi
          en: Upload and describe
        text:
          it: Lingue, personaggi e materiale originale.
          en: Languages, characters and original material.
        badge: 📥
      - title:
          it: Copione adattato
          en: Adapted script
        text:
          it: Trascrizione, parlanti, traduzione a misura di labiale, emozione e intensità per battuta.
          en: Transcription, speakers, lip-sync-aware translation, emotion and intensity per line.
        badge: 📝
      - title:
          it: Revisione
          en: Review
        text:
          it: Il dialoghista corregge e approva il copione.
          en: The dialogue editor corrects and approves the script.
        badge: ✅
      - title:
          it: Voci e anteprima
          en: Voices and preview
        text:
          it: Una voce coerente per personaggio; il cliente ascolta e segnala le battute da rifare.
          en: One consistent voice per character; the client listens and flags lines to redo.
        badge: 🎙️
    - type: note
      content:
        it: La sintesi vocale è affidata a un motore esterno specializzato. Ogni studio vede solo i propri progetti; i clienti
          solo le anteprime condivise con loro.
        en: Voice synthesis is handled by an external specialised engine. Each studio sees only its own projects; clients
          only the previews shared with them.
  - key: new_project
    type: new_run
    title:
      it: Nuovo progetto
      en: New project
    roles:
    - user
    - admin
  - key: projects
    type: history
    title:
      it: I miei progetti
      en: My projects
    source: run
    roles:
    - user
    - admin
  - key: project_report
    type: report
    source: run
    printable: true
    nav: false
  - key: script_editor
    type: review
    title:
      it: Editor del copione
      en: Script editor
    source: collection:script_lines
    columns:
    - line_no
    - start
    - end
    - speaker
    - source_text
    - translated_text
    - emotion
    - intensity
    - status
    roles:
    - user
    - admin
  - key: approve
    type: approvals
    title:
      it: Approvazioni
      en: Approvals
    approvals:
    - script_approval
    roles:
    - user
    - admin
  - key: previews
    type: table
    title:
      it: Anteprime
      en: Previews
    source: collection:previews
    columns:
    - project
    - target_lang
    - version
    - status
    - notes
    roles:
    - user
    - admin
  - key: revisions
    type: table
    title:
      it: Battute da rifare
      en: Lines to redo
    source: collection:revision_requests
    columns:
    - project
    - line_no
    - comment
    - status
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Crediti
      en: Credits
    roles:
    - user
  notifications:
    emailOnRunDone: true
  billing:
    modes:
    - credits
    signupCredits: 50
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:adapter:
        estimate: 100
        metered: true
      agent:dubber:
        estimate: 150
        metered: true
    packs:
    - key: studio_s
      credits: 1000
      price: 15
      label: Starter
    - key: studio_m
      credits: 5000
      price: 65
      label: Studio
  extensions:
  - key: media_upload
    description: 'Upload of video and audio files is not available yet (run-form files accept documents only): the project
      takes a link and an optional timed transcript. Automatic transcription of audio requires an external speech-to-text
      source.'
  - key: voice_engine
    description: 'Connection to the external expressive voice synthesis engine (render per line, voices per character) is
      not declared: needs the engine''s API host and key (set by an admin). Until then the dubber prepares the render jobs
      and the cast sheet with status pending_engine.'
  - key: video_remux
    description: Re-assembly of the dubbed track and re-muxing onto the video, plus preview playback and final video download,
      need a media processing service not available in the manifest.
  - key: per_minute_credits
    description: Credits are metered on real usage; a fixed price per dubbed minute needs a cost computed from the 'minutes'
      field.
  - key: line_flagging_ui
    description: Clients flag lines to redo by adding records to revision_requests; a dedicated player-with-comments view
      is not available.
