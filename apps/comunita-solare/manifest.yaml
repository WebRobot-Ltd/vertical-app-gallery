apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: comunita-solare
  displayName: Comunità Solare
  tagline:
    it: Promuovi e gestisci la tua comunità energetica rinnovabile.
    en: Promote and manage your renewable energy community.
  description:
    it: Simulatore pubblico di energia condivisa e incentivi GSE, adesione dei membri, approvazione del promotore e ripartizione
      mensile degli incentivi con report per membro e per l'assemblea.
    en: Public simulator of shared energy and GSE incentives, member enrolment, promoter approval and monthly incentive allocation
      with reports for each member and for the assembly.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#17402e'
      accent: '#e8a317'
      background: '#fbfaf4'
      foreground: '#1c2620'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Comunità
      color: primary
    - text: Solare
      color: accent
    button: primary
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Simulatore
        en: Simulator
      href: '#simulatore'
    cta:
      label:
        it: Aderisci
        en: Join
      href: /v/join
  auth:
    method: magic_link
    anonymous:
      agents:
      - simulator
      views:
      - home
      - simulator
      - simulation
    roles:
    - key: admin
      label:
        it: Promotore
        en: Promoter
      assignedBy: admin_emails
    - key: user
      label:
        it: Membro
        en: Member
      assignedBy: signup
  limits:
  - action: agent:simulator
    per: ip
    max: 5
    window: day
    roles:
    - anonymous
  - action: agent:simulator
    per: user
    max: 20
    window: day
    roles:
    - user
  egress:
    hosts:
    - nominatim.openstreetmap.org
    - re.jrc.ec.europa.eu
    notes: Nominatim (OpenStreetMap, ODbL) to geocode addresses within its usage policy; PVGIS (European Commission JRC) for
      photovoltaic production estimates, reuse allowed with attribution.
  agents:
  - key: simulator
    role: main
    description: 'Public simulator: finds the reference primary substation, estimates PV production with PVGIS and computes
      shared energy and expected GSE incentives.'
    profile:
      inline:
        display_name: Simulatore Comunità Solare
        crews:
        - id: simulator
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 14
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un analista di comunità energetiche rinnovabili (CER) italiane. Produci una simulazione per
            una persona che sta valutando se aderire.

            Passi: 1) geocodifica l''indirizzo con lo strumento geocode (Nominatim, parametri q=<indirizzo>, format=json,
            limit=1). 2) Con lo strumento cabine cerca nella raccolta delle cabine primarie quella più vicina (per comune
            o coordinate) e dichiara chiaramente se il dato non è presente: in quel caso di'' che la cabina va verificata
            sulla mappa GSE e non inventarla. 3) Se l''utente ha un impianto, stima la produzione annua con lo strumento pvgis
            (PVcalc: lat, lon, peakpower, loss=14, angle=30, aspect=0, outputformat=json) usando totals.fixed.E_y. Se non
            ha impianto, calcola uno scenario di riferimento con un impianto da 3 kWp per ogni 3000 kWh di consumo e dichiaralo.
            4) Stima l''energia condivisa annua: parte dell''energia immessa contemporanea ai consumi della comunità, secondo
            il profilo di consumo scelto (giorno 45%, misto 30%, sera 15% della produzione immessa come ordine di grandezza
            di autoconsumo virtuale); mostra sempre l''ipotesi. 5) Calcola gli incentivi attesi con le regole GSE indicative:
            tariffa premio sull''energia condivisa di circa 60-80 €/MWh a seconda della taglia dell''impianto (fino a 200
            kW 80, fino a 600 kW 70, oltre 60) con correzione di zona (Nord +10, Centro +4), più la restituzione delle componenti
            tariffarie ARERA di circa 8-10 €/MWh; segnala l''eventuale contributo PNRR a fondo perduto per comuni sotto 50.000
            abitanti. Dichiara che sono stime da verificare con le regole GSE vigenti.

            Non inventare cifre né coordinate. Non dare consulenza fiscale o legale.

            Formato: titolo di primo livello "# Simulazione CER — <comune>", poi ## Cabina primaria di riferimento, ## Produzione
            stimata, ## Energia condivisa, ## Incentivi attesi (tabella per anno), ## Ipotesi e limiti, ## Prossimi passi
            (aderire dal modulo di adesione). Aggiungi un grafico con un blocco ```chart (type bar) che confronta produzione,
            energia immessa ed energia condivisa. Cita PVGIS (Commissione europea, JRC) e OpenStreetMap come fonti.'
          mcp_servers: []
    goalTemplate: 'Indirizzo: {address}

      Consumo annuo: {annual_kwh} kWh

      Profilo di consumo: {profile_label}

      {?has_plant}L''utente ha un impianto fotovoltaico di {plant_kw} kW.{/has_plant}{!has_plant}L''utente non ha un impianto.{/has_plant}

      Data di oggi: {date}. Scrivi in lingua con codice ISO {lang}.'
    appTools:
    - name: geocode
      description: Geocode an address with Nominatim
      action: http
      http:
        method: GET
        url: https://nominatim.openstreetmap.org/search
        attribution: © OpenStreetMap contributors, ODbL
    - name: pvgis
      description: PVGIS PVcalc yearly PV production estimate
      action: http
      http:
        method: GET
        url: https://re.jrc.ec.europa.eu/api/v5_2/PVcalc
        attribution: PVGIS, European Commission JRC
    - name: cabine
      description: Search the primary substations (cabine primarie) catalogue
      action: search
      collection: cabine_primarie
      scope: all
    - name: communities
      description: Read the communities promoted in this app
      action: read
      collection: communities
      scope: all
    output: markdown
    limits:
      maxTurns: 14
      maxBudgetUsd: 0.6
  - key: allocator
    role: scheduled
    description: Every month computes the incentive split among approved members and writes member and assembly reports.
    profile:
      inline:
        display_name: Ripartitore incentivi CER
        crews:
        - id: allocator
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei il contabile della comunità energetica. Ogni mese ripartisci gli incentivi tra i membri approvati.

            Procedura: leggi la comunità (communities) con la sua regola di ripartizione (producer_pct, reserve_pct), i membri
            con status approved (read_members) e le letture del mese precedente (read_readings). Dove mancano letture reali
            stima i consumi da annual_kwh/12 e la produzione con pvgis (potenza plant_kw), marcando la riga come ''stima''.
            Energia condivisa del mese = minimo tra energia immessa totale e consumo totale dei membri (se non hai dati orari,
            dichiaralo). Incentivo totale = energia condivisa x tariffa premio indicativa GSE (80 €/MWh fino a 200 kW, 70
            fino a 600, 60 oltre) + restituzione ARERA circa 8 €/MWh; usa solo valori dichiarati e segnala che vanno verificati
            con la comunicazione GSE. Ripartisci: reserve_pct al fondo comunitario, producer_pct ai produttori in proporzione
            all''energia immessa, il resto ai consumatori in proporzione all''energia condivisa consumata; se la regola manca,
            usa 50% produttori, 50% consumatori e dichiaralo. I conti devono tornare al centesimo.

            Scrittura: per ogni membro chiama write_allocation (member_email, pod, month YYYY-MM, shared_kwh, incentive_eur,
            share_pct, note) e write_member_report (member_email, month, title, report in Markdown breve per il membro con
            i suoi dati, la sua quota e le ipotesi). Poi chiama write_totals una volta (month, community_name, members, consumers,
            producers, shared_kwh, incentive_eur) e write_assembly con il report per l''assemblea (month, title, content).
            Nessun dato personale nel report dell''assemblea: solo aggregati. L''output finale è il report per l''assemblea
            in Markdown che inizia con "# Assemblea — report incentivi <mese>", con ## Sintesi, ## Ripartizione per ruolo,
            ## Fondo comunitario, ## Qualità dei dati (stime vs letture), ## Da verificare, e un blocco ```chart bar della
            ripartizione. Non inventare cifre.'
          mcp_servers: []
    goalTemplate: Calcola la ripartizione degli incentivi per il mese precedente a {date}. Scrivi in lingua con codice ISO
      {lang}.
    appTools:
    - name: communities
      description: Read the community and its allocation rule
      action: read
      collection: communities
      scope: all
    - name: read_members
      description: Read the members of the community
      action: read
      collection: members
      scope: all
    - name: read_readings
      description: Read the meter readings entered by members
      action: read
      collection: readings
      scope: all
    - name: pvgis
      description: PVGIS PVcalc yearly PV production estimate
      action: http
      http:
        method: GET
        url: https://re.jrc.ec.europa.eu/api/v5_2/PVcalc
        attribution: PVGIS, European Commission JRC
    - name: write_allocation
      description: Write the monthly allocation of one member
      action: write
      collection: allocations
      scope: all
    - name: write_member_report
      description: Write the monthly report of one member
      action: write
      collection: member_reports
      scope: all
    - name: write_totals
      description: Write the aggregated monthly totals of the community
      action: write
      collection: community_totals
      scope: all
    - name: write_assembly
      description: Write the monthly assembly report
      action: write
      collection: assembly_reports
      scope: all
    output: markdown
    limits:
      maxTurns: 40
      maxBudgetUsd: 1.5
  inputForm:
    title:
      it: Simula la tua comunità
      en: Simulate your community
    fields:
    - name: address
      type: text
      required: true
      maxLength: 200
      label:
        it: Indirizzo
        en: Address
      help:
        it: Via, numero civico e comune
        en: Street, number and town
    - name: annual_kwh
      type: number
      required: true
      label:
        it: Consumo annuo (kWh)
        en: Annual consumption (kWh)
    - name: profile
      type: select
      required: true
      default: mixed
      label:
        it: Quando consumi di più
        en: When you consume most
      options:
      - value: day
        label:
          it: Di giorno
          en: Daytime
      - value: mixed
        label:
          it: Misto
          en: Mixed
      - value: evening
        label:
          it: Di sera
          en: Evening
    - name: has_plant
      type: boolean
      label:
        it: Ho già un impianto fotovoltaico
        en: I already have a PV plant
    - name: plant_kw
      type: number
      visibleWhen: has_plant == true
      label:
        it: Potenza impianto (kW)
        en: Plant power (kW)
  data:
    collections:
    - name: communities
      description: The communities promoted in this app
      ownedBy: shared
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome della comunità
          en: Community name
      - name: zone
        type: text
        required: true
        label:
          it: Zona
          en: Zone
      - name: comune
        type: city
        label:
          it: Comune
          en: Town
      - name: cabina_code
        type: text
        label:
          it: Cabina primaria
          en: Primary substation
      - name: producer_pct
        type: number
        default: 50
        label:
          it: '% incentivo ai produttori'
          en: '% of incentive to producers'
      - name: reserve_pct
        type: number
        default: 10
        label:
          it: '% al fondo comunitario'
          en: '% to community fund'
      - name: description
        type: textarea
        label:
          it: Descrizione
          en: Description
    - name: cabine_primarie
      description: Primary substations (from GSE maps), loaded by the promoter
      ownedBy: shared
      fields:
      - name: code
        type: text
        required: true
      - name: name
        type: text
        required: true
      - name: comuni
        type: text
      - name: lat
        type: number
      - name: lon
        type: number
    - name: members
      description: Membership applications and members (promoter back office; members see their own)
      ownedBy: org
      retentionDays: 3650
      fields:
      - name: full_name
        type: text
        required: true
        label:
          it: Nome e cognome
          en: Full name
      - name: fiscal_code
        type: text
        required: true
        label:
          it: Codice fiscale
          en: Tax code
      - name: email
        type: email
        required: true
        label:
          it: Email (la stessa del login)
          en: Email (same as login)
      - name: phone
        type: text
        label:
          it: Telefono
          en: Phone
      - name: address
        type: text
        required: true
        label:
          it: Indirizzo
          en: Address
      - name: pod
        type: text
        required: true
        label:
          it: POD
          en: POD
      - name: member_role
        type: select
        required: true
        label:
          it: Ruolo
          en: Role
        options:
        - value: consumer
          label:
            it: Consumatore
            en: Consumer
        - value: producer
          label:
            it: Produttore
            en: Producer
        - value: prosumer
          label:
            it: Prosumer
            en: Prosumer
      - name: plant_kw
        type: number
        label:
          it: Potenza impianto (kW)
          en: Plant power (kW)
      - name: annual_kwh
        type: number
        label:
          it: Consumo annuo (kWh)
          en: Annual consumption (kWh)
      - name: privacy
        type: boolean
        required: true
        label:
          it: Accetto il trattamento dei dati
          en: I accept data processing
      - name: status
        type: select
        default: pending
        label:
          it: Stato
          en: Status
        options:
        - value: pending
          label:
            it: In attesa
            en: Pending
        - value: approved
          label:
            it: Approvata
            en: Approved
        - value: rejected
          label:
            it: Rifiutata
            en: Rejected
      - name: notes
        type: textarea
        label:
          it: Note del promotore
          en: Promoter notes
      access:
      - role: user
        where:
          email: '{user.email}'
    - name: readings
      description: Meter readings entered by hand
      ownedBy: org
      retentionDays: 1825
      fields:
      - name: member_email
        type: email
        required: true
        label:
          it: Email (la stessa del login)
          en: Email (same as login)
      - name: pod
        type: text
        required: true
        label:
          it: POD
          en: POD
      - name: month
        type: text
        required: true
        label:
          it: Mese (AAAA-MM)
          en: Month (YYYY-MM)
      - name: consumed_kwh
        type: number
        label:
          it: Energia prelevata (kWh)
          en: Energy withdrawn (kWh)
      - name: produced_kwh
        type: number
        label:
          it: Energia prodotta (kWh)
          en: Energy produced (kWh)
      - name: fed_in_kwh
        type: number
        label:
          it: Energia immessa (kWh)
          en: Energy fed in (kWh)
      access:
      - role: user
        where:
          member_email: '{user.email}'
    - name: allocations
      description: Monthly incentive allocation per member
      ownedBy: org
      fields:
      - name: member_email
        type: email
      - name: pod
        type: text
      - name: month
        type: text
        label:
          it: Mese
          en: Month
      - name: shared_kwh
        type: number
        label:
          it: Energia condivisa (kWh)
          en: Shared energy (kWh)
      - name: incentive_eur
        type: number
        label:
          it: Incentivo (€)
          en: Incentive (€)
      - name: share_pct
        type: number
        label:
          it: Quota %
          en: Share %
      - name: note
        type: text
        label:
          it: Note
          en: Notes
      access:
      - role: user
        where:
          member_email: '{user.email}'
    - name: member_reports
      description: Monthly report of each member
      ownedBy: org
      fields:
      - name: member_email
        type: email
      - name: month
        type: text
        label:
          it: Mese
          en: Month
      - name: title
        type: text
        label:
          it: Titolo
          en: Title
      - name: report
        type: textarea
        label:
          it: Report
          en: Report
      access:
      - role: user
        where:
          member_email: '{user.email}'
    - name: community_totals
      description: Aggregated monthly totals of the community, visible to every member
      ownedBy: app
      fields:
      - name: month
        type: text
        label:
          it: Mese
          en: Month
      - name: community_name
        type: text
        label:
          it: Comunità
          en: Community
      - name: members
        type: number
        label:
          it: Membri
          en: Members
      - name: consumers
        type: number
        label:
          it: Consumatori
          en: Consumers
      - name: producers
        type: number
        label:
          it: Produttori
          en: Producers
      - name: shared_kwh
        type: number
        label:
          it: Energia condivisa (kWh)
          en: Shared energy (kWh)
      - name: incentive_eur
        type: number
        label:
          it: Incentivi (€)
          en: Incentives (€)
    - name: assembly_reports
      description: Monthly report for the assembly (aggregates only)
      ownedBy: app
      fields:
      - name: month
        type: text
        label:
          it: Mese
          en: Month
      - name: title
        type: text
        label:
          it: Titolo
          en: Title
      - name: content
        type: textarea
        label:
          it: Report
          en: Report
  views:
  - key: home
    type: page
    title: Comunità Solare
    nav: false
    sections:
    - type: hero
      eyebrow:
        it: Comunità energetiche rinnovabili
        en: Renewable energy communities
      title:
        it: Condividi l'energia pulita del tuo territorio e **guadagna gli incentivi**.
        en: Share your area's clean energy and **earn the incentives**.
      text:
        it: Scopri in un minuto quanta energia potresti condividere e quanti incentivi GSE aspettarti. Aderire è gratuito.
        en: Find out in a minute how much energy you could share and which GSE incentives to expect. Joining is free.
      actions:
      - label:
          it: Prova il simulatore
          en: Try the simulator
        href: '#simulatore'
        style: primary
      - label:
          it: Aderisci
          en: Join
        href: /v/join
        style: ghost
      note:
        it: 'Per comuni e cooperative che promuovono una CER: accedi come promotore.'
        en: 'For towns and cooperatives promoting a CER: sign in as promoter.'
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Simula
          en: Simulate
        text:
          it: 'Indirizzo, consumi e potenza: troviamo la cabina primaria, stimiamo la produzione con PVGIS e calcoliamo energia
            condivisa e incentivi.'
          en: 'Address, consumption and power: we find the primary substation, estimate production with PVGIS and compute
            shared energy and incentives.'
        badge: '1'
      - title:
          it: Aderisci
          en: Join
        text:
          it: Compili il modulo con dati, POD e ruolo; il promotore approva l'ingresso.
          en: Fill in the form with your details, POD and role; the promoter approves your entry.
        badge: '2'
      - title:
          it: Ricevi la tua quota
          en: Get your share
        text:
          it: Ogni mese l'agente ripartisce gli incentivi e ti manda il tuo report. Vedi solo i tuoi dati e il totale della
            comunità.
          en: Every month the agent splits the incentives and sends you your report. You see only your data and the community
            total.
        badge: '3'
    - type: view
      id: simulatore
      title:
        it: Simulatore
        en: Simulator
      view: simulator
    - type: note
      content:
        it: 'Le stime usano regole GSE indicative e vanno verificate; non sono consulenza fiscale o legale. Fonti: PVGIS (Commissione
          europea, JRC), OpenStreetMap.'
        en: 'Estimates use indicative GSE rules and must be verified; this is not tax or legal advice. Sources: PVGIS (European
          Commission, JRC), OpenStreetMap.'
  - key: simulator
    type: new_run
    title:
      it: Simulatore
      en: Simulator
    nav: true
  - key: simulation
    type: report
    source: run
    printable: true
    nav: false
  - key: join
    type: form
    title:
      it: Modulo di adesione
      en: Membership form
    collection: members
    fields:
    - full_name
    - fiscal_code
    - email
    - phone
    - address
    - pod
    - member_role
    - plant_kw
    - annual_kwh
    - privacy
    submit:
      label:
        it: Invia adesione
        en: Submit
      message:
        it: 'Adesione inviata: il promotore la esaminerà e riceverai un''email.'
        en: 'Application sent: the promoter will review it and you will get an email.'
      redirect: my_membership
    edit: false
    roles:
    - user
    - admin
  - key: my_membership
    type: table
    title:
      it: La mia adesione
      en: My membership
    source: collection:members
    columns:
    - full_name
    - pod
    - member_role
    - status
    roles:
    - user
    - admin
  - key: add_reading
    type: form
    title:
      it: Inserisci lettura
      en: Add reading
    collection: readings
    submit:
      label:
        it: Salva lettura
        en: Save reading
      message:
        it: Lettura salvata.
        en: Reading saved.
      redirect: my_readings
    edit: false
    roles:
    - user
    - admin
  - key: my_readings
    type: table
    title:
      it: Le mie letture
      en: My readings
    source: collection:readings
    columns:
    - month
    - pod
    - consumed_kwh
    - produced_kwh
    - fed_in_kwh
    export: true
    roles:
    - user
    - admin
  - key: my_allocations
    type: table
    title:
      it: I miei incentivi
      en: My incentives
    source: collection:allocations
    columns:
    - month
    - shared_kwh
    - incentive_eur
    - share_pct
    - note
    export: true
    roles:
    - user
    - admin
  - key: my_reports
    type: list
    title:
      it: I miei report
      en: My reports
    source: collection:member_reports
    columns:
    - month
    - title
    - report
    roles:
    - user
    - admin
  - key: community
    type: dashboard
    title:
      it: La comunità
      en: The community
    children:
    - totals_chart
    - totals_table
    - assembly_list
    roles:
    - user
    - admin
  - key: totals_chart
    type: chart
    source: collection:community_totals
    data:
      display: chart
      chart: bar
      fields:
      - key: month
        label:
          it: Mese
          en: Month
      - key: shared_kwh
        label:
          it: Energia condivisa (kWh)
          en: Shared energy (kWh)
      - key: incentive_eur
        label:
          it: Incentivi (€)
          en: Incentives (€)
      sort:
        field: month
        dir: asc
      limit: 24
    nav: false
  - key: totals_table
    type: table
    source: collection:community_totals
    columns:
    - month
    - members
    - consumers
    - producers
    - shared_kwh
    - incentive_eur
    nav: false
  - key: assembly_list
    type: list
    source: collection:assembly_reports
    columns:
    - month
    - title
    - content
    nav: false
  - key: community_setup
    type: form
    title:
      it: Comunità
      en: Community
    collection: communities
    submit:
      label:
        it: Salva comunità
        en: Save community
      message:
        it: Comunità salvata.
        en: Community saved.
    edit: true
    roles:
    - admin
  - key: cabine_setup
    type: form
    title:
      it: Cabine primarie
      en: Primary substations
    collection: cabine_primarie
    submit:
      label:
        it: Aggiungi cabina
        en: Add substation
      message:
        it: Cabina salvata.
        en: Substation saved.
    edit: true
    roles:
    - admin
  - key: members_admin
    type: table
    title:
      it: Domande e membri
      en: Applications and members
    source: collection:members
    columns:
    - full_name
    - email
    - pod
    - member_role
    - plant_kw
    - annual_kwh
    - status
    export: true
    roles:
    - admin
  - key: review_member
    type: form
    title:
      it: Approva adesione
      en: Review application
    collection: members
    fields:
    - status
    - notes
    submit:
      label:
        it: Salva decisione
        en: Save decision
      message:
        it: Decisione salvata.
        en: Decision saved.
      redirect: members_admin
    edit: true
    roles:
    - admin
    nav: false
  - key: account
    type: account
    title:
      it: Canone annuale
      en: Annual fee
    roles:
    - admin
  schedules:
  - agent: allocator
    cron: 0 6 5 * *
    action: run
    owner: app
    goal: Calcola la ripartizione degli incentivi del mese precedente e scrivi i report.
    deliver:
      to: admins
      subject: Report mensile per l'assemblea {date}
      onlyIfNew: true
  triggers:
  - key: new_application
    'on':
      collection: members
      op: insert
    notify:
      to: admins
      subject:
        it: 'Nuova adesione: {record.full_name}'
        en: 'New application: {record.full_name}'
      body:
        it: Nuova richiesta di adesione ({record.member_role}, POD {record.pod}). Apri l'elenco per approvarla.
        en: New membership application ({record.member_role}, POD {record.pod}). Open the list to review it.
      link: members_admin
  - key: member_approved
    'on':
      collection: members
      op: update
      where:
        status: approved
    notify:
      to:
      - record.email
      subject:
        it: La tua adesione è stata approvata
        en: Your membership was approved
      body:
        it: Benvenuto/a nella comunità! Da ora puoi inserire le letture e vedere i tuoi incentivi.
        en: Welcome to the community! You can now enter readings and see your incentives.
      link: my_membership
  - key: member_rejected
    'on':
      collection: members
      op: update
      where:
        status: rejected
    notify:
      to:
      - record.email
      subject:
        it: Esito della tua richiesta di adesione
        en: Outcome of your application
      body:
        it: La tua richiesta non è stata accettata. Contatta il promotore per maggiori informazioni.
        en: Your application was not accepted. Contact the promoter for details.
      link: my_membership
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: promoter_s
      price: 290
      interval: year
      label:
        it: Promotore S — fino a 100 membri
        en: Promoter S — up to 100 members
      includes:
      - up to 100 members
      roles:
      - admin
    - key: promoter_m
      price: 690
      interval: year
      label:
        it: Promotore M — fino a 500 membri
        en: Promoter M — up to 500 members
      includes:
      - up to 500 members
      roles:
      - admin
    - key: promoter_l
      price: 1490
      interval: year
      label:
        it: Promotore L — fino a 2000 membri
        en: Promoter L — up to 2000 members
      includes:
      - up to 2000 members
      roles:
      - admin
  notifications:
    emailOnRunDone: false
  extensions:
  - key: gse_terna_delegated_metering
    description: 'Reading real measures with the member''s delegation through GSE and Terna (OAuth/delegation) is not available
      yet: for now consumption comes from estimates and manual readings.'
  - key: gse_cabine_map_import
    description: 'There is no public GSE API for the primary substation maps: the promoter loads the substations of the zone
      in the ''cabine_primarie'' collection, and the simulator searches them.'
  - key: member_cap_by_plan
    description: The cap on members per annual plan (100/500/2000) is described in the plans but not enforced automatically.
