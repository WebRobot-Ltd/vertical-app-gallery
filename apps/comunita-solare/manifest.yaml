  views:
  - key: home
    type: page
    title: Comunità Solare
    nav: false
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow:
        it: Comunità energetiche rinnovabili
        en: Renewable energy communities
      title:
        it: Condividi l'energia pulita, **ripartisci gli incentivi** con trasparenza.
        en: Share clean energy and **split incentives** transparently.
      text:
        it: Simula gratis quanta energia può condividere la tua comunità e quali incentivi GSE puoi aspettarti. Aderisci online,
          il promotore approva, e ogni mese l'app ripartisce gli incentivi tra i membri.
        en: Simulate for free how much energy your community can share and which GSE incentives to expect. Join online, the
          promoter approves, and every month the app splits the incentives among members.
      actions:
      - label:
          it: Prova il simulatore
          en: Try the simulator
        href: /v/new
        style: primary
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: ghost
      aside: '<div style="padding:16px"><strong>Esempio · Example</strong><br>Consumo 4.500 kWh · impianto 6 kW<br>Produzione
        PVGIS ≈ 8.000 kWh/anno<br>Incentivo atteso: da stimare nel simulatore</div>'
      note:
        it: L'adesione per i cittadini è gratuita.
        en: Joining is free for citizens.
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Simula
          en: Simulate
        text:
          it: 'Inserisci indirizzo, consumi e, se c''è, la potenza dell''impianto: produzione da PVGIS, energia condivisa
            e incentivi attesi.'
          en: 'Enter address, consumption and plant power if any: PVGIS production, shared energy and expected incentives.'
        badge: ☀️
      - title:
          it: Aderisci
          en: Join
        text:
          it: Compili il modulo con dati anagrafici, POD e ruolo (consumatore, produttore, prosumer).
          en: Fill in the form with personal data, POD and role (consumer, producer, prosumer).
        badge: 📝
      - title:
          it: Il promotore approva
          en: The promoter approves
        text:
          it: Comune o cooperativa verifica la domanda e accetta l'ingresso.
          en: The municipality or cooperative checks the application and accepts you.
        badge: ✅
      - title:
          it: Ogni mese, la tua quota
          en: Every month, your share
        text:
          it: 'Un agente calcola la ripartizione: tu vedi il tuo estratto e i totali della comunità, non i dati degli altri.'
          en: 'An agent computes the split: you see your own statement and community totals, never other members'' data.'
        badge: 📊
    - type: view
      id: simulatore
      title:
        it: Simulatore
        en: Simulator
      view: new
    - type: cards
      id: promotori
      title:
        it: Per i promotori
        en: For promoters
      intro:
        it: Comuni e cooperative creano la comunità, approvano i membri e ricevono ogni mese il report per l'assemblea. Canone
          annuale in base al numero di membri.
        en: Municipalities and cooperatives create the community, approve members and get the monthly assembly report. Yearly
          fee based on member count.
      items:
      - title: Fino a 50 membri
        text: € 290 / anno
      - title: Fino a 200 membri
        text: € 790 / anno
      - title: Fino a 1000 membri
        text: € 1.990 / anno
    - type: note
      content:
        it: 'Le stime sono indicative: i parametri GSE vanno verificati sul sito ufficiale. Non è consulenza fiscale, legale
          o finanziaria. Fonti: PVGIS © Unione Europea; © OpenStreetMap contributors.'
        en: 'Estimates are indicative: GSE parameters must be checked on the official site. Not tax, legal or financial advice.
          Sources: PVGIS © European Union; © OpenStreetMap contributors.'
  - key: new
    type: new_run
    title:
      it: Simulatore e servizi
      en: Simulator and services
  - key: simulation
