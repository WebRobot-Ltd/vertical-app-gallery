apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: comunita-solare
  displayName: Comunità Solare
  tagline:
    it: Promuovi e gestisci la tua comunità energetica rinnovabile.
    en: Promote and run your renewable energy community.
  description:
    it: Un simulatore pubblico stima produzione, energia condivisa e incentivi attesi; chi è interessato aderisce online,
      il promotore approva e ogni mese un agente ripartisce gli incentivi tra i membri.
    en: A public simulator estimates production, shared energy and expected incentives; interested people join online, the
      promoter approves and every month an agent splits the incentives among members.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#0b3c5d'
      accent: '#f2a900'
      background: '#fffaf0'
      foreground: '#1d2733'
    fonts:
      body: Inter
      display: Poppins
    wordmark:
    - text: Comunità
      color: primary
    - text: Solare
      color: accent
    button: primary
    width: wide
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Simulatore
        en: Simulator
      href: '#simulatore'
    - label:
        it: Per i promotori
        en: For promoters
      href: '#promotori'
    cta:
      label:
        it: Simula ora
        en: Simulate now
      href: /v/new
  auth:
    method: magic_link
    anonymous:
      agents:
      - simulator
      views:
      - home
      - new
      - simulation
    roles:
    - key: admin
      label:
        it: Promotore
        en: Promoter
      assignedBy: admin_emails
    - key: user
      label:
        it: Membro
        en: Member
      assignedBy: signup
  limits:
  - action: agent:simulator
    per: ip
    max: 10
    window: day
    roles:
    - anonymous
  - action: run
    per: user
    max: 30
    window: day
    roles:
    - user
  agents:
  - key: simulator
    role: main
    description: 'Public simulator: geocodes the address, estimates PV production with PVGIS, estimates shared energy and
      expected GSE incentives.'
    when: mode == 'simulate'
    profile:
      inline:
        display_name: Simulatore Comunità Solare
        crews:
        - id: simulator
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un analista di comunità energetiche rinnovabili (CER) italiane. Produci una simulazione per
            un cittadino o un''impresa.


            PASSI

            1. Geocodifica l''indirizzo con lo strumento geocode (query: q=<indirizzo>, format=json, limit=1, countrycodes=it).
            Se non trovi nulla, chiedi un indirizzo più preciso nel report e fermati.

            2. Stima la produzione con pvgis_calc (GET, query: lat=<lat>&lon=<lon>&peakpower=<kWp>&loss=14&angle=30&aspect=0&outputformat=json).
            Leggi outputs.totals.fixed.E_y (kWh/anno). Se l''utente non ha un impianto, simula un impianto di riferimento
            di 1 kWp ogni 1200 kWh di consumo annuo (massimo 20 kWp) e dichiaralo come ipotesi.

            3. Cabina primaria: la mappa GSE delle cabine primarie non è interrogabile da questo strumento. Se l''utente ha
            indicato un codice o nome di cabina primaria usalo; altrimenti scrivi chiaramente che l''area di riferimento va
            verificata sulla mappa ufficiale GSE (portale GSE, sezione CER) e che tutti i membri devono ricadere sotto la
            stessa cabina primaria. Se è indicata una comunità, leggila con read_communities e confronta zona e cabina.

            4. Energia condivisa: è la quota di produzione che coincide, ora per ora, con i consumi dei membri. Senza curve
            orarie dai uno scenario prudente, base e ottimistico (indicativamente il 30%, 45% e 60% della produzione, mai
            oltre il consumo annuo) e dichiara che è una stima.

            5. Incentivi (DM CACER 414/2023 e TIAD, valori indicativi da verificare sul sito GSE): tariffa premio sull''energia
            condivisa per impianti fino a 200 kW pari a 60 €/MWh + una parte variabile legata al prezzo zonale dell''energia,
            con tetto 120 €/MWh, più una correzione per zona (centro-nord) ; valorizzazione ARERA dell''energia condivisa
            di ordine 8-10 €/MWh; contributo PNRR in conto capitale fino al 40% per impianti in comuni sotto i 50.000 abitanti,
            se applicabile. Non inventare parametri: se non sei sicuro di un valore, dai un intervallo e segnalalo.


            REPORT (nella lingua indicata): inizia con un titolo di livello 1 "# Simulazione CER — <comune>". Poi ## Sintesi
            (3 numeri chiave), ## Dati di partenza e ipotesi, ## Produzione stimata (PVGIS), ## Energia condivisa e incentivi
            attesi (tabella con scenari prudente/base/ottimistico, in kWh e €/anno), ## Cabina primaria e fattibilità, ##
            Prossimi passi (aderire a una comunità). Aggiungi un grafico come blocco ```chart con type bar sugli scenari (incentivi
            €/anno). Cita le fonti: PVGIS © Unione Europea, OpenStreetMap contributors. Termina con: stima indicativa, non
            consulenza fiscale, legale o finanziaria. Mai inventare cifre.'
          mcp_servers: []
    goalTemplate: 'Simulazione pubblica.

      Indirizzo: {address}

      Consumo annuo: {annual_kwh} kWh

      {?plant_kw}Impianto esistente: {plant_kw} kW.{/plant_kw}{!plant_kw}Nessun impianto esistente.{/plant_kw}

      {?cabina_primaria}Cabina primaria indicata: {cabina_primaria}{/cabina_primaria}

      {?community}Comunità di interesse: {community}{/community}

      Data di oggi: {date}. Scrivi il report nella lingua con codice ISO {lang}.'
    appTools:
    - name: geocode
      description: Geocode an address (OpenStreetMap Nominatim)
      action: http
      http:
        method: GET
        url: https://nominatim.openstreetmap.org/search
        attribution: © OpenStreetMap contributors, ODbL
        maxBytes: 50000
    - name: pvgis_calc
      description: PVGIS PV yearly production estimate (PVcalc)
      action: http
      http:
        method: GET
        url: https://re.jrc.ec.europa.eu/api/v5_2/PVcalc
        attribution: PVGIS © European Union, 2001-2026
        maxBytes: 200000
    - name: read_communities
      description: Read the communities created by promoters
      action: read
      collection: communities
      scope: all
    output: markdown
    limits:
      maxTurns: 10
      maxBudgetUsd: 0.5
  - key: community_setup
    role: setup
    description: Creates or updates a community on behalf of the promoter (admin only).
    when: mode == 'community'
    profile:
      inline:
        display_name: Creazione comunità
        crews:
        - id: community_setup
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 4
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Registri una comunità energetica. Procedi SOLO se il ruolo dell''utente è admin: altrimenti rispondi
            "# Operazione non consentita" con una riga di spiegazione e non scrivere nulla. Se admin, salva con lo strumento
            save_community un record con name, zone, municipalities, promoter_type, primary_substation, notes (solo i dati
            forniti, niente invenzioni). Poi rispondi con "# Comunità <nome> creata" e un riepilogo breve di cosa è stato
            salvato e dei passi successivi (invitare i membri a usare il modulo di adesione).'
    goalTemplate: 'Ruolo utente: {role}

      Crea la comunità: nome {community_name}, zona {zone}, tipo promotore {promoter_type_label}.

      {?cabina_primaria}Cabina primaria: {cabina_primaria}{/cabina_primaria}

      {?notes}Note e statuto: {notes}{/notes}

      Lingua: {lang}.'
    appTools:
    - name: save_community
      description: Create or update a community record
      action: write
      collection: communities
      scope: all
    output: markdown
  - key: joiner
    role: main
    description: Takes a membership application, stores it and asks the promoter to approve.
    when: mode == 'join'
    awaits:
    - membership
    profile:
      inline:
        display_name: Adesione Comunità Solare
        crews:
        - id: joiner
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Gestisci le domande di adesione a una comunità energetica. Passi: 1) verifica che nome, codice fiscale,
            POD (formato IT + 3 cifre + E + 8 cifre alfanumeriche, indicativo), ruolo e consenso al trattamento dati siano
            presenti; se manca il consenso o un dato, non salvare e spiega cosa manca. 2) Salva il record del richiedente
            con save_member (status "pending"). 3) Salva la riga del registro del promotore con save_roster (community, name,
            pod, member_role, plant_kw, annual_kwh_est, status "pending"). 4) Chiama request_membership con nome, POD e ruolo.
            5) Rispondi con "# Domanda di adesione inviata" e spiega che il promotore deve approvare l''ingresso, e che l''adesione
            è gratuita. Non chiedere né salvare altri dati personali.'
    goalTemplate: 'Domanda di adesione.

      Comunità: {community}

      Nome e cognome: {full_name}

      Codice fiscale: {tax_code}

      Indirizzo: {join_address}

      POD: {pod}

      Ruolo: {member_role_label}

      {?plant_kw}Potenza impianto: {plant_kw} kW{/plant_kw}

      {?annual_kwh}Consumo annuo stimato: {annual_kwh} kWh{/annual_kwh}

      Consenso al trattamento dati: {consent}

      Lingua: {lang}.'
    appTools:
    - name: save_member
      description: Store the applicant's own membership record
      action: write
      collection: members
      scope: user
    - name: save_roster
      description: Store the promoter's roster row
      action: write
      collection: roster
      scope: all
    output: markdown
  - key: activator
    role: helper
    description: Applies the promoter's decision to the member record and the roster.
    profile:
      inline:
        display_name: Attivazione membro
        crews:
        - id: activator
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 4
          max_budget_usd: 0.1
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Ricevi l''esito di una decisione sull''adesione (approved, rejected o timeout). Aggiorna lo status
            del record del membro con update_member e quello della riga di registro con update_roster (stesso POD): "active"
            se approved, "rejected" altrimenti. Non toccare altri campi. Rispondi con "# Adesione aggiornata" e una riga di
            esito.'
    appTools:
    - name: update_member
      description: Update the status of the member's own record
      action: write
      collection: members
      scope: user
    - name: update_roster
      description: Update the status of the roster row
      action: write
      collection: roster
      scope: all
    output: markdown
  - key: reader
    role: helper
    description: Records a manual meter reading for a member.
    when: mode == 'reading'
    profile:
      inline:
        display_name: Lettura manuale
        crews:
        - id: reader
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 4
          max_budget_usd: 0.1
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: Registri una lettura inserita a mano da un membro. Controlla che i valori siano numeri non negativi
            e che il periodo sia nel formato AAAA-MM. Salva con save_reading (pod, period, kwh_consumed, kwh_produced, kwh_fed_in,
            source "manual") e con save_community_reading (stessi campi più community). Se un valore è incoerente (immesso
            > prodotto) segnalalo ma salva comunque con source "manual". Rispondi con "# Lettura registrata" e un riepilogo.
    goalTemplate: 'Lettura manuale. POD {pod}, periodo {period}, consumo {kwh_consumed} kWh, produzione {kwh_produced} kWh,
      immessa in rete {kwh_fed_in} kWh. Comunità: {community}. Lingua: {lang}.'
    appTools:
    - name: save_reading
      description: Store the member's own reading
      action: write
      collection: readings
      scope: user
    - name: save_community_reading
      description: Store the reading in the promoter's back office
      action: write
      collection: community_readings
      scope: all
    output: markdown
  - key: allocator
    role: scheduled
    description: 'Monthly: computes shared energy, the incentive split among members and the report for the assembly.'
    profile:
      inline:
        display_name: Ripartizione incentivi
        crews:
        - id: allocator
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 20
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: "Sei il tesoriere di una comunità energetica rinnovabile. Una volta al mese calcoli la ripartizione\
            \ degli incentivi del mese precedente.\n\nDATI: leggi con read_roster i membri con status active, con read_community_readings\
            \ le letture del mese (stime o inserite a mano: indica per ogni membro la fonte) e con read_communities le regole\
            \ della comunità. L'importo totale degli incentivi del mese lo fornisce il promotore nelle note della comunità\
            \ o nell'obiettivo; se manca, NON inventarlo: calcola una stima indicando chiaramente \"stima\" con tariffa premio\
            \ e valorizzazione dichiarate, oppure segnala la mancanza.\nCALCOLO: energia condivisa = min(immessa totale dei\
            \ produttori, prelevata totale dei consumatori) sul mese (senza curve orarie è un'approssimazione, dichiaralo).\
            \ Ripartizione: la quota dei produttori e dei consumatori segue la regola dello statuto (se assente: 50% ai produttori\
            \ in proporzione all'energia immessa condivisa, 50% ai consumatori in proporzione ai consumi, con eventuale quota\
            \ al fondo comune dichiarata). Verifica che la somma delle quote sia uguale al totale.\nSCRITTURA: per ogni membro\
            \ salva con save_allocation (month, pod, name, shared_kwh, incentive_eur, share_pct). \nREPORT: titolo \"# Ripartizione\
            \ incentivi — <mese AAAA-MM>\". Sezioni: ## Sintesi per l'assemblea (membri, energia condivisa, incentivi, autoconsumo\
            \ %), ## Regole applicate, ## Ripartizione per membro (tabella: nome, ruolo, kWh condivisi, €, %), ## Anomalie\
            \ e dati mancanti, ## Decisioni da prendere. Aggiungi un grafico ```chart bar con gli importi per membro. Alla\
            \ fine, un blocco JSON ```json con {\"month\":\"AAAA-MM\",\"members\":N,\"produced_kwh\":..,\"consumed_kwh\":..,\"\
            shared_kwh\":..,\"incentive_eur\":..,\"self_consumption_pct\":..,\"unit_value_eur_per_kwh\":..,\"producer_share_pct\"\
            :..}: sono solo totali aggregati, senza nomi né POD. Mai inventare cifre; non è consulenza fiscale."
    goalTemplate: 'Calcola la ripartizione degli incentivi per il mese precedente a {date}. Lingua: italiano.'
    appTools:
    - name: read_roster
      description: Read the promoter's roster
      action: read
      collection: roster
      scope: all
    - name: read_community_readings
      description: Read members' readings
      action: read
      collection: community_readings
      scope: all
    - name: read_communities
      description: Read the communities created by promoters
      action: read
      collection: communities
      scope: all
    - name: save_allocation
      description: Store a member's allocation
      action: write
      collection: allocations
      scope: all
    output: markdown+json
    writesTo:
      collection: community_totals
      parse: json_last
      keyBy: month
    limits:
      maxTurns: 20
      maxBudgetUsd: 1.0
  - key: statement
    role: helper
    description: 'Monthly personal statement for one member: own data plus community totals.'
    profile:
      inline:
        display_name: Estratto membro
        crews:
        - id: statement
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Scrivi l''estratto mensile per UN membro di una comunità energetica. Leggi con read_my_member il
            suo record, con read_my_readings le sue letture e con read_totals i totali aggregati della comunità (community_totals)
            dell''ultimo mese. Calcola la sua quota con le regole indicate nei totali: consumatore = consumo / consumo totale
            × quota consumatori; produttore = energia immessa / totale immesso × quota produttori; prosumer entrambe. Se mancano
            letture del mese, dillo e usa solo ciò che c''è senza inventare. Non mostrare mai dati di altri membri. Titolo
            "# Estratto <mese> — <nome>"; sezioni ## I tuoi numeri, ## La tua quota di incentivi (stima), ## La comunità nel
            suo insieme, ## Cosa fare (es. inserire la lettura). Aggiungi un grafico ```chart bar tra il tuo consumo/produzione
            e la media della comunità solo se hai i dati reali.'
    goalTemplate: 'Estratto del mese precedente a {date} per il POD {pod}. Lingua: {lang}.'
    appTools:
    - name: read_my_member
      description: The member's own record
      action: read
      collection: members
      scope: user
    - name: read_my_readings
      description: The member's own readings
      action: read
      collection: readings
      scope: user
    - name: read_totals
      description: Aggregated community totals
      action: read
      collection: community_totals
      scope: all
    output: markdown
    writesTo:
      collection: statements
      parse: whole
    memory: none
  templates:
  - key: my_statement
    title:
      it: Il mio estratto mensile
      en: My monthly statement
    description:
      it: 'Ogni mese ricevi il tuo estratto: consumi, quota di incentivi e totale della comunità.'
      en: 'Every month you get your statement: usage, incentive share and community total.'
    agent: statement
    params:
    - name: pod
      type: text
      required: true
      label: POD
    schedule:
      cron: 0 8 5 * *
      userCanChange: false
    maxPerUser: 3
    roles:
    - user
    - admin
    goal: 'Estratto del mese precedente a {date} per "{instance}" (POD {pod}). Lingua: {lang}.'
  triggers:
  - key: on_membership_decision
    description: Apply the promoter's decision to the member
    'on':
      approval: membership
      decision: any
    start:
      agent: activator
    goal: 'Esito dell''adesione: {event}. Aggiorna lo status del membro e della riga di registro.'
    asUser: true
  approvals:
  - key: membership
    title:
      it: Approva ingresso in comunità
      en: Approve community entry
    description: Il promotore verifica POD, ruolo e cabina primaria prima di accettare il membro.
    role: admin
    decidedBy: role
    fields:
    - full_name
    - pod
    - member_role
    - community
    timeoutMinutes: 10080
    onTimeout: reject
  schedules:
  - agent: allocator
    action: run
    cron: 0 6 3 * *
    owner: app
    goal: Calcola la ripartizione degli incentivi del mese precedente e produci il report per l'assemblea.
  egress:
    hosts:
    - re.jrc.ec.europa.eu
    - nominatim.openstreetmap.org
    notes: 'PVGIS (EU JRC): free reuse incl. commercial, attribution required. Nominatim (OpenStreetMap, ODbL): attribution
      required; low volume, limited per IP and cached by the runtime where possible.'
  inputForm:
    title:
      it: Simulatore e servizi
      en: Simulator and services
    fields:
    - name: mode
      type: select
      required: true
      default: simulate
      label:
        it: Cosa vuoi fare
        en: What do you want to do
      options:
      - value: simulate
        label:
          it: Simulare la mia comunità (pubblico)
          en: Simulate my community (public)
      - value: join
        label:
          it: Aderire a una comunità (accesso richiesto)
          en: Join a community (login required)
      - value: reading
        label:
          it: Inserire una lettura (membro)
          en: Enter a reading (member)
      - value: community
        label:
          it: Creare una comunità (promotore)
          en: Create a community (promoter)
    - name: address
      type: text
      label:
        it: Indirizzo della fornitura
        en: Supply address
      visibleWhen: mode == 'simulate'
      help:
        it: Via, numero, comune
        en: Street, number, town
    - name: annual_kwh
      type: number
      label:
        it: Consumo annuo (kWh)
        en: Yearly consumption (kWh)
      visibleWhen: mode == 'simulate'
    - name: plant_kw
      type: number
      label:
        it: Potenza impianto, se presente (kW)
        en: Plant power, if any (kW)
      visibleWhen: mode == 'simulate'
    - name: cabina_primaria
      type: text
      label:
        it: Cabina primaria (se la conosci)
        en: Primary substation (if known)
      help:
        it: Dalla mappa GSE. Se vuoto, l'app ti dice come verificarla.
        en: From the GSE map. If empty, the app tells you how to check it.
      visibleWhen: mode == 'simulate'
    - name: community
      type: text
      label:
        it: Comunità
        en: Community
      optionsFrom: collection:communities
      help:
        it: Nome della comunità (facoltativo nel simulatore)
        en: Community name (optional in the simulator)
    - name: full_name
      type: text
      label:
        it: Nome e cognome
        en: Full name
      visibleWhen: mode == 'join'
    - name: tax_code
      type: text
      label:
        it: Codice fiscale
        en: Tax code
      visibleWhen: mode == 'join'
    - name: join_address
      type: text
      label:
        it: Indirizzo
        en: Address
      visibleWhen: mode == 'join'
    - name: pod
      type: text
      label: POD
      visibleWhen: mode == 'join'
      help:
        it: Lo trovi in bolletta (IT…E…)
        en: On your bill (IT…E…)
    - name: member_role
      type: select
      label:
        it: Ruolo
        en: Role
      visibleWhen: mode == 'join'
      options:
      - value: consumer
        label:
          it: Consumatore
          en: Consumer
      - value: producer
        label:
          it: Produttore
          en: Producer
      - value: prosumer
        label: Prosumer
    - name: consent
      type: boolean
      label:
        it: Acconsento al trattamento dei dati per la gestione della comunità
        en: I consent to data processing for community management
      visibleWhen: mode == 'join'
    - name: period
      type: text
      label:
        it: Periodo (AAAA-MM)
        en: Period (YYYY-MM)
      visibleWhen: mode == 'reading'
    - name: kwh_consumed
      type: number
      label:
        it: Energia prelevata (kWh)
        en: Energy drawn (kWh)
      visibleWhen: mode == 'reading'
