      - monthly allocation and assembly report
      roles:
      - admin
    - key: promoter_200
      price: 790
      interval: year
      label:
        it: Promotore — fino a 200 membri
        en: Promoter — up to 200 members
      includes:
      - up to 200 members
      - monthly allocation and assembly report
      roles:
      - admin
    - key: promoter_1000
      price: 1990
      interval: year
      label:
        it: Promotore — fino a 1000 membri
        en: Promoter — up to 1000 members
      includes:
      - up to 1000 members
      - monthly allocation and assembly report
      roles:
      - admin
  extensions:
  - key: gse_primary_substation_map
    description: 'The GSE primary substation map has no open API usable by the app: the simulator asks for the substation
      code and otherwise tells the user to verify it on the official GSE map.'
  - key: delegated_metering
    description: 'Reading real measures through GSE and Terna with each member''s delegation needs per-customer credentials/connectors,
      not available yet. Today: estimates and manual readings.'
  - key: fee_by_member_count
    description: Annual fee tiers are plans chosen by the promoter; automatic tier upgrade when the roster exceeds the plan's
      member limit is not enforced.
  - key: notifications
    description: 'No emails to members or promoters (application received, approval, monthly statement ready): they find them
      in the app.'
  - key: file_upload
    description: 'No document upload (ID, bills): data is typed in the form.'
