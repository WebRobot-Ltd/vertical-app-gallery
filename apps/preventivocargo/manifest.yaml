  approvals:
  - key: margin_ok
    title:
      it: Margine sotto soglia
      en: Margin below threshold
      de: Marge unter Schwellenwert
    description: The margin of a carrier assignment is below 8%
    role: operator
    decidedBy: role
    fields:
    - shipment_ref
    - margin_pct
    - carrier_email
    timeoutMinutes: 2880
    onTimeout: reject
  triggers:
  - key: publish_load
    'on':
      collection: shipments
      op: update
      where:
        confirm: true
    start:
      agent: publisher
    goal: The customer accepted shipment {record.ref}. Publish it.
    asUser: false
  - key: dispatch_new
    'on':
      collection: assignments
      op: insert
      where:
        status: proposed
    start:
      agent: dispatcher
    goal: 'New assignment: {event}'
    asUser: false
  - key: dispatch_approved
    'on':
      approval: margin_ok
      decision: approved
    start:
      agent: dispatcher
    goal: 'Margin approved: {event}. Confirm the assignment.'
    asUser: false
  - key: margin_rejected
    'on':
      approval: margin_ok
      decision: rejected
    notify:
      to: admins
      subject:
        it: Margine rifiutato
        en: Margin rejected
        de: Marge abgelehnt
      body:
        it: 'Un''assegnazione con margine sotto soglia è stata rifiutata: scegli un altro vettore.'
        en: 'An assignment below the margin threshold was rejected: choose another carrier.'
        de: 'Eine Zuweisung unter dem Margenschwellenwert wurde abgelehnt: bitte anderen Frachtführer wählen.'
      link: ops_shipments
  - key: new_bid
    'on':
      collection: bids
      op: insert
    notify:
      to: role:operator
      subject:
        it: Nuova offerta per il carico {record.load_ref}
        en: New bid for load {record.load_ref}
        de: Neues Gebot für Ladung {record.load_ref}
      body:
        it: Offerta di {record.price_eur} EUR da {record.carrier_email}.
        en: Bid of {record.price_eur} EUR from {record.carrier_email}.
        de: Gebot über {record.price_eur} EUR von {record.carrier_email}.
      link: ops_bids
  - key: commission
    'on':
      collection: shipments
      op: update
      where:
        status: assigned
    charge:
      credits: 30
      reason: commission per shipment
  - key: notify_assigned
    'on':
      collection: shipments
      op: update
      where:
        status: assigned
    notify:
      to:
      - record.customer_email
      subject:
        it: 'Spedizione {record.ref}: vettore assegnato'
        en: 'Shipment {record.ref}: carrier assigned'
        de: 'Sendung {record.ref}: Frachtführer zugewiesen'
      body:
        it: Un vettore è stato assegnato alla tua spedizione {record.ref}.
        en: A carrier has been assigned to your shipment {record.ref}.
        de: Ihrer Sendung {record.ref} wurde ein Frachtführer zugewiesen.
      link: my_shipments
  - key: notify_transit
    'on':
      collection: shipments
      op: update
      where:
        status: in_transit
    notify:
      to:
      - record.customer_email
      subject:
        it: 'Spedizione {record.ref}: in viaggio'
        en: 'Shipment {record.ref}: in transit'
        de: 'Sendung {record.ref}: unterwegs'
      body:
        it: La merce è stata caricata ed è in viaggio.
        en: Your goods have been picked up and are on the way.
        de: Ihre Ware wurde abgeholt und ist unterwegs.
      link: my_shipments
  - key: notify_delivered
    'on':
      collection: shipments
      op: update
      where:
        status: delivered
    notify:
      to:
      - record.customer_email
      - role:operator
      subject:
        it: 'Spedizione {record.ref}: consegnata'
        en: 'Shipment {record.ref}: delivered'
        de: 'Sendung {record.ref}: zugestellt'
      body:
        it: La spedizione {record.ref} è stata consegnata. Il documento di trasporto firmato è disponibile nell'app.
        en: Shipment {record.ref} has been delivered. The signed delivery note is available in the app.
        de: Sendung {record.ref} wurde zugestellt. Der unterschriebene Lieferschein ist in der App verfügbar.
      link: my_shipments
  schedules:
  - agent: fuel_watcher
    cron: 0 5 * * 1
    action: run
    owner: app
  egress:
    hosts:
    - nominatim.openstreetmap.org
    - router.project-osrm.org
    notes: 'Nominatim (geocoding) and the OSRM demo router: OpenStreetMap data, ODbL, light use under their usage policies;
      move to a dedicated router if volumes grow.'
  notifications:
    emailOnRunDone: true
  billing:
    modes:
    - credits
    currency: eur
    signupCredits: 60
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:quoter:
        estimate: 10
        metered: true
    packs:
    - key: small
      credits: 300
      price: 15
      label: Small
    - key: large
      credits: 1500
      price: 60
      label: Large
  extensions:
  - key: trained_price_model
    description: 'A price model trained on the forwarder''s lane history is not available yet: the quoter estimates from similar
      lanes (median EUR/km) adjusted for fuel, seasonality and return risk. Bulk CSV import of the history and model training
      are missing.'
  - key: toll_api
    description: 'No open toll API: tolls are estimated with per-country per-km rates.'
  - key: carrier_zone_filter
    description: Carriers see all open loads; automatic filtering by the zones of their profile is not available yet.
  - key: sms_whatsapp_tracking
    description: Tracking updates are by email only; SMS/WhatsApp/push and live GPS positions are not available yet.
