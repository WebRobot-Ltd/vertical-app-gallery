apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: preventivocargo
  displayName: PreventivoCargo
  tagline:
    it: Preventivo trasporto in pochi secondi, vettori in gara, tracking fino alla consegna.
    en: Freight quotes in seconds, carriers bidding, tracking through to delivery.
    de: Frachtangebot in Sekunden, Frachtführer bieten, Tracking bis zur Zustellung.
  description:
    it: 'Per spedizionieri e aziende che spediscono su strada in Italia ed Europa: prezzo indicativo con forchetta e tempi,
      marketplace di vettori, approvazione dei margini e dashboard per l''operatore.'
    en: 'For forwarders and shippers moving goods by road in Italy and Europe: indicative price with range and transit time,
      carrier marketplace, margin approval and an operator dashboard.'
    de: 'Für Spediteure und Versender im Straßengüterverkehr in Italien und Europa: Richtpreis mit Spanne und Laufzeit, Frachtführer-Marktplatz,
      Margenfreigabe und Dashboard für den Disponenten.'
  langs:
  - it
  - en
  - de
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12304a'
      accent: '#e07a1f'
      background: '#f6f8fa'
      foreground: '#16212c'
    fonts:
      body: Inter
      display: Manrope
    wordmark:
    - text: Preventivo
      color: primary
    - text: Cargo
      color: accent
    width: wide
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
        de: So funktioniert's
      href: '#come-funziona'
    - label:
        it: Per i vettori
        en: For carriers
        de: Für Frachtführer
      href: '#vettori'
    cta:
      label:
        it: Richiedi un preventivo
        en: Get a quote
        de: Angebot anfordern
      href: /v/new_quote
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label:
        it: Operatore
        en: Operator
        de: Disponent
      assignedBy: admin_emails
    - key: customer
      label:
        it: Cliente
        en: Customer
        de: Kunde
      assignedBy: signup
    - key: carrier
      label:
        it: Vettore
        en: Carrier
        de: Frachtführer
      assignedBy: invite
  limits:
  - action: agent:quoter
    per: user
    max: 30
    window: day
    roles:
    - customer
  egress:
    hosts:
    - nominatim.openstreetmap.org
    notes: Nominatim (OpenStreetMap) geocoding of addresses, data ODbL; low volume, identifying use, attribution required.
      Distances, tolls and diesel prices are collected from open sources through the WebRobot MCP.
  agents:
  - key: quoter
    role: main
    description: Normalises addresses, computes distance and tolls from open data, estimates the price from the forwarder's
      route history, diesel price, season and empty-return risk.
    profile:
      inline:
        display_name: PreventivoCargo quoter
        crews:
        - id: quoter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You are the pricing analyst of a road-freight forwarder (Italy and Europe). Given a shipment request
            you: 1) normalise origin and destination addresses with the tool nominatim_search (country, city, postcode, coordinates);
            2) get road distance, driving time and tolls from open data (use the WebRobot MCP to collect them from public
            sources; state the source); 3) read comparable past lanes with the tool history_read (the forwarder''s route history:
            lane, load type, price paid, date) and base the price on them, adjusted for season (month), the latest published
            diesel price (collect it from an official public source, cite it and its date), load type (pallets or loading
            metres, weight, temperature control, ADR, tail lift, appointment) and the risk of an empty return leg (backhaul
            likelihood on the destination area). You do not run a trained ML model: say clearly that the estimate is derived
            from the historical lanes found, and give the number of comparable lanes used. If there is no comparable history,
            widen the search and lower the stated confidence. Never invent figures, tolls or fuel prices: if a value is unavailable
            say so and widen the range. The price is indicative, not binding. Output: a Markdown report starting with ''#
            Preventivo <origin> → <destination>'' then sections ## Riepilogo (price range low–mid–high in EUR, transit time,
            pickup and delivery feasibility within the window), ## Percorso (normalised addresses, km, hours, tolls), ## Come
            abbiamo calcolato il prezzo (history, season, diesel, empty-return risk, confidence), ## Servizi e requisiti (temperature,
            ADR, tail lift, appointment surcharges), ## Prossimi passi (how to accept). Write in the language with the ISO
            code given in the goal. Add a ```chart bar block comparing the cost components (fuel, tolls, driver and vehicle,
            empty-return risk, margin band) only with real figures. Finish with a final JSON block (the last fenced json block)
            with fields: origin, destination, load_date, delivery_window, goods, pallets, ldm, weight_kg, temperature, adr,
            services, distance_km, tolls_eur, price_low, price_mid, price_high, transit_days, confidence, status (always "quoted").'
    goalTemplate: 'New shipment quote request, today is {date}.

      Pickup: {origin} on {load_date}.

      Delivery: {destination}, window {delivery_from} to {delivery_to}.

      Goods: {goods}. {?pallets}Pallets: {pallets}.{/pallets} {?ldm}Loading metres: {ldm}.{/ldm} Weight: {weight_kg} kg.

      Temperature: {temperature_label}. ADR: {adr}. Tail lift: {tail_lift}. Delivery appointment: {appointment}.

      {?notes}Notes: {notes}{/notes}

      Write the quote in the language with ISO code {lang}.'
    output: markdown+json
    resultSchema:
      type: object
      properties:
        origin:
          type: string
        destination:
          type: string
        load_date:
          type: string
        delivery_window:
          type: string
        goods:
          type: string
        pallets:
          type: number
        ldm:
          type: number
        weight_kg:
          type: number
        temperature:
          type: string
        adr:
          type: boolean
        services:
          type: string
        distance_km:
          type: number
        tolls_eur:
          type: number
        price_low:
          type: number
        price_mid:
          type: number
        price_high:
          type: number
        transit_days:
          type: number
        confidence:
          type: string
        status:
          type: string
    writesTo:
      collection: shipments
      parse: json_last
    appTools:
    - name: nominatim_search
      description: Geocode and normalise an address (OpenStreetMap Nominatim). Use query like q=<address>&format=jsonv2&addressdetails=1&limit=1
      action: http
      http:
        method: GET
        url: https://nominatim.openstreetmap.org/search
        attribution: © OpenStreetMap contributors, ODbL
    - name: history_read
      description: Read the forwarder's historical lanes (origin, destination, load type, price paid, date).
      action: search
      collection: route_history
      scope: all
    limits:
      maxTurns: 25
      maxBudgetUsd: 0.6
  - key: publisher
    role: helper
    description: When a customer accepts a quote, publishes an anonymised load on the carrier marketplace.
    profile:
      inline:
        display_name: PreventivoCargo load publisher
        crews:
        - id: publisher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 4
          max_budget_usd: 0.1
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You turn an accepted shipment into an anonymous marketplace listing for carriers. The shipment data
            is given in the task. Include only: pickup area (city and country, no street), delivery area, pickup date, delivery
            window, goods type, pallets or loading metres, weight, temperature, ADR, services, distance and the zone key (a
            lowercase region code such as it-lombardia). Never include the customer''s name, email, street addresses or the
            price quoted to the customer. Output only a final JSON block with those fields plus shipment_ref and status ''open''.'
    goalTemplate: Publish the accepted shipment described in the task to the carrier marketplace. Today is {date}.
    output: json
    resultSchema:
      type: object
      properties:
        shipment_ref:
          type: string
        zone:
          type: string
        pickup_area:
          type: string
        delivery_area:
          type: string
        load_date:
          type: string
        delivery_window:
          type: string
        goods:
          type: string
        loading:
          type: string
        weight_kg:
          type: number
        temperature:
          type: string
        adr:
          type: boolean
        services:
          type: string
        distance_km:
          type: number
        status:
          type: string
    writesTo:
      collection: open_loads
      parse: json_last
      keyBy: shipment_ref
    limits:
      maxTurns: 4
      maxBudgetUsd: 0.1
  - key: dispatcher
    role: helper
    description: Compares each carrier bid with the quoted price, computes the margin and asks the operator's approval when
      it is below threshold.
    awaits:
    - margin_override
    profile:
      inline:
        display_name: PreventivoCargo dispatcher
        crews:
        - id: dispatcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.15
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You assist the forwarder's operator. The new carrier bid is given in the task. Compute margin = customer
            price (price_mid of the shipment) minus bid minus the per-shipment commission, in EUR and percent. The margin
            threshold is 8%. If the margin is below the threshold, call the tool request_margin_override with shipment_ref,
            bid, margin_eur, margin_pct and your recommendation; do not assign anything yourself. Otherwise recommend the
            bid. Never invent figures. Output a short Markdown note starting with '# Offerta <shipment_ref>' and a final JSON
            block with shipment_ref, carrier, bid_eur, price_eur, margin_eur, margin_pct, below_threshold.
    goalTemplate: Evaluate the new carrier bid described in the task against the shipment's quoted price. Today is {date}.
    output: markdown+json
    resultSchema:
      type: object
      properties:
        shipment_ref:
          type: string
        carrier:
          type: string
        bid_eur:
          type: number
        price_eur:
          type: number
        margin_eur:
          type: number
        margin_pct:
          type: number
        below_threshold:
          type: boolean
    writesTo:
      collection: margin_log
      parse: json_last
    limits:
      maxTurns: 6
      maxBudgetUsd: 0.15
  inputForm:
    title:
      it: Richiesta di trasporto
      en: Transport request
      de: Transportanfrage
    fields:
    - name: origin
      type: text
      required: true
      label:
        it: Luogo di carico
        en: Pickup location
        de: Beladeort
    - name: load_date
      type: date
      required: true
      label:
        it: Data di carico
        en: Pickup date
        de: Ladedatum
    - name: destination
      type: text
      required: true
      label:
        it: Luogo di consegna
        en: Delivery location
        de: Lieferort
    - name: delivery_from
      type: date
      required: true
      label:
        it: Consegna dal
        en: Delivery from
        de: Lieferung ab
    - name: delivery_to
      type: date
      required: true
      label:
        it: Consegna entro
        en: Delivery by
        de: Lieferung bis
    - name: goods
      type: text
      required: true
      label:
        it: Tipo di merce
        en: Type of goods
        de: Art der Ware
    - name: pallets
      type: number
      label:
        it: Numero di bancali
        en: Pallets
        de: Paletten
    - name: ldm
      type: number
      label:
        it: Metri lineari
        en: Loading metres
        de: Lademeter
      help:
        it: Compila bancali oppure metri lineari
        en: Fill pallets or loading metres
        de: Paletten oder Lademeter angeben
    - name: weight_kg
      type: number
      required: true
      label:
        it: Peso (kg)
        en: Weight (kg)
        de: Gewicht (kg)
    - name: temperature
      type: select
      required: true
      default: ambient
      label:
        it: Temperatura
        en: Temperature
        de: Temperatur
      options:
      - value: ambient
        label:
          it: Ambiente
          en: Ambient
          de: Umgebung
      - value: chilled
        label:
          it: Refrigerato +2/+8 °C
          en: Chilled +2/+8 °C
          de: Gekühlt +2/+8 °C
      - value: frozen
        label:
          it: Surgelato −18 °C
          en: Frozen −18 °C
          de: Tiefgekühlt −18 °C
    - name: adr
      type: boolean
      label:
        it: Merce ADR
        en: ADR goods
        de: ADR-Ware
    - name: tail_lift
      type: boolean
      label:
        it: Sponda idraulica
        en: Tail lift
        de: Hebebühne
    - name: appointment
      type: boolean
      label:
        it: Consegna su appuntamento
        en: Delivery appointment
        de: Avisierung
    - name: notes
      type: textarea
      maxLength: 500
      label:
        it: Note (facoltative)
        en: Notes (optional)
        de: Hinweise (optional)
  data:
    collections:
    - name: shipments
      ownedBy: user
      description: 'The customer''s own shipments: quote, status, chosen carrier, tracking status and link to the signed transport
        document'
      fields:
      - name: origin
        type: text
      - name: destination
        type: text
      - name: load_date
        type: date
      - name: delivery_window
        type: text
      - name: goods
        type: text
      - name: pallets
        type: number
      - name: ldm
        type: number
      - name: weight_kg
        type: number
      - name: temperature
        type: text
      - name: adr
        type: boolean
      - name: services
        type: text
      - name: distance_km
        type: number
      - name: tolls_eur
        type: number
      - name: price_low
        type: number
      - name: price_mid
        type: number
      - name: price_high
        type: number
      - name: transit_days
        type: number
      - name: confidence
        type: text
      - name: status
        type: select
        options:
        - quoted
        - accepted
        - assigned
        - in_transit
        - delivered
      - name: tracking_note
        type: text
      - name: pod_url
        type: url
        label: Signed transport document (link)
    - name: open_loads
      ownedBy: shared
      description: Anonymised loads open to carrier bids (no customer data, no price)
      fields:
      - name: shipment_ref
        type: text
      - name: zone
        type: text
      - name: pickup_area
        type: text
      - name: delivery_area
        type: text
      - name: load_date
        type: date
      - name: delivery_window
        type: text
      - name: goods
        type: text
      - name: loading
        type: text
      - name: weight_kg
        type: number
      - name: temperature
        type: text
      - name: adr
        type: boolean
      - name: services
        type: text
      - name: distance_km
        type: number
      - name: status
        type: text
    - name: bids
      ownedBy: user
      description: A carrier's own bids on open loads
      fields:
      - name: shipment_ref
        type: text
        required: true
      - name: amount_eur
        type: number
        required: true
      - name: vehicle
        type: text
      - name: pickup_eta
        type: date
      - name: note
        type: text
    - name: carriers
      ownedBy: user
      description: 'Carrier profile: company, zones covered, vehicles, permits (ADR, ATP)'
      fields:
      - name: company
        type: text
        required: true
      - name: vat_number
        type: text
      - name: zones
        type: text
      - name: vehicles
        type: text
      - name: adr_permit
        type: boolean
      - name: atp_cold_chain
        type: boolean
    - name: route_history
      ownedBy: org
      description: The forwarder's historical lanes used to estimate prices
      fields:
      - name: origin
        type: text
      - name: destination
        type: text
      - name: load_type
        type: text
      - name: weight_kg
        type: number
      - name: price_eur
        type: number
      - name: date
        type: date
    - name: margin_log
      ownedBy: org
      description: Margin per evaluated bid, for the operator dashboard
      fields:
      - name: shipment_ref
        type: text
      - name: carrier
        type: text
      - name: bid_eur
        type: number
      - name: price_eur
        type: number
      - name: margin_eur
        type: number
      - name: margin_pct
        type: number
      - name: below_threshold
        type: boolean
  approvals:
  - key: margin_override
    title:
      it: Margine sotto soglia
      en: Margin below threshold
      de: Marge unter Schwelle
    description: 'The best bid leaves a margin under 8%: the operator must approve before assigning the carrier.'
    role: admin
    decidedBy: role
    fields:
    - shipment_ref
    - bid
    - margin_eur
    - margin_pct
    - recommendation
    timeoutMinutes: 1440
    onTimeout: reject
  triggers:
  - key: publish_accepted
    description: Publish to the marketplace when a customer accepts a quote
    'on':
      collection: shipments
      op: update
      where:
        status: accepted
    start:
      agent: publisher
    goal: 'Publish this accepted shipment: {event}'
    asUser: true
  - key: evaluate_bid
    description: Evaluate each new carrier bid for margin
    'on':
      collection: bids
      op: insert
    start:
      agent: dispatcher
    goal: 'Evaluate this bid against the shipment''s quoted price: {event}'
    asUser: false
  views:
  - key: home
    type: page
    nav: false
    title: PreventivoCargo
    sections:
    - type: hero
      eyebrow:
        it: Trasporto merci su strada · Italia ed Europa
        en: Road freight · Italy and Europe
        de: Straßengüterverkehr · Italien und Europa
      title:
        it: Il prezzo del tuo trasporto in **pochi secondi**, il vettore giusto in poche ore.
        en: Your freight price in **seconds**, the right carrier in hours.
        de: Ihr Frachtpreis in **Sekunden**, der richtige Frachtführer in Stunden.
      text:
        it: 'Compila la richiesta: un agente AI normalizza gli indirizzi, calcola distanza e pedaggi da dati aperti e stima
          un prezzo con forchetta e tempi, tenendo conto di stagione, gasolio e rischio di ritorno a vuoto.'
        en: 'Fill in the request: an AI agent normalises addresses, computes distance and tolls from open data and estimates
          a price with range and transit time, considering season, diesel and empty-return risk.'
        de: 'Anfrage ausfüllen: Ein KI-Agent normalisiert Adressen, berechnet Strecke und Maut aus offenen Daten und schätzt
          einen Preis mit Spanne und Laufzeit unter Berücksichtigung von Saison, Diesel und Leerfahrtrisiko.'
      actions:
      - label:
          it: Richiedi un preventivo
          en: Get a quote
          de: Angebot anfordern
        href: /v/new_quote
        style: primary
      - label:
          it: Accedi
          en: Sign in
          de: Anmelden
        href: /login
        style: ghost
      layout: stack
      band: true
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
        de: So funktioniert's
      items:
      - title:
          it: Richiesta
          en: Request
          de: Anfrage
        text:
          it: Carico, consegna, merce, bancali o metri lineari, peso, temperatura, ADR e servizi accessori.
          en: Pickup, delivery, goods, pallets or loading metres, weight, temperature, ADR and extra services.
          de: Beladung, Lieferung, Ware, Paletten oder Lademeter, Gewicht, Temperatur, ADR und Zusatzleistungen.
        badge: 📝
      - title:
          it: Prezzo indicativo
          en: Indicative price
          de: Richtpreis
        text:
          it: Forchetta di prezzo e tempi di transito, con la spiegazione dei calcoli.
          en: Price range and transit time, with the reasoning shown.
          de: Preisspanne und Laufzeit mit nachvollziehbarer Berechnung.
        badge: ⚡
      - title:
          it: Marketplace vettori
          en: Carrier marketplace
          de: Frachtführer-Marktplatz
        text:
          it: Se accetti, i vettori della zona fanno offerta e l'operatore sceglie e conferma.
          en: If you accept, carriers in the area bid and the operator picks and confirms.
          de: Bei Annahme bieten Frachtführer der Region; der Disponent wählt und bestätigt.
        badge: 🚚
      - title:
          it: Tracking e documenti
          en: Tracking and documents
          de: Tracking und Dokumente
        text:
          it: Segui lo stato della consegna e ritrova il documento di trasporto firmato.
          en: Follow delivery status and find the signed transport document.
          de: Lieferstatus verfolgen und den unterschriebenen Frachtbrief abrufen.
        badge: 📍
    - type: cards
      id: vettori
      title:
        it: Per i vettori
        en: For carriers
        de: Für Frachtführer
      items:
      - title:
          it: Carichi nella tua zona
          en: Loads in your area
          de: Ladungen in Ihrer Region
        text:
          it: Vedi i carichi disponibili (senza dati del cliente), fai la tua offerta e ricevi solo quelli che ti vengono
            assegnati.
          en: See available loads (without customer data), place your bid and only get the loads assigned to you.
          de: Verfügbare Ladungen ohne Kundendaten ansehen, bieten und nur zugewiesene Ladungen erhalten.
    - type: note
      content:
        it: Il prezzo è indicativo e non vincolante. Commissione per spedizione applicata dalla piattaforma.
        en: The price is indicative and not binding. A per-shipment commission applies.
        de: Der Preis ist unverbindlich. Pro Sendung fällt eine Provision an.
  - key: new_quote
    type: new_run
    title:
      it: Nuova richiesta
      en: New request
      de: Neue Anfrage
    source: agent:quoter
    roles:
    - customer
    - admin
  - key: quote
    type: report
    title:
      it: Preventivo
      en: Quote
      de: Angebot
    source: run
    printable: true
    nav: false
  - key: my_shipments
    type: table
    title:
      it: Le mie spedizioni
      en: My shipments
      de: Meine Sendungen
    source: collection:shipments
    data:
      display: table
      fields:
      - key: origin
        label:
          it: Carico
          en: Pickup
          de: Beladung
      - key: destination
        label:
          it: Consegna
          en: Delivery
          de: Lieferung
      - key: load_date
        label: Date
        format: date
      - key: price_mid
        label:
          it: Prezzo
          en: Price
          de: Preis
        format: money
      - key: status
        label: Status
        format: badge
      - key: tracking_note
        label: Tracking
      - key: pod_url
        label: POD
        format: link
      sort:
        field: load_date
        dir: desc
      limit: 100
    roles:
    - customer
  - key: history
    type: history
    title:
      it: Storico preventivi
      en: Quote history
      de: Angebotsverlauf
    source: run
    roles:
    - customer
    - admin
  - key: loadboard
    type: table
    title:
      it: Carichi disponibili
      en: Available loads
      de: Verfügbare Ladungen
    source: collection:open_loads
    data:
      display: table
      fields:
      - key: zone
        label: Zone
      - key: pickup_area
        label:
          it: Da
          en: From
          de: Von
      - key: delivery_area
        label:
          it: A
          en: To
          de: Nach
      - key: load_date
        label: Date
        format: date
      - key: loading
        label:
          it: Carico
          en: Load
          de: Ladung
      - key: weight_kg
        label: kg
        format: number
      - key: temperature
        label: °C
      - key: adr
        label: ADR
      - key: shipment_ref
        label: Ref
      filters:
