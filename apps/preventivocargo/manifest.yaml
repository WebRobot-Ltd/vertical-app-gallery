        type: text
  views:
  - key: home
    type: page
    nav: false
    title: PreventivoCargo
    sections:
    - type: hero
      band: true
      eyebrow:
        it: Trasporto merci su strada
        en: Road freight
        de: Straßengüterverkehr
      title:
        it: Il prezzo del tuo **trasporto** in pochi secondi.
        en: The price of your **shipment** in seconds.
        de: Der Preis Ihrer **Sendung** in Sekunden.
      text:
        it: 'Inserisci carico e consegna: ricevi una forchetta di prezzo e i tempi. Se accetti, i vettori registrati fanno
          offerta e segui la consegna fino al documento firmato.'
        en: 'Enter pickup and delivery: get a price range and transit time. If you accept, registered carriers bid and you
          follow the delivery up to the signed document.'
        de: 'Be- und Entladeort eingeben: Preisspanne und Laufzeit erhalten. Nach Annahme bieten registrierte Frachtführer,
          und Sie verfolgen die Lieferung bis zum unterschriebenen Lieferschein.'
      actions:
      - label:
          it: Richiedi un preventivo
          en: Request a quote
          de: Angebot anfordern
        href: /v/new_quote
        style: primary
      - label:
          it: Accedi
          en: Sign in
          de: Anmelden
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
        de: So funktioniert's
      items:
      - title:
          it: Preventivo
          en: Quote
          de: Angebot
        text:
          it: Indirizzi normalizzati, distanza e pedaggi da dati open, prezzo stimato sullo storico delle tratte con stagionalità,
            gasolio e rischio di ritorno a vuoto.
          en: Normalised addresses, distance and tolls from open data, price estimated from lane history with seasonality,
            diesel and empty-return risk.
          de: Normalisierte Adressen, Distanz und Maut aus offenen Daten, Preis aus der Streckenhistorie mit Saisonalität,
            Diesel und Leerfahrtrisiko.
        badge: '1'
      - title:
          it: Offerte dei vettori
          en: Carrier bids
          de: Frachtführer-Gebote
        text:
          it: Se accetti, il carico è visibile ai vettori della zona; l'operatore sceglie e conferma.
          en: If you accept, the load is visible to carriers in the area; the operator picks and confirms.
          de: Nach Annahme sehen Frachtführer der Region die Ladung; der Disponent wählt und bestätigt.
        badge: '2'
      - title:
          it: Tracking e documento
          en: Tracking and document
          de: Tracking und Lieferschein
        text:
          it: Aggiornamenti via email e documento di trasporto firmato caricato dal vettore.
          en: Email updates and the signed delivery note uploaded by the carrier.
          de: E-Mail-Updates und der vom Frachtführer hochgeladene unterschriebene Lieferschein.
        badge: '3'
    - type: cards
      id: vettori
      title:
        it: Per i vettori
        en: For carriers
        de: Für Frachtführer
      items:
      - title:
          it: Carichi nella tua zona
          en: Loads in your area
          de: Ladungen in Ihrer Region
        text:
          it: Registrati con lo spedizioniere, vedi i carichi disponibili e fai la tua offerta.
          en: Register with the forwarder, see available loads and place your bid.
          de: Beim Spediteur registrieren, verfügbare Ladungen sehen und bieten.
    - type: note
      content:
        it: I prezzi sono indicativi e non costituiscono offerta vincolante. Pedaggi stimati.
        en: Prices are indicative and not a binding offer. Tolls are estimated.
        de: Preise sind unverbindlich. Maut ist geschätzt.
