  billing:
    modes:
    - credits
    - per_transaction
    currency: eur
    signupCredits: 30
    transactionFeePct: 8
    sellers: collection:carriers
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:quoter:
        estimate: 10
        metered: true
    packs:
    - key: small
      credits: 300
      price: 5
      label: Small
    - key: large
      credits: 2000
      price: 30
      label: Large
  extensions:
  - key: email_tracking
    description: 'Email updates on delivery tracking are not available yet: customers see the status in My shipments.'
  - key: pod_upload
    description: 'Uploading the signed transport document is not available yet: the carrier gives a link, saved in pod_url.'
  - key: trained_price_model
    description: 'No trained ML model can run on the platform: the agent estimates from the lanes in route_history (to be
      loaded by the operator), season, diesel and empty-return risk.'
  - key: carrier_assignment
    description: 'Carrier selection by the operator and carrier-only visibility of assigned loads need custom logic: today
      carriers see anonymised open loads and their own bids; assignment is done by the operator in the back office.'
