apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: preventivocargo
  displayName: PreventivoCargo
  tagline:
    it: Preventivo trasporto in pochi secondi, vettori in gara, consegna tracciata.
    en: Freight quote in seconds, carriers bidding, tracked delivery.
    de: Frachtangebot in Sekunden, Frachtführer bieten, verfolgte Lieferung.
  description:
    it: Richiedi un prezzo indicativo per una spedizione su strada in Italia ed Europa. Se accetti, il carico va ai vettori
      registrati che fanno offerta; l'operatore sceglie e conferma, tu segui la consegna e trovi il documento firmato.
    en: Request an indicative price for a road shipment in Italy and Europe. If you accept, the load goes to registered carriers
      who bid; the operator picks and confirms, and you follow the delivery and get the signed document.
    de: Fordern Sie einen Richtpreis für einen Straßentransport in Italien und Europa an. Nach Ihrer Annahme bieten registrierte
      Frachtführer; der Disponent wählt und bestätigt, Sie verfolgen die Lieferung und erhalten den unterschriebenen Lieferschein.
  langs:
  - it
  - en
  - de
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12304a'
      accent: '#e07a1f'
      background: '#f6f7f9'
      foreground: '#17212b'
    fonts:
      body: Inter
      display: Manrope
    wordmark:
    - text: Preventivo
      color: primary
    - text: Cargo
      color: accent
    width: wide
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
        de: So funktioniert's
      href: '#come-funziona'
    - label:
        it: Per i vettori
        en: For carriers
        de: Für Frachtführer
      href: '#vettori'
    cta:
      label:
        it: Accedi
        en: Sign in
        de: Anmelden
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: operator
      label:
        it: Operatore
        en: Operator
        de: Disponent
      assignedBy: invite
    - key: carrier
      label:
        it: Vettore
        en: Carrier
        de: Frachtführer
      assignedBy: derived
      from: collection:carriers.email
    - key: user
      label:
        it: Cliente
        en: Customer
        de: Kunde
      assignedBy: signup
  limits:
  - action: agent:quoter
    per: user
    max: 20
    window: day
    roles:
    - user
  slots:
  - key: load_values
    description: Seasonality factor and chargeable weight from the form
    timeoutMs: 2000
    example:
      values:
        pickup_date: '2026-12-10'
        pallets: 10
        weight_kg: 4000
      lang: it
    code: "def num(x):\n    try:\n        return float(x)\n    except Exception:\n        return 0.0\n\nFACTORS = {1:0.95,2:0.95,3:1.0,4:1.0,5:1.03,6:1.03,7:1.0,8:0.95,9:1.05,10:1.08,11:1.1,12:1.12}\n\
      \ndef main(input):\n    v = input.get('values') or {}\n    d = str(v.get('pickup_date') or '')\n    month = int(d[5:7])\
      \ if len(d) >= 7 and d[5:7].isdigit() else 0\n    f = FACTORS.get(month, 1.0)\n    pal = num(v.get('pallets'))\n   \
      \ ldm = num(v.get('ldm'))\n    if not ldm:\n        ldm = pal * 0.4\n    w = num(v.get('weight_kg'))\n    ck = max(w,\
      \ ldm * 1850)\n    return {'season_factor': f, 'season_note': 'high season' if f >= 1.05 else ('low season' if f < 1.0\
      \ else 'normal season'), 'ldm_eff': round(ldm, 1), 'chargeable_kg': round(ck)}\n"
  agents:
  - key: quoter
    role: main
    description: Normalises addresses, computes distance and tolls from open data, estimates the price from the forwarder's
      lane history, fuel and seasonality.
    profile:
      inline:
        display_name: PreventivoCargo quoter
        crews:
        - id: quoter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the pricing analyst of a road freight forwarder (Italy and Europe). You give an INDICATIVE
            quote within seconds.

            Steps:

            1. Call geocode for the pickup and the delivery address (Nominatim, query like q=<address>&format=json&limit=1&addressdetails=1).
            Write the normalised addresses (street, postcode, city, country) and the zone as ''<ISO country>-<region or province>''.

            2. Call route with path ''/<lon1>,<lat1>;<lon2>,<lat2>'' and query ''overview=false'' to get the distance in km
            and duration. Transit days = driving time / 9h per day, plus one day if the delivery window needs it.

            3. Tolls: there is no open toll API. Estimate them with typical heavy-vehicle rates per km (Italy ~0.20 EUR, Germany
            ~0.34, Austria ~0.30, France ~0.25, Switzerland ~0.80, others ~0.15) over the countries crossed, and label them
            clearly as an estimate.

            4. Call read_history to find the forwarder''s past lanes similar in origin, destination, pallets/weight, ADR and
            temperature; derive a median EUR/km. If there is little or no history, say so and use a transparent market benchmark
            with a wider range. Never invent history.

            5. Call read_fuel for the latest published diesel price and scale the fuel part (~30% of the cost) against the
            price in the history''s period when known.

            6. Apply the seasonality factor given in the goal. Add the empty-return risk: if the destination is a weak freight
            area (history shows few outbound loads from there), add 5-15%. Add surcharges: ADR ~ +20-30%, controlled temperature
            ~ +15-25%, tail lift and appointment each a fixed fee.

            7. Output a price range (low / mid / high) in EUR and the transit time. Be honest on confidence.

            8. Generate a reference ''PC-<YYYYMMDD>-<4 random digits>''. Call write_shipment once (status ''quoted'', confirm
            false, all the request data, pickup_zone, dest_zone, distance_km, eta_text, ref, customer_email) and write_quote
            once (ref, price_low, price_mid, price_high, currency EUR, distance_km, tolls_eur, fuel_index, transit_days, notes).

            Report structure (language of the goal): a level-1 title ''# Preventivo <pickup city> → <delivery city>'' (translate
            ''Preventivo'' to the report language), then ## Price (range, indicative), ## Route and times (km, tolls estimate,
            transit), ## What drives the price (seasonality, fuel, return risk, surcharges), ## Assumptions and limits, ##
            Next step: tell the customer that to accept they open ''My shipments'' and choose Accept, and the load then goes
            to registered carriers. Add a ```chart bar block with the price breakdown (base, tolls, fuel, surcharges) using
            real computed figures. The price is indicative and not a binding offer.'
          mcp_servers: []
    context:
    - key: season_factor
      from: slot:load_values
    - key: season_note
      from: slot:load_values
    - key: ldm_eff
      from: slot:load_values
    - key: chargeable_kg
      from: slot:load_values
    - key: customer_email
      from: user.email
    goalTemplate: 'Quote request. Today is {date}. Customer: {customer_email}.

      Pickup: {pickup_address} on {pickup_date}.

      Delivery: {delivery_address}, window {delivery_from} to {delivery_to}.

      Goods: {goods_type_label}. Pallets: {pallets}. Linear metres: {ldm} (effective {ldm_eff}). Weight: {weight_kg} kg (chargeable
      {chargeable_kg} kg).

      Temperature: {temp_label}. ADR: {adr}. Tail lift: {tail_lift}. Delivery appointment: {appointment}.

      Seasonality factor: {season_factor} ({season_note}).

      {?notes}Notes: {notes}{/notes}

      Write the report in the language with ISO code {lang}.'
    appTools:
    - name: geocode
      description: Normalise and geocode an address (OpenStreetMap Nominatim)
      action: http
      http:
        method: GET
        url: https://nominatim.openstreetmap.org/search
        attribution: © OpenStreetMap contributors, ODbL
    - name: route
      description: Driving route between two points (OSRM); path '/lon1,lat1;lon2,lat2'
      action: http
      http:
        method: GET
        url: https://router.project-osrm.org/route/v1/driving
        allowPath: true
        attribution: © OpenStreetMap contributors, ODbL, OSRM
    - name: read_history
      description: Search the forwarder's historical lanes and prices
      action: search
      collection: route_history
      scope: all
    - name: read_fuel
      description: Latest published diesel price
      action: read
      collection: fuel_index
      scope: all
    - name: write_shipment
      description: Save the shipment request of this customer
      action: write
      collection: shipments
      scope: user
    - name: write_quote
      description: Save the indicative quote of this customer
      action: write
      collection: quotes
      scope: user
    output: markdown
    limits:
      maxTurns: 25
      maxBudgetUsd: 0.8
  - key: publisher
    role: helper
    description: Publishes an accepted shipment to the carrier marketplace, without customer data.
    profile:
      inline:
        display_name: PreventivoCargo publisher
        crews:
        - id: publisher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.1
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You publish an accepted shipment on the carrier marketplace. Read the shipment by ref with read_shipment.
            If its status is not ''quoted'', do nothing and say so. Otherwise create ONE load with write_load: shipment_ref,
            pickup_zone, dest_zone, pickup_date, delivery_to, goods_type, pallets, ldm, weight_kg, temp, adr, tail_lift, appointment,
            status ''open''. NEVER copy addresses, names or emails of the customer, and no prices. Then set the shipment status
            to ''bidding'' with set_shipment_status. Answer with one line starting ''# '' that says the load was published.'
    goalTemplate: The customer accepted shipment {record.ref}. Publish it.
    appTools:
    - name: read_shipment
      description: Read shipments
      action: read
      collection: shipments
      scope: all
    - name: write_load
      description: Create a marketplace load
      action: write
      collection: loads
      scope: all
    - name: set_shipment_status
      description: Update the status of a shipment
      action: write
      collection: shipments
      scope: all
    output: markdown
    limits:
      maxTurns: 6
      maxBudgetUsd: 0.1
  - key: dispatcher
    role: helper
    description: Checks the margin of a carrier assignment, asks the operator's approval below the threshold, and confirms
      the assignment.
    profile:
      inline:
        display_name: PreventivoCargo dispatcher
        crews:
        - id: dispatcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You finalise a carrier assignment for a freight forwarder. The margin threshold is 8% of the customer
            price.

            New assignment (goal has the assignment): read the assignment with read_assignments and the quote with read_quotes
            (by shipment_ref). customer_price = quote price_mid. margin_eur = customer_price - carrier_cost; margin_pct =
            margin_eur / customer_price * 100. Update the assignment with save_assignment (customer_price, margin_eur, margin_pct,
            month = first day of the pickup month YYYY-MM-01). If margin_pct >= 8: confirm it (step below). Otherwise set
            the assignment status ''pending_approval'' and call request_margin_ok with the shipment_ref, the margin and the
            carrier; then stop.

            Approval granted (goal has the approval event): find the assignment of that shipment_ref and confirm it.

            Confirm = assignment status ''confirmed''; shipment: carrier_email and status ''assigned'' with save_shipment;
            the load with that shipment_ref: status ''assigned'' and carrier_email with save_load. Be idempotent: if the assignment
            is already confirmed do nothing.

            Answer with a short report starting ''# Assignment <shipment_ref>''.'
    goalTemplate: 'Event: {event}'
    awaits:
    - margin_ok
    appTools:
    - name: read_assignments
      description: Read assignments
      action: read
      collection: assignments
      scope: all
    - name: read_quotes
      description: Read quotes
      action: read
      collection: quotes
      scope: all
    - name: save_assignment
      description: Update an assignment
      action: write
      collection: assignments
      scope: all
    - name: save_shipment
      description: Update a shipment
      action: write
      collection: shipments
      scope: all
    - name: save_load
      description: Update a marketplace load
      action: write
      collection: loads
      scope: all
    output: markdown
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.2
  - key: fuel_watcher
    role: scheduled
    description: 'Weekly: reads the published diesel price and saves it.'
    profile:
      inline:
        display_name: PreventivoCargo fuel watcher
        crews:
        - id: fuel
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Once a week you collect the latest officially published retail diesel price: Italy (MASE weekly
            prices) and the EU average (EU Weekly Oil Bulletin). Use the WebRobot MCP to read the official pages. Never invent
            figures: if a value is not found, leave it null. Answer with ''# Diesel prices <date>'' and a short note on the
            sources, then a final fenced json block: {"week":"YYYY-Www","diesel_it":<EUR/l>,"diesel_eu_avg":<EUR/l>,"source":"..."}.'
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
    goalTemplate: Today is {date}. Collect the latest published diesel prices.
    writesTo:
      collection: fuel_index
      parse: json_last
      keyBy: week
    output: markdown+json
    limits:
      maxTurns: 15
      maxBudgetUsd: 0.5
  inputForm:
    title:
      it: Richiedi un preventivo
      en: Request a quote
      de: Angebot anfordern
    fields:
    - name: pickup_address
      type: text
      required: true
      label:
        it: Luogo di carico
        en: Pickup address
        de: Beladeort
    - name: pickup_date
      type: date
      required: true
      label:
        it: Data di carico
        en: Pickup date
        de: Beladedatum
    - name: delivery_address
      type: text
      required: true
      label:
        it: Luogo di consegna
        en: Delivery address
        de: Entladeort
    - name: delivery_from
      type: date
      required: true
      label:
        it: Consegna dal
        en: Deliver from
        de: Lieferung ab
    - name: delivery_to
      type: date
      required: true
      label:
        it: Consegna entro
        en: Deliver by
        de: Lieferung bis
    - name: goods_type
      type: select
      required: true
      label:
        it: Tipo di merce
        en: Goods type
        de: Warenart
      options:
      - value: general
        label:
          it: Merce generica
          en: General cargo
          de: Stückgut
      - value: food
        label:
          it: Alimentari
          en: Food
          de: Lebensmittel
      - value: pharma
        label:
          it: Farmaceutico
          en: Pharma
          de: Pharma
      - value: chemicals
        label:
          it: Chimico
          en: Chemicals
          de: Chemie
      - value: machinery
        label:
          it: Macchinari
          en: Machinery
          de: Maschinen
      - value: other
        label:
          it: Altro
          en: Other
          de: Sonstiges
    - name: pallets
      type: number
      label:
        it: Numero bancali
        en: Pallets
        de: Paletten
    - name: ldm
      type: number
      label:
        it: Metri lineari
        en: Linear metres
        de: Lademeter
      help:
        it: Compila bancali oppure metri lineari
        en: Fill in pallets or linear metres
        de: Paletten oder Lademeter angeben
    - name: weight_kg
      type: number
      required: true
      label:
        it: Peso (kg)
        en: Weight (kg)
        de: Gewicht (kg)
    - name: temp
      type: select
      required: true
      default: ambient
      label:
        it: Temperatura
        en: Temperature
        de: Temperatur
      options:
      - value: ambient
        label:
          it: Ambiente
          en: Ambient
          de: Umgebung
      - value: chilled
        label:
          it: Refrigerato +2/+8 °C
          en: Chilled +2/+8 °C
          de: Gekühlt +2/+8 °C
      - value: frozen
        label:
          it: Surgelato -18 °C
          en: Frozen -18 °C
          de: Tiefkühl -18 °C
    - name: adr
      type: boolean
      label:
        it: Merce ADR
        en: ADR goods
        de: ADR-Ware
    - name: tail_lift
      type: boolean
      label:
        it: Sponda idraulica
        en: Tail lift
        de: Hebebühne
    - name: appointment
      type: boolean
      label:
        it: Consegna su appuntamento
        en: Delivery appointment
        de: Terminlieferung
    - name: notes
      type: textarea
      maxLength: 400
      label:
        it: Note (facoltative)
        en: Notes (optional)
        de: Hinweise (optional)
  data:
    collections:
    - name: shipments
      ownedBy: user
      description: Logistic data and tracking of each shipment (no prices)
      retentionDays: 1095
      fields:
      - name: ref
        type: text
      - name: customer_email
        type: email
      - name: pickup_address
        type: text
      - name: pickup_date
        type: date
      - name: delivery_address
        type: text
      - name: delivery_from
        type: date
      - name: delivery_to
        type: date
      - name: goods_type
        type: text
      - name: pallets
        type: number
      - name: ldm
        type: number
      - name: weight_kg
        type: number
      - name: temp
        type: text
      - name: adr
        type: boolean
      - name: tail_lift
        type: boolean
      - name: appointment
        type: boolean
      - name: pickup_zone
        type: text
      - name: dest_zone
        type: text
      - name: distance_km
        type: number
      - name: eta_text
        type: text
      - name: status
        type: select
        label:
          it: Stato
          en: Status
          de: Status
        options:
        - quoted
        - requested
        - bidding
        - assigned
        - in_transit
        - delivered
        - cancelled
      - name: confirm
        type: boolean
        label:
          it: Accetto il preventivo e pubblico il carico
          en: I accept the quote and publish the load
          de: Ich nehme das Angebot an und veröffentliche die Ladung
      - name: carrier_email
        type: email
      - name: pod
        type: file
        accept:
        - pdf
        - jpg
        - png
        maxMb: 10
        label:
          it: Documento di trasporto firmato
          en: Signed delivery note
          de: Unterschriebener Lieferschein
      access:
      - role: operator
        can:
        - read
        - write
      - role: carrier
        where:
          carrier_email: '{user.email}'
        can:
        - read
        - write
    - name: quotes
      ownedBy: user
      description: Indicative prices shown to the customer
      retentionDays: 1095
      fields:
      - name: ref
        type: text
      - name: price_low
        type: number
      - name: price_mid
        type: number
      - name: price_high
        type: number
      - name: currency
        type: text
      - name: distance_km
        type: number
      - name: tolls_eur
        type: number
      - name: fuel_index
        type: number
      - name: transit_days
        type: number
      - name: notes
        type: textarea
      access:
      - role: operator
    - name: loads
      ownedBy: org
      description: Marketplace loads, anonymised (no customer data, no prices)
      fields:
      - name: shipment_ref
        type: text
      - name: pickup_zone
        type: text
      - name: dest_zone
        type: text
      - name: pickup_date
        type: date
      - name: delivery_to
        type: date
      - name: goods_type
        type: text
      - name: pallets
        type: number
      - name: ldm
        type: number
      - name: weight_kg
        type: number
      - name: temp
        type: text
      - name: adr
        type: boolean
      - name: tail_lift
        type: boolean
      - name: appointment
        type: boolean
      - name: status
        type: select
        options:
        - open
        - assigned
        - closed
      - name: carrier_email
        type: email
      access:
      - role: carrier
        where:
          status: open
      - role: carrier
        where:
          carrier_email: '{user.email}'
      - role: operator
        can:
        - read
        - write
    - name: bids
      ownedBy: user
      description: Offers made by carriers on open loads
      fields:
      - name: load_ref
        type: select
        required: true
        optionsFrom: collection:loads
        label:
          it: Carico
          en: Load
          de: Ladung
      - name: carrier_email
        type: email
        required: true
        label:
          it: La tua email di accesso
          en: Your login email
          de: Ihre Login-E-Mail
      - name: price_eur
        type: number
        required: true
        label:
          it: Offerta (EUR)
          en: Bid (EUR)
          de: Gebot (EUR)
      - name: pickup_slot
        type: text
        label:
          it: Disponibilità al carico
          en: Pickup availability
          de: Verfügbarkeit Beladung
      - name: notes
        type: textarea
        label:
          it: Note
          en: Notes
          de: Hinweise
      access:
      - role: operator
    - name: assignments
      ownedBy: org
      description: Carrier choice, cost and margin of each shipment (back office)
      fields:
      - name: shipment_ref
        type: text
        required: true
        label:
          it: Riferimento spedizione
          en: Shipment ref
          de: Sendungsreferenz
      - name: carrier_email
        type: email
        required: true
        label:
          it: Vettore scelto (email)
          en: Chosen carrier (email)
          de: Gewählter Frachtführer (E-Mail)
      - name: carrier_cost
        type: number
        required: true
        label:
          it: Costo vettore (EUR)
          en: Carrier cost (EUR)
          de: Frachtführerkosten (EUR)
      - name: customer_price
        type: number
      - name: margin_eur
        type: number
      - name: margin_pct
        type: number
      - name: status
        type: select
        default: proposed
        options:
        - proposed
        - pending_approval
        - confirmed
      - name: month
        type: date
      access:
      - role: operator
        can:
        - read
        - write
    - name: carriers
      ownedBy: org
      description: Registered carriers
      fields:
      - name: name
        type: text
        required: true
      - name: email
        type: email
        required: true
      - name: zones
        type: text
        help:
          it: Zone coperte, es. IT-Lombardia, DE-Bayern
          en: Covered zones, e.g. IT-Lombardia, DE-Bayern
          de: Gebiete, z. B. IT-Lombardia, DE-Bayern
      - name: vat
        type: text
      - name: adr_certified
        type: boolean
      - name: notes
        type: textarea
      access:
      - role: operator
        can:
        - read
        - write
    - name: route_history
      ownedBy: org
      description: The forwarder's historical lanes, used to estimate prices
      fields:
      - name: origin
        type: text
        required: true
      - name: destination
        type: text
        required: true
      - name: km
        type: number
      - name: pallets
        type: number
      - name: weight_kg
        type: number
      - name: price_eur
        type: number
        required: true
      - name: date
        type: date
        required: true
      - name: adr
        type: boolean
      - name: temp
        type: text
      - name: return_empty
        type: boolean
      access:
      - role: operator
        can:
        - read
        - write
    - name: fuel_index
      ownedBy: app
      description: Weekly published diesel price
