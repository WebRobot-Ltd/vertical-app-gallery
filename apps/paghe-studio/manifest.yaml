apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: portale-paghe
  displayName: Portale Paghe
  tagline: 'Il portale per la gestione paghe e personale: dati, variabili mensili, controlli e cedolini in un unico posto.'
  description: 'Strato software di un servizio paghe: l''azienda registra i dipendenti e carica le variabili mensili, un agente
    verifica la coerenza dei dati e prepara le schede riepilogative, il consulente del lavoro partner le approva e rende disponibili
    i cedolini. Consulenza del lavoro e adempimenti verso gli enti restano in capo a professionisti abilitati.'
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#17324d'
      accent: '#1f8a70'
      background: '#f6f8fa'
      foreground: '#1a2430'
    fonts:
      body: Inter
      display: Inter
  header:
    links:
    - label: Come funziona
      href: '#come-funziona'
    cta:
      label: Accedi
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Amministratore
      assignedBy: admin_emails
    - key: hr
      label: Responsabile HR
      assignedBy: invite
    - key: consultant
      label: Consulente del lavoro
      assignedBy: derived
      from: collection:companies.consultant_email
    - key: user
      label: Dipendente
      assignedBy: signup
  limits:
  - action: create:employees
    max: 10
    window: total
    plans:
      piano_50: 50
      piano_200: 200
  - action: agent:checker
    max: 10
    window: month
    plans:
      piano_50: 30
      piano_200: 100
  agents:
  - key: checker
    role: main
    description: Verifica la coerenza delle variabili mensili, segnala valori mancanti o anomali e prepara una scheda riepilogativa
      per dipendente da sottoporre al consulente.
    profile:
      inline:
        display_name: Controllo variabili paghe
        crews:
        - id: checker
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un assistente di controllo dati per un servizio di gestione paghe. NON calcoli cedolini, NON
            dai consulenza del lavoro e NON effettui adempimenti verso enti: verifichi soltanto la coerenza dei dati e prepari
            materiale per il consulente del lavoro, che rivede e approva.


            Procedura:

            1. Con read_employees leggi i dipendenti dell''azienda (anagrafica, inquadramento, retribuzione, orario). Con
            read_variables leggi le variabili già inserite per il periodo. Se l''utente ha caricato un file, usane il testo
            come ulteriore fonte.

            2. Per ogni dipendente attivo verifica: variabili presenti per il periodo; giorni lavorati e assenze coerenti
            con il calendario del mese; straordinari plausibili rispetto all''orario settimanale; note spese con importi ragionevoli;
            dipendenti presenti nel file ma non in anagrafica e viceversa; dati anagrafici o di inquadramento mancanti. Segnala
            solo ciò che emerge dai dati, mai inventare valori.

            3. Per ogni dipendente chiama append_summary con: period, employee_email, employee_name, consultant_email (dalla
            anagrafica), summary (scheda riepilogativa in poche righe: giorni lavorati, assenze, straordinari, note spese),
            anomalies (elenco di anomalie o valori mancanti, oppure ''nessuna''), status ''da_approvare''.

            4. Alla fine chiama request_summary_review una sola volta per il periodo, indicando il numero di schede e di anomalie.


            Il report finale inizia con un titolo di primo livello "# Controllo variabili — <periodo>", poi le sezioni ##
            Esito generale, ## Anomalie da risolvere (tabella dipendente / problema / gravità), ## Schede preparate, ## Prossimi
            passi. Italiano, tono professionale, mai cifre inventate. Ricorda che le schede sono bozze soggette ad approvazione
            del consulente.'
          mcp_servers: []
    context:
    - key: company
      from: collection:companies.name
    goalTemplate: 'Azienda: {?company}{company}{/company}{!company}non indicata{/company}

      Periodo: {period}

      {?notes}Note del responsabile HR: {notes}{/notes}

      {?variables_file_text}Contenuto del file delle variabili:

      {variables_file_text}{/variables_file_text}

      Verifica i dati dei dipendenti, prepara le schede e chiedi l''approvazione del consulente. Data di oggi: {date}. Scrivi
      in italiano.'
    appTools:
    - name: read_employees
      description: Legge i dipendenti dell'azienda
      action: read
      collection: employees
      scope: user
    - name: read_variables
      description: Legge le variabili mensili inserite
      action: read
      collection: monthly_variables
      scope: user
    - name: append_summary
      description: Salva la scheda riepilogativa di un dipendente
      action: append
      collection: employee_summaries
      scope: user
    awaits:
    - summary_review
    output: markdown
    limits:
      maxTurns: 30
      maxBudgetUsd: 1.0
  inputForm:
    title: Verifica variabili del mese
    fields:
    - name: period
      type: text
      required: true
      label: Periodo (AAAA-MM)
      help: es. 2026-11
    - name: variables_file
      type: file
      accept:
      - csv
      - xlsx
      - pdf
      maxMb: 10
      multiple: false
      label: File delle variabili (facoltativo)
      help: Presenze, assenze, straordinari, note spese
    - name: notes
      type: textarea
      maxLength: 600
      label: Note (facoltative)
  data:
    collections:
    - name: companies
      description: Azienda cliente e consulente del lavoro assegnato
      ownedBy: user
      fields:
      - name: name
        type: text
        required: true
        label: Ragione sociale
      - name: vat
        type: text
        label: Partita IVA
      - name: consultant_email
        type: email
        required: true
        label: Email del consulente del lavoro
      access:
      - role: consultant
        where:
          consultant_email: '{user.email}'
        can:
        - read
    - name: employees
      description: Anagrafica, inquadramento, retribuzione e orario dei dipendenti
      ownedBy: user
      fields:
      - name: first_name
        type: text
        required: true
        label: Nome
      - name: last_name
        type: text
        required: true
        label: Cognome
      - name: email
        type: email
        required: true
        label: Email del dipendente
      - name: fiscal_code
        type: text
        label: Codice fiscale
      - name: birth_date
        type: date
        label: Data di nascita
      - name: hire_date
        type: date
        label: Data di assunzione
      - name: contract_type
        type: select
        label: Tipo di contratto
        options:
        - value: indeterminato
          label: Tempo indeterminato
        - value: determinato
          label: Tempo determinato
        - value: apprendistato
          label: Apprendistato
        - value: altro
          label: Altro
      - name: job_level
        type: text
        label: Inquadramento / livello
      - name: gross_monthly
        type: number
        label: Retribuzione lorda mensile (€)
      - name: weekly_hours
        type: number
        label: Ore settimanali
      - name: consultant_email
        type: email
        required: true
        label: Email del consulente assegnato
      access:
      - role: consultant
        where:
          consultant_email: '{user.email}'
        can:
        - read
      - role: user
        where:
          email: '{user.email}'
        can:
        - read
    - name: periods
      description: Periodi mensili con scadenze
      ownedBy: user
      fields:
      - name: period
        type: text
        required: true
        label: Periodo (AAAA-MM)
      - name: variables_due
        type: date
        required: true
        label: Scadenza caricamento variabili
      - name: approval_due
        type: date
        label: Scadenza approvazione schede
      - name: consultant_email
        type: email
        required: true
        label: Email del consulente
      access:
      - role: consultant
        where:
          consultant_email: '{user.email}'
        can:
        - read
    - name: monthly_variables
      description: Variabili del periodo per dipendente
      ownedBy: user
      fields:
      - name: period
        type: text
        required: true
        label: Periodo (AAAA-MM)
      - name: employee_email
        type: email
        required: true
        label: Email del dipendente
      - name: worked_days
        type: number
        label: Giorni lavorati
      - name: absence_days
        type: number
        label: Giorni di assenza
      - name: overtime_hours
        type: number
        label: Ore di straordinario
      - name: expenses_amount
        type: number
        label: Note spese (€)
      - name: notes
        type: textarea
        label: Note
      - name: attachment
        type: file
        accept:
        - pdf
        - jpg
        - png
        - xlsx
        - csv
        maxMb: 10
        label: Allegato
      - name: consultant_email
        type: email
        required: true
        label: Email del consulente
      access:
      - role: consultant
        where:
          consultant_email: '{user.email}'
        can:
        - read
    - name: employee_summaries
      description: Schede riepilogative preparate dall'agente, da approvare
      ownedBy: user
      fields:
      - name: period
        type: text
        label: Periodo
      - name: employee_email
        type: email
        label: Email dipendente
      - name: employee_name
        type: text
        label: Dipendente
      - name: consultant_email
        type: email
        label: Consulente
      - name: summary
        type: textarea
        label: Scheda riepilogativa
      - name: anomalies
        type: textarea
        label: Anomalie
      - name: status
        type: select
        label: Stato
        options:
        - value: da_approvare
          label: Da approvare
        - value: approvata
          label: Approvata
        - value: respinta
          label: Respinta
      access:
      - role: consultant
        where:
          consultant_email: '{user.email}'
        can:
        - read
        - write
    - name: payslips
      description: Cedolini messi a disposizione dal consulente
      ownedBy: user
      fields:
      - name: period
        type: text
        required: true
        label: Periodo (AAAA-MM)
      - name: employee_email
        type: email
        required: true
        label: Email del dipendente
      - name: company_email
        type: email
        required: true
        label: Email del responsabile HR dell'azienda
      - name: file
        type: file
        required: true
        accept:
        - pdf
        maxMb: 10
        label: Cedolino (PDF)
      access:
      - role: user
        where:
          employee_email: '{user.email}'
        can:
        - read
      - role: user
        where:
          company_email: '{user.email}'
        can:
        - read
    - name: documents
      description: Documenti personali dei dipendenti
      ownedBy: user
      fields:
      - name: employee_email
        type: email
        required: true
        label: Email del dipendente
      - name: company_email
        type: email
        required: true
        label: Email HR dell'azienda
      - name: title
        type: text
        required: true
        label: Titolo
      - name: category
        type: select
        label: Categoria
        options:
        - value: contratto
          label: Contratto
        - value: cu
          label: Certificazione Unica
        - value: lettera
          label: Lettera
        - value: altro
          label: Altro
      - name: file
        type: file
        required: true
        accept:
        - pdf
        - docx
        - jpg
        - png
        maxMb: 10
        label: File
      access:
      - role: user
        where:
          employee_email: '{user.email}'
        can:
        - read
      - role: user
        where:
          company_email: '{user.email}'
        can:
        - read
      retentionDays: 3650
  views:
  - key: home
    type: page
    nav: false
    sections:
    - type: hero
      title: Paghe e personale, **in ordine** ogni mese.
      text: Registra i dipendenti, carica le variabili del mese e lascia che un agente controlli i dati. Il consulente del
        lavoro approva, i cedolini arrivano nell'area di ciascun dipendente.
      actions:
      - label: Accedi
        href: /login
        style: primary
      note: 'Questo è lo strato software del servizio: consulenza del lavoro e adempimenti verso gli enti restano ai professionisti
        abilitati.'
    - type: steps
      id: come-funziona
      title: Come funziona
      items:
      - title: Anagrafica
        text: L'azienda registra dipendenti, inquadramento, retribuzione e orario.
        badge: 👥
      - title: Variabili mensili
        text: Il responsabile HR carica presenze, assenze, straordinari e note spese con un modulo o un file.
        badge: 📝
      - title: Controllo
        text: Un agente verifica la coerenza e segnala valori mancanti o anomali, preparando una scheda per dipendente.
        badge: 🔎
      - title: Approvazione
        text: Il consulente del lavoro partner rivede e approva prima dell'elaborazione.
        badge: ✅
      - title: Cedolini
        text: Ogni dipendente scarica solo la propria busta paga e i propri documenti.
        badge: 📄
    - type: cards
      title: Chi vede cosa
      items:
      - title: Dipendente
        text: Solo i propri cedolini e documenti.
      - title: Responsabile HR
        text: 'Tutta l''azienda: anagrafica, variabili, schede, cedolini.'
      - title: Consulente del lavoro
        text: I clienti a lui assegnati.
    - type: note
      content: Il servizio non sostituisce il consulente del lavoro. Le schede dell'agente sono bozze di controllo, non elaborazioni
        di paga.
  - key: company
    type: form
    title: Azienda
    collection: companies
    submit:
      label: Salva
      message: Dati azienda salvati.
    edit: true
    roles:
    - hr
    - admin
  - key: employee_new
    type: form
    title: Nuovo dipendente
    collection: employees
    submit:
      label: Registra dipendente
      message: Dipendente registrato.
      redirect: employees
    roles:
    - hr
    - admin
  - key: employees
    type: table
    title: Dipendenti
    source: collection:employees
    columns:
    - last_name
    - first_name
    - email
    - job_level
    - gross_monthly
    - weekly_hours
    export: true
    roles:
    - hr
    - consultant
    - admin
  - key: period_new
    type: form
    title: Nuovo periodo e scadenze
    collection: periods
    submit:
      label: Salva periodo
      message: 'Periodo salvato: riceverai i promemoria alle scadenze.'
    roles:
    - hr
    - admin
  - key: variables_new
    type: form
    title: Variabili del mese
    collection: monthly_variables
    submit:
      label: Salva variabili
      message: Variabili salvate.
    roles:
    - hr
    - admin
  - key: variables
    type: table
    title: Variabili caricate
    source: collection:monthly_variables
    columns:
    - period
    - employee_email
    - worked_days
    - absence_days
    - overtime_hours
    - expenses_amount
    export: true
    roles:
    - hr
    - consultant
    - admin
  - key: check_run
    type: new_run
    title: Verifica con l'agente
    roles:
    - hr
    - admin
  - key: checks
    type: history
    title: Verifiche precedenti
    source: run
    roles:
    - hr
    - admin
  - key: check_report
    type: report
    source: run
    printable: true
    nav: false
  - key: summaries
    type: table
    title: Schede riepilogative
    source: collection:employee_summaries
    columns:
    - period
    - employee_name
    - summary
    - anomalies
    - status
    roles:
    - hr
    - consultant
    - admin
  - key: reviews
    type: approvals
    title: Approvazioni
    approvals:
    - summary_review
    roles:
    - consultant
    - admin
  - key: payslip_upload
    type: form
    title: Pubblica cedolino
    collection: payslips
    submit:
      label: Pubblica
      message: Cedolino reso disponibile al dipendente.
    roles:
    - consultant
    - admin
  - key: payslips
    type: table
    title: Cedolini
    source: collection:payslips
    columns:
    - period
    - employee_email
    - file
    roles:
    - user
    - hr
    - consultant
    - admin
  - key: document_upload
    type: form
    title: Carica documento
    collection: documents
    submit:
      label: Carica
      message: Documento caricato.
    roles:
    - hr
    - admin
  - key: documents
    type: table
    title: Documenti
    source: collection:documents
    columns:
    - title
    - category
    - file
    roles:
    - user
    - hr
    - admin
  - key: account
    type: account
    title: Abbonamento
    roles:
    - hr
    - admin
  approvals:
  - key: summary_review
    title: Revisione schede riepilogative
    description: Il consulente del lavoro rivede le schede preparate prima dell'elaborazione.
    role: consultant
    fields:
    - period
    timeoutMinutes: 10080
    onTimeout: reject
  triggers:
  - key: summaries_approved
    'on':
      approval: summary_review
      decision: approved
    notify:
      to: owner
      subject: Schede approvate dal consulente
      body: Il consulente del lavoro ha approvato le schede riepilogative. Si procede con l'elaborazione.
      link: summaries
  - key: summaries_rejected
    'on':
      approval: summary_review
      decision: rejected
    notify:
      to: owner
      subject: Schede da correggere
      body: Il consulente ha respinto le schede riepilogative. Verifica i dati e rilancia il controllo.
      link: check_run
  - key: variables_reminder
    'on':
      date:
        collection: periods
        field: variables_due
        offsetDays: -2
        hour: 7
    notify:
      to: owner
      subject: 'Promemoria: variabili del periodo {record.period}'
      body: Tra due giorni scade il caricamento delle variabili del periodo {record.period} (presenze, assenze, straordinari,
        note spese).
      link: variables_new
  - key: variables_due_today
    'on':
      date:
        collection: periods
        field: variables_due
        offsetDays: 0
        hour: 7
    notify:
      to: owner
      subject: Oggi scade il caricamento variabili {record.period}
      body: Oggi è l'ultimo giorno per caricare le variabili del periodo {record.period}.
      link: variables_new
  - key: approval_reminder
    'on':
      date:
        collection: periods
        field: approval_due
        offsetDays: -1
        hour: 7
    notify:
      to:
      - record.consultant_email
      subject: 'Promemoria: schede {record.period} da approvare'
      body: Domani scade la revisione delle schede riepilogative del periodo {record.period}.
      link: reviews
  - key: payslip_available
    'on':
      collection: payslips
      op: insert
    notify:
      to:
      - record.employee_email
      subject: Il tuo cedolino {record.period} è disponibile
      body: Puoi scaricare il cedolino del periodo {record.period} nella tua area personale.
      link: payslips
  notifications:
    emailOnRunDone: true
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: piano_10
      price: 29
      interval: month
      label: Fino a 10 dipendenti
      includes:
      - fino a 10 dipendenti gestiti
      roles:
      - hr
    - key: piano_50
      price: 99
      interval: month
      label: Fino a 50 dipendenti
      includes:
      - fino a 50 dipendenti gestiti
      roles:
      - hr
    - key: piano_200
      price: 299
      interval: month
      label: Fino a 200 dipendenti
      includes:
      - fino a 200 dipendenti gestiti
      roles:
      - hr
