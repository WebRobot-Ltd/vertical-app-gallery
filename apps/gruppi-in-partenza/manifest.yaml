apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: gruppi-in-partenza
  displayName: Gruppi in Partenza
  tagline:
    it: 'Viaggi di gruppo per giovani adulti: scegli, prenota, parti con persone nuove.'
    en: 'Group trips for young adults: choose, book, travel with new people.'
  description:
    it: Catalogo di viaggi di gruppo con itinerario giorno per giorno, assistente in chat per scegliere, prenotazione con
      acconto, conferma automatica al raggiungimento del minimo e gruppo dei partecipanti.
    en: Group trip catalogue with day-by-day itineraries, a chat assistant, deposit booking, automatic confirmation at the
      minimum and a participant group.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#12355b'
      accent: '#f28c28'
      background: '#fbf8f3'
      foreground: '#1c2530'
    fonts:
      body: Inter
      display: Poppins
    wordmark:
    - text: 'Gruppi in '
      color: primary
    - text: Partenza
      color: accent
    buttonShape: pill
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Assistente
        en: Assistant
      href: '#assistente'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
      - trips
      - departures
      - assistant
      agents:
      - assistant
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      label:
        it: Viaggiatore
        en: Traveller
      assignedBy: signup
    - key: coordinator
      label:
        it: Coordinatore
        en: Coordinator
      assignedBy: derived
      from: collection:departures.coordinator_email
  limits:
  - action: chat
    per: ip
    max: 40
    window: day
    roles:
    - anonymous
  agents:
  - key: assistant
    role: main
    description: Helps visitors choose a trip by destination, month, duration and budget.
    appTools:
    - name: search_departures
      description: Search upcoming departures (destination, start date, duration, price, seats left, status)
      action: search
      collection: departures
      scope: all
    - name: read_trips
      description: Read trips with their day-by-day itinerary
      action: read
      collection: trips
      scope: all
    profile:
      inline:
        display_name: Assistente Gruppi in Partenza
        chat_mode: true
        crews:
        - id: assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''assistente di Gruppi in Partenza, tour operator di viaggi di gruppo per giovani adulti. Aiuti
            i visitatori a scegliere un viaggio in base a destinazione, mese, durata, budget e interessi. Usa SEMPRE gli strumenti
            search_departures e read_trips: non inventare viaggi, date, prezzi o posti. Proponi al massimo 3 opzioni, con
            date, durata, prezzo, posti liberi e un riassunto dell''itinerario; spiega che la partenza si conferma al raggiungimento
            del numero minimo di iscritti. Per prenotare invita ad accedere e usare la pagina Prenota (acconto con carta,
            saldo 30 giorni prima). Non dare consigli su assicurazioni, visti o sanità come fatti: rimanda al tour operator.
            Rispondi nella lingua dell''utente, in modo breve e amichevole.'
    goalTemplate: 'Conversazione finora:

      {history}


      Nuovo messaggio: {message}

      Rispondi nella lingua con codice ISO {lang}.'
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.3
  - key: ops
    role: helper
    description: Handles booking intake, confirms departures at the minimum and creates the group.
    appTools:
    - name: read_departures
      description: Read departures
      action: read
      collection: departures
      scope: all
    - name: write_departures
      description: Update a departure (seats_left, status)
      action: write
      collection: departures
      scope: all
    - name: read_bookings
      description: Read bookings
      action: read
      collection: bookings
      scope: all
    - name: write_bookings
      description: Update a booking
      action: write
      collection: bookings
      scope: all
    - name: read_profiles
      description: Read traveller profiles
      action: read
      collection: profiles
      scope: all
    - name: write_group_profiles
      description: Create the public profile of a participant for the group
      action: write
      collection: group_profiles
      scope: all
    profile:
      inline:
        display_name: Gruppi in Partenza operations
        crews:
        - id: ops
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''agente operativo di Gruppi in Partenza. Due compiti, indicati nel goal.

            1) NUOVA PRENOTAZIONE: leggi la prenotazione e la partenza (read_departures). Se la partenza non è aperta o non
            ha posti, imposta status=rejected nella prenotazione. Altrimenti copia nella prenotazione traveler_email (email
            dell''utente), departure_date (start_date), coordinator_email, trip_title e balance_due_date (30 giorni prima
            della partenza) e imposta status=requested. Il coordinatore la approverà.

            2) PRENOTAZIONE APPROVATA: conta le prenotazioni approved o confirmed della partenza. Decrementa seats_left della
            partenza (se non già fatto) e, se il conteggio >= min_participants e la partenza è open, imposta la partenza status=confirmed;
            poi per ogni prenotazione approved imposta status=confirmed, e per ogni partecipante crea in group_profiles un
            profilo PUBBLICO (display_name, age, languages, interests, bio, departure_id, trip_title) con members = lista
            delle email di tutti i partecipanti. Non copiare mai documenti di viaggio né dati sensibili. Se il minimo non
            è raggiunto, non fare altro. Se i posti arrivano a 0 imposta la partenza status=full. Non inventare dati: usa
            solo quelli letti. Rispondi con un breve riepilogo di cosa hai fatto.'
    goalTemplate: 'Gestisci l''evento: {event}'
    output: markdown
    limits:
      maxTurns: 25
      maxBudgetUsd: 0.6
  data:
    collections:
    - name: trips
      ownedBy: shared
      searchable: true
      description: Catalogo viaggi con itinerario giorno per giorno
      fields:
      - name: title
        type: text
        required: true
        label: Titolo
      - name: destination
        type: text
        required: true
        label: Destinazione
      - name: duration_days
        type: number
        required: true
        label: Durata (giorni)
      - name: price
        type: number
        required: true
        label: Prezzo (EUR)
      - name: deposit
        type: number
        label: Acconto (EUR)
      - name: min_participants
        type: number
        required: true
        label: Minimo partecipanti
      - name: max_participants
        type: number
        label: Massimo partecipanti
      - name: coordinator_name
        type: text
        label: Coordinatore
      - name: description
        type: textarea
        label: Descrizione
      - name: itinerary
        type: textarea
        label: Itinerario giorno per giorno
      - name: cover
        type: url
        label: Immagine
    - name: departures
      ownedBy: shared
      searchable: true
      description: Date di partenza dei viaggi
      fields:
      - name: trip_title
        type: text
        required: true
        label: Viaggio
      - name: destination
        type: text
        label: Destinazione
      - name: start_date
        type: date
        required: true
        label: Partenza
      - name: month
        type: text
        label: Mese (AAAA-MM)
      - name: duration_days
        type: number
        label: Durata
      - name: price
        type: number
        label: Prezzo
      - name: deposit
        type: number
        label: Acconto
      - name: seats_left
        type: number
        label: Posti liberi
      - name: min_participants
        type: number
        label: Minimo
      - name: coordinator_email
        type: email
        label: Email coordinatore
      - name: status
        type: select
        label: Stato
        options:
        - open
        - confirmed
        - full
        - cancelled
        default: open
    - name: profiles
      ownedBy: user
      description: Profilo privato del viaggiatore e documenti
      retentionDays: 1095
      fields:
      - name: display_name
        type: text
        required: true
        label: Nome visibile
      - name: age
        type: number
        required: true
        label: Età
      - name: languages
        type: text
        label: Lingue parlate
      - name: interests
        type: text
        label: Interessi
      - name: bio
        type: textarea
        maxLength: 500
        label: Chi sono
      - name: passport_expiry
        type: date
        label: Scadenza documento
      - name: travel_document
        type: file
        accept:
        - pdf
        - jpg
        - png
        maxMb: 10
        label: Documento di viaggio
    - name: bookings
      ownedBy: user
      description: Prenotazioni dei viaggiatori
      retentionDays: 1095
      access:
      - role: coordinator
        where:
          coordinator_email: '{user.email}'
        can:
        - read
        - write
      - role: admin
        can:
        - read
        - write
      fields:
      - name: departure_id
        type: select
        required: true
        label: Partenza
        optionsFrom: collection:departures
      - name: notes
        type: textarea
        label: Note
      - name: status
        type: select
        label: Stato
        options:
        - requested
        - approved
        - confirmed
        - rejected
        - cancelled
        default: requested
      - name: trip_title
        type: text
        label: Viaggio
      - name: traveler_email
        type: email
        label: Email viaggiatore
      - name: coordinator_email
        type: email
        label: Email coordinatore
      - name: departure_date
        type: date
        label: Data partenza
      - name: balance_due_date
        type: date
        label: Scadenza saldo
    - name: group_profiles
      ownedBy: user
      description: Profili pubblici dei partecipanti a una partenza confermata
      retentionDays: 365
      access:
      - role: user
        where:
          members: '{user.email}'
        can:
        - read
      - role: coordinator
      - role: admin
      fields:
      - name: display_name
        type: text
        label: Nome
      - name: age
        type: number
        label: Età
      - name: languages
        type: text
        label: Lingue
      - name: interests
        type: text
        label: Interessi
      - name: bio
        type: textarea
        label: Chi sono
      - name: trip_title
        type: text
        label: Viaggio
      - name: departure_id
        type: text
        label: Partenza
      - name: members
        type: array
        label: Email dei partecipanti
  views:
  - key: home
    type: page
    nav: false
    title: Gruppi in Partenza
    sections:
    - type: hero
      title:
        it: Parti con un **gruppo**, torna con nuovi amici.
        en: Leave with a **group**, come back with new friends.
      text:
        it: Viaggi di gruppo per giovani adulti, con itinerario giorno per giorno e un coordinatore con voi. Chiedi all'assistente
          il viaggio giusto per te.
        en: Group trips for young adults, with a day-by-day itinerary and a coordinator. Ask the assistant for the right trip.
      actions:
      - label:
          it: Vedi le partenze
          en: See departures
        href: /v/departures
        style: primary
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: ghost
      band: true
    - type: view
      id: assistente
      title:
        it: Chiedi all'assistente
        en: Ask the assistant
      view: assistant
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Scegli
          en: Choose
        text:
          it: Cerca per destinazione, mese, durata e budget, o fatti consigliare.
          en: Search by destination, month, duration and budget, or get advice.
        badge: 🧭
      - title:
          it: Prenota
          en: Book
        text:
          it: Compila il profilo e blocca il posto con un acconto; il saldo 30 giorni prima.
          en: Fill in your profile and hold your seat with a deposit; balance 30 days before.
        badge: 💳
      - title:
          it: Conferma
          en: Confirmation
        text:
          it: Al raggiungimento del minimo il viaggio è confermato e si crea il gruppo.
          en: When the minimum is reached the trip is confirmed and the group is created.
        badge: ✅
      - title:
          it: Parti
          en: Go
        text:
          it: Conosci gli altri partecipanti e ricevi i promemoria per documenti, visti e bagaglio.
          en: Meet the other participants and get reminders for documents, visas and luggage.
        badge: 🎒
    - type: note
      content:
        it: Organizzazione dei viaggi, assicurazioni e guide in loco sono a cura del tour operator.
        en: Trip organisation, insurance and local guides are provided by the tour operator.
  - key: trips
    type: page
    title:
      it: Viaggi
      en: Trips
    sections:
    - type: data
      source: collection:trips
      display: cards
      fields:
      - key: title
      - key: destination
      - key: duration_days
        label: Giorni
        format: number
      - key: price
        label: Prezzo
        format: money
      - key: itinerary
      sort:
        field: title
        dir: asc
      limit: 60
      empty:
        it: Nessun viaggio in catalogo.
        en: No trips yet.
  - key: departures
    type: table
    title:
      it: Partenze
      en: Departures
    source: collection:departures
    columns:
    - trip_title
    - destination
    - start_date
    - duration_days
    - price
    - seats_left
    - status
    export: false
  - key: assistant
    type: chat
    title:
      it: Assistente
      en: Assistant
    source: agent:assistant
    examples:
    - it: Cerco un viaggio di 7 giorni a settembre sotto i 1000 euro
      en: I want a 7-day trip in September under 1000 euro
    - it: Quali viaggi ci sono in Portogallo?
      en: Which trips are there to Portugal?
    placeholder:
      it: Destinazione, mese, durata, budget…
      en: Destination, month, duration, budget…
  - key: profile
    type: form
    title:
      it: Il mio profilo
      en: My profile
    collection: profiles
    edit: true
    submit:
      label:
        it: Salva profilo
        en: Save profile
      message:
        it: Profilo salvato.
        en: Profile saved.
      redirect: book
    roles:
    - user
    - admin
  - key: book
    type: form
    title:
      it: Prenota un posto
      en: Book a seat
    collection: bookings
    fields:
    - departure_id
    - notes
    submit:
      label:
        it: Richiedi il posto
        en: Request seat
      message:
        it: 'Richiesta inviata: il coordinatore la approverà. Poi potrai versare l''acconto.'
        en: 'Request sent: the coordinator will approve it. Then you can pay the deposit.'
      redirect: my_bookings
    roles:
    - user
    - admin
  - key: my_bookings
    type: table
    title:
      it: Le mie prenotazioni
      en: My bookings
    source: collection:bookings
    columns:
    - trip_title
    - departure_date
    - status
    - balance_due_date
    roles:
    - user
  - key: group
    type: cards
    title:
      it: Il mio gruppo
      en: My group
    source: collection:group_profiles
    columns:
    - display_name
    - age
    - languages
    - interests
    - bio
    - trip_title
    roles:
    - user
    - coordinator
    - admin
  - key: coordinator_review
    type: form
    title:
      it: Approva iscrizione
      en: Approve booking
    collection: bookings
    fields:
    - status
    edit: true
    submit:
      label:
        it: Salva
        en: Save
      redirect: coordinator_bookings
    nav: false
    roles:
    - coordinator
    - admin
  - key: coordinator_bookings
    type: table
    title:
      it: Iscrizioni dei miei gruppi
      en: My groups' bookings
    source: collection:bookings
    columns:
    - trip_title
    - traveler_email
    - departure_date
    - status
    roles:
    - coordinator
    - admin
  - key: admin_bookings
    type: table
    title:
      it: Tutte le prenotazioni
      en: All bookings
    source: collection:bookings
    columns:
    - trip_title
    - traveler_email
    - departure_date
    - status
    - balance_due_date
    export: true
    roles:
    - admin
  - key: account
    type: account
    title:
      it: Pagamenti
      en: Payments
    roles:
    - user
  triggers:
  - key: booking_intake
    'on':
      collection: bookings
      op: insert
      where:
        status: requested
    start:
      agent: ops
    goal: 'Compito 1 (NUOVA PRENOTAZIONE). Prenotazione: {event}. Partenza scelta: {record.departure_id}. Utente: {user}.'
    asUser: false
  - key: booking_approved
    'on':
      collection: bookings
      op: update
      where:
        status: approved
    start:
      agent: ops
    goal: 'Compito 2 (PRENOTAZIONE APPROVATA). Prenotazione: {event}. Partenza: {record.departure_id}.'
    asUser: false
  - key: booking_confirmed
    'on':
      collection: bookings
      op: update
      where:
        status: confirmed
    notify:
      to:
      - record.traveler_email
      subject:
        it: 'Viaggio confermato: {record.trip_title}'
        en: 'Trip confirmed: {record.trip_title}'
      body:
        it: 'Buone notizie: la partenza del {record.departure_date} per {record.trip_title} ha raggiunto il numero minimo
          ed è confermata. Il gruppo è stato creato: puoi vedere i profili degli altri partecipanti nell''app. Ricorda il
          saldo entro il {record.balance_due_date}.'
        en: 'Good news: the {record.departure_date} departure of {record.trip_title} has reached the minimum and is confirmed.
          Your group is ready in the app. Balance due by {record.balance_due_date}.'
      link: group
  - key: remind_documents
    'on':
      date:
        collection: bookings
        field: departure_date
        offsetDays: -45
        hour: 8
      where:
        status: confirmed
    notify:
      to:
      - record.traveler_email
      subject:
        it: Controlla documenti e visti per {record.trip_title}
        en: Check documents and visas for {record.trip_title}
      body:
        it: 'Mancano 45 giorni alla partenza: verifica che il documento di viaggio sia valido e, se serve, richiedi il visto.
          Carica il documento nel tuo profilo.'
        en: '45 days to departure: check your travel document is valid and apply for a visa if needed. Upload it in your profile.'
      link: profile
  - key: remind_balance
    'on':
      date:
        collection: bookings
        field: departure_date
        offsetDays: -30
        hour: 8
      where:
        status: confirmed
    notify:
      to:
      - record.traveler_email
      subject:
        it: Saldo del viaggio {record.trip_title}
        en: Balance for {record.trip_title}
      body:
        it: Oggi scade il saldo del tuo viaggio, 30 giorni prima della partenza. Accedi per completare il pagamento.
        en: Your trip balance is due today, 30 days before departure. Sign in to pay.
      link: account
  - key: remind_luggage
    'on':
      date:
        collection: bookings
        field: departure_date
        offsetDays: -7
        hour: 8
      where:
        status: confirmed
    notify:
      to:
      - record.traveler_email
      subject:
        it: 'Una settimana alla partenza: bagaglio'
        en: 'One week to go: luggage'
      body:
        it: Mancano 7 giorni a {record.trip_title}. Prepara il bagaglio secondo le indicazioni del coordinatore e controlla
          i documenti.
        en: 7 days to {record.trip_title}. Pack following your coordinator's guidance and re-check your documents.
      link: my_bookings
  billing:
    modes:
    - credits
    signupCredits: 0
    packs:
    - key: deposit
      credits: 150
      price: 150
      label:
        it: Acconto viaggio
        en: Trip deposit
    - key: balance
      credits: 500
      price: 500
      label:
        it: Saldo viaggio
        en: Trip balance
  mobile:
    appId: eu.webrobot.gruppiinpartenza
  extensions:
  - key: trip_payments
    description: 'Acconto e saldo calcolati sul prezzo del singolo viaggio, con addebito automatico a 30 giorni dalla partenza,
      non sono ancora disponibili: per ora i pagamenti usano pacchetti Stripe Connect (incassati dal tour operator) e il coordinatore/admin
      riconcilia la prenotazione.'
  - key: group_chat
    description: Chat di gruppo tra viaggiatori in tempo reale non disponibile; per ora il gruppo vede i profili dei partecipanti.
  - key: offline_itinerary
    description: L'app mobile con itinerario offline (cache locale) richiede la shell nativa Capacitor e una funzione di sincronizzazione
      offline non ancora disponibile; è dichiarato solo l'appId.
  - key: waiting_list
    description: Verifica automatica del minimo partecipanti legata all'approvazione del coordinatore; nessuna lista d'attesa
      e nessun rimborso automatico se la partenza viene annullata.
