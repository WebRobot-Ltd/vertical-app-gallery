apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: gruppi-in-partenza
  displayName: Gruppi in Partenza
  tagline:
    it: 'Viaggi di gruppo per giovani adulti: scegli, prenota, parti con persone nuove.'
    en: 'Group trips for young adults: choose, book, travel with new people.'
  description:
    it: Catalogo di viaggi di gruppo con itinerario giorno per giorno, assistente in chat per scegliere, prenotazione con
      acconto, gruppo dei partecipanti e promemoria prima della partenza.
    en: Catalogue of group trips with a day-by-day itinerary, a chat assistant to help you choose, deposit booking, a participants'
      group and pre-departure reminders.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#12355b'
      accent: '#f26b3a'
      background: '#fbf8f3'
      foreground: '#1d232b'
    fonts:
      body: Inter
      display: Poppins
    wordmark:
    - text: 'Gruppi in '
      color: primary
    - text: Partenza
      color: accent
    button: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Viaggi
        en: Trips
      href: /v/departures
    - label:
        it: Assistente
        en: Assistant
      href: '#assistente'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
      - departures
      - assistant
      agents:
      - guide
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: coordinator
      label:
        it: Coordinatore
        en: Coordinator
      assignedBy: derived
      from: collection:departures.coordinator_email
    - key: user
      label:
        it: Viaggiatore
        en: Traveller
      assignedBy: signup
  limits:
  - action: chat
    per: ip
    max: 30
    window: day
    roles:
    - anonymous
  - action: agent:booker
    per: user
    max: 10
    window: day
    roles:
    - user
  egress:
    hosts:
    - example.invalid
    notes: unused
  agents:
  - key: guide
    role: main
    description: Helps visitors choose a trip by destination, month, duration and budget.
    profile:
      inline:
        display_name: Gruppi in Partenza guide
        chat_mode: true
        crews:
        - id: guide
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the friendly assistant of Gruppi in Partenza, a tour operator for group trips for young
            adults. Help the visitor pick a trip by asking, only if missing, destination, month, duration and budget. Use
            the tools search_trips and search_departures to read the real catalogue; recommend at most 3 options with destination,
            dates, price, seats left and a one-line itinerary highlight, and link to /v/departures. Never invent trips, dates,
            prices or availability; if nothing matches, say so and suggest the closest options. You do not handle insurance,
            on-site guides or trip organisation: those belong to the tour operator. Invite the visitor to sign in to book.
            Reply in the visitor''s language, short and warm.'
    goalTemplate: 'Conversation so far:

      {history}

      New message: {message}

      Reply in the language with ISO code {lang}. Today is {date}.'
    appTools:
    - name: search_trips
      description: Search the trip catalogue
      action: search
      collection: trips
      scope: all
    - name: search_departures
      description: Search departures (date, price, seats, status)
      action: search
      collection: departures
      scope: all
    output: markdown
    limits:
      maxTurns: 6
      maxBudgetUsd: 0.3
  - key: booker
    role: helper
    description: Saves the traveller's profile, checks seats and asks the coordinator to approve the booking.
    profile:
      inline:
        display_name: Gruppi in Partenza booking
        crews:
        - id: booker
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You process a booking request for a group trip. 1) Read the departure with read_departures and check
            it is open and has free seats; if not, say so. 2) Save the traveller''s profile with write_profile (age, languages,
            interests, passport expiry, public bio). 3) Create a booking with write_booking, status pending, deposit due now
            and balance due 30 days before the departure date. 4) Call request_booking_review once, with the departure, the
            traveller''s age, languages and interests. Never ask for passport numbers or other document numbers: only the
            expiry date. Start with a level-1 title "# Prenotazione — <trip>" then sections ## Riepilogo, ## Acconto e saldo,
            ## Prossimi passi (the coordinator approves, then you pay the deposit by card). Write in the language with ISO
            code from the goal. Do not invent prices.'
    goalTemplate: 'Departure: {departure}

      Age: {age}

      Languages: {languages}

      Interests: {interests}

      Passport expiry: {passport_expiry}

      {?bio}Public bio: {bio}{/bio}

      Traveller: {user}. Today is {date}. Language: {lang}.'
    appTools:
    - name: read_departures
      description: Read departures
      action: read
      collection: departures
      scope: all
    - name: write_profile
      description: Save the traveller's own profile
      action: write
      collection: profiles
      scope: user
    - name: write_booking
      description: Create or update the traveller's booking
      action: write
      collection: bookings
      scope: user
    awaits:
    - booking_review
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.3
  - key: enroller
    role: helper
    description: After approval, publishes the traveller's public profile among the participants.
    profile:
      inline:
        display_name: Gruppi in Partenza enroller
        crews:
        - id: enroller
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 5
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'An approval decision on a booking arrived. If approved: read the traveller''s own profile with read_profile
            and add one record to participants with add_participant (departure, display first name only, age band such as
            20-24, languages, interests, bio) and mark the booking approved with write_booking. If rejected, mark the booking
            rejected with write_booking. Never publish surnames, documents or contact details. Start with "# Iscrizione —
            esito" and say what you did in two lines.'
    appTools:
    - name: read_profile
      description: Read the traveller's own profile
      action: read
      collection: profiles
      scope: user
    - name: write_booking
      description: Create or update the traveller's booking
      action: write
      collection: bookings
      scope: user
    - name: add_participant
      description: Publish the public profile of a participant
      action: append
      collection: participants
      scope: all
    output: markdown
  - key: group_manager
    role: scheduled
    description: 'Daily: confirms departures that reached the minimum, creates the group and announces it.'
    profile:
      inline:
        display_name: Gruppi in Partenza group manager
        crews:
        - id: group_manager
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Every day, read the open departures (read_departures) and the participants (read_participants).
            For each departure whose number of approved participants is at least min_participants and whose status is still
            open: set its status to confirmed with write_departure, create the group with create_group (departure, member
            first names, coordinator) and post an announcement with post_announcement saying the trip is confirmed, with date,
            meeting details from the catalogue and the next steps (balance due 30 days before departure). Do not touch other
            departures. Never invent figures. Start with "# Partenze confermate — <date>" and list what you did, or say that
            nothing changed.'
    goalTemplate: Today is {date}. Check all open departures and confirm those that reached the minimum.
    appTools:
    - name: read_departures
      description: Read departures
      action: read
      collection: departures
      scope: all
    - name: read_participants
      description: Read participants
      action: read
      collection: participants
      scope: all
    - name: write_departure
      description: Update a departure's status
      action: write
      collection: departures
      scope: all
    - name: create_group
      description: Create the travel group
      action: write
      collection: groups
      scope: all
    - name: post_announcement
      description: Post an announcement visible to participants
      action: append
      collection: announcements
      scope: all
    output: markdown
    limits:
      maxTurns: 10
      maxBudgetUsd: 0.4
  - key: reminder
    role: helper
    description: 'Weekly reminders for one traveller''s departure: documents, visas, luggage.'
    memory: instance
    writesTo:
      collection: reminders
    profile:
      inline:
        display_name: Gruppi in Partenza reminders
        crews:
        - id: reminder
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 5
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You prepare the weekly pre-departure reminder for one traveller and one departure. Read the departure
            and trip with read_departures and search_trips. Start with "# Promemoria — <destination>, <weeks> settimane alla
            partenza". Sections: ## Documenti (passport validity usually at least 6 months after return; check requirements),
            ## Visti e ingresso (say it is general guidance and to verify on the official government site, never as a certainty),
            ## Bagaglio (suited to the season and itinerary), ## Pagamenti (balance due 30 days before departure). Under 250
            words, lead with what is due soonest and what changed since last time; never invent rules. At the end call remember
            once with the key points.'
    appTools:
    - name: read_departures
      description: Read departures
      action: read
      collection: departures
      scope: all
    - name: search_trips
      description: Search the trip catalogue
      action: search
      collection: trips
      scope: all
    output: markdown
    limits:
      maxTurns: 5
      maxBudgetUsd: 0.2
  inputForm:
    title:
      it: Prenota un posto
      en: Book a seat
    fields:
    - name: departure
      type: relation
      relation: departures
      required: true
      label:
        it: Partenza
        en: Departure
    - name: age
      type: number
      required: true
      label:
        it: Età
        en: Age
    - name: languages
      type: text
      required: true
      label:
        it: Lingue parlate
        en: Languages
    - name: interests
      type: textarea
      maxLength: 400
      label:
        it: Interessi
        en: Interests
    - name: passport_expiry
      type: date
      label:
        it: Scadenza passaporto/documento
        en: Passport/ID expiry
    - name: bio
      type: textarea
      maxLength: 300
      label:
        it: Presentazione per gli altri partecipanti (facoltativa)
        en: Intro for other participants (optional)
  data:
    collections:
    - name: trips
      ownedBy: shared
      description: Trip catalogue
      searchable: true
      fields:
      - name: title
        type: text
        required: true
      - name: destination
        type: text
        required: true
      - name: duration_days
        type: number
      - name: budget_from
        type: number
      - name: summary
        type: textarea
      - name: itinerary
        type: textarea
        help: Day-by-day itinerary
    - name: departures
      ownedBy: shared
      description: Departure dates with price, seats and coordinator
      searchable: true
      fields:
      - name: trip
        type: relation
        relation: trips
        required: true
      - name: title
        type: text
      - name: destination
        type: text
      - name: start_date
        type: date
        required: true
      - name: month
        type: text
      - name: duration_days
        type: number
      - name: price
        type: number
        required: true
      - name: deposit
        type: number
      - name: seats_total
        type: number
      - name: seats_left
        type: number
      - name: min_participants
        type: number
      - name: coordinator_email
        type: email
      - name: status
        type: select
        options:
        - open
        - confirmed
        - full
        - cancelled
    - name: profiles
      ownedBy: user
      description: The traveller's private profile
      fields:
      - name: age
        type: number
      - name: languages
        type: text
      - name: interests
        type: textarea
      - name: passport_expiry
        type: date
      - name: bio
        type: textarea
    - name: bookings
      ownedBy: user
      description: The traveller's bookings
      fields:
      - name: departure
        type: relation
        relation: departures
      - name: status
        type: select
        options:
        - pending
        - approved
        - rejected
        - cancelled
      - name: deposit_due
        type: number
      - name: balance_due
        type: number
      - name: balance_due_date
        type: date
    - name: participants
      ownedBy: shared
      description: Public profiles of approved participants
      fields:
      - name: departure
        type: relation
        relation: departures
      - name: first_name
        type: text
      - name: age_band
        type: text
      - name: languages
        type: text
      - name: interests
        type: text
      - name: bio
        type: textarea
    - name: groups
      ownedBy: shared
      description: Travel groups created when a departure is confirmed
      fields:
      - name: departure
        type: relation
        relation: departures
      - name: members
        type: textarea
      - name: coordinator
        type: text
    - name: announcements
      ownedBy: shared
      description: Announcements for the participants of a departure
      fields:
      - name: departure
        type: relation
        relation: departures
      - name: title
        type: text
      - name: message
        type: textarea
    - name: reminders
      ownedBy: instance
      description: Weekly pre-departure reminders of each traveller
  templates:
  - key: trip_reminders
    title:
      it: Promemoria di viaggio
      en: Trip reminders
    description:
      it: Ogni settimana documenti, visti e bagaglio per la tua partenza.
      en: Every week documents, visas and luggage for your departure.
    agent: reminder
    params:
    - name: departure
      type: relation
      relation: departures
      required: true
      label:
        it: Partenza
        en: Departure
    goal: 'Reminders for "{instance}": departure {departure}. Today is {date}. Write in the language with ISO code {lang}.'
    schedule:
      cron: 0 8 * * 1
      userCanChange: true
    maxPerUser: 5
  approvals:
  - key: booking_review
    title:
      it: Approvazione iscrizione
      en: Booking approval
    role: coordinator
    decidedBy: role
    fields:
    - departure
    - age
    - languages
    - interests
    timeoutMinutes: 4320
    onTimeout: reject
  triggers:
  - key: on_booking_decision
    'on':
      approval: booking_review
      decision: any
    start:
      agent: enroller
    goal: 'Decision on the booking: {event}'
    asUser: true
  schedules:
  - agent: group_manager
    cron: 0 6 * * *
    action: run
    owner: app
  views:
  - key: home
    type: page
    title: Gruppi in Partenza
    nav: false
    sections:
    - type: hero
      eyebrow:
        it: Viaggi di gruppo · 20-35 anni
        en: Group trips · ages 20-35
      title:
        it: Parti con **persone nuove**, torna con amici veri.
        en: Travel with **new people**, come back with real friends.
      text:
        it: Itinerari giorno per giorno, gruppi piccoli, un coordinatore per ogni partenza. Chiedi all'assistente quale viaggio
          fa per te.
        en: Day-by-day itineraries, small groups, a coordinator on every departure. Ask the assistant which trip suits you.
      actions:
      - label:
          it: Vedi le partenze
          en: See departures
        href: /v/departures
        style: primary
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Scegli
          en: Choose
        text:
          it: Cerca per destinazione, mese, durata e budget, o fatti consigliare dall'assistente.
          en: Search by destination, month, duration and budget, or let the assistant advise you.
        badge: 🧭
      - title:
          it: Prenota
          en: Book
        text:
          it: Compili il profilo, il coordinatore approva, paghi un acconto con carta e il saldo 30 giorni prima.
          en: Fill in your profile, the coordinator approves, you pay a deposit by card and the balance 30 days before.
        badge: 💳
      - title:
          it: Parti
          en: Go
        text:
          it: Al raggiungimento del minimo la partenza è confermata e si crea il gruppo. Ricevi promemoria su documenti, visti
            e bagaglio.
          en: When the minimum is reached the trip is confirmed and the group is created. You get reminders on documents,
            visas and luggage.
        badge: ✈️
    - type: view
      id: assistente
      title:
        it: Chiedi all'assistente
        en: Ask the assistant
      view: assistant
    - type: data
      title:
        it: Prossime partenze
        en: Upcoming departures
      source: collection:departures
      display: cards
      fields:
      - key: title
        label:
          it: Viaggio
          en: Trip
      - key: start_date
        label:
          it: Partenza
          en: Departure
        format: date
      - key: price
        label:
          it: Prezzo
          en: Price
        format: money
      - key: seats_left
        label:
          it: Posti
          en: Seats
        format: number
      filters:
      - field: status
        op: '='
        value: open
      sort:
        field: start_date
        dir: asc
      limit: 6
    - type: note
      content:
        it: 'Organizzazione dei viaggi, assicurazioni e guide in loco sono a cura del tour operator. Le informazioni su documenti
          e visti sono indicative: verifica sempre i siti ufficiali.'
        en: 'Trip organisation, insurance and on-site guides are provided by the tour operator. Document and visa information
          is indicative: always check official sites.'
  - key: assistant
    type: chat
    source: agent:guide
    title:
      it: Assistente
      en: Assistant
    examples:
    - Un viaggio di una settimana ad agosto sotto i 1200 euro
    - Cosa c'è in Portogallo a settembre?
    - Quale viaggio è adatto a chi viaggia da solo?
    placeholder:
      it: Dove vorresti andare?
      en: Where would you like to go?
    nav: false
  - key: departures
    type: table
    title:
      it: Viaggi e partenze
      en: Trips and departures
    source: collection:departures
    data:
      display: table
      fields:
      - key: title
        label:
          it: Viaggio
          en: Trip
      - key: destination
        label:
          it: Destinazione
          en: Destination
      - key: start_date
        label:
          it: Partenza
          en: Departure
        format: date
      - key: duration_days
        label:
          it: Giorni
          en: Days
        format: number
      - key: price
        label:
          it: Prezzo
          en: Price
        format: money
      - key: seats_left
        label:
          it: Posti
          en: Seats
        format: number
      - key: status
        label:
          it: Stato
          en: Status
        format: badge
      sort:
        field: start_date
        dir: asc
      limit: 100
      empty:
        it: Nessuna partenza al momento.
        en: No departures right now.
  - key: itineraries
    type: cards
    title:
      it: Itinerari
      en: Itineraries
    source: collection:trips
    data:
      display: cards
      fields:
      - key: title
      - key: destination
      - key: duration_days
        format: number
      - key: itinerary
      limit: 100
  - key: book
    type: new_run
    title:
      it: Prenota
      en: Book
    roles:
    - user
    - admin
  - key: my_bookings
    type: table
    title:
      it: Le mie prenotazioni
      en: My bookings
    source: collection:bookings
    roles:
    - user
    data:
      display: table
      fields:
      - key: departure
        label:
          it: Partenza
          en: Departure
      - key: status
        label:
          it: Stato
          en: Status
        format: badge
      - key: deposit_due
        label:
          it: Acconto
          en: Deposit
        format: money
      - key: balance_due
        label:
          it: Saldo
          en: Balance
        format: money
      - key: balance_due_date
        label:
          it: Entro
          en: Due
        format: date
  - key: booking_report
    type: report
    source: run
    printable: true
    nav: false
  - key: group
    type: cards
    title:
      it: Il mio gruppo
      en: My group
    source: collection:participants
    roles:
    - user
    - coordinator
    - admin
    data:
      display: cards
      fields:
      - key: first_name
        label:
          it: Nome
          en: Name
      - key: age_band
        label:
          it: Età
          en: Age
      - key: languages
        label:
          it: Lingue
          en: Languages
      - key: interests
        label:
          it: Interessi
          en: Interests
      - key: bio
        label: Bio
      limit: 100
  - key: news
    type: list
    title:
      it: Annunci del gruppo
      en: Group announcements
    source: collection:announcements
    roles:
    - user
    - coordinator
    - admin
    data:
      display: list
      fields:
      - key: title
      - key: message
      limit: 50
  - key: watches
    type: instances
    template: trip_reminders
    title:
      it: Promemoria
      en: Reminders
    roles:
    - user
  - key: approvals
    type: approvals
    title:
      it: Iscrizioni da approvare
      en: Bookings to approve
    approvals:
    - booking_review
    roles:
    - coordinator
    - admin
  - key: admin
    type: admin
    title:
      it: Tutte le prenotazioni
      en: All bookings
    roles:
    - admin
  - key: account
    type: account
    title:
      it: Pagamenti
      en: Payments
    roles:
    - user
  billing:
    modes:
    - per_transaction
    currency: eur
    transactionFeePct: 0
    packs: []
    costs: {}
  mobile:
    appId: eu.webrobot.gruppiinpartenza
  extensions:
  - key: group_chat
    description: 'A real-time chat among the participants of a departure: the manifest only has agent chats. For now the group
      sees the participants'' profiles and the announcements.'
  - key: deposit_balance_schedule
    description: 'Card payment of the deposit at booking and automatic collection of the balance 30 days before departure,
      with the full trip price going to the tour operator through Stripe Connect: payment amounts per booking and the balance
      schedule need custom logic; dates are recorded on the booking.'
  - key: offline_itinerary
    description: 'Offline itinerary in the mobile app: the Capacitor shell is declared, but offline caching of the itinerary
      is not available yet.'
  - key: notifications
    description: 'Emails/push to announce confirmation and send reminders are not available yet: users see announcements and
      reminders inside the app.'
  - key: document_upload
    description: 'Travel documents cannot be uploaded: only the expiry date is collected; passport numbers are never stored.'
