apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: archivio-parlante
  displayName: Archivio Parlante
  tagline:
    it: Chiedi ai manuali della tua azienda. Risposte brevi, con il passaggio esatto.
    en: Ask your company's manuals. Short answers, with the exact passage.
  description:
    it: Motore di ricerca interno in chat per manuali, procedure e documentazione. Ogni dipendente vede solo i documenti autorizzati,
      e le domande senza risposta diventano lacune da colmare.
    en: An internal chat search engine for manuals, procedures and documentation. Each employee only sees authorised documents,
      and unanswered questions become gaps to fill.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#1f3a5f'
      accent: '#d9822b'
      background: '#f7f8fa'
      foreground: '#1a2230'
    fonts:
      body: Inter
      display: Source Serif 4
    wordmark:
    - text: Archivio
      color: primary
    - text: Parlante
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Sicurezza
        en: Security
      href: '#sicurezza'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
      - public_chat
      agents:
      - public_assistant
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: employee
      label:
        it: Dipendente
        en: Employee
      assignedBy: invite
    - key: technical
      label:
        it: Tecnico
        en: Technical staff
      assignedBy: invite
  limits:
  - action: chat
    per: user
    max: 100
    window: day
  - action: chat
    per: ip
    max: 30
    window: day
    roles:
    - anonymous
  - action: create:documents
    max: 100
    window: total
    plans:
      business: 1000
      enterprise: -1
  agents:
  - key: assistant
    role: main
    description: Answers employees' questions using only the documents they may see; logs gaps.
    memory: none
    profile:
      inline:
        display_name: Archivio Parlante assistant
        crews:
        - id: assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the internal documentation assistant of a company. For every question: 1) call search_docs
            with the key terms (try synonyms and the other language if nothing comes up), read the best records with read_docs.
            2) Answer ONLY from what those documents say, concisely (max 120 words), in the user''s language. 3) Always quote
            the exact passage in a blockquote and give the source as a link: [Document title, section/page](/v/document?id=<record
            id>). Mention the document version and review date when present; if the document looks outdated (review_due in
            the past) warn the user. 4) If you find no reliable answer, say so plainly, never guess or use outside knowledge,
            and suggest who to ask by department. 5) Always call log_question exactly once at the end: question, topic (2-3
            words, lowercase), answered true/false, document_title if any. You can only see documents the user is authorised
            to see; never reveal that others exist. Never invent torque values, figures or procedures.'
    goalTemplate: 'Conversation so far:

      {history}


      New question from {user}: {message}

      Reply in the language with ISO code {lang}. Today is {date}.'
    appTools:
    - name: search_docs
      description: Search the documents the user may see (title, department, content)
      action: search
      collection: documents
      scope: all
    - name: read_docs
      description: Read a document record with its content
      action: read
      collection: documents
      scope: all
    - name: log_question
      description: 'Record the question asked and whether it was answered (fields: question, topic, answered, document_title)'
      action: append
      collection: questions
      scope: user
    output: markdown
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.4
  - key: public_assistant
    role: helper
    description: After-sales assistant for the customer portal, limited to public documents.
    profile:
      inline:
        display_name: Archivio Parlante public assistant
        crews:
        - id: public_assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.25
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You are the after-sales assistant on a customer portal. Use search_public and read_public to find
            the answer ONLY in the public documents. Answer briefly (max 100 words) in the customer's language, quote the
            exact passage and link the source [Title](/v/public_document?id=<record id>). If the answer is not in the public
            documents, say so and invite the customer to contact support; never invent specifications, safety values or warranty
            terms.
    goalTemplate: 'Conversation so far:

      {history}


      Customer question: {message}

      Reply in the language with ISO code {lang}.'
    appTools:
    - name: search_public
      description: Search the public documents
      action: search
      collection: public_documents
      scope: all
    - name: read_public
      description: Read a public document with its content
      action: read
      collection: public_documents
      scope: all
    output: markdown
  - key: indexer
    role: setup
    description: Reads an uploaded file and stores its text and sections in the record.
    profile:
      inline:
        display_name: Archivio Parlante indexer
        crews:
        - id: indexer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You prepare an uploaded document for search. Read the file with read_upload (OCR included), then
            update the record's content field with the full text organised by headings/page markers like '## [p.3] Title',
            faithful to the original, without adding anything, and set status to 'indexed'. Use write_doc for internal documents
            and write_public for public ones, passing the record id, the content and the status.
    goalTemplate: 'New document: {event}'
    appTools:
    - name: read_upload
      description: Read an uploaded file
      action: read_file
    - name: write_doc
      description: Update the content of an internal document record
      action: write
      collection: documents
      scope: all
    - name: write_public
      description: Update the content of a public document record
      action: write
      collection: public_documents
      scope: all
    output: markdown
  inputForm:
    title:
      it: Documento da indicizzare
      en: Document to index
    fields:
    - name: document
      type: file
      accept:
      - pdf
      - docx
      - xlsx
      - csv
      - txt
      - md
      maxMb: 15
      multiple: false
      label:
        it: File
        en: File
  data:
    collections:
    - name: documents
      description: Internal documents with department label and audience
      ownedBy: org
      searchable: true
      fields:
      - name: title
        type: text
        required: true
        label:
          it: Titolo
          en: Title
      - name: department
        type: select
        required: true
        label:
          it: Reparto
          en: Department
        options:
        - value: hr
          label: HR
        - value: admin
          label:
            it: Amministrazione
            en: Administration
        - value: production
          label:
            it: Produzione
            en: Production
        - value: service
          label: Service
        - value: it
          label: IT
      - name: audience
        type: select
        required: true
        label:
          it: Gruppo che può vederlo
          en: Group allowed
        options:
        - value: all
          label:
            it: Tutti i dipendenti
            en: All employees
        - value: technical
          label:
            it: Solo tecnici
            en: Technical staff only
      - name: file
        type: file
        accept:
        - pdf
        - docx
        - xlsx
        - csv
        - txt
        - md
        maxMb: 15
        label: File
      - name: source_url
        type: url
        label:
          it: Link originale (Drive/SharePoint)
          en: Original link (Drive/SharePoint)
      - name: version
        type: text
        label:
          it: Versione
          en: Version
      - name: reviewed_on
        type: date
        label:
          it: Ultima revisione
          en: Last reviewed
      - name: review_due
        type: date
        label:
          it: Da rivedere entro
          en: Review due
      - name: status
        type: select
        default: new
        label:
          it: Stato indicizzazione
          en: Indexing status
        options:
        - value: new
          label:
            it: Da indicizzare
            en: To index
        - value: indexed
          label:
            it: Indicizzato
            en: Indexed
      - name: content
        type: textarea
        label:
          it: Testo indicizzato
          en: Indexed text
      access:
      - role: employee
        where:
          audience: all
      - role: technical
        where:
          audience: all
      - role: technical
        where:
          audience: technical
    - name: public_documents
      description: Documents public for the customer portal
      ownedBy: shared
      searchable: true
      fields:
      - name: title
        type: text
        required: true
        label:
          it: Titolo
          en: Title
      - name: category
        type: text
        label:
          it: Categoria
          en: Category
      - name: file
        type: file
        accept:
        - pdf
        - docx
        - xlsx
        - csv
        - txt
        - md
        maxMb: 15
        label: File
      - name: version
        type: text
        label:
          it: Versione
          en: Version
      - name: status
        type: select
        default: new
        label:
          it: Stato indicizzazione
          en: Indexing status
        options:
        - value: new
          label:
            it: Da indicizzare
            en: To index
        - value: indexed
          label:
            it: Indicizzato
            en: Indexed
      - name: content
        type: textarea
        label:
          it: Testo indicizzato
          en: Indexed text
    - name: questions
      description: Every question asked in chat, with whether it was answered (gaps = answered false)
      ownedBy: user
      retentionDays: 365
      fields:
      - name: question
        type: textarea
        label:
          it: Domanda
          en: Question
      - name: topic
        type: text
        label:
          it: Argomento
          en: Topic
      - name: answered
        type: boolean
        label:
          it: Risposta trovata
          en: Answered
      - name: document_title
        type: text
        label:
          it: Documento
          en: Document
  triggers:
  - key: index_doc
    'on':
      collection: documents
      op: insert
      where:
        status: new
    start:
      agent: indexer
    goal: 'Index internal document record {record.id} titled {record.title}: read its file and write the text with write_doc.'
  - key: index_public
    'on':
      collection: public_documents
      op: insert
      where:
        status: new
    start:
      agent: indexer
    goal: 'Index public document record {record.id} titled {record.title}: read its file and write the text with write_public.'
  - key: review_reminder
    'on':
      date:
        collection: documents
        field: review_due
        offsetDays: 0
        hour: 7
    notify:
      to: admins
      subject:
        it: 'Documento da rivedere: {record.title}'
        en: 'Document to review: {record.title}'
      body:
        it: Il documento «{record.title}» ({record.department}) ha raggiunto la data di revisione. Aggiornalo o confermalo.
        en: The document "{record.title}" ({record.department}) has reached its review date. Update or confirm it.
      link: documents
  views:
  - key: home
    type: page
    nav: false
    title: Archivio Parlante
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow:
        it: Per aziende con documentazione sparsa
        en: For companies with scattered documentation
      title:
        it: Chiedi ai tuoi **manuali**, non cercarci dentro.
        en: Ask your **manuals**, don't dig through them.
      text:
        it: Una chat risponde in breve e mostra il passaggio esatto del documento con il link. Ogni dipendente vede solo ciò
          che è autorizzato a vedere.
        en: A chat answers briefly and shows the exact passage with a link. Each employee only sees what they are authorised
          to see.
      actions:
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: primary
      - label:
          it: Prova l'assistenza clienti
          en: Try customer support
        href: /v/public_chat
        style: ghost
      aside: <div style="padding:16px"><b>Come si richiede un rimborso trasferta?</b><p>Compila il modulo spese entro 30 giorni…</p><blockquote>«Le
        note spese vanno inviate entro 30 giorni.» — Procedura Rimborsi v3, p.2</blockquote></div>
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Carica
          en: Upload
        text:
          it: 'PDF, Word, Excel: l''admin etichetta il reparto e sceglie quali gruppi li vedono.'
          en: 'PDF, Word, Excel: the admin labels the department and chooses which groups see them.'
        badge: 📄
      - title:
          it: Chiedi
          en: Ask
        text:
          it: I dipendenti fanno domande in chat e ricevono risposte con citazione e link.
          en: Employees ask in chat and get answers with quote and link.
        badge: 💬
      - title:
          it: Migliora
          en: Improve
        text:
          it: Le domande senza risposta diventano lacune; i documenti vecchi vengono segnalati.
          en: Unanswered questions become gaps; old documents are flagged.
        badge: 📈
    - type: cards
      id: sicurezza
      title:
        it: Sicurezza
        en: Security
      items:
      - title:
          it: Permessi per gruppo
          en: Group permissions
        text:
          it: L'agente cerca solo nei documenti visibili all'utente.
          en: The agent only searches documents visible to the user.
      - title:
          it: Portale clienti
          en: Customer portal
        text:
          it: La chat pubblica usa solo i documenti pubblici.
          en: The public chat only uses public documents.
    - type: note
      content:
        it: Le risposte provengono dai documenti caricati; verifica sempre le procedure di sicurezza sull'originale.
        en: Answers come from the uploaded documents; always verify safety procedures against the original.
  - key: chat
    type: chat
    source: agent:assistant
    title:
      it: Chiedi all'archivio
      en: Ask the archive
    roles:
    - employee
    - technical
    - admin
    examples:
    - it: Come si richiede un rimborso trasferta?
      en: How do I request a travel expense refund?
    - it: Qual è la coppia di serraggio per il modello X?
      en: What is the tightening torque for model X?
    placeholder:
      it: Scrivi la tua domanda…
      en: Type your question…
  - key: public_chat
    type: chat
    source: agent:public_assistant
    title:
      it: Assistenza clienti
      en: Customer support
    examples:
    - it: Come si installa il prodotto?
      en: How do I install the product?
    placeholder:
      it: Come possiamo aiutarti?
      en: How can we help?
  - key: upload
    type: form
    collection: documents
    title:
      it: Carica documento
      en: Upload document
    roles:
    - admin
    fields:
    - title
    - department
    - audience
    - file
    - source_url
    - version
    - reviewed_on
    - review_due
    submit:
      label:
        it: Salva e indicizza
        en: Save and index
      message:
        it: 'Documento salvato: verrà indicizzato a breve.'
        en: 'Document saved: indexing shortly.'
      redirect: documents
  - key: upload_public
    type: form
    collection: public_documents
    title:
      it: Carica documento pubblico
      en: Upload public document
    roles:
    - admin
    fields:
    - title
    - category
    - file
    - version
    submit:
      label:
        it: Pubblica
        en: Publish
      message:
        it: Documento pubblico salvato.
        en: Public document saved.
  - key: documents
    type: table
    source: collection:documents
    title:
      it: Documenti
      en: Documents
    roles:
    - admin
    columns:
    - title
    - department
    - audience
    - version
    - reviewed_on
    - review_due
    - status
    export: true
  - key: document
    type: form
    collection: documents
    edit: true
    nav: false
    title:
      it: Documento
      en: Document
    fields:
    - title
    - department
    - audience
    - file
    - source_url
    - version
    - reviewed_on
    - review_due
    submit:
      label:
        it: Salva
        en: Save
  - key: public_document
    type: form
    collection: public_documents
    edit: true
    nav: false
    title:
      it: Documento pubblico
      en: Public document
    fields:
    - title
    - category
    - file
    - version
    submit:
      label:
        it: Salva
        en: Save
  - key: dashboard
    type: page
    title:
      it: Dashboard
      en: Dashboard
    roles:
    - admin
    sections:
    - type: data
      title:
        it: Argomenti più richiesti
        en: Most asked topics
      source: collection:questions
      display: chart
      chart: bar
      fields:
      - key: topic
        label:
          it: Argomento
          en: Topic
      - key: count
        label:
          it: Domande
          en: Questions
      groupBy:
        field: topic
        aggs: []
      limit: 15
    - type: data
      title:
        it: Domande senza risposta (lacune)
        en: Unanswered questions (gaps)
      source: collection:questions
      display: table
      fields:
      - key: question
        label:
          it: Domanda
          en: Question
      - key: topic
        label:
          it: Argomento
          en: Topic
      filters:
      - field: answered
        op: '='
        value: false
      limit: 50
      empty:
        it: Nessuna lacuna.
        en: No gaps.
    - type: data
      title:
        it: Documenti da aggiornare
        en: Documents to update
      source: collection:documents
      display: table
      fields:
      - key: title
        label:
          it: Titolo
          en: Title
      - key: department
        label:
          it: Reparto
          en: Department
        format: badge
      - key: reviewed_on
        label:
          it: Ultima revisione
          en: Last reviewed
        format: date
      - key: review_due
        label:
          it: Scadenza
          en: Due
        format: date
      sort:
        field: review_due
        dir: asc
      limit: 20
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Plan
    roles:
    - admin
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: starter
      price: 49
      interval: month
      label: Starter
      includes:
      - 100 documents
      - up to 25 users
    - key: business
      price: 149
      interval: month
      label: Business
      includes:
      - 1000 documents
      - up to 150 users
      - public customer chat
    - key: enterprise
      price: 399
      interval: month
      label: Enterprise
      includes:
      - unlimited documents
      - unlimited users
  notifications:
    emailOnRunDone: false
  extensions:
  - key: drive_sharepoint_sync
    description: Nightly sync of Google Drive / SharePoint folders needs OAuth sign-in to Google/Microsoft 365, not available
      yet. For now documents are uploaded; source_url keeps the original link.
  - key: company_sso
    description: Corporate login (SSO/SAML/Entra ID) is not available yet; employees sign in with a magic link and the admin
      invites them into the groups.
  - key: pptx_upload
    description: PowerPoint files are not accepted by the file field yet; export to PDF before uploading.
  - key: chat_embed
    description: 'Embedding the public chat as a widget in the customer portal: use the public_chat view in an iframe/floating
      bubble on the portal domain.'
  - key: seat_quota
    description: Per-plan user count limit is not enforced by the runtime; document limits are enforced via limits.
