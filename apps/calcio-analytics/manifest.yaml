apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: calcio-analytics
  displayName: CalcioAnalytics
  tagline:
    it: Indicatori avanzati su giocatori e squadre, aggiornati dopo ogni giornata.
    en: Advanced player and team metrics, updated after every matchday.
  description:
    it: 'Strumento di data intelligence per società calcistiche, osservatori e settori giovanili: importa i dati delle partite,
      calcola contributo atteso, qualità delle conclusioni e tendenze di forma, e rispondi alle domande in chat. Nessun dato
      da dispositivi indossabili.'
    en: 'Data intelligence for football clubs, scouts and youth academies: import match data, get expected contribution, shot
      quality and form trends, and ask questions in chat. No wearable data.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#0b3d2e'
      accent: '#1f9d55'
      background: '#f6f8f6'
      foreground: '#14201a'
    fonts:
      body: Inter
      display: Barlow Condensed
    wordmark:
    - text: Calcio
      color: primary
    - text: Analytics
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  limits:
  - action: create:teams
    max: 1
    window: total
    plans:
      starter: 3
      club: 10
      pro: -1
  - action: agent:importer
    per: user
    max: 20
    window: day
    roles:
    - user
  - action: chat
    per: user
    max: 100
    window: day
    roles:
    - user
  agents:
  - key: importer
    role: main
    description: Reads an uploaded match data file, saves per-player match records and computes advanced indicators.
    profile:
      inline:
        display_name: CalcioAnalytics importer
        crews:
        - id: importer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are a football data analyst. The club uploads match data (events, minutes, results) from a licensed
            source or its own files. Steps: 1) read the club''s players and teams with read_players and read_teams; 2) parse
            the uploaded text; match rows to the club''s players by name (report unmatched names, never invent players); 3)
            save one record per player per match with save_player_match (fields: player, team, date, matchday, minutes, goals,
            assists, shots, shots_on_target, xg, xa, key_passes, result); use xg/xa only if present in the data, otherwise
            estimate from shots and say so; 4) read the player''s previous records with read_player_matches and compute for
            each player with save_player_metric: xg_contribution (xG+xA per 90), shot_quality (xG per shot), form_index (0-100,
            last 5 matches weighted vs season average), form_delta (change vs previous matchday) and trend (up, stable, down).
            Use only data in the files; never use wearable or biometric data; never invent figures. Final answer: Markdown
            starting with a level-1 title "# Aggiornamento giornata <n> — <competition>" (or English if lang is en), then
            ## Summary, ## Players in form (table), ## Players declining (table), ## Data issues (unmatched names, missing
            fields), and a chart of form_index for the top 8 players as a fenced block ```chart {"type":"bar","title":"…","labels":[…],"series":[{"name":"Form","values":[…]}]}
            ```.'
    goalTemplate: 'Competition: {competition}

      Matchday: {matchday}

      Uploaded files: {match_data}

      Data:

      {match_data_text}

      {?notes}Analyst notes: {notes}{/notes}

      Today is {date}. Write the report in the language with ISO code {lang}.'
    appTools:
    - name: read_players
      description: Read the club's players
      action: read
      collection: players
      scope: user
    - name: read_teams
      description: Read the club's teams
      action: read
      collection: teams
      scope: user
    - name: read_player_matches
      description: Read saved match records of the club's players
      action: search
      collection: player_matches
      scope: user
    - name: save_player_match
      description: Save one player's match record
      action: write
      collection: player_matches
      scope: user
    - name: save_player_metric
      description: Save a player's computed indicators for a matchday
      action: write
      collection: player_metrics
      scope: user
    output: markdown
    limits:
      maxTurns: 30
      maxBudgetUsd: 0.6
  - key: assistant
    role: helper
    description: Chat assistant answering questions on the club's own players and metrics.
    profile:
      inline:
        display_name: CalcioAnalytics assistant
        crews:
        - id: assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You are the data assistant of a football club's analyst. Answer questions such as "show me the midfielders
            improving over the last five matches" using ONLY the club's records, read with the tools (search_metrics, search_matches,
            list_players). Filter by role, trend, and period; compare players or periods when asked; give short tables with
            real figures and the matchday/date they refer to, and say clearly when data is missing. Never invent figures,
            never use wearable data, and present indicators as decision support, not certainties. Reply in the user's language.
    goalTemplate: 'Conversation so far:

      {history}


      New message from {user}: {message}

      Today is {date}. Reply in the language with ISO code {lang}.'
    appTools:
    - name: list_players
      description: List the club's players
      action: read
      collection: players
      scope: user
    - name: search_metrics
      description: Search computed player indicators
      action: search
      collection: player_metrics
      scope: user
    - name: search_matches
      description: Search player match records
      action: search
      collection: player_matches
      scope: user
    output: markdown
  - key: watcher
    role: scheduled
    description: Weekly summary of squad form changes for one club.
    memory: instance
    writesTo:
      collection: weekly_reports
    profile:
      inline:
        display_name: CalcioAnalytics weekly watcher
        crews:
        - id: watcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write the weekly squad form summary for a football club analyst. Read the club''s player_metrics
            with weekly_metrics (and players with weekly_players) and compare the latest matchday with the previous ones.
            Start with "# Forma della rosa — settimana del <date>" (English title if lang is en). Sections: ## Biggest risers,
            ## Biggest fallers, ## Watch list (minutes, shot quality, trends), ## Next steps. Under 300 words, real figures
            only, never invent data, no wearable or medical claims. If there is no new matchday since your last report, say
            so. At the end call remember once with the 5 key points.'
    appTools:
    - name: weekly_metrics
      description: Read the club's computed indicators
      action: search
      collection: player_metrics
      scope: user
    - name: weekly_players
      description: Read the club's players
      action: read
      collection: players
      scope: user
    output: markdown
  templates:
  - key: weekly_form
    title:
      it: Report settimanale di forma
      en: Weekly form report
    description:
      it: Ogni lunedì una email con le variazioni di forma della rosa.
      en: Every Monday an email with squad form changes.
    agent: watcher
    params:
    - name: focus
      type: select
      required: true
      label:
        it: Focus
        en: Focus
      options:
      - value: all
        label:
          it: Tutta la rosa
          en: Whole squad
      - value: MF
        label:
          it: Centrocampisti
          en: Midfielders
      - value: FW
        label:
          it: Attaccanti
          en: Forwards
      - value: DF
        label:
          it: Difensori
          en: Defenders
    goal: 'Weekly form report "{instance}", focus: {focus}. Today is {date}. Write it in the language with ISO code {lang}.'
    schedule:
      cron: 0 7 * * 1
      userCanChange: true
    maxPerUser: 3
    deliver:
      to: owner
      onlyIfNew: true
  inputForm:
    title:
      it: Importa giornata
      en: Import matchday
    fields:
    - name: competition
      type: text
      required: true
      label:
        it: Competizione
        en: Competition
    - name: matchday
      type: number
      required: true
      label:
        it: Giornata
        en: Matchday
    - name: match_data
      type: file
      required: true
      accept:
      - csv
      - xlsx
      - txt
      - json
      maxMb: 15
      multiple: true
      label:
        it: Dati partita (fonte con licenza o tuoi file)
        en: Match data (licensed source or your files)
    - name: notes
      type: textarea
      maxLength: 400
      label:
        it: Note (facoltative)
        en: Notes (optional)
  data:
    collections:
    - name: teams
      ownedBy: user
      description: The club's teams
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Squadra
          en: Team
      - name: category
        type: select
        label:
          it: Categoria
          en: Category
        options:
        - first_team
        - u19
        - u17
        - u15
        - other
      - name: season
        type: text
        label:
          it: Stagione
          en: Season
    - name: players
      ownedBy: user
      description: Players the club follows
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome
          en: Name
      - name: team
        type: select
        optionsFrom: collection:teams
        label:
          it: Squadra
          en: Team
      - name: role
        type: select
        required: true
        label:
          it: Ruolo
          en: Position
        options:
        - value: GK
          label:
            it: Portiere
            en: Goalkeeper
        - value: DF
          label:
            it: Difensore
            en: Defender
        - value: MF
          label:
            it: Centrocampista
            en: Midfielder
        - value: FW
          label:
            it: Attaccante
            en: Forward
      - name: birth_year
        type: number
        label:
          it: Anno di nascita
          en: Birth year
      - name: notes
        type: textarea
        label:
          it: Note
          en: Notes
    - name: player_matches
      ownedBy: user
      retentionDays: 1825
      fields:
      - name: player
        type: text
      - name: team
        type: text
      - name: date
        type: date
      - name: matchday
        type: number
      - name: minutes
        type: number
      - name: goals
        type: number
      - name: assists
        type: number
      - name: shots
        type: number
      - name: shots_on_target
        type: number
      - name: xg
        type: number
      - name: xa
        type: number
      - name: key_passes
        type: number
      - name: result
        type: select
        options:
        - W
        - D
        - L
    - name: player_metrics
      ownedBy: user
      description: Advanced indicators per player per matchday
      fields:
      - name: player
        type: text
      - name: role
        type: text
      - name: team
        type: text
      - name: date
        type: date
      - name: matchday
        type: number
      - name: xg_contribution
        type: number
      - name: shot_quality
        type: number
      - name: form_index
        type: number
      - name: form_delta
        type: number
      - name: trend
        type: select
        options:
        - up
        - stable
        - down
    - name: weekly_reports
      ownedBy: instance
      description: Weekly form reports
  views:
  - key: home
    type: page
    nav: false
    title: CalcioAnalytics
    sections:
    - type: hero
      title:
        it: Dai dati delle partite a **indicatori avanzati**, ogni giornata.
        en: From match data to **advanced indicators**, every matchday.
      text:
        it: Importa i dati concessi in licenza o i tuoi file, ottieni contributo atteso, qualità delle conclusioni e tendenze
          di forma per ogni giocatore, confrontali e interrogali in chat.
        en: Import licensed data or your own files, get expected contribution, shot quality and form trends for every player,
          compare them and query them in chat.
      actions:
      - label:
          it: Inizia
          en: Get started
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Inserisci rosa e squadre
          en: Add teams and players
        text:
          it: Squadre e giocatori da seguire.
          en: The teams and players you follow.
      - title:
          it: Importa la giornata
          en: Import the matchday
        text:
          it: 'Carica CSV o Excel: l''agente aggiorna gli indicatori.'
          en: 'Upload CSV or Excel: the agent updates the indicators.'
      - title:
          it: Analizza e chiedi
          en: Analyse and ask
        text:
          it: Dashboard, schede, chat e un'email settimanale sulla forma.
          en: Dashboards, player cards, chat and a weekly form email.
    - type: cards
      title:
        it: Privacy
        en: Privacy
      items:
      - title:
          it: Ogni società vede solo i propri dati
          en: Each club sees only its own data
        text:
          it: 'Nessuna raccolta da dispositivi indossabili: solo strato software di analisi.'
          en: 'No wearable collection: only the analysis software layer.'
    - type: note
      content:
        it: Supporto alle decisioni, non una garanzia di rendimento. Usa solo dati che hai il diritto di usare.
        en: Decision support, not a performance guarantee. Use only data you have the right to use.
  - key: import
    type: new_run
    title:
      it: Importa giornata
      en: Import matchday
    roles:
    - user
    - admin
  - key: imports
    type: history
    title:
      it: Aggiornamenti
      en: Updates
    source: run
    roles:
    - user
    - admin
  - key: update_report
    type: report
    source: run
    printable: true
    nav: false
  - key: team_form
    type: form
    collection: teams
    title:
      it: Nuova squadra
      en: New team
    submit:
      label:
        it: Salva
        en: Save
      redirect: teams
    roles:
    - user
    - admin
    nav: false
  - key: teams
    type: table
    source: collection:teams
    title:
      it: Squadre
      en: Teams
    columns:
    - name
    - category
    - season
    export: true
    roles:
    - user
    - admin
  - key: player_form
    type: form
    collection: players
    title:
      it: Nuovo giocatore
      en: New player
    submit:
      label:
        it: Salva
        en: Save
      redirect: players
    edit: true
    roles:
    - user
    - admin
    nav: false
  - key: players
    type: table
    source: collection:players
    title:
      it: Giocatori
      en: Players
    columns:
    - name
    - team
    - role
    - birth_year
    export: true
    roles:
    - user
    - admin
  - key: dashboard
    type: page
    title:
      it: Dashboard
      en: Dashboard
    roles:
    - user
    - admin
    sections:
    - type: data
      title:
        it: Forma media per settimana
        en: Average form per week
      source: collection:player_metrics
      display: chart
      chart: line
      groupBy:
        field: date
        bucket: week
        aggs:
        - key: form
          agg: avg
          field: form_index
        - key: xgc
          agg: avg
          field: xg_contribution
      fields:
      - key: date
      - key: form
        label:
          it: Forma
          en: Form
      - key: xgc
        label:
          it: Contributo atteso/90
          en: Expected contribution/90
      empty:
        it: Importa una giornata per vedere i grafici.
        en: Import a matchday to see charts.
    - type: data
      title:
        it: Giocatori in crescita
        en: Players on the rise
      source: collection:player_metrics
      display: table
      filters:
      - field: trend
        op: '='
        value: up
      sort:
        field: form_index
        dir: desc
      limit: 20
      fields:
      - key: player
      - key: role
        format: badge
      - key: matchday
      - key: form_index
        format: number
      - key: form_delta
        format: number
      - key: shot_quality
        format: number
    - type: data
      title:
        it: Confronto indicatori
        en: Indicator comparison
      source: collection:player_metrics
      display: chart
      chart: bar
      sort:
        field: form_index
        dir: desc
      limit: 12
      fields:
      - key: player
      - key: form_index
      - key: xg_contribution
  - key: metrics
    type: table
    source: collection:player_metrics
    title:
      it: Schede giocatore
      en: Player cards
    columns:
    - player
    - role
    - matchday
    - date
    - xg_contribution
    - shot_quality
    - form_index
    - trend
    export: true
    roles:
    - user
    - admin
  - key: ask
    type: chat
    source: agent:assistant
    title:
      it: Chiedi ai dati
      en: Ask the data
    examples:
    - it: Mostrami i centrocampisti in crescita nelle ultime cinque partite
      en: Show me the midfielders improving over the last five matches
    - it: Confronta due attaccanti per qualità delle conclusioni
      en: Compare two forwards on shot quality
    placeholder:
      it: Fai una domanda sulla tua rosa…
      en: Ask about your squad…
    roles:
    - user
    - admin
  - key: watches
    type: instances
    template: weekly_form
    title:
      it: Report settimanali
      en: Weekly reports
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - user
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: starter
      price: 290
      interval: year
      label:
        it: Stagione — fino a 3 squadre
        en: Season — up to 3 teams
    - key: club
      price: 790
      interval: year
      label:
        it: Stagione — fino a 10 squadre
        en: Season — up to 10 teams
    - key: pro
      price: 1490
      interval: year
      label:
        it: Stagione — squadre illimitate
        en: Season — unlimited teams
  notifications:
    emailOnRunDone: true
  extensions:
  - key: licensed_feeds
    description: Direct connectors to licensed football data providers are not available; data enters as files uploaded by
      the club (or via its own API key if a provider offers one).
