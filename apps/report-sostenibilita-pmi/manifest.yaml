apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: bilancioverde
  displayName: BilancioVerde
  tagline:
    it: Il report di sostenibilità ESRS per PMI, guidato e rivisto dal tuo consulente.
    en: The ESRS sustainability report for SMEs, guided and reviewed by your consultant.
  description:
    it: 'Compila il modulo, carica bollette e bilanci: un agente estrae i numeri, guida la doppia materialità, segnala i dati
      mancanti e scrive i capitoli del report. Il consulente li rivede e li approva.'
    en: 'Fill in the form and upload bills and statements: an agent extracts the numbers, guides the double materiality analysis,
      flags missing data and writes the report chapters. Your consultant reviews and approves them.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f5d3a'
      accent: '#2f8f5b'
      background: '#f6f8f4'
      foreground: '#17231b'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Bilancio
      color: primary
    - text: Verde
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#how'
    cta:
      label:
        it: Inizia
        en: Start
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
    - key: consultant
      label:
        it: Consulente
        en: Consultant
      assignedBy: derived
      from: collection:esg_data.consultant_email
  limits:
  - action: agent:analyst
    per: user
    max: 5
    window: month
    roles:
    - user
  agents:
  - key: analyst
    role: main
    description: Extracts figures from uploads, runs the guided double materiality analysis, lists missing data and writes
      the ESRS chapters.
    profile:
      inline:
        display_name: BilancioVerde analyst
        crews:
        - id: analyst
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You are an ESG reporting specialist helping a European SME draft its sustainability report following
            the simplified ESRS for SMEs (EFRAG VSME standard: Basic module B1-B11 and, when asked, the Comprehensive module).
            Sources: the company''s form data (context ''data''), the uploaded documents (text in the goal, or open images
            and scans with the read_upload tool using the file id), and the EFRAG standards, which you may consult on the
            public EFRAG site with the webrobot MCP (scrape the page, cite the standard code). Work in this order: 1) extract
            every number you can from the documents (kWh, m3 of gas, litres of fuel, waste, headcount, revenue) and say which
            file each came from; when documents and form disagree, flag it. 2) Run a guided double materiality analysis: impact
            and financial materiality for the main topics (climate, pollution, water, resources and circular economy, own
            workforce, business conduct) with a score 1-5 for each and a one-line reason, based only on the sector and data
            given; mark it as a proposal for the consultant. 3) List missing information as a checklist with the standard
            code of each datapoint. 4) Write the chapters: General information, Double materiality, Energy and GHG emissions,
            Waste and resources, Own workforce, Governance and business conduct, Missing data and next steps. Each has a table
            of indicators with value, unit, year and source, and the year-on-year change when two years are present. Compute
            emissions only with stated factors and state the factor; never invent figures, mark unknown values as ''to be
            provided''. Do not give legal advice as fact. After writing, save each chapter by calling save_chapter once with
            year, title, content (Markdown), status ''draft'' and the consultant_email from the company data. Your final answer
            is the whole report in Markdown starting with a level-1 title ''# Sustainability report <company> <year>'' followed
            by the chapters as ## sections. Add a ```chart block for year-on-year comparisons when two years exist. Write
            in the language with the ISO code given in the goal.'
    context:
    - key: data
      from: collection:esg_data
    goalTemplate: 'Reporting year: {year}. Report module: {module_label}.

      Language ISO code: {lang}. Today: {date}.

      Company data records (one JSON per line, includes previous years):

      {data}

      {?docs}Uploaded files (names and ids): {docs}

      Text of the documents:

      {docs_text}{/docs}{!docs}No documents uploaded.{/docs}

      {?notes}Notes from the company: {notes}{/notes}'
    appTools:
    - name: read_upload
      description: Read an uploaded file (image, scan or document) by file id
      action: read_file
    - name: read_esg_data
      description: Read the company's ESG data records
      action: read
      collection: esg_data
      scope: user
    - name: save_chapter
      description: Save one report chapter as a draft for the consultant to review
      action: write
      collection: chapters
      scope: user
    output: markdown
    limits:
      maxTurns: 30
      maxBudgetUsd: 2
      timeoutSeconds: 900
  inputForm:
    title:
      it: Genera il report
      en: Generate the report
    fields:
    - name: year
      type: number
      required: true
      label:
        it: Anno di rendicontazione
        en: Reporting year
    - name: module
      type: select
      required: true
      label:
        it: Modulo
        en: Module
      options:
      - value: basic
        label:
          it: Base (B1-B11)
          en: Basic (B1-B11)
      - value: comprehensive
        label:
          it: Completo
          en: Comprehensive
      default: basic
    - name: docs
      type: file
      accept:
      - pdf
      - xlsx
      - csv
      - docx
      - jpg
      - png
      maxMb: 15
      multiple: true
      label:
        it: Documenti (bollette, bilancio, regolamenti, certificazioni)
        en: Documents (bills, financials, policies, certificates)
    - name: notes
      type: textarea
      maxLength: 600
      label:
        it: Note (facoltative)
        en: Notes (optional)
  data:
    collections:
    - name: esg_data
      description: Company ESG data by reporting year
      ownedBy: user
      retentionDays: 3650
      fields:
      - name: year
        type: number
        required: true
        label:
          it: Anno
          en: Year
      - name: company_name
        type: text
        required: true
        label:
          it: Ragione sociale
          en: Company name
      - name: vat
        type: text
        label:
          it: Partita IVA
          en: VAT number
      - name: sector
        type: text
        label:
          it: Settore
          en: Sector
      - name: ateco
        type: text
        label: ATECO / NACE
      - name: revenue
        type: number
        label:
          it: Fatturato (EUR)
          en: Revenue (EUR)
      - name: consultant_email
        type: email
        label:
          it: Email del consulente
          en: Consultant email
      - name: employees_count
        type: number
        label:
          it: Dipendenti totali
          en: Total employees
      - name: employees_female
        type: number
        label:
          it: Di cui donne
          en: Of which women
      - name: employees_fixed_term
        type: number
        label:
          it: Tempo determinato
          en: Fixed-term
      - name: accidents
        type: number
        label:
          it: Infortuni
          en: Work accidents
      - name: training_hours
        type: number
        label:
          it: Ore di formazione
          en: Training hours
      - name: electricity_kwh
        type: number
        label:
          it: Elettricità (kWh)
          en: Electricity (kWh)
      - name: gas_m3
        type: number
        label:
          it: Gas (m3)
          en: Gas (m3)
      - name: fuel_l
        type: number
        label:
          it: Carburanti (litri)
          en: Fuel (litres)
      - name: renewable_pct
        type: number
        label:
          it: Quota rinnovabile (%)
          en: Renewable share (%)
      - name: scope1_t
        type: number
        label:
          it: Emissioni Scope 1 (tCO2e)
          en: Scope 1 (tCO2e)
      - name: scope2_t
        type: number
        label:
          it: Emissioni Scope 2 (tCO2e)
          en: Scope 2 (tCO2e)
      - name: waste_t
        type: number
        label:
          it: Rifiuti totali (t)
          en: Total waste (t)
      - name: hazardous_waste_t
        type: number
        label:
          it: Rifiuti pericolosi (t)
          en: Hazardous waste (t)
      - name: waste_recycled_pct
        type: number
        label:
          it: Rifiuti riciclati (%)
          en: Recycled waste (%)
      - name: water_m3
        type: number
        label:
          it: Acqua prelevata (m3)
          en: Water withdrawn (m3)
      - name: board_size
        type: number
        label:
          it: Componenti del CdA
          en: Board members
      - name: board_female_pct
        type: number
        label:
          it: Donne nel CdA (%)
          en: Women on board (%)
      - name: code_of_conduct
        type: boolean
        label:
          it: Codice etico
          en: Code of conduct
      - name: anticorruption_policy
        type: boolean
        label:
          it: Politica anticorruzione
          en: Anti-corruption policy
      - name: social_policies
        type: textarea
        label:
          it: Politiche sociali (welfare, diversità, salute e sicurezza)
          en: Social policies (welfare, diversity, health and safety)
      - name: governance_notes
        type: textarea
        label:
          it: Note di governance
          en: Governance notes
      access:
      - role: consultant
        where:
          consultant_email: '{user.email}'
        can:
        - read
        - write
    - name: chapters
      description: Report chapters written by the agent and reviewed by the consultant
      ownedBy: user
      fields:
      - name: year
        type: number
        required: true
        label:
          it: Anno
          en: Year
      - name: title
        type: text
        required: true
        label:
          it: Capitolo
          en: Chapter
      - name: content
        type: textarea
        label:
          it: Testo
          en: Text
      - name: status
        type: select
        label:
          it: Stato
          en: Status
        options:
        - value: draft
          label:
            it: Bozza
            en: Draft
        - value: changes
          label:
            it: Da modificare
            en: Changes requested
        - value: approved
          label:
            it: Approvato
            en: Approved
        default: draft
      - name: consultant_email
        type: email
      - name: comment
        type: textarea
        label:
          it: Commento del consulente
          en: Consultant comment
      access:
      - role: consultant
        where:
          consultant_email: '{user.email}'
        can:
        - read
        - write
  views:
  - key: home
    type: page
    nav: false
    title: BilancioVerde
    sections:
    - type: hero
      layout: stack
      band: true
      eyebrow:
        it: ESRS per PMI
        en: ESRS for SMEs
      title:
        it: Il report di sostenibilità, **senza smarrirsi** negli standard.
        en: Your sustainability report, **without getting lost** in the standards.
      text:
        it: 'Compila il modulo, carica bollette e bilancio: l''agente estrae i numeri, guida la doppia materialità e scrive
          i capitoli. Il tuo consulente li rivede e approva.'
        en: 'Fill in the form and upload bills and financials: the agent extracts the numbers, guides the double materiality
          analysis and writes the chapters. Your consultant reviews and approves them.'
      actions:
      - label:
          it: Accedi e inizia
          en: Sign in and start
        href: /login
        style: primary
    - type: steps
      id: how
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Compila e carica
          en: Fill in and upload
        text:
          it: Sette sezioni guidate e i tuoi documenti in PDF o Excel.
          en: Seven guided sections and your documents in PDF or Excel.
      - title:
          it: L'agente scrive
          en: The agent writes
        text:
          it: Estrae i dati, analizza la doppia materialità con gli standard EFRAG, indica cosa manca.
          en: Extracts the data, runs the double materiality analysis with the EFRAG standards, lists what is missing.
      - title:
          it: Il consulente approva
          en: The consultant approves
        text:
          it: Ogni capitolo è rivisto e approvato; poi stampi o salvi il report.
          en: Every chapter is reviewed and approved; then print or save the report.
    - type: note
      content:
        it: Supporto alla redazione, non consulenza legale. I dati di ogni azienda sono visibili solo all'azienda e al suo
          consulente.
        en: Drafting support, not legal advice. Each company's data is visible only to the company and its consultant.
  - key: general
    type: form
    title:
      it: 1 · Dati generali
      en: 1 · General data
    collection: esg_data
    fields:
    - year
    - company_name
    - vat
    - sector
    - ateco
    - revenue
    - consultant_email
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Dati salvati
        en: Data saved
      redirect: employees
    edit: true
    roles:
    - user
    - admin
  - key: employees
    type: form
    title:
      it: 2 · Dipendenti
      en: 2 · Employees
    collection: esg_data
    fields:
    - year
    - employees_count
    - employees_female
    - employees_fixed_term
    - accidents
    - training_hours
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Dati salvati
        en: Data saved
      redirect: energy
    edit: true
    roles:
    - user
    - admin
  - key: energy
    type: form
    title:
      it: 3 · Energia
      en: 3 · Energy
    collection: esg_data
    fields:
    - year
    - electricity_kwh
    - gas_m3
    - fuel_l
    - renewable_pct
    - water_m3
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Dati salvati
        en: Data saved
      redirect: emissions
    edit: true
    roles:
    - user
    - admin
  - key: emissions
    type: form
    title:
      it: 4 · Emissioni
      en: 4 · Emissions
    collection: esg_data
    fields:
    - year
    - scope1_t
    - scope2_t
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Dati salvati
        en: Data saved
      redirect: waste
    edit: true
    roles:
    - user
    - admin
  - key: waste
    type: form
    title:
      it: 5 · Rifiuti
      en: 5 · Waste
    collection: esg_data
    fields:
    - year
    - waste_t
    - hazardous_waste_t
    - waste_recycled_pct
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Dati salvati
        en: Data saved
      redirect: governance
    edit: true
    roles:
    - user
    - admin
  - key: governance
    type: form
    title:
      it: 6 · Governance
      en: 6 · Governance
    collection: esg_data
    fields:
    - year
    - board_size
    - board_female_pct
    - code_of_conduct
    - anticorruption_policy
    - governance_notes
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Dati salvati
        en: Data saved
      redirect: social
    edit: true
    roles:
    - user
    - admin
  - key: social
    type: form
    title:
      it: 7 · Politiche sociali
      en: 7 · Social policies
    collection: esg_data
    fields:
    - year
    - social_policies
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Dati salvati
        en: Data saved
      redirect: new_run
    edit: true
    roles:
    - user
    - admin
  - key: new_run
    type: new_run
    title:
      it: Genera il report
      en: Generate the report
    roles:
    - user
    - admin
  - key: reports
    type: history
    title:
      it: I miei report
      en: My reports
    source: run
    roles:
    - user
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: chapters_list
    type: table
    title:
      it: Capitoli
      en: Chapters
    source: collection:chapters
    columns:
    - year
    - title
    - status
    - comment
    export: true
    roles:
    - user
    - consultant
    - admin
  - key: review
    type: form
    title:
      it: Revisione capitolo
      en: Chapter review
    collection: chapters
    fields:
    - title
    - content
    - status
    - comment
    submit:
      label:
        it: Salva revisione
        en: Save review
      message:
        it: Revisione salvata
        en: Review saved
      redirect: chapters_list
    edit: true
    nav: false
    roles:
    - user
    - consultant
    - admin
  - key: clients
    type: table
    title:
      it: Clienti
      en: Clients
    source: collection:esg_data
    columns:
    - company_name
    - year
    - employees_count
    - scope1_t
    - scope2_t
    export: true
    roles:
    - consultant
    - admin
  - key: dashboard
    type: page
    title:
      it: Indicatori
      en: Indicators
    roles:
    - user
    - consultant
    - admin
    sections:
    - type: data
      title:
        it: Energia per anno
        en: Energy by year
      source: collection:esg_data
      display: chart
      chart: bar
      groupBy:
        field: year
        aggs:
        - key: electricity
          agg: sum
          field: electricity_kwh
        - key: gas
          agg: sum
          field: gas_m3
      fields:
      - key: year
      - key: electricity
        label: kWh
      - key: gas
        label: m3
    - type: data
      title:
        it: Emissioni per anno (tCO2e)
        en: Emissions by year (tCO2e)
      source: collection:esg_data
      display: chart
      chart: line
      groupBy:
        field: year
        aggs:
        - key: s1
          agg: sum
          field: scope1_t
        - key: s2
          agg: sum
          field: scope2_t
      fields:
      - key: year
      - key: s1
        label: Scope 1
      - key: s2
        label: Scope 2
    - type: data
      title:
        it: Persone e rifiuti per anno
        en: Workforce and waste by year
      source: collection:esg_data
      display: table
      groupBy:
        field: year
        aggs:
        - key: staff
          agg: sum
          field: employees_count
        - key: waste
          agg: sum
          field: waste_t
        - key: recycled
          agg: avg
          field: waste_recycled_pct
      fields:
      - key: year
      - key: staff
        label:
          it: Dipendenti
          en: Employees
      - key: waste
        label:
          it: Rifiuti (t)
          en: Waste (t)
      - key: recycled
        label:
          it: Riciclo %
          en: Recycled %
  - key: account
    type: account
    title:
      it: Crediti
      en: Credits
    roles:
    - user
  triggers:
  - key: chapter_approved
    'on':
      collection: chapters
      op: update
      where:
        status: approved
    notify:
      to:
      - owner
      subject:
        it: 'Capitolo approvato: {record.title}'
        en: 'Chapter approved: {record.title}'
      body:
        it: Il consulente ha approvato il capitolo {record.title}.
        en: Your consultant approved the chapter {record.title}.
      link: chapters_list
  - key: chapter_changes
    'on':
      collection: chapters
      op: update
      where:
        status: changes
    notify:
      to:
      - owner
      subject:
        it: 'Modifiche richieste: {record.title}'
        en: 'Changes requested: {record.title}'
      body:
        it: Il consulente ha lasciato un commento sul capitolo {record.title}.
        en: Your consultant commented on the chapter {record.title}.
      link: chapters_list
  - key: chapter_new
    'on':
      collection: chapters
      op: insert
    notify:
      to:
      - record.consultant_email
      subject:
        it: 'Nuovo capitolo da rivedere: {record.title}'
        en: 'New chapter to review: {record.title}'
      body:
        it: 'Un cliente ha un nuovo capitolo in bozza da rivedere: {record.title}.'
        en: 'A client has a new draft chapter to review: {record.title}.'
      link: chapters_list
  notifications:
    emailOnRunDone: true
  billing:
    modes:
    - credits
    signupCredits: 0
    packs:
    - key: report
      credits: 190
      price: 190
      label:
        it: Report annuale
        en: Annual report
    - key: report_review
      credits: 390
      price: 390
      label:
        it: Report annuale con revisione del consulente
        en: Annual report with consultant review
    costs:
      agent:analyst: 190
  extensions:
  - key: word_export
    description: 'Word (.docx) export of the full report is not available yet: the report view prints to PDF and chapters
      export as CSV.'
  - key: efrag_index
    description: The EFRAG standards are consulted on the public EFRAG site through the WebRobot MCP; a dedicated search index
      is not available yet.
  - key: review_price
    description: The higher price for consultant review is sold as a separate pack; enforcing that only reviewed reports are
      approved is not automated.
