apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: bilanciovverde
  displayName: BilancioVerde
  tagline:
    it: Il report di sostenibilità ESRS per PMI, pronto e rivisto dal tuo consulente.
    en: Your SME ESRS sustainability report, ready and reviewed by your consultant.
  description:
    it: 'Compila un modulo a sezioni, incolla il testo dei tuoi documenti: un agente AI estrae i numeri, guida l''analisi
      di doppia materialità, segnala i dati mancanti e scrive il report (ESRS semplificato per PMI). Il consulente rivede
      e approva ogni capitolo.'
    en: 'Fill in a sectioned form and paste the text of your documents: an AI agent extracts the figures, guides the double
      materiality analysis, flags missing data and writes the report (simplified ESRS for SMEs). Your consultant reviews and
      approves each chapter.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#14532d'
      accent: '#2f9e5b'
      background: '#f6faf6'
      foreground: '#16231b'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Bilancio
      color: primary
    - text: Verde
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#how'
    - label:
        it: Prezzi
        en: Pricing
      href: '#pricing'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: consultant
      label:
        it: Consulente
        en: Consultant
      assignedBy: invite
    - key: user
      label:
        it: Azienda
        en: Company
      assignedBy: signup
  limits:
  - action: agent:analyst
    per: user
    max: 5
    window: day
    roles:
    - user
  agents:
  - key: analyst
    role: main
    description: Extracts figures, runs the double materiality analysis, lists gaps and writes the ESRS SME report chapters.
    awaits:
    - chapter_review
    delegates:
    - extractor
    memory: user
    writesTo:
      collection: indicators
      parse: json_last
      keyBy: year
    output: markdown+json
    limits:
      maxTurns: 40
      maxBudgetUsd: 2.5
    profile:
      inline:
        display_name: BilancioVerde analyst
        crews:
        - id: analyst
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 2.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You are a sustainability reporting expert for European SMEs, applying the simplified ESRS for SMEs
            (VSME-style, EFRAG) and the ESRS topical standards. When you need to cite a standard, consult the EFRAG public
            pages through the webrobot MCP (scrape efrag.org) and cite the standard and datapoint code; if you cannot verify,
            say so.

            Work in this order: 1) delegate to the extractor with the pasted documents text to obtain figures with their source;
            2) run a guided double materiality analysis (impact and financial materiality) from the company''s sector and
            data, in a table with score 1-5 and a one-line motivation per topic (E1 climate, E2 pollution, E3 water, E4 biodiversity,
            E5 circular economy, S1 own workforce, S2-S4, G1 governance); 3) list MISSING information as a checklist, by section,
            with the datapoint needed; 4) write the chapters; 5) ask for the consultant''s review with request_chapter_review
            for each chapter when the company asked for review.

            Output: first a level-1 title "# Report di sostenibilità <Company> — <year>" (or English if the lang is en). Then
            ## chapters: General information, Double materiality, Energy and emissions, Pollution and waste, Own workforce,
            Governance and business conduct, Missing information, Next steps. Use tables and indicators; add a chart block
            for year-on-year comparisons when previous-year data exist:

            ```chart

            {"type":"bar","title":"...","labels":["2024","2025"],"series":[{"name":"...","values":[1,2]}],"unit":"tCO2e"}

            ```

            Never invent figures, emission factors or sources: mark unknown values as ''n.d.'' and put them in Missing information.
            State the method and factors used for any calculation. This is drafting support, not legal or audit assurance.

            End with ONE final fenced json block with the indicators of the reporting year: {"year":<int>,"employees":<n>,"energy_kwh":<n>,"renewable_pct":<n>,"scope1_tco2e":<n>,"scope2_tco2e":<n>,"waste_t":<n>,"recycled_pct":<n>,"women_pct":<n>,"accidents":<n>,"completeness_pct":<n>}
            using null for unknown values.'
    goalTemplate: 'Company: {company_name}, sector {sector}, country {country_label}. Reporting year: {year}. Revenue (EUR):
      {?revenue}{revenue}{/revenue}{!revenue}n.d.{/revenue}.

      Employees: {?employees}{employees}{/employees}{!employees}n.d.{/employees}; women %: {?women_pct}{women_pct}{/women_pct}{!women_pct}n.d.{/women_pct};
      accidents: {?accidents}{accidents}{/accidents}{!accidents}n.d.{/accidents}.

      Electricity kWh: {?electricity_kwh}{electricity_kwh}{/electricity_kwh}{!electricity_kwh}n.d.{/electricity_kwh}; gas
      m3: {?gas_m3}{gas_m3}{/gas_m3}{!gas_m3}n.d.{/gas_m3}; fuel litres: {?fuel_l}{fuel_l}{/fuel_l}{!fuel_l}n.d.{/fuel_l};
      renewable %: {?renewable_pct}{renewable_pct}{/renewable_pct}{!renewable_pct}n.d.{/renewable_pct}.

      Waste tonnes: {?waste_t}{waste_t}{/waste_t}{!waste_t}n.d.{/waste_t}; recycled %: {?recycled_pct}{recycled_pct}{/recycled_pct}{!recycled_pct}n.d.{/recycled_pct}.

      {?emissions_notes}Emissions notes: {emissions_notes}{/emissions_notes}

      {?governance}Governance: {governance}{/governance}

      {?social_policies}Social policies: {social_policies}{/social_policies}

      {?previous_year}Previous year data: {previous_year}{/previous_year}

      {?documents}Text of documents / links provided (bills, financial statements, regulations, certifications): {documents}{/documents}

      Consultant review requested: {review_label}.

      Write the report in the language with ISO code {lang}. Today is {date}.'
  - key: extractor
    role: helper
    description: Extracts numbers from the pasted text of company documents.
    profile:
      inline:
        display_name: BilancioVerde extractor
        crews:
        - id: extractor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You read text pasted from company documents (energy bills, financial statements, internal policies,
            certifications) and extract sustainability figures. Return a table: indicator, value, unit, period, source document
            and quote. Convert units only when certain and say so. Never guess: if a number is not in the text, do not list
            it. Flag conflicts between documents.'
  approvals:
  - key: chapter_review
    title:
      it: Revisione capitolo
      en: Chapter review
    description: The consultant reviews and approves each chapter of the client's report.
    role: consultant
    decidedBy: role
    fields:
    - chapter
    - draft
    - open_points
    timeoutMinutes: 10080
    onTimeout: reject
  inputForm:
    title:
      it: Nuovo report di sostenibilità
      en: New sustainability report
    fields:
    - name: company_name
      type: text
      required: true
      label:
        it: 1. Dati generali — Ragione sociale
        en: 1. General — Company name
    - name: sector
      type: text
      required: true
      label:
        it: Settore / codice ATECO
        en: Sector / NACE code
    - name: country
      type: select
      required: true
      default: it
      label:
        it: Paese
        en: Country
      options:
      - value: it
        label:
          it: Italia
          en: Italy
      - value: other
        label:
          it: Altro UE
          en: Other EU
    - name: year
      type: number
      required: true
      label:
        it: Anno di rendicontazione
        en: Reporting year
      default: 2025
    - name: revenue
      type: number
      label:
        it: Fatturato (EUR)
        en: Revenue (EUR)
    - name: employees
      type: number
      label:
        it: 2. Dipendenti — Numero
        en: 2. Workforce — Headcount
    - name: women_pct
      type: number
      label:
        it: '% donne'
        en: '% women'
    - name: accidents
      type: number
      label:
        it: Infortuni nell'anno
        en: Accidents in the year
    - name: electricity_kwh
      type: number
      label:
        it: 3. Energia — Elettricità (kWh)
        en: 3. Energy — Electricity (kWh)
    - name: gas_m3
      type: number
      label:
        it: Gas naturale (m³)
        en: Natural gas (m³)
    - name: fuel_l
      type: number
      label:
        it: Carburante flotta (litri)
        en: Fleet fuel (litres)
    - name: renewable_pct
      type: number
      label:
        it: '% energia rinnovabile'
        en: '% renewable energy'
    - name: emissions_notes
      type: textarea
      maxLength: 1000
      label:
        it: 4. Emissioni — Note e dati già calcolati (Scope 1/2/3)
        en: 4. Emissions — Notes and figures already calculated (Scope 1/2/3)
    - name: waste_t
      type: number
      label:
        it: 5. Rifiuti — Totale (tonnellate)
        en: 5. Waste — Total (tonnes)
    - name: recycled_pct
      type: number
      label:
        it: '% avviata a recupero'
        en: '% recovered/recycled'
    - name: governance
      type: textarea
      maxLength: 1500
      label:
        it: 6. Governance — organi, codice etico, anticorruzione
        en: 6. Governance — bodies, code of conduct, anti-corruption
    - name: social_policies
      type: textarea
      maxLength: 1500
      label:
        it: 7. Politiche sociali — formazione, salute e sicurezza, diversità
        en: 7. Social policies — training, health and safety, diversity
    - name: previous_year
      type: textarea
      maxLength: 1500
      label:
        it: Dati dell'anno precedente (per il confronto)
        en: Previous year data (for comparison)
    - name: documents
      type: textarea
      maxLength: 20000
      label:
        it: 'Documenti esistenti: incolla il testo o i link'
        en: 'Existing documents: paste text or links'
      help:
        it: 'Bollette, bilancio, regolamenti, certificazioni: incolla il testo copiato dal PDF/Excel.'
        en: 'Bills, financial statements, policies, certifications: paste text copied from the PDF/Excel.'
    - name: review
      type: select
      required: true
      default: 'no'
      label:
        it: Revisione del consulente
        en: Consultant review
      options:
      - value: 'no'
        label:
          it: No, solo bozza AI
          en: No, AI draft only
      - value: 'yes'
        label:
          it: Sì, rivedi e approva ogni capitolo
          en: Yes, review and approve each chapter
  data:
    collections:
    - name: indicators
      ownedBy: user
      sharing:
      - viewer
      description: Yearly sustainability indicators of each company, for the year-on-year dashboard
      fields:
      - name: year
        type: number
      - name: employees
        type: number
      - name: energy_kwh
        type: number
      - name: renewable_pct
        type: number
      - name: scope1_tco2e
        type: number
      - name: scope2_tco2e
        type: number
      - name: waste_t
        type: number
      - name: recycled_pct
        type: number
      - name: women_pct
        type: number
      - name: accidents
        type: number
      - name: completeness_pct
        type: number
  views:
  - key: home
    type: page
    nav: false
    title: BilancioVerde
    sections:
    - type: hero
      band: true
      title:
        it: Il report di sostenibilità **ESRS** per la tua PMI, senza partire da zero.
        en: Your **ESRS** sustainability report for your SME, without starting from scratch.
      text:
        it: 'Compila il modulo, incolla i tuoi documenti: l''agente estrae i numeri, guida la doppia materialità, segnala
          cosa manca e scrive il report. Il tuo consulente rivede ogni capitolo.'
        en: 'Fill in the form, paste your documents: the agent extracts the figures, guides the double materiality, flags
          what is missing and writes the report. Your consultant reviews every chapter.'
      actions:
      - label:
          it: Inizia il report
          en: Start your report
        href: /v/new_report
        style: primary
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: ghost
    - type: steps
      id: how
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Compila
          en: Fill in
        text:
          it: 'Sette sezioni: dati generali, dipendenti, energia, emissioni, rifiuti, governance, politiche sociali.'
          en: 'Seven sections: general, workforce, energy, emissions, waste, governance, social policies.'
      - title:
          it: Analisi
          en: Analysis
        text:
          it: Estrazione dei numeri dai documenti, doppia materialità guidata, elenco delle informazioni mancanti.
          en: Figures extracted from documents, guided double materiality, list of missing information.
      - title:
          it: Revisione e export
          en: Review and export
        text:
          it: Il consulente approva i capitoli; stampa il report in PDF e consulta la dashboard anno su anno.
          en: The consultant approves the chapters; print the report to PDF and read the year-on-year dashboard.
    - type: cards
      id: pricing
      title:
        it: Prezzi
        en: Pricing
      items:
      - title:
          it: Report annuale — 490 €
          en: Annual report — €490
        text:
          it: Bozza completa scritta dall'agente, indicatori e dashboard.
          en: Complete draft written by the agent, indicators and dashboard.
      - title:
          it: Con revisione del consulente — 890 €
          en: With consultant review — €890
        text:
          it: Ogni capitolo rivisto e approvato dal consulente che segue l'azienda.
          en: Every chapter reviewed and approved by your consultant.
    - type: note
      content:
        it: Supporto alla redazione, non attestazione né consulenza legale. Ogni azienda vede solo i propri dati.
        en: Drafting support, not assurance or legal advice. Each company sees only its own data.
  - key: new_report
    type: new_run
    title:
      it: Nuovo report
      en: New report
    roles:
    - user
    - admin
  - key: reports
    type: history
    title:
      it: I miei report
      en: My reports
    source: run
    roles:
    - user
    - consultant
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: reviews
    type: approvals
    title:
      it: Revisioni capitoli
      en: Chapter reviews
    approvals:
    - chapter_review
    roles:
    - consultant
    - admin
  - key: dashboard
    type: page
    title:
      it: Indicatori
      en: Indicators
    roles:
    - user
    - consultant
    - admin
    sections:
    - type: data
      title:
        it: Indicatori anno su anno
        en: Year-on-year indicators
      source: collection:indicators
      display: table
      fields:
      - key: year
        label:
          it: Anno
          en: Year
      - key: employees
        label:
          it: Dipendenti
          en: Employees
        format: number
      - key: energy_kwh
        label: kWh
        format: number
      - key: renewable_pct
        label:
          it: '% rinnovabile'
          en: '% renewable'
        format: number
      - key: scope1_tco2e
        label: Scope 1 tCO2e
        format: number
      - key: scope2_tco2e
        label: Scope 2 tCO2e
        format: number
      - key: waste_t
        label:
          it: Rifiuti t
          en: Waste t
        format: number
      - key: completeness_pct
        label:
          it: Completezza %
          en: Completeness %
        format: number
      sort:
        field: year
        dir: desc
      empty:
        it: 'Nessun indicatore: genera il primo report.'
        en: 'No indicators yet: generate your first report.'
    - type: data
      title:
        it: Emissioni (tCO2e)
        en: Emissions (tCO2e)
      source: collection:indicators
      display: chart
      chart: stacked
      fields:
      - key: year
      - key: scope1_tco2e
        label: Scope 1
      - key: scope2_tco2e
        label: Scope 2
      sort:
        field: year
        dir: asc
    - type: data
      title:
        it: Energia (kWh)
        en: Energy (kWh)
      source: collection:indicators
      display: chart
      chart: line
      fields:
      - key: year
      - key: energy_kwh
        label: kWh
      sort:
        field: year
        dir: asc
  - key: account
    type: account
    title:
      it: Crediti
      en: Credits
    roles:
    - user
  billing:
    modes:
    - credits
    signupCredits: 0
    costs:
      agent:analyst: 1000
    packs:
    - key: report
      credits: 1000
      price: 490
      label:
        it: Report annuale
        en: Annual report
    - key: report_review
      credits: 1000
      price: 890
      label:
        it: Report annuale con revisione del consulente
        en: Annual report with consultant review
  extensions:
  - key: file_upload
    description: 'File upload (PDF/Excel) is not available yet: users paste the text of documents or links. Automatic extraction
      from files will need it.'
  - key: word_export
    description: Word (.docx) export is not available yet; the report is printable to PDF. Word export needs a runtime export.
  - key: efrag_index
    description: A dedicated indexed EFRAG standards search is not available; the analyst consults the public EFRAG pages
      through the WebRobot MCP.
  - key: consultant_clients
    description: Linking consultants to their client companies uses per-record sharing of indicators and the chapter_review
      approval; a dedicated client-assignment collection is still to be defined.
  - key: review_pricing
    description: The higher price with consultant review is sold as a separate pack; enforcing that review is requested only
      after buying it needs custom logic.
  - key: notifications
    description: Email notifications to the consultant when a chapter awaits review are not available yet.
