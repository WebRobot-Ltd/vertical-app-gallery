    currency: eur
    plans:
    - key: starter
      price: 29
      interval: month
      label: Starter — 100 spedizioni/mese
    - key: growth
      price: 79
      interval: month
      label: Growth — 500 spedizioni/mese
    - key: scale
      price: 199
      interval: month
      label: Scale — 2000 spedizioni/mese
  notifications:
    emailOnRunDone: false
  extensions:
  - key: oauth_stores
    description: 'Il collegamento OAuth a Shopify, WooCommerce e marketplace non è ancora disponibile: Shopify si collega
      con il token di un''app personalizzata, WooCommerce e i marketplace inviano gli ordini via webhook (/api/hooks/order_in).'
  - key: carrier_webhooks_routing
    description: I webhook dei corrieri sono salvati come eventi (codice e stato) e letti al controllo successivo; l'instradamento
      istantaneo per negozio e le API esatte dei corrieri vanno verificati con la documentazione di ciascun contratto.
  - key: return_routing
    description: Il modulo di reso pubblico arriva all'inbox del proprietario e al negoziante tramite l'email indicata nel
      link; l'instradamento automatico al negozio e l'etichetta di reso non sono ancora disponibili.
  - key: label_printing
    description: L'etichetta è salvata come link restituito dal corriere; la stampa avviene dal browser.
