apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: spedizioni-unificate
  displayName: Spedizioni Unificate
  tagline:
    it: 'Tutti i tuoi corrieri in un solo pannello: tariffe, etichette, tracking e reclami.'
    en: 'All your carriers in one panel: rates, labels, tracking and claims.'
  description:
    it: Importa gli ordini del tuo negozio, confronta le tariffe dei corrieri, crea la spedizione con l'etichetta, avvisa
      i clienti a ogni cambio di stato e prepara i reclami per le spedizioni in ritardo.
    en: Import your shop orders, compare carrier rates, create the shipment and label, notify customers on every status change
      and draft claims for delayed parcels.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: dashboard
  branding:
    theme: light
    palette:
      primary: '#12355b'
      accent: '#e8710a'
      background: '#f6f8fb'
      foreground: '#16212e'
    fonts:
      body: Inter
      display: Manrope
    wordmark:
    - text: Spedizioni
      color: primary
    - text: Unificate
      color: accent
    width: wide
  header:
    links:
    - label: Come funziona
      href: '#come-funziona'
    - label: Traccia un pacco
      href: /v/track
    cta:
      label: Accedi
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
      - track
      - return
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  limits:
  - action: create:shipments
    max: 100
    window: month
    plans:
      growth: 500
      scale: 2000
  - action: login
    per: ip
    max: 20
    window: hour
  agents:
  - key: rate_shopper
    role: main
    description: Per ogni nuovo ordine confronta le tariffe dei corrieri collegati, sceglie secondo le regole del negoziante
      e crea la spedizione con l'etichetta.
    profile:
      inline:
        display_name: Rate shopper
        crews:
        - id: rate_shopper
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''agente che sceglie il corriere per un ordine di un negozio online. Ricevi l''ordine (peso,
            dimensioni, destinazione) e le regole del negoziante (strategia: cheapest, fastest o balanced; prezzo massimo;
            corrieri preferiti o esclusi; note libere). Passi: 1) chiedi la tariffa a ogni corriere collegato con gli strumenti
            dhl_rates, ups_rates, gls_rates; se uno strumento dice che il negoziante non ha collegato la chiave, saltalo.
            2) Confronta prezzo e tempo di consegna stimato e applica le regole; non inventare mai tariffe: usa solo quelle
            ricevute. 3) Se nessuna offerta rispetta le regole, NON creare la spedizione e spiega perché. 4) Altrimenti crea
            la spedizione con lo strumento ship_* del corriere scelto e salva il risultato con shipments_write (order_id,
            shop_id, shop_name, carrier, service, price, transit_days, tracking_code, label_url, status ''created'', customer_email,
            customer_name, members copiati dall''ordine). Report in Markdown che inizia con ''# Spedizione ordine <numero>'',
            poi ## Tariffe confrontate (tabella), ## Scelta e motivo, ## Etichetta. Non dare mai consulenza legale.'
          mcp_servers: []
    context:
    - key: shop_rules
      from: collection:shops
    goalTemplate: 'Ordine da spedire: {event}

      Regole e dati dei negozi dell''utente (JSON): {shop_rules}

      Data: {date}. Scrivi in lingua {lang}.'
    appTools:
    - name: orders_read
      description: Legge gli ordini del negoziante
      action: read
      collection: orders
      scope: user
    - name: dhl_rates
      description: Tariffe DHL per peso, dimensioni e destinazione
      action: http
      http:
        method: POST
        url: https://api-eu.dhl.com/mydhlapi/rates
        attribution: DHL Express API, contratto del negoziante
        credential:
          provider: dhl
          header: Authorization
          format: Bearer {secret}
    - name: ups_rates
      description: Tariffe UPS per peso, dimensioni e destinazione
      action: http
      http:
        method: POST
        url: https://onlinetools.ups.com/api/rating/v2409/Shop
        attribution: UPS API, contratto del negoziante
        credential:
          provider: ups
          header: Authorization
          format: Bearer {secret}
    - name: gls_rates
      description: Tariffe GLS per peso, dimensioni e destinazione
      action: http
      http:
        method: POST
        url: https://api.gls-group.eu/public/v1/rates
        attribution: GLS API, contratto del negoziante
        credential:
          provider: gls
          header: Authorization
          format: Bearer {secret}
    - name: ship_dhl
      description: Crea la spedizione DHL e restituisce tracking ed etichetta
      action: http
      http:
        method: POST
        url: https://api-eu.dhl.com/mydhlapi/shipments
        attribution: DHL Express API
        credential:
          provider: dhl
          header: Authorization
          format: Bearer {secret}
    - name: ship_ups
      description: Crea la spedizione UPS e restituisce tracking ed etichetta
      action: http
      http:
        method: POST
        url: https://onlinetools.ups.com/api/shipments/v2409/ship
        attribution: UPS API
        credential:
          provider: ups
          header: Authorization
          format: Bearer {secret}
    - name: ship_gls
      description: Crea la spedizione GLS e restituisce tracking ed etichetta
      action: http
      http:
        method: POST
        url: https://api.gls-group.eu/public/v1/shipments
        attribution: GLS API
        credential:
          provider: gls
          header: Authorization
          format: Bearer {secret}
    - name: shipments_write
      description: Crea o aggiorna una spedizione
      action: write
      collection: shipments
      scope: user
    output: markdown
    limits:
      maxTurns: 15
      maxBudgetUsd: 0.5
  - key: tracker
    role: scheduled
    description: 'Ogni poche ore, per un negozio: importa gli ordini nuovi, interroga il tracking dei corrieri, registra i
      cambi di stato e apre avvisi per spedizioni ferme o eccezioni.'
    memory: instance
    writesTo:
      collection: tracking_runs
    profile:
      inline:
        display_name: Tracker
        crews:
        - id: tracker
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''agente che sorveglia le spedizioni di UN negozio. Passi: 1) Se il negozio usa Shopify, leggi
            gli ordini nuovi con shopify_orders e salvali con orders_write (external_id, customer, indirizzo, peso, dimensioni,
            shop_id, members dal record del negozio letto con shops_read); salta quelli già presenti (orders_read). Gli ordini
            di WooCommerce e marketplace arrivano da webhook. 2) Leggi le spedizioni aperte con shipments_read e gli eventi
            push dei corrieri con carrier_events_read. 3) Per ogni spedizione non consegnata chiedi lo stato con track_dhl,
            track_ups o track_gls (path = codice di tracking). 4) Se lo stato è cambiato: aggiorna la spedizione con shipments_write,
            registra il cambio con status_changes_write (tracking_code, shop_name, brand_name, support_email, customer_email,
            customer_name, old_status, new_status, members) e aggiorna la pagina pubblica con public_tracking_write (tracking_code,
            carrier, status, last_update, eta; MAI dati personali). 5) Se una spedizione è ferma da oltre 2 giorni o c''è
            un''eccezione di consegna, crea UN solo avviso con alerts_write (kind stalled|exception, status open, shipment_id,
            tracking_code, carrier, detail, members) se non esiste già. Non inventare stati. Report che inizia con ''# Controllo
            spedizioni <negozio> — <data>'' con ## Cambi di stato, ## Avvisi aperti, ## Ordini importati. Alla fine chiama
            remember con i codici già segnalati.'
          mcp_servers: []
    goalTemplate: Controlla il negozio "{instance}" ({shop_name}). Oggi è {date}. Scrivi in lingua {lang}.
    appTools:
    - name: shopify_orders
      description: Ordini Shopify del negoziante
      action: http
      http:
        method: GET
        url: https://{host}/admin/api/2025-01/orders.json
        allowPath: false
        credential:
          provider: shopify
          header: X-Shopify-Access-Token
          format: '{secret}'
    - name: shops_read
      description: Legge i negozi dell'utente
      action: read
      collection: shops
      scope: user
    - name: orders_read
      description: Legge gli ordini del negoziante
      action: read
      collection: orders
      scope: user
    - name: orders_write
      description: Salva un ordine importato
      action: write
      collection: orders
      scope: user
    - name: shipments_read
      description: Legge le spedizioni del negoziante
      action: read
      collection: shipments
      scope: user
    - name: shipments_write
      description: Crea o aggiorna una spedizione
      action: write
      collection: shipments
      scope: user
    - name: carrier_events_read
      description: Legge gli eventi push (webhook) dei corrieri
      action: read
      collection: carrier_events
      scope: all
    - name: status_changes_write
      description: Registra un cambio di stato (invia l'email al cliente)
      action: write
      collection: status_changes
      scope: user
    - name: public_tracking_write
      description: Aggiorna la pagina pubblica di tracking
      action: write
      collection: public_tracking
      scope: all
    - name: alerts_write
      description: Crea o aggiorna un avviso nella coda
      action: write
      collection: alerts
      scope: user
    - name: track_dhl
      description: Stato di una spedizione DHL (path = codice)
      action: http
      http:
        method: GET
        url: https://api-eu.dhl.com/track/shipments
        allowPath: true
        attribution: DHL Tracking API
        credential:
          provider: dhl
          header: Authorization
          format: Bearer {secret}
    - name: track_ups
      description: Stato di una spedizione UPS (path = codice)
      action: http
      http:
        method: GET
        url: https://onlinetools.ups.com/api/track/v1/details
        allowPath: true
        attribution: UPS Tracking API
        credential:
          provider: ups
          header: Authorization
          format: Bearer {secret}
    - name: track_gls
      description: Stato di una spedizione GLS (path = codice)
      action: http
      http:
        method: GET
        url: https://api.gls-group.eu/public/v1/tracking
        allowPath: true
        attribution: GLS Tracking API
        credential:
          provider: gls
          header: Authorization
          format: Bearer {secret}
    output: markdown
    limits:
      maxTurns: 25
      maxBudgetUsd: 0.6
  - key: claim_writer
    role: helper
    description: Prepara il reclamo al corriere per un avviso.
    profile:
      inline:
        display_name: Claim writer
        crews:
        - id: claim_writer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Scrivi la bozza di reclamo formale al corriere per una spedizione ferma o con eccezione di consegna.
            Usa solo i fatti ricevuti (corriere, codice, date, stato, dettaglio): mai inventare. Struttura: oggetto, riferimenti
            della spedizione, cronologia dei fatti, richiesta (verifica, consegna urgente o rimborso secondo il contratto),
            ringraziamento. Non affermare diritti legali come certi. Salva la bozza nell''avviso con alerts_write (id dell''avviso,
            claim_draft). Report Markdown che inizia con ''# Reclamo <corriere> — <codice>''.'
          mcp_servers: []
    goalTemplate: 'Avviso {record.kind} per la spedizione {record.tracking_code} del corriere {record.carrier}. Dettaglio:
      {record.detail}. Id avviso: {record.id}. Oggi è {date}. Scrivi in lingua {lang}.'
    appTools:
    - name: alerts_write
      description: Crea o aggiorna un avviso nella coda
      action: write
      collection: alerts
      scope: user
    output: markdown
    limits:
      maxTurns: 6
      maxBudgetUsd: 0.2
  templates:
  - key: shop_watch
    title: Sorveglianza negozio
    description: Importa ordini e controlla il tracking del negozio ogni 4 ore.
    agent: tracker
    params:
    - name: shop_name
      type: text
      required: true
      label: Nome del negozio
    goal: Controlla il negozio "{instance}" ({shop_name}). Oggi è {date}. Scrivi in lingua {lang}.
    schedule:
      cron: 0 */4 * * *
      userCanChange: true
    maxPerUser: 5
  data:
    collections:
    - name: shops
      description: 'Negozi del cliente: brand, regole di spedizione, membri del team'
      ownedBy: user
      fields:
      - name: name
        type: text
        required: true
        label: Nome negozio
      - name: brand_name
        type: text
        label: Nome nelle email
      - name: support_email
        type: email
        label: Email di supporto
      - name: platform
        type: select
        label: Piattaforma
        options:
        - value: shopify
          label: Shopify
        - value: woocommerce
          label: WooCommerce
        - value: marketplace
          label: Marketplace
      - name: strategy
        type: select
        label: Regola di scelta
        options:
        - value: cheapest
          label: Il più conveniente
        - value: fastest
          label: Il più veloce
        - value: balanced
          label: Equilibrato
      - name: max_price
        type: number
        label: Prezzo massimo per spedizione (€)
      - name: excluded_carriers
        type: text
        label: Corrieri esclusi
      - name: rules_notes
        type: textarea
        label: Altre regole
      - name: members
        type: array
        label: Email dei membri del team
      access:
      - role: user
        where:
          members: '{user.email}'
        can:
        - read
        - write
    - name: orders
      ownedBy: user
      fields:
      - name: shop_id
        type: text
      - name: external_id
        type: text
      - name: customer_name
        type: text
      - name: customer_email
        type: email
      - name: address
        type: text
      - name: city
        type: text
      - name: postal_code
        type: text
      - name: country
        type: country
      - name: weight_kg
        type: number
      - name: length_cm
        type: number
      - name: width_cm
        type: number
      - name: height_cm
        type: number
      - name: status
        type: select
        options:
        - new
        - shipped
        - problem
      - name: members
        type: array
      access:
      - role: user
        where:
          members: '{user.email}'
        can:
        - read
        - write
    - name: shipments
      ownedBy: user
      retentionDays: 730
      fields:
      - name: order_id
        type: text
      - name: shop_id
        type: text
      - name: shop_name
        type: text
      - name: carrier
        type: text
      - name: service
        type: text
      - name: price
        type: number
      - name: transit_days
        type: number
      - name: tracking_code
        type: text
      - name: label_url
        type: url
      - name: status
        type: text
      - name: last_update
        type: date
      - name: customer_name
        type: text
      - name: customer_email
        type: email
      - name: members
        type: array
      access:
      - role: user
        where:
          members: '{user.email}'
        can:
        - read
        - write
    - name: alerts
      description: Coda avvisi del negoziante
      ownedBy: user
      fields:
      - name: kind
        type: select
        options:
        - stalled
        - exception
      - name: status
        type: select
        options:
        - open
        - claimed
        - resolved
      - name: shipment_id
        type: text
      - name: tracking_code
        type: text
      - name: carrier
        type: text
      - name: detail
        type: textarea
      - name: claim_draft
        type: textarea
      - name: members
        type: array
      access:
      - role: user
        where:
          members: '{user.email}'
        can:
        - read
        - write
    - name: status_changes
      description: Cambi di stato che generano l'email al cliente finale
      ownedBy: user
      retentionDays: 365
      fields:
      - name: tracking_code
        type: text
      - name: shop_name
        type: text
      - name: brand_name
        type: text
      - name: support_email
        type: email
      - name: customer_email
        type: email
      - name: customer_name
        type: text
      - name: old_status
        type: text
      - name: new_status
        type: text
      - name: members
        type: array
      access:
      - role: user
        where:
          members: '{user.email}'
        can:
        - read
    - name: tracking_runs
      ownedBy: instance
      retentionDays: 90
      description: Report dei controlli periodici
    - name: carrier_events
      description: Eventi push dei corrieri (solo codice e stato)
      ownedBy: app
      retentionDays: 30
      fields:
      - name: event_id
        type: text
      - name: tracking_code
        type: text
      - name: status
        type: text
      - name: event_time
        type: text
    - name: public_tracking
      description: Stato pubblico del pacco, senza dati personali
      ownedBy: app
      retentionDays: 120
      fields:
      - name: tracking_code
        type: text
      - name: carrier
        type: text
      - name: status
        type: text
      - name: last_update
        type: text
      - name: eta
        type: text
    - name: return_requests
      description: Richieste di reso dei clienti finali
      ownedBy: org
      retentionDays: 365
      fields:
      - name: tracking_code
        type: text
        required: true
        label: Codice di tracking
      - name: customer_email
        type: email
        required: true
        label: La tua email
      - name: merchant_email
        type: email
        label: Email del negozio
      - name: reason
        type: select
        required: true
        label: Motivo
        options:
        - value: wrong
          label: Articolo sbagliato
        - value: damaged
          label: Danneggiato
        - value: not_wanted
          label: Non lo voglio più
        - value: other
          label: Altro
      - name: notes
        type: textarea
        label: Note
        maxLength: 800
    credentials:
    - provider: shopify
      kind: api_key
      scope: user
      label: Shopify (token app personalizzata)
      help: Shopify Admin > Impostazioni > App > Sviluppa app > token di accesso Admin API.
      hostLabel: il-tuo-negozio.myshopify.com
    - provider: dhl
      kind: api_key
      scope: user
      label: DHL Express
      help: Chiave API dal portale sviluppatori DHL collegato al tuo contratto.
    - provider: ups
      kind: api_key
      scope: user
      label: UPS
      help: Token dal tuo account UPS Developer.
    - provider: gls
      kind: api_key
      scope: user
      label: GLS
      help: Chiave API fornita dal tuo referente GLS.
  egress:
    hosts:
    - '*.myshopify.com'
    - api-eu.dhl.com
    - onlinetools.ups.com
    - api.gls-group.eu
    notes: 'Shopify: negozio dell''utente con sua chiave. DHL, UPS, GLS: API dei corrieri usate con il contratto e la chiave
      del negoziante.'
  triggers:
  - key: order_in
    description: Ordini da WooCommerce o marketplace via webhook
    'on':
      webhook: true
    write:
      collection: orders
      keyBy: external_id
  - key: new_order
    'on':
      collection: orders
      op: insert
      where:
        status: new
    start:
      agent: rate_shopper
    goal: Nuovo ordine {record.external_id} per {record.customer_name}, {record.address}, {record.postal_code} {record.city},
      {record.country}. Peso {record.weight_kg} kg, dimensioni {record.length_cm}x{record.width_cm}x{record.height_cm} cm.
      Negozio {record.shop_id}. Email cliente {record.customer_email}. Membri {record.members}.
  - key: carrier_event
    description: Webhook di tracking dei corrieri
    'on':
      webhook: true
    write:
      collection: carrier_events
      keyBy: event_id
  - key: status_notice
    'on':
      collection: status_changes
      op: insert
    notify:
      to: record.customer_email
      subject: '{record.brand_name}: il tuo ordine è {record.new_status}'
      body: 'Ciao {record.customer_name},


        la spedizione {record.tracking_code} del tuo ordine da {record.brand_name} ha cambiato stato: {record.new_status}.


        Puoi seguirla in ogni momento dalla pagina di tracking. Per assistenza scrivi a {record.support_email}.


        {record.brand_name}'
      link: track
  - key: alert_notice
    'on':
      collection: alerts
      op: insert
    notify:
      to: owner
      subject: Avviso spedizione {record.tracking_code}
      body: Nella tua coda c'è un nuovo avviso ({record.kind}) per la spedizione {record.tracking_code} del corriere {record.carrier}.
        Abbiamo preparato una bozza di reclamo.
      link: queue
  - key: alert_claim
    'on':
      collection: alerts
      op: insert
      where:
        status: open
    start:
      agent: claim_writer
    goal: 'Prepara il reclamo per l''avviso {record.id}: {record.kind}, spedizione {record.tracking_code}, corriere {record.carrier},
      dettaglio {record.detail}.'
  - key: return_notice
    'on':
      collection: return_requests
      op: insert
    notify:
      to:
      - admins
      - record.merchant_email
      subject: Richiesta di reso per {record.tracking_code}
      body: 'Un cliente ha chiesto un reso per la spedizione {record.tracking_code}. Motivo: {record.reason}. Note: {record.notes}.
        Contatto: {record.customer_email}.'
  - key: return_ack
    'on':
      collection: return_requests
      op: insert
    notify:
      to: record.customer_email
      subject: Abbiamo ricevuto la tua richiesta di reso
      body: Abbiamo registrato la richiesta di reso per la spedizione {record.tracking_code}. Il negozio ti contatterà presto
        con le istruzioni.
  views:
  - key: home
    type: page
    nav: false
    sections:
    - type: hero
      eyebrow: Per negozi online multi-corriere
      title: Un solo pannello per **tutte le tue spedizioni**
      text: Importa gli ordini, confronta le tariffe dei tuoi corrieri, stampa l'etichetta e tieni informati i clienti. Se
        un pacco si ferma, il reclamo è già pronto.
      actions:
      - label: Inizia
        href: /login
        style: primary
      - label: Traccia un pacco
        href: /v/track
        style: ghost
    - type: steps
      id: come-funziona
      title: Come funziona
      items:
      - title: Collega
        text: Registra il negozio e inserisci le chiavi API dei tuoi contratti con i corrieri.
        badge: 🔌
      - title: Spedisci
        text: Per ogni ordine l'agente confronta le tariffe, applica le tue regole e crea l'etichetta.
        badge: 📦
      - title: Monitora
        text: Tracking ogni poche ore ed email brandizzate ai clienti a ogni cambio di stato.
        badge: 📍
      - title: Risolvi
        text: Spedizioni ferme o con eccezioni finiscono in coda con la bozza di reclamo.
        badge: 🛟
    - type: note
      content: Le tariffe sono quelle restituite dalle API dei corrieri con i tuoi contratti. Il servizio non sostituisce
        la consulenza legale per i reclami.
  - key: dashboard
    type: page
    title: Dashboard
    roles:
    - user
    - admin
    sections:
    - type: data
      title: Costi e tempi per corriere
      source: collection:shipments
      display: chart
      chart: bar
      groupBy:
        field: carrier
        aggs:
        - key: costo_totale
          agg: sum
          field: price
        - key: giorni_medi
          agg: avg
          field: transit_days
      fields:
      - key: carrier
        label: Corriere
      - key: costo_totale
        label: Costo totale
        format: money
      - key: giorni_medi
        label: Giorni medi
        format: number
      empty: Nessuna spedizione ancora.
    - type: data
      title: Problemi per corriere
      source: collection:alerts
      display: table
      groupBy:
        field: carrier
        aggs: []
      fields:
      - key: carrier
        label: Corriere
      - key: count
        label: Avvisi
        format: number
      empty: Nessun avviso.
    - type: data
      title: Riepilogo
      source: collection:shipments
      display: kpi
      kpis:
      - label: Spedizioni
        agg: count
      - label: Spesa totale
        agg: sum
        field: price
        format: money
      - label: Costo medio
        agg: avg
        field: price
        format: money
  - key: shop_form
    type: form
