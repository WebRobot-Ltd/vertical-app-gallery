apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: affitto-subito
  displayName: AffittoSubito
  tagline: Ricevi in anticipo i canoni futuri del tuo affitto.
  description: Il proprietario carica contratto e ricevute, un agente verifica i documenti e calcola l'offerta di anticipo;
    un analista del partner finanziario autorizzato la approva. Il finanziamento è erogato dal partner.
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12355b'
      accent: '#1f8a70'
      background: '#f7f9fb'
      foreground: '#16202b'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Affitto
      color: primary
    - text: Subito
      color: accent
  header:
    links:
    - label: Come funziona
      href: '#come-funziona'
    cta:
      label: Richiedi un anticipo
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      label: Proprietario
      assignedBy: signup
    - key: analyst
      label: Analista del partner finanziario
      assignedBy: invite
  limits:
  - action: agent:underwriter
    per: user
    max: 5
    window: day
    roles:
    - user
  agents:
  - key: underwriter
    role: main
    description: Controlla i documenti, verifica la regolarità dei pagamenti, calcola l'offerta e la sottopone all'analista.
    awaits:
    - offer_review
    profile:
      inline:
        display_name: AffittoSubito underwriter
        crews:
        - id: underwriter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''istruttore di pratiche di anticipo canoni di locazione per proprietari. Il finanziamento
            è erogato da un partner finanziario autorizzato, non dall''app: non prometti mai l''esito.

            Passi: 1) Leggi contratto e ricevute (testo fornito; se sono scansioni o foto usa il tool read_upload con l''id
            del file). 2) Controlla la coerenza: canone, parti, date, estremi di registrazione, durata residua, corrispondenza
            con i dati del modulo; elenca ogni incongruenza. 3) Verifica la regolarità dei pagamenti dalle ricevute: importi,
            date, ritardi, mesi mancanti; dai un giudizio (regolare / con ritardi / critico). 4) Calcola l''offerta: mesi
            anticipabili = min(mesi richiesti, mesi residui del contratto, 12); importo lordo = canone x mesi; sconto percentuale
            in base a durata e regolarità (indicativamente 4-12%, più alto con ritardi); importo netto anticipato = lordo
            - sconto. Mostra il calcolo. Non inventare dati: se mancano documenti o ci sono incoerenze gravi, proponi di non
            procedere e spiega perché.

            5) Chiama il tool request_offer_review con il riepilogo dell''offerta e attendi la decisione dell''analista del
            partner.

            Formato: titolo di livello 1 "# Pratica anticipo canoni — <proprietario/immobile>", poi sezioni ## Coerenza dei
            documenti, ## Regolarità dei pagamenti, ## Offerta di anticipo (con tabella), ## Rischi e note. Termina con un
            blocco JSON finale (ultima riga del testo) con chiavi: monthly_rent, months_advanced, gross_amount, discount_pct,
            advance_amount, payments_rating, status ("in_review"), summary. Nessuna consulenza legale o finanziaria come fatto.'
    goalTemplate: 'Proprietario: {user}

      Contratto registrato n. {registration_number}, conduttore {tenant_name}.

      Canone mensile: {monthly_rent} EUR. Durata: dal {contract_start} al {contract_end}.

      Mesi di anticipo richiesti: {months_requested}.

      Contratto caricato: {contract}

      {?contract_text}Testo del contratto:

      {contract_text}{/contract_text}

      Ricevute caricate: {receipts}

      {?receipts_text}Testo delle ricevute:

      {receipts_text}{/receipts_text}

      Oggi è {date}. Scrivi in italiano.'
    appTools:
    - name: read_upload
      description: Legge un file caricato dall'utente (anche scansioni e foto, con OCR)
      action: read_file
    output: markdown+json
    writesTo:
      collection: practices
      parse: json_last
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.8
      timeoutSeconds: 600
  inputForm:
    title: Nuova richiesta di anticipo
    fields:
    - name: registration_number
      type: text
      required: true
      label: Estremi di registrazione del contratto
    - name: tenant_name
      type: text
      required: true
      label: Nome del conduttore
    - name: monthly_rent
      type: number
      required: true
      label: Canone mensile (EUR)
    - name: contract_start
      type: date
      required: true
      label: Inizio contratto
    - name: contract_end
      type: date
      required: true
      label: Fine contratto
    - name: months_requested
      type: number
      required: true
      label: Mesi di canone da anticipare
      help: Massimo 12
    - name: contract
      type: file
      required: true
      accept:
      - pdf
      - jpg
      - png
      maxMb: 15
      label: Contratto di locazione registrato
    - name: receipts
      type: file
      required: true
      accept:
      - pdf
      - jpg
      - png
      maxMb: 15
      multiple: true
      label: Ultime ricevute di pagamento
  data:
    collections:
    - name: practices
      ownedBy: user
      description: 'Pratiche di anticipo canoni: ogni proprietario vede solo le proprie; gli analisti del partner le leggono.'
      retentionDays: 1825
      fields:
      - name: monthly_rent
        type: number
        label: Canone mensile
      - name: months_advanced
        type: number
        label: Mesi anticipati
      - name: gross_amount
        type: number
        label: Importo lordo
      - name: discount_pct
        type: number
        label: Sconto %
      - name: advance_amount
        type: number
        label: Importo netto anticipato
      - name: payments_rating
        type: text
        label: Regolarità pagamenti
      - name: status
        type: text
        label: Stato
      - name: summary
        type: textarea
        label: Sintesi
      access:
      - role: analyst
  approvals:
  - key: offer_review
    title: Approvazione offerta di anticipo
    description: L'analista del partner finanziario accetta o rifiuta l'offerta.
    role: analyst
    decidedBy: role
    fields:
    - monthly_rent
    - months_advanced
    - discount_pct
    - advance_amount
    - payments_rating
    - summary
    timeoutMinutes: 10080
    onTimeout: reject
  triggers:
  - key: offer_approved
    'on':
      approval: offer_review
      decision: approved
    notify:
      to: owner
      subject: 'AffittoSubito: offerta di anticipo approvata'
      body: 'La tua offerta di anticipo canoni è stata approvata dall''analista del partner finanziario. Il finanziamento
        sarà erogato dal partner: trovi importi e dettagli nella pratica.'
      link: practices
  - key: offer_rejected
    'on':
      approval: offer_review
      decision: rejected
    notify:
      to: owner
      subject: 'AffittoSubito: esito della tua richiesta'
      body: La tua richiesta di anticipo canoni non è stata accolta dal partner finanziario. Puoi consultare la pratica e
        inviare una nuova richiesta.
      link: practices
  views:
  - key: home
    type: page
    nav: false
    title: AffittoSubito
    sections:
    - type: hero
      title: Incassa **subito** i canoni di affitto futuri.
      text: 'Carica il contratto registrato e le ultime ricevute: un agente verifica i documenti e calcola l''offerta di anticipo
        con lo sconto applicato. Un analista del partner finanziario autorizzato la approva ed eroga il finanziamento.'
      actions:
      - label: Richiedi un anticipo
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title: Come funziona
      items:
      - title: Registrati e carica
        text: Dati del contratto registrato, contratto e ultime ricevute.
      - title: Verifica e offerta
        text: L'agente controlla coerenza e regolarità dei pagamenti e calcola importo e sconto.
      - title: Approvazione del partner
        text: Un analista del partner finanziario autorizzato accetta o rifiuta l'offerta.
      - title: Esito via email
        text: Ricevi l'esito e segui lo stato della pratica.
    - type: note
      content: 'AffittoSubito non eroga finanziamenti: l''anticipo è concesso dal partner finanziario autorizzato. Sulla somma
        anticipata è dovuta una commissione. Le stime non sono consulenza legale o finanziaria.'
  - key: new_practice
    type: new_run
    title: Nuova richiesta
    roles:
    - user
    - admin
  - key: my_runs
    type: history
    title: Le mie pratiche
    source: run
    roles:
    - user
    - admin
  - key: practice
    type: report
    source: run
    printable: true
    nav: false
  - key: practices
    type: table
    title: Stato e importi
    source: collection:practices
    columns:
    - status
    - monthly_rent
    - months_advanced
    - discount_pct
    - advance_amount
    - payments_rating
    roles:
    - user
    - analyst
    - admin
  - key: reviews
    type: approvals
    title: Offerte da approvare
    approvals:
    - offer_review
    roles:
    - analyst
    - admin
  - key: account
    type: account
    title: Crediti
    roles:
    - user
  notifications:
    emailOnRunDone: true
  billing:
    modes:
    - credits
    signupCredits: 30
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:underwriter:
        estimate: 10
        metered: true
    packs:
    - key: small
      credits: 500
      price: 10
      label: Piccolo
  extensions:
  - key: advance_fee
    description: 'La commissione in percentuale sull''importo anticipato non è esprimibile oggi (le tariffe sono in crediti
      fissi o a consumo): va concordata con il partner e applicata fuori dall''app, oppure con un pagamento per transazione.'
  - key: practice_status_update
    description: 'Lo stato della pratica nella tabella resta ''in_review'': l''esito (approvato/rifiutato) arriva via email
      e nella vista approvazioni. L''aggiornamento automatico del record dopo la decisione non è disponibile.'
