apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: armadio-rivendibile
  displayName: ArmadioRivendibile
  tagline:
    it: 'Il tuo guardaroba digitale: scopri quanto valgono i tuoi capi usati.'
    en: 'Your digital wardrobe: find out what your used clothes are worth.'
  description:
    it: Aggiungi i tuoi capi, un agente AI stima il prezzo di rivendita confrontando annunci pubblici di usato della stessa
      marca e categoria, ti scrive titolo e descrizione e ti dice cosa vendere subito e cosa tenere.
    en: Add your garments and an AI agent estimates a realistic resale price by comparing public second-hand listings of the
      same brand and category, drafts the listing title and description, and tells you what to sell now and what to keep.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#3b2f4a'
      accent: '#d9644a'
      background: '#fbf8f4'
      foreground: '#201a26'
    fonts:
      body: Inter
      display: Playfair Display
    wordmark:
    - text: Armadio
      color: primary
    - text: Rivendibile
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Piani
        en: Plans
      href: '#piani'
    cta:
      label:
        it: Inizia
        en: Start
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  limits:
  - action: agent:appraiser
    per: user
    max: 40
    window: day
    roles:
    - user
  agents:
  - key: appraiser
    role: main
    description: Estimates the resale price of one garment from public second-hand listings, drafts the listing and saves
      the garment in the user's wardrobe.
    profile:
      inline:
        display_name: ArmadioRivendibile appraiser
        crews:
        - id: appraiser
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You are a second-hand fashion appraiser. For ONE garment (brand, category, size, material, condition,
            price paid, optional photo link) you:

            1. Use the WebRobot MCP to look at public second-hand listings of the same brand and category (similar size and
            condition) on public resale marketplaces, collecting 5-15 comparable listings (price, condition, size, URL). Do
            not log in anywhere and do not use personal data.

            2. Compute a realistic resale price (median of sold-like/asking prices adjusted for condition) and a range low-high.
            If fewer than 3 comparables exist, say the estimate is low-confidence. Never invent listings or figures.

            3. Decide a verdict: sell_now (value is likely to fall or the item is in demand now) or keep (holds or gains value,
            or is worth more later). Explain in one sentence.

            4. Save the garment with the tool garments_write with fields: brand, category, size, material, condition, price_paid,
            photo_url, estimated_value (number, EUR), value_low, value_high, confidence (high|medium|low), verdict, listing_title,
            listing_description, estimated_on (today''s date ISO).

            5. Answer with the report: a level-1 title "# <Brand> <category> — <estimated value> EUR", then ## Estimate (with
            a small table of range and confidence), ## Comparables (table with price, condition, link), ## Verdict, ## Suggested
            listing (title and description ready to paste, in the user''s language). Under 400 words. This is guidance, not
            a guarantee of sale price.'
    appTools:
    - name: garments_write
      description: Save a garment with its estimate in the user's wardrobe
      action: write
      collection: garments
      scope: user
    - name: garments_read
      description: Read the user's garments
      action: read
      collection: garments
      scope: user
    goalTemplate: 'Garment to appraise:

      Brand: {brand}

      Category: {category_label}

      Size: {size}

      Material: {material}

      Condition: {condition_label}

      Price paid: {price_paid} EUR

      {?photo_url}Photo link: {photo_url}{/photo_url}

      {?notes}Notes: {notes}{/notes}

      Today is {date}. Write the report in the language with ISO code {lang}.'
    output: markdown
    limits:
      maxTurns: 30
      maxBudgetUsd: 0.8
  - key: monitor
    role: helper
    description: Monthly, re-checks the user's wardrobe and lists the garments whose value is falling.
    memory: instance
    writesTo:
      collection: value_alerts
    profile:
      inline:
        display_name: ArmadioRivendibile value monitor
        crews:
        - id: monitor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You monitor the resale value of one user''s wardrobe. Read the garments with garments_read. For
            the garments with the highest estimated value (at most 10) check again the public second-hand listings of the
            same brand and category through the WebRobot MCP and compare with the saved estimated_value. Update changed garments
            with garments_write (new estimated_value, verdict, estimated_on). Write the report: a level-1 title "# Wardrobe
            value — <month year>", then ## Losing value (garment, old value, new value, % change, advice), ## Holding or rising,
            ## Sell now this month. Never invent figures; if you could not check an item, say so. Under 300 words. Your memory
            holds last month''s key figures: compare and then call remember once with the new ones.'
    appTools:
    - name: garments_read
      description: Read the user's garments
      action: read
      collection: garments
      scope: user
    - name: garments_write
      description: Update a garment's estimate
      action: write
      collection: garments
      scope: user
    goalTemplate: Monthly value check of the wardrobe. Today is {date}. Write in the language with ISO code {lang}.
    output: markdown
    limits:
      maxTurns: 40
      maxBudgetUsd: 1.0
  inputForm:
    title:
      it: Aggiungi un capo
      en: Add a garment
    fields:
    - name: brand
      type: text
      required: true
      label:
        it: Marca
        en: Brand
    - name: category
      type: select
      required: true
      label:
        it: Categoria
        en: Category
      options:
      - value: coat
        label:
          it: Cappotto / giacca
          en: Coat / jacket
      - value: dress
        label:
          it: Abito
          en: Dress
      - value: top
        label:
          it: Maglia / camicia
          en: Top / shirt
      - value: trousers
        label:
          it: Pantaloni / jeans
          en: Trousers / jeans
      - value: shoes
        label:
          it: Scarpe
          en: Shoes
      - value: bag
        label:
          it: Borsa
          en: Bag
      - value: accessory
        label:
          it: Accessorio
          en: Accessory
    - name: size
      type: text
      required: true
      label:
        it: Taglia
        en: Size
    - name: material
      type: text
      label:
        it: Materiale
        en: Material
    - name: condition
      type: select
      required: true
      label:
        it: Stato d'uso
        en: Condition
      options:
      - value: new_tag
        label:
          it: Nuovo con cartellino
          en: New with tags
      - value: like_new
        label:
          it: Come nuovo
          en: Like new
      - value: good
        label:
          it: Buono
          en: Good
      - value: worn
        label:
          it: Usurato
          en: Worn
    - name: price_paid
      type: number
      required: true
      label:
        it: Prezzo pagato (EUR)
        en: Price paid (EUR)
    - name: photo_url
      type: url
      label:
        it: Link alla foto
        en: Photo link
      help:
        it: 'Il caricamento di file non è ancora disponibile: incolla un link.'
        en: 'File upload is not available yet: paste a link.'
    - name: notes
      type: textarea
      maxLength: 400
      label:
        it: Note (facoltative)
        en: Notes (optional)
  data:
    collections:
    - name: garments
      ownedBy: user
      description: 'The user''s wardrobe: one record per garment with its resale estimate'
      fields:
      - name: brand
        type: text
        label: Brand
      - name: category
        type: text
        label: Category
      - name: size
        type: text
        label: Size
      - name: material
        type: text
        label: Material
      - name: condition
        type: text
        label: Condition
      - name: price_paid
        type: number
        label: Price paid
      - name: photo_url
        type: url
        label: Photo
      - name: estimated_value
        type: number
        label: Estimated value
      - name: value_low
        type: number
        label: Low
      - name: value_high
        type: number
        label: High
      - name: confidence
        type: text
        label: Confidence
      - name: verdict
        type: text
        label: Verdict
      - name: listing_title
        type: text
        label: Listing title
      - name: listing_description
        type: textarea
        label: Listing description
      - name: estimated_on
        type: date
        label: Estimated on
    - name: value_alerts
      ownedBy: instance
      description: Monthly value checks of each wardrobe watch
  templates:
  - key: value_watch
    title:
      it: Controllo mensile del valore
      en: Monthly value check
    description:
      it: Ogni mese ricontrolla il tuo armadio e ti segnala i capi il cui valore sta scendendo.
      en: Every month it re-checks your wardrobe and flags the garments losing value.
    agent: monitor
    params:
    - name: focus
      type: select
      required: true
      label:
        it: Concentrati su
        en: Focus on
      options:
      - value: all
        label:
          it: Tutto l'armadio
          en: Whole wardrobe
      - value: top_value
        label:
          it: I capi di maggior valore
          en: Highest-value items
    goal: 'Monthly value check of the user''s wardrobe (focus: {focus}). Today is {date}. Write in the language with ISO code
      {lang}.'
    schedule:
      cron: 0 7 1 * *
      userCanChange: false
    maxPerUser: 1
    cost:
      perRun: 20
  views:
  - key: home
    type: page
    nav: false
    title: ArmadioRivendibile
    sections:
    - type: hero
      layout: split
      band: true
      title:
        it: Quanto vale **il tuo armadio**?
        en: What is **your wardrobe** worth?
      text:
        it: 'Aggiungi i tuoi capi: un agente AI stima il prezzo di rivendita confrontando annunci reali di usato, scrive l''annuncio
          per te e ti dice cosa vendere subito e cosa tenere.'
        en: 'Add your garments: an AI agent estimates the resale price by comparing real second-hand listings, writes the
          listing for you and tells you what to sell now and what to keep.'
      actions:
      - label:
          it: Crea il tuo armadio
          en: Build your wardrobe
        href: /login
        style: primary
      aside: '<div style="padding:16px"><strong>Giacca in lana — Max Mara</strong><br>Valore stimato: 180 EUR (150–210)<br>Verdetto:
        vendi ora</div>'
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Aggiungi un capo
          en: Add a garment
        text:
          it: Marca, taglia, materiale, stato e prezzo pagato.
          en: Brand, size, material, condition and price paid.
        badge: 👗
      - title:
          it: Stima di rivendita
          en: Resale estimate
        text:
          it: L'agente confronta annunci pubblici di usato della stessa marca e categoria.
          en: The agent compares public second-hand listings of the same brand and category.
        badge: 🔎
      - title:
          it: Vendi o tieni
          en: Sell or keep
        text:
          it: Titolo e descrizione pronti, e l'elenco dei capi da vendere subito.
          en: Ready-made title and description, and the list of items to sell now.
        badge: ✅
    - type: cards
      id: piani
      title:
        it: Piani
        en: Plans
      items:
      - title:
          it: Gratis
          en: Free
        text:
          it: Crediti di benvenuto per stimare fino a 30 capi.
          en: Welcome credits to appraise up to 30 garments.
      - title:
          it: Abbonamento mensile
          en: Monthly plan
        text:
          it: Per armadi più grandi, con crediti ogni mese e controllo mensile del valore.
          en: For bigger wardrobes, with credits every month and the monthly value check.
    - type: note
      content:
        it: Le stime sono indicative e non garantiscono il prezzo di vendita. Il tuo armadio è visibile solo a te.
        en: Estimates are indicative and do not guarantee a sale price. Your wardrobe is visible only to you.
  - key: add
    type: new_run
    title:
      it: Aggiungi un capo
      en: Add a garment
    roles:
    - user
    - admin
  - key: wardrobe
    type: page
    title:
      it: Il mio armadio
      en: My wardrobe
    roles:
    - user
    - admin
    sections:
    - type: data
      title:
        it: Valore totale
        en: Total value
      source: collection:garments
      display: kpi
      kpis:
      - label:
          it: Valore totale stimato
          en: Total estimated value
        agg: sum
        field: estimated_value
        format: money
      - label:
          it: Capi
          en: Garments
        agg: count
      - label:
          it: Pagato in totale
          en: Total paid
        agg: sum
        field: price_paid
        format: money
    - type: data
      title:
        it: Da vendere subito
        en: Sell now
      source: collection:garments
      display: table
      fields:
      - key: brand
        label:
          it: Marca
          en: Brand
      - key: category
        label:
          it: Categoria
          en: Category
      - key: estimated_value
        label:
          it: Valore
          en: Value
        format: money
      - key: listing_title
        label:
          it: Titolo annuncio
          en: Listing title
      filters:
      - field: verdict
        op: '='
        value: sell_now
      sort:
        field: estimated_value
        dir: desc
      limit: 100
      empty:
        it: Nessun capo da vendere subito.
        en: Nothing to sell right now.
    - type: data
      title:
        it: Da tenere
        en: Keep
      source: collection:garments
      display: table
      fields:
      - key: brand
        label:
          it: Marca
          en: Brand
      - key: category
        label:
          it: Categoria
          en: Category
      - key: estimated_value
        label:
          it: Valore
          en: Value
        format: money
      - key: confidence
        label:
          it: Affidabilità
          en: Confidence
        format: badge
      filters:
      - field: verdict
        op: '='
        value: keep
      sort:
        field: estimated_value
        dir: desc
      limit: 100
      empty:
        it: Nessun capo da tenere.
        en: Nothing to keep yet.
    - type: data
      title:
        it: Tutti i capi
        en: All garments
      source: collection:garments
      display: cards
      fields:
      - key: brand
        label:
          it: Marca
          en: Brand
      - key: size
        label:
          it: Taglia
          en: Size
      - key: condition
        label:
          it: Stato
          en: Condition
      - key: estimated_value
        label:
          it: Valore
          en: Value
        format: money
      - key: verdict
        label:
          it: Verdetto
          en: Verdict
        format: badge
      - key: listing_description
        label:
          it: Descrizione annuncio
          en: Listing description
      sort:
        field: estimated_on
        dir: desc
      limit: 200
  - key: history
    type: history
    title:
      it: Le mie stime
      en: My appraisals
    source: run
    roles:
    - user
    - admin
  - key: appraisal
    type: report
    source: run
    printable: true
    nav: false
  - key: watches
    type: instances
    template: value_watch
    title:
      it: Controllo mensile
      en: Monthly check
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Crediti e piano
      en: Credits and plan
    roles:
    - user
  billing:
    modes:
    - credits
    - subscription
    currency: eur
    signupCredits: 300
    costs:
      agent:appraiser: 10
    packs:
    - key: extra
      credits: 300
      price: 9
      label:
        it: 30 capi in più
        en: 30 more garments
    plans:
    - key: closet_plus
      price: 4.99
      interval: month
      label:
        it: Armadio grande
        en: Big wardrobe
      credits: 1000
      creditsReset: monthly
      includes:
      - 100 garment appraisals per month
      - monthly value check
  extensions:
  - key: photo_upload
    description: 'Photo upload is not available yet: the user pastes a link to the photo.'
  - key: monthly_email
    description: The monthly email with garments losing value is not available yet (no notifications). The monthly check runs
      and the result is shown in the Monthly check view.
  - key: free_cap_30
    description: The free plan of 30 garments is expressed as 300 signup credits at 10 credits per appraisal; there is no
      hard cap on stored garments.
