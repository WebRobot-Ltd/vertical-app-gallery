apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: armadio-rivendibile
  displayName: ArmadioRivendibile
  tagline:
    it: 'Il tuo guardaroba digitale: sai quanto vale e cosa conviene vendere.'
    en: 'Your digital wardrobe: know what it''s worth and what to sell.'
  description:
    it: Aggiungi i tuoi capi, un agente stima il prezzo di rivendita confrontando annunci di usato e scrive titolo e descrizione
      dell'annuncio.
    en: Add your clothes; an agent estimates the resale price from public second-hand listings and drafts the ad title and
      description.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#3b2f4a'
      accent: '#c4567a'
      background: '#faf7f5'
      foreground: '#201a26'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Armadio
      color: primary
    - text: Rivendibile
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    cta:
      label:
        it: Inizia
        en: Start
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  limits:
  - action: create:wardrobe
    max: 30
    window: total
    plans:
      pro: -1
  - action: agent:appraiser
    per: user
    max: 40
    window: day
    roles:
    - user
  agents:
  - key: appraiser
    role: main
    description: Estimates the resale price of one garment from public second-hand listings and drafts the ad.
    profile:
      inline:
        display_name: Resale appraiser
        crews:
        - id: appraiser
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You estimate a realistic resale price for ONE garment. Search public second-hand listings (e.g.
            Vinted, Vestiaire Collective, eBay, Depop, Subito) for the same brand and category, similar condition and size,
            through the WebRobot MCP (scrape pages). Use only prices you actually saw; never invent figures. Compute a realistic
            price (about the median of sold or asking prices, adjusted for condition) and a range. Decide the verdict: ''sell''
            if the price is good compared with what was paid or the item is likely to lose value, otherwise ''keep''. Then
            call the tool update_item once with the record id and fields: estimated_price (number), prev_estimate (the old
            estimated_price if any), estimated_at (today, YYYY-MM-DD), verdict (sell|keep), listing_title (max 70 chars),
            listing_description (honest, with brand, size, material, condition). Report format: start with a level-1 title
            ''# <Brand> <category> — resale estimate'', then sections ## Estimated price (with range), ## Comparable listings
            (table: source, price, condition, link), ## Verdict, ## Suggested ad (title and description). Write in the user''s
            language. This is an estimate, not a guarantee.'
    appTools:
    - name: update_item
      description: Update the garment record with the estimate, verdict and ad text
      action: write
      collection: wardrobe
      scope: user
    context:
    - key: brand
      from: collection:wardrobe.brand
    - key: category
      from: collection:wardrobe.category
    - key: size
      from: collection:wardrobe.size
    - key: material
      from: collection:wardrobe.material
    - key: condition
      from: collection:wardrobe.condition
    - key: paid_price
      from: collection:wardrobe.paid_price
    - key: estimated_price
      from: collection:wardrobe.estimated_price
    goalTemplate: 'Garment record id: {item}

      Brand: {brand}

      Category: {category}

      Size: {size}

      Material: {material}

      Condition: {condition}

      Price paid: {paid_price} EUR

      {?estimated_price}Previous estimate: {estimated_price} EUR{/estimated_price}

      Today is {date}. Write the report in the language with ISO code {lang}.'
    output: markdown
    limits:
      maxTurns: 25
      maxBudgetUsd: 0.8
  - key: monitor
    role: helper
    description: 'Monthly check of the user''s wardrobe: which garments are losing value.'
    profile:
      inline:
        display_name: Wardrobe value monitor
        crews:
        - id: monitor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You check a user''s wardrobe once a month. Read the garments with read_wardrobe. For up to 15 garments
            that have an estimated_price, re-check current prices of public second-hand listings of the same brand and category
            through the WebRobot MCP and compute the new estimate. Never invent figures. Update each checked record with update_wardrobe
            (estimated_price, prev_estimate = old estimate, estimated_at, verdict). Report: start with ''# Your wardrobe —
            monthly value check'', then ## Total value (now vs. last month), ## Losing value (table: garment, old, new, change
            %, advice — only drops at or above the threshold given), ## Sell now, ## Keep. If no garment is losing value,
            say so briefly. Plain, friendly tone, in the user''s language.'
    appTools:
    - name: read_wardrobe
      description: Read the user's garments
      action: read
      collection: wardrobe
      scope: user
    - name: update_wardrobe
      description: Update a garment's estimate and verdict
      action: write
      collection: wardrobe
      scope: user
    output: markdown
    limits:
      maxTurns: 30
      maxBudgetUsd: 1.0
  templates:
  - key: monthly_check
    title:
      it: Controllo mensile
      en: Monthly check
    description:
      it: Ogni mese ricevi un'email con i capi il cui valore sta scendendo.
      en: Every month you get an email with the garments losing value.
    agent: monitor
    params:
    - name: min_drop_pct
      type: number
      required: true
      default: 5
      label:
        it: Soglia di calo (%)
        en: Drop threshold (%)
    goal: Monthly check of my wardrobe. Report only drops of at least {min_drop_pct}%. Today is {date}. Write in the language
      with ISO code {lang}.
    schedule:
      cron: 0 7 1 * *
      userCanChange: false
    maxPerUser: 1
    cost:
      perRun: 15
    deliver:
      to: owner
      onlyIfNew: true
      subject:
        it: I capi che perdono valore questo mese
        en: Garments losing value this month
  inputForm:
    title:
      it: Stima un capo
      en: Appraise a garment
    fields:
    - name: item
      type: select
      required: true
      optionsFrom: collection:wardrobe
      label:
        it: Capo
        en: Garment
  data:
    collections:
    - name: wardrobe
      ownedBy: user
      description: The user's own garments
      fields:
      - name: photo
        type: file
        accept:
        - jpg
        - png
        - webp
        maxMb: 8
        multiple: true
        label:
          it: Foto
          en: Photos
      - name: name
        type: text
        required: true
        label:
          it: Nome del capo
          en: Garment name
      - name: brand
        type: text
        required: true
        label:
          it: Marca
          en: Brand
      - name: category
        type: select
        required: true
        label:
          it: Categoria
          en: Category
        options:
        - value: jacket
          label:
            it: Giacca / cappotto
            en: Jacket / coat
        - value: dress
          label:
            it: Abito
            en: Dress
        - value: top
          label:
            it: Maglia / camicia
            en: Top / shirt
        - value: trousers
          label:
            it: Pantaloni / jeans
            en: Trousers / jeans
        - value: skirt
          label:
            it: Gonna
            en: Skirt
        - value: shoes
          label:
            it: Scarpe
            en: Shoes
        - value: bag
          label:
            it: Borsa
            en: Bag
        - value: other
          label:
            it: Altro
            en: Other
      - name: size
        type: text
        required: true
        label:
          it: Taglia
          en: Size
      - name: material
        type: text
        label:
          it: Materiale
          en: Material
      - name: condition
        type: select
        required: true
        label:
          it: Stato d'uso
          en: Condition
        options:
        - value: new_with_tags
          label:
            it: Nuovo con cartellino
            en: New with tags
        - value: excellent
          label:
            it: Ottimo
            en: Excellent
        - value: good
          label:
            it: Buono
            en: Good
        - value: fair
          label:
            it: Usurato
            en: Fair
      - name: paid_price
        type: number
        required: true
        label:
          it: Prezzo pagato (€)
          en: Price paid (€)
      - name: estimated_price
        type: number
        label:
          it: Prezzo stimato (€)
          en: Estimated price (€)
      - name: prev_estimate
        type: number
        label:
          it: Stima precedente (€)
          en: Previous estimate (€)
      - name: estimated_at
        type: date
        label:
          it: Data stima
          en: Estimate date
      - name: verdict
        type: select
        label:
          it: Consiglio
          en: Advice
        options:
        - value: sell
          label:
            it: Vendi ora
            en: Sell now
        - value: keep
          label:
            it: Tieni
            en: Keep
      - name: listing_title
        type: text
        label:
          it: Titolo annuncio
          en: Ad title
      - name: listing_description
        type: textarea
        label:
          it: Descrizione annuncio
          en: Ad description
  views:
  - key: home
    type: page
    nav: false
    title: ArmadioRivendibile
    sections:
    - type: hero
      title:
        it: Sai quanto vale il tuo **armadio**?
        en: Do you know what your **wardrobe** is worth?
      text:
        it: 'Aggiungi i tuoi capi: un agente AI stima il prezzo di rivendita dagli annunci di usato e ti scrive l''annuncio.
          Ogni mese ti avvisa dei capi che perdono valore.'
        en: 'Add your clothes: an AI agent estimates the resale price from second-hand listings and writes the ad. Every month
          it warns you about garments losing value.'
      actions:
      - label:
          it: Crea il tuo armadio
          en: Create your wardrobe
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Aggiungi i capi
          en: Add garments
        text:
          it: Foto, marca, taglia, materiale, stato e prezzo pagato.
          en: Photos, brand, size, material, condition and price paid.
        badge: 👗
      - title:
          it: Stima e annuncio
          en: Estimate and ad
        text:
          it: L'agente confronta annunci di usato della stessa marca e categoria.
          en: The agent compares second-hand listings of the same brand and category.
        badge: 🔎
      - title:
          it: Vendi o tieni
          en: Sell or keep
        text:
          it: Vedi il valore totale e cosa conviene vendere subito.
          en: See the total value and what to sell now.
        badge: 💶
    - type: cards
      title:
        it: Piani
        en: Plans
      items:
      - title:
          it: Gratis
          en: Free
        text:
          it: Fino a 30 capi.
          en: Up to 30 garments.
      - title: Pro
        text:
          it: Armadio illimitato, abbonamento mensile.
          en: Unlimited wardrobe, monthly subscription.
    - type: note
      content:
        it: Le stime si basano su annunci pubblici e non sono una garanzia di vendita.
        en: Estimates are based on public listings and are not a guarantee of sale.
  - key: overview
    type: page
    title:
      it: Il mio armadio
      en: My wardrobe
    roles:
    - user
    - admin
    sections:
    - type: data
      title:
        it: Valore dell'armadio
        en: Wardrobe value
      source: collection:wardrobe
      display: kpi
      kpis:
      - label:
          it: Capi
          en: Garments
        agg: count
      - label:
          it: Valore stimato
          en: Estimated value
        agg: sum
        field: estimated_price
        format: money
      - label:
          it: Pagato
          en: Paid
        agg: sum
        field: paid_price
        format: money
    - type: data
      title:
        it: Da vendere subito
        en: Sell now
      source: collection:wardrobe
      display: cards
      fields:
      - key: name
      - key: brand
      - key: estimated_price
        format: money
      - key: listing_title
      filters:
      - field: verdict
        op: '='
        value: sell
      sort:
        field: estimated_price
        dir: desc
      limit: 50
      empty:
        it: 'Nessun capo da vendere: stima i tuoi capi.'
        en: 'Nothing to sell yet: appraise your garments.'
    - type: data
      title:
        it: Da tenere
        en: Keep
      source: collection:wardrobe
      display: table
      fields:
      - key: name
      - key: brand
      - key: estimated_price
        format: money
      - key: estimated_at
        format: date
      filters:
      - field: verdict
        op: '='
        value: keep
      limit: 50
  - key: add_item
    type: form
    title:
      it: Aggiungi un capo
      en: Add a garment
    collection: wardrobe
    fields:
    - photo
    - name
    - brand
    - category
    - size
    - material
    - condition
    - paid_price
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Capo aggiunto.
        en: Garment added.
      redirect: wardrobe_list
    edit: false
    roles:
    - user
    - admin
  - key: wardrobe_list
    type: table
    title:
      it: Tutti i capi
      en: All garments
    source: collection:wardrobe
    columns:
    - name
    - brand
    - category
    - size
    - condition
    - paid_price
    - estimated_price
    - verdict
    export: true
    roles:
    - user
    - admin
  - key: appraise
    type: new_run
    title:
      it: Stima un capo
      en: Appraise a garment
    roles:
    - user
    - admin
  - key: appraisals
    type: history
    title:
      it: Le mie stime
      en: My appraisals
    source: run
    roles:
    - user
    - admin
  - key: appraisal
    type: report
    source: run
    printable: true
    nav: false
  - key: watches
    type: instances
    template: monthly_check
    title:
      it: Controllo mensile
      en: Monthly check
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Piano e crediti
      en: Plan and credits
    roles:
    - user
  billing:
    modes:
    - credits
    - subscription
    signupCredits: 100
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:appraiser:
        estimate: 10
        metered: true
    packs:
    - key: small
      credits: 300
      price: 5
      label: '300'
    plans:
    - key: pro
      price: 4.99
      interval: month
      label:
        it: Pro — armadio illimitato
        en: Pro — unlimited wardrobe
      credits: 300
      creditsReset: monthly
