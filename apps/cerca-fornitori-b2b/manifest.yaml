apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: fornitoreradar
  displayName: FornitoreRadar
  tagline:
    it: Trova, qualifica e contatta nuovi fornitori in un'unica ricerca.
    en: Find, qualify and contact new suppliers in a single search.
  description:
    it: 'Per gli uffici acquisti: un team di agenti cerca fornitori sui siti ufficiali, li qualifica con un punteggio motivato
      e prepara le email di primo contatto. Tu controlli la shortlist e approvi.'
    en: 'For purchasing departments: a team of agents searches official supplier websites, qualifies them with a reasoned
      score and drafts first-contact emails. You review the shortlist and approve.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12304a'
      accent: '#e07a1f'
      background: '#f6f8fa'
      foreground: '#17212b'
    fonts:
      body: Inter
      display: Space Grotesk
    wordmark:
    - text: Fornitore
      color: primary
    - text: Radar
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#how'
    - label:
        it: Regole sui dati
        en: Data rules
      href: '#rules'
    cta:
      label:
        it: Inizia
        en: Start
      href: /v/new_search
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  limits:
  - action: agent:radar
    per: user
    max: 20
    window: day
    roles:
    - user
  agents:
  - key: radar
    role: main
    description: 'Team in sequenza: cerca fornitori, li qualifica, scrive le bozze di email e chiede l''approvazione.'
    awaits:
    - send_approval
    profile:
      inline:
        display_name: FornitoreRadar team
        crews:
        - id: finder
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'Sei lo scout fornitori di un ufficio acquisti manifatturiero. 1) Cerca prima nell''archivio con
            suppliers_search: riusa i fornitori già noti pertinenti. 2) Cerca sul web nuovi potenziali fornitori e visita
            SOLO i siti aziendali ufficiali dei fornitori (pagine prodotti, chi siamo, certificazioni, contatti). NON estrarre
            dati da directory a pagamento, marketplace o portali le cui condizioni vietano l''estrazione; rispetta robots.txt
            e usa pochi accessi gentili. 3) Per ogni candidato (circa 10-15) salva la scheda con suppliers_save: nome, sito,
            paese, città, categorie, certificazioni dichiarate, email di contatto commerciale pubblica, URL fonte. Non inventare
            mai dati: lascia vuoto ciò che non trovi. Passa al qualificatore l''elenco dei candidati.'
        - id: qualifier
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'Sei il qualificatore. Per ogni candidato leggi dal sito ufficiale capacità produttive, macchinari,
            certificazioni (ISO 9001, IATF 16949 ecc.) e referenze clienti. Confrontali con la richiesta (specifiche, certificazioni
            richieste, area, volumi, scadenza). Assegna un punteggio 0-100 con motivazione breve e verificabile (cita la pagina),
            segnalando cosa è dichiarato e cosa non è verificato. Aggiorna la scheda con suppliers_save (capacità, referenze,
            score, score_rationale). Non inventare: se un dato manca, abbassa la confidenza e dillo. Passa al redattore i
            fornitori con punteggio >= 50.'
        - id: writer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei il redattore. Per ogni fornitore qualificato scrivi una bozza di email di primo contatto personalizzata
            (oggetto + testo breve, professionale, nella lingua del fornitore se evidente, altrimenti nella lingua indicata):
            cita un elemento specifico della sua offerta, la richiesta (categoria, specifiche, certificazioni, volumi annui,
            scadenza) e chiedi disponibilità e offerta indicativa. Non promettere ordini né inventare dettagli. Salva ogni
            bozza con outreach_save (status draft, excluded false, contact_email, subject, email_body, score, rationale).
            Poi chiedi l''approvazione con request_send_approval e termina con un report che inizia con "# Shortlist fornitori
            — <categoria>" e contiene una tabella (fornitore, paese, punteggio, motivazione, certificazioni) e un avviso:
            il buyer può escludere aziende e modificare i testi nella vista Bozze prima di approvare.'
        orchestration:
          type: dag
          entry: finder
          nodes:
          - id: finder
            crew: finder
          - id: qualifier
            crew: qualifier
          - id: writer
            crew: writer
          edges:
          - from: finder
            to: qualifier
          - from: qualifier
            to: writer
    appTools:
    - name: suppliers_search
      description: Search the company's supplier archive
      action: search
      collection: suppliers
      scope: user
    - name: suppliers_save
      description: Create or update a supplier record in the archive
      action: write
      collection: suppliers
      scope: user
    - name: outreach_save
      description: Save a draft first-contact email
      action: write
      collection: outreach
      scope: user
    goalTemplate: 'Richiesta di acquisto:

      Categoria merceologica: {category}

      Specifiche tecniche: {specs}

      {?certs_label}Certificazioni richieste: {certs}{/certs_label}

      Area geografica: {region}

      {?volume}Volumi annui: {volume}{/volume}

      {?deadline}Scadenza: {deadline}{/deadline}

      Oggi è {date}. Scrivi in lingua ISO {lang}.'
    output: markdown
    limits:
      maxTurns: 90
      maxBudgetUsd: 4
  - key: dispatcher
    role: helper
    description: Dopo l'approvazione marca come approvate le bozze non escluse.
    profile:
      inline:
        display_name: FornitoreRadar dispatcher
        crews:
        - id: dispatcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: Leggi con outreach_read le bozze dell'utente con status draft. Per ognuna con excluded diverso da
            true e contact_email valorizzata, aggiorna con outreach_update lo status a approved. Lascia le escluse invariate.
            Chiudi con un riepilogo di una riga che inizia con "# Invio avviato".
    appTools:
    - name: outreach_read
      description: Read the user's outreach drafts
      action: read
      collection: outreach
      scope: user
    - name: outreach_update
      description: Update the status of an outreach record
      action: write
      collection: outreach
      scope: user
    goalTemplate: Il buyer ha approvato. Procedi con le bozze in stato draft. Oggi è {date}.
    output: markdown
    limits:
      maxTurns: 30
      maxBudgetUsd: 0.5
  approvals:
  - key: send_approval
    title:
      it: Approva l'invio delle email ai fornitori
      en: Approve sending the emails to suppliers
    decidedBy: requester
    timeoutMinutes: 10080
    onTimeout: reject
  triggers:
  - key: on_send_approved
    'on':
      approval: send_approval
      decision: approved
    start:
      agent: dispatcher
    goal: 'Il buyer ha approvato la shortlist: marca come approved le bozze non escluse.'
  - key: send_email
    description: Invia l'email di primo contatto quando la bozza è approvata
    'on':
      collection: outreach
      op: update
      where:
        status: approved
    notify:
      to:
      - record.contact_email
      subject: '{record.subject}'
      body: '{record.email_body}'
  inputForm:
    title:
      it: Nuova ricerca fornitori
      en: New supplier search
    fields:
    - name: category
      type: text
      required: true
      maxLength: 200
      label:
        it: Categoria merceologica
        en: Product category
    - name: specs
      type: textarea
      required: true
      maxLength: 1500
      label:
        it: Specifiche tecniche
        en: Technical specifications
    - name: certs
      type: multiselect
      label:
        it: Certificazioni richieste
        en: Required certifications
      options:
      - value: ISO 9001
        label: ISO 9001
      - value: IATF 16949
        label: IATF 16949
      - value: ISO 14001
        label: ISO 14001
      - value: ISO 45001
        label: ISO 45001
      - value: AS9100
        label: AS9100
    - name: region
      type: text
      required: true
      label:
        it: Area geografica
        en: Geographic area
      help:
        it: es. Nord Italia, Europa centrale
        en: e.g. Northern Italy, Central Europe
    - name: volume
      type: number
      label:
        it: Volumi annui
        en: Annual volumes
    - name: deadline
      type: date
      label:
        it: Scadenza
        en: Deadline
  data:
    collections:
    - name: suppliers
      description: Archivio fornitori dell'azienda, riusato nelle ricerche
      ownedBy: user
      searchable: true
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Fornitore
          en: Supplier
      - name: website
        type: url
        label:
          it: Sito
          en: Website
      - name: country
        type: text
        label:
          it: Paese
          en: Country
      - name: city
        type: text
        label:
          it: Città
          en: City
      - name: categories
        type: text
        label:
          it: Categorie
          en: Categories
      - name: certifications
        type: text
        label:
          it: Certificazioni
          en: Certifications
      - name: capacity
        type: textarea
        label:
          it: Capacità produttive
          en: Capacity
      - name: references
        type: textarea
        label:
          it: Referenze
          en: References
      - name: contact_email
        type: email
        label: Email
      - name: score
        type: number
        label:
          it: Punteggio
          en: Score
      - name: score_rationale
        type: textarea
        label:
          it: Motivazione
          en: Rationale
      - name: source_url
        type: url
        label:
          it: Fonte
          en: Source
    - name: outreach
      description: Bozze di email di primo contatto da approvare
      ownedBy: user
      fields:
      - name: supplier_name
        type: text
        label:
          it: Fornitore
          en: Supplier
      - name: contact_email
        type: email
        label: Email
      - name: subject
        type: text
        required: true
        label:
          it: Oggetto
          en: Subject
      - name: email_body
        type: textarea
        required: true
        label:
          it: Testo
          en: Body
      - name: score
        type: number
        label:
          it: Punteggio
          en: Score
      - name: rationale
        type: textarea
        label:
          it: Motivazione
          en: Rationale
      - name: excluded
        type: boolean
        label:
          it: Escludi
          en: Exclude
      - name: status
        type: select
        label:
          it: Stato
          en: Status
        options:
        - draft
        - approved
    - name: supplier_events
      description: Storico contatti e risposte per fornitore
      ownedBy: user
      retentionDays: 730
      fields:
      - name: supplier_name
        type: text
        label:
          it: Fornitore
          en: Supplier
      - name: date
        type: date
        label: Data
      - name: kind
        type: select
        label:
          it: Tipo
          en: Type
        options:
        - sent
        - reply
      - name: summary
        type: textarea
        label:
          it: Sintesi
          en: Summary
  views:
  - key: home
    type: page
    nav: false
    title: FornitoreRadar
    sections:
    - type: hero
      layout: stack
      band: true
      eyebrow:
        it: Per uffici acquisti
        en: For purchasing teams
      title:
        it: Trova fornitori **qualificati** senza ore di ricerca.
        en: Find **qualified** suppliers without hours of research.
      text:
        it: 'Descrivi cosa ti serve: gli agenti cercano sui siti ufficiali, valutano ogni azienda con un punteggio motivato
          e preparano le email. Tu approvi.'
        en: 'Describe what you need: agents search official websites, score every company with a reasoned rating and draft
          the emails. You approve.'
      actions:
      - label:
          it: Nuova ricerca
          en: New search
        href: /v/new_search
        style: primary
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: ghost
    - type: steps
      id: how
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Cerca
          en: Search
        text:
          it: Riusa l'archivio e cerca nuovi fornitori sui loro siti ufficiali.
          en: Reuses your archive and searches new suppliers on their official sites.
      - title:
          it: Qualifica
          en: Qualify
        text:
          it: Legge capacità, certificazioni e referenze e assegna un punteggio motivato.
          en: Reads capacity, certifications and references and gives a reasoned score.
      - title:
          it: Contatta
          en: Contact
        text:
          it: 'Bozze personalizzate: escludi, modifica, approva.'
          en: 'Personalised drafts: exclude, edit, approve.'
    - type: cards
      id: rules
      title:
        it: Regole sui dati
        en: Data rules
      items:
      - title:
          it: Solo siti ufficiali
          en: Official sites only
        text:
          it: Niente directory a pagamento o con condizioni che vietano l'estrazione.
          en: No paid directories or sites whose terms forbid extraction.
      - title:
          it: Dati tuoi
          en: Your data
        text:
          it: Ogni azienda vede solo il proprio archivio.
          en: Each company sees only its own archive.
    - type: note
      content:
        it: 'I punteggi sono un supporto alla decisione basato su informazioni dichiarate dai fornitori: verifica sempre le
          certificazioni.'
        en: 'Scores support decisions and rely on supplier-declared information: always verify certifications.'
  - key: new_search
    type: new_run
    title:
      it: Nuova ricerca
      en: New search
    roles:
    - user
    - admin
  - key: searches
    type: history
    title:
      it: Le mie ricerche
      en: My searches
    source: run
    roles:
    - user
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: drafts
    type: table
    title:
      it: Bozze da approvare
      en: Drafts to approve
    source: collection:outreach
    columns:
    - supplier_name
    - score
    - rationale
    - subject
    - excluded
    - status
    roles:
    - user
    - admin
  - key: edit_draft
    type: form
    title:
      it: Modifica bozza
      en: Edit draft
    collection: outreach
    fields:
    - subject
    - email_body
    - excluded
    edit: true
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Bozza aggiornata
        en: Draft updated
      redirect: drafts
    nav: false
    roles:
    - user
    - admin
  - key: approve
    type: approvals
    title:
      it: Approvazioni
      en: Approvals
    approvals:
    - send_approval
    roles:
    - user
    - admin
  - key: archive
    type: table
    title:
      it: Archivio fornitori
      en: Supplier archive
    source: collection:suppliers
    columns:
    - name
    - country
    - city
    - categories
    - certifications
    - score
    - website
    export: true
    roles:
    - user
    - admin
  - key: history_events
    type: table
    title:
      it: Storico contatti
      en: Contact history
    source: collection:supplier_events
    columns:
    - supplier_name
    - date
    - kind
    - summary
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento e crediti
      en: Plan and credits
    roles:
    - user
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 30
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
      - browser
    costs:
      agent:radar:
        estimate: 150
        metered: true
    packs:
    - key: extra
      credits: 1000
      price: 12
      label:
        it: Crediti extra
        en: Extra credits
    plans:
    - key: team
      price: 99
      interval: month
      credits: 1500
      creditsReset: monthly
      label:
        it: Team — circa 10 ricerche incluse
        en: Team — about 10 searches included
    - key: business
      price: 249
      interval: month
      credits: 4500
      creditsReset: monthly
      label:
        it: Business — circa 30 ricerche incluse
        en: Business — about 30 searches included
  notifications:
    emailOnRunDone: true
  extensions:
  - key: company_mailbox
    description: 'Invio dalla casella aziendale del buyer e lettura automatica delle risposte (riassunto e collegamento al
      fornitore in supplier_events) richiedono OAuth/IMAP con Google o Microsoft 365: non disponibile. Ora le email partono
      dal sistema della piattaforma e lo storico delle risposte va inserito a mano.'
