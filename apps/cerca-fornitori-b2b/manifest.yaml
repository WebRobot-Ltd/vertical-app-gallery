apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: fornitore-radar
  displayName: FornitoreRadar
  tagline:
    it: Trova, qualifica e contatta nuovi fornitori industriali, con la tua approvazione.
    en: Find, qualify and contact new industrial suppliers, with your approval.
  description:
    it: 'Per gli uffici acquisti: descrivi cosa ti serve e un team di agenti cerca fornitori sui siti ufficiali, li qualifica
      con un punteggio motivato e prepara le email di primo contatto. Tu escludi, modifichi e approvi. Ogni fornitore trovato
      entra nel tuo archivio ricercabile.'
    en: 'For purchasing offices: describe what you need and a team of agents searches official supplier websites, qualifies
      them with a reasoned score and drafts first-contact emails. You exclude, edit and approve. Every supplier found goes
      into your searchable archive.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f3a4d'
      accent: '#e07a1f'
      background: '#f6f7f8'
      foreground: '#17222b'
    fonts:
      body: Inter
      display: Space Grotesk
    wordmark:
    - text: Fornitore
      color: primary
    - text: Radar
      color: accent
    width: wide
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Regole sulle fonti
        en: Source rules
      href: '#fonti'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: user
      label:
        it: Buyer
        en: Buyer
      assignedBy: signup
  limits:
  - action: agent:radar
    per: user
    max: 10
    window: day
    roles:
    - user
  agents:
  - key: radar
    role: main
    description: 'Team in sequenza: scout (ricerca sui siti ufficiali), qualifier (punteggio motivato), writer (email di primo
      contatto). Chiede l''approvazione del buyer sulla shortlist.'
    awaits:
    - shortlist_ok
    profile:
      inline:
        display_name: FornitoreRadar team
        crews:
        - id: scout
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'Sei lo scout di un ufficio acquisti. Prima consulta l''archivio del cliente con lo strumento suppliers_search:
            riusa i fornitori già noti che corrispondono alla richiesta. Poi cerca sul web nuovi potenziali fornitori per
            categoria, specifiche e area geografica. REGOLE: visita SOLO i siti aziendali ufficiali dei fornitori (pagine
            azienda, prodotti, certificazioni, contatti). NON estrarre dati da directory a pagamento, marketplace o portali
            le cui condizioni vietano l''estrazione (puoi usarli solo per scoprire un nome, mai per copiarne i dati). Per
            ogni azienda raccogli: nome, sito, paese, città, prodotti/processi, certificazioni dichiarate, email o modulo
            di contatto pubblico aziendale, URL delle pagine lette. Non inventare nulla: se un dato manca scrivi ''non rilevato''.
            Produci un elenco di 8-15 candidati in JSON.'
        - id: qualifier
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 20
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: Sei il qualificatore. Per ogni candidato leggi dal sito ufficiale capacità produttive, macchinari,
            certificazioni (ISO 9001, IATF 16949, ecc.), settori serviti e referenze pubbliche. Confrontale con la richiesta
            (specifiche, certificazioni richieste, volumi annui, scadenza, area). Assegna un punteggio 0-100 con motivazione
            in 2-3 frasi che cita le evidenze e indica cosa NON è verificato (le certificazioni vanno verificate dal buyer
            sul certificato). Non inventare dati. Salva ogni fornitore nell'archivio con suppliers_write (nome, sito, paese,
            città, categoria, certificazioni, capacità, punteggio, motivazione, fonti, data). Ordina per punteggio.
        - id: writer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei il redattore. Dalla shortlist qualificata prepara un''email di primo contatto personalizzata
            per ciascun fornitore: oggetto, saluto, 1 frase che mostra di conoscere la loro attività (dall''evidenza raccolta),
            la richiesta (categoria, specifiche, certificazioni, volumi, scadenza per l''offerta), cosa chiedi (disponibilità,
            MOQ, tempi, certificati), firma con segnaposto [Nome buyer, Azienda]. Max 150 parole, tono professionale, nella
            lingua del fornitore (italiano o inglese). Nessuna promessa di ordini. Poi chiama request_shortlist_ok con shortlist
            (nome, punteggio, motivazione) e bozze, e attendi: il buyer può escludere aziende e modificare i testi. Dopo l''approvazione
            scrivi il report finale. Formato: titolo ''# Shortlist fornitori — <categoria>'', sezioni ## Sintesi della ricerca,
            ## Shortlist (tabella: fornitore, paese, certificazioni, punteggio, motivazione), ## Email approvate (una per
            fornitore), ## Da verificare, ## Fonti. Aggiungi un blocco ```chart di tipo bar con i punteggi. Ricorda che le
            email vanno inviate dal buyer dalla propria casella.'
        orchestration:
          type: dag
          entry: scout
          nodes:
          - id: scout
            crew: scout
          - id: qualifier
            crew: qualifier
          - id: writer
            crew: writer
          edges:
          - from: scout
            to: qualifier
          - from: qualifier
            to: writer
    appTools:
    - name: suppliers_search
      description: Cerca nell'archivio fornitori del cliente
      action: search
      collection: suppliers
      scope: user
    - name: suppliers_write
      description: Salva o aggiorna un fornitore nell'archivio del cliente
      action: write
      collection: suppliers
      scope: user
    goalTemplate: 'Richiesta di approvvigionamento del {user}:

      Categoria merceologica: {category}

      Specifiche tecniche: {specs}

      {?certs}Certificazioni richieste: {certs}{/certs}

      Area geografica: {area}

      Volumi annui: {volume}

      Scadenza per le offerte: {deadline}

      {?notes}Note: {notes}{/notes}

      Oggi è {date}. Scrivi il report nella lingua con codice ISO {lang}.'
    output: markdown
    limits:
      maxTurns: 80
      maxBudgetUsd: 3.0
      timeoutSeconds: 1800
  approvals:
  - key: shortlist_ok
    title:
      it: Approva shortlist ed email
      en: Approve shortlist and emails
    description: Il buyer esclude aziende, modifica i testi e approva.
    decidedBy: requester
    fields:
    - shortlist
    - drafts
    timeoutMinutes: 4320
    onTimeout: reject
  inputForm:
    title:
      it: Nuova ricerca fornitori
      en: New supplier search
    fields:
    - name: category
      type: text
      required: true
      maxLength: 120
      label:
        it: Categoria merceologica
        en: Product category
      help:
        it: es. lavorazioni CNC di precisione in alluminio
        en: e.g. precision CNC machining in aluminium
    - name: specs
      type: textarea
      required: true
      maxLength: 1200
      label:
        it: Specifiche tecniche
        en: Technical specs
    - name: certs
      type: multiselect
      label:
        it: Certificazioni richieste
        en: Required certifications
      options:
      - value: ISO 9001
        label: ISO 9001
      - value: IATF 16949
        label: IATF 16949
      - value: ISO 14001
        label: ISO 14001
      - value: ISO 45001
        label: ISO 45001
      - value: ISO 13485
        label: ISO 13485
      - value: AS9100
        label: AS9100
    - name: area
      type: text
      required: true
      label:
        it: Area geografica
        en: Geographic area
      help:
        it: es. Nord Italia, Europa orientale
        en: e.g. Northern Italy, Eastern Europe
    - name: volume
      type: text
      required: true
      label:
        it: Volumi annui
        en: Annual volumes
      help:
        it: es. 50.000 pezzi/anno
        en: e.g. 50,000 pcs/year
    - name: deadline
      type: date
      required: true
      label:
        it: Scadenza
        en: Deadline
    - name: notes
      type: textarea
      maxLength: 600
      label:
        it: Note (facoltative)
        en: Notes (optional)
  data:
    collections:
    - name: suppliers
      ownedBy: user
      searchable: true
      description: Archivio fornitori dell'azienda, cresce a ogni ricerca
      fields:
      - name: name
        type: text
        label:
          it: Fornitore
          en: Supplier
      - name: website
        type: url
        label: Website
      - name: country
        type: text
        label:
          it: Paese
          en: Country
      - name: city
        type: text
        label:
          it: Città
          en: City
      - name: category
        type: text
        label:
          it: Categoria
          en: Category
      - name: certifications
        type: text
        label:
          it: Certificazioni
          en: Certifications
      - name: capacity
        type: textarea
        label:
          it: Capacità produttive
          en: Capacity
      - name: score
        type: number
        label:
          it: Punteggio
          en: Score
      - name: rationale
        type: textarea
        label:
          it: Motivazione
          en: Rationale
      - name: sources
        type: urls
        label:
          it: Fonti
          en: Sources
      - name: contact
        type: text
        label:
          it: Contatto pubblico
          en: Public contact
      - name: history
        type: textarea
        label:
          it: Storico contatti
          en: Contact history
      - name: found_on
        type: date
        label:
          it: Trovato il
          en: Found on
  views:
  - key: home
    type: page
    nav: false
    title: FornitoreRadar
    sections:
    - type: hero
      band: true
      eyebrow:
        it: Per gli uffici acquisti
        en: For purchasing teams
      title:
        it: Nuovi fornitori **qualificati**, senza ore di ricerca.
        en: New **qualified** suppliers, without hours of searching.
      text:
        it: 'Descrivi cosa ti serve: un team di agenti cerca sui siti ufficiali, assegna un punteggio motivato e prepara le
          email di primo contatto. Tu decidi cosa parte.'
        en: 'Describe what you need: a team of agents searches official sites, gives a reasoned score and drafts first-contact
          emails. You decide what goes out.'
      actions:
      - label:
          it: Nuova ricerca
          en: New search
        href: /v/new_search
        style: primary
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Scout
          en: Scout
        text:
          it: Riusa il tuo archivio e cerca nuovi fornitori visitando solo i loro siti ufficiali.
          en: Reuses your archive and finds new suppliers, visiting only their official sites.
        badge: 🔎
      - title:
          it: Qualifica
          en: Qualify
        text:
          it: Legge capacità, certificazioni e referenze e dà un punteggio con motivazione.
          en: Reads capacity, certifications and references and gives a reasoned score.
        badge: 📊
      - title:
          it: Contatto
          en: Outreach
        text:
          it: Bozza di email personalizzata per ogni fornitore.
          en: A personalised email draft for each supplier.
        badge: ✉️
      - title:
          it: Approvi tu
          en: You approve
        text:
          it: Vedi la shortlist in tabella, escludi aziende, modifichi i testi, approvi.
          en: See the shortlist in a table, exclude companies, edit the texts, approve.
        badge: ✅
    - type: cards
      id: fonti
      title:
        it: Regole sulle fonti
        en: Source rules
      items:
      - title:
          it: Solo siti ufficiali
          en: Official sites only
        text:
          it: Nessuna estrazione da directory a pagamento o con condizioni che la vietano.
          en: No extraction from paid directories or sites whose terms forbid it.
      - title:
          it: I tuoi dati restano tuoi
          en: Your data stays yours
        text:
          it: Ogni azienda vede solo il proprio archivio fornitori.
          en: Each company sees only its own supplier archive.
    - type: note
      content:
        it: 'Il punteggio è un supporto alla decisione: verifica sempre certificati e requisiti prima di ordinare.'
        en: 'The score is decision support: always verify certificates and requirements before ordering.'
  - key: new_search
    type: new_run
    title:
      it: Nuova ricerca
      en: New search
    roles:
    - user
    - admin
  - key: searches
    type: history
    title:
      it: Le mie ricerche
      en: My searches
    source: run
    roles:
    - user
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: to_approve
    type: approvals
    title:
      it: Da approvare
      en: To approve
    approvals:
    - shortlist_ok
    roles:
    - user
    - admin
  - key: archive
    type: table
    title:
      it: Archivio fornitori
      en: Supplier archive
    source: collection:suppliers
    data:
      display: table
      fields:
      - key: name
        label:
          it: Fornitore
          en: Supplier
      - key: country
        label:
          it: Paese
          en: Country
        format: badge
      - key: category
        label:
          it: Categoria
          en: Category
      - key: certifications
        label:
          it: Certificazioni
          en: Certifications
      - key: score
        label:
          it: Punteggio
          en: Score
        format: number
      - key: website
        label: Web
        format: link
      - key: found_on
        label:
          it: Trovato il
          en: Found on
        format: date
      sort:
        field: score
        dir: desc
      limit: 200
      empty:
        it: 'Nessun fornitore ancora: avvia una ricerca.'
        en: 'No suppliers yet: start a search.'
    roles:
    - user
    - admin
  - key: supplier_cards
    type: cards
    title:
      it: Schede fornitori
      en: Supplier profiles
    source: collection:suppliers
    data:
      display: cards
      fields:
      - key: name
      - key: score
        format: number
      - key: rationale
      - key: history
      sort:
        field: found_on
        dir: desc
      limit: 60
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento e crediti
      en: Plan and credits
    roles:
    - user
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 50
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
      - browser
    costs:
      agent:radar:
        estimate: 300
        metered: true
    packs:
    - key: extra_small
      credits: 1000
      price: 12
      label: 1000 crediti
    - key: extra_large
      credits: 5000
      price: 50
      label: 5000 crediti
    plans:
    - key: team
      price: 149
      interval: month
      label:
        it: Team — 10 ricerche incluse
        en: Team — 10 searches included
      credits: 3000
      creditsReset: monthly
      includes:
      - 10 ricerche al mese
      - archivio fornitori illimitato
      roles:
      - user
  extensions:
  - key: email_send
    description: 'Invio delle email dalla casella aziendale del buyer: non disponibile (serve connettore con credenziali del
      cliente). Per ora le bozze approvate si copiano e si inviano a mano.'
  - key: reply_reading
    description: 'Lettura automatica delle risposte, riassunto e collegamento al fornitore: non disponibile (richiede accesso
      alla casella). Il buyer può annotare le risposte nel campo storico contatti della scheda fornitore.'
  - key: notifications
    description: 'Avvisi email a ricerca terminata o approvazione in attesa: non disponibili.'
