apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: trasporto-preventivo
  displayName: TrasportoPreventivo
  tagline:
    it: Preventivo immediato per il trasporto sanitario non urgente.
  description:
    it: TrasportoPreventivo è lo strato software per prenotare trasporti sanitari non urgenti (visite, terapie) con operatori
      accreditati. Il servizio fisico resta agli operatori.
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#0b3c5d'
      accent: '#1f8a70'
      background: '#f6f9fb'
      foreground: '#14202b'
    fonts:
      body: Inter
      display: Source Serif 4
    wordmark:
    - text: Trasporto
      color: primary
    - text: Preventivo
      color: accent
  header:
    links:
    - label:
        it: Come funziona
      href: '#come-funziona'
    cta:
      label:
        it: Richiedi un preventivo
      href: /v/new_quote
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: coordinator
      label:
        it: Coordinatore
      assignedBy: invite
    - key: operator
      label:
        it: Operatore
      assignedBy: derived
      from: collection:operators.email
    - key: user
      label:
        it: Utente
      assignedBy: signup
  limits:
  - action: agent:quoter
    per: user
    max: 10
    window: day
    roles:
    - user
  agents:
  - key: quoter
    role: main
    description: Stima distanza e durata, applica i listini degli operatori accreditati della zona e produce il preventivo;
      segnala i casi particolari al coordinatore.
    profile:
      inline:
        display_name: Preventivatore trasporto sanitario
        crews:
        - id: quoter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei il preventivatore di TrasportoPreventivo, piattaforma software per prenotare trasporto sanitario
            non urgente. Non gestisci mezzi né servizio: lo svolgono operatori accreditati.

            Procedura: 1) stima distanza (km) e durata (minuti) del tragitto dalle località indicate, dichiarando che è una
            stima stradale; 2) con il tool list_operators leggi gli operatori accreditati e i listini; scegli quelli che coprono
            la zona di partenza e il tipo di trasporto richiesto; 3) calcola il prezzo con il listino: quota base + km x tariffa
            al km + supplementi (sedia a rotelle, barella, accompagnatore, attesa), mai inventare tariffe: se nessun operatore
            copre zona o tipo, dillo e non dare prezzo; 4) indica la disponibilità in base a fascia oraria e giorni dell''operatore
            (da confermare dall''operatore). Casi particolari (barella con note cliniche delicate, ossigeno, mobilità molto
            ridotta, tragitto oltre 150 km, orario notturno) richiedono revisione del coordinatore: in tal caso chiama request_special_case
            prima di proporre la conferma e scrivilo nel report. Non dare consigli medici.

            Struttura del report: un titolo di primo livello "# Preventivo trasporto — <partenza> → <destinazione>"; poi ##
            Riepilogo richiesta, ## Tragitto (km, durata stimata), ## Preventivo (tabella voci e totale in euro IVA inclusa
            se indicata nel listino), ## Disponibilità, ## Operatore proposto, ## Prossimi passi (conferma e pagamento online
            con carta; poi l''operatore accetta; il coordinatore può intervenire sui casi particolari). Concludi con un blocco
            ```json con i campi: from_address, to_address, when, transport_type, companion, distance_km, duration_min, price_eur,
            operator_email, operator_name, special_case (true/false), status:"quoted". Scrivi in italiano.'
          mcp_servers: []
    goalTemplate: 'Richiesta di trasporto sanitario non urgente.

      Partenza: {from_address}

      Destinazione: {to_address}

      Data: {date_of_ride} ore {time_of_ride}

      Tipo di trasporto: {transport_type_label}

      Accompagnatore: {companion_label}

      {?notes}Note sulle condizioni: {notes}{/notes}

      Utente: {user}. Data di oggi: {date}. Rispondi in italiano.'
    appTools:
    - name: list_operators
      description: Operatori accreditati con zone, tipi di trasporto, listini e disponibilità
      action: read
      collection: operators
      scope: all
    awaits:
    - special_case
    output: markdown+json
    writesTo:
      collection: rides
      parse: json_last
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.4
  inputForm:
    title:
      it: Nuova richiesta di trasporto
    fields:
    - name: from_address
      type: text
      required: true
      label:
        it: Luogo di partenza
      help:
        it: Via, numero e città
    - name: to_address
      type: text
      required: true
      label:
        it: Destinazione
      help:
        it: Ospedale, ambulatorio o centro terapie
    - name: date_of_ride
      type: date
      required: true
      label:
        it: Data
    - name: time_of_ride
      type: text
      required: true
      label:
        it: Ora
      help:
        it: es. 08:30
    - name: transport_type
      type: select
      required: true
      label:
        it: Tipo di trasporto
      options:
      - value: autonomia
        label:
          it: In autonomia
      - value: sedia
        label:
          it: Con sedia a rotelle
      - value: barella
        label:
          it: In barella
    - name: companion
      type: select
      required: true
      label:
        it: Accompagnatore
      default: 'no'
      options:
      - value: 'no'
        label:
          it: 'No'
      - value: si
        label:
          it: Sì
    - name: notes
      type: textarea
      maxLength: 600
      label:
        it: Note sulle condizioni (facoltative)
      help:
        it: Mobilità, ossigeno, scale, esigenze particolari
  data:
    collections:
    - name: operators
      ownedBy: shared
      description: Operatori accreditati con zone e listini
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome
      - name: email
        type: email
        required: true
        label:
          it: Email
      - name: zones
        type: text
        label:
          it: Zone coperte
      - name: transport_types
        type: text
        label:
          it: Tipi di trasporto
      - name: base_fee
        type: number
        label:
          it: Quota base (€)
      - name: rate_per_km
        type: number
        label:
          it: Tariffa al km (€)
      - name: surcharges
        type: text
        label:
          it: Supplementi (sedia, barella, accompagnatore, attesa)
      - name: availability
        type: text
        label:
          it: Fasce e giorni di disponibilità
    - name: rides
      ownedBy: user
      sharing:
      - viewer
      description: Corse richieste, con preventivo, stato e operatore assegnato
      fields:
      - name: from_address
        type: text
        label:
          it: Partenza
      - name: to_address
        type: text
        label:
          it: Destinazione
      - name: when
        type: text
        label:
          it: Data e ora
      - name: transport_type
        type: text
        label:
          it: Tipo
      - name: companion
        type: boolean
        label:
          it: Accompagnatore
      - name: distance_km
        type: number
        label:
          it: Km
      - name: duration_min
        type: number
        label:
          it: Minuti
      - name: price_eur
        type: number
        label:
          it: Prezzo (€)
      - name: operator_name
        type: text
        label:
          it: Operatore
      - name: operator_email
        type: email
        label:
          it: Email operatore
      - name: special_case
        type: boolean
        label:
          it: Caso particolare
      - name: status
        type: text
        label:
          it: Stato
  approvals:
  - key: special_case
    title:
      it: Verifica caso particolare
    description: Il coordinatore verifica le richieste con esigenze particolari prima della conferma definitiva
    role: coordinator
    fields:
    - from_address
    - to_address
    - when
    - transport_type
    - notes
    - price_eur
    timeoutMinutes: 1440
    onTimeout: reject
    decidedBy: role
  views:
  - key: home
    type: page
    nav: false
    title: TrasportoPreventivo
    sections:
    - type: hero
      eyebrow:
        it: Trasporto sanitario non urgente
      title:
        it: Prenota il trasporto verso visite e terapie, con **preventivo immediato**.
      text:
        it: 'Indica partenza, destinazione, data e tipo di trasporto: calcoliamo distanza e durata, applichiamo i listini
          degli operatori accreditati e ti mostriamo subito prezzo e disponibilità.'
      actions:
      - label:
          it: Richiedi un preventivo
        href: /v/new_quote
        style: primary
      - label:
          it: Accedi
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
      items:
      - title:
          it: Compili il modulo
        text:
          it: 'Tu o un tuo familiare: tragitto, data e ora, tipo di trasporto, accompagnatore, note.'
        badge: 📝
      - title:
          it: Ricevi il preventivo
        text:
          it: Prezzo e disponibilità calcolati sui listini degli operatori della tua zona.
        badge: 💶
      - title:
          it: Confermi e paghi con carta
        text:
          it: La richiesta passa all'operatore di zona, che la accetta.
        badge: 💳
      - title:
          it: Supervisione umana
        text:
          it: Un coordinatore controlla i casi particolari e può intervenire prima della conferma definitiva.
        badge: 🧑‍⚕️
    - type: note
      content:
        it: 'TrasportoPreventivo è solo lo strato software di prenotazione: il servizio di trasporto è svolto dagli operatori
          accreditati, che ne sono responsabili. Il prezzo è una stima basata sui listini e sul tragitto calcolato. Non è
          un servizio di emergenza: in caso di urgenza chiama il 112.'
  - key: new_quote
    type: new_run
    title:
      it: Nuova richiesta
    roles:
    - user
    - admin
  - key: my_rides
    type: history
    title:
      it: Le mie richieste
    source: run
    roles:
    - user
    - admin
  - key: quote
    type: report
    title:
      it: Preventivo
    source: run
    printable: true
    nav: false
  - key: approvals_view
    type: approvals
    title:
      it: Casi da verificare
    roles:
    - coordinator
    - admin
  - key: operator_rides
    type: list
    title:
      it: Corse assegnate
    source: collection:rides
    roles:
    - operator
    data:
      display: table
      fields:
      - key: when
        label:
          it: Data e ora
      - key: from_address
        label:
          it: Partenza
      - key: to_address
        label:
          it: Destinazione
      - key: transport_type
        label:
          it: Tipo
      - key: companion
        label:
          it: Accomp.
      - key: status
        label:
          it: Stato
        format: badge
      sort:
        field: when
        dir: asc
      limit: 100
      empty:
        it: Nessuna corsa assegnata.
  - key: all_rides
    type: table
    title:
      it: Tutte le corse
    source: collection:rides
    roles:
    - admin
    - coordinator
    data:
      display: table
      fields:
      - key: when
        label:
          it: Data e ora
      - key: from_address
        label:
          it: Partenza
      - key: to_address
        label:
          it: Destinazione
      - key: operator_name
        label:
          it: Operatore
      - key: price_eur
        label:
          it: Prezzo
        format: money
      - key: special_case
        label:
          it: Caso part.
      - key: status
        label:
          it: Stato
        format: badge
      sort:
        field: when
        dir: desc
      limit: 200
  - key: operators_view
    type: table
    title:
      it: Operatori e listini
    source: collection:operators
    roles:
    - admin
  billing:
    modes:
    - per_transaction
    currency: eur
    transactionFeePct: 12
    sellers: collection:operators
  extensions:
  - key: email_notifications
    description: 'Conferma e promemoria via email all''utente non sono ancora disponibili: per ora lo stato è visibile in
      ''Le mie richieste''.'
  - key: routing_provider
    description: 'Distanza e durata sono stimate dall''agente: un servizio di calcolo percorsi con licenza commerciale andrebbe
      collegato in seguito.'
  - key: operator_assignment
    description: L'inoltro all'operatore di zona avviene condividendo la corsa (sharing viewer) con l'email operatore; l'accettazione
      da parte dell'operatore e il filtro 'solo corse assegnate' richiedono logica dedicata.
  - key: ride_payment_flow
    description: 'Pagamento con carta per singola corsa con commissione (12%, da confermare) sui conti Stripe Connect degli
      operatori: richiede onboarding Connect di ciascun operatore.'
