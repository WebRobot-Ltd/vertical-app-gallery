apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: causacomune
  displayName: CausaComune
  tagline:
    it: Le imprese sostengono le cause sociali, gli enti del terzo settore ricevono fondi verificati.
  description:
    it: CausaComune collega imprese e enti del terzo settore verificati sul RUNTS. Donazioni una tantum, ricorrenti o legate
      alle vendite, dashboard d'impatto e rendiconti via email.
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f3a5f'
      accent: '#e07a3f'
      background: '#fbf8f3'
      foreground: '#1c2430'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Causa
      color: primary
    - text: Comune
      color: accent
  header:
    links:
    - label: Come funziona
      href: '#come-funziona'
    - label: Per gli enti
      href: '#enti'
    cta:
      label: Accedi
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Amministratore
      assignedBy: admin_emails
    - key: operator
      label: Operatore verifiche
      assignedBy: invite
    - key: ente
      label: Ente del terzo settore
      assignedBy: derived
      from: collection:enti.email
    - key: user
      label: Azienda
      assignedBy: signup
  agents:
  - key: verifier
    role: helper
    description: Confronta i dati dichiarati dall'ente con il registro RUNTS e segnala le incongruenze all'operatore.
    profile:
      inline:
        display_name: Verificatore RUNTS
        crews:
        - id: verifier
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''assistente che supporta la verifica degli enti del terzo settore per CausaComune. Ricevi
            i dati dichiarati da un ente (denominazione, codice fiscale, numero e sezione RUNTS, sede legale, attività). Cerca
            l''ente nel RUNTS, il registro pubblico del terzo settore (servizi.lavoro.gov.it/runts), usando gli strumenti
            di navigazione/scraping WebRobot MCP, e confronta: denominazione, codice fiscale, numero di repertorio, sezione,
            sede legale, stato di iscrizione. Non inventare mai dati: se non trovi l''ente o il registro non è raggiungibile,
            scrivi ''non_trovato''. Non approvi tu l''ente: la decisione spetta a un operatore. Scrivi un report in Markdown
            che inizia con un titolo di livello 1 ''# Verifica RUNTS — <denominazione>'', con sezioni ## Dati dichiarati,
            ## Dati trovati nel RUNTS, ## Incongruenze, ## Raccomandazione. Chiudi con un blocco ```json contenente {"ente_name":"…","codice_fiscale":"…","esito":"coerente|incongruenze|non_trovato","incongruenze":"elenco
            sintetico","report":"riassunto in 3 righe"}.'
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
    output: markdown+json
    writesTo:
      collection: verifiche
      parse: json_last
      keyBy: codice_fiscale
    limits:
      maxTurns: 25
      maxBudgetUsd: 0.6
  - key: reporter
    role: helper
    description: Scrive il rendiconto d'impatto per un'azienda a partire dalle sue donazioni.
    profile:
      inline:
        display_name: Rendicontatore d'impatto
        crews:
        - id: reporter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Scrivi il rendiconto d''impatto di un''azienda che sostiene enti del terzo settore. Leggi le donazioni
            dell''azienda con lo strumento read_donations. Inizia con ''# Rendiconto d''impatto — <mese e anno>''. Sezioni
            ##: Sintesi (totale donato, numero di donazioni), A chi sono andati i fondi (tabella per ente), Cosa significa
            (tono sobrio, senza attribuire risultati che non conosci), Come comunicarlo (3 spunti per social e sito, usando
            il badge CausaComune). Se i dati sull''impatto reale degli enti non sono disponibili, dillo chiaramente. Non inventare
            cifre o risultati. Aggiungi un grafico con un blocco ```chart (bar) degli importi per ente, con soli dati reali.
            Massimo 400 parole.'
          mcp_servers: []
    appTools:
    - name: read_donations
      description: Legge le donazioni dell'azienda
      action: read
      collection: donations
      scope: user
    output: markdown
  templates:
  - key: report_impatto
    title: Rendiconto d'impatto
    description: Ogni mese ricevi via email il rendiconto delle tue donazioni.
    agent: reporter
    params:
    - name: note
      type: text
      label: Note da includere (facoltative)
      maxLength: 200
    goal: 'Scrivi il rendiconto d''impatto di "{instance}" fino a oggi {date}, in italiano. {?note}Note: {note}{/note}'
    schedule:
      cron: 0 7 1 * *
      userCanChange: true
    maxPerUser: 2
    deliver:
      to: owner
      subject: Il tuo rendiconto d'impatto CausaComune
      onlyIfNew: true
  triggers:
  - key: verifica_nuovo_ente
    description: Quando un ente compila il profilo parte la verifica sul RUNTS
    'on':
      collection: enti
      op: insert
    start:
      agent: verifier
    goal: 'Verifica l''ente dichiarato: denominazione {record.name}, codice fiscale {record.codice_fiscale}, numero RUNTS
      {record.runts_number}, sezione {record.runts_section}, sede legale {record.legal_address}, attività {record.activity}.
      Confronta con il RUNTS.'
    asUser: true
  - key: avvisa_operatori
    'on':
      collection: enti
      op: insert
    notify:
      to:
      - role:operator
      - admins
      subject: 'Nuovo ente da verificare: {record.name}'
      body: Un nuovo ente ha compilato il profilo ed è in attesa di verifica sul RUNTS. Apri la coda delle verifiche per vedere
        il report dell'agente e approvare o respingere.
      link: coda_verifiche
  - key: pubblica_ente
    description: Un ente approvato entra nel catalogo che le aziende vedono
    'on':
      collection: enti
      op: update
      where:
        status: approved
    write:
      collection: enti_verificati
      fields:
        name: name
        codice_fiscale: codice_fiscale
        activity: activity
        projects: projects
      keyBy: codice_fiscale
  - key: ente_esito
    'on':
      collection: enti
      op: update
      where:
        status: approved
    notify:
      to:
      - record.email
      subject: Il tuo ente è stato approvato
      body: 'Il profilo di {record.name} è stato verificato: da ora puoi ricevere donazioni su CausaComune.'
      link: donazioni_ente
  - key: conferma_donazione
    'on':
      collection: donations
      op: insert
    notify:
      to:
      - owner
      subject: Grazie per la tua donazione
      body: Abbiamo registrato la tua donazione. La trovi nella dashboard insieme ai materiali per comunicarla.
      link: dashboard
  inputForm:
    title: Rendiconto
    fields: []
  data:
    collections:
    - name: aziende
      description: Profilo dell'azienda donatrice
      ownedBy: user
      fields:
      - name: name
        type: text
        required: true
        label: Ragione sociale
      - name: partita_iva
        type: text
        required: true
        label: Partita IVA
      - name: settore
        type: text
        label: Settore
      - name: sito
        type: url
        label: Sito web
      - name: cause
        type: multiselect
        label: Cause da sostenere
        options:
        - Infanzia
        - Ambiente
        - Salute
        - Inclusione sociale
        - Cultura
        - Animali
        - Emergenze
    - name: enti
      description: Profilo dell'ente del terzo settore, con stato di verifica
      ownedBy: user
      access:
      - role: operator
        can:
        - read
        - write
      fields:
      - name: name
        type: text
        required: true
        label: Denominazione
      - name: codice_fiscale
        type: text
        required: true
        label: Codice fiscale
      - name: email
        type: email
        required: true
        label: Email di contatto
      - name: runts_number
        type: text
        required: true
        label: Numero di repertorio RUNTS
      - name: runts_section
        type: select
        required: true
        label: Sezione RUNTS
        options:
        - Organizzazioni di volontariato
        - Associazioni di promozione sociale
        - Enti filantropici
        - Imprese sociali
        - Reti associative
        - Società di mutuo soccorso
        - Altri enti del terzo settore
      - name: legal_address
        type: text
        label: Sede legale
      - name: activity
        type: textarea
        required: true
        label: Attività
        maxLength: 1500
      - name: projects
        type: textarea
        label: Progetti da finanziare
        maxLength: 2000
      - name: status
        type: select
        label: Stato verifica
        default: pending
        options:
        - value: pending
          label: In verifica
        - value: approved
          label: Approvato
        - value: rejected
          label: Respinto
      - name: verification_note
        type: textarea
        label: Nota dell'operatore
    - name: enti_verificati
      description: Catalogo degli enti approvati, visibile a tutti
      ownedBy: shared
      fields:
      - name: name
        type: text
        label: Denominazione
      - name: codice_fiscale
        type: text
        label: Codice fiscale
      - name: activity
        type: textarea
        label: Attività
      - name: projects
        type: textarea
        label: Progetti
    - name: verifiche
      description: Report di verifica RUNTS dell'agente, per gli operatori
      ownedBy: org
      access:
      - role: operator
      fields:
      - name: ente_name
        type: text
        label: Ente
      - name: codice_fiscale
        type: text
        label: Codice fiscale
      - name: esito
        type: select
        label: Esito
        options:
        - coerente
        - incongruenze
        - non_trovato
      - name: incongruenze
        type: textarea
        label: Incongruenze
      - name: report
        type: textarea
        label: Report
    - name: donations
      description: Donazioni delle aziende; l'ente destinatario le vede in sola lettura
      ownedBy: user
      access:
      - role: ente
        where:
          ente_email: '{user.email}'
        can:
        - read
      fields:
      - name: ente
        type: select
        required: true
        label: Ente
        optionsFrom: collection:enti_verificati
      - name: ente_email
        type: email
        label: Email ente
      - name: company_name
        type: text
        label: Azienda
      - name: amount
        type: number
        required: true
        label: Importo (€)
      - name: type
        type: select
        required: true
        label: Tipo
        options:
        - value: once
          label: Una tantum
        - value: recurring
          label: Ricorrente mensile
        - value: per_sale
          label: Legata alle vendite
      - name: sale_percent
        type: number
        label: '% sul venduto (se legata alle vendite)'
      - name: date
        type: date
        label: Data
      - name: status
        type: select
        label: Stato
        default: pending
        options:
        - pending
        - paid
        - cancelled
  views:
  - key: home
    type: page
    nav: false
    title: CausaComune
    sections:
    - type: hero
      eyebrow: Imprese e terzo settore
      title: Dona con **fiducia** agli enti verificati sul RUNTS
      text: Le aziende scelgono le cause e attivano donazioni una tantum, ricorrenti o legate alle vendite. Gli enti ricevono
        i fondi solo dopo la verifica sul registro pubblico del terzo settore.
      actions:
      - label: Sono un'azienda
        href: /login
        style: primary
      - label: Sono un ente
        href: '#enti'
        style: ghost
    - type: steps
      id: come-funziona
      title: Come funziona
      items:
      - title: Registrati
        text: Compili il profilo dell'azienda e scegli le cause che ti stanno a cuore.
      - title: Dona
        text: 'Scegli un ente verificato e attiva una donazione: una tantum, ricorrente o su ogni vendita.'
      - title: Comunica
        text: Dalla dashboard scarichi il badge e ricevi via email il rendiconto d'impatto.
    - type: cards
      id: enti
      title: Per gli enti del terzo settore
      items:
      - title: Profilo e progetti
        text: Racconti attività e progetti da finanziare.
      - title: Verifica sul RUNTS
        text: Un agente confronta i tuoi dati con il registro; un operatore approva.
      - title: Fondi con Stripe Connect
        text: Ricevi le donazioni direttamente, al netto di una piccola commissione di piattaforma.
    - type: note
      content: CausaComune trattiene una piccola commissione sulle donazioni. Ogni azienda e ogni ente vede solo i propri
        dati.
  - key: profilo_azienda
    type: form
    title: Profilo azienda
    collection: aziende
    submit:
      label: Salva
      message: Profilo salvato
      redirect: dona
    edit: true
    roles:
    - user
    - admin
  - key: profilo_ente
    type: form
    title: Profilo ente
    collection: enti
    fields:
    - name
    - codice_fiscale
    - email
    - runts_number
    - runts_section
    - legal_address
    - activity
    - projects
    submit:
      label: Invia per la verifica
      message: 'Profilo inviato: la verifica sul RUNTS è in corso.'
    edit: true
    roles:
    - user
    - admin
  - key: cause
    type: cards
    title: Enti e cause
    source: collection:enti_verificati
    roles:
    - user
    - admin
    - ente
    - operator
  - key: dona
    type: form
    title: Dona
    collection: donations
    fields:
    - ente
    - amount
    - type
    - sale_percent
    submit:
      label: Procedi al pagamento
      message: Donazione registrata
      redirect: dashboard
    roles:
    - user
    - admin
  - key: dashboard
    type: page
    title: La mia dashboard
    roles:
    - user
    - admin
    sections:
    - type: data
      title: Il tuo impatto
      source: collection:donations
      display: kpi
      kpis:
      - label: Totale donato
        agg: sum
        field: amount
        format: money
      - label: Donazioni
        agg: count
    - type: data
      title: Donazioni per mese
      source: collection:donations
      display: chart
      chart: bar
      fields:
      - key: date
        label: Mese
      - key: total
        label: Totale
      groupBy:
        field: date
        bucket: month
        aggs:
        - key: total
          agg: sum
          field: amount
    - type: data
      title: A chi hai donato
      source: collection:donations
      display: table
      fields:
      - key: ente
        label: Ente
      - key: amount
        label: Importo
        format: money
      - key: type
        label: Tipo
        format: badge
      - key: date
        label: Data
        format: date
      - key: status
        label: Stato
        format: badge
      sort:
        field: date
        dir: desc
      limit: 50
      empty: Nessuna donazione ancora.
    - type: cards
      title: Comunica il tuo impegno
      items:
      - title: Badge
        text: Apri la pagina Materiali per scaricare il badge "Sostengo CausaComune".
        badge: 🏅
      - title: Rendiconto d'impatto
        text: 'Attiva il rendiconto mensile in "Rendiconti": lo ricevi via email.'
        badge: 📄
  - key: materiali
    type: page
    title: Materiali
    roles:
    - user
    - admin
    sections:
    - type: html
      html: '<div style="padding:24px;border:2px solid #e07a3f;border-radius:16px;max-width:320px;text-align:center;color:#1f3a5f"><strong
        style="font-size:20px">Sostengo CausaComune</strong><br>Impresa che dona al terzo settore verificato</div>'
    - type: text
      title: Come usarlo
      content: Inserisci il badge sul tuo sito, nelle firme email e sui social. Cita sempre gli enti sostenuti e gli importi
        reali dal tuo rendiconto.
  - key: rendiconti
    type: instances
    template: report_impatto
    title: Rendiconti
    roles:
    - user
    - admin
  - key: donazioni_ente
    type: page
    title: Donazioni ricevute
    roles:
    - ente
    - admin
    sections:
    - type: data
      source: collection:donations
      display: kpi
      kpis:
      - label: Totale ricevuto
        agg: sum
        field: amount
        format: money
      - label: Donazioni
        agg: count
    - type: data
      title: Elenco donazioni
      source: collection:donations
      display: table
      fields:
      - key: company_name
        label: Azienda
      - key: amount
        label: Importo
        format: money
      - key: type
        label: Tipo
        format: badge
      - key: date
        label: Data
        format: date
      sort:
        field: date
        dir: desc
      limit: 100
      empty: Nessuna donazione ricevuta.
  - key: sostenitori
    type: table
    title: Sostenitori
    source: collection:donations
    roles:
    - ente
    - admin
    data:
      display: table
      fields:
      - key: company_name
        label: Azienda
      - key: total
        label: Totale donato
        format: money
      groupBy:
        field: company_name
        aggs:
        - key: total
          agg: sum
          field: amount
    export: true
  - key: coda_verifiche
    type: table
    title: Enti da verificare
    source: collection:enti
    roles:
    - operator
    - admin
    columns:
    - name
    - codice_fiscale
    - runts_number
    - runts_section
    - status
    data:
      display: table
      fields:
      - key: name
        label: Ente
      - key: codice_fiscale
        label: Codice fiscale
      - key: runts_number
        label: RUNTS
      - key: status
        label: Stato
        format: badge
      filters:
      - field: status
        op: '='
        value: pending
      limit: 100
  - key: verifiche
    type: table
    title: Report dell'agente
    source: collection:verifiche
    roles:
    - operator
    - admin
    data:
      display: table
      fields:
      - key: ente_name
        label: Ente
      - key: esito
        label: Esito
        format: badge
      - key: incongruenze
        label: Incongruenze
      - key: report
        label: Report
      limit: 100
  - key: approva
    type: form
    title: Approva o respingi ente
    collection: enti
    fields:
    - status
    - verification_note
    submit:
      label: Salva decisione
      message: Decisione salvata
      redirect: coda_verifiche
    edit: true
    nav: false
    roles:
    - operator
    - admin
  billing:
    modes:
    - per_transaction
    currency: eur
    transactionFeePct: 5
    sellers: collection:enti
  notifications:
    emailOnRunDone: false
  egress:
    hosts:
    - servizi.lavoro.gov.it
    notes: 'RUNTS, registro pubblico del terzo settore: consultato solo in lettura dall''agente di verifica tramite WebRobot
      MCP.'
  extensions:
  - key: donation_checkout
    description: Pagamento delle donazioni con Stripe Connect verso l'ente (una tantum, abbonamento ricorrente, e quota per
      ogni vendita da integrare con il negozio dell'azienda), compilazione di ente_email e company_name sul record, blocco
      delle donazioni verso enti non approvati.
  - key: badge_download
    description: Badge in formato immagine scaricabile; per ora è mostrato come HTML nella pagina Materiali.
  - key: ente_status_protection
    description: 'Il campo status del profilo ente dovrebbe poter essere modificato solo dagli operatori: oggi l''accesso
      in scrittura è condiviso con il proprietario del record.'
