apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: grafo-del-sito
  displayName: Grafo del Sito
  tagline:
    it: Il knowledge graph del tuo sito, con JSON-LD pronto per la SEO semantica.
    en: Your site's knowledge graph, with ready-made JSON-LD for semantic SEO.
  description:
    it: Un agente analizza il tuo sito, riconosce le entità, le collega a Wikidata e genera per ogni pagina markup schema.org,
      FAQ e link interni. Ogni settimana ripassa il sito e aggiorna il grafo.
    en: An agent crawls your site, recognises entities, links them to Wikidata and generates schema.org markup, FAQs and internal
      links for every page. Every week it revisits the site and updates the graph.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: dashboard
  branding:
    theme: light
    palette:
      primary: '#1f2a5a'
      accent: '#0e9f8e'
      background: '#f7f8fc'
      foreground: '#161a2b'
    fonts:
      body: Inter
      display: Space Grotesk
    wordmark:
    - text: 'Grafo '
      color: primary
    - text: del Sito
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Cosa ottieni
        en: What you get
      href: '#cosa-ottieni'
    cta:
      label:
        it: Inizia
        en: Start
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  limits:
  - action: login
    per: ip
    max: 20
    window: hour
  egress:
    hosts:
    - www.wikidata.org
    notes: 'Wikidata API (wbsearchentities): data under CC0, free reuse including commercial.'
  agents:
  - key: grapher
    role: scheduled
    description: Crawls one client site (with the client's permission), extracts entities, links them to Wikidata, writes
      JSON-LD, FAQs and internal links per page.
    memory: instance
    profile:
      inline:
        display_name: Grafo del Sito analyst
        crews:
        - id: grapher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 80
          max_budget_usd: 5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You are a semantic SEO analyst. You work on ONE site whose owner has given permission to crawl it.
            Steps: 1) Using the WebRobot MCP, build and run a crawl pipeline limited to the given domain, respecting robots.txt,
            skipping the excluded sections, and collecting for each page: url, title, meta description, headings, main text,
            existing JSON-LD, internal links. 2) For each page recognise the entities mentioned (person, place, product, organization,
            concept). 3) Link each entity to Wikidata with the tool wikidata_search (GET, query: action=wbsearchentities&search=<name>&language=<lang>&format=json&limit=5);
            pick a Q-id only when the description clearly matches, otherwise leave wikidata_id empty — never guess an id.
            4) For each page write schema.org JSON-LD suited to the site type (Article/NewsArticle/BlogPosting for publishers;
            Product/Offer/BreadcrumbList/Organization for e-commerce; add about/mentions with sameAs to Wikidata), 2-4 suggested
            FAQs answered only with content really on the page, and up to 5 internal links to add (source page, target page,
            anchor text, reason). Also list issues (missing title or description, duplicate titles, no structured data, orphan
            page, thin content, broken markup). 5) Save results with the tools: save_page (one record per page, upsert by
            url), save_entity (one per entity, with pages_count). Never invent facts, prices or figures: markup uses only
            data seen on the page. 6) Your memory holds the pages already known and their hashes: on later runs process only
            new or changed pages and say what changed. At the end call remember once with the updated list. Final answer:
            a Markdown report starting with a level-1 title "# <domain> — analysis of <date>", then ## Summary (pages, entities,
            issues), ## New or changed pages, ## Top issues, ## Next steps. Write in the language with ISO code given in the
            goal. Do not claim that markup was installed on the site.'
    goalTemplate: Analyse the site of this watch, following the parameters given in the task. The owner confirms permission
      to crawl. Today is {date}. Write the report in the language with ISO code {lang}.
    appTools:
    - name: wikidata_search
      description: Search Wikidata entities (wbsearchentities API)
      action: http
      http:
        method: GET
        url: https://www.wikidata.org/w/api.php
        attribution: Wikidata, CC0
    - name: save_page
      description: Save or update the analysis of one page (url, title, issues, entities, jsonld, faq, internal_links)
      action: write
      collection: pages
      scope: session
    - name: save_entity
      description: Save or update one entity of the site's graph
      action: write
      collection: entities
      scope: session
    output: markdown
    writesTo:
      collection: site_reports
      parse: markdown_sections
    limits:
      maxTurns: 80
      maxBudgetUsd: 5
      timeoutSeconds: 3600
  templates:
  - key: site_watch
    title:
      it: Sito
      en: Site
    description:
      it: Analizza il sito, costruisce il grafo e lo aggiorna ogni settimana.
      en: Analyses the site, builds the graph and updates it every week.
    agent: grapher
    params:
    - name: url
      type: url
      required: true
      label:
        it: Indirizzo del sito
        en: Site address
    - name: lang_site
      type: select
      required: true
      label:
        it: Lingua del sito
        en: Site language
      options:
      - value: it
        label: Italiano
      - value: en
        label: English
      - value: de
        label: Deutsch
      - value: fr
        label: Français
      - value: es
        label: Español
    - name: business_type
      type: select
      required: true
      label:
        it: Tipo di attività
        en: Business type
      options:
      - value: editorial
        label:
          it: Sito editoriale
          en: Publisher
      - value: ecommerce
        label: E-commerce
      - value: other
        label:
          it: Altro
          en: Other
    - name: exclude
      type: textarea
      maxLength: 500
      label:
        it: Sezioni da escludere (percorsi, uno per riga)
        en: Sections to exclude (paths, one per line)
    - name: permission
      type: boolean
      required: true
      label:
        it: Confermo di avere il permesso di analizzare questo sito
        en: I confirm I have permission to crawl this site
    goal: 'Site: {url}

      Language of the site: {lang_site}

      Type of business: {business_type}

      {?exclude}Sections to exclude: {exclude}{/exclude}

      The owner confirms permission to crawl. Today is {date}. Write the report in the language with ISO code {lang}.'
    schedule:
      cron: 0 4 * * 1
      userCanChange: true
    maxPerUser: 20
    cost:
      perRun: 100
  data:
    collections:
    - name: pages
      ownedBy: instance
      description: One record per crawled page
      fields:
      - name: url
        type: url
      - name: title
        type: text
      - name: issues
        type: text
      - name: issue_count
        type: number
      - name: entities
        type: text
      - name: jsonld
        type: textarea
      - name: faq
        type: textarea
      - name: internal_links
        type: textarea
      - name: updated
        type: date
    - name: entities
      ownedBy: instance
      description: Nodes of the site's knowledge graph
      fields:
      - name: name
        type: text
      - name: type
        type: select
        options:
        - person
        - place
        - product
        - organization
        - concept
      - name: wikidata_id
        type: text
      - name: wikidata_url
        type: url
      - name: pages_count
        type: number
    - name: site_reports
      ownedBy: instance
      description: Weekly report of each site, with what changed
  views:
  - key: home
    type: page
    nav: false
    title: Grafo del Sito
    sections:
    - type: hero
      title:
        it: Il **knowledge graph** del tuo sito, pronto per la SEO semantica.
        en: Your site's **knowledge graph**, ready for semantic SEO.
      text:
        it: Un agente AI legge ogni pagina, riconosce le entità, le collega a Wikidata e prepara JSON-LD schema.org, FAQ e
          link interni. Ogni settimana aggiorna il grafo con le pagine nuove.
        en: An AI agent reads every page, recognises entities, links them to Wikidata and prepares schema.org JSON-LD, FAQs
          and internal links. Every week it updates the graph with new pages.
      band: true
      actions:
      - label:
          it: Aggiungi il tuo sito
          en: Add your site
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Inserisci il sito
          en: Enter your site
        text:
          it: Indirizzo, lingua, tipo di attività e sezioni da escludere. Confermi di avere il permesso di analizzarlo.
          en: Address, language, business type and sections to exclude. You confirm you have permission to crawl it.
      - title:
          it: L'agente costruisce il grafo
          en: The agent builds the graph
        text:
          it: Entità collegate a Wikidata, problemi per pagina, markup, FAQ e link interni.
          en: Entities linked to Wikidata, issues per page, markup, FAQs and internal links.
      - title:
          it: Ogni settimana si aggiorna
          en: Weekly updates
        text:
          it: Il sito viene ripassato e il report dice cosa è cambiato.
          en: The site is revisited and the report says what changed.
    - type: cards
      id: cosa-ottieni
      title:
        it: Cosa ottieni
        en: What you get
      items:
      - title:
          it: Entità e Wikidata
          en: Entities and Wikidata
        text:
          it: Persone, luoghi, prodotti, organizzazioni e concetti con il loro identificativo.
          en: People, places, products, organizations and concepts with their identifier.
        badge: 🕸️
      - title: JSON-LD
        text:
          it: Markup schema.org per ogni pagina, da copiare nel sito.
          en: schema.org markup for every page, ready to copy into your site.
        badge: 🧩
      - title:
          it: Problemi, FAQ, link
          en: Issues, FAQs, links
        text:
          it: Cosa correggere e quali collegamenti interni aggiungere.
          en: What to fix and which internal links to add.
        badge: 🔗
    - type: note
      content:
        it: 'Supporto alle decisioni SEO: i risultati vanno verificati prima della pubblicazione. Dati Wikidata CC0.'
        en: 'SEO decision support: check results before publishing. Wikidata data is CC0.'
  - key: sites
    type: instances
    template: site_watch
    title:
      it: I miei siti
      en: My sites
    roles:
    - user
    - admin
  - key: dashboard
    type: page
    title:
      it: Dashboard
      en: Dashboard
    roles:
    - user
    - admin
    sections:
    - type: data
      title:
        it: Entità del grafo
        en: Graph entities
      source: collection:entities
      display: kpi
      kpis:
      - label:
          it: Entità
          en: Entities
        agg: count
      - label:
          it: Collegate a Wikidata
          en: Linked to Wikidata
        agg: count
        field: wikidata_id
    - type: data
      title:
        it: Entità per tipo
        en: Entities by type
      source: collection:entities
      display: chart
      chart: pie
      fields:
      - key: type
      - key: pages_count
    - type: data
      title:
        it: 'Grafo: entità e pagine che le citano'
        en: 'Graph: entities and the pages citing them'
      source: collection:entities
      display: table
      fields:
      - key: name
        label:
          it: Entità
          en: Entity
      - key: type
        label:
          it: Tipo
          en: Type
        format: badge
      - key: wikidata_url
        label: Wikidata
        format: link
      - key: pages_count
        label:
          it: Pagine
          en: Pages
        format: number
      sort:
        field: pages_count
        dir: desc
      limit: 200
    - type: data
      title:
        it: Pagine e problemi
        en: Pages and issues
      source: collection:pages
      display: table
      fields:
      - key: url
        label: URL
        format: link
      - key: issue_count
        label:
          it: Problemi
          en: Issues
        format: number
      - key: issues
        label:
          it: Dettaglio
          en: Detail
      sort:
        field: issue_count
        dir: desc
      limit: 200
    - type: data
      title:
        it: Dati strutturati pronti
        en: Structured data ready
      source: collection:pages
      display: table
      fields:
      - key: url
        label: URL
        format: link
      - key: jsonld
        label: JSON-LD
      - key: faq
        label: FAQ
      - key: internal_links
        label:
          it: Link interni
          en: Internal links
      limit: 200
  - key: reports
    type: table
    title:
      it: Report settimanali
      en: Weekly reports
    source: collection:site_reports
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Plan
    roles:
    - user
  schedules:
  - action: settle
    cron: '*/10 * * * *'
    owner: app
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 100
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:grapher:
        estimate: 100
        metered: true
    packs:
    - key: extra
      credits: 2000
      price: 25
      label: Extra
    plans:
    - key: pages_200
      price: 29
      interval: month
      label:
        it: Fino a 200 pagine
        en: Up to 200 pages
      includes:
      - up to 200 pages per site
      credits: 3000
      creditsReset: monthly
    - key: pages_1000
      price: 79
      interval: month
      label:
        it: Fino a 1.000 pagine
        en: Up to 1,000 pages
      includes:
      - up to 1,000 pages per site
      credits: 12000
      creditsReset: monthly
    - key: pages_5000
      price: 199
      interval: month
      label:
        it: Fino a 5.000 pagine
        en: Up to 5,000 pages
      includes:
      - up to 5,000 pages per site
      credits: 50000
      creditsReset: monthly
  extensions:
  - key: auto_install
    description: 'Automatic insertion of the markup into the site (WordPress plugin or one-time JavaScript snippet) is not
      available yet: for now the JSON-LD is shown ready to copy. The plugin/snippet would need a public export endpoint and
      a hosted script.'
  - key: email_digest
    description: 'Weekly email with the changes is not available yet: changes are in the weekly report in the app.'
  - key: interactive_graph
    description: 'A visual navigable graph (nodes and edges) is not available yet: entities and pages are shown as tables
      and charts.'
  - key: agency_workspace
    description: 'Agency workspace where a consultant manages several client sites and each client user sees only their own
      site (shared sites, per-site invitations) is not available yet: each user sees only the sites they created.'
  - key: page_limit_by_plan
    description: The per-plan page limit is stated in the plan and in the agent's goal but not enforced by the runtime.
