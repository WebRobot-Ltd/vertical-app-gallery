apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: grafo-del-sito
  displayName: Grafo del Sito
  tagline:
    it: Il knowledge graph del tuo sito, con JSON-LD pronto da pubblicare.
    en: Your site's knowledge graph, with ready-to-publish JSON-LD.
  description:
    it: Un agente fa il crawling del sito (con il tuo permesso), riconosce le entità, le collega a Wikidata e genera markup
      schema.org, FAQ e link interni. Ogni settimana aggiorna il grafo e ti scrive le modifiche.
    en: An agent crawls your site (with your permission), recognises entities, links them to Wikidata and generates schema.org
      markup, FAQs and internal links. Every week it updates the graph and emails the changes.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: dashboard
  branding:
    theme: light
    palette:
      primary: '#16324f'
      accent: '#1f8a70'
      background: '#f6f8fa'
      foreground: '#14202e'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Grafo
      color: primary
    - text: del Sito
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Installazione
        en: Installation
      href: '#installazione'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  limits:
  - action: create:pages
    max: 100
    window: total
    plans:
      pro: 1000
      agency: -1
  agents:
  - key: crawler
    role: scheduled
    description: Crawls one client site, extracts entities, links them to Wikidata, writes pages, entities and JSON-LD.
    memory: instance
    writesTo:
      collection: site_reports
    mcpServers: []
    appTools:
    - name: wikidata_search
      description: 'Search Wikidata entities. Query: action=wbsearchentities&search=<name>&language=<lang>&format=json&limit=3'
      action: http
      http:
        method: GET
        url: https://www.wikidata.org/w/api.php
        attribution: Wikidata, CC0
    - name: save_page
      description: Create or update the record of a page (url, title, page_type, entities, issues, severity, jsonld, faq,
        internal_links, change)
      action: write
      collection: pages
    - name: save_entity
      description: Create or update an entity of the graph (name, type, wikidata_id, pages)
      action: write
      collection: entities
    - name: save_relation
      description: Create a relation between two entities
      action: write
      collection: relations
    - name: read_pages
      description: Read the pages already saved for this site
      action: read
      collection: pages
    profile:
      inline:
        display_name: Grafo del Sito crawler
        crews:
        - id: crawler
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 60
          max_budget_usd: 3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You are a semantic SEO analyst. You crawl ONLY the site given by the user, who has confirmed permission;
            respect robots.txt, rate limits and the excluded sections. Use the WebRobot MCP to fetch and read pages (build
            and run a crawl pipeline; do not write code yourself). For each page: identify type (article, product, category,
            organization, other), the entities mentioned (person, place, product, organization, concept), and link each to
            Wikidata with wikidata_search; set wikidata_id only when the match is clear, otherwise leave it empty and say
            so. Never invent Q-ids. Save each page with save_page: valid schema.org JSON-LD suited to the page type (Article,
            Product, Organization, BreadcrumbList, FAQPage, using sameAs with Wikidata URLs) using only facts visible on the
            page; 2-4 suggested FAQs grounded in the page text; internal links to add (from this page to which url, with anchor);
            issues found (missing title/H1, thin content, no structured data, broken markup, orphan page) with severity high|medium|low.
            Save entities with save_entity and links between entities with save_relation. On weekly runs read_pages first,
            process only new or changed pages and set change to new|changed. Finish with a report: a level-1 title ''# <site>
            — grafo del <date>'', then sections ## Novità (new/changed pages), ## Problemi principali, ## Entità nuove, ##
            Prossimi passi, with real counts only. At the end call remember with the key counts and the URLs crawled.'
    goalTemplate: 'Site: {site_url}

      Language code: {site_lang}

      Business type (editorial, ecommerce or both): {business}

      {?exclude}Excluded sections: {exclude}{/exclude}

      Today is {date}. Write the report in the language with ISO code {lang}.'
  templates:
  - key: site_watch
    title:
      it: Sito monitorato
      en: Monitored site
    description:
      it: 'Un sito cliente: crawling iniziale e poi ripasso ogni settimana con email delle modifiche.'
      en: 'A client site: first crawl, then a weekly pass with an email of the changes.'
    agent: crawler
    params:
    - name: site_url
      type: url
      required: true
      label:
        it: Indirizzo del sito
        en: Site address
    - name: site_lang
      type: select
      required: true
      label:
        it: Lingua
        en: Language
      options:
      - value: it
        label: Italiano
      - value: en
        label: English
      - value: fr
        label: Français
      - value: de
        label: Deutsch
      - value: es
        label: Español
    - name: business
      type: select
      required: true
      label:
        it: Tipo di attività
        en: Business type
      options:
      - value: editorial
        label:
          it: Editoriale
          en: Editorial
      - value: ecommerce
        label: E-commerce
      - value: both
        label:
          it: Entrambi
          en: Both
    - name: exclude
      type: textarea
      maxLength: 600
      label:
        it: Sezioni da escludere
        en: Sections to exclude
      help:
        it: es. /area-riservata, /checkout
        en: e.g. /account, /checkout
    - name: consent
      type: boolean
      required: true
      label:
        it: Confermo di essere autorizzato ad analizzare questo sito
        en: I confirm I am authorised to crawl this site
    goal: 'Crawl and analyse the site {site_url} ("{instance}"), language {site_lang}, business {business}. Excluded sections:
      {exclude}. Today is {date}. Write the report in the language with ISO code {lang}.'
    schedule:
      cron: 0 5 * * 1
      userCanChange: true
    maxPerUser: 50
    deliver:
      to: owner
      subject: Grafo del Sito — modifiche della settimana {date}
      onlyIfNew: true
  data:
    collections:
    - name: site_reports
      ownedBy: instance
      description: Weekly report of each monitored site
    - name: pages
      ownedBy: instance
      description: Pages of the site with issues, JSON-LD, FAQs and internal links
      fields:
      - name: url
        type: url
        required: true
      - name: title
        type: text
      - name: page_type
        type: select
        options:
        - article
        - product
        - category
        - organization
        - other
      - name: entities
        type: textarea
      - name: issues
        type: textarea
      - name: severity
        type: select
        options:
        - high
        - medium
        - low
        - none
      - name: jsonld
        type: textarea
      - name: faq
        type: textarea
      - name: internal_links
        type: textarea
      - name: change
        type: select
        options:
        - new
        - changed
        - unchanged
    - name: entities
      ownedBy: instance
      description: Entities of the knowledge graph
      fields:
      - name: name
        type: text
        required: true
      - name: type
        type: select
        options:
        - person
        - place
        - product
        - organization
        - concept
      - name: wikidata_id
        type: text
      - name: pages
        type: textarea
    - name: relations
      ownedBy: instance
      description: Edges of the knowledge graph
      fields:
      - name: source
        type: text
        required: true
      - name: relation
        type: text
      - name: target
        type: text
        required: true
  views:
  - key: home
    type: page
    nav: false
    title: Grafo del Sito
    sections:
    - type: hero
      title:
        it: Il **knowledge graph** del tuo sito, pronto per i motori di ricerca.
        en: Your site's **knowledge graph**, ready for search engines.
      text:
        it: Un agente analizza ogni pagina, collega le entità a Wikidata e prepara JSON-LD schema.org, FAQ e link interni.
          Ogni settimana aggiorna tutto.
        en: An agent analyses every page, links entities to Wikidata and prepares schema.org JSON-LD, FAQs and internal links.
          Every week it updates everything.
      actions:
      - label:
          it: Aggiungi un sito
          en: Add a site
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Inserisci il sito
          en: Add your site
        text:
          it: Indirizzo, lingua, tipo di attività, sezioni escluse e conferma di autorizzazione.
          en: Address, language, business type, excluded sections and your authorisation.
      - title:
          it: Crawling e grafo
          en: Crawl and graph
        text:
          it: Entità riconosciute e collegate a Wikidata, problemi per pagina.
          en: Entities recognised and linked to Wikidata, issues per page.
      - title:
          it: Pubblica il markup
          en: Publish the markup
        text:
          it: JSON-LD pronto da inserire, aggiornato ogni settimana con email delle modifiche.
          en: Ready JSON-LD, refreshed weekly with an email of the changes.
    - type: text
      id: installazione
      title:
        it: Installazione del markup
        en: Installing the markup
      content:
        it: Il markup è disponibile come tabella di dati strutturati ed esportazione JSON con link firmato. L'inserimento
          automatico tramite plugin WordPress o snippet JavaScript è in preparazione.
        en: The markup is available as a structured data table and a signed-link JSON export. Automatic insertion via a WordPress
          plugin or a JavaScript snippet is in preparation.
    - type: note
      content:
        it: 'Supporto alle decisioni SEO: verifica il markup prima di pubblicarlo. Analizziamo solo siti per cui hai l''autorizzazione.
          Dati entità: Wikidata (CC0).'
        en: 'SEO decision support: check the markup before publishing. We only crawl sites you are authorised for. Entity
          data: Wikidata (CC0).'
  - key: sites
    type: instances
    template: site_watch
    title:
      it: I miei siti
      en: My sites
    roles:
    - user
    - admin
  - key: dashboard
    type: tabs
    title:
      it: Dashboard
      en: Dashboard
    children:
    - graph
    - pages_issues
    - structured_data
    roles:
    - user
    - admin
  - key: graph
    type: table
    title:
      it: Grafo (relazioni)
      en: Graph (relations)
    source: collection:relations
    columns:
    - source
    - relation
    - target
    nav: false
    export: true
  - key: entities_list
    type: table
    title:
      it: Entità
      en: Entities
    source: collection:entities
    columns:
    - name
    - type
    - wikidata_id
    - pages
    roles:
    - user
    - admin
    export: true
  - key: pages_issues
    type: table
    title:
      it: Pagine e problemi
      en: Pages and issues
    source: collection:pages
    columns:
    - url
    - page_type
    - severity
    - issues
    - internal_links
    - faq
    - change
    nav: false
    export: true
  - key: structured_data
    type: table
    title:
      it: Dati strutturati
      en: Structured data
    source: collection:pages
    columns:
    - url
    - page_type
    - jsonld
    nav: false
    export: true
  - key: reports
    type: history
    title:
      it: Report settimanali
      en: Weekly reports
    source: collection:site_reports
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Plan
    roles:
    - user
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: start
      price: 29
      interval: month
      label:
        it: Start — fino a 100 pagine
        en: Start — up to 100 pages
    - key: pro
      price: 99
      interval: month
      label:
        it: Pro — fino a 1.000 pagine
        en: Pro — up to 1,000 pages
    - key: agency
      price: 249
      interval: month
      label:
        it: Agency — pagine illimitate, più siti
        en: Agency — unlimited pages, many sites
  notifications:
    emailOnRunDone: false
  exports:
  - path: /api/structured-data
    source: collection:pages
    format: json
    access: signed_url
  egress:
    hosts:
    - www.wikidata.org
    notes: Wikidata entity search; data CC0, reuse allowed.
  extensions:
  - key: wordpress_plugin
    description: 'Plugin WordPress that fetches the JSON-LD from the signed export and injects it in each page: not available
      yet.'
  - key: js_snippet
    description: 'One-time JavaScript snippet that loads the page''s JSON-LD from the signed export: not available yet.'
  - key: graph_view
    description: 'Interactive navigable graph visualisation: for now the relations table; a node-link view is not available.'
  - key: client_sharing
    description: 'Sharing a site''s data with the client''s own users while the consultant manages many sites: sites are owned
      by the consultant''s account; per-site client access is not expressed yet.'
