apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: schede-prodotto-perfette
  displayName: Schede Prodotto Perfette
  tagline:
    it: Cataloghi completi, coerenti e pronti da pubblicare.
    en: Complete, consistent catalogs ready to publish.
  description:
    it: Un team di quattro agenti AI arricchisce il tuo catalogo dai siti dei produttori autorizzati, normalizza gli attributi,
      scrive titoli e descrizioni SEO in italiano e inglese, valida ogni scheda e assegna un punteggio di qualità. Il responsabile
      catalogo approva prima della pubblicazione.
    en: A team of four AI agents enriches your catalog from authorized manufacturer sites, normalizes attributes, writes SEO
      titles and descriptions in Italian and English, validates every product sheet and scores its quality. The catalog manager
      approves before publishing.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f3a5f'
      accent: '#e07a1f'
      background: '#f7f8fa'
      foreground: '#18212b'
    fonts:
      body: Inter
      display: Manrope
    wordmark:
    - text: 'Schede Prodotto '
      color: primary
    - text: Perfette
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Il team
        en: The team
      href: '#team'
    cta:
      label:
        it: Inizia
        en: Start
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  limits:
  - action: agent:catalog_team
    per: user
    max: 10
    window: day
    roles:
    - user
  egress:
    hosts: []
    notes: 'Nessuna API esterna: le pagine dei produttori autorizzati sono lette con il MCP WebRobot.'
  agents:
  - key: catalog_team
    role: main
    description: 'Team of four agents in sequence: extractor, normalizer, copywriter, validator. Writes one record per product.'
    profile:
      inline:
        display_name: Schede Prodotto Perfette team
        crews:
        - id: extractor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You are the Extractor of a product-catalog team. Input: the customer''s partial catalog (codes,
            names, partial attributes) and/or the manufacturer sites the customer is AUTHORIZED to use. Read ONLY the listed
            manufacturer domains through the WebRobot MCP (scraping, never marketplaces such as Amazon, eBay, etc.). For each
            product extract: specifications, dimensions, weight, materials, certifications, image URLs and the source page
            URL. Never invent values: if a datum is not on the page leave it null and list it under missing. Output a JSON
            list, one object per product: {code, name, attributes:{...as found, original units}, images:[urls], source_url,
            missing:[...]}.'
        - id: normalizer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the Normalizer. Map each product''s attributes to the customer''s taxonomy (attribute names,
            categories, allowed values) given in the goal. Convert all units to the units the taxonomy requires (mm, kg, W,
            etc.), unify names and spelling, assign the category. Keep a list of conversions made. If the taxonomy is missing,
            use clear standard names and say so. Never guess a value that is not present: keep it null. Output the same JSON
            list with normalized attributes and a field normalization_notes.'
        - id: copywriter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the SEO Copywriter. For each product write, in Italian and in English: a title (max 70 characters,
            main keyword first), a meta description (max 155 characters) and a description of 80-150 words with a short bullet
            list of key specs. Use ONLY attributes present in the data: no invented claims, no superlatives that cannot be
            proven, no competitor names. Add fields title_it, title_en, meta_it, meta_en, description_it, description_en.'
        - id: validator
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the Validator. Apply the customer''s validation rules given in the goal (required fields,
            price/category coherence, minimum number of images, others). For each product list anomalies (rule, field, severity
            error|warning) and assign quality_score 0-100 (start from 100; subtract for each error and warning, and for missing
            fields). Set status: ''ok'' if score>=80 and no errors, ''review'' if 50-79, ''blocked'' otherwise. Be strict
            and never fix data silently. Your reply: first a level-1 title "# Catalogo elaborato — <date>", then a Markdown
            summary (products processed, average score, count per status, top anomalies, a ```chart bar block of products
            per status), then a final fenced ```json block with the list of final records: {code, name, category, price, attributes,
            images, source_url, title_it, title_en, meta_it, meta_en, description_it, description_en, anomalies, quality_score,
            status, approval:''pending''}. Then call the tool request_publish_products with the codes with status ok or review.'
        orchestration:
          type: dag
          entry: extractor
          nodes:
          - id: extractor
            crew: extractor
          - id: normalizer
            crew: normalizer
          - id: copywriter
            crew: copywriter
          - id: validator
            crew: validator
          edges:
          - from: extractor
            to: normalizer
          - from: normalizer
            to: copywriter
          - from: copywriter
            to: validator
    goalTemplate: 'Mode: {source_mode_label}.

      {?catalog_text}Customer catalog (CSV pasted as text):

      {catalog_text}{/catalog_text}

      {?catalog_url}Catalog CSV link: {catalog_url}{/catalog_url}

      {?manufacturer_urls}Authorized manufacturer sites/pages (the customer declares permission to use them): {manufacturer_urls}{/manufacturer_urls}

      Taxonomy and units: {taxonomy}

      Validation rules: {rules}

      Minimum images: {min_images}.

      Output languages: Italian and English. Today is {date}. Write the summary in the language with ISO code {lang}.'
    output: markdown+json
    writesTo:
      collection: products
      parse: json_last
      keyBy: code
    awaits:
    - publish_products
    appTools:
    - name: save_products
      description: Read the customer's already saved products
      action: read
      collection: products
      scope: user
    limits:
      maxTurns: 80
      maxBudgetUsd: 4
      timeoutSeconds: 1800
  approvals:
  - key: publish_products
    title:
      it: Approva le schede per la pubblicazione
      en: Approve product sheets for publishing
    description: Il responsabile catalogo conferma le schede prima dell'export.
    decidedBy: requester
    fields:
    - code
    - name
    - quality_score
    - anomalies
    timeoutMinutes: 10080
    onTimeout: reject
  inputForm:
    title:
      it: Nuova elaborazione catalogo
      en: New catalog run
    fields:
    - name: source_mode
      type: select
      required: true
      label:
        it: Fonte dei dati
        en: Data source
      default: catalog
      options:
      - value: catalog
        label:
          it: Catalogo CSV da arricchire
          en: CSV catalog to enrich
      - value: sites
        label:
          it: Siti dei produttori autorizzati
          en: Authorized manufacturer sites
      - value: both
        label:
          it: Catalogo e siti produttori
          en: Catalog and manufacturer sites
    - name: catalog_text
      type: textarea
      maxLength: 20000
      label:
        it: Catalogo (CSV incollato)
        en: Catalog (pasted CSV)
      help:
        it: 'Incolla le righe CSV con intestazione: codice, nome, attributi, prezzo. Il caricamento di file non è ancora disponibile.'
        en: 'Paste CSV rows with a header: code, name, attributes, price. File upload is not available yet.'
    - name: catalog_url
      type: url
      label:
        it: Oppure link al CSV
        en: Or CSV link
    - name: manufacturer_urls
      type: urls
      label:
        it: Siti produttori autorizzati
        en: Authorized manufacturer sites
      help:
        it: Solo siti di cui hai il permesso di usare le schede tecniche. Marketplace non ammessi.
        en: Only sites whose datasheets you are allowed to use. Marketplaces not accepted.
    - name: taxonomy
      type: textarea
      maxLength: 4000
      required: true
      label:
        it: Tassonomia e unità di misura
        en: Taxonomy and units
      help:
        it: Categorie, nomi attributi, unità (es. lunghezza in mm, peso in kg).
        en: Categories, attribute names, units (e.g. length in mm, weight in kg).
    - name: rules
      type: textarea
      maxLength: 3000
      required: true
      label:
        it: Regole di validazione
        en: Validation rules
      default: 'Campi obbligatori: codice, nome, categoria, prezzo, materiale, dimensioni. Il prezzo deve essere coerente
        con la categoria (segnala outlier).'
      help:
        it: Campi obbligatori, coerenza prezzo/categoria, altre regole.
        en: Required fields, price/category coherence, other rules.
    - name: min_images
      type: number
      default: 3
      label:
        it: Immagini minime
        en: Minimum images
  data:
    collections:
    - name: products
      ownedBy: user
      description: 'Product sheets of each customer: attributes, SEO texts, anomalies, quality score, status and approval'
      fields:
      - name: code
        type: text
        required: true
        label: Codice
      - name: name
        type: text
        label: Nome
      - name: category
        type: text
        label: Categoria
      - name: price
        type: number
        label: Prezzo
      - name: attributes
        type: json
      - name: images
        type: json
      - name: source_url
        type: url
      - name: title_it
        type: text
      - name: title_en
        type: text
      - name: meta_it
        type: text
      - name: meta_en
        type: text
      - name: description_it
        type: textarea
      - name: description_en
        type: textarea
      - name: anomalies
        type: json
      - name: quality_score
        type: number
      - name: status
        type: text
      - name: approval
        type: text
  views:
  - key: home
    type: page
    nav: false
    title: Schede Prodotto Perfette
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow:
        it: Per distributori ed e-commerce
        en: For distributors and e-commerce
      title:
        it: Schede prodotto **complete e coerenti**, pronte da pubblicare.
        en: '**Complete, consistent** product sheets, ready to publish.'
      text:
        it: 'Carichi il catalogo o indichi i siti dei produttori autorizzati: quattro agenti AI estraggono, normalizzano,
          scrivono in italiano e inglese e validano ogni scheda. Tu approvi, poi esporti in CSV.'
        en: 'Provide your catalog or the authorized manufacturer sites: four AI agents extract, normalize, write in Italian
          and English and validate every sheet. You approve, then export to CSV.'
      actions:
      - label:
          it: Elabora un catalogo
          en: Process a catalog
        href: /v/new_run
        style: primary
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: ghost
      aside: <div style="padding:16px"><b>Esempio / Example</b><br>COD-4821 · Punteggio 92 · ok<br>COD-4822 · Punteggio 61
        · 2 anomalie<br>COD-4823 · Punteggio 38 · bloccata</div>
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Fornisci i dati
          en: Provide data
        text:
          it: Catalogo CSV incollato o link, tassonomia, regole e siti produttori autorizzati.
          en: Pasted CSV or link, taxonomy, rules and authorized manufacturer sites.
        badge: 📥
      - title:
          it: Il team lavora
          en: The team works
        text:
          it: Estrazione, normalizzazione, testi SEO e validazione con punteggio.
          en: Extraction, normalization, SEO copy and scored validation.
        badge: 🤖
      - title:
          it: Approvi ed esporti
          en: Approve and export
        text:
          it: Il responsabile catalogo approva; poi esporti le schede in CSV.
          en: The catalog manager approves; then export the sheets to CSV.
        badge: ✅
    - type: cards
      id: team
      title:
        it: Il team di agenti
        en: The agent team
      items:
      - title:
          it: 1 · Estrattore
          en: 1 · Extractor
        text:
          it: Legge solo le pagine dei produttori autorizzati. Mai marketplace.
          en: Reads only authorized manufacturer pages. Never marketplaces.
      - title:
          it: 2 · Normalizzatore
          en: 2 · Normalizer
        text:
          it: Allinea attributi, nomi e unità alla tua tassonomia.
          en: Aligns attributes, names and units to your taxonomy.
      - title:
          it: 3 · Copywriter SEO
          en: 3 · SEO copywriter
        text:
          it: Titoli e descrizioni in italiano e inglese, senza dati inventati.
          en: Titles and descriptions in Italian and English, no invented data.
      - title:
          it: 4 · Validatore
          en: 4 · Validator
        text:
          it: Regole configurabili e punteggio di qualità 0-100.
          en: Configurable rules and a 0-100 quality score.
    - type: note
      content:
        it: 'Ogni cliente vede solo il proprio catalogo. Il cliente dichiara di avere il permesso di usare i contenuti dei
          siti indicati. Invio diretto a Shopify non ancora disponibile: export CSV.'
        en: 'Each customer sees only their own catalog. The customer declares permission to use the content of the listed
          sites. Direct Shopify push not yet available: CSV export.'
  - key: new_run
    type: new_run
    title:
      it: Nuova elaborazione
      en: New run
    roles:
    - user
    - admin
  - key: history
    type: history
    title:
      it: Le mie elaborazioni
      en: My runs
    source: run
    roles:
    - user
    - admin
  - key: run_report
    type: report
    source: run
    printable: true
    nav: false
  - key: products_table
    type: table
    title:
      it: Prodotti
      en: Products
    source: collection:products
    roles:
    - user
    - admin
    data:
      display: table
      fields:
      - key: code
        label: Codice
      - key: name
        label: Nome
      - key: category
        label:
          it: Categoria
          en: Category
      - key: quality_score
        label:
          it: Punteggio
          en: Score
        format: number
      - key: status
        label:
          it: Stato
          en: Status
        format: badge
      - key: anomalies
        label:
          it: Anomalie
          en: Anomalies
      - key: approval
        label:
          it: Approvazione
          en: Approval
        format: badge
      sort:
        field: quality_score
        dir: asc
      limit: 200
      empty:
        it: 'Nessun prodotto ancora: avvia un''elaborazione.'
        en: 'No products yet: start a run.'
  - key: approvals
    type: approvals
    title:
      it: Approvazioni
      en: Approvals
    approvals:
    - publish_products
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Crediti
      en: Credits
    roles:
    - user
  exports:
  - path: /api/export/products
    source: collection:products
    format: csv
    access: user
  billing:
    modes:
    - credits
    currency: eur
    signupCredits: 50
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:catalog_team:
        estimate: 10
        metered: true
    packs:
    - key: starter
      credits: 1000
      price: 10
      label: Starter
    - key: pro
      credits: 6000
      price: 50
      label: Pro
  extensions:
  - key: file_upload
    description: 'Caricamento diretto di file CSV/Excel non ancora disponibile: il cliente incolla il CSV o fornisce un link.'
  - key: shopify_push
    description: 'Invio diretto a Shopify non disponibile (richiede le credenziali di ogni cliente): per ora export CSV delle
      schede approvate.'
  - key: per_product_credits
    description: Il costo è misurato sull'uso reale (token e calcolo) invece che con un prezzo fisso per prodotto elaborato.
  - key: editable_rules
    description: Le regole di validazione sono un campo testuale del modulo, non ancora un editor di regole strutturato.
