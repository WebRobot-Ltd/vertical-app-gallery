apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: schede-prodotto-perfette
  displayName: Schede Prodotto Perfette
  tagline:
    it: Cataloghi completi, normalizzati, SEO e validati da un team di agenti.
    en: Complete, normalised, SEO-ready and validated catalogs by a team of agents.
  description:
    it: 'Carica il catalogo (CSV/Excel) o indica i siti dei produttori autorizzati: gli agenti estraggono le specifiche, normalizzano
      gli attributi, scrivono titoli e descrizioni SEO in italiano e inglese e validano ogni scheda. Tu approvi, poi esporti
      in CSV o pubblichi su Shopify.'
    en: 'Upload your catalog (CSV/Excel) or point to authorised manufacturer sites: agents extract specs, normalise attributes,
      write SEO titles and descriptions in Italian and English and validate each product sheet. You approve, then export to
      CSV or publish to Shopify.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f3a5f'
      accent: '#e07a1f'
      background: '#f7f8fa'
      foreground: '#1a2230'
    fonts:
      body: Inter
      display: Manrope
    wordmark:
    - text: 'Schede Prodotto '
      color: primary
    - text: Perfette
      color: accent
    width: wide
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Il team
        en: The team
      href: '#team'
    cta:
      label:
        it: Inizia
        en: Start
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  limits:
  - action: agent:catalog_team
    per: user
    max: 10
    window: day
    roles:
    - user
  agents:
  - key: catalog_team
    role: main
    description: 'Team of four agents: extractor, normaliser, SEO writer, validator. Saves each product in the user''s catalog
      and asks for approval.'
    awaits:
    - product_review
    context:
    - key: settings
      from: collection:catalog_settings
    appTools:
    - name: save_product
      description: Create or update a product record in the customer's catalog
      action: write
      collection: products
      scope: user
    - name: read_upload
      description: Read a file the user uploaded
      action: read_file
    profile:
      inline:
        display_name: Schede Prodotto Perfette team
        crews:
        - id: extractor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You are the Extractor. Input: the customer''s catalog rows (codes, names, partial attributes) and/or
            the manufacturer sites the customer is authorised to use. Read ONLY those manufacturer pages through the WebRobot
            MCP (scrape pages, do not write pipeline YAML). NEVER use marketplaces (Amazon, eBay, etc.) or any site not listed.
            For each product extract specifications, dimensions, materials, and image URLs, with the source URL of each datum.
            Never invent values: leave missing ones empty. Output a JSON list of products {sku, name, brand, category, price,
            raw_attributes, images, source_url}.'
        - id: normalizer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You are the Normaliser. Map each product's raw attributes to the customer's taxonomy (in settings),
            unify units of measure (SI/metric unless the taxonomy says otherwise) and attribute names. Do not invent values;
            flag attributes that cannot be mapped. Output the same JSON list with normalised 'attributes'.
        - id: seo_writer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the SEO Writer. For each product write title_it, description_it, title_en, description_en:
            titles under 70 characters, descriptions 80-160 words, factual, using only the normalised attributes. No invented
            claims, certifications or figures. Output the list with the new fields.'
        - id: validator
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the Validator. Apply the customer''s rules from settings (required fields, price/category
            coherence, minimum number of images). For each product compute quality_score 0-100 and list anomalies (one per
            line). Set status ''to_review'' (score >= the threshold in settings, default 70) or ''draft'' otherwise. Save
            EVERY product with the tool save_product (fields: sku, name, brand, category, price, attributes, images, source_url,
            title_it, description_it, title_en, description_en, quality_score, anomalies, status). Then call request_product_review
            once for the whole batch. Finish with a report starting with ''# Catalog batch — <date>'' with counts, average
            score, and the main anomalies; add a ```chart bar block of the score distribution.'
        orchestration:
          type: dag
          entry: extractor
          nodes:
          - id: extractor
            crew: extractor
          - id: normalizer
            crew: normalizer
          - id: seo_writer
            crew: seo_writer
          - id: validator
            crew: validator
          edges:
          - from: extractor
            to: normalizer
          - from: normalizer
            to: seo_writer
          - from: seo_writer
            to: validator
    goalTemplate: 'Catalog processing, {date}. Language of the report: {lang}.

      Products to process (approx.): {product_count}

      {?catalog}Uploaded catalog files: {catalog}. Content:

      {catalog_text}

      For photos/scans use read_upload.{/catalog}

      {?manufacturer_urls}Authorised manufacturer sites (the only ones you may read): {manufacturer_urls}{/manufacturer_urls}

      {?notes}Notes: {notes}{/notes}

      Customer settings (taxonomy, validation rules): {settings}'
    output: markdown
    limits:
      maxTurns: 120
      maxBudgetUsd: 6
      timeoutSeconds: 3600
  - key: publisher
    role: helper
    description: Publishes the approved products to Shopify when the customer connected it.
    context:
    - key: settings
      from: collection:catalog_settings
    appTools:
    - name: read_products
      description: Read the customer's products
      action: read
      collection: products
      scope: user
    - name: update_product
      description: Update the status of a product
      action: write
      collection: products
      scope: user
    - name: shopify_create_product
      description: Create a product in the customer's Shopify store
      action: http
      http:
        method: POST
        url: https://{host}/admin/api/2025-01/products.json
        allowPath: false
        credential:
          provider: shopify
          header: X-Shopify-Access-Token
          format: '{secret}'
    profile:
      inline:
        display_name: Shopify publisher
        crews:
        - id: publisher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 1
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You publish approved products. Read the products with status 'approved'. If the customer has not
            connected Shopify, do nothing except say the approved products are ready for CSV export. Otherwise create each
            one with shopify_create_product (POST body {"product":{title, body_html, vendor, product_type, variants:[{sku,
            price}], images:[{src}], metafields for attributes}}), using the title/description in the customer's primary language,
            and then set its status to 'published' with update_product and the Shopify id in shopify_id. Never publish products
            that are not approved. Finish with '# Publication — <date>' listing published and failed items.
    goalTemplate: 'Publish to Shopify the approved products of the customer. Event: {event}. Date: {date}.'
    output: markdown
    limits:
      maxTurns: 60
      maxBudgetUsd: 1.5
  inputForm:
    title:
      it: Nuovo lotto di prodotti
      en: New product batch
    fields:
    - name: catalog
      type: file
      label:
        it: Catalogo (CSV o Excel)
        en: Catalog (CSV or Excel)
      accept:
      - csv
      - xlsx
      maxMb: 15
      multiple: false
      help:
        it: Codici, nomi e attributi anche parziali.
        en: Codes, names and even partial attributes.
    - name: manufacturer_urls
      type: urls
      label:
        it: Siti dei produttori autorizzati
        en: Authorised manufacturer sites
      help:
        it: Solo siti da cui hai il permesso di usare le schede tecniche. Nessun marketplace.
        en: Only sites whose datasheets you are allowed to use. No marketplaces.
    - name: product_count
      type: number
      required: true
      label:
        it: Numero di prodotti
        en: Number of products
      help:
        it: Il costo è a crediti per prodotto elaborato.
        en: Cost is in credits per processed product.
    - name: notes
      type: textarea
      maxLength: 600
      label:
        it: Note (facoltative)
        en: Notes (optional)
  data:
    collections:
    - name: products
      ownedBy: user
      description: 'The customer''s catalog: one record per product sheet with status and anomalies'
      fields:
      - name: sku
        type: text
        required: true
        label: SKU
      - name: name
        type: text
        label:
          it: Nome
          en: Name
      - name: brand
        type: text
        label: Brand
      - name: category
        type: text
        label:
          it: Categoria
          en: Category
      - name: price
        type: number
        label:
          it: Prezzo
          en: Price
      - name: attributes
        type: json
        label:
          it: Attributi
          en: Attributes
      - name: images
        type: urls
        label:
          it: Immagini
          en: Images
      - name: source_url
        type: url
        label:
          it: Fonte
          en: Source
      - name: title_it
        type: text
      - name: description_it
        type: textarea
      - name: title_en
        type: text
      - name: description_en
        type: textarea
      - name: quality_score
        type: number
        label:
          it: Punteggio
          en: Score
      - name: anomalies
        type: textarea
        label:
          it: Anomalie
          en: Anomalies
      - name: status
        type: select
        label:
          it: Stato
          en: Status
        options:
        - draft
        - to_review
        - approved
        - rejected
        - published
        default: draft
      - name: shopify_id
        type: text
      retentionDays: 730
    - name: catalog_settings
      ownedBy: user
      description: Taxonomy and validation rules of the customer
      fields:
      - name: taxonomy
        type: textarea
        label:
          it: Tassonomia (categorie, attributi, unità)
          en: Taxonomy (categories, attributes, units)
      - name: required_fields
        type: text
        label:
          it: Campi obbligatori (separati da virgola)
          en: Required fields (comma separated)
      - name: min_images
        type: number
        label:
          it: Immagini minime
          en: Minimum images
        default: 1
      - name: price_rules
        type: textarea
        label:
          it: Regole prezzo/categoria
          en: Price/category rules
        help:
          it: 'es. Rubinetti: 20–600 €'
          en: 'e.g. Taps: 20–600 EUR'
      - name: min_score
        type: number
        label:
          it: Punteggio minimo per la revisione
          en: Minimum score for review
        default: 70
    credentials:
    - provider: shopify
      kind: api_key
      scope: user
      label: Shopify
      help:
        it: 'Shopify Admin > Impostazioni > App > Sviluppa app: crea un token Admin API con permesso write_products.'
        en: 'Shopify Admin > Settings > Apps > Develop apps: create an Admin API token with write_products.'
      hostLabel:
        it: il-tuo-negozio.myshopify.com
        en: your-store.myshopify.com
  egress:
    hosts:
    - '*.myshopify.com'
    notes: Shopify Admin API of the customer's own store, with the customer's own key.
  approvals:
  - key: product_review
    title:
      it: Approva le schede prodotto
      en: Approve product sheets
    decidedBy: requester
    description: The catalog manager reviews the sheets before publication.
  triggers:
  - key: publish_approved
    'on':
      approval: product_review
      decision: approved
    start:
      agent: publisher
    goal: 'Publish to Shopify the approved products of the customer. Event: {event}'
  views:
  - key: home
    type: page
    nav: false
    sections:
    - type: hero
      eyebrow:
        it: Per distributori ed e-commerce
        en: For distributors and e-commerce
      title:
        it: Schede prodotto **perfette**, dal catalogo alla pubblicazione.
        en: '**Perfect** product sheets, from catalog to publication.'
      text:
        it: Un team di agenti arricchisce, normalizza, scrive in SEO e valida il tuo catalogo. Tu approvi, poi esporti in
          CSV o pubblichi su Shopify.
        en: A team of agents enriches, normalises, SEO-writes and validates your catalog. You approve, then export to CSV
          or publish to Shopify.
      actions:
      - label:
          it: Inizia
          en: Get started
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Carica
          en: Upload
        text:
          it: CSV/Excel con codici e nomi, oppure i siti dei produttori autorizzati.
          en: CSV/Excel with codes and names, or authorised manufacturer sites.
      - title:
          it: Elabora
          en: Process
        text:
          it: Quattro agenti lavorano in sequenza su ogni scheda.
          en: Four agents work in sequence on every sheet.
      - title:
          it: Approva
          en: Approve
        text:
          it: Controlli stato e anomalie e approvi prima della pubblicazione.
          en: You check status and anomalies and approve before publication.
      - title:
          it: Pubblica
          en: Publish
        text:
          it: Esporta in CSV o invia a Shopify.
          en: Export to CSV or send to Shopify.
    - type: cards
      id: team
      title:
        it: Il team di agenti
        en: The agent team
      items:
      - title:
          it: Estrattore
          en: Extractor
        text:
          it: 'Legge solo i siti dei produttori autorizzati: specifiche, misure, materiali, immagini. Mai marketplace.'
          en: 'Reads only authorised manufacturer sites: specs, sizes, materials, images. Never marketplaces.'
      - title:
          it: Normalizzatore
          en: Normaliser
        text:
          it: Applica la tua tassonomia e uniforma unità e nomi.
          en: Applies your taxonomy and unifies units and names.
      - title:
          it: Redattore SEO
          en: SEO writer
        text:
          it: Titoli e descrizioni in italiano e inglese.
          en: Titles and descriptions in Italian and English.
      - title:
          it: Validatore
          en: Validator
        text:
          it: Regole configurabili e punteggio di qualità.
          en: Configurable rules and a quality score.
    - type: note
      content:
        it: Usa solo fonti per cui hai il permesso. I contenuti generati vanno verificati prima della pubblicazione.
        en: Use only sources you have permission for. Review generated content before publishing.
  - key: new_batch
    type: new_run
    title:
      it: Nuovo lotto
      en: New batch
    roles:
    - user
    - admin
  - key: batches
    type: history
    title:
      it: I miei lotti
      en: My batches
    source: run
    roles:
    - user
    - admin
  - key: batch_report
    type: report
    source: run
    printable: true
    nav: false
  - key: catalog
    type: table
    title:
      it: Catalogo
      en: Catalog
    source: collection:products
    columns:
    - sku
    - name
    - brand
    - category
    - price
    - quality_score
    - status
    - anomalies
    export: true
    roles:
    - user
    - admin
  - key: product_edit
    type: form
    title:
      it: Modifica scheda
      en: Edit product
    collection: products
    edit: true
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Scheda salvata
        en: Product saved
      redirect: catalog
    nav: false
    roles:
    - user
    - admin
  - key: settings
    type: form
    title:
      it: Tassonomia e regole
      en: Taxonomy and rules
    collection: catalog_settings
    edit: true
    submit:
      label:
        it: Salva regole
        en: Save rules
      message:
        it: Regole salvate
        en: Rules saved
    roles:
    - user
    - admin
  - key: review
    type: approvals
    title:
      it: Approvazioni
      en: Approvals
    approvals:
    - product_review
    roles:
    - user
    - admin
  - key: shopify
    type: account
    title:
      it: Crediti e Shopify
      en: Credits and Shopify
    roles:
    - user
  billing:
    modes:
    - credits
    signupCredits: 50
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
      - browser
    costs:
      agent:catalog_team:
        perUnit:
          field: product_count
          credits: 3
          min: 15
      agent:publisher: 5
    packs:
    - key: small
      credits: 500
      price: 15
      label: '500'
    - key: large
      credits: 3000
      price: 79
      label: '3000'
  notifications:
    emailOnRunDone: true
