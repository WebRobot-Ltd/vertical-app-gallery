apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: osservatoriocase
  displayName: OsservatorioCase
  tagline:
    it: La banca dati delle vendite giudiziarie, con stima di mercato e sconto atteso.
    en: The judicial-sale property database, with market estimate and expected discount.
  description:
    it: Ogni notte un agente raccoglie gli avvisi di vendita giudiziaria dal portale pubblico delle vendite e dai siti dei
      tribunali, li indicizza e stima il valore di mercato dalle quotazioni OMI. Cerca, salva le ricerche e ricevi un'email
      quando compare un nuovo immobile.
    en: Every night an agent collects judicial-sale notices from the public sales portal and court websites, indexes them
      and estimates market value from OMI quotations. Search, save searches and get an email for new matches.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: dashboard
  branding:
    theme: light
    palette:
      primary: '#1f3a35'
      accent: '#b5532a'
      background: '#f7f5f0'
      foreground: '#1c2321'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Osservatorio
      color: primary
    - text: Case
      color: accent
    width: wide
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Piani
        en: Plans
      href: '#piani'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  agents:
  - key: collector
    role: scheduled
    description: 'Nightly: collects judicial-sale notices, extracts the data, estimates market value from OMI quotations and
      stores them.'
    profile:
      inline:
        display_name: OsservatorioCase collector
        crews:
        - id: collector
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 60
          max_budget_usd: 3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You are the nightly collector of OsservatorioCase, an Italian database of judicial real-estate sales.
            Using the WebRobot MCP, scrape the public sales portal (Portale delle Vendite Pubbliche) and the websites of the
            courts (tribunali) for current sale notices of real estate. Build and run the scraping through the MCP; do not
            invent data. For each notice extract: listing_id (stable id: portal id or tribunale+procedure number+lot), tribunale,
            procedure_number, address, comune, province, zone, type (residenziale, commerciale, box, terreno, altro), area_sqm,
            base_price (EUR), auction_date (YYYY-MM-DD), status (e.g. in corso, rinviata, aggiudicata, annullata), url, lat/lon
            only if known. Then estimate the market value: look up the public quotations of the Osservatorio del Mercato Immobiliare
            (OMI, Agenzia delle Entrate, reuse allowed with attribution) for the comune/zone/type, take the mid-point between
            min and max EUR/sqm, store omi_eur_sqm, compute market_value = omi_eur_sqm * area_sqm and expected_discount_pct
            = (market_value - base_price) / market_value * 100 rounded to 1 decimal. If OMI data or the area is missing, leave
            those fields empty: never guess. Check with properties_search whether listing_id already exists; write new records
            and update the status/price/date of existing ones using properties_write (keyed by listing_id). Set first_seen
            to today''s date (YYYY-MM-DD) for new records only. End with a short markdown report starting with ''# Raccolta
            del <date>'' listing counts of new, updated and failed notices and the sources with problems.'
    goalTemplate: Today is {date}. Run the nightly collection of judicial-sale real-estate notices and update the database.
    appTools:
    - name: properties_search
      description: Search the indexed properties
      action: search
      collection: properties
      scope: all
    - name: properties_write
      description: Create or update a property record
      action: write
      collection: properties
      scope: all
    output: markdown
    limits:
      maxTurns: 60
      maxBudgetUsd: 3
      timeoutSeconds: 3600
  - key: matcher
    role: helper
    description: For one saved search, finds properties that match and were not reported before.
    memory: instance
    writesTo:
      collection: search_hits
    profile:
      inline:
        display_name: OsservatorioCase saved-search matcher
        crews:
        - id: matcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You check one saved search of an investor against the properties database. Use properties_search
            to find properties matching the zone, type, price range and minimum expected discount. Your memory holds the listing_ids
            already reported: exclude them. Start with ''# Nuovi immobili — <search title> — <date>''. If nothing new, write
            that in one line. Otherwise give a table with columns Indirizzo, Tipologia, Superficie, Prezzo base, Valore di
            mercato stimato, Sconto atteso, Data asta, Stato, Link, using only the figures in the database; never invent values.
            Add a one-line caution that estimates derive from OMI quotations and are not an appraisal. At the end call remember
            once with the listing_ids reported so far (old plus new).'
    appTools:
    - name: properties_search
      description: Search the indexed properties
      action: search
      collection: properties
      scope: all
    output: markdown
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.4
  templates:
  - key: saved_search
    title:
      it: Ricerca salvata
      en: Saved search
    description:
      it: 'Salva una ricerca: ogni giorno controlliamo i nuovi immobili e ti scriviamo se ce ne sono.'
      en: 'Save a search: every day we check for new properties and email you if there are any.'
    agent: matcher
    params:
    - name: zone
      type: text
      required: true
      label:
        it: Zona (comune, provincia o quartiere)
        en: Area (town, province or district)
    - name: type
      type: select
      label:
        it: Tipologia
        en: Type
      options:
      - value: residenziale
        label:
          it: Residenziale
          en: Residential
      - value: commerciale
        label:
          it: Commerciale
          en: Commercial
      - value: box
        label: Box
      - value: terreno
        label:
          it: Terreno
          en: Land
    - name: min_price
      type: number
      label:
        it: Prezzo base minimo (€)
        en: Minimum base price (€)
    - name: max_price
      type: number
      label:
        it: Prezzo base massimo (€)
        en: Maximum base price (€)
    - name: min_discount
      type: number
      label:
        it: Sconto atteso minimo (%)
        en: Minimum expected discount (%)
    goal: 'Saved search "{instance}". Today is {date}.

      Zone: {zone}

      {?type}Type: {type}{/type}

      {?min_price}Base price from: {min_price} EUR{/min_price}

      {?max_price}Base price up to: {max_price} EUR{/max_price}

      {?min_discount}Minimum expected discount: {min_discount}%{/min_discount}

      Report only properties not reported before. Write in the language with ISO code {lang}.'
    schedule:
      cron: 0 6 * * *
      userCanChange: false
    maxPerUser: 10
    deliver:
      to: owner
      subject:
        it: 'OsservatorioCase: nuovi immobili per la tua ricerca'
        en: 'OsservatorioCase: new properties for your search'
      onlyIfNew: true
  schedules:
  - agent: collector
    cron: 0 1 * * *
    action: run
    owner: app
    goal: Run the nightly collection of judicial-sale real-estate notices and update the database.
  data:
    collections:
    - name: properties
      ownedBy: app
      searchable: true
      description: Judicial-sale properties, written nightly by the collector
      fields:
      - name: listing_id
        type: text
        required: true
      - name: tribunale
        type: text
      - name: procedure_number
        type: text
      - name: address
        type: text
      - name: comune
        type: text
      - name: province
        type: text
      - name: zone
        type: text
      - name: type
        type: select
        options:
        - residenziale
        - commerciale
        - box
        - terreno
        - altro
      - name: area_sqm
        type: number
      - name: base_price
        type: number
      - name: auction_date
        type: date
      - name: status
        type: text
      - name: url
        type: url
      - name: lat
        type: number
      - name: lon
        type: number
      - name: omi_eur_sqm
        type: number
      - name: market_value
        type: number
      - name: expected_discount_pct
        type: number
      - name: first_seen
        type: date
    - name: search_hits
      ownedBy: instance
      description: Reports of each saved search
  views:
  - key: home
    type: page
    nav: false
    title: OsservatorioCase
    sections:
    - type: hero
      layout: stack
      band: true
      eyebrow:
        it: Per investitori, agenzie e banche
        en: For investors, agencies and banks
      title:
        it: Le vendite giudiziarie, con **stima di mercato** e sconto atteso.
        en: Judicial sales, with **market estimate** and expected discount.
      text:
        it: Ogni notte raccogliamo gli avvisi dal portale pubblico delle vendite e dai siti dei tribunali. Tu cerchi, salvi
          la ricerca e ricevi un'email quando compare un nuovo immobile.
        en: Every night we collect notices from the public sales portal and court websites. You search, save the search and
          get an email when a new property appears.
      actions:
      - label:
          it: Cerca immobili
          en: Search properties
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Raccolta notturna
          en: Nightly collection
        text:
          it: Indirizzo, tipologia, superficie, prezzo base, data d'asta e stato della procedura.
          en: Address, type, size, base price, auction date and procedure status.
        badge: 🌙
      - title:
          it: Stima e sconto
          en: Estimate and discount
        text:
          it: Valore di mercato dalle quotazioni OMI dell'Agenzia delle Entrate e sconto atteso sul prezzo base.
          en: Market value from OMI quotations (Italian Revenue Agency) and expected discount on the base price.
        badge: 📊
      - title:
          it: Ricerche salvate
          en: Saved searches
        text:
          it: 'Zona, prezzo, tipologia: una email quando c''è un nuovo immobile. Le ricerche sono private.'
          en: 'Area, price, type: an email when a new property appears. Searches are private.'
        badge: ✉️
    - type: cards
      id: piani
      title:
        it: Piani
        en: Plans
      items:
      - title: Base
        text:
          it: Ricerca, stime, ricerche salvate con avviso email.
          en: Search, estimates, saved searches with email alerts.
      - title: Pro
        text:
          it: Tutto il Base, più export CSV e API.
          en: Everything in Base, plus CSV export and API.
    - type: note
      content:
        it: Le stime derivano da quotazioni pubbliche OMI e non sono una perizia. Verifica sempre l'avviso originale.
        en: Estimates derive from public OMI quotations and are not an appraisal. Always check the original notice.
  - key: properties
    type: table
    title:
      it: Immobili
      en: Properties
    source: collection:properties
    columns:
    - address
    - comune
    - type
    - area_sqm
    - base_price
    - market_value
    - expected_discount_pct
    - auction_date
    - status
    - url
    roles:
    - user
    - admin
  - key: map
    type: map
    title:
      it: Mappa
      en: Map
    source: collection:properties
    map:
      lat: lat
      lon: lon
      title: address
      popup:
      - type
      - base_price
      - expected_discount_pct
      - auction_date
    roles:
    - user
    - admin
  - key: searches
    type: instances
    template: saved_search
    title:
      it: Le mie ricerche
      en: My searches
    roles:
    - user
    - admin
  - key: properties_export
    type: table
    title:
      it: Export (Pro)
      en: Export (Pro)
    source: collection:properties
    columns:
    - listing_id
    - tribunale
    - address
    - comune
    - province
    - type
    - area_sqm
    - base_price
    - omi_eur_sqm
    - market_value
    - expected_discount_pct
    - auction_date
    - status
    - url
    export: true
    preview:
      rows: 3
      unlessPlan: pro
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - user
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: base
      price: 49
      interval: month
      label: Base
      includes:
      - search
      - estimates
      - saved searches
      roles:
      - user
    - key: pro
      price: 149
      interval: month
      label: Pro
      includes:
      - everything in Base
      - CSV export
      - API
      roles:
      - user
  exports:
  - path: /api/properties
    source: collection:properties
    format: json
    access: token
  extensions:
  - key: api_plan_gate
    description: 'Restricting the API token and CSV export to the Pro plan is only partly expressible: the export view shows
      a preview to non-Pro users; the token endpoint is issued to Pro subscribers by the owner.'
