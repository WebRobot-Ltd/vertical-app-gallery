apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: partitaserena
  displayName: PartitaSerena
  tagline: Il tuo commercialista online per il regime forfettario.
  description: PartitaSerena segue la posizione fiscale dei liberi professionisti in regime forfettario. Calcola tasse e contributi
    in tempo reale, ricorda le scadenze, risponde in chat alle domande fiscali e passa i casi complessi al commercialista
    assegnato. L'invio telematico della dichiarazione resta sempre del professionista abilitato.
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f4e5f'
      accent: '#2e8b6a'
      background: '#f7f9f8'
      foreground: '#16252b'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Partita
      color: primary
    - text: Serena
      color: accent
  header:
    links:
    - label: Come funziona
      href: '#come-funziona'
    - label: Cosa include
      href: '#cosa-include'
    cta:
      label: Accedi
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Amministratore
      assignedBy: admin_emails
    - key: user
      label: Cliente
      assignedBy: signup
    - key: consultant
      label: Commercialista
      assignedBy: derived
      from: collection:clients.consultant_email
  limits:
  - action: chat
    per: user
    max: 40
    window: day
    roles:
    - user
  - action: agent:drafter
    per: user
    max: 5
    window: month
    roles:
    - user
  agents:
  - key: drafter
    role: main
    description: Prepara la bozza della dichiarazione dei redditi (regime forfettario) e la sottopone al commercialista. Non
      invia nulla.
    awaits:
    - draft_review
    profile:
      inline:
        display_name: PartitaSerena - bozza dichiarazione
        crews:
        - id: drafter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un assistente fiscale che prepara la BOZZA della dichiarazione dei redditi di un libero professionista
            in regime forfettario. Non invii mai nulla: l''invio telematico spetta sempre al professionista abilitato.

            Procedura: leggi il profilo del cliente (read_clients), le fatture dell''anno richiesto (read_invoices) e la posizione
            calcolata (read_positions). Ricalcola con calc_tax i valori dell''anno (ricavi, coefficiente di redditività dal
            codice ATECO, contributi, imposta sostitutiva 5% o 15%, acconti versati se noti). Poi chiama request_draft_review
            per chiedere la revisione al commercialista assegnato.

            Struttura del report, con titolo di primo livello ''# Bozza dichiarazione redditi <anno> - <nome cliente>'': ##
            Dati anagrafici e regime; ## Ricavi dell''anno (tabella fatture per mese); ## Calcolo del reddito forfettario
            (ricavi x coefficiente, contributi deducibili, imponibile, imposta); ## Acconti e saldo; ## Quadri da compilare
            (LM, RR/RP secondo il caso); ## Punti da verificare con il commercialista; ## Prossimi passi (revisione, firma,
            invio a cura del professionista). Aggiungi un blocco ```chart a barre con i ricavi mensili se ci sono dati.

            Non inventare cifre: se un dato manca, scrivilo tra i punti da verificare. Non dare consulenza come fatto certo:
            è una bozza soggetta a revisione. Scrivi in italiano.'
    appTools:
    - name: read_clients
      description: Legge il profilo fiscale del cliente (ATECO, anno apertura, cassa, fatturato previsto, commercialista)
      action: read
      collection: clients
      scope: user
    - name: read_invoices
      description: Legge le fatture registrate dal cliente
      action: read
      collection: invoices
      scope: user
    - name: read_positions
      description: Legge la posizione fiscale calcolata del cliente
      action: read
      collection: positions
      scope: user
    - name: calc_tax
      description: Calcola imponibile forfettario, contributi, imposta sostitutiva, accantonamento e soglia residua
      action: call
      slot: forfettario_calc
    goalTemplate: 'Anno d''imposta: {year_label}.

      {?notes}Note del cliente: {notes}{/notes}

      Prepara la bozza della dichiarazione per {user} in data {date} e chiedi la revisione al commercialista. Scrivi in italiano.'
    output: markdown
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.6
  - key: engine
    role: helper
    description: Ricalcola la posizione fiscale e il calendario delle scadenze del cliente a ogni fattura o modifica del profilo.
    profile:
      inline:
        display_name: PartitaSerena - motore fiscale
        crews:
        - id: engine
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 14
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei il motore di calcolo di PartitaSerena per un singolo cliente in regime forfettario.

            Passi: 1) read_clients per il profilo (ATECO, anno di apertura, cassa, fatturato previsto, consultant_email).
            2) read_invoices e somma gli importi dell''anno solare corrente (ricavi per cassa). 3) Determina il coefficiente
            di redditività dal codice ATECO secondo la tabella della legge 190/2014 (es. professioni 78%, commercio 40%, costruzioni
            86%, alloggio e ristorazione 40%); se non sei sicuro usa 78 e segnalalo nel campo note. 4) startup = true se l''attività
            è aperta da meno di 5 anni (anno corrente - anno apertura < 5) e l''aliquota agevolata 5% è plausibile; altrimenti
            15%. 5) Chiama calc_tax con revenue, coefficient_pct, cassa, startup (e contrib_pct per cassa_privata se noto,
            reduction35 se applicabile). 6) Salva con save_position UN solo record per l''anno (campo year come chiave): year,
            revenue_ytd, taxable_income, tax_due, contributions_due, set_aside, set_aside_pct, threshold_remaining, threshold_used_pct,
            rate, note, updated (data di oggi), consultant_email copiato dal profilo. 7) Salva il calendario con save_deadline,
            un record per scadenza con campo key unico (es. 2026-11-30-acconto-2) e aggiornando quelli esistenti (leggili
            con read_deadlines): saldo imposta sostitutiva e contributi al 30 giugno (o 30 luglio con maggiorazione), primo
            acconto 30 giugno/luglio (40%), secondo acconto 30 novembre (60%), rate INPS fisse per artigiani e commercianti
            (16 maggio, 20 agosto, 16 novembre, 16 febbraio). Campi: key, title, kind (acconto|saldo|inps), due_date (YYYY-MM-DD),
            amount (euro, 2 decimali), status open, consultant_email. Non toccare le scadenze con status paid.

            Usa solo cifre prodotte da calc_tax; non inventare. Sono stime: nel campo note ricorda di verificare con il commercialista.
            Concludi con un riepilogo di due righe.'
          mcp_servers: []
    appTools:
    - name: read_clients
      description: Legge il profilo fiscale del cliente (ATECO, anno apertura, cassa, fatturato previsto, commercialista)
      action: read
      collection: clients
      scope: user
    - name: read_invoices
      description: Legge le fatture registrate dal cliente
      action: read
      collection: invoices
      scope: user
    - name: read_deadlines
      description: Legge le scadenze del cliente
      action: read
      collection: deadlines
      scope: user
    - name: calc_tax
      description: Calcola imponibile forfettario, contributi, imposta sostitutiva, accantonamento e soglia residua
      action: call
      slot: forfettario_calc
    - name: save_position
      description: Salva la posizione fiscale dell'anno del cliente (un record per anno)
      action: write
      collection: positions
      scope: user
    - name: save_deadline
      description: Salva o aggiorna una scadenza del cliente
      action: write
      collection: deadlines
      scope: user
    goalTemplate: Ricalcola la posizione fiscale e le scadenze di {user} al {date}.
    output: markdown
    limits:
      maxTurns: 14
      maxBudgetUsd: 0.4
  - key: assistant
    role: helper
    description: Risponde in chat alle domande fiscali sulla base della documentazione dell'Agenzia delle Entrate e passa
      i casi complessi al commercialista.
    profile:
      inline:
        display_name: PartitaSerena - assistente fiscale
        chat_mode: true
        crews:
        - id: assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''assistente fiscale di PartitaSerena per liberi professionisti in regime forfettario. Rispondi
            in italiano, in modo chiaro e breve.

            Base delle risposte: la documentazione ufficiale dell''Agenzia delle Entrate (guide sul regime forfettario, circolari,
            risoluzioni, FAQ su agenziaentrate.gov.it) e l''INPS per i contributi. Usa gli strumenti WebRobot per leggere
            le pagine ufficiali pertinenti e cita sempre la fonte (titolo e link). Per la posizione del cliente usa read_clients,
            read_positions e read_deadlines: non inventare mai cifre.

            PASSA AL COMMERCIALISTA (open_escalation) quando la domanda è complessa o ad alto rischio: superamento soglie,
            uscita dal regime, cause di esclusione, operazioni estere, rapporti con ex datori di lavoro, accertamenti o cartelle,
            o se non trovi una fonte ufficiale chiara. Compila question (la domanda completa con il contesto), summary (una
            riga), status open e consultant_email (dal profilo del cliente). Poi dì al cliente che il commercialista assegnato
            risponderà entro 24 ore e riceverà una email. Se non c''è un commercialista assegnato, dillo.

            Non dare consulenza legale o fiscale come certezza su casi specifici; l''invio telematico delle dichiarazioni
            lo fa sempre il professionista abilitato.'
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
    mcpServers:
    - name: webrobot
      url: https://mcp-full.webrobot.eu/mcp
      allow: all
    appTools:
    - name: read_clients
      description: Legge il profilo fiscale del cliente (ATECO, anno apertura, cassa, fatturato previsto, commercialista)
      action: read
      collection: clients
      scope: user
    - name: read_positions
      description: Legge la posizione fiscale calcolata del cliente
      action: read
      collection: positions
      scope: user
    - name: read_deadlines
      description: Legge le scadenze del cliente
      action: read
      collection: deadlines
      scope: user
    - name: open_escalation
      description: Passa una domanda complessa al commercialista assegnato
      action: write
      collection: escalations
      scope: user
    goalTemplate: 'Conversazione finora:

      {history}


      Nuovo messaggio del cliente: {message}

      Rispondi in italiano.'
    output: markdown
    limits:
      maxTurns: 10
      maxBudgetUsd: 0.4
  inputForm:
    title: Nuova bozza di dichiarazione
    fields:
    - name: year
      type: select
      required: true
      label: Anno d'imposta
      options:
      - value: '2025'
        label: 2025 (dichiarazione 2026)
      - value: '2026'
        label: 2026 (dichiarazione 2027, provvisoria)
    - name: notes
      type: textarea
      maxLength: 600
      label: Note per il commercialista (facoltative)
      help: Es. spese particolari, cambi di attività, acconti già versati
  data:
    collections:
    - name: clients
      description: Profilo fiscale di ogni cliente
      ownedBy: user
      fields:
      - name: name
        type: text
        required: true
        label: Nome e cognome
      - name: ateco
        type: text
        required: true
        label: Codice ATECO
        help: Es. 69.20.11
      - name: opening_year
        type: number
        required: true
        label: Anno di apertura partita IVA
      - name: cassa
        type: select
        required: true
        label: Cassa previdenziale
        options:
        - value: gestione_separata
          label: Gestione separata INPS
        - value: artigiani
          label: Artigiani INPS
        - value: commercianti
          label: Commercianti INPS
        - value: cassa_privata
          label: Cassa professionale privata
      - name: expected_revenue
        type: number
        required: true
        label: Fatturato previsto annuo (€)
      - name: consultant_email
        type: email
        label: Commercialista assegnato
      access:
      - role: consultant
        where:
          consultant_email: '{user.email}'
        can:
        - read
    - name: invoices
      description: Fatture emesse registrate dal cliente
      ownedBy: user
      fields:
      - name: number
        type: text
        label: Numero fattura
      - name: date
        type: date
        required: true
        label: Data
      - name: client_name
        type: text
        required: true
        label: Cliente
      - name: amount
        type: number
        required: true
        label: Importo (€)
    - name: positions
      description: Posizione fiscale annuale calcolata (una per anno)
      ownedBy: user
      fields:
      - name: year
        type: number
        label: Anno
      - name: revenue_ytd
        type: number
        label: Ricavi
      - name: taxable_income
        type: number
        label: Reddito imponibile
      - name: tax_due
        type: number
        label: Imposta sostitutiva
      - name: contributions_due
        type: number
        label: Contributi
      - name: set_aside
        type: number
        label: Da accantonare
      - name: set_aside_pct
        type: number
        label: '% da accantonare'
      - name: threshold_remaining
        type: number
        label: Soglia residua
      - name: threshold_used_pct
        type: number
        label: '% soglia usata'
      - name: rate
        type: number
        label: Aliquota %
      - name: note
        type: textarea
        label: Note
      - name: updated
        type: date
        label: Aggiornato
      - name: consultant_email
        type: email
        label: Commercialista
      access:
      - role: consultant
        where:
          consultant_email: '{user.email}'
        can:
        - read
    - name: deadlines
      description: Calendario scadenze personali
      ownedBy: user
      fields:
      - name: key
        type: text
        label: Chiave
      - name: title
        type: text
        label: Scadenza
      - name: kind
        type: select
        label: Tipo
        options:
        - value: acconto
          label: Acconto
        - value: saldo
          label: Saldo
        - value: inps
          label: INPS
      - name: due_date
        type: date
        label: Data
      - name: amount
        type: number
        label: Importo (€)
      - name: status
        type: select
        label: Stato
        options:
        - value: open
          label: Da pagare
        - value: paid
          label: Pagata
      - name: consultant_email
        type: email
        label: Commercialista
      access:
      - role: consultant
        where:
          consultant_email: '{user.email}'
        can:
        - read
    - name: escalations
      description: Domande passate dalla chat al commercialista
      ownedBy: user
      retentionDays: 730
      fields:
      - name: summary
        type: text
        label: Sintesi
      - name: question
        type: textarea
        label: Domanda
      - name: status
        type: select
        label: Stato
        options:
        - value: open
          label: In attesa
        - value: answered
          label: Risposta data
      - name: answer
        type: textarea
        label: Risposta del commercialista
      - name: consultant_email
        type: email
        label: Commercialista
      access:
      - role: consultant
        where:
          consultant_email: '{user.email}'
        can:
        - read
        - write
  views:
  - key: home
    type: page
    title: PartitaSerena
    nav: false
    sections:
    - type: hero
      layout: stack
      band: true
      eyebrow: Regime forfettario
      title: Il commercialista online che ti dice **quanto accantonare**, sempre.
      text: Registra le fatture, vedi in tempo reale tasse, contributi e soglia dei ricavi. Scadenze con promemoria via email,
        chat fiscale e un commercialista vero per i casi complessi.
      actions:
      - label: Inizia ora
        href: /login
        style: primary
      - label: Come funziona
        href: '#come-funziona'
        style: ghost
    - type: steps
      id: come-funziona
      title: Come funziona
      items:
      - title: Iscriviti
        text: Indichi codice ATECO, anno di apertura, cassa previdenziale e fatturato previsto.
      - title: Registra le fatture
        text: 'Importo, cliente e data: il calcolo si aggiorna subito.'
      - title: Ricevi i promemoria
        text: Dieci giorni prima di ogni scadenza ti scriviamo con l'importo da versare.
      - title: Chiedi in chat
        text: Risposte basate sulla documentazione dell'Agenzia delle Entrate; i casi complessi vanno al tuo commercialista.
    - type: cards
      id: cosa-include
      title: Cosa include l'abbonamento annuale
      items:
      - title: Posizione in tempo reale
        text: Imposta sostitutiva, contributi, quota da accantonare e soglia residua degli 85.000 €.
        badge: 📊
      - title: Calendario scadenze
        text: Acconti, saldi e contributi INPS personali, con email di promemoria.
        badge: 📅
      - title: Chat fiscale
        text: Risposte con fonti ufficiali; il commercialista assegnato risponde entro 24 ore ai casi complessi.
        badge: 💬
      - title: Bozza della dichiarazione
        text: Preparata dall'app, rivista e inviata in telematico sempre dal professionista abilitato.
        badge: 📝
    - type: note
      content: PartitaSerena fornisce stime a supporto delle decisioni. Gli importi sono indicativi e vanno confermati dal
        commercialista. L'invio telematico delle dichiarazioni è sempre effettuato dal professionista abilitato. Vedi ogni
        dato solo tu e il tuo commercialista.
  - key: onboarding
    type: form
    title: Il tuo profilo
    collection: clients
    fields:
    - name
    - ateco
    - opening_year
    - cassa
    - expected_revenue
    submit:
      label: Salva profilo
      message: Profilo salvato. Calcolo la tua posizione.
      redirect: position
    edit: true
    roles:
    - user
  - key: new_invoice
    type: form
    title: Registra fattura
    collection: invoices
    fields:
    - number
    - date
    - client_name
    - amount
    submit:
      label: Registra
      message: Fattura registrata. La posizione si sta aggiornando.
      redirect: position
    edit: true
    roles:
    - user
  - key: position
    type: page
    title: La mia posizione
    roles:
    - user
    sections:
    - type: data
      id: kpi-posizione
      title: Quanto devi e quanto resta
      source: collection:positions
      display: kpi
      sort:
        field: year
        dir: desc
      limit: 1
      kpis:
      - label: Ricavi dell'anno
        agg: last
        field: revenue_ytd
        format: money
      - label: Imposta sostitutiva
        agg: last
        field: tax_due
        format: money
      - label: Contributi
        agg: last
        field: contributions_due
        format: money
      - label: Da accantonare
        agg: last
        field: set_aside
        format: money
      - label: Soglia residua (85.000 €)
        agg: last
        field: threshold_remaining
        format: money
      - label: Soglia usata
        agg: last
        field: threshold_used_pct
        format: percent
      empty: Registra la prima fattura per vedere la tua posizione.
    - type: data
      title: Prossime scadenze
      source: collection:deadlines
      display: table
      fields:
      - key: due_date
        label: Data
        format: date
      - key: title
        label: Scadenza
      - key: amount
        label: Importo
        format: money
      - key: status
        label: Stato
        format: badge
      filters:
      - field: status
        op: '='
        value: open
      sort:
        field: due_date
        dir: asc
      limit: 12
      empty: 'Nessuna scadenza ancora: completa il profilo.'
    - type: data
      title: Le mie fatture
      source: collection:invoices
      display: table
      fields:
      - key: date
        label: Data
        format: date
      - key: number
        label: Numero
      - key: client_name
        label: Cliente
      - key: amount
        label: Importo
        format: money
      sort:
        field: date
        dir: desc
      limit: 50
      empty: Nessuna fattura registrata.
  - key: deadlines_list
    type: table
    title: Scadenze
    source: collection:deadlines
    columns:
    - due_date
    - title
    - amount
    - status
    export: true
    roles:
    - user
  - key: chat
    type: chat
    title: Chiedi al commercialista
    source: agent:assistant
    placeholder: Scrivi la tua domanda fiscale…
    examples:
    - Quando devo pagare il secondo acconto?
    - Cosa succede se supero gli 85.000 euro?
    - Posso dedurre i contributi INPS?
    roles:
    - user
  - key: my_questions
    type: list
    title: Le mie richieste al commercialista
    source: collection:escalations
    columns:
    - summary
    - status
    - answer
    roles:
    - user
  - key: new_draft
    type: new_run
    title: Bozza dichiarazione
    roles:
    - user
  - key: drafts_history
    type: history
    title: Le mie bozze
    source: run
    roles:
    - user
  - key: draft_report
    type: report
    source: run
    printable: true
    nav: false
  - key: account
    type: account
    title: Abbonamento
    roles:
    - user
  - key: clients_list
    type: table
    title: I miei clienti
    source: collection:clients
    columns:
    - name
    - ateco
    - opening_year
    - cassa
    - expected_revenue
    roles:
    - consultant
  - key: clients_positions
    type: table
    title: Posizioni dei clienti
    source: collection:positions
    columns:
    - year
    - revenue_ytd
    - tax_due
    - contributions_due
    - set_aside
    - threshold_remaining
    roles:
    - consultant
  - key: escalations_inbox
    type: list
    title: Domande da gestire
    source: collection:escalations
    columns:
    - summary
    - question
    - status
    roles:
    - consultant
  - key: answer
    type: form
    title: Rispondi al cliente
    collection: escalations
    fields:
    - status
    - answer
    submit:
      label: Invia risposta
      message: Risposta inviata al cliente.
      redirect: escalations_inbox
    edit: true
    roles:
    - consultant
    nav: false
  - key: approvals
    type: approvals
    title: Bozze da rivedere
    approvals:
    - draft_review
    roles:
    - consultant
  - key: admin_clients
    type: table
    title: Clienti (assegnazioni)
    source: collection:clients
    columns:
    - name
    - ateco
    - consultant_email
    roles:
    - admin
  - key: assign
    type: form
    title: Assegna commercialista
    collection: clients
    fields:
    - consultant_email
    edit: true
    submit:
      label: Assegna
      message: Commercialista assegnato.
    roles:
    - admin
    nav: false
  triggers:
  - key: invoice_recalc
    description: Ricalcola posizione e scadenze a ogni nuova fattura
    'on':
      collection: invoices
      op: insert
    start:
      agent: engine
    goal: Nuova fattura {record.number} del {record.date}, cliente {record.client_name}, importo {record.amount} euro. Ricalcola
      la posizione fiscale e aggiorna le scadenze.
  - key: profile_recalc
    description: Ricalcola quando il profilo cambia
    'on':
      collection: clients
      op: any
    start:
      agent: engine
    goal: Il profilo del cliente è stato creato o modificato (ATECO {record.ateco}, cassa {record.cassa}). Ricalcola posizione
      e calendario scadenze.
  - key: deadline_reminder
    description: Promemoria dieci giorni prima di ogni scadenza
    'on':
      date:
        collection: deadlines
        field: due_date
        offsetDays: -10
        hour: 8
    notify:
      to: owner
      subject: 'Promemoria: {record.title} il {record.due_date}'
      body: 'Ciao, tra dieci giorni, il {record.due_date}, scade: {record.title}. Importo stimato da versare: {record.amount}
        euro. Stima indicativa: per dubbi scrivi al tuo commercialista dalla chat di PartitaSerena.'
      link: position
  - key: escalation_new
    description: Avvisa il commercialista di una nuova domanda
    'on':
      collection: escalations
      op: insert
      where:
        status: open
    notify:
      to: record.consultant_email
      subject: 'Nuova domanda di un cliente: {record.summary}'
      body: 'Un tuo cliente ha una domanda che richiede il tuo intervento (risposta entro 24 ore):


        {record.question}'
      link: escalations_inbox
  - key: escalation_answered
    description: Avvisa il cliente della risposta
    'on':
      collection: escalations
      op: update
      where:
        status: answered
    notify:
      to: owner
      subject: Il tuo commercialista ha risposto
      body: 'Hai ricevuto una risposta alla tua domanda: {record.summary}


        {record.answer}'
      link: my_questions
  - key: draft_approved
    description: La bozza è stata approvata dal commercialista
    'on':
      approval: draft_review
      decision: approved
    notify:
      to: owner
      subject: La tua bozza di dichiarazione è stata rivista
      body: Il commercialista ha rivisto e approvato la bozza della dichiarazione. L'invio telematico sarà effettuato dal
        professionista abilitato.
      link: drafts_history
  approvals:
  - key: draft_review
    title: Revisione bozza dichiarazione dei redditi
    description: Il commercialista assegnato rivede la bozza prima dell'invio telematico, che resta a suo carico.
    role: consultant
    decidedBy: role
    timeoutMinutes: 10080
    onTimeout: reject
  slots:
  - key: forfettario_calc
    description: Calcolo stimato di imponibile, contributi, imposta sostitutiva, accantonamento e soglia per il regime forfettario
    timeoutMs: 3000
    example:
      args:
        revenue: 40000
        coefficient_pct: 78
        cassa: gestione_separata
        startup: true
    code: "def main(input):\n    a = input.get('args') or {}\n    rev = float(a.get('revenue', 0) or 0)\n    coef = float(a.get('coefficient_pct',\
      \ 78) or 78) / 100.0\n    cassa = a.get('cassa', 'gestione_separata')\n    startup = bool(a.get('startup', False))\n\
      \    rate = 0.05 if startup else 0.15\n    imp = rev * coef\n    if cassa == 'gestione_separata':\n        contr = imp\
      \ * 0.2607\n    elif cassa in ('artigiani', 'commercianti'):\n        pct = 0.24 if cassa == 'artigiani' else 0.2448\n\
      \        minimale = 18555.0\n        fixed = 4515.0\n        contr = fixed + max(imp - minimale, 0.0) * pct if imp >\
      \ 0 else 0.0\n        if a.get('reduction35'):\n            contr *= 0.65\n    else:\n        contr = imp * float(a.get('contrib_pct',\
      \ 0) or 0) / 100.0\n    taxable = max(imp - contr, 0.0)\n    tax = taxable * rate\n    set_aside = tax + contr\n   \
      \ threshold = 85000.0\n    remaining = threshold - rev\n    acc_tax = 0.0\n    acc1 = acc2 = 0.0\n    if tax > 51.65:\n\
      \        acc1 = round(tax * 0.40, 2)\n        acc2 = round(tax * 0.60, 2)\n    return {\n        'taxable_income': round(taxable,\
      \ 2),\n        'gross_income': round(imp, 2),\n        'tax_rate_pct': rate * 100,\n        'tax_due': round(tax, 2),\n\
      \        'contributions_due': round(contr, 2),\n        'set_aside': round(set_aside, 2),\n        'set_aside_pct':\
      \ round(set_aside / rev * 100, 1) if rev > 0 else 0,\n        'threshold_remaining': round(remaining, 2),\n        'threshold_used_pct':\
      \ round(rev / threshold * 100, 1),\n        'exceeds_100k': rev > 100000,\n        'tax_acconto_1': acc1,\n        'tax_acconto_2':\
      \ acc2,\n        'note': 'Stima indicativa: valori contributivi da verificare con il commercialista.'\n    }\n"
  billing:
    modes:
    - subscription
    currency: eur
    costs:
      agent:assistant:
        requiresPlan: annual
      agent:drafter:
        requiresPlan: annual
    plans:
    - key: annual
      price: 249
      interval: year
      label: PartitaSerena annuale
      includes:
      - Posizione fiscale in tempo reale
      - Calendario scadenze con promemoria email
      - Chat fiscale con passaggio al commercialista
      - Bozza della dichiarazione dei redditi
  notifications:
    emailOnRunDone: true
  extensions:
  - key: consultant_assignment
    description: L'assegnazione del commercialista a ogni cliente è fatta da un amministratore (vista 'Assegna commercialista');
      non è ancora automatica o per carico di lavoro.
  - key: telematic_filing
    description: 'L''invio telematico della dichiarazione non è fatto dall''app: la bozza approvata viene trasmessa dal professionista
      abilitato con i propri strumenti.'
  - key: response_sla_24h
    description: Il termine di 24 ore per la risposta del commercialista è un impegno di servizio, non applicato dal sistema;
      il promemoria al professionista è una email alla creazione della richiesta.
