apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: taxiinsieme
  displayName: TaxiInsieme
  tagline:
    it: Taxi con prezzo massimo garantito, e se condividi paghi meno.
    en: Taxi with a guaranteed maximum price, and you pay less if you share.
  description:
    it: 'Inserisci partenza, destinazione e orario: ricevi il prezzo massimo garantito calcolato sulle tariffe comunali e
      un prezzo ridotto se accetti di condividere la corsa. Le richieste compatibili vengono raggruppate e passate alle cooperative
      taxi partner.'
    en: 'Enter pickup, destination and time: get a guaranteed maximum price based on published municipal fares and a reduced
      price if you agree to share the ride. Compatible requests are grouped and sent to partner taxi cooperatives.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#16202e'
      accent: '#f2b705'
      background: '#fbfaf6'
      foreground: '#16202e'
    fonts:
      body: Inter
      display: Poppins
    wordmark:
    - text: Taxi
      color: primary
    - text: Insieme
      color: accent
    buttonShape: rounded
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    cta:
      label:
        it: Prenota
        en: Book
      href: /v/new_ride
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
    - key: coop
      label:
        it: Cooperativa taxi
        en: Taxi cooperative
      assignedBy: derived
      from: collection:cooperatives.email
  limits:
  - action: agent:quoter
    per: user
    max: 20
    window: day
    roles:
    - user
  agents:
  - key: quoter
    role: main
    description: Geocodes the addresses, measures the distance, applies the municipal fare and computes the maximum and the
      shared price.
    profile:
      inline:
        display_name: TaxiInsieme quoter
        crews:
        - id: quoter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 14
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the quoting assistant of TaxiInsieme, a taxi service with a guaranteed maximum price. Steps:
            1) call geocode_place for the pickup and for the destination (Nominatim: query q=<address>&format=json&limit=1;
            take lat and lon of the first result; if none, ask the user to refine the address and stop without a JSON block).
            2) call route_distance with path <lonA>,<latA>;<lonB>,<latB> and query overview=false; distance is in metres in
            routes[0].distance: convert to km. 3) call read_tariffs and pick the record whose city matches the city of the
            pickup; if there is no tariff for that city, say clearly that the city is not covered yet and stop without a JSON
            block. 4) call fare_calc with distance_km, base, per_km, min_fare, night_surcharge, night (true if the ride time
            is between 22:00 and 06:00), discount_pct (default 25), and the four coordinates; it returns max_price, shared_price
            and bearing. Never compute prices yourself and never invent figures. Write the report: a level-1 title "# <pickup>
            → <destination>", then ## Il tuo preventivo (distance, guaranteed maximum price, shared price if the user accepts
            sharing), ## Come funziona la condivisione (a shared ride may take a few minutes more; the price you pay never
            exceeds the maximum), ## Fonte tariffe (city and source_url of the tariff). Then end with ONE fenced ```json block
            with exactly these keys: pickup, destination, ride_date, ride_time, share (boolean), city, distance_km, max_price,
            shared_price, bearing, pickup_lat, pickup_lon, dest_lat, dest_lon, contact_email, status (the string requested).
            Respect the Nominatim usage policy (one request at a time).'
          mcp_servers: []
    appTools:
    - name: geocode_place
      description: Geocode an address with Nominatim (query q, format=json, limit=1)
      action: http
      http:
        method: GET
        url: https://nominatim.openstreetmap.org/search
        attribution: © OpenStreetMap contributors, ODbL
    - name: route_distance
      description: Driving distance between two points with OSRM; path = lon,lat;lon,lat
      action: http
      http:
        method: GET
        url: https://router.project-osrm.org/route/v1/driving/
        allowPath: true
        attribution: OSRM, data © OpenStreetMap contributors, ODbL
    - name: read_tariffs
      description: Read the published municipal taxi tariffs
      action: read
      collection: tariffs
      scope: all
    - name: fare_calc
      description: Compute max price, shared price and bearing from distance and tariff
      action: call
      slot: fare_calc
    context:
    - key: email
      from: user.email
    goalTemplate: 'Pickup: {pickup}

      Destination: {destination}

      Date: {ride_date}, time: {ride_time}

      {?share}The user accepts sharing the ride with other passengers.{/share}{!share}The user does not want to share.{/share}

      User email (for contact_email): {email}

      Today is {date}. Write the report in the language with ISO code {lang}.'
    output: markdown+json
    writesTo:
      collection: rides
      parse: json_last
    limits:
      maxTurns: 14
      maxBudgetUsd: 0.4
  - key: dispatcher
    role: helper
    description: Groups compatible shared requests into trips for the cooperatives, and propagates acceptance to the passengers'
      requests.
    profile:
      inline:
        display_name: TaxiInsieme dispatcher
        crews:
        - id: dispatcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the dispatcher of TaxiInsieme. Two jobs. GROUPING: call read_pool and take the requests
            with status requested. Requests with share=true are compatible when: same city and ride_date, ride_time within
            15 minutes, pickup points within 1.5 km (use pickup_lat/lon), bearing difference under 30 degrees, at most 3 passengers
            per group. Create one trip per group (or per single request not shared or without a match) with write_trip: group_id
            (e.g. <ride_date>-<ride_time>-<n>), city, ride_date, ride_time, pickup, destination, passengers (count), total_price
            (sum of shared_price for a group, max_price for a single), shared (boolean), status open. Then call update_pool
            for each request in the group setting status grouped and group_id. Never merge requests that do not meet every
            rule. ACCEPTANCE: when told a trip was accepted, call read_pool, and for each request with that group_id call
            update_pool setting status accepted. Report briefly what you did with a level-1 title "# Dispatch <date>".'
    appTools:
    - name: read_pool
      description: Read the ride requests pool
      action: read
      collection: ride_requests
      scope: all
    - name: update_pool
      description: Update a ride request in the pool
      action: write
      collection: ride_requests
      scope: all
    - name: write_trip
      description: Create a trip in the cooperatives' queue
      action: write
      collection: trips
      scope: all
    goalTemplate: Run the grouping of the pending requests. Today is {date}.
    output: markdown
    limits:
      maxTurns: 25
      maxBudgetUsd: 0.6
  inputForm:
    title:
      it: Nuova corsa
      en: New ride
    fields:
    - name: pickup
      type: text
      required: true
      label:
        it: Partenza
        en: Pickup
      help:
        it: Indirizzo completo con città
        en: Full address with city
    - name: destination
      type: text
      required: true
      label:
        it: Destinazione
        en: Destination
    - name: ride_date
      type: date
      required: true
      label:
        it: Data
        en: Date
    - name: ride_time
      type: text
      required: true
      label:
        it: Orario (HH:MM)
        en: Time (HH:MM)
    - name: share
      type: boolean
      default: true
      label:
        it: Accetto di condividere la corsa (prezzo ridotto)
        en: I agree to share the ride (reduced price)
  data:
    collections:
    - name: rides
      ownedBy: user
      description: Each user's own rides and quotes
      retentionDays: 730
      fields:
      - name: pickup
        type: text
      - name: destination
        type: text
      - name: ride_date
        type: date
      - name: ride_time
        type: text
      - name: share
        type: boolean
      - name: city
        type: text
      - name: distance_km
        type: number
      - name: max_price
        type: number
      - name: shared_price
        type: number
      - name: bearing
        type: number
      - name: pickup_lat
        type: number
      - name: pickup_lon
        type: number
      - name: dest_lat
        type: number
      - name: dest_lon
        type: number
      - name: contact_email
        type: email
      - name: status
        type: select
        options:
        - requested
        - grouped
        - accepted
        - paid
        - cancelled
    - name: tariffs
      ownedBy: shared
      description: Published municipal taxi tariffs
      fields:
      - name: city
        type: text
        required: true
      - name: base
        type: number
        required: true
      - name: per_km
        type: number
        required: true
      - name: min_fare
        type: number
        required: true
      - name: night_surcharge
        type: number
      - name: source_url
        type: url
    - name: ride_requests
      ownedBy: org
      description: Back-office pool of ride requests for grouping
      retentionDays: 90
      fields:
      - name: pickup
        type: text
      - name: destination
        type: text
      - name: ride_date
        type: date
      - name: ride_time
        type: text
      - name: share
        type: boolean
      - name: city
        type: text
      - name: distance_km
        type: number
      - name: max_price
        type: number
      - name: shared_price
        type: number
      - name: bearing
        type: number
      - name: pickup_lat
        type: number
      - name: pickup_lon
        type: number
      - name: dest_lat
        type: number
      - name: dest_lon
        type: number
      - name: contact_email
        type: email
      - name: status
        type: select
        options:
        - requested
        - grouped
        - accepted
      - name: group_id
        type: text
    - name: trips
      ownedBy: org
      description: Queue of trips for partner cooperatives
      retentionDays: 365
      access:
      - role: coop
        can:
        - read
        - write
      fields:
      - name: group_id
        type: text
      - name: city
        type: text
      - name: ride_date
        type: date
      - name: ride_time
        type: text
      - name: pickup
        type: text
      - name: destination
        type: text
      - name: passengers
        type: number
      - name: total_price
        type: number
      - name: shared
        type: boolean
      - name: status
        type: select
        options:
        - open
        - accepted
      - name: coop_email
        type: email
    - name: cooperatives
      ownedBy: org
      description: Partner taxi cooperatives
      fields:
      - name: name
        type: text
        required: true
      - name: email
        type: email
        required: true
      - name: city
        type: text
  views:
  - key: home
    type: page
    nav: false
    title: TaxiInsieme
    sections:
    - type: hero
      title:
        it: Taxi con **prezzo massimo garantito**. Condividi e paghi meno.
        en: Taxi with a **guaranteed maximum price**. Share and pay less.
      text:
        it: Inserisci partenza, destinazione e orario. Calcoliamo il massimo che pagherai dalle tariffe comunali pubblicate
          e ti proponiamo un prezzo ridotto se condividi la corsa.
        en: Enter pickup, destination and time. We compute the most you will pay from published municipal fares and offer
          a reduced price if you share the ride.
      actions:
      - label:
          it: Prenota una corsa
          en: Book a ride
        href: /v/new_ride
        style: primary
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Preventivo
          en: Quote
        text:
          it: Distanza e tariffa comunale danno il prezzo massimo garantito.
          en: Distance and municipal fare give the guaranteed maximum price.
        badge: 💶
      - title:
          it: Condivisione
          en: Sharing
        text:
          it: Le richieste sulla stessa direzione vengono raggruppate.
          en: Requests heading the same way are grouped.
        badge: 🚕
      - title:
          it: Cooperative partner
          en: Partner cooperatives
        text:
          it: Una cooperativa accetta la corsa dalla sua coda e ricevi la conferma via email.
          en: A cooperative accepts the trip from its queue and you get an email confirmation.
        badge: ✉️
    - type: note
      content:
        it: Il prezzo massimo si basa sulle tariffe comunali pubblicate; il prezzo condiviso non supera mai il massimo. Commissione
          per corsa inclusa nel prezzo.
        en: The maximum price is based on published municipal fares; the shared price never exceeds the maximum. A per-ride
          commission is included in the price.
  - key: new_ride
    type: new_run
    title:
      it: Nuova corsa
      en: New ride
    roles:
    - user
    - admin
  - key: rides
    type: table
    title:
      it: Le mie corse
      en: My rides
    source: collection:rides
    columns:
    - ride_date
    - ride_time
    - pickup
    - destination
    - max_price
    - shared_price
    - status
    roles:
    - user
    - admin
  - key: history
    type: history
    title:
      it: Preventivi
      en: Quotes
    source: run
    roles:
    - user
    - admin
  - key: ride
    type: report
    source: run
    printable: true
    nav: false
  - key: account
    type: account
    title:
      it: Pagamenti
      en: Payments
    roles:
    - user
  - key: queue
    type: table
    title:
      it: Coda corse
      en: Trip queue
    source: collection:trips
    columns:
    - ride_date
    - ride_time
    - city
    - pickup
    - destination
    - passengers
    - total_price
    - status
    roles:
    - coop
    - admin
  - key: accept
    type: form
    title:
      it: Accetta corsa
      en: Accept trip
    collection: trips
    fields:
    - status
    - coop_email
    edit: true
    submit:
      label:
        it: Conferma
        en: Confirm
      message:
        it: Corsa accettata
        en: Trip accepted
      redirect: queue
    roles:
    - coop
    - admin
    nav: false
  - key: tariffs_admin
    type: form
    title:
      it: Tariffe comunali
      en: Municipal tariffs
    collection: tariffs
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Tariffa salvata
        en: Tariff saved
    roles:
    - admin
  slots:
  - key: fare_calc
    description: Maximum price, shared price and bearing from distance and tariff
    timeoutMs: 2000
    code: "import math\n\ndef main(input):\n    a = input.get('args') or input\n    d = float(a.get('distance_km') or 0)\n\
      \    base = float(a.get('base') or 0)\n    per_km = float(a.get('per_km') or 0)\n    min_fare = float(a.get('min_fare')\
      \ or 0)\n    night = a.get('night') in (True, 'true', 'True', 1)\n    sur = float(a.get('night_surcharge') or 0) if\
      \ night else 0.0\n    disc = float(a.get('discount_pct') if a.get('discount_pct') is not None else 25)\n    raw = max(min_fare,\
      \ base + per_km * d) + sur\n    max_price = math.ceil(raw * 2) / 2\n    shared = math.floor(max_price * (1 - disc /\
      \ 100) * 2) / 2\n    bearing = None\n    try:\n        la1 = math.radians(float(a['pickup_lat'])); la2 = math.radians(float(a['dest_lat']))\n\
      \        dl = math.radians(float(a['dest_lon']) - float(a['pickup_lon']))\n        y = math.sin(dl) * math.cos(la2)\n\
      \        x = math.cos(la1) * math.sin(la2) - math.sin(la1) * math.cos(la2) * math.cos(dl)\n        bearing = round((math.degrees(math.atan2(y,\
      \ x)) + 360) % 360, 1)\n    except Exception:\n        pass\n    return {'max_price': max_price, 'shared_price': shared,\
      \ 'bearing': bearing}\n"
    example:
      args:
        distance_km: 8.2
        base: 3.5
        per_km: 1.2
        min_fare: 9
        night_surcharge: 3
        night: false
        pickup_lat: 45.46
        pickup_lon: 9.19
        dest_lat: 45.5
        dest_lon: 9.25
  schedules:
  - agent: dispatcher
    action: run
    cron: 0 5-21 * * *
    owner: app
    goal: Group the pending shared ride requests into trips for the cooperatives.
  triggers:
  - key: ride_received
    'on':
      collection: rides
      op: insert
    notify:
      to: owner
      subject:
        it: 'TaxiInsieme: richiesta ricevuta'
        en: 'TaxiInsieme: request received'
      body:
        it: 'Abbiamo ricevuto la tua richiesta {record.pickup} → {record.destination} per il {record.ride_date} alle {record.ride_time}.
          Prezzo massimo garantito: {record.max_price} EUR. Ti scriveremo quando una cooperativa la accetta.'
        en: 'We received your request {record.pickup} → {record.destination} on {record.ride_date} at {record.ride_time}.
          Guaranteed maximum price: {record.max_price} EUR. We will email you when a cooperative accepts it.'
      link: rides
  - key: ride_to_pool
    'on':
      collection: rides
      op: insert
    write:
      collection: ride_requests
  - key: trip_accepted
    'on':
      collection: trips
      op: update
      where:
        status: accepted
    start:
      agent: dispatcher
    goal: Trip {record.group_id} was accepted by a cooperative. Set status accepted on every request in the pool with this
      group_id.
    asUser: false
  - key: passenger_confirmed
    'on':
      collection: ride_requests
      op: update
      where:
        status: accepted
    notify:
      to: record.contact_email
      subject:
        it: 'TaxiInsieme: corsa confermata'
        en: 'TaxiInsieme: ride confirmed'
      body:
        it: La tua corsa {record.pickup} → {record.destination} del {record.ride_date} alle {record.ride_time} è stata accettata
          da una cooperativa taxi. Il prezzo non supererà {record.max_price} EUR. Paga con carta dal tuo account.
        en: Your ride {record.pickup} → {record.destination} on {record.ride_date} at {record.ride_time} was accepted by a
          taxi cooperative. The price will not exceed {record.max_price} EUR. Pay by card from your account.
  billing:
    modes:
    - per_transaction
    currency: eur
    transactionFeePct: 10
    sellers: collection:cooperatives
  notifications:
    emailOnRunDone: false
  egress:
    hosts:
    - nominatim.openstreetmap.org
    - router.project-osrm.org
    notes: Nominatim (OSM, ODbL) for geocoding within its usage policy; OSRM public router (OSM data, ODbL) for driving distance.
      A busy production app should move to its own geocoding/routing provider.
  extensions:
  - key: card_checkout_per_ride
    description: Card payment of each accepted ride with the per-ride commission is declared via per_transaction billing;
      a dedicated checkout step per ride and the update of the user's ride status after cooperative acceptance may need custom
      logic.
