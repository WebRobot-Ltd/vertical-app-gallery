apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: sapereinterno
  displayName: SapereInterno
  tagline:
    it: Le risposte dell'azienda, con la fonte, per ogni dipendente.
    en: Your company's answers, with sources, for every employee.
  description:
    it: Assistente aziendale che risponde ai dipendenti usando manuali, procedure e FAQ interne, cita il documento fonte e
      inoltra all'esperto designato le domande dubbie o sensibili. La risposta dell'esperto arricchisce la base di conoscenza.
    en: Company assistant that answers employees from internal manuals, procedures and FAQs, cites the source document and
      forwards doubtful or sensitive questions to the designated expert. The expert's answer enriches the knowledge base.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#12355b'
      accent: '#1d8a8a'
      background: '#f6f8fa'
      foreground: '#16202b'
    fonts:
      body: Inter
      display: Manrope
    wordmark:
    - text: Sapere
      color: primary
    - text: Interno
      color: accent
    width: wide
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Sicurezza
        en: Security
      href: '#sicurezza'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin IT
      assignedBy: admin_emails
    - key: expert
      label:
        it: Esperto interno
        en: Internal expert
      assignedBy: admin
    - key: manager
      label:
        it: Responsabile
        en: Manager
      assignedBy: admin
    - key: user
      label:
        it: Dipendente
        en: Employee
      assignedBy: signup
  limits:
  - action: chat
    per: user
    max: 100
    window: day
    roles:
    - user
  agents:
  - key: assistant
    role: helper
    description: Answers employees from the knowledge base, cites sources, escalates doubtful or sensitive questions.
    profile:
      inline:
        display_name: SapereInterno assistant
        chat_mode: true
        crews:
        - id: assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are SapereInterno, the internal knowledge assistant of a company. Answer ONLY from the company''s
            documents (tool search_documents) and the validated expert answers (tool search_qa). Always search both before
            answering. Cite every claim with the source in the form [Document title] (and its link if present); for expert
            answers write [Expert answer, date]. Never invent policies, figures or procedures. Reply in the language of the
            employee. Be concise and practical: short answer first, then steps if needed. If the documents do not contain
            a reliable answer, or you are not sure, or the topic is sensitive (HR cases, disciplinary matters, salaries, legal,
            health, security incidents, compliance), do not guess: say you are forwarding the question to the designated expert,
            call create_escalation with the question (anonymised: no names of the employee) and short context, and log it
            with log_question status ''escalated''. For answered questions call log_question with status ''answered''; if
            you found nothing and did not escalate, status ''unanswered''. If a cited document looks older than 18 months
            or contradicts another, mention it to the employee and note it in log_question''s topic as ''obsolete:<document
            title>''. Do not reveal documents the employee is not meant to see: respect the ''area'' field and decline politely
            for areas marked restricted (hr_restricted, management).'
    goalTemplate: 'Conversation so far:

      {history}


      Employee ({user}) asks: {message}

      Today is {date}. Answer in the language with ISO code {lang}.'
    appTools:
    - name: search_documents
      description: Search the company documents (title, content, area, source link)
      action: search
      collection: documents
      scope: all
    - name: search_qa
      description: Search validated expert answers
      action: search
      collection: qa_knowledge
      scope: all
    - name: create_escalation
      description: Forward a question to the designated expert
      action: append
      collection: escalations
      scope: all
    - name: log_question
      description: Record the question and its outcome (answered, escalated, unanswered)
      action: append
      collection: questions_log
      scope: all
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.3
  - key: curator
    role: main
    description: Adds documents to the knowledge base and saves expert answers.
    profile:
      inline:
        display_name: SapereInterno curator
        crews:
        - id: curator
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You maintain the company knowledge base. If kind is ''document'': call add_document with title,
            area, source link, a clean text of the content (keep it faithful, do not add facts) and the date. If kind is ''expert_answer'':
            rewrite the expert''s answer as a clear, self-contained answer (same meaning, no names), call add_qa with question,
            answer, topic, then call close_escalation with the question. Finish with a short level-1 report starting with
            ''# Knowledge base updated'' that says what was saved. Never invent content.'
    goalTemplate: 'Kind: {kind_label}

      {?title}Title: {title}{/title}

      {?area}Area: {area_label}{/area}

      {?link}Link: {link}{/link}

      {?question}Question: {question}{/question}

      Text / answer:

      {text}

      Submitted by {user} on {date}. Language: {lang}.'
    appTools:
    - name: add_document
      description: Add or update a document
      action: write
      collection: documents
      scope: all
    - name: add_qa
      description: Save a validated expert answer
      action: write
      collection: qa_knowledge
      scope: all
    - name: close_escalation
      description: Mark an escalation as answered
      action: write
      collection: escalations
      scope: all
    output: markdown
    limits:
      maxTurns: 6
      maxBudgetUsd: 0.2
  - key: reporter
    role: scheduled
    description: 'Weekly report for managers: frequent unanswered questions and obsolete documents.'
    profile:
      inline:
        display_name: SapereInterno weekly reporter
        crews:
        - id: reporter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write the weekly knowledge report for managers. Read the last 7 days of questions_log (tool
            read_log), the open escalations (read_escalations) and the documents (read_documents). Start with ''# Knowledge
            report — week of <date>''. Sections: ## Most frequent unanswered questions (group similar ones, with counts and
            a suggested owner/area), ## Obsolete or conflicting documents to update (documents older than 18 months by updated_on,
            or flagged ''obsolete:'' in the log; say why), ## Escalations still open, ## Suggested actions. Add a chart block
            for question outcomes: ```chart {"type":"pie","title":"Outcomes","labels":["answered","escalated","unanswered"],"series":[{"name":"questions","values":[0,0,0]}]}```
            with real counts. Never invent figures; if data is thin, say so. Write in the requested language.'
    goalTemplate: 'Write this week''s report. Today is {date}. Language: Italian first, then a short English summary.'
    appTools:
    - name: read_log
      description: Questions asked and their outcome
      action: read
      collection: questions_log
      scope: all
    - name: read_escalations
      description: Escalated questions
      action: read
      collection: escalations
      scope: all
    - name: read_documents
      description: Documents with their dates
      action: read
      collection: documents
      scope: all
    writesTo:
      collection: weekly_reports
      parse: whole
      keyBy: week
    output: markdown
    limits:
      maxTurns: 6
      maxBudgetUsd: 0.4
  inputForm:
    title:
      it: Aggiorna la base di conoscenza
      en: Update the knowledge base
    fields:
    - name: kind
      type: select
      required: true
      label:
        it: Cosa vuoi aggiungere
        en: What to add
      options:
      - value: document
        label:
          it: Documento (testo incollato)
          en: Document (pasted text)
      - value: expert_answer
        label:
          it: Risposta di un esperto
          en: Expert answer
    - name: title
      type: text
      label:
        it: Titolo documento
        en: Document title
      visibleWhen: kind == 'document'
    - name: area
      type: select
      label:
        it: Area
        en: Area
      visibleWhen: kind == 'document'
      options:
      - value: general
        label:
          it: Generale
          en: General
      - value: it
        label: IT
      - value: hr
        label:
          it: HR
          en: HR
      - value: finance
        label:
          it: Amministrazione
          en: Finance
      - value: hr_restricted
        label:
          it: HR riservato
          en: HR restricted
    - name: link
      type: url
      label:
        it: Link al documento originale
        en: Link to the original
      visibleWhen: kind == 'document'
    - name: question
      type: textarea
      maxLength: 600
      label:
        it: Domanda
        en: Question
      visibleWhen: kind == 'expert_answer'
    - name: text
      type: textarea
      required: true
      maxLength: 20000
      label:
        it: Testo / risposta
        en: Text / answer
      help:
        it: 'Il caricamento di PDF e Word non è ancora disponibile: incolla il testo.'
        en: 'PDF and Word upload is not available yet: paste the text.'
  data:
    collections:
    - name: documents
      ownedBy: shared
      searchable: true
      description: Company documents indexed for the assistant
      fields:
      - name: title
        type: text
        required: true
      - name: area
        type: text
      - name: source_url
        type: url
      - name: content
        type: textarea
      - name: updated_on
        type: date
    - name: qa_knowledge
      ownedBy: shared
      searchable: true
      description: Validated answers from internal experts
      fields:
      - name: question
        type: textarea
      - name: answer
        type: textarea
      - name: topic
        type: text
      - name: answered_on
        type: date
    - name: escalations
      ownedBy: shared
      description: Questions forwarded to the internal expert (anonymised)
      fields:
      - name: question
        type: textarea
      - name: context
        type: textarea
      - name: status
        type: select
        options:
        - open
        - answered
      - name: asked_on
        type: date
    - name: questions_log
      ownedBy: shared
      description: Anonymised log of questions and outcomes
      fields:
      - name: question
        type: textarea
      - name: status
        type: select
        options:
        - answered
        - escalated
        - unanswered
      - name: topic
        type: text
      - name: asked_on
        type: date
    - name: weekly_reports
      ownedBy: app
      description: Weekly reports for managers
      fields:
      - name: week
        type: text
      - name: content
        type: textarea
  views:
  - key: home
    type: page
    nav: false
    title: SapereInterno
    sections:
    - type: hero
      eyebrow:
        it: Assistente aziendale
        en: Company assistant
      title:
        it: Chiedi all'azienda. Ottieni **risposte con la fonte**.
        en: Ask your company. Get **answers with sources**.
      text:
        it: Manuali, procedure e FAQ interne in una chat. Ogni risposta cita il documento; se la domanda è delicata, la gira
          all'esperto giusto.
        en: Manuals, procedures and FAQs in one chat. Every answer cites its document; sensitive questions go to the right
          expert.
      actions:
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Il responsabile IT carica la conoscenza
          en: IT adds the knowledge
        text:
          it: Testi di manuali, procedure e FAQ, con area e link all'originale.
          en: Text of manuals, procedures and FAQs, with area and link to the original.
      - title:
          it: I dipendenti chiedono
          en: Employees ask
        text:
          it: Risposte in italiano o inglese, sempre con la citazione.
          en: Answers in Italian or English, always cited.
      - title:
          it: L'esperto risponde e la base cresce
          en: The expert answers and the base grows
        text:
          it: Le risposte validate diventano conoscenza per tutti.
          en: Validated answers become knowledge for everyone.
      - title:
          it: Report settimanale
          en: Weekly report
        text:
          it: Domande senza risposta e documenti obsoleti per i responsabili.
          en: Unanswered questions and obsolete documents for managers.
    - type: cards
      id: sicurezza
      title:
        it: Sicurezza e licenza
        en: Security and licence
      items:
      - title:
          it: Accesso per area
          en: Access by area
        text:
          it: I documenti riservati non vengono mostrati ai dipendenti non autorizzati.
          en: Restricted documents are not shown to unauthorised employees.
      - title:
          it: Licenza annuale
          en: Annual licence
        text:
          it: Per fascia di dipendenti.
          en: By employee band.
    - type: note
      content:
        it: 'Le risposte si basano sui documenti aziendali: per decisioni critiche verifica la fonte citata.'
        en: 'Answers are based on company documents: for critical decisions check the cited source.'
  - key: chat
    type: chat
    title:
      it: Chiedi
      en: Ask
    source: agent:assistant
    roles:
    - user
    - expert
    - manager
    - admin
    placeholder:
      it: Es. Come richiedo le ferie?
      en: E.g. How do I request leave?
    examples:
    - it: Come si configura la VPN?
      en: How do I set up the VPN?
    - it: Qual è la procedura per le note spese?
      en: What is the expense report procedure?
  - key: inbox
    type: table
    title:
      it: Domande per l'esperto
      en: Questions for the expert
    source: collection:escalations
    roles:
    - expert
    - admin
    data:
      display: table
      fields:
      - key: asked_on
        label:
          it: Data
          en: Date
        format: date
      - key: question
        label:
          it: Domanda
          en: Question
      - key: context
        label:
          it: Contesto
          en: Context
      - key: status
        label:
          it: Stato
          en: Status
        format: badge
      filters:
      - field: status
        op: '='
        value: open
      sort:
        field: asked_on
        dir: desc
      limit: 100
      empty:
        it: Nessuna domanda in attesa.
        en: No pending questions.
  - key: curate
    type: new_run
    title:
      it: Aggiorna conoscenza
      en: Update knowledge
    roles:
    - expert
    - admin
  - key: runs
    type: history
    title:
      it: Aggiornamenti
      en: Updates
    source: run
    roles:
    - expert
    - admin
  - key: run_report
    type: report
    source: run
    printable: true
    nav: false
  - key: reports
    type: page
    title:
      it: Report settimanali
      en: Weekly reports
    roles:
    - manager
    - admin
    sections:
    - type: data
      source: collection:weekly_reports
      display: list
      fields:
      - key: week
        label:
          it: Settimana
          en: Week
      - key: content
        label:
          it: Report
          en: Report
      sort:
        field: week
        dir: desc
      limit: 12
      empty:
        it: Il primo report arriva lunedì.
        en: The first report arrives on Monday.
    - type: data
      title:
        it: Esiti delle domande
        en: Question outcomes
      source: collection:questions_log
      display: kpi
      kpis:
      - label:
          it: Domande totali
          en: Total questions
        agg: count
  - key: library
    type: table
    title:
      it: Documenti
      en: Documents
    source: collection:documents
    roles:
    - admin
    data:
      display: table
      fields:
      - key: title
        label:
          it: Titolo
          en: Title
      - key: area
        label: Area
        format: badge
      - key: updated_on
        label:
          it: Aggiornato
          en: Updated
        format: date
      - key: source_url
        label: Link
        format: link
      sort:
        field: updated_on
        dir: desc
      limit: 200
  - key: account
    type: account
    title:
      it: Licenza
      en: Licence
    roles:
    - admin
  schedules:
  - agent: reporter
    action: run
    cron: 0 6 * * 1
    owner: app
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: licence_50
      price: 1200
      interval: year
      label:
        it: Licenza annuale fino a 50 dipendenti
        en: Annual licence up to 50 employees
      roles:
      - admin
    - key: licence_250
      price: 4500
      interval: year
      label:
        it: Licenza annuale fino a 250 dipendenti
        en: Annual licence up to 250 employees
      roles:
      - admin
    - key: licence_1000
      price: 14000
      interval: year
      label:
        it: Licenza annuale fino a 1000 dipendenti
        en: Annual licence up to 1000 employees
      roles:
      - admin
  extensions:
  - key: source_connectors
    description: 'Not available yet: connecting SharePoint, Microsoft Teams and shared folders (they need the company''s own
      credentials) and indexing with the original permissions. For now the admin pastes document text and sets an area; restricted
      areas are only withheld by the assistant''s instructions, not by real ACLs.'
  - key: file_upload
    description: 'Not available yet: upload of PDF and Word files. Paste the text or give a link.'
  - key: teams_channel
    description: 'Not available yet: the chat inside Microsoft Teams and corporate (SSO) login; the app uses magic-link login
      and the web chat.'
  - key: nightly_indexing
    description: 'Not available yet: nightly re-indexing from the connected sources, which depends on the connectors; documents
      are indexed as soon as they are added.'
  - key: email_digest
    description: 'Not available yet: sending the weekly report by email; managers read it in the Reports view.'
  - key: expert_routing
    description: Escalations go to one shared inbox for all users with the expert role; routing to a designated expert per
      topic and notifying the asker of the answer are not available yet.
