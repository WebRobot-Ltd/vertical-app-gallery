apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: sapereinterno
  displayName: SapereInterno
  tagline:
    it: Le risposte dell'azienda, con la fonte, in una chat.
    en: Your company's answers, with sources, in one chat.
  description:
    it: Assistente aziendale che risponde ai dipendenti con la conoscenza interna, cita i documenti fonte e passa agli esperti
      interni i casi dubbi o sensibili.
    en: Company assistant that answers employees from internal knowledge, cites source documents and routes doubtful or sensitive
      questions to internal experts.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#12355b'
      accent: '#1f8a70'
      background: '#f7f9fb'
      foreground: '#16202b'
    fonts:
      body: Inter
      display: Inter
    wordmark:
    - text: Sapere
      color: primary
    - text: Interno
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin IT
      assignedBy: admin_emails
    - key: user
      label:
        it: Dipendente
        en: Employee
      assignedBy: signup
    - key: expert
      label:
        it: Esperto interno
        en: Internal expert
      assignedBy: invite
    - key: manager
      label:
        it: Responsabile
        en: Manager
      assignedBy: invite
  limits:
  - action: chat
    per: user
    max: 60
    window: day
    roles:
    - user
  agents:
  - key: assistant
    role: main
    description: Answers employees from the internal documents and FAQ, cites sources, escalates to experts.
    memory: none
    context:
    - key: email
      from: user.email
    profile:
      inline:
        display_name: SapereInterno assistant
        crews:
        - id: assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the internal knowledge assistant of a company. Answer employees ONLY from what search_documents
            and search_faq return; always search both before answering. Reply in the user''s language (Italian or English).
            Cite every source at the end as ''Fonte/Source: <document title> (<department>, updated <updated_on>)''. Never
            invent policies, figures or procedures. If a document is marked stale, say it may be outdated. For every question
            call log_question once with the topic, the question text (no personal data) and answered=true/false. If you are
            not confident, found nothing reliable, or the topic is sensitive (HR cases, disciplinary matters, salaries, legal,
            health, security incidents), do NOT guess: call ask_expert with the question, a short topic and the asker email,
            then tell the employee that the question was forwarded to the internal expert and they will be emailed the answer.
            Be concise and practical.'
    goalTemplate: 'Employee email: {email}

      Conversation so far:

      {history}


      New message: {message}

      Answer in the language of the message.'
    appTools:
    - name: search_documents
      description: Search the company documents (manuals, procedures, FAQ files)
      action: search
      collection: documents
      scope: all
    - name: search_faq
      description: Search answers given by internal experts
      action: search
      collection: faq
      scope: all
    - name: ask_expert
      description: 'Forward a question to the designated internal expert (fields: question, topic, asker_email)'
      action: write
      collection: expert_queue
      scope: user
    - name: log_question
      description: 'Log an anonymous question for the weekly report (fields: topic, question_text, answered)'
      action: append
      collection: question_log
      scope: all
    output: markdown
    limits:
      maxTurns: 10
      maxBudgetUsd: 0.3
  - key: indexer
    role: scheduled
    description: 'Nightly: summarises new or changed documents and flags stale ones.'
    profile:
      inline:
        display_name: SapereInterno indexer
        crews:
        - id: indexer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You maintain the search index of the company documents. Read the documents with list_documents.
            For each record that has a file but empty content or summary, open the file with read_upload (OCR included), then
            save with update_document: content (the full text, cleaned), summary (max 60 words), keywords (comma separated).
            Mark stale=true on documents whose updated_on is older than 12 months, stale=false otherwise. Never alter the
            meaning of a document and never invent content. Finish with a short ''# Indicizzazione <date>'' summary: documents
            processed, flagged stale, errors.'
    goalTemplate: Run the nightly indexing. Today is {date}.
    appTools:
    - name: list_documents
      description: Read the documents
      action: read
      collection: documents
      scope: all
    - name: update_document
      description: Save content, summary, keywords, stale of a document
      action: write
      collection: documents
      scope: all
    - name: read_upload
      description: Read an uploaded file
      action: read_file
    output: markdown
    limits:
      maxTurns: 30
      maxBudgetUsd: 1.0
  - key: reporter
    role: scheduled
    description: 'Weekly report for managers: top unanswered questions and stale documents.'
    writesTo:
      collection: weekly_reports
      parse: whole
      keyBy: week
    profile:
      inline:
        display_name: SapereInterno weekly reporter
        crews:
        - id: reporter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write the weekly knowledge report for managers. Read the last 7 days of the question log (read_question_log)
            and the documents (read_documents_report). Start with ''# Report conoscenza — settimana del <date>''. Sections
            with ## headings: Domande più frequenti senza risposta (group similar questions, with counts), Documenti obsoleti
            da aggiornare (stale=true or updated_on over 12 months, with department), Argomenti in crescita, Azioni consigliate.
            Add a chart block ```chart {"type":"bar","title":"...","labels":[...],"series":[{"name":"...","values":[...]}]}```
            of the top unanswered topics. Use real counts only; write in Italian, with a one-line English summary at the end.'
    goalTemplate: Write the report for the week ending {date}.
    appTools:
    - name: read_question_log
      description: Read the anonymous question log
      action: read
      collection: question_log
      scope: all
    - name: read_documents_report
      description: Read the documents
      action: read
      collection: documents
      scope: all
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.5
  data:
    collections:
    - name: documents
      ownedBy: shared
      searchable: true
      description: Company manuals, procedures and FAQ files
      fields:
      - name: title
        type: text
        required: true
        label:
          it: Titolo
          en: Title
      - name: department
        type: select
        label:
          it: Area
          en: Department
        options:
        - HR
        - IT
        - Amministrazione
        - Operations
        - Sicurezza
        - Generale
      - name: source
        type: select
        label:
          it: Origine
          en: Source
        options:
        - upload
        - sharepoint
        - teams
        - fileshare
      - name: file
        type: file
        accept:
        - pdf
        - docx
        maxMb: 15
        label: File
      - name: updated_on
        type: date
        label:
          it: Ultimo aggiornamento
          en: Last updated
      - name: content
        type: textarea
        label:
          it: Testo
          en: Text
      - name: summary
        type: textarea
        label:
          it: Sintesi
          en: Summary
      - name: keywords
        type: text
      - name: stale
        type: boolean
        label:
          it: Obsoleto
          en: Stale
    - name: faq
      ownedBy: shared
      searchable: true
      description: Expert answers saved into the knowledge base
      fields:
      - name: question
        type: textarea
      - name: answer
        type: textarea
      - name: topic
        type: text
    - name: expert_queue
      ownedBy: user
      description: Questions forwarded to the internal expert
      fields:
      - name: question
        type: textarea
        label:
          it: Domanda
          en: Question
      - name: topic
        type: text
        label:
          it: Argomento
          en: Topic
      - name: asker_email
        type: email
      - name: status
        type: select
        options:
        - open
        - answered
        default: open
        label:
          it: Stato
          en: Status
      - name: answer
        type: textarea
        label:
          it: Risposta
          en: Answer
      access:
      - role: expert
        can:
        - read
        - write
      retentionDays: 730
    - name: question_log
      ownedBy: org
      description: Anonymous log of questions for the weekly report
      retentionDays: 180
      fields:
      - name: topic
        type: text
      - name: question_text
        type: textarea
      - name: answered
        type: boolean
    - name: weekly_reports
      ownedBy: org
      fields:
      - name: week
        type: text
      - name: report
        type: textarea
      access:
      - role: manager
  views:
  - key: home
    type: page
    nav: false
    title: SapereInterno
    sections:
    - type: hero
      title:
        it: Chiedi all'azienda. Ricevi **risposte con la fonte**.
        en: Ask the company. Get **answers with sources**.
      text:
        it: 'Manuali, procedure e FAQ interne in una chat: ogni risposta cita il documento, e i casi delicati passano all''esperto
          giusto.'
        en: 'Internal manuals, procedures and FAQs in one chat: every answer cites the document, and sensitive cases go to
          the right expert.'
      actions:
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Documenti
          en: Documents
        text:
          it: L'admin IT carica manuali, procedure e FAQ (PDF, Word); l'indice si aggiorna ogni notte.
          en: IT admin uploads manuals, procedures and FAQs (PDF, Word); the index refreshes every night.
      - title:
          it: Chat
          en: Chat
        text:
          it: I dipendenti fanno domande e ricevono risposte con citazione della fonte.
          en: Employees ask and get answers citing the source.
      - title:
          it: Esperti
          en: Experts
        text:
          it: Se l'agente non è sicuro, l'esperto risponde e la risposta arricchisce la base di conoscenza.
          en: When unsure, the expert answers and the answer enriches the knowledge base.
      - title:
          it: Report settimanale
          en: Weekly report
        text:
          it: I responsabili ricevono domande senza risposta e documenti obsoleti.
          en: Managers get unanswered questions and stale documents.
    - type: note
      content:
        it: Le risposte si basano solo sui documenti caricati. Per decisioni importanti verifica con il responsabile.
        en: Answers rely only on uploaded documents. For important decisions check with your manager.
  - key: ask
    type: chat
    title:
      it: Chiedi
      en: Ask
    source: agent:assistant
    examples:
    - it: Come richiedo le ferie?
      en: How do I request leave?
    - it: Qual è la procedura per il rimborso spese?
      en: What is the expense reimbursement procedure?
    placeholder:
      it: Scrivi la tua domanda…
      en: Type your question…
    roles:
    - user
    - admin
    - expert
    - manager
  - key: expert_inbox
    type: table
    title:
      it: Domande per l'esperto
      en: Questions for the expert
    source: collection:expert_queue
    columns:
    - topic
    - question
    - status
    - asker_email
    roles:
    - expert
    - admin
  - key: answer
    type: form
    collection: expert_queue
    fields:
    - answer
    - status
    edit: true
    nav: false
    title:
      it: Rispondi
      en: Answer
    submit:
      label:
        it: Invia risposta
        en: Send answer
      message:
        it: Risposta salvata e inviata al dipendente.
        en: Answer saved and sent to the employee.
      redirect: expert_inbox
    roles:
    - expert
    - admin
  - key: upload_doc
    type: form
    collection: documents
    title:
      it: Carica documento
      en: Upload document
    fields:
    - title
    - department
    - file
    - updated_on
    submit:
      label:
        it: Carica
        en: Upload
      message:
        it: 'Documento caricato: sarà indicizzato stanotte.'
        en: 'Document uploaded: it will be indexed tonight.'
    roles:
    - admin
  - key: docs
    type: table
    title:
      it: Documenti
      en: Documents
    source: collection:documents
    columns:
    - title
    - department
    - source
    - updated_on
    - stale
    export: true
    roles:
    - admin
    - manager
  - key: reports
    type: table
    title:
      it: Report settimanali
      en: Weekly reports
    source: collection:weekly_reports
    columns:
    - week
    - report
    roles:
    - manager
    - admin
  - key: account
    type: account
    title:
      it: Licenza
      en: License
    roles:
    - admin
  schedules:
  - agent: indexer
    cron: 0 2 * * *
    action: run
    owner: app
  - agent: reporter
    cron: 0 6 * * 1
    action: run
    owner: app
    deliver:
      to: role:manager
      subject: Report conoscenza settimanale
      onlyIfNew: true
  triggers:
  - key: expert_new
    'on':
      collection: expert_queue
      op: insert
    notify:
      to: role:expert
      subject:
        it: 'Nuova domanda: {record.topic}'
        en: 'New question: {record.topic}'
      body:
        it: 'Un dipendente ha una domanda per te: {record.question}'
        en: 'An employee has a question for you: {record.question}'
      link: expert_inbox
  - key: expert_answered
    'on':
      collection: expert_queue
      op: update
      where:
        status: answered
    notify:
      to:
      - record.asker_email
      subject:
        it: Risposta alla tua domanda
        en: Answer to your question
      body:
        it: 'Domanda: {record.question}


          Risposta dell''esperto: {record.answer}'
        en: 'Question: {record.question}


          Expert answer: {record.answer}'
      link: ask
  - key: expert_to_faq
    'on':
      collection: expert_queue
      op: update
      where:
        status: answered
    write:
      collection: faq
      fields:
        question: question
        answer: answer
        topic: topic
      keyBy: question
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: annual_50
      price: 1500
      interval: year
      label:
        it: Licenza annuale fino a 50 dipendenti
        en: Annual license up to 50 employees
    - key: annual_250
      price: 5500
      interval: year
      label:
        it: Licenza annuale fino a 250 dipendenti
        en: Annual license up to 250 employees
    - key: annual_1000
      price: 16000
      interval: year
      label:
        it: Licenza annuale fino a 1000 dipendenti
        en: Annual license up to 1000 employees
  extensions:
  - key: sso_microsoft
    description: 'Login aziendale Microsoft 365 / Entra ID (OAuth): non disponibile, si usa il magic link via email aziendale.'
  - key: connectors_sharepoint_teams
    description: 'Connettori SharePoint, Teams e cartelle condivise con sincronizzazione notturna: non disponibili (OAuth).
      I documenti si caricano manualmente (PDF, Word).'
  - key: original_permissions
    description: 'Indicizzazione con i permessi originali dei documenti: non disponibile; i documenti caricati sono visibili
      a tutti i dipendenti. Per contenuti riservati usare l''esperto interno.'
  - key: teams_bot
    description: 'Chat dentro Microsoft Teams: canale non disponibile, la chat è nell''app web.'
  - key: license_seat_limit
    description: Il limite di dipendenti della licenza annuale è indicato dal piano ma non applicato automaticamente.
