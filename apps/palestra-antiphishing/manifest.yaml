apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: palestra-antiphishing
  displayName: Palestra Antiphishing
  tagline:
    it: Allena i dipendenti a riconoscere il phishing, un mese alla volta.
    en: Train your employees to spot phishing, one month at a time.
  description:
    it: Lezioni mensili, quiz, campagne di phishing simulato e dashboard per reparto. Nessuna classifica nominativa.
    en: Monthly lessons, quizzes, simulated phishing campaigns and a per-department dashboard. No named rankings.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: dashboard
  branding:
    theme: light
    palette:
      primary: '#12304a'
      accent: '#e07a1f'
      background: '#f6f8fa'
      foreground: '#16212b'
    fonts:
      body: Inter
      display: Sora
    wordmark:
    - text: 'Palestra '
      color: primary
    - text: Antiphishing
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Privacy
        en: Privacy
      href: '#privacy'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
      - learn
    roles:
    - key: owner
      assignedBy: admin_emails
    - key: it_admin
      label:
        it: Admin IT
        en: IT admin
      assignedBy: signup
  limits:
  - action: agent:campaign_designer
    per: user
    max: 10
    window: day
  egress:
    hosts:
    - example.invalid
    notes: 'Placeholder: no external API is called yet; sending uses the dedicated domain once email delivery is available.'
  agents:
  - key: campaign_designer
    role: main
    description: Creates a simulated phishing campaign for a department, personalised and difficulty-adjusted.
    profile:
      inline:
        display_name: Phishing campaign designer
        crews:
        - id: designer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You design SIMULATED phishing campaigns for an employer''s security awareness programme. Only employees
            who gave consent (records in the employees collection) are targeted. Read the employees of the chosen department
            with the tool read_employees. For each employee write a personalised message in their language based on the chosen
            template (fake invoice, password reset, parcel delivery), with difficulty tied to their score (low score = obvious
            signals, high score = subtle signals). Never use real brands'' logos or real credentials requests; the link is
            always the placeholder {TRACKING_LINK}. Assign a random send time inside the given window (spread across working
            hours). Save each message with write_messages (fields: campaign, employee_email, department, subject, body, send_at,
            difficulty, signals) and finally write a campaign summary with write_campaigns. Report format: start with ''#
            Campagna <template> — <department>'', then ## Riepilogo, ## Difficoltà per livello, ## Calendario invii (table
            by day), ## Segnali da riconoscere. Do not name or rank individuals in the summary. Never invent employees.'
    appTools:
    - name: read_employees
      description: Read the consenting employees
      action: read
      collection: employees
      scope: user
    - name: write_messages
      description: Save a simulated message
      action: write
      collection: messages
      scope: user
    - name: write_campaigns
      description: Save the campaign
      action: write
      collection: campaigns
      scope: user
    goalTemplate: 'Template: {template_label}

      Department: {department}

      Window: from {window_start} to {window_end}

      {?notes}Notes: {notes}{/notes}

      Write in the language of {lang} for the summary; the messages in each employee''s language. Today is {date}.'
    output: markdown
    writesTo:
      collection: campaign_reports
  - key: lesson_writer
    role: helper
    description: Monthly lesson, video pill script and quiz for the company's employees.
    memory: instance
    profile:
      inline:
        display_name: Monthly lesson writer
        crews:
        - id: lesson
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write the monthly anti-phishing lesson. Read the languages and departments of consenting employees
            with read_employees. Produce, per language: a short lesson (under 250 words), a script for a 90-second video pill
            and a 5-question multiple-choice quiz with answers and explanations. Start with ''# Lezione di <month>''. Use
            memory to avoid repeating topics: at the end call remember with the topic covered. Save the lesson with write_lessons.
            Never invent statistics.'
    appTools:
    - name: read_employees
      description: Read the consenting employees
      action: read
      collection: employees
      scope: user
    - name: write_lessons
      description: Save the lesson
      action: write
      collection: lessons
      scope: user
    output: markdown
  - key: event_logger
    role: helper
    description: Records a click or a report from the webhook and updates the employee's score.
    profile:
      inline:
        display_name: Event logger
        crews:
        - id: logger
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 4
          max_budget_usd: 0.1
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You receive a JSON event {type: click|report, campaign, employee_email, department}. Record it with
            write_events. A report earns +10 points and a click -5 (never below 0): update the employee with write_employee_score.
            Reply with one line.'
    appTools:
    - name: write_events
      description: Record the event
      action: append
      collection: events
      scope: user
    - name: write_employee_score
      description: Update the score
      action: write
      collection: employees
      scope: user
    output: markdown
  - key: difficulty_analyst
    role: analyst
    description: Aggregates results per department and adapts the difficulty of the next campaigns.
    profile:
      inline:
        display_name: Difficulty analyst
        crews:
        - id: analyst
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Read events and employees, compute per department the click rate, the report rate and the next difficulty
            level (easy, medium, hard), and save one record per department with write_stats (fields: department, sent, click_rate,
            report_rate, next_level). Show only department aggregates, never named rankings. Start the report with ''# Risultati
            per reparto''.'
    appTools:
    - name: read_events
      description: Read events
      action: read
      collection: events
      scope: user
    - name: read_employees
      description: Read the consenting employees
      action: read
      collection: employees
      scope: user
    - name: write_stats
      description: Save department stats
      action: write
      collection: dept_stats
      scope: user
    output: markdown
  inputForm:
    title:
      it: Nuova campagna
      en: New campaign
    fields:
    - name: template
      type: select
      required: true
      label:
        it: Modello
        en: Template
      options:
      - value: invoice
        label:
          it: Finta fattura
          en: Fake invoice
      - value: password
        label:
          it: Reset password
          en: Password reset
      - value: parcel
        label:
          it: Pacco in consegna
          en: Parcel delivery
    - name: department
      type: text
      required: true
      label:
        it: Reparto
        en: Department
    - name: window_start
      type: date
      required: true
      label:
        it: Dal
        en: From
    - name: window_end
      type: date
      required: true
      label:
        it: Al
        en: To
    - name: notes
      type: textarea
      maxLength: 400
      label:
        it: Note (facoltative)
        en: Notes (optional)
  data:
    collections:
    - name: employees
      ownedBy: user
      description: Employees who gave consent
      fields:
      - name: email
        type: email
        required: true
      - name: name
        type: text
      - name: department
        type: text
        required: true
      - name: lang
        type: text
      - name: score
        type: number
        default: 0
    - name: campaigns
      ownedBy: user
      fields:
      - name: template
        type: text
      - name: department
        type: text
      - name: window_start
        type: date
      - name: window_end
        type: date
      - name: status
        type: text
    - name: messages
      ownedBy: user
      fields:
      - name: campaign
        type: text
      - name: employee_email
        type: email
      - name: department
        type: text
      - name: subject
        type: text
      - name: body
        type: textarea
      - name: send_at
        type: text
      - name: difficulty
        type: text
      - name: signals
        type: textarea
    - name: events
      ownedBy: user
      fields:
      - name: type
        type: text
      - name: campaign
        type: text
      - name: employee_email
        type: email
      - name: department
        type: text
    - name: lessons
      ownedBy: user
      fields:
      - name: month
        type: text
      - name: lang
        type: text
      - name: content
        type: textarea
    - name: dept_stats
      ownedBy: user
      fields:
      - name: department
        type: text
      - name: sent
        type: number
      - name: click_rate
        type: number
      - name: report_rate
        type: number
      - name: next_level
        type: text
    - name: campaign_reports
      ownedBy: user
      description: Campaign summaries
      fields:
      - name: title
        type: text
      - name: content
        type: textarea
  templates:
  - key: monthly_program
    title:
      it: Programma mensile
      en: Monthly programme
    description:
      it: Ogni mese lezione, pillola video e quiz per i dipendenti.
      en: Every month a lesson, video pill and quiz for employees.
    agent: lesson_writer
    params:
    - name: company
      type: text
      required: true
      label:
        it: Azienda
        en: Company
    goal: Prepare this month's lesson, video pill and quiz for {company}. Today is {date}. Language code {lang}.
    schedule:
      cron: 0 7 1 * *
      userCanChange: false
    maxPerUser: 1
    cost:
      perRun: 20
  triggers:
  - key: phish_event
    description: A click or a report arrives from the tracking link or the report button
    'on':
      webhook: true
    start:
      agent: event_logger
    goal: 'Record this event: {event}'
    asUser: true
  schedules:
  - agent: difficulty_analyst
    cron: 0 6 * * 1
    action: run
    owner: app
    goal: Update department stats and next difficulty levels.
  views:
  - key: home
    type: page
    nav: false
    title: Palestra Antiphishing
    sections:
    - type: hero
      eyebrow:
        it: Formazione alla sicurezza
        en: Security training
      title:
        it: Dipendenti **più attenti**, un mese alla volta.
        en: '**Sharper** employees, one month at a time.'
      text:
        it: Lezioni brevi, quiz, campagne di phishing simulato e una dashboard per reparto. Chi clicca impara subito, chi
          segnala guadagna punti.
        en: Short lessons, quizzes, simulated phishing and a per-department dashboard. Those who click learn right away, those
          who report earn points.
      actions:
      - label:
          it: Inizia
          en: Get started
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Carica i dipendenti
          en: Add employees
        text:
          it: Solo chi ha dato il consenso, con reparto e lingua.
          en: Only consenting people, with department and language.
        badge: 👥
      - title:
          it: Lezione mensile
          en: Monthly lesson
        text:
          it: Lezione, pillola video e quiz ogni mese.
          en: Lesson, video pill and quiz each month.
        badge: 🎓
      - title:
          it: Campagne simulate
          en: Simulated campaigns
        text:
          it: 'Modello, reparto e finestra: l''agente personalizza e distribuisce gli invii.'
          en: 'Template, department and window: the agent personalises and spreads the sends.'
        badge: 🎣
      - title:
          it: Dashboard
          en: Dashboard
        text:
          it: Clic e segnalazioni per reparto, mai classifiche nominative.
          en: Clicks and reports per department, never named rankings.
        badge: 📊
    - type: note
      id: privacy
      content:
        it: Solo dipendenti consenzienti. I risultati sono aggregati per reparto; nessuna classifica nominativa è pubblica.
        en: Consenting employees only. Results are aggregated by department; no named ranking is public.
  - key: learn
    type: page
    nav: false
    title:
      it: Hai cliccato su una simulazione
      en: You clicked a simulation
    sections:
    - type: hero
      title:
        it: Era una simulazione di phishing
        en: This was a phishing simulation
      text:
        it: 'Nessun danno: ora impariamo insieme i segnali da notare.'
        en: 'No harm done: let''s learn the signals you should have noticed.'
    - type: cards
      title:
        it: I segnali da notare
        en: Signals to notice
      items:
      - title:
          it: Mittente
          en: Sender
        text:
          it: Controlla il dominio reale, non il nome visualizzato.
          en: Check the real domain, not the display name.
      - title:
          it: Urgenza
          en: Urgency
        text:
          it: Pressione e scadenze sono tattiche tipiche.
          en: Pressure and deadlines are typical tactics.
      - title:
          it: Link
          en: Link
        text:
          it: Passa il mouse sul link prima di cliccare.
          en: Hover the link before clicking.
      - title:
          it: Segnala
          en: Report
        text:
          it: 'Usa il pulsante Segnala: guadagni punti.'
          en: 'Use the Report button: you earn points.'
  - key: new_campaign
    type: new_run
    title:
      it: Nuova campagna
      en: New campaign
    roles:
    - it_admin
    - owner
  - key: campaigns
    type: history
    title:
      it: Campagne
      en: Campaigns
    source: run
    roles:
    - it_admin
    - owner
  - key: campaign
    type: report
    source: run
    printable: true
    nav: false
  - key: employees_list
    type: table
    title:
      it: Dipendenti
      en: Employees
    source: collection:employees
    columns:
    - email
    - department
    - lang
    roles:
    - it_admin
    - owner
  - key: program
    type: instances
    template: monthly_program
    title:
      it: Programma mensile
      en: Monthly programme
    roles:
    - it_admin
    - owner
  - key: dashboard
    type: page
    title:
      it: Dashboard
      en: Dashboard
    roles:
    - it_admin
    - owner
    sections:
    - type: data
      title:
        it: Clic e segnalazioni per reparto
        en: Clicks and reports by department
      source: collection:dept_stats
      display: chart
      chart: bar
      fields:
      - key: department
        label:
          it: Reparto
          en: Department
      - key: click_rate
        label:
          it: Tasso di clic
          en: Click rate
      - key: report_rate
        label:
          it: Segnalazioni
          en: Reports
      empty:
        it: Nessun dato ancora.
        en: No data yet.
    - type: data
      title:
        it: Livello della prossima campagna
        en: Next campaign level
      source: collection:dept_stats
      display: table
      fields:
      - key: department
      - key: sent
        format: number
      - key: click_rate
        format: percent
      - key: report_rate
        format: percent
      - key: next_level
        format: badge
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - it_admin
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 50
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:campaign_designer:
        estimate: 10
        metered: true
    packs:
    - key: small
      credits: 500
      price: 5
      label: Starter
    plans:
    - key: per_employee_year
      price: 24
      interval: year
      label:
        it: Annuale per dipendente
        en: Yearly per employee
      includes:
      - monthly lessons
      - simulated campaigns
      - department dashboard
      credits: 0
      roles:
      - it_admin
  extensions:
  - key: employee_upload
    description: 'File upload is not available yet: the IT admin pastes the consenting employees (email, department, language)
      as text or adds them one by one; a CSV file import is missing.'
  - key: email_delivery
    description: 'Sending emails (monthly lessons, simulated phishing at random times) is not available yet. Missing: outbound
      email channel from a dedicated domain with SPF, DKIM, DMARC set up and warmed up, so mail reaches the inbox.'
  - key: tracking_and_report_button
    description: Per-employee tracking links with a webhook (POST /api/hooks/phish_event) and the Report button add-in for
      the mail client need to be wired by the owner; the webhook then redirects the clicker to the learn page.
  - key: per_seat_billing
    description: The yearly plan is priced per employee; quantity-based seats are not yet expressible in the plan.
  - key: video_pills
    description: Video pills are delivered as scripts and links; hosting and generating video is not available.
