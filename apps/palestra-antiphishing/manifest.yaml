apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: palestra-antiphishing
  displayName: Palestra Antiphishing
  tagline:
    it: Allena i dipendenti a riconoscere il phishing, un mese alla volta.
    en: Train your employees to spot phishing, one month at a time.
  description:
    it: Lezioni mensili via email, pillole video, phishing simulato personalizzato da un agente, pagine formative immediate
      e dashboard aggregata per reparto, senza classifiche nominative.
    en: Monthly email lessons, video pills, agent-personalised simulated phishing, instant teaching pages and a department-level
      dashboard, with no named rankings.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12304a'
      accent: '#e0572f'
      background: '#f6f8fa'
      foreground: '#14202b'
    fonts:
      body: Inter
      display: Space Grotesk
    wordmark:
    - text: 'Palestra '
      color: primary
    - text: Antiphishing
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Privacy
        en: Privacy
      href: '#privacy'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
      - trained
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      label:
        it: Admin IT dell'azienda
        en: Company IT admin
      assignedBy: signup
  limits:
  - action: create:employees
    max: 50
    window: total
    plans:
      annual_250: 250
      annual_1000: 1000
  - action: agent:campaign_agent
    per: user
    max: 20
    window: month
  agents:
  - key: campaign_agent
    role: main
    when: mode == 'campaign'
    description: Personalises simulated phishing messages for a department and schedules them on random days in the window.
    profile:
      inline:
        display_name: Phishing simulation designer
        crews:
        - id: campaign
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You design SIMULATED phishing messages for an authorised employee awareness programme. Use read_employees
            to get the employees of the chosen department (only those with consent=true). For each one write a message in
            their own language (field lang) based on the chosen template (fake invoice, password reset, parcel delivery),
            personalised with first name and department, with realistic but safe cues (urgency, sender mismatch, odd link)
            that a trained person can spot. The difficulty follows the employee''s level (1 = obvious cues, 5 = subtle). Never
            imitate real brands'' logos or ask for real credentials; the link is always the placeholder {LINK} that the platform
            replaces with the tracking link. Pick a send_date for each employee at random inside the window (YYYY-MM-DD, working
            days only), spread over the window. Save each message with write_message (fields: employee_email, employee_name,
            department, campaign, subject, body, send_date, level, status=''scheduled'', signals = the list of cues the employee
            should notice). Finish with a report that starts with a level-1 title ''# Campagna <template> — <department>''
            and has: sections Riepilogo, Distribuzione per livello, Calendario invii, Segnali usati. No individual employee
            rankings.'
    appTools:
    - name: read_employees
      description: Read the company's employees
      action: read
      collection: employees
      scope: user
    - name: write_message
      description: Save a simulated phishing message
      action: write
      collection: messages
      scope: user
    goalTemplate: 'Template: {template_label}

      Department: {department}

      Window: from {start_date} to {end_date}

      {?notes}Notes: {notes}{/notes}

      Today is {date}. Write the report in the language with ISO code {lang}.'
    output: markdown
    limits:
      maxTurns: 25
      maxBudgetUsd: 0.8
  - key: importer
    role: main
    when: mode == 'import'
    description: Reads the uploaded employee list and saves the consenting employees.
    profile:
      inline:
        display_name: Employee list importer
        crews:
        - id: importer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 20
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You import an employee list. For each row with a valid email and an explicit consent (yes/sì/true/1),
            call write_employee with email, name, department, lang (it or en; default it), consent=true, level=1, points=0.
            SKIP rows without explicit consent and rows with invalid emails; never guess consent. Do not invent data. Final
            report starts with '# Importazione elenco dipendenti' and lists counts of imported and skipped rows (skip reasons,
            no personal data beyond row numbers).
    appTools:
    - name: write_employee
      description: Save an employee who consented
      action: write
      collection: employees
      scope: user
    goalTemplate: 'Import this employee list (columns: email, name, department, language, consent):

      {list_text}

      Today is {date}. Report language: {lang}.'
    output: markdown
    limits:
      maxTurns: 20
      maxBudgetUsd: 0.5
  - key: coach
    role: helper
    description: 'Every month, for one company: writes the lessons with video pill and quiz, and adapts each employee''s level
      from the events.'
    profile:
      inline:
        display_name: Monthly security coach
        crews:
        - id: coach
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You run the monthly awareness programme of one company. 1) Read employees (read_employees) and events
            (read_events: type click or report). 2) For each employee update level (1-5) with update_employee: up one step
            after reports, down after clicks, and points +10 per report. 3) For each consenting employee create a lesson with
            write_lesson: employee_email, lang, topic (a different phishing topic every month), title, text (a short lesson
            of max 200 words in their language), video_url (leave empty if you do not know a real, public URL: never invent
            links), quiz (3 multiple-choice questions with the correct answer marked after a separator), send_date (a random
            working day of the first 10 days of the month, YYYY-MM-DD), level. Report starts with ''# Programma mensile —
            <month>'' and gives only AGGREGATE figures per department; never name or rank employees.'
    appTools:
    - name: read_employees
      description: Read employees
      action: read
      collection: employees
      scope: user
    - name: update_employee
      description: Update an employee's level and points
      action: write
      collection: employees
      scope: user
    - name: read_events
      description: Read click and report events
      action: read
      collection: events
      scope: user
    - name: write_lesson
      description: Save a monthly lesson
      action: write
      collection: lessons
      scope: user
    memory: instance
    goalTemplate: Programme "{instance}" for {company}. Today is {date}. Write the report in the language with ISO code {lang}.
    output: markdown
    limits:
      maxTurns: 30
      maxBudgetUsd: 1.0
  templates:
  - key: monthly_program
    title:
      it: Programma mensile
      en: Monthly programme
    description:
      it: Ogni mese lezione, video e quiz per ciascun dipendente e adattamento della difficoltà.
      en: Each month a lesson, video and quiz for every employee, with difficulty adaptation.
    agent: coach
    params:
    - name: company
      type: text
      required: true
      label:
        it: Azienda
        en: Company
    schedule:
      cron: 0 5 1 * *
      userCanChange: false
    maxPerUser: 1
    goal: Programme "{instance}" for {company}. Today is {date}. Write the report in the language with ISO code {lang}.
  inputForm:
    title:
      it: Nuova attività
      en: New activity
    fields:
    - name: mode
      type: select
      required: true
      label:
        it: Cosa vuoi fare
        en: What to do
      default: campaign
      options:
      - value: campaign
        label:
          it: Campagna di phishing simulato
          en: Simulated phishing campaign
      - value: import
        label:
          it: Importa elenco dipendenti
          en: Import employee list
    - name: template
      type: select
      label:
        it: Modello
        en: Template
      visibleWhen: mode == 'campaign'
      options:
      - value: invoice
        label:
          it: Finta fattura
          en: Fake invoice
      - value: password
        label:
          it: Reset password
          en: Password reset
      - value: parcel
        label:
          it: Pacco in consegna
          en: Parcel delivery
    - name: department
      type: text
      label:
        it: Reparto
        en: Department
      visibleWhen: mode == 'campaign'
    - name: start_date
      type: date
      label:
        it: Dal
        en: From
      visibleWhen: mode == 'campaign'
    - name: end_date
      type: date
      label:
        it: Al
        en: To
      visibleWhen: mode == 'campaign'
    - name: notes
      type: textarea
      maxLength: 400
      label:
        it: Note (facoltative)
        en: Notes (optional)
      visibleWhen: mode == 'campaign'
    - name: list
      type: file
      accept:
      - csv
      - xlsx
      maxMb: 5
      label:
        it: Elenco (email, nome, reparto, lingua, consenso)
        en: List (email, name, department, language, consent)
      visibleWhen: mode == 'import'
      help:
        it: Solo dipendenti che hanno dato il consenso.
        en: Only employees who gave consent.
  data:
    collections:
    - name: employees
      ownedBy: user
      description: Employees who consented to the programme
      retentionDays: 730
      fields:
      - name: email
        type: email
        required: true
      - name: name
        type: text
      - name: department
        type: text
        required: true
      - name: lang
        type: select
        options:
        - it
        - en
      - name: consent
        type: boolean
        required: true
      - name: level
        type: number
        default: 1
      - name: points
        type: number
        default: 0
    - name: messages
      ownedBy: user
      description: Simulated phishing messages and their schedule
      retentionDays: 365
      fields:
      - name: employee_email
        type: email
      - name: employee_name
        type: text
      - name: department
        type: text
      - name: campaign
        type: text
      - name: subject
        type: text
      - name: body
        type: textarea
      - name: send_date
        type: date
      - name: level
        type: number
      - name: signals
        type: textarea
      - name: status
        type: select
        options:
        - scheduled
        - sent
    - name: lessons
      ownedBy: user
      description: Monthly lessons with video pill and quiz
      retentionDays: 365
      fields:
      - name: employee_email
        type: email
      - name: lang
        type: text
      - name: topic
        type: text
      - name: title
        type: text
      - name: text
        type: textarea
      - name: video_url
        type: url
      - name: quiz
        type: textarea
      - name: send_date
        type: date
      - name: level
        type: number
    - name: events
      ownedBy: user
      description: Clicks and reports on simulated phishing
      retentionDays: 365
      fields:
      - name: employee_email
        type: email
      - name: department
        type: text
      - name: campaign
        type: text
      - name: type
        type: select
        options:
        - click
        - report
  triggers:
  - key: lesson_email
    description: Monthly lesson email to the employee
    'on':
      date:
        collection: lessons
        field: send_date
        offsetDays: 0
        hour: 7
    notify:
      to: record.employee_email
      subject:
        it: '{record.title}'
        en: '{record.title}'
      body:
        it: '{record.text}


          Video: {record.video_url}'
        en: '{record.text}


          Video: {record.video_url}'
  - key: phish_email
    description: Simulated phishing message on its scheduled day
    'on':
      date:
        collection: messages
        field: send_date
        offsetDays: 0
        hour: 8
      where:
        status: scheduled
    notify:
      to: record.employee_email
      subject:
        it: '{record.subject}'
        en: '{record.subject}'
      body:
        it: '{record.body}'
        en: '{record.body}'
  - key: phish_event
    description: 'Click or report registered by webhook (payload: employee_email, department, campaign, type)'
    'on':
      webhook: true
    write:
      collection: events
      fields:
        employee_email: employee_email
        department: department
        campaign: campaign
        type: type
  views:
  - key: home
    type: page
    nav: false
    title: Palestra Antiphishing
    sections:
    - type: hero
      band: true
      eyebrow:
        it: Formazione alla sicurezza
        en: Security awareness
      title:
        it: Dipendenti che **riconoscono** il phishing prima di cliccare.
        en: Employees who **spot** phishing before they click.
      text:
        it: Lezioni mensili, pillole video, quiz e campagne di phishing simulato personalizzate da un agente, con dashboard
          aggregata per reparto.
        en: Monthly lessons, video pills, quizzes and simulated phishing campaigns personalised by an agent, with an aggregated
          department dashboard.
      actions:
      - label:
          it: Inizia
          en: Start
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Carica i dipendenti
          en: Upload employees
        text:
          it: Solo chi ha dato il consenso, con reparto e lingua.
          en: Only those who consented, with department and language.
        badge: 📋
      - title:
          it: Lezioni e quiz
          en: Lessons and quizzes
        text:
          it: Ogni mese una lezione breve e una pillola video.
          en: A short lesson and a video pill each month.
        badge: 🎓
      - title:
          it: Phishing simulato
          en: Simulated phishing
        text:
          it: 'Modello, reparto e finestra: l''agente personalizza e distribuisce gli invii.'
          en: 'Template, department, window: the agent personalises and spreads the sends.'
        badge: 🎣
      - title:
          it: Impara subito
          en: Learn instantly
        text:
          it: Chi clicca vede quali segnali notare; chi segnala guadagna punti.
          en: Who clicks sees which signals to notice; who reports earns points.
        badge: 🛡️
    - type: cards
      id: privacy
      title: Privacy
      items:
      - title:
          it: Nessuna classifica nominativa
          en: No named rankings
        text:
          it: L'admin vede tassi aggregati per reparto, mai classifiche pubbliche di persone.
          en: Admins see aggregate rates per department, never public rankings of people.
      - title:
          it: Solo con consenso
          en: Consent only
        text:
          it: Entrano nel programma solo i dipendenti che hanno dato il consenso; dati cancellati automaticamente dopo il
            periodo di conservazione.
          en: Only consenting employees join; data is deleted automatically after the retention period.
    - type: note
      content:
        it: Le simulazioni sono a scopo formativo e solo per aziende che le hanno autorizzate.
        en: Simulations are for training only and for companies that authorised them.
  - key: trained
    type: page
    nav: false
    title:
      it: Ci sei cascato? Ecco cosa guardare
      en: Caught out? Here is what to look for
    sections:
    - type: hero
      title:
        it: Questa era una **simulazione**.
        en: This was a **simulation**.
      text:
        it: 'Nessun danno: è un allenamento. Ecco i segnali che potevi notare.'
        en: 'No harm done: it was practice. Here are the signals you could have noticed.'
    - type: cards
      title:
        it: I segnali
        en: The signals
      items:
      - title:
          it: Mittente
          en: Sender
        text:
          it: Dominio strano o diverso da quello atteso.
          en: Odd domain or different from what you expect.
        badge: ✉️
      - title:
          it: Urgenza
          en: Urgency
        text:
          it: Scadenze minacciose e pressione a fare in fretta.
          en: Threatening deadlines and pressure to hurry.
        badge: ⏱️
      - title:
          it: Link
          en: Link
        text:
          it: 'Passa il mouse: l''indirizzo reale non corrisponde al testo.'
          en: 'Hover: the real address does not match the text.'
        badge: 🔗
      - title:
          it: Richieste insolite
          en: Unusual requests
        text:
          it: Credenziali, pagamenti o pacchi che non aspettavi.
          en: Credentials, payments or parcels you did not expect.
        badge: ⚠️
    - type: note
      content:
        it: 'Nel dubbio usa il pulsante **Segnala** del tuo client di posta: guadagni punti e aiuti l''azienda.'
        en: 'When in doubt use the **Report** button in your mail client: you earn points and help the company.'
  - key: new
    type: new_run
    title:
      it: Nuova attività
      en: New activity
    roles:
    - user
    - admin
  - key: activities
    type: history
    title:
      it: Campagne e importazioni
      en: Campaigns and imports
    source: run
    roles:
    - user
    - admin
  - key: activity
    type: report
    source: run
    printable: true
    nav: false
  - key: add_employee
    type: form
    title:
      it: Aggiungi dipendente
      en: Add employee
    collection: employees
    fields:
    - email
    - name
    - department
    - lang
    - consent
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Dipendente salvato.
        en: Employee saved.
      redirect: employees
    roles:
    - user
    - admin
  - key: employees
    type: table
    title:
      it: Dipendenti
      en: Employees
    source: collection:employees
    columns:
    - email
    - department
    - lang
    - consent
    export: true
    roles:
    - user
    - admin
  - key: dashboard
    type: page
    title:
      it: Dashboard reparti
      en: Department dashboard
    roles:
    - user
    - admin
    sections:
    - type: data
      title:
        it: Clic per reparto
        en: Clicks by department
      source: collection:events
      display: chart
      chart: bar
      filters:
      - field: type
        op: '='
        value: click
      groupBy:
        field: department
        aggs: []
        minCount: 3
      fields:
      - key: department
        label:
          it: Reparto
          en: Department
      - key: count
        label:
          it: Clic
          en: Clicks
    - type: data
      title:
        it: Segnalazioni per reparto
        en: Reports by department
      source: collection:events
      display: chart
      chart: bar
      filters:
      - field: type
        op: '='
        value: report
      groupBy:
        field: department
        aggs: []
        minCount: 3
      fields:
      - key: department
        label:
          it: Reparto
          en: Department
      - key: count
        label:
          it: Segnalazioni
          en: Reports
    - type: data
      title:
        it: Livello medio per reparto
        en: Average level by department
      source: collection:employees
      display: table
      groupBy:
        field: department
        aggs:
        - key: avg_level
          agg: avg
          field: level
        minCount: 3
      fields:
      - key: department
        label:
          it: Reparto
          en: Department
      - key: avg_level
        label:
          it: Livello medio
          en: Average level
        format: number
      - key: count
        label:
          it: Dipendenti
          en: Employees
  - key: program
    type: instances
    template: monthly_program
    title:
      it: Programma mensile
      en: Monthly programme
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - user
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: annual_50
      price: 1200
      interval: year
      label:
        it: Annuale — fino a 50 dipendenti
        en: Annual — up to 50 employees
      includes:
      - lessons
      - simulations
      - dashboard
      roles:
      - user
    - key: annual_250
      price: 5000
      interval: year
      label:
        it: Annuale — fino a 250 dipendenti
        en: Annual — up to 250 employees
      includes:
      - lessons
      - simulations
      - dashboard
      roles:
      - user
    - key: annual_1000
      price: 16000
      interval: year
      label:
        it: Annuale — fino a 1000 dipendenti
        en: Annual — up to 1000 employees
      includes:
      - lessons
      - simulations
      - dashboard
      roles:
      - user
  notifications:
    emailOnRunDone: true
  extensions:
  - key: dedicated_sending_domain
    description: 'Sending simulated phishing from a dedicated domain with SPF, DKIM and DMARC configured so mail reaches the
      inbox (and allowlisting by the customer''s IT) is not available: the platform sends plain-text emails from its own sender.'
  - key: click_redirect_and_report_button
    description: The webhook records the event but cannot redirect the employee to the 'trained' page, nor generate per-message
      tracking links ({LINK}) or receive the mail-client Report button; this needs a small external redirector/add-in that
      POSTs {employee_email, department, campaign, type} to /api/hooks/phish_event. The webhook payload must also identify
      the company (record owner).
  - key: random_send_time
    description: Sends are random per day inside the window; random time of day is not available (fixed hour).
  - key: employee_quiz
    description: Employees do not sign in, so the quiz is included in the lesson email text; collecting their answers needs
      identity without an account (not available).
  - key: per_employee_pricing
    description: Annual subscription is tiered by employee count (plans + create:employees quota), not billed per single seat.
