apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: cinqueminuti
  displayName: CinqueMinuti
  tagline:
    it: Cinque minuti al giorno per capire i soldi.
  description:
    it: Una micro-lezione di educazione finanziaria ogni mattina, pensata per te, con un quiz, una serie di giorni da mantenere
      e una chat per le tue domande.
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: dashboard
  branding:
    theme: light
    palette:
      primary: '#16423c'
      accent: '#f2a33a'
      background: '#fbf8f2'
      foreground: '#1d2623'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Cinque
      color: primary
    - text: Minuti
      color: accent
    buttonShape: pill
  header:
    links:
    - label:
        it: Come funziona
      href: '#come-funziona'
    - label:
        it: Prezzi
      href: '#prezzi'
    cta:
      label:
        it: Inizia gratis
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  limits:
  - action: chat
    per: user
    max: 30
    window: day
    roles:
    - user
  agents:
  - key: lesson_writer
    role: scheduled
    description: Scrive la micro-lezione del giorno per un utente, adattandola al profilo e ai risultati dei quiz.
    memory: instance
    writesTo:
      collection: lessons
      parse: whole
      keyBy: date
    context:
    - key: profile
      from: collection:profiles
    - key: answers
      from: collection:quiz_answers
    - key: progress
      from: collection:progress
    - key: plan
      from: collection:curriculum
    goalTemplate: 'Oggi è {date}. Scrivi la micro-lezione del giorno.

      Profilo dell''utente (JSON): {profile}

      Risposte ai quiz precedenti: {answers}

      Progressi: {progress}

      Piano dei contenuti deciso dall''admin: {plan}

      Scrivi in italiano.'
    profile:
      inline:
        display_name: CinqueMinuti – autore lezioni
        crews:
        - id: lesson_writer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un educatore finanziario per giovani adulti che non sanno nulla di investimenti. Scrivi una
            micro-lezione da leggere in cinque minuti (circa 450 parole), in italiano semplice, senza gergo non spiegato.
            Scegli il tema dal piano dei contenuti (inflazione, interesse composto, ETF, costi dei fondi, debito, fondo emergenze…)
            seguendo l''ordine, e non ripetere temi già svolti: guarda la tua memoria. Se i quiz recenti sono sbagliati, ripassa
            il concetto con un esempio diverso; se sono tutti giusti, avanza. Adatta tono e obiettivi (fondo emergenze, casa,
            pensione) al profilo.

            Struttura: un titolo di primo livello ''# Tema — idea in poche parole'', poi ## L''idea in breve, ## Un esempio
            pratico (con numeri semplici e realistici, dichiarati come esempi), ## Cosa ricordare, ## Domanda di verifica
            con una domanda a scelta multipla con 4 opzioni A, B, C, D. NON rivelare la risposta corretta nel testo visibile;
            scrivila come ultima riga nel formato ''<!-- corretta: X -->''. Non dare consulenza personalizzata, non consigliare
            prodotti o titoli specifici, non inventare dati: usa solo esempi didattici. Chiudi con una riga: ''Contenuto educativo,
            non è consulenza finanziaria.'' Alla fine chiama il tool remember una volta con il tema trattato e i punti deboli
            dell''utente.'
  - key: progress_keeper
    role: helper
    description: Corregge il quiz, aggiorna serie di giorni, punti e badge.
    context:
    - key: profile
      from: collection:profiles
    appTools:
    - name: read_answers
      description: Legge le risposte ai quiz dell'utente
      action: read
      collection: quiz_answers
      scope: user
    - name: read_lessons
      description: Legge le lezioni dell'utente
      action: search
      collection: lessons
      scope: user
    - name: read_progress
      description: Legge i progressi dell'utente
      action: read
      collection: progress
      scope: user
    - name: write_progress
      description: Salva i progressi dell'utente
      action: write
      collection: progress
      scope: user
    goalTemplate: 'L''utente ha risposto al quiz della lezione del {record.lesson_date} con l''opzione {record.choice}. Data
      di oggi: {date}.'
    profile:
      inline:
        display_name: CinqueMinuti – progressi
        crews:
        - id: progress_keeper
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.15
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Aggiorni i progressi di un utente dopo un quiz. Con read_lessons trova la lezione della data indicata
            e leggi la riga ''<!-- corretta: X -->''; confronta con la risposta. Con read_progress leggi il record attuale.
            Calcola: streak (giorni consecutivi con almeno un quiz: +1 se l''ultimo giorno è ieri, invariato se è oggi, 1
            se c''è un buco), best_streak, xp (+10 corretta, +5 sbagliata), correct (totale risposte corrette), answered,
            last_date, badges (lista di testi: ''Primo passo'' alla prima risposta, ''Una settimana'' a 7 giorni di serie,
            ''Due settimane'' a 14, ''Un mese'' a 30, ''Cinque su cinque'' a 5 risposte corrette, ''Mente curiosa'' a 20 risposte).
            Salva con write_progress un unico record aggiornato. Rispondi con una frase breve di feedback in italiano che
            dica se era corretta e perché.'
  - key: tutor
    role: main
    description: Chat per domande libere di educazione finanziaria.
    context:
    - key: profile
      from: collection:profiles
    goalTemplate: 'Profilo dell''utente (JSON): {profile}

      Conversazione finora:

      {history}

      Nuovo messaggio: {message}

      Rispondi in italiano.'
    profile:
      inline:
        display_name: CinqueMinuti – tutor
        chat_mode: true
        crews:
        - id: tutor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 4
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei il tutor di CinqueMinuti: spieghi concetti di finanza personale a giovani adulti principianti,
            con parole semplici ed esempi numerici didattici. Rispondi in modo breve (max 200 parole). Non fornisci consulenza
            personalizzata: non dire cosa comprare o vendere, non indicare titoli, fondi o strumenti specifici da acquistare,
            non promettere rendimenti, non inventare dati. Se ti chiedono cosa fare con i loro soldi, spiega i criteri generali
            per decidere e suggerisci di rivolgersi a un consulente indipendente. Alla fine della prima risposta ricorda:
            ''Contenuto educativo, non consulenza finanziaria personalizzata.'''
  templates:
  - key: daily_lesson
    title:
      it: La mia lezione quotidiana
    description:
      it: Una micro-lezione ogni mattina, per email e nell'app.
    agent: lesson_writer
    params:
    - name: focus
      type: select
      label:
        it: Tema preferito
      default: auto
      options:
      - value: auto
        label:
          it: Scegli tu il percorso
      - value: inflazione
        label:
          it: Inflazione
      - value: interesse_composto
        label:
          it: Interesse composto
      - value: etf
        label: ETF
      - value: costi
        label:
          it: Costi dei fondi
      - value: debito
        label:
          it: Debito
    goal: 'Oggi è {date}. Scrivi la micro-lezione del giorno per "{instance}". Tema preferito: {focus} (auto = segui il percorso).
      Profilo: {profile}. Quiz precedenti: {answers}. Progressi: {progress}. Piano dei contenuti: {plan}. Scrivi in italiano.'
    schedule:
      cron: 0 6 * * *
      userCanChange: false
    maxPerUser: 1
    deliver:
      to: owner
      subject: La tua lezione CinqueMinuti di oggi
      onlyIfNew: true
  triggers:
  - key: quiz_answered
    'on':
      collection: quiz_answers
      op: insert
    start:
      agent: progress_keeper
    goal: L'utente ha risposto al quiz della lezione del {record.lesson_date} con l'opzione {record.choice}. Aggiorna i progressi.
    asUser: true
  inputForm:
    title:
      it: Il tuo profilo
    fields: []
  data:
    collections:
    - name: profiles
      ownedBy: user
      description: Profilo finanziario di ciascun utente
      fields:
      - name: age
        type: number
        required: true
        label:
          it: Età
      - name: works
        type: boolean
        label:
          it: Lavori?
      - name: has_savings
        type: boolean
        label:
          it: Hai dei risparmi?
      - name: goals
        type: multiselect
        required: true
        label:
          it: Obiettivi
        options:
        - value: fondo_emergenze
          label:
            it: Fondo emergenze
        - value: casa
          label:
            it: Comprare casa
        - value: pensione
          label:
            it: Pensione
      - name: level
        type: select
        required: true
        label:
          it: Quanto ne sai di investimenti?
        options:
        - value: zero
          label:
            it: Niente
        - value: base
          label:
            it: Qualcosa
        - value: intermedio
          label:
            it: Abbastanza
    - name: lessons
      ownedBy: instance
      description: Storico delle micro-lezioni di ogni utente
      fields:
      - name: date
        type: date
        label:
          it: Data
      - name: title
        type: text
        label:
          it: Titolo
      - name: content
        type: textarea
        label:
          it: Lezione
    - name: quiz_answers
      ownedBy: user
      description: Risposte ai quiz
      retentionDays: 730
      fields:
      - name: lesson_date
        type: date
        required: true
        label:
          it: Data della lezione
      - name: choice
        type: select
        required: true
        label:
          it: La tua risposta
        options:
        - A
        - B
        - C
        - D
    - name: progress
      ownedBy: user
      description: Serie di giorni, punti e badge
      fields:
      - name: streak
        type: number
        label:
          it: Serie attuale
      - name: best_streak
        type: number
        label:
          it: Serie migliore
      - name: xp
        type: number
        label: XP
      - name: correct
        type: number
        label:
          it: Risposte corrette
      - name: answered
        type: number
        label:
          it: Risposte date
      - name: last_date
        type: date
        label:
          it: Ultimo quiz
      - name: badges
        type: multiselect
        label: Badge
    - name: curriculum
      ownedBy: shared
      description: Piano dei contenuti, modificabile dall'admin
      access:
      - role: admin
        can:
        - read
        - write
      fields:
      - name: order
        type: number
        required: true
        label:
          it: Ordine
      - name: topic
        type: text
        required: true
        label:
          it: Tema
      - name: outline
        type: textarea
        label:
          it: Punti da trattare
      - name: level
        type: select
        label:
          it: Livello
        options:
        - zero
        - base
        - intermedio
  views:
  - key: home
    type: page
    nav: false
    title: CinqueMinuti
    sections:
    - type: hero
      eyebrow:
        it: Educazione finanziaria
      title:
        it: Cinque minuti al giorno per capire i **soldi**.
      text:
        it: Una micro-lezione ogni mattina, su misura per te, con un esempio pratico e un quiz. Mantieni la tua serie di giorni
          e impara l'inflazione, l'interesse composto, gli ETF e molto altro.
      actions:
      - label:
          it: Inizia gratis per 2 settimane
        href: /login
        style: primary
      note:
        it: Poi abbonamento mensile. Disdici quando vuoi.
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
      items:
      - title:
          it: Raccontaci di te
        text:
          it: 'Età, lavoro, risparmi, obiettivi e livello: un minuto.'
        badge: 📝
      - title:
          it: Ricevi la lezione
        text:
          it: Ogni mattina nell'app e per email, da cinque minuti.
        badge: ☀️
      - title:
          it: Rispondi al quiz
        text:
          it: Il percorso si adatta a quello che hai capito.
        badge: ✅
      - title:
          it: Mantieni la serie
        text:
          it: Badge e giorni consecutivi per restare costante.
        badge: 🔥
    - type: cards
      id: prezzi
      title:
        it: Prezzi
      items:
      - title:
          it: Prime due settimane
        text:
          it: Gratis, senza impegno.
        badge: 🎁
      - title:
          it: Abbonamento mensile
        text:
          it: Lezioni quotidiane, quiz, chat con il tutor, progressi e badge.
        badge: ⭐
    - type: note
      content:
        it: CinqueMinuti offre contenuti educativi generali. Non è consulenza finanziaria personalizzata né una raccomandazione
          di investimento.
  - key: profile
    type: form
    collection: profiles
    title:
      it: Il mio profilo
    fields:
    - age
    - works
    - has_savings
    - goals
    - level
    submit:
      label:
        it: Salva profilo
      message:
        it: Profilo salvato. La prima lezione arriva domani mattina.
      redirect: lessons
    edit: true
    roles:
    - user
    - admin
  - key: setup
    type: instances
    template: daily_lesson
    title:
      it: Attiva le lezioni
    roles:
    - user
    - admin
  - key: lessons
    type: table
    title:
      it: Le mie lezioni
    source: collection:lessons
    columns:
    - date
    - title
    - content
    data:
      display: list
      fields:
      - key: date
        label:
          it: Data
        format: date
      - key: title
        label:
          it: Lezione
      - key: content
        label:
          it: Testo
      sort:
        field: date
        dir: desc
      limit: 60
      empty:
        it: La tua prima lezione arriva domani mattina.
    roles:
    - user
    - admin
  - key: quiz
    type: form
    collection: quiz_answers
    title:
      it: Rispondi al quiz
    fields:
    - lesson_date
    - choice
    submit:
      label:
        it: Invia risposta
      message:
        it: Risposta ricevuta! Stiamo aggiornando i tuoi progressi.
      redirect: progress
    roles:
    - user
    - admin
  - key: progress
    type: page
    title:
      it: I miei progressi
    sections:
    - type: data
      title:
        it: Serie, punti e badge
      source: collection:progress
      display: kpi
      kpis:
      - label:
          it: Giorni di fila
        agg: last
        field: streak
        format: number
      - label:
          it: Serie migliore
        agg: max
        field: best_streak
        format: number
      - label: XP
        agg: last
        field: xp
        format: number
      - label:
          it: Risposte corrette
        agg: last
        field: correct
        format: number
      empty:
        it: Rispondi al primo quiz per iniziare la serie.
    - type: data
      title: Badge
      source: collection:progress
      display: cards
      fields:
      - key: badges
        label: Badge
        format: badge
      limit: 1
    - type: view
      title:
        it: Rispondi al quiz di oggi
      view: quiz
    roles:
    - user
    - admin
  - key: chat
    type: chat
    title:
      it: Chiedi al tutor
    source: agent:tutor
    examples:
    - it: Che differenza c'è tra azioni e ETF?
    - it: Perché l'inflazione mangia i risparmi?
    - it: Quanto conta un costo dell'1% l'anno?
    placeholder:
      it: Fai una domanda… (contenuto educativo, non consulenza personalizzata)
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
    roles:
    - user
  - key: admin_plan
    type: table
    title:
      it: Piano dei contenuti
    source: collection:curriculum
    columns:
    - order
    - topic
    - level
    - outline
    export: true
    roles:
    - admin
  - key: admin_plan_edit
    type: form
    collection: curriculum
    title:
      it: Aggiungi o modifica tema
    submit:
      label:
        it: Salva tema
      message:
        it: Tema salvato.
      redirect: admin_plan
    edit: true
    roles:
    - admin
  - key: admin_stats
    type: page
    title:
      it: Statistiche
    sections:
    - type: data
      title:
        it: Serie media per settimana (anonima)
      source: collection:progress
      display: chart
      chart: line
      fields:
      - key: last_date
        label:
          it: Settimana
      - key: avg_streak
        label:
          it: Serie media
      groupBy:
        field: last_date
        bucket: week
        aggs:
        - key: avg_streak
          agg: avg
          field: streak
        - key: avg_correct
          agg: avg
          field: correct
        minCount: 5
        acrossUsers: true
    - type: data
      title:
        it: Utenti attivi per settimana
      source: collection:quiz_answers
      display: bar
      fields:
      - key: lesson_date
        label:
          it: Settimana
      - key: count
        label:
          it: Risposte
      groupBy:
        field: lesson_date
        bucket: week
        aggs: []
        minCount: 5
        acrossUsers: true
    roles:
    - admin
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: mensile
      price: 4.99
      interval: month
      label:
        it: CinqueMinuti Mensile
      includes:
      - Lezione quotidiana
      - Quiz e badge
      - Chat con il tutor
  notifications:
    emailOnRunDone: false
  mobile:
    appId: eu.webrobot.cinqueminuti
  extensions:
  - key: push_notifications
    description: 'Notifica push su telefono con la lezione del giorno: non ancora disponibile (solo email). La shell mobile
      installabile è dichiarata in spec.mobile; il push va aggiunto quando la piattaforma lo supporterà.'
  - key: free_trial_14_days
    description: 'Le prime due settimane gratuite prima dell''abbonamento non sono esprimibili nel manifest: da configurare
      come periodo di prova nel piano Stripe o con crediti di benvenuto.'
  - key: streak_reminder
    description: 'Promemoria per non perdere la serie di giorni: richiede push, per ora solo email giornaliera.'
