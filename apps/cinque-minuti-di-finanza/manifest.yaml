apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: cinqueminuti
  displayName: CinqueMinuti
  tagline:
    it: Cinque minuti al giorno per capire i soldi e gli investimenti.
  description:
    it: Ogni mattina una micro-lezione di educazione finanziaria su misura per te, con un esempio pratico e una domanda di
      verifica. Un percorso che si adatta, una chat per i dubbi, badge e giorni consecutivi da mantenere.
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#16415a'
      accent: '#1f9d7a'
      background: '#f6faf8'
      foreground: '#16212b'
    fonts:
      body: Inter
      display: Poppins
    wordmark:
    - text: Cinque
      color: primary
    - text: Minuti
      color: accent
    buttonShape: pill
  header:
    links:
    - label: Come funziona
      href: '#come-funziona'
    - label: Temi
      href: '#temi'
    - label: Prezzi
      href: '#prezzi'
    cta:
      label: Inizia gratis
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: user
      label: Utente
      assignedBy: signup
  limits:
  - action: chat
    per: user
    max: 30
    window: day
    roles:
    - user
  - action: agent:corrector
    per: user
    max: 10
    window: day
    roles:
    - user
  agents:
  - key: lesson_writer
    role: scheduled
    description: Ogni mattina scrive la micro-lezione personalizzata di una persona e adatta il percorso.
    memory: instance
    profile:
      inline:
        display_name: CinqueMinuti – autore lezioni
        crews:
        - id: lesson_writer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un educatore finanziario che scrive micro-lezioni da cinque minuti (circa 450 parole) per giovani
            adulti che non sanno nulla di investimenti. Tono amichevole, frasi brevi, zero gergo non spiegato. Prima di scrivere:
            leggi il piano dei contenuti con il tool read_plan e i risultati recenti con read_progress; la tua memoria contiene
            gli argomenti già trattati e i punti deboli. Il profilo della persona (età, lavoro, risparmi, obiettivi, livello)
            è nel compito che ricevi. Scegli il prossimo tema attivo del piano adatto al livello della persona; se le ultime
            risposte sono sbagliate, ripassa o semplifica; se sono giuste, vai avanti. Struttura obbligatoria: un titolo di
            primo livello "# <Titolo della lezione>"; poi sezioni ## Perché ti riguarda, ## L''idea in breve, ## Un esempio
            pratico (con numeri semplici e verosimili, dichiarati come esempi, mai rendimenti promessi), ## Da ricordare (3
            punti), ## Domanda di verifica (una domanda a scelta multipla con opzioni A, B, C, D; NON rivelare la risposta
            giusta). Chiudi con la riga "Tema: <tema>". Non dare consulenza personalizzata, non consigliare prodotti o titoli
            specifici, non inventare dati o percentuali presentandoli come fatti. Alla fine chiama una volta il tool remember
            con: temi trattati, livello stimato, punti deboli. Scrivi in italiano.'
          mcp_servers: []
    appTools:
    - name: read_plan
      description: Legge il piano dei contenuti (temi, ordine, livello, attivo).
      action: read
      collection: content_plan
      scope: all
    - name: read_progress
      description: Legge le risposte e i progressi recenti della persona.
      action: read
      collection: progress
      scope: user
    goalTemplate: Scrivi la lezione di oggi ({date}) per questa persona, usando il profilo del suo percorso. Scrivi in italiano.
    writesTo:
      collection: lessons
      parse: whole
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.3
  - key: corrector
    role: main
    description: Corregge la risposta alla domanda di verifica, spiega, aggiorna giorni consecutivi e badge.
    memory: user
    profile:
      inline:
        display_name: CinqueMinuti – verifica
        crews:
        - id: corrector
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.15
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Correggi la risposta della persona alla domanda di verifica dell''ultima lezione. Leggi l''ultima
            lezione con read_lessons. Stabilisci con rigore quale opzione è corretta, poi rispondi con: "# Verifica: <esatta|da
            rivedere>", sezioni ## La risposta giusta, ## Perché, ## Il tuo percorso (giorni consecutivi, badge nuovi, cosa
            vedrai nelle prossime lezioni). La tua memoria contiene serie di giorni consecutivi (streak) e badge già ottenuti:
            se la persona ha risposto oggi e ieri la serie aumenta, se ha saltato un giorno riparte da 1. Badge possibili:
            Prima lezione, 3 giorni di fila, 7 giorni di fila, 14 giorni di fila, 5 risposte esatte, Tema completato. Registra
            il risultato con save_progress (campi: date, topic, correct, streak, badges) e poi chiama remember con streak
            e badge aggiornati. Tono incoraggiante, italiano, nessuna consulenza personalizzata.'
          mcp_servers: []
    appTools:
    - name: read_lessons
      description: Legge le lezioni della persona, la più recente per prima.
      action: read
      collection: lessons
      scope: user
    - name: save_progress
      description: Registra il risultato di una verifica.
      action: append
      collection: progress
      scope: user
    goalTemplate: 'Risposta data dalla persona: {answer_label}. Data di oggi: {date}.'
    output: markdown
    limits:
      maxTurns: 6
      maxBudgetUsd: 0.15
  - key: tutor
    role: helper
    description: Chat per domande libere di educazione finanziaria, con avvertenza.
    memory: user
    profile:
      inline:
        display_name: CinqueMinuti – tutor
        chat_mode: true
        crews:
        - id: tutor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 4
          max_budget_usd: 0.1
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei il tutor di CinqueMinuti: spieghi concetti di finanza personale e investimenti a giovani adulti
            principianti, con parole semplici ed esempi concreti. Risposte brevi (max 200 parole). Ricorda sempre, quando
            si parla di scelte concrete, che è educazione finanziaria e NON consulenza personalizzata: non dire cosa comprare
            o vendere, non promettere rendimenti, non inventare dati; se non sei sicuro, dillo. Per questioni su tasse o legge
            indica di rivolgersi a un professionista abilitato. Rispondi in italiano.'
    goalTemplate: 'Conversazione finora:

      {history}


      Nuova domanda: {message}'
    output: markdown
    limits:
      maxTurns: 4
      maxBudgetUsd: 0.1
  inputForm:
    title: Verifica di oggi
    fields:
    - name: answer
      type: select
      required: true
      label: La tua risposta alla domanda di verifica
      options:
      - value: A
        label: A
      - value: B
        label: B
      - value: C
        label: C
      - value: D
        label: D
  templates:
  - key: percorso
    title: Il mio percorso
    description: Il tuo profilo e la lezione di ogni mattina, adattata alle tue risposte.
    agent: lesson_writer
    params:
    - name: age
      type: number
      required: true
      label: Età
    - name: works
      type: select
      required: true
      label: Lavori?
      options:
      - value: 'yes'
        label: Sì
      - value: 'no'
        label: 'No'
      - value: student
        label: Studio
    - name: savings
      type: select
      required: true
      label: Hai risparmi?
      options:
      - value: none
        label: 'No'
      - value: some
        label: Qualcosa
      - value: many
        label: Sì, diversi mesi di spese
    - name: goals
      type: multiselect
      required: true
      label: Obiettivi
      options:
      - value: emergency
        label: Fondo emergenze
      - value: home
        label: Casa
      - value: pension
        label: Pensione
    - name: level
      type: select
      required: true
      label: Quanto ne sai?
      options:
      - value: zero
        label: Parto da zero
      - value: basic
        label: Qualche nozione
      - value: some
        label: Conosco le basi
    goal: 'Scrivi la lezione di oggi ({date}) per "{instance}". Età: {age}. Lavora: {works}. Risparmi: {savings}. Obiettivi:
      {goals}. Livello: {level}. Scrivi in italiano.'
    schedule:
      cron: 0 5 * * *
      userCanChange: false
    maxPerUser: 1
    cost:
      perRun: 10
  data:
    collections:
    - name: lessons
      ownedBy: instance
      description: Le micro-lezioni giornaliere di ogni percorso
      fields:
      - name: date
        type: date
        label: Data
      - name: topic
        type: text
        label: Tema
      - name: title
        type: text
        label: Titolo
      - name: body
        type: textarea
        label: Lezione
    - name: progress
      ownedBy: user
      description: Risultati delle verifiche, giorni consecutivi e badge
      fields:
      - name: date
        type: date
        label: Data
      - name: topic
        type: text
        label: Tema
      - name: correct
        type: boolean
        label: Esatta
      - name: streak
        type: number
        label: Giorni di fila
      - name: badges
        type: text
        label: Badge
    - name: content_plan
      ownedBy: shared
      description: Piano dei contenuti, modificabile dall'admin
      fields:
      - name: order
        type: number
        label: Ordine
      - name: topic
        type: text
        label: Tema
      - name: summary
        type: textarea
        label: Cosa copre
      - name: level
        type: select
        label: Livello
        options:
        - zero
        - basic
        - some
      - name: active
        type: boolean
        label: Attivo
        default: true
  views:
  - key: home
    type: page
    title: CinqueMinuti
    nav: false
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow: Educazione finanziaria
      title: Cinque minuti al giorno per capire **i soldi**.
      text: 'Ogni mattina una micro-lezione su misura per te: inflazione, interesse composto, ETF, costi dei fondi, debito.
        Con un esempio pratico e una domanda per verificare.'
      actions:
      - label: Inizia gratis
        href: /login
        style: primary
      - label: Come funziona
        href: '#come-funziona'
        style: ghost
      note: Prime due settimane gratis, poi abbonamento mensile.
      aside: '<div style="padding:16px"><strong>Lezione di oggi</strong><br>Perché 100 € oggi valgono più di 100 € tra dieci
        anni.<br><em>Domanda: cosa succede ai tuoi risparmi se i prezzi salgono del 3% l''anno?</em></div>'
    - type: steps
      id: come-funziona
      title: Come funziona
      items:
      - title: Racconti di te
        text: Età, lavoro, risparmi, obiettivi e quanto ne sai.
        badge: 📝
      - title: Una lezione ogni mattina
        text: Cinque minuti, con esempio pratico e domanda a scelta multipla.
        badge: ☀️
      - title: Il percorso si adatta
        text: 'Rispondi: ripassiamo quello che serve o andiamo avanti.'
        badge: 🎯
      - title: Costruisci la serie
        text: Giorni consecutivi e badge per restare costante.
        badge: 🔥
    - type: cards
      id: temi
      title: Alcuni temi del percorso
      items:
      - title: Inflazione
        text: Perché i prezzi salgono e cosa fa ai tuoi risparmi.
      - title: Interesse composto
        text: Il tempo come alleato.
      - title: ETF
        text: Cosa sono e come si leggono.
      - title: Costi dei fondi
        text: Le commissioni che mangiano il rendimento.
      - title: Debito
        text: Quando pesa e quando no.
    - type: cards
      id: prezzi
      title: Prezzi
      items:
      - title: Prime 2 settimane gratis
        text: Prova il percorso completo.
      - title: Abbonamento mensile
        text: Lezione quotidiana, chat con il tutor, progressi e badge.
    - type: note
      content: CinqueMinuti offre educazione finanziaria generale, non consulenza personalizzata né raccomandazioni di investimento.
        Gli esempi numerici sono illustrativi.
  - key: percorso
    type: instances
    template: percorso
    title: Il mio percorso
    roles:
    - user
    - admin
  - key: verifica
    type: new_run
    title: Rispondi alla verifica
    roles:
    - user
  - key: verifica_report
    type: report
    source: run
    printable: false
    nav: false
  - key: storico
    type: table
    title: Storico lezioni
    source: collection:lessons
    data:
      display: table
      fields:
      - key: date
        label: Data
        format: date
      - key: topic
        label: Tema
      - key: title
        label: Titolo
      sort:
        field: date
        dir: desc
      limit: 100
      empty: 'Nessuna lezione ancora: la prima arriva domattina.'
    roles:
    - user
    - admin
  - key: progressi
    type: page
    title: Progressi e badge
    roles:
    - user
    sections:
    - type: data
      title: I tuoi numeri
      source: collection:progress
      display: kpi
      kpis:
      - label: Verifiche svolte
        agg: count
      - label: Giorni di fila
        agg: last
        field: streak
        format: number
    - type: data
      title: Badge e risultati
      source: collection:progress
      display: table
      fields:
      - key: date
        label: Data
        format: date
      - key: topic
        label: Tema
      - key: correct
        label: Esatta
        format: badge
      - key: streak
        label: Giorni di fila
        format: number
      - key: badges
        label: Badge
      sort:
        field: date
        dir: desc
      limit: 60
      empty: Rispondi alla prima verifica per sbloccare i badge.
  - key: chat
    type: chat
    title: Chiedi al tutor
    source: agent:tutor
    examples:
    - Cos'è un ETF?
    - Che differenza c'è tra risparmiare e investire?
    - Perché i costi dei fondi contano?
    placeholder: Fai una domanda di finanza. Educazione, non consulenza personalizzata.
    roles:
    - user
    - admin
  - key: account
    type: account
    title: Abbonamento
    roles:
    - user
  - key: admin
    type: tabs
    title: Admin
    children:
    - admin_stats
    - admin_plan
    roles:
    - admin
  - key: admin_stats
    type: admin
    title: Statistiche
    roles:
    - admin
    nav: false
  - key: admin_plan
    type: table
    title: Piano dei contenuti
    source: collection:content_plan
    data:
      display: table
      fields:
      - key: order
        label: Ordine
        format: number
      - key: topic
        label: Tema
      - key: level
        label: Livello
        format: badge
      - key: active
        label: Attivo
        format: badge
      sort:
        field: order
        dir: asc
      limit: 100
    roles:
    - admin
    nav: false
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 140
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:corrector: 1
      chat: 1
    plans:
    - key: mensile
      price: 7.99
      interval: month
      label: CinqueMinuti mensile
      includes:
      - lezione quotidiana
      - chat con il tutor
      - progressi e badge
      credits: 320
      creditsReset: monthly
    packs:
    - key: extra
      credits: 200
      price: 4
      label: Crediti extra
  mobile:
    appId: eu.webrobot.cinqueminuti
  extensions:
  - key: push_notifications
    description: 'Notifica push sul telefono quando arriva la lezione del mattino e promemoria per non perdere la serie: non
      disponibile ancora.'
  - key: email_lesson
    description: 'Invio della lezione per email ogni mattina: le notifiche email non sono ancora disponibili; per ora la lezione
      si legge nell''app.'
  - key: free_trial_14_days
    description: Le prime due settimane gratis sono approssimate con 140 crediti di benvenuto (14 lezioni da 10 crediti);
      un vero periodo di prova a tempo richiede codice dedicato.
  - key: admin_aggregate_stats
    description: Statistiche aggregate (utenti attivi, tasso di risposte esatte, serie medie) fornite dalla vista admin standard;
      metriche specifiche dei temi richiedono un'estensione.
