apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: garanzia-riparazioni
  displayName: Garanzia & Riparazioni
  tagline:
    it: Dal guasto alla riparazione, con la pratica sempre sotto controllo.
  description:
    it: Portale per registrare i prodotti, aprire pratiche di garanzia e riparazione, ricevere una diagnosi guidata da un
      agente AI, prenotare l'intervento e seguire ogni passaggio.
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1d3557'
      accent: '#e07a1f'
      background: '#f7f8fa'
      foreground: '#1b1f24'
    fonts:
      body: Inter
      display: Manrope
    wordmark:
    - text: Garanzia
      color: primary
    - text: '&Riparazioni'
      color: accent
  header:
    links:
    - label:
        it: Come funziona
      href: '#come-funziona'
    - label:
        it: Rivenditori
      href: '#rivenditori'
    cta:
      label:
        it: Accedi
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: user
      label:
        it: Cliente
      assignedBy: signup
    - key: reseller
      label:
        it: Rivenditore partner
      assignedBy: derived
      from: collection:resellers.email
    - key: operator
      label:
        it: Operatore
      assignedBy: invite
  limits:
  - action: create:claims
    per: user
    max: 20
    window: month
    roles:
    - user
  agents:
  - key: triage
    role: main
    description: Classifica il guasto, verifica la garanzia, propone i primi controlli e sceglie il centro competente.
    profile:
      inline:
        display_name: Triage garanzia
        crews:
        - id: triage
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 14
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''assistente di triage di un servizio di garanzia e riparazioni. Scrivi in italiano. Per ogni
            pratica: 1) leggi il prodotto dell''utente con read_products e, se ci sono foto (scontrino o guasto), aprile con
            read_upload passando l''id del file. 2) Classifica il guasto (categoria: elettrico, meccanico, software, estetico,
            accessori, altro) e la gravita. 3) Verifica la garanzia usando solo i dati registrati: data di acquisto dello
            scontrino/prodotto e la garanzia legale di conformita di 24 mesi per i consumatori; se la data manca o lo scontrino
            e illeggibile scrivi ''da verificare''. Non dare mai la garanzia per certa: e una valutazione preliminare che
            l''operatore puo correggere. Escludi dalla garanzia solo cio che i dati mostrano chiaramente (es. danno da caduta
            o liquidi visibile). 4) Proponi 3-5 controlli semplici e sicuri che il cliente puo fare subito. Se c''e rischio
            per la sicurezza (fumo, odore di bruciato, scosse, gonfiore batteria) di'' di spegnere e scollegare il prodotto
            ed escala. 5) Se serve un intervento, leggi i centri con read_centers, scegli il piu competente per citta/zona
            e tipo di prodotto, e indica fino a 3 opzioni. Non puoi vedere gli slot liberi: invita il cliente a sceglierne
            uno nella pagina Prenota. 6) Aggiorna la pratica con update_claim: category, warranty (in_garanzia | fuori_garanzia
            | da_verificare), first_checks, summary, reseller_email copiato dal prodotto, center e center_email del centro
            scelto, e status: ''controlli_proposti'' se i controlli possono bastare, ''da_prenotare'' se serve intervento,
            ''escalata'' per casi complessi, dubbi sulla garanzia di valore o rischi di sicurezza. Non inventare dati, modelli
            o prezzi. Il report inizia con un titolo di livello 1 ''# Pratica <prodotto> — <categoria>'' e ha le sezioni ##
            Diagnosi, ## Garanzia, ## Primi controlli, ## Prossimo passo.'
          mcp_servers: []
    goalTemplate: 'Apri la pratica {record.id}. Prodotto (id): {record.product}. Descrizione del cliente: {record.description}.
      File allegati (id): {record.photos}. Data di oggi: {date}. Scrivi in italiano.'
    appTools:
    - name: read_products
      description: Legge i prodotti registrati dal cliente
      action: read
      collection: products
      scope: user
    - name: read_centers
      description: Elenca i centri di riparazione con zona e categorie trattate
      action: read
      collection: centers
      scope: all
    - name: update_claim
      description: Aggiorna la pratica del cliente (categoria, garanzia, controlli, centro, stato)
      action: write
      collection: claims
      scope: user
    - name: read_upload
      description: Legge un file caricato dal cliente (foto, scontrino, OCR incluso)
      action: read_file
    output: markdown
    limits:
      maxTurns: 14
      maxBudgetUsd: 0.5
  inputForm:
    title:
      it: Nuova pratica
    fields:
    - name: note
      type: textarea
      maxLength: 400
      label:
        it: Note
  data:
    collections:
    - name: resellers
      description: Rivenditori partner (gestiti dall'admin)
      ownedBy: shared
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome
      - name: email
        type: email
        required: true
        label:
          it: Email
    - name: centers
      description: Centri di riparazione convenzionati
      ownedBy: shared
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome
      - name: city
        type: city
        label:
          it: Citta
      - name: area
        type: text
        label:
          it: Zona servita
      - name: categories
        type: text
        label:
          it: Categorie trattate
      - name: email
        type: email
        label:
          it: Email
    - name: products
      description: Prodotti registrati dai clienti
      ownedBy: user
      retentionDays: 1825
      fields:
      - name: type
        type: select
        required: true
        label:
          it: Tipo di prodotto
        options:
        - elettrodomestico
        - telefono
        - computer
        - tv e audio
        - utensile
        - altro
      - name: brand
        type: text
        required: true
        label:
          it: Marca
      - name: model
        type: text
        label:
          it: Modello
      - name: purchase_date
        type: date
        required: true
        label:
          it: Data di acquisto
      - name: receipt
        type: file
        required: true
        accept:
        - jpg
        - jpeg
        - png
        - pdf
        maxMb: 10
        label:
          it: Foto dello scontrino
      - name: reseller_email
        type: email
        label:
          it: Email del rivenditore
        help:
          it: Se hai acquistato da un rivenditore partner.
      access:
      - role: reseller
        where:
          reseller_email: '{user.email}'
        can:
        - read
      - role: operator
        can:
        - read
    - name: claims
      description: Pratiche di garanzia e riparazione
      ownedBy: user
      retentionDays: 1825
      fields:
      - name: product
        type: relation
        relation: products
        required: true
        label:
          it: Prodotto
      - name: description
        type: textarea
        required: true
        maxLength: 2000
        label:
          it: Descrivi il problema
      - name: photos
        type: file
        multiple: true
        accept:
        - jpg
        - jpeg
        - png
        - webp
        maxMb: 10
        label:
          it: Foto del guasto
      - name: status
        type: select
        default: ricevuta
        label:
          it: Stato
        options:
        - ricevuta
        - controlli_proposti
        - da_prenotare
        - appuntamento
        - in_riparazione
        - chiusa
        - escalata
      - name: category
        type: text
        label:
          it: Categoria guasto
      - name: warranty
        type: select
        label:
          it: Garanzia
        options:
        - in_garanzia
        - fuori_garanzia
        - da_verificare
      - name: first_checks
        type: textarea
        label:
          it: Primi controlli
      - name: summary
        type: textarea
        label:
          it: Sintesi
      - name: center
        type: text
        label:
          it: Centro di riparazione
      - name: center_email
        type: email
        label:
          it: Email del centro
      - name: reseller_email
        type: email
        label:
          it: Rivenditore
      access:
      - role: reseller
        where:
          reseller_email: '{user.email}'
        can:
        - read
      - role: operator
        can:
        - read
        - write
    - name: appointments
      description: Appuntamenti presso i centri di riparazione
      ownedBy: user
      retentionDays: 730
      fields:
      - name: claim_ref
        type: text
        label:
          it: Numero pratica
      - name: notes
        type: textarea
        label:
          it: Note
      access:
      - role: operator
        can:
        - read
  views:
  - key: home
    type: page
    title: Garanzia & Riparazioni
    nav: false
    sections:
    - type: hero
      title:
        it: Dal guasto alla riparazione, **senza giri a vuoto**.
      text:
        it: 'Registra i tuoi prodotti, apri una pratica con foto e descrizione: un agente AI valuta la garanzia, ti propone
          i primi controlli e ti aiuta a prenotare l''intervento nel centro giusto.'
      actions:
      - label:
          it: Apri una pratica
        href: /login
        style: primary
      - label:
          it: Come funziona
        href: '#come-funziona'
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
      items:
      - title:
          it: Registra il prodotto
        text:
          it: Tipo, marca, data di acquisto e foto dello scontrino.
        badge: 📦
      - title:
          it: Apri la pratica
        text:
          it: 'Descrivi il problema e allega le foto: l''agente classifica il guasto e verifica la garanzia.'
        badge: 🛠️
      - title:
          it: Prenota e segui
        text:
          it: Scegli uno slot libero nel centro competente e ricevi un'email a ogni passaggio.
        badge: 📅
    - type: cards
      id: rivenditori
      title:
        it: Per i rivenditori partner
      items:
      - title:
          it: Le pratiche dei tuoi clienti
        text:
          it: Vedi stato e diagnosi delle pratiche collegate ai tuoi vendite, con esportazione CSV.
      - title:
          it: Casi complessi
        text:
          it: Un operatore umano prende in carico i casi che l'agente non può chiudere.
    - type: note
      content:
        it: La valutazione di garanzia dell'agente è preliminare e può essere corretta da un operatore. Il servizio non sostituisce
          i diritti di legge del consumatore.
  - key: product_new
    type: form
    title:
      it: Registra prodotto
    collection: products
    fields:
    - type
    - brand
    - model
    - purchase_date
    - receipt
    - reseller_email
    submit:
      label:
        it: Registra
      message:
        it: Prodotto registrato.
      redirect: my_products
    roles:
    - user
  - key: my_products
    type: table
    title:
      it: I miei prodotti
    source: collection:products
    columns:
    - type
    - brand
    - model
    - purchase_date
    roles:
    - user
  - key: claim_new
    type: form
    title:
      it: Nuova pratica
    collection: claims
    fields:
    - product
    - description
    - photos
    submit:
      label:
        it: Apri pratica
      message:
        it: 'Pratica aperta: l''agente la sta valutando, riceverai un''email.'
      redirect: my_claims
    roles:
    - user
  - key: my_claims
    type: table
    title:
      it: Le mie pratiche
    source: collection:claims
    columns:
    - status
    - category
    - warranty
    - first_checks
    - center
    - summary
    roles:
    - user
  - key: book
    type: booking
    title:
      it: Prenota intervento
    collection: appointments
    resources: collection:centers
    fields:
    - claim_ref
    - notes
    slots:
      days:
      - 1
      - 2
      - 3
      - 4
      - 5
      from: 09:00
      to: '18:00'
      minutes: 60
      tz: Europe/Rome
      aheadDays: 21
      minNoticeHours: 24
      capacity: 1
    roles:
    - user
  - key: claims_all
    type: table
    title:
      it: Pratiche
    source: collection:claims
    columns:
    - status
    - category
    - warranty
    - center
    - reseller_email
    - summary
    export: true
    roles:
    - reseller
    - operator
    - admin
  - key: claim_edit
    type: form
    title:
      it: Gestisci pratica
    collection: claims
    fields:
    - status
    - warranty
    - center
    - center_email
    - summary
    edit: true
    nav: false
    submit:
      label:
        it: Salva
      message:
        it: Pratica aggiornata.
      redirect: claims_all
    roles:
    - operator
    - admin
  - key: appointments_all
    type: table
    title:
      it: Appuntamenti
    source: collection:appointments
    columns:
    - start
    - resource
    - status
    - claim_ref
    roles:
    - operator
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
    roles:
    - reseller
    - admin
  triggers:
  - key: triage_start
    'on':
      collection: claims
      op: insert
      where:
        status: ricevuta
    start:
      agent: triage
    goal: 'Apri la pratica {record.id}. Prodotto (id): {record.product}. Descrizione del cliente: {record.description}. File
      allegati (id): {record.photos}. Scrivi in italiano.'
  - key: n_received
    'on':
      collection: claims
      op: insert
    notify:
      to: owner
      subject:
        it: Pratica ricevuta
      body:
        it: Abbiamo ricevuto la tua pratica. Ti scriveremo appena sarà valutata.
      link: my_claims
  - key: n_checks
    'on':
      collection: claims
      op: update
      where:
        status: controlli_proposti
    notify:
      to: owner
      subject:
        it: Primi controlli per la tua pratica
      body:
        it: Abbiamo valutato la tua pratica e proposto alcuni controlli da fare. Se non risolvono, aggiorneremo la pratica.
      link: my_claims
  - key: n_book
    'on':
      collection: claims
      op: update
      where:
        status: da_prenotare
    notify:
      to: owner
      subject:
        it: 'Serve un intervento: scegli lo slot'
      body:
        it: Per la tua pratica serve un intervento. Scegli un appuntamento tra gli slot liberi.
      link: book
  - key: n_center
    'on':
      collection: claims
      op: update
      where:
        status: da_prenotare
    notify:
      to: record.center_email
      subject:
        it: 'Nuova pratica in arrivo: {record.category}'
      body:
        it: 'Una nuova pratica ({record.category}, garanzia: {record.warranty}) è stata inoltrata al vostro centro. Sintesi:
          {record.summary}'
  - key: n_booked
    'on':
      collection: appointments
      op: insert
    notify:
      to: owner
      subject:
        it: Appuntamento confermato
      body:
        it: 'Il tuo appuntamento è confermato: {record.date}.'
      link: my_claims
  - key: n_reminder
    'on':
      date:
        collection: appointments
        field: start
        offsetDays: -1
        hour: 8
    notify:
      to: owner
      subject:
        it: 'Promemoria: appuntamento domani'
      body:
        it: Domani hai un appuntamento per la tua riparazione.
      link: my_claims
  - key: n_repair
    'on':
      collection: claims
      op: update
      where:
        status: in_riparazione
    notify:
      to: owner
      subject:
        it: Riparazione in corso
      body:
        it: Il tuo prodotto è in riparazione.
      link: my_claims
  - key: n_closed
    'on':
      collection: claims
      op: update
      where:
        status: chiusa
    notify:
      to: owner
      subject:
        it: Pratica chiusa
      body:
        it: La tua pratica è stata chiusa. Grazie per aver usato il servizio.
      link: my_claims
  - key: n_escalated
    'on':
      collection: claims
      op: update
      where:
        status: escalata
    notify:
      to:
      - owner
      - role:operator
      subject:
        it: Pratica presa in carico da un operatore
      body:
        it: La pratica richiede la valutazione di un operatore, che ti contatterà a breve.
      link: my_claims
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: partner
      price: 49
      interval: month
      label:
        it: Rivenditore partner
      includes:
      - pratiche dei propri clienti
      - esportazione CSV
      roles:
      - reseller
  notifications:
    emailOnRunDone: false
  extensions:
  - key: fee_per_pratica
    description: 'La fee per pratica gestita da addebitare al rivenditore partner non è disponibile: gli addebiti per evento
      colpiscono l''utente dell''evento (il cliente), non il rivenditore. Per ora solo abbonamento; la fee va fatturata fuori
      piattaforma.'
  - key: slot_liberi_agente
    description: 'L''agente non vede gli slot liberi: propone il centro e il cliente sceglie lo slot nella vista Prenota.
      La pratica passa a ''appuntamento'' per mano dell''operatore.'
