apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: contratto-chiaro
  displayName: ContrattoChiaro
  tagline:
    it: Crea, revisiona e firma i tuoi contratti, in parole semplici.
  description:
    it: ContrattoChiaro aiuta le piccole imprese a redigere bozze di contratto, a capire quelli ricevuti, a farli rivedere
      da un avvocato convenzionato e a tenerne l'archivio con le scadenze.
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f3a5f'
      accent: '#2a7f62'
      background: '#f7f8fa'
      foreground: '#1b2430'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Contratto
      color: primary
    - text: Chiaro
      color: accent
  header:
    links:
    - label: Come funziona
      href: '#come-funziona'
    - label: Cosa include
      href: '#cosa-include'
    cta:
      label: Inizia
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      label: Impresa
      assignedBy: signup
    - key: lawyer
      label: Avvocato convenzionato
      assignedBy: derived
      from: collection:contracts.lawyer_email
  limits:
  - action: run
    per: user
    max: 20
    window: day
    roles:
    - user
  egress:
    hosts:
    - www.normattiva.it
    notes: 'Normattiva: portale pubblico della normativa italiana, usato solo per verificare i riferimenti normativi citati
      nelle bozze, nel rispetto delle condizioni d''uso.'
  agents:
  - key: drafter
    role: main
    when: mode == 'create'
    description: Redige la bozza di contratto dai modelli e verifica i riferimenti su Normattiva.
    awaits:
    - legal_review
    profile:
      inline:
        display_name: ContrattoChiaro redattore
        crews:
        - id: drafter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un redattore di contratti per piccole imprese italiane. Produci una bozza completa nella lingua
            italiana, partendo dalla struttura standard del tipo di contratto scelto (NDA, fornitura, agenzia, consulenza,
            locazione commerciale). Struttura obbligatoria: primo rigo ''# <Tipo di contratto> — <Parte A> / <Parte B>'';
            poi ## Premesse, ## Articoli numerati (oggetto, durata e recesso, corrispettivo e pagamenti, obblighi delle parti,
            penali, riservatezza e dati personali se pertinenti, risoluzione, legge applicabile e foro competente), ## Firme,
            e infine ## Riferimenti normativi con ogni norma citata (es. articoli del Codice civile, D.Lgs. 231/2002 sui ritardi
            di pagamento, GDPR) e l''esito della verifica. Prima di citare una norma, usa lo strumento normattiva_search per
            verificarne l''esistenza e il testo vigente; se non riesci a verificarla, scrivi ''da verificare'' e non inventare
            numeri di articolo. Non inventare dati delle parti: usa [DA COMPLETARE]. Usa solo i dati del modulo. Precisa in
            una nota finale che la bozza è un supporto e non sostituisce un parere legale. Se l''utente ha richiesto la revisione
            dell''avvocato, dopo la bozza chiama lo strumento request_legal_review con titolo e riepilogo della bozza.'
          mcp_servers: []
    appTools:
    - name: normattiva_search
      description: Cerca e legge norme italiane su Normattiva per verificare i riferimenti
      action: http
      http:
        method: GET
        url: https://www.normattiva.it
        allowPath: true
        attribution: Normattiva, Istituto Poligrafico e Zecca dello Stato
    goalTemplate: 'Tipo di contratto: {contract_type_label}

      Parte A: {party_a}

      Parte B: {party_b}

      Oggetto: {subject}

      Durata: {duration}

      {?fee}Corrispettivo: {fee}{/fee}

      {?penalties}Penali: {penalties}{/penalties}

      Foro competente: {jurisdiction}

      {?notes}Note: {notes}{/notes}

      {?legal_review}L''utente richiede la revisione di un avvocato convenzionato: richiedila al termine.{/legal_review}

      Data di oggi: {date}. Scrivi in italiano.'
    output: markdown
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.8
  - key: reviewer
    role: main
    when: mode == 'review'
    description: Analizza un contratto ricevuto ed evidenzia clausole sbilanciate o mancanti.
    awaits:
    - legal_review
    profile:
      inline:
        display_name: ContrattoChiaro revisore
        crews:
        - id: reviewer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un revisore di contratti per piccole imprese italiane. Analizzi il contratto ricevuto dalla
            controparte (testo fornito, oppure file letto con lo strumento read_upload usando l''id del file) dal punto di
            vista dell''impresa utente. Struttura obbligatoria: primo rigo ''# Revisione — <titolo del contratto>''; ## Sintesi
            in tre righe con un livello di rischio (basso/medio/alto); ## Clausole sbilanciate: per ciascuna cita la clausola,
            spiega in parole semplici perché è a sfavore, e proponi un testo alternativo; ## Clausole mancanti con proposta;
            ## Da verificare con un avvocato. Usa normattiva_search per verificare le norme che citi; se non verificabili
            scrivi ''da verificare''. Non inventare clausole che non esistono nel testo. Specifica che non è un parere legale.
            Se l''utente ha richiesto l''avvocato, chiama request_legal_review a fine analisi.'
          mcp_servers: []
    appTools:
    - name: read_upload
      description: Legge un file caricato dall'utente (OCR incluso)
      action: read_file
    - name: normattiva_lookup
      description: Cerca e legge norme italiane su Normattiva per verificare i riferimenti
      action: http
      http:
        method: GET
        url: https://www.normattiva.it
        allowPath: true
        attribution: Normattiva, Istituto Poligrafico e Zecca dello Stato
    goalTemplate: 'Revisiona il contratto ricevuto. File: {contract_file}

      {?contract_file_text}Testo:

      {contract_file_text}{/contract_file_text}

      {?notes}Note dell''utente: {notes}{/notes}

      {?legal_review}L''utente richiede la revisione di un avvocato convenzionato: richiedila al termine.{/legal_review}

      Data di oggi: {date}. Scrivi in italiano.'
    output: markdown
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.8
  inputForm:
    title: Nuova pratica
    fields:
    - name: mode
      type: select
      required: true
      label: Cosa vuoi fare
      default: create
      options:
      - value: create
        label: Creare un contratto
      - value: review
        label: Revisionare un contratto ricevuto
    - name: contract_type
      type: select
      required: true
      label: Tipo di contratto
      visibleWhen: mode == 'create'
      options:
      - value: nda
        label: NDA (riservatezza)
      - value: fornitura
        label: Fornitura
      - value: agenzia
        label: Agenzia
      - value: consulenza
        label: Consulenza
      - value: locazione
        label: Locazione commerciale
    - name: party_a
      type: text
      label: Parte A (la tua impresa)
      visibleWhen: mode == 'create'
      required: true
    - name: party_b
      type: text
      label: Parte B (controparte)
      visibleWhen: mode == 'create'
      required: true
    - name: subject
      type: textarea
      maxLength: 1200
      label: Oggetto
      visibleWhen: mode == 'create'
      required: true
    - name: duration
      type: text
      label: Durata
      visibleWhen: mode == 'create'
      required: true
    - name: fee
      type: text
      label: Corrispettivo
      visibleWhen: mode == 'create'
    - name: penalties
      type: textarea
      maxLength: 600
      label: Penali
      visibleWhen: mode == 'create'
    - name: jurisdiction
      type: text
      label: Foro competente
      visibleWhen: mode == 'create'
    - name: contract_file
      type: file
      label: Contratto ricevuto (PDF o Word)
      accept:
      - pdf
      - docx
      maxMb: 15
      multiple: false
      visibleWhen: mode == 'review'
    - name: notes
      type: textarea
      maxLength: 600
      label: Note (facoltative)
    - name: legal_review
      type: boolean
      label: Richiedi la revisione di un avvocato convenzionato (a pagamento)
      default: false
  data:
    collections:
    - name: contracts
      description: 'Archivio contratti dell''impresa: bozze, inviati, firmati, scadenze.'
      ownedBy: user
      retentionDays: 3650
      fields:
      - name: title
        type: text
        label: Titolo
        required: true
      - name: contract_type
        type: select
        label: Tipo
        options:
        - value: nda
          label: NDA
        - value: fornitura
          label: Fornitura
        - value: agenzia
          label: Agenzia
        - value: consulenza
          label: Consulenza
        - value: locazione
          label: Locazione commerciale
      - name: counterparty_name
        type: text
        label: Controparte
      - name: counterparty_email
        type: email
        label: Email della controparte
      - name: document
        type: file
        label: Documento
        accept:
        - pdf
        - docx
        maxMb: 15
      - name: end_date
        type: date
        label: Scadenza del contratto
      - name: status
        type: select
        label: Stato
        default: draft
        options:
        - value: draft
          label: Bozza
        - value: in_review
          label: In revisione legale
        - value: approved
          label: Approvato
        - value: sent
          label: Inviato alla controparte
        - value: signed
          label: Firmato
      - name: lawyer_email
        type: email
        label: Avvocato assegnato
      access:
      - role: lawyer
        where:
          lawyer_email: '{user.email}'
        can:
        - read
        - write
  approvals:
  - key: legal_review
    title: Revisione legale
    description: Un avvocato convenzionato rivede la bozza e la approva o la respinge.
    role: lawyer
    decidedBy: role
    fields:
    - title
    - summary
    timeoutMinutes: 10080
    onTimeout: reject
  triggers:
  - key: send_to_counterparty
    'on':
      collection: contracts
      op: update
      where:
        status: sent
    notify:
      to:
      - record.counterparty_email
      - owner
      subject: 'Contratto da firmare: {record.title}'
      body: È disponibile il contratto "{record.title}" per la tua revisione e firma. Accedi al link indicato per consultarlo.
      link: contracts
  - key: deadline_reminder
    'on':
      date:
        collection: contracts
        field: end_date
        offsetDays: -30
        hour: 8
    notify:
      to: owner
      subject: 'Contratto in scadenza tra 30 giorni: {record.title}'
      body: Il contratto "{record.title}" con {record.counterparty_name} scade il {record.end_date}. Valuta rinnovo o disdetta.
      link: contracts
  - key: legal_fee
    'on':
      approval: legal_review
      decision: approved
    charge:
      credits: 150
      reason: Revisione legale umana
  - key: legal_done
    'on':
      approval: legal_review
      decision: any
    notify:
      to: owner
      subject: Esito della revisione legale
      body: L'avvocato convenzionato ha espresso il suo esito sulla tua pratica. Aprila per leggerlo.
      link: history
  views:
  - key: home
    type: page
    nav: false
    title: ContrattoChiaro
    sections:
    - type: hero
      title: Contratti **chiari**, firmati senza stress.
      text: Crea una bozza, fai spiegare in parole semplici il contratto che hai ricevuto, chiedi il controllo di un avvocato
        e firma nell'app.
      actions:
      - label: Inizia ora
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title: Come funziona
      items:
      - title: Crea o carica
        text: Scegli il tipo di contratto e compila il modulo, oppure carica quello ricevuto in PDF o Word.
      - title: Bozza o revisione
        text: L'agente scrive la bozza dai modelli verificando le norme su Normattiva, oppure evidenzia le clausole sbilanciate
          con una proposta di modifica.
      - title: Avvocato (opzionale)
        text: Un avvocato convenzionato rivede e approva la pratica.
      - title: Invio, firma e archivio
        text: Il contratto va alla controparte via email; l'archivio tiene i documenti e ti avvisa prima delle scadenze.
    - type: cards
      id: cosa-include
      title: Cosa include
      items:
      - title: Abbonamento mensile
        text: Un numero di contratti incluso ogni mese.
      - title: Revisione legale a pratica
        text: L'avvocato convenzionato si paga solo quando serve.
      - title: Solo i tuoi dati
        text: Ogni impresa vede solo i propri contratti; l'avvocato solo quelli assegnati.
    - type: note
      content: ContrattoChiaro è un supporto alla redazione e non sostituisce una consulenza legale.
  - key: new
    type: new_run
    title: Nuova pratica
    roles:
    - user
    - admin
  - key: history
    type: history
    title: Le mie pratiche
    source: run
    roles:
    - user
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: contract_form
    type: form
    title: Registra contratto
    collection: contracts
    fields:
    - title
    - contract_type
    - counterparty_name
    - counterparty_email
    - document
    - end_date
    - status
    submit:
      label: Salva
      message: Contratto salvato.
      redirect: contracts
    edit: true
    roles:
    - user
    - admin
    - lawyer
  - key: contracts
    type: table
    title: Archivio contratti
    source: collection:contracts
    columns:
    - title
    - contract_type
    - counterparty_name
    - status
    - end_date
    export: true
    roles:
    - user
    - admin
    - lawyer
  - key: approvals_queue
    type: approvals
    title: Revisioni legali
    approvals:
    - legal_review
    roles:
    - lawyer
    - admin
  - key: account
    type: account
    title: Abbonamento
    roles:
    - user
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 50
    metering:
      creditEur: 0.1
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:drafter:
        estimate: 10
        metered: true
      agent:reviewer:
        estimate: 10
        metered: true
    packs:
    - key: extra
      credits: 100
      price: 15
      label: Pacchetto extra
    plans:
    - key: base
      price: 29
      interval: month
      label: Base — 5 contratti al mese
      credits: 100
      creditsReset: monthly
      roles:
      - user
    - key: pro
      price: 79
      interval: month
      label: Pro — 20 contratti al mese
      credits: 400
      creditsReset: monthly
      roles:
      - user
  notifications:
    emailOnRunDone: true
  extensions:
  - key: advanced_signature
    description: 'Firma elettronica avanzata (FEA) direttamente nell''app con identificazione della controparte non ancora
      disponibile: la controparte riceve il contratto via email, ma la raccolta della firma FEA, la marcatura temporale e
      la certificazione del documento firmato richiedono un provider esterno. Lo stato ''Firmato'' va per ora impostato nell''archivio.'
  - key: lawyer_assignment
    description: L'assegnazione dell'avvocato convenzionato (campo lawyer_email) è fatta da un amministratore nell'archivio.
