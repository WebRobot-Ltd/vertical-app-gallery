apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: cassa-previsionale
  displayName: Cassa Previsionale
  tagline:
    it: Previsione di cassa a 13 settimane e 12 mesi per la tua PMI.
    en: 13-week and 12-month cash forecast for your SME.
  description:
    it: 'Carica estratti conto e fatture: un agente categorizza i movimenti, riconcilia, trova i ritardatari, prevede la cassa
      e ti avvisa prima che il saldo scenda sotto soglia. Solo strato software: nessun servizio di pagamento né accesso regolamentato
      ai conti.'
    en: 'Upload bank statements and invoices: an agent categorises, reconciles, flags late payers, forecasts cash and warns
      you before the balance falls below your threshold. Software layer only: no payment services or regulated account access.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12355b'
      accent: '#1f8a70'
      background: '#f6f8fa'
      foreground: '#16222e'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Cassa
      color: primary
    - text: Previsionale
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
    - key: accountant
      label:
        it: Commercialista
        en: Accountant
      assignedBy: derived
      from: collection:company.accountant_email
  limits:
  - action: agent:analyst
    per: user
    max: 10
    window: day
    roles:
    - user
  agents:
  - key: analyst
    role: main
    description: Imports statements and invoices, categorises, reconciles, finds late payers and builds the forecast.
    profile:
      inline:
        display_name: Cassa Previsionale analyst
        crews:
        - id: analyst
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un analista di tesoreria per PMI italiane. Ricevi il testo di estratti conto (CSV/Excel) e di
            elenchi di fatture attive e passive con scadenze. Passi: 1) salva ogni movimento nuovo con save_movement (date
            YYYY-MM-DD, description, amount con segno, account, category tra: fornitori, stipendi, tasse, incassi clienti,
            finanziamenti, altro) evitando duplicati già letti con list_movements; copia accountant_email dal contesto. 2)
            salva le fatture nuove con save_invoice (number, type active|passive, counterparty, counterparty_email se noto,
            amount, due_date, status open|paid|overdue). 3) riconcilia movimenti e fatture (importo, controparte, riferimento)
            e aggiorna lo stato con update_invoice. 4) individua i clienti che pagano in ritardo, con giorni medi di ritardo.
            5) costruisci la previsione a 13 settimane e a 12 mesi in tre scenari (prudente, base, ottimistico) partendo dal
            saldo iniziale e dalla soglia del profilo azienda; segnala le settimane/giorni in cui il saldo può scendere sotto
            soglia. Non inventare mai cifre: dichiara le ipotesi e i dati mancanti. Non dare consulenza finanziaria, fiscale
            o legale come fatto certo. Struttura del report: titolo di primo livello ''# Cassa Previsionale — <periodo>'',
            poi ## Sintesi e saldo, ## Movimenti categorizzati, ## Riconciliazione, ## Clienti in ritardo, ## Previsione 13
            settimane, ## Previsione 12 mesi, ## Rischio sotto soglia, ## Ipotesi e limiti. Aggiungi grafici con blocco ```chart
            con JSON {"type":"line","title":"…","labels":[…],"series":[{"name":"…","values":[…]}],"unit":"EUR"} per la previsione,
            solo con numeri reali.'
    context:
    - key: company_name
      from: collection:company.name
    - key: opening_balance
      from: collection:company.opening_balance
    - key: threshold
      from: collection:company.threshold
    - key: accountant_email
      from: collection:company.accountant_email
    goalTemplate: 'Azienda: {company_name}. Saldo iniziale: {opening_balance} EUR. Soglia minima: {threshold} EUR. Email commercialista:
      {accountant_email}.

      Estratti conto:

      {?bank_files_text}{bank_files_text}{/bank_files_text}{!bank_files_text}(nessun nuovo estratto: usa i movimenti già salvati){/bank_files_text}

      Fatture:

      {?invoices_files_text}{invoices_files_text}{/invoices_files_text}{!invoices_files_text}(nessun nuovo elenco: usa le
      fatture già salvate){/invoices_files_text}

      {?notes}Note: {notes}{/notes}

      Oggi è {date}. Scrivi il report nella lingua con codice ISO {lang}.'
    appTools:
    - name: list_movements
      description: Read the user's saved bank movements
      action: read
      collection: bank_movements
      scope: user
    - name: save_movement
      description: Save a new categorised bank movement
      action: append
      collection: bank_movements
      scope: user
    - name: list_invoices
      description: Read the user's saved invoices
      action: read
      collection: invoices
      scope: user
    - name: save_invoice
      description: Save a new invoice
      action: append
      collection: invoices
      scope: user
    - name: update_invoice
      description: Update an invoice (status, paid date)
      action: write
      collection: invoices
      scope: user
    output: markdown
    limits:
      maxTurns: 40
      maxBudgetUsd: 1.5
  - key: weekly
    role: helper
    description: 'Every Monday: balance, forecast, invoices to chase, reminder drafts.'
    memory: instance
    profile:
      inline:
        display_name: Cassa Previsionale weekly
        crews:
        - id: weekly
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''assistente di tesoreria settimanale di una PMI. Leggi movimenti e fatture salvati (weekly_movements,
            weekly_invoices) e il profilo azienda. Scrivi un''email-report che inizia con ''# Cassa — settimana del <data>''
            e le sezioni ## Saldo attuale, ## Previsione prossime 13 settimane (base, prudente), ## Giorni a rischio sotto
            soglia, ## Fatture da sollecitare. Per ogni fattura attiva scaduta e con email del cliente crea una bozza di sollecito
            cortese con save_reminder_draft (invoice_number, customer_name, customer_email, subject, body in italiano, status
            draft): non è mai inviata senza approvazione dell''utente. Non inventare cifre; indica le ipotesi. La memoria
            contiene i punti della settimana scorsa: evidenzia cosa è cambiato e alla fine chiama remember con i 5 punti chiave.'
    context:
    - key: threshold
      from: collection:company.threshold
    - key: opening_balance
      from: collection:company.opening_balance
    goalTemplate: Report settimanale per {instance}. Saldo iniziale {opening_balance} EUR, soglia {threshold} EUR. Oggi {date}.
      Lingua ISO {lang}.
    appTools:
    - name: weekly_movements
      description: Read the user's bank movements
      action: read
      collection: bank_movements
      scope: user
    - name: weekly_invoices
      description: Read the user's invoices
      action: read
      collection: invoices
      scope: user
    - name: save_reminder_draft
      description: Save a reminder draft to be approved by the user
      action: append
      collection: reminder_drafts
      scope: user
    output: markdown
    limits:
      maxTurns: 15
      maxBudgetUsd: 0.6
  inputForm:
    title:
      it: Nuova analisi di cassa
      en: New cash analysis
    fields:
    - name: bank_files
      type: file
      label:
        it: Estratti conto (CSV/Excel)
        en: Bank statements (CSV/Excel)
      accept:
      - csv
      - xlsx
      maxMb: 15
      multiple: true
    - name: invoices_files
      type: file
      label:
        it: Fatture attive e passive con scadenze
        en: Active and passive invoices with due dates
      accept:
      - csv
      - xlsx
      maxMb: 15
      multiple: true
    - name: notes
      type: textarea
      maxLength: 600
      label:
        it: Note (facoltative)
        en: Notes (optional)
  data:
    collections:
    - name: company
      ownedBy: user
      description: Company profile and cash threshold
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Ragione sociale
          en: Company name
      - name: opening_balance
        type: number
        required: true
        label:
          it: Saldo complessivo iniziale (EUR)
          en: Opening total balance (EUR)
      - name: threshold
        type: number
        required: true
        label:
          it: Soglia minima di cassa (EUR)
          en: Minimum cash threshold (EUR)
      - name: accountant_email
        type: email
        label:
          it: Email del commercialista
          en: Accountant email
      access:
      - role: accountant
        where:
          accountant_email: '{user.email}'
        can:
        - read
    - name: bank_movements
      ownedBy: user
      description: Categorised bank movements
      retentionDays: 1825
      fields:
      - name: date
        type: date
      - name: description
        type: text
      - name: amount
        type: number
      - name: account
        type: text
      - name: category
        type: select
        options:
        - fornitori
        - stipendi
        - tasse
        - incassi clienti
        - finanziamenti
        - altro
      - name: invoice_ref
        type: text
      - name: accountant_email
        type: email
      access:
      - role: accountant
        where:
          accountant_email: '{user.email}'
        can:
        - read
    - name: invoices
      ownedBy: user
      description: Active and passive invoices
      retentionDays: 1825
      fields:
      - name: number
        type: text
      - name: type
        type: select
        options:
        - active
        - passive
      - name: counterparty
        type: text
      - name: counterparty_email
        type: email
      - name: amount
        type: number
      - name: due_date
        type: date
      - name: status
        type: select
        options:
        - open
        - paid
        - overdue
      - name: paid_date
        type: date
      - name: accountant_email
        type: email
      access:
      - role: accountant
        where:
          accountant_email: '{user.email}'
        can:
        - read
    - name: reminder_drafts
      ownedBy: user
      description: Payment reminder drafts to approve
      retentionDays: 365
      fields:
      - name: invoice_number
        type: text
      - name: customer_name
        type: text
      - name: customer_email
        type: email
      - name: subject
        type: text
      - name: body
        type: textarea
      - name: status
        type: select
        options:
        - draft
        - approved
        - rejected
        default: draft
  views:
  - key: home
    type: page
    nav: false
    sections:
    - type: hero
      title:
        it: Sai **quando** la cassa si assottiglia, prima che succeda.
        en: Know **when** cash gets tight, before it happens.
      text:
        it: 'Carica estratti conto e fatture: un agente categorizza, riconcilia, prevede 13 settimane e 12 mesi e ti scrive
          ogni lunedì.'
        en: 'Upload statements and invoices: an agent categorises, reconciles, forecasts 13 weeks and 12 months and writes
          to you every Monday.'
      actions:
      - label:
          it: Inizia
          en: Start
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Carica
          en: Upload
        text:
          it: Estratti conto CSV/Excel e fatture con scadenze.
          en: CSV/Excel statements and invoices with due dates.
      - title:
          it: Analisi
          en: Analysis
        text:
          it: Categorie, riconciliazione, clienti in ritardo, scenari.
          en: Categories, reconciliation, late payers, scenarios.
      - title:
          it: Ogni lunedì
          en: Every Monday
        text:
          it: Email con saldo, previsione e solleciti in bozza da approvare.
          en: Email with balance, forecast and reminder drafts to approve.
    - type: note
      content:
        it: 'Strumento software di supporto alle decisioni: nessun servizio di pagamento né accesso regolamentato ai conti.
          Non è consulenza finanziaria o fiscale.'
        en: 'Decision-support software: no payment services or regulated account access. Not financial or tax advice.'
  - key: company_form
    type: form
    collection: company
    title:
      it: Profilo azienda
      en: Company profile
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Profilo salvato
        en: Profile saved
      redirect: new
    edit: true
    roles:
    - user
  - key: new
    type: new_run
    title:
      it: Nuova analisi
      en: New analysis
    roles:
    - user
    - admin
  - key: history
    type: history
    title:
      it: Le mie analisi
      en: My analyses
    source: run
    roles:
    - user
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: movements
    type: table
    title:
      it: Movimenti
      en: Movements
    source: collection:bank_movements
    columns:
    - date
    - description
    - amount
    - category
    - invoice_ref
    export: true
    roles:
    - user
    - accountant
  - key: invoices_view
    type: table
    title:
      it: Fatture
      en: Invoices
    source: collection:invoices
    columns:
    - number
    - type
    - counterparty
    - amount
    - due_date
    - status
    export: true
    roles:
    - user
    - accountant
  - key: drafts
    type: table
    title:
      it: Solleciti in bozza
      en: Reminder drafts
    source: collection:reminder_drafts
    columns:
    - invoice_number
    - customer_name
    - subject
    - status
    roles:
    - user
  - key: draft_edit
    type: form
    collection: reminder_drafts
    title:
      it: Approva sollecito
      en: Approve reminder
    edit: true
    submit:
      label:
        it: Salva (imposta stato su approved per inviare)
        en: Save (set status to approved to send)
      redirect: drafts
    nav: false
    roles:
    - user
  - key: watches
    type: instances
    template: weekly_cash
    title:
      it: Report del lunedì
      en: Monday report
    roles:
    - user
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Plan
    roles:
    - user
  templates:
  - key: weekly_cash
    title:
      it: Report settimanale
      en: Weekly report
    agent: weekly
    params:
    - name: label
      type: text
      label:
        it: Nome
        en: Name
    goal: Report settimanale per {instance}. Oggi {date}. Lingua ISO {lang}.
    schedule:
      cron: 0 6 * * 1
      userCanChange: false
    maxPerUser: 1
    deliver:
      to: owner
      onlyIfNew: true
  triggers:
  - key: send_reminder
    'on':
      collection: reminder_drafts
      op: update
      where:
        status: approved
    notify:
      to:
      - record.customer_email
      subject:
        it: '{record.subject}'
        en: '{record.subject}'
      body:
        it: '{record.body}'
        en: '{record.body}'
  notifications:
    emailOnRunDone: true
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: pmi
      price: 49
      interval: month
      label:
        it: Cassa Previsionale PMI
        en: Cassa Previsionale SME
      includes:
      - analisi illimitate nei limiti d'uso
      - report del lunedì
      - accesso commercialista in sola lettura
  extensions:
  - key: open_banking
    description: 'Collegamento dei conti via open banking tramite un provider autorizzato (AISP): non ancora disponibile,
      servono OAuth/consenso.'
  - key: cassetto_fiscale
    description: 'Importazione automatica delle fatture dal cassetto fiscale (Agenzia delle Entrate): non ancora disponibile.'
