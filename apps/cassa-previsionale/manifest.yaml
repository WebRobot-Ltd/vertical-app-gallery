apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: cassa-previsionale
  displayName: Cassa Previsionale
  tagline:
    it: La previsione di cassa della tua PMI, sempre aggiornata.
    en: Your SME's cash forecast, always up to date.
  description:
    it: 'Carica estratti conto e scadenzario: un agente AI categorizza i movimenti, riconcilia le fatture, individua i ritardi
      di pagamento e costruisce la previsione di cassa a 13 settimane e 12 mesi con scenari. Solo strato software: nessun
      servizio di pagamento né accesso regolamentato ai conti.'
    en: 'Upload bank statements and your invoice list: an AI agent categorises transactions, reconciles invoices, spots late
      payers and builds a 13-week and 12-month cash forecast with scenarios. Software layer only: no payment services or regulated
      account access.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12355b'
      accent: '#0e8a6d'
      background: '#f6f8fb'
      foreground: '#16222e'
    fonts:
      body: Inter
      display: Manrope
    wordmark:
    - text: Cassa
      color: primary
    - text: Previsionale
      color: accent
    width: wide
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Funzioni
        en: Features
      href: '#funzioni'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: user
      label:
        it: Titolare / amministrazione
        en: Owner / admin staff
      assignedBy: signup
    - key: accountant
      label:
        it: Commercialista (sola lettura)
        en: Accountant (read-only)
      assignedBy: invite
  limits:
  - action: agent:analyst
    per: user
    max: 10
    window: day
    roles:
    - user
  agents:
  - key: analyst
    role: main
    description: Categorizes movements, reconciles invoices, flags late payers, builds the 13-week and 12-month forecast with
      scenarios.
    profile:
      inline:
        display_name: Cassa Previsionale analyst
        crews:
        - id: analyst
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un analista di tesoreria per PMI italiane. Lavori solo sui dati dell''azienda che ti vengono
            dati (testo incollato di estratti conto e scadenzario) e su quelli già salvati, che leggi e scrivi con i tuoi
            strumenti. Non sei un istituto di pagamento, non muovi denaro, non dai consulenza finanziaria, fiscale o legale
            come fatto certo.


            Passi:

            1. Se l''utente ha incollato movimenti o fatture, interpretali (CSV o tabella) e salvali con write_transactions
            e write_invoices, senza duplicare quelli già presenti (leggi prima con read_transactions e read_invoices).

            2. Categorizza ogni movimento: fornitori, stipendi, tasse e contributi, incassi clienti, finanziamenti, altro.

            3. Riconcilia i movimenti con le fatture (importo, data, controparte, numero) e aggiorna lo stato della fattura:
            pagata, aperta, scaduta, parziale.

            4. Individua i clienti che pagano in ritardo: ritardo medio in giorni e importi scaduti.

            5. Costruisci la previsione di cassa a 13 settimane (per settimana) e a 12 mesi (per mese) in tre scenari: base
            (le fatture si incassano con il ritardo storico del cliente), prudente (ritardi +15 giorni, incassi -10%), ottimistico
            (incassi alla scadenza). Parti dal saldo iniziale dato.

            6. Segnala in anticipo le settimane o i giorni in cui il saldo scende sotto la soglia indicata, con importo del
            buco e azioni possibili (sollecitare, spostare pagamenti, linee di credito da valutare con la banca).

            7. Per le fatture scadute prepara solleciti in bozza (tono cortese, ferma per le scadute oltre 30 giorni), salvali
            con write_reminders con status ''bozza'' e chiedi l''approvazione con request_solleciti. Non dire mai che un sollecito
            è stato inviato.


            Non inventare cifre: se un dato manca, dillo e indica l''ipotesi usata. Usa solo importi presenti nei dati.


            Struttura del report, in italiano o nella lingua richiesta: un titolo di primo livello ''# Cassa Previsionale
            — <azienda o data>'' poi ## Sintesi (saldo, minimo previsto, giorni a rischio), ## Movimenti categorizzati (tabella
            per categoria), ## Riconciliazione, ## Clienti in ritardo, ## Previsione 13 settimane, ## Previsione 12 mesi,
            ## Allerte soglia, ## Solleciti in bozza, ## Ipotesi e limiti. Aggiungi un grafico per ciascuna previsione come
            blocco ```chart con JSON {"type":"line","title":"…","labels":[…],"series":[{"name":"Base","values":[…]},{"name":"Prudente","values":[…]},{"name":"Ottimistico","values":[…]}],"unit":"€"},
            solo con cifre reali.'
          mcp_servers: []
    awaits:
    - solleciti
    appTools:
    - name: read_transactions
      description: Read the company's saved bank movements
      action: read
      collection: transactions
      scope: user
    - name: write_transactions
      description: Save bank movements (with category and matched invoice)
      action: write
      collection: transactions
      scope: user
    - name: read_invoices
      description: Read the company's active and passive invoices
      action: read
      collection: invoices
      scope: user
    - name: write_invoices
      description: Save or update invoices and their status
      action: write
      collection: invoices
      scope: user
    - name: write_reminders
      description: Save reminder drafts for overdue invoices
      action: write
      collection: reminders
      scope: user
    goalTemplate: 'Azienda: {?company}{company}{/company}{!company}non indicata{/company}. Data di oggi: {date}.

      Saldo iniziale (somma dei conti): {opening_balance} €. Soglia di allerta: {threshold} €.

      Scenario di interesse principale: {scenario_label}.

      {?bank_text}Estratti conto incollati (CSV o tabella):

      {bank_text}{/bank_text}

      {?invoices_text}Scadenzario fatture incollato (attive e passive, con scadenze):

      {invoices_text}{/invoices_text}

      {!bank_text}Nessun nuovo estratto: usa i movimenti già salvati.{/bank_text}

      Scrivi il report nella lingua con codice ISO {lang}.'
    output: markdown
    limits:
      maxTurns: 25
      maxBudgetUsd: 1.5
  - key: weekly
    role: scheduled
    description: 'Every Monday: balance, forecast summary, invoices to chase, reminder drafts.'
    memory: instance
    writesTo:
      collection: weekly_briefs
      parse: whole
    profile:
      inline:
        display_name: Cassa Previsionale weekly
        crews:
        - id: weekly
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Prepari il riepilogo del lunedì di tesoreria per una PMI, usando solo i dati salvati (movimenti
            e fatture) letti con i tuoi strumenti. Non muovi denaro e non dai consulenza finanziaria o fiscale come fatto
            certo; non inventare cifre. Struttura: ''# Cassa — settimana del <data>'', ## Saldo, ## Previsione prossime 13
            settimane (scenario base e prudente, settimane sotto soglia), ## Fatture da sollecitare (cliente, numero, importo,
            giorni di ritardo), ## Cosa è cambiato dalla settimana scorsa. Meno di 300 parole. Per le fatture scadute prepara
            bozze di sollecito con write_reminders (status ''bozza'') e chiedi approvazione con request_solleciti: mai dire
            che sono state inviate. La tua memoria contiene i punti dell''ultima volta: parti da ciò che è cambiato. Alla
            fine chiama remember una volta con i 5 punti chiave.'
          mcp_servers: []
    awaits:
    - solleciti
    appTools:
    - name: read_transactions
      description: Read the company's saved bank movements
      action: read
      collection: transactions
      scope: user
    - name: read_invoices
      description: Read the company's active and passive invoices
      action: read
      collection: invoices
      scope: user
    - name: write_reminders
      description: Save reminder drafts for overdue invoices
      action: write
      collection: reminders
      scope: user
    limits:
      maxTurns: 15
      maxBudgetUsd: 0.8
  inputForm:
    title:
      it: Nuova previsione
      en: New forecast
    fields:
    - name: company
      type: text
      label:
        it: Azienda
        en: Company
      maxLength: 120
    - name: opening_balance
      type: number
      required: true
      label:
        it: Saldo attuale totale (€)
        en: Current total balance (€)
    - name: threshold
      type: number
      required: true
      default: 5000
      label:
        it: Soglia minima di cassa (€)
        en: Minimum cash threshold (€)
    - name: scenario
      type: select
      required: true
      default: base
      label:
        it: Scenario principale
        en: Main scenario
      options:
      - value: base
        label:
          it: Base
          en: Base
      - value: prudent
        label:
          it: Prudente
          en: Prudent
      - value: optimistic
        label:
          it: Ottimistico
          en: Optimistic
    - name: bank_text
      type: textarea
      maxLength: 20000
      label:
        it: Estratti conto (incolla CSV o tabella)
        en: Bank statements (paste CSV or table)
      help:
        it: 'Il caricamento di file non è ancora disponibile: apri il CSV/Excel e incolla le righe (data, descrizione, importo,
          conto).'
        en: 'File upload is not available yet: open the CSV/Excel and paste the rows (date, description, amount, account).'
    - name: invoices_text
      type: textarea
      maxLength: 20000
      label:
        it: Fatture attive e passive con scadenze (incolla)
        en: Active and passive invoices with due dates (paste)
      help:
        it: 'Colonne: tipo (attiva/passiva), numero, controparte, importo, data fattura, scadenza.'
        en: 'Columns: type (active/passive), number, counterparty, amount, invoice date, due date.'
  data:
    collections:
    - name: transactions
      ownedBy: user
      sharing:
      - viewer
      description: Bank movements of the company, categorised
      fields:
      - name: date
        type: date
        label: Data
      - name: description
        type: text
        label: Descrizione
      - name: amount
        type: number
        label: Importo
      - name: account
        type: text
        label: Conto
      - name: category
        type: select
        label: Categoria
        options:
        - fornitori
        - stipendi
        - tasse
        - incassi_clienti
        - finanziamenti
        - altro
      - name: invoice_number
        type: text
        label: Fattura riconciliata
    - name: invoices
      ownedBy: user
      sharing:
      - viewer
      description: Active and passive invoices with due dates
      fields:
      - name: kind
        type: select
        label: Tipo
        options:
        - attiva
        - passiva
      - name: number
        type: text
        label: Numero
      - name: counterparty
        type: text
        label: Controparte
      - name: amount
        type: number
        label: Importo
      - name: issue_date
        type: date
        label: Data fattura
      - name: due_date
        type: date
        label: Scadenza
      - name: status
        type: select
        label: Stato
        options:
        - aperta
        - pagata
        - scaduta
        - parziale
      - name: days_late
        type: number
        label: Giorni di ritardo
    - name: reminders
      ownedBy: user
      description: Reminder drafts to approve
      fields:
      - name: invoice_number
        type: text
        label: Fattura
      - name: customer
        type: text
        label: Cliente
      - name: amount
        type: number
        label: Importo
      - name: draft
        type: textarea
        label: Bozza
      - name: status
        type: select
        label: Stato
        options:
        - bozza
        - approvato
        - rifiutato
    - name: weekly_briefs
      ownedBy: instance
      description: Monday summaries of each weekly watch
  templates:
  - key: weekly_cash
    title:
      it: Riepilogo del lunedì
      en: Monday summary
    description:
      it: Ogni lunedì saldo, previsione e fatture da sollecitare, con solleciti in bozza.
      en: 'Every Monday: balance, forecast and invoices to chase, with reminder drafts.'
    agent: weekly
    params:
    - name: company
      type: text
      required: true
      label:
        it: Azienda
        en: Company
    - name: threshold
      type: number
      required: true
      default: 5000
      label:
        it: Soglia minima (€)
        en: Minimum threshold (€)
    goal: Riepilogo settimanale di "{instance}" ({company}). Soglia minima di cassa {threshold} €. Oggi è {date}. Scrivi nella
      lingua con codice ISO {lang}.
    schedule:
      cron: 0 6 * * 1
      userCanChange: true
    maxPerUser: 2
    roles:
    - user
    - admin
    cost:
      perRun: 10
  approvals:
  - key: solleciti
    title:
      it: Approva i solleciti
      en: Approve reminders
    description: Draft payment reminders for overdue invoices, confirmed by the company before use
    decidedBy: requester
    fields:
    - invoice_number
    - customer
    - amount
    - draft
    timeoutMinutes: 10080
    onTimeout: reject
  views:
  - key: home
    type: page
    nav: false
    title: Cassa Previsionale
    sections:
    - type: hero
      eyebrow:
        it: Tesoreria per PMI
        en: Treasury for SMEs
      title:
        it: Sai già **quando** la cassa scenderà sotto soglia?
        en: Do you know **when** your cash will dip below the threshold?
      text:
        it: 'Carica estratti conto e scadenzario: un agente AI categorizza i movimenti, riconcilia le fatture, trova chi paga
          in ritardo e costruisce la previsione a 13 settimane e 12 mesi con scenari.'
        en: 'Add bank statements and your invoice list: an AI agent categorises movements, reconciles invoices, finds late
          payers and builds a 13-week and 12-month forecast with scenarios.'
      actions:
      - label:
          it: Crea la tua previsione
          en: Build your forecast
        href: /login
        style: primary
      - label:
          it: Come funziona
          en: How it works
        href: '#come-funziona'
        style: ghost
      band: true
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Importa
          en: Import
        text:
          it: Incolla i movimenti dei tuoi conti e l'elenco di fatture attive e passive.
          en: Paste your account movements and the list of active and passive invoices.
        badge: 📥
      - title:
          it: Analizza
          en: Analyse
        text:
          it: L'agente categorizza, riconcilia e individua i clienti in ritardo.
          en: The agent categorises, reconciles and spots late payers.
        badge: 🔎
      - title:
          it: Prevedi
          en: Forecast
        text:
          it: 13 settimane e 12 mesi in tre scenari, con allerta sui giorni sotto soglia.
          en: 13 weeks and 12 months in three scenarios, with alerts on below-threshold days.
        badge: 📈
      - title:
          it: Sollecita
          en: Chase
        text:
          it: Il lunedì ricevi il riepilogo e approvi i solleciti in bozza.
          en: On Mondays you get the summary and approve the reminder drafts.
        badge: ✉️
    - type: cards
      id: funzioni
      title:
        it: Funzioni
        en: Features
      items:
      - title:
          it: Ogni azienda vede solo i propri dati
          en: Each company sees only its own data
        text:
          it: I dati sono separati per azienda.
          en: Data is separated per company.
      - title:
          it: Commercialista in sola lettura
          en: Accountant read-only
        text:
          it: 'Invita il tuo commercialista: vede, non modifica.'
          en: 'Invite your accountant: they can view, not edit.'
      - title:
          it: In arrivo
          en: Coming
        text:
          it: Open banking tramite provider autorizzato e importazione dal cassetto fiscale.
          en: Open banking via an authorised provider and tax-drawer invoice import.
    - type: note
      content:
        it: 'Cassa Previsionale è solo software di analisi: non presta servizi di pagamento né accede ai conti, attività riservate
          a istituti autorizzati. Le previsioni sono stime, non consulenza finanziaria.'
        en: 'Cassa Previsionale is analysis software only: it provides no payment services and has no access to accounts,
          which remain with authorised institutions. Forecasts are estimates, not financial advice.'
  - key: new
    type: new_run
    title:
      it: Nuova previsione
      en: New forecast
    roles:
    - user
    - admin
  - key: forecasts
    type: history
    title:
      it: Le mie previsioni
      en: My forecasts
    source: run
    roles:
    - user
    - admin
    - accountant
  - key: forecast
    type: report
    source: run
    printable: true
    nav: false
  - key: transactions_view
    type: table
    title:
      it: Movimenti
      en: Movements
    source: collection:transactions
    data:
      display: table
      fields:
      - key: date
        label: Data
        format: date
      - key: description
        label: Descrizione
      - key: amount
        label: Importo
        format: money
      - key: category
        label: Categoria
        format: badge
      - key: invoice_number
        label: Fattura
      sort:
        field: date
        dir: desc
      limit: 200
    roles:
    - user
    - admin
    - accountant
  - key: invoices_view
    type: table
    title:
      it: Fatture e scadenze
      en: Invoices and due dates
    source: collection:invoices
    data:
      display: table
      fields:
      - key: kind
        label: Tipo
        format: badge
      - key: number
        label: Numero
      - key: counterparty
        label: Controparte
      - key: amount
        label: Importo
        format: money
      - key: due_date
        label: Scadenza
        format: date
      - key: status
        label: Stato
        format: badge
      - key: days_late
        label: Giorni di ritardo
        format: number
      sort:
        field: due_date
        dir: asc
      limit: 200
    roles:
    - user
    - admin
    - accountant
  - key: approvals_view
    type: approvals
    title:
      it: Solleciti da approvare
      en: Reminders to approve
    approvals:
    - solleciti
    roles:
    - user
    - admin
  - key: watches
    type: instances
    template: weekly_cash
    title:
      it: Riepilogo del lunedì
      en: Monday summary
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - user
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 50
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:analyst:
        estimate: 10
        metered: true
    packs:
    - key: extra
      credits: 1000
      price: 10
      label: Extra 1000
    plans:
    - key: pmi
      price: 49
      interval: month
      label:
        it: Cassa Previsionale PMI
        en: Cassa Previsionale SME
      credits: 2000
      creditsReset: monthly
      roles:
      - user
      includes:
      - Previsione 13 settimane e 12 mesi
      - Riepilogo del lunedì
      - Accesso in sola lettura per il commercialista
  extensions:
  - key: file_upload
    description: 'Upload of CSV/Excel bank statements and invoice lists is not available yet: for now the user pastes the
      text.'
  - key: email_digest
    description: 'The Monday email is not available yet: the summary is shown in the app (Monday summary view). Email notifications
      to be added when the platform supports them.'
  - key: open_banking
    description: Account connection via an authorised open banking provider (needs per-customer credentials), planned for
      the future.
  - key: tax_drawer_import
    description: Import of invoices from the Italian cassetto fiscale (needs per-customer credentials), planned for the future.
