apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: safebrowse-console
  displayName: SafeBrowse Console
  tagline:
    it: Console di gestione e report per la protezione della navigazione web.
    en: Management and reporting console for web browsing protection.
  description:
    it: L'IT manager registra utenti e policy, i dispositivi inviano eventi anonimizzati e un agente AI produce andamenti,
      gravità e azioni consigliate. Ogni azienda vede solo i propri dati, in forma aggregata.
    en: The IT manager registers users and policies, devices send anonymised events and an AI agent produces trends, severity
      and recommended actions. Each company sees only its own data, in aggregate form.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: dashboard
  branding:
    theme: light
    palette:
      primary: '#0f2a43'
      accent: '#1f8a70'
      background: '#f6f8fa'
      foreground: '#14202e'
    fonts:
      body: Inter
      display: Inter
    wordmark:
    - text: SafeBrowse
      color: primary
    - text: ' Console'
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#how'
    - label:
        it: Privacy
        en: Privacy
      href: '#privacy'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: user
      label:
        it: IT manager
        en: IT manager
      assignedBy: signup
  limits:
  - action: create:managed_users
    max: 10
    window: total
    plans:
      seats_50: 50
      seats_200: 200
  agents:
  - key: analyst
    role: main
    description: 'Weekly summary of threats for one company: trends, ranking by severity, recommended actions.'
    memory: instance
    writesTo:
      collection: threat_reports
      parse: whole
    appTools:
    - name: read_events
      description: Read the company's anonymised threat events
      action: read
      collection: threat_events
      scope: user
    - name: read_policies
      description: Read the company's protection policies
      action: read
      collection: policies
      scope: user
    - name: read_users
      description: Read the company's registered protected users
      action: read
      collection: managed_users
      scope: user
    profile:
      inline:
        display_name: Threat report analyst
        crews:
        - id: analyst
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are a web-security analyst writing for the IT manager of one company. Use read_events, read_policies
            and read_users to get the data (events are already anonymised: user_ref is a pseudonym, never try to identify
            people). Aggregate the events of the requested period: blocked threats by day, riskiest domains and categories,
            most exposed user_refs (report only aggregated counts, never browsing detail), comparison with the previous period.
            Rank findings by severity (high, medium, low). Start with a level-1 title "# Threat report — <period>". Sections
            with ## headings: Summary, Findings ranked by severity (table), Trends, Exposed users (pseudonymous, aggregated),
            Recommended actions (concrete: categories to block, policy changes, awareness), Data limits. Add a ```chart fenced
            JSON block (type bar or line) with blocked threats per day using real figures only. Never invent figures; if there
            are few events, say so. Do not present recommendations as legal advice. Write in the language with ISO code given
            in the goal. Your memory holds the key points of the last report: mention what changed, and at the end call remember
            once with the 5 key points of this report.'
  - key: sentinel
    role: scheduled
    description: 'Daily anomaly check: writes an alert record when a spike appears.'
    memory: instance
    appTools:
    - name: read_events
      description: Read the company's anonymised threat events
      action: read
      collection: threat_events
      scope: user
    - name: write_alert
      description: Create an alert record for the company when an anomalous spike is found
      action: write
      collection: alerts
      scope: user
    profile:
      inline:
        display_name: Spike sentinel
        crews:
        - id: sentinel
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You check once a day whether blocked threats show an anomalous spike. Use read_events and compare
            the last 24 hours with the daily average of the previous 14 days, overall and per category. Flag a spike only
            if the count is at least 3x the average and at least 10 events (otherwise do nothing, do not create an alert).
            When there is a spike, call write_alert once with fields: title, severity (high|medium|low), summary (2-4 sentences:
            what, how much vs. normal, likely category, one recommended action), date (YYYY-MM-DD, today). Never include or
            guess the identity of any person; use only aggregated figures. Answer with a one-line result, starting with "#
            Check <date>". Never invent figures.'
  templates:
  - key: weekly_report
    title:
      it: Report settimanale
      en: Weekly report
    description:
      it: Ogni lunedì un report di sintesi con andamenti, gravità e azioni consigliate, anche via email.
      en: Every Monday a summary report with trends, severity and recommended actions, also by email.
    agent: analyst
    params:
    - name: company
      type: text
      required: true
      label:
        it: Nome azienda
        en: Company name
    - name: focus
      type: select
      label:
        it: Focus
        en: Focus
      options:
      - value: all
        label:
          it: Tutte le minacce
          en: All threats
      - value: phishing
        label: Phishing
      - value: malware
        label: Malware
    goal: 'Company: {company}. Focus: {focus}. Period: the last 7 days up to {date}. Write the weekly report in the language
      with ISO code {lang}.'
    schedule:
      cron: 0 6 * * 1
      userCanChange: true
    maxPerUser: 1
    deliver:
      to: owner
      subject: '{title}'
      onlyIfNew: true
  - key: daily_check
    title:
      it: Controllo picchi
      en: Spike check
    description:
      it: Ogni giorno cerca picchi anomali di minacce e invia un alert via email.
      en: Every day looks for anomalous threat spikes and emails an alert.
    agent: sentinel
    params:
    - name: company
      type: text
      required: true
      label:
        it: Nome azienda
        en: Company name
    goal: 'Company: {company}. Today is {date}. Run the spike check and write an alert only if there is a spike. Language
      ISO code {lang}.'
    schedule:
      cron: 30 5 * * *
      userCanChange: false
    maxPerUser: 1
  data:
    collections:
    - name: managed_users
      ownedBy: user
      description: Employees/seats protected, registered by the IT manager
      fields:
      - name: full_name
        type: text
        required: true
        label:
          it: Nome
          en: Name
      - name: email
        type: email
        required: true
        label: Email
      - name: department
        type: text
        label:
          it: Reparto
          en: Department
      - name: device_ref
        type: text
        label:
          it: ID dispositivo
          en: Device ID
      - name: user_ref
        type: text
        label:
          it: Riferimento pseudonimo
          en: Pseudonymous reference
      - name: status
        type: select
        options:
        - value: active
          label:
            it: Attivo
            en: Active
        - value: suspended
          label:
            it: Sospeso
            en: Suspended
        default: active
        label:
          it: Stato
          en: Status
    - name: policies
      ownedBy: user
      description: 'Protection policies: blocked categories and data-sharing rules'
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome policy
          en: Policy name
      - name: blocked_categories
        type: multiselect
        required: true
        label:
          it: Categorie da bloccare
          en: Categories to block
        options:
        - value: phishing
          label: Phishing
        - value: malware
          label: Malware
        - value: adult
          label:
            it: Contenuti per adulti
            en: Adult content
        - value: gambling
          label:
            it: Gioco d'azzardo
            en: Gambling
        - value: anonymizers
          label:
            it: Anonimizzatori/proxy
            en: Anonymizers/proxies
        - value: file_sharing
          label: File sharing
        - value: newly_registered
          label:
            it: Domini appena registrati
            en: Newly registered domains
      - name: data_sharing
        type: select
        label:
          it: Condivisione dati
          en: Data sharing
        options:
        - value: none
          label:
            it: Nessuna
            en: None
        - value: aggregated
          label:
            it: Solo aggregati
            en: Aggregated only
        - value: full_anonymised
          label:
            it: Eventi anonimizzati
            en: Anonymised events
        default: aggregated
      - name: notes
        type: textarea
        maxLength: 500
        label:
          it: Note
          en: Notes
    - name: threat_events
      ownedBy: user
      retentionDays: 180
      description: Anonymised threat events sent by protected devices (webhook)
      fields:
      - name: event_id
        type: text
      - name: device_ref
        type: text
      - name: user_ref
        type: text
      - name: category
        type: text
      - name: domain
        type: text
      - name: severity
        type: select
        options:
        - high
        - medium
        - low
      - name: blocked
        type: number
        default: 1
      - name: occurred_at
        type: date
    - name: alerts
      ownedBy: user
      retentionDays: 365
      description: Anomalous spike alerts
      fields:
      - name: title
        type: text
      - name: severity
        type: select
        options:
        - high
        - medium
        - low
      - name: summary
        type: textarea
      - name: date
        type: date
    - name: threat_reports
      ownedBy: instance
      description: Weekly threat reports of each watch
  triggers:
  - key: threat_event
    description: Anonymised event from a protected device
    'on':
      webhook: true
    write:
      collection: threat_events
      fields:
        event_id: event_id
        device_ref: device
        user_ref: user_ref
        category: category
        domain: domain
        severity: severity
        blocked: count
        occurred_at: ts
      keyBy: event_id
  - key: spike_alert
    description: Email the IT manager when a spike alert is created
    'on':
      collection: alerts
      op: insert
    notify:
      to:
      - owner
      subject:
        it: 'Alert: picco anomalo di minacce — {record.title}'
        en: 'Alert: anomalous threat spike — {record.title}'
      body:
        it: '{record.summary}


          Gravità: {record.severity}. Apri la console per i dettagli aggregati.'
        en: '{record.summary}


          Severity: {record.severity}. Open the console for the aggregated details.'
      link: alerts_list
  views:
  - key: home
    type: page
    nav: false
    title: SafeBrowse Console
    sections:
    - type: hero
      band: true
      eyebrow:
        it: Console per l'IT manager
        en: Console for the IT manager
      title:
        it: Vedi le minacce **bloccate**, decidi le azioni.
        en: See the **blocked** threats, decide the actions.
      text:
        it: Gestisci utenti e policy, ricevi alert sui picchi anomali e un report di sintesi periodico con le azioni consigliate.
          Solo dati anonimi e aggregati.
        en: Manage users and policies, get alerts on anomalous spikes and a periodic summary report with recommended actions.
          Anonymous, aggregated data only.
      actions:
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: primary
    - type: steps
      id: how
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Registra utenti e policy
          en: Register users and policies
        text:
          it: Con semplici moduli definisci le postazioni e le categorie da bloccare.
          en: With simple forms you define seats and categories to block.
        badge: '1'
      - title:
          it: I dispositivi inviano eventi
          en: Devices send events
        text:
          it: Eventi già anonimizzati arrivano alla console via webhook.
          en: Already-anonymised events reach the console via webhook.
        badge: '2'
      - title:
          it: L'agente li analizza
          en: The agent analyses them
        text:
          it: Andamenti, siti più rischiosi e utenti più esposti ordinati per gravità, con azioni consigliate.
          en: Trends, riskiest sites and most exposed users ranked by severity, with recommended actions.
        badge: '3'
    - type: cards
      id: privacy
      title:
        it: Privacy by design
        en: Privacy by design
      items:
      - title:
          it: Ogni azienda vede solo i suoi dati
          en: Each company sees only its own data
        text:
          it: Nessun dato è condiviso tra aziende.
          en: No data is shared between companies.
      - title:
          it: Dati aggregati e pseudonimi
          en: Aggregated, pseudonymous data
        text:
          it: 'Nessuna cronologia di navigazione individuale: solo conteggi per riferimento pseudonimo.'
          en: 'No individual browsing history: only counts per pseudonymous reference.'
      - title:
          it: Conservazione limitata
          en: Limited retention
        text:
          it: Gli eventi vengono eliminati dopo 180 giorni.
          en: Events are deleted after 180 days.
    - type: note
      content:
        it: Questa è la console di gestione; l'estensione del browser e la protezione endpoint sono un prodotto separato.
        en: This is the management console; the browser extension and endpoint protection are a separate product.
  - key: dashboard
    type: page
    title:
      it: Dashboard
      en: Dashboard
    roles:
    - user
    - admin
    sections:
    - type: data
      id: kpi
      source: collection:threat_events
      display: kpi
      kpis:
      - label:
          it: Minacce bloccate
          en: Threats blocked
        agg: sum
        field: blocked
        format: number
      - label:
          it: Eventi
          en: Events
        agg: count
      empty:
        it: Nessun evento ancora.
        en: No events yet.
    - type: data
      title:
        it: Minacce bloccate nel tempo
        en: Threats blocked over time
      source: collection:threat_events
      display: chart
      chart: line
      fields:
      - key: occurred_at
        label:
          it: Data
          en: Date
      - key: blocked_sum
        label:
          it: Bloccate
          en: Blocked
      groupBy:
        field: occurred_at
        bucket: day
        aggs:
        - key: blocked_sum
          agg: sum
          field: blocked
    - type: data
      title:
        it: Per categoria
        en: By category
      source: collection:threat_events
      display: chart
      chart: pie
      fields:
      - key: category
        label:
          it: Categoria
          en: Category
      - key: blocked_sum
        label:
          it: Bloccate
          en: Blocked
      groupBy:
        field: category
        aggs:
        - key: blocked_sum
          agg: sum
          field: blocked
    - type: data
      title:
        it: Per utente (pseudonimo, aggregato)
        en: By user (pseudonymous, aggregated)
      source: collection:threat_events
      display: bar
      fields:
      - key: user_ref
        label:
          it: Riferimento
          en: Reference
      - key: blocked_sum
        label:
          it: Bloccate
          en: Blocked
      groupBy:
        field: user_ref
        minCount: 3
        aggs:
        - key: blocked_sum
          agg: sum
          field: blocked
      limit: 15
    - type: data
      title:
        it: Domini più rischiosi
        en: Riskiest domains
      source: collection:threat_events
      display: table
      fields:
      - key: domain
        label: Domain
      - key: blocked_sum
        label:
          it: Bloccate
          en: Blocked
      groupBy:
        field: domain
        minCount: 2
        aggs:
        - key: blocked_sum
          agg: sum
          field: blocked
      limit: 20
  - key: alerts_list
    type: table
    title:
      it: Alert
      en: Alerts
    source: collection:alerts
    columns:
    - date
    - severity
    - title
    - summary
    roles:
    - user
    - admin
  - key: reports
    type: instances
    template: weekly_report
    title:
      it: Report periodici
      en: Periodic reports
    roles:
    - user
    - admin
  - key: spike_watch
    type: instances
    template: daily_check
    title:
      it: Controllo picchi
      en: Spike check
    roles:
    - user
    - admin
  - key: add_user
    type: form
    title:
      it: Registra utente
      en: Register user
    collection: managed_users
    fields:
    - full_name
    - email
    - department
    - device_ref
    - user_ref
    - status
    edit: true
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Utente salvato.
        en: User saved.
      redirect: users_list
    roles:
    - user
    - admin
  - key: users_list
    type: table
    title:
      it: Utenti protetti
      en: Protected users
    source: collection:managed_users
    columns:
    - full_name
    - email
    - department
    - device_ref
    - status
    export: true
    roles:
    - user
    - admin
  - key: add_policy
    type: form
    title:
      it: Nuova policy
      en: New policy
    collection: policies
    fields:
    - name
    - blocked_categories
    - data_sharing
    - notes
    edit: true
    submit:
      label:
        it: Salva policy
        en: Save policy
      message:
        it: Policy salvata.
        en: Policy saved.
      redirect: policies_list
    roles:
    - user
    - admin
  - key: policies_list
    type: table
    title:
      it: Policy
      en: Policies
    source: collection:policies
    columns:
    - name
    - blocked_categories
    - data_sharing
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - user
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: seats_10
      price: 29
      interval: month
      label:
        it: Fino a 10 postazioni
        en: Up to 10 seats
      includes:
      - 10 seats
      - dashboard
      - alerts
      - weekly report
    - key: seats_50
      price: 99
      interval: month
      label:
        it: Fino a 50 postazioni
        en: Up to 50 seats
      includes:
      - 50 seats
      - dashboard
      - alerts
      - weekly report
    - key: seats_200
      price: 299
      interval: month
      label:
        it: Fino a 200 postazioni
        en: Up to 200 seats
      includes:
      - 200 seats
      - dashboard
      - alerts
      - weekly report
  notifications:
    emailOnRunDone: false
  extensions:
  - key: webhook_tenant
    description: 'The webhook /api/hooks/threat_event writes events into one company''s records: attributing each device''s
      events to the right company (per-company hook secret or device registry lookup) needs custom handling not expressible
      in the manifest.'
  - key: seat_billing
    description: Plans are seat tiers; billing per exact number of protected seats (metered) is not available, and the seat
      limit is enforced on registered users only.
