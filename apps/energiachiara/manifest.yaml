apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: energiachiara
  displayName: EnergiaChiara
  tagline:
    it: 'Meno sprechi, meno bollette: piani d''azione per energy manager.'
    en: 'Less waste, lower bills: action plans for energy managers.'
  description:
    it: EnergiaChiara analizza i consumi di elettricità e gas dei tuoi siti, trova le anomalie, stima gli euro sprecati e
      propone azioni con risparmio e tempo di rientro.
    en: EnergiaChiara analyses the electricity and gas consumption of your sites, finds anomalies, estimates the euros wasted
      and proposes actions with savings and payback.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#0b3d3a'
      accent: '#f2a900'
      background: '#f6faf8'
      foreground: '#14211f'
    fonts:
      body: Inter
      display: Manrope
    wordmark:
    - text: Energia
      color: primary
    - text: Chiara
      color: accent
    button: primary
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#how'
    - label:
        it: Dati
        en: Data
      href: '#data'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label:
        it: Admin organizzazione
        en: Organisation admin
      assignedBy: admin_emails
    - key: user
      label:
        it: Energy manager
        en: Energy manager
      assignedBy: signup
    - key: direzione
      label:
        it: Direzione
        en: Management
      assignedBy: invite
  limits:
  - action: run
    per: user
    max: 10
    window: day
    roles:
    - user
  egress:
    hosts:
    - ec.europa.eu
    notes: Eurostat dissemination API, dataset nrg_chdd_m (monthly heating/cooling degree days by country/region). Reuse allowed
      incl. commercial, CC BY 4.0.
  agents:
  - key: planner
    role: main
    description: Coordinates the baseline and anomaly agents, proposes actions with savings and payback, writes the monthly
      report and asks the energy manager to approve the plan.
    profile:
      inline:
        display_name: EnergiaChiara planner
        crews:
        - id: planner
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are an energy efficiency consultant writing for an energy manager of a company, condominium
            or small municipality. Workflow: 1) read the site with the site tool; 2) ask the baseline agent (ask_baseline)
            to clean the series and compute the site''s base profile; 3) ask the anomaly agent (ask_anomaly) to find anomalies
            and estimate the euros wasted; 4) propose concrete actions. Write the report with a level-1 title "# <Site> —
            Energy report <month>". Sections (## headings): Summary, Base profile, Anomalies and euros wasted, Year-on-year
            comparison, Action plan (table: action, expected annual saving kWh and EUR, investment, payback in years, priority),
            Assumptions and data quality. Add at least one chart as a fenced block ```chart {"type":"bar","title":"...","labels":[...],"series":[{"name":"...","values":[...]}],"unit":"kWh"}```
            using only real figures from the data (consumption by month, this year vs last year when available). Never invent
            figures: if data is missing or the year-on-year comparison is impossible, say so and state the assumption. Savings
            are estimates, not guarantees. When the plan is ready, save it with the action_plans write tool (fields: site,
            month, summary, total_saving_eur, actions, status ''draft'') and call request_action_plan so the energy manager
            approves it before it goes to management. Write in the language requested.'
          mcp_servers: []
    goalTemplate: 'Site id: {site}

      Reporting month: {month}

      {?electricity_data}Electricity data (15-minute readings, CSV pasted):

      {electricity_data}{/electricity_data}

      {?gas_data}Gas data (CSV pasted):

      {gas_data}{/gas_data}

      {?data_link}Data link: {data_link}{/data_link}

      {?notes}Notes: {notes}{/notes}

      Today is {date}. Write the report in the language with ISO code {lang}.'
    delegates:
    - baseline
    - anomaly
    awaits:
    - action_plan
    appTools:
    - name: read_site
      description: Read the registered sites of the user (area, use, schedule, tariff)
      action: read
      collection: sites
      scope: user
    - name: save_plan
      description: Save the action plan draft
      action: write
      collection: action_plans
      scope: user
    output: markdown
    writesTo:
      collection: action_plans
      parse: whole
    limits:
      maxTurns: 12
      maxBudgetUsd: 1.0
  - key: baseline
    role: helper
    description: Cleans the series, fills gaps and computes the base profile for the site.
    profile:
      inline:
        display_name: EnergiaChiara baseline
        crews:
        - id: baseline
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You clean energy time series. Input: quarter-hourly electricity and gas readings (CSV text pasted
            by the user, exported from the supplier portal) and the site data. Steps: detect the columns and units (kWh, kW,
            Smc), remove duplicates and impossible values, count the gaps and fill short gaps by interpolation or by the typical
            value for the same hour and weekday (say which, and how many points were filled; do not fill gaps longer than
            24 hours). Normalise by heating/cooling degree days: get them with the eurostat_dd tool (dataset nrg_chdd_m, query
            like geo=IT&freq=M&sinceTimePeriod=2025-01, JSON-stat response). Return: data quality (coverage %, filled points),
            base profile per site (weekday vs weekend and night vs day load, base load kW, monthly consumption, weather-normalised
            intensity kWh/m2). Real figures only; if the input is too short or truncated, say so.'
          mcp_servers: []
    appTools:
    - name: eurostat_dd
      description: Monthly heating and cooling degree days (Eurostat nrg_chdd_m)
      action: http
      http:
        method: GET
        url: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/nrg_chdd_m
        attribution: Eurostat, CC BY 4.0
    output: markdown
  - key: anomaly
    role: helper
    description: Finds anomalies and estimates the euros wasted.
    profile:
      inline:
        display_name: EnergiaChiara anomaly detector
        crews:
        - id: anomaly
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You detect energy anomalies from the cleaned series and the base profile you are given, plus the
            site''s operating hours and tariff. Look for: consumption outside operating hours (nights, weekends, holidays),
            peaks versus similar days, seasonal deviations after weather normalisation (degree days from the eurostat_dd tool,
            dataset nrg_chdd_m). For each anomaly give: date/period, type, severity (low, medium, severe), excess kWh versus
            the expected profile, and euros wasted = excess kWh x the tariff of the site (state the tariff used). Mark SEVERE
            ones separately. Real figures only; give a probable cause as a hypothesis, never as fact.'
          mcp_servers: []
    appTools:
    - name: eurostat_dd
      description: Monthly heating and cooling degree days (Eurostat nrg_chdd_m)
      action: http
      http:
        method: GET
        url: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/nrg_chdd_m
        attribution: Eurostat, CC BY 4.0
    output: markdown
  approvals:
  - key: action_plan
    title:
      it: Approva il piano d'azione
      en: Approve the action plan
    description: The energy manager approves the plan before it is sent to management.
    decidedBy: requester
    fields:
    - site
    - month
    - summary
    - total_saving_eur
  inputForm:
    title:
      it: Nuova analisi mensile
      en: New monthly analysis
    fields:
    - name: site
      type: relation
      relation: sites
      required: true
      label:
        it: Sito
        en: Site
    - name: month
      type: date
      required: true
      label:
        it: Mese di riferimento
        en: Reference month
    - name: electricity_data
      type: textarea
      maxLength: 30000
      label:
        it: CSV elettricità (quartorari)
        en: Electricity CSV (quarter-hourly)
      help:
        it: Incolla il CSV esportato dal portale del fornitore. Il caricamento file non è ancora disponibile.
        en: Paste the CSV exported from the supplier portal. File upload is not available yet.
    - name: gas_data
      type: textarea
      maxLength: 30000
      label:
        it: CSV gas
        en: Gas CSV
    - name: data_link
      type: url
      label:
        it: Link ai dati (facoltativo)
        en: Link to data (optional)
    - name: notes
      type: textarea
      maxLength: 500
      label:
        it: Note (facoltative)
        en: Notes (optional)
  data:
    collections:
    - name: sites
      ownedBy: user
      description: Sites (plants, offices, buildings) visible only to their assigned user
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome sito
          en: Site name
      - name: site_type
        type: select
        label:
          it: Destinazione d'uso
          en: Use
        options:
        - value: industrial
          label:
            it: Industriale
            en: Industrial
        - value: office
          label:
            it: Uffici
            en: Offices
        - value: residential
          label:
            it: Condominio
            en: Residential
        - value: public
          label:
            it: Edificio pubblico
            en: Public building
      - name: area_m2
        type: number
        label:
          it: Superficie m²
          en: Area m²
      - name: province
        type: text
        label:
          it: Provincia
          en: Province
      - name: schedule
        type: textarea
        maxLength: 400
        label:
          it: Orari di attività
          en: Operating hours
      - name: tariff_el
        type: number
        label:
          it: Tariffa elettricità €/kWh
          en: Electricity tariff €/kWh
      - name: tariff_gas
        type: number
        label:
          it: Tariffa gas €/Smc
          en: Gas tariff €/Smc
      - name: meter_points
        type: number
        label:
          it: Punti di misura
          en: Measuring points
    - name: action_plans
      ownedBy: user
      description: Action plans and monthly summaries per site
      fields:
      - name: site
        type: text
      - name: month
        type: text
      - name: summary
        type: textarea
      - name: total_saving_eur
        type: number
      - name: actions
        type: json
      - name: status
        type: select
        options:
        - draft
        - approved
        - sent
  views:
  - key: home
    type: page
    nav: false
    title: EnergiaChiara
    sections:
    - type: hero
      eyebrow:
        it: Per energy manager
        en: For energy managers
      title:
        it: Trova gli **sprechi** di energia e trasformali in risparmi.
        en: Find the energy **waste** and turn it into savings.
      text:
        it: 'Per aziende, condomini e piccoli comuni: anomalie nei consumi, euro sprecati, azioni con tempo di rientro e report
          mensile.'
        en: 'For companies, condominiums and small municipalities: consumption anomalies, euros wasted, actions with payback
          and a monthly report.'
      actions:
      - label:
          it: Inizia
          en: Get started
        href: /login
        style: primary
      band: true
    - type: steps
      id: how
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Registra i siti
          en: Register your sites
        text:
          it: Superficie, uso, orari e tariffa.
          en: Area, use, hours and tariff.
        badge: 🏢
      - title:
          it: Porta i dati
          en: Bring the data
        text:
          it: Incolla i CSV quartorari di elettricità e gas del fornitore.
          en: Paste the quarter-hourly electricity and gas CSVs from your supplier.
        badge: 📈
      - title:
          it: Analisi e piano
          en: Analysis and plan
        text:
          it: Tre agenti puliscono i dati, trovano le anomalie e propongono azioni. Tu approvi il piano prima che arrivi alla
            direzione.
          en: Three agents clean the data, find anomalies and propose actions. You approve the plan before it reaches management.
        badge: ✅
    - type: cards
      id: data
      title:
        it: Dati
        en: Data
      items:
      - title:
          it: Consumi
          en: Consumption
        text:
          it: CSV del fornitore. Connettori ai contatori in arrivo.
          en: Supplier CSVs. Meter connectors coming.
      - title:
          it: Meteo
          en: Weather
        text:
          it: Gradi giorno Eurostat (CC BY 4.0).
          en: Eurostat degree days (CC BY 4.0).
    - type: note
      content:
        it: Le stime di risparmio non sono garanzie. Supporto alle decisioni, non consulenza tecnica certificata.
        en: Savings estimates are not guarantees. Decision support, not certified technical advice.
  - key: sites
    type: list
    title:
      it: I miei siti
      en: My sites
    source: collection:sites
    roles:
    - user
    - admin
  - key: new
    type: new_run
    title:
      it: Nuova analisi
      en: New analysis
    roles:
    - user
    - admin
  - key: history
    type: history
    title:
      it: Le mie analisi
      en: My analyses
    source: run
    roles:
    - user
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: approvals
    type: approvals
    title:
      it: Piani da approvare
      en: Plans to approve
    approvals:
    - action_plan
    roles:
    - user
    - admin
  - key: management
    type: page
    title:
      it: Direzione
      en: Management
    roles:
    - direzione
    - admin
    - user
    sections:
    - type: data
      title:
        it: Piani d'azione
        en: Action plans
      source: collection:action_plans
      display: kpi
      kpis:
      - label:
          it: Piani
          en: Plans
        agg: count
      - label:
          it: Risparmio atteso €
          en: Expected saving €
        agg: sum
        field: total_saving_eur
        format: money
    - type: data
      source: collection:action_plans
      display: chart
      chart: bar
      fields:
      - key: site
      - key: total_saving_eur
        label:
          it: Risparmio €
          en: Saving €
      limit: 50
    - type: data
      source: collection:action_plans
      display: table
      fields:
      - key: site
      - key: month
        format: date
      - key: total_saving_eur
        format: money
      - key: status
        format: badge
      filters:
      - field: status
        op: '!='
        value: draft
      sort:
        field: month
        dir: desc
      limit: 60
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - user
    - admin
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: points_10
      price: 490
      interval: year
      label:
        it: Fino a 10 punti di misura
        en: Up to 10 measuring points
      includes:
      - 10 measuring points
      - monthly reports
      roles:
      - user
      - admin
    - key: points_50
      price: 1900
      interval: year
      label:
        it: Fino a 50 punti di misura
        en: Up to 50 measuring points
      includes:
      - 50 measuring points
      - monthly reports
      roles:
      - user
      - admin
    - key: points_200
      price: 5900
      interval: year
      label:
        it: Fino a 200 punti di misura
        en: Up to 200 measuring points
      includes:
      - 200 measuring points
      - monthly reports
      roles:
      - user
      - admin
  extensions:
  - key: file_upload
    description: 'Periodic CSV file upload is not available yet: users paste the CSV text or give a link.'
  - key: meter_connectors
    description: Connectors to meters/smart meters need each customer's credentials and are not available yet.
  - key: email_alerts
    description: Email alerts within one hour for severe anomalies are not available yet (no notifications); severe anomalies
      are flagged in the report.
  - key: site_assignment_and_aggregate
    description: Assigning a site to several users and the organisation-wide aggregate dashboard need a shared org scope;
      for now sites are per user and the management page shows the plans of the signed-in user. Per-point subscription limits
      are tiered plans, not metered.
  - key: pdf_export
    description: The monthly PDF is the printable report view (print to PDF).
