apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: energiachiara
  displayName: EnergiaChiara
  tagline:
    it: Meno sprechi energetici, più risparmi dimostrabili.
    en: Less wasted energy, savings you can prove.
  description:
    it: 'Piattaforma per energy manager di aziende, condomini e piccoli comuni: carica i consumi, trova le anomalie, ricevi
      azioni con risparmio e tempo di rientro e un report mensile.'
    en: 'Platform for energy managers of companies, condominiums and small municipalities: upload consumption, find anomalies,
      get actions with expected savings and payback, and a monthly report.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#0b3d4a'
      accent: '#2f9e6b'
      background: '#f6f9f8'
      foreground: '#13262b'
    fonts:
      body: Inter
      display: Manrope
    wordmark:
    - text: Energia
      color: primary
    - text: Chiara
      color: accent
    width: wide
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Dati
        en: Data
      href: '#dati'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: user
      label:
        it: Utente
        en: User
      assignedBy: signup
  limits:
  - action: create:meters
    max: 5
    window: total
    plans:
      punti_25: 25
      punti_100: 100
      punti_500: 500
  - action: agent:planner
    per: user
    max: 20
    window: month
    roles:
    - user
  agents:
  - key: planner
    role: main
    description: Coordinates the monthly analysis, proposes actions with savings and payback, writes the monthly report and
      asks the energy manager to approve the plan.
    delegates:
    - cleaner
    - detector
    awaits:
    - action_plan
    profile:
      inline:
        display_name: EnergiaChiara action planner
        crews:
        - id: planner
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 2.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the lead energy analyst of EnergiaChiara. For one site and one month you: (1) call ask_cleaner
            to clean the uploaded series (use read_upload with the file ids if the goal gives files) and update the site baseline;
            (2) call ask_detector to find anomalies and the euros wasted; (3) read readings, baselines and anomalies and write
            the monthly KPI record with write_kpis (fields site, month as YYYY-MM-01, kwh_total, kwh_elec, kwh_gas, eur_cost,
            eur_wasted, prev_year_kwh, members and viewers copied from the site); (4) propose 3-7 concrete actions, each with
            expected yearly saving in kWh and EUR, investment estimate, payback in months and a confidence level; state every
            assumption and never invent figures: when data is missing say so. Save the proposal with write_plans (status draft;
            site, month, summary, savings_eur, direction_email from the site, members, viewers) and then call request_action_plan:
            the energy manager must approve before management receives it. When your goal says an approval was granted, update
            that plan record with status ''sent'' using write_plans and nothing else. Report structure (Markdown, first line
            a level-1 title ''# <Site> — Energy report <month>''): ## Summary, ## Consumption and year-on-year comparison
            (a chart block), ## Anomalies and wasted euros, ## Action plan (table: action, saving kWh/year, saving EUR/year,
            investment, payback months), ## Data quality and assumptions. Add charts as fenced ```chart blocks with JSON {"type":"bar|line|stacked|pie","title":...,"labels":[...],"series":[{"name":...,"values":[...]}],"unit":...}
            using real figures only. Not financial advice: savings are estimates. Write in the requested language.'
          mcp_servers: []
    context:
    - key: site_name
      from: collection:sites.name
    - key: site_kind
      from: collection:sites.kind
    - key: area
      from: collection:sites.area_m2
    - key: usage
      from: collection:sites.usage
    - key: hours
      from: collection:sites.hours
    - key: tariff
      from: collection:sites.tariff
    - key: lat
      from: collection:sites.lat
    - key: lon
      from: collection:sites.lon
    goalTemplate: 'Site: {site_name} (id {site}), type {site_kind}, {area} m2, usage: {usage}.

      Opening hours: {hours}

      Tariff: {tariff}

      Coordinates: {lat}, {lon}

      Month to analyse: {month}

      {?elec_csv}Electricity CSV uploaded (file ids): {elec_csv}

      {elec_csv_text}{/elec_csv}

      {?gas_csv}Gas CSV uploaded (file ids): {gas_csv}

      {gas_csv_text}{/gas_csv}

      {?notes}Notes: {notes}{/notes}

      Today is {date}. Write the report in the language with ISO code {lang}.'
    output: markdown
    appTools:
    - name: read_upload
      description: Read a file the user uploaded
      action: read_file
    - name: planner_read_sites
      description: Read the user's sites
      action: read
      collection: sites
      scope: user
    - name: planner_read_readings
      description: Read cleaned consumption readings
      action: read
      collection: readings
      scope: user
    - name: planner_read_baselines
      description: Read the site baselines
      action: read
      collection: baselines
      scope: user
    - name: planner_read_anomalies
      description: Read detected anomalies
      action: read
      collection: anomalies
      scope: user
    - name: write_kpis
      description: Write the monthly KPI record of a site
      action: write
      collection: monthly_kpis
      scope: user
    - name: write_plans
      description: Create or update the action plan record
      action: write
      collection: action_plans
      scope: user
    limits:
      maxTurns: 30
      maxBudgetUsd: 2.0
  - key: cleaner
    role: helper
    description: Cleans the meter series, fills gaps and computes the baseline profile per site.
    profile:
      inline:
        display_name: EnergiaChiara data cleaner
        crews:
        - id: cleaner
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 20
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You prepare consumption data for one site. Input: quarter-hourly CSV from the supplier portal (electricity
            kWh, gas Smc) or readings already stored. Steps: detect separators, decimal commas, units and time zone (Europe/Rome,
            mind DST); remove duplicates and impossible values (negative, counter resets); fill gaps up to 6 hours by interpolating
            from similar days and flag longer gaps instead of inventing data; aggregate to hourly records and store them with
            append in write_readings (fields site, ts, carrier elec|gas, kwh, quality ok|filled|missing, members, viewers
            copied from the site). Get daily mean temperatures from the weather tool (Open-Meteo archive: query latitude=..&longitude=..&start_date=YYYY-MM-DD&end_date=YYYY-MM-DD&daily=temperature_2m_mean&timezone=Europe/Rome)
            and compute heating and cooling degree days (base 18 C heating, 24 C cooling, state the base). Then compute the
            baseline per site and carrier: typical daily profile for weekday, Saturday, Sunday and holiday, base load at night,
            and the regression of daily kWh on degree days; save it with write_baselines. Answer with a short summary of what
            was cleaned, the gaps found and the baseline values. Never invent data.'
          mcp_servers: []
    appTools:
    - name: read_upload
      description: Read a file the user uploaded
      action: read_file
    - name: cleaner_read_sites
      description: Read the user's sites
      action: read
      collection: sites
      scope: user
    - name: cleaner_read_readings
      description: Read stored readings
      action: read
      collection: readings
      scope: user
    - name: write_readings
      description: Append cleaned hourly readings
      action: append
      collection: readings
      scope: user
    - name: write_baselines
      description: Save the baseline of a site
      action: write
      collection: baselines
      scope: user
    - name: weather_history
      description: Daily historical weather (Open-Meteo archive)
      action: http
      http:
        method: GET
        url: https://archive-api.open-meteo.com/v1/archive
        attribution: Weather data by Open-Meteo.com, CC BY 4.0
    limits:
      maxTurns: 20
      maxBudgetUsd: 1.0
  - key: detector
    role: helper
    description: Finds anomalies (night/weekend use, peaks, seasonal drift) and estimates the euros wasted. Also runs hourly
      per monitored site.
    profile:
      inline:
        display_name: EnergiaChiara anomaly detector
        crews:
        - id: detector
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 20
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You detect energy anomalies for one site by comparing recent readings with the site baseline and
            its opening hours. Look for: consumption outside opening hours (nights, weekends, holidays) above the base load;
            peaks versus similar days (same weekday, similar degree days); seasonal drift versus the weather-normalised baseline.
            For each anomaly estimate the excess kWh against the baseline and the euros wasted using the site tariff (state
            the price used); classify severity low, medium or high (high = serious waste, e.g. excess above 30% of the expected
            level for 3+ hours or more than 50 EUR). Save each NEW anomaly with write_anomalies (fields site, site_name, detected_at,
            period_start, period_end, carrier, kind night|weekend|peak|seasonal, severity, excess_kwh, eur_wasted, explanation,
            manager_email from the site, members and viewers copied from the site); read existing anomalies first and do not
            duplicate. If there is no new data since the last check, answer ''No new data'' and stop. Keep the explanation
            to two plain sentences. Never invent figures.'
          mcp_servers: []
    appTools:
    - name: detector_read_sites
      description: Read the user's sites
      action: read
      collection: sites
      scope: user
    - name: detector_read_readings
      description: Read stored readings
      action: read
      collection: readings
      scope: user
    - name: detector_read_baselines
      description: Read the site baselines
      action: read
      collection: baselines
      scope: user
    - name: detector_read_anomalies
      description: Read existing anomalies
      action: read
      collection: anomalies
      scope: user
    - name: write_anomalies
      description: Append a detected anomaly
      action: append
      collection: anomalies
      scope: user
    goalTemplate: Check the site {site} ("{instance}"). Now is {date}. Detect new anomalies in the latest data and save them.
      Language ISO code {lang}.
    limits:
      maxTurns: 20
      maxBudgetUsd: 0.8
  inputForm:
    title:
      it: Nuova analisi mensile
      en: New monthly analysis
    fields:
    - name: site
      type: select
      required: true
      optionsFrom: collection:sites
      label:
        it: Sito
        en: Site
    - name: month
      type: text
      required: true
      maxLength: 7
      label:
        it: Mese (AAAA-MM)
        en: Month (YYYY-MM)
    - name: elec_csv
      type: file
      accept:
      - csv
      - xlsx
      - txt
      maxMb: 15
      multiple: true
      label:
        it: CSV quartorario elettricità
        en: Quarter-hourly electricity CSV
      help:
        it: Esportato dal portale del fornitore. Lascia vuoto se i dati arrivano dal connettore.
        en: Exported from the supplier portal. Leave empty if data arrives from the connector.
    - name: gas_csv
      type: file
      accept:
      - csv
      - xlsx
      - txt
      maxMb: 15
      multiple: true
      label:
        it: CSV gas
        en: Gas CSV
    - name: notes
      type: textarea
      maxLength: 500
      label:
        it: Note (facoltative)
        en: Notes (optional)
  data:
    collections:
    - name: sites
      ownedBy: user
      description: 'Sites: plants, offices, buildings'
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome
          en: Name
      - name: kind
        type: select
        required: true
        label:
          it: Tipo
          en: Type
        options:
        - value: plant
          label:
            it: Stabilimento
            en: Plant
        - value: office
          label:
            it: Ufficio
            en: Office
        - value: building
          label:
            it: Edificio / condominio
            en: Building / condominium
        - value: municipal
          label:
            it: Edificio comunale
            en: Municipal building
      - name: area_m2
        type: number
        label:
          it: Superficie (m²)
          en: Area (m²)
      - name: usage
        type: text
        label:
          it: Destinazione d'uso
          en: Use
      - name: hours
        type: textarea
        label:
          it: Orari di attività
          en: Operating hours
        help:
          it: es. lun-ven 8-18, sabato chiuso
          en: e.g. Mon-Fri 8-18, closed Saturday
      - name: tariff
        type: textarea
        label:
          it: Tariffa
          en: Tariff
        help:
          it: Prezzo luce e gas, fasce F1/F2/F3
          en: Electricity and gas prices, time bands
      - name: lat
        type: number
        label: Lat
      - name: lon
        type: number
        label: Lon
      - name: manager_email
        type: email
        label:
          it: Email energy manager
          en: Energy manager email
      - name: direction_email
        type: email
        label:
          it: Email direzione
          en: Management email
      - name: members
        type: array
        label:
          it: Utenti assegnati (email)
          en: Assigned users (emails)
      - name: viewers
        type: array
        label:
          it: Direzione in sola lettura (email)
          en: Management read-only (emails)
      access:
      - role: user
        where:
          members: '{user.email}'
        can:
        - read
        - write
      - role: user
        where:
          viewers: '{user.email}'
        can:
        - read
    - name: meters
      ownedBy: user
      description: Measurement points (POD/PDR) of a site
      fields:
      - name: site
        type: relation
        relation: sites
        required: true
        label:
          it: Sito
          en: Site
      - name: code
        type: text
        required: true
        label:
          it: Codice POD / PDR
          en: POD / PDR code
      - name: carrier
        type: select
        required: true
        label:
          it: Vettore
          en: Carrier
        options:
        - value: elec
          label:
            it: Elettricità
            en: Electricity
        - value: gas
          label: Gas
      - name: source
        type: select
        label:
          it: Origine dati
          en: Data source
        options:
        - value: connector
          label:
            it: Connettore / smart meter
            en: Connector / smart meter
        - value: csv
          label: CSV
      - name: members
        type: array
      - name: viewers
        type: array
      access:
      - role: user
        where:
          members: '{user.email}'
        can:
        - read
        - write
    - name: readings
      ownedBy: user
      retentionDays: 1100
      description: Cleaned hourly readings
      fields:
      - name: site
        type: text
      - name: ts
        type: date
      - name: carrier
        type: text
      - name: kwh
        type: number
      - name: quality
        type: text
      - name: members
        type: array
      - name: viewers
        type: array
      access:
      - role: user
        where:
          members: '{user.email}'
        can:
        - read
    - name: baselines
      ownedBy: user
      description: Baseline profile per site and carrier
      fields:
      - name: site
        type: text
      - name: carrier
        type: text
      - name: base_load_kw
        type: number
      - name: profile
        type: json
      - name: dd_slope
        type: number
      - name: updated
        type: date
      - name: members
        type: array
      access:
      - role: user
        where:
          members: '{user.email}'
        can:
        - read
    - name: anomalies
      ownedBy: user
      retentionDays: 730
      description: Detected anomalies with wasted euros
      fields:
      - name: site
        type: text
      - name: site_name
        type: text
        label:
          it: Sito
          en: Site
      - name: detected_at
        type: date
        label:
          it: Rilevata
          en: Detected
      - name: period_start
        type: date
      - name: period_end
        type: date
      - name: carrier
        type: text
      - name: kind
        type: select
        label:
          it: Tipo
          en: Kind
        options:
        - night
        - weekend
        - peak
        - seasonal
      - name: severity
        type: select
        label:
          it: Gravità
          en: Severity
        options:
        - low
        - medium
        - high
      - name: excess_kwh
        type: number
      - name: eur_wasted
        type: number
        label:
          it: € sprecati
          en: € wasted
      - name: explanation
        type: textarea
      - name: manager_email
        type: email
      - name: members
        type: array
      - name: viewers
        type: array
      access:
      - role: user
        where:
          members: '{user.email}'
        can:
        - read
        - write
      - role: user
        where:
          viewers: '{user.email}'
        can:
        - read
    - name: monthly_kpis
      ownedBy: user
      description: Monthly figures per site, for the aggregated dashboard
      fields:
      - name: site
        type: text
      - name: month
        type: date
      - name: kwh_total
        type: number
      - name: kwh_elec
        type: number
      - name: kwh_gas
        type: number
      - name: eur_cost
        type: number
      - name: eur_wasted
        type: number
      - name: prev_year_kwh
        type: number
      - name: members
        type: array
      - name: viewers
        type: array
      access:
      - role: user
        where:
          members: '{user.email}'
        can:
        - read
      - role: user
        where:
          viewers: '{user.email}'
        can:
        - read
    - name: action_plans
      ownedBy: user
      description: Action plans, approved by the energy manager before going to management
      fields:
      - name: site
        type: text
      - name: month
        type: text
      - name: summary
        type: textarea
        label:
          it: Sintesi
          en: Summary
      - name: savings_eur
        type: number
        label:
          it: Risparmio atteso €/anno
          en: Expected saving €/year
      - name: status
        type: select
        options:
        - draft
        - sent
      - name: direction_email
        type: email
      - name: members
        type: array
      - name: viewers
        type: array
      access:
      - role: user
        where:
          members: '{user.email}'
        can:
        - read
      - role: user
        where:
          viewers: '{user.email}'
        can:
        - read
  approvals:
  - key: action_plan
    title:
      it: Approva il piano d'azione
      en: Approve the action plan
    description: The energy manager approves the action plan before it is sent to management.
    decidedBy: requester
    fields:
    - site
    - month
    - summary
    - savings_eur
  templates:
  - key: site_monitor
    title:
      it: Monitoraggio anomalie sito
      en: Site anomaly monitor
    description:
      it: Controlla ogni ora i nuovi dati di un sito e segnala le anomalie.
      en: Checks a site's new data every hour and flags anomalies.
    agent: detector
    params:
    - name: site
      type: select
      required: true
      optionsFrom: collection:sites
      label:
        it: Sito
        en: Site
    goal: Check the site {site} ("{instance}"). Now is {date}. Detect new anomalies in the latest data and save them. Language
      ISO code {lang}.
    schedule:
      cron: 0 * * * *
      userCanChange: false
    maxPerUser: 50
  triggers:
  - key: meter_hook
    description: Readings pushed by a customer's connector or smart meter
    'on':
      webhook: true
    write:
      collection: readings
      fields:
        site: site
        ts: ts
        carrier: carrier
        kwh: kwh
      keyBy: ts
  - key: severe_alert
    description: Email for serious anomalies
    'on':
      collection: anomalies
      op: insert
      where:
        severity: high
    notify:
      to:
      - owner
      - record.manager_email
      subject:
        it: 'Anomalia grave: {record.site_name}'
        en: 'Serious anomaly: {record.site_name}'
      body:
        it: 'Rilevata un''anomalia di gravità alta su {record.site_name} ({record.kind}). Spreco stimato: {record.eur_wasted}
          €. {record.explanation}'
        en: 'A high-severity anomaly was detected at {record.site_name} ({record.kind}). Estimated waste: {record.eur_wasted}
          EUR. {record.explanation}'
      link: anomalies
  - key: plan_approved
    description: After approval the planner marks the plan as sent
    'on':
      approval: action_plan
      decision: approved
    start:
      agent: planner
    goal: 'The energy manager approved the action plan. Event: {event}. Update the matching action_plans record with status
      ''sent'' and answer with one line.'
  - key: plan_sent
    'on':
      collection: action_plans
      op: update
      where:
        status: sent
    notify:
      to:
      - record.direction_email
      - owner
      subject:
        it: 'Piano d''azione energia approvato: {record.month}'
        en: 'Energy action plan approved: {record.month}'
      body:
        it: 'Il piano d''azione è stato approvato dall''energy manager. Risparmio atteso: {record.savings_eur} €/anno. {record.summary}'
        en: 'The action plan was approved by the energy manager. Expected saving: {record.savings_eur} EUR/year. {record.summary}'
      link: plans
  egress:
    hosts:
    - archive-api.open-meteo.com
    notes: Open-Meteo historical weather for degree days, CC BY 4.0 attribution; the free tier is for non-commercial use,
      so a commercial plan or another provider must be confirmed before launch.
  notifications:
    emailOnRunDone: true
  views:
  - key: home
    type: page
    nav: false
    title: EnergiaChiara
    sections:
    - type: hero
      title:
        it: Meno **sprechi** energetici, risparmi dimostrabili.
        en: Less **wasted** energy, savings you can prove.
      text:
        it: 'Per energy manager di aziende, condomini e piccoli comuni: carica i consumi, trova le anomalie, ricevi azioni
          con risparmio e tempo di rientro e un report mensile in PDF.'
        en: 'For energy managers of companies, condominiums and small municipalities: upload consumption, find anomalies,
          get actions with savings and payback, and a monthly PDF report.'
      actions:
      - label:
          it: Inizia
          en: Get started
        href: /login
        style: primary
      band: true
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Registra i siti
          en: Register sites
        text:
          it: Superficie, uso, orari e tariffa. Ogni sito è visibile solo agli utenti assegnati.
          en: Area, use, hours and tariff. Each site is visible only to assigned users.
        badge: 🏢
      - title:
          it: Porta i dati
          en: Bring the data
        text:
          it: Connettore agli smart meter oppure CSV quartorari dal portale del fornitore, più gradi giorno da dati meteo
            open.
          en: A connector to your smart meters or quarter-hourly CSVs from the supplier portal, plus degree days from open
            weather data.
        badge: 📈
      - title:
          it: Anomalie e azioni
          en: Anomalies and actions
        text:
          it: Gli agenti trovano gli sprechi, stimano gli euro persi e propongono azioni. Tu approvi, la direzione riceve.
          en: Agents find waste, estimate lost euros and propose actions. You approve, management receives.
        badge: ⚡
    - type: cards
      id: dati
      title:
        it: Dati e fonti
        en: Data and sources
      items:
      - title:
          it: Contatori
          en: Meters
        text:
          it: Elettricità e gas, quartorari, via connettore o CSV.
          en: Electricity and gas, quarter-hourly, via connector or CSV.
      - title:
          it: Meteo
          en: Weather
        text:
          it: Gradi giorno da Open-Meteo (CC BY 4.0).
          en: Degree days from Open-Meteo (CC BY 4.0).
    - type: note
      content:
        it: I risparmi sono stime a supporto delle decisioni, non una garanzia né una consulenza.
        en: Savings are estimates to support decisions, not a guarantee or advice.
  - key: overview
    type: page
    title:
      it: Dashboard direzione
      en: Management dashboard
    roles:
    - user
    - admin
    sections:
    - type: data
      id: kpi
      source: collection:monthly_kpis
      display: kpi
      kpis:
      - label:
          it: kWh totali
          en: Total kWh
        agg: sum
        field: kwh_total
        format: number
      - label:
          it: Costo €
          en: Cost €
        agg: sum
        field: eur_cost
        format: money
      - label:
          it: € sprecati
          en: € wasted
        agg: sum
        field: eur_wasted
        format: money
    - type: data
      id: trend
      title:
        it: Consumi mensili e anno precedente
        en: Monthly consumption vs previous year
      source: collection:monthly_kpis
      display: chart
      chart: line
      groupBy:
        field: month
        bucket: month
        aggs:
        - key: kwh
          agg: sum
          field: kwh_total
        - key: prev
          agg: sum
          field: prev_year_kwh
      fields:
      - key: month
        label:
          it: Mese
          en: Month
      - key: kwh
        label: kWh
      - key: prev
        label:
          it: Anno prec.
          en: Prev. year
    - type: data
      id: waste
      title:
        it: € sprecati per mese
        en: € wasted per month
      source: collection:monthly_kpis
      display: chart
      chart: bar
      groupBy:
        field: month
        bucket: month
        aggs:
        - key: wasted
          agg: sum
          field: eur_wasted
      fields:
      - key: month
      - key: wasted
        label: €
