apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: vocedelmercato
  displayName: VoceDelMercato
  tagline:
    it: Ascolta cosa dice il mercato di te e dei tuoi concorrenti.
    en: Listen to what the market says about you and your competitors.
  description:
    it: 'Consumer intelligence per marketing manager e agenzie: progetti di ascolto notturni su fonti lecite, sentiment, temi,
      quota di voce e report mensili approvati dall''analista.'
    en: 'Consumer intelligence for marketing managers and agencies: nightly listening projects on lawful sources, sentiment,
      themes, share of voice and monthly reports approved by the analyst.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: dashboard
  branding:
    theme: light
    palette:
      primary: '#1f2a44'
      accent: '#e4572e'
      background: '#f7f8fb'
      foreground: '#161b26'
    fonts:
      body: Inter
      display: Sora
    wordmark:
    - text: VoceDel
      color: primary
    - text: Mercato
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Fonti lecite
        en: Lawful sources
      href: '#fonti'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label:
        it: Admin agenzia
        en: Agency admin
      assignedBy: admin_emails
    - key: analyst
      label:
        it: Analista
        en: Analyst
      assignedBy: invite
    - key: client
      label:
        it: Cliente (sola lettura)
        en: Client (read-only)
      assignedBy: invite
  limits:
  - action: chat
    per: user
    max: 60
    window: day
  - action: agent:reporter
    per: user
    max: 10
    window: day
  agents:
  - key: collector
    role: scheduled
    description: Every night collects public mentions of one listening project from lawful sources, dedups, classifies and
      stores them.
    memory: instance
    writesTo:
      collection: daily_snapshots
      parse: json_last
      keyBy: date
    output: markdown+json
    resultSchema:
      type: object
      properties:
        date:
          type: string
        volume:
          type: integer
        negative:
          type: integer
        positive:
          type: integer
        neutral:
          type: integer
        brand_share:
          type: number
        top_themes:
          type: string
        top_countries:
          type: string
        top_quote:
          type: string
        top_quote_url:
          type: string
    appTools:
    - name: search_mentions
      description: Full-text search over the stored mentions
      action: search
      collection: mentions
      scope: user
    - name: store_mention
      description: Store one new classified mention
      action: append
      collection: mentions
      scope: user
    limits:
      maxTurns: 60
      maxBudgetUsd: 2.0
    profile:
      inline:
        display_name: VoceDelMercato collector
        crews:
        - id: collector
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 60
          max_budget_usd: 2.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You are the nightly listening agent of a consumer-intelligence platform. For one listening project
            (brand, competitors, keywords, exclusions, languages, countries) you collect PUBLIC content published since the
            last run from lawful sources only: RSS feeds of news outlets and blogs, forums whose terms allow collection, public
            review pages that allow it, and Reddit through its commercial API. NEVER touch social networks that forbid scraping
            (Facebook, Instagram, X, TikTok, LinkedIn...) and never bypass logins, paywalls or robots rules. Build and run
            the collection through the WebRobot MCP (do not write code yourself). Drop anything matching the exclusions. Before
            storing, call search_mentions with the URL or a text fingerprint to skip duplicates. For each new mention call
            store_mention with fields: project (the instance title), published_at, source, source_type, url, country, lang,
            text (short excerpt, max 300 chars), brand (which brand/competitor it is about), sentiment (positive|neutral|negative),
            emotion (joy|trust|anger|fear|sadness|surprise|neutral), theme (2-4 words), author_type (consumer|journalist|brand).
            Never invent content, URLs or figures. Finish with a short Markdown summary starting with ''# <project> — <date>''
            and then a final JSON block (last in the answer) with date (YYYY-MM-DD), volume, negative, positive, neutral,
            brand_share (the project brand''s share of voice 0-100 among brand and competitors), top_themes (comma separated),
            top_countries (comma separated), top_quote, top_quote_url. Use your memory (tool remember) to keep the cut-off
            time and the sources that worked.'
  - key: analyst_chat
    role: helper
    description: Answers analyst questions with evidence from the stored mentions.
    appTools:
    - name: search_mentions
      description: Full-text search over the stored mentions
      action: search
      collection: mentions
      scope: user
    - name: read_snapshots
      description: Daily volume/sentiment snapshots
      action: read
      collection: daily_snapshots
      scope: user
    goalTemplate: 'Conversation so far:

      {history}


      Analyst question: {message}

      Answer in the language with ISO code {lang}. Today is {date}.'
    output: markdown
    limits:
      maxTurns: 15
      maxBudgetUsd: 0.6
    profile:
      inline:
        display_name: VoceDelMercato analyst assistant
        chat_mode: true
        crews:
        - id: analyst_chat
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are a market-research analyst assistant. Answer questions like ''why did negative sentiment
            rise in October?'' ONLY with evidence found through search_mentions and read_snapshots: compare periods, name
            the themes and sources that drove the change, quote 2-4 representative mentions with their source link, and give
            counts. If the evidence is thin or missing, say so. Never invent mentions, figures or links. Keep answers concise
            with a short list of findings and a closing line on what to check next.'
  - key: reporter
    role: main
    description: Writes the monthly client report and asks the analyst to approve it before it goes to the client.
    awaits:
    - report_approval
    appTools:
    - name: search_mentions
      description: Full-text search over the stored mentions
      action: search
      collection: mentions
      scope: user
    - name: read_snapshots
      description: Daily volume/sentiment snapshots
      action: read
      collection: daily_snapshots
      scope: user
    goalTemplate: 'Project: {project}

      Month: {month}

      {?focus}Focus requested: {focus}{/focus}

      Write the monthly report in the language with ISO code {lang}, then request approval.'
    output: markdown
    limits:
      maxTurns: 25
      maxBudgetUsd: 1.0
    profile:
      inline:
        display_name: VoceDelMercato monthly reporter
        crews:
        - id: reporter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write the monthly consumer-intelligence report for a client''s listening project. Use only data
            from search_mentions and read_snapshots. Start with ''# <Project> — <Month>''. Sections (## ): Sintesi / Summary,
            Volume e trend, Sentiment ed emozioni, Quota di voce vs concorrenti, Temi emergenti, Citazioni rappresentative
            (each with source link), Paesi, Rischi e raccomandazioni. Add a chart as a fenced chart block for volume over
            time and one for share of voice, with real figures only. Never invent figures or quotes. When the draft is complete,
            call request_report_approval: the analyst must approve before the client sees it.'
  inputForm:
    title:
      it: Report mensile
      en: Monthly report
    fields:
    - name: project
      type: text
      required: true
      label:
        it: Progetto
        en: Project
    - name: month
      type: text
      required: true
      label:
        it: Mese (AAAA-MM)
        en: Month (YYYY-MM)
    - name: focus
      type: textarea
      maxLength: 400
      label:
        it: Focus (facoltativo)
        en: Focus (optional)
  data:
    collections:
    - name: mentions
      ownedBy: instance
      searchable: true
      description: Deduplicated, classified public mentions of a listening project
      fields:
      - name: published_at
        type: date
      - name: source
        type: text
      - name: source_type
        type: select
        options:
        - news
        - blog
        - forum
        - review
        - reddit
        - social_api
      - name: url
        type: url
      - name: country
        type: country
      - name: lang
        type: text
      - name: text
        type: textarea
      - name: brand
        type: text
      - name: sentiment
        type: select
        options:
        - positive
        - neutral
        - negative
      - name: emotion
        type: text
      - name: theme
        type: text
      - name: author_type
        type: select
        options:
        - consumer
        - journalist
        - brand
    - name: daily_snapshots
      ownedBy: instance
      description: 'One record per night and project: volume, sentiment, share of voice, themes, top quote'
      fields:
      - name: date
        type: date
      - name: volume
        type: number
      - name: negative
        type: number
      - name: positive
        type: number
      - name: neutral
        type: number
      - name: brand_share
        type: number
      - name: top_themes
        type: text
      - name: top_countries
        type: text
      - name: top_quote
        type: textarea
      - name: top_quote_url
        type: url
  templates:
  - key: listening_project
    title:
      it: Progetto di ascolto
      en: Listening project
    description:
      it: Ogni notte raccoglie e classifica le menzioni pubbliche di brand e concorrenti.
      en: Every night collects and classifies public mentions of your brand and competitors.
    agent: collector
    roles:
    - admin
    - analyst
    maxPerUser: 10
    params:
    - name: brand
      type: text
      required: true
      label: Brand
    - name: competitors
      type: textarea
      maxLength: 400
      label:
        it: Concorrenti (uno per riga)
        en: Competitors (one per line)
    - name: keywords
      type: textarea
      required: true
      maxLength: 600
      label:
        it: Parole chiave
        en: Keywords
    - name: exclusions
      type: textarea
      maxLength: 400
      label:
        it: Esclusioni
        en: Exclusions
    - name: languages
      type: text
      required: true
      label:
        it: Lingue (es. it, en)
        en: Languages (e.g. it, en)
    - name: countries
      type: text
      required: true
      label:
        it: Paesi (es. IT, DE)
        en: Countries (e.g. IT, DE)
    - name: period_start
      type: date
      label:
        it: Dal
        en: From
    - name: social_api_note
      type: text
      label:
        it: Social con abbonamento API ufficiale (facoltativo)
        en: Social with official API subscription (optional)
    goal: 'Listening project "{instance}". Brand: {brand}. Competitors: {competitors}. Keywords: {keywords}. Exclusions: {exclusions}.
      Languages: {languages}. Countries: {countries}. Start of period: {period_start}. Today is {date}. Collect, deduplicate,
      classify and store new public mentions from lawful sources only, then give the daily summary.'
    schedule:
      cron: 0 2 * * *
      userCanChange: false
    cost:
      perRun: 10
  approvals:
  - key: report_approval
    title:
      it: Approvazione report mensile
      en: Monthly report approval
    description: The analyst reviews the monthly report before it is shown to the end client.
    role: analyst
    decidedBy: role
    timeoutMinutes: 10080
    onTimeout: reject
  views:
  - key: home
    type: page
    nav: false
    title: VoceDelMercato
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow:
        it: Consumer intelligence
        en: Consumer intelligence
      title:
        it: Cosa dice il **mercato** di te e dei tuoi concorrenti.
        en: What the **market** says about you and your competitors.
      text:
        it: 'Progetti di ascolto notturni su fonti lecite: sentiment, emozioni, temi, quota di voce e citazioni con link alla
          fonte. Un analista AI risponde ai tuoi ''perché''.'
        en: 'Nightly listening projects on lawful sources: sentiment, emotions, themes, share of voice and quotes linked to
          their source. An AI analyst answers your ''why'' questions.'
      actions:
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: primary
      - label:
          it: Come funziona
          en: How it works
        href: '#come-funziona'
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Crea un progetto
          en: Create a project
        text:
          it: Brand, concorrenti, parole chiave, esclusioni, lingue, paesi e periodo.
          en: Brand, competitors, keywords, exclusions, languages, countries and period.
        badge: '1'
      - title:
          it: Ascolto ogni notte
          en: Nightly listening
        text:
          it: Gli agenti raccolgono, deduplicano e classificano le menzioni pubbliche.
          en: Agents collect, deduplicate and classify public mentions.
        badge: '2'
      - title:
          it: Dashboard, chat e report
          en: Dashboard, chat and report
        text:
          it: Analizza i trend, chiedi all'analista e consegna un report mensile approvato.
          en: Explore trends, ask the analyst and deliver an approved monthly report.
        badge: '3'
    - type: cards
      id: fonti
      title:
        it: Fonti lecite
        en: Lawful sources
      items:
      - title: RSS
        text:
          it: Testate e blog.
          en: News outlets and blogs.
        badge: 📰
      - title: Forum & recensioni
        text:
          it: Solo dove i termini d'uso consentono la raccolta.
          en: Only where terms of use allow collection.
        badge: 💬
      - title: Reddit
        text:
          it: Tramite API commerciale.
          en: Through the commercial API.
        badge: 🔎
      - title:
          it: Social vietati
          en: Restricted social networks
        text:
          it: Mai raccolti senza API ufficiale.
          en: Never collected without an official API.
        badge: 🚫
    - type: note
      content:
        it: 'Supporto alle decisioni: i dati provengono da contenuti pubblici e possono essere incompleti.'
        en: 'Decision support: data comes from public content and may be incomplete.'
  - key: projects
    type: instances
    template: listening_project
    title:
      it: Progetti di ascolto
      en: Listening projects
    roles:
    - admin
    - analyst
  - key: dashboard
    type: page
    title:
      it: Dashboard
      en: Dashboard
    roles:
    - admin
    - analyst
    - client
    sections:
    - type: data
      title:
        it: Indicatori
        en: Key figures
      source: collection:daily_snapshots
      display: kpi
      kpis:
      - label:
          it: Menzioni
          en: Mentions
        agg: sum
        field: volume
        format: number
      - label:
          it: Negative
          en: Negative
        agg: sum
        field: negative
        format: number
      - label:
          it: Quota di voce %
          en: Share of voice %
        agg: avg
        field: brand_share
        format: number
    - type: data
      title:
        it: Volume e sentiment nel tempo
        en: Volume and sentiment over time
      source: collection:daily_snapshots
      display: chart
      chart: stacked
      fields:
      - key: date
        format: date
      - key: positive
      - key: neutral
      - key: negative
      sort:
        field: date
        dir: asc
      limit: 90
    - type: data
      title:
        it: Quota di voce
        en: Share of voice
      source: collection:daily_snapshots
      display: chart
      chart: line
      fields:
      - key: date
        format: date
      - key: brand_share
      sort:
        field: date
        dir: asc
      limit: 90
    - type: data
      title:
        it: Temi e paesi
        en: Themes and countries
      source: collection:daily_snapshots
      display: table
      fields:
      - key: date
        format: date
      - key: top_themes
      - key: top_countries
      sort:
        field: date
        dir: desc
      limit: 14
    - type: data
      title:
        it: Citazioni rappresentative
        en: Representative quotes
      source: collection:mentions
      display: cards
      fields:
      - key: text
      - key: source
      - key: sentiment
        format: badge
      - key: country
        format: badge
      - key: url
        label:
          it: Fonte
          en: Source
        format: link
      sort:
        field: published_at
        dir: desc
      limit: 12
    - type: data
      title:
        it: Mappa per paese
        en: Map by country
      source: collection:mentions
      display: bar
      fields:
      - key: country
      limit: 50
  - key: mentions_view
    type: table
    title:
      it: Menzioni
      en: Mentions
    source: collection:mentions
    columns:
    - published_at
    - source
    - country
    - brand
    - sentiment
    - emotion
    - theme
    - author_type
    - url
    roles:
    - admin
    - analyst
    - client
  - key: ask
    type: chat
    title:
      it: Chiedi all'analista
      en: Ask the analyst
    source: agent:analyst_chat
    roles:
    - admin
    - analyst
    examples:
    - Perché a ottobre è salito il sentiment negativo?
    - Why did negative sentiment rise in October?
    - Quali temi emergenti sul brand questa settimana?
    placeholder:
      it: Fai una domanda sui dati…
      en: Ask a question about the data…
  - key: new_report
    type: new_run
    title:
      it: Report mensile
      en: Monthly report
    roles:
    - admin
    - analyst
  - key: reports
    type: history
    title:
      it: Report
      en: Reports
    source: run
    roles:
    - admin
    - analyst
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: approve
    type: approvals
    title:
      it: Approvazioni
      en: Approvals
    roles:
    - admin
    - analyst
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - admin
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 50
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:reporter:
        estimate: 10
        metered: true
    packs:
    - key: extra
      credits: 1000
      price: 10
      label: Extra
    plans:
    - key: agency_s
      price: 149
      interval: month
      label:
        it: Agenzia S — 3 progetti, 15.000 menzioni
        en: Agency S — 3 projects, 15,000 mentions
      includes:
      - 3 projects
      - 15000 mentions/month
      credits: 3000
      creditsReset: monthly
      roles:
      - admin
    - key: agency_m
      price: 449
      interval: month
      label:
        it: Agenzia M — 10 progetti, 100.000 menzioni
        en: Agency M — 10 projects, 100,000 mentions
      includes:
      - 10 projects
      - 100000 mentions/month
      credits: 10000
      creditsReset: monthly
      roles:
      - admin
  extensions:
  - key: email_alerts
    description: 'Email alert when negative volume exceeds a threshold, and sending the approved PDF to the end client: notifications
      are not available yet. For now negative volume is visible on the dashboard and the approved report is printable to PDF.'
  - key: client_read_only_share
    description: 'Client role with read-only access to their own project only: sharing a project instance with a client user
      is not yet expressible; the client role currently sees what the agency grants.'
  - key: search_engine
    description: 'Dedicated full-text search index with relevance ranking: mentions are searchable through the app''s collection
      search; a separate search engine is not configured.'
  - key: social_api_connectors
    description: Connecting a customer's own official social API key needs per-customer credentials, not available yet; the
      project only records the intent.
  - key: country_map
    description: A true geographic map is not a built-in block; countries are shown as a bar chart.
  - key: monthly_report_schedule
    description: The monthly report is started by the analyst from the form; automatic monthly generation per project is a
      later step.
