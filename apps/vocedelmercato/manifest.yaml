apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: vocedelmercato
  displayName: VoceDelMercato
  tagline:
    it: 'Ascolta il mercato ogni notte: sentiment, temi e quota di voce.'
    en: 'Listen to the market every night: sentiment, themes and share of voice.'
  description:
    it: 'Piattaforma di consumer intelligence per marketing manager e agenzie: progetti di ascolto su fonti lecite, dashboard,
      chat con l''analista, alert e report mensile approvato.'
    en: 'Consumer intelligence for marketing managers and agencies: listening projects on lawful sources, dashboard, analyst
      chat, alerts and an approved monthly report.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: dashboard
  branding:
    theme: light
    palette:
      primary: '#1d2b53'
      accent: '#e4572e'
      background: '#f7f8fb'
      foreground: '#161a2b'
    fonts:
      body: Inter
      display: Sora
    wordmark:
    - text: VoceDel
      color: primary
    - text: Mercato
      color: accent
    width: wide
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Fonti lecite
        en: Lawful sources
      href: '#fonti'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label:
        it: Admin agenzia
        en: Agency admin
      assignedBy: admin_emails
    - key: analyst
      label:
        it: Analista
        en: Analyst
      assignedBy: invite
    - key: client
      label:
        it: Cliente (sola lettura)
        en: Client (read-only)
      assignedBy: invite
    - key: user
      label:
        it: Utente agenzia
        en: Agency user
      assignedBy: signup
  limits:
  - action: create:mentions
    max: 5000
    window: month
    plans:
      pro: 50000
      agency: -1
  - action: chat
    per: user
    max: 60
    window: day
  agents:
  - key: collector
    role: scheduled
    description: 'Nightly listening for one project: collects public content from lawful sources, dedups, classifies, stores
      and raises alerts.'
    memory: instance
    profile:
      inline:
        display_name: VoceDelMercato collector
        crews:
        - id: collector
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 60
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You are the nightly listening agent of a consumer-intelligence platform. For ONE listening project
            you collect NEW public content from the last day about the brand and its competitors.

            LAWFUL SOURCES ONLY: RSS feeds of news outlets and blogs, forums whose terms of use allow collection (check robots.txt
            and terms first), public review sites that allow it, and Reddit through the reddit_search tool. NEVER scrape social
            networks that forbid it (Facebook, Instagram, X, TikTok, LinkedIn...). Use social APIs only if the user connected
            an official subscription; otherwise skip them. Use the WebRobot MCP to fetch and parse feeds and pages; do not
            write code.

            Respect keywords, exclusions (drop any content matching them), languages, countries and period given in the goal.

            DEDUPLICATION: before saving, call search_mentions with the content URL; skip if it already exists; skip near-identical
            reposts of the same text.

            For each new content call write_mention with fields: project, brand (the brand or competitor it is about), url,
            source, source_type (news|blog|forum|review|reddit), published_at (YYYY-MM-DD), country (ISO code), lat and lon
            (approximate centroid of the country), language, title, text (short excerpt, max 400 chars), quote (most representative
            sentence), sentiment (positive|neutral|negative), sentiment_score (-1..1), emotion (joy|trust|anger|sadness|fear|surprise|neutral),
            theme (short noun phrase), author_type (consumer|journalist|brand), client_email (as given in goal). Never invent
            content or URLs; every mention must come from a page you really read.

            ALERT: after saving, count the NEGATIVE mentions of the project brand for today with search_mentions; if the count
            is above the threshold in the goal, call write_alert once with project, date, negative_count, threshold, summary,
            notify_email.

            Your memory holds sources that work and ones to avoid; at the end call remember with the updated list. Finish
            with a short markdown log starting with "# Ascolto <project> — <date>" (counts per source, skipped sources and
            why).'
    goalTemplate: 'Project: {instance}. Brand: {brand}. Competitors: {competitors}. Keywords: {keywords}. Exclusions: {?exclusions}{exclusions}{/exclusions}{!exclusions}none{/exclusions}.
      Languages: {languages}. Countries: {countries}. Period to cover: last {period_days} days on the first run, then the
      last day. Negative alert threshold: {negative_threshold} negative mentions per day. client_email: {client_email}. notify_email:
      {notify_email}. Today is {date}.'
    appTools:
    - name: search_mentions
      description: Search mentions already saved (by url, brand, sentiment, date)
      action: search
      collection: mentions
      scope: user
    - name: write_mention
      description: Save one classified mention
      action: write
      collection: mentions
      scope: user
    - name: write_alert
      description: Save a negative-volume alert
      action: write
      collection: alerts
      scope: user
    - name: reddit_search
      description: Search Reddit posts via the commercial API (query, sort, time window)
      action: http
      http:
        method: GET
        url: https://oauth.reddit.com/search
        attribution: Reddit commercial API
        credential:
          provider: reddit
          header: Authorization
          format: Bearer {secret}
    output: markdown
    limits:
      maxTurns: 60
      maxBudgetUsd: 1.0
  - key: analyst_chat
    role: helper
    description: Answers analyst questions (e.g. why negative sentiment rose in October) with evidence from the indexed mentions.
    profile:
      inline:
        display_name: VoceDelMercato analyst assistant
        crews:
        - id: analyst_chat
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are a consumer-intelligence analyst assistant. Answer ONLY from the mentions you retrieve with
            search_mentions and read_mentions: compare the period asked with the previous one, quantify the change (counts,
            share), identify the themes, sources and authors that drive it, and quote 3-5 representative mentions with their
            source link. If evidence is thin say so plainly; never invent figures or quotes. Distinguish correlation from
            cause. Answer in the user''s language, concise, with bullet points and a small table when comparing numbers. You
            may add a ```chart block with real figures.'
    goalTemplate: 'Conversation so far:

      {history}

      New question from {user}: {message}

      Today is {date}. Reply in language {lang}.'
    appTools:
    - name: search_mentions
      description: Full-text search over the user's mentions
      action: search
      collection: mentions
      scope: user
    - name: read_mentions
      description: Read mentions with filters
      action: read
      collection: mentions
      scope: user
    output: markdown
    limits:
      maxTurns: 15
      maxBudgetUsd: 0.5
  - key: reporter
    role: helper
    description: Drafts the monthly report, asks the analyst's approval, then publishes it to the client.
    awaits:
    - monthly_report
    profile:
      inline:
        display_name: VoceDelMercato reporter
        crews:
        - id: reporter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write the monthly consumer-intelligence report for one project. Two modes given in the goal.

            DRAFT: read the previous month''s mentions with read_mentions/search_mentions, then write the report in Markdown
            starting with "# <Brand> — Voce del mercato <month>"; sections ## Sintesi / Summary, ## Volume e andamento, ##
            Sentiment ed emozioni, ## Quota di voce vs concorrenti, ## Temi emergenti, ## Citazioni rappresentative (with
            source links), ## Paesi, ## Raccomandazioni. Add ```chart blocks with real figures (type bar|line|pie). Never
            invent figures. Save it with write_report (status "draft", project, month, body, no client_email) and then call
            request_monthly_report once.

            PUBLISH (after approval): save the final report again with write_report with status "approved" and the client_email
            from the goal, using the same body.'
    goalTemplate: 'Mode: {mode}. Project: {instance}. Brand: {brand}. Month to cover: previous calendar month of {date}. client_email:
      {client_email}. Report language: {lang}.'
    appTools:
    - name: search_mentions
      description: Full-text search over mentions
      action: search
      collection: mentions
      scope: user
    - name: read_mentions
      description: Read mentions
      action: read
      collection: mentions
      scope: user
    - name: write_report
      description: Save a report
      action: write
      collection: reports
      scope: user
    output: markdown
    limits:
      maxTurns: 25
      maxBudgetUsd: 0.8
  templates:
  - key: listening_project
    title:
      it: Progetto di ascolto
      en: Listening project
    description:
      it: Ogni notte l'agente raccoglie e classifica i contenuti pubblici su brand e concorrenti.
      en: Every night the agent collects and classifies public content about your brand and competitors.
    agent: collector
    params:
    - name: brand
      type: text
      required: true
      label:
        it: Brand
        en: Brand
    - name: competitors
      type: textarea
      label:
        it: Concorrenti (uno per riga)
        en: Competitors (one per line)
    - name: keywords
      type: textarea
      required: true
      label:
        it: Parole chiave
        en: Keywords
    - name: exclusions
      type: textarea
      label:
        it: Esclusioni
        en: Exclusions
    - name: languages
      type: multiselect
      required: true
      label:
        it: Lingue
        en: Languages
      options:
      - value: it
        label: Italiano
      - value: en
        label: English
      - value: fr
        label: Français
      - value: de
        label: Deutsch
      - value: es
        label: Español
    - name: countries
      type: multiselect
      required: true
      label:
        it: Paesi
        en: Countries
      options:
      - value: IT
        label: Italia
      - value: GB
        label: United Kingdom
      - value: FR
        label: France
      - value: DE
        label: Deutschland
      - value: ES
        label: España
      - value: US
        label: USA
    - name: period_days
      type: select
      required: true
      label:
        it: Periodo iniziale
        en: Initial period
      options:
      - value: '30'
        label:
          it: Ultimi 30 giorni
          en: Last 30 days
      - value: '90'
        label:
          it: Ultimi 90 giorni
          en: Last 90 days
      - value: '180'
        label:
          it: Ultimi 6 mesi
          en: Last 6 months
    - name: negative_threshold
      type: number
      required: true
      default: 20
      label:
        it: Soglia alert (menzioni negative/giorno)
        en: Alert threshold (negative mentions/day)
    - name: notify_email
      type: email
      required: true
      label:
        it: Email per gli alert
        en: Alert email
    - name: client_email
      type: email
      label:
        it: Email del cliente finale (sola lettura)
        en: End client email (read-only)
    goal: Run tonight's listening for project "{instance}".
    schedule:
      cron: 0 2 * * *
      userCanChange: false
    maxPerUser: 20
  inputForm:
    title:
      it: Nuovo progetto
      en: New project
    fields:
    - name: brand
      type: text
      label: Brand
  data:
    collections:
    - name: mentions
      description: Classified public mentions, deduplicated and full-text indexed
      ownedBy: user
      searchable: true
      retentionDays: 730
      fields:
      - name: project
        type: text
      - name: brand
        type: text
      - name: url
        type: url
      - name: source
        type: text
      - name: source_type
        type: select
        options:
        - news
        - blog
        - forum
        - review
        - reddit
      - name: published_at
        type: date
      - name: country
        type: text
      - name: lat
        type: number
      - name: lon
        type: number
      - name: language
        type: text
      - name: title
        type: text
      - name: text
        type: textarea
      - name: quote
        type: textarea
      - name: sentiment
        type: select
        options:
        - positive
        - neutral
        - negative
      - name: sentiment_score
        type: number
      - name: emotion
        type: select
        options:
        - joy
        - trust
        - anger
        - sadness
        - fear
        - surprise
        - neutral
      - name: theme
        type: text
      - name: author_type
        type: select
        options:
        - consumer
        - journalist
        - brand
      - name: client_email
        type: email
      access:
      - role: analyst
        can:
        - read
      - role: client
        where:
          client_email: '{user.email}'
        can:
        - read
    - name: alerts
      ownedBy: user
      retentionDays: 365
      fields:
      - name: project
        type: text
      - name: date
        type: date
      - name: negative_count
        type: number
      - name: threshold
        type: number
      - name: summary
        type: textarea
      - name: notify_email
        type: email
      access:
      - role: analyst
        can:
        - read
    - name: reports
      ownedBy: user
      fields:
      - name: project
        type: text
      - name: month
        type: text
      - name: body
        type: textarea
      - name: status
        type: select
        options:
        - draft
        - approved
      - name: client_email
        type: email
      access:
      - role: analyst
        can:
        - read
        - write
      - role: client
        where:
          client_email: '{user.email}'
          status: approved
        can:
        - read
  approvals:
  - key: monthly_report
    title:
      it: Approva il report mensile
      en: Approve the monthly report
    role: analyst
    fields:
    - project
    - month
    timeoutMinutes: 10080
    onTimeout: reject
  triggers:
  - key: negative_alert
    'on':
      collection: alerts
      op: insert
    notify:
      to:
      - owner
      - record.notify_email
      subject:
        it: 'Alert: volume negativo sopra soglia — {record.project}'
        en: 'Alert: negative volume above threshold — {record.project}'
      body:
        it: 'Il {record.date} il progetto {record.project} ha {record.negative_count} menzioni negative (soglia {record.threshold}).

          {record.summary}'
        en: 'On {record.date} project {record.project} had {record.negative_count} negative mentions (threshold {record.threshold}).

          {record.summary}'
      link: dashboard
  - key: report_approved
    'on':
      approval: monthly_report
      decision: approved
    start:
      agent: reporter
    goal: 'Mode: PUBLISH. Publish the approved report of the event {event}.'
  - key: report_published
    'on':
      collection: reports
      op: insert
      where:
        status: approved
    notify:
      to:
      - owner
      - record.client_email
      subject:
        it: Report mensile pronto — {record.project}
        en: Monthly report ready — {record.project}
      body:
        it: Il report di {record.month} per {record.project} è stato approvato dall'analista ed è disponibile in piattaforma.
        en: The {record.month} report for {record.project} has been approved by the analyst and is available in the app.
      link: reports
  views:
  - key: home
    type: page
    nav: false
    title: VoceDelMercato
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow:
        it: Consumer intelligence
        en: Consumer intelligence
      title:
        it: Ascolta il **mercato** ogni notte.
        en: Listen to the **market** every night.
      text:
        it: 'Brand, concorrenti, parole chiave: gli agenti raccolgono contenuti pubblici da fonti lecite, li classificano
          per sentiment, emozione, tema e autore, e li rendono ricercabili.'
        en: 'Brand, competitors, keywords: agents collect public content from lawful sources, classify it by sentiment, emotion,
          theme and author, and make it searchable.'
      actions:
      - label:
          it: Crea un progetto
          en: Create a project
        href: /v/projects
        style: primary
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Definisci il progetto
          en: Define the project
        text:
          it: Brand, concorrenti, parole chiave, esclusioni, lingue, paesi, periodo.
          en: Brand, competitors, keywords, exclusions, languages, countries, period.
        badge: '1'
      - title:
          it: Raccolta notturna
          en: Nightly collection
        text:
          it: Deduplica e classificazione di ogni contenuto, indicizzato full-text.
          en: Every item is deduplicated, classified and full-text indexed.
        badge: '2'
      - title:
          it: Dashboard, chat e report
          en: Dashboard, chat and report
        text:
          it: Volume, quota di voce, temi, citazioni, mappa; alert email; report mensile approvato.
          en: Volume, share of voice, themes, quotes, map; email alerts; approved monthly report.
        badge: '3'
    - type: cards
      id: fonti
      title:
        it: Fonti lecite
        en: Lawful sources
      items:
      - title: RSS
        text:
          it: Testate e blog.
          en: News outlets and blogs.
      - title: Forum & recensioni
        text:
          it: Solo dove i termini d'uso consentono la raccolta.
          en: Only where the terms of use allow collection.
      - title: Reddit
        text:
          it: Tramite API commerciale.
          en: Through the commercial API.
      - title:
          it: Social
          en: Social
        text:
          it: 'Mai scraping: solo con la tua chiave API ufficiale.'
          en: 'Never scraped: only with your own official API key.'
    - type: note
      content:
        it: Supporto alle decisioni. Le analisi si basano su contenuti pubblici e possono non essere esaustive.
        en: Decision support. Analyses rely on public content and may not be exhaustive.
  - key: projects
    type: instances
    template: listening_project
    title:
      it: Progetti di ascolto
      en: Listening projects
    roles:
    - user
    - admin
  - key: dashboard
    type: dashboard
    title:
      it: Dashboard
      en: Dashboard
    children:
    - volume
    - share_of_voice
    - sentiment_trend
    - themes
    - quotes
    - country_map
    roles:
    - user
    - admin
    - analyst
    - client
  - key: volume
    type: chart
    title:
      it: Volume nel tempo
      en: Volume over time
    source: collection:mentions
    nav: false
    data:
      display: chart
      chart: line
      fields:
      - key: published_at
        label:
          it: Data
          en: Date
      - key: count
        label:
          it: Menzioni
          en: Mentions
      groupBy:
        field: published_at
        bucket: day
        aggs: []
      sort:
        field: published_at
        dir: asc
      limit: 200
  - key: sentiment_trend
    type: chart
    title:
      it: Sentiment medio
      en: Average sentiment
    source: collection:mentions
    nav: false
    data:
      display: chart
      chart: line
      fields:
      - key: published_at
        label:
          it: Data
          en: Date
      - key: avg_score
        label: Sentiment
      groupBy:
        field: published_at
        bucket: week
        aggs:
        - key: avg_score
          agg: avg
          field: sentiment_score
      limit: 200
  - key: share_of_voice
    type: chart
    title:
      it: Quota di voce
      en: Share of voice
    source: collection:mentions
    nav: false
    data:
      display: chart
      chart: pie
      fields:
      - key: brand
        label: Brand
      - key: count
        label:
          it: Menzioni
          en: Mentions
      groupBy:
        field: brand
        aggs: []
      limit: 50
  - key: themes
    type: chart
    title:
      it: Temi emergenti
      en: Emerging themes
    source: collection:mentions
    nav: false
    data:
      display: chart
      chart: bar
      fields:
      - key: theme
        label:
          it: Tema
          en: Theme
      - key: count
        label:
          it: Menzioni
          en: Mentions
      groupBy:
        field: theme
        aggs: []
      limit: 20
  - key: quotes
    type: table
    title:
      it: Citazioni rappresentative
      en: Representative quotes
    source: collection:mentions
    nav: false
    export: true
    data:
      display: table
      fields:
      - key: published_at
        label:
          it: Data
          en: Date
        format: date
      - key: brand
        label: Brand
      - key: quote
        label:
          it: Citazione
          en: Quote
      - key: sentiment
        label: Sentiment
        format: badge
      - key: author_type
        label:
          it: Autore
          en: Author
        format: badge
      - key: source
        label:
          it: Fonte
          en: Source
      - key: url
        label: Link
        format: link
      sort:
        field: published_at
        dir: desc
      limit: 50
  - key: country_map
    type: map
    title:
      it: Mappa per paese
      en: Map by country
    source: collection:mentions
    nav: false
    map:
      lat: lat
      lon: lon
      title: country
      popup:
      - brand
      - sentiment
      - theme
      - url
  - key: search
    type: table
    title:
      it: Cerca menzioni
      en: Search mentions
    source: collection:mentions
    export: true
    roles:
    - user
    - admin
    - analyst
    - client
    data:
      display: table
      fields:
      - key: published_at
        label:
          it: Data
          en: Date
        format: date
      - key: brand
        label: Brand
      - key: title
        label:
          it: Titolo
          en: Title
      - key: sentiment
        label: Sentiment
        format: badge
      - key: emotion
        label:
          it: Emozione
          en: Emotion
        format: badge
      - key: theme
        label:
          it: Tema
          en: Theme
      - key: country
        label:
          it: Paese
          en: Country
      - key: url
        label: Link
        format: link
      sort:
        field: published_at
        dir: desc
      limit: 100
  - key: chat
    type: chat
    source: agent:analyst_chat
    title:
      it: Chiedi all'analista
      en: Ask the analyst
    examples:
    - it: Perché a ottobre è salito il sentiment negativo?
      en: Why did negative sentiment rise in October?
    - it: Quali temi crescono rispetto ai concorrenti?
      en: Which themes are growing versus competitors?
    placeholder:
      it: Fai una domanda sui dati del progetto…
      en: Ask a question about the project data…
    roles:
    - user
    - admin
    - analyst
  - key: approvals
    type: approvals
    title:
      it: Approvazioni report
      en: Report approvals
    approvals:
    - monthly_report
    roles:
    - analyst
    - admin
  - key: reports
    type: table
    title:
      it: Report mensili
      en: Monthly reports
    source: collection:reports
    roles:
    - user
    - admin
    - analyst
    - client
    data:
      display: table
      fields:
      - key: project
        label:
          it: Progetto
          en: Project
      - key: month
        label:
          it: Mese
          en: Month
      - key: status
        label:
          it: Stato
          en: Status
        format: badge
      sort:
        field: month
        dir: desc
      limit: 60
  - key: report
    type: report
    source: collection:reports
    printable: true
    nav: false
  - key: alerts_list
    type: table
    title:
      it: Alert
      en: Alerts
    source: collection:alerts
    roles:
    - user
    - admin
    - analyst
    data:
      display: table
      fields:
      - key: date
        label:
          it: Data
          en: Date
        format: date
      - key: project
        label:
          it: Progetto
          en: Project
      - key: negative_count
        label:
          it: Negative
          en: Negative
        format: number
      - key: summary
        label:
          it: Sintesi
          en: Summary
      sort:
        field: date
        dir: desc
      limit: 50
  - key: account
    type: account
    title:
      it: Abbonamento e fonti
      en: Plan and sources
    roles:
    - user
    - admin
  egress:
    hosts:
    - oauth.reddit.com
    notes: Reddit commercial API under the app owner's commercial agreement. RSS, forums and review sites are fetched through
      the WebRobot MCP only where their terms of use allow collection.
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: starter
      price: 99
      interval: month
      label: Starter
      includes:
      - 3 projects
      - 5,000 mentions/month
    - key: pro
      price: 349
      interval: month
      label: Pro
      includes:
      - 15 projects
      - 50,000 mentions/month
    - key: agency
      price: 899
      interval: month
      label: Agency
      includes:
      - Unlimited projects
      - Unlimited mentions
  notifications:
    emailOnRunDone: false
  extensions:
  - key: social_api_keys
    description: Connecting a client's official social API subscription with their own key needs per-client hosts and provider-specific
      tools; not available yet. OAuth-based social APIs are also not available.
  - key: project_quota
    description: A hard cap on the number of projects per plan (3/15/unlimited) is not enforceable on template instances yet;
      only the monthly mentions cap is enforced via limits. Project counts are stated in the plan description.
  - key: pdf_export
    description: The monthly report is a printable view (save as PDF from the browser); automatic PDF attachments in email
      are not available. The notification links to the report.
  - key: fulltext_engine
    description: Full-text search uses the collection's searchable index; a dedicated external search engine is not wired.
