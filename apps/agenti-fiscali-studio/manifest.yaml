apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: calcolostudio
  displayName: CalcoloStudio
  tagline:
    it: Gli adempimenti ripetitivi dello studio, calcolati passo per passo.
    en: Your firm's repetitive tax filings, calculated step by step.
  description:
    it: 'App interna per studi di commercialisti: IMU, modello F24 e ravvedimento operoso calcolati in modo deterministico,
      motivati con circolari e risoluzioni dell''Agenzia delle Entrate e approvati dal professionista.'
    en: 'Internal app for accounting firms: IMU, F24 and ravvedimento operoso calculated deterministically, backed by Revenue
      Agency circulars and approved by the professional.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f3a5f'
      accent: '#2f7d6d'
      background: '#f7f8fa'
      foreground: '#1a2230'
    fonts:
      body: Inter
      display: Source Serif 4
    wordmark:
    - text: Calcolo
      color: primary
    - text: Studio
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Titolare
      assignedBy: admin_emails
    - key: collaboratore
      label: Collaboratore
      assignedBy: invite
  limits:
  - action: agent:calcolatore
    per: user
    max: 40
    window: day
    roles:
    - collaboratore
  agents:
  - key: calcolatore
    role: main
    description: Calcola IMU, F24 e ravvedimento con gli strumenti deterministici dell'app, motiva con le circolari e propone
      l'F24 al professionista.
    profile:
      inline:
        display_name: CalcoloStudio — calcolatore
        crews:
        - id: calcolatore
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''assistente di calcolo di uno studio di commercialisti italiano. Prepari adempimenti (IMU,
            F24, ravvedimento operoso) per UN cliente dello studio. Regole ferme:

            1. Non fare mai i conti a mente: ogni importo deriva dagli strumenti calcola_imu e calcola_ravvedimento. Se uno
            strumento restituisce un errore, riportalo e chiedi il dato mancante.

            2. Leggi il cliente con leggi_cliente, i suoi immobili con leggi_immobili e i documenti caricati (testo/link)
            con leggi_documenti. Le aliquote e detrazioni del comune vengono SOLO da cerca_aliquote: se per comune e anno
            non c''è un record, non inventare l''aliquota, dillo e fermati su quell''immobile.

            3. Motiva ogni scelta (codice tributo, aliquota, riduzioni, sanzioni) cercando con cerca_circolari le circolari
            e risoluzioni dell''Agenzia delle Entrate e del MEF; cita numero, data e oggetto del documento trovato. Se non
            trovi una fonte, scrivi ''fonte da verificare''. Non citare estremi che non hai trovato.

            4. Scadenze IMU: acconto 16 giugno, saldo 16 dicembre. Per l''F24 usa i codici tributo restituiti dallo strumento
            e il codice catastale del comune; importi in euro arrotondati.

            5. Quando il calcolo è un F24, salvalo con salva_f24 (stato ''bozza'') e poi chiama request_approva_f24: il professionista
            deve approvarlo prima che il cliente lo riceva. Non dire mai che l''F24 è stato inviato al cliente: l''invio è
            a carico del collaboratore dopo l''approvazione.

            6. Non dare consulenza come fatto certo: segnala casi dubbi (pertinenze, comproprietà, variazioni in corso d''anno,
            immobili locati o inagibili) come ''da verificare dal professionista''.

            Formato del report (Markdown, in italiano): inizia con un titolo di livello 1 "# <Cliente> — <adempimento> <anno>".
            Poi ## Dati usati (cliente e immobili), ## Calcolo passo per passo (per ogni immobile: base imponibile, aliquota,
            quota e mesi, detrazione, imposta annua, acconto e saldo), ## Modello F24 (tabella: sezione, codice tributo, codice
            ente, anno, importo a debito, scadenza) oppure ## Ravvedimento (tabella: imposta, sanzione, interessi, totale,
            codici tributo), ## Motivazioni e fonti, ## Da verificare. Aggiungi, se ci sono più immobili, un grafico ```chart
            con le imposte per immobile (solo cifre reali).'
          mcp_servers: []
    goalTemplate: 'Cliente (id scheda): {client}

      Adempimento richiesto: {calcolo_label}

      Anno d''imposta: {anno}

      {?data_versamento}Data di versamento prevista (per ravvedimento): {data_versamento}{/data_versamento}

      {?note}Note del collaboratore: {note}{/note}

      Collaboratore: {user}. Data di oggi: {date}. Scrivi in italiano.'
    output: markdown
    awaits:
    - approva_f24
    appTools:
    - name: leggi_cliente
      description: Legge la scheda del cliente (anagrafica, regime fiscale, email)
      action: read
      collection: clients
      scope: user
    - name: leggi_immobili
      description: Legge gli immobili del cliente (categoria, rendita, comune, quota, mesi)
      action: search
      collection: immobili
      scope: user
    - name: leggi_documenti
      description: Legge i documenti del cliente (testo incollato o link)
      action: search
      collection: documenti
      scope: user
    - name: cerca_aliquote
      description: Cerca aliquote IMU e detrazioni per comune e anno
      action: search
      collection: aliquote_imu
      scope: all
    - name: cerca_circolari
      description: Cerca circolari e risoluzioni indicizzate dell'Agenzia delle Entrate
      action: search
      collection: circolari
      scope: all
    - name: calcola_imu
      description: 'Calcolo deterministico IMU di un immobile. Args: categoria, rendita, aliquota_permille, quota_pct, mesi,
        tipo (abitazione_principale|altri_fabbricati|rurale_strumentale|area_fabbricabile), detrazione'
      action: call
      slot: imu_calc
    - name: calcola_ravvedimento
      description: 'Calcolo deterministico di sanzione e interessi del ravvedimento. Args: importo, scadenza (YYYY-MM-DD),
        data_versamento (YYYY-MM-DD), tassi [{dal,al,tasso_pct}]'
      action: call
      slot: ravvedimento_calc
    - name: salva_f24
      description: Salva la bozza dell'F24 per l'approvazione
      action: write
      collection: f24
      scope: user
    limits:
      maxTurns: 30
      maxBudgetUsd: 1.0
      timeoutSeconds: 600
  inputForm:
    title:
      it: Nuovo calcolo
      en: New calculation
    fields:
    - name: client
      type: relation
      relation: clients
      required: true
      label:
        it: Cliente
        en: Client
    - name: calcolo
      type: select
      required: true
      label:
        it: Adempimento
        en: Task
      options:
      - value: imu
        label:
          it: IMU (acconto e saldo)
          en: IMU
      - value: f24
        label:
          it: IMU + modello F24
          en: IMU + F24
      - value: ravvedimento
        label:
          it: Ravvedimento operoso
          en: Ravvedimento
    - name: anno
      type: number
      required: true
      default: 2026
      label:
        it: Anno d'imposta
        en: Tax year
    - name: data_versamento
      type: date
      visibleWhen: calcolo == 'ravvedimento'
      label:
        it: Data di versamento
        en: Payment date
    - name: note
      type: textarea
      maxLength: 600
      label:
        it: Note (facoltative)
        en: Notes (optional)
  data:
    collections:
    - name: clients
      ownedBy: user
      description: Schede cliente dello studio
      fields:
      - name: denominazione
        type: text
        required: true
        label: Denominazione
      - name: codice_fiscale
        type: text
        label: Codice fiscale
      - name: regime_fiscale
        type: select
        label: Regime fiscale
        options:
        - ordinario
        - semplificato
        - forfettario
        - persona_fisica
        - societa_di_persone
        - societa_di_capitali
      - name: email
        type: email
        label: Email cliente
      - name: collaboratore
        type: email
        label: Collaboratore assegnato
      - name: note
        type: textarea
        label: Note
    - name: immobili
      ownedBy: user
      description: Immobili dei clienti
      fields:
      - name: client
        type: relation
        relation: clients
        required: true
        label: Cliente
      - name: descrizione
        type: text
        label: Descrizione
      - name: comune
        type: text
        required: true
        label: Comune
      - name: codice_catastale
        type: text
        label: Codice catastale comune
      - name: categoria
        type: text
        required: true
        label: Categoria catastale
      - name: rendita
        type: number
        required: true
        label: Rendita catastale
      - name: quota_pct
        type: number
        default: 100
        label: Quota di possesso %
      - name: mesi
        type: number
        default: 12
        label: Mesi di possesso
      - name: tipo
        type: select
        label: Tipo
        options:
        - abitazione_principale
        - altri_fabbricati
        - rurale_strumentale
        - area_fabbricabile
    - name: documenti
      ownedBy: user
      description: 'Documenti del cliente: link o testo incollato (visure, dichiarazioni, cartelle)'
      fields:
      - name: client
        type: relation
        relation: clients
        required: true
        label: Cliente
      - name: tipo
        type: select
        label: Tipo
        options:
        - visura
        - dichiarazione
        - cartella
        - altro
      - name: titolo
        type: text
        label: Titolo
      - name: link
        type: url
        label: Link al documento
      - name: testo
        type: textarea
        label: Testo incollato
    - name: aliquote_imu
      ownedBy: shared
      searchable: true
      description: Aliquote IMU per comune e anno
      fields:
      - name: comune
        type: text
        label: Comune
      - name: codice_catastale
        type: text
        label: Codice catastale
      - name: anno
        type: number
        label: Anno
      - name: tipo
        type: text
        label: Tipologia
      - name: aliquota_permille
        type: number
        label: Aliquota ‰
      - name: detrazione
        type: number
        label: Detrazione €
      - name: fonte
        type: url
        label: Delibera
    - name: circolari
      ownedBy: shared
      searchable: true
      description: Circolari e risoluzioni indicizzate
      fields:
      - name: numero
        type: text
        label: Numero
      - name: data
        type: date
        label: Data
      - name: tipo
        type: select
        label: Tipo
        options:
        - circolare
        - risoluzione
        - principio
      - name: oggetto
        type: text
        label: Oggetto
      - name: testo
        type: textarea
        label: Testo/estratto
      - name: link
        type: url
        label: Link
    - name: f24
      ownedBy: user
      description: F24 prodotti e stato di approvazione
      fields:
      - name: client
        type: relation
        relation: clients
        label: Cliente
      - name: anno
        type: number
        label: Anno
      - name: scadenza
        type: date
        label: Scadenza
      - name: righe
        type: json
        label: Righe F24
      - name: totale
        type: number
        label: Totale €
      - name: stato
        type: select
        label: Stato
        options:
        - bozza
        - in_approvazione
        - approvato
        - respinto
  approvals:
  - key: approva_f24
    title:
      it: Approvazione F24
      en: F24 approval
    description: Il professionista approva l'F24 prima che il collaboratore lo invii al cliente
    role: admin
    decidedBy: role
    fields:
    - client
    - anno
    - totale
    - righe
    timeoutMinutes: 10080
    onTimeout: reject
  slots:
  - key: imu_calc
    description: Calcolo IMU deterministico di un immobile
    timeoutMs: 3000
    example:
      args:
        categoria: A/2
        rendita: 900
        aliquota_permille: 10.6
        quota_pct: 100
        mesi: 12
        tipo: altri_fabbricati
        detrazione: 0
    code: "COEFF = {'A': 160, 'A/10': 80, 'B': 140, 'C/1': 55, 'C/2': 160, 'C/3': 140, 'C/4': 140, 'C/5': 140, 'C/6': 160,\
      \ 'C/7': 160, 'D': 65, 'D/5': 80}\nCODICI = {'abitazione_principale': '3912', 'altri_fabbricati': '3918', 'rurale_strumentale':\
      \ '3913', 'area_fabbricabile': '3916'}\n\ndef r(x):\n    return int(x + 0.5)\n\ndef main(input):\n    a = input.get('args')\
      \ or input\n    cat = str(a.get('categoria', '')).upper().strip()\n    key = cat if cat in COEFF else (cat.split('/')[0]\
      \ if cat.split('/')[0] in ('A', 'B', 'D') else None)\n    tipo = a.get('tipo', 'altri_fabbricati')\n    if key is None:\n\
      \        return {'errore': 'categoria catastale non gestita: ' + cat}\n    try:\n        rendita = float(a['rendita'])\n\
      \        al = float(a['aliquota_permille'])\n    except Exception:\n        return {'errore': 'servono rendita e aliquota_permille'}\n\
      \    quota = float(a.get('quota_pct', 100)) / 100.0\n    mesi = int(a.get('mesi', 12))\n    detr = float(a.get('detrazione',\
      \ 0) or 0) if tipo == 'abitazione_principale' else 0.0\n    coeff = COEFF[key]\n    rivalutata = rendita * 1.05\n  \
      \  base = rivalutata * coeff\n    annua = base * al / 1000.0 * quota * mesi / 12.0\n    detr_eff = detr * quota * mesi\
      \ / 12.0\n    dovuta = max(0.0, annua - detr_eff)\n    totale = r(dovuta)\n    acconto = r(dovuta / 2.0)\n    saldo\
      \ = totale - acconto\n    codice = CODICI.get(tipo, '3918')\n    nota = ''\n    if key.startswith('D'):\n        codice\
      \ = '3925 (quota Stato 7,6‰) + 3930 (eccedenza al comune)'\n        nota = 'Categoria D: ripartire tra Stato e comune'\n\
      \    steps = [\n        'Rendita rivalutata 5%: %.2f x 1,05 = %.2f' % (rendita, rivalutata),\n        'Base imponibile:\
      \ %.2f x %d = %.2f' % (rivalutata, coeff, base),\n        'Imposta annua: base x %.2f‰ x quota %.0f%% x %d/12 = %.2f'\
      \ % (al, quota * 100, mesi, annua),\n        'Detrazione proporzionata: %.2f' % detr_eff,\n        'Imposta dovuta arrotondata:\
      \ %d; acconto (16/6) %d; saldo (16/12) %d' % (totale, acconto, saldo)\n    ]\n    return {'base_imponibile': round(base,\
      \ 2), 'imposta_annua': round(annua, 2), 'detrazione': round(detr_eff, 2), 'totale': totale, 'acconto': acconto, 'saldo':\
      \ saldo, 'codice_tributo': codice, 'nota': nota, 'passaggi': steps}\n"
  - key: ravvedimento_calc
    description: Sanzione ridotta e interessi del ravvedimento operoso
    timeoutMs: 3000
    example:
      args:
        importo: 500
        scadenza: '2026-06-16'
        data_versamento: '2026-07-10'
        tassi:
        - dal: '2026-01-01'
          al: '2026-12-31'
          tasso_pct: 2.0
    code: "from datetime import date\n\ndef d(s):\n    y, m, dd = str(s).split('-')\n    return date(int(y), int(m), int(dd))\n\
      \ndef main(input):\n    a = input.get('args') or input\n    try:\n        imp = float(a['importo'])\n        sc = d(a['scadenza'])\n\
      \        pg = d(a['data_versamento'])\n    except Exception:\n        return {'errore': 'servono importo, scadenza e\
      \ data_versamento (YYYY-MM-DD)'}\n    g = (pg - sc).days\n    if g <= 0:\n        return {'errore': 'versamento non\
      \ in ritardo: nessun ravvedimento'}\n    if g <= 14:\n        pct = 0.1 * g\n        regola = 'ravvedimento sprint:\
      \ 0,1% per giorno'\n    elif g <= 30:\n        pct = 1.5\n        regola = 'entro 30 giorni'\n    elif g <= 90:\n  \
      \      pct = 25.0 / 9\n        regola = 'entro 90 giorni (1/9 di 25%)'\n    elif g <= 365:\n        pct = 25.0 / 8\n\
      \        regola = 'entro la dichiarazione/anno (1/8 di 25%)'\n    elif g <= 730:\n        pct = 25.0 / 7\n        regola\
      \ = 'entro 2 anni (1/7 di 25%)'\n    else:\n        pct = 25.0 / 6\n        regola = 'oltre 2 anni (1/6 di 25%)'\n \
      \   sanz = imp * pct / 100.0\n    tassi = a.get('tassi') or []\n    interessi = 0.0\n    dettaglio = []\n    for t in\
      \ tassi:\n        s = max(sc, d(t['dal']))\n        e = min(pg, d(t['al']))\n        n = (e - s).days\n        if n\
      \ > 0:\n            i = imp * float(t['tasso_pct']) / 100.0 * n / 365.0\n            interessi += i\n            dettaglio.append('%d\
      \ gg al %.2f%% = %.2f' % (n, float(t['tasso_pct']), i))\n    tot = imp + sanz + interessi\n    return {'giorni_ritardo':\
      \ g, 'percentuale_sanzione': round(pct, 4), 'regola': regola, 'sanzione': round(sanz, 2), 'interessi': round(interessi,\
      \ 2), 'dettaglio_interessi': dettaglio, 'totale': round(tot, 2), 'codici_tributo': 'imposta: codice del tributo originario;\
      \ sanzione IMU 8929; interessi IMU 1944', 'avviso': 'Verificare percentuali e tassi sulla norma vigente alla data della\
      \ violazione'}\n"
  views:
  - key: home
    type: page
    nav: false
    title: CalcoloStudio
    sections:
    - type: hero
      band: true
      eyebrow:
        it: Per lo studio
        en: For your firm
      title:
        it: Gli adempimenti ripetitivi, **calcolati e motivati**.
        en: Repetitive filings, **calculated and justified**.
      text:
        it: IMU, modello F24 e ravvedimento operoso preparati da un agente con calcoli deterministici, passo per passo, e
          approvati dal professionista prima dell'invio al cliente.
        en: IMU, F24 and ravvedimento prepared by an agent with deterministic step-by-step calculations, approved by the professional
          before it goes to the client.
      actions:
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Scheda cliente
          en: Client file
        text:
          it: Anagrafica, regime fiscale, immobili con rendite e comune; documenti come link o testo incollato.
          en: Details, tax regime, properties; documents as links or pasted text.
      - title:
          it: Calcolo
          en: Calculation
        text:
          it: L'agente applica aliquote del comune e codici tributo, e cita circolari e risoluzioni.
          en: The agent applies municipal rates and tax codes, citing circulars.
      - title:
          it: Approvazione
          en: Approval
        text:
          it: Ogni F24 passa dal titolare prima di essere inviato al cliente.
          en: Every F24 goes through the partner before it is sent.
    - type: note
      content:
        it: Strumento di supporto al professionista, non sostituisce la sua verifica. Ogni risultato va controllato prima
          dell'invio.
        en: A support tool for the professional; results must be checked before sending.
  - key: nuovo_calcolo
