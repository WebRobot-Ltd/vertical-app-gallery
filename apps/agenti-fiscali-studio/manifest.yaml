apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: calcolostudio
  displayName: CalcoloStudio
  tagline:
    it: Gli adempimenti ripetitivi dello studio, calcolati passo per passo e approvati dal professionista.
  description:
    it: 'App interna per studi di commercialisti: IMU, acconti e saldi, F24 con codici tributo e ravvedimento operoso, con
      calcoli deterministici, motivazioni dalle circolari dell''Agenzia delle Entrate e approvazione del professionista prima
      dell''invio al cliente.'
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f3a5f'
      accent: '#2a7f62'
      background: '#f6f7f9'
      foreground: '#182230'
    fonts:
      body: Inter
      display: Source Serif 4
    wordmark:
    - text: Calcolo
      color: primary
    - text: Studio
      color: accent
    width: wide
  header:
    links:
    - label:
        it: Come funziona
      href: '#come-funziona'
    cta:
      label:
        it: Accedi
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label:
        it: Titolare
      assignedBy: admin_emails
    - key: professionista
      label:
        it: Professionista
      assignedBy: invite
    - key: collaboratore
      label:
        it: Collaboratore
      assignedBy: derived
      from: collection:clients.consultant_email
  limits:
  - action: create:clients
    per: app
    max: 30
    window: total
    plans:
      studio_m: 100
      studio_l: -1
  - action: run
    per: user
    max: 40
    window: day
  agents:
  - key: calcolatore
    role: main
    description: Esegue i calcoli con lo strumento deterministico, motiva le scelte con circolari e risoluzioni, produce l'F24
      e chiede l'approvazione.
    awaits:
    - f24_approval
    profile:
      inline:
        display_name: CalcoloStudio calcolatore
        crews:
        - id: calcolatore
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'Sei un assistente fiscale di uno studio di commercialisti italiano. Prepari adempimenti (IMU, acconto
            e saldo, modello F24, ravvedimento operoso) per un cliente dello studio; il professionista li controlla e approva.


            METODO

            1. Leggi la scheda del cliente (read_client) e i suoi immobili (read_properties): non inventare mai dati mancanti,
            elencali come ''da verificare''.

            2. Se ci sono documenti caricati (visure, dichiarazioni, cartelle), usa il testo fornito; per scansioni e foto
            chiama read_upload con l''id del file.

            3. Aliquote e detrazioni IMU del comune: cercale con gli strumenti web (portale del Federalismo fiscale del MEF,
            delibere comunali) per l''anno richiesto e cita la fonte e la data. Se non le trovi, fermati e chiedi il dato,
            senza stimare.

            4. TUTTI i numeri si calcolano con lo strumento calcola (op ''imu'' con categoria, rendita, aliquota_permille,
            quota_pct, mesi, detrazione; op ''ravv'' con importo, giorni, tasso_annuo_pct). Non fare calcoli a mente. Mostra
            ogni passaggio: rendita, rivalutazione 5%, moltiplicatore, base imponibile, aliquota, quota e mesi, detrazione,
            imposta annua, acconto (16/6), saldo (16/12).

            5. Per motivare scelte interpretative (pertinenze, abitazione principale, comodato, ravvedimento, sanzioni) consulta
            circolari, risoluzioni e provvedimenti dell''Agenzia delle Entrate sul sito ufficiale, e cita numero, data e passaggio.
            Se non trovi una fonte, dillo. Verifica la tabella delle sanzioni e il tasso di interesse legale vigente prima
            di usarli.

            6. Codici tributo F24 corretti per ogni rigo (es. 3912 abitazione principale di lusso, 3918 altri fabbricati,
            3925 fabbricati D allo Stato, 3930 fabbricati D al comune; codice catastale del comune; anno di riferimento; per
            il ravvedimento i codici di sanzione e interessi pertinenti), verificandoli nelle risoluzioni.

            7. Se l''utente chiede un F24: salva il documento con save_f24 (status ''da_approvare'', righe come JSON, totale,
            client_email, consultant_email, anno, tipo, calcolo in testo) e poi chiama request_f24_approval. Non dire mai
            che l''F24 è inviato: lo invia la piattaforma solo dopo l''approvazione.


            FORMATO DEL REPORT: inizia con un titolo ''# <Adempimento> <anno> — <cliente>''. Sezioni ##: Sintesi, Dati utilizzati,
            Calcolo passo per passo (tabella), Aliquote e fonti, Motivazioni (circolari/risoluzioni), Prospetto F24 (tabella:
            codice tributo, comune, anno, importo), Punti da verificare. Se utile aggiungi un grafico ```chart``` con importi
            reali. Linguaggio professionale, italiano, niente consulenza come fatto certo: il professionista decide.'
    goalTemplate: 'Cliente (id scheda): {client}

      Adempimento richiesto: {tipo_label}

      Anno d''imposta: {anno}

      {?data_pagamento}Data di versamento prevista o effettiva: {data_pagamento}{/data_pagamento}

      {?importo_originario}Importo versato in ritardo / omesso: {importo_originario}{/importo_originario}

      {?note}Note del collaboratore: {note}{/note}

      {?documenti}Documenti caricati: {documenti}

      Testo dei documenti: {documenti_text}{/documenti}

      Collaboratore: {user}. Oggi è {date}. Scrivi in italiano.'
    appTools:
    - name: read_client
      description: Legge la scheda del cliente (anagrafica, regime fiscale, collaboratore assegnato)
      action: read
      collection: clients
      scope: all
    - name: read_properties
      description: Legge gli immobili del cliente con rendite catastali e comune
      action: read
      collection: properties
      scope: all
    - name: calcola
      description: 'Calcolo deterministico: op ''imu'' o op ''ravv'''
      action: call
      slot: calc_fiscale
    - name: save_f24
      description: Salva l'F24 prodotto, in attesa di approvazione
      action: write
      collection: f24
      scope: all
    - name: read_upload
      description: Legge un file caricato dall'utente (anche scansioni, con OCR)
      action: read_file
    output: markdown
    limits:
      maxTurns: 30
      maxBudgetUsd: 1.5
      timeoutSeconds: 900
  - key: dispatcher
    role: helper
    description: Dopo l'approvazione segna l'F24 come approvato, così parte l'email al cliente.
    profile:
      inline:
        display_name: CalcoloStudio dispatcher
        crews:
        - id: dispatcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: Ricevi l'evento di approvazione di un F24. Individua il record F24 con read_f24 e imposta il campo
            status a 'approvato' con update_f24, senza cambiare altro. Rispondi con un titolo '# F24 approvato' e una riga
            di conferma.
    appTools:
    - name: read_f24
      description: Legge gli F24
      action: read
      collection: f24
      scope: all
    - name: update_f24
      description: Aggiorna lo stato di un F24
      action: write
      collection: f24
      scope: all
    output: markdown
    limits:
      maxTurns: 6
      maxBudgetUsd: 0.2
  approvals:
  - key: f24_approval
    title:
      it: Approvazione F24
    description: Il professionista controlla l'F24 prima dell'invio al cliente
    role: professionista
    decidedBy: role
    fields:
    - client
    - anno
    - tipo
    - totale
    timeoutMinutes: 10080
    onTimeout: reject
  triggers:
  - key: f24_approvato
    'on':
      approval: f24_approval
      decision: approved
    start:
      agent: dispatcher
    goal: 'L''F24 è stato approvato. Evento: {event}. Imposta lo status del record F24 corrispondente a ''approvato''.'
    asUser: false
  - key: f24_invio_cliente
    'on':
      collection: f24
      op: update
      where:
        status: approvato
    notify:
      to:
      - record.client_email
      subject:
        it: Il tuo modello F24 {record.tipo} {record.anno}
      body:
        it: 'Gentile cliente,

          lo studio ha preparato il modello F24 ({record.tipo}, anno {record.anno}), verificato e approvato dal professionista.


          Totale da versare: {record.totale} euro

          Righe:

          {record.righe}


          Per qualsiasi dubbio contatta lo studio.'
  inputForm:
    title:
      it: Nuovo calcolo
    fields:
    - name: client
      type: text
      required: true
      label:
        it: Cliente
      optionsFrom: collection:clients
      help:
        it: Scegli dalla tua lista di clienti assegnati
    - name: tipo
      type: select
      required: true
      label:
        it: Adempimento
      options:
      - value: imu_acconto
        label:
          it: IMU — acconto (16 giugno)
      - value: imu_saldo
        label:
          it: IMU — saldo (16 dicembre)
      - value: imu_annuale
        label:
          it: IMU — calcolo annuale completo
      - value: f24
        label:
          it: Compilazione F24
      - value: ravvedimento
        label:
          it: Ravvedimento operoso
    - name: anno
      type: number
      required: true
      label:
        it: Anno d'imposta
      default: 2026
    - name: data_pagamento
      type: date
      label:
        it: Data di versamento
      visibleWhen: tipo == 'ravvedimento'
    - name: importo_originario
      type: number
      label:
        it: Importo omesso o tardivo (€)
      visibleWhen: tipo == 'ravvedimento'
    - name: documenti
      type: file
      accept:
      - pdf
      - docx
      - xlsx
      - jpg
      - png
      maxMb: 15
      multiple: true
      label:
        it: Documenti del cliente (visure, dichiarazioni, cartelle)
    - name: note
      type: textarea
      maxLength: 600
      label:
        it: Note
  data:
    collections:
    - name: clients
      description: Schede clienti dello studio
      ownedBy: org
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome / ragione sociale
      - name: codice_fiscale
        type: text
        required: true
        label:
          it: Codice fiscale / P.IVA
      - name: email
        type: email
        required: true
        label:
          it: Email del cliente
      - name: regime
        type: select
        label:
          it: Regime fiscale
        options:
        - value: ordinario
          label:
            it: Ordinario
        - value: semplificato
          label:
            it: Semplificato
        - value: forfettario
          label:
            it: Forfettario
        - value: persona_fisica
          label:
            it: Persona fisica
        - value: societa
          label:
            it: Società
      - name: consultant_email
        type: email
        required: true
        label:
          it: Collaboratore assegnato (email)
      - name: note
        type: textarea
        label:
          it: Note
      access:
      - role: collaboratore
        where:
          consultant_email: '{user.email}'
        can:
        - read
      - role: professionista
        can:
        - read
        - write
    - name: properties
      description: Immobili dei clienti con rendita catastale e comune
      ownedBy: org
      fields:
      - name: client
        type: text
        required: true
        label:
          it: Cliente (id scheda)
      - name: consultant_email
        type: email
        required: true
        label:
          it: Collaboratore assegnato (email)
      - name: descrizione
        type: text
        label:
          it: Descrizione
      - name: comune
        type: text
        required: true
        label:
          it: Comune
      - name: codice_catastale
        type: text
        label:
          it: Codice catastale del comune
      - name: categoria
        type: text
        required: true
        label:
          it: Categoria catastale
      - name: rendita
        type: number
        required: true
        label:
          it: Rendita catastale (€)
      - name: quota_pct
        type: number
        default: 100
        label:
          it: Quota di possesso %
      - name: mesi_possesso
        type: number
        default: 12
        label:
          it: Mesi di possesso
      - name: abitazione_principale
        type: boolean
        label:
          it: Abitazione principale
      - name: utilizzo
        type: select
        label:
          it: Utilizzo
        options:
        - value: sfitto
          label:
            it: A disposizione
        - value: locato
          label:
            it: Locato
        - value: comodato
          label:
            it: Comodato
        - value: strumentale
          label:
            it: Strumentale
      access:
      - role: collaboratore
        where:
          consultant_email: '{user.email}'
        can:
        - read
        - write
      - role: professionista
        can:
        - read
        - write
    - name: f24
      description: Modelli F24 prodotti dagli agenti
      ownedBy: org
      fields:
      - name: client
        type: text
        label:
          it: Cliente
      - name: client_email
        type: email
        label:
          it: Email cliente
      - name: consultant_email
        type: email
        label:
          it: Collaboratore
      - name: anno
        type: number
        label:
          it: Anno
      - name: tipo
        type: text
        label:
          it: Tipo
      - name: righe
        type: json
        label:
          it: Righe F24 (codice tributo, comune, anno, importo)
      - name: totale
        type: number
        label:
          it: Totale (€)
      - name: calcolo
        type: textarea
        label:
          it: Dettaglio del calcolo
      - name: status
        type: select
        label:
          it: Stato
        options:
        - value: da_approvare
          label:
            it: Da approvare
        - value: approvato
          label:
            it: Approvato e inviato
        - value: respinto
          label:
            it: Respinto
      access:
      - role: collaboratore
        where:
          consultant_email: '{user.email}'
        can:
        - read
        - write
      - role: professionista
        can:
        - read
        - write
  views:
  - key: home
    type: page
    nav: false
    title: CalcoloStudio
    sections:
    - type: hero
      title:
        it: Gli adempimenti **ripetitivi** dello studio, pronti da controllare.
      text:
        it: 'IMU, acconti e saldi, F24 con i codici tributo corretti e ravvedimento operoso: calcoli deterministici, motivazioni
          dalle circolari e dai documenti dell''Agenzia delle Entrate, dettaglio passo per passo. Nessun F24 parte senza l''approvazione
          del professionista.'
      actions:
      - label:
          it: Accedi allo studio
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
      items:
      - title:
          it: 1 · Scheda cliente
        text:
          it: Anagrafica, regime fiscale, immobili con rendite e comune. Ogni collaboratore vede i clienti assegnati, il titolare
            tutti.
      - title:
          it: 2 · Calcolo
        text:
          it: L'agente carica i documenti, cerca aliquote e fonti, calcola con regole fisse e mostra ogni passaggio.
      - title:
          it: 3 · Approvazione e invio
        text:
          it: Il professionista approva l'F24; solo allora il cliente lo riceve via email.
    - type: note
      content:
        it: Strumento di supporto al professionista, che resta responsabile di controlli e adempimenti. Aliquote, codici tributo
          e sanzioni vanno verificati sulle fonti citate.
  - key: new_calc
    type: new_run
    title:
      it: Nuovo calcolo
    roles:
    - admin
    - professionista
    - collaboratore
  - key: calcs
    type: history
    title:
      it: Calcoli svolti
    source: run
    roles:
    - admin
    - professionista
    - collaboratore
  - key: calc
    type: report
    source: run
    printable: true
    nav: false
  - key: clients
    type: table
    title:
      it: Clienti
    source: collection:clients
    columns:
    - name
    - codice_fiscale
    - regime
    - email
    - consultant_email
    export: true
    roles:
    - admin
    - professionista
    - collaboratore
  - key: client_new
    type: form
    title:
      it: Nuovo cliente
    collection: clients
    submit:
      label:
        it: Salva cliente
      message:
        it: Cliente salvato.
      redirect: clients
    edit: true
    roles:
    - admin
    - professionista
  - key: properties
    type: table
    title:
      it: Immobili
    source: collection:properties
    columns:
    - client
    - descrizione
    - comune
    - categoria
    - rendita
    - quota_pct
    - mesi_possesso
    - abitazione_principale
    roles:
    - admin
    - professionista
    - collaboratore
  - key: property_new
    type: form
    title:
      it: Nuovo immobile
    collection: properties
    submit:
      label:
        it: Salva immobile
      message:
        it: Immobile salvato.
      redirect: properties
    edit: true
    roles:
    - admin
    - professionista
    - collaboratore
  - key: f24s
    type: table
    title:
      it: F24
    source: collection:f24
    columns:
    - client
    - anno
    - tipo
    - totale
    - status
    export: true
    roles:
    - admin
    - professionista
    - collaboratore
  - key: approvals_view
    type: approvals
    title:
      it: F24 da approvare
    approvals:
    - f24_approval
    roles:
    - admin
    - professionista
  - key: account
    type: account
    title:
      it: Abbonamento dello studio
    roles:
    - admin
  slots:
  - key: calc_fiscale
    description: Calcolo deterministico IMU (op imu) e ravvedimento operoso (op ravv)
    timeoutMs: 3000
    example:
      args:
        op: imu
        categoria: A2
        rendita: 850
        aliquota_permille: 10.6
        quota_pct: 100
        mesi: 12
        detrazione: 0
    code: "import math\nMOLT = {'A': 160, 'A10': 80, 'B': 140, 'C1': 55, 'C2': 160, 'C3': 140, 'C4': 140, 'C5': 140, 'C6':\
      \ 160, 'C7': 160, 'D': 65, 'D5': 80}\n\ndef r2(x):\n    return math.floor(x * 100 + 0.5) / 100\n\ndef main(input):\n\
      \    a = input.get('args') or {}\n    op = a.get('op')\n    if op == 'imu':\n        cat = str(a.get('categoria', '')).upper().replace('/',\
      \ '')\n        key = cat if cat in MOLT else (cat[:1] if cat[:1] in MOLT else None)\n        if key is None:\n     \
      \       return {'error': 'categoria catastale non gestita: ' + cat}\n        rendita = float(a['rendita'])\n       \
      \ rivalutata = rendita * 1.05\n        base = rivalutata * MOLT[key]\n        aliq = float(a['aliquota_permille'])\n\
      \        quota = float(a.get('quota_pct', 100)) / 100\n        mesi = float(a.get('mesi', 12)) / 12\n        lorda =\
      \ base * aliq / 1000 * quota * mesi\n        detr = float(a.get('detrazione', 0))\n        annua = max(0.0, lorda -\
      \ detr)\n        annua_r = math.floor(annua + 0.5)\n        acconto = math.floor(annua_r / 2 + 0.5)\n        return\
      \ {'moltiplicatore': MOLT[key], 'rendita_rivalutata': r2(rivalutata), 'base_imponibile': r2(base), 'imposta_lorda':\
      \ r2(lorda), 'detrazione': detr, 'imposta_annua': annua_r, 'acconto': acconto, 'saldo': annua_r - acconto, 'nota': 'Importi\
      \ arrotondati all euro per rigo F24. Acconto = 50% dell annua calcolata con le aliquote indicate: se l acconto va calcolato\
      \ con le aliquote dell anno precedente, richiamare il calcolo con quelle.'}\n    if op == 'ravv':\n        imp = float(a['importo'])\n\
      \        g = int(a['giorni'])\n        tasso = float(a.get('tasso_annuo_pct', 0))\n        if g <= 14:\n           \
      \ pct = 0.1 * g\n        elif g <= 30:\n            pct = 1.5\n        elif g <= 90:\n            pct = 1.67\n     \
      \   elif g <= 365:\n            pct = 3.75\n        elif g <= 730:\n            pct = 4.29\n        else:\n        \
      \    pct = 5.0\n        sanz = imp * pct / 100\n        inter = imp * tasso / 100 * g / 365\n        return {'percentuale_sanzione':\
      \ pct, 'sanzione': r2(sanz), 'interessi': r2(inter), 'totale': r2(imp + sanz + inter), 'nota': 'Percentuali da verificare\
      \ con la normativa e le circolari vigenti alla data del versamento.'}\n    return {'error': 'op non valida: usare imu\
      \ o ravv'}\n"
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: studio_s
      price: 49
      interval: month
      label:
        it: Studio S — fino a 30 clienti
      includes:
      - fino a 30 clienti
      - agenti di calcolo illimitati nei limiti d'uso equo
      roles:
      - admin
    - key: studio_m
      price: 99
      interval: month
      label:
        it: Studio M — fino a 100 clienti
      includes:
      - fino a 100 clienti
      roles:
      - admin
    - key: studio_l
      price: 199
      interval: month
      label:
        it: Studio L — clienti illimitati
      includes:
      - clienti illimitati
      roles:
      - admin
  notifications:
    emailOnRunDone: true
  extensions:
  - key: cassetto_fiscale
    description: 'Il download automatico dal cassetto fiscale con delega richiede accesso con SPID/CIE/Entratel e i servizi
      dell''Agenzia delle Entrate, non una chiave API: non disponibile. Per ora i documenti si caricano in PDF nel modulo
      di calcolo.'
  - key: circolari_indicizzate
    description: 'Un archivio indicizzato e ricercabile di circolari e risoluzioni non è ancora disponibile: l''agente le
      consulta sul sito ufficiale tramite il MCP WebRobot e cita la fonte. Un archivio proprio potrà essere aggiunto come
      job di indicizzazione.'
  - key: abbonamento_per_studio
    description: L'abbonamento è unico per lo studio (il titolare lo gestisce) e la soglia di clienti è applicata a livello
      di app; le fasce S/M/L sono configurabili.
