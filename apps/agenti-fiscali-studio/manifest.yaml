      price: 49
      interval: month
      label:
        it: Studio S — fino a 30 clienti
        en: Studio S — up to 30 clients
      includes:
      - fino a 30 clienti
      - collaboratori illimitati
      roles:
      - admin
    - key: studio_m
      price: 99
      interval: month
      label:
        it: Studio M — fino a 100 clienti
        en: Studio M — up to 100 clients
      includes:
      - fino a 100 clienti
      - collaboratori illimitati
      roles:
      - admin
    - key: studio_l
      price: 199
      interval: month
      label:
        it: Studio L — fino a 300 clienti
        en: Studio L — up to 300 clients
