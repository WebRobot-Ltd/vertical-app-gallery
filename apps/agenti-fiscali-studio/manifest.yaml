      roles:
      - admin
  extensions:
  - key: upload_pdf
    description: 'Il caricamento di PDF (visure, dichiarazioni, cartelle) non è ancora disponibile: per ora si inserisce un
      link o si incolla il testo nella scheda Documenti.'
  - key: cassetto_fiscale
    description: 'Il download dal cassetto fiscale con delega richiede credenziali del cliente/studio (connettore non disponibile
      ancora): per ora i dati si inseriscono a mano o dai documenti.'
  - key: invio_email_f24
    description: 'L''invio via email dell''F24 approvato al cliente non è ancora disponibile: dopo l''approvazione il collaboratore
      scarica/stampa l''F24 e lo invia.'
  - key: visibilita_clienti
    description: 'Il collaboratore vede i clienti assegnati e il titolare tutti: oggi i clienti sono dati per utente; serve
