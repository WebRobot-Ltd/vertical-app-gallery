apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: settimanaintavola
  displayName: SettimanaInTavola
  tagline:
    it: Il menu della settimana che non spreca nulla, con la spesa già calcolata.
    en: A weekly menu that wastes nothing, with the shopping list already worked out.
  description:
    it: Ogni giovedì un agente AI propone il menu della settimana successiva, con ricette che riusano gli stessi ingredienti,
      e la lista della spesa con quantità esatte. Puoi sostituire una ricetta, confermare l'ordine e ricevere a casa la box
      con gli ingredienti porzionati.
    en: Every Thursday an AI agent proposes next week's menu, with recipes that reuse the same ingredients, and a shopping
      list with exact quantities. Swap a recipe, confirm the order and get a box of portioned ingredients delivered.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: dashboard
  branding:
    theme: light
    palette:
      primary: '#2f5d3a'
      accent: '#e07a2f'
      background: '#fbf8f1'
      foreground: '#1f2a22'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Settimana
      color: primary
    - text: InTavola
      color: accent
    button: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    cta:
      label:
        it: Inizia
        en: Start
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: supplier
      label:
        it: Fornitore partner
        en: Partner supplier
      assignedBy: invite
    - key: user
      assignedBy: signup
  limits:
  - action: agent:swapper
    per: user
    max: 20
    window: day
    roles:
    - user
  agents:
  - key: planner
    role: scheduled
    description: Every Thursday writes the next week's menu and shopping list for one household.
    memory: instance
    awaits:
    - confirm_order
    writesTo:
      collection: weekly_menus
      parse: whole
    profile:
      inline:
        display_name: SettimanaInTavola planner
        crews:
        - id: planner
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are a meal planner focused on zero food waste. You plan the dinners/lunches of next week for
            one household, given people, preferences, allergies, budget and meals per week. Start with a level-1 title "#
            Menu settimana del <date>" (in the user''s language). Sections with ## headings: Menu (one line per meal: day,
            recipe, 1-line description), Ingredienti riusati (which ingredients are shared across recipes and how, to avoid
            leftovers), Lista della spesa (a table: ingredient, exact quantity in g/ml/pcs for the number of people, used
            in which recipes; grouped by aisle), Costo stimato (compare with the budget; say it is an estimate), Note (allergens).
            HARD RULES: never include an ingredient that conflicts with the declared allergies or preferences; compute quantities
            for the exact number of people; total quantities must be the sum over recipes; never invent prices as certain
            facts. Your memory holds the recipes of recent weeks: avoid repeating them. At the end call remember once with
            the recipes chosen. Then call request_confirm_order once, with a short summary of the menu, so the user can confirm
            the order of the box.'
    goalTemplate: Plan the menu for next week. Today is {date}. Write in the language with ISO code {lang}.
  - key: swapper
    role: main
    description: Replaces one recipe in a menu and recalculates the shopping list.
    appTools:
    - name: read_menus
      description: Read the user's weekly menus
      action: read
      collection: weekly_menus
      scope: user
    - name: save_menu
      description: Save the updated menu of the user
      action: write
      collection: weekly_menus
      scope: user
    profile:
      inline:
        display_name: SettimanaInTavola swapper
        crews:
        - id: swapper
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You update a weekly menu. Read the user's latest menu with read_menus. Replace the recipe the user
            names with another one that fits their preferences and allergies and, as far as possible, reuses ingredients already
            in the menu. Then recompute the whole shopping list with exact quantities for the same number of people, and show
            what changed. Output the full updated menu in the same structure as the original (level-1 title "# Menu aggiornato
            — <date>" first, then Menu, Ingredienti riusati, Lista della spesa as a table, Costo stimato, Cosa è cambiato).
            Save it with save_menu. Never include allergens declared by the user; never invent prices as certain.
    goalTemplate: 'Replace this recipe: {recipe}.

      {?wish}Wish for the replacement: {wish}{/wish}

      Today is {date}. Write in the language with ISO code {lang}.'
    output: markdown
  - key: dispatcher
    role: helper
    description: After the user confirms, creates the user's order and puts the box in the supplier queue.
    appTools:
    - name: read_menus
      description: Read the user's weekly menus
      action: read
      collection: weekly_menus
      scope: user
    - name: save_order
      description: Record the user's order
      action: write
      collection: orders
      scope: user
    - name: queue_box
      description: Put the box to prepare in the supplier queue
      action: write
      collection: supplier_queue
      scope: all
    profile:
      inline:
        display_name: SettimanaInTavola dispatcher
        crews:
        - id: dispatcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 5
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You turn a confirmed menu into an order. Read the latest menu with read_menus. Write one record
            with save_order (week, meals, persons, shopping list, status "confirmed"). Then write one record with queue_box
            for the supplier: week, delivery_address, persons, allergies, and the ingredient lines with exact quantities to
            portion. Include only what the supplier needs to prepare and deliver the box: no email, no budget. Reply with
            one line confirming the order. Start the reply with "# Ordine confermato".'
    goalTemplate: The user confirmed the menu. Today is {date}. Create the order from the latest menu and queue the box.
  templates:
  - key: weekly_plan
    title:
      it: Il mio piano settimanale
      en: My weekly plan
    description:
      it: 'Indica persone, preferenze, allergie e budget: ogni giovedì ricevi il menu della settimana dopo.'
      en: 'Tell us people, preferences, allergies and budget: every Thursday you get next week''s menu.'
    agent: planner
    params:
    - name: persons
      type: number
      required: true
      label:
        it: Numero di persone
        en: Number of people
    - name: meals
      type: select
      required: true
      label:
        it: Pasti a settimana
        en: Meals per week
      options:
      - value: '5'
        label: '5'
      - value: '7'
        label: '7'
      - value: '10'
        label: '10'
      - value: '14'
        label: '14'
    - name: preferences
      type: textarea
      maxLength: 400
      label:
        it: Preferenze (es. vegetariano, cucina veloce)
        en: Preferences (e.g. vegetarian, quick)
    - name: allergies
      type: textarea
      maxLength: 300
      label:
        it: Allergie e intolleranze
        en: Allergies and intolerances
    - name: budget
      type: number
      required: true
      label:
        it: Budget settimanale (EUR)
        en: Weekly budget (EUR)
    - name: address
      type: textarea
      maxLength: 300
      label:
        it: Indirizzo di consegna
        en: Delivery address
    goal: 'Household "{instance}": {persons} people, {meals} meals per week, weekly budget {budget} EUR.

      Preferences: {preferences}

      Allergies (strictly excluded): {allergies}

      Delivery address: {address}

      Today is {date}. Plan next week''s menu and shopping list. Write in the language with ISO code {lang}.'
    schedule:
      cron: 0 6 * * 4
      userCanChange: false
    maxPerUser: 2
    cost:
      perRun: 10
  approvals:
  - key: confirm_order
    title:
      it: Conferma l'ordine della box
      en: Confirm the box order
    description: The user confirms the menu and the delivery of the box.
    decidedBy: requester
    timeoutMinutes: 4320
    onTimeout: reject
  triggers:
  - key: on_order_confirmed
    'on':
      approval: confirm_order
      decision: approved
    start:
      agent: dispatcher
    goal: 'Confirmed order: {event}'
    asUser: true
  inputForm:
    title:
      it: Sostituisci una ricetta
      en: Swap a recipe
    fields:
    - name: recipe
      type: text
      required: true
      label:
        it: Ricetta da sostituire
        en: Recipe to replace
    - name: wish
      type: text
      maxLength: 200
      label:
        it: Cosa preferiresti (facoltativo)
        en: What you'd prefer (optional)
  data:
    collections:
    - name: weekly_menus
      ownedBy: instance
      description: Weekly menus and shopping lists of each plan
      fields:
      - name: title
        type: text
      - name: content
        type: textarea
    - name: orders
      ownedBy: user
      description: The user's own confirmed orders
      fields:
      - name: week
        type: text
      - name: meals
        type: number
      - name: persons
        type: number
      - name: shopping_list
        type: textarea
      - name: status
        type: text
    - name: supplier_queue
      ownedBy: org
      description: Boxes to prepare for the partner supplier (back office)
      fields:
      - name: week
        type: text
      - name: persons
        type: number
      - name: delivery_address
        type: textarea
      - name: allergies
        type: text
      - name: ingredients
        type: textarea
      - name: status
        type: text
  views:
  - key: home
    type: page
    nav: false
    sections:
    - type: hero
      eyebrow:
        it: Contro lo spreco
        en: Against food waste
      title:
        it: Il menu della settimana che **non spreca nulla**.
        en: A weekly menu that **wastes nothing**.
      text:
        it: Ogni giovedì un agente AI propone le ricette della settimana dopo, riusando gli stessi ingredienti, con la lista
          della spesa in quantità esatte.
        en: Every Thursday an AI agent proposes next week's recipes, reusing the same ingredients, with a shopping list in
          exact quantities.
      actions:
      - label:
          it: Crea il tuo piano
          en: Create your plan
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Dicci di te
          en: Tell us about you
        text:
          it: Persone, preferenze, allergie, budget.
          en: People, preferences, allergies, budget.
        badge: 👨‍👩‍👧
      - title:
          it: Menu ogni giovedì
          en: Menu every Thursday
        text:
          it: Ricette che condividono gli ingredienti e spesa con quantità esatte. Sostituisci una ricetta e la lista si aggiorna.
          en: Recipes sharing ingredients and exact quantities. Swap a recipe and the list updates.
        badge: 🥕
      - title:
          it: Ricevi la box
          en: Get the box
        text:
          it: Confermi e il fornitore partner prepara gli ingredienti porzionati e li consegna.
          en: You confirm and our partner supplier prepares and delivers the portioned ingredients.
        badge: 📦
    - type: note
      content:
        it: 'I menu sono suggerimenti: verifica sempre gli allergeni sulle etichette dei prodotti.'
        en: 'Menus are suggestions: always check allergens on product labels.'
  - key: plans
    type: instances
    template: weekly_plan
    title:
      it: Il mio piano
      en: My plan
    roles:
    - user
    - admin
  - key: menus
    type: table
    title:
      it: I miei menu
      en: My menus
    source: collection:weekly_menus
    roles:
    - user
    - admin
    data:
      display: cards
      fields:
      - key: title
        label:
          it: Menu
          en: Menu
      - key: content
        label:
          it: Menu e spesa
          en: Menu and list
      sort:
        field: createdAt
        dir: desc
      limit: 20
  - key: swap
    type: new_run
    title:
      it: Sostituisci ricetta
      en: Swap a recipe
    roles:
    - user
    - admin
  - key: swaps
    type: history
    title:
      it: Sostituzioni
      en: Swaps
    source: run
    roles:
    - user
    - admin
  - key: run_report
    type: report
    source: run
    printable: true
    nav: false
  - key: approve
    type: approvals
    title:
      it: Conferme
      en: Confirmations
    roles:
    - user
  - key: my_orders
    type: table
    title:
      it: I miei ordini
      en: My orders
    source: collection:orders
    roles:
    - user
    data:
      display: table
      fields:
      - key: week
        label:
          it: Settimana
          en: Week
      - key: meals
        label:
          it: Pasti
          en: Meals
        format: number
      - key: persons
        label:
          it: Persone
          en: People
        format: number
      - key: status
        label:
          it: Stato
          en: Status
        format: badge
      limit: 50
  - key: queue
    type: table
    title:
      it: Coda ordini fornitore
      en: Supplier queue
    source: collection:supplier_queue
    roles:
    - supplier
    - admin
    data:
      display: table
      fields:
      - key: week
        label:
          it: Settimana
          en: Week
      - key: persons
        label:
          it: Persone
          en: People
        format: number
      - key: allergies
        label:
          it: Allergie
          en: Allergies
      - key: ingredients
        label:
          it: Ingredienti da porzionare
          en: Ingredients to portion
      - key: delivery_address
        label:
          it: Consegna
          en: Delivery
      - key: status
        label:
          it: Stato
          en: Status
        format: badge
      limit: 100
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - user
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 30
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:swapper:
        estimate: 10
        metered: true
    packs:
    - key: small
      credits: 300
      price: 5
      label: Extra
    plans:
    - key: meals_5
      price: 39
      interval: month
      label:
        it: 5 pasti a settimana
        en: 5 meals a week
      includes:
      - 5 meals per week
      - weekly menu and shopping list
      - box delivery
      credits: 200
      creditsReset: monthly
      roles:
      - user
    - key: meals_10
      price: 69
      interval: month
      label:
        it: 10 pasti a settimana
        en: 10 meals a week
      includes:
      - 10 meals per week
      - weekly menu and shopping list
      - box delivery
      credits: 300
      creditsReset: monthly
      roles:
      - user
    - key: meals_14
      price: 95
      interval: month
      label:
        it: 14 pasti a settimana
        en: 14 meals a week
      includes:
      - 14 meals per week
      - weekly menu and shopping list
      - box delivery
      credits: 400
      creditsReset: monthly
      roles:
      - user
  extensions:
  - key: weekly_billing
    description: 'Billing intervals are only month or year: plans are monthly prices for a weekly number of meals (billed
      per month), not charged each week.'
  - key: thursday_email
    description: 'No notifications yet: the user sees the new menu in the app, no email on Thursday.'
  - key: supplier_status
    description: The supplier sees the queue but cannot yet mark a box as prepared or delivered from the app; a status update
      action is missing.
