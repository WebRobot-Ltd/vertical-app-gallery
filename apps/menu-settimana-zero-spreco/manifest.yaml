apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: settimanaintavola
  displayName: SettimanaInTavola
  tagline:
    it: Il menu della settimana che non spreca nulla, con la spesa già pronta.
    en: A weekly menu that wastes nothing, with the shopping list ready.
  description:
    it: 'Indica persone, preferenze, allergie e budget: ogni giovedì un agente propone il menu della settimana dopo, con ricette
      che riusano gli stessi ingredienti, e la lista della spesa con quantità esatte. Sostituisci una ricetta e la lista si
      aggiorna. Conferma l''ordine e il fornitore prepara la box porzionata.'
    en: 'Tell us household size, preferences, allergies and budget: every Thursday an agent proposes next week''s menu with
      recipes that reuse the same ingredients, plus an exact shopping list. Swap a recipe and the list updates. Confirm the
      order and the partner supplier prepares a portioned box.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#2f5d3a'
      accent: '#e07a1f'
      background: '#fbf8f1'
      foreground: '#1f2a22'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Settimana
      color: primary
    - text: InTavola
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    cta:
      label:
        it: Inizia
        en: Start
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
    - key: supplier
      label:
        it: Fornitore partner
        en: Partner supplier
      assignedBy: invite
  limits:
  - action: agent:swapper
    per: user
    max: 20
    window: day
    roles:
    - user
  agents:
  - key: swapper
    role: main
    description: Replaces one recipe in a user's menu and updates the shopping list and the draft order.
    profile:
      inline:
        display_name: SettimanaInTavola swapper
        crews:
        - id: swapper
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''assistente di SettimanaInTavola. L''utente vuole sostituire una ricetta del suo menu settimanale.
            Procedi così: 1) leggi il menu con read_menus (id indicato nel goal), la lista della spesa con read_lists e l''ordine
            con read_orders; 2) proponi una ricetta sostitutiva che rispetti persone, preferenze e allergie del menu e, se
            possibile, riusi ingredienti già presenti nel resto del menu per evitare avanzi; 3) aggiorna il menu con write_menus,
            ricalcola la lista della spesa con quantità esatte per le persone indicate (somma gli ingredienti uguali) con
            write_lists; 4) se l''ordine è ancora in stato draft aggiorna le righe con write_orders; se è già confirmed o
            oltre NON modificarlo e avvisa l''utente. Non inventare prezzi: stime solo se indicate come tali. Non ignorare
            mai le allergie. Rispondi con un report che inizia con un titolo di livello 1 "# Sostituzione — <giorno>", poi
            ## Cosa cambia, ## Lista della spesa aggiornata (tabella ingrediente/quantità), ## Note.'
    appTools:
    - name: read_menus
      description: Read the user's menus
      action: read
      collection: menus
      scope: user
    - name: write_menus
      description: Update a menu of the user
      action: write
      collection: menus
      scope: user
    - name: read_lists
      description: Read the user's shopping lists
      action: read
      collection: shopping_lists
      scope: user
    - name: write_lists
      description: Update a shopping list of the user
      action: write
      collection: shopping_lists
      scope: user
    - name: read_orders
      description: Read the user's orders
      action: read
      collection: orders
      scope: user
    - name: write_orders
      description: Update a draft order of the user
      action: write
      collection: orders
      scope: user
    goalTemplate: 'Menu (id): {menu}

      Giorno/ricetta da sostituire: {day}

      {?wish}Desiderio dell''utente: {wish}{/wish}

      Scrivi in lingua ISO {lang}. Oggi è {date}.'
    output: markdown
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.4
  - key: planner
    role: helper
    description: Every Thursday proposes next week's menu for one household, with the shopping list and a draft order.
    profile:
      inline:
        display_name: SettimanaInTavola planner
        crews:
        - id: planner
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 14
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei il pianificatore di pasti di SettimanaInTavola, contro lo spreco alimentare. Dati: persone,
            pasti a settimana, preferenze, allergie, budget settimanale. Crea il menu della settimana SUCCESSIVA (il lunedì
            successivo alla data di oggi) con ricette che riusano gli stessi ingredienti (es. un arrosto di lunedì diventa
            ripieno il mercoledì; verdure a foglia in più piatti) così da ridurre gli avanzi e il numero di ingredienti distinti.
            Rispetta SEMPRE le allergie e le preferenze; resta nel budget con stime esplicitamente indicate come stime. Calcola
            le quantità esatte per il numero di persone, sommando gli ingredienti uguali, in unità semplici (g, ml, pezzi).
            Poi: 1) salva il menu con write_menus (week_start, persons, recipes come elenco di {giorno, nome, ingredienti
            con quantità}, reuse_notes, status proposed); 2) salva la lista con write_lists (week_start, items come elenco
            di {ingrediente, quantita, unita, usato_in}, total_estimate); 3) crea un ordine draft con write_orders (week_start,
            items, meals, customer_email, status draft). Il report finale inizia con "# Menu settimana dal <data>", poi ##
            Menu (tabella giorno/ricetta), ## Come riusiamo gli ingredienti, ## Lista della spesa (tabella ingrediente/quantità/usato
            in), ## Budget. Termina invitando a sostituire ricette o confermare l''ordine. Non inventare dati nutrizionali
            né dare consigli medici.'
    appTools:
    - name: write_menus
      description: Save the menu of the user
      action: write
      collection: menus
      scope: user
    - name: write_lists
      description: Save the shopping list of the user
      action: write
      collection: shopping_lists
      scope: user
    - name: write_orders
      description: Create a draft order of the user
      action: write
      collection: orders
      scope: user
    memory: instance
    output: markdown
    limits:
      maxTurns: 14
      maxBudgetUsd: 0.6
  templates:
  - key: weekly_menu
    title:
      it: Il mio menu settimanale
      en: My weekly menu
    description:
      it: Ogni giovedì il menu della settimana successiva, con lista della spesa.
      en: Every Thursday, next week's menu with the shopping list.
    agent: planner
    params:
    - name: persons
      type: number
      required: true
      label:
        it: Numero di persone
        en: People
    - name: meals
      type: select
      required: true
      label:
        it: Pasti a settimana
        en: Meals per week
      options:
      - value: '7'
        label: '7'
      - value: '14'
        label: '14'
      - value: '21'
        label: '21'
    - name: preferences
      type: textarea
      maxLength: 500
      label:
        it: Preferenze
        en: Preferences
      help:
        it: es. vegetariano, poca carne rossa, cucina mediterranea
        en: e.g. vegetarian, little red meat
    - name: allergies
      type: textarea
      maxLength: 300
      label:
        it: Allergie e intolleranze
        en: Allergies
    - name: budget
      type: number
      label:
        it: Budget settimanale (€)
        en: Weekly budget (€)
    goal: 'Famiglia "{instance}": {persons} persone, {meals} pasti a settimana.

      {?preferences}Preferenze: {preferences}{/preferences}

      {?allergies}Allergie: {allergies}{/allergies}

      {?budget}Budget settimanale: {budget} EUR{/budget}

      Oggi è {date}. Proponi il menu della settimana successiva. Scrivi in lingua ISO {lang}.'
    schedule:
      cron: 0 7 * * 4
      userCanChange: false
    maxPerUser: 1
    deliver:
      to: owner
      onlyIfNew: true
      subject:
        it: Il tuo menu della prossima settimana
        en: Your menu for next week
  data:
    collections:
    - name: menus
      ownedBy: user
      description: Weekly menus of each user
      retentionDays: 365
      fields:
      - name: week_start
        type: date
        label: Week start
      - name: persons
        type: number
      - name: recipes
        type: json
        label: Recipes
      - name: reuse_notes
        type: textarea
      - name: status
        type: select
        options:
        - proposed
        - edited
    - name: shopping_lists
      ownedBy: user
      description: Shopping lists with exact quantities
      retentionDays: 365
      fields:
      - name: week_start
        type: date
      - name: items
        type: json
      - name: total_estimate
        type: number
    - name: orders
      ownedBy: user
      description: Orders; the supplier sees the confirmed ones in its queue
      retentionDays: 730
      fields:
      - name: week_start
        type: date
      - name: items
        type: json
      - name: meals
        type: number
      - name: customer_email
        type: email
      - name: delivery_address
        type: text
      - name: delivery_date
        type: date
      - name: notes
        type: textarea
        maxLength: 400
      - name: status
        type: select
        default: draft
        options:
        - draft
        - confirmed
        - preparing
        - shipped
        - delivered
      access:
      - role: supplier
        can:
        - read
        - write
  triggers:
  - key: order_confirmed
    'on':
      collection: orders
      op: update
      where:
        status: confirmed
    notify:
      to:
      - role:supplier
      - record.customer_email
      subject:
        it: Ordine confermato per la settimana del {record.week_start}
        en: Order confirmed for week of {record.week_start}
      body:
        it: 'Un ordine è stato confermato ed è in coda per la preparazione della box. Consegna: {record.delivery_date}, {record.delivery_address}.'
        en: 'An order was confirmed and is queued for box preparation. Delivery: {record.delivery_date}, {record.delivery_address}.'
      link: queue
  inputForm:
    title:
      it: Sostituisci una ricetta
      en: Swap a recipe
    fields:
    - name: menu
      type: select
      required: true
      optionsFrom: collection:menus
      label:
        it: Menu
        en: Menu
    - name: day
      type: text
      required: true
      label:
        it: Giorno o ricetta da sostituire
        en: Day or recipe to replace
    - name: wish
      type: textarea
      maxLength: 300
      label:
        it: Cosa preferiresti (facoltativo)
        en: What you'd prefer (optional)
  views:
  - key: home
    type: page
    nav: false
    sections:
    - type: hero
      title:
        it: La settimana **in tavola**, senza sprechi.
        en: Your week **on the table**, zero waste.
      text:
        it: Ogni giovedì un agente AI prepara il menu della settimana dopo con ricette che riusano gli stessi ingredienti,
          e la lista della spesa con le quantità esatte. Vuoi la box già porzionata? Confermi l'ordine e arriva a casa.
        en: Every Thursday an AI agent prepares next week's menu with recipes that reuse the same ingredients, and an exact
          shopping list. Want a portioned box? Confirm the order and it arrives at home.
      actions:
      - label:
          it: Inizia
          en: Start
        href: /login
        style: primary
      band: true
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Dici chi mangia
          en: Tell us who eats
        text:
          it: Persone, preferenze, allergie, budget.
          en: People, preferences, allergies, budget.
        badge: 👨‍👩‍👧
      - title:
          it: Ricevi il menu
          en: Get the menu
        text:
          it: Ogni giovedì il menu della settimana successiva e la spesa con quantità esatte.
          en: Every Thursday next week's menu and the exact shopping list.
        badge: 🍽️
      - title:
          it: Cambia e conferma
          en: Swap and confirm
        text:
          it: 'Sostituisci una ricetta: la lista si aggiorna. Conferma e il fornitore prepara la box.'
          en: 'Swap a recipe: the list updates. Confirm and the supplier prepares your box.'
        badge: 📦
    - type: note
      content:
        it: Le informazioni su allergie vanno sempre verificate sulle etichette dei prodotti. Non è consulenza medica o nutrizionale.
        en: Always check allergens on product labels. Not medical or nutritional advice.
  - key: setup
    type: instances
    template: weekly_menu
    title:
      it: Il mio menu settimanale
      en: My weekly menu
    roles:
    - user
    - admin
  - key: menus_view
    type: table
    title:
      it: I miei menu
      en: My menus
    source: collection:menus
    columns:
    - week_start
    - persons
    - recipes
    - reuse_notes
    - status
    roles:
    - user
    - admin
  - key: list_view
    type: table
    title:
      it: Lista della spesa
      en: Shopping list
    source: collection:shopping_lists
    columns:
    - week_start
    - items
    - total_estimate
    export: true
    roles:
    - user
    - admin
  - key: swap
    type: new_run
    title:
      it: Sostituisci una ricetta
      en: Swap a recipe
    roles:
    - user
    - admin
  - key: swaps
    type: history
    title:
      it: Sostituzioni
      en: Swaps
    source: run
    roles:
    - user
    - admin
  - key: swap_report
    type: report
    source: run
    printable: true
    nav: false
  - key: orders_view
    type: table
    title:
      it: I miei ordini
      en: My orders
    source: collection:orders
    columns:
    - week_start
    - meals
    - status
    - delivery_date
    - delivery_address
    roles:
    - user
    - admin
  - key: confirm_order
    type: form
    title:
      it: Conferma ordine
      en: Confirm order
    collection: orders
    fields:
    - delivery_address
    - delivery_date
    - notes
    - status
    edit: true
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Ordine aggiornato. Per confermarlo imposta lo stato su confirmed.
        en: Order updated. To confirm it set status to confirmed.
      redirect: orders_view
    nav: false
    roles:
    - user
    - admin
  - key: queue
    type: table
    title:
      it: Coda ordini
      en: Order queue
    source: collection:orders
    query: status = confirmed
    columns:
    - week_start
    - customer_email
    - meals
    - items
    - delivery_date
    - delivery_address
    - notes
    - status
    export: true
    roles:
    - supplier
    - admin
  - key: queue_work
    type: form
    title:
      it: Aggiorna stato box
      en: Update box status
    collection: orders
    fields:
    - status
    edit: true
    submit:
      label:
        it: Aggiorna
        en: Update
      redirect: queue
    nav: false
    roles:
    - supplier
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - user
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: meals_7
      price: 36
      interval: month
      label:
        it: 7 pasti a settimana
        en: 7 meals a week
      includes:
      - weekly menu
      - shopping list
      - swaps
    - key: meals_14
      price: 64
      interval: month
      label:
        it: 14 pasti a settimana
        en: 14 meals a week
      includes:
      - weekly menu
      - shopping list
      - swaps
    - key: meals_21
      price: 88
      interval: month
      label:
        it: 21 pasti a settimana
        en: 21 meals a week
      includes:
      - weekly menu
      - shopping list
      - swaps
  extensions:
  - key: weekly_billing
    description: 'Weekly billing interval is not available yet: plans are monthly (4 weeks) per number of meals. Box ingredient
      cost and delivery fees to the supplier are not handled by the app.'
