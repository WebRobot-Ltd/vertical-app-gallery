apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: garapronta
  displayName: GaraPronta
  tagline:
    it: Dal bando alla bozza di offerta, con ogni affermazione citata.
  description:
    it: GaraPronta segnala ogni giorno i nuovi bandi adatti al profilo della tua azienda, analizza bandi e documenti di gara
      (requisiti, punteggi, scadenze, incongruenze, quesiti) e prepara la bozza della relazione tecnica riusando le tue offerte
      passate. L'invio dell'offerta resta all'azienda.
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12355b'
      accent: '#1f7a5c'
      background: '#f6f8fa'
      foreground: '#16202b'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Gara
      color: primary
    - text: Pronta
      color: accent
  header:
    links:
    - label: Come funziona
      href: '#come-funziona'
    - label: Fonti
      href: '#fonti'
    cta:
      label: Accedi
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  limits:
  - action: run
    per: user
    max: 20
    window: day
    roles:
    - user
  agents:
  - key: watcher
    role: scheduled
    description: Ogni giorno cerca su TED i nuovi bandi italiani adatti al profilo di un'azienda e scrive l'avviso.
    memory: instance
    writesTo:
      collection: avvisi
    appTools:
    - name: ted_search
      description: Cerca avvisi di gara su TED (Publications Office of the EU)
      action: http
      http:
        method: POST
        url: https://api.ted.europa.eu/v3/notices/search
        attribution: TED, Publications Office of the EU, CC BY 4.0
    profile:
      inline:
        display_name: GaraPronta osservatorio
        crews:
        - id: watcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''osservatorio bandi di GaraPronta. Ogni giorno cerchi nuovi bandi di appalto pubblico italiani
            adatti al profilo di UNA azienda.


            USO DELLO STRUMENTO ted_search (POST, corpo JSON): {"query":"buyer-country=ITA AND classification-cpv=33* AND
            publication-date>=AAAAMMGG","fields":["publication-number","notice-title","buyer-name","classification-cpv","deadline-receipt-tender-date-lot","estimated-value-lot","links"],"limit":50,"page":1}.
            Usa sempre buyer-country=ITA; per più CPV combinali con OR tra parentesi (prefisso con * per la divisione, es.
            33*, 336*); la data è quella degli ultimi 2 giorni in formato AAAAMMGG. Se la risposta è paginata, leggi al massimo
            3 pagine. Se un campo manca, scrivi ''non indicato'': non inventare mai importi, lotti o scadenze.


            SELEZIONE: tieni i bandi coerenti con CPV, regioni (se riconoscibili da ente/luogo), fascia di importo e parole
            chiave del profilo; scarta quelli già segnalati (la tua memoria contiene i numeri di pubblicazione già inviati).
            Ordina per rilevanza (corrispondenza CPV e parole chiave, importo nella fascia, scadenza non troppo vicina) e
            spiega in una riga perché è rilevante.


            FORMATO: inizia con un titolo di livello 1 ''# Nuovi bandi — <data>''. Poi una sezione ''## Bandi adatti'' con,
            per ciascuno: numero di pubblicazione TED, titolo, ente, importo stimato, lotti, scadenza, motivo di rilevanza,
            link. Se non ci sono bandi nuovi scrivi ''Nessun nuovo bando adatto oggi''. Chiudi con ''## Nota'' ricordando
            che la fonte è TED (CC BY 4.0) e che i bandi sotto soglia europea possono non essere presenti. Alla fine chiama
            una volta il tool remember con i numeri di pubblicazione già segnalati (ultimi 200). Non dare consulenza legale.'
  - key: analyst
    role: main
    when: azione == 'analisi'
    description: Analizza un bando e i documenti di gara rispetto al profilo dell'azienda.
    context:
    - key: profilo
      from: collection:company_profile
    appTools:
    - name: ted_lookup
      description: Recupera i dati di un avviso TED dal numero di pubblicazione
      action: http
      http:
        method: POST
        url: https://api.ted.europa.eu/v3/notices/search
        attribution: TED, Publications Office of the EU, CC BY 4.0
    - name: read_upload
      description: Legge un file caricato dall'utente (anche scansioni, con OCR)
      action: read_file
    - name: leggi_offerte
      description: Offerte passate dell'azienda nell'archivio
      action: read
      collection: offerte_passate
      scope: user
    goalTemplate: 'Azione: analisi del bando.

      Bando (numero TED o riferimento): {bando}

      {?note}Note dell''utente: {note}{/note}

      Profilo dell''azienda (una riga JSON per profilo): {profilo}

      {?docs}File caricati (nomi e id): {docs}{/docs}

      {?docs_text}Testo dei documenti di gara:

      {docs_text}{/docs_text}

      {!docs}Nessun documento caricato: lavora solo sull''avviso TED e dillo nel report.{/docs}

      Oggi è {date}. Scrivi il report in italiano.'
    output: markdown
    profile:
      inline:
        display_name: GaraPronta analista
        crews:
        - id: analyst
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un analista di gare d''appalto pubbliche italiane (dispositivi medici e farmaci per ospedali
            e ASL). Leggi l''avviso (ted_lookup con query ''publication-number=<numero>'' e i campi publication-number, notice-title,
            buyer-name, classification-cpv, deadline-receipt-tender-date-lot, estimated-value-lot, links) e i documenti di
            gara forniti (disciplinare, capitolato; per scansioni e immagini usa read_upload con l''id del file). Confronta
            con il profilo dell''azienda.


            REGOLA DI FONDO: ogni affermazione cita tra parentesi il documento di provenienza e, se possibile, la sezione
            o pagina, es. (Disciplinare, art. 7.2), (Avviso TED), (Profilo azienda). Se un dato non è nei documenti scrivi
            ''non indicato''. Non inventare mai requisiti, importi o date. Se un documento non è stato fornito, dillo.


            STRUTTURA: inizia con ''# Analisi — <oggetto del bando in breve>''. Sezioni ##: Sintesi (ente, oggetto, importo,
            lotti, CIG se presente, scadenza offerte); Requisiti di partecipazione (tabella: requisito | fonte | stato per
            l''azienda: soddisfatto / da verificare / mancante, in base a profilo e certificazioni dichiarate); Criteri di
            valutazione e punteggi (tecnica/economica, sub-criteri, formula economica); Scadenze e adempimenti (sopralluogo,
            quesiti, presentazione, cauzioni); Incongruenze tra i documenti (confronta avviso, disciplinare, capitolato; cita
            entrambe le fonti); Quesiti da porre alla stazione appaltante (formulati pronti da inviare); Esito: l''azienda
            ha i requisiti? Verdetto prudente con elenco di cosa manca o va verificato. Se utile aggiungi un grafico ```chart```
            dei punteggi con valori reali. Non sei un consulente legale: l''invio e la responsabilità dell''offerta restano
            all''azienda.'
  - key: drafter
    role: main
    when: azione == 'bozza'
    description: Prepara la bozza della relazione tecnica riusando le offerte passate.
    context:
    - key: profilo
      from: collection:company_profile
    appTools:
    - name: read_upload
      description: Legge un file caricato dall'utente (anche scansioni, con OCR)
      action: read_file
    - name: leggi_offerte
      description: Offerte passate dell'azienda nell'archivio
      action: read
      collection: offerte_passate
      scope: user
    goalTemplate: 'Azione: bozza della relazione tecnica.

      Bando: {bando}

      {?note}Indicazioni dell''utente: {note}{/note}

      Profilo dell''azienda: {profilo}

      {?docs}File caricati (nomi e id): {docs}{/docs}

      {?docs_text}Testo dei documenti di gara:

      {docs_text}{/docs_text}

      Usa leggi_offerte per recuperare le offerte passate dell''azienda da riusare. Oggi è {date}. Scrivi in italiano.'
    output: markdown
    profile:
      inline:
        display_name: GaraPronta redattore
        crews:
        - id: drafter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 2.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un redattore di relazioni tecniche per gare d''appalto pubbliche italiane. Prepari la BOZZA
            della relazione tecnica seguendo i criteri di valutazione del disciplinare fornito (struttura la relazione sui
            criteri e sub-criteri, rispettando limiti di pagine e indice se indicati) e riusando testi e soluzioni delle offerte
            passate dell''azienda (leggi_offerte; per file allegati usa read_upload).


            REGOLA DI FONDO: ogni affermazione cita il documento da cui viene, tra parentesi: (Disciplinare, art. X), (Capitolato,
            par. Y), (Offerta passata: <titolo, anno>), (Profilo azienda). Ciò che non trovi nei documenti non lo inventi:
            inserisci un segnaposto [DA COMPLETARE: cosa serve] (certificazioni, dati tecnici, referenze, numeri). Non copiare
            contenuti di offerte passate che non siano coerenti con il capitolato attuale; segnala le differenze.


            STRUTTURA: ''# Bozza relazione tecnica — <oggetto>''; una sezione ## per ogni criterio di valutazione con il punteggio
            massimo; in fondo ''## Elementi da completare'' e ''## Fonti riusate'' (elenco delle offerte passate usate). È
            una bozza: revisione e invio dell''offerta restano all''azienda.'
  inputForm:
    title: Nuova richiesta
    fields:
    - name: azione
      type: select
      required: true
      label: Cosa vuoi
      default: analisi
      options:
      - value: analisi
        label: Analisi del bando
      - value: bozza
        label: Bozza della relazione tecnica
    - name: bando
      type: text
      required: true
      label: Bando
      help: Numero di pubblicazione TED (es. 123456-2026) o titolo/CIG
    - name: docs
      type: file
      accept:
      - pdf
      - docx
      - xlsx
      - txt
      - jpg
      - png
      maxMb: 15
      multiple: true
      label: Documenti di gara (disciplinare, capitolato…)
    - name: note
      type: textarea
      maxLength: 800
      label: Note (facoltative)
  templates:
  - key: osservatorio
    title: Osservatorio bandi
    description: Ogni giorno i nuovi bandi TED adatti al tuo profilo, per email e nell'app.
    agent: watcher
    params:
    - name: cpv
      type: text
      required: true
      label: Codici CPV
      help: Es. 33* (dispositivi medici), 336* (farmaci), 33140000
    - name: regioni
      type: text
      label: Regioni di interesse
      help: Vuoto = tutta Italia
    - name: importo_min
      type: number
      label: Importo minimo (€)
    - name: importo_max
      type: number
      label: Importo massimo (€)
    - name: keywords
      type: text
      label: Parole chiave
    - name: certificazioni
      type: text
      label: Certificazioni possedute
      help: Es. ISO 13485, ISO 9001, GDP
    goal: 'Osservatorio "{instance}". Oggi è {date}. Profilo: CPV {cpv}; regioni: {regioni}; importo minimo {importo_min}
      €, massimo {importo_max} €; parole chiave: {keywords}; certificazioni: {certificazioni}. Cerca su TED i bandi italiani
      pubblicati negli ultimi 2 giorni adatti al profilo e scrivi l''avviso in italiano.'
    schedule:
      cron: 0 6 * * *
      userCanChange: false
    maxPerUser: 3
    deliver:
      to: owner
      subject: GaraPronta — nuovi bandi {date}
      onlyIfNew: true
  data:
    collections:
    - name: company_profile
      ownedBy: user
      description: Profilo dell'azienda per l'analisi dei bandi
      fields:
      - name: ragione_sociale
        type: text
        required: true
        label: Ragione sociale
      - name: cpv
        type: text
        required: true
        label: Codici CPV
      - name: regioni
        type: text
        label: Regioni di interesse
      - name: importo_min
        type: number
        label: Importo minimo (€)
      - name: importo_max
        type: number
        label: Importo massimo (€)
      - name: certificazioni
        type: textarea
        label: Certificazioni possedute
      - name: keywords
        type: text
        label: Parole chiave
      - name: fatturato_specifico
        type: textarea
        label: Fatturato e forniture analoghe (per i requisiti)
    - name: offerte_passate
      ownedBy: user
      description: Archivio delle offerte tecniche passate dell'azienda
      retentionDays: 1825
      fields:
      - name: titolo
        type: text
        required: true
        label: Titolo gara
      - name: ente
        type: text
        label: Ente
      - name: anno
        type: number
        label: Anno
      - name: esito
        type: select
        label: Esito
        options:
        - value: aggiudicata
          label: Aggiudicata
        - value: non_aggiudicata
          label: Non aggiudicata
        - value: in_corso
          label: In corso
      - name: documento
        type: file
        accept:
        - pdf
        - docx
        - txt
        maxMb: 15
        label: Relazione tecnica
      - name: testo
        type: textarea
        label: Testo o note (facoltativo)
    - name: avvisi
      ownedBy: instance
      description: Avvisi giornalieri di ogni osservatorio
      retentionDays: 365
  views:
  - key: home
    type: page
    title: GaraPronta
    nav: false
    sections:
    - type: hero
      eyebrow: Per fornitori di dispositivi medici e farmaci
      title: Dal bando alla **bozza di offerta**, senza perdere una gara.
      text: Ogni giorno i nuovi bandi adatti alla tua azienda. Su quello che ti interessa, un'analisi con requisiti, punteggi,
        scadenze e incongruenze, e la bozza della relazione tecnica dalle tue offerte passate. Ogni affermazione cita il documento.
      actions:
      - label: Inizia
        href: /login
        style: primary
      - label: Come funziona
        href: '#come-funziona'
        style: ghost
    - type: steps
      id: come-funziona
      title: Come funziona
      items:
      - title: Profilo
        text: CPV, regioni, importi, certificazioni e parole chiave.
        badge: '1'
      - title: Osservatorio giornaliero
        text: Un avviso con i bandi TED adatti, ordinati per rilevanza.
        badge: '2'
      - title: Analisi del bando
        text: Requisiti, criteri, scadenze, incongruenze, quesiti e verdetto sui requisiti.
        badge: '3'
      - title: Bozza della relazione
        text: Costruita sui criteri del disciplinare e sulle tue offerte passate.
        badge: '4'
    - type: cards
      id: fonti
      title: Fonti
      items:
      - title: TED
        text: Banca dati europea degli appalti, API pubblica (CC BY 4.0), bandi italiani.
      - title: I tuoi documenti
        text: Disciplinare, capitolato e archivio delle offerte restano privati.
    - type: note
      content: GaraPronta è un supporto alla decisione, non consulenza legale. L'invio dell'offerta e la verifica finale dei
        requisiti restano all'azienda.
  - key: profilo
    type: form
    title: Profilo azienda
    collection: company_profile
    edit: true
    submit:
      label: Salva profilo
      message: Profilo salvato.
      redirect: new_analysis
    roles:
    - user
    - admin
  - key: archivio_nuovo
    type: form
    title: Aggiungi offerta passata
    collection: offerte_passate
    submit:
      label: Salva nell'archivio
      message: Offerta archiviata.
      redirect: archivio
    roles:
    - user
    - admin
  - key: archivio
    type: table
    title: Archivio offerte
    source: collection:offerte_passate
    columns:
    - titolo
    - ente
    - anno
    - esito
    roles:
    - user
    - admin
  - key: new_analysis
    type: new_run
    title: Analisi e bozza
    roles:
    - user
    - admin
  - key: richieste
    type: history
    title: Le mie richieste
    source: run
    roles:
    - user
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: osservatori
    type: instances
    template: osservatorio
    title: Osservatorio bandi
    roles:
    - user
    - admin
  - key: account
    type: account
    title: Crediti e abbonamento
    roles:
    - user
  notifications:
    emailOnRunDone: true
  egress:
    hosts:
    - api.ted.europa.eu
    notes: 'TED API pubblica del Publications Office of the EU: riuso libero anche commerciale, CC BY 4.0.'
  billing:
    modes:
    - credits
    - subscription
    currency: eur
    signupCredits: 50
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:analyst:
        estimate: 40
        metered: true
      agent:drafter:
        estimate: 80
        metered: true
      agent:watcher:
        requiresPlan: osservatorio
    packs:
    - key: small
      credits: 500
      price: 19
      label: 500 crediti
    - key: large
      credits: 2500
      price: 79
      label: 2500 crediti
    plans:
    - key: osservatorio
      price: 29
      interval: month
      label: Osservatorio giornaliero
      includes:
      - avviso giornaliero dei bandi adatti al profilo
      - fino a 3 profili di ricerca
      credits: 0
