apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: bolletta-chiara
  displayName: Bolletta Chiara
  tagline:
    it: Capisci la bolletta di luce e gas e risparmia.
    en: Understand your power and gas bill and save.
  description:
    it: 'Carica la bolletta o inserisci i dati: confrontiamo la tua spesa con le offerte del Portale Offerte ARERA e ti mostriamo
      il risparmio annuo stimato.'
    en: 'Upload your bill or enter the data: we compare your spend with the ARERA Offers Portal and show the estimated yearly
      saving.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#0f3d5e'
      accent: '#f2a900'
      background: '#f7f9fb'
      foreground: '#16222e'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: 'Bolletta '
      color: primary
    - text: Chiara
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    cta:
      label:
        it: Confronta ora
        en: Compare now
      href: /v/new_run
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  limits:
  - action: agent:comparator
    per: user
    max: 5
    window: day
    roles:
    - user
  agents:
  - key: comparator
    role: main
    description: Reads the bill (or the manual data) and compares it with ARERA Portale Offerte offers.
    profile:
      inline:
        display_name: Bolletta Chiara comparator
        crews:
        - id: comparator
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You are Bolletta Chiara, an independent assistant that helps Italian households and small businesses
            understand electricity and gas bills and find cheaper offers.


            STEPS

            1. Data: if the user uploaded a bill, use the text in the goal; for photos or scans call read_upload with the
            file id. Extract: supplier, offer name, commodity (luce/gas), annual consumption (kWh or Smc), power (kW), price
            per kWh or per Smc, fixed costs (euro/month or year), fixed or variable price. Manual form values override what
            you read. Say clearly which values you read and which are missing; ask nothing, state your assumptions.

            2. Current annual spend: estimate it from price, fixed costs and consumption (excluding taxes unless the offers
            are compared with taxes; be consistent and say so).

            3. Offers: through the WebRobot MCP, fetch the public offers of the ARERA Portale Offerte (open data, ilportaleofferte.it)
            compatible with the profile: commodity, domestic or small-business use, power band, area/CAP, consumption band.
            Do not invent offers: only report offers you actually retrieved, with their code and the link.

            4. Variable offers: retrieve the recent PUN trend published by GME (mercatoelettrico.org) and note how the variable
            offers (PUN + spread) could move; show a prudent range, not a promise.

            5. Compute the estimated yearly saving for each offer with the same method as the current spend. Sort by saving,
            highest first.


            REPORT (level-1 title first)

            # Bolletta Chiara — <commodity> <supplier or ''dati inseriti''>

            ## La tua bolletta (table of the extracted values, flagged as read/assumed)

            ## Le migliori offerte (table: supplier, offer, fixed/variable, annual cost, estimated saving, link)

            ## Condizioni da controllare (contract length, activation costs, exit fees, price validity, indexing, bonus conditions,
            payment methods)

            ## Andamento del PUN

            ## Prossimi passi

            Add a chart block comparing the annual cost of the top offers with the current one:

            ```chart

            {"type":"bar","title":"Costo annuo stimato","labels":["Attuale","Offerta A"],"series":[{"name":"€/anno","values":[1,2]}],"unit":"€"}

            ```

            with real figures only.


            RULES: never invent prices or figures; estimates are not guarantees; do not give legal advice; remind that the
            switch must be done with the chosen supplier or via the official channels and that the user should read the contract.
            You cannot start a supplier switch. Write in the language with the ISO code given in the goal.'
    appTools:
    - name: read_upload
      description: Read a file the user uploaded (photo or scan of the bill)
      action: read_file
    goalTemplate: 'Commodity: {commodity_label}

      CAP: {cap}

      Customer type: {customer_type_label}

      {?bill}Uploaded bill files: {bill}{/bill}

      {?bill_text}Bill text:

      {bill_text}{/bill_text}

      {?supplier}Supplier: {supplier}{/supplier}

      {?offer_name}Current offer: {offer_name}{/offer_name}

      {?annual_consumption}Annual consumption (kWh or Smc): {annual_consumption}{/annual_consumption}

      {?power_kw}Power (kW): {power_kw}{/power_kw}

      {?unit_price}Unit price (euro per kWh or Smc): {unit_price}{/unit_price}

      {?fixed_costs}Fixed costs (euro per year): {fixed_costs}{/fixed_costs}

      Today is {date}. Write the report in the language with ISO code {lang}.'
    output: markdown
  - key: watcher
    role: helper
    description: Weekly re-check of the offers for one user's profile.
    memory: instance
    writesTo:
      collection: watch_results
    profile:
      inline:
        display_name: Bolletta Chiara watcher
        crews:
        - id: watcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You watch the ARERA Portale Offerte (via the WebRobot MCP, open data) for one customer profile.
            Compute the estimated yearly saving of every compatible offer against the customer''s current yearly spend, with
            the same method each week. Start with a level-1 title: ''# Bolletta Chiara — nuova offerta conveniente'' ONLY
            if at least one offer saves more than the customer''s threshold (then list up to 5 offers: supplier, offer, estimated
            saving, conditions to check, link); otherwise the title is ''# Bolletta Chiara — nessuna novità, settimana del
            <date>'' followed by two lines. Never invent offers or figures. Your memory holds the offers already reported:
            do not repeat them as new unless their price changed. At the end call remember once with the codes of the offers
            reported.'
    goalTemplate: Watch {instance}
    output: markdown
  inputForm:
    title:
      it: Nuovo confronto
      en: New comparison
    fields:
    - name: commodity
      type: select
      required: true
      label:
        it: Fornitura
        en: Supply
      options:
      - value: luce
        label:
          it: Luce
          en: Electricity
      - value: gas
        label: Gas
    - name: customer_type
      type: select
      required: true
      label:
        it: Tipo di cliente
        en: Customer type
      options:
      - value: domestico
        label:
          it: Famiglia
          en: Household
      - value: business
        label:
          it: Piccola impresa
          en: Small business
    - name: cap
      type: text
      required: true
      maxLength: 5
      label: CAP
    - name: bill
      type: file
      accept:
      - pdf
      - jpg
      - jpeg
      - png
      maxMb: 10
      multiple: false
      label:
        it: Foto o PDF dell'ultima bolletta (oppure compila i dati sotto)
        en: Photo or PDF of your latest bill (or fill in the data below)
    - name: supplier
      type: text
      label:
        it: Fornitore
        en: Supplier
    - name: offer_name
      type: text
      label:
        it: Offerta attuale
        en: Current offer
    - name: annual_consumption
      type: number
      label:
        it: Consumo annuo (kWh o Smc)
        en: Annual consumption (kWh or Smc)
    - name: power_kw
      type: number
      label:
        it: Potenza impegnata (kW)
        en: Contract power (kW)
    - name: unit_price
      type: number
      label:
        it: Prezzo per kWh o Smc (€)
        en: Price per kWh or Smc (€)
    - name: fixed_costs
      type: number
      label:
        it: Costi fissi (€/anno)
        en: Fixed costs (€/year)
  templates:
  - key: offer_watch
    title:
      it: Monitoraggio offerte
      en: Offer monitoring
    description:
      it: Ogni settimana ricontrolliamo le offerte e ti scriviamo se ne compare una che fa risparmiare più della tua soglia.
      en: Every week we re-check the offers and email you if one saves more than your threshold.
    agent: watcher
    params:
    - name: commodity
      type: select
      required: true
      label:
        it: Fornitura
        en: Supply
      options:
      - value: luce
        label:
          it: Luce
          en: Electricity
      - value: gas
        label: Gas
    - name: customer_type
      type: select
      required: true
      label:
        it: Cliente
        en: Customer
      options:
      - value: domestico
        label:
          it: Famiglia
          en: Household
      - value: business
        label:
          it: Piccola impresa
          en: Small business
    - name: cap
      type: text
      required: true
      label: CAP
    - name: annual_consumption
      type: number
      required: true
      label:
        it: Consumo annuo (kWh o Smc)
        en: Annual consumption (kWh or Smc)
    - name: power_kw
      type: number
      label:
        it: Potenza (kW)
        en: Power (kW)
    - name: unit_price
      type: number
      required: true
      label:
        it: Prezzo attuale per kWh o Smc (€)
        en: Current price per kWh or Smc (€)
    - name: fixed_costs
      type: number
      label:
        it: Costi fissi attuali (€/anno)
        en: Current fixed costs (€/year)
    - name: threshold
      type: number
      required: true
      default: 50
      label:
        it: Soglia di risparmio annuo (€)
        en: Yearly saving threshold (€)
    goal: 'Watch "{instance}": {commodity} for a {customer_type} customer, CAP {cap}, annual consumption {annual_consumption},
      power {?power_kw}{power_kw}{/power_kw} kW, current unit price {unit_price} euro, fixed costs {?fixed_costs}{fixed_costs}{/fixed_costs}
      euro/year. Alert threshold: {threshold} euro of yearly saving. Today is {date}. Write in the language with ISO code
      {lang}.'
    schedule:
      cron: 0 7 * * 1
      userCanChange: false
    maxPerUser: 4
    roles:
    - user
    - admin
    deliver:
      to: owner
      onlyIfNew: true
      subject: Bolletta Chiara — {title}
  data:
    collections:
    - name: watch_results
      ownedBy: instance
      description: Weekly results of each offer monitor
      retentionDays: 365
  views:
  - key: home
    type: page
    nav: false
    title: Bolletta Chiara
    sections:
    - type: hero
      band: true
      title:
        it: Capisci la bolletta. **Risparmia** davvero.
        en: Understand your bill. **Really** save.
      text:
        it: 'Carica la foto o il PDF della tua bolletta di luce o gas: la leggiamo, la confrontiamo con le offerte del Portale
          Offerte ARERA e ti mostriamo quanto potresti risparmiare in un anno.'
        en: 'Upload a photo or PDF of your power or gas bill: we read it, compare it with the ARERA Offers Portal and show
          how much you could save in a year.'
      actions:
      - label:
          it: Confronta gratis
          en: Compare for free
        href: /v/new_run
        style: primary
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Carica o compila
          en: Upload or fill in
        text:
          it: Foto, PDF o modulo manuale con consumi, prezzo e CAP.
          en: Photo, PDF or a manual form with consumption, price and postcode.
        badge: 📄
      - title:
          it: Confronto
          en: Comparison
        text:
          it: Offerte ARERA compatibili, risparmio annuo stimato e andamento del PUN (GME) per le offerte variabili.
          en: Compatible ARERA offers, estimated yearly saving and the GME PUN trend for variable offers.
        badge: ⚖️
      - title:
          it: Monitoraggio
          en: Monitoring
        text:
          it: Ogni settimana ricontrolliamo e ti scriviamo se spunta un'offerta sopra la tua soglia (abbonamento annuale).
          en: Every week we re-check and email you when an offer beats your threshold (yearly subscription).
        badge: 🔔
    - type: note
      content:
        it: 'Le stime non sono garanzie. Il cambio fornitore si conclude con il fornitore scelto: leggi sempre il contratto.
          Dati da Portale Offerte ARERA e GME.'
        en: 'Estimates are not guarantees. The switch is completed with the chosen supplier: always read the contract. Data
          from ARERA Offers Portal and GME.'
  - key: new_run
    type: new_run
    title:
      it: Nuovo confronto
      en: New comparison
    roles:
    - user
    - admin
  - key: history
    type: history
    title:
      it: Le mie bollette
      en: My bills
    source: run
    roles:
    - user
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: watches
    type: instances
    template: offer_watch
    title:
      it: Monitoraggio
      en: Monitoring
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - user
  billing:
    modes:
    - subscription
    currency: eur
    costs:
      template:offer_watch:
        requiresPlan: monitor
    plans:
    - key: monitor
      price: 19
      interval: year
      label:
        it: Monitoraggio annuale
        en: Yearly monitoring
      includes:
      - Weekly offer re-check
      - Email alerts above your threshold
      roles:
      - user
  notifications:
    emailOnRunDone: true
  extensions:
  - key: supplier_switch
    description: 'Starting the supplier switch directly from the app (with the user''s consent) is not available: it needs
      a mandate and integration with suppliers/SII, and OAuth or partner APIs that the platform does not offer yet. The report
      lists the steps and links to complete the switch with the chosen supplier.'
  - key: monitor_alert_only_on_hit
    description: The weekly email is sent when the report changes (onlyIfNew); a strict 'send only if above threshold' filter
      on structured results is not expressible yet.
