apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: bolletta-chiara
  displayName: Bolletta Chiara
  tagline:
    it: Capisci la tua bolletta di luce e gas e scopri quanto puoi risparmiare.
    en: Understand your power and gas bill and see how much you can save.
  description:
    it: 'Inserisci i dati dell''ultima bolletta: un agente AI li confronta con le offerte del Portale Offerte ARERA e ti mostra
      il risparmio annuo stimato, con le condizioni da controllare.'
    en: 'Enter the data from your latest bill: an AI agent compares it with the offers in the ARERA Offers Portal and shows
      the estimated yearly saving, with the conditions to check.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12355b'
      accent: '#f2a007'
      background: '#f8f9fb'
      foreground: '#17202a'
    fonts:
      body: Inter
      display: Poppins
    wordmark:
    - text: Bolletta
      color: primary
    - text: Chiara
      color: accent
    width: normal
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Monitoraggio
        en: Monitoring
      href: '#monitoraggio'
    cta:
      label:
        it: Confronta ora
        en: Compare now
      href: /v/new_run
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  limits:
  - action: agent:comparer
    per: user
    max: 10
    window: day
    roles:
    - user
  agents:
  - key: comparer
    role: main
    description: Reads the bill data, collects compatible ARERA offers, computes the yearly saving and writes the ranked report.
    profile:
      inline:
        display_name: Bolletta Chiara comparer
        crews:
        - id: comparer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You are Bolletta Chiara, an independent analyst of Italian electricity and gas bills for families
            and small businesses. You receive the bill data either typed in a form or as pasted text / a link to the bill.
            If the data come as text or a link, first extract: supplier, offer name, commodity (power or gas), yearly consumption
            (kWh or Smc), contracted power (kW), price per kWh or per Smc, fixed costs per year, CAP. If a key figure is missing,
            say so and state the assumption you use (never invent it).

            Then use the WebRobot MCP to build and run a small collection pipeline (do not write code for the user) that reads
            the public offers of the Portale Offerte ARERA (ilportaleofferte.it, open data of the offers) compatible with
            the profile (commodity, customer type domestic or small business, CAP/area, power level). Also read the recent
            PUN trend published by GME (mercatoelettrico.org) to judge variable (indexed) offers.

            Compute for each compatible offer the estimated yearly cost with the same consumption (energy price x consumption
            + fixed fees; exclude taxes and charges equal for all offers, and say so) and the estimated yearly saving versus
            the current spend. For indexed offers give a range using the PUN trend and say it is a scenario, not a forecast.
            Always state the date of the offers and the source.

            Report structure: a level-1 title "# Bolletta Chiara — <commodity>, <CAP> — <date>"; ## Your current bill (the
            extracted data and assumptions); ## Best offers (a table ordered by yearly saving descending, max 15 rows: supplier,
            offer, fixed/variable, price, fixed costs, estimated yearly cost, estimated saving, conditions to check); ## Conditions
            to check (minimum duration, exit fees, bundled services, payment methods, validity, price update clauses); ##
            PUN trend and variable offers, with a chart block when you have figures: ```chart {"type":"bar","title":"...","labels":[...],"series":[{"name":"...","values":[...]}],"unit":"€"}```;
            ## Next steps. Explain that the switch is done by contacting the chosen supplier, which handles it at no cost;
            you do not start any switch. Never invent figures or offers, and state that this is decision support, not financial
            advice, and that the person must verify the conditions on the supplier''s contract.'
    context: []
    goalTemplate: 'Commodity: {commodity_label}

      CAP: {cap}

      Customer type: {customer_type_label}

      {?supplier}Current supplier: {supplier}{/supplier}

      {?offer}Current offer: {offer}{/offer}

      {?consumption}Yearly consumption: {consumption} (kWh for power, Smc for gas){/consumption}

      {?power_kw}Contracted power: {power_kw} kW{/power_kw}

      {?unit_price}Current price per kWh or Smc (EUR): {unit_price}{/unit_price}

      {?fixed_costs}Fixed costs per year (EUR): {fixed_costs}{/fixed_costs}

      {?bill_url}Link to the bill: {bill_url}{/bill_url}

      {?bill_text}Text of the bill pasted by the user:

      {bill_text}{/bill_text}

      Today is {date}. Write the report in the language with ISO code {lang}.'
    output: markdown
    limits:
      maxTurns: 40
      maxBudgetUsd: 1.5
  - key: watcher
    role: helper
    description: Weekly re-check of the offers for one saved bill profile; flags offers above the user's saving threshold.
    memory: instance
    writesTo:
      collection: watch_results
      parse: whole
    profile:
      inline:
        display_name: Bolletta Chiara watcher
        crews:
        - id: watcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You watch, once a week, the offers of the Portale Offerte ARERA for one saved bill profile (commodity,
            CAP, customer type, yearly consumption, power, current price and fixed costs). Use the WebRobot MCP to collect
            the current compatible offers and the recent PUN trend from GME (for indexed offers). Compute the estimated yearly
            saving of each offer against the current spend, as in a normal comparison. Start with "# Bolletta Chiara — controllo
            del <date>". Sections: ## Esito (one line: ALERT if at least one offer saves more than the user''s threshold,
            otherwise OK), ## Offerte sopra soglia (table: supplier, offer, type, estimated yearly saving, conditions to check),
            ## Cosa è cambiato (versus your memory of last week), ## Da controllare. Never invent offers or figures. Your
            memory holds the best 3 offers of last time: at the end call the tool remember once with the best 3 offers of
            this check (they replace the old ones). You cannot send emails and you do not start any supplier switch.'
  templates:
  - key: bill_watch
    title:
      it: Monitoraggio offerte
      en: Offers monitoring
    description:
      it: Ogni settimana l'agente ricontrolla le offerte e segnala quelle che ti fanno risparmiare più della tua soglia.
      en: Every week the agent re-checks the offers and flags those saving more than your threshold.
    agent: watcher
    params:
    - name: commodity
      type: select
      required: true
      label:
        it: Fornitura
        en: Supply
      options:
      - value: power
        label:
          it: Luce
          en: Power
      - value: gas
        label: Gas
    - name: customer_type
      type: select
      required: true
      label:
        it: Cliente
        en: Customer
      options:
      - value: domestic
        label:
          it: Famiglia
          en: Household
      - value: business
        label:
          it: Piccola impresa
          en: Small business
    - name: cap
      type: text
      required: true
      label: CAP
      maxLength: 5
    - name: consumption
      type: number
      required: true
      label:
        it: Consumo annuo (kWh o Smc)
        en: Yearly consumption (kWh or Smc)
    - name: power_kw
      type: number
      label:
        it: Potenza impegnata (kW)
        en: Contracted power (kW)
    - name: unit_price
      type: number
      required: true
      label:
        it: Prezzo attuale per kWh o Smc (€)
        en: Current price per kWh or Smc (€)
    - name: fixed_costs
      type: number
      label:
        it: Costi fissi annui (€)
        en: Fixed costs per year (€)
    - name: threshold
      type: number
      required: true
      default: 80
      label:
        it: Soglia di risparmio annuo (€)
        en: Yearly saving threshold (€)
    goal: 'Watch "{instance}": {commodity} for a {customer_type}, CAP {cap}, yearly consumption {consumption}, {?power_kw}power
      {power_kw} kW, {/power_kw}current price {unit_price} EUR, fixed costs {fixed_costs} EUR/year. Saving threshold: {threshold}
      EUR/year. Today is {date}. Write the check in the language with ISO code {lang}.'
    schedule:
      cron: 0 7 * * 1
      userCanChange: false
    maxPerUser: 4
  inputForm:
    title:
      it: Nuovo confronto
      en: New comparison
    fields:
    - name: commodity
      type: select
      required: true
      label:
        it: Fornitura
        en: Supply
      options:
      - value: power
        label:
          it: Luce
          en: Power
      - value: gas
        label: Gas
    - name: customer_type
      type: select
      required: true
      label:
        it: Cliente
        en: Customer
      options:
      - value: domestic
        label:
          it: Famiglia
          en: Household
      - value: business
        label:
          it: Piccola impresa
          en: Small business
    - name: cap
      type: text
      required: true
      maxLength: 5
      label: CAP
    - name: supplier
      type: text
      label:
        it: Fornitore attuale
        en: Current supplier
    - name: offer
      type: text
      label:
        it: Offerta attuale
        en: Current offer
    - name: consumption
      type: number
      label:
        it: Consumo annuo (kWh o Smc)
        en: Yearly consumption (kWh or Smc)
    - name: power_kw
      type: number
      label:
        it: Potenza impegnata (kW)
        en: Contracted power (kW)
    - name: unit_price
      type: number
      label:
        it: Prezzo per kWh o Smc (€)
        en: Price per kWh or Smc (€)
    - name: fixed_costs
      type: number
      label:
        it: Costi fissi annui (€)
        en: Fixed costs per year (€)
    - name: bill_url
      type: url
      label:
        it: Link alla bolletta (facoltativo)
        en: Link to the bill (optional)
      help:
        it: 'Il caricamento di file non è ancora disponibile: incolla un link o il testo della bolletta.'
        en: 'File upload is not available yet: paste a link or the text of the bill.'
    - name: bill_text
      type: textarea
      maxLength: 6000
      label:
        it: Testo della bolletta (facoltativo)
        en: Bill text (optional)
      help:
        it: Se incolli il testo, i campi sopra possono restare vuoti.
        en: If you paste the text, the fields above can stay empty.
  data:
    collections:
    - name: watch_results
      ownedBy: instance
      description: Weekly check of each monitoring (one record per run)
  views:
  - key: home
    type: page
    nav: false
    title: Bolletta Chiara
    sections:
    - type: hero
      band: true
      eyebrow:
        it: Luce e gas per famiglie e piccole imprese
        en: Power and gas for households and small businesses
      title:
        it: Capisci la tua **bolletta** e smetti di pagare troppo.
        en: Understand your **bill** and stop overpaying.
      text:
        it: 'Inserisci i dati dell''ultima bolletta: Bolletta Chiara li confronta con le offerte del Portale Offerte ARERA
          e ti dice quanto risparmieresti ogni anno. Il confronto è gratuito.'
        en: 'Enter the data from your latest bill: Bolletta Chiara compares it with the offers in the ARERA Offers Portal
          and tells you how much you would save every year. The comparison is free.'
      actions:
      - label:
          it: Confronta la mia bolletta
          en: Compare my bill
        href: /v/new_run
        style: primary
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Dati della bolletta
          en: Bill data
        text:
          it: 'Compili un breve modulo o incolli il testo della bolletta: fornitore, consumi, potenza, prezzo e costi fissi.'
          en: 'Fill in a short form or paste the bill text: supplier, consumption, power, price and fixed costs.'
        badge: 📄
      - title:
          it: Confronto con ARERA
          en: ARERA comparison
        text:
          it: L'agente confronta la tua spesa con le offerte compatibili del Portale Offerte, tenendo conto dell'andamento
            del PUN (GME) per le offerte variabili.
          en: The agent compares your spend with the compatible offers of the Offers Portal, considering the PUN trend (GME)
            for variable offers.
        badge: ⚖️
      - title:
          it: Tabella dei risparmi
          en: Savings table
        text:
          it: Ricevi le offerte ordinate per risparmio annuo stimato, con le condizioni da controllare prima di cambiare.
          en: You get the offers ordered by estimated yearly saving, with the conditions to check before switching.
        badge: 💶
    - type: cards
      id: monitoraggio
      title:
        it: Monitoraggio settimanale
        en: Weekly monitoring
      items:
      - title:
          it: Ricontrollo ogni settimana
          en: Re-check every week
        text:
          it: Con un piccolo abbonamento annuale l'agente ricontrolla le offerte ogni settimana e segnala quelle sopra la
            tua soglia di risparmio, nella sezione Monitoraggio dell'app.
          en: With a small yearly subscription the agent re-checks the offers every week and flags those above your saving
            threshold, in the Monitoring section of the app.
        badge: 🔔
      - title:
          it: Cambio fornitore
          en: Switching supplier
        text:
          it: 'Il cambio lo concludi con il fornitore scelto: l''app non lo avvia al posto tuo.'
          en: 'You complete the switch with the chosen supplier: the app does not start it for you.'
        badge: 🔁
    - type: note
      content:
        it: 'Bolletta Chiara è un supporto alle decisioni, non consulenza. Fonti: Portale Offerte ARERA, GME (PUN). Verifica
          sempre le condizioni contrattuali con il fornitore.'
        en: 'Bolletta Chiara is decision support, not advice. Sources: ARERA Offers Portal, GME (PUN). Always verify the contract
          conditions with the supplier.'
  - key: new_run
    type: new_run
    title:
      it: Nuovo confronto
      en: New comparison
    roles:
    - user
    - admin
  - key: history
    type: history
    title:
      it: Le mie bollette
      en: My bills
    source: run
    columns:
    - createdAt
    - commodity
    - cap
    - status
    roles:
    - user
    - admin
  - key: report
    type: report
    title:
      it: Confronto
      en: Comparison
    source: run
    printable: true
    nav: false
  - key: watches
    type: instances
    template: bill_watch
    title:
      it: Monitoraggio
      en: Monitoring
    roles:
    - user
    - admin
  - key: watch_checks
    type: table
    title:
      it: Controlli settimanali
      en: Weekly checks
    source: collection:watch_results
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Plan
    roles:
    - user
  billing:
    modes:
    - free
    - subscription
    currency: eur
    costs:
      agent:comparer: 0
    plans:
    - key: monitor_year
      price: 19
      interval: year
      label:
        it: Monitoraggio offerte
        en: Offers monitoring
      includes:
      - bill_watch
      roles:
      - user
  extensions:
  - key: bill_file_upload
    description: 'Upload of a photo or PDF of the bill with automatic reading is not available yet: the user pastes a link
      or the text of the bill, or fills in the form.'
  - key: email_alerts
    description: 'Weekly email when an offer exceeds the saving threshold is not available yet (no notifications): the result
      appears in the Monitoring checks view.'
  - key: supplier_switch
    description: 'Starting the supplier switch directly from the app (with user consent) is not available: it needs the customer''s
      identity data, contractual mandate and supplier credentials. The report points to the chosen supplier.'
