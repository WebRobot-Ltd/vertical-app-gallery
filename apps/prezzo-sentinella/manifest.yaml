apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: prezzosentinella
  displayName: PrezzoSentinella
  tagline:
    it: Sai sempre come prezzano i tuoi concorrenti, nel rispetto dei loro termini.
    en: Always know how your competitors price, within their terms of use.
  description:
    it: 'Carica il tuo catalogo, indica gli shop concorrenti: un agente controlla ogni giorno prezzi, disponibilità e promozioni
      solo sugli shop diretti che lo consentono, e ti avvisa via email.'
    en: 'Upload your catalogue and pick competitor shops: an agent checks prices, availability and promotions every day, only
      on direct shops that allow it, and alerts you by email.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: dashboard
  branding:
    theme: light
    palette:
      primary: '#12304a'
      accent: '#e07a1f'
      background: '#f6f8fa'
      foreground: '#16222e'
    fonts:
      body: Inter
      display: Manrope
    wordmark:
    - text: Prezzo
      color: primary
    - text: Sentinella
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#how'
    - label:
        it: Regole
        en: Rules
      href: '#rules'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  limits:
  - action: create:products
    max: 50
    window: total
    plans:
      growth: 250
      scale: 1000
  - action: agent:importer
    per: user
    max: 10
    window: day
    roles:
    - user
  agents:
  - key: importer
    role: main
    description: Reads the uploaded or pasted catalogue and saves the products.
    profile:
      inline:
        display_name: PrezzoSentinella importer
        crews:
        - id: importer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You import a product catalogue for a price-monitoring app. The input is CSV/Excel/plain text with
            columns like SKU, EAN, name, own price. For every row call write_product once with sku, ean (digits only, keep
            it empty if absent), name, own_price (number), currency. Skip rows without SKU or name and list them. Never invent
            EANs or prices. Finish with a report that starts with the level-1 title "# Import catalogo" and lists: rows saved,
            rows skipped and why.'
    goalTemplate: 'Currency by default: {currency_label}.

      {?catalog_file_text}Catalogue file content:

      {catalog_file_text}{/catalog_file_text}

      {?pasted}Pasted catalogue:

      {pasted}{/pasted}

      Save every product with write_product. Write the report in the language with ISO code {lang}.'
    appTools:
    - name: write_product
      description: Save or update one product of the user's catalogue (keyed by sku)
      action: write
      collection: products
      scope: user
    output: markdown
    limits:
      maxTurns: 30
      maxBudgetUsd: 0.5
  - key: collector
    role: scheduled
    description: 'Daily: checks robots.txt and terms of each competitor shop, reads the allowed product pages, stores price,
      stock and promotions, raises alerts, updates the market summary.'
    memory: user
    profile:
      inline:
        display_name: PrezzoSentinella collector
        crews:
        - id: collector
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 60
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You monitor competitor prices for one customer.

            STEPS

            1. read_shops and read_products. For each active shop whose robots_status is unknown or whose checked_at is older
            than 7 days: fetch https://<domain>/robots.txt and read the terms of use page with the WebRobot MCP. If robots.txt
            disallows the product paths for generic crawlers, or the terms forbid automated access/scraping, call write_shop
            with robots_status=blocked and a short robots_note quoting the rule; otherwise robots_status=allowed. Set checked_at
            to today. NEVER read pages of a blocked shop.

            2. Only DIRECT shops. Never use price-comparison sites or aggregators (Google Shopping, Idealo, Trovaprezzi, etc.);
            if a shop looks like one, mark it blocked with note ''comparator''.

            3. read_listings: for each listing of an allowed shop whose match_status is not rejected, open the product page
            politely (low rate, one request at a time) and extract price (number, tax included as displayed), currency, availability
            (in_stock|out_of_stock|unknown) and promotion text. If a shop has no listing for a SKU yet, search the shop by
            EAN and then by name, and save write_listing with match_status new (the matcher will confirm). Append the observation
            with write_history (sku, shop, date=today, price, currency, availability, promo, url). Never invent values: if
            a page cannot be read, skip it.

            4. Alerts: compare with the product fields alert_below (price threshold) and alert_stock. If a CONFIRMED competitor
            price is below alert_below, or a competitor that was in stock (see read_history) is now out_of_stock and alert_stock
            is true, call write_alert with sku, shop, kind (price_below|out_of_stock), price and a one-line message. One alert
            per sku/shop/day.

            5. For each SKU upsert write_market: sku, name, own_price, min_price, avg_price (over confirmed listings with
            price today), shops_count, position (cheapest|below_avg|above_avg|most_expensive), updated=today.

            End with a report starting with the level-1 title "# Controllo prezzi <date>" listing shops blocked, pages read,
            alerts raised. Use memory to note shops that failed repeatedly.'
    goalTemplate: Run the daily price check for the catalogue "{instance}". Today is {date}. Write the report in the language
      with ISO code {lang}.
    appTools:
    - name: read_products
      description: Read the user's products
      action: read
      collection: products
      scope: user
    - name: read_shops
      description: Read the competitor shops of the user
      action: read
      collection: shops
      scope: user
    - name: write_shop
      description: Update a competitor shop (robots status, note, check date)
      action: write
      collection: shops
      scope: user
    - name: read_listings
      description: Read the product pages tracked per shop
      action: read
      collection: listings
      scope: user
    - name: write_listing
      description: Save a competitor product page found for a SKU
      action: write
      collection: listings
      scope: user
    - name: read_history
      description: Read the price history
      action: read
      collection: price_history
      scope: user
    - name: write_history
      description: Append one price observation
      action: append
      collection: price_history
      scope: user
    - name: write_alert
      description: Append an alert (triggers an email)
      action: append
      collection: alerts
      scope: user
    - name: write_market
      description: Upsert the market summary of one SKU
      action: write
      collection: market
      scope: user
    mcpServers:
    - name: webrobot
      url: https://mcp-full.webrobot.eu/mcp
      allow: all
    output: markdown
    limits:
      maxTurns: 60
      maxBudgetUsd: 1.5
      timeoutSeconds: 1800
  - key: matcher
    role: helper
    description: Matches competitor listings to the user's products by EAN and name similarity; asks the user when unsure.
    awaits:
    - match_confirm
    profile:
      inline:
        display_name: PrezzoSentinella matcher
        crews:
        - id: matcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 20
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You match a competitor listing to the user''s product. Compare with read_products: identical EAN
            = confirmed (match_score 1). Otherwise compare names, brand, size/pack/model/colour; score 0-1. Score >= 0.9 with
            the same brand and size: confirmed. Score < 0.4: rejected. Anything between: uncertain, and call request_match_confirm
            with sku, shop, both names, the score and why; then wait. Always update the listing with write_listing (match_status
            confirmed|uncertain|rejected, match_score). When a decision arrives, set the listing to confirmed (approved) or
            rejected. Never guess size or pack differences away. Reply with one short line summary.'
    goalTemplate: '{event}

      Match or apply the decision for this listing. Today is {date}. Language: {lang}.'
    appTools:
    - name: read_products
      description: Read the user's products
      action: read
      collection: products
      scope: user
    - name: read_listings
      description: Read the product pages tracked per shop
      action: read
      collection: listings
      scope: user
    - name: write_listing
      description: Save a competitor product page found for a SKU
      action: write
      collection: listings
      scope: user
    output: markdown
    limits:
      maxTurns: 20
      maxBudgetUsd: 0.4
  inputForm:
    title:
      it: Importa catalogo
      en: Import catalogue
    fields:
    - name: catalog_file
      type: file
      accept:
      - csv
      - xlsx
      - txt
      maxMb: 10
      label:
        it: File catalogo (SKU, EAN, nome, prezzo)
        en: Catalogue file (SKU, EAN, name, price)
    - name: pasted
      type: textarea
      maxLength: 6000
      label:
        it: Oppure incolla le righe
        en: Or paste the rows
    - name: currency
      type: select
      required: true
      default: EUR
      label:
        it: Valuta
        en: Currency
      options:
      - value: EUR
        label: EUR
      - value: GBP
        label: GBP
      - value: USD
        label: USD
      - value: CHF
        label: CHF
  data:
    collections:
    - name: products
      ownedBy: user
      description: The customer's catalogue
      fields:
      - name: sku
        type: text
        required: true
        label: SKU
      - name: ean
        type: text
        maxLength: 14
        label: EAN
      - name: name
        type: text
        required: true
        label:
          it: Nome
          en: Name
      - name: own_price
        type: number
        required: true
        label:
          it: Prezzo proprio
          en: Own price
      - name: currency
        type: text
        default: EUR
        label:
          it: Valuta
          en: Currency
      - name: alert_below
        type: number
        label:
          it: Avvisami se un concorrente scende sotto
          en: Alert me if a competitor drops below
      - name: alert_stock
        type: boolean
        default: true
        label:
          it: Avvisami se va fuori stock
          en: Alert me when out of stock
    - name: shops
      ownedBy: user
      description: Competitor direct shops
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome shop
          en: Shop name
      - name: domain
        type: text
        required: true
        label:
          it: Dominio (es. shop.it)
          en: Domain (e.g. shop.it)
      - name: active
        type: boolean
        default: true
        label:
          it: Attivo
          en: Active
      - name: robots_status
        type: select
        default: unknown
        label:
          it: Esito robots.txt / termini
          en: robots.txt / terms result
        options:
        - value: unknown
          label:
            it: Da verificare
            en: To check
        - value: allowed
          label:
            it: Consentito
            en: Allowed
        - value: blocked
          label:
            it: Vietato (escluso)
            en: Forbidden (excluded)
      - name: robots_note
        type: textarea
        label:
          it: Nota
          en: Note
      - name: checked_at
        type: date
        label:
          it: Verificato il
          en: Checked on
    - name: listings
      ownedBy: user
      description: Product page of a competitor shop matched to a SKU
      fields:
      - name: sku
        type: text
        required: true
      - name: shop
        type: text
        required: true
      - name: url
        type: url
      - name: listing_name
        type: text
      - name: ean
        type: text
      - name: match_status
        type: select
        default: new
        options:
        - new
        - confirmed
        - uncertain
        - rejected
      - name: match_score
        type: number
    - name: price_history
      ownedBy: user
      retentionDays: 730
      description: Daily observations
      fields:
      - name: sku
        type: text
        required: true
      - name: shop
        type: text
        required: true
      - name: date
        type: date
        required: true
      - name: price
        type: number
      - name: currency
        type: text
      - name: availability
        type: select
        options:
        - in_stock
        - out_of_stock
        - unknown
      - name: promo
        type: text
      - name: url
        type: url
    - name: alerts
      ownedBy: user
      retentionDays: 365
      fields:
      - name: sku
        type: text
      - name: shop
        type: text
      - name: kind
        type: select
        options:
        - price_below
        - out_of_stock
      - name: price
        type: number
      - name: message
        type: text
    - name: market
      ownedBy: user
      description: Per-SKU market summary
      fields:
      - name: sku
        type: text
        required: true
      - name: name
        type: text
      - name: own_price
        type: number
      - name: min_price
        type: number
      - name: avg_price
        type: number
      - name: shops_count
        type: number
      - name: position
        type: select
        options:
        - cheapest
        - below_avg
        - above_avg
        - most_expensive
      - name: updated
        type: date
  templates:
  - key: daily_watch
    title:
      it: Monitoraggio giornaliero
      en: Daily watch
    description:
      it: Ogni giorno alle 6 controlla i tuoi shop concorrenti.
      en: Every day at 6 it checks your competitor shops.
    agent: collector
    params:
    - name: catalog
      type: text
      required: true
      label:
        it: Nome del catalogo
        en: Catalogue name
    goal: Run the daily price check for the catalogue "{instance}" ({catalog}). Today is {date}. Write the report in the language
      with ISO code {lang}.
    schedule:
      cron: 0 5 * * *
      userCanChange: false
    maxPerUser: 3
  approvals:
  - key: match_confirm
    title:
      it: Conferma abbinamento prodotto
      en: Confirm product match
    description: The match between a competitor listing and one of your SKUs is uncertain
    decidedBy: requester
    fields:
    - sku
    - shop
    - own_name
    - listing_name
    - score
    - reason
    timeoutMinutes: 10080
    onTimeout: reject
  triggers:
  - key: price_alert
    'on':
      collection: alerts
      op: insert
    notify:
      to: owner
      subject:
        it: 'PrezzoSentinella: {record.kind} su {record.sku}'
        en: 'PrezzoSentinella: {record.kind} on {record.sku}'
      body:
        it: '{record.message}

          SKU: {record.sku}

          Shop: {record.shop}

          Prezzo: {record.price}'
        en: '{record.message}

          SKU: {record.sku}

          Shop: {record.shop}

          Price: {record.price}'
      link: market
  - key: new_listing
    'on':
      collection: listings
      op: insert
      where:
        match_status: new
    start:
      agent: matcher
    goal: 'Match this listing: SKU {record.sku}, shop {record.shop}, name {record.listing_name}, EAN {record.ean}.'
    asUser: true
  - key: match_decided
    'on':
      approval: match_confirm
      decision: any
    start:
      agent: matcher
    goal: 'Apply the user''s decision on the uncertain match: {event}'
    asUser: true
  views:
  - key: home
    type: page
    nav: false
    title: PrezzoSentinella
    sections:
    - type: hero
      title:
        it: Sai **come prezzano** i tuoi concorrenti, ogni giorno.
        en: Know **how competitors price**, every day.
      text:
        it: 'Carica il catalogo, scegli gli shop da seguire: prezzo, disponibilità e promozioni finiscono nello storico e
          ricevi un alert email quando conta.'
        en: 'Upload your catalogue, pick the shops to follow: price, stock and promotions go to your history and you get an
          email alert when it matters.'
      actions:
      - label:
          it: Inizia
          en: Start
        href: /login
        style: primary
    - type: steps
      id: how
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Catalogo e shop
          en: Catalogue and shops
        text:
          it: Importi SKU, EAN, nome e prezzo; aggiungi gli shop concorrenti.
          en: Import SKU, EAN, name and price; add competitor shops.
      - title:
          it: Controllo alle 6
          en: Check at 6
        text:
          it: Un agente legge solo le pagine consentite e salva lo storico.
          en: An agent reads only allowed pages and stores the history.
      - title:
          it: Abbinamento
          en: Matching
        text:
          it: EAN e somiglianza del nome; se il match è incerto decidi tu.
          en: EAN and name similarity; you decide when a match is uncertain.
      - title:
          it: Tabella e alert
          en: Table and alerts
        text:
          it: Tuo prezzo, minimo, media e posizione, più grafico storico.
          en: Your price, minimum, average and position, plus history chart.
    - type: cards
      id: rules
      title:
        it: Regole di correttezza
        en: Fair-use rules
      items:
      - title:
          it: robots.txt e termini
          en: robots.txt and terms
        text:
          it: Se uno shop vieta la lettura automatica viene segnalato ed escluso.
          en: If a shop forbids automated reading, it is flagged and excluded.
      - title:
          it: Solo shop diretti
          en: Direct shops only
        text:
          it: Mai siti comparatori.
          en: Never comparison sites.
      - title:
          it: I tuoi dati sono tuoi
          en: Your data is yours
        text:
          it: Ogni cliente vede solo i propri cataloghi.
          en: Each customer sees only their own catalogues.
    - type: note
      content:
        it: Supporto alle decisioni commerciali. I prezzi sono quelli mostrati dagli shop al momento della lettura.
        en: Commercial decision support. Prices are those displayed by shops at read time.
  - key: market
    type: table
    title:
      it: Mercato per SKU
      en: Market by SKU
    source: collection:market
    export: true
    data:
      display: table
      fields:
      - key: sku
        label: SKU
      - key: name
        label:
          it: Prodotto
          en: Product
      - key: own_price
        label:
          it: Mio prezzo
          en: My price
        format: money
      - key: min_price
        label:
          it: Minimo
          en: Min
        format: money
      - key: avg_price
        label:
          it: Media mercato
          en: Market avg
        format: money
      - key: position
        label:
          it: Posizione
          en: Position
        format: badge
      - key: shops_count
        label:
          it: Shop
          en: Shops
        format: number
      - key: updated
        label:
          it: Aggiornato
          en: Updated
        format: date
      sort:
        field: updated
        dir: desc
      limit: 200
    roles:
    - user
    - admin
  - key: history
    type: chart
    title:
      it: Storico prezzi per SKU
      en: Price history by SKU
    source: collection:price_history
    param: sku
    data:
      display: chart
      chart: line
      fields:
      - key: date
        label: Date
        format: date
      - key: price
        label:
          it: Prezzo
          en: Price
        format: money
      sort:
        field: date
        dir: asc
      limit: 200
    roles:
    - user
    - admin
  - key: import
    type: new_run
    title:
      it: Importa catalogo
      en: Import catalogue
    roles:
    - user
    - admin
  - key: products
    type: table
    title:
      it: Prodotti
      en: Products
    source: collection:products
    export: true
    data:
      display: table
      fields:
      - key: sku
        label: SKU
      - key: ean
        label: EAN
      - key: name
        label:
          it: Nome
          en: Name
      - key: own_price
        label:
          it: Prezzo
          en: Price
        format: money
      - key: alert_below
        label:
          it: Soglia alert
          en: Alert threshold
        format: money
      limit: 200
    roles:
    - user
    - admin
  - key: add_product
    type: form
    title:
      it: Aggiungi / modifica prodotto
      en: Add / edit product
    collection: products
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Prodotto salvato
        en: Product saved
      redirect: products
    edit: true
    roles:
    - user
    - admin
  - key: shops
    type: table
    title:
      it: Shop concorrenti
      en: Competitor shops
    source: collection:shops
    data:
      display: table
      fields:
      - key: name
        label: Shop
      - key: domain
        label:
          it: Dominio
          en: Domain
      - key: robots_status
        label:
          it: robots.txt / termini
          en: robots.txt / terms
        format: badge
      - key: robots_note
        label:
          it: Nota
          en: Note
      - key: checked_at
        label:
          it: Verificato
          en: Checked
        format: date
      limit: 100
    roles:
    - user
    - admin
  - key: add_shop
    type: form
    title:
      it: Aggiungi shop
      en: Add shop
    collection: shops
    fields:
    - name
    - domain
    - active
    submit:
      label:
        it: Aggiungi
        en: Add
      message:
        it: 'Shop aggiunto: sarà verificato al prossimo controllo'
        en: 'Shop added: it will be checked on the next run'
      redirect: shops
    edit: true
    roles:
    - user
    - admin
  - key: matches
    type: approvals
    title:
      it: Match da confermare
      en: Matches to confirm
    approvals:
    - match_confirm
    roles:
    - user
    - admin
  - key: watches
    type: instances
    template: daily_watch
    title:
      it: Monitoraggio
      en: Monitoring
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - user
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: starter
      price: 29
      interval: month
      label:
        it: Starter — fino a 50 SKU
        en: Starter — up to 50 SKUs
      includes:
      - 50 SKU
      roles:
      - user
    - key: growth
      price: 79
      interval: month
      label:
        it: Growth — fino a 250 SKU
        en: Growth — up to 250 SKUs
      includes:
      - 250 SKU
      roles:
      - user
    - key: scale
      price: 199
      interval: month
      label:
        it: Scale — fino a 1000 SKU
        en: Scale — up to 1000 SKUs
      includes:
      - 1000 SKU
      roles:
      - user
  extensions:
  - key: plan_sku_cap
    description: The SKU cap per plan is enforced for products created through the importer; manual form entries are not counted
      by spec.limits yet.
  - key: cron_utc
    description: The daily run is scheduled at 05:00 UTC (06:00 CET in winter, 07:00 CEST in summer).
