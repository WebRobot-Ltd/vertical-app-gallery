apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: legami-kyc
  displayName: LegamiKYC
  tagline:
    it: Adeguata verifica e antiriciclaggio, con il grafo dei legami e un audit completo.
    en: Customer due diligence and AML, with a link graph and a full audit trail.
  description:
    it: 'Apri una pratica su una persona o una società, carica documenti e visure: un agente ricostruisce i legami (titolari
      effettivi, cariche, partecipazioni), cerca riscontri nelle liste sanzioni UE, ONU e OFAC e nelle notizie negative, e
      tu confermi o scarti ogni riscontro. Fascicolo esportabile e controlli periodici.'
    en: 'Open a case on a person or company, upload documents and company extracts: an agent maps the links (beneficial owners,
      offices, shareholdings), looks for matches in EU, UN and OFAC sanctions lists and in adverse media, and you confirm
      or discard each hit. Exportable file and periodic re-checks.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12294a'
      accent: '#0f7b6c'
      background: '#f6f8fb'
      foreground: '#14202e'
    fonts:
      body: Inter
      display: IBM Plex Serif
    wordmark:
    - text: Legami
      color: primary
    - text: KYC
      color: accent
    width: wide
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Fonti
        en: Sources
      href: '#fonti'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      label:
        it: Studio
        en: Firm
      assignedBy: signup
  limits:
  - action: agent:screener
    per: user
    max: 30
    window: day
    roles:
    - user
  agents:
  - key: screener
    role: main
    description: Extracts data from uploaded documents, maps the links between people and companies, screens sanctions lists
      and adverse media, records every potential hit for the operator.
    profile:
      inline:
        display_name: LegamiKYC screener
        crews:
        - id: screener
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You are a due-diligence analyst for professional firms under AML rules. For one subject (person
            or company) you: (1) take the data given by the operator and, if files were uploaded, extract identity data, offices,
            shareholdings and beneficial owners from them (for photos or scans call read_upload with the file id); (2) build
            the graph of links between people and companies (beneficial owners, officers, shareholders with % where known)
            and save each link with the tool save_link; (3) search for matches with fuzzy tolerance (transliteration, transposed
            or missing letters, name order, diacritics) in the PUBLIC sanctions lists of the EU (consolidated financial sanctions
            list), the UN Security Council and OFAC (SDN), and in adverse media from open sources, using the WebRobot MCP
            to fetch and scrape the official list files and web pages; do this for the subject and for every linked person
            or company; (4) for every potential hit call save_hit with matched_name, list (eu|un|ofac|adverse_media), similarity
            (0-100, honest estimate and explain how you got it in details), source_url, details, status pending. Never decide
            that a hit is a true match: the operator decides. Do not invent hits, sources or figures; say plainly what you
            could not check. PEP (politically exposed persons) screening needs licensed lists that are NOT connected: state
            this in the file and never claim a PEP check was done. Report structure, starting with a level-1 title ''# Fascicolo
            di verifica — <subject name>'' (in the report language): ## Subject data, ## Link graph (a table: from, to, relationship,
            %, source; plus an indented text tree), ## Sanctions lists checked (list, date of the list, result), ## Adverse
            media, ## Potential hits (table with similarity and source), ## Limits of this check, ## Suggested next steps.
            This is decision support, not legal advice or a risk rating given as fact.'
    goalTemplate: 'Subject type: {subject_type_label}

      Name: {name}

      {?birth_date}Date of birth / incorporation: {birth_date}{/birth_date}

      {?country}Country: {country}{/country}

      {?tax_id}Tax or registration number: {tax_id}{/tax_id}

      {?notes}Operator notes: {notes}{/notes}

      {?documents}Uploaded files: {documents}

      Text extracted from them:

      {documents_text}{/documents}

      Today is {date}. Write the file in the language with ISO code {lang}. Store the subject name in every hit as subject_name.'
    output: markdown
    appTools:
    - name: read_upload
      description: Read a file the operator uploaded (OCR included)
      action: read_file
    - name: save_hit
      description: Record a potential match for the operator to confirm or discard
      action: append
      collection: hits
      scope: user
    - name: save_link
      description: Record a link between two persons or companies
      action: append
      collection: links
      scope: user
    limits:
      maxTurns: 40
      maxBudgetUsd: 1.5
  - key: rescreener
    role: scheduled
    description: Periodic re-check of one subject against sanctions lists and adverse media.
    memory: instance
    writesTo:
      collection: rescreen_results
      parse: json_last
    output: markdown+json
    resultSchema:
      type: object
      properties:
        subject_name:
          type: string
        checked_on:
          type: string
        has_new_hits:
          type: string
          enum:
          - 'yes'
          - 'no'
        new_hits:
          type: string
    profile:
      inline:
        display_name: LegamiKYC re-screener
        crews:
        - id: rescreener
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You re-check one subject periodically against the public EU, UN and OFAC sanctions lists and open-source
            adverse media, with fuzzy name matching, using the WebRobot MCP to fetch official list files and web pages. Your
            memory holds the hits already reported: compare and report only NEW ones. Start with ''# <name> — re-check <date>''.
            Sections: ## New hits (matched name, list, similarity 0-100, source URL), ## Unchanged, ## Not checked. Never
            invent hits or sources; PEP lists are not connected. End with a fenced json block {"subject_name":…,"checked_on":…,"has_new_hits":"yes"|"no","new_hits":"short
            summary"}. Then call remember once with the list of all hits known so far (they replace the old ones).'
  templates:
  - key: periodic_check
    title:
      it: Controllo periodico
      en: Periodic re-check
    description:
      it: Rifà i controlli su un soggetto ogni settimana e ti avvisa se compare un nuovo riscontro.
      en: Re-runs the checks on a subject every week and alerts you when a new hit appears.
    agent: rescreener
    params:
    - name: name
      type: text
      required: true
      label:
        it: Nome o ragione sociale
        en: Name or company name
    - name: subject_type
      type: select
      required: true
      label:
        it: Tipo
        en: Type
      options:
      - value: person
        label:
          it: Persona
          en: Person
      - value: company
        label:
          it: Società
          en: Company
    - name: birth_date
      type: text
      label:
        it: Data di nascita / costituzione
        en: Date of birth / incorporation
    - name: country
      type: country
      label:
        it: Paese
        en: Country
    goal: 'Re-check "{instance}": {subject_type} {name}, born/incorporated {birth_date}, country {country}. Today is {date}.
      Write in the language with ISO code {lang}.'
    schedule:
      cron: 0 6 * * 1
      userCanChange: true
    maxPerUser: 200
    cost:
      perRun: 5
  inputForm:
    title:
      it: Nuova pratica
      en: New case
    fields:
    - name: subject_type
      type: select
      required: true
      label:
        it: Tipo di soggetto
        en: Subject type
      options:
      - value: person
        label:
          it: Persona
          en: Person
      - value: company
        label:
          it: Società
          en: Company
    - name: name
      type: text
      required: true
      label:
        it: Nome e cognome / ragione sociale
        en: Full name / company name
    - name: birth_date
      type: text
      label:
        it: Data di nascita / costituzione
        en: Date of birth / incorporation
    - name: country
      type: country
      label:
        it: Paese
        en: Country
    - name: tax_id
      type: text
      label:
        it: Codice fiscale / P.IVA / n. registro
        en: Tax / registration number
    - name: documents
      type: file
      accept:
      - pdf
      - jpg
      - jpeg
      - png
      - docx
      maxMb: 10
      multiple: true
      label:
        it: Documenti di identità e visure
        en: ID documents and company extracts
      help:
        it: I dati vengono estratti dai file; i file restano privati del tuo studio.
        en: Data is extracted from the files; files stay private to your firm.
    - name: notes
      type: textarea
      maxLength: 600
      label:
        it: Note (facoltative)
        en: Notes (optional)
  data:
    collections:
    - name: hits
      ownedBy: user
      description: Potential matches found by the agent, decided by the operator
      retentionDays: 1825
      fields:
      - name: subject_name
        type: text
        label:
          it: Soggetto
          en: Subject
      - name: matched_name
        type: text
        label:
          it: Nome riscontrato
          en: Matched name
      - name: list
        type: select
        label:
          it: Fonte
          en: Source
        options:
        - eu
        - un
        - ofac
        - adverse_media
      - name: similarity
        type: number
        label:
          it: Somiglianza (0-100)
          en: Similarity (0-100)
      - name: source_url
        type: url
        label: URL
      - name: details
        type: textarea
        label:
          it: Dettagli
          en: Details
      - name: status
        type: select
        label:
          it: Decisione
          en: Decision
        default: pending
        options:
        - value: pending
          label:
            it: Da valutare
            en: Pending
        - value: confirmed
          label:
            it: Confermato
            en: Confirmed
        - value: discarded
          label:
            it: Scartato
            en: Discarded
      - name: note
        type: textarea
        label:
          it: Motivazione
          en: Reason
    - name: links
      ownedBy: user
      description: Links between persons and companies
      retentionDays: 1825
      fields:
      - name: subject_name
        type: text
      - name: from_party
        type: text
        label:
          it: Da
          en: From
      - name: to_party
        type: text
        label:
          it: A
          en: To
      - name: relationship
        type: text
        label:
          it: Legame
          en: Relationship
      - name: percent
        type: number
        label: '%'
      - name: source
        type: text
        label:
          it: Fonte
          en: Source
    - name: decision_log
      ownedBy: user
      description: 'Audit trail: one record per decision on a hit'
      retentionDays: 3650
      fields:
      - name: subject_name
        type: text
      - name: matched_name
        type: text
      - name: list
        type: text
      - name: similarity
        type: number
      - name: status
        type: text
      - name: note
        type: text
    - name: rescreen_results
      ownedBy: instance
      description: Results of the periodic re-checks
      retentionDays: 1825
      fields:
      - name: subject_name
        type: text
      - name: checked_on
        type: text
      - name: has_new_hits
        type: text
      - name: new_hits
        type: textarea
  triggers:
  - key: audit_decision
    description: Every update of a hit is written to the audit log
    'on':
      collection: hits
      op: update
    write:
      collection: decision_log
      fields:
        subject_name: subject_name
        matched_name: matched_name
        list: list
        similarity: similarity
        status: status
        note: note
  - key: new_hit_alert
    description: Email alert when a periodic re-check finds a new hit
    'on':
      collection: rescreen_results
      op: insert
      where:
        has_new_hits: 'yes'
    notify:
      to: owner
      subject:
        it: 'LegamiKYC: nuovo riscontro su {record.subject_name}'
        en: 'LegamiKYC: new hit on {record.subject_name}'
      body:
        it: 'Il controllo periodico del {record.checked_on} ha trovato nuovi riscontri su {record.subject_name}:

          {record.new_hits}

          Accedi per confermarli o scartarli.'
        en: 'The periodic check of {record.checked_on} found new hits on {record.subject_name}:

          {record.new_hits}

          Sign in to confirm or discard them.'
      link: hits
  views:
  - key: home
    type: page
    nav: false
    title: LegamiKYC
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow:
        it: Per studi professionali e intermediari
        en: For professional firms and intermediaries
      title:
        it: Adeguata verifica con il **grafo dei legami** e un audit completo.
        en: Due diligence with a **link graph** and a full audit trail.
      text:
        it: 'Apri una pratica, carica documenti e visure: l''agente ricostruisce titolari effettivi e partecipazioni, cerca
          riscontri nelle liste sanzioni UE, ONU e OFAC e nelle notizie negative. Decidi tu, ogni decisione è tracciata.'
        en: 'Open a case, upload documents and company extracts: the agent maps beneficial owners and shareholdings and searches
          EU, UN and OFAC sanctions lists and adverse media. You decide, and every decision is traced.'
      actions:
      - label:
          it: Apri una pratica
          en: Open a case
        href: /v/new_case
        style: primary
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Apri la pratica
          en: Open the case
        text:
          it: Dati anagrafici oppure documenti di identità e visure da cui estrarli.
          en: Personal data, or ID documents and company extracts to read them from.
        badge: 📂
      - title:
          it: L'agente verifica
          en: The agent checks
        text:
          it: Grafo dei legami e ricerca con tolleranza agli errori di trascrizione.
          en: Link graph and search tolerant to transcription errors.
        badge: 🕸️
      - title:
          it: Confermi o scarti
          en: You confirm or discard
        text:
          it: Ogni riscontro mostra somiglianza e fonte; la decisione resta nel registro di audit.
          en: Each hit shows similarity and source; your decision is kept in the audit log.
        badge: ✅
      - title:
          it: Fascicolo e controlli periodici
          en: File and periodic re-checks
        text:
          it: Fascicolo stampabile ed esportabile; i controlli si ripetono e ti avvisano se c'è un nuovo riscontro.
          en: Printable, exportable file; checks repeat and alert you to any new hit.
        badge: 🔔
    - type: cards
      id: fonti
      title:
        it: Fonti
        en: Sources
      items:
      - title:
          it: Sanzioni UE, ONU, OFAC
          en: EU, UN, OFAC sanctions
        text:
          it: Liste pubbliche ufficiali.
          en: Official public lists.
      - title:
          it: Notizie negative
          en: Adverse media
        text:
          it: Fonti aperte sul web.
          en: Open web sources.
      - title:
          it: PEP
          en: PEP
        text:
          it: 'Richiede liste in licenza: non ancora collegate.'
          en: 'Needs licensed lists: not connected yet.'
    - type: note
      content:
        it: Supporto alla decisione, non consulenza legale né valutazione del rischio vincolante. Le pratiche di ogni studio
          sono visibili solo a quello studio.
        en: Decision support, not legal advice or a binding risk rating. Each firm sees only its own cases.
  - key: new_case
    type: new_run
    title:
      it: Nuova pratica
      en: New case
    roles:
    - user
    - admin
  - key: cases
    type: history
    title:
      it: Pratiche
      en: Cases
    source: run
    roles:
    - user
    - admin
  - key: case_file
    type: report
    title:
      it: Fascicolo
      en: File
    source: run
    printable: true
    nav: false
  - key: hits
    type: table
    title:
      it: Riscontri
      en: Hits
    source: collection:hits
    columns:
    - subject_name
    - matched_name
    - list
    - similarity
    - source_url
    - status
    export: true
    roles:
    - user
    - admin
  - key: review_hit
    type: form
    title:
      it: Decidi sul riscontro
      en: Decide on the hit
    collection: hits
    fields:
    - status
    - note
    edit: true
    submit:
      label:
        it: Registra decisione
        en: Record decision
      message:
        it: Decisione registrata nell'audit.
        en: Decision recorded in the audit log.
      redirect: hits
    nav: false
    roles:
    - user
    - admin
  - key: links_view
    type: table
    title:
      it: Legami
      en: Links
    source: collection:links
    columns:
    - subject_name
    - from_party
    - relationship
    - to_party
    - percent
    - source
    export: true
    roles:
    - user
    - admin
  - key: audit
    type: table
    title:
      it: Registro di audit
      en: Audit log
    source: collection:decision_log
    columns:
    - subject_name
    - matched_name
    - list
    - similarity
    - status
    - note
    export: true
    roles:
    - user
    - admin
  - key: watches
    type: instances
    template: periodic_check
    title:
      it: Controlli periodici
      en: Periodic checks
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento e crediti
      en: Plan and credits
    roles:
    - user
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 30
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:screener:
        estimate: 60
        metered: true
    packs:
    - key: verifiche_100
      credits: 1000
      price: 15
      label:
        it: 1.000 crediti
        en: 1,000 credits
    - key: verifiche_500
      credits: 5000
      price: 60
      label:
        it: 5.000 crediti
        en: 5,000 credits
    plans:
    - key: studio
      price: 49
      interval: month
      credits: 500
      creditsReset: monthly
      label:
        it: Studio
        en: Firm
      includes:
      - cases, hits, audit log, export
      - periodic re-checks
  extensions:
  - key: pep_lists
    description: PEP screening needs licensed lists (not connected). Add a licensed provider with an API key as a credential
      later.
  - key: outbound_webhook
    description: Alerts for new hits during periodic re-checks go by email to the firm; an outbound webhook to the firm's
      systems is not available yet.
  - key: pdf_dossier
    description: The file is printable (PDF) from the report view; hits, links and audit log export as CSV.
