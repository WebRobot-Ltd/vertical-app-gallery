apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: legamikyc
  displayName: LegamiKYC
  tagline:
    it: Adeguata verifica e antiriciclaggio, con i legami in chiaro e ogni decisione tracciata.
    en: Due diligence and AML, with the links made clear and every decision traced.
  description:
    it: 'Apri una pratica su una persona o una società: un agente ricostruisce il grafo dei legami (titolari effettivi, cariche,
      partecipazioni), cerca riscontri nelle liste pubbliche di sanzioni UE, ONU e OFAC e nelle notizie negative, e ti propone
      ogni possibile riscontro con fonte e livello di somiglianza. Tu confermi o scarti, e la decisione resta nel registro
      di audit.'
    en: 'Open a case on a person or a company: an agent rebuilds the link graph (beneficial owners, offices, shareholdings),
      looks for matches in the public EU, UN and OFAC sanctions lists and in adverse media, and shows you each potential match
      with its source and similarity level. You confirm or discard, and the decision stays in the audit log.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12263f'
      accent: '#0f7b6c'
      background: '#f6f8fa'
      foreground: '#16202b'
    fonts:
      body: Inter
      display: Source Serif 4
    wordmark:
    - text: Legami
      color: primary
    - text: KYC
      color: accent
    width: wide
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Fonti
        en: Sources
      href: '#fonti'
    cta:
      label:
        it: Apri una pratica
        en: Open a case
      href: /v/new_case
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      label:
        it: Studio
        en: Firm
      assignedBy: signup
  limits:
  - action: agent:analyst
    per: user
    max: 30
    window: day
    roles:
    - user
  agents:
  - key: analyst
    role: main
    description: Builds the link graph, screens against public sanctions lists and adverse media, asks the operator to confirm
      or discard each potential match.
    profile:
      inline:
        display_name: LegamiKYC analyst
        crews:
        - id: analyst
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 2.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You are a KYC / AML due-diligence analyst supporting professional firms and intermediaries. You
            receive the data of a subject (person or company), possibly with pasted text of ID documents or company registry
            extracts (visure). Work only from the given data and from open sources you reach through the WebRobot MCP (scraping
            public pages, running pipelines).


            Steps:

            1. Extract and normalise the subject''s data from the form and pasted text. List what is missing.

            2. Build the link graph: beneficial owners (with % held and threshold), officers and roles, shareholdings, other
            companies linked to the same people. Show it as a table of edges (From | Link | To | Source) and a short indented
            tree. Mark each link as documented (source given) or to verify. Never invent links.

            3. Screen the subject and every person/company in the graph against the public EU consolidated financial sanctions
            list, the UN Security Council consolidated list and the OFAC SDN/consolidated lists, fetched from their official
            public pages. Use tolerant matching: transliteration variants, diacritics, name order, initials, typos. For each
            potential match give: matched name, list, list entry id or URL, similarity (High / Medium / Low with a short reason:
            shared date of birth, country, aliases), and the elements that differ.

            4. Search open sources for adverse media (financial crime, corruption, fraud, terrorism financing, sanctions evasion)
            about the subject and the linked parties; report title, outlet, date, URL and why it is relevant. Distinguish
            confirmed facts from allegations.

            5. PEP status: you have NO licensed PEP list. State clearly that PEP screening requires a licensed list integration
            and report only open-source indications, labelled as not exhaustive.

            6. For every potential match with similarity Medium or High, call the approval tool request_match_review with
            fields: case reference, subject, matched name, source, similarity, evidence. Then continue; the operator decides.
            Use the tool log_decision to record every decision outcome you are told about and every screening performed (timestamp,
            list, query).


            Final report format (a level-1 title first): "# KYC file — <subject name> — <date>" then sections ## Subject data,
            ## Link graph, ## Sanctions screening (with a table of matches: Name | List | Similarity | Source | Status), ##
            Adverse media, ## PEP, ## Gaps and documents to obtain, ## Methodology and sources (lists queried with dates and
            versions), ## Operator decisions (pending/confirmed/discarded). Add a risk indication (Low / Medium / High) as
            support to the operator, never as a final decision. You do not take compliance decisions and do not give legal
            advice; the responsibility stays with the obliged entity. Never invent figures, identifiers or sources. Write
            in the language requested.'
    awaits:
    - match_review
    appTools:
    - name: log_decision
      description: Append an entry to the firm's audit log (screening performed or decision recorded)
      action: append
      collection: audit_log
      scope: user
    context: []
    goalTemplate: 'Open a KYC case. Reference: {case_ref}.

      Subject type: {subject_type_label}

      Name: {name}

      {?birth_date}Date of birth / incorporation: {birth_date}{/birth_date}

      {?country}Country: {country}{/country}

      {?tax_id}Tax code / VAT / registration number: {tax_id}{/tax_id}

      {?registry_text}Pasted text of ID documents or company registry extract:

      {registry_text}{/registry_text}

      {?doc_link}Document links: {doc_link}{/doc_link}

      {?notes}Operator notes: {notes}{/notes}

      Today is {date}. Write the file in the language with ISO code {lang}.'
    output: markdown
    limits:
      maxTurns: 40
      maxBudgetUsd: 2.0
  - key: monitor
    role: scheduled
    description: 'Periodic re-screening of one subject: reports only new or changed matches since the last check.'
    memory: instance
    writesTo:
      collection: watch_findings
    profile:
      inline:
        display_name: LegamiKYC monitor
        crews:
        - id: monitor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You re-run the KYC screening of one subject: public EU, UN and OFAC sanctions lists (tolerant name
            matching) and open-source adverse media, through the WebRobot MCP. Your memory holds the matches already seen
            and decided: do not repeat them, report only NEW or CHANGED ones. Start with "# Re-screening — <subject> — <date>".
            Sections: ## New matches (Name | List | Similarity | Source | Why), ## Changes, ## No change. If nothing is new,
            say so in one line. Never invent sources or figures; you do not take compliance decisions. At the end call the
            tool remember once with the list of matches seen so far (they replace the old ones). Write in the language requested.'
  templates:
  - key: kyc_watch
    title:
      it: Monitoraggio periodico
      en: Periodic monitoring
    description:
      it: Rifà ogni settimana i controlli su un soggetto e segnala solo i nuovi riscontri.
      en: Re-runs the checks on a subject every week and reports only new matches.
    agent: monitor
    params:
    - name: name
      type: text
      required: true
      label:
        it: Nome o ragione sociale
        en: Name or company name
    - name: subject_type
      type: select
      required: true
      label:
        it: Tipo
        en: Type
      options:
      - value: person
        label:
          it: Persona
          en: Person
      - value: company
        label:
          it: Azienda
          en: Company
    - name: birth_date
      type: text
      label:
        it: Data di nascita / costituzione
        en: Date of birth / incorporation
    - name: country
      type: country
      label:
        it: Paese
        en: Country
    - name: tax_id
      type: text
      label:
        it: Codice fiscale / P.IVA
        en: Tax code / VAT
    goal: 'Re-screen "{instance}": {name} ({subject_type}). Date of birth/incorporation: {birth_date}. Country: {country}.
      Tax id: {tax_id}. Today is {date}.

      Write the report in the language with ISO code {lang}.'
    schedule:
      cron: 0 6 * * 1
      userCanChange: true
    maxPerUser: 50
    cost:
      perRun: 5
  approvals:
  - key: match_review
    title:
      it: Verifica riscontro
      en: Match review
    description: The operator confirms or discards a potential sanctions or adverse-media match. The decision is kept for
      audit.
    decidedBy: requester
    fields:
    - case_ref
    - subject
    - matched_name
    - source
    - similarity
    - evidence
  inputForm:
    title:
      it: Nuova pratica
      en: New case
    fields:
    - name: case_ref
      type: text
      required: true
      label:
        it: Riferimento pratica
        en: Case reference
    - name: subject_type
      type: select
      required: true
      label:
        it: Tipo di soggetto
        en: Subject type
      options:
      - value: person
        label:
          it: Persona fisica
          en: Natural person
      - value: company
        label:
          it: Società / ente
          en: Company / entity
    - name: name
      type: text
      required: true
      label:
        it: Nome e cognome / ragione sociale
        en: Full name / company name
    - name: birth_date
      type: text
      label:
        it: Data di nascita / costituzione
        en: Date of birth / incorporation
    - name: country
      type: country
      label:
        it: Paese
        en: Country
    - name: tax_id
      type: text
      label:
        it: Codice fiscale / P.IVA / n. registro
        en: Tax code / VAT / registry no.
    - name: registry_text
      type: textarea
      maxLength: 8000
      label:
        it: Testo di documenti o visura (incolla)
        en: Text of documents or registry extract (paste)
      help:
        it: 'Il caricamento di file non è ancora disponibile: incolla il testo.'
        en: 'File upload is not available yet: paste the text.'
    - name: doc_link
      type: urls
      label:
        it: Link a documenti (facoltativo)
        en: Document links (optional)
    - name: notes
      type: textarea
      maxLength: 600
      label:
        it: Note (facoltative)
        en: Notes (optional)
  data:
    collections:
    - name: audit_log
      ownedBy: user
      description: 'Audit trail of the firm: screenings performed and operator decisions'
      fields:
      - name: case_ref
        type: text
      - name: subject
        type: text
      - name: matched_name
        type: text
      - name: source
        type: text
      - name: similarity
        type: text
      - name: decision
        type: text
      - name: note
        type: text
      - name: at
        type: date
    - name: watch_findings
      ownedBy: instance
      description: Results of each periodic re-screening
  views:
  - key: home
    type: page
    nav: false
    title: LegamiKYC
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow:
        it: Per studi professionali e intermediari
        en: For professional firms and intermediaries
      title:
        it: Adeguata verifica con i **legami in chiaro** e ogni decisione tracciata.
        en: Due diligence with the **links made clear** and every decision traced.
      text:
        it: Apri una pratica, l'agente ricostruisce il grafo di titolari effettivi, cariche e partecipazioni e cerca riscontri
          in sanzioni e notizie negative. Decidi tu, il registro resta.
        en: 'Open a case: the agent rebuilds the graph of beneficial owners, offices and shareholdings and looks for sanctions
          and adverse-media matches. You decide, the log remains.'
      actions:
      - label:
          it: Apri una pratica
          en: Open a case
        href: /v/new_case
        style: primary
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: ghost
      aside: <div style="padding:16px"><b>Fascicolo di verifica / KYC file</b><br>Grafo dei legami · Sanzioni UE/ONU/OFAC
        · Adverse media · Decisioni dell'operatore<br><small>Link graph · EU/UN/OFAC sanctions · Adverse media · Operator
        decisions</small></div>
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Apri la pratica
          en: Open the case
        text:
          it: Inserisci i dati anagrafici o incolla il testo di documenti e visure.
          en: Enter the subject's data or paste the text of documents and registry extracts.
        badge: '1'
      - title:
          it: L'agente verifica
          en: The agent screens
        text:
          it: Grafo dei legami, liste di sanzioni con tolleranza agli errori di trascrizione, notizie negative.
          en: Link graph, sanctions lists with tolerance to transcription errors, adverse media.
        badge: '2'
      - title:
          it: Confermi o scarti
          en: You confirm or discard
        text:
          it: Ogni possibile riscontro arriva con fonte e somiglianza; la tua decisione è registrata.
          en: Each potential match comes with source and similarity; your decision is logged.
        badge: '3'
      - title:
          it: Fascicolo e monitoraggio
          en: File and monitoring
        text:
          it: Esporti il fascicolo e attivi controlli periodici sui nuovi riscontri.
          en: Export the file and enable periodic checks for new matches.
        badge: '4'
    - type: cards
      id: fonti
      title:
        it: Fonti
        en: Sources
      items:
      - title:
          it: Sanzioni
          en: Sanctions
        text:
          it: Liste consolidate pubbliche UE, ONU (Consiglio di Sicurezza) e OFAC.
          en: 'Public consolidated lists: EU, UN Security Council and OFAC.'
      - title:
          it: Notizie negative
          en: Adverse media
        text:
          it: Fonti aperte, con data, testata e link.
          en: Open sources, with date, outlet and link.
      - title:
          it: PEP
          en: PEP
        text:
          it: 'Richiede l''integrazione di liste in licenza: non inclusa, solo indicazioni da fonti aperte.'
          en: 'Requires a licensed list integration: not included, only open-source indications.'
    - type: note
      content:
        it: 'Strumento di supporto: non sostituisce la valutazione dell''operatore né costituisce consulenza legale. La responsabilità
          resta del soggetto obbligato.'
        en: 'Support tool: it does not replace the operator''s assessment nor is it legal advice. Responsibility stays with
          the obliged entity.'
  - key: new_case
    type: new_run
    title:
      it: Nuova pratica
      en: New case
    roles:
    - user
    - admin
  - key: cases
    type: history
    title:
      it: Le mie pratiche
      en: My cases
    source: run
    roles:
    - user
    - admin
  - key: case_file
    type: report
    title:
      it: Fascicolo
      en: KYC file
    source: run
    printable: true
    nav: false
  - key: reviews
    type: approvals
    title:
      it: Riscontri da verificare
      en: Matches to review
    approvals:
    - match_review
    roles:
    - user
    - admin
  - key: audit
    type: table
    title:
      it: Registro di audit
      en: Audit log
    source: collection:audit_log
    data:
      display: table
      fields:
      - key: at
        label:
          it: Data
          en: Date
        format: date
      - key: case_ref
        label:
          it: Pratica
          en: Case
      - key: subject
        label:
          it: Soggetto
          en: Subject
      - key: matched_name
        label:
          it: Riscontro
          en: Match
      - key: source
        label:
          it: Fonte
          en: Source
      - key: similarity
        label:
          it: Somiglianza
          en: Similarity
        format: badge
      - key: decision
        label:
          it: Decisione
          en: Decision
        format: badge
      - key: note
        label:
          it: Nota
          en: Note
      sort:
        field: at
        dir: desc
      limit: 200
      empty:
        it: Nessuna decisione registrata.
        en: No decisions logged yet.
    roles:
    - user
    - admin
  - key: watches
    type: instances
    template: kyc_watch
    title:
      it: Monitoraggio
      en: Monitoring
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento e crediti
      en: Plan and credits
    roles:
    - user
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 30
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:analyst:
        estimate: 40
        metered: true
    packs:
    - key: verifiche_100
      credits: 1000
      price: 12
      label: 1000 crediti
    - key: verifiche_500
      credits: 5000
      price: 50
      label: 5000 crediti
    plans:
    - key: studio
      price: 49
      interval: month
      label:
        it: Studio — mensile
        en: Firm — monthly
      includes:
      - Unlimited cases workspace, audit log, periodic monitoring
      credits: 500
      creditsReset: monthly
      roles:
      - user
  extensions:
  - key: file_upload
    description: 'Uploading ID documents and company registry extracts to extract data from is not available yet: the form
      asks to paste the text or give a link.'
  - key: webhook_alerts
    description: 'Notifying new matches from periodic re-screening by outbound webhook (or email) is not available yet: new
      matches appear in the monitoring view only.'
  - key: licensed_pep_lists
    description: PEP screening needs a licensed list integration (commercial provider with its own credentials/licence); not
      included, the agent reports open-source indications only.
  - key: case_file_export
    description: The case file is exported by printing the report view (PDF); a structured export bundle with decisions is
      not available yet.
