apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: ospiterelazione
  displayName: OspiteRelazione
  tagline:
    it: Il CRM intelligente che cura il rapporto con i tuoi ospiti.
    en: The smart CRM that nurtures your guest relationships.
    de: Das intelligente CRM für die Pflege Ihrer Gästebeziehungen.
  description:
    it: Importa prenotazioni e contatti dal tuo gestionale (export), crea una scheda per ogni ospite, segmenta e invia email
      personalizzate agli eventi del soggiorno.
    en: Import reservations and contacts from your PMS export, build a profile for each guest, segment them and send personalised
      emails at stay events.
    de: Importieren Sie Reservierungen und Kontakte aus Ihrem PMS-Export, erstellen Sie Gästeprofile, segmentieren Sie und
      senden Sie personalisierte E-Mails zu Aufenthaltsereignissen.
  langs:
  - it
  - en
  - de
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f3a4d'
      accent: '#b9803a'
      background: '#faf8f4'
      foreground: '#1c2530'
    fonts:
      body: Inter
      display: Playfair Display
    wordmark:
    - text: Ospite
      color: primary
    - text: Relazione
      color: accent
    buttonShape: rounded
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
        de: So funktioniert's
      href: '#come-funziona'
    - label:
        it: Eventi
        en: Events
        de: Ereignisse
      href: '#eventi'
    cta:
      label:
        it: Accedi
        en: Sign in
        de: Anmelden
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      label:
        it: Direttore
        en: Director
        de: Direktion
      assignedBy: signup
    - key: staff
      label:
        it: Personale
        en: Staff
        de: Personal
      assignedBy: invite
  limits:
  - action: agent:importer
    per: user
    max: 10
    window: day
    roles:
    - user
  - action: create:guests
    max: 2000
    window: total
    plans:
      rooms_80: 8000
      rooms_200: -1
  agents:
  - key: importer
    role: main
    description: Reads a PMS export and builds guest profiles, segments and reservations.
    profile:
      inline:
        display_name: OspiteRelazione importer
        crews:
        - id: importer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are a guest-relations analyst for a hotel. You receive a PMS export (reservations, stays, contacts).
            For each distinct guest (match by email, else name+phone) call save_guest once with: name, email, phone, lang
            (it|en|de), country, stays (number), nights_total, total_spent (number, only if present), first_stay (YYYY-MM-DD),
            last_stay, anniversary_date (next anniversary of first_stay, YYYY-MM-DD), preferences (short text from notes:
            room type, allergies, requests), segment (one of first_visit, loyal, business, family: loyal = 3+ stays; business
            = mostly weekday stays, single traveller or company; family = children or family rooms; otherwise first_visit),
            value_score (1-5), and members = the staff emails given in the goal as a list plus the director''s. For each future
            or current reservation call save_reservation with guest_name, email, lang, segment, arrival_date, departure_date,
            status (confirmed|cancelled), room_type, channel, and the same members. Never invent data: leave a field empty
            when the export lacks it. If the file is a photo or scan, open it with read_upload. Finish with a report starting
            with ''# Import ospiti — <property>'' with sections ## Summary (counts), ## Segments (a table plus a chart), ##
            Data quality issues, ## Suggested next steps. Add a ```chart block with the segment counts.'
          mcp_servers: []
    goalTemplate: 'Property: {property}

      Staff emails with access: {?staff_emails}{staff_emails}{/staff_emails}{!staff_emails}none{/staff_emails}

      Director email: {user}

      PMS export text:

      {pms_export_text}

      File ids: {pms_export}

      Today is {date}. Write the report in the language with ISO code {lang}.'
    appTools:
    - name: save_guest
      description: Create or update a guest profile
      action: write
      collection: guests
      scope: user
    - name: save_reservation
      description: Create or update a reservation
      action: write
      collection: reservations
      scope: user
    - name: read_upload
      description: Read a file the user uploaded
      action: read_file
    output: markdown
    limits:
      maxTurns: 40
      maxBudgetUsd: 0.6
  - key: composer
    role: helper
    description: Writes the personalised email for a stay event from the approved templates.
    profile:
      inline:
        display_name: OspiteRelazione composer
        crews:
        - id: composer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write one personalised guest email for a hotel, for the event described in the goal (confirmation,
            pre_arrival, checkout, anniversary). If the goal says the reservation status is cancelled, do nothing and say
            so. Call read_templates and use ONLY an approved template (status approved) of the same kind and the guest''s
            language; if none exists, do nothing and say so. Call read_guest_profile to personalise by segment, preferences
            and past stays: confirmation = useful info; pre_arrival = practical info plus relevant extra services; checkout
            = thanks plus a review request; anniversary = warm message plus a direct-booking offer. Plain text, under 150
            words, written in the guest''s language, signed by the property. Never invent prices, offers or facilities not
            in the template. Then call save_outbox exactly once with guest_name, email, lang, kind, subject, body, status
            ''ready'', members (copy from the guest/reservation), created (today''s date). Reply with one line.'
    appTools:
    - name: read_templates
      description: Read the message templates
      action: read
      collection: templates
      scope: user
    - name: read_guest_profile
      description: Read guest profiles
      action: read
      collection: guests
      scope: user
    - name: save_outbox
      description: Queue an email for sending
      action: write
      collection: outbox
      scope: user
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.2
  - key: template_writer
    role: helper
    description: Drafts message templates and asks the director to approve them.
    awaits:
    - template_approval
    profile:
      inline:
        display_name: OspiteRelazione template writer
        crews:
        - id: template_writer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write email templates for a hotel''s guest relations. When asked to draft: for the message kind
            and each requested language (it, en, de) save a template with save_template (kind, lang, subject, body, status
            ''draft''), body in plain text with a warm tone and no invented facts or prices, using clear slots the composer
            can fill (name, dates, hotel). Then call request_template_approval once, summarising the drafts. When the goal
            says an approval was decided, update the template(s) concerned with save_template: status ''approved'' if approved,
            ''rejected'' otherwise. Start your final answer with ''# Modelli — <kind>'' and list what you did.'
    goalTemplate: 'Draft the email templates for the kind: {kind_label}. Languages: {langs_label}. Tone: {?tone}{tone}{/tone}{!tone}warm
      and professional{/tone}. {?extras}Extra services to mention: {extras}{/extras} Property: {property}. Write the summary
      in the language with ISO code {lang}.'
    appTools:
    - name: save_template
      description: Create or update a message template
      action: write
      collection: templates
      scope: user
    output: markdown
    limits:
      maxTurns: 10
      maxBudgetUsd: 0.3
  approvals:
  - key: template_approval
    title:
      it: Approva i modelli dei messaggi
      en: Approve message templates
      de: Nachrichtenvorlagen freigeben
    decidedBy: requester
    fields:
    - kind
    - subject
    timeoutMinutes: 10080
  triggers:
  - key: on_confirmed
    description: Confirmation email when a reservation is confirmed
    'on':
      collection: reservations
      op: insert
      where:
        status: confirmed
    start:
      agent: composer
    goal: 'Event: confirmation. Guest {record.guest_name}, email {record.email}, language {record.lang}, segment {record.segment},
      arrival {record.arrival_date}, departure {record.departure_date}, room {record.room_type}, members {record.members}.'
  - key: pre_arrival
    'on':
      date:
        collection: reservations
        field: arrival_date
        offsetDays: -3
        hour: 8
    start:
      agent: composer
    goal: 'Event: pre_arrival (3 days before arrival). Reservation status {record.status}. Guest {record.guest_name}, email
      {record.email}, language {record.lang}, segment {record.segment}, arrival {record.arrival_date}, room {record.room_type},
      members {record.members}.'
  - key: checkout_day
    'on':
      date:
        collection: reservations
        field: departure_date
        offsetDays: 0
        hour: 10
    start:
      agent: composer
    goal: 'Event: checkout (departure day, ask for a review). Reservation status {record.status}. Guest {record.guest_name},
      email {record.email}, language {record.lang}, segment {record.segment}, members {record.members}.'
  - key: anniversary
    'on':
      date:
        collection: guests
        field: anniversary_date
        offsetDays: 0
        hour: 9
    start:
      agent: composer
    goal: 'Event: anniversary of the first stay. Guest {record.name}, email {record.email}, language {record.lang}, segment
      {record.segment}, first stay {record.first_stay}, members {record.members}.'
  - key: send_email
    description: Sends each queued email
    'on':
      collection: outbox
      op: insert
      where:
        status: ready
    notify:
      to: record.email
      subject: '{record.subject}'
      body: '{record.body}'
  - key: template_decided
    'on':
      approval: template_approval
      decision: any
    start:
      agent: template_writer
    goal: 'The approval was decided: {event}. Update the status of the templates concerned.'
  inputForm:
    title:
      it: Importa export PMS
      en: Import PMS export
      de: PMS-Export importieren
    fields:
    - name: property
      type: text
      required: true
      label:
        it: Struttura
        en: Property
        de: Unterkunft
    - name: pms_export
      type: file
      required: true
      accept:
      - csv
      - xlsx
      - json
      - pdf
      - txt
      maxMb: 15
      multiple: true
      label:
        it: Export prenotazioni e ospiti
        en: Reservations and guests export
        de: Export Reservierungen und Gäste
    - name: staff_emails
      type: textarea
      maxLength: 600
      label:
        it: Email del personale con accesso (separate da virgola)
        en: Staff emails with access (comma separated)
        de: E-Mails des Personals mit Zugriff (kommagetrennt)
  data:
    collections:
    - name: guests
      description: Guest profiles
      ownedBy: user
      retentionDays: 1825
      access:
      - role: staff
        where:
          members: '{user.email}'
        can:
        - read
        - write
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome
          en: Name
          de: Name
      - name: email
        type: email
      - name: phone
        type: text
      - name: lang
        type: select
        options:
        - it
        - en
        - de
      - name: country
        type: country
      - name: segment
        type: select
        options:
        - value: first_visit
          label:
            it: Prima visita
            en: First visit
            de: Erstbesuch
        - value: loyal
          label:
            it: Cliente fedele
            en: Loyal
            de: Stammgast
        - value: business
          label:
            it: Viaggiatore d'affari
            en: Business
            de: Geschäftsreisende
        - value: family
          label:
            it: Famiglia
            en: Family
            de: Familie
      - name: stays
        type: number
      - name: nights_total
        type: number
      - name: total_spent
        type: number
      - name: value_score
        type: number
      - name: first_stay
        type: date
      - name: last_stay
        type: date
      - name: anniversary_date
        type: date
      - name: preferences
        type: textarea
      - name: members
        type: array
    - name: reservations
      ownedBy: user
      retentionDays: 1825
      access:
      - role: staff
        where:
          members: '{user.email}'
        can:
        - read
        - write
      fields:
      - name: guest_name
        type: text
        required: true
      - name: email
        type: email
      - name: lang
        type: select
        options:
        - it
        - en
        - de
      - name: segment
        type: text
      - name: arrival_date
        type: date
        required: true
      - name: departure_date
        type: date
        required: true
      - name: status
        type: select
        options:
        - confirmed
        - cancelled
      - name: room_type
        type: text
      - name: channel
        type: text
      - name: members
        type: array
    - name: templates
      ownedBy: user
      fields:
      - name: kind
        type: select
        options:
        - confirmation
        - pre_arrival
        - checkout
        - anniversary
      - name: lang
        type: select
        options:
        - it
        - en
        - de
      - name: subject
        type: text
      - name: body
        type: textarea
      - name: status
        type: select
        options:
        - draft
        - approved
        - rejected
    - name: outbox
      description: Emails queued and sent
      ownedBy: user
      retentionDays: 730
      access:
      - role: staff
        where:
          members: '{user.email}'
      fields:
      - name: guest_name
        type: text
      - name: email
        type: email
      - name: lang
        type: text
      - name: kind
        type: text
      - name: subject
        type: text
      - name: body
        type: textarea
      - name: status
        type: text
      - name: created
        type: date
      - name: members
        type: array
    - name: direct_bookings
      description: Direct bookings attributed to campaigns
      ownedBy: user
      retentionDays: 1825
      fields:
      - name: guest_email
        type: email
      - name: kind
        type: text
      - name: value
        type: number
      - name: date
        type: date
  views:
  - key: home
    type: page
    nav: false
    title: OspiteRelazione
    sections:
    - type: hero
      layout: stack
      band: true
      eyebrow:
        it: CRM per hotel
        en: CRM for hotels
        de: CRM für Hotels
      title:
        it: Ospiti che **tornano**, con il messaggio giusto al momento giusto.
        en: Guests who **come back**, with the right message at the right time.
        de: Gäste, die **wiederkommen**, mit der richtigen Nachricht zur richtigen Zeit.
      text:
        it: 'Importa l''export del tuo gestionale: un agente crea la scheda di ogni ospite, li segmenta e invia email personalizzate
          agli eventi del soggiorno.'
        en: 'Import your PMS export: an agent builds each guest''s profile, segments them and sends personalised emails at
          stay events.'
        de: 'Importieren Sie Ihren PMS-Export: Ein Agent erstellt Gästeprofile, segmentiert und sendet personalisierte E-Mails
          zu Aufenthaltsereignissen.'
      actions:
      - label:
          it: Inizia
          en: Get started
          de: Loslegen
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
        de: So funktioniert's
      items:
      - title:
          it: Importa
          en: Import
          de: Importieren
        text:
          it: Carichi l'export del PMS con prenotazioni e contatti.
          en: Upload your PMS export with reservations and contacts.
          de: Laden Sie Ihren PMS-Export mit Reservierungen und Kontakten hoch.
        badge: 📥
      - title:
          it: Segmenta
          en: Segment
          de: Segmentieren
        text:
          it: Scheda ospite con storico, preferenze, valore e segmento.
          en: Guest profile with history, preferences, value and segment.
          de: Gästeprofil mit Historie, Präferenzen, Wert und Segment.
        badge: 🧩
      - title:
          it: Approva
          en: Approve
          de: Freigeben
        text:
          it: Il direttore approva i modelli dei messaggi.
          en: The director approves the message templates.
          de: Die Direktion gibt die Nachrichtenvorlagen frei.
        badge: ✅
      - title:
          it: Invia
          en: Send
          de: Senden
        text:
          it: Le email partono da sole agli eventi del soggiorno.
          en: Emails go out automatically at stay events.
          de: E-Mails werden automatisch zu Aufenthaltsereignissen versendet.
        badge: ✉️
    - type: cards
      id: eventi
      title:
        it: Eventi automatici
        en: Automatic events
        de: Automatische Ereignisse
      items:
      - title:
          it: Prenotazione confermata
          en: Booking confirmed
          de: Buchung bestätigt
        text:
          it: Conferma con informazioni utili.
          en: Confirmation with useful info.
          de: Bestätigung mit nützlichen Infos.
      - title:
          it: 3 giorni prima
          en: 3 days before
          de: 3 Tage vorher
        text:
          it: Servizi extra su misura.
          en: Tailored extra services.
          de: Maßgeschneiderte Zusatzleistungen.
      - title:
          it: Giorno della partenza
          en: Departure day
          de: Abreisetag
        text:
          it: Richiesta di recensione.
          en: Review request.
          de: Bewertungsanfrage.
      - title:
          it: Anniversario
          en: Anniversary
          de: Jahrestag
        text:
          it: Un invito a prenotare direttamente.
          en: An invitation to book direct.
          de: Eine Einladung zur Direktbuchung.
    - type: note
      content:
        it: 'I dati degli ospiti sono personali: usali nel rispetto del GDPR e del consenso al marketing.'
        en: 'Guest data is personal: use it in line with GDPR and marketing consent.'
        de: 'Gästedaten sind personenbezogen: Nutzung gemäß DSGVO und Marketing-Einwilligung.'
  - key: import
    type: new_run
    title:
      it: Importa ospiti
      en: Import guests
      de: Gäste importieren
    roles:
    - user
    - admin
  - key: imports
    type: history
    title:
      it: Importazioni
      en: Imports
      de: Importe
    source: run
    roles:
    - user
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: guests
    type: table
    title:
      it: Ospiti
      en: Guests
      de: Gäste
    source: collection:guests
    columns:
    - name
    - email
    - segment
    - stays
    - total_spent
    - last_stay
    - preferences
    export: true
    roles:
    - user
    - staff
    - admin
  - key: add_reservation
    type: form
    title:
      it: Nuova prenotazione
      en: New reservation
      de: Neue Reservierung
    collection: reservations
    fields:
    - guest_name
    - email
    - lang
    - arrival_date
    - departure_date
    - status
    - room_type
    submit:
      label:
        it: Salva
        en: Save
        de: Speichern
      message:
        it: Prenotazione salvata.
        en: Reservation saved.
        de: Reservierung gespeichert.
    roles:
    - user
    - staff
    - admin
  - key: reservations
    type: table
    title:
      it: Prenotazioni
      en: Reservations
      de: Reservierungen
    source: collection:reservations
    columns:
    - guest_name
    - arrival_date
    - departure_date
    - status
    - room_type
    - segment
    roles:
    - user
    - staff
    - admin
  - key: draft_templates
    type: new_run
    title:
      it: Scrivi modelli
      en: Draft templates
      de: Vorlagen erstellen
    roles:
    - user
    - admin
    nav: true
  - key: templates
    type: table
    title:
      it: Modelli
      en: Templates
      de: Vorlagen
    source: collection:templates
    columns:
    - kind
    - lang
    - subject
    - status
    roles:
    - user
    - admin
  - key: approvals
    type: approvals
    title:
      it: Approvazioni
      en: Approvals
      de: Freigaben
    approvals:
    - template_approval
    roles:
    - user
    - admin
  - key: messages
    type: table
    title:
      it: Email inviate
      en: Emails sent
      de: Gesendete E-Mails
    source: collection:outbox
    columns:
    - created
    - guest_name
    - kind
    - subject
    - status
    export: true
    roles:
    - user
    - staff
    - admin
  - key: dashboard
    type: page
    title:
      it: Dashboard
      en: Dashboard
      de: Dashboard
    roles:
    - user
    - admin
    sections:
    - type: data
      title:
        it: Panoramica
        en: Overview
        de: Überblick
      source: collection:outbox
      display: kpi
      kpis:
      - label:
          it: Email inviate
          en: Emails sent
          de: Gesendete E-Mails
        agg: count
    - type: data
      title:
        it: Prenotazioni dirette generate
        en: Direct bookings generated
        de: Generierte Direktbuchungen
      source: collection:direct_bookings
      display: kpi
      kpis:
      - label:
          it: Prenotazioni
          en: Bookings
          de: Buchungen
        agg: count
      - label:
          it: Valore
          en: Value
          de: Wert
        agg: sum
        field: value
        format: money
    - type: data
      title:
        it: Segmenti
        en: Segments
        de: Segmente
      source: collection:guests
      display: chart
      chart: pie
      fields:
      - key: segment
      - key: count
      groupBy:
        field: segment
        aggs:
        - key: guests
          agg: count
    - type: data
      title:
        it: Email per mese
        en: Emails per month
        de: E-Mails pro Monat
      source: collection:outbox
      display: chart
      chart: bar
      fields:
      - key: created
      - key: count
      groupBy:
        field: created
        bucket: month
        aggs: []
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Plan
      de: Abonnement
    roles:
    - user
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: rooms_30
      price: 49
      interval: month
      label:
        it: Fino a 30 camere
        en: Up to 30 rooms
        de: Bis 30 Zimmer
    - key: rooms_80
      price: 99
      interval: month
      label:
        it: Fino a 80 camere
        en: Up to 80 rooms
        de: Bis 80 Zimmer
    - key: rooms_200
      price: 199
      interval: month
      label:
        it: Fino a 200 camere
        en: Up to 200 rooms
        de: Bis 200 Zimmer
  notifications:
    emailOnRunDone: true
  extensions:
  - key: pms_connector
    description: 'Direct PMS connection needs a specific vendor API (host and key): add it as a credential and http tool once
      the PMS is chosen. For now the export upload is used.'
  - key: open_rate_tracking
    description: 'Email open tracking is not available: the dashboard shows emails sent and direct bookings recorded in direct_bookings;
      open rates need a tracking provider.'
  - key: rooms_quota
