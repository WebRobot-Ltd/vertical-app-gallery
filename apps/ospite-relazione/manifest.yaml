apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: ospiterelazione
  displayName: OspiteRelazione
  tagline:
    it: Il CRM intelligente per curare il rapporto con i tuoi ospiti.
    en: The smart CRM that nurtures your guest relationships.
    de: Das intelligente CRM für die Pflege Ihrer Gästebeziehungen.
  description:
    it: Importa prenotazioni e contatti dal tuo gestionale, ottieni una scheda per ogni ospite, segmenti e modelli di email
      personalizzati da approvare.
    en: Import bookings and contacts from your PMS, get a card for every guest, segments and personalised email templates
      to approve.
    de: Importieren Sie Buchungen und Kontakte aus Ihrem PMS und erhalten Sie Gästeprofile, Segmente und personalisierte E-Mail-Vorlagen
      zur Freigabe.
  langs:
  - it
  - en
  - de
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f3a4d'
      accent: '#b8793a'
      background: '#fbf8f3'
      foreground: '#1c2329'
    fonts:
      body: Inter
      display: Playfair Display
    wordmark:
    - text: Ospite
      color: primary
    - text: Relazione
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
        de: So funktioniert's
      href: '#come-funziona'
    - label:
        it: Prezzi
        en: Pricing
        de: Preise
      href: '#prezzi'
    cta:
      label:
        it: Accedi
        en: Sign in
        de: Anmelden
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      label:
        it: Struttura
        en: Property
        de: Unterkunft
      assignedBy: signup
  limits:
  - action: run
    per: user
    max: 20
    window: day
    roles:
    - user
  agents:
  - key: profiler
    role: main
    description: Builds guest cards and segments from a pasted PMS export.
    when: mode == 'guests'
    profile:
      inline:
        display_name: OspiteRelazione guest profiler
        crews:
        - id: profiler
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are a guest-relations analyst for hotels. From the booking export pasted by the property, build
            one card per guest and group guests into segments: first visit, loyal guest, business traveller, family. Start
            with a level-1 title "# <Property> — Guest cards and segments". Then sections with ## headings: Summary (counts
            per segment, direct vs OTA bookings), Segments (a table: segment, guests, average stay value, recommended message),
            Guest cards (per guest: name, stays, last stay, preferences, estimated value, segment, next event such as anniversary
            of first stay), Data gaps. Add a chart block for guests per segment as a fenced block with language chart, containing
            JSON like {"type":"pie","title":"Segments","labels":["A"],"series":[{"name":"Guests","values":[1]}]}. Use only
            data present in the export; never invent figures or guests. Treat personal data with care and do not repeat it
            beyond what is needed. Write in the requested language.'
    goalTemplate: 'Property: {property}

      Rooms: {rooms}

      Booking export (pasted text or link):

      {export_text}

      {?notes}Notes: {notes}{/notes}

      Today is {date}. Write the report in the language with ISO code {lang}.'
    output: markdown
    writesTo:
      collection: guest_reports
      parse: whole
    limits:
      maxTurns: 6
      maxBudgetUsd: 0.8
  - key: composer
    role: helper
    description: Drafts the event-based email templates and asks the director to approve them.
    when: mode == 'templates'
    profile:
      inline:
        display_name: OspiteRelazione message composer
        crews:
        - id: composer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write personalised hotel guest emails. Start with a level-1 title "# <Property> — Message templates".
            Then one ## section per event: Booking confirmed (useful info), 3 days before arrival (extra services offer),
            Departure day (thanks), After check-out (review request), First-stay anniversary (direct booking offer). Each
            section has a subject line and a body with placeholders such as {guest_name}, {arrival_date}, {room_type}, adapted
            to the guest segment requested and to the tone of the property. Never invent prices, discounts or services that
            the property did not list. When the drafts are ready, call request_template_ok once and wait for the decision.
            Write in the requested language.'
    goalTemplate: 'Property: {property}

      Tone: {tone_label}

      Segment: {segment_label}

      {?notes}Services and offers to mention: {notes}{/notes}

      Today is {date}. Language ISO code: {lang}.'
    awaits:
    - template_ok
    output: markdown
    writesTo:
      collection: message_templates
      parse: markdown_sections
    limits:
      maxTurns: 6
      maxBudgetUsd: 0.5
  approvals:
  - key: template_ok
    title:
      it: Approva i modelli dei messaggi
      en: Approve message templates
      de: Nachrichtenvorlagen freigeben
    decidedBy: requester
    timeoutMinutes: 10080
  inputForm:
    title:
      it: Nuova elaborazione
      en: New task
      de: Neue Aufgabe
    fields:
    - name: mode
      type: select
      required: true
      label:
        it: Cosa vuoi fare
        en: What to do
        de: Aufgabe
      options:
      - value: guests
        label:
          it: Schede ospiti e segmenti
          en: Guest cards and segments
          de: Gästeprofile und Segmente
      - value: templates
        label:
          it: Modelli di email
          en: Email templates
          de: E-Mail-Vorlagen
    - name: property
      type: text
      required: true
      label:
        it: Struttura
        en: Property
        de: Unterkunft
    - name: rooms
      type: number
      label:
        it: Numero camere
        en: Rooms
        de: Zimmer
      visibleWhen: mode == 'guests'
    - name: export_text
      type: textarea
      maxLength: 20000
      label:
        it: Export prenotazioni (testo incollato o link)
        en: Booking export (pasted text or link)
        de: Buchungsexport (Text oder Link)
      visibleWhen: mode == 'guests'
    - name: segment
      type: select
      label:
        it: Segmento
        en: Segment
        de: Segment
      visibleWhen: mode == 'templates'
      options:
      - value: first
        label:
          it: Prima visita
          en: First visit
          de: Erstbesuch
      - value: loyal
        label:
          it: Cliente fedele
          en: Loyal guest
          de: Stammgast
      - value: business
        label:
          it: Viaggiatore d'affari
          en: Business traveller
          de: Geschäftsreisender
      - value: family
        label:
          it: Famiglia
          en: Family
          de: Familie
    - name: tone
      type: select
      label:
        it: Tono
        en: Tone
        de: Ton
      visibleWhen: mode == 'templates'
      options:
      - value: warm
        label:
          it: Caloroso
          en: Warm
          de: Herzlich
      - value: formal
        label:
          it: Formale
          en: Formal
          de: Förmlich
    - name: notes
      type: textarea
      maxLength: 600
      label:
        it: Note (facoltative)
        en: Notes (optional)
        de: Notizen (optional)
  data:
    collections:
    - name: guest_reports
      ownedBy: user
      description: Guest cards and segments reports of each property
    - name: message_templates
      ownedBy: user
      description: Approved email templates of each property
  views:
  - key: home
    type: page
    nav: false
    title: OspiteRelazione
    sections:
    - type: hero
      title:
        it: Ogni ospite **ricordato**, ogni soggiorno valorizzato.
        en: Every guest **remembered**, every stay valued.
        de: Jeder Gast **in Erinnerung**, jeder Aufenthalt wertvoll.
      text:
        it: Un agente AI trasforma l'export del tuo gestionale in schede ospite, segmenti e modelli di email personalizzati
          che il direttore approva.
        en: An AI agent turns your PMS export into guest cards, segments and personalised email templates that the director
          approves.
        de: Ein KI-Agent verwandelt Ihren PMS-Export in Gästeprofile, Segmente und personalisierte E-Mail-Vorlagen, die der
          Direktor freigibt.
      actions:
      - label:
          it: Inizia
          en: Get started
          de: Loslegen
        href: /v/new
        style: primary
      - label:
          it: Accedi
          en: Sign in
          de: Anmelden
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
        de: So funktioniert's
      items:
      - title:
          it: Importa
          en: Import
          de: Importieren
        text:
          it: Incolla l'export delle prenotazioni del tuo PMS.
          en: Paste your PMS booking export.
          de: Fügen Sie Ihren PMS-Buchungsexport ein.
        badge: 📥
      - title:
          it: Segmenta
          en: Segment
          de: Segmentieren
        text:
          it: 'Schede ospite e segmenti: prima visita, fedele, business, famiglia.'
          en: 'Guest cards and segments: first visit, loyal, business, family.'
          de: 'Gästeprofile und Segmente: Erstbesuch, Stammgast, Business, Familie.'
        badge: 👥
      - title:
          it: Approva
          en: Approve
          de: Freigeben
        text:
          it: Il direttore approva i modelli di email per ogni evento del soggiorno.
          en: The director approves email templates for each stay event.
          de: Der Direktor gibt E-Mail-Vorlagen für jedes Aufenthaltsereignis frei.
        badge: ✅
    - type: cards
      id: prezzi
      title:
        it: Abbonamento per numero di camere
        en: Subscription by number of rooms
        de: Abo nach Zimmerzahl
      items:
      - title: Small — 49 €
        text:
          it: Fino a 30 camere
          en: Up to 30 rooms
          de: Bis 30 Zimmer
      - title: Medium — 99 €
        text:
          it: Fino a 80 camere
          en: Up to 80 rooms
          de: Bis 80 Zimmer
      - title: Large — 199 €
        text:
          it: Oltre 80 camere
          en: Over 80 rooms
          de: Über 80 Zimmer
    - type: note
      content:
        it: Supporto alle decisioni commerciali. Tratta i dati degli ospiti nel rispetto del GDPR.
        en: Commercial decision support. Handle guest data in line with GDPR.
        de: Unterstützung für Geschäftsentscheidungen. Gästedaten DSGVO-konform behandeln.
  - key: new
    type: new_run
    title:
      it: Nuova elaborazione
      en: New task
      de: Neue Aufgabe
    roles:
    - user
    - admin
  - key: history
    type: history
    title:
      it: Storico
      en: History
      de: Verlauf
    source: run
    roles:
    - user
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: approve
    type: approvals
    title:
      it: Approvazioni
      en: Approvals
      de: Freigaben
    roles:
    - user
    - admin
  - key: dashboard
    type: page
    title:
      it: Dashboard
      en: Dashboard
      de: Dashboard
    roles:
    - user
    - admin
    sections:
    - type: data
      title:
        it: Report ospiti e segmenti
        en: Guest and segment reports
        de: Gäste- und Segmentberichte
      source: collection:guest_reports
      display: list
      fields:
      - key: title
        label: Report
      - key: createdAt
        label: Date
        format: date
      limit: 20
      empty:
        it: Nessun report ancora.
        en: No reports yet.
        de: Noch keine Berichte.
    - type: data
      title:
        it: Modelli di messaggio
        en: Message templates
        de: Nachrichtenvorlagen
      source: collection:message_templates
      display: list
      fields:
      - key: title
        label: Template
      - key: createdAt
        label: Date
        format: date
      limit: 20
      empty:
        it: Nessun modello ancora.
        en: No templates yet.
        de: Noch keine Vorlagen.
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Plan
      de: Abo
    roles:
    - user
  billing:
    modes:
    - subscription
    - credits
    signupCredits: 50
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:profiler:
        estimate: 10
        metered: true
      agent:composer:
        estimate: 10
        metered: true
    packs:
    - key: small
      credits: 500
      price: 10
      label: '500'
    plans:
    - key: small
      price: 49
      interval: month
      label: Small (≤30)
      credits: 500
      creditsReset: monthly
    - key: medium
      price: 99
      interval: month
      label: Medium (≤80)
      credits: 1200
      creditsReset: monthly
    - key: large
      price: 199
      interval: month
      label: Large (80+)
      credits: 3000
      creditsReset: monthly
  extensions:
  - key: pms_connection
    description: 'Connecting the PMS with authorised access and file upload are not available yet: the property pastes an
      export or a link.'
  - key: email_sending
    description: Automatic sending of emails on events (confirmation, 3 days before, departure, anniversary) is not available
      yet, so open rates and direct bookings generated cannot be measured; templates are drafted and approved only.
  - key: staff_access
    description: 'Separate staff accounts sharing one property''s guests are not available yet: records belong to the signed-up
      user.'
