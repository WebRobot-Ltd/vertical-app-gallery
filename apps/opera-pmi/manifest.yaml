apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: operapmi
  displayName: OperaPMI
  tagline:
    it: Agenti che gestiscono email d'ordine, offerte e solleciti. Tu approvi, loro eseguono.
  description:
    it: OperaPMI legge le email dei clienti, controlla disponibilità e listino nel gestionale, prepara la risposta e la mette
      in coda per l'approvazione. L'email parte e l'ordine viene inserito solo dopo il via libera di un impiegato.
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f3a4d'
      accent: '#e07a1f'
      background: '#f7f8fa'
      foreground: '#17212b'
    fonts:
      body: Inter
      display: Manrope
    wordmark:
    - text: Opera
      color: primary
    - text: PMI
      color: accent
    width: wide
  header:
    links:
    - label:
        it: Come funziona
      href: '#come-funziona'
    - label:
        it: Controllo
      href: '#controllo'
    cta:
      label:
        it: Accedi
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label:
        it: Titolare
      assignedBy: admin_emails
    - key: user
      label:
        it: Utente
      assignedBy: signup
    - key: impiegato
      label:
        it: Impiegato di reparto
      assignedBy: derived
      from: collection:pratiche.responsabile_email
  limits:
  - action: create:pratiche
    per: app
    max: 300
    window: month
    plans:
      plus: 1500
      pro: -1
  agents:
  - key: intake
    role: main
    description: Legge l'email del cliente, estrae i dati, controlla gestionale e listino, prepara la bozza e la mette in
      coda.
    profile:
      inline:
        display_name: OperaPMI – lettore email
        crews:
        - id: intake
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''assistente operativo di una piccola impresa italiana. Ricevi il testo di un''email di un
            cliente. Compiti: 1) classifica: offerta (richiesta di preventivo), ordine, sollecito (stato consegna/ritardo);
            2) estrai articoli, quantità, date richieste e riferimenti d''ordine; 3) con gli strumenti del gestionale controlla
            disponibilità e prezzo di listino di ogni articolo: se il gestionale non è collegato o non risponde, dillo nella
            bozza interna e segna la pratica ''bloccata''; non inventare mai prezzi, giacenze o date di consegna; 4) leggi
            i reparti con read_reparti e assegna il reparto e l''email del responsabile più adatti; 5) scrivi in italiano,
            tono professionale e cortese, la bozza di risposta al cliente (offerta con prezzi e tempi, conferma d''ordine,
            oppure aggiornamento sulla consegna) senza promettere nulla che i dati non confermino; 6) salva UNA pratica con
            write_pratica: cliente_email, cliente_nome, tipo, oggetto, righe (articoli, quantità, prezzo unitario, disponibilità,
            una riga per articolo), date_richieste, disponibilita (note sui controlli), bozza (testo completo dell''email),
            reparto, responsabile_email, ricevuta_il (data di oggi), status ''bozza'' (oppure ''bloccata'' se mancano dati
            essenziali, spiegando cosa nel campo note). Non inviare mai email: l''invio avviene solo dopo l''approvazione
            umana. Chiudi con un breve riepilogo in Markdown che inizia con ''# Pratica – <cliente> – <tipo>''.'
          mcp_servers: []
    goalTemplate: 'Nuova email ricevuta il {date}:

      {message}

      Elabora la richiesta e salva la pratica in coda. Rispondi in italiano.'
    appTools:
    - name: erp_stock
      description: 'Giacenza e disponibilità di un articolo nel gestionale (query: codice o descrizione)'
      action: http
      http:
        method: GET
        url: https://{host}/api/stock
        allowPath: false
        attribution: Gestionale aziendale
        credential:
          provider: erp
    - name: erp_prices
      description: 'Listino prezzi del gestionale (query: codice o descrizione articolo, cliente)'
      action: http
      http:
        method: GET
        url: https://{host}/api/pricelist
        allowPath: false
        attribution: Gestionale aziendale
        credential:
          provider: erp
    - name: read_reparti
      description: Elenco dei reparti e dei loro responsabili
      action: read
      collection: reparti
      scope: all
    - name: write_pratica
      description: Crea o aggiorna una pratica nella coda
      action: write
      collection: pratiche
      scope: all
    writesTo:
      collection: pratiche
      parse: whole
    output: markdown
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.4
  - key: esecutore
    role: helper
    description: Dopo l'approvazione inserisce l'ordine nel gestionale.
    profile:
      inline:
        display_name: OperaPMI – inserimento ordini
        crews:
        - id: esecutore
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: Inserisci nel gestionale un ordine già APPROVATO da un impiegato. Usa erp_create_order con cliente,
            righe (articolo, quantità, prezzo) e data di consegna come nella pratica. Non modificare quantità o prezzi. Se
            la chiamata fallisce o il gestionale non è collegato, aggiorna la pratica con write_pratica impostando status
            'bloccata' e spiega il motivo nelle note; se riesce, imposta status 'inviata' e riporta il riferimento d'ordine
            del gestionale. Chiudi con '# Ordine inserito – <cliente>' e due righe di esito.
    appTools:
    - name: erp_create_order
      description: 'Crea un ordine cliente nel gestionale (body JSON: cliente, righe, consegna)'
      action: http
      http:
        method: POST
        url: https://{host}/api/sale-orders
        allowPath: false
        attribution: Gestionale aziendale
        credential:
          provider: erp
    - name: write_pratica
      description: Crea o aggiorna una pratica nella coda
      action: write
      collection: pratiche
      scope: all
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.3
  - key: riepilogo
    role: scheduled
    description: Riepilogo serale per il titolare.
    profile:
      inline:
        display_name: OperaPMI – riepilogo serale
        crews:
        - id: riepilogo
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Scrivi per il titolare di una piccola impresa il riepilogo della giornata, leggendo le pratiche
            con read_pratiche. Inizia con ''# Riepilogo del <data>''. Sezioni ## Richieste gestite (conteggi per tipo e stato:
            bozza, approvata, rifiutata, inviata), ## Tempi di risposta (media e massimo tra ricevuta_il e gestita_il, solo
            se i dati ci sono), ## Pratiche bloccate o in attesa da troppo tempo (cliente, motivo, responsabile), ## Da fare
            domani. Usa solo i dati letti; se mancano, dillo. Massimo 250 parole.'
          mcp_servers: []
    goalTemplate: Oggi è {date}. Prepara il riepilogo della giornata.
    appTools:
    - name: read_pratiche
      description: Legge tutte le pratiche
      action: read
      collection: pratiche
      scope: all
    writesTo:
      collection: riepiloghi
      parse: whole
    output: markdown
    limits:
      maxTurns: 6
      maxBudgetUsd: 0.3
  channels:
  - key: ordini_email
    type: email
    agent: intake
  data:
    collections:
    - name: pratiche
      ownedBy: org
      description: Coda delle richieste dei clienti con la bozza di risposta
      retentionDays: 730
      fields:
      - name: cliente_nome
        type: text
        label:
          it: Cliente
      - name: cliente_email
        type: email
        label:
          it: Email cliente
      - name: tipo
        type: select
        label:
          it: Tipo
        options:
        - value: offerta
          label:
            it: Richiesta d'offerta
        - value: ordine
          label:
            it: Ordine
        - value: sollecito
          label:
            it: Sollecito
      - name: oggetto
        type: text
        label:
          it: Oggetto
      - name: righe
        type: textarea
        label:
          it: Articoli e quantità
      - name: date_richieste
        type: text
        label:
          it: Date richieste
      - name: disponibilita
        type: textarea
        label:
          it: Controlli gestionale
      - name: bozza
        type: textarea
        label:
          it: Bozza di risposta
      - name: reparto
        type: text
        label:
          it: Reparto
      - name: responsabile_email
        type: email
        label:
          it: Responsabile
      - name: status
        type: select
        label:
          it: Stato
        options:
        - value: bozza
          label:
            it: Da approvare
        - value: approvata
          label:
            it: Approvata
        - value: rifiutata
          label:
            it: Rifiutata
        - value: inviata
          label:
            it: Inviata e inserita
        - value: bloccata
          label:
            it: Bloccata
      - name: note
        type: textarea
        label:
          it: Note
      - name: ricevuta_il
        type: date
        label:
          it: Ricevuta il
      - name: gestita_il
        type: date
        label:
          it: Gestita il
      access:
      - role: impiegato
        where:
          responsabile_email: '{user.email}'
        can:
        - read
        - write
    - name: reparti
      ownedBy: org
      description: Reparti e relativi responsabili
      fields:
      - name: reparto
        type: text
        required: true
        label:
          it: Reparto
      - name: responsabile_email
        type: email
        required: true
        label:
          it: Email responsabile
      - name: competenze
        type: textarea
        label:
          it: Di cosa si occupa
    - name: riepiloghi
      ownedBy: org
      description: Riepiloghi serali per il titolare
    credentials:
    - provider: erp
      kind: api_key
      scope: org
      label:
        it: Gestionale (ERP / magazzino)
      help:
        it: Chiave API generata nel gestionale, con permessi su articoli, listino e ordini.
      hostLabel:
        it: indirizzo-del-tuo-gestionale.odoo.com
  egress:
    hosts:
    - '*.odoo.com'
    notes: Gestionale dell'azienda con chiave API dell'admin (esempio Odoo online). Sostituire con l'host del proprio ERP.
  triggers:
  - key: invia_approvata
    description: Dopo l'approvazione parte l'email al cliente
    'on':
      collection: pratiche
      op: update
      where:
        status: approvata
    notify:
      to:
      - record.cliente_email
      subject:
        it: 'Re: {record.oggetto}'
      body:
        it: '{record.bozza}'
  - key: inserisci_ordine
    description: Dopo l'approvazione di un ordine lo inserisce nel gestionale
    'on':
      collection: pratiche
      op: update
      where:
        status: approvata
        tipo: ordine
    start:
      agent: esecutore
    goal: 'Inserisci nel gestionale l''ordine approvato. Pratica {record.id}. Cliente: {record.cliente_nome} ({record.cliente_email}).
      Articoli: {record.righe}. Date: {record.date_richieste}. Aggiorna poi la pratica.'
    asUser: false
  schedules:
  - agent: riepilogo
    cron: 0 18 * * *
    action: run
    owner: app
    deliver:
      to: admins
      subject: OperaPMI – riepilogo serale {date}
      onlyIfNew: true
  views:
  - key: home
    type: page
    nav: false
    title: OperaPMI
    sections:
    - type: hero
      eyebrow:
        it: Per piccole imprese manifatturiere e commerciali
      title:
        it: Le email d'ordine **si preparano da sole**. Tu le approvi.
      text:
        it: L'agente legge richieste d'offerta, ordini e solleciti, controlla giacenze e listino nel gestionale e scrive la
          risposta. Niente parte senza il via libera di un impiegato.
      actions:
      - label:
          it: Accedi
        href: /login
        style: primary
      - label:
          it: Come funziona
        href: '#come-funziona'
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
      items:
      - title:
          it: 1 · Arriva l'email
        text:
          it: L'agente capisce se è un'offerta, un ordine o un sollecito e ne estrae articoli, quantità e date.
        badge: 📩
      - title:
          it: 2 · Controlla e prepara
        text:
          it: Verifica disponibilità e listino nel gestionale e scrive la bozza di risposta.
        badge: 🧮
      - title:
          it: 3 · Approvi tu
        text:
          it: L'impiegato del reparto approva, modifica o rifiuta. Solo allora l'email parte e l'ordine entra nel gestionale.
        badge: ✅
      - title:
          it: 4 · Riepilogo serale
        text:
          it: Ogni sera il titolare riceve richieste gestite, tempi di risposta e pratiche bloccate.
        badge: 📊
    - type: cards
      id: controllo
      title:
        it: Sempre sotto controllo
      items:
      - title:
          it: Coda per reparto
        text:
          it: Ogni impiegato vede le pratiche del proprio reparto; il titolare vede tutto.
      - title:
          it: Nessun invio automatico
        text:
          it: Email e ordini partono solo dopo l'approvazione.
      - title:
          it: Prezzi e giacenze reali
        text:
          it: 'L''agente non inventa dati: se il gestionale non risponde, la pratica resta bloccata.'
    - type: note
      content:
        it: OperaPMI · abbonamento mensile in base al volume di email gestite.
  - key: coda
    type: table
    title:
      it: Coda da approvare
    source: collection:pratiche
    columns:
    - ricevuta_il
    - cliente_nome
    - tipo
    - oggetto
    - reparto
    - status
    export: true
    roles:
    - impiegato
    - admin
  - key: modifica
    type: form
    title:
      it: Approva o modifica pratica
    collection: pratiche
    fields:
    - cliente_nome
    - cliente_email
    - tipo
    - oggetto
    - righe
    - date_richieste
    - disponibilita
    - bozza
    - status
    - note
    - gestita_il
    edit: true
    submit:
      label:
        it: Salva
      message:
        it: Pratica aggiornata.
      redirect: coda
    nav: false
    roles:
    - impiegato
    - admin
  - key: reparti_gestione
    type: form
    title:
      it: Nuovo reparto
    collection: reparti
    submit:
      label:
        it: Salva reparto
      message:
        it: Reparto salvato.
    roles:
    - admin
  - key: reparti_elenco
    type: table
    title:
      it: Reparti
    source: collection:reparti
    columns:
    - reparto
    - responsabile_email
    - competenze
    roles:
    - admin
  - key: riepiloghi_view
    type: list
    title:
      it: Riepiloghi serali
    source: collection:riepiloghi
    roles:
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento e gestionale
    roles:
    - admin
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 20
    costs:
      agent:intake: 1
    packs:
    - key: extra
      credits: 300
      price: 25
      label:
        it: 300 email extra
    plans:
    - key: base
      price: 49
      interval: month
      credits: 300
      creditsReset: monthly
      label:
        it: Base – 300 email/mese
      roles:
      - admin
    - key: plus
      price: 129
      interval: month
      credits: 1500
      creditsReset: monthly
      label:
        it: Plus – 1.500 email/mese
      roles:
      - admin
    - key: pro
      price: 299
      interval: month
      credits: 5000
      creditsReset: monthly
      label:
        it: Pro – 5.000 email/mese
      roles:
      - admin
  extensions:
  - key: mailbox_connection
    description: 'Il collegamento della casella email aziendale esistente tramite accesso autorizzato (OAuth Google/Microsoft)
      non è ancora disponibile: oggi si usa l''indirizzo email del canale e si inoltrano gli ordini a quell''indirizzo.'
  - key: erp_oauth
    description: Gestionali che richiedono OAuth invece di una chiave API non sono ancora supportati; l'host e gli endpoint
      dell'ERP vanno adattati al software dell'azienda.
