apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: primoimpiego
  displayName: PrimoImpiego
  tagline:
    it: Il primo lavoro giusto, per te e per l'azienda.
    en: The right first job, for you and the company.
  description:
    it: Mette in contatto giovani della Generazione Z e aziende che cercano stage e primi lavori, con una compatibilità calcolata
      da un agente AI.
    en: Connects Gen Z candidates with companies hiring interns and first-job profiles, with AI-computed compatibility.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f2a6b'
      accent: '#ff6b4a'
      background: '#f8f7ff'
      foreground: '#1a1c2e'
    fonts:
      body: Inter
      display: Poppins
    wordmark:
    - text: Primo
      color: primary
    - text: Impiego
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Prezzi
        en: Pricing
      href: '#prezzi'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
    - key: candidate
      label:
        it: Candidato
        en: Candidate
      assignedBy: derived
      from: collection:candidate_profiles.email
    - key: company
      label:
        it: Azienda
        en: Company
      assignedBy: derived
      from: collection:companies.email
  limits:
  - action: agent:candidate_matcher
    per: user
    max: 3
    window: day
  - action: agent:company_matcher
    per: user
    max: 10
    window: day
  agents:
  - key: candidate_matcher
    role: main
    when: side == 'candidate'
    description: Propone a un giovane le posizioni più adatte.
    profile:
      inline:
        display_name: PrimoImpiego – abbinamento candidati
        crews:
        - id: candidate_matcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un career coach per giovani della Generazione Z. Ricevi il profilo del candidato (interessi,
            competenze, valori, disponibilità, testo del CV se presente). Con search_positions leggi le posizioni aperte.
            Valuta la compatibilità di ciascuna su competenze, interessi, valori/cultura aziendale e sede, con un punteggio
            0-100 e motivazioni concrete. Seleziona le migliori 5 (punteggio >= 50) e per ciascuna salva un record con write_match
            (candidate_email, company_email, position_id, position_title, candidate_name, score, rationale, candidate_interest
            ''pending'', company_interest ''pending'', side_proposed ''candidate''). Se il CV è una foto/scansione leggila
            con read_upload. Non inventare dati, non discriminare per genere, origine, età o altro; usa solo informazioni
            del profilo. Report: inizia con un titolo ''# Le tue posizioni consigliate'', poi per ogni posizione: ## titolo
            – azienda (punteggio), perché è adatta, cosa migliorare. Chiudi con 3 consigli per il CV. Spiega che per aprire
            la chat devono esprimere interesse sia tu sia l''azienda.'
          mcp_servers: []
    goalTemplate: 'Candidato: {user}. Data: {date}.

      Profilo dal questionario:

      {profile}

      {?notes}Note: {notes}{/notes}

      Scrivi il report in lingua con codice ISO {lang}.'
    context:
    - key: profile
      from: collection:candidate_profiles
    appTools:
    - name: search_positions
      description: Cerca le posizioni aperte pubblicate dalle aziende
      action: search
      collection: positions
      scope: all
    - name: read_companies
      description: Legge i profili e la cultura delle aziende
      action: search
      collection: companies
      scope: all
    - name: write_match
      description: Salva una proposta di abbinamento
      action: write
      collection: matches
      scope: all
    - name: read_upload
      description: Legge un file caricato dall'utente
      action: read_file
    output: markdown
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.5
  - key: company_matcher
    role: main
    when: side == 'company'
    description: Propone a un'azienda una rosa di candidati per una posizione, solo tra chi ha accettato il contatto.
    profile:
      inline:
        display_name: PrimoImpiego – abbinamento aziende
        crews:
        - id: company_matcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 14
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un recruiter esperto di stage e primi lavori. Ricevi l''id di una posizione. Leggila con read_position
            e leggi la cultura dell''azienda con my_company. Con search_candidates ottieni i candidati: il sistema restituisce
            solo chi ha accettato il contatto; non cercare altri dati. Calcola per ciascuno la compatibilità (competenze,
            interessi, valori/cultura, sede, disponibilità) con punteggio 0-100 e motivazioni. Proponi una rosa di massimo
            8 profili con punteggio >= 50 e salva ciascuno con write_match (candidate_email, company_email, position_id, position_title,
            candidate_name, score, rationale, candidate_interest ''pending'', company_interest ''pending'', side_proposed
            ''company''). Valuta solo su informazioni del profilo; mai su genere, origine, età, religione o altre caratteristiche
            protette; non inventare. Se i candidati sono pochi dillo. Report: inizia con ''# Rosa di candidati – <posizione>'',
            una tabella (candidato, punteggio, punti di forza, punti da verificare), poi un breve confronto e le domande suggerite
            per il colloquio. Spiega che la chat si apre quando anche il candidato esprime interesse.'
          mcp_servers: []
    goalTemplate: 'Azienda: {user}. Posizione id: {position}.

      Profilo azienda:

      {company}

      {?notes}Note: {notes}{/notes}

      Data: {date}. Scrivi in lingua ISO {lang}.'
    context:
    - key: company
      from: collection:companies
    appTools:
    - name: read_position
      description: Legge le posizioni dell'azienda
      action: read
      collection: positions
      scope: user
    - name: my_company
      description: Legge il profilo e la cultura dell'azienda
      action: read
      collection: companies
      scope: user
    - name: search_candidates
      description: Cerca i profili dei candidati che hanno accettato il contatto
      action: search
      collection: candidate_profiles
      scope: all
    - name: write_match
      description: Salva una proposta di abbinamento
      action: write
      collection: matches
      scope: all
    output: markdown
    limits:
      maxTurns: 14
      maxBudgetUsd: 0.8
  inputForm:
    title:
      it: Trova abbinamenti
      en: Find matches
    fields:
    - name: side
      type: select
      required: true
      label:
        it: Sono
        en: I am
      options:
      - value: candidate
        label:
          it: Un giovane in cerca di lavoro
          en: A job seeker
      - value: company
        label:
          it: Un'azienda
          en: A company
    - name: position
      type: select
      optionsFrom: collection:positions
      visibleWhen: side == 'company'
      label:
        it: Posizione
        en: Position
    - name: notes
      type: textarea
      maxLength: 400
      label:
        it: Note (facoltative)
        en: Notes (optional)
  data:
    collections:
    - name: candidate_profiles
      description: Profilo e questionario del giovane. L'azienda vede solo chi ha contact_ok.
      ownedBy: user
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome
          en: Name
      - name: email
        type: email
        required: true
        label: Email
      - name: city
        type: city
        label:
          it: Città
          en: City
      - name: interests
        type: multiselect
        label:
          it: Interessi
          en: Interests
        options:
        - tecnologia
        - design
        - marketing
        - finanza
        - sostenibilità
        - sanità
        - media
        - ingegneria
        - vendite
        - risorse umane
      - name: skills
        type: textarea
        maxLength: 800
        label:
          it: Competenze
          en: Skills
      - name: values
        type: multiselect
        label:
          it: Valori sul lavoro
          en: Work values
        options:
        - flessibilità
        - crescita
        - impatto sociale
        - team
        - autonomia
        - stabilità
        - innovazione
        - equilibrio vita-lavoro
      - name: availability
        type: select
        label:
          it: Cerco
          en: Looking for
        options:
        - value: stage
          label: Stage
        - value: first_job
          label:
            it: Primo lavoro
            en: First job
        - value: both
          label:
            it: Entrambi
            en: Both
      - name: cv
        type: file
        accept:
        - pdf
        - docx
        maxMb: 10
        label: CV
      - name: contact_ok
        type: boolean
        default: false
        label:
          it: Accetto che le aziende vedano il mio profilo e mi contattino
          en: I agree companies can see my profile and contact me
      access:
      - role: company
        where:
          contact_ok: true
        can:
        - read
      retentionDays: 730
    - name: companies
      description: Profilo e cultura dell'azienda
      ownedBy: user
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Ragione sociale
          en: Company name
      - name: email
        type: email
        required: true
        label: Email
      - name: sector
        type: text
        label:
          it: Settore
          en: Sector
      - name: city
        type: city
        label:
          it: Sede
          en: Location
      - name: size
        type: select
        label:
          it: Dimensione
          en: Size
        options:
        - 1-10
        - 11-50
        - 51-250
        - 250+
      - name: culture
        type: textarea
        maxLength: 1200
        required: true
        label:
          it: Cultura e valori
          en: Culture and values
      access:
      - role: candidate
        can:
        - read
    - name: positions
      description: Posizioni pubblicate dalle aziende
      ownedBy: user
      fields:
      - name: company_email
        type: email
        required: true
        label: Email azienda
      - name: title
        type: text
        required: true
        label:
          it: Titolo
          en: Title
      - name: kind
        type: select
        label:
          it: Tipo
          en: Type
        options:
        - value: stage
          label: Stage
        - value: first_job
          label:
            it: Primo lavoro
            en: First job
      - name: description
        type: textarea
        maxLength: 1500
        label:
          it: Descrizione
          en: Description
      - name: requirements
        type: textarea
        maxLength: 800
        label:
          it: Competenze richieste
          en: Requirements
      - name: city
        type: city
        label:
          it: Sede
          en: Location
      - name: status
        type: select
        default: open
        label:
          it: Stato
          en: Status
        options:
        - value: open
          label:
            it: Aperta
            en: Open
        - value: closed
          label:
            it: Chiusa
            en: Closed
      access:
      - role: candidate
        where:
          status: open
        can:
        - read
    - name: matches
      description: Abbinamenti proposti e interesse delle due parti
      ownedBy: org
      fields:
      - name: candidate_email
        type: email
      - name: company_email
        type: email
      - name: candidate_name
        type: text
      - name: position_id
        type: text
      - name: position_title
        type: text
      - name: score
        type: number
      - name: rationale
        type: textarea
      - name: side_proposed
        type: text
      - name: candidate_interest
        type: select
        default: pending
        label:
          it: Il tuo interesse
          en: Your interest
        options:
        - value: pending
          label:
            it: Da decidere
            en: Pending
        - value: 'yes'
          label:
            it: Interessato
            en: Interested
        - value: 'no'
          label:
            it: Non interessato
            en: Not interested
      - name: company_interest
        type: select
        default: pending
        label:
          it: Il tuo interesse
          en: Your interest
        options:
        - value: pending
          label:
            it: Da decidere
            en: Pending
        - value: 'yes'
          label:
            it: Interessata
            en: Interested
        - value: 'no'
          label:
            it: Non interessata
            en: Not interested
      access:
      - role: candidate
        where:
          candidate_email: '{user.email}'
        can:
        - read
        - write
      - role: company
        where:
          company_email: '{user.email}'
        can:
        - read
        - write
      retentionDays: 730
    - name: messages
      description: Messaggi tra candidato e azienda dopo l'interesse reciproco
      ownedBy: org
      fields:
      - name: candidate_email
        type: email
        required: true
        label: Email candidato
      - name: company_email
        type: email
        required: true
        label: Email azienda
      - name: position_title
        type: text
        label:
          it: Posizione
          en: Position
      - name: text
        type: textarea
        required: true
        maxLength: 1000
        label:
          it: Messaggio
          en: Message
      access:
      - role: candidate
        where:
          candidate_email: '{user.email}'
        can:
        - read
        - write
      - role: company
        where:
          company_email: '{user.email}'
        can:
        - read
        - write
      retentionDays: 365
  views:
  - key: home
    type: page
    nav: false
    title: PrimoImpiego
    sections:
    - type: hero
      layout: stack
      band: true
      eyebrow:
        it: Per la Generazione Z
        en: For Gen Z
      title:
        it: Il tuo primo lavoro, **abbinato** a chi ti somiglia.
        en: Your first job, **matched** to who you are.
      text:
        it: Rispondi a un breve questionario, carica il CV e ricevi le posizioni più adatte. Le aziende ricevono una rosa
          di profili compatibili. Quando l'interesse è reciproco, si apre la chat.
        en: Answer a short questionnaire, upload your CV and get the best-fit positions. Companies get a shortlist of compatible
          profiles. When interest is mutual, chat opens.
      actions:
      - label:
          it: Sono un giovane
          en: I'm a candidate
        href: /v/profile
        style: primary
      - label:
          it: Sono un'azienda
          en: I'm a company
        href: /v/company
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Registrati
          en: Sign up
        text:
          it: Il giovane compila interessi, competenze, valori e CV. L'azienda descrive cultura e posizioni.
          en: Candidates fill in interests, skills, values and CV. Companies describe culture and positions.
        badge: 📝
      - title:
          it: Compatibilità
          en: Compatibility
        text:
          it: Un agente AI calcola il punteggio e spiega perché.
          en: An AI agent scores each pairing and explains why.
        badge: 🤝
      - title:
          it: Interesse reciproco
          en: Mutual interest
        text:
          it: 'Entrambi dicono sì: si apre la chat. L''azienda vede solo chi ha accettato il contatto.'
          en: 'Both say yes: chat opens. Companies only see candidates who agreed to contact.'
        badge: 💬
    - type: cards
      id: prezzi
      title:
        it: Prezzi
        en: Pricing
      items:
      - title:
          it: Giovani
          en: Candidates
        text:
          it: Gratis, sempre.
          en: Free, always.
      - title:
          it: Aziende
          en: Companies
        text:
          it: 'Abbonamento mensile: posizioni, rose di candidati e chat.'
          en: 'Monthly subscription: positions, shortlists and chat.'
    - type: note
      content:
        it: 'Le proposte dell''AI sono un supporto: la decisione resta a persone. I dati personali sono trattati nel rispetto
          del GDPR e cancellati dopo il periodo di conservazione.'
        en: AI suggestions are decision support; people decide. Personal data is handled under GDPR and deleted after the
          retention period.
  - key: profile
    type: form
    collection: candidate_profiles
    title:
      it: Il mio profilo
      en: My profile
    edit: false
    submit:
      label:
        it: Salva profilo
        en: Save profile
      message:
        it: Profilo salvato.
        en: Profile saved.
      redirect: new_run
  - key: company
    type: form
    collection: companies
    title:
      it: La mia azienda
      en: My company
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Azienda salvata.
        en: Company saved.
      redirect: position
  - key: position
    type: form
    collection: positions
    title:
      it: Nuova posizione
      en: New position
    roles:
    - company
    - user
    - admin
    edit: true
    submit:
      label:
        it: Pubblica
        en: Publish
      message:
        it: Posizione pubblicata.
        en: Position published.
      redirect: new_run
  - key: new_run
    type: new_run
    title:
      it: Trova abbinamenti
      en: Find matches
    roles:
    - user
    - candidate
    - company
    - admin
  - key: history
    type: history
    title:
      it: I miei report
      en: My reports
    source: run
    roles:
    - user
    - candidate
    - company
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: my_matches
    type: table
    title:
      it: I miei abbinamenti
      en: My matches
    source: collection:matches
    columns:
    - position_title
    - candidate_name
    - score
    - rationale
    - candidate_interest
    - company_interest
    export: true
    roles:
    - candidate
    - company
    - admin
  - key: interest_candidate
    type: form
    collection: matches
    title:
      it: Esprimi interesse (giovane)
      en: Set interest (candidate)
    fields:
    - candidate_interest
    edit: true
    nav: false
    roles:
    - candidate
    submit:
      label:
        it: Salva
        en: Save
      redirect: my_matches
  - key: interest_company
    type: form
    collection: matches
    title:
      it: Esprimi interesse (azienda)
      en: Set interest (company)
    fields:
    - company_interest
    edit: true
    nav: false
    roles:
    - company
    submit:
      label:
        it: Salva
        en: Save
      redirect: my_matches
  - key: send_message
    type: form
    collection: messages
    title:
      it: Scrivi un messaggio
      en: Send a message
    roles:
    - candidate
    - company
    submit:
      label:
        it: Invia
        en: Send
      message:
        it: Inviato.
        en: Sent.
      redirect: chat
  - key: chat
    type: table
    title:
      it: Chat
      en: Chat
    source: collection:messages
    columns:
    - position_title
    - candidate_email
    - company_email
    - text
    roles:
    - candidate
    - company
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Plan
    roles:
    - company
    - user
  approvals: []
  triggers:
  - key: mutual_candidate
    'on':
      collection: matches
      op: update
      where:
        candidate_interest: 'yes'
        company_interest: 'yes'
    notify:
      to:
      - record.candidate_email
      - record.company_email
      subject:
        it: 'Interesse reciproco: {record.position_title}'
        en: 'Mutual interest: {record.position_title}'
      body:
        it: Sia il candidato sia l'azienda hanno espresso interesse per {record.position_title}. Ora puoi scrivere nella chat.
        en: Both parties are interested in {record.position_title}. You can now write in the chat.
      link: chat
  billing:
    modes:
    - subscription
    currency: eur
    costs:
      agent:company_matcher:
        requiresPlan: azienda
    plans:
    - key: azienda
      price: 49
      interval: month
      label:
        it: Azienda
        en: Company
      includes:
      - Posizioni illimitate
      - Rose di candidati con AI
      - Chat con candidati
      roles:
      - company
      - user
  notifications:
    emailOnRunDone: true
  extensions:
  - key: human_chat
    description: 'Chat in tempo reale tra due persone non disponibile: i messaggi sono salvati in una collezione e letti nella
      vista chat; la chat è aperta dalle regole di accesso, non bloccata finché non c''è interesse reciproco.'
  - key: company_verification
    description: Il ruolo azienda deriva dal profilo azienda creato; la verifica dell'identità dell'azienda va fatta dall'admin.
  - key: subscription_gate
    description: L'abbonamento limita l'agente aziendale; la pubblicazione delle posizioni non è bloccata dal piano.
