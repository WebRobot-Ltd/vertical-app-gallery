apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: ricerca-forense
  displayName: Ricerca Forense
  tagline:
    it: Ricerca giuridica con citazioni puntuali, per avvocati e uffici legali.
    en: Legal research with precise citations, for lawyers and legal teams.
  description:
    it: Un assistente AI che cerca nella normativa italiana (Normattiva), nel diritto UE (EUR-Lex) e su fonti istituzionali,
      risponde con ragionamento strutturato e citazioni agli articoli, e confronta i documenti della pratica con le norme.
    en: An AI assistant that searches Italian law (Normattiva), EU law (EUR-Lex) and institutional sources, answers with structured
      reasoning and article-level citations, and compares case documents against the law.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#1f2a44'
      accent: '#8a5a2b'
      background: '#f8f6f2'
      foreground: '#1a1d24'
    fonts:
      body: Inter
      display: Libre Baskerville
    wordmark:
    - text: 'Ricerca '
      color: primary
    - text: Forense
      color: accent
    button: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Fonti
        en: Sources
      href: '#fonti'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label:
        it: Amministratore dello studio
        en: Firm admin
      assignedBy: admin_emails
    - key: user
      label:
        it: Avvocato
        en: Lawyer
      assignedBy: invite
  limits:
  - action: chat
    per: user
    max: 200
    window: day
    roles:
    - user
    - admin
  egress:
    hosts:
    - eur-lex.europa.eu
    notes: 'EUR-Lex: reuse of EU legislation allowed under Commission Decision 2011/833/EU (CC BY 4.0).'
  agents:
  - key: researcher
    role: main
    description: Ricerca giuridica su normativa italiana ed europea, con citazioni; analizza i documenti della pratica.
    profile:
      inline:
        display_name: Ricerca Forense
        chat_mode: true
        crews:
        - id: researcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'Sei un assistente di ricerca giuridica per avvocati italiani. Rispondi nella lingua dell''utente.


            METODO

            1. Comprendi la questione; se manca un dato essenziale (data dei fatti, rito, parti) chiedilo in una riga, altrimenti
            procedi dichiarando le assunzioni.

            2. Cerca le fonti PRIMA di rispondere: normativa italiana su normattiva.it (testo vigente e versione alla data
            dei fatti), diritto UE su EUR-Lex (strumento ep_search_eurlex per le ricerche, pagine CELEX per il testo), e fonti
            istituzionali (Corte costituzionale, Cassazione, Ministeri, Gazzetta Ufficiale) tramite il web scraping del MCP
            WebRobot. Usa solo fonti istituzionali o ufficiali.

            3. Se la pratica ha documenti, usa gli strumenti dell''app per cercarli e leggerli e confrontali con le norme;
            evidenzia le clausole a rischio indicando clausola, norma di riferimento, motivo del rischio, livello (alto/medio/basso)
            e proposta di modifica.


            STRUTTURA DELLA RISPOSTA (Markdown, inizia con un titolo ''# '' di 5-8 parole)

            ## Sintesi

            ## Quadro normativo (citazioni puntuali: es. art. 1693 c.c.; Reg. (UE) 2015/2421, art. X; con link alla fonte
            e data di vigenza verificata)

            ## Ragionamento

            ## Giurisprudenza (vedi regole sotto)

            ## Rischi e punti da verificare

            ## Prossimi passi


            REGOLE

            - Non inventare mai articoli, commi, numeri di sentenza o massime. Se non hai verificato una fonte, scrivilo.

            - Giurisprudenza di legittimità e di merito: le banche dati a licenza (es. DeJure, Pluris, Foro Italiano) non
            sono ancora collegate a questa app. Cita solo decisioni che hai trovato su fonti pubbliche istituzionali (es.
            sito della Corte di Cassazione, Corte costituzionale, CURIA) con estremi completi e link; altrimenti scrivi chiaramente
            che la giurisprudenza va verificata sulla banca dati dello studio e suggerisci le parole chiave di ricerca.

            - Se la risposta confronta numeri o termini (es. termini di impugnazione), puoi aggiungere un blocco ```chart
            con dati reali.

            - Non sei un avvocato: fornisci un supporto alla ricerca, la valutazione finale spetta al professionista. Non
            dare consigli come fatto certo.

            - Riservatezza: usa solo le pratiche e i documenti restituiti dagli strumenti dell''app; non rivelare dati di
            altre pratiche.

            - Per salvare in una pratica un testo che l''utente incolla o un link, usa lo strumento di scrittura documenti;
            chiedi a quale pratica appartiene.'
    goalTemplate: 'Data: {date}. Avvocato: {user}.

      Conversazione finora:

      {history}


      Nuovo messaggio:

      {message}'
    appTools:
    - name: list_cases
      description: Elenca le pratiche dell'avvocato e quelle condivise con lui
      action: read
      collection: cases
      scope: user
    - name: save_case
      description: Crea o aggiorna una pratica
      action: write
      collection: cases
      scope: user
    - name: search_documents
      description: Cerca nei documenti caricati di una pratica
      action: search
      collection: case_documents
      scope: user
    - name: save_document
      description: Salva nella pratica un atto, contratto o sentenza (testo incollato o link)
      action: write
      collection: case_documents
      scope: user
    - name: eurlex_fetch
      description: Recupera un atto UE da EUR-Lex (percorso es. /legal-content/IT/TXT/HTML/?uri=CELEX:32015R2421)
      action: http
      http:
        method: GET
        url: https://eur-lex.europa.eu
        allowPath: true
        attribution: EUR-Lex, Publications Office of the EU, CC BY 4.0
    output: markdown
    limits:
      maxTurns: 30
      maxBudgetUsd: 1.0
  data:
    collections:
    - name: cases
      description: 'Pratiche riservate: ognuna visibile al suo avvocato e a chi l''ha ricevuta in condivisione'
      ownedBy: user
      sharing:
      - viewer
      - editor
      searchable: true
      fields:
      - name: title
        type: text
        required: true
        label:
          it: Pratica
          en: Case
      - name: client
        type: text
        label:
          it: Cliente
          en: Client
      - name: area
        type: text
        label:
          it: Materia
          en: Area of law
      - name: notes
        type: textarea
        label:
          it: Note
          en: Notes
    - name: case_documents
      description: Atti, contratti e sentenze della pratica (testo incollato o link), spazio privato della pratica
      ownedBy: user
      parent: cases
      sharing:
      - viewer
      - editor
      searchable: true
      fields:
      - name: title
        type: text
        required: true
        label:
          it: Titolo
          en: Title
      - name: kind
        type: select
        label:
          it: Tipo
          en: Type
        options:
        - value: atto
          label: Atto
        - value: contratto
          label:
            it: Contratto
            en: Contract
        - value: sentenza
          label:
            it: Sentenza
            en: Judgment
        - value: altro
          label:
            it: Altro
            en: Other
      - name: content
        type: textarea
        label:
          it: Testo
          en: Text
      - name: source_url
        type: url
        label:
          it: Link
          en: Link
  views:
  - key: home
    type: page
    title: Ricerca Forense
    nav: false
    sections:
    - type: hero
      eyebrow:
        it: Per avvocati e uffici legali
        en: For lawyers and legal teams
      title:
        it: La **ricerca giuridica** con citazioni puntuali, in una chat.
        en: '**Legal research** with precise citations, in a chat.'
      text:
        it: 'Scrivi la questione in linguaggio naturale: l''assistente cerca su Normattiva, EUR-Lex e fonti istituzionali
          e risponde con un ragionamento strutturato e riferimenti agli articoli. Le tue pratiche restano riservate.'
        en: 'Describe the issue in plain language: the assistant searches Normattiva, EUR-Lex and institutional sources and
          answers with structured reasoning and article references. Your cases stay confidential.'
      actions:
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Chiedi
          en: Ask
        text:
          it: Descrivi la questione, ad es. responsabilità del vettore o termini di impugnazione.
          en: Describe the issue, e.g. carrier liability or appeal deadlines.
        badge: 💬
      - title:
          it: Ricerca
          en: Research
        text:
          it: L'agente consulta le fonti ufficiali e verifica la norma vigente.
          en: The agent consults official sources and checks the law in force.
        badge: 🔎
      - title:
          it: Confronta
          en: Compare
        text:
          it: 'Incolla un contratto o un atto nella pratica: l''agente lo confronta con le norme e segnala le clausole a rischio.'
          en: 'Paste a contract or deed into the case: the agent compares it with the law and flags risky clauses.'
        badge: 📑
    - type: cards
      id: fonti
      title:
        it: Fonti
        en: Sources
      items:
      - title: Normattiva
        text:
          it: Normativa italiana vigente.
          en: Italian law in force.
      - title: EUR-Lex
        text:
          it: Diritto dell'Unione europea.
          en: European Union law.
      - title:
          it: Fonti istituzionali
          en: Institutional sources
        text:
          it: Cassazione, Corte costituzionale, Gazzetta Ufficiale, ministeri.
          en: Court of Cassation, Constitutional Court, Official Gazette, ministries.
    - type: note
      content:
        it: 'Strumento di supporto alla ricerca, non consulenza legale: la valutazione finale spetta al professionista. La
          giurisprudenza da banche dati a licenza non è ancora collegata.'
        en: 'Research support tool, not legal advice: the final assessment rests with the professional. Licensed case-law
          databases are not yet connected.'
  - key: assistente
    type: chat
    title:
      it: Assistente
      en: Assistant
    source: agent:researcher
    placeholder:
      it: Scrivi la questione giuridica…
      en: Write the legal question…
    examples:
    - Quali sono i limiti di responsabilità del vettore nel trasporto stradale di merci?
    - Quali sono i termini per impugnare una sentenza civile di primo grado?
    - 'Salva nella pratica «Rossi» questo contratto e segnalami le clausole a rischio: …'
    roles:
    - user
    - admin
  - key: pratiche
    type: cards
    title:
      it: Le mie pratiche
      en: My cases
    source: collection:cases
    data:
      display: cards
      fields:
      - key: title
        label:
          it: Pratica
          en: Case
      - key: client
        label:
          it: Cliente
          en: Client
      - key: area
        label:
          it: Materia
          en: Area
        format: badge
      sort:
        field: title
        dir: asc
      limit: 100
      empty:
        it: Nessuna pratica. Chiedi all'assistente di crearne una.
        en: No cases yet. Ask the assistant to create one.
    roles:
    - user
    - admin
  - key: documenti
    type: table
    title:
      it: Documenti
      en: Documents
    source: collection:case_documents
    data:
      display: table
      fields:
      - key: title
        label:
          it: Titolo
          en: Title
      - key: kind
        label:
          it: Tipo
          en: Type
        format: badge
      - key: source_url
        label: Link
        format: link
      limit: 100
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - user
    - admin
  - key: admin
    type: admin
    title:
      it: Posti e utenti
      en: Seats and users
    roles:
    - admin
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: seat
      price: 59
      interval: month
      label:
        it: Ricerca Forense — per utente
        en: Ricerca Forense — per user
      includes:
      - Chat di ricerca illimitata nei limiti d'uso equo
      - Pratiche riservate e condivisione
      - Confronto documenti-norme
      roles:
      - user
      - admin
  extensions:
  - key: file_upload
    description: 'Caricamento di PDF e Word non ancora disponibile: l''avvocato incolla il testo o un link nella pratica tramite
      la chat. Servirà l''upload con estrazione del testo e indicizzazione.'
  - key: licensed_case_law
    description: 'Giurisprudenza da banche dati a licenza (DeJure, Pluris, ecc.) richiede credenziali dell''abbonamento dello
      studio: connettore non ancora disponibile. Per ora solo fonti pubbliche istituzionali.'
  - key: word_export
    description: 'Esportazione delle risposte in Word (.docx) non disponibile: per ora la risposta è stampabile e copiabile.'
  - key: firm_scope
    description: Condivisione delle pratiche per singolo avvocato tramite inviti per record; i posti dello studio sono gestiti
      dall'admin con ruolo su invito, nessuna registrazione libera.
