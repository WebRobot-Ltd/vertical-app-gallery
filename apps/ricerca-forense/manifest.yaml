apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: ricerca-forense
  displayName: Ricerca Forense
  tagline:
    it: L'assistente di ricerca giuridica per avvocati e uffici legali.
    en: The legal research assistant for lawyers and law firms.
  description:
    it: 'Poni una questione giuridica in linguaggio naturale: l''agente cerca in Normattiva, EUR-Lex e fonti istituzionali,
      confronta i tuoi atti con le norme e risponde con un ragionamento strutturato e citazioni puntuali.'
    en: 'Ask a legal question in plain language: the agent searches Normattiva, EUR-Lex and institutional sources, compares
      your documents with the law and answers with structured reasoning and precise citations.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#1f2a44'
      accent: '#8a5a2b'
      background: '#f8f6f2'
      foreground: '#1a1d24'
    fonts:
      body: Inter
      display: Libre Baskerville
    wordmark:
    - text: 'Ricerca '
      color: primary
    - text: Forense
      color: accent
    buttonShape: rounded
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Riservatezza
        en: Confidentiality
      href: '#riservatezza'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label:
        it: Amministratore dello studio
        en: Firm admin
      assignedBy: admin_emails
    - key: avvocato
      label:
        it: Avvocato
        en: Lawyer
      assignedBy: invite
  limits:
  - action: chat
    per: user
    max: 150
    window: day
  agents:
  - key: researcher
    role: main
    description: Ricerca giuridica su norme italiane ed europee, con analisi dei documenti della pratica.
    profile:
      inline:
        display_name: Ricerca Forense
        chat_mode: true
        crews:
        - id: researcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'Sei un assistente di ricerca giuridica per avvocati italiani. Non sostituisci il professionista:
            fornisci una base di lavoro verificabile.


            METODO

            1. Capisci la questione e individua le fonti pertinenti.

            2. Normativa italiana: usa lo strumento normattiva_get (query = URN NIR, es. ''urn:nir:stato:decreto.legislativo:2003-06-30;196'').
            Diritto europeo: usa eurlex_get (query ''uri=CELEX:32016R0679''). Per fonti istituzionali aggiuntive (Corte costituzionale,
            Cassazione, Gazzetta Ufficiale, ministeri, autorità) usa il MCP webrobot per leggere le pagine, solo siti istituzionali.

            3. Se la domanda riguarda una pratica o un documento caricato, consulta read_matters e read_documents e apri i
            file con read_upload (passando l''id del file; vale anche per scansioni). Confronta il testo con le norme applicabili
            ed evidenzia le clausole a rischio con motivazione, citando la clausola.

            4. Giurisprudenza: puoi citare solo decisioni che hai effettivamente letto su una fonte istituzionale aperta.
            La giurisprudenza di legittimità e di merito delle banche dati a licenza dello studio non è ancora collegata:
            dichiara con chiarezza quando manca e suggerisci le parole chiave per cercarla.


            FORMATO DELLA RISPOSTA (Markdown)

            ## Questione

            ## Quadro normativo (con citazioni puntuali: articolo, comma, fonte, versione vigente alla data odierna se verificabile)

            ## Ragionamento

            ## Giurisprudenza (solo se verificata; altrimenti indica la lacuna)

            ## Rischi e punti da verificare

            ## Fonti consultate (link)

            Quando confronti numeri o termini puoi aggiungere una tabella. Se la risposta è lunga, tienila ordinata e pronta
            da copiare in un parere.


            REGOLE

            - Non inventare mai articoli, massime, numeri di sentenza o termini: se non hai verificato, dillo.

            - Segnala sempre quando una norma potrebbe essere stata modificata e va controllata la versione vigente.

            - Mantieni la riservatezza: usa solo le pratiche e i documenti ai quali hai accesso tramite gli strumenti.

            - Rispondi nella lingua dell''utente. Chiudi ricordando che l''output è supporto alla ricerca e va verificato
            dal professionista.'
    goalTemplate: 'Utente: {user}. Data: {date}. Lingua: {lang}.

      Pratiche accessibili all''utente:

      {matters}

      Documenti caricati accessibili all''utente:

      {documents}


      Conversazione finora:

      {history}


      Nuovo messaggio dell''avvocato:

      {message}'
    context:
    - key: matters
      from: collection:matters
    - key: documents
      from: collection:documents
    appTools:
    - name: normattiva_get
      description: 'Legge un atto normativo italiano su Normattiva. Query: l''URN NIR, es. urn:nir:stato:legge:1990-08-07;241'
      action: http
      http:
        method: GET
        url: https://www.normattiva.it/uri-res/N2Ls
        attribution: Normattiva, Istituto Poligrafico e Zecca dello Stato
        maxBytes: 900000
    - name: eurlex_get
      description: 'Legge un atto del diritto UE su EUR-Lex. Query: uri=CELEX:<numero>, es. uri=CELEX:32016R0679'
      action: http
      http:
        method: GET
        url: https://eur-lex.europa.eu/legal-content/IT/TXT/HTML/
        attribution: EUR-Lex, Publications Office of the EU
        maxBytes: 900000
    - name: read_matters
      description: Elenca le pratiche a cui l'utente ha accesso
      action: read
      collection: matters
      scope: user
    - name: read_documents
      description: Elenca i documenti caricati nelle pratiche dell'utente, con gli id dei file
      action: read
      collection: documents
      scope: user
    - name: read_upload
      description: Legge un file caricato dall'utente (PDF, Word, scansioni con OCR) dato l'id
      action: read_file
    output: markdown
    limits:
      maxTurns: 25
      maxBudgetUsd: 1.0
  data:
    collections:
    - name: matters
      description: Pratiche riservate dello studio
      ownedBy: user
      fields:
      - name: title
        type: text
        required: true
        label:
          it: Titolo pratica
          en: Matter title
      - name: client
        type: text
        label:
          it: Cliente
          en: Client
      - name: area
        type: select
        label:
          it: Materia
          en: Area
        options:
        - value: civile
          label: Civile
        - value: penale
          label: Penale
        - value: amministrativo
          label: Amministrativo
        - value: lavoro
          label: Lavoro
        - value: commerciale
          label: Commerciale
        - value: trasporti
          label: Trasporti
        - value: altro
          label: Altro
      - name: notes
        type: textarea
        label:
          it: Note
          en: Notes
      - name: members
        type: array
        label:
          it: Colleghi con cui condividere (email)
          en: Colleagues to share with (emails)
        help:
          it: Email dei colleghi dello studio che possono vedere la pratica
          en: Emails of colleagues who can see the matter
      access:
      - role: avvocato
        where:
          members: '{user.email}'
        can:
        - read
        - write
    - name: documents
      description: Atti, contratti e sentenze caricati nello spazio privato della pratica
      ownedBy: user
      fields:
      - name: title
        type: text
        required: true
        label:
          it: Titolo documento
          en: Document title
      - name: matter
        type: relation
        relation: matters
        label:
          it: Pratica
          en: Matter
      - name: kind
        type: select
        label:
          it: Tipo
          en: Type
        options:
        - value: atto
          label: Atto
        - value: contratto
          label: Contratto
        - value: sentenza
          label: Sentenza
        - value: altro
          label: Altro
      - name: file
        type: file
        required: true
        accept:
        - pdf
        - docx
        - jpg
        - png
        maxMb: 15
        label:
          it: File
          en: File
      - name: members
        type: array
        label:
          it: Condiviso con (email)
          en: Shared with (emails)
      access:
      - role: avvocato
        where:
          members: '{user.email}'
        can:
        - read
        - write
    credentials:
    - provider: banca_dati_giurisprudenza
      kind: api_key
      scope: org
      label:
        it: Banca dati di giurisprudenza (abbonamento dello studio)
        en: Case law database (firm subscription)
      help:
        it: Chiave API dell'abbonamento dello studio, impostata dall'amministratore.
        en: API key of the firm's subscription, set by the admin.
  views:
  - key: home
    type: page
    title: Ricerca Forense
    nav: false
    sections:
    - type: hero
      title:
        it: Ricerca giuridica con **citazioni puntuali**, in pochi minuti.
        en: Legal research with **precise citations**, in minutes.
      text:
        it: 'Scrivi la questione in linguaggio naturale. L''agente consulta Normattiva, EUR-Lex e fonti istituzionali e ti
          risponde con un ragionamento strutturato. Carica atti e contratti: li confronta con le norme e segnala le clausole
          a rischio.'
        en: 'Write the issue in plain language. The agent consults Normattiva, EUR-Lex and institutional sources and answers
          with structured reasoning. Upload deeds and contracts: it compares them with the law and flags risky clauses.'
      actions:
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Chiedi
          en: Ask
        text:
          it: Es. responsabilità del vettore o termini di impugnazione.
          en: E.g. carrier liability or appeal deadlines.
      - title:
          it: L'agente cerca
          en: The agent searches
        text:
          it: Normattiva, EUR-Lex e siti istituzionali, con le fonti citate.
          en: Normattiva, EUR-Lex and institutional sites, with sources cited.
      - title:
          it: Confronta i tuoi documenti
          en: Compares your documents
        text:
          it: PDF e Word della pratica messi a confronto con le norme.
          en: PDF and Word files of the matter checked against the law.
      - title:
          it: Usa la risposta
          en: Use the answer
        text:
          it: Una base solida per il tuo parere.
          en: A solid base for your opinion.
    - type: cards
      id: riservatezza
      title:
        it: Pratiche riservate
        en: Confidential matters
      items:
      - title:
          it: Solo le tue
          en: Only yours
        text:
          it: Ogni avvocato vede le proprie pratiche e quelle condivise con lui.
          en: Each lawyer sees their own matters and those shared with them.
      - title:
          it: Posti gestiti dallo studio
          en: Seats managed by the firm
        text:
          it: L'amministratore invita e gestisce gli utenti.
          en: The admin invites and manages users.
      - title:
          it: Abbonamento per utente
          en: Per-user subscription
        text:
          it: Un canone mensile per ogni avvocato.
          en: A monthly fee per lawyer.
    - type: note
      content:
        it: 'Ricerca Forense è uno strumento di supporto alla ricerca: non sostituisce il giudizio del professionista. Verifica
          sempre fonti e versioni vigenti.'
        en: Ricerca Forense is a research support tool and does not replace professional judgement. Always verify sources
          and current versions.
  - key: assistant
    type: chat
    title:
      it: Assistente
      en: Assistant
    source: agent:researcher
    examples:
    - it: Qual è la responsabilità del vettore nel trasporto stradale di merci e quali sono i limiti risarcitori?
      en: What is a carrier's liability in road freight and what are the liability limits?
    - it: Quali sono i termini per impugnare una sentenza civile di primo grado?
      en: What are the deadlines to appeal a first-instance civil judgment?
    - it: Analizza il contratto caricato e segnala le clausole a rischio.
      en: Analyse the uploaded contract and flag risky clauses.
    placeholder:
      it: Scrivi la questione giuridica…
      en: Write the legal issue…
    roles:
    - avvocato
    - admin
  - key: new_matter
    type: form
    title:
      it: Nuova pratica
      en: New matter
    collection: matters
    fields:
    - title
    - client
    - area
    - notes
    - members
    submit:
      label:
        it: Crea pratica
        en: Create matter
      message:
        it: Pratica creata.
        en: Matter created.
      redirect: matters
    edit: true
    roles:
    - avvocato
    - admin
  - key: matters
    type: table
    title:
      it: Le mie pratiche
      en: My matters
    source: collection:matters
    columns:
    - title
    - client
    - area
    - members
    roles:
    - avvocato
    - admin
  - key: upload_document
    type: form
    title:
      it: Carica documento
      en: Upload document
    collection: documents
    fields:
    - title
    - matter
    - kind
    - file
    - members
    submit:
      label:
        it: Carica
        en: Upload
      message:
        it: Documento caricato nello spazio privato della pratica.
        en: Document uploaded to the matter's private space.
      redirect: documents
    edit: false
    roles:
    - avvocato
    - admin
  - key: documents
    type: table
    title:
      it: Documenti
      en: Documents
    source: collection:documents
    columns:
    - title
    - matter
    - kind
    - members
    roles:
    - avvocato
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - avvocato
    - admin
  - key: admin
    type: admin
    title:
      it: Studio
      en: Firm
    roles:
    - admin
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: seat
      price: 79
      interval: month
      label:
        it: Ricerca Forense — per avvocato
        en: Ricerca Forense — per lawyer
      includes:
      - Ricerca su Normattiva, EUR-Lex e fonti istituzionali
      - Analisi documenti delle pratiche
      - Pratiche riservate e condivisione
      roles:
      - admin
      - avvocato
  egress:
    hosts:
    - www.normattiva.it
    - eur-lex.europa.eu
    notes: 'Normattiva: testi normativi ufficiali, open data riutilizzabili con attribuzione. EUR-Lex: riuso dei documenti
      UE consentito (Decisione 2011/833/UE), con attribuzione.'
  extensions:
  - key: giurisprudenza_licenziata
    description: 'Collegamento alle banche dati di giurisprudenza a licenza (legittimità e merito) con l''abbonamento dello
      studio: serve scegliere il fornitore e il suo host API per aggiungere lo strumento http con la credenziale ''banca_dati_giurisprudenza''.
      Finora l''agente cita solo giurisprudenza letta su fonti istituzionali aperte.'
  - key: export_word
    description: 'Esportazione delle risposte della chat in Word (.docx) come base di un parere: non ancora disponibile; per
      ora il testo si copia dalla chat.'
  - key: indicizzazione_documenti
    description: I documenti sono letti dall'agente al bisogno tramite read_file nello spazio privato dell'utente; un indice
      di ricerca semantico dedicato per pratica non è ancora disponibile. Il file di un collega con cui la pratica è condivisa
      potrebbe non essere apribile dall'agente.
  - key: posti_per_utente
    description: Il canone mensile per utente è modellato come piano di abbonamento; la fatturazione automatica per numero
      di posti dello studio (un solo pagamento cumulativo) non è prevista.
