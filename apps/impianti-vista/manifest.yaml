apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: impiantivista
  displayName: ImpiantiVista
  tagline:
    it: Gli agenti che vegliano sui tuoi impianti fotovoltaici ed eolici.
    en: Agents watching over your solar and wind plants.
  description:
    it: 'Registra i tuoi impianti: gli agenti confrontano la produzione reale con quella attesa (Open-Meteo, PVGIS), individuano
      i cali di rendimento, ne ipotizzano la causa e aprono una segnalazione al tecnico.'
    en: 'Register your plants: agents compare real output with the expected one (Open-Meteo, PVGIS), spot yield drops, hypothesise
      the cause and open a ticket for the technician.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: dashboard
  branding:
    theme: light
    palette:
      primary: '#0b3c5d'
      accent: '#f2a900'
      background: '#f6f9fb'
      foreground: '#14212b'
    fonts:
      body: Inter
      display: Manrope
    wordmark:
    - text: Impianti
      color: primary
    - text: Vista
      color: accent
    width: wide
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Fonti
        en: Sources
      href: '#fonti'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: manager
      label:
        it: Gestore
        en: Operator
      assignedBy: signup
    - key: technician
      label:
        it: Tecnico
        en: Technician
      assignedBy: derived
      from: collection:tickets.technician_email
  limits:
  - action: agent:reporter
    per: user
    max: 5
    window: day
    roles:
    - manager
  egress:
    hosts:
    - archive-api.open-meteo.com
    - re.jrc.ec.europa.eu
    notes: 'Open-Meteo: free API, CC BY 4.0 attribution (non-commercial tier; commercial use needs their paid plan). PVGIS
      (European Commission JRC): free reuse with attribution.'
  agents:
  - key: analyst
    role: scheduled
    description: 'Daily check of one plant: expected vs real output, anomaly, cause, ticket.'
    memory: instance
    profile:
      inline:
        display_name: ImpiantiVista analyst
        crews:
        - id: analyst
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 14
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the performance analyst of one renewable plant (solar PV or wind). Steps: 1) read the plant''s
            real production for the last 7 days with read_production. 2) Get the weather: openmeteo_archive (GET, query: latitude,
            longitude, start_date, end_date as YYYY-MM-DD, hourly=shortwave_radiation,cloud_cover,wind_speed_100m,temperature_2m,
            timezone=auto). 3) For solar also call pvgis_pvcalc (GET, query: lat, lon, peakpower=<kWp>, loss=14, angle=<tilt>,
            aspect=<azimuth, 0=south>, outputformat=json) for the monthly baseline. Estimate expected daily energy: solar
            = PVGIS baseline scaled by the actual radiation of the day; wind = rated power x capacity factor from the power
            curve approximated on 100 m wind speed (cut-in 3 m/s, rated about 12 m/s, cut-out 25 m/s). State assumptions.
            4) Compute daily performance ratio = real/expected. Flag an anomaly only if the drop is below 85% for at least
            2 days or below 70% in one day, and weather does not explain it. 5) Ask ask_diagnostician to rank the likely causes
            (soiling, shading, inverter/string fault, grid curtailment, self-consumption, sensor/data gap), citing the pattern
            (gradual vs abrupt, time of day, partial vs total). 6) If the anomaly is significant, open a ticket with write_ticket
            (plant, severity low|medium|high, cause, summary, technician_email from the goal, status open) and call request_intervention.
            Never invent figures: if production data is missing, say so and do not open a ticket. Use your memory to avoid
            duplicating an open ticket; end by calling remember with the 5 key points. Output: level-1 title "# <Plant> —
            <date>", sections ## Result, ## Expected vs real, ## Cause hypotheses, ## Action. Then a final fenced json block:
            {"date":"YYYY-MM-DD","plant":"","energy_kwh":0,"expected_kwh":0,"performance_ratio":0,"status":"ok|warning|alarm","cause":""}.'
    delegates:
    - diagnostician
    awaits:
    - intervention
    appTools:
    - name: read_production
      description: Production readings of the user's plants
      action: read
      collection: production_readings
      scope: user
    - name: write_ticket
      description: Open a ticket on a plant
      action: write
      collection: tickets
      scope: user
    - name: openmeteo_archive
      description: Open-Meteo historical weather (radiation, wind) for a place and dates
      action: http
      http:
        method: GET
        url: https://archive-api.open-meteo.com/v1/archive
        attribution: Weather data by Open-Meteo.com, CC BY 4.0
    - name: pvgis_pvcalc
      description: PVGIS expected monthly PV energy for a location and system
      action: http
      http:
        method: GET
        url: https://re.jrc.ec.europa.eu/api/v5_2/PVcalc
        attribution: PVGIS, European Commission JRC
    output: markdown+json
    writesTo:
      collection: daily_checks
      parse: json_last
      keyBy: date
    limits:
      maxTurns: 14
      maxBudgetUsd: 0.6
  - key: diagnostician
    role: helper
    description: Ranks the probable causes of a yield drop.
    profile:
      inline:
        display_name: ImpiantiVista diagnostician
        crews:
        - id: diagnostician
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 3
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are a senior O&M engineer for PV and wind plants. Given a plant description and a pattern of
            underperformance, return up to 3 likely causes ranked, each with likelihood (high/medium/low), the evidence that
            supports it, and the check a technician should do on site. Typical patterns: gradual decline then recovery after
            rain = soiling; drop at fixed hours = shading; abrupt constant loss of a share of power = inverter or string fault;
            flat daytime profile with grid data fine = curtailment or self-consumption; wind: lower output at good wind =
            pitch/yaw/icing/downtime. Never present a hypothesis as a certainty.'
  - key: reporter
    role: main
    description: Monthly portfolio report for the operator.
    profile:
      inline:
        display_name: ImpiantiVista reporter
        crews:
        - id: reporter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write the monthly portfolio report for a renewable plant operator. Read the data with search_checks
            (daily checks) and search_tickets. Start with "# Report mensile / Monthly report — <month>" (in the requested
            language). Sections ## Summary (total energy, average performance ratio), ## Plant by plant (table: plant, energy
            kWh, expected kWh, PR %, alarms), ## Anomalies and tickets (status, cause, who is in charge), ## Recommendations.
            Add one chart as a fenced block ```chart {"type":"bar","title":"Performance ratio per plant","labels":[...],"series":[{"name":"PR","values":[...]}],"unit":"%"}```.
            Use only figures present in the data; say when data is missing. Do not give financial or legal advice.'
    appTools:
    - name: search_checks
      description: Daily checks of the user's plants
      action: search
      collection: daily_checks
      scope: user
    - name: search_tickets
      description: Tickets of the user's plants
      action: search
      collection: tickets
      scope: user
    goalTemplate: 'Month: {month}. Operator: {user}. Write the report in the language with ISO code {lang}. Today is {date}.'
    output: markdown
  templates:
  - key: plant_watch
    title:
      it: Impianto monitorato
      en: Monitored plant
    description:
      it: Un controllo giornaliero di produzione reale contro attesa, con segnalazione al tecnico.
      en: A daily check of real vs expected output, with a ticket to the technician.
    agent: analyst
    params:
    - name: plant
      type: text
      required: true
      label:
        it: Nome impianto
        en: Plant name
    - name: kind
      type: select
      required: true
      label:
        it: Tipo
        en: Type
      options:
      - value: solar
        label:
          it: Fotovoltaico
          en: Solar PV
      - value: wind
        label:
          it: Eolico
          en: Wind
    - name: latitude
      type: number
      required: true
      label:
        it: Latitudine
        en: Latitude
    - name: longitude
      type: number
      required: true
      label:
        it: Longitudine
        en: Longitude
    - name: capacity_kw
      type: number
      required: true
      label:
        it: Potenza installata (kW)
        en: Installed capacity (kW)
    - name: tilt
      type: number
      label:
        it: Inclinazione pannelli (°)
        en: Panel tilt (°)
    - name: azimuth
      type: number
      label:
        it: Azimut (0 = sud)
        en: Azimuth (0 = south)
    - name: hub_height
      type: number
      label:
        it: Altezza mozzo (m, eolico)
        en: Hub height (m, wind)
    - name: notes
      type: textarea
      maxLength: 500
      label:
        it: Caratteristiche (inverter, ombreggiamenti noti…)
        en: Features (inverters, known shading…)
    - name: technician_email
      type: email
      label:
        it: Email del tecnico
        en: Technician email
    schedule:
      cron: 0 6 * * *
      userCanChange: false
    maxPerUser: 50
    goal: 'Check yesterday and the last 7 days for plant "{plant}" ({kind}), lat {latitude}, lon {longitude}, {capacity_kw}
      kW, tilt {tilt}, azimuth {azimuth}, hub height {hub_height} m. Features: {notes}. Technician: {technician_email}. Today
      is {date}. Write in the language with ISO code {lang}.'
    cost:
      perRun: 3
  approvals:
  - key: intervention
    title:
      it: Presa in carico intervento
      en: Intervention acceptance
    description: The technician takes the ticket in charge and confirms the intervention.
    role: technician
    fields:
    - plant
    - severity
    - cause
    - summary
    timeoutMinutes: 2880
    onTimeout: reject
    decidedBy: role
  data:
    collections:
    - name: production_readings
      ownedBy: user
      description: Real production per plant and day (from webhook or SCADA export)
      fields:
      - name: plant
        type: text
        required: true
      - name: date
        type: date
        required: true
      - name: energy_kwh
        type: number
        required: true
    - name: daily_checks
      ownedBy: instance
      description: Daily result of each plant check
      fields:
      - name: date
        type: date
      - name: plant
        type: text
      - name: energy_kwh
        type: number
      - name: expected_kwh
        type: number
      - name: performance_ratio
        type: number
      - name: status
        type: text
      - name: cause
        type: text
    - name: tickets
      ownedBy: user
      description: Tickets opened on anomalies
      fields:
      - name: plant
        type: text
      - name: severity
        type: select
        options:
        - low
        - medium
        - high
      - name: cause
        type: text
      - name: summary
        type: textarea
      - name: technician_email
        type: email
      - name: status
        type: select
        options:
        - open
        - in_progress
        - done
  inputForm:
    title:
      it: Report mensile
      en: Monthly report
    fields:
    - name: month
      type: text
      required: true
      label:
        it: Mese (es. 2026-10)
        en: Month (e.g. 2026-10)
  views:
  - key: home
    type: page
    nav: false
    title: ImpiantiVista
    sections:
    - type: hero
      title:
        it: Sai **quanto dovrebbe produrre** il tuo impianto? Lo sanno i nostri agenti.
        en: Do you know **how much your plant should produce**? Our agents do.
      text:
        it: Confronto giornaliero tra produzione reale e attesa, cali anomali spiegati, segnalazioni al tecnico e dashboard
          di portafoglio.
        en: Daily comparison of real and expected output, explained anomalies, technician tickets and a portfolio dashboard.
      actions:
      - label:
          it: Registra i tuoi impianti
          en: Register your plants
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Registra
          en: Register
        text:
          it: Ubicazione, potenza e caratteristiche; invia i dati di produzione via webhook.
          en: Location, capacity and features; send production data by webhook.
        badge: '1'
      - title:
          it: Analisi
          en: Analysis
        text:
          it: Gli agenti stimano l'atteso con Open-Meteo e PVGIS e cercano i cali anomali.
          en: Agents estimate the expected output with Open-Meteo and PVGIS and look for anomalous drops.
        badge: '2'
      - title:
          it: Intervento
          en: Intervention
        text:
          it: Segnalazione al tecnico, che la prende in carico e conferma.
          en: Ticket to the technician, who accepts it and confirms.
        badge: '3'
    - type: cards
      id: fonti
      title:
        it: Fonti
        en: Sources
      items:
      - title: Open-Meteo
        text:
          it: Irraggiamento e vento storici (CC BY 4.0).
          en: Historical radiation and wind (CC BY 4.0).
      - title: PVGIS
        text:
          it: Stime di produzione fotovoltaica, Commissione Europea JRC.
          en: PV yield estimates, European Commission JRC.
    - type: note
      content:
        it: Le cause indicate sono ipotesi da verificare in loco, non diagnosi certe.
        en: Causes listed are hypotheses to verify on site, not certain diagnoses.
  - key: portfolio
    type: page
    title:
      it: Portafoglio
      en: Portfolio
    roles:
    - manager
    - admin
    sections:
    - type: data
      title:
        it: Produzione e performance ratio
        en: Production and performance ratio
      source: collection:daily_checks
      display: kpi
      kpis:
      - label:
          it: Energia (kWh)
          en: Energy (kWh)
        agg: sum
        field: energy_kwh
        format: number
      - label: PR
        agg: avg
        field: performance_ratio
        format: percent
      - label:
          it: Allarmi
          en: Alarms
        agg: count
        field: status
    - type: data
      title:
        it: Per impianto
        en: By plant
      source: collection:daily_checks
      display: chart
      chart: bar
      fields:
      - key: plant
      - key: performance_ratio
        label: PR
      limit: 60
    - type: data
      title:
        it: Ultimi controlli
        en: Latest checks
      source: collection:daily_checks
      display: table
      fields:
      - key: date
        label: Data
        format: date
      - key: plant
        label: Plant
      - key: energy_kwh
        format: number
      - key: expected_kwh
        format: number
      - key: performance_ratio
        format: percent
      - key: status
        format: badge
      - key: cause
      sort:
        field: date
        dir: desc
      limit: 50
    - type: data
      title:
        it: Segnalazioni
        en: Tickets
      source: collection:tickets
      display: table
      fields:
      - key: plant
      - key: severity
        format: badge
      - key: cause
      - key: status
        format: badge
      limit: 50
  - key: plants
    type: instances
    template: plant_watch
    title:
      it: I miei impianti
      en: My plants
    roles:
    - manager
    - admin
  - key: readings
    type: table
    title:
      it: Dati di produzione
      en: Production data
    source: collection:production_readings
    roles:
    - manager
    - admin
  - key: tickets
    type: table
    title:
      it: Segnalazioni
      en: Tickets
    source: collection:tickets
    roles:
    - manager
    - technician
    - admin
  - key: interventions
    type: approvals
    title:
      it: Interventi
      en: Interventions
    approvals:
    - intervention
    roles:
    - technician
    - admin
  - key: new_report
    type: new_run
    title:
      it: Report mensile
      en: Monthly report
    roles:
    - manager
    - admin
  - key: reports
    type: history
    title:
      it: I miei report
      en: My reports
    source: run
    roles:
    - manager
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - manager
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 50
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:reporter:
        estimate: 10
        metered: true
    packs:
    - key: extra
      credits: 1000
      price: 10
      label: Extra
    plans:
    - key: small
      price: 29
      interval: month
      label:
        it: Fino a 5 impianti / 2 MW
        en: Up to 5 plants / 2 MW
      includes:
      - 5 plants
      - 2 MW total
      credits: 1500
      creditsReset: monthly
      roles:
      - manager
    - key: pro
      price: 99
      interval: month
      label:
        it: Fino a 25 impianti / 20 MW
        en: Up to 25 plants / 20 MW
      includes:
      - 25 plants
      - 20 MW total
      credits: 8000
      creditsReset: monthly
      roles:
      - manager
  triggers:
  - key: production_hook
    description: Production data pushed by the operator's monitoring system
    'on':
      webhook: true
    start:
      agent: analyst
    goal: 'Production data received: {event}. Store nothing yourself; check the plant it refers to.'
    asUser: true
  extensions:
  - key: scada_connector
    description: 'Authorised access to the SCADA/monitoring system needs per-customer credentials: not available yet. For
      now production arrives by webhook or is entered in production_readings.'
  - key: monthly_email
    description: 'Monthly report by email is not available yet: the operator generates the report in the app. Email alerts
      to the technician are also pending: the technician sees tickets and interventions in the app.'
  - key: plan_limits
    description: Plan limits on number/power of plants are described in the plans but enforced by the owner for now (maxPerUser
      on the template is 50).
