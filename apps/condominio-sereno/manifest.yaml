apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: condominio-sereno
  displayName: Condominio Sereno
  tagline:
    it: Il condominio, in digitale e senza pensieri.
    en: Your building, managed digitally.
  description:
    it: Segnalazioni, spese, verbali, comunicazioni e un assistente AI per amministratore, condomini, fornitori e consiglio
      di condominio.
    en: Reports, expenses, minutes, notices and an AI assistant for the administrator, residents, suppliers and the building
      council.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#1f3a4d'
      accent: '#3a8f7b'
      background: '#f6f8f7'
      foreground: '#18242c'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: 'Condominio '
      color: primary
    - text: Sereno
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Ruoli
        en: Roles
      href: '#ruoli'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label:
        it: Amministratore
        en: Administrator
      assignedBy: admin_emails
    - key: condomino
      label:
        it: Condomino
        en: Resident
      assignedBy: invite
    - key: fornitore
      label:
        it: Fornitore
        en: Supplier
      assignedBy: invite
    - key: consiglio
      label:
        it: Consiglio di condominio
        en: Building council
      assignedBy: invite
  limits:
  - action: chat
    per: user
    max: 50
    window: day
    roles:
    - condomino
    - consiglio
  agents:
  - key: assistente
    role: main
    description: Risponde ai condomini su regolamento, bilancio e scadenze, solo sul loro stabile.
    memory: user
    appTools:
    - name: leggi_documenti
      description: Regolamento, verbali, spese e scadenze dello stabile dell'utente
      action: search
      collection: documents
      scope: user
    - name: leggi_spese
      description: Spese e rate della posizione dell'utente
      action: read
      collection: expenses
      scope: user
    - name: leggi_comunicazioni
      description: Comunicazioni dell'amministratore
      action: read
      collection: notices
      scope: user
    profile:
      inline:
        display_name: Assistente Condominio Sereno
        chat_mode: true
        crews:
        - id: assistente
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: Sei l'assistente di Condominio Sereno. Rispondi in modo breve e cortese ai condomini su regolamento,
            bilancio, spese, rate e scadenze del LORO stabile, usando solo i dati ottenuti dagli strumenti. Cita il documento
            o la voce di spesa da cui ricavi la risposta. Se l'informazione non c'è, dillo e suggerisci di aprire una segnalazione
            o contattare l'amministratore. Non inventare importi o date e non dare consulenza legale come fatto certo; non
            rivelare dati di altri stabili o di altri condomini.
    goalTemplate: 'Conversazione finora:

      {history}

      Nuovo messaggio di {user}: {message}

      Rispondi nella lingua con codice ISO {lang}.'
    output: markdown
  - key: pratiche
    role: helper
    description: Prende in carico una segnalazione, confronta i preventivi dei fornitori e chiede le approvazioni di spesa.
    awaits:
    - spesa_amministratore
    - spesa_straordinaria
    appTools:
    - name: leggi_pratiche
      description: Segnalazioni e pratiche
      action: read
      collection: tickets
      scope: user
    - name: aggiorna_pratica
      description: Aggiorna stato e note di una pratica
      action: write
      collection: tickets
      scope: user
    - name: leggi_preventivi
      description: Preventivi inviati dai fornitori per la pratica
      action: read
      collection: quotes
      scope: user
    - name: leggi_fornitori
      description: Elenco fornitori dello stabile
      action: read
      collection: suppliers
      scope: user
    - name: scrivi_comunicazione
      description: Pubblica una comunicazione ai condomini interessati
      action: write
      collection: notices
      scope: user
    profile:
      inline:
        display_name: Agente pratiche
        crews:
        - id: pratiche
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Gestisci le pratiche di un condominio. Per ogni segnalazione: 1) classifica urgenza e categoria;
            2) scegli i fornitori adatti dall''elenco e scrivi la richiesta di preventivo (i fornitori rispondono dall''app
            nella raccolta preventivi); 3) quando arrivano i preventivi, confrontali in una tabella (prezzo, tempi, garanzie)
            e raccomanda con motivazione; 4) se la spesa supera la soglia indicata nelle note dello stabile, chiedi l''approvazione
            dell''amministratore con request_spesa_amministratore; se la spesa è straordinaria chiedi anche quella del consiglio
            con request_spesa_straordinaria; 5) pubblica una comunicazione per i condomini interessati. Inizia con un titolo
            ''# Pratica — <oggetto>''. Non inventare importi, non approvare mai spese da solo.'
    goalTemplate: 'Nuova segnalazione per lo stabile {building}: {category_label}, urgenza {urgency_label}.

      Descrizione: {description}

      {?photo_url}Foto: {photo_url}{/photo_url}

      Oggi è {date}. Scrivi in lingua {lang}.'
    output: markdown
    writesTo:
      collection: practice_reports
      parse: whole
  - key: posta
    role: helper
    description: Legge email e PEC in arrivo, le classifica e le collega a una pratica.
    appTools:
    - name: leggi_pratiche_aperte
      description: Pratiche aperte a cui collegare la posta
      action: read
      collection: tickets
      scope: user
    - name: registra_posta
      description: Registra la mail classificata e collegata
      action: write
      collection: mailbox
      scope: user
    profile:
      inline:
        display_name: Agente posta
        crews:
        - id: posta
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 5
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: Leggi un'email o PEC ricevuta dal condominio. Classificala (guasto, preventivo fornitore, fattura,
            comunicazione ufficiale, richiesta condomino, spam), estrai mittente, oggetto, scadenze e importi citati, e collegala
            alla pratica aperta più pertinente con leggi_pratiche_aperte (o proponi di aprirne una nuova). Registrala con
            registra_posta. Non inventare dati mancanti.
    goalTemplate: 'Email ricevuta:

      {message}'
    output: markdown+json
    writesTo:
      collection: mailbox
      parse: json_last
  channels:
  - key: posta_condominio
    type: email
    agent: posta
  - key: web
    type: web
    agent: assistente
  inputForm:
    title:
      it: Nuova segnalazione
      en: New report
    fields:
    - name: building
      type: relation
      relation: buildings
      required: true
      label:
        it: Stabile
        en: Building
    - name: category
      type: select
      required: true
      label:
        it: Tipo
        en: Type
      options:
      - value: ascensore
        label:
          it: Guasto ascensore
          en: Lift failure
      - value: infiltrazione
        label:
          it: Infiltrazione
          en: Leak
      - value: parti_comuni
        label:
          it: Parti comuni
          en: Common areas
      - value: altro
        label:
          it: Altro
          en: Other
    - name: urgency
      type: select
      required: true
      label:
        it: Urgenza
        en: Urgency
      options:
      - value: alta
        label:
          it: Alta
          en: High
      - value: media
        label:
          it: Media
          en: Medium
      - value: bassa
        label:
          it: Bassa
          en: Low
    - name: description
      type: textarea
      required: true
      maxLength: 1000
      label:
        it: Descrizione
        en: Description
    - name: photo_url
      type: url
      label:
        it: Link alla foto (facoltativo)
        en: Photo link (optional)
      help:
        it: 'Il caricamento diretto delle foto non è ancora disponibile: incolla un link.'
        en: 'Direct photo upload is not available yet: paste a link.'
  data:
    collections:
    - name: buildings
      ownedBy: user
      sharing:
      - viewer
      description: Stabili creati dall'amministratore, condivisi con gli invitati
      fields:
      - name: name
        type: text
        required: true
      - name: address
        type: text
      - name: approval_threshold_eur
        type: number
        label: Soglia di spesa per approvazione
      - name: units
        type: array
        fields:
        - name: unit
          type: text
        - name: owner_email
          type: email
        - name: owner_name
          type: text
        - name: millesimi
          type: number
    - name: suppliers
      ownedBy: user
      sharing:
      - viewer
      fields:
      - name: name
        type: text
      - name: trade
        type: text
      - name: email
        type: email
    - name: tickets
      ownedBy: user
      sharing:
      - viewer
      - editor
      fields:
      - name: building
        type: text
      - name: category
        type: text
      - name: description
        type: textarea
      - name: photo_url
        type: url
      - name: status
        type: select
        options:
        - aperta
        - preventivi
        - in_approvazione
        - in_lavorazione
        - chiusa
    - name: quotes
      ownedBy: user
      sharing:
      - viewer
      - editor
      fields:
      - name: ticket
        type: relation
        relation: tickets
      - name: supplier
        type: text
      - name: amount_eur
        type: number
      - name: days
        type: number
      - name: notes
        type: textarea
    - name: expenses
      ownedBy: user
      sharing:
      - viewer
      fields:
      - name: building
        type: text
      - name: unit
        type: text
      - name: description
        type: text
      - name: amount_eur
        type: number
      - name: due_date
        type: date
      - name: kind
        type: select
        options:
        - ordinaria
        - straordinaria
      - name: status
        type: select
        options:
        - da_pagare
        - pagata
    - name: documents
      ownedBy: user
      sharing:
      - viewer
      searchable: true
      fields:
      - name: title
        type: text
      - name: type
        type: select
        options:
        - regolamento
        - verbale
        - bilancio
        - altro
      - name: text
        type: textarea
        help: 'Testo incollato o link: il caricamento file non è ancora disponibile'
      - name: link
        type: url
    - name: notices
      ownedBy: user
      sharing:
      - viewer
      fields:
      - name: title
        type: text
      - name: body
        type: textarea
      - name: building
        type: text
      - name: date
        type: date
    - name: mailbox
      ownedBy: user
      fields:
      - name: from
        type: text
      - name: subject
        type: text
      - name: class
        type: text
      - name: ticket
        type: text
      - name: deadline
        type: date
    - name: practice_reports
      ownedBy: user
      sharing:
      - viewer
      fields:
      - name: title
        type: text
      - name: content
        type: textarea
  approvals:
  - key: spesa_amministratore
    title:
      it: Spesa sopra soglia
      en: Spend above threshold
    role: admin
    fields:
    - ticket
    - supplier
    - amount_eur
    timeoutMinutes: 10080
  - key: spesa_straordinaria
    title:
      it: Spesa straordinaria
      en: Extraordinary spend
    role: consiglio
    fields:
    - ticket
    - supplier
    - amount_eur
    timeoutMinutes: 10080
  triggers:
  - key: nuova_segnalazione
    'on':
      collection: tickets
      op: insert
      where:
        status: aperta
    start:
      agent: pratiche
    goal: 'Prendi in carico la nuova segnalazione: {event}'
    asUser: true
  views:
  - key: home
    type: page
    nav: false
    title: Condominio Sereno
    sections:
    - type: hero
      eyebrow:
        it: Per studi di amministrazione
        en: For administration firms
      title:
        it: Il condominio, **in digitale** e senza pensieri.
        en: Your building, **digital** and stress-free.
      text:
        it: Segnalazioni, spese, verbali e comunicazioni in un unico posto, con un assistente AI che risponde ai condomini
          e agenti che seguono le pratiche.
        en: Reports, expenses, minutes and notices in one place, with an AI assistant for residents and agents that follow
          up on cases.
      actions:
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: L'amministratore crea lo stabile
          en: The administrator sets up the building
        text:
          it: Unità, millesimi e proprietari, poi invita tutti.
          en: Units, shares and owners, then invites everyone.
      - title:
          it: Segnalazioni e preventivi
          en: Reports and quotes
        text:
          it: L'agente classifica, confronta i preventivi e chiede le approvazioni.
          en: The agent classifies, compares quotes and requests approvals.
      - title:
          it: Tutto sotto controllo
          en: Everything under control
        text:
          it: Spese, verbali, comunicazioni e un assistente in chat.
          en: Expenses, minutes, notices and a chat assistant.
    - type: cards
      id: ruoli
      title:
        it: Quattro ruoli
        en: Four roles
      items:
      - title:
          it: Amministratore
          en: Administrator
        text:
          it: Gestisce stabili, spese e approvazioni.
          en: Manages buildings, expenses and approvals.
      - title:
          it: Condomini
          en: Residents
        text:
          it: Vedono solo il proprio stabile e la propria posizione.
          en: See only their building and their own position.
      - title:
          it: Fornitori
          en: Suppliers
        text:
          it: Inviano preventivi sulle pratiche assegnate.
          en: Send quotes on assigned cases.
      - title:
          it: Consiglio
          en: Council
        text:
          it: Approva le spese straordinarie.
          en: Approves extraordinary spending.
    - type: note
      content:
        it: Supporto alla gestione, non consulenza legale.
        en: Management support, not legal advice.
  - key: assistente
    type: chat
    title:
      it: Assistente
      en: Assistant
    source: agent:assistente
    examples:
    - Quando scade la prossima rata?
    - Cosa dice il regolamento sugli animali?
    - Qual è lo stato della mia segnalazione?
    placeholder:
      it: Chiedi su regolamento, bilancio, scadenze…
      en: Ask about rules, budget, deadlines…
    roles:
    - condomino
    - consiglio
    - admin
  - key: nuova_segnalazione
    type: new_run
    title:
      it: Nuova segnalazione
      en: New report
    roles:
    - condomino
    - consiglio
    - admin
  - key: pratiche
    type: history
    title:
      it: Pratiche
      en: Cases
    source: run
    roles:
    - condomino
    - consiglio
    - admin
  - key: pratica
    type: report
    source: run
    printable: true
    nav: false
  - key: stabili
    type: table
    title:
      it: Stabili
      en: Buildings
    source: collection:buildings
    data:
      display: table
      fields:
      - key: name
        label: Nome
      - key: address
        label: Indirizzo
      - key: approval_threshold_eur
        label: Soglia
        format: money
    roles:
    - admin
  - key: preventivi
    type: table
    title:
      it: Preventivi
      en: Quotes
    source: collection:quotes
    data:
      display: table
      fields:
      - key: supplier
        label: Fornitore
      - key: amount_eur
        label: Importo
        format: money
      - key: days
        label: Giorni
        format: number
      - key: notes
        label: Note
    roles:
    - admin
    - fornitore
    - consiglio
  - key: spese
    type: table
    title:
      it: Spese e rate
      en: Expenses
    source: collection:expenses
    data:
      display: table
      fields:
      - key: description
        label: Voce
      - key: kind
        label: Tipo
        format: badge
      - key: amount_eur
        label: Importo
        format: money
      - key: due_date
        label: Scadenza
        format: date
      - key: status
        label: Stato
        format: badge
      sort:
        field: due_date
        dir: asc
    roles:
    - admin
    - condomino
    - consiglio
  - key: archivio
    type: table
    title:
      it: Verbali e documenti
      en: Minutes and documents
    source: collection:documents
    data:
      display: table
      fields:
      - key: title
        label: Titolo
      - key: type
        label: Tipo
        format: badge
      - key: link
        label: Link
        format: link
    roles:
    - admin
    - condomino
    - consiglio
  - key: comunicazioni
    type: list
    title:
      it: Comunicazioni
      en: Notices
    source: collection:notices
    data:
      display: list
      fields:
      - key: title
        label: Titolo
      - key: date
        label: Data
        format: date
      - key: body
        label: Testo
      sort:
        field: date
        dir: desc
    roles:
    - admin
    - condomino
    - consiglio
    - fornitore
  - key: posta_view
    type: table
    title:
      it: Posta in arrivo
      en: Inbox
    source: collection:mailbox
    data:
      display: table
      fields:
      - key: from
        label: Da
      - key: subject
        label: Oggetto
      - key: class
        label: Classe
        format: badge
      - key: ticket
        label: Pratica
      - key: deadline
        label: Scadenza
        format: date
    roles:
    - admin
  - key: approvazioni
    type: approvals
    title:
      it: Approvazioni
      en: Approvals
    roles:
    - admin
    - consiglio
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - admin
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: studio_unita
      price: 1.5
      interval: month
      label:
        it: Per unità immobiliare, pagato dallo studio
        en: Per property unit, paid by the firm
      roles:
      - admin
  extensions:
  - key: file_upload
    description: 'Foto delle segnalazioni e documenti d''archivio: il caricamento file non è ancora disponibile; per ora si
      incolla un link o il testo.'
  - key: notifiche
    description: 'Notifiche automatiche (email/push) ai condomini a ogni guasto o scadenza non disponibili: per ora l''agente
      pubblica una comunicazione visibile nell''app.'
  - key: pagamento_rate
    description: 'Pagamento delle rate dei condomini direttamente dall''app (verso il conto del condominio) non disponibile:
      i pagamenti Stripe vanno al titolare dell''app. Per ora le rate si registrano come ''pagata'' dall''amministratore.'
  - key: preventivi_via_email
    description: 'L''invio di email ai fornitori non è disponibile: la richiesta di preventivo è pubblicata nell''app e i
      fornitori rispondono dal loro accesso. La lettura di email/PEC dipende dal canale email.'
  - key: isolamento_stabile
    description: Il condomino vede solo il suo stabile e la sua posizione tramite condivisione per record (sharing viewer)
      dell'amministratore; l'abbonamento per unità richiede il conteggio delle unità dello studio.
