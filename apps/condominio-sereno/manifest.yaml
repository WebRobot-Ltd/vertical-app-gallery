apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: condominio-sereno
  displayName: Condominio Sereno
  tagline:
    it: 'Il condominio gestito in digitale: segnalazioni, spese, verbali e un assistente sempre disponibile.'
  description:
    it: Condominio Sereno aiuta lo studio dell'amministratore a gestire stabili, unità e millesimi, segnalazioni con foto,
      preventivi dei fornitori, approvazioni di spesa, comunicazioni e archivio documentale.
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#1f4e5f'
      accent: '#d98e32'
      background: '#f6f8f7'
      foreground: '#18262c'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: 'Condominio '
      color: primary
    - text: Sereno
      color: accent
  header:
    links:
    - label: Come funziona
      href: '#come-funziona'
    - label: Ruoli
      href: '#ruoli'
    cta:
      label: Accedi
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Amministratore
      assignedBy: admin_emails
    - key: condomino
      label: Condomino
      assignedBy: derived
      from: collection:units.owner_email
    - key: fornitore
      label: Fornitore
      assignedBy: derived
      from: collection:suppliers.email
    - key: consiglio
      label: Consiglio di condominio
      assignedBy: derived
      from: collection:board_members.email
  limits:
  - action: create:units
    max: 30
    window: total
    plans:
      studio_m: 150
      studio_l: -1
  - action: chat
    per: user
    max: 40
    window: day
  agents:
  - key: assistant
    role: main
    description: Risponde ai condomini su regolamento, bilancio e scadenze, usando solo i dati a cui l'utente ha accesso.
    profile:
      inline:
        display_name: Assistente Condominio Sereno
        chat_mode: true
        crews:
        - id: assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''assistente di un condominio italiano. Rispondi in italiano, in modo chiaro e cortese, a domande
            su regolamento, spese, rate, verbali, comunicazioni e scadenze. Usa SEMPRE gli strumenti per cercare nei documenti,
            nelle spese, nelle rate e nelle comunicazioni; vedi solo i dati dello stabile e della posizione dell''utente.
            Cita il documento o il verbale da cui prendi l''informazione. Non inventare cifre, date o articoli: se non trovi
            la risposta, dillo e suggerisci di contattare l''amministratore. Non dare pareri legali come fatti certi.'
    goalTemplate: 'Conversazione finora:

      {history}


      Nuovo messaggio di {user}: {message}

      Oggi è {date}. Rispondi nella lingua con codice ISO {lang}.'
    appTools:
    - name: search_documents
      description: Cerca tra regolamento, verbali e documenti dello stabile
      action: search
      collection: documents
      scope: all
    - name: read_expenses
      description: Spese dello stabile
      action: read
      collection: expenses
      scope: all
    - name: read_installments
      description: Rate e scadenze della posizione dell'utente
      action: read
      collection: installments
      scope: all
    - name: read_communications
      description: Comunicazioni dell'amministratore
      action: read
      collection: communications
      scope: all
    - name: read_units
      description: Unità e millesimi dell'utente
      action: read
      collection: units
      scope: all
    output: markdown
  - key: triage
    role: helper
    description: Legge email e PEC in arrivo, le classifica e le collega a una pratica.
    profile:
      inline:
        display_name: Smistamento posta condominio
        crews:
        - id: triage
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Ricevi il contenuto di una email o PEC indirizzata al condominio. Individua lo stabile (cerca tra
            gli stabili), classifica il messaggio (guasto, richiesta di informazioni, fornitore, fattura, diffida/legale,
            pagamento, altro), valuta l''urgenza (bassa, media, alta) e riassumi in 3 righe. Cerca una pratica aperta dello
            stesso stabile e argomento: se esiste, collega il messaggio con il suo codice, altrimenti crea una nuova pratica.
            Scrivi sempre un record nella collezione delle pratiche. Non inventare dati mancanti; lascia il campo vuoto. Non
            rispondere al mittente.'
    appTools:
    - name: triage_read_buildings
      description: Elenco degli stabili
      action: read
      collection: buildings
      scope: all
    - name: triage_search_practices
      description: Cerca pratiche esistenti
      action: search
      collection: practices
      scope: all
    - name: triage_write_practice
      description: Crea o aggiorna una pratica
      action: write
      collection: practices
      scope: all
    output: markdown
  - key: rfq
    role: helper
    description: Per ogni segnalazione prepara la richiesta di preventivo ai fornitori.
    profile:
      inline:
        display_name: Richieste di preventivo
        crews:
        - id: rfq
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Ricevi una segnalazione di un condomino. Se è un guasto o un lavoro che richiede un intervento (ascensore,
            infiltrazione, impianti), scrivi UNA richiesta di preventivo nella collezione rfqs: titolo breve, categoria di
            lavoro (idraulico, elettricista, ascensorista, edile, altro), descrizione tecnica neutra senza dati personali
            del condomino, urgenza, stabile. I fornitori verranno avvisati via email dalla piattaforma. Se la segnalazione
            è una semplice richiesta o non richiede un fornitore, non scrivere nulla e spiega perché.'
    appTools:
    - name: rfq_write
      description: Crea la richiesta di preventivo
      action: write
      collection: rfqs
      scope: all
    output: markdown
  - key: procurement
    role: helper
    description: Confronta i preventivi e chiede le approvazioni di spesa.
    awaits:
    - spend_admin
    - spend_board
    profile:
      inline:
        display_name: Confronto preventivi e spese
        crews:
        - id: procurement
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: Sei l'assistente acquisti di un condominio. Quando arriva un preventivo, leggi tutti i preventivi
            della stessa richiesta (rfqs) e confrontali per prezzo totale, tempi, garanzia e completezza. Se c'è un solo preventivo,
            attendi gli altri salvo urgenza alta. Scrivi il confronto in una tabella Markdown con un titolo '# ' e una raccomandazione
            motivata. Leggi lo stabile e la sua soglia di spesa (spending_threshold). Se l'importo raccomandato supera la
            soglia, chiama request_spend_admin con i dettagli (fornitore, importo, motivazione). Se la spesa è straordinaria,
            DOPO l'approvazione dell'amministratore chiama anche request_spend_board. Solo a spesa approvata scrivi il record
            nelle spese con stato 'approvata'. Non inventare cifre e non approvare mai nulla da solo.
    appTools:
    - name: proc_read_rfqs
      description: Richieste di preventivo
      action: read
      collection: rfqs
      scope: all
    - name: proc_read_quotes
      description: Preventivi ricevuti
      action: read
      collection: quotes
      scope: all
    - name: proc_read_buildings
      description: Stabili e soglia di spesa
      action: read
      collection: buildings
      scope: all
    - name: proc_write_expense
      description: Registra la spesa approvata
      action: write
      collection: expenses
      scope: all
    output: markdown
  inputForm:
    title: Nuova segnalazione
    fields: []
  data:
    collections:
    - name: buildings
      description: Stabili gestiti dallo studio
      ownedBy: org
      fields:
      - name: name
        type: text
        required: true
        label: Nome stabile
      - name: address
        type: text
        required: true
        label: Indirizzo
      - name: spending_threshold
        type: number
        label: Soglia di spesa che richiede approvazione (€)
      - name: member_emails
        type: json
        label: Email dei condomini dello stabile
        help: Elenco di email, es. ["a@x.it","b@y.it"]
      access:
      - role: condomino
        where:
          member_emails: '{user.email}'
      - role: consiglio
        where:
          member_emails: '{user.email}'
    - name: units
      description: Unità immobiliari con millesimi e proprietario
      ownedBy: org
      fields:
      - name: building
        type: text
        required: true
        label: Stabile
      - name: unit
        type: text
        required: true
        label: Unità (scala/interno)
      - name: millesimi
        type: number
        required: true
        label: Millesimi
      - name: owner_name
        type: text
        required: true
        label: Proprietario
      - name: owner_email
        type: email
        required: true
        label: Email proprietario
      access:
      - role: condomino
        where:
          owner_email: '{user.email}'
    - name: suppliers
      description: Fornitori invitati
      ownedBy: org
      fields:
      - name: name
        type: text
        required: true
        label: Ragione sociale
      - name: category
        type: text
        label: Categoria
      - name: email
        type: email
        required: true
        label: Email
    - name: board_members
      description: Membri del consiglio di condominio
      ownedBy: org
      fields:
      - name: building
        type: text
        required: true
        label: Stabile
      - name: name
        type: text
        required: true
        label: Nome
      - name: email
        type: email
        required: true
        label: Email
    - name: tickets
      description: Segnalazioni dei condomini
      ownedBy: user
      fields:
      - name: title
        type: text
        required: true
        label: Titolo
      - name: building
        type: text
        label: Stabile
      - name: category
        type: select
        required: true
        label: Tipo
        options:
        - value: ascensore
          label: Ascensore
        - value: infiltrazione
          label: Infiltrazione
        - value: impianti
          label: Impianti
        - value: parti_comuni
          label: Parti comuni
        - value: altro
          label: Altro
      - name: description
        type: textarea
        required: true
        label: Descrizione
      - name: photo
        type: file
        label: Foto
        accept:
        - jpg
        - jpeg
        - png
        - webp
        maxMb: 10
        multiple: true
      - name: status
        type: select
        label: Stato
        default: aperta
        options:
        - value: aperta
          label: Aperta
        - value: in_lavorazione
          label: In lavorazione
        - value: chiusa
          label: Chiusa
    - name: rfqs
      description: Richieste di preventivo ai fornitori
      ownedBy: org
      fields:
      - name: title
        type: text
        label: Titolo
      - name: building
        type: text
        label: Stabile
      - name: category
        type: text
        label: Categoria
      - name: description
        type: textarea
        label: Descrizione
      - name: urgency
        type: text
        label: Urgenza
      access:
      - role: fornitore
      - role: consiglio
    - name: quotes
      description: Preventivi dei fornitori
      ownedBy: org
      fields:
      - name: rfq
        type: text
        required: true
        label: Richiesta (titolo o codice)
      - name: supplier_email
        type: email
        required: true
        label: La tua email
      - name: amount
        type: number
        required: true
        label: Importo totale (€, IVA inclusa)
      - name: days
        type: number
        label: Giorni per l'intervento
      - name: warranty
        type: text
        label: Garanzia
      - name: notes
        type: textarea
        label: Note
      - name: document
        type: file
        label: Preventivo (PDF)
        accept:
        - pdf
        maxMb: 10
      access:
      - role: fornitore
        where:
          supplier_email: '{user.email}'
      - role: consiglio
    - name: expenses
      description: Spese dello stabile
      ownedBy: org
      fields:
      - name: building
        type: text
        required: true
        label: Stabile
      - name: description
        type: text
        required: true
        label: Descrizione
      - name: amount
        type: number
        required: true
        label: Importo (€)
      - name: kind
        type: select
        label: Tipo
        options:
        - value: ordinaria
          label: Ordinaria
        - value: straordinaria
          label: Straordinaria
      - name: status
        type: select
        label: Stato
        options:
        - value: proposta
          label: Proposta
        - value: approvata
          label: Approvata
        - value: pagata
          label: Pagata
      - name: date
        type: date
        label: Data
      - name: member_emails
        type: json
        label: Email dei condomini dello stabile
      access:
      - role: condomino
        where:
          member_emails: '{user.email}'
      - role: consiglio
        where:
          member_emails: '{user.email}'
    - name: installments
      description: Rate dei condomini
      ownedBy: org
      fields:
      - name: building
        type: text
        required: true
        label: Stabile
      - name: unit
        type: text
        required: true
        label: Unità
      - name: owner_email
        type: email
        required: true
        label: Email proprietario
      - name: description
        type: text
        label: Descrizione
      - name: amount
        type: number
        required: true
        label: Importo (€)
      - name: due_date
        type: date
        required: true
        label: Scadenza
      - name: status
        type: select
        label: Stato
        options:
        - value: da_pagare
          label: Da pagare
        - value: pagata
          label: Pagata
      access:
      - role: condomino
        where:
          owner_email: '{user.email}'
    - name: documents
      description: 'Archivio: verbali, regolamento, bilanci'
      ownedBy: org
      fields:
      - name: building
        type: text
        required: true
        label: Stabile
      - name: title
        type: text
        required: true
        label: Titolo
      - name: kind
        type: select
        required: true
        label: Tipo
        options:
        - value: verbale
          label: Verbale
        - value: regolamento
          label: Regolamento
        - value: bilancio
          label: Bilancio
        - value: altro
          label: Altro
      - name: date
        type: date
        label: Data
      - name: file
        type: file
        required: true
        label: File
        accept:
        - pdf
        - docx
        - xlsx
        - jpg
        - png
        maxMb: 15
      - name: member_emails
        type: json
        label: Email dei condomini dello stabile
      searchable: true
      access:
      - role: condomino
        where:
          member_emails: '{user.email}'
      - role: consiglio
        where:
          member_emails: '{user.email}'
    - name: communications
      description: Comunicazioni ai condomini
      ownedBy: org
      fields:
      - name: building
        type: text
        required: true
        label: Stabile
      - name: title
        type: text
        required: true
        label: Oggetto
      - name: body
        type: textarea
        required: true
        label: Testo
      - name: date
        type: date
        label: Data
      - name: member_emails
        type: json
        label: Email dei condomini dello stabile
      access:
      - role: condomino
        where:
          member_emails: '{user.email}'
      - role: consiglio
        where:
          member_emails: '{user.email}'
    - name: practices
      description: Pratiche generate dalla posta in arrivo
      ownedBy: org
      retentionDays: 1825
      fields:
      - name: code
        type: text
        label: Codice
      - name: building
        type: text
        label: Stabile
      - name: category
        type: text
        label: Classe
      - name: urgency
        type: text
        label: Urgenza
      - name: from
        type: text
        label: Mittente
      - name: summary
        type: textarea
        label: Sintesi
      - name: status
        type: text
        label: Stato
  views:
  - key: home
    type: page
    nav: false
    title: Condominio Sereno
    sections:
    - type: hero
      title: Il condominio, **sereno** e in digitale
      text: Segnalazioni con foto, spese, verbali, rate e un assistente che risponde su regolamento e scadenze. Per amministratori,
        condomini, fornitori e consiglio.
      actions:
      - label: Accedi
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title: Come funziona
      items:
      - title: L'amministratore crea lo stabile
        text: 'Unità, millesimi, proprietari: poi invita condomini, fornitori e consiglio.'
      - title: Segnalazioni e preventivi
        text: Il condomino segnala con foto; l'agente chiede i preventivi ai fornitori e li confronta.
      - title: Approvazioni e pagamenti
        text: Le spese sopra soglia passano da amministratore e, se straordinarie, dal consiglio.
    - type: cards
      id: ruoli
      title: Quattro ruoli
      items:
      - title: Amministratore
        text: Gestisce stabili, spese, archivio e approvazioni.
      - title: Condomino
        text: Vede solo il proprio stabile e la propria posizione.
      - title: Fornitore
        text: Riceve le richieste e invia i preventivi.
      - title: Consiglio
        text: Controlla e approva le spese straordinarie.
    - type: note
      content: Condominio Sereno è un supporto alla gestione, non consulenza legale.
  - key: new_ticket
    type: form
    title: Nuova segnalazione
    collection: tickets
    fields:
    - title
    - building
    - category
    - description
    - photo
    submit:
      label: Invia segnalazione
      message: Segnalazione ricevuta. Ti avviseremo sugli aggiornamenti.
      redirect: my_tickets
    roles:
    - condomino
    - admin
  - key: my_tickets
    type: table
    title: Le mie segnalazioni
    source: collection:tickets
    columns:
    - title
    - category
    - status
    roles:
    - condomino
    - admin
  - key: expenses_view
    type: table
    title: Spese
    source: collection:expenses
    columns:
    - date
    - description
    - amount
    - kind
    - status
    export: true
    roles:
    - condomino
    - consiglio
    - admin
  - key: installments_view
    type: table
    title: Le mie rate
    source: collection:installments
    columns:
    - description
    - unit
    - amount
    - due_date
    - status
    roles:
    - condomino
    - admin
  - key: documents_view
    type: table
    title: Archivio e verbali
    source: collection:documents
    columns:
    - date
    - title
    - kind
    - file
    roles:
    - condomino
    - consiglio
    - admin
  - key: comms_view
    type: table
    title: Comunicazioni
    source: collection:communications
    columns:
    - date
    - title
    - body
    roles:
    - condomino
    - consiglio
    - admin
  - key: assistant_chat
    type: chat
    title: Assistente
    source: agent:assistant
    examples:
    - Quando scade la prossima rata?
    - Cosa dice il regolamento sugli animali?
    - Cosa è stato deciso nell'ultima assemblea?
    placeholder: Chiedi su regolamento, bilancio o scadenze
    roles:
    - condomino
    - consiglio
    - admin
  - key: rfqs_view
    type: table
    title: Richieste di preventivo
    source: collection:rfqs
    columns:
    - title
    - building
    - category
    - urgency
    roles:
    - fornitore
    - consiglio
    - admin
  - key: send_quote
    type: form
    title: Invia preventivo
    collection: quotes
    fields:
    - rfq
    - supplier_email
    - amount
    - days
    - warranty
    - notes
    - document
    submit:
      label: Invia preventivo
      message: Preventivo inviato.
    roles:
    - fornitore
  - key: quotes_view
    type: table
    title: Preventivi
    source: collection:quotes
    columns:
    - rfq
    - supplier_email
    - amount
    - days
    roles:
    - fornitore
    - consiglio
    - admin
  - key: decisions
    type: approvals
    title: Approvazioni
    approvals:
    - spend_admin
    - spend_board
    roles:
    - admin
    - consiglio
  - key: practices_view
    type: table
    title: Pratiche (posta in arrivo)
    source: collection:practices
    columns:
    - code
    - building
    - category
    - urgency
    - from
    - summary
    - status
    export: true
    roles:
    - admin
  - key: admin_building
    type: form
    title: Nuovo stabile
    collection: buildings
    submit:
      label: Salva stabile
      message: Stabile salvato.
    roles:
    - admin
  - key: admin_unit
    type: form
    title: Nuova unità e proprietario
    collection: units
    submit:
      label: Salva unità
      message: 'Unità salvata: il proprietario può accedere con la sua email.'
    roles:
    - admin
  - key: admin_supplier
    type: form
    title: Invita fornitore
    collection: suppliers
    submit:
      label: Salva fornitore
      message: Fornitore aggiunto.
    roles:
    - admin
  - key: admin_board
    type: form
    title: Membro del consiglio
    collection: board_members
    submit:
      label: Salva membro
      message: Membro aggiunto.
    roles:
    - admin
  - key: admin_document
    type: form
    title: Carica documento
    collection: documents
    submit:
      label: Archivia
      message: Documento archiviato.
    roles:
    - admin
  - key: admin_comm
    type: form
    title: Nuova comunicazione
    collection: communications
    submit:
      label: Pubblica
      message: Comunicazione pubblicata e notificata.
    roles:
    - admin
  - key: admin_installment
    type: form
    title: Nuova rata
    collection: installments
    submit:
      label: Salva rata
      message: Rata registrata.
    roles:
    - admin
  - key: admin_expense
    type: form
    title: Nuova spesa
    collection: expenses
    submit:
      label: Salva spesa
      message: Spesa registrata.
    roles:
    - admin
  - key: account
    type: account
    title: Abbonamento
    roles:
    - admin
  approvals:
  - key: spend_admin
    title: Approvazione spesa (amministratore)
    role: admin
    decidedBy: role
    fields:
    - fornitore
    - importo
    - motivazione
    timeoutMinutes: 10080
  - key: spend_board
    title: Approvazione spesa straordinaria (consiglio)
    role: consiglio
    decidedBy: role
    fields:
    - fornitore
    - importo
    - motivazione
    timeoutMinutes: 10080
  triggers:
  - key: ticket_to_rfq
    'on':
      collection: tickets
      op: insert
    start:
      agent: rfq
    goal: 'Nuova segnalazione: {record.title}. Tipo: {record.category}. Stabile: {record.building}. Descrizione: {record.description}.
      Valuta se serve un preventivo e in tal caso crea la richiesta.'
  - key: ticket_notify_admin
    'on':
      collection: tickets
      op: insert
    notify:
      to: admins
      subject: 'Nuova segnalazione: {record.title}'
      body: 'È stata aperta una segnalazione ({record.category}) per lo stabile {record.building}: {record.description}'
      link: my_tickets
  - key: rfq_notify_suppliers
    'on':
      collection: rfqs
      op: insert
    notify:
      to: role:fornitore
      subject: 'Richiesta di preventivo: {record.title}'
      body: 'Stabile: {record.building}. Categoria: {record.category}. Urgenza: {record.urgency}. Dettagli: {record.description}.
        Invia il preventivo dall''app.'
      link: send_quote
  - key: quote_compare
    'on':
      collection: quotes
      op: insert
    start:
      agent: procurement
    asUser: false
    goal: È arrivato un preventivo per la richiesta {record.rfq}, importo {record.amount}, giorni {record.days}. Confronta
      tutti i preventivi disponibili e prosegui con le approvazioni.
  - key: admin_approved
    'on':
      approval: spend_admin
      decision: approved
    start:
      agent: procurement
    asUser: false
    goal: 'La spesa è stata approvata dall''amministratore: {event}. Se è straordinaria richiedi l''approvazione del consiglio,
      altrimenti registra la spesa.'
  - key: board_approved
    'on':
      approval: spend_board
      decision: approved
    start:
      agent: procurement
    asUser: false
    goal: 'Il consiglio ha approvato la spesa straordinaria: {event}. Registra la spesa come approvata.'
  - key: inbound_mail
    'on':
      webhook: true
    start:
      agent: triage
    asUser: false
    goal: 'Email o PEC in arrivo all''indirizzo del condominio: {event}. Classifica e collega a una pratica.'
  - key: comm_notify
    'on':
      collection: communications
      op: insert
    notify:
      to: role:condomino
      subject: 'Comunicazione: {record.title}'
      body: 'Stabile {record.building}: {record.body}'
      link: comms_view
  - key: installment_reminder
    'on':
      date:
        collection: installments
        field: due_date
        offsetDays: -3
        hour: 8
    notify:
      to: record.owner_email
      subject: 'Rata in scadenza: {record.description}'
      body: La rata di {record.amount} euro scade il {record.due_date}.
      link: installments_view
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: studio_s
      price: 39
      interval: month
      label: Studio — fino a 30 unità
      roles:
      - admin
    - key: studio_m
      price: 99
      interval: month
      label: Studio — fino a 150 unità
      roles:
      - admin
    - key: studio_l
      price: 199
      interval: month
      label: Studio — unità illimitate
      roles:
      - admin
  notifications:
    emailOnRunDone: false
  extensions:
  - key: rate_payments
    description: 'Pagamento delle rate direttamente dall''app da parte dei condomini verso lo studio: oggi i pagamenti Stripe
      Connect coprono solo i crediti/abbonamenti dell''app; la rata resta registrata e il pagamento va collegato in seguito.'
  - key: per_unit_pricing
    description: L'abbonamento è a scaglioni di unità immobiliari (quota limitata da limits create:units), non un prezzo esatto
      per unità.
  - key: email_inbound
    description: L'indirizzo email/PEC del condominio deve inoltrare i messaggi al webhook /api/hooks/inbound_mail; la connessione
      di una casella PEC non è disponibile.
  - key: member_emails_fill
    description: Le spese, i documenti e le comunicazioni portano l'elenco email dei condomini dello stabile per limitare
      la visibilità; compilazione automatica dallo stabile non ancora disponibile.
