apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: computo-offerte
  displayName: ComputoOfferte
  tagline: Dal computo metrico all'ordine al fornitore più conveniente.
  description: Carica il computo metrico, l'agente estrae le voci e prepara le richieste d'offerta per categoria di fornitore.
    Tu approvi, le richieste partono via email, le risposte vengono lette e confrontate voce per voce.
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f3a5f'
      accent: '#e07b00'
      background: '#f6f5f2'
      foreground: '#1c2229'
    fonts:
      body: Inter
      display: Barlow
    wordmark:
    - text: Computo
      color: primary
    - text: Offerte
      color: accent
  header:
    links:
    - label: Come funziona
      href: '#come-funziona'
    - label: Piano
      href: '#piano'
    cta:
      label: Accedi
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  agents:
  - key: extractor
    role: main
    description: Legge il computo, salva le voci e prepara le bozze delle richieste d'offerta per fornitore.
    when: mode == 'extract'
    profile:
      inline:
        display_name: Estrattore computo
        crews:
        - id: extractor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un assistente per uffici tecnici di imprese edili. Ricevi il testo di un computo metrico (PDF
            o Excel). 1) Estrai ogni voce: descrizione, quantità, unità di misura, categoria di fornitore (es. calcestruzzo,
            ferro, laterizi, impianti elettrici, idraulica, serramenti, isolanti, finiture). Non inventare quantità: se manca
            un dato, lascia il campo vuoto e segnalalo. Se il file è una scansione senza testo, usa read_upload con l''id
            del file. 2) Salva ogni voce con add_item (collegata al cantiere indicato). 3) Leggi la rubrica con list_suppliers;
            per ogni categoria e per ogni fornitore della rubrica di quella categoria crea con add_rfq una bozza: status ''draft'',
            reference univoco tipo RFQ-<cantiere>-<n>, site, category, supplier_name, supplier_email, subject, items_text
            (elenco voci con quantità e unità) e body (testo cortese in italiano che chiede prezzo unitario, tempi di consegna
            e condizioni di pagamento e consegna, e chiede di rispondere citando il riferimento). Se per una categoria non
            c''è nessun fornitore, segnalalo. Non inviare nulla: il tecnico rivede e approva. Chiudi con un report che inizia
            con ''# Computo <cantiere> — voci estratte e richieste pronte'', con tabella delle voci per categoria, richieste
            create, categorie senza fornitori e dubbi da verificare.'
          mcp_servers: []
    goalTemplate: 'Cantiere: {site}

      Testo del computo:

      {?computo_text}{computo_text}{/computo_text}

      File caricati: {computo}

      {?notes}Note del tecnico: {notes}{/notes}

      Data: {date}. Scrivi in italiano.'
    appTools:
    - name: read_upload
      description: Legge un file caricato dall'utente (anche scansioni, OCR incluso)
      action: read_file
    - name: add_item
      description: Salva una voce del computo (site, description, quantity, unit, category)
      action: write
      collection: items
      scope: user
    - name: list_suppliers
      description: Elenca i fornitori della rubrica dell'impresa
      action: read
      collection: suppliers
      scope: user
    - name: add_rfq
      description: Crea una bozza di richiesta d'offerta
      action: write
      collection: rfqs
      scope: user
    output: markdown
    limits:
      maxTurns: 30
      maxBudgetUsd: 1.5
  - key: comparer
    role: main
    description: Confronta le offerte ricevute voce per voce e evidenzia la più conveniente.
    when: mode == 'compare'
    profile:
      inline:
        display_name: Comparatore offerte
        crews:
        - id: comparer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Confronti offerte di fornitori per un cantiere. Leggi le voci con list_items, le richieste con list_rfqs
            e le offerte con list_offers (solo quelle del cantiere indicato). Per ogni voce produci una tabella: fornitore,
            prezzo unitario, totale (prezzo × quantità), tempi di consegna, condizioni; evidenzia in grassetto la più conveniente
            e dì se una offerta più cara consegna molto prima. Segnala voci senza offerte e offerte incomplete o non confrontabili
            (unità diverse, IVA inclusa/esclusa). Aggiungi un riepilogo con totale per fornitore e totale se si sceglie sempre
            il più conveniente, con un grafico in blocco ```chart (bar) con dati reali. Non inventare prezzi. Il report inizia
            con ''# Confronto offerte — <cantiere>''. La decisione spetta al tecnico.'
          mcp_servers: []
    goalTemplate: 'Cantiere: {site}

      Confronta tutte le offerte ricevute. Data: {date}. Scrivi in italiano.'
    appTools:
    - name: list_items
      description: Legge le voci del computo
      action: read
      collection: items
      scope: user
    - name: list_rfqs
      description: Legge le richieste d'offerta
      action: read
      collection: rfqs
      scope: user
    - name: list_offers
      description: Legge le offerte estratte
      action: read
      collection: offers
      scope: user
    output: markdown
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.6
  - key: offer_reader
    role: helper
    description: Legge le email di risposta dei fornitori ed estrae le offerte.
    profile:
      inline:
        display_name: Lettore offerte
        crews:
        - id: offer_reader
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Ricevi l''email di risposta di un fornitore a una richiesta d''offerta. Trova il riferimento (RFQ-...)
            nel testo e controlla la richiesta con find_rfqs. Per ogni voce quotata salva con save_offer: reference, site,
            supplier_name, item_description, unit, quantity, unit_price (numero, EUR), total, delivery_days (numero, giorni),
            conditions (pagamento, trasporto, validità, IVA), notes. Non inventare: se un dato manca lascialo vuoto e annotalo
            in notes. Se non trovi la richiesta corrispondente o l''email non è un''offerta, non salvare nulla e spiega perché.
            Rispondi con un breve riepilogo di ciò che hai salvato.'
          mcp_servers: []
    appTools:
    - name: find_rfqs
      description: Cerca le richieste d'offerta inviate
      action: search
      collection: rfqs
      scope: all
    - name: save_offer
      description: Salva una offerta di fornitore
      action: write
      collection: offers
      scope: all
    goalTemplate: 'Email ricevuta:

      {message}'
    output: markdown
  inputForm:
    title: Nuova operazione
    fields:
    - name: mode
      type: select
      required: true
      label: Cosa vuoi fare
      default: extract
      options:
      - value: extract
        label: Carica un computo e prepara le richieste
      - value: compare
        label: Confronta le offerte ricevute
    - name: site
      type: select
      required: true
      label: Cantiere
      optionsFrom: collection:sites
    - name: computo
      type: file
      label: Computo metrico (PDF o Excel)
      accept:
      - pdf
      - xlsx
      - csv
      - jpg
      - png
      maxMb: 15
      multiple: false
      visibleWhen: mode == 'extract'
    - name: notes
      type: textarea
      maxLength: 500
      label: Note (facoltative)
      visibleWhen: mode == 'extract'
  data:
    collections:
    - name: sites
      ownedBy: user
      description: Cantieri dell'impresa
      fields:
      - name: name
        type: text
        required: true
        label: Nome cantiere
      - name: address
        type: text
        label: Indirizzo
      - name: notes
        type: textarea
        label: Note
    - name: suppliers
      ownedBy: user
      description: Rubrica fornitori dell'impresa
      fields:
      - name: name
        type: text
        required: true
        label: Fornitore
      - name: email
        type: email
        required: true
        label: Email
      - name: category
        type: text
        required: true
        label: Categoria (es. calcestruzzo, impianti elettrici)
      - name: phone
        type: text
        label: Telefono
    - name: items
      ownedBy: user
      description: Voci estratte dai computi
      retentionDays: 1825
      fields:
      - name: site
        type: text
        label: Cantiere
      - name: description
        type: text
        label: Descrizione
      - name: quantity
        type: number
        label: Quantità
      - name: unit
        type: text
        label: U.M.
      - name: category
        type: text
        label: Categoria fornitore
    - name: rfqs
      ownedBy: user
      description: Richieste d'offerta ai fornitori
      fields:
      - name: reference
        type: text
        label: Riferimento
      - name: site
        type: text
        label: Cantiere
      - name: category
        type: text
        label: Categoria
      - name: supplier_name
        type: text
        label: Fornitore
      - name: supplier_email
        type: email
        label: Email fornitore
      - name: subject
        type: text
        label: Oggetto
      - name: items_text
        type: textarea
        label: Voci richieste
      - name: body
        type: textarea
        label: Messaggio
      - name: status
        type: select
        label: Stato
        default: draft
        options:
        - value: draft
          label: Bozza
        - value: approved
          label: Approvata e inviata
        - value: cancelled
          label: Annullata
    - name: offers
      ownedBy: user
      description: Offerte dei fornitori estratte dalle email
      fields:
      - name: reference
        type: text
        label: Riferimento
      - name: site
        type: text
        label: Cantiere
      - name: supplier_name
        type: text
        label: Fornitore
      - name: item_description
        type: text
        label: Voce
      - name: unit
        type: text
        label: U.M.
      - name: quantity
        type: number
        label: Quantità
      - name: unit_price
        type: number
        label: Prezzo unitario
      - name: total
        type: number
        label: Totale
      - name: delivery_days
        type: number
        label: Consegna (giorni)
      - name: conditions
        type: textarea
        label: Condizioni
      - name: notes
        type: textarea
        label: Note
    - name: orders
      ownedBy: user
      description: Ordini confermati
      fields:
      - name: site
        type: text
        required: true
        label: Cantiere
      - name: supplier_name
        type: text
        required: true
        label: Fornitore
      - name: supplier_email
        type: email
        required: true
        label: Email fornitore
      - name: items_text
        type: textarea
        required: true
        label: Voci ordinate (con quantità e prezzi)
      - name: total
        type: number
        label: Totale
      - name: notes
        type: textarea
        label: Condizioni e note
  channels:
  - key: offerte_mail
    type: email
    agent: offer_reader
  triggers:
  - key: rfq_send
    description: Invia la richiesta al fornitore quando il tecnico la approva
    'on':
      collection: rfqs
      op: update
      where:
        status: approved
    notify:
      to:
      - record.supplier_email
      subject: '{record.subject}'
      body: '{record.body}


        Voci richieste:

        {record.items_text}


        Riferimento: {record.reference}'
  - key: order_send
    description: Conferma l'ordine al fornitore
    'on':
      collection: orders
      op: insert
    notify:
      to:
      - record.supplier_email
      - owner
      subject: Conferma ordine – {record.site}
      body: 'Con la presente confermiamo l''ordine per il cantiere {record.site}:


        {record.items_text}


        Totale: {record.total}

        {record.notes}'
  views:
  - key: home
    type: page
    nav: false
    sections:
    - type: hero
      title: Dal computo metrico all'**ordine giusto**
      text: Carica il computo, l'agente prepara le richieste d'offerta per categoria, legge le risposte dei fornitori e ti
        mostra chi conviene, voce per voce.
      actions:
      - label: Inizia
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title: Come funziona
      items:
      - title: Carica il computo
        text: 'PDF o Excel: l''agente estrae materiali, quantità e unità di misura.'
      - title: Approva le richieste
        text: Le voci sono raggruppate per categoria; le email partono ai fornitori della tua rubrica solo dopo la tua approvazione.
      - title: Confronta le offerte
        text: 'Le risposte arrivano in una casella dedicata e vengono lette: prezzi, consegne, condizioni.'
      - title: Conferma l'ordine
        text: Scegli il fornitore e l'ordine parte con la conferma.
    - type: cards
      id: piano
      title: Piano
      items:
      - title: Abbonamento mensile per impresa
        text: Cantieri, fornitori e offerte sono privati della tua impresa.
    - type: note
      content: 'Strumento di supporto: verifica sempre le voci estratte e le offerte prima di ordinare.'
  - key: new
    type: new_run
    title: Nuova operazione
    roles:
    - user
    - admin
  - key: runs
    type: history
    title: Storico
    source: run
    roles:
    - user
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: site_new
    type: form
    title: Nuovo cantiere
    collection: sites
    submit:
      label: Salva
      message: Cantiere salvato
    roles:
    - user
    - admin
  - key: sites_list
    type: table
    title: Cantieri
    source: collection:sites
    roles:
    - user
    - admin
  - key: supplier_new
    type: form
    title: Nuovo fornitore
    collection: suppliers
    submit:
      label: Salva
      message: Fornitore aggiunto
      redirect: suppliers_list
    roles:
    - user
    - admin
  - key: suppliers_list
    type: table
    title: Rubrica fornitori
    source: collection:suppliers
    export: true
    roles:
    - user
    - admin
  - key: items_list
    type: table
    title: Voci del computo
    source: collection:items
    export: true
    roles:
    - user
    - admin
  - key: rfqs_list
    type: table
    title: Richieste d'offerta
    source: collection:rfqs
    columns:
    - reference
    - site
    - category
    - supplier_name
    - status
    roles:
    - user
    - admin
  - key: rfq_review
    type: form
    title: Rivedi e approva richiesta
    collection: rfqs
    fields:
    - subject
    - items_text
    - body
    - status
    edit: true
    submit:
      label: Salva
      message: Richiesta aggiornata. Se approvata, è partita via email.
      redirect: rfqs_list
    nav: false
    roles:
    - user
    - admin
  - key: offers_list
    type: table
    title: Confronto offerte
    source: collection:offers
    columns:
    - item_description
    - supplier_name
    - unit
    - quantity
    - unit_price
    - total
    - delivery_days
    - conditions
    export: true
    roles:
    - user
    - admin
  - key: order_new
    type: form
    title: Conferma ordine
    collection: orders
    submit:
      label: Conferma e invia
      message: Ordine confermato e inviato al fornitore
      redirect: orders_list
    roles:
    - user
    - admin
  - key: orders_list
    type: table
    title: Ordini
    source: collection:orders
    export: true
    roles:
    - user
    - admin
  - key: account
    type: account
    title: Abbonamento
    roles:
    - user
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: impresa
      price: 79
      interval: month
      label: Impresa
      includes:
      - Cantieri e fornitori illimitati
      - Estrazione computi, richieste e confronto offerte
  notifications:
    emailOnRunDone: true
