apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: seconda-vita
  displayName: Seconda Vita
  tagline:
    it: Il tuo usato, la sua seconda vita sull'e-shop del brand.
    en: Your pre-loved pieces, a second life on the brand's e-shop.
  description:
    it: 'I clienti del brand rivendono i capi acquistati in passato: un agente riconosce il modello, suggerisce il prezzo
      e prepara la scheda; il team verifica autenticità e stato e approva la vendita.'
    en: 'Brand customers resell past purchases: an agent recognises the model, suggests a price and prepares the listing;
      the team checks authenticity and condition and approves it.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f2a2e'
      accent: '#8a5a44'
      background: '#f7f4ef'
      foreground: '#1c1c1c'
    fonts:
      body: Inter
      display: Cormorant Garamond
    wordmark:
    - text: 'Seconda '
      color: primary
    - text: Vita
      color: accent
    width: wide
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Capi in vendita
        en: For sale
      href: /v/shop
    cta:
      label:
        it: Vendi un capo
        en: Sell an item
      href: /v/new_listing
  auth:
    method: magic_link
    anonymous:
      views:
      - home
      - shop
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: staff
      label:
        it: Team del brand
        en: Brand team
      assignedBy: invite
    - key: user
      assignedBy: signup
  limits:
  - action: agent:appraiser
    per: user
    max: 5
    window: day
    roles:
    - user
  agents:
  - key: appraiser
    role: main
    description: Recognises the garment against the brand's historic catalogue, suggests a price and prepares the listing.
    profile:
      inline:
        display_name: Seconda Vita appraiser
        crews:
        - id: appraiser
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You prepare resale listings for a fashion brand''s second-hand programme. Input: a customer''s garment
            (optionally from their order history), photos, size, declared condition, desired price and payout choice (cash
            or brand voucher). Steps: 1) call read_upload with each photo file id to look at the garment; 2) call search_catalog
            with model/collection/colour keywords to match the garment with the brand''s historic catalogue; report the matched
            model reference and your confidence (high/medium/low) and say clearly if no match is found. Never claim authenticity:
            the brand team verifies it. 3) Suggest a resale price from the original price (catalogue or order history), condition
            and age; give a range and one recommended price, with the reasoning, and a demand level (low/medium/high) only
            from catalogue/order evidence, never invented figures. If the desired price is far above the range, say so. 4)
            If the payout is voucher, the voucher value is the recommended cash price x 1.25 rounded to the euro. 5) Estimate
            CO2 saved in kg by reselling instead of a new garment, using a rounded typical figure per garment category, labelled
            as an estimate. Write the report in the language with the ISO code given. Report structure: a level-1 title ''#
            <Model> — scheda Seconda Vita'', then ## Riconoscimento, ## Condizioni dalle foto, ## Prezzo suggerito, ## Scheda
            per l''e-shop (title, description of 60 words max), ## Cosa verificherà il team. If photos are insufficient, say
            which are missing. End with ONE fenced json block with keys: title, model_ref, match_confidence, size, condition,
            desired_price, suggested_price, price (the recommended price), payout (cash|voucher), voucher_value (number or
            0), co2_kg, demand, summary, seller_email, status (always ''pending_review'').'
    goalTemplate: 'Customer email: {email}

      {?item}Garment from order history: {past_title} (SKU {past_sku}, paid {past_price}).{/item}

      {?description}Garment description: {description}{/description}

      Photos (file ids): {photos}

      Size: {size}

      Condition: {condition_label}

      Desired price: {desired_price}

      Payout: {payout_label}

      {?notes}Notes: {notes}{/notes}

      Today is {date}. Write in the language with ISO code {lang}.'
    context:
    - key: email
      from: user.email
    - key: past_title
      from: collection:past_orders.title
    - key: past_sku
      from: collection:past_orders.sku
    - key: past_price
      from: collection:past_orders.price_paid
    appTools:
    - name: read_upload
      description: Read a photo the user uploaded (OCR included)
      action: read_file
    - name: search_catalog
      description: Search the brand's historic catalogue (models, collections, original prices)
      action: search
      collection: catalog
      scope: all
    output: markdown+json
    resultSchema:
      type: object
      properties:
        title:
          type: string
        model_ref:
          type: string
        match_confidence:
          type: string
        size:
          type: string
        condition:
          type: string
        desired_price:
          type: number
        suggested_price:
          type: number
        price:
          type: number
        payout:
          type: string
        voucher_value:
          type: number
        co2_kg:
          type: number
        demand:
          type: string
        summary:
          type: string
        seller_email:
          type: string
        status:
          type: string
    writesTo:
      collection: listings
      parse: json_last
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.6
  inputForm:
    title:
      it: Vendi un capo
      en: Sell an item
    fields:
    - name: item
      type: select
      optionsFrom: collection:past_orders
      label:
        it: Capo dal tuo storico ordini
        en: Item from your order history
    - name: description
      type: text
      maxLength: 200
      label:
        it: Oppure descrivilo
        en: Or describe it
    - name: photos
      type: file
      required: true
      accept:
      - jpg
      - jpeg
      - png
      - webp
      maxMb: 10
      multiple: true
      label:
        it: Foto (fronte, retro, etichetta, difetti)
        en: Photos (front, back, label, flaws)
    - name: size
      type: text
      required: true
      label:
        it: Taglia
        en: Size
    - name: condition
      type: select
      required: true
      label:
        it: Condizioni
        en: Condition
      options:
      - value: new_tag
        label:
          it: Nuovo con cartellino
          en: New with tags
      - value: excellent
        label:
          it: Ottimo
          en: Excellent
      - value: good
        label:
          it: Buono
          en: Good
      - value: fair
        label:
          it: Discreto
          en: Fair
    - name: desired_price
      type: number
      required: true
      label:
        it: Prezzo desiderato (€)
        en: Desired price (€)
    - name: payout
      type: select
      required: true
      label:
        it: Come vuoi essere pagato
        en: Payout
      options:
      - value: cash
        label:
          it: Denaro (Stripe)
          en: Cash (Stripe)
      - value: voucher
        label:
          it: Buono acquisto del brand (valore maggiore)
          en: Brand voucher (higher value)
    - name: notes
      type: textarea
      maxLength: 400
      label:
        it: Note (facoltative)
        en: Notes (optional)
  data:
    collections:
    - name: past_orders
      ownedBy: user
      description: Customer's purchase history sent by the brand's e-shop
      access:
      - role: staff
      fields:
      - name: title
        type: text
      - name: sku
        type: text
      - name: price_paid
        type: number
      - name: purchase_date
        type: date
      - name: email
        type: email
    - name: catalog
      ownedBy: shared
      description: The brand's historic catalogue
      fields:
      - name: model_ref
        type: text
      - name: name
        type: text
      - name: collection
        type: text
      - name: category
        type: text
      - name: colour
        type: text
      - name: material
        type: text
      - name: original_price
        type: number
      - name: year
        type: number
    - name: seller_profiles
      ownedBy: user
      description: Seller details for Stripe Connect payouts
      access:
      - role: staff
      fields:
      - name: full_name
        type: text
        required: true
      - name: country
        type: country
        required: true
      - name: phone
        type: text
    - name: listings
      ownedBy: user
      description: Each seller's items with price, condition and review status
      access:
      - role: staff
        can:
        - read
        - write
      fields:
      - name: title
        type: text
      - name: model_ref
        type: text
      - name: match_confidence
        type: text
      - name: size
        type: text
      - name: condition
        type: text
      - name: desired_price
        type: number
      - name: suggested_price
        type: number
      - name: price
        type: number
      - name: payout
        type: select
        options:
        - cash
        - voucher
      - name: voucher_value
        type: number
      - name: co2_kg
        type: number
      - name: demand
        type: text
      - name: summary
        type: textarea
      - name: seller_email
        type: email
      - name: status
        type: select
        options:
        - pending_review
        - needs_info
        - approved
        - rejected
        - sold
        default: pending_review
      - name: auth_notes
        type: textarea
        label:
          it: Esito verifica autenticità e stato
          en: Authenticity and condition check
      - name: received
        type: boolean
        label:
          it: Arrivato in magazzino
          en: Received in warehouse
    - name: storefront
      ownedBy: shared
      description: Approved listings shown in the brand's e-shop section
      fields:
      - name: listing_ref
        type: text
      - name: title
        type: text
      - name: model_ref
        type: text
      - name: size
        type: text
      - name: condition
        type: text
      - name: price
        type: number
      - name: summary
        type: textarea
      - name: co2_kg
        type: number
      - name: seller_email
        type: email
      - name: payout
        type: text
      - name: voucher_value
        type: number
      - name: status
        type: text
    - name: orders
      ownedBy: user
      description: Purchases of second-hand items (owner = buyer); sellers see their sales
      access:
      - role: staff
        can:
        - read
        - write
      - role: user
        where:
          seller_email: '{user.email}'
        can:
        - read
      fields:
      - name: listing_ref
        type: text
        required: true
      - name: title
        type: text
      - name: price
        type: number
      - name: seller_email
        type: email
      - name: buyer_email
        type: email
      - name: payout_type
        type: select
        options:
        - cash
        - voucher
      - name: voucher_value
        type: number
      - name: co2_kg
        type: number
      - name: ship_to
        type: textarea
        label:
          it: Indirizzo di spedizione
          en: Shipping address
      - name: status
        type: select
        options:
        - paid
        - shipped
        - delivered
        - return_requested
        - returned
        - refunded
        default: paid
      - name: tracking
        type: text
      - name: sold_on
        type: date
      - name: delivered_on
        type: date
      - name: return_until
        type: date
        help:
          it: Consegna + 14 giorni
          en: Delivery + 14 days
    - name: returns
      ownedBy: user
      description: Return requests within 14 days of delivery
      access:
      - role: staff
        can:
        - read
        - write
      fields:
      - name: order_ref
        type: text
        required: true
        label:
          it: Numero ordine
          en: Order id
      - name: reason
        type: textarea
        required: true
      - name: buyer_email
        type: email
      - name: status
        type: select
        options:
        - requested
        - accepted
        - rejected
        - received
        - refunded
        default: requested
      - name: staff_notes
        type: textarea
    - name: vouchers
      ownedBy: org
      description: Brand vouchers issued to sellers who chose store credit
      access:
      - role: user
        where:
          holder_email: '{user.email}'
        can:
        - read
      - role: staff
        can:
        - read
        - write
      fields:
      - name: holder_email
        type: email
      - name: value
        type: number
      - name: code
        type: text
      - name: status
        type: select
        options:
        - to_issue
        - issued
        - used
        default: to_issue
  views:
  - key: home
    type: page
    nav: false
    title: Seconda Vita
    sections:
    - type: hero
      eyebrow:
        it: Moda circolare
        en: Circular fashion
      title:
        it: Dai una **seconda vita** ai capi che non indossi più.
        en: Give a **second life** to the pieces you no longer wear.
      text:
        it: 'Scegli un capo dal tuo storico ordini, carica le foto: un agente prepara la scheda e il prezzo, il team del brand
          verifica e pubblica. Incassi in denaro o in un buono di valore maggiore.'
        en: 'Pick an item from your order history and upload photos: an agent prepares the listing and price, the brand team
          checks and publishes. Get paid in cash or a higher-value voucher.'
      actions:
      - label:
          it: Vendi un capo
          en: Sell an item
        href: /v/new_listing
        style: primary
      - label:
          it: Sfoglia l'usato
          en: Browse pre-loved
        href: /v/shop
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Carica
          en: Upload
        text:
          it: Foto, taglia, condizioni e prezzo desiderato.
          en: Photos, size, condition and desired price.
        badge: 📸
      - title:
          it: Scheda e prezzo
          en: Listing and price
        text:
          it: L'agente riconosce il modello nel catalogo storico e suggerisce il prezzo.
          en: The agent matches the model in the historic catalogue and suggests a price.
        badge: ✨
      - title:
          it: Verifica del brand
          en: Brand check
        text:
          it: Il team controlla autenticità e stato, poi approva la vendita.
          en: The team checks authenticity and condition, then approves.
        badge: ✅
      - title:
          it: Vendi
          en: Sell
        text:
          it: Acquirente paga con carta; incasso diviso tra venditore, brand e commissione. Resi entro 14 giorni.
          en: The buyer pays by card; proceeds split between seller, brand and service fee. 14-day returns.
        badge: 💶
    - type: data
      title:
        it: Ultimi arrivi
        en: Latest arrivals
      source: collection:storefront
      display: cards
      fields:
      - key: title
      - key: size
      - key: condition
        format: badge
      - key: price
        format: money
      filters:
      - field: status
        op: '='
        value: approved
      limit: 6
      empty:
        it: Presto i primi capi.
        en: First items coming soon.
    - type: note
      content:
        it: Prezzi e CO2 sono stime. L'autenticità è verificata dal team del brand prima della pubblicazione.
        en: Prices and CO2 are estimates. Authenticity is verified by the brand team before publication.
  - key: shop
    type: cards
    title:
      it: Seconda Vita — l'usato del brand
      en: Seconda Vita — pre-loved
    source: collection:storefront
    data:
      display: cards
      fields:
      - key: title
      - key: size
        label:
          it: Taglia
          en: Size
      - key: condition
        format: badge
      - key: price
        format: money
      - key: summary
      filters:
      - field: status
        op: '='
        value: approved
      sort:
        field: price
        dir: asc
      limit: 60
      empty:
        it: Nessun capo disponibile.
        en: No items available.
  - key: buy
    type: form
    title:
      it: Acquista
      en: Buy
    collection: orders
    fields:
    - listing_ref
    - ship_to
    submit:
      label:
        it: Procedi al pagamento
        en: Proceed to payment
      message:
        it: Ordine registrato. Riceverai le istruzioni di pagamento e la conferma di spedizione.
        en: Order saved. You will get payment instructions and shipping updates.
      redirect: my_orders
    roles:
    - user
    - admin
    nav: false
  - key: new_listing
    type: new_run
    title:
      it: Vendi un capo
      en: Sell an item
    roles:
    - user
    - admin
  - key: my_listings
    type: history
    title:
      it: I miei capi
      en: My items
    source: run
    roles:
    - user
    - admin
  - key: listing
    type: report
    source: run
    printable: true
    nav: false
  - key: my_items
    type: table
    title:
      it: Stato dei miei capi
      en: My items status
    source: collection:listings
    roles:
    - user
    data:
      display: table
      fields:
      - key: title
      - key: price
        format: money
      - key: payout
        format: badge
      - key: status
        format: badge
      - key: auth_notes
      sort:
        field: status
        dir: asc
  - key: my_orders
    type: table
    title:
      it: Ordini e vendite
      en: Orders and sales
    source: collection:orders
    roles:
    - user
    - admin
    data:
      display: table
      fields:
      - key: title
      - key: price
        format: money
      - key: status
        format: badge
      - key: tracking
      - key: return_until
        format: date
  - key: return_request
    type: form
    title:
      it: Richiedi un reso (entro 14 giorni)
      en: Request a return (within 14 days)
    collection: returns
    fields:
    - order_ref
    - reason
    submit:
      label:
        it: Invia richiesta
        en: Send request
      message:
        it: 'Richiesta inviata: il team ti risponderà a breve.'
        en: 'Request sent: the team will reply shortly.'
      redirect: my_orders
    roles:
    - user
  - key: my_vouchers
    type: table
    title:
      it: I miei buoni
      en: My vouchers
    source: collection:vouchers
    roles:
    - user
    data:
      display: table
      fields:
      - key: value
        format: money
      - key: code
      - key: status
        format: badge
  - key: seller_profile
    type: form
    title:
      it: Dati venditore
      en: Seller details
    collection: seller_profiles
    roles:
    - user
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Dati salvati.
        en: Saved.
  - key: review
    type: table
    title:
      it: Da verificare
      en: To review
    source: collection:listings
    roles:
    - staff
    - admin
    export: true
    data:
      display: table
      fields:
      - key: title
      - key: model_ref
      - key: match_confidence
        format: badge
      - key: condition
      - key: price
        format: money
      - key: status
        format: badge
      - key: received
      sort:
        field: status
        dir: asc
  - key: review_edit
    type: form
    title:
      it: Verifica e approvazione
      en: Check and approval
    collection: listings
    fields:
    - title
    - price
    - status
    - received
    - auth_notes
    edit: true
    submit:
      label:
        it: Salva esito
        en: Save outcome
      message:
        it: Esito salvato.
        en: Outcome saved.
      redirect: review
    roles:
    - staff
    - admin
    nav: false
  - key: orders_admin
    type: table
    title:
      it: Tutte le transazioni
      en: All transactions
    source: collection:orders
    roles:
    - staff
    - admin
    export: true
    data:
      display: table
      fields:
      - key: title
      - key: buyer_email
      - key: seller_email
      - key: price
        format: money
      - key: payout_type
        format: badge
      - key: status
        format: badge
      - key: sold_on
        format: date
      sort:
        field: sold_on
        dir: desc
  - key: order_edit
    type: form
    title:
      it: Spedizione e stato ordine
      en: Shipping and order status
    collection: orders
    fields:
    - status
    - tracking
    - delivered_on
    - return_until
    edit: true
    submit:
      label:
        it: Aggiorna
        en: Update
      redirect: orders_admin
    roles:
    - staff
    - admin
    nav: false
  - key: returns_admin
    type: table
    title:
      it: Resi e rimborsi
      en: Returns and refunds
    source: collection:returns
    roles:
    - staff
    - admin
    data:
      display: table
      fields:
      - key: order_ref
      - key: reason
      - key: status
        format: badge
      - key: staff_notes
  - key: return_edit
    type: form
    title:
      it: Gestisci reso
      en: Handle return
    collection: returns
    fields:
    - status
    - staff_notes
    edit: true
    submit:
      label:
        it: Salva
        en: Save
      redirect: returns_admin
    roles:
    - staff
    - admin
    nav: false
  - key: vouchers_admin
    type: table
    title:
      it: Buoni da emettere
      en: Vouchers to issue
    source: collection:vouchers
    roles:
    - staff
    - admin
    data:
      display: table
      fields:
      - key: holder_email
      - key: value
        format: money
      - key: code
      - key: status
        format: badge
  - key: monthly_report
    type: table
    title:
      it: 'Report mensile: capi rivenduti e CO2'
      en: 'Monthly report: items resold and CO2'
    source: collection:orders
    roles:
    - staff
    - admin
    export: true
    data:
      display: table
      fields:
      - key: sold_on
        label:
          it: Mese
          en: Month
      - key: count
        label:
          it: Capi rivenduti
          en: Items resold
      - key: revenue
        label:
          it: Venduto (€)
          en: Sales (€)
        format: money
      - key: co2
        label:
          it: CO2 risparmiata (kg)
          en: CO2 saved (kg)
        format: number
      groupBy:
        field: sold_on
        bucket: month
        aggs:
        - key: revenue
          agg: sum
          field: price
        - key: co2
          agg: sum
          field: co2_kg
  - key: account
    type: account
    title:
      it: Account
      en: Account
    roles:
    - user
  triggers:
  - key: listing_to_review
    'on':
      collection: listings
      op: insert
    notify:
      to: role:staff
      subject:
        it: 'Nuovo capo da verificare: {record.title}'
        en: 'New item to check: {record.title}'
      body:
        it: Un cliente ha proposto un capo in vendita. Verifica autenticità e stato.
        en: A customer proposed an item for sale. Please check authenticity and condition.
      link: review
  - key: publish
    'on':
      collection: listings
      op: update
      where:
        status: approved
    write:
      collection: storefront
      fields:
        listing_ref: id
        title: title
        model_ref: model_ref
        size: size
        condition: condition
        price: price
        summary: summary
        co2_kg: co2_kg
        seller_email: seller_email
        payout: payout
        voucher_value: voucher_value
        status: status
      keyBy: listing_ref
  - key: unpublish_sold
    'on':
      collection: listings
      op: update
      where:
        status: sold
    write:
      collection: storefront
      fields:
        listing_ref: id
        title: title
        price: price
        status: status
      keyBy: listing_ref
  - key: listing_approved_mail
    'on':
      collection: listings
      op: update
      where:
        status: approved
    notify:
      to: owner
      subject:
        it: 'Il tuo capo è in vendita: {record.title}'
        en: 'Your item is for sale: {record.title}'
      body:
        it: Il team del brand ha verificato e approvato la scheda. Ora è visibile nell'e-shop.
        en: The brand team checked and approved your listing. It is now live in the e-shop.
      link: my_items
  - key: listing_rejected_mail
    'on':
      collection: listings
      op: update
      where:
        status: rejected
    notify:
      to: owner
      subject:
        it: 'Esito verifica: {record.title}'
        en: 'Check result: {record.title}'
      body:
        it: Purtroppo non possiamo mettere in vendita questo capo. Vedi le note del team nell'app.
        en: Unfortunately we cannot list this item. See the team's notes in the app.
      link: my_items
  - key: order_new
    'on':
      collection: orders
      op: insert
    notify:
      to:
      - role:staff
      - record.seller_email
      subject:
        it: 'Nuovo ordine: {record.title}'
        en: 'New order: {record.title}'
      body:
        it: Un capo Seconda Vita è stato acquistato. Preparare la spedizione.
        en: A Seconda Vita item was purchased. Prepare shipping.
      link: orders_admin
  - key: order_shipped
    'on':
      collection: orders
      op: update
      where:
        status: shipped
    notify:
      to:
      - record.buyer_email
      - record.seller_email
      subject:
        it: 'Ordine spedito: {record.title}'
        en: 'Order shipped: {record.title}'
      body:
        it: 'Il tuo ordine è in viaggio. Tracking: {record.tracking}. Hai 14 giorni dalla consegna per il reso.'
        en: 'Your order is on its way. Tracking: {record.tracking}. You have 14 days after delivery to return it.'
      link: my_orders
  - key: return_new
    'on':
      collection: returns
      op: insert
    notify:
      to: role:staff
      subject:
        it: Richiesta di reso ordine {record.order_ref}
        en: Return request for order {record.order_ref}
      body:
        it: Verifica che sia entro 14 giorni dalla consegna e gestisci il reso.
        en: Check it is within 14 days of delivery and handle the return.
      link: returns_admin
  - key: return_refunded
    'on':
      collection: returns
      op: update
      where:
        status: refunded
    notify:
      to: record.buyer_email
      subject:
        it: Rimborso effettuato
        en: Refund issued
      body:
        it: Abbiamo rimborsato il tuo ordine {record.order_ref}.
        en: We refunded your order {record.order_ref}.
  - key: voucher_after_window
    'on':
      date:
        collection: orders
        field: return_until
        offsetDays: 0
        hour: 7
      where:
        payout_type: voucher
    write:
      collection: vouchers
      fields:
        holder_email: seller_email
        value: voucher_value
  - key: history_feed
    'on':
      webhook: true
    write:
      collection: past_orders
      fields:
        title: title
        sku: sku
        price_paid: price
        purchase_date: date
        email: email
      keyBy: sku
  billing:
    modes:
    - per_transaction
    currency: eur
    transactionFeePct: 8
    sellers: collection:seller_profiles
  notifications:
    emailOnRunDone: true
  egress:
    hosts:
    - api.stripe.com
    notes: Stripe Connect payments, handled by the platform.
  extensions:
  - key: eshop_embed
    description: Embedding the Seconda Vita section in the brand's existing e-shop and syncing the order history (webhook
      history_feed) from its platform.
  - key: split_rules
    description: 'Stripe Connect split seller/brand/service fee per sale and the refund executed after an accepted return:
      percentages are set in the studio; automatic refund and shipping-label generation are done by staff manually for now.'
  - key: carrier_labels
    description: Shipping carrier integration (labels, tracking) is not available yet; staff enter the tracking number.
