apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: seconda-vita
  displayName: Seconda Vita
  tagline:
    it: Il tuo usato, la sua seconda vita, sul sito del brand.
    en: Your pre-loved pieces, a second life on the brand's own shop.
  description:
    it: 'I clienti del brand mettono in vendita i capi acquistati in passato: un agente riconosce il modello, suggerisce il
      prezzo e prepara la scheda; il team del brand verifica e approva; chi compra paga con carta e l''incasso viene diviso
      tra venditore, brand e commissione di servizio.'
    en: 'Brand customers list garments they bought before: an agent recognises the model, suggests a price and prepares the
      listing; the brand team verifies and approves; buyers pay by card and the proceeds are split between seller, brand and
      service fee.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#2f3e34'
      accent: '#b5651d'
      background: '#f8f5ef'
      foreground: '#1c1f1d'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: 'Seconda '
      color: primary
    - text: Vita
      color: accent
    buttonShape: rounded
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Lo shop
        en: The shop
      href: /v/shop
    cta:
      label:
        it: Vendi un capo
        en: Sell a piece
      href: /v/new_listing
  auth:
    method: magic_link
    anonymous:
      views:
      - home
      - shop
    roles:
    - key: admin
      label:
        it: Team del brand
        en: Brand team
      assignedBy: admin_emails
    - key: user
      label:
        it: Cliente
        en: Customer
      assignedBy: signup
  limits:
  - action: agent:appraiser
    per: user
    max: 10
    window: day
    roles:
    - user
  agents:
  - key: appraiser
    role: main
    description: Recognises the garment against the brand's historical catalogue, suggests a price and prepares the listing,
      then asks the brand team for approval.
    profile:
      inline:
        display_name: Seconda Vita appraiser
        crews:
        - id: appraiser
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the resale appraiser of a fashion brand''s second-hand programme. You receive a customer''s
            garment (chosen from their order history), photo links, size, condition, desired price and payout choice (cash
            or brand voucher).

            Steps: 1) search the brand catalogue (tool catalog_search) and the customer''s order history (tool order_history_read)
            to identify the model, season and original price; give a confidence level and say plainly when no match is found.
            2) Suggest a resale price from original price, condition and demand signals in the catalogue (e.g. still in production,
            iconic model); compare with the customer''s desired price. Never invent figures: if you lack data, say so. 3)
            If the customer chose a voucher, state a voucher value higher than the cash payout (the brand sets the exact uplift:
            use ''to be confirmed by the brand'' if not known). 4) Estimate CO2 saved with a stated, conservative assumption
            per garment category. 5) Save the draft listing with the tool listing_write (status pending_review) and call request_listing_review
            so the brand team verifies authenticity and condition from the photos or on arrival at the warehouse. Do not promise
            approval.

            Output report: first line a level-1 title ''# <Model> — scheda Seconda Vita''. Then ## Modello riconosciuto, ##
            Prezzo suggerito (with a small table: original, suggested, desired, cash payout, voucher), ## Descrizione della
            scheda (ready for the shop), ## Punti da verificare per il team, ## Impatto (CO2 saved), ## Prossimi passi (shipping
            to the brand warehouse, 14-day returns for buyers). Write in the user''s language.'
          mcp_servers: []
    goalTemplate: 'Garment from order history: {garment}

      {?garment_free}Garment description: {garment_free}{/garment_free}

      Photo links: {photos}

      Size: {size}

      Condition: {condition_label}

      Desired price (EUR): {desired_price}

      Payout: {payout_label}

      {?notes}Notes: {notes}{/notes}

      Seller: {user}. Today is {date}. Write in the language with ISO code {lang}.'
    appTools:
    - name: catalog_search
      description: Search the brand's historical catalogue (models, seasons, original prices)
      action: search
      collection: brand_catalog
      scope: all
    - name: order_history_read
      description: Read the current customer's past orders
      action: read
      collection: order_history
      scope: user
    - name: listing_write
      description: Save the draft listing of the current customer
      action: write
      collection: listings
      scope: user
    awaits:
    - listing_review
    output: markdown
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.5
  - key: publisher
    role: helper
    description: When the brand team approves a listing, publishes it in the shop section.
    profile:
      inline:
        display_name: Seconda Vita publisher
        crews:
        - id: publisher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You publish an approved second-hand listing in the brand''s shop. Read the approved listing of the
            seller with listing_read, then create one shop item with shop_item_write: title, model, size, condition, price,
            photos, description, co2_saved_kg, seller_email, status ''available''. Copy only data present in the listing;
            never invent figures. Reply with a short level-1 titled confirmation ''# Scheda pubblicata — <title>''.'
    goalTemplate: Publish the listing just approved. Today is {date}.
    appTools:
    - name: listing_read
      description: Read the seller's approved listings
      action: read
      collection: listings
      scope: user
    - name: shop_item_write
      description: Create an item in the public shop section
      action: write
      collection: shop_items
      scope: all
    output: markdown
    limits:
      maxTurns: 6
      maxBudgetUsd: 0.2
  - key: reporter
    role: scheduled
    description: 'Monthly report for the brand: resold garments, revenue split and CO2 saved.'
    profile:
      inline:
        display_name: Seconda Vita monthly reporter
        crews:
        - id: reporter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write the monthly resale report for a fashion brand. Read the shop items with shop_items_read
            (status sold, with sold_at, price, co2_saved_kg, category) and keep only last month''s. Start with ''# Report
            Seconda Vita — <month year>''. Sections: ## Sintesi (garments resold, gross sales, brand share, returns/refunds
            if recorded), ## CO2 risparmiata (total, with the stated per-garment assumption), ## Categorie e modelli più venduti,
            ## Note. Include a ```chart block (bar) of garments resold by category using real figures only. If there is no
            data say so; never invent numbers.'
          mcp_servers: []
    goalTemplate: 'Write the report for the previous month. Today is {date}. Language: {lang}.'
    appTools:
    - name: shop_items_read
      description: Read all shop items
      action: read
      collection: shop_items
      scope: all
    writesTo:
      collection: monthly_reports
      parse: whole
      keyBy: month
    output: markdown
    limits:
      maxTurns: 6
      maxBudgetUsd: 0.3
  inputForm:
    title:
      it: Vendi un capo
      en: Sell a piece
    fields:
    - name: garment
      type: relation
      relation: order_history
      label:
        it: Capo dal tuo storico ordini
        en: Piece from your order history
      help:
        it: Scegli un capo già acquistato presso il brand.
        en: Pick a piece you bought from the brand.
    - name: garment_free
      type: text
      maxLength: 200
      label:
        it: Oppure descrivilo (modello, anno)
        en: Or describe it (model, year)
    - name: photos
      type: urls
      required: true
      label:
        it: Link alle foto
        en: Photo links
      help:
        it: Per ora incolla i link alle foto (caricamento file non ancora disponibile).
        en: For now paste photo links (file upload is not available yet).
    - name: size
      type: text
      required: true
      label:
        it: Taglia
        en: Size
    - name: condition
      type: select
      required: true
      label:
        it: Condizioni
        en: Condition
      options:
      - value: new_tag
        label:
          it: Nuovo con cartellino
          en: New with tags
      - value: excellent
        label:
          it: Ottime
          en: Excellent
      - value: good
        label:
          it: Buone
          en: Good
      - value: fair
        label:
          it: Usurato
          en: Worn
    - name: desired_price
      type: number
      label:
        it: Prezzo desiderato (€)
        en: Desired price (€)
    - name: payout
      type: select
      required: true
      default: cash
      label:
        it: Come vuoi essere pagato
        en: How you want to be paid
      options:
      - value: cash
        label:
          it: Denaro (Stripe)
          en: Cash (Stripe)
      - value: voucher
        label:
          it: Buono acquisto del brand (valore maggiore)
          en: Brand voucher (higher value)
    - name: notes
      type: textarea
      maxLength: 500
      label:
        it: Note (facoltative)
        en: Notes (optional)
  data:
    collections:
    - name: brand_catalog
      ownedBy: shared
      searchable: true
      description: The brand's historical catalogue, loaded by the brand team
      fields:
      - name: model
        type: text
      - name: season
        type: text
      - name: category
        type: text
      - name: original_price
        type: number
      - name: in_production
        type: boolean
    - name: order_history
      ownedBy: user
      description: A customer's past orders at the brand
      fields:
      - name: label
        type: text
      - name: model
        type: text
      - name: order_date
        type: date
      - name: price
        type: number
    - name: listings
      ownedBy: user
      description: A customer's own listings and their review status
      fields:
      - name: title
        type: text
      - name: model
        type: text
      - name: size
        type: text
      - name: condition
        type: text
      - name: price
        type: number
      - name: payout
        type: text
      - name: photos
        type: urls
      - name: status
        type: select
        options:
        - pending_review
        - approved
        - rejected
        - sold
      - name: co2_saved_kg
        type: number
    - name: shop_items
      ownedBy: shared
      description: Approved listings shown in the brand's e-shop section
      fields:
      - name: title
        type: text
      - name: model
        type: text
      - name: category
        type: text
      - name: size
        type: text
      - name: condition
        type: text
      - name: price
        type: number
      - name: photos
        type: urls
      - name: description
        type: textarea
      - name: co2_saved_kg
        type: number
      - name: seller_email
        type: email
      - name: status
        type: select
        options:
        - available
        - sold
        - returned
      - name: sold_at
        type: date
    - name: sellers
      ownedBy: user
      description: Seller payout profile (own Stripe Connect account)
      fields:
      - name: name
        type: text
      - name: email
        type: email
    - name: orders
      ownedBy: user
      description: A buyer's own purchases, shipping and returns
      fields:
      - name: item
        type: text
      - name: amount
        type: number
      - name: status
        type: select
        options:
        - paid
        - shipped
        - delivered
        - return_requested
        - refunded
    - name: monthly_reports
      ownedBy: org
      description: Monthly resale and CO2 reports, brand team only
      fields:
      - name: month
        type: text
  approvals:
  - key: listing_review
    title:
      it: Verifica autenticità e stato del capo
      en: Authenticity and condition check
    description: The brand team checks authenticity and condition (from photos or on arrival at the warehouse) and approves
      the listing for sale.
    role: admin
    decidedBy: role
    fields:
    - title
    - model
    - size
    - condition
    - price
    - photos
    timeoutMinutes: 10080
    onTimeout: reject
  triggers:
  - key: publish_on_approval
    description: Publish the listing in the shop when the brand approves it
    'on':
      approval: listing_review
      decision: approved
    start:
      agent: publisher
    goal: 'Publish the listing just approved. Event: {event}'
    asUser: true
  - key: monthly_report
    'on':
      cron: 0 6 1 * *
    start:
      agent: reporter
    goal: Write last month's resale report.
    asUser: false
  views:
  - key: home
    type: page
    nav: false
    title: Seconda Vita
    sections:
    - type: hero
      eyebrow:
        it: Usato di prima mano, dal brand
        en: Pre-loved, from the brand
      title:
        it: Dai una **seconda vita** ai capi che ami.
        en: Give the pieces you love a **second life**.
      text:
        it: 'Scegli un capo dal tuo storico ordini, aggiungi le foto: un agente riconosce il modello e suggerisce il prezzo.
          Il team del brand verifica e lo mette in vendita nello shop.'
        en: 'Pick a piece from your order history and add photos: an agent recognises the model and suggests a price. The
          brand team verifies it and lists it in the shop.'
      actions:
      - label:
          it: Vendi un capo
          en: Sell a piece
        href: /v/new_listing
        style: primary
      - label:
          it: Sfoglia lo shop
          en: Browse the shop
        href: /v/shop
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Proponi il capo
          en: Submit the piece
        text:
          it: Scegli dallo storico ordini, indica taglia, condizioni e prezzo, scegli denaro o buono acquisto.
          en: Pick from your order history, give size, condition and price, choose cash or voucher.
        badge: 👗
      - title:
          it: L'agente prepara la scheda
          en: The agent prepares the listing
        text:
          it: Riconosce il modello nel catalogo storico e suggerisce un prezzo.
          en: Matches the model in the historical catalogue and suggests a price.
        badge: 🤖
      - title:
          it: Il brand verifica
          en: The brand verifies
        text:
          it: Autenticità e stato del capo, dalle foto o all'arrivo in magazzino.
          en: Authenticity and condition, from photos or on arrival at the warehouse.
        badge: ✅
      - title:
          it: In vendita
          en: On sale
        text:
          it: Chi compra paga con carta, resi entro 14 giorni; l'incasso è diviso tra venditore, brand e commissione.
          en: Buyers pay by card, 14-day returns; proceeds are split between seller, brand and service fee.
        badge: 💶
    - type: cards
      title:
        it: Perché conviene
        en: Why it pays
      items:
      - title:
          it: Denaro o buono
          en: Cash or voucher
        text:
          it: Il buono del brand ha un valore maggiore del denaro.
          en: The brand voucher is worth more than cash.
      - title:
          it: CO2 risparmiata
          en: CO2 saved
        text:
          it: Ogni capo rivenduto evita nuova produzione, con una stima chiara.
          en: Every resold piece avoids new production, with a clear estimate.
    - type: note
      content:
        it: Le stime di prezzo e CO2 sono indicative. La messa in vendita è soggetta a verifica del brand.
        en: Price and CO2 figures are estimates. Listing is subject to the brand's verification.
  - key: shop
    type: page
    title:
      it: Shop Seconda Vita
      en: Seconda Vita shop
    sections:
    - type: data
      source: collection:shop_items
      display: cards
      title:
        it: Capi disponibili
        en: Available pieces
      fields:
      - key: title
        label:
          it: Capo
          en: Piece
      - key: size
        label:
          it: Taglia
          en: Size
      - key: condition
        label:
          it: Condizioni
          en: Condition
        format: badge
      - key: price
        label:
          it: Prezzo
          en: Price
        format: money
      - key: co2_saved_kg
        label: CO2 kg
        format: number
      filters:
      - field: status
        op: '='
        value: available
      limit: 60
      empty:
        it: Nessun capo disponibile al momento.
        en: No pieces available right now.
    - type: note
      content:
        it: Pagamento con carta. Resi entro 14 giorni dalla consegna.
        en: Card payment. Returns within 14 days of delivery.
  - key: new_listing
    type: new_run
    title:
      it: Vendi un capo
      en: Sell a piece
    roles:
    - user
    - admin
  - key: my_listings
    type: history
    title:
      it: I miei capi
      en: My pieces
    source: run
    roles:
    - user
  - key: listing
    type: report
    source: run
    printable: true
    nav: false
  - key: my_orders
    type: table
    title:
      it: I miei acquisti
      en: My purchases
    source: collection:orders
    roles:
    - user
    data:
      display: table
      fields:
      - key: item
        label:
          it: Capo
          en: Piece
      - key: amount
        label:
          it: Importo
          en: Amount
        format: money
      - key: status
        label:
          it: Stato
          en: Status
        format: badge
  - key: review
    type: approvals
    title:
      it: Verifiche da fare
      en: Checks to do
    approvals:
    - listing_review
    roles:
    - admin
  - key: transactions
    type: admin
    title:
      it: Transazioni
      en: Transactions
    roles:
    - admin
  - key: reports
    type: table
    title:
      it: Report mensili
      en: Monthly reports
    source: collection:monthly_reports
    roles:
    - admin
    printable: true
  - key: account
    type: account
    title:
      it: Pagamenti
      en: Payments
    roles:
    - user
  schedules: []
  billing:
    modes:
    - per_transaction
    currency: eur
    transactionFeePct: 10
    sellers: collection:sellers
    revenueShare:
    - to: collection:sellers
      pct: 70
      basis: sale price of the seller's item, after the service fee
      payout: connect
  extensions:
  - key: photo_upload
    description: 'Uploading photos is not available yet: the seller pastes photo links.'
  - key: shipping_returns_refunds
    description: Shipping labels, the 14-day return window and refunds are tracked only as order statuses; carrier integration
      and automatic Stripe refunds are not available yet and must be handled by the brand team.
  - key: brand_voucher
    description: Issuing the brand voucher needs the brand's e-shop/gift-card system; for now the brand team issues it manually
      after approval.
  - key: eshop_integration
    description: Showing approved items inside the brand's existing e-shop and importing order history requires a connector
      with the brand's platform; for now order_history is loaded by the brand team and the shop is a section of this app.
  - key: notifications
    description: Email notifications (approval needed, item sold, return) are not available yet.
