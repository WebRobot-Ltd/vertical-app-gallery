apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: contratto-chiaro
  displayName: ContrattoChiaro
  tagline:
    it: Contratti e documenti legali comuni, chiari e pronti all'uso.
  description:
    it: Genera contratti di locazione, NDA, collaborazioni, diffide e privacy policy con un modulo guidato, oppure fai spiegare
      in parole semplici un contratto ricevuto e scopri le clausole sfavorevoli.
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f3a5f'
      accent: '#2a7f6f'
      background: '#f7f8fa'
      foreground: '#1a2230'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Contratto
      color: primary
    - text: Chiaro
      color: accent
  header:
    links:
    - label:
        it: Come funziona
      href: '#come-funziona'
    - label:
        it: Documenti
      href: '#documenti'
    - label:
        it: Prezzi
      href: '#prezzi'
    cta:
      label:
        it: Inizia
      href: /v/new_doc
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  limits:
  - action: run
    per: user
    max: 15
    window: day
    roles:
    - user
  egress:
    hosts:
    - www.normattiva.it
    - eur-lex.europa.eu
    notes: 'Testi normativi pubblici: Normattiva (leggi italiane) ed EUR-Lex (diritto UE, riuso consentito con attribuzione).
      Usati solo come fonte di consultazione.'
  agents:
  - key: drafter
    role: main
    when: mode == 'genera'
    description: Redige il documento legale dai dati del modulo, citando la normativa e spiegando le scelte.
    profile:
      inline:
        display_name: ContrattoChiaro redattore
        crews:
        - id: drafter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'Sei un redattore di documenti legali italiani per privati e piccole imprese. Produci il documento
            richiesto (locazione, NDA, collaborazione, diffida, privacy policy) usando uno schema di modello standard prudente
            e, quando serve verificare un riferimento, consulta i testi normativi pubblici (Normattiva, EUR-Lex) tramite gli
            strumenti web a disposizione. Struttura obbligatoria: prima riga titolo di livello 1 "# <Tipo di documento> —
            <parti>"; poi ## Documento (testo completo con articoli numerati, parti, oggetto, durata, compenso, clausole facoltative
            richieste, luogo e data, spazio per le firme); ## Perché queste scelte (spiegazione in parole semplici di ogni
            clausola importante); ## Riferimenti normativi (solo norme che hai verificato; cita articolo e fonte); ## Da verificare
            (dati mancanti, punti che richiedono un professionista). Regole: non inventare dati delle parti, usa segnaposto
            [DA COMPILARE]; non inventare articoli di legge o cifre; ricorda che il documento è un modello informativo e non
            sostituisce la consulenza di un avvocato, specie per locazioni complesse e diffide con effetti giudiziali. Scrivi
            in italiano.'
    goalTemplate: 'Genera il documento: {doc_type_label}.

      Parte 1: {party_a}

      Parte 2: {party_b}

      Oggetto: {subject}

      {?duration}Durata: {duration}{/duration}

      {?fee}Compenso/corrispettivo: {fee}{/fee}

      {?clauses}Clausole facoltative richieste: {clauses}{/clauses}

      {?notes}Note: {notes}{/notes}

      Data di oggi: {date}.'
    output: markdown
    writesTo:
      collection: documents
      parse: whole
    limits:
      maxTurns: 25
      maxBudgetUsd: 1.0
  - key: reviewer
    role: main
    when: mode == 'analizza'
    description: Legge un contratto ricevuto (testo incollato), spiega le clausole e segnala quelle sfavorevoli o non conformi.
    profile:
      inline:
        display_name: ContrattoChiaro analista
        crews:
        - id: reviewer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un analista di contratti per non giuristi. Ricevi il testo di un contratto e spieghi le clausole
            in parole semplici. Struttura: prima riga "# Analisi — <tipo di contratto>"; ## In breve (5 righe); ## Clausola
            per clausola (tabella o elenco: clausola, cosa significa, semaforo verde/giallo/rosso); ## Clausole sfavorevoli
            o a rischio (perché, e come chiedere di modificarle, con testo alternativo proposto); ## Possibili problemi di
            conformità (solo norme di cui sei certo, es. Codice civile, normativa consumatori, GDPR; segnala l''incertezza);
            ## Prossimi passi. Non inventare norme o cifre; se il testo è incompleto dillo. Non è consulenza legale: suggerisci
            un professionista per rischi alti. Scrivi in italiano.'
    goalTemplate: 'Analizza questo contratto ricevuto. Il mio ruolo: {?my_role}{my_role}{/my_role}{!my_role}non indicato{/my_role}.


      TESTO DEL CONTRATTO:

      {contract_text}


      Data di oggi: {date}.'
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.6
  inputForm:
    title:
      it: Nuovo documento
    fields:
    - name: mode
      type: select
      required: true
      default: genera
      label:
        it: Cosa vuoi fare
      options:
      - value: genera
        label:
          it: Creare un documento
      - value: analizza
        label:
          it: Analizzare un contratto ricevuto
    - name: doc_type
      type: select
      required: true
      visibleWhen: mode == 'genera'
      label:
        it: Documento
      options:
      - value: locazione
        label:
          it: Contratto di locazione
      - value: nda
        label:
          it: NDA (accordo di riservatezza)
      - value: collaborazione
        label:
          it: Contratto di collaborazione
      - value: diffida
        label:
          it: Lettera di diffida
      - value: privacy
        label:
          it: Privacy policy
    - name: party_a
      type: text
      required: true
      visibleWhen: mode == 'genera'
      label:
        it: Parte 1 (nome, codice fiscale/P.IVA, indirizzo)
    - name: party_b
      type: text
      required: true
      visibleWhen: mode == 'genera'
      label:
        it: Parte 2 (nome, codice fiscale/P.IVA, indirizzo)
    - name: subject
      type: textarea
      required: true
      maxLength: 1200
      visibleWhen: mode == 'genera'
      label:
        it: Oggetto
      help:
        it: Es. immobile in via…, servizi di consulenza, informazioni riservate, contestazione…
    - name: duration
      type: text
      visibleWhen: mode == 'genera'
      label:
        it: Durata
    - name: fee
      type: text
      visibleWhen: mode == 'genera'
      label:
        it: Compenso / canone
    - name: clauses
      type: textarea
      maxLength: 800
      visibleWhen: mode == 'genera'
      label:
        it: Clausole facoltative
      help:
        it: Es. penale, recesso anticipato, esclusiva, foro competente
    - name: notes
      type: textarea
      maxLength: 600
      visibleWhen: mode == 'genera'
      label:
        it: Note (facoltative)
    - name: my_role
      type: text
      visibleWhen: mode == 'analizza'
      label:
        it: Il tuo ruolo nel contratto (es. conduttore, collaboratore)
    - name: contract_text
      type: textarea
      required: true
      maxLength: 30000
      visibleWhen: mode == 'analizza'
      label:
        it: Testo del contratto
      help:
        it: Incolla qui il testo (il caricamento di PDF/Word non è ancora disponibile)
  data:
    collections:
    - name: documents
      ownedBy: user
      description: I documenti dell'utente con il loro stato
      fields:
      - name: title
        type: text
      - name: doc_type
        type: text
      - name: status
        type: select
        default: bozza
        options:
        - value: bozza
          label: Bozza
        - value: inviato
          label: Inviato
        - value: firmato
          label: Firmato
      - name: counterpart_email
        type: email
  views:
  - key: home
    type: page
    title: ContrattoChiaro
    nav: false
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow:
        it: Documenti legali per privati e piccole imprese
      title:
        it: Contratti **chiari**, senza giri di parole.
      text:
        it: Scegli il documento, compila un modulo guidato e ottieni un testo completo con la spiegazione delle scelte. Hai
          ricevuto un contratto? Incollalo e ti diciamo cosa significa e dove stare attenti.
      actions:
      - label:
          it: Crea un documento
        href: /v/new_doc
        style: primary
      - label:
          it: Accedi
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
      items:
      - title:
          it: Scegli
        text:
          it: Locazione, NDA, collaborazione, diffida o privacy policy; oppure analisi di un contratto ricevuto.
        badge: 📄
      - title:
          it: Compila
        text:
          it: Parti, oggetto, durata, compenso e clausole facoltative in un modulo guidato.
        badge: ✍️
      - title:
          it: Ricevi
        text:
          it: Documento completo, stampabile in PDF, con spiegazione di ogni scelta e riferimenti normativi.
        badge: ✅
    - type: cards
      id: documenti
      title:
        it: Documenti disponibili
      items:
      - title:
          it: Locazione
        text:
          it: Contratti di affitto per abitazioni e locali.
      - title:
          it: NDA
        text:
          it: Accordi di riservatezza tra le parti.
      - title:
          it: Collaborazione
        text:
          it: Incarichi e collaborazioni professionali.
      - title:
          it: Diffida
        text:
          it: Lettere di messa in mora e contestazione.
      - title:
          it: Privacy policy
        text:
          it: Informative conformi al GDPR.
    - type: cards
      id: prezzi
      title:
        it: Prezzi
      items:
      - title:
          it: A documento
        text:
          it: Acquisti crediti e paghi solo ciò che usi.
      - title:
          it: Abbonamento Impresa
        text:
          it: Documenti illimitati per le imprese, ogni mese.
    - type: note
      content:
        it: ContrattoChiaro fornisce modelli e spiegazioni informative; non sostituisce la consulenza di un avvocato.
  - key: new_doc
    type: new_run
    title:
      it: Nuovo documento
    roles:
    - user
    - admin
  - key: my_docs
    type: page
    title:
      it: I miei documenti
    roles:
    - user
    - admin
    sections:
    - type: data
      source: collection:documents
      display: table
      fields:
      - key: title
        label:
          it: Documento
      - key: doc_type
        label:
          it: Tipo
      - key: status
        label:
          it: Stato
        format: badge
      empty:
        it: Nessun documento ancora.
  - key: history
    type: history
    title:
      it: Cronologia
    source: run
    roles:
    - user
    - admin
  - key: doc
    type: report
    source: run
    printable: true
    nav: false
  - key: account
    type: account
    title:
      it: Crediti e abbonamento
    roles:
    - user
  billing:
    modes:
    - credits
    - subscription
    currency: eur
    signupCredits: 20
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:drafter:
        estimate: 10
        metered: true
      agent:reviewer:
        estimate: 10
        metered: true
    packs:
    - key: singolo
      credits: 300
      price: 5
      label:
        it: Pacchetto documenti
    - key: pro
      credits: 1500
      price: 19
      label:
        it: Pacchetto Pro
    plans:
    - key: impresa
      price: 29
      interval: month
      label:
        it: Impresa — documenti illimitati
      includes:
      - documenti illimitati
      - analisi di contratti
  extensions:
  - key: firma_elettronica
    description: 'Non ancora disponibile: firma elettronica dentro l''app, invito via email alla controparte e archiviazione
      del documento firmato. Per ora lo stato (bozza, inviato, firmato) è gestito a mano.'
  - key: upload_pdf_word
    description: 'Non ancora disponibile: caricamento di PDF/Word da analizzare. Per ora l''utente incolla il testo del contratto.'
  - key: export_word
    description: 'Non ancora disponibile: esportazione in formato Word. Il PDF si ottiene dalla stampa del report.'
  - key: abbonamento_illimitato
    description: I documenti illimitati per il piano Impresa richiedono la gestione di un'esenzione dal costo per run, non
      ancora espressa nel manifesto.
  - key: notifiche_email
    description: 'Non ancora disponibili: email di invito alla controparte e avvisi di firma.'
