apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: contratto-chiaro
  displayName: ContrattoChiaro
  tagline:
    it: Documenti legali comuni, chiari e spiegati in parole semplici.
  description:
    it: Genera contratti di locazione, NDA, contratti di collaborazione, diffide e privacy policy con un modulo guidato, oppure
      carica un contratto ricevuto e fatti spiegare le clausole e i rischi.
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f3a5f'
      accent: '#2a7f62'
      background: '#f7f8fa'
      foreground: '#18212b'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Contratto
      color: primary
    - text: Chiaro
      color: accent
  header:
    links:
    - label:
        it: Come funziona
      href: '#come-funziona'
    - label:
        it: Documenti
      href: '#documenti'
    cta:
      label:
        it: Inizia
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  limits:
  - action: agent:drafter
    per: user
    max: 10
    window: day
    roles:
    - user
  - action: agent:reviewer
    per: user
    max: 10
    window: day
    roles:
    - user
  agents:
  - key: drafter
    role: main
    when: mode == 'generate'
    description: Redige il documento legale da modelli approvati e testi normativi indicizzati.
    profile:
      inline:
        display_name: ContrattoChiaro redattore
        crews:
        - id: drafter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un redattore di documenti legali italiani per privati e piccole imprese. Prima cerca con search_models
            il modello approvato per il tipo di documento e con search_legal le norme pertinenti (Codice civile, L. 431/1998
            per le locazioni abitative, GDPR e D.Lgs. 196/2003 per la privacy, ecc.). Usa SOLO modelli e testi trovati; se
            mancano, dillo e usa clausole standard prudenti segnalandolo. Struttura della risposta: un titolo di livello 1
            "# <Tipo di documento> — <parti>"; poi il testo completo del documento (intestazione, parti, premesse, articoli
            numerati, clausole facoltative scelte, luogo/data e spazio firme); poi la sezione "## Spiegazione delle scelte"
            in parole semplici, con i riferimenti normativi; infine "## Da verificare" con i dati mancanti o i punti per cui
            conviene un professionista. Non inventare dati, importi o articoli di legge. Non fornire consulenza legale come
            certezza: il documento è un modello compilato e va verificato. Usa un linguaggio chiaro, senza latinismi inutili.'
          mcp_servers: []
    goalTemplate: 'Genera il documento: {doc_type_label}.

      Parte A: {party_a}

      Parte B: {party_b}

      Oggetto: {subject}

      {?duration}Durata: {duration}{/duration}

      {?fee}Compenso/importo: {fee}{/fee}

      {?clauses}Clausole facoltative richieste: {clauses}{/clauses}

      {?notes}Note: {notes}{/notes}

      Data di oggi: {date}. Scrivi in italiano.'
    output: markdown
    appTools:
    - name: search_legal
      description: Cerca nei testi normativi pubblici indicizzati
      action: search
      collection: legal_texts
      scope: all
    - name: search_models
      description: Cerca i modelli di documento approvati
      action: search
      collection: doc_models
      scope: all
    writesTo:
      collection: documents
      parse: whole
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.6
  - key: reviewer
    role: main
    when: mode == 'review'
    description: Legge un contratto caricato, spiega le clausole e segnala quelle sfavorevoli o non conformi.
    profile:
      inline:
        display_name: ContrattoChiaro revisore
        crews:
        - id: reviewer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un revisore di contratti per non giuristi, in Italia. Se il testo del contratto non è fornito
            o è una scansione, usa read_upload con l''id del file. Cerca con search_legal le norme rilevanti (Codice civile,
            Codice del consumo, L. 431/1998, GDPR). Struttura: "# Revisione: <tipo di contratto>"; ## Riepilogo in 5 righe;
            ## Clausole spiegate (per ciascuna: cosa dice in parole semplici); ## Clausole sfavorevoli o a rischio (con livello
            alto/medio/basso, motivo e proposta di modifica); ## Possibili non conformità normative (con riferimento alla
            norma trovata); ## Cosa fare ora. Non inventare norme né dati; se non sei sicuro dillo. Non è consulenza legale:
            per importi rilevanti o rischi alti consiglia un professionista.'
          mcp_servers: []
    goalTemplate: 'Revisiona il contratto caricato.

      File: {contract}

      {?contract_text}Testo:

      {contract_text}{/contract_text}

      {?notes}Cosa preoccupa l''utente: {notes}{/notes}

      Data di oggi: {date}. Scrivi in italiano.'
    output: markdown
    appTools:
    - name: search_legal
      description: Cerca nei testi normativi pubblici indicizzati
      action: search
      collection: legal_texts
      scope: all
    - name: read_upload
      description: Legge un file caricato dall'utente (anche scansioni)
      action: read_file
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.6
  inputForm:
    title:
      it: Nuovo documento
    fields:
    - name: mode
      type: select
      required: true
      label:
        it: Cosa vuoi fare
      default: generate
      options:
      - value: generate
        label:
          it: Creare un documento
      - value: review
        label:
          it: Far analizzare un contratto ricevuto
    - name: doc_type
      type: select
      required: true
      visibleWhen: mode == 'generate'
      label:
        it: Documento
      options:
      - value: locazione
        label:
          it: Contratto di locazione
      - value: nda
        label:
          it: NDA (accordo di riservatezza)
      - value: collaborazione
        label:
          it: Contratto di collaborazione
      - value: diffida
        label:
          it: Diffida
      - value: privacy
        label:
          it: Privacy policy
    - name: party_a
      type: text
      required: true
      visibleWhen: mode == 'generate'
      label:
        it: Parte A (nome, codice fiscale/P.IVA, indirizzo)
    - name: party_b
      type: text
      required: true
      visibleWhen: mode == 'generate'
      label:
        it: Parte B / controparte (nome, CF/P.IVA, indirizzo)
    - name: subject
      type: textarea
      required: true
      maxLength: 1000
      visibleWhen: mode == 'generate'
      label:
        it: Oggetto
      help:
        it: Es. immobile in via…, attività richiesta, informazioni riservate, motivo della diffida
    - name: duration
      type: text
      visibleWhen: mode == 'generate'
      label:
        it: Durata
    - name: fee
      type: text
      visibleWhen: mode == 'generate'
      label:
        it: Compenso / canone / importo
    - name: clauses
      type: multiselect
      visibleWhen: mode == 'generate'
      label:
        it: Clausole facoltative
      options:
      - value: penale
        label:
          it: Penale
      - value: recesso
        label:
          it: Recesso anticipato
      - value: esclusiva
        label:
          it: Esclusiva
      - value: foro
        label:
          it: Foro competente
      - value: riservatezza
        label:
          it: Riservatezza
      - value: rinnovo
        label:
          it: Rinnovo tacito
    - name: contract
      type: file
      accept:
      - pdf
      - docx
      maxMb: 10
      visibleWhen: mode == 'review'
      label:
        it: Contratto da analizzare (PDF o Word)
    - name: notes
      type: textarea
      maxLength: 600
      label:
        it: Note (facoltative)
  data:
    collections:
    - name: legal_texts
      ownedBy: shared
      description: Testi normativi pubblici indicizzati, caricati dagli admin
      fields:
      - name: title
        type: text
        required: true
      - name: source
        type: text
      - name: text
        type: textarea
    - name: doc_models
      ownedBy: shared
      description: Modelli di documento approvati, caricati dagli admin
      fields:
      - name: doc_type
        type: text
        required: true
      - name: title
        type: text
      - name: text
        type: textarea
    - name: documents
      ownedBy: user
      description: Documenti dell'utente con stato
      fields:
      - name: title
        type: text
        label:
          it: Titolo
      - name: doc_type
        type: text
        label:
          it: Tipo
      - name: counterparty_email
        type: email
        label:
          it: Email della controparte
      - name: status
        type: select
        label:
          it: Stato
        default: bozza
        options:
        - value: bozza
          label:
            it: Bozza
        - value: inviato
          label:
            it: Inviato
        - value: firmato
          label:
            it: Firmato
      - name: signed_file
        type: file
        accept:
        - pdf
        label:
          it: Documento firmato
  views:
  - key: home
    type: page
    nav: false
    title: ContrattoChiaro
    sections:
    - type: hero
      title:
        it: Documenti legali **chiari**, senza giri di parole.
      text:
        it: Crea locazioni, NDA, contratti di collaborazione, diffide e privacy policy con un modulo guidato, oppure carica
          un contratto ricevuto e scopri cosa dice davvero.
      actions:
      - label:
          it: Inizia ora
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
      items:
      - title:
          it: Scegli
        text:
          it: Seleziona il documento e compila il modulo guidato, oppure carica un contratto.
      - title:
          it: L'agente lavora
        text:
          it: Usa modelli approvati e testi normativi pubblici e spiega ogni scelta.
      - title:
          it: Invia e archivia
        text:
          it: 'Invita la controparte via email e segui lo stato: bozza, inviato, firmato.'
    - type: cards
      id: documenti
      title:
        it: Documenti disponibili
      items:
      - title:
          it: Locazione
        text:
          it: Contratti di affitto per abitazioni e locali.
      - title:
          it: NDA
        text:
          it: Accordi di riservatezza.
      - title:
          it: Collaborazione
        text:
          it: Incarichi e collaborazioni professionali.
      - title:
          it: Diffida
        text:
          it: Lettere di diffida e messa in mora.
      - title:
          it: Privacy policy
        text:
          it: Informative per sito o attività.
    - type: note
      content:
        it: ContrattoChiaro fornisce modelli compilati e spiegazioni, non consulenza legale. Verifica sempre i documenti importanti
          con un professionista.
  - key: new_doc
    type: new_run
    title:
      it: Nuovo documento
    roles:
    - user
    - admin
  - key: my_docs
    type: table
    title:
      it: I miei documenti
    source: collection:documents
    columns:
    - title
    - doc_type
    - status
    - counterparty_email
    export: true
    roles:
    - user
    - admin
  - key: send_doc
    type: form
    title:
      it: Invita la controparte
    collection: documents
    fields:
    - title
    - doc_type
    - counterparty_email
    - status
    - signed_file
    edit: true
    submit:
      label:
        it: Salva
      message:
        it: Documento aggiornato.
      redirect: my_docs
    roles:
    - user
    - admin
  - key: history
    type: history
    title:
      it: Cronologia analisi
    source: run
    roles:
    - user
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: account
    type: account
    title:
      it: Crediti e abbonamento
    roles:
    - user
  triggers:
  - key: invite_sent
    'on':
      collection: documents
      op: update
      where:
        status: inviato
    notify:
      to:
      - record.counterparty_email
      - owner
      subject:
        it: 'Documento da firmare: {record.title}'
      body:
        it: Ti è stato inviato il documento "{record.title}" tramite ContrattoChiaro. Aprilo dal link per leggerlo.
      link: my_docs
  notifications:
    emailOnRunDone: true
  billing:
    modes:
    - credits
    - subscription
    signupCredits: 30
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:drafter:
        estimate: 150
        metered: true
      agent:reviewer:
        estimate: 100
        metered: true
    packs:
    - key: doc_1
      credits: 300
      price: 4.9
      label: 1-2 documenti
    - key: doc_10
      credits: 2000
      price: 29
      label: 10 documenti
    plans:
    - key: business
      price: 39
      interval: month
      label: Imprese — documenti illimitati
      credits: 5000
      creditsReset: monthly
  extensions:
  - key: esignature
    description: 'Firma elettronica dentro l''app per la controparte (che non ha un account), con valore legale (FEA/FES),
      non disponibile: la controparte riceve l''invito via email e lo stato si aggiorna a mano; il file firmato si carica
      nel documento. Serve un provider di firma esterno.'
  - key: docx_pdf_export
    description: 'Generazione di file Word e PDF: oggi il documento è un report stampabile (salvabile in PDF dal browser);
      l''export Word non è disponibile.'
  - key: unlimited_plan
    description: Il piano Imprese è approssimato con un'allocazione mensile ampia di crediti; l'esenzione totale dal costo
      per documento non è esprimibile.
  - key: legal_corpus
    description: Gli admin devono caricare testi normativi e modelli approvati in /admin/data (legal_texts, doc_models).
