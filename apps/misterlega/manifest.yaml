apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: misterlega
  displayName: MisterLega
  tagline:
    it: Il tuo assistente per schierare la formazione del fantacalcio.
  description:
    it: Crea o entra in una lega, inserisci la tua rosa e prima di ogni giornata ricevi probabili formazioni, punteggi attesi
      e la formazione consigliata. Decidi sempre tu.
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#0b3d2e'
      accent: '#e8a317'
      background: '#f6f8f5'
      foreground: '#14201a'
    fonts:
      body: Inter
      display: Oswald
    wordmark:
    - text: Mister
      color: primary
    - text: Lega
      color: accent
  header:
    links:
    - label:
        it: Come funziona
      href: '#come-funziona'
    - label:
        it: Piani
      href: '#piani'
    cta:
      label:
        it: Inizia
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  limits:
  - action: agent:advisor
    per: user
    max: 5
    window: day
    plans:
      premium: 30
  agents:
  - key: stats
    role: scheduled
    description: Raccoglie ogni settimana le statistiche pubbliche per la giornata.
    writesTo:
      collection: player_stats
      parse: json_last
      keyBy: matchday
    output: markdown+json
    goalTemplate: 'Oggi è {date}. Raccogli per la prossima giornata di Serie A: probabili formazioni, infortunati, squalificati,
      diffidati, calendario e rendimento recente (ultime 5 giornate, fantamedia) dei giocatori. Usa solo fonti che ne consentono
      la consultazione. Alla fine scrivi un blocco JSON con matchday, players (array di {name, team, role, status, probable_starter,
      form_avg, fixture, note}) e sources.'
    limits:
      maxTurns: 40
      maxBudgetUsd: 1.5
    profile:
      inline:
        display_name: MisterLega raccolta dati
        crews:
        - id: stats
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'Sei un analista di dati calcistici. Raccogli dati pubblici sulla prossima giornata di Serie A SOLO
            da siti che ne permettono la consultazione secondo termini d''uso e robots.txt; cita sempre le fonti. Non inventare
            dati: se un''informazione manca scrivila come non disponibile. Apri con un titolo ''# Dati giornata <n>'' poi
            un breve riepilogo per squadra (assenti, dubbi, probabili titolari) e chiudi con un unico blocco JSON valido con
            matchday, players e sources.'
  - key: advisor
    role: main
    description: Calcola punteggi attesi e propone formazione, scambi e acquisti.
    memory: user
    goalTemplate: 'Lega: {league}. Giornata: {matchday}.

      Regolamento: {rules}. Bonus/malus: {bonus_malus}.

      Rosa dell''utente (una riga JSON per giocatore): {roster}

      {?advanced}Ottimizzazione avanzata richiesta: confronta più moduli, rischio/volatilità e alternative per i dubbi.{/advanced}

      {?notes}Note: {notes}{/notes}

      Leggi le statistiche con lo strumento read_stats. Scrivi in italiano.'
    context:
    - key: rules
      from: collection:leagues.rules
    - key: bonus_malus
      from: collection:leagues.bonus_malus
    - key: roster
      from: collection:roster
    appTools:
    - name: read_stats
      description: Statistiche pubbliche della giornata
      action: read
      collection: player_stats
      scope: all
    - name: read_roster
      description: Rosa dell'utente
      action: read
      collection: roster
      scope: user
    output: markdown
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.8
    profile:
      inline:
        display_name: MisterLega assistente formazione
        crews:
        - id: advisor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un assistente di fantacalcio. Calcoli un punteggio atteso per ogni giocatore della rosa (fantamedia,
            probabilità di titolarità, avversario, bonus/malus del regolamento) e proponi la formazione. Rispetta il regolamento:
            classico (moduli classici, ruoli P/D/C/A) o mantra (ruoli multipli, moduli mantra). Struttura del report: ''#
            Giornata <n> — formazione consigliata'' con ## Modulo e titolari (tabella: giocatore, ruolo, punteggio atteso),
            ## Panchina (in ordine), ## Perché queste scelte (spiegazione semplice), ## Dubbi e rischi, ## Scambi e acquisti
            allo svincolo. Se utile aggiungi un grafico ```chart``` dei punteggi attesi. Non inventare dati: se mancano, dillo.
            Sono consigli: decide l''utente, nessuna formazione viene inviata. Alla fine usa remember con le scelte consigliate.'
  - key: review
    role: helper
    description: 'Report post-giornata: voti e confronto consiglio vs scelta.'
    writesTo:
      collection: reviews
      parse: whole
    goalTemplate: 'La giornata {record.matchday} è conclusa. Formazione schierata: titolari {record.starters}; panchina {record.bench};
      modulo {record.formation}. Leggi voti e consiglio con gli strumenti e confronta il consiglio dato con la scelta fatta.
      Scrivi in italiano.'
    appTools:
    - name: read_stats
      description: Statistiche e voti della giornata
      action: read
      collection: player_stats
      scope: all
    - name: read_lineups
      description: Formazioni dell'utente
      action: read
      collection: lineups
      scope: user
    memory: user
    output: markdown
    limits:
      maxTurns: 10
      maxBudgetUsd: 0.5
    profile:
      inline:
        display_name: MisterLega report giornata
        crews:
        - id: review
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei il cronista della giornata. Apri con ''# Giornata <n> — com''è andata''. Sezioni: ## Voti dei
            tuoi giocatori (tabella), ## Consiglio vs scelta (differenze e punti guadagnati o persi), ## Cosa impariamo. Mai
            inventare voti: se non disponibili, dillo. Tono semplice e amichevole.'
  inputForm:
    title:
      it: Nuova giornata
    fields:
    - name: league
      type: select
      required: true
      label:
        it: Lega
      optionsFrom: collection:leagues
    - name: matchday
      type: number
      required: true
      label:
        it: Giornata
    - name: advanced
      type: boolean
      gatedBy: premium
      label:
        it: Ottimizzazione avanzata (Premium)
    - name: notes
      type: textarea
      maxLength: 400
      label:
        it: Note (facoltative)
  data:
    collections:
    - name: leagues
      description: 'Leghe: il creatore è l''amministratore; i membri sono elencati per email'
      ownedBy: user
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome lega
      - name: code
        type: text
        required: true
        label:
          it: Codice invito
      - name: rules
        type: select
        required: true
        label:
          it: Regolamento
        options:
        - value: classico
          label: Classico
        - value: mantra
          label: Mantra
      - name: bonus_malus
        type: textarea
        label:
          it: Bonus e malus
      - name: budget
        type: number
        label:
          it: Budget d'asta
      - name: calendar
        type: textarea
        label:
          it: Calendario
      - name: members
        type: array
        label:
          it: Email dei partecipanti
      access:
      - role: user
        where:
          members: '{user.email}'
        can:
        - read
    - name: standings
      description: Classifica comune alla lega
      ownedBy: user
      fields:
      - name: league_code
        type: text
        required: true
      - name: team
        type: text
        required: true
        label:
          it: Squadra
      - name: matchday
        type: number
      - name: points
        type: number
        label:
          it: Punti
      - name: members
        type: array
      access:
      - role: user
        where:
          members: '{user.email}'
        can:
        - read
    - name: roster
      description: La rosa di ciascun partecipante
      ownedBy: user
      fields:
      - name: league
        type: text
        required: true
        label:
          it: Lega
      - name: player
        type: text
        required: true
        label:
          it: Giocatore
      - name: team
        type: text
        label:
          it: Squadra
      - name: role
        type: select
        required: true
        label:
          it: Ruolo
        options:
        - P
        - D
        - Dd
        - Ds
        - Dc
        - E
        - M
        - C
        - W
        - T
        - A
        - Pc
      - name: price
        type: number
        label:
          it: Prezzo pagato
    - name: lineups
      description: Formazioni scelte dall'utente
      ownedBy: user
      fields:
      - name: league
        type: text
        required: true
        label:
          it: Lega
      - name: matchday
        type: number
        required: true
        label:
          it: Giornata
      - name: deadline
        type: date
        required: true
        label:
          it: Scadenza formazione
      - name: formation
        type: text
        label:
          it: Modulo
      - name: starters
        type: textarea
        label:
          it: Titolari
      - name: bench
        type: textarea
        label:
          it: Panchina
      - name: status
        type: select
        required: true
        label:
          it: Stato
        options:
        - value: draft
          label: Da confermare
        - value: confirmed
          label: Confermata
        - value: played
          label: Giornata giocata
    - name: reviews
      description: Report post-giornata
      ownedBy: user
    - name: player_stats
      description: Statistiche pubbliche per giornata
      ownedBy: app
      retentionDays: 365
  views:
  - key: home
    type: page
    nav: false
    title: MisterLega
    sections:
    - type: hero
      eyebrow:
        it: Fantacalcio
      title:
        it: Schiera la formazione con **più testa** e meno dubbi.
      text:
        it: Statistiche, probabili formazioni e punteggi attesi per ogni giornata. L'assistente consiglia, tu decidi.
      actions:
      - label:
          it: Inizia gratis
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
      items:
      - title:
          it: Crea o entra in una lega
        text:
          it: L'amministratore imposta regolamento, bonus, budget e calendario.
      - title:
          it: Inserisci la rosa
        text:
          it: Giocatori, ruoli e prezzo pagato.
      - title:
          it: Ricevi il consiglio
        text:
          it: Modulo, titolari, panchina, scambi e svincolati, spiegati in modo semplice.
      - title:
          it: Conferma e confronta
        text:
          it: Alert email prima della scadenza e report con i voti dopo la giornata.
    - type: cards
      id: piani
      title:
        it: Piani
      items:
      - title:
          it: Base gratuita
        text:
          it: Consigli di formazione per ogni giornata.
      - title:
          it: Premium stagionale
        text:
          it: Ottimizzazioni avanzate e più analisi al giorno.
    - type: note
      content:
        it: 'Consigli a supporto della decisione: nessun risultato è garantito. I dati provengono da fonti pubbliche consultabili
          o da dati a licenza.'
  - key: new_run
    type: new_run
    title:
      it: Scheda giornata
    roles:
    - user
    - admin
  - key: history
    type: history
    title:
      it: Le mie giornate
    source: run
    roles:
    - user
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: league_form
    type: form
    collection: leagues
    title:
      it: Crea lega
    submit:
      label:
        it: Salva lega
      redirect: leagues_list
    edit: true
    roles:
    - user
    - admin
  - key: leagues_list
    type: table
    source: collection:leagues
    title:
      it: Le mie leghe
    columns:
    - name
    - code
    - rules
    - budget
    roles:
    - user
    - admin
  - key: roster_form
    type: form
    collection: roster
    title:
      it: Aggiungi giocatore
    submit:
      label:
        it: Aggiungi
      redirect: roster_list
    edit: true
    roles:
    - user
    - admin
  - key: roster_list
    type: table
    source: collection:roster
    title:
      it: La mia rosa
    columns:
    - player
    - team
    - role
    - price
    export: true
    roles:
    - user
    - admin
  - key: lineup_form
    type: form
    collection: lineups
    title:
      it: Conferma formazione
    submit:
      label:
        it: Salva
      message:
        it: Formazione salvata. Ricorda di inserirla nella tua lega.
      redirect: lineups_list
    edit: true
    roles:
    - user
    - admin
  - key: lineups_list
    type: table
    source: collection:lineups
    title:
      it: Le mie formazioni
    columns:
    - matchday
    - deadline
    - formation
    - status
    roles:
    - user
    - admin
  - key: standings_form
    type: form
    collection: standings
    title:
      it: Aggiorna classifica
    edit: true
    roles:
    - user
    - admin
  - key: standings_list
    type: table
    source: collection:standings
    title:
      it: Classifica lega
    columns:
    - team
    - matchday
    - points
    roles:
    - user
    - admin
  - key: reviews_list
    type: list
    source: collection:reviews
    title:
      it: Report post-giornata
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Crediti e piano
    roles:
    - user
  triggers:
  - key: deadline_alert
    description: Promemoria il giorno della scadenza della formazione
    'on':
      date:
        collection: lineups
        field: deadline
        offsetDays: 0
        hour: 8
    notify:
      to: owner
      subject:
        it: Scadenza formazione giornata {record.matchday}
      body:
        it: Oggi scade la formazione della giornata {record.matchday}. Se non l'hai ancora confermata, apri MisterLega e decidi.
      link: lineup_form
  - key: post_match_review
    'on':
      collection: lineups
      op: update
      where:
        status: played
    start:
      agent: review
    goal: Genera il report post-giornata per la giornata {record.matchday} della lega {record.league}.
  schedules:
  - agent: stats
    cron: 0 6 * * 5
    action: run
    owner: app
  notifications:
    emailOnRunDone: true
  mobile:
    appId: eu.webrobot.misterlega
  billing:
    modes:
    - credits
    - subscription
    currency: eur
    signupCredits: 30
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:advisor:
        estimate: 10
        metered: true
      agent:review:
        estimate: 5
        metered: true
    packs:
    - key: small
      credits: 200
      price: 5
      label: Pacchetto 200
    plans:
    - key: premium
      price: 29
      interval: year
      label:
        it: Premium stagionale
      credits: 600
      creditsReset: never
      includes:
      - Ottimizzazione avanzata
      - Più analisi al giorno
  extensions:
  - key: join_by_code
    description: 'Ingresso in una lega con codice invito: oggi l''amministratore aggiunge le email dei partecipanti alla lega;
      l''auto-iscrizione tramite codice non è ancora disponibile.'
  - key: push_mobile
    description: 'Notifica push sull''app mobile non disponibile: l''alert è solo via email, inviato il giorno della scadenza
      alle 8 UTC e non due ore prima.'
  - key: alert_only_unconfirmed
    description: 'Il promemoria di scadenza parte per ogni formazione con data di scadenza, anche se già confermata: i trigger
      a data non filtrano per stato.'
  - key: licensed_data
    description: 'Integrazione dei dati sportivi a licenza acquistati dalla lega: richiede l''host API del fornitore e una
      chiave org; da configurare quando il fornitore è scelto.'
