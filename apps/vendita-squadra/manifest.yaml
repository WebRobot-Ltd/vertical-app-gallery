apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: venditasquadra
  displayName: VenditaSquadra
  tagline:
    it: Sei agenti AI per trovare, qualificare e contattare i clienti giusti.
    en: Six AI agents to find, qualify and contact the right customers.
  description:
    it: 'Descrivi il cliente ideale e la tua offerta: gli agenti cercano aziende in target, le arricchiscono, ordinano i lead,
      scrivono le email di primo contatto, preparano i follow-up a 3 e 7 giorni e classificano le risposte. Tu approvi testi
      e lista prima dell''invio.'
    en: 'Describe your ideal customer and your offer: the agents find target companies, enrich them, rank the leads, write
      first-contact emails, prepare follow-ups at 3 and 7 days and classify replies. You approve texts and list before anything
      is sent.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12355b'
      accent: '#e4572e'
      background: '#f7f8fa'
      foreground: '#18202b'
    fonts:
      body: Inter
      display: Manrope
    wordmark:
    - text: Vendita
      color: primary
    - text: Squadra
      color: accent
    button: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Gli agenti
        en: The agents
      href: '#agenti'
    cta:
      label:
        it: Inizia
        en: Start
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      label:
        it: Responsabile commerciale
        en: Sales manager
      assignedBy: signup
  limits:
  - action: run
    per: user
    max: 10
    window: day
    roles:
    - user
  egress:
    hosts: []
    notes: 'No direct external API: public sources are read by the agents through the WebRobot MCP.'
  agents:
  - key: scout
    role: main
    description: Finds companies matching the ideal customer profile on public sources.
    profile:
      inline:
        display_name: VenditaSquadra scout
        crews:
        - id: scout
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You are the Scout of a B2B sales team. Given an ideal customer profile (sector, size, area, decision-maker
            role) and an offer, find companies that fit using only public sources: open business registries, institutional
            websites, news. Use the WebRobot MCP to scrape and run pipelines; never write code. Save each company with the
            tool write_leads (fields: campaign, company, website, sector, size, area, source_url, decision_maker_role, status=''new'').
            Never invent companies, people or contact details: if a datum is not on a public page, leave it empty. Respect
            robots/terms and use only business contacts (no private persons). Final answer: a level-1 title ''# Lead search
            — <campaign>'' then a table of companies found with source link, and a short note on coverage and gaps.'
    goalTemplate: 'Campaign: {campaign}

      Sector: {sector}

      Company size: {size}

      Area: {area}

      Decision-maker role: {role}

      Offer: {offer}

      {?notes}Notes: {notes}{/notes}

      Max companies: {max_leads}

      Today is {date}. Write in the language with ISO code {lang}.'
    appTools:
    - name: write_leads
      description: Save or update a lead of this customer
      action: write
      collection: leads
      scope: user
    output: markdown
    limits:
      maxTurns: 30
      maxBudgetUsd: 1.5
  - key: enricher
    role: helper
    description: Adds useful public information to each lead.
    profile:
      inline:
        display_name: VenditaSquadra enricher
        crews:
        - id: enricher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You enrich B2B leads with public information: what the company does, size indicators, recent news,
            hiring, tenders, public business contact (role-based, e.g. website contact page), and a possible hook for the
            offer. Read the leads with read_leads, update them with write_leads. Cite the source URL for each fact; never
            invent or guess emails or personal data. Final answer: ''# Enrichment — <campaign>'' and a short summary of what
            was added and what is missing.'
    appTools:
    - name: read_leads
      description: Read this customer's leads
      action: read
      collection: leads
      scope: user
    - name: write_leads
      description: Save or update a lead of this customer
      action: write
      collection: leads
      scope: user
    output: markdown
    limits:
      maxTurns: 30
      maxBudgetUsd: 1.5
  - key: scorer
    role: helper
    description: Scores and ranks the leads.
    profile:
      inline:
        display_name: VenditaSquadra scorer
        crews:
        - id: scorer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You score B2B leads 0-100 against the ideal customer profile and the offer: fit of sector/size/area,
            buying signals, quality of the information. Read with read_leads, write score and score_reason with write_leads.
            Be explicit about uncertainty and never raise a score on data you cannot cite. Final answer: ''# Ranking — <campaign>''
            and a table sorted by score with the reason in one line, then a bar chart block:

            ```chart

            {"type":"bar","title":"Top leads","labels":["..."],"series":[{"name":"Score","values":[0]}]}

            ```

            with real scores.'
    appTools:
    - name: read_leads
      description: Read this customer's leads
      action: read
      collection: leads
      scope: user
    - name: write_leads
      description: Save or update a lead of this customer
      action: write
      collection: leads
      scope: user
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.5
  - key: writer
    role: helper
    description: Writes personalised first-contact emails and asks the manager to approve.
    awaits:
    - first_send
    profile:
      inline:
        display_name: VenditaSquadra writer
        crews:
        - id: writer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write short, personalised first-contact B2B emails (max 120 words, one clear call to action,
            no false claims, no pressure, opt-out line included). Use only facts found in the lead record. Read the best leads
            with read_leads, save each draft with write_interactions (type=''first_email'', status=''draft'', subject, body).
            Then call request_first_send once with the list of companies and the texts for the manager''s approval. Nothing
            is sent by you. Final answer: ''# First emails — <campaign>'' with the drafts and the approval status.'
    appTools:
    - name: read_leads
      description: Read this customer's leads
      action: read
      collection: leads
      scope: user
    - name: write_interactions
      description: Save a draft, follow-up or classified reply
      action: write
      collection: interactions
      scope: user
    output: markdown
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.8
  - key: followup
    role: scheduled
    description: Prepares the follow-ups due at 3 and 7 days after the first email.
    profile:
      inline:
        display_name: VenditaSquadra follow-up
        crews:
        - id: followup
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You manage follow-ups. Read interactions with read_interactions. A lead is due for follow-up 1 when
            the approved first email was sent 3 days ago or more and there is no reply; due for follow-up 2 at 7 days. Skip
            leads that replied or declined. Write a short follow-up that adds a new angle (not ''just checking in''), save
            it with write_interactions (type=''followup_1'' or ''followup_2'', status=''ready''). Final answer: ''# Follow-ups
            — <date>'' listing who is due and the texts; say plainly if nothing is due.'
    appTools:
    - name: read_interactions
      description: Read this customer's interactions
      action: read
      collection: interactions
      scope: user
    - name: write_interactions
      description: Save a draft, follow-up or classified reply
      action: write
      collection: interactions
      scope: user
    output: markdown
    limits:
      maxTurns: 10
      maxBudgetUsd: 0.6
  - key: reply_reader
    role: helper
    description: Classifies replies and proposes the next step.
    profile:
      inline:
        display_name: VenditaSquadra reply reader
        crews:
        - id: reply_reader
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You read one reply to a sales email and classify it as interested, not_now or not_interested. Propose
            the next step (propose a meeting slot, send material, re-contact on a date, close and suppress) and a draft answer.
            Update the lead with write_leads (status = the class) and save the analysis with write_interactions. Never invent
            what the prospect did not say. Final answer: ''# Reply — <company>'' with class, reasoning in one line, next step
            and draft.'
    appTools:
    - name: write_leads
      description: Save or update a lead of this customer
      action: write
      collection: leads
      scope: user
    - name: write_interactions
      description: Save a draft, follow-up or classified reply
      action: write
      collection: interactions
      scope: user
    output: markdown
    limits:
      maxTurns: 6
      maxBudgetUsd: 0.3
  - key: reporter
    role: scheduled
    description: Monday report for each customer.
    profile:
      inline:
        display_name: VenditaSquadra weekly report
        crews:
        - id: reporter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write the Monday sales report for one customer. Read interactions and leads with the tools.
            Report open rates, replies (interested / not now / not interested) and meetings booked for the last 7 days, only
            from recorded data. If a figure is not recorded (e.g. opens when tracking is absent), say ''not tracked'' and
            never estimate. Start with ''# Weekly report — week of <date>''; sections ## Numbers, ## What worked, ## Next
            week. Add a chart block when comparing figures:

            ```chart

            {"type":"bar","title":"Funnel","labels":["Sent","Replies","Meetings"],"series":[{"name":"Count","values":[0,0,0]}]}

            ```

            with real values. Under 300 words.'
    appTools:
    - name: read_interactions
      description: Read this customer's interactions
      action: read
      collection: interactions
      scope: user
    - name: read_leads
      description: Read this customer's leads
      action: read
      collection: leads
      scope: user
    writesTo:
      collection: weekly_reports
    output: markdown
    limits:
      maxTurns: 6
      maxBudgetUsd: 0.3
  teams:
  - key: prospecting
    mode: sequence
    title:
      it: Ricerca, arricchimento, ranking e testi
      en: Search, enrichment, ranking and copy
    steps:
    - agent: scout
    - agent: enricher
      after:
      - scout
    - agent: scorer
      after:
      - enricher
    - agent: writer
      after:
      - scorer
    maxMinutes: 60
  approvals:
  - key: first_send
    title:
      it: Approva testi e lista della campagna
      en: Approve campaign texts and list
    description: The sales manager approves the first emails and the lead list before the first send.
    decidedBy: requester
    fields:
    - campaign
    - companies
    - drafts
    timeoutMinutes: 10080
    onTimeout: reject
  inputForm:
    title:
      it: Nuova campagna
      en: New campaign
    fields:
    - name: campaign
      type: text
      required: true
      label:
        it: Nome campagna
        en: Campaign name
    - name: sector
      type: text
      required: true
      label:
        it: Settore
        en: Sector
    - name: size
      type: select
      required: true
      label:
        it: Dimensione
        en: Company size
      options:
      - value: 1-10
        label:
          it: 1-10 dipendenti
          en: 1-10 employees
      - value: 11-50
        label:
          it: 11-50 dipendenti
          en: 11-50 employees
      - value: 51-250
        label:
          it: 51-250 dipendenti
          en: 51-250 employees
    - name: area
      type: text
      required: true
      label:
        it: Area geografica
        en: Geographic area
    - name: role
      type: text
      required: true
      label:
        it: Ruolo del decisore
        en: Decision-maker role
    - name: offer
      type: textarea
      required: true
      maxLength: 800
      label:
        it: Offerta da proporre
        en: Offer
    - name: max_leads
      type: number
      default: 30
      label:
        it: Numero massimo di aziende
        en: Maximum companies
    - name: notes
      type: textarea
      maxLength: 400
      label:
        it: Note (facoltative)
        en: Notes (optional)
  data:
    collections:
    - name: leads
      ownedBy: user
      description: Companies found for each customer's campaigns
      fields:
      - name: campaign
        type: text
      - name: company
        type: text
      - name: website
        type: url
      - name: sector
        type: text
      - name: size
        type: text
      - name: area
        type: text
      - name: source_url
        type: url
      - name: decision_maker_role
        type: text
      - name: score
        type: number
      - name: score_reason
        type: text
      - name: status
        type: text
    - name: interactions
      ownedBy: user
      description: Emails, follow-ups and replies per lead
      fields:
      - name: campaign
        type: text
      - name: company
        type: text
      - name: type
        type: text
      - name: status
        type: text
      - name: subject
        type: text
      - name: body
        type: textarea
    - name: replies
      ownedBy: user
      description: Replies pasted by the customer, to be classified
      fields:
      - name: campaign
        type: text
      - name: company
        type: text
      - name: reply_text
        type: textarea
    - name: weekly_reports
      ownedBy: instance
      description: Monday reports
  templates:
  - key: followup_watch
    title:
      it: Follow-up automatici
      en: Automatic follow-ups
    description:
      it: Ogni giorno prepara i follow-up dovuti a 3 e 7 giorni.
      en: Every day prepares the follow-ups due at 3 and 7 days.
    agent: followup
    params:
    - name: campaign
      type: text
      required: true
      label:
        it: Campagna
        en: Campaign
    goal: Campaign "{campaign}". Today is {date}. Prepare the follow-ups due. Write in the language with ISO code {lang}.
    schedule:
      cron: 0 8 * * 1-5
      userCanChange: true
    maxPerUser: 5
    cost:
      perRun: 5
  - key: monday_report
    title:
      it: Report del lunedì
      en: Monday report
    description:
      it: 'Ogni lunedì: aperture, risposte e appuntamenti.'
      en: 'Every Monday: opens, replies and meetings.'
    agent: reporter
    params:
    - name: campaign
      type: text
      label:
        it: Campagna (vuoto = tutte)
        en: Campaign (empty = all)
    goal: Weekly report for {?campaign}campaign "{campaign}"{/campaign}{!campaign}all campaigns{/campaign}. Today is {date}.
      Write in the language with ISO code {lang}.
    schedule:
      cron: 0 7 * * 1
      userCanChange: false
    maxPerUser: 3
    cost:
      perRun: 5
  triggers:
  - key: on_reply
    description: A pasted reply is classified
    'on':
      collection: replies
      op: insert
    start:
      agent: reply_reader
    goal: 'Classify this reply and propose the next step: {event}. Today is {date}.'
    asUser: true
  views:
  - key: home
    type: page
    nav: false
    title: VenditaSquadra
    sections:
    - type: hero
      band: true
      eyebrow:
        it: Per PMI B2B
        en: For B2B SMEs
      title:
        it: Una squadra di **sei agenti** per le tue vendite
        en: A team of **six agents** for your sales
      text:
        it: Descrivi il cliente ideale e l'offerta. Gli agenti trovano le aziende, scrivono i testi e gestiscono follow-up
          e risposte. Tu approvi prima di ogni invio.
        en: Describe the ideal customer and your offer. The agents find companies, write the texts and handle follow-ups and
          replies. You approve before anything goes out.
      actions:
      - label:
          it: Crea una campagna
          en: Create a campaign
        href: /v/new_campaign
        style: primary
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Descrivi
          en: Describe
        text:
          it: Settore, dimensione, area, ruolo del decisore e offerta.
          en: Sector, size, area, decision-maker role and offer.
        badge: '1'
      - title:
          it: Approva
          en: Approve
        text:
          it: Controlli la lista e i testi delle prime email.
          en: You review the list and the first emails.
        badge: '2'
      - title:
          it: Segui
          en: Follow
        text:
          it: Follow-up a 3 e 7 giorni, risposte classificate, report ogni lunedì.
          en: Follow-ups at 3 and 7 days, classified replies, a report every Monday.
        badge: '3'
    - type: cards
      id: agenti
      title:
        it: Gli agenti
        en: The agents
      items:
      - title:
          it: Cercatore
          en: Scout
        text:
          it: Trova aziende su fonti pubbliche.
          en: Finds companies on public sources.
        badge: 🔎
      - title:
          it: Arricchitore
          en: Enricher
        text:
          it: Aggiunge informazioni utili con fonti citate.
          en: Adds useful information with cited sources.
        badge: 🧩
      - title:
          it: Valutatore
          en: Scorer
        text:
          it: Valuta e ordina i lead.
          en: Scores and ranks leads.
        badge: 📊
      - title:
          it: Autore
          en: Writer
        text:
          it: Email personalizzate di primo contatto.
          en: Personalised first-contact emails.
        badge: ✉️
      - title:
          it: Follow-up
          en: Follow-up
        text:
          it: Solleciti a 3 e 7 giorni.
          en: Reminders at 3 and 7 days.
        badge: ⏱️
      - title:
          it: Lettore risposte
          en: Reply reader
        text:
          it: Interessato, non ora, non interessato, e il passo successivo.
          en: Interested, not now, not interested, and the next step.
        badge: 💬
    - type: note
      content:
        it: 'Solo fonti pubbliche e contatti aziendali. Supporto alle vendite: rispetta GDPR e le norme sul marketing diretto.'
        en: 'Public sources and business contacts only. Sales support: comply with GDPR and direct-marketing rules.'
  - key: new_campaign
    type: new_run
    title:
      it: Nuova campagna
      en: New campaign
    roles:
    - user
    - admin
  - key: campaigns
    type: history
    title:
      it: Le mie campagne
      en: My campaigns
    source: run
    roles:
    - user
    - admin
  - key: campaign_report
    type: report
    source: run
    printable: true
    nav: false
  - key: lead_list
    type: table
    title:
      it: Lead
      en: Leads
    source: collection:leads
    data:
      display: table
      fields:
      - key: company
        label:
          it: Azienda
          en: Company
      - key: campaign
        label:
          it: Campagna
          en: Campaign
      - key: score
        label: Score
        format: number
      - key: status
        label:
          it: Stato
          en: Status
        format: badge
      - key: website
        label: Web
        format: link
      sort:
        field: score
        dir: desc
      limit: 200
    roles:
    - user
    - admin
  - key: interaction_list
    type: table
    title:
      it: Interazioni
      en: Interactions
    source: collection:interactions
    data:
      display: table
      fields:
      - key: company
        label:
          it: Azienda
          en: Company
      - key: type
        label: Tipo
      - key: status
        label:
          it: Stato
          en: Status
        format: badge
      - key: subject
        label:
          it: Oggetto
          en: Subject
      limit: 200
    roles:
    - user
    - admin
  - key: approval_inbox
    type: approvals
    title:
      it: Approvazioni
      en: Approvals
    roles:
    - user
    - admin
  - key: followups
    type: instances
    template: followup_watch
    title:
      it: Follow-up
      en: Follow-ups
    roles:
    - user
    - admin
  - key: reports
    type: instances
    template: monday_report
    title:
      it: Report del lunedì
      en: Monday report
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento e crediti
      en: Plan and credits
    roles:
    - user
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 50
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:scout:
        estimate: 10
        metered: true
      agent:writer:
        estimate: 10
        metered: true
    packs:
    - key: contacts_500
      credits: 500
      price: 20
      label:
        it: 500 crediti contatto
        en: 500 contact credits
    - key: contacts_2500
      credits: 2500
      price: 80
      label:
        it: 2500 crediti contatto
        en: 2500 contact credits
    plans:
    - key: team
      price: 49
      interval: month
      label:
        it: Team mensile
        en: Monthly team
      credits: 300
      creditsReset: monthly
      includes:
      - Six agents
      - Monday report
      - Follow-ups at 3 and 7 days
      roles:
      - user
  extensions:
  - key: crm_sync
    description: 'Automatic two-way sync of leads and interactions with HubSpot or Salesforce through an authorised connection
      (OAuth per customer) is not available yet: connectors needing each customer''s credentials are not supported. For now
      leads and interactions are kept in the app''s collections; a CRM export/import is the planned follow-up.'
  - key: email_sending
    description: Sending emails and tracking opens/replies is not available yet (no notifications or mailbox connectors).
      Approved drafts are shown in the app for the manager to send from their own mail; opens are reported as 'not tracked';
      replies are pasted into the replies collection to be classified.
  - key: replies_collection
    description: The trigger on_reply starts when a 'replies' record is inserted by the user (pasted text, company, campaign);
      a dedicated input view for it still has to be added in the studio.
