apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: ponte-credito
  displayName: Ponte Credito
  tagline: Scopri a quale credito puoi accedere e preparati a chiederlo.
  description: 'Analisi di bancabilità per piccole imprese: indicatori di sostenibilità del debito, punteggio, confronto delle
    offerte pubbliche dei finanziatori e documentazione da preparare. Le pratiche passano da un mediatore creditizio che rivede
    tutto.'
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12355b'
      accent: '#1f8a70'
      background: '#f6f8fb'
      foreground: '#16202c'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Ponte
      color: primary
    - text: Credito
      color: accent
  header:
    links:
    - label: Come funziona
      href: '#come-funziona'
    - label: Prezzi
      href: '#prezzi'
    cta:
      label: Inizia
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
    - key: mediator
      label: Mediatore creditizio
      assignedBy: derived
      from: collection:practices.mediator_email
  limits:
  - action: run
    per: user
    max: 5
    window: day
    roles:
    - user
  slots:
  - key: indicators
    description: Indicatori di sostenibilità del debito e punteggio di bancabilità calcolati con regole fisse
    timeoutMs: 2000
    example:
      values:
        years: 5
        revenue_y1: 500000
        revenue_y2: 450000
        profit_y1: 40000
        profit_y2: 30000
        debts: 100000
        amount: 80000
      lang: it
    code: "def f(v):\n    try:\n        return float(v or 0)\n    except Exception:\n        return 0.0\n\ndef main(input):\n\
      \    v = input.get('values') or {}\n    r1 = f(v.get('revenue_y1')); r2 = f(v.get('revenue_y2'))\n    p1 = f(v.get('profit_y1'));\
      \ d = f(v.get('debts'))\n    a = f(v.get('amount')); y = f(v.get('years'))\n    m = p1 / r1 * 100 if r1 else 0.0\n \
      \   g = (r1 - r2) / r2 * 100 if r2 else 0.0\n    dr = d / r1 if r1 else 0.0\n    rr = a / r1 if r1 else 0.0\n    pb\
      \ = (d + a) / p1 if p1 > 0 else 0.0\n    s = 40 + min(y, 10) * 2 + max(min(m, 15), -10) * 1.2 + max(min(g, 20), -20)\
      \ * 0.4\n    s -= min(dr, 2) * 10 + min(rr, 1.5) * 10\n    if p1 <= 0:\n        s -= 10\n    s = int(max(0, min(100,\
      \ round(s))))\n    band = 'alta' if s >= 70 else ('media' if s >= 45 else 'bassa')\n    return {'margin_pct': round(m,\
      \ 1), 'growth_pct': round(g, 1), 'debt_ratio': round(dr, 2), 'request_ratio': round(rr, 2), 'payback_years': round(pb,\
      \ 1) if pb else 'n/d', 'score': s, 'score_band': band}\n"
  agents:
  - key: basic
    role: main
    description: 'Analisi base gratuita: indicatori e punteggio, senza ricerca web.'
    when: level == 'basic'
    profile:
      inline:
        display_name: Ponte Credito - analisi base
        crews:
        - id: basic
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 4
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un analista di credito per piccole imprese italiane. Ricevi dati dell''impresa e indicatori
            già calcolati: non ricalcolarli e non inventare cifre. Scrivi un report che inizia con un titolo di livello 1
            "# Analisi di bancabilità — <forma giuridica>, <settore>". Sezioni ## : Sintesi e punteggio (usa il punteggio
            fornito e spiega la fascia), Indicatori di sostenibilità (tabella con margine, crescita ricavi, debiti/ricavi,
            importo richiesto/ricavi, anni di rimborso), Punti di forza, Punti deboli, Come migliorare la bancabilità. Aggiungi
            un grafico in blocco ```chart (bar) con gli indicatori principali solo con valori reali. Chiudi spiegando che
            il report completo (offerte dei finanziatori a confronto e documentazione) è a pagamento. Non è consulenza finanziaria
            né un''offerta di credito. Max 400 parole.'
    goalTemplate: 'Forma giuridica: {legal_form_label}. Anni di attività: {years}. Settore: {sector}.

      Ricavi ultimo anno: {revenue_y1}, anno precedente: {revenue_y2}. Utile ultimo anno: {profit_y1}, anno precedente: {profit_y2}.

      Debiti in essere: {debts}. Importo richiesto: {amount}. Finalità: {purpose_label}. Garanzie: {?guarantees}{guarantees}{/guarantees}{!guarantees}nessuna{/guarantees}.

      Indicatori calcolati: margine netto {margin_pct}%, crescita ricavi {growth_pct}%, debiti/ricavi {debt_ratio}, richiesta/ricavi
      {request_ratio}, anni di utile per rimborsare {payback_years}. Punteggio di bancabilità {score}/100 (fascia {score_band}).

      Data: {date}. Scrivi in lingua {lang}.'
    context:
    - key: margin_pct
      from: slot:indicators
    - key: growth_pct
      from: slot:indicators
    - key: debt_ratio
      from: slot:indicators
    - key: request_ratio
      from: slot:indicators
    - key: payback_years
      from: slot:indicators
    - key: score
      from: slot:indicators
    - key: score_band
      from: slot:indicators
    output: markdown
    limits:
      maxTurns: 4
      maxBudgetUsd: 0.3
  - key: analyst
    role: main
    description: 'Report completo: cerca le offerte pubbliche dei finanziatori e le confronta.'
    when: level == 'full'
    profile:
      inline:
        display_name: Ponte Credito - report completo
        crews:
        - id: analyst
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'Sei un analista di credito per piccole imprese italiane. Ricevi i dati dell''impresa e gli indicatori
            già calcolati (non ricalcolarli, non inventare cifre). Cerca sul web, tramite gli strumenti webrobot, SOLO pagine
            pubbliche ufficiali dei finanziatori: banche, piattaforme di lending e invoice financing, Fondo di Garanzia per
            le PMI (MCC), misure regionali e agevolazioni attive per il settore e la finalità. Per ogni opzione riporta: finanziatore,
            prodotto, tasso o forbice indicativa SOLO se pubblicata, importi e durata, requisiti, garanzie richieste, fonte
            (URL) e data di consultazione. Se un dato non è pubblico scrivi ''non pubblicato''; mai inventare tassi o requisiti.
            Il report inizia con "# Report di bancabilità — <forma giuridica>, <settore>". Sezioni ## : Sintesi e punteggio;
            Indicatori di sostenibilità del debito (tabella); Opzioni più adatte (tabella di confronto, ordinate per adeguatezza,
            con motivazione); Requisiti che l''impresa soddisfa e che non soddisfa; Documentazione da preparare (checklist:
            bilanci, dichiarazioni, DURC, situazione debitoria, business plan se serve); Piano di miglioramento; Prossimi
            passi (spiega che può dare mandato a un mediatore creditizio iscritto OAM dal menu Pratiche); Fonti. Aggiungi
            un grafico ```chart per confrontare le opzioni o gli indicatori solo con valori reali. Non è consulenza finanziaria
            né un''offerta di credito: le condizioni sono indicative e vanno verificate.'
    goalTemplate: 'Forma giuridica: {legal_form_label}. Anni di attività: {years}. Settore: {sector}.

      Ricavi ultimo anno: {revenue_y1}, anno precedente: {revenue_y2}. Utile ultimo anno: {profit_y1}, anno precedente: {profit_y2}.

      Debiti in essere: {debts}. Importo richiesto: {amount}. Finalità: {purpose_label}. Garanzie: {?guarantees}{guarantees}{/guarantees}{!guarantees}nessuna{/guarantees}.

      Indicatori calcolati: margine netto {margin_pct}%, crescita ricavi {growth_pct}%, debiti/ricavi {debt_ratio}, richiesta/ricavi
      {request_ratio}, anni di utile per rimborsare {payback_years}. Punteggio di bancabilità {score}/100 (fascia {score_band}).

      Data di oggi: {date}. Scrivi in lingua {lang}.'
    context:
    - key: margin_pct
      from: slot:indicators
    - key: growth_pct
      from: slot:indicators
    - key: debt_ratio
      from: slot:indicators
    - key: request_ratio
      from: slot:indicators
    - key: payback_years
      from: slot:indicators
    - key: score
      from: slot:indicators
    - key: score_band
      from: slot:indicators
    output: markdown
    limits:
      maxTurns: 30
      maxBudgetUsd: 1.5
  inputForm:
    title: Nuova analisi di credito
    fields:
    - name: legal_form
      type: select
      required: true
      label: Forma giuridica
      options:
      - value: ditta
        label: Ditta individuale
      - value: snc_sas
        label: SNC / SAS
      - value: srl
        label: SRL / SRLS
      - value: spa
        label: SPA
      - value: professionista
        label: Libero professionista
      - value: altro
        label: Altro
    - name: years
      type: number
      required: true
      label: Anni di attività
    - name: sector
      type: text
      required: true
      label: Settore
      maxLength: 120
    - name: revenue_y1
      type: number
      required: true
      label: Fatturato ultimo anno (€)
    - name: revenue_y2
      type: number
      required: true
      label: Fatturato anno precedente (€)
    - name: profit_y1
      type: number
      required: true
      label: Utile ultimo anno (€)
    - name: profit_y2
      type: number
      required: true
      label: Utile anno precedente (€)
    - name: debts
      type: number
      required: true
      label: Debiti finanziari in essere (€)
      default: 0
    - name: amount
      type: number
      required: true
      label: Importo richiesto (€)
    - name: purpose
      type: select
      required: true
      label: Finalità
      options:
      - value: liquidity
        label: Liquidità
      - value: investment
        label: Investimento
      - value: invoice_advance
        label: Anticipo fatture
    - name: guarantees
      type: multiselect
      label: Garanzie disponibili
      options:
      - value: ipoteca
        label: Ipoteca su immobile
      - value: fideiussione
        label: Fideiussione personale
      - value: pegno
        label: Pegno / beni mobili
      - value: confidi
        label: Garanzia Confidi
      - value: fondo_pmi
        label: Fondo di Garanzia PMI
    - name: level
      type: select
      required: true
      label: Tipo di analisi
      default: basic
      options:
      - value: basic
        label: Base (gratuita)
      - value: full
        label: Report completo con offerte (a pagamento)
  data:
    collections:
    - name: practices
      description: 'Pratiche di credito: mandato dell''impresa al mediatore e stato della richiesta'
      ownedBy: user
      fields:
      - name: company_name
        type: text
        required: true
        label: Ragione sociale
      - name: vat
        type: text
        label: Partita IVA
      - name: amount
        type: number
        required: true
        label: Importo richiesto (€)
      - name: purpose
        type: select
        required: true
        label: Finalità
        options:
        - value: liquidity
          label: Liquidità
        - value: investment
          label: Investimento
        - value: invoice_advance
          label: Anticipo fatture
      - name: mediator_email
        type: email
        required: true
        label: Email del mediatore creditizio (OAM)
      - name: consent
        type: boolean
        required: true
        label: Do mandato al mediatore di rivedere i miei dati e inoltrare la pratica ai finanziatori
      - name: status
        type: select
        label: Stato
        default: submitted
        options:
        - value: submitted
          label: Inviata
        - value: in_review
          label: In revisione
        - value: forwarded
          label: Inoltrata ai finanziatori
        - value: funded
          label: Finanziata
        - value: rejected
          label: Non accolta
      - name: lender
        type: text
        label: Finanziatore
      - name: mediator_notes
        type: textarea
        label: Note del mediatore
        maxLength: 1500
      access:
      - role: mediator
        where:
          mediator_email: '{user.email}'
        can:
        - read
        - write
      retentionDays: 1095
  views:
  - key: home
    type: page
    nav: false
    title: Ponte Credito
    sections:
    - type: hero
      eyebrow: Per piccole imprese
      title: Scopri a quale **credito** puoi accedere
      text: 'Compila un modulo: un agente calcola la tua bancabilità, confronta le offerte pubbliche di banche, piattaforme
        e fondi di garanzia e ti dice quali documenti preparare.'
      actions:
      - label: Inizia l'analisi gratuita
        href: /login
        style: primary
      note: Analisi base gratuita.
    - type: steps
      id: come-funziona
      title: Come funziona
      items:
      - title: Compili il modulo
        text: Forma giuridica, bilanci degli ultimi due anni, debiti, importo e garanzie.
      - title: L'agente analizza
        text: Indicatori di sostenibilità del debito e punteggio di bancabilità.
      - title: Confronto delle offerte
        text: 'Nel report completo: finanziatori, condizioni indicative, requisiti e documentazione.'
      - title: Pratica con un mediatore
        text: Se vuoi, dai mandato a un mediatore creditizio iscritto OAM che rivede tutto e inoltra la pratica.
    - type: cards
      id: prezzi
      title: Prezzi
      items:
      - title: Analisi base
        text: 'Gratis: indicatori e punteggio di bancabilità.'
      - title: Report completo
        text: 'Pagamento una tantum: offerte a confronto, requisiti e checklist documenti.'
      - title: Mediazione
        text: 'Nessun costo anticipato: la commissione del mediatore è dovuta solo a finanziamento ottenuto.'
    - type: note
      content: Ponte Credito fornisce analisi informative, non consulenza finanziaria né offerte di credito. Condizioni e
        tassi sono indicativi e vanno verificati con il finanziatore.
  - key: new_run
    type: new_run
    title: Nuova analisi
    roles:
    - user
    - admin
  - key: history
    type: history
    title: Le mie analisi
    source: run
    roles:
    - user
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: mandate
    type: form
    title: Dai mandato a un mediatore
    collection: practices
    fields:
    - company_name
    - vat
    - amount
    - purpose
    - mediator_email
    - consent
    submit:
      label: Invia la pratica
      message: Pratica inviata al mediatore.
      redirect: practices
    roles:
    - user
    - admin
  - key: practices
    type: table
    title: Le mie pratiche
    source: collection:practices
    columns:
    - company_name
    - amount
    - purpose
    - status
    - lender
    - mediator_notes
    roles:
    - user
    - admin
  - key: desk
    type: table
    title: Imprese con mandato
    source: collection:practices
    columns:
    - company_name
    - vat
    - amount
    - purpose
    - status
    - lender
    export: true
    roles:
    - mediator
  - key: practice_update
    type: form
    title: Aggiorna pratica
    collection: practices
    fields:
    - status
    - lender
    - mediator_notes
    edit: true
    submit:
      label: Salva
      message: Pratica aggiornata.
      redirect: desk
    nav: false
    roles:
    - mediator
    - admin
  - key: account
    type: account
    title: Crediti
    roles:
    - user
  triggers:
  - key: new_practice
    'on':
      collection: practices
      op: insert
    notify:
      to:
      - role:mediator
      - admins
      subject: 'Nuova pratica: {record.company_name}'
      body: L'impresa {record.company_name} ha richiesto {record.amount} € e ti ha dato mandato. Rivedi i dati e aggiorna
        lo stato.
      link: desk
  - key: practice_forwarded
    'on':
      collection: practices
      op: update
      where:
        status: forwarded
    notify:
      to: owner
      subject: La tua pratica {record.company_name} è stata inoltrata
      body: Il mediatore ha inoltrato la pratica ai finanziatori. Seguine lo stato nella sezione Pratiche.
      link: practices
  - key: practice_funded
    'on':
      collection: practices
      op: update
      where:
        status: funded
    notify:
      to: owner
      subject: 'Finanziamento ottenuto: {record.company_name}'
      body: La pratica risulta finanziata. È ora dovuta la commissione concordata con il mediatore.
      link: practices
  notifications:
    emailOnRunDone: true
  billing:
    modes:
    - credits
    signupCredits: 0
    costs:
      agent:basic: 0
      agent:analyst: 30
    packs:
    - key: report_single
      credits: 30
      price: 19
      label: 1 report completo
    - key: report_triple
      credits: 90
      price: 49
      label: 3 report completi
  extensions:
  - key: open_banking
    description: 'Lettura dei movimenti bancari tramite open banking (PSD2): non disponibile ancora, richiede OAuth/consenso
      con un provider AISP. Per ora l''imprenditore inserisce i dati nel modulo.'
  - key: mediator_commission
    description: La commissione del mediatore a finanziamento ottenuto si concorda e si incassa fuori dall'app; l'app registra
      lo stato 'funded' e avvisa l'imprenditore. Un addebito automatico via Stripe Connect non è ancora configurato.
  - key: oam_check
    description: 'Verifica dell''iscrizione OAM del mediatore: gli admin assegnano e controllano manualmente le email dei
      mediatori.'
  - key: lender_forwarding
    description: L'inoltro ai finanziatori è svolto dal mediatore fuori dall'app; l'app tiene mandato e stato della pratica.
