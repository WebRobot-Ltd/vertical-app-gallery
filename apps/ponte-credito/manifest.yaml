apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: ponte-credito
  displayName: Ponte Credito
  tagline:
    it: Scopri a quale credito puoi accedere e preparati.
    en: Find out which credit you can access and get ready.
  description:
    it: Ponte Credito analizza la sostenibilità del debito della tua impresa, calcola un punteggio di bancabilità, confronta
      le offerte pubbliche dei finanziatori e ti dice quali documenti preparare.
    en: Ponte Credito analyses your business's debt sustainability, computes a bankability score, compares public lender offers
      and tells you which documents to prepare.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12355b'
      accent: '#1a8f6e'
      background: '#f6f8fb'
      foreground: '#16222f'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Ponte
      color: primary
    - text: Credito
      color: accent
    buttonShape: rounded
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Prezzi
        en: Pricing
      href: '#prezzi'
    cta:
      label:
        it: Inizia
        en: Start
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: mediator
      label:
        it: Mediatore creditizio (OAM)
        en: Credit broker (OAM)
      assignedBy: invite
    - key: user
      label:
        it: Imprenditore
        en: Entrepreneur
      assignedBy: signup
  limits:
  - action: run
    per: user
    max: 10
    window: day
    roles:
    - user
  slots:
  - key: indicators
    description: Debt-sustainability indicators computed by fixed rules from the form
    timeoutMs: 2000
    example:
      values:
        revenue_y1: 500000
        revenue_y2: 450000
        profit_y1: 40000
        profit_y2: 30000
        debts: 120000
        amount: 80000
        years: 5
      lang: it
    code: "def num(v):\n    try:\n        return float(v or 0)\n    except Exception:\n        return 0.0\n\ndef main(input):\n\
      \    v = input.get('values') or {}\n    r1 = num(v.get('revenue_y1')); r2 = num(v.get('revenue_y2'))\n    p1 = num(v.get('profit_y1'));\
      \ p2 = num(v.get('profit_y2'))\n    d = num(v.get('debts')); a = num(v.get('amount')); y = num(v.get('years'))\n   \
      \ growth = (r1 - r2) / r2 * 100 if r2 > 0 else 0.0\n    margin = p1 / r1 * 100 if r1 > 0 else 0.0\n    debt_rev = d\
      \ / r1 * 100 if r1 > 0 else 0.0\n    req_rev = a / r1 * 100 if r1 > 0 else 0.0\n    total_rev = (d + a) / r1 * 100 if\
      \ r1 > 0 else 0.0\n    debt_profit = (d + a) / p1 if p1 > 0 else 0.0\n    score = 50.0\n    score += max(-10.0, min(10.0,\
      \ growth / 2))\n    score += max(-15.0, min(15.0, margin))\n    score -= min(20.0, total_rev / 5)\n    score += min(10.0,\
      \ y * 1.5)\n    if p1 <= 0:\n        score -= 15\n    if p2 <= 0:\n        score -= 5\n    score = max(0, min(100, round(score)))\n\
      \    if score >= 70:\n        band = 'alta'\n    elif score >= 45:\n        band = 'media'\n    else:\n        band\
      \ = 'bassa'\n    return {\n        'ind_growth': round(growth, 1),\n        'ind_margin': round(margin, 1),\n      \
      \  'ind_debt_revenue': round(debt_rev, 1),\n        'ind_request_revenue': round(req_rev, 1),\n        'ind_total_debt_revenue':\
      \ round(total_rev, 1),\n        'ind_debt_profit_years': round(debt_profit, 1),\n        'ind_score': score,\n     \
      \   'ind_band': band\n    }\n"
  egress:
    hosts: []
    notes: 'No direct API calls: public lender offers are read from web pages through the WebRobot MCP.'
  agents:
  - key: basic
    role: main
    when: depth == 'basic'
    description: 'Free basic analysis: indicators and bankability score, no web search.'
    profile:
      inline:
        display_name: Ponte Credito basic
        crews:
        - id: basic
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 4
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un analista di credito per piccole imprese italiane. Spieghi in modo chiaro gli indicatori di
            sostenibilità del debito e il punteggio di bancabilità che ti vengono forniti già calcolati: non ricalcolarli
            e non inventare cifre. Struttura: inizia con un titolo di livello 1 "# Analisi base — <forma giuridica> <settore>".
            Poi sezioni ## Punteggio di bancabilità (punteggio /100 e fascia), ## Indicatori di sostenibilità (tabella: crescita
            ricavi, margine netto, debito/ricavi, richiesta/ricavi, debito totale/ricavi, anni di utile per ripagare), ##
            Punti di forza, ## Punti deboli, ## Cosa migliorare prima di chiedere credito, e in chiusura un invito a richiedere
            il report completo con confronto delle offerte. Massimo 350 parole. Non fornire consulenza finanziaria o legale
            come fatto: è un supporto alla decisione, il punteggio è indicativo e non è il rating di una banca.'
    context:
    - key: ind_growth
      from: slot:indicators
    - key: ind_margin
      from: slot:indicators
    - key: ind_debt_revenue
      from: slot:indicators
    - key: ind_request_revenue
      from: slot:indicators
    - key: ind_total_debt_revenue
      from: slot:indicators
    - key: ind_debt_profit_years
      from: slot:indicators
    - key: ind_score
      from: slot:indicators
    - key: ind_band
      from: slot:indicators
    goalTemplate: 'Impresa: {legal_form_label}, settore {sector}, {years} anni di attività.

      Fatturato ultimo anno {revenue_y1} €, anno precedente {revenue_y2} €. Utile ultimo anno {profit_y1} €, anno precedente
      {profit_y2} €.

      Debiti in essere: {debts} €. Importo richiesto: {amount} € per {purpose_label}.

      {?guarantees}Garanzie disponibili: {guarantees}{/guarantees}{!guarantees}Garanzie disponibili: nessuna indicata.{/guarantees}

      Indicatori già calcolati: crescita ricavi {ind_growth}%, margine netto {ind_margin}%, debito/ricavi {ind_debt_revenue}%,
      richiesta/ricavi {ind_request_revenue}%, debito totale/ricavi {ind_total_debt_revenue}%, anni di utile per ripagare
      il debito totale {ind_debt_profit_years}, punteggio {ind_score}/100 (fascia {ind_band}).

      Scrivi nella lingua con codice ISO {lang}. Data: {date}.'
    output: markdown
    limits:
      maxTurns: 4
      maxBudgetUsd: 0.3
  - key: analyst
    role: main
    when: depth == 'full'
    description: 'Full report: indicators, score, web search of public lender offers, comparison and documents checklist.'
    profile:
      inline:
        display_name: Ponte Credito analyst
        crews:
        - id: analyst
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'Sei un analista di credito per piccole imprese italiane. Ricevi i dati dell''impresa e gli indicatori
            già calcolati (non ricalcolarli, non inventare cifre). Usa il WebRobot MCP per leggere le pagine PUBBLICHE di
            finanziatori: banche, piattaforme di lending e invoice financing, Fondo di Garanzia per le PMI (Mediocredito Centrale),
            misure regionali e camerali, Sabatini, ISMEA se pertinente. Considera solo ciò che trovi davvero sulle pagine
            e indica sempre la fonte (URL) e la data di consultazione. Se tassi o requisiti non sono pubblici scrivi "non
            pubblicato" o "indicativo, da confermare": mai inventarli. Seleziona le opzioni coerenti con finalità (liquidità,
            investimento, anticipo fatture), importo, forma giuridica, anzianità e garanzie. Struttura del report: titolo
            di livello 1 "# Ponte Credito — <impresa/settore> — <finalità>"; ## Sintesi (3 righe); ## Punteggio di bancabilità
            (punteggio /100, fascia, cosa lo muove); ## Indicatori di sostenibilità del debito (tabella); ## Opzioni più adatte
            (ordinate, per ciascuna: finanziatore, prodotto, importo/durata, tasso indicativo, requisiti, perché è adatta,
            rischi, fonte); ## Confronto (tabella riassuntiva e un blocco chart barre con i tassi indicativi pubblicati, solo
            cifre reali, con la sintassi ```chart {"type":"bar","title":"…","labels":[…],"series":[{"name":"…","values":[…]}],"unit":"%"}```);
            ## Documentazione da preparare (checklist: bilanci, dichiarazioni, centrale rischi, DURC, business plan, ecc.);
            ## Come migliorare la bancabilità; ## Prossimi passi (inclusa la possibilità di farsi assistere da un mediatore
            creditizio iscritto all''OAM); ## Fonti. Non dare consulenza finanziaria o legale come fatto: è supporto alla
            decisione, le condizioni sono indicative e il finanziamento non è garantito. Non promettere approvazioni.'
    context:
    - key: ind_growth
      from: slot:indicators
    - key: ind_margin
      from: slot:indicators
    - key: ind_debt_revenue
      from: slot:indicators
    - key: ind_request_revenue
      from: slot:indicators
    - key: ind_total_debt_revenue
      from: slot:indicators
    - key: ind_debt_profit_years
      from: slot:indicators
    - key: ind_score
      from: slot:indicators
    - key: ind_band
      from: slot:indicators
    goalTemplate: 'Impresa: {legal_form_label}, settore {sector}, {years} anni di attività.

      Fatturato ultimo anno {revenue_y1} €, anno precedente {revenue_y2} €. Utile ultimo anno {profit_y1} €, anno precedente
      {profit_y2} €.

      Debiti in essere: {debts} €. Importo richiesto: {amount} € per {purpose_label}.

      {?region}Regione: {region}.{/region}

      {?guarantees}Garanzie disponibili: {guarantees}{/guarantees}{!guarantees}Garanzie disponibili: nessuna indicata.{/guarantees}

      Indicatori già calcolati: crescita ricavi {ind_growth}%, margine netto {ind_margin}%, debito/ricavi {ind_debt_revenue}%,
      richiesta/ricavi {ind_request_revenue}%, debito totale/ricavi {ind_total_debt_revenue}%, anni di utile per ripagare
      il debito totale {ind_debt_profit_years}, punteggio {ind_score}/100 (fascia {ind_band}).

      Cerca sul web le offerte pubbliche attuali e prepara il report completo nella lingua con codice ISO {lang}. Data: {date}.'
    output: markdown
    writesTo:
      collection: practices
      parse: whole
    limits:
      maxTurns: 40
      maxBudgetUsd: 1.5
  inputForm:
    title:
      it: Nuova analisi di credito
      en: New credit analysis
    fields:
    - name: depth
      type: select
      required: true
      default: basic
      label:
        it: Tipo di analisi
        en: Analysis type
      options:
      - value: basic
        label:
          it: Base (gratuita)
          en: Basic (free)
      - value: full
        label:
          it: Completa con offerte (a pagamento)
          en: Full with offers (paid)
    - name: legal_form
      type: select
      required: true
      label:
        it: Forma giuridica
        en: Legal form
      options:
      - value: ditta
        label:
          it: Ditta individuale
          en: Sole proprietorship
      - value: snc_sas
        label: Snc / Sas
      - value: srl
        label: Srl / Srls
      - value: spa
        label: Spa
      - value: professionista
        label:
          it: Libero professionista
          en: Freelancer
    - name: years
      type: number
      required: true
      label:
        it: Anni di attività
        en: Years in business
    - name: sector
      type: text
      required: true
      maxLength: 120
      label:
        it: Settore
        en: Sector
      help:
        it: es. ristorazione, edilizia, e-commerce
        en: e.g. restaurants, construction, e-commerce
    - name: region
      type: text
      maxLength: 60
      label:
        it: Regione
        en: Region
    - name: revenue_y1
      type: number
      required: true
      label:
        it: Fatturato ultimo anno (€)
        en: Revenue last year (€)
    - name: revenue_y2
      type: number
      required: true
      label:
        it: Fatturato anno precedente (€)
        en: Revenue year before (€)
    - name: profit_y1
      type: number
      required: true
      label:
        it: Utile ultimo anno (€)
        en: Profit last year (€)
    - name: profit_y2
      type: number
      required: true
      label:
        it: Utile anno precedente (€)
        en: Profit year before (€)
    - name: debts
      type: number
      required: true
      label:
        it: Debiti finanziari in essere (€)
        en: Outstanding financial debt (€)
    - name: amount
      type: number
      required: true
      label:
        it: Importo richiesto (€)
        en: Amount requested (€)
    - name: purpose
      type: select
      required: true
      label:
        it: Finalità
        en: Purpose
      options:
      - value: liquidity
        label:
          it: Liquidità
          en: Liquidity
      - value: investment
        label:
          it: Investimento
          en: Investment
      - value: invoice_advance
        label:
          it: Anticipo fatture
          en: Invoice advance
    - name: guarantees
      type: multiselect
      label:
        it: Garanzie disponibili
        en: Available guarantees
      options:
      - value: personal
        label:
          it: Garanzia personale/fideiussione
          en: Personal guarantee
      - value: real_estate
        label:
          it: Ipoteca immobiliare
          en: Real-estate mortgage
      - value: confidi
        label:
          it: Confidi
          en: Confidi
      - value: fondo_garanzia
        label:
          it: Fondo di Garanzia PMI
          en: SME Guarantee Fund
      - value: invoices
        label:
          it: Crediti commerciali
          en: Trade receivables
  data:
    collections:
    - name: practices
      ownedBy: user
      sharing:
      - viewer
      description: Each entrepreneur's full reports and the state of their credit applications; a credit broker sees only
        those shared with them
      fields:
      - name: status
        type: select
        label:
          it: Stato pratica
          en: Application status
        options:
        - value: report_ready
          label:
            it: Report pronto
            en: Report ready
        - value: mandate_given
          label:
            it: Mandato conferito
            en: Mandate given
        - value: in_review
          label:
            it: In revisione dal mediatore
            en: Broker reviewing
        - value: submitted
          label:
            it: Inoltrata
            en: Submitted
        - value: funded
          label:
            it: Finanziata
            en: Funded
        - value: declined
          label:
            it: Non accolta
            en: Declined
      - name: amount
        type: number
        label:
          it: Importo
          en: Amount
      - name: broker_email
        type: email
        label: Email mediatore
      - name: note
        type: textarea
  views:
  - key: home
    type: page
    nav: false
    title: Ponte Credito
    sections:
    - type: hero
      eyebrow:
        it: Per piccole imprese
        en: For small businesses
      title:
        it: Scopri a quale **credito** puoi accedere, e **preparati**.
        en: Find out which **credit** you can access, and **get ready**.
      text:
        it: 'Compila un modulo: l''agente calcola la sostenibilità del tuo debito e un punteggio di bancabilità, confronta
          le offerte pubbliche dei finanziatori e ti dice quali documenti preparare.'
        en: 'Fill in a form: the agent computes your debt sustainability and a bankability score, compares lenders'' public
          offers and tells you which documents to prepare.'
      actions:
      - label:
          it: Analisi base gratuita
          en: Free basic analysis
        href: /login
        style: primary
      - label:
          it: Come funziona
          en: How it works
        href: '#come-funziona'
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Compili il modulo
          en: Fill in the form
        text:
          it: Forma giuridica, anni di attività, bilanci degli ultimi due anni, debiti, importo, finalità e garanzie.
          en: Legal form, years in business, last two years' figures, debts, amount, purpose and guarantees.
        badge: 📝
      - title:
          it: Indicatori e punteggio
          en: Indicators and score
        text:
          it: Sostenibilità del debito e bancabilità calcolati con regole fisse e spiegati in chiaro.
          en: Debt sustainability and bankability computed by fixed rules and explained plainly.
        badge: 📊
      - title:
          it: Offerte a confronto
          en: Offers compared
        text:
          it: 'Banche, piattaforme di lending, Fondo di Garanzia e misure regionali: condizioni, tassi indicativi e requisiti
            con le fonti.'
          en: 'Banks, lending platforms, the SME Guarantee Fund and regional measures: terms, indicative rates and requirements
            with sources.'
        badge: 🔎
      - title:
          it: Documenti pronti
          en: Documents ready
        text:
          it: Una checklist di ciò che serve, per presentarti ai finanziatori nel modo giusto.
          en: A checklist of what you need to approach lenders the right way.
        badge: 📁
    - type: cards
      id: prezzi
      title:
        it: Prezzi
        en: Pricing
      items:
      - title:
          it: Analisi base
          en: Basic analysis
        text:
          it: 'Gratuita: indicatori e punteggio di bancabilità.'
          en: 'Free: indicators and bankability score.'
        badge: 0 €
      - title:
          it: Report completo
          en: Full report
        text:
          it: 'Pagamento una tantum: offerte dei finanziatori, confronto e documentazione.'
          en: 'One-off payment: lender offers, comparison and documents.'
        badge: 💶
      - title:
          it: Mediatore OAM
          en: OAM broker
        text:
          it: Commissione solo a finanziamento ottenuto, concordata con il mediatore.
          en: Fee only if financing is obtained, agreed with the broker.
        badge: 🤝
    - type: note
      content:
        it: Ponte Credito è un supporto alla decisione, non consulenza finanziaria né rating bancario. Condizioni e tassi
          sono indicativi e tratti da fonti pubbliche; il finanziamento non è garantito.
        en: Ponte Credito is decision support, not financial advice nor a bank rating. Terms and rates are indicative and
          taken from public sources; financing is not guaranteed.
  - key: new
    type: new_run
    title:
      it: Nuova analisi
      en: New analysis
    roles:
    - user
    - admin
  - key: analyses
    type: history
    title:
      it: Le mie analisi
      en: My analyses
    source: run
    roles:
    - user
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: my_practices
    type: table
    title:
      it: Stato delle pratiche
      en: Application status
    source: collection:practices
    data:
      display: table
      fields:
      - key: status
        label:
          it: Stato
          en: Status
        format: badge
      - key: amount
        label:
          it: Importo
          en: Amount
        format: money
      - key: broker_email
        label: Mediatore
      - key: note
        label:
          it: Note
          en: Notes
      limit: 50
      empty:
        it: Nessuna pratica ancora.
        en: No applications yet.
    roles:
    - user
    - admin
  - key: broker_desk
    type: table
    title:
      it: Imprese con mandato
      en: Mandated businesses
    source: collection:practices
    data:
      display: table
      fields:
      - key: status
        label:
          it: Stato
          en: Status
        format: badge
      - key: amount
        label:
          it: Importo
          en: Amount
        format: money
      - key: note
        label:
          it: Note
          en: Notes
      limit: 100
      empty:
        it: Nessuna impresa ti ha dato mandato.
        en: No business has given you a mandate yet.
    roles:
    - mediator
    - admin
  - key: account
    type: account
    title:
      it: Crediti
      en: Credits
    roles:
    - user
  billing:
    modes:
    - credits
    currency: eur
    signupCredits: 0
    costs:
      agent:basic: 0
      agent:analyst: 100
    packs:
    - key: report
      credits: 100
      price: 29
      label:
        it: 1 report completo
        en: 1 full report
    - key: report3
      credits: 300
      price: 69
      label:
        it: 3 report completi
        en: 3 full reports
  extensions:
  - key: open_banking
    description: 'Reading bank movements by linking accounts through open banking (PSD2 AISP) is not available yet: it needs
      each customer''s bank consent and a licensed provider. For now the form takes declared figures.'
  - key: broker_forwarding
    description: Mandate signing, forwarding the practice to lenders through the OAM-registered broker, and the broker's review
      workflow are not available yet. Today the broker sees the practices shared with them (viewer sharing) and status is
      updated manually; the broker role is assigned by invitation.
  - key: success_fee
    description: 'The broker''s fee only on funded loans is agreed and invoiced outside the app: the platform cannot yet collect
      a commission upon a funding event.'
  - key: notifications
    description: Emails to the entrepreneur or the broker when a report is ready or a practice changes status are not available
      yet.
  - key: file_upload
    description: 'Uploading balance sheets or documents is not available yet: figures are typed in the form.'
