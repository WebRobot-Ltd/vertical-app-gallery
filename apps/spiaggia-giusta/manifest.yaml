apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: spiaggiagiusta
  displayName: SpiaggiaGiusta
  tagline:
    it: La spiaggia migliore di oggi, in base a mare e vento.
    en: Today's best beach, based on sea and wind.
  description:
    it: 'Ogni mattina un agente confronta le spiagge della tua zona con le previsioni di mare e vento e le preferenze che
      hai indicato: classifica con punteggio da 0 a 10, previsione a tre giorni ed email con le prime tre.'
    en: 'Every morning an agent compares the beaches in your area against sea and wind forecasts and your preferences: a 0-10
      ranking, a 3-day outlook and an email with the top three.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: dashboard
  branding:
    theme: light
    palette:
      primary: '#0b4f6c'
      accent: '#f29e4c'
      background: '#f7fbfc'
      foreground: '#13262f'
    fonts:
      body: Inter
      display: Poppins
    wordmark:
    - text: Spiaggia
      color: primary
    - text: Giusta
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Piani
        en: Plans
      href: '#piani'
    cta:
      label:
        it: Inizia
        en: Start
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  limits:
  - action: login
    per: ip
    max: 20
    window: hour
  agents:
  - key: daily_pick
    role: scheduled
    description: Scores the beaches of one user's zone every morning using their preferences.
    memory: none
    writesTo:
      collection: rankings
      parse: whole
    output: markdown
    limits:
      maxTurns: 14
      maxBudgetUsd: 0.4
    appTools:
    - name: list_beaches
      description: List the beaches (name, zone, lat, lon, bottom, orientation, notes) managed by the admin
      action: read
      collection: beaches
      scope: all
    - name: weather_forecast
      description: 'Open-Meteo forecast: wind, cloud cover, UV, weather code'
      action: http
      http:
        method: GET
        url: https://api.open-meteo.com/v1/forecast
        attribution: Open-Meteo.com, CC BY 4.0
    - name: marine_forecast
      description: 'Open-Meteo marine forecast (Copernicus Marine based): waves, sea temperature, currents'
      action: http
      http:
        method: GET
        url: https://marine-api.open-meteo.com/v1/marine
        attribution: Open-Meteo.com Marine API, CC BY 4.0, Copernicus Marine data
    goalTemplate: 'Today is {date}. Zone: {zone}. Sea preference: {sea}. Bottom: {bottom}. Wind tolerance: {wind}. Children:
      {kids}. Favourite beaches: {favorites}. Write the report in the language with ISO code {lang}.'
    profile:
      inline:
        display_name: SpiaggiaGiusta daily pick
        crews:
        - id: daily_pick
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 14
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are a beach advisor. Call list_beaches and keep the beaches of the user''s zone. For each beach
            call weather_forecast with query latitude=<lat>&longitude=<lon>&hourly=wind_speed_10m,wind_direction_10m,cloud_cover,uv_index,weather_code&daily=uv_index_max&forecast_days=4&timezone=auto
            and marine_forecast with query latitude=<lat>&longitude=<lon>&hourly=wave_height,wave_period,wave_direction,sea_surface_temperature,ocean_current_velocity&forecast_days=4&timezone=auto.
            Use daytime hours (09-19). Score every beach 0-10 for today for THIS user: calm sea (low waves) for those who
            want calm, 0.8-2m clean waves for surf; wind above the user''s tolerance and wind blowing onshore lower the score;
            with children penalise waves, currents and strong wind strongly; match sandy/rocky bottom; UV and clouds matter
            a little; favourite beaches get at most +0.5. Output: a level-1 title ''# Spiaggia consigliata — <date>'' (translate
            to the report language). Then ## Classifica: a table with rank, beach, score, a weather emoji, and a two-line
            reason. Then ## Prime tre: the top three in one line each. Then ## Prossimi 3 giorni: per beach in the top five,
            the score and emoji for each of the next three days. Add a chart block for the top scores: ```chart

            {"type":"bar","title":"Score","labels":[...],"series":[{"name":"Score","values":[...]}]}```. Use only figures
            returned by the tools; if a call fails, say so and never invent data. Not a safety warning service: remind to
            follow local flags and lifeguards.'
  - key: alerter
    role: scheduled
    description: Checks a user's custom alert condition and writes only if it is met.
    output: markdown
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.3
    appTools:
    - name: list_beaches
      description: List the beaches (name, zone, lat, lon, bottom, orientation, notes) managed by the admin
      action: read
      collection: beaches
      scope: all
    - name: weather_forecast
      description: 'Open-Meteo forecast: wind, cloud cover, UV, weather code'
      action: http
      http:
        method: GET
        url: https://api.open-meteo.com/v1/forecast
        attribution: Open-Meteo.com, CC BY 4.0
    - name: marine_forecast
      description: 'Open-Meteo marine forecast (Copernicus Marine based): waves, sea temperature, currents'
      action: http
      http:
        method: GET
        url: https://marine-api.open-meteo.com/v1/marine
        attribution: Open-Meteo.com Marine API, CC BY 4.0, Copernicus Marine data
    goalTemplate: 'Today is {date}. Alert "{instance}": beach {beach}, condition: {condition}, days: {days}. Write in the
      language with ISO code {lang}.'
    profile:
      inline:
        display_name: SpiaggiaGiusta alerter
        crews:
        - id: alerter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You check one user alert. Find the beach with list_beaches, fetch weather_forecast (query latitude=<lat>&longitude=<lon>&hourly=wind_speed_10m,cloud_cover,uv_index&forecast_days=7&timezone=auto)
            and marine_forecast (query latitude=<lat>&longitude=<lon>&hourly=wave_height,sea_surface_temperature&forecast_days=7&timezone=auto).
            Interpret the condition (e.g. ''calm sea'' = waves under 0.4 m, wind under 15 km/h) on the requested days. If
            the condition IS met, write ''# Avviso: <beach>'' (translated) with the days, the figures and a short advice.
            If it is NOT met, write ''# Nessun avviso oggi'' (translated) and one line. Never invent figures.'
  templates:
  - key: my_pick
    title:
      it: La mia spiaggia del giorno
      en: My daily beach
    description:
      it: Classifica quotidiana alle 7 con email delle prime tre.
      en: Daily 7am ranking with an email of the top three.
    agent: daily_pick
    params:
    - name: zone
      type: text
      required: true
      label:
        it: Zona costiera
        en: Coastal area
      help:
        it: es. Salento
        en: e.g. Salento
    - name: sea
      type: select
      required: true
      label:
        it: Mare
        en: Sea
      options:
      - value: calm
        label:
          it: Mare calmo
          en: Calm sea
      - value: surf
        label:
          it: Onde per il surf
          en: Waves for surfing
    - name: bottom
      type: select
      label:
        it: Fondale
        en: Bottom
      options:
      - value: sand
        label:
          it: Sabbia
          en: Sand
      - value: rocks
        label:
          it: Scogli
          en: Rocks
      - value: any
        label:
          it: Indifferente
          en: Any
    - name: wind
      type: select
      label:
        it: Tolleranza al vento
        en: Wind tolerance
      options:
      - value: low
        label:
          it: Bassa
          en: Low
      - value: medium
        label:
          it: Media
          en: Medium
      - value: high
        label:
          it: Alta
          en: High
    - name: kids
      type: boolean
      label:
        it: Viaggio con bambini
        en: With children
    - name: favorites
      type: text
      label:
        it: Spiagge preferite
        en: Favourite beaches
    schedule:
      cron: 0 6 * * *
      userCanChange: false
    maxPerUser: 2
    goal: Rank the beaches for zone {zone}; sea {sea}; bottom {bottom}; wind tolerance {wind}; children {kids}; favourites
      {favorites}. Today is {date}. Write in the language with ISO code {lang}.
    deliver:
      to: owner
      subject:
        it: Le 3 spiagge migliori di oggi
        en: Today's top 3 beaches
  - key: my_alert
    title:
      it: I miei avvisi
      en: My alerts
    description:
      it: Scrivimi quando il mare è come lo vuoi (piano stagionale).
      en: Email me when the sea is how you want it (season plan).
    agent: alerter
    params:
    - name: beach
      type: text
      required: true
      label:
        it: Spiaggia
        en: Beach
    - name: condition
      type: textarea
      required: true
      maxLength: 300
      label:
        it: Condizione
        en: Condition
      help:
        it: es. mare calmo
        en: e.g. calm sea
    - name: days
      type: select
      label:
        it: Giorni
        en: Days
      options:
      - value: weekend
        label:
          it: Weekend
          en: Weekend
      - value: any
        label:
          it: Qualsiasi giorno
          en: Any day
    schedule:
      cron: 30 6 * * *
      userCanChange: false
    maxPerUser: 5
    roles:
    - user
    - admin
    goal: 'Check alert "{instance}": beach {beach}; condition {condition}; days {days}. Today is {date}. Write in the language
      with ISO code {lang}.'
    deliver:
      to: owner
      onlyIfNew: true
      subject:
        it: Avviso SpiaggiaGiusta
        en: SpiaggiaGiusta alert
  data:
    collections:
    - name: beaches
      ownedBy: shared
      description: Beaches and their characteristics, managed by the admin
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome
          en: Name
      - name: zone
        type: text
        required: true
        label:
          it: Zona
          en: Area
      - name: lat
        type: number
        required: true
        label: Lat
      - name: lon
        type: number
        required: true
        label: Lon
      - name: bottom
        type: select
        label:
          it: Fondale
          en: Bottom
        options:
        - value: sand
          label:
            it: Sabbia
            en: Sand
        - value: rocks
          label:
            it: Scogli
            en: Rocks
        - value: mixed
          label:
            it: Misto
            en: Mixed
      - name: orientation
        type: text
        label:
          it: Esposizione (es. est)
          en: Exposure (e.g. east)
      - name: kids_friendly
        type: boolean
        label:
          it: Adatta ai bambini
          en: Kid friendly
      - name: notes
        type: textarea
        label:
          it: Note
          en: Notes
    - name: rankings
      ownedBy: instance
      description: Daily ranking of each user's pick
      retentionDays: 90
  views:
  - key: home
    type: page
    nav: false
    title: SpiaggiaGiusta
    sections:
    - type: hero
      title:
        it: La **spiaggia giusta** per oggi, scelta da mare e vento.
        en: Today's **right beach**, chosen by sea and wind.
      text:
        it: Punteggio da 0 a 10 per ogni spiaggia della tua zona, in base alle tue preferenze, ogni mattina alle 7.
        en: A 0-10 score for every beach in your area, based on your preferences, every morning at 7.
      actions:
      - label:
          it: Inizia gratis
          en: Start free
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Scegli
          en: Choose
        text:
          it: Zona, mare calmo o onde, sabbia o scogli, vento, bambini.
          en: Area, calm or waves, sand or rocks, wind, children.
        badge: 🏖️
      - title:
          it: Ricevi
          en: Receive
        text:
          it: Classifica, icone meteo, tre giorni di previsione e email con le prime tre.
          en: Ranking, weather icons, 3-day outlook and an email with the top three.
        badge: ☀️
      - title:
          it: Avvisi
          en: Alerts
        text:
          it: “Scrivimi quando nel weekend c'è mare calmo a Torre dell'Orso.”
          en: “Email me when the weekend has a calm sea at Torre dell'Orso.”
        badge: 🔔
    - type: cards
      id: piani
      title:
        it: Piani
        en: Plans
      items:
      - title:
          it: Gratis
          en: Free
        text:
          it: Classifica giornaliera, previsione a 3 giorni, email mattutina.
          en: Daily ranking, 3-day outlook, morning email.
      - title:
          it: Stagionale
          en: Season
        text:
          it: Tutto il gratuito più avvisi personalizzati.
          en: Everything free plus custom alerts.
    - type: note
      content:
        it: 'Dati: Open-Meteo e Copernicus Marine. Le previsioni non sostituiscono bandiere e indicazioni dei bagnini.'
        en: 'Data: Open-Meteo and Copernicus Marine. Forecasts do not replace flags and lifeguard advice.'
  - key: picks
    type: instances
    template: my_pick
    title:
      it: La mia spiaggia
      en: My beach
    roles:
    - user
    - admin
  - key: ranking
    type: cards
    source: collection:rankings
    title:
      it: Classifica
      en: Ranking
    roles:
    - user
    - admin
    data:
      display: cards
      fields:
      - key: title
        label:
          it: Titolo
          en: Title
      - key: report
        label: Report
      sort:
        field: date
        dir: desc
      limit: 7
  - key: alerts
    type: instances
    template: my_alert
    title:
      it: Avvisi
      en: Alerts
    roles:
    - user
    - admin
  - key: beaches_list
    type: table
    source: collection:beaches
    title:
      it: Spiagge
      en: Beaches
    roles:
    - user
    - admin
    columns:
    - name
    - zone
    - bottom
    - kids_friendly
  - key: beaches_admin
    type: form
    collection: beaches
    title:
      it: Gestione spiagge
      en: Manage beaches
    roles:
    - admin
    edit: true
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Spiaggia salvata
        en: Beach saved
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - user
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: season
      price: 19
      interval: year
      label:
        it: Stagionale
        en: Season
      includes:
      - custom alerts
    costs:
      agent:alerter:
        requiresPlan: season
  notifications:
    emailOnRunDone: false
  egress:
    hosts:
    - api.open-meteo.com
    - marine-api.open-meteo.com
    notes: Open-Meteo forecast and Marine APIs (marine data derived from Copernicus Marine), CC BY 4.0; Open-Meteo's free
      tier is non-commercial, so a commercial subscription needs an Open-Meteo API plan.
  extensions:
  - key: copernicus_direct
    description: 'Direct access to Copernicus Marine (needs a Copernicus account/credentials and its client): not available;
      marine data come through the Open-Meteo Marine API.'
  - key: alert_only_when_met
    description: Alert emails are sent after each daily check (onlyIfNew limits repeats); an email only when the condition
      is met would need a trigger on a hits collection.
