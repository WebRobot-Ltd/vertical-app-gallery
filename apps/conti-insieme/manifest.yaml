apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: contiinsieme
  displayName: ContiInsieme
  tagline:
    it: La contabilità della tua PMI, insieme al tuo commercialista.
  description:
    it: 'Carichi estratto conto, fatture elettroniche e scontrini: un agente abbina i movimenti alle fatture, propone le registrazioni
      e calcola IVA, liquidità e margini. Il commercialista conferma solo ciò che è incerto.'
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12355b'
      accent: '#1f8a70'
      background: '#f6f8fb'
      foreground: '#16222f'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Conti
      color: primary
    - text: Insieme
      color: accent
    width: wide
  header:
    links:
    - label:
        it: Come funziona
      href: '#come-funziona'
    - label:
        it: Per lo studio
      href: '#studio'
    cta:
      label:
        it: Accedi
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label:
        it: Amministratore
      assignedBy: admin_emails
    - key: commercialista
      label:
        it: Commercialista (tutti i clienti)
      assignedBy: invite
    - key: collaboratore
      label:
        it: Collaboratore (clienti assegnati)
      assignedBy: derived
      from: collection:companies.consultant_email
    - key: user
      label:
        it: Imprenditore
      assignedBy: signup
  limits:
  - action: agent:reconciler
    per: user
    max: 30
    window: month
    roles:
    - user
    plans:
      impresa_plus: 200
  - action: run
    per: user
    max: 10
    window: day
    roles:
    - user
  agents:
  - key: reconciler
    role: main
    description: Abbina movimenti bancari e fatture, propone le registrazioni, calcola IVA e liquidità; le incerte vanno in
      approvazione.
    awaits:
    - conferma_registrazioni
    context:
    - key: company_name
      from: collection:companies.name
    - key: vat_regime
      from: collection:companies.regime
    - key: consultant_email
      from: collection:companies.consultant_email
    appTools:
    - name: read_upload
      description: Legge un file caricato dall'utente (foto e scansioni con OCR)
      action: read_file
    - name: read_chart
      description: Piano dei conti dello studio
      action: read
      collection: piano_conti
      scope: all
    - name: read_invoices
      description: Fatture già registrate dell'azienda
      action: search
      collection: invoices
      scope: user
    - name: save_invoice
      description: Salva una fattura elettronica letta dal file
      action: write
      collection: invoices
      scope: user
    - name: read_movements
      description: Movimenti bancari già registrati
      action: search
      collection: movements
      scope: user
    - name: save_movement
      description: Salva un movimento bancario con l'esito dell'abbinamento
      action: write
      collection: movements
      scope: user
    - name: read_entries
      description: Registrazioni contabili dell'azienda
      action: search
      collection: entries
      scope: user
    - name: save_entry
      description: Salva una registrazione contabile proposta (status confermata se certa, da_verificare se incerta)
      action: write
      collection: entries
      scope: user
    - name: save_deadline
      description: Salva una scadenza fiscale calcolata
      action: write
      collection: deadlines
      scope: user
    profile:
      inline:
        display_name: ContiInsieme — riconciliatore
        crews:
        - id: reconciler
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''assistente contabile di una PMI italiana che lavora insieme al suo commercialista. Ricevi
            estratti conto (CSV), fatture elettroniche (XML FatturaPA) e foto o PDF di scontrini e ricevute. Per i file immagine
            usa read_upload con l''id del file.


            Procedura: 1) leggi i documenti e salva le fatture nuove con save_invoice (direction attiva o passiva) e i movimenti
            con save_movement. 2) Abbina ogni movimento alla fattura corrispondente per importo, data, controparte e numero;
            imposta match_status abbinato, incerto o non_abbinato. 3) Per ogni abbinamento proponi la registrazione in partita
            doppia usando i codici di read_chart, con IVA separata, e salvala con save_entry: status ''confermata'' solo se
            l''abbinamento è certo (importo identico e controparte o numero coincidenti), altrimenti ''da_verificare'' con
            confidence da 0 a 1 e motive che spiega il dubbio. 4) Per le registrazioni da_verificare chiedi la conferma del
            commercialista con il tool request_conferma_registrazioni. 5) Calcola IVA a debito, IVA a credito e saldo da versare
            del periodo secondo il regime dell''azienda, la liquidità attuale e il margine; salva le scadenze fiscali con
            save_deadline.


            In ogni record copia consultant_email dal contesto. Non inventare mai importi, aliquote o conti: se un dato manca
            scrivilo come da verificare. Le scadenze e i calcoli sono un supporto, non una consulenza fiscale: la responsabilità
            resta del commercialista.


            Struttura del report: parti con un titolo di primo livello "# Riconciliazione <periodo> — <azienda>", poi ## Riepilogo
            (movimenti, fatture, abbinati, incerti), ## IVA del periodo (tabella), ## Liquidità e margini, ## Registrazioni
            in attesa di conferma, ## Scadenze. Aggiungi un grafico come blocco ```chart con JSON {"type":"bar","title":"Ricavi
            e costi","labels":[...],"series":[{"name":"...","values":[...]}],"unit":"€"} usando solo cifre reali. Scrivi in
            italiano.'
    goalTemplate: 'Azienda: {company_name}. Regime IVA: {vat_regime}. Email consulente assegnato: {consultant_email}.

      Periodo: {period}.

      {?bank_csv_text}Estratto conto (CSV):

      {bank_csv_text}{/bank_csv_text}

      {?invoices_xml_text}Fatture elettroniche (XML):

      {invoices_xml_text}{/invoices_xml_text}

      {?documents}Scontrini e documenti caricati (file id): {documents}{/documents}

      {?notes}Note dell''imprenditore: {notes}{/notes}

      Data di oggi: {date}. Scrivi il report in italiano (codice {lang}).'
    output: markdown
    limits:
      maxTurns: 40
      maxBudgetUsd: 1.5
  - key: dashboard_agent
    role: scheduled
    description: 'Prepara ogni mese il cruscotto dell''azienda: ricavi, costi, scadenze e cash flow a tre mesi.'
    memory: instance
    writesTo:
      collection: cruscotti
    context:
    - key: company_name
      from: collection:companies.name
    - key: vat_regime
      from: collection:companies.regime
    appTools:
    - name: read_entries
      description: Registrazioni contabili dell'azienda
      action: search
      collection: entries
      scope: user
    - name: read_invoices
      description: Fatture già registrate dell'azienda
      action: search
      collection: invoices
      scope: user
    - name: read_movements
      description: Movimenti bancari già registrati
      action: search
      collection: movements
      scope: user
    - name: read_deadlines
      description: Scadenze fiscali dell'azienda
      action: search
      collection: deadlines
      scope: user
    profile:
      inline:
        display_name: ContiInsieme — cruscotto mensile
        crews:
        - id: dashboard
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Prepari il cruscotto mensile di una PMI italiana leggendo registrazioni, fatture, movimenti e scadenze
            con i tool. Parti con "# Cruscotto <mese anno> — <azienda>". Sezioni: ## Ricavi e costi (confronto col mese precedente,
            margine), ## IVA e scadenze fiscali (prossimi 90 giorni), ## Cash flow previsto (tre mesi successivi, con le ipotesi
            dichiarate: incassi e pagamenti da fatture aperte e scadenze), ## Da sapere (registrazioni ancora da verificare,
            anomalie). Aggiungi un grafico ```chart con JSON {"type":"line","title":"Cash flow previsto","labels":[...],"series":[{"name":"...","values":[...]}],"unit":"€"}
            con cifre reali. Non inventare cifre: se mancano dati dillo. Non è consulenza fiscale. Massimo 350 parole. La
            tua memoria contiene i punti chiave dell''ultimo cruscotto: segnala le differenze; alla fine chiama remember una
            volta con 5 punti chiave.'
  templates:
  - key: cruscotto_mensile
    title:
      it: Cruscotto mensile
    description:
      it: 'Ogni mese, via email: ricavi, costi, scadenze fiscali e cash flow dei prossimi tre mesi.'
    agent: dashboard_agent
    params:
    - name: titolo
      type: text
      required: true
      label:
        it: Nome del cruscotto
      default: La mia azienda
    goal: Prepara il cruscotto di "{instance}" del mese corrente. Oggi è {date}. Scrivi in italiano (codice {lang}).
    schedule:
      cron: 0 7 1 * *
      userCanChange: false
    maxPerUser: 1
    roles:
    - user
    deliver:
      to: owner
      subject: Il tuo cruscotto ContiInsieme — {title}
      onlyIfNew: false
  approvals:
  - key: conferma_registrazioni
    title:
      it: Conferma registrazioni incerte
    description: Il commercialista conferma o corregge le registrazioni proposte con bassa certezza.
    role: commercialista
    decidedBy: role
    fields:
    - description
    - account
    - amount
    - confidence
    - motive
    timeoutMinutes: 10080
    onTimeout: reject
  triggers:
  - key: nuova_da_verificare
    description: Avvisa lo studio quando una registrazione incerta entra in coda
    'on':
      collection: entries
      op: insert
      where:
        status: da_verificare
    notify:
      to:
      - role:commercialista
      - record.consultant_email
      subject:
        it: 'Registrazione da verificare: {record.description}'
      body:
        it: Una nuova registrazione incerta ({record.description}, {record.amount} €) attende la tua verifica nella coda di
          approvazione di ContiInsieme.
      link: coda
  - key: promemoria_scadenza
    description: Promemoria all'imprenditore tre giorni prima della scadenza fiscale
    'on':
      date:
        collection: deadlines
        field: due_date
        offsetDays: -3
        hour: 7
    notify:
      to: owner
      subject:
        it: 'Scadenza fiscale tra 3 giorni: {record.description}'
      body:
        it: 'Il {record.due_date} scade: {record.description}, importo stimato {record.amount} €. Controlla con il tuo commercialista.'
      link: scadenze
  inputForm:
    title:
      it: Nuova riconciliazione
    fields:
    - name: period
      type: text
      required: true
      label:
        it: Periodo (es. ottobre 2026)
      maxLength: 40
    - name: bank_csv
      type: file
      accept:
      - csv
      - xlsx
      - pdf
      maxMb: 10
      label:
        it: Estratto conto
      help:
        it: 'Il collegamento diretto alla banca non è ancora disponibile: carica l''estratto conto della banca.'
    - name: invoices_xml
      type: file
      accept:
      - xml
      - pdf
      maxMb: 15
      multiple: true
      label:
        it: Fatture elettroniche (XML dal cassetto fiscale)
    - name: documents
      type: file
      accept:
      - jpg
      - jpeg
      - png
      - pdf
      maxMb: 10
      multiple: true
      label:
        it: Scontrini, ricevute, documenti
      extract: none
    - name: notes
      type: textarea
      maxLength: 500
      label:
        it: Note (facoltative)
  data:
    collections:
    - name: companies
      description: Profilo dell'azienda cliente e commercialista assegnato
      ownedBy: user
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Ragione sociale
      - name: vat_number
        type: text
        required: true
        label:
          it: Partita IVA
      - name: regime
        type: select
        required: true
        label:
          it: Regime IVA
        options:
        - value: mensile
          label:
            it: Ordinario mensile
        - value: trimestrale
          label:
            it: Ordinario trimestrale
        - value: forfettario
          label:
            it: Forfettario
      - name: consultant_email
        type: email
        label:
          it: Email del collaboratore dello studio assegnato
      access:
      - role: commercialista
        can:
        - read
        - write
      - role: collaboratore
        where:
          consultant_email: '{user.email}'
        can:
        - read
        - write
    - name: invoices
      description: Fatture elettroniche attive e passive
      ownedBy: user
      fields:
      - name: number
        type: text
      - name: date
        type: date
      - name: direction
        type: select
        options:
        - attiva
        - passiva
      - name: counterparty
        type: text
      - name: net
        type: number
      - name: vat
        type: number
      - name: total
        type: number
      - name: due_date
        type: date
      - name: status
        type: select
        options:
        - da_pagare
        - pagata
      - name: consultant_email
        type: email
      access:
      - role: commercialista
        can:
        - read
        - write
      - role: collaboratore
        where:
          consultant_email: '{user.email}'
        can:
        - read
        - write
    - name: movements
      description: Movimenti bancari
      ownedBy: user
      retentionDays: 1095
      fields:
      - name: date
        type: date
      - name: description
        type: text
      - name: amount
        type: number
      - name: counterparty
        type: text
      - name: invoice_number
        type: text
      - name: match_status
        type: select
        options:
        - abbinato
        - incerto
        - non_abbinato
      - name: consultant_email
        type: email
      access:
      - role: commercialista
        can:
        - read
        - write
      - role: collaboratore
        where:
          consultant_email: '{user.email}'
        can:
        - read
        - write
    - name: entries
      description: Registrazioni contabili proposte e confermate
      ownedBy: user
      fields:
      - name: date
        type: date
      - name: description
        type: text
      - name: account
        type: text
        label:
          it: Conto
      - name: counter_account
        type: text
        label:
          it: Contropartita
      - name: amount
        type: number
      - name: vat
        type: number
      - name: kind
        type: select
        options:
        - ricavo
        - costo
        - iva
        - altro
      - name: status
        type: select
        options:
        - da_verificare
        - confermata
        - corretta
      - name: confidence
        type: number
      - name: motive
        type: text
      - name: document_ref
        type: text
      - name: consultant_email
        type: email
      access:
      - role: commercialista
        can:
        - read
        - write
      - role: collaboratore
        where:
          consultant_email: '{user.email}'
        can:
        - read
        - write
    - name: deadlines
      description: Scadenze fiscali calcolate
      ownedBy: user
      fields:
      - name: due_date
        type: date
      - name: description
        type: text
      - name: amount
        type: number
      - name: consultant_email
        type: email
      access:
      - role: commercialista
        can:
        - read
        - write
      - role: collaboratore
        where:
          consultant_email: '{user.email}'
        can:
        - read
        - write
    - name: piano_conti
      description: Piano dei conti dello studio
      ownedBy: shared
      fields:
      - name: code
        type: text
      - name: name
        type: text
      - name: kind
        type: text
    - name: cruscotti
      description: Cruscotti mensili generati
      ownedBy: instance
    - name: studi
      description: Studi partner e quota di ricavo
      ownedBy: org
      fields:
      - name: name
        type: text
      - name: email
        type: email
      - name: share_pct
        type: number
  views:
  - key: home
    type: page
    nav: false
    title: ContiInsieme
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow:
        it: Per PMI e studi commercialisti
      title:
        it: La contabilità **sempre aggiornata**, insieme al tuo commercialista.
      text:
        it: 'Carica estratto conto, fatture elettroniche e scontrini: un agente abbina i movimenti alle fatture, propone le
          registrazioni e calcola IVA, liquidità e margini. Il commercialista conferma solo ciò che è incerto.'
      actions:
      - label:
          it: Inizia
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
      items:
      - title:
          it: 1 · Carichi i documenti
        text:
          it: Estratto conto, fatture XML dal cassetto fiscale, foto di scontrini e ricevute.
        badge: 📄
      - title:
          it: 2 · L'agente abbina e registra
        text:
          it: Ogni movimento è abbinato alla sua fattura e registrato con il piano dei conti.
        badge: 🤖
      - title:
          it: 3 · Lo studio conferma
        text:
          it: 'Le registrazioni incerte vanno in coda: il commercialista le conferma o le corregge.'
        badge: ✅
      - title:
          it: 4 · Il cruscotto in email
        text:
          it: Ogni mese ricavi, costi, scadenze e cash flow dei tre mesi successivi.
        badge: 📊
    - type: cards
      id: studio
      title:
        it: Per lo studio
      items:
      - title:
          it: Tutti i clienti in un posto
        text:
          it: Il commercialista vede ogni cliente; i collaboratori solo quelli assegnati.
      - title:
          it: Abbonamento con quota allo studio
        text:
          it: L'impresa paga un abbonamento mensile e una quota va allo studio partner.
    - type: note
      content:
        it: 'Supporto alla contabilità, non consulenza fiscale: le registrazioni e i calcoli sono verificati dal commercialista.'
  - key: azienda
    type: form
    title:
      it: La mia azienda
    collection: companies
    fields:
    - name
    - vat_number
    - regime
    - consultant_email
    submit:
      label:
        it: Salva
      message:
        it: Azienda salvata.
      redirect: nuova
    edit: true
    roles:
    - user
  - key: nuova
    type: new_run
    title:
      it: Nuova riconciliazione
    roles:
    - user
    - admin
  - key: storico
    type: history
    title:
      it: Le mie riconciliazioni
    source: run
    roles:
    - user
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: panoramica
    type: page
    title:
      it: Panoramica
    roles:
    - user
    - admin
    sections:
    - type: data
      title:
        it: Ricavi e costi per mese
      source: collection:entries
      display: chart
      chart: bar
      groupBy:
        field: date
        bucket: month
        aggs:
        - key: totale
          agg: sum
          field: amount
      fields:
      - key: date
        label:
          it: Mese
      - key: totale
        label:
          it: Totale
        format: money
    - type: data
      title:
        it: Prossime scadenze
      source: collection:deadlines
      display: table
      fields:
      - key: due_date
        label:
          it: Scadenza
        format: date
      - key: description
        label:
          it: Descrizione
      - key: amount
        label:
          it: Importo
        format: money
      sort:
        field: due_date
        dir: asc
      limit: 20
  - key: scadenze
    type: table
    title:
      it: Scadenze fiscali
    source: collection:deadlines
    columns:
    - due_date
    - description
    - amount
    export: true
    roles:
    - user
    - admin
    - commercialista
    - collaboratore
  - key: registrazioni
    type: table
    title:
      it: Registrazioni
    source: collection:entries
    columns:
    - date
    - description
    - account
    - counter_account
    - amount
    - vat
    - status
    export: true
    roles:
    - user
    - admin
    - commercialista
    - collaboratore
  - key: movimenti
    type: table
    title:
      it: Movimenti bancari
    source: collection:movements
    columns:
    - date
    - description
    - amount
    - counterparty
    - invoice_number
    - match_status
    export: true
    roles:
    - user
    - admin
    - commercialista
    - collaboratore
  - key: fatture
    type: table
    title:
      it: Fatture
    source: collection:invoices
    columns:
    - number
    - date
    - direction
    - counterparty
    - total
    - due_date
    - status
    export: true
    roles:
    - user
    - admin
    - commercialista
    - collaboratore
  - key: coda
    type: approvals
    title:
      it: Coda di approvazione
    approvals:
    - conferma_registrazioni
    roles:
    - commercialista
    - admin
  - key: da_correggere
    type: table
    title:
      it: Registrazioni da verificare
    source: collection:entries
    query: status = da_verificare
    columns:
    - date
    - description
    - account
    - amount
    - confidence
    - motive
    - status
    roles:
    - commercialista
    - collaboratore
    - admin
  - key: clienti
    type: table
    title:
      it: Clienti dello studio
    source: collection:companies
    columns:
    - name
    - vat_number
    - regime
    - consultant_email
    export: true
    roles:
    - commercialista
    - collaboratore
    - admin
  - key: cruscotti
    type: instances
    template: cruscotto_mensile
    title:
      it: Cruscotto mensile
    roles:
    - user
    - admin
  - key: abbonamento
    type: account
    title:
      it: Abbonamento
    roles:
    - user
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: impresa
      price: 39
      interval: month
      label:
        it: Impresa
      includes:
      - Riconciliazioni (30 al mese)
      - Cruscotto mensile via email
      - Revisione del commercialista
      roles:
      - user
    - key: impresa_plus
      price: 79
      interval: month
      label:
        it: Impresa Plus
      includes:
      - Riconciliazioni (200 al mese)
      - Cruscotto mensile via email
      - Revisione del commercialista
      roles:
      - user
    revenueShare:
    - to: collection:studi
      pct: 20
      basis: abbonamenti pagati dalle imprese clienti dello studio partner
      payout: manual
  notifications:
    emailOnRunDone: true
  extensions:
  - key: open_banking
    description: Il collegamento al conto corrente via open banking richiede un consenso OAuth (PSD2) verso la banca, non
      ancora disponibile. Per ora l'imprenditore carica l'estratto conto in CSV, Excel o PDF.
  - key: cassetto_fiscale_sdi
    description: Il collegamento automatico al cassetto fiscale e al Sistema di Interscambio non è disponibile (accesso con
      SPID/Entratel, non con chiave API). Per ora le fatture XML si caricano a mano; un intermediario SDI con chiave API potrà
      essere aggiunto come credenziale.
  - key: studio_payout
    description: La quota allo studio partner è registrata come ripartizione di ricavo con pagamento manuale; il collegamento
      di ogni impresa al proprio studio va impostato dall'amministratore.
