apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: contiinsieme
  displayName: ContiInsieme
  tagline: La contabilità della tua PMI, insieme al tuo commercialista.
  description: ContiInsieme abbina i movimenti bancari alle fatture, propone le registrazioni contabili con il piano dei conti,
    calcola IVA da versare, liquidità e margini. Le registrazioni incerte passano al commercialista dello studio.
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12355b'
      accent: '#1f8a70'
      background: '#f6f8fb'
      foreground: '#16222f'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Conti
      color: primary
    - text: Insieme
      color: accent
    button: accent
  header:
    links:
    - label: Come funziona
      href: '#come-funziona'
    - label: Per lo studio
      href: '#studio'
    cta:
      label: Accedi
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Amministratore
      assignedBy: admin_emails
    - key: commercialista
      label: Commercialista
      assignedBy: invite
    - key: collaboratore
      label: Collaboratore dello studio
      assignedBy: invite
    - key: user
      label: Imprenditore
      assignedBy: signup
  limits:
  - action: agent:contabile
    per: user
    max: 10
    window: day
    roles:
    - user
  agents:
  - key: contabile
    role: main
    description: Abbina movimenti e fatture, propone le registrazioni, calcola IVA, liquidità e margini; chiede approvazione
      per i casi incerti.
    profile:
      inline:
        display_name: ContiInsieme contabile
        crews:
        - id: contabile
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''assistente contabile di una PMI italiana, al servizio dell''imprenditore e del suo commercialista.
            Ricevi movimenti bancari, fatture elettroniche (dati incollati o link) e note su scontrini/ricevute. Per ogni
            movimento: 1) cerca la fattura corrispondente (importo, data, controparte, causale); 2) proponi la registrazione
            in partita doppia con conto del piano dei conti, aliquota IVA e confidenza (alta/media/bassa); 3) salva ogni registrazione
            con lo strumento salva_registrazione. Se la confidenza non è alta, o manca la fattura, o l''importo supera 5.000
            euro, chiama request_registrazione_incerta: la decide il commercialista. Non inventare mai importi, fatture o
            controparti: se un dato manca, dillo. Non dare consulenza fiscale come fatto certo; le scadenze vanno verificate
            dallo studio. Struttura del report: parti con un titolo di primo livello "# Elaborazione contabile — <periodo>",
            poi ## Sintesi, ## Movimenti abbinati (tabella), ## Registrazioni proposte, ## Da approvare, ## IVA (a debito,
            a credito, saldo da versare), ## Liquidità prevista, ## Margini, ## Scadenze fiscali. Aggiungi un grafico dei
            ricavi e costi come blocco ```chart con JSON {"type":"bar","title":"...","labels":[...],"series":[{"name":"...","values":[...]}],"unit":"€"}
            con soli dati reali. Scrivi in italiano.'
    awaits:
    - registrazione_incerta
    appTools:
    - name: leggi_movimenti
      description: Legge i movimenti bancari registrati dell'azienda
      action: read
      collection: movimenti
      scope: user
    - name: leggi_fatture
      description: Legge le fatture dell'azienda
      action: read
      collection: fatture
      scope: user
    - name: salva_registrazione
      description: Salva una registrazione contabile proposta
      action: write
      collection: registrazioni
      scope: user
    goalTemplate: 'Periodo: {periodo}.

      Movimenti bancari (incollati dall''utente):

      {movimenti}

      {?fatture}Fatture elettroniche (dati o link):

      {fatture}{/fatture}

      {?documenti}Scontrini e ricevute (link o testo):

      {documenti}{/documenti}

      {?regime}Regime IVA: {regime_label}.{/regime}

      Oggi è {date}. Rispondi in italiano.'
    output: markdown
    limits:
      maxTurns: 15
      maxBudgetUsd: 0.8
  - key: cruscotto
    role: scheduled
    description: 'Prepara ogni mese il cruscotto di un''azienda: ricavi, costi, scadenze e cash flow a tre mesi.'
    memory: instance
    writesTo:
      collection: cruscotti
    profile:
      inline:
        display_name: ContiInsieme cruscotto
        crews:
        - id: cruscotto
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Prepari il cruscotto mensile di una PMI italiana usando solo le registrazioni, i movimenti e le
            fatture salvati. Inizia con "# Cruscotto — <mese anno>". Sezioni: ## Ricavi e costi, ## Margini, ## IVA e scadenze
            fiscali del mese, ## Cash flow previsto (prossimi 3 mesi, con ipotesi dichiarate), ## Da fare. Aggiungi un grafico
            ```chart (bar o line) con dati reali. Non inventare cifre: se mancano dati, dichiaralo. Le scadenze vanno verificate
            con lo studio. La tua memoria contiene i punti chiave dell''ultimo cruscotto: confronta con quello. Alla fine
            chiama remember una volta con i 5 punti chiave. Italiano.'
    appTools:
    - name: leggi_registrazioni
      description: Legge le registrazioni contabili dell'azienda
      action: read
      collection: registrazioni
      scope: user
    - name: leggi_movimenti
      description: Legge i movimenti bancari registrati dell'azienda
      action: read
      collection: movimenti
      scope: user
  approvals:
  - key: registrazione_incerta
    title: Registrazione da confermare
    description: Il commercialista conferma o corregge una registrazione incerta.
    role: commercialista
    fields:
    - descrizione
    - importo
    - conto
    - motivo_incertezza
    timeoutMinutes: 10080
    onTimeout: reject
    decidedBy: role
  templates:
  - key: cruscotto_mensile
    title: Cruscotto mensile
    description: Ogni mese ricavi, costi, scadenze fiscali e cash flow dei prossimi tre mesi.
    agent: cruscotto
    params:
    - name: azienda
      type: text
      required: true
      label: Azienda
    goal: Prepara il cruscotto mensile di "{instance}" ({azienda}). Oggi è {date}. Rispondi in italiano.
    schedule:
      cron: 0 6 2 * *
      userCanChange: false
    maxPerUser: 2
    roles:
    - user
    cost:
      perRun: 15
  inputForm:
    title: Nuova elaborazione
    fields:
    - name: periodo
      type: text
      required: true
      label: Periodo
      help: es. ottobre 2026
    - name: regime
      type: select
      label: Regime IVA
      options:
      - value: mensile
        label: Liquidazione mensile
      - value: trimestrale
        label: Liquidazione trimestrale
      - value: forfettario
        label: Forfettario (senza IVA)
    - name: movimenti
      type: textarea
      required: true
      maxLength: 8000
      label: Movimenti bancari
      help: 'Incolla l''estratto conto: data, importo, descrizione.'
    - name: fatture
      type: textarea
      maxLength: 8000
      label: Fatture elettroniche
      help: Incolla i dati delle fatture o link ai file.
    - name: documenti
      type: urls
      label: Scontrini e ricevute (link)
      help: 'Il caricamento diretto di file non è ancora disponibile: usa un link.'
  data:
    collections:
    - name: movimenti
      ownedBy: user
      description: Movimenti bancari dell'azienda
      fields:
      - name: data
        type: date
      - name: importo
        type: number
      - name: descrizione
        type: text
      - name: fattura
        type: text
    - name: fatture
      ownedBy: user
      description: Fatture elettroniche dell'azienda
      fields:
      - name: numero
        type: text
      - name: data
        type: date
      - name: controparte
        type: text
      - name: imponibile
        type: number
      - name: iva
        type: number
      - name: tipo
        type: select
        options:
        - attiva
        - passiva
    - name: registrazioni
      ownedBy: user
      description: Registrazioni contabili proposte e confermate
      fields:
      - name: data
        type: date
      - name: descrizione
        type: text
      - name: conto
        type: text
      - name: importo
        type: number
      - name: iva
        type: number
      - name: confidenza
        type: select
        options:
        - alta
        - media
        - bassa
      - name: stato
        type: select
        options:
        - proposta
        - confermata
        - corretta
    - name: cruscotti
      ownedBy: instance
      description: Cruscotti mensili di ogni azienda
    - name: studi
      ownedBy: org
      description: Studi partner e quota di ricavo
      fields:
      - name: nome
        type: text
      - name: email
        type: email
    - name: assegnazioni
      ownedBy: org
      description: Clienti assegnati ai collaboratori dello studio
      fields:
      - name: collaboratore
        type: email
      - name: cliente
        type: email
  views:
  - key: home
    type: page
    title: ContiInsieme
    nav: false
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow: Contabilità per PMI
      title: La tua contabilità, **sempre aggiornata**, insieme al tuo commercialista.
      text: Un agente abbina movimenti e fatture, propone le registrazioni, calcola IVA, liquidità e margini. Quello che è
        incerto lo conferma il tuo commercialista.
      actions:
      - label: Inizia
        href: /login
        style: primary
      - label: Come funziona
        href: '#come-funziona'
        style: ghost
    - type: steps
      id: come-funziona
      title: Come funziona
      items:
      - title: Porta i tuoi dati
        text: Incolla movimenti e fatture, oppure indica i link a scontrini e ricevute.
        badge: 📥
      - title: L'agente registra
        text: Abbina ogni movimento alla fattura e propone la registrazione con il piano dei conti.
        badge: 🧾
      - title: Lo studio conferma
        text: Le registrazioni incerte arrivano in coda al commercialista.
        badge: ✅
      - title: Cruscotto mensile
        text: Ricavi, costi, scadenze fiscali e cash flow dei prossimi tre mesi.
        badge: 📊
    - type: cards
      id: studio
      title: Per lo studio
      items:
      - title: Commercialista
        text: Vede tutti i clienti dello studio e decide la coda di approvazione.
      - title: Collaboratori
        text: Lavorano solo sui clienti assegnati.
      - title: Imprenditore
        text: Vede soltanto la propria azienda.
    - type: note
      content: 'Supporto alla contabilità, non consulenza fiscale: le scadenze e gli importi vanno verificati dallo studio.'
  - key: nuova
    type: new_run
    title: Nuova elaborazione
    roles:
    - user
    - admin
  - key: storico
    type: history
    title: Le mie elaborazioni
    source: run
    roles:
    - user
    - admin
  - key: elaborazione
    type: report
    title: Elaborazione
    source: run
    printable: true
    nav: false
  - key: registrazioni
    type: table
    title: Registrazioni
    source: collection:registrazioni
    roles:
    - user
    - commercialista
    - collaboratore
    - admin
    data:
      display: table
      fields:
      - key: data
        label: Data
        format: date
      - key: descrizione
        label: Descrizione
      - key: conto
        label: Conto
      - key: importo
        label: Importo
        format: money
      - key: confidenza
        label: Confidenza
        format: badge
      - key: stato
        label: Stato
        format: badge
      sort:
        field: data
        dir: desc
      limit: 100
      empty: Nessuna registrazione.
  - key: coda
    type: approvals
    title: Coda di approvazione
    approvals:
    - registrazione_incerta
    roles:
    - commercialista
    - admin
  - key: cruscotti
    type: instances
    title: Cruscotto mensile
    template: cruscotto_mensile
    roles:
    - user
  - key: account
    type: account
    title: Abbonamento
    roles:
    - user
  - key: admin
    type: admin
    title: Amministrazione
    roles:
    - admin
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 30
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:contabile:
        estimate: 10
        metered: true
    packs:
    - key: extra
      credits: 500
      price: 9
      label: Crediti extra
    plans:
    - key: impresa
      price: 39
      interval: month
      label: ContiInsieme Impresa
      includes:
      - Elaborazioni contabili
      - Cruscotto mensile
      - Revisione dello studio
      credits: 800
      creditsReset: monthly
      roles:
      - user
    revenueShare:
    - to: collection:studi
      pct: 20
      basis: abbonamenti pagati dalle imprese seguite dallo studio
      payout: manual
  extensions:
  - key: open_banking
    description: 'Collegamento del conto corrente via open banking: richiede le credenziali di ogni cliente, non ancora disponibile.
      Per ora i movimenti si incollano.'
  - key: cassetto_fiscale_sdi
    description: 'Ricezione automatica delle fatture dal Sistema di Interscambio e dal cassetto fiscale: non disponibile.
      Per ora si incollano i dati delle fatture.'
  - key: upload_documenti
    description: 'Caricamento di foto e PDF di scontrini e ricevute: non disponibile, si usano link o testo.'
  - key: email_mensile
    description: 'Invio via email del cruscotto mensile: le notifiche non sono disponibili. Il cruscotto è consultabile nell''app.'
  - key: visibilita_studio
    description: 'Il commercialista vede tutti i clienti dello studio e i collaboratori solo i clienti assegnati (collection
      assegnazioni): richiede una regola di accesso dello studio ai record dei clienti, non esprimibile oggi nel manifest.'
