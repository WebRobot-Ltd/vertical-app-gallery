apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: impattofiliera
  displayName: ImpattoFiliera
  tagline:
    it: Le emissioni CO2 della tua filiera, fornitore per fornitore.
    en: Your supply chain CO2 emissions, supplier by supplier.
    de: Die CO2-Emissionen Ihrer Lieferkette, Lieferant für Lieferant.
  description:
    it: Invita i fornitori a compilare un questionario, un agente verifica i dati e calcola Scope 1, 2 e 3 con fattori ISPRA
      e DEFRA; tu approvi e scarichi il report.
    en: Invite suppliers to fill in a questionnaire; an agent checks the data and computes Scope 1, 2 and 3 with ISPRA and
      DEFRA factors; you approve and download the report.
    de: Laden Sie Lieferanten zu einem Fragebogen ein; ein Agent prüft die Daten und berechnet Scope 1, 2 und 3 mit ISPRA-
      und DEFRA-Faktoren; Sie prüfen und laden den Bericht herunter.
  langs:
  - it
  - en
  - de
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#16423c'
      accent: '#2f8f6b'
      background: '#f6f8f5'
      foreground: '#16231f'
    fonts:
      body: Inter
      display: DM Serif Display
    wordmark:
    - text: Impatto
      color: primary
    - text: Filiera
      color: accent
    width: wide
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
        de: So funktioniert's
      href: '#come-funziona'
    - label:
        it: Fattori
        en: Factors
        de: Faktoren
      href: '#fattori'
    cta:
      label:
        it: Accedi
        en: Sign in
        de: Anmelden
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      label:
        it: Azienda
        en: Company
        de: Unternehmen
      assignedBy: signup
    - key: supplier
      label:
        it: Fornitore
        en: Supplier
        de: Lieferant
      assignedBy: derived
      from: collection:suppliers.contact_email
  limits:
  - action: create:suppliers
    max: 10
    window: total
    plans:
      s50: 50
      s200: 200
      s500: -1
  - action: agent:reporter
    per: user
    max: 20
    window: day
  agents:
  - key: analyst
    role: helper
    description: Checks plausibility of a supplier's questionnaire, computes Scope 1/2/3 with public factors, flags anomalies.
    profile:
      inline:
        display_name: ImpattoFiliera analyst
        crews:
        - id: analyst
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 14
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are a GHG-accounting analyst for manufacturing supply chains. You receive one supplier questionnaire
            (electricity kWh, gas m3, fuels, raw materials, transport, certifications). Steps: 1) read the supplier record
            with read_supplier (category, spend). 2) Read the emission factors with read_factors (collection emission_factors:
            source ISPRA, DEFRA, year, activity, unit, factor kgCO2e per unit). Use ONLY factors found there, preferring ISPRA
            for Italian electricity and gas and DEFRA for fuels, materials and freight; cite source and year for each. If
            a needed factor is missing, do not invent it: list it under ''Missing factors'' and leave that item out. 3) Only
            if the commercial database tool returns data (the customer has a licence), use it for materials and say so; if
            it says the key is not connected, use public factors and say nothing more. 4) Plausibility checks: negative or
            zero values, implausible orders of magnitude versus spend and category, unit mix-ups, electricity vs production
            inconsistencies, certifications claimed without a file. 5) Compute: Scope 1 = gas + fuels burned on site; Scope
            2 = purchased electricity (location-based); Scope 3 = raw materials + transport. Values in tCO2e. 6) Update the
            supplier status to ''responded'' with write_supplier. Report in Markdown starting with ''# Supplier <name> — <year>'',
            sections ## Data received, ## Calculation (table: item, quantity, factor, source, tCO2e), ## Anomalies, ## Missing
            factors. Never give legal or certification advice. End with a fenced json block (last in the answer) with keys:
            supplier_year (name-year), supplier_name, supplier_email, company_email, category, year, scope1_tco2e, scope2_tco2e,
            scope3_tco2e, total_tco2e, factors_used, anomalies, plausibility (ok|warning|fail), status ''pending''.'
          mcp_servers: []
    appTools:
    - name: read_supplier
      description: Read the supplier records the user may see
      action: read
      collection: suppliers
      scope: user
    - name: write_supplier
      description: Update a supplier record (status)
      action: write
      collection: suppliers
      scope: user
    - name: read_factors
      description: Read the public emission factors (ISPRA, DEFRA)
      action: read
      collection: emission_factors
      scope: all
    - name: read_upload
      description: Read a certificate the supplier uploaded
      action: read_file
    - name: commercial_ef
      description: Query the commercial emission-factor database (only when the customer connected a licence key)
      action: http
      http:
        method: GET
        url: https://api.ecoinvent.org/v1/search
        attribution: Commercial database, licensed by the customer
    output: markdown+json
    resultSchema:
      type: object
      properties:
        supplier_year:
          type: string
        supplier_name:
          type: string
        supplier_email:
          type: string
        company_email:
          type: string
        category:
          type: string
        year:
          type: number
        scope1_tco2e:
          type: number
        scope2_tco2e:
          type: number
        scope3_tco2e:
          type: number
        total_tco2e:
          type: number
        factors_used:
          type: string
        anomalies:
          type: string
        plausibility:
          type: string
        status:
          type: string
    writesTo:
      collection: results
      parse: json_last
      keyBy: supplier_year
  - key: reporter
    role: main
    description: Writes the printable supply-chain emissions report from the approved results.
    profile:
      inline:
        display_name: ImpattoFiliera reporter
        crews:
        - id: reporter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 4
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write supply-chain GHG reports for the sustainability manager of a manufacturer. Use ONLY records
            with status ''approved'' for the year requested; ignore pending or rejected ones and mention how many were left
            out. Start with ''# Supply chain emissions report — <year>''. Sections: ## Summary (totals Scope 1, 2, 3 in tCO2e),
            ## By category, ## By supplier (table), ## Top contributors, ## Data quality and anomalies, ## Methodology and
            sources (ISPRA, DEFRA as recorded in each result''s factors_used), ## Next steps. Add one chart as a fenced block
            ```chart {"type":"bar","title":"…","labels":[…],"series":[{"name":"tCO2e","values":[…]}],"unit":"tCO2e"} ``` with
            real figures only. Never invent figures; this is decision support, not an assurance statement.'
    context:
    - key: results
      from: collection:results
    goalTemplate: 'Year: {year}

      Approved and other results (JSON lines):

      {results}

      Write the report in the language with ISO code {lang}. Date: {date}.'
    output: markdown
  inputForm:
    title:
      it: Nuovo report
      en: New report
      de: Neuer Bericht
    fields:
    - name: year
      type: number
      required: true
      label:
        it: Anno di riferimento
        en: Reference year
        de: Referenzjahr
      default: 2025
  data:
    collections:
    - name: suppliers
      description: The company's suppliers
      ownedBy: user
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Fornitore
          en: Supplier
          de: Lieferant
      - name: contact_name
        type: text
        required: true
        label:
          it: Referente
          en: Contact person
          de: Ansprechpartner
      - name: contact_email
        type: email
        required: true
        label:
          it: Email referente
          en: Contact email
          de: E-Mail
      - name: category
        type: select
        required: true
        label:
          it: Categoria di acquisto
          en: Purchase category
          de: Einkaufskategorie
        options:
        - value: raw_materials
          label:
            it: Materie prime
            en: Raw materials
            de: Rohstoffe
        - value: components
          label:
            it: Componenti
            en: Components
            de: Komponenten
        - value: packaging
          label:
            it: Imballaggi
            en: Packaging
            de: Verpackung
        - value: logistics
          label:
            it: Logistica
            en: Logistics
            de: Logistik
        - value: services
          label:
            it: Servizi
            en: Services
            de: Dienstleistungen
      - name: spend_eur
        type: number
        label:
          it: Spesa annua (EUR)
          en: Annual spend (EUR)
          de: Jahresausgaben (EUR)
      - name: company_email
        type: email
        required: true
        label:
          it: Email del responsabile sostenibilità
          en: Sustainability manager email
          de: E-Mail Nachhaltigkeitsverantwortlicher
      - name: send_on
        type: date
        required: true
        label:
          it: Data di invio del questionario
          en: Questionnaire send date
          de: Versanddatum des Fragebogens
      - name: status
        type: select
        default: invited
        label:
          it: Stato
          en: Status
          de: Status
        options:
        - value: invited
          label:
            it: Invitato
            en: Invited
            de: Eingeladen
        - value: responded
          label:
            it: Ha risposto
            en: Responded
            de: Geantwortet
        - value: approved
          label:
            it: Approvato
            en: Approved
            de: Freigegeben
      access:
      - role: supplier
        where:
          contact_email: '{user.email}'
        can:
        - read
    - name: supplier_data
      description: Questionnaire answers (owned by the supplier who sends them)
      ownedBy: user
      retentionDays: 1825
      fields:
      - name: supplier
        type: select
        required: true
        optionsFrom: collection:suppliers
        label:
          it: Fornitore
          en: Supplier
          de: Lieferant
      - name: year
        type: number
        required: true
        label:
          it: Anno
          en: Year
          de: Jahr
      - name: electricity_kwh
        type: number
        required: true
        label:
          it: Energia elettrica (kWh)
          en: Electricity (kWh)
          de: Strom (kWh)
      - name: gas_m3
        type: number
        label:
          it: Gas naturale (Sm3)
          en: Natural gas (Sm3)
          de: Erdgas (Sm3)
      - name: fuels
        type: textarea
        label:
          it: Carburanti (tipo e litri)
          en: Fuels (type and litres)
          de: Kraftstoffe (Art und Liter)
      - name: raw_materials
        type: textarea
        label:
          it: Materie prime (tipo e tonnellate)
          en: Raw materials (type and tonnes)
          de: Rohstoffe (Art und Tonnen)
      - name: transport
        type: textarea
        label:
          it: Trasporti (modo, km, tonnellate)
          en: Transport (mode, km, tonnes)
          de: Transport (Art, km, Tonnen)
      - name: certifications
        type: multiselect
        label:
          it: Certificazioni
          en: Certifications
          de: Zertifizierungen
        options:
        - ISO 14001
        - ISO 50001
        - EMAS
        - SBTi
        - EcoVadis
        - other
      - name: certificate
        type: file
        accept:
        - pdf
        - jpg
        - png
        maxMb: 10
        multiple: true
        label:
          it: Certificati (file)
          en: Certificates (files)
          de: Zertifikate (Dateien)
      - name: notes
        type: textarea
        label:
          it: Note
          en: Notes
          de: Anmerkungen
    - name: results
      description: Calculated emissions per supplier and year, reviewed by the company
      ownedBy: user
      fields:
      - name: supplier_year
        type: text
      - name: supplier_name
        type: text
        label:
          it: Fornitore
          en: Supplier
          de: Lieferant
      - name: supplier_email
        type: email
      - name: company_email
        type: email
      - name: category
        type: text
        label:
          it: Categoria
          en: Category
          de: Kategorie
      - name: year
        type: number
        label:
          it: Anno
          en: Year
          de: Jahr
      - name: scope1_tco2e
        type: number
        label: Scope 1
      - name: scope2_tco2e
        type: number
        label: Scope 2
      - name: scope3_tco2e
        type: number
        label: Scope 3
      - name: total_tco2e
        type: number
        label:
          it: Totale tCO2e
          en: Total tCO2e
          de: Gesamt tCO2e
      - name: factors_used
        type: textarea
        label:
          it: Fattori usati
          en: Factors used
          de: Verwendete Faktoren
      - name: anomalies
        type: textarea
        label:
          it: Anomalie
          en: Anomalies
          de: Auffälligkeiten
      - name: plausibility
        type: select
        label:
          it: Plausibilità
          en: Plausibility
          de: Plausibilität
        options:
        - ok
        - warning
        - fail
      - name: status
        type: select
        default: pending
        label:
          it: Revisione
          en: Review
          de: Prüfung
        options:
        - value: pending
          label:
            it: Da rivedere
            en: To review
            de: Zu prüfen
        - value: approved
          label:
            it: Approvato
            en: Approved
            de: Freigegeben
        - value: rejected
          label:
            it: Respinto
            en: Rejected
            de: Abgelehnt
      - name: review_note
        type: textarea
        label:
          it: Nota di revisione
          en: Review note
          de: Prüfnotiz
      access:
      - role: user
        where:
          company_email: '{user.email}'
        can:
        - read
        - write
    - name: emission_factors
      description: Public emission factors (ISPRA, DEFRA) loaded by the app admins
      ownedBy: shared
      fields:
      - name: source
        type: select
        options:
        - ISPRA
        - DEFRA
      - name: year
        type: number
      - name: activity
        type: text
      - name: unit
        type: text
      - name: factor_kgco2e
        type: number
    credentials:
    - provider: ecoinvent
      kind: api_key
      scope: user
      required: false
      label:
        it: Licenza database commerciale (facoltativa)
        en: Commercial database licence (optional)
        de: Lizenz kommerzielle Datenbank (optional)
      help:
        it: Incolla la chiave API della tua licenza, se ne hai una.
        en: Paste the API key of your licence, if you have one.
        de: Fügen Sie den API-Schlüssel Ihrer Lizenz ein, falls vorhanden.
  egress:
    hosts:
    - api.ecoinvent.org
    notes: Used only with the customer's own licence key; public ISPRA/DEFRA factors are read from the emission_factors collection.
  triggers:
  - key: invite
    description: Sends the questionnaire link on the chosen date
    'on':
      date:
        collection: suppliers
        field: send_on
        offsetDays: 0
        hour: 7
      where:
        status: invited
    notify:
      to: record.contact_email
      subject:
        it: Questionario emissioni CO2 per {record.name}
        en: CO2 emissions questionnaire for {record.name}
        de: CO2-Emissionsfragebogen für {record.name}
      body:
        it: 'Gentile {record.contact_name}, le chiediamo di compilare il questionario su consumi di energia elettrica e gas,
          carburanti, materie prime, trasporti e certificazioni. Acceda con questa email dal link: '
        en: 'Dear {record.contact_name}, please fill in the questionnaire on electricity and gas use, fuels, raw materials,
          transport and certifications. Sign in with this email address using the link: '
        de: 'Sehr geehrte/r {record.contact_name}, bitte füllen Sie den Fragebogen zu Strom, Gas, Kraftstoffen, Rohstoffen,
          Transport und Zertifizierungen aus. Melden Sie sich mit dieser E-Mail über den Link an: '
      link: questionnaire
  - key: remind
    description: Reminder after one week to suppliers who have not answered
    'on':
      date:
        collection: suppliers
        field: send_on
        offsetDays: 7
        hour: 7
      where:
        status: invited
    notify:
      to: record.contact_email
      subject:
        it: 'Promemoria: questionario CO2 per {record.name}'
        en: 'Reminder: CO2 questionnaire for {record.name}'
        de: 'Erinnerung: CO2-Fragebogen für {record.name}'
      body:
        it: 'Gentile {record.contact_name}, non abbiamo ancora ricevuto il questionario. Può compilarlo dal link: '
        en: 'Dear {record.contact_name}, we have not yet received the questionnaire. You can fill it in here: '
        de: 'Sehr geehrte/r {record.contact_name}, wir haben den Fragebogen noch nicht erhalten. Sie können ihn hier ausfüllen: '
      link: questionnaire
  - key: analyse
    description: 'A questionnaire arrives: the analyst checks it and computes the emissions'
    'on':
      collection: supplier_data
      op: insert
    start:
      agent: analyst
    asUser: true
    goal: 'New questionnaire. Supplier record id: {record.supplier}. Year: {record.year}. Electricity kWh: {record.electricity_kwh}.
      Gas Sm3: {record.gas_m3}. Fuels: {record.fuels}. Raw materials: {record.raw_materials}. Transport: {record.transport}.
      Certifications: {record.certifications}. Certificate file ids: {record.certificate}. Notes: {record.notes}. Today is
      {date}. Write the analysis in the language with ISO code {lang}.'
  - key: review_needed
    description: Tell the sustainability manager a supplier is ready for review
    'on':
      collection: results
      op: insert
    notify:
      to: record.company_email
      subject:
        it: 'Fornitore da rivedere: {record.supplier_name}'
        en: 'Supplier to review: {record.supplier_name}'
        de: 'Lieferant zur Prüfung: {record.supplier_name}'
      body:
        it: 'I dati di {record.supplier_name} sono stati verificati dall''agente (plausibilità: {record.plausibility}). Rivedi
          e approva per includerli nel totale.'
        en: 'The data of {record.supplier_name} was checked by the agent (plausibility: {record.plausibility}). Review and
          approve to include it in the total.'
        de: 'Die Daten von {record.supplier_name} wurden vom Agenten geprüft (Plausibilität: {record.plausibility}). Prüfen
          und freigeben, um sie in die Summe aufzunehmen.'
      link: review
  views:
  - key: home
    type: page
    nav: false
    title: ImpattoFiliera
    sections:
    - type: hero
      layout: split
      band: true
      title:
        it: Le emissioni della **filiera**, fornitore per fornitore.
        en: Your **supply chain** emissions, supplier by supplier.
        de: Die Emissionen Ihrer **Lieferkette**, Lieferant für Lieferant.
      text:
        it: Invita i fornitori, raccogli i dati, calcola Scope 1, 2 e 3 con fattori pubblici ISPRA e DEFRA e approva ogni
          fornitore prima che entri nel totale.
        en: Invite suppliers, collect data, compute Scope 1, 2 and 3 with public ISPRA and DEFRA factors and approve each
          supplier before it enters the total.
        de: Laden Sie Lieferanten ein, sammeln Sie Daten, berechnen Sie Scope 1, 2 und 3 mit öffentlichen ISPRA- und DEFRA-Faktoren
          und geben Sie jeden Lieferanten frei, bevor er in die Summe eingeht.
      actions:
      - label:
          it: Inizia
          en: Get started
          de: Loslegen
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
        de: So funktioniert's
      items:
      - title:
          it: 1 · Elenco fornitori
          en: 1 · Supplier list
          de: 1 · Lieferantenliste
        text:
          it: Inserisci fornitori, referenti, email e categorie di acquisto.
          en: Enter suppliers, contacts, emails and purchase categories.
          de: Erfassen Sie Lieferanten, Kontakte, E-Mails und Einkaufskategorien.
      - title:
          it: 2 · Questionario
          en: 2 · Questionnaire
          de: 2 · Fragebogen
        text:
          it: Ogni fornitore riceve una email con il link al modulo e un sollecito dopo una settimana. Vede solo i propri
            dati.
          en: Each supplier gets an email with a link to the form and a reminder after one week. They see only their own data.
          de: Jeder Lieferant erhält eine E-Mail mit Link zum Formular und nach einer Woche eine Erinnerung. Er sieht nur
            seine eigenen Daten.
      - title:
          it: 3 · Calcolo e revisione
          en: 3 · Calculation and review
          de: 3 · Berechnung und Prüfung
        text:
          it: Un agente verifica la plausibilità e calcola le emissioni; tu approvi.
          en: An agent checks plausibility and computes emissions; you approve.
          de: Ein Agent prüft die Plausibilität und berechnet die Emissionen; Sie geben frei.
    - type: cards
      id: fattori
      title:
        it: Fattori di emissione
        en: Emission factors
        de: Emissionsfaktoren
      items:
      - title: ISPRA
        text:
          it: Elettricità e gas per l'Italia.
          en: Electricity and gas for Italy.
          de: Strom und Gas für Italien.
      - title: DEFRA
        text:
          it: Carburanti, materiali, trasporti.
          en: Fuels, materials, freight.
          de: Kraftstoffe, Materialien, Fracht.
      - title:
          it: Database commerciale
          en: Commercial database
          de: Kommerzielle Datenbank
        text:
          it: Solo se colleghi la tua licenza.
          en: Only if you connect your licence.
          de: Nur wenn Sie Ihre Lizenz verbinden.
    - type: note
      content:
        it: Supporto al calcolo, non una certificazione o assicurazione.
        en: Calculation support, not a certification or assurance.
        de: Berechnungshilfe, keine Zertifizierung oder Prüfung.
  - key: add_supplier
    type: form
    title:
      it: Nuovo fornitore
      en: New supplier
      de: Neuer Lieferant
    collection: suppliers
    submit:
      label:
        it: Salva fornitore
        en: Save supplier
        de: Lieferant speichern
      message:
        it: 'Fornitore salvato: il questionario partirà alla data scelta.'
        en: 'Supplier saved: the questionnaire goes out on the chosen date.'
        de: 'Lieferant gespeichert: Der Fragebogen wird zum gewählten Datum versendet.'
      redirect: suppliers
    roles:
    - user
    - admin
  - key: suppliers
    type: table
    title:
      it: Fornitori
      en: Suppliers
      de: Lieferanten
    source: collection:suppliers
    columns:
    - name
    - contact_name
    - contact_email
    - category
    - spend_eur
    - send_on
    - status
    export: true
    roles:
    - user
    - admin
  - key: questionnaire
    type: form
    title:
      it: Questionario emissioni
      en: Emissions questionnaire
      de: Emissionsfragebogen
    collection: supplier_data
    submit:
      label:
        it: Invia
        en: Submit
        de: Senden
      message:
        it: Grazie, dati ricevuti.
        en: Thank you, data received.
        de: Danke, Daten erhalten.
      redirect: my_results
    roles:
    - supplier
  - key: my_results
    type: table
    title:
      it: I miei dati inviati
      en: My submissions
      de: Meine Einreichungen
    source: collection:supplier_data
    columns:
    - year
    - electricity_kwh
    - gas_m3
    - certifications
    roles:
    - supplier
  - key: review
    type: form
    title:
      it: Revisione fornitore
      en: Supplier review
      de: Lieferantenprüfung
    collection: results
    fields:
    - status
    - review_note
    edit: true
    submit:
      label:
        it: Salva decisione
        en: Save decision
        de: Entscheidung speichern
      redirect: results
    nav: false
    roles:
    - user
    - admin
  - key: results
    type: table
    title:
      it: Revisione e risultati
      en: Review and results
      de: Prüfung und Ergebnisse
    source: collection:results
    columns:
    - supplier_name
    - category
    - year
    - scope1_tco2e
    - scope2_tco2e
    - scope3_tco2e
    - total_tco2e
    - plausibility
    - anomalies
    - status
    export: true
    roles:
    - user
    - admin
  - key: dashboard
    type: page
    title: Dashboard
    roles:
    - user
    - admin
    sections:
    - type: data
      title:
        it: Totali approvati
        en: Approved totals
        de: Freigegebene Summen
      source: collection:results
      display: kpi
      filters:
      - field: status
        op: '='
        value: approved
      kpis:
      - label: Scope 1
        agg: sum
        field: scope1_tco2e
        format: number
      - label: Scope 2
        agg: sum
        field: scope2_tco2e
        format: number
      - label: Scope 3
        agg: sum
        field: scope3_tco2e
        format: number
      - label: tCO2e
        agg: sum
        field: total_tco2e
        format: number
      - label:
          it: Fornitori
          en: Suppliers
          de: Lieferanten
        agg: count
    - type: data
      title:
        it: Per fornitore
        en: By supplier
        de: Nach Lieferant
      source: collection:results
      display: chart
      chart: bar
      filters:
      - field: status
        op: '='
        value: approved
      fields:
      - key: supplier_name
      - key: total_tco2e
        label: tCO2e
      sort:
        field: total_tco2e
        dir: desc
      limit: 30
    - type: data
      title:
        it: Per categoria
        en: By category
        de: Nach Kategorie
      source: collection:results
      display: chart
      chart: pie
      filters:
      - field: status
        op: '='
        value: approved
      groupBy:
        field: category
        aggs:
        - key: total
          agg: sum
          field: total_tco2e
      fields:
      - key: category
      - key: total
        label: tCO2e
    - type: data
      title:
        it: Da rivedere
        en: To review
        de: Zu prüfen
      source: collection:results
      display: table
      filters:
      - field: status
        op: '='
        value: pending
      fields:
      - key: supplier_name
      - key: total_tco2e
        format: number
      - key: plausibility
        format: badge
      - key: anomalies
      empty:
        it: Nessun fornitore in attesa.
        en: No supplier waiting.
        de: Kein Lieferant wartet.
  - key: new_report
    type: new_run
    title:
      it: Genera report
      en: Generate report
      de: Bericht erstellen
    roles:
    - user
    - admin
  - key: reports
    type: history
    title:
      it: I miei report
      en: My reports
      de: Meine Berichte
    source: run
    roles:
    - user
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: account
    type: account
    title:
      it: Abbonamento e licenza
      en: Plan and licence
      de: Abo und Lizenz
    roles:
    - user
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: s50
      price: 490
      interval: year
      label:
        it: Fino a 50 fornitori
        en: Up to 50 suppliers
        de: Bis zu 50 Lieferanten
      roles:
      - user
    - key: s200
      price: 1290
      interval: year
      label:
        it: Fino a 200 fornitori
        en: Up to 200 suppliers
        de: Bis zu 200 Lieferanten
      roles:
      - user
    - key: s500
      price: 2490
      interval: year
      label:
        it: Fornitori illimitati
        en: Unlimited suppliers
        de: Unbegrenzte Lieferanten
      roles:
      - user
  notifications:
    emailOnRunDone: true
  extensions:
  - key: inbound_email_replies
    description: Reading supplier replies that arrive by email and turning them into questionnaire records is not available
      yet; suppliers answer through the form linked in the email, and the reminder after one week goes to those who have not
      answered.
  - key: factor_loading
    description: The emission_factors collection (ISPRA, DEFRA with source, year, unit and kgCO2e factor) must be loaded by
      the app admins; the agent never invents factors.
  - key: review_permissions
    description: Results are owned by the supplier whose submission triggered the analysis and shared with the company by
      company_email; a supplier could in principle edit the review status of their own result. A stricter split of write rights
      per field is not expressible yet.
  - key: commercial_licence_scope
    description: The commercial database key is read from the user running the analysis; with supplier-triggered runs it applies
      only if the key is available to that run (an org-level key may be needed).
