apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: redazione-multilingua
  displayName: Redazione Multilingua
  tagline:
    it: Contenuti SEO nel tono del tuo brand, in più lingue.
    en: SEO content in your brand's voice, in many languages.
  description:
    it: 'Per agenzie e uffici marketing: un agente analizza i risultati di ricerca, propone la scaletta, scrive testo, titolo
      SEO e meta description e li adatta alle lingue di destinazione.'
    en: 'For agencies and marketing teams: an agent analyses search results, proposes an outline, writes the text, SEO title
      and meta description and adapts them to the target languages.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f2a44'
      accent: '#e4572e'
      background: '#fbfaf7'
      foreground: '#1c1f26'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Redazione
      color: primary
    - text: Multilingua
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: editor
      label:
        it: Redattore
        en: Editor
      assignedBy: invite
  limits:
  - action: agent:writer
    per: user
    max: 30
    window: day
  egress:
    hosts:
    - serpapi.com
    notes: Paid SERP API (SerpApi) used under the owner's own subscription instead of scraping Google. Results are used only
      for analysis, not republished.
  agents:
  - key: writer
    role: main
    description: Researches the SERP, outlines, writes and translates the content.
    profile:
      inline:
        display_name: Redazione Multilingua writer
        crews:
        - id: writer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 14
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are a senior multilingual SEO editor. You receive a brand profile (tone of voice, audience,
            words to avoid, approved sample texts) and a brief. Steps: 1) call serp_search with query q=<main keyword>, engine=google,
            hl and gl matching the primary language, num=10; from the top organic results, related questions and related searches
            extract frequent questions and subtopics. Never invent SERP data; if the tool fails, say so and work from your
            own knowledge, flagging it. 2) Propose an outline. 3) Write the content in the first target language: respect
            the requested type and length, the brand voice and the CTA, and never use the banned words. 4) Give an SEO title
            (max 60 characters) and a meta description (max 155 characters). 5) Adapt (do not translate literally) everything
            to each other target language, with localized title and meta description. Output format: a level-1 title ''# <content
            title>'', then sections ''## Ricerca SERP'' (questions and subtopics, short), ''## Scaletta'', then for each language
            ''## <LANGUAGE CODE>'' containing ''### Titolo SEO'', ''### Meta description'', ''### Testo''. End with ''## Parole''
            stating the total word count of all generated texts. Do not make unverifiable claims or invent statistics. Do
            not publish anything: publishing happens only after human approval.'
    goalTemplate: 'Brand: {brand_name}

      Tone of voice: {brand_tone}

      Audience: {brand_audience}

      Words to avoid: {brand_avoid}

      Approved examples:

      {brand_examples}

      Content type: {content_type_label}

      Main keyword: {keyword}

      Length: about {length} words per language

      {?cta}Call to action: {cta}{/cta}

      Languages (first = primary): {languages}

      Today is {date}. Interface language: {lang}.'
    context:
    - key: brand_name
      from: collection:brands.name
    - key: brand_tone
      from: collection:brands.tone
    - key: brand_audience
      from: collection:brands.audience
    - key: brand_avoid
      from: collection:brands.avoid_words
    - key: brand_examples
      from: collection:brands.examples
    appTools:
    - name: serp_search
      description: 'Google results via a paid SERP API. Query params: q (keyword), engine=google, hl (language), gl (country),
        num. Returns organic_results, related_questions, related_searches.'
      action: http
      http:
        method: GET
        url: https://serpapi.com/search.json
        attribution: SerpApi
    output: markdown
    writesTo:
      collection: contents
      parse: whole
    limits:
      maxTurns: 14
      maxBudgetUsd: 1.0
  - key: reviser
    role: helper
    description: Edits the generated content on the editor's requests in chat.
    profile:
      inline:
        display_name: Redazione Multilingua reviser
        chat_mode: true
        crews:
        - id: reviser
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You revise multilingual marketing content on the editor's request. Keep the brand tone, the banned
            words list and the SEO limits (title 60, meta 155 characters). Reply with the full revised text of the language(s)
            affected, starting with a level-1 title. Keep other languages consistent with the change. Never invent figures.
    goalTemplate: 'Conversation so far:

      {history}


      New request: {message}

      Answer in language {lang}.'
  inputForm:
    title:
      it: Nuovo brief
      en: New brief
    fields:
    - name: brand
      type: relation
      relation: brands
      required: true
      label: Brand
    - name: content_type
      type: select
      required: true
      label:
        it: Tipo di contenuto
        en: Content type
      options:
      - value: blog
        label:
          it: Articolo blog
          en: Blog article
      - value: product
        label:
          it: Scheda prodotto
          en: Product page
      - value: newsletter
        label: Newsletter
      - value: social
        label:
          it: Post social
          en: Social post
    - name: keyword
      type: text
      required: true
      maxLength: 120
      label:
        it: Parola chiave principale
        en: Main keyword
    - name: length
      type: number
      required: true
      default: 800
      label:
        it: Lunghezza (parole)
        en: Length (words)
    - name: cta
      type: text
      maxLength: 200
      label:
        it: Call to action
        en: Call to action
    - name: languages
      type: text
      required: true
      label:
        it: Lingue (codici, la prima è la principale)
        en: Languages (codes, first is primary)
      help: es. it, en, de
  data:
    collections:
    - name: brands
      ownedBy: user
      sharing:
      - viewer
      - editor
      description: Brand profiles created by the admin; members are invited per brand
      fields:
      - name: name
        type: text
        required: true
        label: Brand
      - name: tone
        type: textarea
        label:
          it: Tono di voce
          en: Tone of voice
      - name: audience
        type: textarea
        label:
          it: Pubblico
          en: Audience
      - name: avoid_words
        type: textarea
        label:
          it: Parole da evitare
          en: Words to avoid
      - name: examples
        type: textarea
        label:
          it: Esempi di testi approvati
          en: Approved sample texts
      - name: languages
        type: text
        label:
          it: Lingue di destinazione
          en: Target languages
      - name: cms_url
        type: url
        label:
          it: URL API del CMS
          en: CMS API URL
    - name: contents
      ownedBy: user
      parent: brands
      sharing:
      - viewer
      - editor
      searchable: true
      description: Per-brand archive of generated contents, visible only to enabled members
      fields:
      - name: title
        type: text
      - name: keyword
        type: text
      - name: status
        type: select
        options:
        - draft
        - approved
      - name: body
        type: textarea
  views:
  - key: home
    type: page
    nav: false
    sections:
    - type: hero
      title:
        it: Contenuti **SEO** nel tono del tuo brand, in tutte le lingue.
        en: '**SEO** content in your brand''s voice, in every language.'
      text:
        it: 'Ricerca sui risultati di Google, scaletta, testo, titolo SEO, meta description e adattamento alle lingue: in
          un solo brief.'
        en: 'SERP research, outline, text, SEO title, meta description and localization: from one brief.'
      actions:
      - label:
          it: Inizia
          en: Start
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Configura il brand
          en: Set up the brand
        text:
          it: L'admin inserisce tono, pubblico, parole vietate ed esempi approvati.
          en: The admin enters tone, audience, banned words and approved samples.
      - title:
          it: Compila il brief
          en: Fill in the brief
        text:
          it: Parola chiave, tipo di contenuto, lunghezza, CTA e lingue.
          en: Keyword, content type, length, CTA and languages.
      - title:
          it: Rivedi e approva
          en: Review and approve
        text:
          it: Anteprima, modifiche in chat, approvazione.
          en: Preview, chat edits, approval.
    - type: note
      content:
        it: I dati SERP arrivano da un'API a pagamento, non da scraping. Rivedi sempre i testi prima di pubblicarli.
        en: SERP data comes from a paid API, not scraping. Always review texts before publishing.
  - key: brands
    type: table
    title: Brand
    source: collection:brands
    columns:
    - name
    - languages
    - tone
    roles:
    - admin
  - key: new
    type: new_run
    title:
      it: Nuovo brief
      en: New brief
    roles:
    - editor
    - admin
  - key: preview
    type: report
    title:
      it: Anteprima
      en: Preview
    source: run
    printable: true
    nav: false
  - key: revise
    type: chat
    title:
      it: Modifiche
      en: Edits
    source: agent:reviser
    placeholder:
      it: Chiedi una modifica al testo…
      en: Ask for an edit…
    examples:
    - it: Rendi il tono più formale
      en: Make the tone more formal
    - it: Accorcia l'introduzione
      en: Shorten the intro
    roles:
    - editor
    - admin
  - key: archive
    type: table
    title:
      it: Archivio
      en: Archive
    source: collection:contents
    columns:
    - title
    - keyword
    - status
    roles:
    - editor
    - admin
  - key: history
    type: history
    title:
      it: Le mie generazioni
      en: My runs
    source: run
    roles:
    - editor
    - admin
  - key: account
    type: account
    title:
      it: Crediti e piani
      en: Credits and plans
    roles:
    - editor
    - admin
  billing:
    modes:
    - credits
    - subscription
    currency: eur
    signupCredits: 50
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:writer:
        estimate: 40
        metered: true
      agent:reviser:
        estimate: 5
        metered: true
    packs:
    - key: small
      credits: 1000
      price: 12
      label: 1.000 crediti
    plans:
    - key: team
      price: 49
      interval: month
      label: Team
      credits: 6000
      creditsReset: monthly
    - key: agency
      price: 149
      interval: month
      label: Agency
      credits: 20000
      creditsReset: monthly
  extensions:
  - key: serp_api_key
    description: 'The paid SERP API key cannot be placed in the manifest: the owner must configure it as a platform credential
      for the serp_search tool.'
  - key: cms_publish
    description: 'Automatic draft publishing to the client''s CMS (WordPress REST or other) after approval, with credentials
      saved by the admin, is not available yet: per-customer credentials are not supported. For now the approved text is copied
      from the archive; brands only store the CMS API URL.'
  - key: approval_flow
    description: Explicit approve action and status change draft->approved on contents is not yet expressible; approval is
      currently implicit by saving in the archive.
