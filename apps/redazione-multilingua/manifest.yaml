apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: redazione-multilingua
  displayName: Redazione Multilingua
  tagline:
    it: Contenuti SEO in più lingue, nel tono di ogni brand, fino alla bozza sul tuo CMS.
    en: SEO content in several languages, in each brand's voice, down to a draft on your CMS.
  description:
    it: 'Per agenzie e uffici marketing: brief, ricerca SERP, scaletta, testo, titolo SEO, meta description e traduzioni adattate.
      Anteprima, modifiche in chat, approvazione e pubblicazione come bozza sul CMS del cliente.'
    en: 'For agencies and marketing teams: brief, SERP research, outline, copy, SEO title, meta description and adapted translations.
      Preview, chat edits, approval and publishing as a draft on the client''s CMS.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f2a44'
      accent: '#e0603a'
      background: '#fbf9f6'
      foreground: '#1b1f24'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Redazione
      color: primary
    - text: Multilingua
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  egress:
    hosts:
    - google.serper.dev
    - '*.wordpress.com'
    notes: 'google.serper.dev: paid SERP API (Serper) with a key set by the app admins, no scraping of Google. *.wordpress.com:
      the client''s WordPress REST API (drafts only). Self-hosted WordPress or other CMS on custom domains need their host
      added.'
  notifications:
    emailOnRunDone: true
  limits:
  - action: run
    per: user
    max: 30
    window: day
    roles:
    - user
  slots:
  - key: brief_values
    description: Total words to generate from length and number of languages
    timeoutMs: 2000
    example:
      values:
        words: 800
        langs:
        - it
        - en
      lang: it
    code: "def main(input):\n    v = input.get('values') or {}\n    try:\n        w = int(v.get('words') or 600)\n    except\
      \ Exception:\n        w = 600\n    langs = v.get('langs') or []\n    n = len(langs) if isinstance(langs, list) and langs\
      \ else 1\n    return {'total_words': w * n}\n"
  agents:
  - key: writer
    role: main
    description: Researches the SERP, outlines, writes, adds SEO title and meta, translates and adapts; then asks for approval.
    profile:
      inline:
        display_name: Redazione writer
        crews:
        - id: writer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are a senior multilingual content editor for agencies. Steps: 1) Call serp_search once with
            a POST JSON body {"q":"<main keyword>","gl":"<country code>","hl":"<language code>","num":10} for the main language.
            The response has organic results (title, snippet, link), peopleAlsoAsk (question, snippet) and relatedSearches.
            2) From the first results derive frequent questions and sub-topics and what competitors cover. 3) Propose an outline.
            4) Write the text in the brand''s voice: respect tone, audience, words to avoid, and imitate the approved examples
            without copying. Respect the requested length for each language and the call to action. 5) Write an SEO title
            (max 60 characters) and a meta description (max 155 characters). 6) Translate into each other requested language
            ADAPTING it culturally (idioms, units, search intent), with its own SEO title and meta. 7) For every language
            call save_content with fields brand, lang, content_type, keyword, title, seo_title, meta_description, body, status
            "pending", and members copied from the brand. 8) Call request_approve_content so the editor can approve. Never
            invent statistics or quotes; cite only what the SERP data supports. Final report in Markdown: first line "# <title
            of the main text>", then ## Outline, ## Frequent questions found, then one section per language with SEO title,
            meta description and text. Say plainly if the SERP tool failed.'
          mcp_servers: []
    appTools:
    - name: serp_search
      description: 'Search Google results via a paid SERP API (body: q, gl, hl, num)'
      action: http
      http:
        method: POST
        url: https://google.serper.dev/search
        attribution: Serper SERP API
        credential:
          provider: serp
          header: X-API-KEY
          format: '{secret}'
    - name: save_content
      description: Save a generated content in the brand archive
      action: write
      collection: contents
      scope: user
    awaits:
    - approve_content
    context:
    - key: tone
      from: collection:brands.tone
    - key: audience
      from: collection:brands.audience
    - key: avoid
      from: collection:brands.avoid_words
    - key: examples
      from: collection:brands.approved_examples
    - key: brand_members
      from: collection:brands.members
    - key: total
      from: slot:brief_values
    goalTemplate: 'Brand: {brand}

      Tone of voice: {tone}

      Audience: {audience}

      Words to avoid: {avoid}

      Approved examples: {examples}

      Brand team members (copy into members): {brand_members}

      Content type: {content_type_label}

      Main keyword: {keyword}

      Length per language: {words} words

      {?cta}Call to action: {cta}{/cta}

      Languages (first is the main one): {langs}

      Write the report in the language with ISO code {lang}.'
    output: markdown
    limits:
      maxTurns: 25
      maxBudgetUsd: 1.5
  - key: reviser
    role: helper
    description: 'Chat: edits the pending content on request.'
    profile:
      inline:
        display_name: Redazione reviser
        chat_mode: true
        crews:
        - id: reviser
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You revise contents for the editor. Use read_content to load the user's contents with status pending,
            apply exactly the requested change (tone, length, wording, CTA, one language or all), keep SEO title <=60 and
            meta description <=155 characters, and save with save_content. Reply briefly with what changed and show the new
            text. Never invent facts.
    appTools:
    - name: read_content
      description: Read the user's contents
      action: read
      collection: contents
      scope: user
    - name: save_content
      description: Save a generated content in the brand archive
      action: write
      collection: contents
      scope: user
    goalTemplate: 'Conversation so far:

      {history}

      New message: {message}

      Answer in the language with ISO code {lang}.'
    output: markdown
  - key: publisher
    role: helper
    description: After approval, publishes each language as a draft on the client's CMS.
    profile:
      inline:
        display_name: Redazione publisher
        crews:
        - id: publisher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You publish approved contents as DRAFTS only, never as published. Use read_content to load the user's
            contents with status pending. For each, call cms_post with a JSON body {"title":<title>,"content":<body as HTML>,"status":"draft","excerpt":<meta_description>}
            (WordPress REST API /wp-json/wp/v2/posts). If the tool says the CMS is not connected, stop and tell the user to
            connect it on the account page. On success save_content the same record with status "published_draft" and the
            CMS link; on failure set status "publish_failed" with the error. Final report in Markdown starting with "# Pubblicazione
            bozze" listing each language and result.
    appTools:
    - name: read_content
      description: Read the user's contents
      action: read
      collection: contents
      scope: user
    - name: save_content
      description: Save a generated content in the brand archive
      action: write
      collection: contents
      scope: user
    - name: cms_post
      description: Create a draft post on the client's CMS (WordPress REST API)
      action: http
      http:
        method: POST
        url: https://{host}/wp-json/wp/v2/posts
        credential:
          provider: cms
          header: Authorization
          format: Basic {secret}
    goalTemplate: 'Publish the approved contents as drafts. Event: {event}. Report in the language with ISO code {lang}.'
    output: markdown
  triggers:
  - key: publish_after_approval
    'on':
      approval: approve_content
      decision: approved
    start:
      agent: publisher
    goal: 'The editor approved the contents. Publish all pending contents as CMS drafts. Event: {event}'
    asUser: true
  approvals:
  - key: approve_content
    title:
      it: Approva e pubblica come bozza
      en: Approve and publish as draft
    description: The editor approves the generated content; it is then published as a draft on the client's CMS.
    decidedBy: requester
    timeoutMinutes: 10080
    onTimeout: reject
  inputForm:
    title:
      it: Nuovo brief
      en: New brief
    fields:
    - name: brand
      type: select
      required: true
      optionsFrom: collection:brands
      label: Brand
    - name: content_type
      type: select
      required: true
      label:
        it: Tipo di contenuto
        en: Content type
      options:
      - value: blog
        label:
          it: Articolo blog
          en: Blog article
      - value: product
        label:
          it: Scheda prodotto
          en: Product page
      - value: newsletter
        label: Newsletter
      - value: social
        label:
          it: Post social
          en: Social post
    - name: keyword
      type: text
      required: true
      maxLength: 120
      label:
        it: Parola chiave principale
        en: Main keyword
    - name: words
      type: number
      required: true
      default: 800
      label:
        it: Lunghezza (parole per lingua)
        en: Length (words per language)
    - name: cta
      type: text
      maxLength: 200
      label:
        it: Call to action
        en: Call to action
    - name: langs
      type: multiselect
      required: true
      label:
        it: Lingue
        en: Languages
      options:
      - value: it
        label: Italiano
      - value: en
        label: English
      - value: fr
        label: Français
      - value: de
        label: Deutsch
      - value: es
        label: Español
  data:
    collections:
    - name: brands
      ownedBy: user
      description: Brands with voice guidelines; members are the emails of the team allowed to use them
      fields:
      - name: name
        type: text
        required: true
        label: Brand
      - name: tone
        type: textarea
        required: true
        label:
          it: Tono di voce
          en: Tone of voice
      - name: audience
        type: textarea
        label:
          it: Pubblico
          en: Audience
      - name: avoid_words
        type: textarea
        label:
          it: Parole da evitare
          en: Words to avoid
      - name: approved_examples
        type: textarea
        label:
          it: Esempi di testi approvati
          en: Approved text examples
      - name: target_langs
        type: multiselect
        label:
          it: Lingue di destinazione
          en: Target languages
        options:
        - it
        - en
        - fr
        - de
        - es
      - name: members
        type: array
        label:
          it: Email dei membri abilitati
          en: Enabled members' emails
      access:
      - role: user
        where:
          members: '{user.email}'
        can:
        - read
    - name: contents
      ownedBy: user
      description: Archive of generated contents per brand, visible to the brand's enabled members
      fields:
      - name: brand
        type: text
      - name: lang
        type: text
      - name: content_type
        type: text
      - name: keyword
        type: text
      - name: title
        type: text
      - name: seo_title
        type: text
      - name: meta_description
        type: textarea
      - name: body
        type: textarea
      - name: status
        type: select
        options:
        - pending
        - published_draft
        - publish_failed
      - name: cms_link
        type: url
      - name: members
        type: array
      access:
      - role: user
        where:
          members: '{user.email}'
        can:
        - read
    credentials:
    - provider: serp
      kind: api_key
      scope: org
      label: SERP API key
      help:
        it: Chiave del servizio SERP a pagamento (es. Serper), impostata dagli admin dell'app.
        en: Key of the paid SERP service (e.g. Serper), set by the app admins.
    - provider: cms
      kind: api_key
      scope: user
      label:
        it: Accesso al CMS
        en: CMS access
      help:
        it: 'WordPress: Utenti > Password applicazione; incolla utente:password codificato in base64.'
        en: 'WordPress: Users > Application passwords; paste user:password encoded in base64.'
      hostLabel:
        it: il-tuo-sito.wordpress.com
        en: your-site.wordpress.com
  views:
  - key: home
    type: page
    nav: false
    title: Redazione Multilingua
    sections:
    - type: hero
      title:
        it: Contenuti **multilingua** nel tono di ogni brand.
        en: '**Multilingual** content in every brand''s voice.'
      text:
        it: 'Dal brief alla bozza sul tuo CMS: ricerca SERP, scaletta, testo, SEO e traduzioni adattate.'
        en: 'From brief to draft on your CMS: SERP research, outline, copy, SEO and adapted translations.'
      actions:
      - label:
          it: Inizia
          en: Start
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Crea i brand
          en: Create brands
        text:
          it: Tono, pubblico, parole da evitare, esempi e team abilitato.
          en: Tone, audience, words to avoid, examples and enabled team.
        badge: 🏷️
      - title:
          it: Compila il brief
          en: Fill the brief
        text:
          it: L'agente analizza i risultati di ricerca e scrive in tutte le lingue.
          en: The agent analyses search results and writes in every language.
        badge: 📝
      - title:
          it: Rivedi e approva
          en: Review and approve
        text:
          it: Modifiche in chat, poi bozza automatica sul CMS.
          en: Chat edits, then an automatic draft on the CMS.
        badge: ✅
    - type: note
      content:
        it: I testi generati vanno verificati dal redattore prima della pubblicazione.
        en: Generated texts must be checked by the editor before publishing.
  - key: brand_new
    type: form
    title:
      it: Nuovo brand
      en: New brand
    collection: brands
    submit:
      label:
        it: Salva brand
        en: Save brand
      message:
        it: Brand salvato
        en: Brand saved
      redirect: brands
    edit: true
    roles:
    - user
    - admin
  - key: brands
    type: table
    title: Brand
    source: collection:brands
    columns:
    - name
    - tone
    - target_langs
    - members
    roles:
    - user
    - admin
  - key: new
    type: new_run
    title:
      it: Nuovo brief
      en: New brief
    roles:
    - user
    - admin
  - key: runs
    type: history
    title:
      it: Le mie generazioni
      en: My generations
    source: run
    roles:
    - user
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: approvals
    type: approvals
    title:
      it: Approvazioni
      en: Approvals
    roles:
    - user
    - admin
  - key: edit_chat
    type: chat
    title:
      it: Modifiche in chat
      en: Edit in chat
    source: agent:reviser
    examples:
    - it: Rendi il tono più informale
      en: Make the tone more informal
    - it: Accorcia la versione francese
      en: Shorten the French version
    placeholder:
      it: Cosa vuoi cambiare?
      en: What do you want to change?
    roles:
    - user
    - admin
  - key: archive
    type: table
    title:
      it: Archivio
      en: Archive
    source: collection:contents
    columns:
    - brand
    - lang
    - content_type
    - title
    - status
    - cms_link
    export: true
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Crediti e CMS
      en: Credits and CMS
    roles:
    - user
    - admin
  billing:
    modes:
    - credits
    - subscription
    currency: eur
    signupCredits: 50
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:writer:
        perUnit:
          field: words
          credits: 0.1
          min: 10
    packs:
    - key: small
      credits: 1000
      price: 12
      label: Small
    - key: large
      credits: 5000
      price: 50
      label: Large
    plans:
    - key: team
      price: 39
      interval: month
      credits: 4000
      creditsReset: monthly
      label: Team
    - key: agency
      price: 119
      interval: month
      credits: 15000
      creditsReset: monthly
      label: Agency
  extensions:
  - key: cms_shared_credentials
    description: The CMS key is saved per user; a single key saved by the account admin and shared with the whole team is
      not available yet, nor are custom CMS domains outside the listed egress hosts.
  - key: per_word_exact
    description: Credits follow the words per language field of the brief; the exact count of generated words is not metered.
