apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: tariffa-giusta
  displayName: Tariffa Giusta
  tagline:
    it: Il prezzo giusto per ogni camera e ogni notte, ogni mattina.
    en: The right price for every room and night, every morning.
  description:
    it: Un assistente di revenue management che legge i dati interni del tuo PMS, considera eventi e festività che inserisci
      tu e propone i prezzi dei prossimi 365 giorni, spiegando ogni variazione. Tu approvi, poi i prezzi vanno a PMS e channel
      manager.
    en: A revenue management assistant that reads your PMS data, considers events and holidays you enter, and proposes prices
      for the next 365 days, explaining each change. You approve, then prices go to your PMS and channel manager.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: dashboard
  branding:
    theme: light
    palette:
      primary: '#16324f'
      accent: '#d9822b'
      background: '#f7f8fa'
      foreground: '#18222d'
    fonts:
      body: Inter
      display: DM Serif Display
    wordmark:
    - text: Tariffa
      color: primary
    - text: Giusta
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Dati e privacy
        en: Data & privacy
      href: '#dati'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      label:
        it: Hotel
        en: Hotel
      assignedBy: signup
    - key: group
      label:
        it: Gruppo alberghiero
        en: Hotel group
      assignedBy: derived
      from: collection:hotel_profile.group_email
  limits:
  - action: create:room_types
    max: 20
    window: total
    plans:
      hotel_m: 60
      hotel_l: -1
  agents:
  - key: analyst
    role: scheduled
    description: Every morning analyses booking pace, events and holidays from the hotel's own data and proposes prices for
      the next 365 days.
    memory: instance
    awaits:
    - price_approval
    writesTo:
      collection: price_proposals
      parse: json_last
      keyBy: run_date
    output: markdown+json
    resultSchema:
      type: object
      properties:
        run_date:
          type: string
        summary:
          type: string
        group_email:
          type: string
        status:
          type: string
        changes:
          type: array
          items:
            type: object
            properties:
              room_type:
                type: string
              date:
                type: string
              current_price:
                type: number
              proposed_price:
                type: number
              level:
                type: string
              reason:
                type: string
    limits:
      maxTurns: 40
      maxBudgetUsd: 1.5
    context:
    - key: profile
      from: collection:hotel_profile
    - key: rooms
      from: collection:room_types
    - key: events
      from: collection:events
    goalTemplate: 'Today is {date}. Hotel "{instance}". Write in the language with ISO code {lang}.

      Hotel profile: {profile}

      Room types with min/max prices and minimum stay rules: {rooms}

      Events and notes entered by the hotel: {events}

      Read the PMS data (bookings, occupancy, rates, cancellations), compare booking pace for each future date with the same
      date last year, and propose prices for every room type and night over the next 365 days. Propose only nights whose price
      changes. Never go outside min/max. Check for abrupt occupancy changes and record alerts. Then ask for approval.'
    appTools:
    - name: pms_bookings
      description: 'Read reservations and cancellations from the hotel''s PMS (query: from, to, status)'
      action: http
      http:
        method: GET
        url: https://{host}/api/v1/reservations
        attribution: Hotel's own PMS data
        credential:
          provider: pms
          header: Authorization
          format: Bearer {secret}
    - name: pms_occupancy
      description: 'Read daily occupancy per room type from the PMS (query: from, to)'
      action: http
      http:
        method: GET
        url: https://{host}/api/v1/occupancy
        attribution: Hotel's own PMS data
        credential:
          provider: pms
          header: Authorization
          format: Bearer {secret}
    - name: pms_rates
      description: 'Read the current rates per room type and night from the PMS (query: from, to)'
      action: http
      http:
        method: GET
        url: https://{host}/api/v1/rates
        attribution: Hotel's own PMS data
        credential:
          provider: pms
          header: Authorization
          format: Bearer {secret}
    - name: write_alert
      description: Record an alert about an abrupt change of occupancy for a date
      action: write
      collection: alerts
      scope: user
    - name: read_alerts
      description: Read the alerts already recorded
      action: read
      collection: alerts
      scope: user
    profile:
      inline:
        display_name: Tariffa Giusta analyst
        crews:
        - id: analyst
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are a hotel revenue management analyst. You use ONLY the hotel''s internal data (PMS tools)
            and the events, holidays and rules the hotel entered by hand. Never look up or use competitor or OTA prices: this
            is forbidden. Never invent figures; if the PMS is not connected or a tool returns no data, say so and stop without
            proposing prices.

            Method: for each future date compare booking pace (reservations on the books, pickup, cancellations) with the
            same date last year; weigh the holiday calendar and the events entered; consider minimum stay rules. Propose a
            price per room type per night for the next 365 days, only where it differs from the current rate, always within
            the room type''s min and max. Every change has a short reason (e.g. ''pace +18% vs last year, local fair''). Group
            consecutive nights with the same change in your narrative, but list each night in the JSON.

            Alerts: if occupancy of a date moved abruptly (e.g. more than 15 points in a day or a burst of cancellations),
            call write_alert with fields date, message, severity (info|warning|critical), occupancy_now, occupancy_before,
            group_email (copy from the hotel profile). Do not repeat alerts already recorded (check read_alerts).

            Output: Markdown report starting with a level-1 title ''# <Hotel> — proposta tariffe <date>'', then ## Sintesi,
            ## Date chiave (table), ## Alert, ## Prossimi passi. Add a ```chart block (bar) of proposed average price by month
            versus current when numbers exist. At the end give ONE fenced json block: {run_date (today, YYYY-MM-DD), summary
            (3 sentences), group_email (from profile, else empty), status:''proposed'', changes:[{room_type,date,current_price,proposed_price,level
            (low|medium|high),reason}]}. Then call request_price_approval once. At the end call remember with 5 key points
            (they replace the old ones). Prices are proposals: you never send anything to the PMS.'
  - key: publisher
    role: helper
    description: After approval, sends the approved prices to the PMS and the channel manager.
    limits:
      maxTurns: 30
      maxBudgetUsd: 1.0
    goalTemplate: 'The hotel approved the price proposal. Event: {event}. Read the approved proposal with read_proposals (latest
      with status approved or edited), send exactly those prices to the PMS and to the channel manager, and report what was
      sent and any error.'
    appTools:
    - name: read_proposals
      description: Read the hotel's price proposals
      action: read
      collection: price_proposals
      scope: user
    - name: pms_push_rates
      description: Send approved rates to the hotel's PMS (JSON body with room_type, date, price)
      action: http
      http:
        method: POST
        url: https://{host}/api/v1/rates
        attribution: Hotel's own PMS
        credential:
          provider: pms
          header: Authorization
          format: Bearer {secret}
    - name: cm_push_rates
      description: Send approved rates to the hotel's channel manager (JSON body with room_type, date, price)
      action: http
      http:
        method: POST
        url: https://{host}/api/v1/rates
        attribution: Hotel's own channel manager
        credential:
          provider: channel_manager
          header: Authorization
          format: Bearer {secret}
    profile:
      inline:
        display_name: Tariffa Giusta publisher
        crews:
        - id: publisher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You publish approved hotel prices. Send ONLY the prices of the approved proposal, unchanged, in
            batches, first to the PMS (pms_push_rates), then to the channel manager (cm_push_rates). If a credential is missing
            or a call fails, stop that destination and say clearly what was not sent. Never invent or adjust prices. Start
            with a level-1 title ''# Invio tariffe <date>'', then sections ## Inviato al PMS, ## Inviato al channel manager,
            ## Errori.'
  templates:
  - key: hotel_watch
    title:
      it: La mia struttura
      en: My property
    description:
      it: Analisi quotidiana dei prezzi per i prossimi 365 giorni.
      en: Daily price analysis for the next 365 days.
    agent: analyst
    params:
    - name: property
      type: text
      required: true
      label:
        it: Nome della struttura
        en: Property name
    goal: Hotel "{instance}". Today is {date}. Write in the language with ISO code {lang}.
    schedule:
      cron: 0 5 * * *
      userCanChange: false
    maxPerUser: 3
  approvals:
  - key: price_approval
    title:
      it: Approva le tariffe proposte
      en: Approve proposed rates
    decidedBy: requester
    fields:
    - summary
    timeoutMinutes: 4320
    onTimeout: reject
  triggers:
  - key: publish_on_approval
    'on':
      approval: price_approval
      decision: approved
    start:
      agent: publisher
    goal: 'Approved proposal. Event: {event}'
  - key: occupancy_alert_mail
    'on':
      collection: alerts
      op: insert
    notify:
      to: owner
      subject:
        it: 'Alert occupazione: {record.date}'
        en: 'Occupancy alert: {record.date}'
      body:
        it: '{record.message}

          Occupazione ora: {record.occupancy_now}%, prima: {record.occupancy_before}%.'
        en: '{record.message}

          Occupancy now: {record.occupancy_now}%, before: {record.occupancy_before}%.'
      link: alerts
  inputForm:
    title:
      it: Nuova analisi
      en: New analysis
    fields: []
  data:
    credentials:
    - provider: pms
      kind: api_key
      scope: user
      label:
        it: Gestionale (PMS)
        en: PMS
      help:
        it: Chiave API dalle impostazioni integrazioni del tuo PMS (accesso a prenotazioni, tariffe, occupazione).
        en: API key from your PMS integration settings.
      hostLabel:
        it: indirizzo API del tuo PMS
        en: your PMS API address
    - provider: channel_manager
      kind: api_key
      scope: user
      label:
        it: Channel manager
        en: Channel manager
      help:
        it: Chiave API del tuo channel manager (permesso di scrittura tariffe).
        en: API key of your channel manager (rate write permission).
      hostLabel:
        it: indirizzo API del channel manager
        en: your channel manager API address
    collections:
    - name: hotel_profile
      ownedBy: user
      description: The property's profile
      access:
      - role: group
        where:
          group_email: '{user.email}'
        can:
        - read
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome struttura
          en: Property name
      - name: city
        type: city
        label:
          it: Città
          en: City
      - name: total_rooms
        type: number
        required: true
        label:
          it: Numero camere
          en: Number of rooms
      - name: currency
        type: select
        options:
        - EUR
        - GBP
        - CHF
        default: EUR
        label:
          it: Valuta
          en: Currency
      - name: group_email
        type: email
        label:
          it: Email del gruppo (facoltativa)
          en: Group email (optional)
        help:
          it: Se la struttura appartiene a un gruppo, l'email di chi deve vedere tutte le strutture.
          en: If the property belongs to a group, the email of the person who sees all properties.
    - name: room_types
      ownedBy: user
      description: Room types, price limits and stay rules
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Tipologia
          en: Room type
      - name: rooms
        type: number
        required: true
        label:
          it: Camere
          en: Rooms
      - name: base_price
        type: number
        label:
          it: Prezzo base
          en: Base price
      - name: min_price
        type: number
        required: true
        label:
          it: Prezzo minimo
          en: Minimum price
      - name: max_price
        type: number
        required: true
        label:
          it: Prezzo massimo
          en: Maximum price
      - name: min_stay
        type: number
        default: 1
        label:
          it: Soggiorno minimo (notti)
          en: Minimum stay (nights)
      - name: min_stay_notes
        type: textarea
        maxLength: 400
        label:
          it: Regole di soggiorno (es. weekend 2 notti)
          en: Stay rules (e.g. weekends 2 nights)
    - name: events
      ownedBy: user
      description: City events and notes entered by the hotel
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Evento
          en: Event
      - name: date_from
        type: date
        required: true
        label:
          it: Dal
          en: From
      - name: date_to
        type: date
        label:
          it: Al
          en: To
      - name: impact
        type: select
        options:
        - value: low
          label:
            it: Basso
            en: Low
        - value: medium
          label:
            it: Medio
            en: Medium
        - value: high
          label:
            it: Alto
            en: High
        label:
          it: Impatto atteso
          en: Expected impact
      - name: notes
        type: textarea
        maxLength: 500
        label:
          it: Note
          en: Notes
    - name: price_proposals
      ownedBy: instance
      description: Daily price proposals with reasons
      access:
      - role: group
        where:
          group_email: '{user.email}'
        can:
        - read
      fields:
      - name: run_date
        type: date
        label:
          it: Data analisi
          en: Analysis date
      - name: summary
        type: textarea
        label:
          it: Sintesi
          en: Summary
      - name: status
        type: select
        options:
        - proposed
        - approved
        - edited
        - sent
        - rejected
        label:
          it: Stato
          en: Status
      - name: changes
        type: json
        label:
          it: Variazioni per camera e notte
          en: Changes per room and night
      - name: group_email
        type: email
    - name: alerts
      ownedBy: instance
      description: Occupancy alerts
      retentionDays: 365
      access:
      - role: group
        where:
          group_email: '{user.email}'
        can:
        - read
      fields:
      - name: date
        type: date
        label:
          it: Data
          en: Date
      - name: message
        type: textarea
        label:
          it: Messaggio
          en: Message
      - name: severity
        type: select
        options:
        - info
        - warning
        - critical
        label:
          it: Gravità
          en: Severity
      - name: occupancy_now
        type: number
      - name: occupancy_before
        type: number
      - name: group_email
        type: email
  egress:
    hosts:
    - '*.pms-partner.eu'
    - '*.channel-partner.eu'
    notes: 'Placeholder hosts: each hotel''s own PMS and channel manager API, reached with the hotel''s own API key. Replace
      with the real vendor hosts. No OTA or competitor sites are called.'
  views:
  - key: home
    type: page
    nav: false
    sections:
    - type: hero
      title:
        it: Il **prezzo giusto** per ogni camera, ogni notte
        en: The **right price** for every room, every night
      text:
        it: Ogni mattina l'agente legge i dati del tuo PMS, li confronta con l'anno scorso, considera festività ed eventi
          che conosci tu, e propone le tariffe dei prossimi 365 giorni spiegando ogni variazione.
        en: Every morning the agent reads your PMS data, compares it with last year, weighs holidays and events you know,
          and proposes rates for the next 365 days, explaining each change.
      actions:
      - label:
          it: Inizia
          en: Get started
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: 1 · Collega e configura
          en: 1 · Connect and set up
        text:
          it: Inserisci la chiave del PMS, le tipologie di camera, prezzi minimi e massimi, soggiorni minimi ed eventi.
          en: Add your PMS key, room types, min/max prices, minimum stays and events.
      - title:
          it: 2 · Proposte quotidiane
          en: 2 · Daily proposals
        text:
          it: 'Ritmo delle prenotazioni vs anno precedente, calendario e eventi: un prezzo per camera e notte, con il motivo.'
          en: 'Booking pace vs last year, calendar and events: one price per room and night, with the reason.'
      - title:
          it: 3 · Approva e invia
          en: 3 · Approve and publish
        text:
          it: Approvi o modifichi; solo dopo i prezzi vanno a PMS e channel manager. Alert se l'occupazione cambia bruscamente.
          en: You approve or edit; only then prices go to PMS and channel manager. Alert on abrupt occupancy changes.
    - type: cards
      id: dati
      title:
        it: Dati e privacy
        en: Data & privacy
      items:
      - title:
          it: Solo dati tuoi
          en: Only your data
        text:
          it: 'Nessun confronto con i concorrenti né con le OTA: solo dati interni e informazioni inserite da te.'
          en: 'No competitor or OTA comparison: only internal data and what you enter.'
      - title:
          it: Ogni hotel vede il suo
          en: Each hotel sees its own
        text:
          it: I gruppi vedono tutte le proprie strutture.
          en: Groups see all their properties.
    - type: note
      content:
        it: 'Le tariffe sono proposte: nulla viene inviato senza la tua approvazione.'
        en: 'Rates are proposals: nothing is sent without your approval.'
  - key: hotel
    type: form
    title:
      it: Struttura
      en: Property
    collection: hotel_profile
    edit: true
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Struttura salvata
        en: Property saved
      redirect: rooms
    roles:
    - user
    - admin
  - key: rooms
    type: form
    title:
      it: Camere e regole
      en: Rooms and rules
    collection: room_types
    submit:
      label:
        it: Aggiungi tipologia
        en: Add room type
      message:
        it: Tipologia salvata
        en: Room type saved
      redirect: room_list
    roles:
    - user
    - admin
  - key: room_list
    type: table
    title:
      it: Le mie tipologie
      en: My room types
    source: collection:room_types
    columns:
    - name
    - rooms
    - min_price
    - max_price
    - min_stay
    roles:
    - user
    - admin
  - key: event_new
    type: form
    title:
      it: Nuovo evento
      en: New event
    collection: events
    submit:
      label:
        it: Salva evento
        en: Save event
      message:
        it: Evento salvato
        en: Event saved
      redirect: event_list
    roles:
    - user
    - admin
  - key: event_list
    type: table
    title:
      it: Eventi in città
      en: City events
    source: collection:events
    columns:
    - name
    - date_from
    - date_to
    - impact
    - notes
    roles:
    - user
    - admin
  - key: watches
    type: instances
    template: hotel_watch
    title:
      it: Analisi quotidiana
      en: Daily analysis
    roles:
    - user
    - admin
  - key: proposals
    type: table
    title:
      it: Proposte di prezzo
      en: Price proposals
    source: collection:price_proposals
    columns:
    - run_date
    - status
    - summary
    - changes
    roles:
    - user
    - admin
    - group
    export: true
  - key: approve
    type: approvals
    title:
      it: Approvazioni
      en: Approvals
    approvals:
    - price_approval
    roles:
    - user
    - admin
  - key: alerts
    type: table
    title:
      it: Alert occupazione
      en: Occupancy alerts
    source: collection:alerts
    columns:
    - date
    - severity
    - message
    - occupancy_before
    - occupancy_now
    roles:
    - user
    - admin
    - group
  - key: group_overview
    type: table
    title:
      it: Strutture del gruppo
      en: Group properties
    source: collection:hotel_profile
    columns:
    - name
    - city
    - total_rooms
    roles:
    - group
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento e collegamenti
      en: Plan and connections
    roles:
    - user
    - admin
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: hotel_s
      price: 49
      interval: month
      label:
        it: Fino a 20 camere
        en: Up to 20 rooms
      includes:
      - up to 20 rooms
    - key: hotel_m
      price: 99
      interval: month
      label:
        it: Fino a 60 camere
        en: Up to 60 rooms
      includes:
      - up to 60 rooms
    - key: hotel_l
      price: 199
      interval: month
      label:
        it: Oltre 60 camere
        en: 60+ rooms
      includes:
      - unlimited rooms
  extensions:
  - key: color_calendar
    description: 'Calendario a colori delle proposte (camera × notte, colore per livello di variazione) con approvazione in
      blocco e modifica per cella: non disponibile come vista; per ora tabella delle proposte e approvazione dell''intera
      proposta.'
  - key: per_room_pricing
    description: 'Abbonamento calcolato per numero di camere: approssimato con tre piani a fasce di camere.'
  - key: pms_connectors
    description: 'Connettori specifici per PMS e channel manager (host e formato API reali di ogni fornitore, eventuale OAuth):
      da definire per fornitore.'
  - key: proposal_editing
    description: Modifica cella per cella dei prezzi proposti prima dell'approvazione e stato 'sent' dopo l'invio.
