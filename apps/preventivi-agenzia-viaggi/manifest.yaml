apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: preventivolampo
  displayName: PreventivoLampo
  tagline:
    it: Dalla richiesta del cliente al preventivo pronto da approvare, in pochi minuti.
    en: From the customer's request to a quote ready for approval, in minutes.
  description:
    it: 'Un agente legge le email di richiesta, estrae i dati del viaggio, chiede le informazioni mancanti e compone 2-3 proposte
      usando solo i listini caricati dall''agenzia, con il suo margine. L''operatore corregge e approva: solo allora la risposta
      parte.'
    en: 'An agent reads request emails, extracts the trip details, asks for missing information and builds 2-3 package proposals
      using only the agency''s own uploaded rate lists, with its margin. The operator edits and approves: only then is the
      reply sent.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#0b3c5d'
      accent: '#f28c28'
      background: '#f7fafc'
      foreground: '#14202e'
    fonts:
      body: Inter
      display: Poppins
    wordmark:
    - text: Preventivo
      color: primary
    - text: Lampo
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      label:
        it: Agenzia
        en: Agency
      assignedBy: signup
  limits:
  - action: agent:quoter
    per: user
    max: 200
    window: day
    roles:
    - user
  agents:
  - key: quoter
    role: main
    description: Reads each new request email, extracts the data, asks for missing info or builds 2-3 quotes from the agency's
      own rate lists, and saves a draft for the operator.
    profile:
      inline:
        display_name: PreventivoLampo quoter
        crews:
        - id: quoter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the quoting assistant of a travel agency. For every customer email you receive:

            1. Extract: client name and email, language of the email (it or en), destination, dates, number of adults and
            children (with ages if given), budget, preferences (sea, culture, 4-star hotel, flight included...).

            2. List what is missing among destination, dates, adults/children, budget. If something essential is missing,
            write a polite reply email asking only for those items (draft_type = ''info''), in the customer''s language.

            3. Otherwise search the agency''s rate lists with the tool search_rates (and read_rates). Use EXCLUSIVELY these
            rate lists: never use prices from booking portals, the web or your memory; never invent a price, hotel or availability.
            Check validity dates and conditions of each rate. If the lists do not cover the request, say so in missing_info
            and propose what could be offered instead, without inventing prices.

            4. Build two or three package proposals (e.g. economy / balanced / comfort). For each: description, day-by-day
            itinerary, what is included and excluded, the net cost from the lists, the total price for all travellers = net
            cost + agency margin (margin_pct is given in the task; show the calculation internally in cost_total and total_price
            for the most likely proposal and state each proposal''s total in the email), validity of the offer and conditions
            (payment, cancellation) taken from the rate lists.

            5. Write the quote email (draft_type = ''quote'') in the customer''s language (Italian or English), with greeting,
            proposals, conditions and the agency signature. No markdown tables; plain text only.

            6. Save everything with the tool save_request: client_name, client_email, language, original_email (the full received
            text), destination, date_from, date_to (YYYY-MM-DD), adults, children, budget, preferences, missing_info, draft_type,
            reply_subject, reply_body, cost_total, total_price, team_emails, status = ''in_attesa''. Never set any other status:
            the operator approves and sends. Finish with a short summary of what you saved.

            If a request is not a travel request (spam, newsletter), save it with status ''nuova'' and note this in missing_info.'
    goalTemplate: 'Agency: {agency_name}. Margin to apply on net costs: {margin_pct}%. Signature for the emails:

      {signature}

      Team emails to copy into team_emails: {team}

      Today is {date}.


      New email received:

      {message}'
    context:
    - key: agency_name
      from: collection:agency_settings.agency_name
    - key: margin_pct
      from: collection:agency_settings.margin_pct
    - key: signature
      from: collection:agency_settings.signature
    - key: team
      from: collection:agency_settings.team_emails
    appTools:
    - name: search_rates
      description: Search the agency's rate lists (tour operators, hotels, flights, transfers)
      action: search
      collection: rate_lists
      scope: user
    - name: read_rates
      description: Read rate list records
      action: read
      collection: rate_lists
      scope: user
    - name: save_request
      description: Save the practice (request + draft reply) in the agency's list
      action: write
      collection: requests
      scope: user
    output: markdown
    limits:
      maxTurns: 15
      maxBudgetUsd: 0.6
  channels:
  - key: inbox
    type: email
    agent: quoter
    greeting:
      it: Richiesta ricevuta.
      en: Request received.
  inputForm:
    title:
      it: Incolla una richiesta
      en: Paste a request
    fields:
    - name: message
      type: textarea
      required: true
      maxLength: 6000
      label:
        it: Testo dell'email del cliente
        en: Customer email text
  data:
    collections:
    - name: agency_settings
      description: 'Agency profile: margin, signature, team'
      ownedBy: user
      fields:
      - name: agency_name
        type: text
        required: true
        label:
          it: Nome agenzia
          en: Agency name
      - name: margin_pct
        type: number
        required: true
        label:
          it: Margine %
          en: Margin %
      - name: signature
        type: textarea
        label:
          it: Firma delle email
          en: Email signature
      - name: team_emails
        type: array
        label:
          it: Email degli operatori
          en: Operators' emails
        help:
          it: Gli operatori vedono le pratiche e i listini dell'agenzia
          en: Operators see the agency's practices and rate lists
    - name: rate_lists
      description: Rates of the agency's tour operators and partner properties
      ownedBy: user
      access:
      - role: user
        where:
          members: '{user.email}'
        can:
        - read
        - write
      fields:
      - name: supplier
        type: text
        required: true
        label:
          it: Tour operator / struttura
          en: Tour operator / property
      - name: kind
        type: select
        required: true
        label:
          it: Tipo
          en: Type
        options:
        - value: package
          label:
            it: Pacchetto
            en: Package
        - value: hotel
          label: Hotel
        - value: flight
          label:
            it: Volo
            en: Flight
        - value: transfer
          label: Transfer
        - value: tour
          label: Tour
      - name: destination
        type: text
        required: true
        label:
          it: Destinazione
          en: Destination
      - name: name
        type: text
        required: true
        label:
          it: Prodotto / struttura
          en: Product / property
      - name: stars
        type: number
        label:
          it: Stelle
          en: Stars
      - name: valid_from
        type: date
        label:
          it: Valido dal
          en: Valid from
      - name: valid_to
        type: date
        label:
          it: Valido fino al
          en: Valid to
      - name: price_adult
        type: number
        label:
          it: Prezzo netto adulto
          en: Net price per adult
      - name: price_child
        type: number
        label:
          it: Prezzo netto bambino
          en: Net price per child
      - name: price_unit
        type: text
        label:
          it: Unità (a notte, a persona...)
          en: Unit (per night, per person...)
      - name: conditions
        type: textarea
        label:
          it: Condizioni e note
          en: Conditions and notes
      - name: document
        type: file
        accept:
        - pdf
        - xlsx
        - csv
        - docx
        label:
          it: Listino allegato
          en: Attached rate list
      - name: members
        type: array
        label:
          it: Operatori
          en: Operators
    - name: requests
      description: 'Practices: customer request, draft reply and status'
      ownedBy: user
      retentionDays: 730
      access:
      - role: user
        where:
          members: '{user.email}'
        can:
        - read
        - write
      fields:
      - name: client_name
        type: text
        label:
          it: Cliente
          en: Customer
      - name: client_email
        type: email
        label: Email
      - name: language
        type: select
        label:
          it: Lingua
          en: Language
        options:
        - value: it
          label: Italiano
        - value: en
          label: English
      - name: destination
        type: text
        label:
          it: Destinazione
          en: Destination
      - name: date_from
        type: date
        label:
          it: Dal
          en: From
      - name: date_to
        type: date
        label:
          it: Al
          en: To
      - name: adults
        type: number
        label:
          it: Adulti
          en: Adults
      - name: children
        type: number
        label:
          it: Bambini
          en: Children
      - name: budget
        type: number
        label: Budget
      - name: preferences
        type: textarea
        label:
          it: Preferenze
          en: Preferences
      - name: original_email
        type: textarea
        label:
          it: Email originale del cliente
          en: Customer's original email
      - name: missing_info
        type: textarea
        label:
          it: Informazioni mancanti / note
          en: Missing information / notes
      - name: draft_type
        type: select
        label:
          it: Tipo bozza
          en: Draft type
        options:
        - value: info
          label:
            it: Richiesta informazioni
            en: Info request
        - value: quote
          label:
            it: Preventivo
            en: Quote
      - name: reply_subject
        type: text
        label:
          it: Oggetto risposta
          en: Reply subject
      - name: reply_body
        type: textarea
        label:
          it: Bozza di risposta
          en: Draft reply
      - name: cost_total
        type: number
        label:
          it: Costo netto
          en: Net cost
      - name: total_price
        type: number
        label:
          it: Prezzo totale
          en: Total price
      - name: status
        type: select
        required: true
        label:
          it: Stato
          en: Status
        help:
          it: Impostando «Inviata» la risposta parte al cliente.
          en: Setting «Sent» sends the reply to the customer.
        default: nuova
        options:
        - value: nuova
          label:
            it: Nuova
            en: New
        - value: in_attesa
          label:
            it: In attesa
            en: Pending
        - value: inviata
          label:
            it: Inviata
            en: Sent
        - value: confermata
          label:
            it: Confermata
            en: Confirmed
      - name: team_emails
        type: array
      - name: members
        type: array
        label:
          it: Operatori
          en: Operators
  views:
  - key: home
    type: page
    nav: false
    title: PreventivoLampo
    sections:
    - type: hero
      title:
        it: Dalla richiesta al **preventivo** in un lampo.
        en: From request to **quote** in a flash.
      text:
        it: 'Un agente legge le email dei clienti, chiede ciò che manca e prepara 2-3 proposte con i vostri listini e il vostro
          margine. Voi correggete e approvate: solo allora parte la risposta.'
        en: 'An agent reads customer emails, asks for what is missing and drafts 2-3 proposals from your own rate lists and
          margin. You edit and approve: only then is the reply sent.'
      actions:
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: 1 · Carichi i listini
          en: 1 · Upload your rates
        text:
          it: 'Solo tour operator e strutture convenzionate: nessun prezzo da portali esterni.'
          en: 'Only your tour operators and partner properties: no prices from outside portals.'
      - title:
          it: 2 · L'agente legge le email
          en: 2 · The agent reads emails
        text:
          it: Estrae destinazione, date, persone, budget e preferenze, o prepara la richiesta di dettagli.
          en: Extracts destination, dates, travellers, budget and preferences, or drafts a request for details.
      - title:
          it: 3 · Approvi e invii
          en: 3 · Approve and send
        text:
          it: Vedi la richiesta accanto alla bozza, la correggi e la invii.
          en: See the request next to the draft, edit it and send.
    - type: note
      content:
        it: Italiano e inglese. Prezzi calcolati solo dai listini caricati dall'agenzia.
        en: Italian and English. Prices come only from the rate lists uploaded by the agency.
  - key: new_request
    type: new_run
    title:
      it: Incolla una richiesta
      en: Paste a request
    roles:
    - user
    - admin
  - key: practices
    type: table
    title:
      it: Pratiche
      en: Practices
    source: collection:requests
    columns:
    - client_name
    - destination
    - date_from
    - adults
    - children
    - budget
    - total_price
    - status
    export: true
    roles:
    - user
    - admin
  - key: practice
    type: form
    title:
      it: Pratica
      en: Practice
    collection: requests
    edit: true
    nav: false
    fields:
    - client_name
    - client_email
    - language
    - status
    - original_email
    - missing_info
    - destination
    - date_from
    - date_to
    - adults
    - children
    - budget
    - preferences
    - draft_type
    - reply_subject
    - reply_body
    - cost_total
    - total_price
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Pratica salvata.
        en: Practice saved.
      redirect: practices
    roles:
    - user
    - admin
  - key: rates
    type: table
    title:
      it: Listini
      en: Rate lists
    source: collection:rate_lists
    columns:
    - supplier
    - kind
    - destination
    - name
    - stars
    - valid_from
    - valid_to
    - price_adult
    - price_child
    export: true
    roles:
    - user
    - admin
  - key: rate_new
    type: form
    title:
      it: Carica tariffa
      en: Add rate
    collection: rate_lists
    edit: true
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Tariffa salvata.
        en: Rate saved.
      redirect: rates
    roles:
    - user
    - admin
  - key: settings
    type: form
    title:
      it: Agenzia e margine
      en: Agency and margin
    collection: agency_settings
    edit: true
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Impostazioni salvate.
        en: Settings saved.
    roles:
    - user
    - admin
  - key: revenue
    type: page
    title:
      it: Fatturato stimato
      en: Estimated revenue
    roles:
    - user
    - admin
    sections:
    - type: data
      source: collection:requests
      display: kpi
      filters:
      - field: status
        op: '='
        value: confermata
      kpis:
      - label:
          it: Fatturato confermato
          en: Confirmed revenue
        agg: sum
        field: total_price
        format: money
      - label:
          it: Pratiche confermate
          en: Confirmed practices
        agg: count
    - type: data
      title:
        it: Fatturato per mese
        en: Revenue by month
      source: collection:requests
      display: chart
      chart: bar
      fields:
      - key: date_from
        label:
          it: Mese
          en: Month
      - key: total
        label:
          it: Totale
          en: Total
      groupBy:
        field: date_from
        bucket: month
        aggs:
        - key: total
          agg: sum
          field: total_price
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - user
  triggers:
  - key: send_reply
    description: The reply leaves only when the operator sets the status to sent
    'on':
      collection: requests
      op: update
      where:
        status: inviata
    notify:
      to:
      - record.client_email
      subject:
        it: '{record.reply_subject}'
        en: '{record.reply_subject}'
      body:
        it: '{record.reply_body}'
        en: '{record.reply_body}'
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: agenzia
      price: 79
      interval: month
      label:
        it: Agenzia
        en: Agency
      includes:
      - Richieste illimitate (uso corretto)
      - Operatori dell'agenzia
      - Listini e pratiche
  extensions:
  - key: own_mailbox
    description: 'Connecting the agency''s own mailbox (IMAP/Google/Microsoft OAuth) to read incoming mail and sending the
      approved reply from that mailbox is not available yet. Today: forward requests to the app''s email channel address (or
      paste the text), and the approved reply is sent by the platform email.'
  - key: operator_roles
    description: Operators are added by the owner as emails in the settings and see the agency's practices and rate lists;
      a separate owner-only revenue view per role is not enforceable yet, so the revenue page is open to all signed-in agency
      users.
