apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: preventivolampo
  displayName: PreventivoLampo
  tagline:
    it: Dalla richiesta del cliente al preventivo pronto in pochi minuti, solo sui vostri listini.
    en: From the customer's request to a ready quote in minutes, using only your own rate cards.
  description:
    it: 'Incolli l''email del cliente: un agente estrae destinazione, date, passeggeri, budget e preferenze, propone 2-3 pacchetti
      usando solo i listini dei vostri tour operator, applica il vostro margine e scrive la bozza. L''operatore la corregge
      e la approva.'
    en: 'Paste the customer''s email: an agent extracts destination, dates, travellers, budget and preferences, proposes 2-3
      packages using only your tour operators'' rate cards, applies your margin and writes the draft. An operator edits and
      approves it.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#0b3c5d'
      accent: '#f28c28'
      background: '#f7fafc'
      foreground: '#16222e'
    fonts:
      body: Inter
      display: Poppins
    wordmark:
    - text: Preventivo
      color: primary
    - text: Lampo
      color: accent
    button: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label:
        it: Titolare
        en: Owner
      assignedBy: admin_emails
    - key: operator
      label:
        it: Operatore
        en: Operator
      assignedBy: invite
  limits:
  - action: agent:quoter
    per: user
    max: 60
    window: day
  agents:
  - key: quoter
    role: main
    description: Reads the customer's email, extracts the request, asks for missing data or builds 2-3 packages from the agency's
      own rate cards, applies the margin and drafts the reply.
    profile:
      inline:
        display_name: PreventivoLampo quoter
        crews:
        - id: quoter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 14
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the quoting assistant of a travel agency. You receive the text of a customer''s email.


            STEPS

            1. Extract: destination, travel dates (or flexibility), number of adults, number and ages of children, budget,
            preferences (sea, culture, 4-star hotel, flight included, etc.), customer name and language.

            2. If essential data is missing (destination, dates, travellers), do NOT invent anything: write a short, polite
            reply asking only for what is missing, in the customer''s language, and mark status ''in_attesa''.

            3. Otherwise search the agency''s rate cards with the tool search_rate_cards (and read_rate_cards if needed) and
            read the margin with read_settings. Use EXCLUSIVELY these rate cards: never use prices from booking portals, your
            memory or the web. If the rate cards do not cover the request, say so plainly and ask the operator or customer
            how to proceed; never fill gaps with guessed prices.

            4. Compose two or three package proposals. For each: description, itinerary day by day, what is included/excluded,
            cost per component taken from the rate cards (cite supplier and rate card), net total, margin applied, final total
            and per-person price, conditions (validity, deposit, cancellation as stated in the rate cards).

            5. Write the full quote email in the customer''s language (Italian or English), ready to be sent after human approval.

            6. Save the case with save_case (status ''nuova'' if a quote was drafted, ''in_attesa'' if waiting for customer
            info) and call request_send_quote to ask the operator for approval. Never claim the email was sent.


            OUTPUT (Markdown, language of the operator interface: {lang} for the analysis, the email in the customer''s language)

            # <Customer> — <destination> <dates>

            ## Richiesta estratta (table of fields; mark missing ones)

            ## Informazioni mancanti

            ## Proposte (2-3, with a price table)

            ## Bozza email al cliente

            Then a final fenced JSON block with keys: customer, customer_email, destination, date_from, date_to, adults, children,
            budget, status, best_total, currency, draft_email.

            If useful add a chart block comparing the package totals:

            ```chart

            {"type":"bar","title":"Totale proposte","labels":["A","B"],"series":[{"name":"EUR","values":[1,2]}],"unit":"EUR"}

            ```

            Real figures only. You do not give legal or insurance advice; mention that conditions come from the rate cards.'
    goalTemplate: 'Customer email received:

      ---

      {email_text}

      ---

      {?sender}Sender: {sender}{/sender}

      {?operator_notes}Operator notes: {operator_notes}{/operator_notes}

      Today is {date}. Write the analysis in the language with ISO code {lang}; write the customer email in the customer''s
      own language.'
    appTools:
    - name: search_rate_cards
      description: Search the agency's rate cards (tour operators, hotels, flights, transfers)
      action: search
      collection: rate_cards
      scope: all
    - name: read_rate_cards
      description: Read rate cards records
      action: read
      collection: rate_cards
      scope: all
    - name: read_settings
      description: Read the agency settings (margin, currency, email signature, conditions)
      action: read
      collection: agency_settings
      scope: all
    - name: save_case
      description: Create or update the case (pratica) with extracted data, status and draft
      action: write
      collection: cases
      scope: all
    awaits:
    - send_quote
    output: markdown+json
    resultSchema:
      type: object
      properties:
        customer:
          type: string
        customer_email:
          type: string
        destination:
          type: string
        date_from:
          type: string
        date_to:
          type: string
        adults:
          type: number
        children:
          type: number
        budget:
          type: number
        status:
          type: string
        best_total:
          type: number
        currency:
          type: string
        draft_email:
          type: string
    writesTo:
      collection: cases
      parse: json_last
    limits:
      maxTurns: 14
      maxBudgetUsd: 0.8
      timeoutSeconds: 300
  inputForm:
    title:
      it: Nuova richiesta
      en: New request
    fields:
    - name: email_text
      type: textarea
      required: true
      maxLength: 6000
      label:
        it: Testo dell'email del cliente
        en: Customer email text
      help:
        it: Incolla qui l'email ricevuta (la lettura automatica della casella non è ancora disponibile).
        en: Paste the received email here (automatic mailbox reading is not available yet).
    - name: sender
      type: email
      label:
        it: Email del cliente
        en: Customer email
    - name: operator_notes
      type: textarea
      maxLength: 600
      label:
        it: Note per l'agente (facoltative)
        en: Notes for the agent (optional)
  data:
    collections:
    - name: rate_cards
      ownedBy: org
      searchable: true
      description: Rate cards of tour operators and partner suppliers, loaded and updated by the agency
      fields:
      - name: supplier
        type: text
        required: true
        label:
          it: Tour operator / struttura
          en: Tour operator / supplier
      - name: destination
        type: text
        required: true
        label:
          it: Destinazione
          en: Destination
      - name: kind
        type: select
        label:
          it: Tipo
          en: Type
        options:
        - hotel
        - tour
        - flight
        - transfer
        - package
        - other
      - name: description
        type: textarea
        label:
          it: Descrizione
          en: Description
      - name: valid_from
        type: date
        label:
          it: Valido dal
          en: Valid from
      - name: valid_to
        type: date
        label:
          it: Valido fino al
          en: Valid to
      - name: price
        type: number
        required: true
        label:
          it: Tariffa netta
          en: Net rate
      - name: unit
        type: text
        label:
          it: Unità (a notte, a persona…)
          en: Unit (per night, per person…)
      - name: conditions
        type: textarea
        label:
          it: Condizioni e supplementi
          en: Conditions and supplements
    - name: agency_settings
      ownedBy: org
      description: Margin and defaults of the agency
      fields:
      - name: margin_pct
        type: number
        required: true
        label:
          it: Margine %
          en: Margin %
      - name: currency
        type: text
        default: EUR
      - name: signature
        type: textarea
        label:
          it: Firma email
          en: Email signature
      - name: standard_conditions
        type: textarea
        label:
          it: Condizioni generali
          en: General conditions
    - name: cases
      ownedBy: org
      description: Customer requests (pratiche) with status and draft
      fields:
      - name: customer
        type: text
        label:
          it: Cliente
          en: Customer
      - name: customer_email
        type: email
      - name: destination
        type: text
        label:
          it: Destinazione
          en: Destination
      - name: date_from
        type: date
      - name: date_to
        type: date
      - name: adults
        type: number
      - name: children
        type: number
      - name: budget
        type: number
      - name: status
        type: select
        label:
          it: Stato
          en: Status
        default: nuova
        options:
        - value: nuova
          label:
            it: Nuova
            en: New
        - value: in_attesa
          label:
            it: In attesa
            en: Waiting
        - value: inviata
          label:
            it: Inviata
            en: Sent
        - value: confermata
          label:
            it: Confermata
            en: Confirmed
      - name: best_total
        type: number
        label:
          it: Totale proposto
          en: Quoted total
      - name: currency
        type: text
      - name: draft_email
        type: textarea
  approvals:
  - key: send_quote
    title:
      it: Approva la risposta al cliente
      en: Approve the reply to the customer
    description: The operator compares the original email with the draft, edits it and approves it. Only then may the reply
      be sent.
    role: operator
    fields:
    - customer
    - destination
    - best_total
    - draft_email
    timeoutMinutes: 10080
    onTimeout: reject
  views:
  - key: home
    type: page
    nav: false
    sections:
    - type: hero
      eyebrow:
        it: Per agenzie viaggi
        en: For travel agencies
      title:
        it: '**Preventivi** in pochi minuti, solo sui vostri listini.'
        en: '**Quotes** in minutes, using only your rate cards.'
      text:
        it: L'agente legge la richiesta, chiede ciò che manca, compone 2-3 proposte con i prezzi dei vostri tour operator
          e il vostro margine. Voi approvate.
        en: The agent reads the request, asks for what is missing, builds 2-3 proposals with your tour operators' prices and
          your margin. You approve.
      actions:
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Incolla la richiesta
          en: Paste the request
        text:
          it: L'agente estrae destinazione, date, passeggeri, budget e preferenze.
          en: The agent extracts destination, dates, travellers, budget and preferences.
        badge: 📩
      - title:
          it: Proposte dai vostri listini
          en: Proposals from your rate cards
        text:
          it: 'Nessun prezzo da portali esterni: solo le tariffe che caricate voi, più il vostro margine.'
          en: 'No prices from outside portals: only the rates you upload, plus your margin.'
        badge: 🧾
      - title:
          it: Approva e invia
          en: Approve and send
        text:
          it: L'operatore vede email e bozza affiancate, corregge e approva.
          en: The operator sees the email and draft side by side, edits and approves.
        badge: ✅
    - type: note
      content:
        it: 'Le bozze sono generate da un''AI sui listini caricati: l''operatore verifica sempre prima dell''invio.'
        en: 'Drafts are AI-generated from the uploaded rate cards: an operator always checks before sending.'
  - key: new_request
    type: new_run
    title:
      it: Nuova richiesta
      en: New request
    roles:
    - admin
    - operator
  - key: cases_list
    type: table
    title:
      it: Pratiche
      en: Cases
    source: collection:cases
    roles:
    - admin
    - operator
    data:
      display: table
      fields:
      - key: customer
        label:
          it: Cliente
          en: Customer
      - key: destination
        label:
          it: Destinazione
          en: Destination
      - key: date_from
        label:
          it: Dal
          en: From
        format: date
      - key: adults
        label:
          it: Adulti
          en: Adults
        format: number
      - key: children
        label:
          it: Bambini
          en: Children
        format: number
      - key: status
        label:
          it: Stato
          en: Status
        format: badge
      sort:
        field: date_from
        dir: desc
      limit: 200
      empty:
        it: Nessuna pratica.
        en: No cases yet.
  - key: runs
    type: history
    title:
      it: Bozze e analisi
      en: Drafts and analyses
    source: run
    roles:
    - admin
    - operator
  - key: quote
    type: report
    source: run
    printable: true
    nav: false
  - key: to_approve
    type: approvals
    title:
      it: Da approvare
      en: To approve
    approvals:
    - send_quote
    roles:
    - admin
    - operator
  - key: revenue
    type: dashboard
    title:
      it: Fatturato stimato
      en: Estimated revenue
    children:
    - revenue_data
    roles:
    - admin
  - key: revenue_data
    type: cards
    source: collection:cases
    nav: false
    roles:
    - admin
    data:
      display: kpi
      kpis:
      - label:
          it: Pratiche
          en: Cases
        agg: count
      - label:
          it: Fatturato stimato (preventivi)
          en: Estimated revenue (quotes)
        agg: sum
        field: best_total
        format: money
      - label:
          it: Totale medio
          en: Average total
        agg: avg
        field: best_total
        format: money
      filters:
      - field: status
        op: '!='
        value: in_attesa
  - key: admin_rate_cards
    type: admin
    title:
      it: Listini
      en: Rate cards
    source: collection:rate_cards
    roles:
    - admin
  - key: admin_settings
    type: admin
    title:
      it: Margine e impostazioni
      en: Margin and settings
    source: collection:agency_settings
    roles:
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - admin
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: agency_monthly
      price: 79
      interval: month
      label:
        it: Abbonamento agenzia
        en: Agency plan
      includes:
      - Unlimited operators
      - Quote drafts
      - Rate card management
      roles:
      - admin
  extensions:
  - key: mailbox_connector
    description: Reading new emails from the agency mailbox and sending approved replies from it are not available yet (they
      need the agency's own mailbox credentials and notifications). For now the operator pastes the customer's email and copies
      the approved draft into their mail client.
  - key: file_upload_rate_cards
    description: 'Uploading rate card files (PDF/Excel) is not available yet: rate cards are entered as records or pasted
      as text in the Rate cards view.'
  - key: multi_agency
    description: 'Data is held in the app owner''s back office: one deployment per agency. A shared multi-agency version with
      per-agency staff would need an agency-scoped ownership model.'
