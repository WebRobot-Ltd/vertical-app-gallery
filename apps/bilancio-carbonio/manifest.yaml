apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: bilancio-carbonio
  displayName: Bilancio Carbonio
  tagline:
    it: Il bilancio delle emissioni della tua PMI, pronto da firmare.
    en: Your SME's carbon footprint, ready to sign.
  description:
    it: Compili un modulo annuale; un agente AI applica i fattori ISPRA e DEFRA secondo il GHG Protocol, separa Scope 1, 2
      e 3, confronta con l'anno precedente e prepara report e piano di riduzione. Un consulente ESG può validarlo prima della
      firma.
    en: Fill in an annual form; an AI agent applies ISPRA and DEFRA factors following the GHG Protocol, splits Scope 1, 2
      and 3, compares with last year and prepares the report and a reduction plan. An ESG consultant can validate it before
      signing.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#14532d'
      accent: '#0f766e'
      background: '#f6f8f4'
      foreground: '#17231b'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Bilancio
      color: primary
    - text: Carbonio
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Piani
        en: Plans
      href: '#piani'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
    - key: consultant
      label:
        it: Consulente ESG
        en: ESG consultant
      assignedBy: derived
      from: collection:company_profile.consultant_email
  limits:
  - action: agent:analyst
    per: user
    max: 2
    window: month
    roles:
    - user
    plans:
      pmi_small: 4
      pmi_medium: 10
  agents:
  - key: analyst
    role: main
    description: Calcola il bilancio carbonio (Scope 1, 2, 3) con fattori ISPRA e DEFRA, confronta con l'anno precedente e
      scrive report e piano di riduzione.
    awaits:
    - esg_validation
    profile:
      inline:
        display_name: Analista carbonio
        crews:
        - id: analyst
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'Sei un analista di contabilità carbonica per PMI, esperto del GHG Protocol (Corporate Standard e
            Scope 3 Standard). Calcoli le emissioni dai dati annuali forniti dall''azienda.


            METODO

            - Fattori di emissione: usa solo fonti ufficiali. ISPRA (fattori nazionali per elettricità, mix di rete, gas naturale,
            carburanti, rifiuti) per l''Italia; DEFRA/DESNZ (UK Government GHG Conversion Factors) per viaggi, merci, rifiuti,
            acquisti e quanto manca in ISPRA. Se non hai già il fattore, recuperalo dal sito ufficiale con gli strumenti MCP
            WebRobot (scraping della pagina/tabella). Cita per ogni fattore fonte, anno di pubblicazione e unità. Se un fattore
            non è reperibile, dillo e usa una stima dichiarata come tale; non inventare cifre.

            - Scope 1: gas naturale e combustibili per riscaldamento, carburanti della flotta di proprietà. Scope 2: energia
            elettrica, indica sia location-based sia market-based (se l''azienda dichiara energia verde certificata). Scope
            3: viaggi di lavoro, pendolarismo dipendenti, rifiuti, spedizioni/trasporti, acquisti principali; segnala le categorie
            Scope 3 escluse e perché.

            - Coerenza: confronta con l''inventario dell''anno precedente (contesto ''previous''). Segnala variazioni oltre
            ±25% per voce, unità sospette (kWh vs MWh, litri vs m3), valori nulli dove l''anno scorso non lo erano, intensità
            fuori scala. Elenca le anomalie in una tabella con la domanda da fare al referente. Se mancano dati, calcola solo
            ciò che è supportato e segnala i vuoti.

            - Intensità: tCO2e per dipendente e per milione di euro di fatturato.

            - Piano di riduzione: 6-10 azioni ordinate per impatto (tCO2e evitate/anno) e costo stimato (basso/medio/alto,
            con ordine di grandezza in euro dichiarato come stima), con tempi.

            - Se nel profilo azienda è indicato un consulente ESG (consultant_email), alla fine chiama request_esg_validation
            con il riepilogo (anno, totali per scope, anomalie aperte) e dichiara che il report è ''in attesa di validazione''.
            Altrimenti scrivi che non è validato da un consulente.

            - Non fornire consulenza legale o di certificazione come fatto: il report è un supporto, la firma spetta all''azienda.


            FORMATO (nella lingua dell''utente)

            Prima riga: ''# Bilancio carbonio <anno> — <azienda>''. Poi ## Sintesi (totali e intensità), ## Scope 1, ## Scope
            2, ## Scope 3, ## Confronto con l''anno precedente, ## Anomalie e verifiche, ## Piano di riduzione (tabella),
            ## Emissioni residue e compensazione (solo menzione: l''azienda può chiederne la proposta dall''app), ## Metodologia
            e fonti.

            Aggiungi grafici con blocchi:

            ```chart

            {"type":"pie","title":"Emissioni per scope","labels":["Scope 1","Scope 2","Scope 3"],"series":[{"name":"tCO2e","values":[0,0,0]}],"unit":"tCO2e"}

            ```

            (con valori reali; un grafico a barre per categoria Scope 3 e uno di confronto con l''anno precedente quando disponibile).

            Alla fine, un ultimo blocco JSON ```json con: {"year":<anno>,"scope1":<t>,"scope2_location":<t>,"scope2_market":<t>,"scope3":<t>,"total":<t>,"employees":<n>,"revenue_eur":<n>,"per_employee":<t>,"per_million_eur":<t>}.'
    context:
    - key: company
      from: collection:company_profile
    - key: previous
      from: collection:inventories
    goalTemplate: 'Profilo azienda (JSON): {company}

      Inventari degli anni precedenti (JSON, uno per riga): {previous}


      Anno di rendicontazione: {year}

      Dipendenti: {employees}

      Fatturato (EUR): {revenue_eur}

      Sedi: {sites}

      Energia elettrica (kWh): {electricity_kwh}

      {?green_energy}Energia da fonti rinnovabili certificate (GO/PPA): {green_energy_label}{/green_energy}

      Gas naturale (m3): {gas_m3}

      {?fleet}Flotta (carburanti, litri o km per veicolo): {fleet}{/fleet}

      {?travel}Viaggi di lavoro: {travel}{/travel}

      {?waste}Rifiuti: {waste}{/waste}

      {?shipments}Spedizioni: {shipments}{/shipments}

      {?purchases}Acquisti principali: {purchases}{/purchases}

      {?commuting}Pendolarismo: {commuting}{/commuting}

      {?notes}Note: {notes}{/notes}

      {?bills_text}Testo delle fatture/allegati: {bills_text}{/bills_text}

      Oggi è {date}. Scrivi il report nella lingua con codice ISO {lang}.'
    output: markdown+json
    resultSchema:
      type: object
      properties:
        year:
          type: number
        scope1:
          type: number
        scope2_location:
          type: number
        scope2_market:
          type: number
        scope3:
          type: number
        total:
          type: number
        employees:
          type: number
        revenue_eur:
          type: number
        per_employee:
          type: number
        per_million_eur:
          type: number
    writesTo:
      collection: inventories
      parse: json_last
      keyBy: year
    limits:
      maxTurns: 40
      maxBudgetUsd: 1.5
  - key: offset_advisor
    role: helper
    description: Propone progetti di compensazione certificati per le emissioni residue.
    profile:
      inline:
        display_name: Consulente compensazione
        crews:
        - id: offset_advisor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 1
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'Proponi progetti di compensazione volontaria delle emissioni residue di una PMI. Usa gli strumenti
            MCP WebRobot per consultare i registri pubblici (Gold Standard, Verra VCS, Registro italiano dei crediti di carbonio
            forestali) e scegli 3-5 progetti con certificazione valida. Per ciascuno: nome, standard, tipologia (rimozione
            o riduzione), paese, prezzo indicativo per tCO2e se pubblicato, costo totale per le tonnellate richieste, link
            al registro. Non inventare progetti né prezzi: se un prezzo non è pubblico scrivi ''su richiesta''. Ricorda che
            la compensazione non sostituisce la riduzione e che l''acquisto avviene con il fornitore scelto; il team dell''app
            contatterà l''azienda. Inizia con ''# Proposte di compensazione — <tonnellate> tCO2e''. Termina con ## Come procedere.
            Rispondi nella lingua richiesta.'
    goalTemplate: 'Proponi progetti di compensazione per {record.tonnes} tCO2e di emissioni residue dell''anno {record.year}.
      Note dell''azienda: {record.notes}. Oggi è {date}. Rispondi in lingua con codice ISO {lang}.'
    output: markdown
    writesTo:
      collection: offset_proposals
      parse: whole
  inputForm:
    title:
      it: Dati annuali
      en: Annual data
    fields:
    - name: year
      type: number
      required: true
      label:
        it: Anno di rendicontazione
        en: Reporting year
      default: 2025
    - name: employees
      type: number
      required: true
      label:
        it: Numero di dipendenti
        en: Employees
    - name: revenue_eur
      type: number
      required: true
      label:
        it: Fatturato annuo (EUR)
        en: Annual revenue (EUR)
    - name: sites
      type: textarea
      required: true
      maxLength: 1500
      label:
        it: Sedi (indirizzo/regione, superficie, uso)
        en: Sites (address/region, area, use)
    - name: electricity_kwh
      type: number
      required: true
      label:
        it: Energia elettrica totale (kWh)
        en: Total electricity (kWh)
    - name: green_energy
      type: select
      label:
        it: Energia rinnovabile certificata
        en: Certified renewable energy
      options:
      - value: none
        label:
          it: 'No'
          en: 'No'
      - value: partial
        label:
          it: In parte (GO)
          en: Partly (GO)
      - value: full
        label:
          it: Interamente (GO/PPA)
          en: Fully (GO/PPA)
    - name: gas_m3
      type: number
      label:
        it: Gas naturale (m³)
        en: Natural gas (m³)
    - name: fleet
      type: textarea
      maxLength: 1500
      label:
        it: 'Flotta: carburante e litri (o km) per veicolo'
        en: 'Fleet: fuel and litres (or km) per vehicle'
    - name: travel
      type: textarea
      maxLength: 1500
      label:
        it: Viaggi di lavoro (mezzo, tratte, km o numero)
        en: Business travel (mode, routes, km or count)
    - name: waste
      type: textarea
      maxLength: 1000
      label:
        it: Rifiuti (tipo, kg, smaltimento)
        en: Waste (type, kg, disposal)
    - name: shipments
      type: textarea
      maxLength: 1000
      label:
        it: Spedizioni (tonnellate, tratte, mezzo)
        en: Shipments (tonnes, routes, mode)
    - name: purchases
      type: textarea
      maxLength: 1500
      label:
        it: Acquisti principali (categoria, spesa EUR o quantità)
        en: Main purchases (category, spend EUR or quantity)
    - name: commuting
      type: textarea
      maxLength: 1000
      label:
        it: Pendolarismo (mezzi, distanze medie, smart working)
        en: Commuting (modes, average distances, remote work)
    - name: notes
      type: textarea
      maxLength: 600
      label:
        it: Note (facoltative)
        en: Notes (optional)
    - name: bills
      type: file
      accept:
      - pdf
      - xlsx
      - csv
      maxMb: 10
      multiple: true
      label:
        it: Bollette/fatture (facoltativo)
        en: Bills/invoices (optional)
  data:
    collections:
    - name: company_profile
      ownedBy: user
      description: Profilo dell'azienda e consulente ESG invitato
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Ragione sociale
          en: Company name
      - name: vat
        type: text
        label:
          it: Partita IVA
          en: VAT number
      - name: sector
        type: text
        label:
          it: Settore (ATECO)
          en: Sector
      - name: size
        type: select
        label:
          it: Dimensione
          en: Size
        options:
        - micro
        - small
        - medium
      - name: consultant_email
        type: email
        label:
          it: Email del consulente ESG (facoltativa)
          en: ESG consultant email (optional)
        help:
          it: Il consulente potrà rivedere e validare il report prima della firma.
          en: The consultant can review and validate the report before signing.
      access:
      - role: consultant
        where:
          consultant_email: '{user.email}'
        can:
        - read
    - name: inventories
      ownedBy: user
      description: Totali annuali per scope, usati per il confronto con l'anno precedente
      fields:
      - name: year
        type: number
      - name: scope1
        type: number
      - name: scope2_location
        type: number
      - name: scope2_market
        type: number
      - name: scope3
        type: number
      - name: total
        type: number
      - name: employees
        type: number
      - name: revenue_eur
        type: number
      - name: per_employee
        type: number
      - name: per_million_eur
        type: number
    - name: offset_requests
      ownedBy: user
      description: Richieste di proposte di compensazione
      fields:
      - name: year
        type: number
        required: true
        label:
          it: Anno
          en: Year
      - name: tonnes
        type: number
        required: true
        label:
          it: Tonnellate CO2e da compensare
          en: tCO2e to offset
      - name: notes
        type: textarea
        maxLength: 500
        label:
          it: Preferenze (tipo di progetto, area)
          en: Preferences (project type, area)
    - name: offset_proposals
      ownedBy: user
      description: Proposte di compensazione generate dall'agente
      fields:
      - name: content
        type: textarea
  views:
  - key: home
    type: page
    nav: false
    title: Bilancio Carbonio
    sections:
    - type: hero
      layout: split
      band: true
      title:
        it: Il **bilancio carbonio** della tua PMI, senza fogli di calcolo.
        en: Your SME's **carbon footprint**, without spreadsheets.
      text:
        it: Compili un modulo una volta l'anno. L'agente applica i fattori ISPRA e DEFRA secondo il GHG Protocol, separa Scope
          1, 2 e 3, segnala i valori anomali e prepara report e piano di riduzione.
        en: Fill in one form a year. The agent applies ISPRA and DEFRA factors following the GHG Protocol, splits Scope 1,
          2 and 3, flags anomalies and prepares the report and reduction plan.
      actions:
      - label:
          it: Inizia
          en: Start
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Registrati e descrivi l'azienda
          en: Sign up and describe your company
        text:
          it: Profilo aziendale e, se vuoi, il tuo consulente ESG.
          en: Company profile and, optionally, your ESG consultant.
      - title:
          it: Compila i dati annuali
          en: Fill in the annual data
        text:
          it: Sedi, energia, gas, flotta, viaggi, rifiuti, spedizioni, acquisti, dipendenti e pendolarismo.
          en: Sites, energy, gas, fleet, travel, waste, shipments, purchases, staff and commuting.
      - title:
          it: Ricevi report e piano
          en: Get the report and plan
        text:
          it: Scope 1, 2, 3, grafici, intensità, anomalie, confronto con l'anno scorso e azioni per impatto e costo.
          en: Scope 1, 2, 3, charts, intensity, anomalies, year-on-year comparison and actions ranked by impact and cost.
      - title:
          it: Valida e compensa
          en: Validate and offset
        text:
          it: Il consulente rivede il report prima della firma; per le emissioni residue chiedi progetti certificati.
          en: Your consultant reviews before signing; request certified projects for residual emissions.
    - type: cards
      id: piani
      title:
        it: Abbonamento annuale per dimensione
        en: Annual plan by company size
      items:
      - title: Micro
        text:
          it: Fino a 10 dipendenti · 290 €/anno
          en: Up to 10 employees · €290/year
      - title: Small
        text:
          it: Fino a 50 dipendenti · 590 €/anno
          en: Up to 50 employees · €590/year
      - title: Medium
        text:
          it: Fino a 250 dipendenti · 990 €/anno
          en: Up to 250 employees · €990/year
    - type: note
      content:
        it: 'Strumento di supporto: il report non sostituisce una verifica o certificazione di terza parte. I tuoi dati sono
          visibili solo a te e al consulente che inviti.'
        en: 'Support tool: the report does not replace third-party verification. Your data is visible only to you and the
          consultant you invite.'
  - key: company
    type: form
    title:
      it: Profilo azienda
      en: Company profile
    collection: company_profile
    edit: true
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Profilo salvato.
        en: Profile saved.
      redirect: new_report
    roles:
    - user
    - admin
  - key: new_report
    type: new_run
    title:
      it: Nuovo bilancio
      en: New inventory
    roles:
    - user
    - admin
  - key: reports
    type: history
    title:
      it: I miei bilanci
      en: My reports
    source: run
    roles:
    - user
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: trend
    type: table
    title:
      it: Confronto annuale
      en: Year over year
    source: collection:inventories
    data:
      display: chart
      chart: stacked
      fields:
      - key: year
        label:
          it: Anno
          en: Year
      - key: scope1
        label: Scope 1
        format: number
      - key: scope2_market
        label: Scope 2
        format: number
      - key: scope3
        label: Scope 3
        format: number
      sort:
        field: year
        dir: asc
    export: true
    roles:
    - user
    - admin
  - key: validation
    type: approvals
    title:
      it: Validazione ESG
      en: ESG validation
    approvals:
    - esg_validation
    roles:
    - consultant
    - admin
  - key: offset_request
    type: form
    title:
      it: Compensazione
      en: Offsetting
    collection: offset_requests
    submit:
      label:
        it: Richiedi proposte
        en: Request proposals
      message:
        it: 'Richiesta inviata: le proposte arriveranno a breve.'
        en: 'Request sent: proposals will arrive shortly.'
      redirect: offset_list
    roles:
    - user
  - key: offset_list
    type: list
    title:
      it: Proposte di compensazione
      en: Offset proposals
    source: collection:offset_proposals
    roles:
    - user
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Plan
    roles:
    - user
  approvals:
  - key: esg_validation
    title:
      it: Validazione del report da parte del consulente ESG
      en: ESG consultant validation
    description: Il consulente ESG rivede il report carbonio prima della firma.
    role: consultant
    fields:
    - year
    - summary
    timeoutMinutes: 10080
    onTimeout: reject
  triggers:
  - key: offset_start
    'on':
      collection: offset_requests
      op: insert
    start:
      agent: offset_advisor
    goal: 'Anno {record.year}, tonnellate {record.tonnes}, note: {record.notes}'
    asUser: true
  - key: offset_admin_notice
    'on':
      collection: offset_requests
      op: insert
    notify:
      to: admins
      subject:
        it: Nuova richiesta di compensazione
        en: New offset request
      body:
        it: Un'azienda ha richiesto proposte di compensazione per {record.tonnes} tCO2e (anno {record.year}).
        en: A company requested offset proposals for {record.tonnes} tCO2e (year {record.year}).
  - key: january_reminder
    'on':
      cron: 0 8 5 1 *
    notify:
      to: role:user
      subject:
        it: È ora del nuovo bilancio carbonio
        en: Time for your new carbon inventory
      body:
        it: 'Inserisci i dati dell''anno appena concluso: il report includerà il confronto con l''anno precedente.'
        en: 'Enter last year''s data: the report will include the comparison with the previous year.'
      link: new_report
  - key: validation_done
    'on':
      approval: esg_validation
      decision: any
    notify:
      to: owner
      subject:
        it: Esito della validazione ESG
        en: ESG validation outcome
      body:
        it: Il consulente ha deciso sul tuo report carbonio. Aprilo nell'app per i dettagli.
        en: Your consultant has decided on your carbon report. Open the app for details.
      link: reports
  notifications:
    emailOnRunDone: true
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: pmi_micro
      price: 290
      interval: year
      label:
        it: Micro (fino a 10 dipendenti)
        en: Micro (up to 10 employees)
      roles:
      - user
    - key: pmi_small
      price: 590
      interval: year
      label:
        it: Small (fino a 50 dipendenti)
        en: Small (up to 50 employees)
      roles:
      - user
    - key: pmi_medium
      price: 990
      interval: year
      label:
        it: Medium (fino a 250 dipendenti)
        en: Medium (up to 250 employees)
      roles:
      - user
  egress:
    hosts:
    - www.isprambiente.gov.it
    - www.gov.uk
    notes: Fattori ISPRA e UK Government GHG Conversion Factors (DEFRA/DESNZ, Open Government Licence) consultati dall'agente
      tramite MCP.
  extensions:
  - key: offset_checkout
    description: 'L''acquisto diretto dei crediti di compensazione con pagamento in app non è disponibile: l''app propone
      i progetti e il team contatta l''azienda.'
  - key: consultant_report_access
    description: Il consulente decide sull'approvazione con il riepilogo del report; la lettura integrale del report del cliente
      è limitata al profilo azienda.
  - key: january_comparison
    description: A gennaio l'app invia il promemoria; il confronto con l'anno precedente viene generato dal report quando
      l'azienda inserisce i nuovi dati (nessun agente globale legge i dati di tutti i clienti).
