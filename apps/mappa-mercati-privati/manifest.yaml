apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: mappa-mercati-privati
  displayName: Mappa Mercati Privati
  tagline:
    it: Intelligence sulle aziende non quotate, dalla tesi alla short list.
    en: Private company intelligence, from thesis to short list.
  description:
    it: 'Definisci una tesi di ricerca: un agente cerca sul web, visita i siti, legge news e comunicati, compila schede standard
      e una mappa competitiva con long list e short list. Chiedi alla base di conoscenza in chat e ricevi ogni settimana le
      novità sulle aziende seguite.'
    en: 'Define a research thesis: an agent searches the web, visits company sites, reads news and press releases, builds
      standard company cards and a competitive map with long and short lists. Ask the knowledge base in chat and get weekly
      updates on followed companies.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12263f'
      accent: '#b8862b'
      background: '#f6f5f1'
      foreground: '#16202c'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: 'Mappa '
      color: primary
    - text: Mercati Privati
      color: accent
    width: wide
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Dati
        en: Data
      href: '#dati'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  limits:
  - action: run
    per: user
    max: 20
    window: day
    roles:
    - user
  egress:
    hosts:
    - '*.registry-provider.example'
    notes: 'Fornitore a pagamento di bilanci e registro imprese: il cliente collega la propria licenza; sostituire con l''host
      reale del fornitore scelto. / Paid financials and business-registry provider, the customer connects their own licence;
      replace with the real provider host.'
  agents:
  - key: mapper
    role: main
    description: Researches a thesis on the web, builds the long list, short list and competitive map, and saves the companies.
    profile:
      inline:
        display_name: Mappa Mercati Privati — thesis mapper
        crews:
        - id: mapper
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 60
          max_budget_usd: 3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You are a private-markets research analyst for funds, investment banks and corporate development.
            Given a research thesis, you run targeted web searches, visit company websites, read news and press releases,
            and extract for each company: activity, products, named customers, team size, headquarters, funding rounds and
            growth signals (hiring, new offices). Use the WebRobot MCP tools to search and scrape. Every fact needs a source
            URL; write ''n.d.'' when unknown and never invent figures. For each company that fits, save a record with the
            save_company tool on collection companies (fields: name, website, thesis, activity, products, customers, team_size,
            hq, funding, growth_signals, sources, status long|short, members as given). Where the user connected the registry
            provider, call registry_lookup for financials and company-registry data and mark them as ''provider data''; if
            not connected, say so and continue. Final report in the requested language, starting with a level-1 title ''#
            Mappa competitiva — <thesis in few words>''. Sections: ## Tesi e criteri, ## Long list (table: company, HQ, activity,
            size, source), ## Short list (5-10 companies with a 3-line rationale and risks), ## Mappa competitiva (segments
            and positioning; add a ```chart fenced block JSON {"type":"bar","title":"…","labels":[…],"series":[{"name":"…","values":[…]}]}
            with real figures only), ## Lacune e prossimi passi, ## Fonti. This is decision support, not investment advice.'
    context:
    - key: thesis_text
      from: collection:theses.description
    - key: members
      from: collection:theses.members
    goalTemplate: 'Thesis: {thesis}

      Description: {thesis_text}

      {?extra}Additional criteria: {extra}{/extra}

      Team members (copy into each saved company as members): {members}

      Target long list size: {depth}.

      Today is {date}. Write in the language with ISO code {lang}.'
    appTools:
    - name: save_company
      description: Save or update a company record
      action: write
      collection: companies
      scope: user
    - name: registry_lookup
      description: Financials and company-registry data from the customer's paid provider
      action: http
      http:
        method: GET
        url: https://{host}/v1/companies
        allowPath: true
        attribution: Registry data provider (customer's licence)
        credential:
          provider: registry_data
          header: Authorization
          format: Bearer {secret}
    output: markdown
    limits:
      maxTurns: 60
      maxBudgetUsd: 3
      timeoutSeconds: 1800
  - key: card_writer
    role: helper
    description: Builds the standard company card from a template, started for each company saved on the short list.
    profile:
      inline:
        display_name: Mappa Mercati Privati — company card
        crews:
        - id: card_writer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You produce one standard company card for a private company. Visit its website and search news and
            press releases with the WebRobot MCP. Start with ''# <Company> — scheda''. Fixed template, in this order: ## Sintesi,
            ## Attività e prodotti, ## Clienti citati, ## Team e sede, ## Finanziamenti, ## Segnali di crescita, ## Dati di
            bilancio (from registry_lookup if the user connected the provider, else say not connected), ## Rischi e punti
            da verificare, ## Fonti. Each fact with its source URL; ''n.d.'' when unknown; never invent figures. Then save
            the company with save_company, keeping the same name and members. Not investment advice.'
    goalTemplate: 'Build the standard company card.

      Team user: {team_emails}

      Today is {date}. Write in the language with ISO code {lang}.'
    context:
    - key: team_emails
      from: user.email
    appTools:
    - name: save_company
      description: Save or update a company record
      action: write
      collection: companies
      scope: user
    - name: registry_lookup
      description: Financials and company-registry data from the customer's paid provider
      action: http
      http:
        method: GET
        url: https://{host}/v1/companies
        allowPath: true
        attribution: Registry data provider (customer's licence)
        credential:
          provider: registry_data
          header: Authorization
          format: Bearer {secret}
    output: markdown
    limits:
      maxTurns: 30
      maxBudgetUsd: 1.5
  - key: kb_assistant
    role: helper
    description: Answers the analyst's questions over the team's knowledge base.
    profile:
      inline:
        display_name: Mappa Mercati Privati — knowledge base chat
        crews:
        - id: kb_assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You answer analysts' questions about the companies and theses of their team, using only the records
            returned by the search_companies and read_theses tools. Cite company names and source URLs. If the knowledge base
            does not contain the answer, say so and suggest launching a new research; never invent figures.
    goalTemplate: 'Conversation so far:

      {history}


      New question: {message}

      Answer in the language with ISO code {lang}.'
    appTools:
    - name: search_companies
      description: Search the team's companies
      action: search
      collection: companies
      scope: user
    - name: read_theses
      description: Read the team's theses
      action: read
      collection: theses
      scope: user
    output: markdown
  - key: watcher
    role: helper
    description: Weekly news on the companies followed for one thesis.
    memory: instance
    writesTo:
      collection: watch_updates
    profile:
      inline:
        display_name: Mappa Mercati Privati — weekly watcher
        crews:
        - id: watcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You monitor the companies of one thesis. Read the companies of that thesis with read_companies,
            then search news, press releases, careers pages and funding announcements from the last 7 days via the WebRobot
            MCP. Start with ''# <Thesis> — novità della settimana <date>''. Sections: ## Novità rilevanti (per company, with
            source URL), ## Nuovi segnali di crescita, ## Possibili nuovi ingressi nella long list, ## Nessuna novità (names
            only). Lead with what differs from your memory; at the end call remember once with the key points. Never invent
            facts.'
    appTools:
    - name: read_companies
      description: Read the user's companies
      action: read
      collection: companies
      scope: user
    output: markdown
  triggers:
  - key: card_on_shortlist
    description: Builds the standard card for each company added to the short list
    'on':
      collection: companies
      op: insert
      where:
        status: short
    start:
      agent: card_writer
    goal: 'Company: {record.name}

      Website: {record.website}

      Members (copy into the record): {record.members}

      Build the standard company card and update the record. Write in the language with ISO code {lang}.'
  templates:
  - key: thesis_watch
    title:
      it: Osservatorio tesi
      en: Thesis watch
    description:
      it: Ogni settimana le novità sulle aziende seguite per una tesi.
      en: Every week, news on the companies followed for a thesis.
    agent: watcher
    params:
    - name: thesis
      type: text
      required: true
      label:
        it: Tesi (nome)
        en: Thesis (name)
    goal: Watch the companies of thesis "{thesis}" ({instance}). Today is {date}. Write in the language with ISO code {lang}.
    schedule:
      cron: 0 6 * * 1
      userCanChange: true
    maxPerUser: 10
    deliver:
      to: owner
      onlyIfNew: true
  inputForm:
    title:
      it: Nuova ricerca su una tesi
      en: New thesis research
    fields:
    - name: thesis
      type: select
      required: true
      optionsFrom: collection:theses
      label:
        it: Tesi
        en: Thesis
      help:
        it: Crea prima la tesi nella pagina Tesi.
        en: Create the thesis first on the Theses page.
    - name: depth
      type: select
      required: true
      default: '30'
      label:
        it: Dimensione long list
        en: Long list size
      options:
      - value: '15'
        label: '15'
      - value: '30'
        label: '30'
      - value: '60'
        label: '60'
    - name: extra
      type: textarea
      maxLength: 600
      label:
        it: Criteri aggiuntivi (facoltativo)
        en: Additional criteria (optional)
  data:
    collections:
    - name: theses
      ownedBy: user
      description: Research theses of a team
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome
          en: Name
      - name: description
        type: textarea
        required: true
        label:
          it: Tesi di ricerca
          en: Research thesis
        help:
          it: es. aziende italiane di software verticale per la logistica, fatturato 5-50 M€
          en: e.g. Italian vertical logistics software companies, revenue €5-50M
      - name: members
        type: array
        label:
          it: Email dei membri del team
          en: Team member emails
      access:
      - role: user
        where:
          members: '{user.email}'
        can:
        - read
        - write
    - name: companies
      ownedBy: user
      searchable: true
      description: Company cards of the knowledge base
      fields:
      - name: name
        type: text
        required: true
      - name: website
        type: url
      - name: thesis
        type: text
      - name: activity
        type: textarea
      - name: products
        type: textarea
      - name: customers
        type: textarea
      - name: team_size
        type: text
      - name: hq
        type: text
      - name: funding
        type: textarea
      - name: growth_signals
        type: textarea
      - name: sources
        type: textarea
      - name: status
        type: select
        options:
        - long
        - short
      - name: members
        type: array
      access:
      - role: user
        where:
          members: '{user.email}'
        can:
        - read
        - write
    - name: watch_updates
      ownedBy: instance
      description: Weekly updates of each thesis watch
      retentionDays: 730
    credentials:
    - provider: registry_data
      kind: api_key
      scope: user
      label:
        it: Fornitore bilanci e registro imprese
        en: Financials and company-registry provider
      help:
        it: Incolla la chiave API della tua licenza (dal portale del fornitore).
        en: Paste the API key of your licence (from the provider's portal).
      hostLabel:
        it: api.tuofornitore.com
        en: api.yourprovider.com
  views:
  - key: home
    type: page
    nav: false
    sections:
    - type: hero
      eyebrow:
        it: Per fondi, banche d'affari e corporate development
        en: For funds, investment banks and corporate development
      title:
        it: Mappa i **mercati privati**, dalla tesi alla short list.
        en: Map **private markets**, from thesis to short list.
      text:
        it: 'Descrivi la tesi: l''agente cerca sul web, visita i siti, legge news e comunicati e compila schede standard e
          una mappa competitiva. Poi interroga la base di conoscenza in chat.'
        en: 'Describe your thesis: the agent searches the web, visits sites, reads news and press releases and builds standard
          cards and a competitive map. Then ask the knowledge base in chat.'
      actions:
      - label:
          it: Inizia
          en: Get started
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Definisci la tesi
          en: Define the thesis
        text:
          it: Settore, geografia, fatturato, criteri.
          en: Sector, geography, revenue, criteria.
        badge: '1'
      - title:
          it: L'agente ricerca
          en: The agent researches
        text:
          it: Attività, prodotti, clienti, team, sede, round e segnali di crescita, con fonti.
          en: Activity, products, customers, team, HQ, rounds and growth signals, with sources.
        badge: '2'
      - title:
          it: Mappa e schede
          en: Map and cards
        text:
          it: Long list, short list, mappa competitiva e scheda standard per azienda.
          en: Long list, short list, competitive map and standard card per company.
        badge: '3'
      - title:
          it: Segui nel tempo
          en: Follow over time
        text:
          it: Chat sulla base di conoscenza e novità ogni settimana.
          en: Chat on the knowledge base and weekly news.
        badge: '4'
    - type: cards
      id: dati
      title:
        it: Dati
        en: Data
      items:
      - title:
          it: Web pubblico
          en: Public web
        text:
          it: Siti aziendali, news, comunicati, pagine carriere.
          en: Company sites, news, press releases, careers pages.
      - title:
          it: Bilanci e registro imprese
          en: Financials and registry
        text:
          it: 'Dal tuo fornitore a pagamento, con la tua licenza: la chiave resta tua.'
          en: 'From your paid provider, with your licence: the key stays yours.'
      - title:
          it: Privacy del team
          en: Team privacy
        text:
          it: Ogni team vede solo le proprie tesi e aziende.
          en: Each team sees only its own theses and companies.
    - type: note
      content:
        it: Supporto alle decisioni, non consulenza di investimento. I dati vengono da fonti pubbliche citate e dal fornitore
          collegato dal cliente.
        en: Decision support, not investment advice. Data comes from cited public sources and from the provider the customer
          connects.
  - key: theses_form
    type: form
    title:
      it: Nuova tesi
      en: New thesis
    collection: theses
    submit:
      label:
        it: Salva tesi
        en: Save thesis
      message:
        it: Tesi salvata.
        en: Thesis saved.
      redirect: theses
    edit: true
    roles:
    - user
    - admin
  - key: theses
    type: table
    title:
      it: Tesi
      en: Theses
    source: collection:theses
    columns:
    - name
    - description
    - members
    roles:
    - user
    - admin
  - key: new_research
    type: new_run
    title:
      it: Nuova ricerca
      en: New research
    roles:
    - user
    - admin
  - key: research
    type: history
    title:
      it: Le mie ricerche
      en: My research
    source: run
    roles:
    - user
    - admin
  - key: map
    type: report
    title:
      it: Mappa competitiva
      en: Competitive map
    source: run
    printable: true
    nav: false
  - key: companies
    type: table
    title:
      it: Aziende
      en: Companies
    source: collection:companies
    columns:
    - name
    - hq
    - team_size
    - status
    - thesis
    - funding
    - growth_signals
    - website
    export: true
    roles:
    - user
    - admin
  - key: chat
    type: chat
    title:
      it: Chiedi alla base di conoscenza
      en: Ask the knowledge base
    source: agent:kb_assistant
    examples:
    - it: Quali aziende della short list hanno assunto di recente?
      en: Which short-list companies hired recently?
    - it: Confronta i clienti citati dalle prime tre aziende
      en: Compare the named customers of the top three companies
    placeholder:
      it: Fai una domanda sulle tue aziende…
      en: Ask about your companies…
    roles:
    - user
    - admin
  - key: watches
    type: instances
    template: thesis_watch
    title:
      it: Novità settimanali
      en: Weekly updates
    roles:
    - user
    - admin
  - key: updates
    type: list
    title:
      it: Storico novità
      en: Update history
    source: collection:watch_updates
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento e fornitore dati
      en: Subscription and data provider
    roles:
    - user
    - admin
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: annual
      price: 2400
      interval: year
      label:
        it: Analista — annuale per utente
        en: Analyst — annual per user
      includes:
      - Ricerche per tesi, schede, mappa competitiva
      - Chat sulla base di conoscenza
      - Novità settimanali
      roles:
      - user
  notifications:
    emailOnRunDone: true
  extensions:
  - key: search_engine
    description: 'Dedicated faceted search index with filters over companies (sector, size, HQ, funding): today companies
      are searchable and filterable through the table and the chat tool.'
  - key: provider_host
    description: The egress host and API path of the chosen registry/financials provider must be replaced with the real one
      before publishing.
