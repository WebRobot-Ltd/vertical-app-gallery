apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: mappa-mercati-privati
  displayName: Mappa Mercati Privati
  tagline:
    it: Intelligence sulle aziende non quotate, a partire dalla tua tesi.
    en: Private-company intelligence, starting from your thesis.
  description:
    it: 'Definisci una tesi di ricerca: un agente cerca sul web, visita i siti, legge news e comunicati, costruisce schede
      standard, una mappa competitiva con long e short list, e ogni settimana segnala le novità sulle aziende seguite.'
    en: 'Define a research thesis: an agent searches the web, visits company sites, reads news and press releases, builds
      standard company cards and a competitive map with long and short lists, and flags weekly news on the companies you follow.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#13294b'
      accent: '#b8862b'
      background: '#f6f7f9'
      foreground: '#16202e'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: 'Mappa '
      color: primary
    - text: Mercati Privati
      color: accent
    width: wide
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#how'
    - label:
        it: Cosa ottieni
        en: What you get
      href: '#features'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  limits:
  - action: run
    per: user
    max: 20
    window: day
    roles:
    - user
  - action: chat
    per: user
    max: 100
    window: day
    roles:
    - user
  agents:
  - key: researcher
    role: main
    when: mode == 'map'
    description: Researches a thesis on the web, saves each company found and writes the competitive map.
    profile:
      inline:
        display_name: Private markets researcher
        crews:
        - id: researcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 60
          max_budget_usd: 3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You are a private-markets research analyst working for funds, investment banks and corporate development
            teams. Given a research thesis, you (1) run targeted web searches through the WebRobot MCP to find non-listed
            companies matching it; (2) visit each company''s website and read recent news and press releases; (3) extract
            for each company: activity, products, named clients, team size, headquarters, funding rounds, growth signals (hiring,
            new offices); (4) save every company with the tool save_company (fields: name, website, thesis, country, activity,
            products, clients, team_size, hq, funding, growth_signals, status long|short, sources). Use only facts found in
            sources; write ''n/d'' when unknown and never invent revenue or funding figures. Revenue/registry data come from
            a paid provider the customer has not connected: do not estimate revenue, flag it as ''to verify''. Final report
            in Markdown, starting with a level-1 title ''# Mappa competitiva — <thesis in few words>''. Sections: ## Tesi
            e criteri, ## Long list (table: company, HQ, activity, team, funding, signals, source), ## Short list (5-10 companies
            with a 2-line rationale each), ## Mappa competitiva (positioning clusters and a chart block), ## Lacune e rischi
            da verificare, ## Fonti. For comparisons add a fenced ```chart block with JSON {type,title,labels,series,unit}
            using real figures only. This is research support, not investment advice.'
    appTools:
    - name: save_company
      description: Save or update a company record for this user
      action: write
      collection: companies
      scope: user
    - name: list_companies
      description: List companies already saved by this user
      action: read
      collection: companies
      scope: user
    - name: save_thesis
      description: Save the thesis being researched
      action: write
      collection: theses
      scope: user
    context: []
    goalTemplate: 'Thesis: {thesis}

      Sector: {sector}

      Country/area: {country}

      {?rev_min}Revenue from {rev_min} M EUR{/rev_min} {?rev_max}to {rev_max} M EUR{/rev_max}

      {?notes}Notes: {notes}{/notes}

      Target: a long list of at least 20 companies and a short list. Today is {date}. Write the report in the language with
      ISO code {lang}.'
    output: markdown
    limits:
      maxTurns: 60
      maxBudgetUsd: 3
  - key: profiler
    role: main
    when: mode == 'card'
    description: Builds the standard company card from a template.
    profile:
      inline:
        display_name: Company card analyst
        crews:
        - id: profiler
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You produce a standard company card for one non-listed company, using the WebRobot MCP to visit
            its website and search recent news and press releases. Start with ''# Scheda — <Company>''. Fixed template, in
            this order, with ## headings: Sintesi (3 lines), Attività e prodotti, Clienti citati, Team e sede, Finanziamenti
            e azionisti, Segnali di crescita (hiring, new offices, partnerships), Posizionamento competitivo, Dati di bilancio
            e registro imprese (write ''non collegato: da verificare'' unless provided by the user), Rischi e punti da verificare,
            Fonti (URLs with dates). Never invent figures; write ''n/d'' when missing. Save the company with save_company
            when done. Not investment advice.'
    appTools:
    - name: save_company
      description: Save or update a company record for this user
      action: write
      collection: companies
      scope: user
    goalTemplate: 'Company: {company}

      {?website}Website: {website}{/website}

      Thesis context: {thesis}

      Today is {date}. Write the card in the language with ISO code {lang}.'
    output: markdown
    limits:
      maxTurns: 30
      maxBudgetUsd: 1.5
  - key: analyst
    role: helper
    description: Answers the analyst's questions on the knowledge base of their own companies and theses.
    profile:
      inline:
        display_name: Knowledge base analyst
        crews:
        - id: analyst
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You answer questions about the user's own saved theses, companies and weekly updates, using only
            the tools search_companies, list_theses and list_updates. Compare, rank and filter companies when asked, cite
            company names and sources saved in the records, and say clearly when the data does not contain the answer. Never
            invent figures. Short, direct answers; tables when comparing.
    appTools:
    - name: search_companies
      description: Search the user's companies
      action: search
      collection: companies
      scope: user
    - name: list_theses
      description: List the user's theses
      action: read
      collection: theses
      scope: user
    - name: list_updates
      description: List the user's weekly updates
      action: read
      collection: watch_updates
      scope: user
    goalTemplate: 'Conversation so far:

      {history}


      New question: {message}

      Answer in the language with ISO code {lang}.'
    output: markdown
  - key: watcher
    role: scheduled
    description: 'Weekly: news on the companies followed in one thesis.'
    memory: instance
    profile:
      inline:
        display_name: Weekly company watcher
        crews:
        - id: watcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You monitor a list of non-listed companies for one analyst. Each week use the WebRobot MCP to check
            their sites, news and press releases for new funding rounds, hires, openings, clients, partnerships, M&A or management
            changes in the last 7 days. Start with ''# Novità — <thesis> — settimana del <date>''. Sections: ## Novità rilevanti
            (per company, with source and date), ## Nessuna novità (names only), ## Da approfondire. Never invent; if nothing
            changed say so. Your memory holds what you reported last time: do not repeat it. At the end call remember once
            with the key points of this report.'
    writesTo:
      collection: watch_updates
    goalTemplate: 'Weekly watch. Thesis: {thesis}. The followed companies are listed in the task. Today is {date}.'
    output: markdown
    limits:
      maxTurns: 30
      maxBudgetUsd: 1.5
  templates:
  - key: company_watch
    title:
      it: Osservatorio aziende
      en: Company watch
    description:
      it: Ogni settimana le novità sulle aziende che segui.
      en: Weekly news on the companies you follow.
    agent: watcher
    params:
    - name: thesis
      type: text
      required: true
      label:
        it: Tesi
        en: Thesis
    - name: companies
      type: textarea
      required: true
      maxLength: 1500
      label:
        it: Aziende seguite (una per riga, con sito)
        en: Followed companies (one per line, with site)
    goal: 'Watch "{instance}". Thesis: {thesis}. Companies: {companies}. Today is {date}. Write in the language with ISO code
      {lang}.'
    schedule:
      cron: 0 6 * * 1
      userCanChange: true
    maxPerUser: 10
    cost:
      perRun: 20
  inputForm:
    title:
      it: Nuova ricerca
      en: New research
    fields:
    - name: mode
      type: select
      required: true
      default: map
      label:
        it: Cosa vuoi
        en: What you want
      options:
      - value: map
        label:
          it: Mappa competitiva di una tesi
          en: Competitive map of a thesis
      - value: card
        label:
          it: Scheda di una singola azienda
          en: Single company card
    - name: thesis
      type: textarea
      required: true
      maxLength: 600
      label:
        it: Tesi di ricerca
        en: Research thesis
      help:
        it: es. aziende italiane di software verticale per la logistica
        en: e.g. Italian vertical software companies for logistics
    - name: sector
      type: text
      visibleWhen: mode == 'map'
      label:
        it: Settore
        en: Sector
    - name: country
      type: text
      visibleWhen: mode == 'map'
      default: Italia
      label:
        it: Paese / area
        en: Country / area
    - name: rev_min
      type: number
      visibleWhen: mode == 'map'
      label:
        it: Fatturato min (M€)
        en: Min revenue (M€)
    - name: rev_max
      type: number
      visibleWhen: mode == 'map'
      label:
        it: Fatturato max (M€)
        en: Max revenue (M€)
    - name: company
      type: text
      visibleWhen: mode == 'card'
      label:
        it: Azienda
        en: Company
    - name: website
      type: url
      visibleWhen: mode == 'card'
      label:
        it: Sito web
        en: Website
    - name: notes
      type: textarea
      maxLength: 500
      label:
        it: Note (facoltative)
        en: Notes (optional)
    examples:
    - mode: map
      thesis: Aziende italiane di software verticale per la logistica
      sector: Software logistica
      country: Italia
      rev_min: 5
      rev_max: 50
  data:
    collections:
    - name: theses
      ownedBy: user
      sharing:
      - viewer
      - editor
      description: Research theses of each user
      fields:
      - name: title
        type: text
      - name: criteria
        type: textarea
      - name: country
        type: text
    - name: companies
      ownedBy: user
      searchable: true
      sharing:
      - viewer
      - editor
      description: Companies found by the agents, searchable knowledge base
      fields:
      - name: name
        type: text
      - name: website
        type: url
      - name: thesis
        type: text
      - name: country
        type: text
      - name: activity
        type: textarea
      - name: products
        type: textarea
      - name: clients
        type: textarea
      - name: team_size
        type: text
      - name: hq
        type: text
      - name: funding
        type: textarea
      - name: growth_signals
        type: textarea
      - name: status
        type: select
        options:
        - long
        - short
      - name: sources
        type: textarea
    - name: watch_updates
      ownedBy: instance
      description: Weekly updates of each company watch
  views:
  - key: home
    type: page
    nav: false
    title: Mappa Mercati Privati
    sections:
    - type: hero
      layout: stack
      band: true
      eyebrow:
        it: Per fondi, banche d'affari e corporate development
        en: For funds, investment banks and corporate development
      title:
        it: Mappa le **aziende non quotate** della tua tesi
        en: Map the **private companies** of your thesis
      text:
        it: Un agente cerca sul web, visita i siti, legge news e comunicati e ti consegna schede standard, long list, short
          list e mappa competitiva. Ogni settimana, le novità sulle aziende che segui.
        en: An agent searches the web, visits sites, reads news and press releases and delivers standard cards, long and short
          lists and a competitive map. Every week, news on the companies you follow.
      actions:
      - label:
          it: Inizia una ricerca
          en: Start a research
        href: /v/new_run
        style: primary
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: ghost
    - type: steps
      id: how
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Definisci la tesi
          en: Define the thesis
        text:
          it: Settore, paese, fascia di fatturato.
          en: Sector, country, revenue range.
        badge: 🎯
      - title:
          it: L'agente ricerca
          en: The agent researches
        text:
          it: Ricerche mirate, siti, news, comunicati.
          en: Targeted searches, sites, news, press releases.
        badge: 🔎
      - title:
          it: Interroga la base
          en: Query the base
        text:
          it: Filtra le aziende e fai domande in chat.
          en: Filter companies and ask questions in chat.
        badge: 💬
      - title:
          it: Segui le novità
          en: Follow news
        text:
          it: Un report settimanale sulle aziende seguite.
          en: A weekly report on followed companies.
        badge: 📬
    - type: cards
      id: features
      title:
        it: Cosa ottieni
        en: What you get
      items:
      - title:
          it: Scheda standard
          en: Standard card
        text:
          it: Attività, prodotti, clienti, team, sede, round, segnali di crescita.
          en: Activity, products, clients, team, HQ, rounds, growth signals.
      - title:
          it: Mappa competitiva
          en: Competitive map
        text:
          it: Long list, short list e posizionamento.
          en: Long list, short list and positioning.
      - title:
          it: Privato per team
          en: Private per team
        text:
          it: Ogni utente vede solo le proprie tesi; condivisione su invito.
          en: Each user sees only their own theses; sharing by invitation.
    - type: note
      content:
        it: Supporto alla ricerca, non consulenza di investimento. I dati di bilancio e registro imprese richiedono la licenza
          del fornitore del cliente.
        en: Research support, not investment advice. Financial and registry data require the customer's own provider licence.
  - key: new_run
    type: new_run
    title:
      it: Nuova ricerca
      en: New research
    roles:
    - user
    - admin
  - key: history
    type: history
    title:
      it: Le mie ricerche
      en: My research
    source: run
    roles:
    - user
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: companies
    type: table
    title:
      it: Aziende
      en: Companies
    source: collection:companies
    roles:
    - user
    - admin
    data:
      display: table
      fields:
      - key: name
        label:
          it: Azienda
          en: Company
      - key: thesis
        label:
          it: Tesi
          en: Thesis
      - key: country
        label:
          it: Paese
          en: Country
        format: badge
      - key: hq
        label: HQ
      - key: team_size
        label: Team
      - key: funding
        label:
          it: Round
          en: Funding
      - key: growth_signals
        label:
          it: Segnali
          en: Signals
      - key: status
        label: Status
        format: badge
      - key: website
        label: Web
        format: link
      limit: 200
      empty:
        it: 'Nessuna azienda ancora: avvia una ricerca.'
        en: 'No companies yet: start a research.'
  - key: ask
    type: chat
    title:
      it: Chiedi alla base
      en: Ask the base
    source: agent:analyst
    placeholder:
      it: Es. quali aziende della short list hanno assunto di recente?
      en: E.g. which short-list companies hired recently?
    examples:
    - it: Confronta le aziende della short list per dimensione del team
      en: Compare short-list companies by team size
    - it: Chi ha ricevuto un round negli ultimi 12 mesi?
      en: Who raised a round in the last 12 months?
    roles:
    - user
    - admin
  - key: watches
    type: instances
    template: company_watch
    title:
      it: Osservatorio
      en: Watch
    roles:
    - user
    - admin
  - key: updates
    type: table
    title:
      it: Novità settimanali
      en: Weekly updates
    source: collection:watch_updates
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - user
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 0
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
      - browser
    costs:
      agent:researcher:
        estimate: 300
        metered: true
        requiresPlan: analyst_year
      agent:profiler:
        estimate: 100
        metered: true
        requiresPlan: analyst_year
      chat:
        estimate: 5
        metered: true
        requiresPlan: analyst_year
    packs:
    - key: topup
      credits: 5000
      price: 50
      label: Top-up
    plans:
    - key: analyst_year
      price: 2400
      interval: year
      label:
        it: Analista — annuale per utente
        en: Analyst — yearly per user
      includes:
      - research, cards, chat, weekly watch
      credits: 10000
      creditsReset: monthly
      roles:
      - user
  extensions:
  - key: registry_financials_provider
    description: 'Balance-sheet and company-registry data from a paid API provider connected with each customer''s own licence:
      not available yet (connectors needing customer credentials). For now the agents mark these data as ''to verify''.'
  - key: team_workspaces
    description: 'Team-level sharing: today each user sees only their own theses, with per-record invitations (viewer/editor)
      for colleagues; organisation-wide team workspaces are not available.'
  - key: search_engine_filters
    description: The indexed search with facets is served by the searchable companies collection and its table view; advanced
      facet filters would need a dedicated search index.
  - key: email_digest
    description: Weekly news is shown in the app; email delivery of the digest is not available yet.
