apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: avanzozero
  displayName: AvanzoZero
  tagline:
    it: Meno scarti in cucina, più margine e un bilancio di sostenibilità solido.
    en: Less kitchen waste, better margins, and solid sustainability reporting.
  description:
    it: 'Software per mense, ristoranti e hotel: raccoglie le pesate degli scarti (da bilance smart o a mano), le incrocia
      con menù e coperti, stima costi ed emissioni evitabili e propone correzioni da approvare.'
    en: 'Software for canteens, restaurants and hotels: collects waste weigh-ins (from smart scales or by hand), crosses them
      with menus and covers, estimates avoidable cost and emissions and proposes corrections for approval.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: dashboard
  branding:
    theme: light
    palette:
      primary: '#1f4d3a'
      accent: '#e07a2f'
      background: '#f6f8f4'
      foreground: '#17231d'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Avanzo
      color: primary
    - text: Zero
      color: accent
    width: wide
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#how'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: manager
      label:
        it: Responsabile cucina
        en: Kitchen manager
      assignedBy: signup
    - key: staff
      label:
        it: Addetto
        en: Kitchen staff
      assignedBy: invite
    - key: direction
      label:
        it: Direzione
        en: Management
      assignedBy: derived
      from: collection:sites.direction_email
  limits:
  - action: create:sites
    max: 1
    window: total
    plans:
      sedi_5: 5
      sedi_20: 20
  agents:
  - key: analyst
    role: scheduled
    description: Crosses waste, menus and real covers; finds worst dishes and critical days; estimates avoidable cost and
      CO2e.
    memory: instance
    writesTo:
      collection: insights
      parse: json_last
      keyBy: week
    output: markdown+json
    resultSchema:
      type: object
      properties:
        week:
          type: string
        site:
          type: string
        total_kg:
          type: number
        avoidable_cost_eur:
          type: number
        avoidable_co2e_kg:
          type: number
        top_dishes:
          type: string
        critical_days:
          type: string
        summary:
          type: string
    appTools:
    - name: read_waste
      description: Read waste weigh-ins of the user's sites
      action: read
      collection: waste_logs
      scope: user
    - name: read_menu
      description: Read menu items with portions and cost per portion
      action: read
      collection: menu_items
      scope: user
    - name: read_covers
      description: Read planned and actual covers per day
      action: read
      collection: covers
      scope: user
    - name: read_factors
      description: Read emission factors (kg CO2e per kg of food) by category
      action: read
      collection: emission_factors
      scope: all
    profile:
      inline:
        display_name: AvanzoZero analyst
        crews:
        - id: analyst
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 14
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are a food-waste analyst for one site (canteen, restaurant or hotel). Use the tools to read
            the last 7 days of waste, menu items, covers and emission factors for the given site only. Compute waste per cover,
            rank dishes by leftover (kg and share of prepared portions), flag critical days (waste per cover well above the
            site average), estimate avoidable cost (kg wasted converted to portions x cost per portion, counting only the
            avoidable share: plate and preparation waste, not peels/bones) and avoidable CO2e using the factors. Never invent
            figures: if data is missing, say so and lower confidence. Report starts with a level-1 title ''# <Site> — week
            of <date>'', then ## Headlines, ## Worst dishes (table), ## Critical days, ## Cost and emissions. Add a ```chart
            block with waste kg per day. Finish with a final JSON object matching the result schema (week as YYYY-Www). Use
            the memory tool ''remember'' with 5 key points. Write in the requested language.'
  - key: planner
    role: scheduled
    description: Proposes weekly corrections and next-day quantities; waits for the manager's approval.
    memory: instance
    awaits:
    - plan_ok
    writesTo:
      collection: corrections
      parse: json_last
      keyBy: week
    output: markdown+json
    resultSchema:
      type: object
      properties:
        week:
          type: string
        site:
          type: string
        portion_changes:
          type: string
        next_day_quantities:
          type: string
        dish_replacements:
          type: string
        expected_saving_eur:
          type: number
        summary:
          type: string
    appTools:
    - name: read_insights
      description: Read the weekly insights of the sites
      action: read
      collection: insights
      scope: all
    - name: read_menu
      description: Read menu items with portions and cost per portion
      action: read
      collection: menu_items
      scope: user
    - name: read_covers
      description: Read planned and actual covers per day
      action: read
      collection: covers
      scope: user
    profile:
      inline:
        display_name: AvanzoZero planner
        crews:
        - id: planner
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 14
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You propose concrete weekly corrections for one site''s kitchen based on the latest insights, menus
            and covers. Give: portion reductions (dish, from g to g), quantities to prepare for the next days (dish, portions,
            based on expected covers and the observed waste ratio), dishes to replace (with a reason and a lower-waste alternative
            of similar cost). Be specific and conservative, estimate the saving only from data you read, never invent figures.
            Start with ''# <Site> — correction plan week of <date>''. Then call the request_plan_ok tool with a short summary
            so the manager approves before it becomes the production plan. Finish with the JSON result. Write in the requested
            language.'
  - key: publisher
    role: helper
    description: Turns the approved corrections into the production plan.
    appTools:
    - name: read_corrections
      description: Read the proposed corrections
      action: read
      collection: corrections
      scope: all
    - name: write_plan
      description: Save rows of the production plan
      action: write
      collection: production_plan
      scope: user
    profile:
      inline:
        display_name: AvanzoZero publisher
        crews:
        - id: publisher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'An approved correction plan must become the production plan. Read the latest corrections for the
            site and save one production_plan row per dish and day with the tool write_plan: site, date, dish, portions_to_prepare,
            portion_g, note. Use only what was approved; invent nothing. Reply with a short summary of the rows saved.'
  - key: reporter
    role: scheduled
    description: Monthly management report for sustainability reporting.
    memory: instance
    writesTo:
      collection: monthly_reports
      parse: whole
    output: markdown
    appTools:
    - name: read_insights
      description: Read the weekly insights of the sites
      action: read
      collection: insights
      scope: all
    - name: read_waste
      description: Read waste weigh-ins of the user's sites
      action: read
      collection: waste_logs
      scope: user
    profile:
      inline:
        display_name: AvanzoZero reporter
        crews:
        - id: reporter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write the monthly food-waste report for the management of one site, usable for the sustainability
            report. Start with ''# <Site> — food waste report <month year>''. Sections: ## Executive summary, ## Key figures
            (table: total kg, kg per cover, avoidable cost EUR, avoidable CO2e kg, change vs previous month), ## Trend by
            week, ## Worst dishes, ## Actions taken and results, ## Methodology and limits (data sources: smart scales or
            manual entries, emission factors used, estimates are estimates). Add a ```chart block with weekly kg. Real figures
            only from the tools; say plainly when data is incomplete. Write in the requested language.'
  inputForm:
    title:
      it: Pesata rapida
      en: Quick weigh-in
    fields:
    - name: note
      type: text
      label: Note
  data:
    collections:
    - name: sites
      description: Sites of the customer
      ownedBy: user
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Sede
          en: Site
      - name: kind
        type: select
        options:
        - value: canteen
          label:
            it: Mensa aziendale
            en: Corporate canteen
        - value: school
          label:
            it: Mensa scolastica
            en: School canteen
        - value: restaurant
          label:
            it: Ristorante
            en: Restaurant
        - value: hotel
          label: Hotel
      - name: city
        type: city
      - name: direction_email
        type: email
        label:
          it: Email direzione
          en: Management email
      - name: members
        type: array
        label:
          it: Email del team (addetti, direzione)
          en: Team emails (staff, management)
      access:
      - role: user
        where:
          members: '{user.email}'
        can:
        - read
    - name: menu_items
      description: 'Weekly menus: dish, portion and cost per portion'
      ownedBy: user
      fields:
      - name: site
        type: select
        optionsFrom: collection:sites
        required: true
      - name: date
        type: date
        required: true
      - name: meal
        type: select
        options:
        - lunch
        - dinner
        - breakfast
      - name: dish
        type: text
        required: true
      - name: portion_g
        type: number
        required: true
      - name: cost_per_portion
        type: number
        required: true
      - name: members
        type: array
      access:
      - role: user
        where:
          members: '{user.email}'
        can:
        - read
    - name: covers
      description: Planned and actual covers per day
      ownedBy: user
      fields:
      - name: site
        type: select
        optionsFrom: collection:sites
        required: true
      - name: date
        type: date
        required: true
      - name: expected
        type: number
        required: true
      - name: actual
        type: number
      - name: members
        type: array
      access:
      - role: user
        where:
          members: '{user.email}'
        can:
        - read
        - write
    - name: waste_logs
      description: Waste weigh-ins by category and dish, from devices or manual
      ownedBy: user
      retentionDays: 1095
      fields:
      - name: site
        type: select
        optionsFrom: collection:sites
        required: true
      - name: date
        type: date
        required: true
      - name: dish
        type: text
      - name: category
        type: select
        required: true
        options:
        - value: plate
          label:
            it: Avanzi nel piatto
            en: Plate leftovers
        - value: preparation
          label:
            it: Eccedenze di produzione
            en: Overproduction
        - value: spoilage
          label:
            it: Scaduti
            en: Spoilage
        - value: peels
          label:
            it: Scarti di lavorazione
            en: Peels and trimmings
      - name: kg
        type: number
        required: true
      - name: source
        type: select
        options:
        - device
        - manual
      - name: device_id
        type: text
      - name: members
        type: array
      access:
      - role: user
        where:
          members: '{user.email}'
        can:
        - read
        - write
    - name: emission_factors
      description: kg CO2e per kg of food by category (reference values)
      ownedBy: shared
      fields:
      - name: category
        type: text
      - name: kg_co2e_per_kg
        type: number
      - name: source
        type: text
    - name: insights
      description: Weekly analysis per site
      ownedBy: instance
      fields:
      - name: week
        type: text
      - name: site
        type: text
      - name: total_kg
        type: number
      - name: avoidable_cost_eur
        type: number
      - name: avoidable_co2e_kg
        type: number
      - name: top_dishes
        type: text
      - name: critical_days
        type: text
      - name: summary
        type: textarea
    - name: corrections
      description: Proposed weekly corrections
      ownedBy: instance
      fields:
      - name: week
        type: text
      - name: site
        type: text
      - name: portion_changes
        type: textarea
      - name: next_day_quantities
        type: textarea
      - name: dish_replacements
        type: textarea
      - name: expected_saving_eur
        type: number
      - name: summary
        type: textarea
    - name: production_plan
      description: Approved production plan
      ownedBy: user
      fields:
      - name: site
        type: text
      - name: date
        type: date
      - name: dish
        type: text
      - name: portions_to_prepare
        type: number
      - name: portion_g
        type: number
      - name: note
        type: text
      - name: members
        type: array
      access:
      - role: user
        where:
          members: '{user.email}'
        can:
        - read
    - name: monthly_reports
      description: Monthly management reports
      ownedBy: instance
  templates:
  - key: site_weekly
    title:
      it: Analisi e correzioni settimanali
      en: Weekly analysis and corrections
    description:
      it: 'Per ogni sede: analisi degli scarti ogni lunedì.'
      en: 'Per site: waste analysis every Monday.'
    agent: analyst
    params:
    - name: site
      type: text
      required: true
      label:
        it: Sede
        en: Site
    goal: Analyse site "{site}" for the last 7 days. Today is {date}. Write in the language with ISO code {lang}.
    schedule:
      cron: 0 5 * * 1
      userCanChange: true
    maxPerUser: 5
  - key: site_plan
    title:
      it: Piano correttivo settimanale
      en: Weekly correction plan
    agent: planner
    params:
    - name: site
      type: text
      required: true
      label:
        it: Sede
        en: Site
    goal: Propose the correction plan for site "{site}". Today is {date}. Write in the language with ISO code {lang}.
    schedule:
      cron: 0 7 * * 1
      userCanChange: true
    maxPerUser: 5
  - key: site_monthly
    title:
      it: Report mensile direzione
      en: Monthly management report
    agent: reporter
    params:
    - name: site
      type: text
      required: true
      label:
        it: Sede
        en: Site
    goal: Write the monthly report of the previous month for site "{site}". Today is {date}. Write in the language with ISO
      code {lang}.
    schedule:
      cron: 0 6 1 * *
      userCanChange: false
    maxPerUser: 5
    deliver:
      to:
      - owner
      - role:direction
      subject:
        it: Report mensile sprechi — {title}
        en: Monthly waste report — {title}
      onlyIfNew: true
  approvals:
  - key: plan_ok
    title:
      it: Approva il piano correttivo
      en: Approve the correction plan
    decidedBy: requester
    fields:
    - summary
    timeoutMinutes: 10080
  triggers:
  - key: device_weigh
    'on':
      webhook: true
    write:
      collection: waste_logs
      fields:
        site: site
        date: date
        dish: dish
        category: category
        kg: kg
        device_id: device_id
        source: source
      keyBy: device_id
    description: Weigh-ins from the supplier's smart scales and bins
  - key: plan_approved
    'on':
      approval: plan_ok
      decision: approved
    start:
      agent: publisher
    goal: 'The correction plan was approved. Event: {event}. Turn it into the production plan.'
  views:
  - key: home
    type: page
    nav: false
    sections:
    - type: hero
      title:
        it: Porta gli **scarti** a zero, un piatto alla volta.
        en: Bring **waste** to zero, one dish at a time.
      text:
        it: 'Pesate da bilance smart o inserite a mano, incrociate con menù e coperti: i piatti più avanzati, il costo e le
          emissioni evitabili, e correzioni che approvi tu.'
        en: 'Weigh-ins from smart scales or manual entries, crossed with menus and covers: the most wasted dishes, avoidable
          cost and emissions, and corrections you approve.'
      actions:
      - label:
          it: Inizia
          en: Start
        href: /login
        style: primary
    - type: steps
      id: how
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Registra sedi e menù
          en: Set up sites and menus
        text:
          it: Piatti, porzioni, costo per porzione e coperti previsti.
          en: Dishes, portions, cost per portion and expected covers.
      - title:
          it: Arrivano le pesate
          en: Weigh-ins arrive
        text:
          it: Dai dispositivi del fornitore o da un modulo rapido.
          en: From the supplier's devices or a quick form.
      - title:
          it: Analisi e correzioni
          en: Analysis and corrections
        text:
          it: Ogni settimana le proposte, tu approvi e diventano piano di produzione.
          en: Weekly proposals; you approve and they become the production plan.
      - title:
          it: Report alla direzione
          en: Management report
        text:
          it: PDF mensile e dashboard per il bilancio di sostenibilità.
          en: Monthly PDF and dashboard for the sustainability report.
    - type: note
      content:
        it: 'Le stime di costo ed emissioni sono indicative. Le bilance sono hardware del fornitore: qui arrivano i loro dati.'
        en: 'Cost and emission figures are estimates. Scales are supplier hardware: only their data arrives here.'
  - key: sites_form
    type: form
    collection: sites
    title:
      it: Nuova sede
      en: New site
    fields:
    - name
    - kind
    - city
    - direction_email
    - members
    submit:
      label:
        it: Salva sede
        en: Save site
      message:
        it: Sede salvata
        en: Site saved
    roles:
    - manager
    - admin
  - key: sites_list
    type: list
    source: collection:sites
    title:
      it: Le mie sedi
      en: My sites
    roles:
    - manager
    - admin
  - key: menu_form
    type: form
    collection: menu_items
    title:
      it: Menù
      en: Menu
    submit:
      label:
        it: Aggiungi piatto
        en: Add dish
      message:
        it: Piatto salvato
        en: Dish saved
    roles:
    - manager
    - admin
  - key: menu_table
    type: table
    source: collection:menu_items
    title:
      it: Piatti in menù
      en: Menu items
    columns:
    - date
    - site
    - dish
    - portion_g
    - cost_per_portion
    export: true
    roles:
    - manager
    - admin
  - key: covers_form
    type: form
    collection: covers
    title:
      it: Coperti
      en: Covers
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Coperti salvati
        en: Covers saved
    edit: true
    roles:
    - manager
    - staff
    - admin
  - key: waste_form
    type: form
    collection: waste_logs
    title:
      it: Pesata rapida
      en: Quick weigh-in
    submit:
      label:
        it: Registra
        en: Record
      message:
        it: Pesata registrata
        en: Weigh-in recorded
    roles:
    - manager
    - staff
    - admin
  - key: waste_table
    type: table
    source: collection:waste_logs
    title:
      it: Pesate
      en: Weigh-ins
    columns:
    - date
    - site
    - dish
    - category
    - kg
    - source
    export: true
    roles:
    - manager
    - staff
    - direction
    - admin
  - key: trend_chart
    type: chart
    source: collection:waste_logs
    title:
      it: Scarti per settimana
      en: Waste per week
    nav: false
    data:
      display: chart
      chart: line
      fields:
      - key: date
        label: Week
      - key: kg
        label: kg
        format: number
      groupBy:
        field: date
        bucket: week
        aggs:
        - key: kg
          agg: sum
          field: kg
  - key: site_chart
    type: chart
    source: collection:waste_logs
    title:
      it: Scarti per sede
      en: Waste by site
    nav: false
    data:
      display: chart
      chart: bar
      fields:
      - key: site
        label:
          it: Sede
          en: Site
      - key: kg
        label: kg
        format: number
      groupBy:
        field: site
        aggs:
        - key: kg
          agg: sum
          field: kg
  - key: insights_table
    type: table
    source: collection:insights
    title:
      it: Analisi settimanali
      en: Weekly insights
    columns:
    - week
    - site
    - total_kg
    - avoidable_cost_eur
    - avoidable_co2e_kg
    - top_dishes
    - critical_days
    export: true
    nav: false
  - key: dashboard
    type: dashboard
    title:
      it: Andamento per sede
      en: Trend by site
    children:
    - trend_chart
    - site_chart
    - insights_table
    roles:
    - manager
    - direction
    - admin
  - key: corrections_table
    type: table
    source: collection:corrections
    title:
      it: Correzioni proposte
      en: Proposed corrections
    columns:
    - week
    - site
    - portion_changes
    - next_day_quantities
    - dish_replacements
    - expected_saving_eur
    roles:
    - manager
    - admin
  - key: approvals
    type: approvals
    approvals:
    - plan_ok
    title:
      it: Approvazioni
      en: Approvals
    roles:
    - manager
    - admin
  - key: plan_table
    type: table
    source: collection:production_plan
    title:
      it: Piano di produzione
      en: Production plan
    columns:
    - date
    - site
    - dish
    - portions_to_prepare
    - portion_g
    - note
    export: true
    roles:
    - manager
    - staff
    - admin
  - key: watches
    type: instances
    template: site_weekly
    title:
      it: Analisi per sede
      en: Per-site analysis
    roles:
    - manager
    - admin
  - key: plans
    type: instances
    template: site_plan
    title:
      it: Piani per sede
      en: Per-site plans
    roles:
    - manager
    - admin
  - key: monthly
    type: instances
    template: site_monthly
    title:
      it: Report mensili
      en: Monthly reports
    roles:
    - manager
    - direction
    - admin
  - key: monthly_report
    type: report
    source: collection:monthly_reports
    printable: true
    nav: false
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - manager
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: sedi_1
      price: 49
      interval: month
      label:
        it: 1 sede
        en: 1 site
      includes:
      - 1 site
    - key: sedi_5
      price: 199
      interval: month
      label:
        it: Fino a 5 sedi
        en: Up to 5 sites
      includes:
      - 5 sites
    - key: sedi_20
      price: 649
      interval: month
      label:
        it: Fino a 20 sedi
        en: Up to 20 sites
      includes:
      - 20 sites
  notifications:
    emailOnRunDone: false
