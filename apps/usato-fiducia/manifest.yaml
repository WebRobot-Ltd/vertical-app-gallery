apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: auto-garantite
  displayName: Auto Garantite
  tagline:
    it: 'Auto usate garantite: scegli con un consulente AI, prenota e acquista online.'
  description:
    it: 'Il portale che presenta il catalogo di auto usate garantite con scheda tecnica, chilometraggio, prezzo ed esito dei
      controlli, e gestisce la trattativa: chat con un consulente AI, confronto modelli, rata del finanziamento, appuntamento
      o avvio dell''acquisto con un operatore dedicato.'
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#12304a'
      accent: '#d9531e'
      background: '#f6f7f9'
      foreground: '#161c22'
    fonts:
      body: Inter
      display: Outfit
    wordmark:
    - text: Auto
      color: primary
    - text: Garantite
      color: accent
    width: wide
  header:
    links:
    - label: Come funziona
      href: '#come-funziona'
    - label: Catalogo
      href: /v/catalogo
    cta:
      label: Parla con il consulente
      href: /v/consulente
  auth:
    method: magic_link
    anonymous:
      views:
      - home
      - catalogo
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: operator
      label: Operatore
      assignedBy: invite
    - key: user
      label: Cliente
      assignedBy: signup
  limits:
  - action: chat
    per: user
    max: 60
    window: day
    roles:
    - user
  agents:
  - key: advisor
    role: main
    description: Consulente che aiuta a scegliere, confronta modelli, calcola la rata e avvia appuntamento o pratica.
    memory: user
    awaits:
    - presa_in_carico
    profile:
      inline:
        display_name: Consulente Auto Garantite
        chat_mode: true
        crews:
        - id: advisor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei il consulente di un servizio di auto usate garantite. Parli in italiano, in modo cordiale e
            chiaro. Lavori SOLO sul catalogo reale: usa lo strumento search_vehicles per cercare per budget, alimentazione,
            cambio, chilometraggio ed esigenze; non inventare mai veicoli, prezzi, chilometraggi, esiti dei controlli o garanzie.
            Mostra i veicoli trovati con show_vehicles. Se il cliente chiede un confronto di due o tre modelli, presenta una
            tabella Markdown (prezzo, anno, km, alimentazione, esito controlli, garanzia) e poi una raccomandazione motivata.
            Per il finanziamento usa SEMPRE lo strumento calc_rata (prezzo, anticipo, mesi, TAN indicato dal cliente) e presenta
            la rata come stima non vincolante: l''offerta definitiva spetta all''operatore e al finanziatore; non dare consulenza
            finanziaria o legale come fatto certo. Se il cliente vuole conservare un veicolo usa save_vehicle. Se vuole vederlo,
            raccogli veicolo, data e ora preferite e usa book_appointment. Se vuole acquistare, raccogli nome, telefono, veicolo,
            eventuale finanziamento e i link ai documenti (carta d''identità, patente, ecc.: non è possibile caricare file,
            chiedi un link o il testo) e crea la pratica con open_practice, poi chiedi la presa in carico con request_presa_in_carico.
            Spiega che l''acconto si versa online con carta dopo la presa in carico dell''operatore. Non gestisci ispezione
            fisica, ritiro o consegna: sono servizi separati. Risposte brevi, un passo alla volta.'
    appTools:
    - name: search_vehicles
      description: Cerca nel catalogo veicoli (marca, modello, prezzo, km, alimentazione, cambio, esito controlli)
      action: search
      collection: vehicles
      scope: all
    - name: show_vehicles
      description: Mostra al cliente le schede dei veicoli scelti
      action: show
      collection: vehicles
      scope: all
    - name: calc_rata
      description: 'Calcola la rata mensile: args {price, down_payment, months, tan}'
      action: call
      slot: rata
    - name: save_vehicle
      description: Salva un veicolo tra i preferiti del cliente
      action: write
      collection: saved_vehicles
      scope: user
    - name: book_appointment
      description: Prenota un appuntamento per vedere un veicolo
      action: write
      collection: appointments
      scope: user
    - name: open_practice
      description: Apre la pratica d'acquisto del cliente
      action: write
      collection: practices
      scope: user
    goalTemplate: 'Conversazione finora:

      {history}


      Nuovo messaggio del cliente ({user}): {message}

      Oggi è {date}. Rispondi in italiano.'
    output: markdown
    limits:
      maxTurns: 10
      maxBudgetUsd: 0.4
  approvals:
  - key: presa_in_carico
    title: Presa in carico pratica
    description: Un operatore verifica i documenti e prende in carico la pratica d'acquisto.
    role: operator
    decidedBy: role
    fields:
    - vehicle
    - customer_name
    - phone
    - financing
    - documents
    timeoutMinutes: 2880
    onTimeout: reject
  data:
    collections:
    - name: vehicles
      ownedBy: shared
      searchable: true
      description: Catalogo veicoli caricato dall'azienda (gestito dall'admin)
      fields:
      - name: title
        type: text
        required: true
        label: Titolo
      - name: brand
        type: text
        required: true
        label: Marca
      - name: model
        type: text
        required: true
        label: Modello
      - name: year
        type: number
        label: Anno
      - name: km
        type: number
        label: Chilometraggio
      - name: price
        type: number
        required: true
        label: Prezzo
      - name: fuel
        type: select
        label: Alimentazione
        options:
        - benzina
        - diesel
        - ibrida
        - elettrica
        - gpl
        - metano
      - name: gearbox
        type: select
        label: Cambio
        options:
        - manuale
        - automatico
      - name: body
        type: text
        label: Carrozzeria
      - name: specs
        type: textarea
        label: Scheda tecnica
      - name: photo_url
        type: url
        label: Foto (link)
      - name: inspection_result
        type: textarea
        label: Esito dei controlli
      - name: warranty_months
        type: number
        label: Garanzia (mesi)
      - name: status
        type: select
        label: Stato
        options:
        - disponibile
        - riservata
        - venduta
    - name: saved_vehicles
      ownedBy: user
      description: Veicoli salvati dal cliente
      fields:
      - name: vehicle_id
        type: relation
        relation: vehicles
        label: Veicolo
      - name: title
        type: text
        label: Veicolo
      - name: price
        type: number
        label: Prezzo
      - name: note
        type: text
        label: Nota
    - name: appointments
      ownedBy: user
      description: Appuntamenti prenotati dal cliente
      fields:
      - name: vehicle
        type: text
        required: true
        label: Veicolo
      - name: when
        type: text
        required: true
        label: Data e ora
      - name: phone
        type: text
        label: Telefono
      - name: status
        type: select
        label: Stato
        options:
        - richiesto
        - confermato
        - annullato
        default: richiesto
    - name: practices
      ownedBy: user
      description: Pratiche d'acquisto e trattative del cliente
      fields:
      - name: vehicle
        type: text
        required: true
        label: Veicolo
      - name: customer_name
        type: text
        required: true
        label: Nome
      - name: phone
        type: text
        label: Telefono
      - name: financing
        type: text
        label: Finanziamento (anticipo, mesi, rata stimata)
      - name: documents
        type: textarea
        label: Link ai documenti
      - name: assigned_to
        type: email
        label: Operatore assegnato
      - name: status
        type: select
        label: Stato
        options:
        - aperta
        - in_carico
        - acconto_versato
        - in_chiusura
        - conclusa
        - annullata
        default: aperta
      - name: deposit_eur
        type: number
        label: Acconto (€)
  slots:
  - key: rata
    description: Rata mensile di un finanziamento con ammortamento alla francese
    timeoutMs: 2000
    example:
      args:
        price: 18000
        down_payment: 3000
        months: 48
        tan: 6.5
    code: "def main(input):\n    a = input.get('args') or {}\n    try:\n        price = float(a.get('price', 0))\n       \
      \ down = float(a.get('down_payment', 0) or 0)\n        n = int(a.get('months', 0))\n        tan = float(a.get('tan',\
      \ 0) or 0)\n    except (TypeError, ValueError):\n        return {'error': 'valori non validi'}\n    capital = price\
      \ - down\n    if capital <= 0 or n <= 0:\n        return {'error': 'importo o durata non validi'}\n    r = tan / 100\
      \ / 12\n    rata = capital / n if r == 0 else capital * r / (1 - (1 + r) ** (-n))\n    total = rata * n\n    return\
      \ {'finanziato': round(capital, 2), 'rata_mensile': round(rata, 2), 'totale_rimborsato': round(total, 2), 'interessi':\
      \ round(total - capital, 2), 'mesi': n, 'tan': tan, 'nota': 'Stima non vincolante, escluse spese di istruttoria e assicurazioni'}\n"
  views:
  - key: home
    type: page
    nav: false
    title: Auto Garantite
    sections:
    - type: hero
      layout: stack
      band: true
      eyebrow: Auto usate garantite
      title: Trova l'auto giusta, con **controlli trasparenti** e un consulente AI
      text: 'Sfoglia il catalogo con foto, scheda tecnica, chilometraggio, prezzo ed esito dei controlli. Il consulente ti
        aiuta a scegliere, confronta i modelli e calcola la rata. Poi prenoti un appuntamento o avvii l''acquisto: un operatore
        ti segue.'
      actions:
      - label: Sfoglia il catalogo
        href: /v/catalogo
        style: primary
      - label: Parla con il consulente
        href: /v/consulente
        style: ghost
    - type: data
      id: in-evidenza
      title: Ultimi arrivi
      source: collection:vehicles
      display: cards
      fields:
      - key: title
        label: Veicolo
      - key: price
        label: Prezzo
        format: money
      - key: km
        label: Km
        format: number
      - key: year
        label: Anno
      - key: inspection_result
        label: Controlli
      filters:
      - field: status
        op: '='
        value: disponibile
      limit: 6
      empty: Il catalogo verrà pubblicato a breve.
    - type: steps
      id: come-funziona
      title: Come funziona
      items:
      - title: Scegli
        text: Filtra il catalogo o descrivi budget ed esigenze al consulente.
        badge: 🔎
      - title: Confronta e calcola
        text: Confronto tra 2-3 modelli e rata stimata del finanziamento.
        badge: ⚖️
      - title: Prenota o acquista
        text: 'Appuntamento oppure pratica con i tuoi documenti: un operatore la prende in carico.'
        badge: 📅
      - title: Acconto online
        text: Versi l'acconto con carta e segui ogni passaggio.
        badge: 💳
    - type: note
      content: Questo portale gestisce catalogo e trattativa. Ispezione fisica, ritiro e consegna dell'auto sono servizi separati.
        Le rate sono stime non vincolanti.
  - key: catalogo
    type: page
    title: Catalogo
    sections:
    - type: data
      title: Veicoli disponibili
      intro: Filtra e ordina per prezzo, chilometraggio, anno, alimentazione.
      source: collection:vehicles
      display: table
      fields:
      - key: title
        label: Veicolo
      - key: year
        label: Anno
      - key: km
        label: Km
        format: number
      - key: fuel
        label: Alimentazione
        format: badge
      - key: gearbox
        label: Cambio
        format: badge
      - key: price
        label: Prezzo
        format: money
      - key: warranty_months
        label: Garanzia (mesi)
        format: number
      - key: inspection_result
        label: Controlli
      - key: photo_url
        label: Foto
        format: link
      filters:
      - field: status
        op: '='
        value: disponibile
      sort:
        field: price
        dir: asc
      limit: 100
      empty: Nessun veicolo disponibile.
  - key: consulente
    type: chat
    title: Consulente
    source: agent:advisor
    roles:
    - user
    - admin
    placeholder: Es. Ho 15.000 € e cerco una station wagon diesel…
    examples:
    - Cerco un'auto per la città sotto i 12.000 €
    - Confronta le due auto che mi hai mostrato
    - Quanto verrebbe la rata in 48 mesi con 3.000 € di anticipo?
    - Voglio prenotare un appuntamento
  - key: salvati
    type: list
    title: Veicoli salvati
    source: collection:saved_vehicles
    roles:
    - user
    data:
      display: cards
      fields:
      - key: title
        label: Veicolo
      - key: price
        label: Prezzo
        format: money
      - key: note
        label: Nota
      empty: Non hai ancora salvato veicoli.
  - key: appuntamenti
    type: list
    title: I miei appuntamenti
    source: collection:appointments
    roles:
    - user
    data:
      display: table
      fields:
      - key: vehicle
        label: Veicolo
      - key: when
        label: Quando
      - key: status
        label: Stato
        format: badge
      empty: Nessun appuntamento.
  - key: pratiche
    type: list
    title: Le mie pratiche
    source: collection:practices
    roles:
    - user
    data:
      display: table
      fields:
      - key: vehicle
        label: Veicolo
      - key: financing
        label: Finanziamento
      - key: status
        label: Stato
        format: badge
      - key: deposit_eur
        label: Acconto
        format: money
      empty: Nessuna pratica aperta.
  - key: coda_operatore
    type: approvals
    title: Pratiche da prendere in carico
    approvals:
    - presa_in_carico
    roles:
    - operator
    - admin
  - key: admin_catalogo
    type: table
    title: Gestione catalogo
    source: collection:vehicles
    roles:
    - admin
    columns:
    - title
    - brand
    - model
    - year
    - km
    - price
    - status
    - photo_url
  - key: admin_trattative
    type: table
    title: Tutte le trattative
    source: collection:practices
    roles:
    - admin
    - operator
    columns:
    - vehicle
    - customer_name
    - phone
    - assigned_to
    - status
    - deposit_eur
  billing:
    modes:
    - free
  extensions:
  - key: acconto_carta
    description: 'Versamento dell''acconto online con carta (Stripe Connect verso l''azienda) legato a una singola pratica
      e al suo importo: il manifest non esprime pagamenti per transazione su una collezione. Da collegare dopo la presa in
      carico.'
  - key: email_aggiornamenti
    description: 'Email al cliente a ogni passaggio della pratica (presa in carico, acconto, chiusura): le notifiche non sono
      ancora disponibili.'
  - key: upload_documenti
    description: 'Caricamento di foto veicolo e documenti del cliente: i file non sono ancora disponibili; si usano link o
      testo incollato.'
  - key: visibilita_operatore
    description: 'L''operatore dovrebbe vedere solo le pratiche assegnate e l''admin tutte: le pratiche sono dei clienti (ownedBy
      user), serve un filtro per assegnatario e un accesso admin trasversale non esprimibili oggi.'
