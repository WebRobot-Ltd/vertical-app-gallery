apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: auto-garantite
  displayName: Auto Garantite
  tagline: 'Auto usate garantite: scegli con l''assistente, prenota o avvia l''acquisto online.'
  description: 'Portale software per un servizio di auto usate garantite: catalogo con esito dei controlli, assistente in
    chat, appuntamenti, pratiche di acquisto con documenti, acconto con carta e aggiornamenti via email. Ispezione, ritiro
    e consegna sono servizi separati.'
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#12304a'
      accent: '#d9531e'
      background: '#f6f7f9'
      foreground: '#161c24'
    fonts:
      body: Inter
      display: Poppins
    wordmark:
    - text: Auto
      color: primary
    - text: Garantite
      color: accent
  header:
    links:
    - label: Come funziona
      href: '#come-funziona'
    cta:
      label: Vedi le auto
      href: /v/catalog
  auth:
    method: magic_link
    anonymous:
      views:
      - home
      - catalog
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: operator
      label: Operatore
      assignedBy: derived
      from: collection:deals.operator_email
    - key: user
      label: Cliente
      assignedBy: signup
  limits:
  - action: chat
    per: user
    max: 100
    window: day
    roles:
    - user
  agents:
  - key: advisor
    role: main
    description: Consulente che aiuta a scegliere l'auto, confronta i modelli e calcola la rata.
    memory: user
    goalTemplate: 'Conversazione finora:

      {history}


      Nuovo messaggio del cliente ({user}): {message}

      Rispondi in italiano. Oggi è {date}.'
    appTools:
    - name: search_vehicles
      description: Cerca veicoli nel catalogo
      action: search
      collection: vehicles
      scope: all
    - name: read_vehicle
      description: Legge la scheda di un veicolo
      action: read
      collection: vehicles
      scope: all
    - name: loan_payment
      description: 'Calcola la rata di un finanziamento. Argomenti: price, down, months, apr'
      action: call
      slot: loan_calc
    - name: save_vehicle
      description: Salva un veicolo tra i preferiti del cliente
      action: write
      collection: saved_vehicles
      scope: user
    profile:
      inline:
        display_name: Consulente Auto Garantite
        crews:
        - id: advisor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei il consulente di un servizio di auto usate garantite. Aiuti il cliente a scegliere in base a
            budget ed esigenze: fai poche domande mirate (budget, uso, km annui, alimentazione, cambio). Usa search_vehicles
            e read_vehicle per proporre solo veicoli realmente presenti nel catalogo, citando prezzo, chilometraggio, anno
            e esito dei controlli già effettuati. Per confrontare due o tre modelli presenta una tabella con i dati della
            scheda. Per la rata usa SEMPRE loan_payment (price, down, months, apr): se il cliente non indica TAN, durata o
            anticipo, chiedili e dichiara che il calcolo è indicativo e non un''offerta di finanziamento. Se il cliente vuole
            tenere un''auto, usa save_vehicle. Quando è interessato, invitalo a prenotare un appuntamento o ad avviare l''acquisto
            dalle voci del menu; una persona (operatore) prenderà in carico la pratica. Non inventare mai dati, prezzi o esiti
            dei controlli; non dare consulenza legale o finanziaria come fatto. Non gestisci ispezione, ritiro o consegna:
            sono servizi separati.'
  slots:
  - key: loan_calc
    description: Rata mensile di un finanziamento ad ammortamento francese
    timeoutMs: 2000
    code: "def main(input):\n    a = input.get('args') or {}\n    price = float(a.get('price', 0) or 0)\n    down = float(a.get('down',\
      \ 0) or 0)\n    months = int(a.get('months', 48) or 48)\n    apr = float(a.get('apr', 7.0) or 0)\n    p = max(price\
      \ - down, 0.0)\n    r = apr / 1200.0\n    if months <= 0:\n        return {'error': 'durata non valida'}\n    m = p\
      \ / months if r == 0 else p * r / (1 - (1 + r) ** (-months))\n    return {'finanziato': round(p, 2), 'rata_mensile':\
      \ round(m, 2), 'totale_pagato': round(m * months, 2), 'interessi': round(m * months - p, 2), 'mesi': months, 'tan_percento':\
      \ apr}\n"
  data:
    collections:
    - name: vehicles
      ownedBy: shared
      description: Catalogo veicoli caricato dall'azienda
      searchable: true
      fields:
      - name: title
        type: text
        required: true
        label: Titolo
      - name: make
        type: text
        required: true
        label: Marca
      - name: model
        type: text
        required: true
        label: Modello
      - name: year
        type: number
        required: true
        label: Anno
      - name: km
        type: number
        required: true
        label: Chilometraggio
      - name: price
        type: number
        required: true
        label: Prezzo (€)
      - name: fuel
        type: select
        label: Alimentazione
        options:
        - value: benzina
          label: Benzina
        - value: diesel
          label: Diesel
        - value: ibrida
          label: Ibrida
        - value: elettrica
          label: Elettrica
        - value: gpl
          label: GPL/Metano
      - name: gearbox
        type: select
        label: Cambio
        options:
        - value: manuale
          label: Manuale
        - value: automatico
          label: Automatico
      - name: specs
        type: textarea
        label: Scheda tecnica
      - name: inspection
        type: textarea
        label: Esito dei controlli effettuati
      - name: photos
        type: file
        accept:
        - jpg
        - jpeg
        - png
        - webp
        multiple: true
        label: Foto
      - name: status
        type: select
        label: Stato
        default: disponibile
        options:
        - value: disponibile
          label: Disponibile
        - value: riservata
          label: Riservata
        - value: venduta
          label: Venduta
    - name: saved_vehicles
      ownedBy: user
      description: Veicoli salvati dal cliente
      fields:
      - name: vehicle
        type: relation
        relation: vehicles
        label: Veicolo
      - name: note
        type: text
        label: Nota
    - name: deals
      ownedBy: user
      description: Pratiche di acquisto
      fields:
      - name: vehicle
        type: relation
        relation: vehicles
        required: true
        label: Veicolo
      - name: documents
        type: file
        accept:
        - pdf
        - jpg
        - jpeg
        - png
        multiple: true
        maxMb: 10
        label: Documenti (identità, patente, reddito)
      - name: financing
        type: boolean
        label: Richiedo un finanziamento
      - name: notes
        type: textarea
        label: Note
      - name: status
        type: select
        label: Stato
        default: new
        options:
        - value: new
          label: Ricevuta
        - value: in_review
          label: In lavorazione
        - value: docs_ok
          label: Documenti verificati
        - value: deposit_paid
          label: Acconto versato
        - value: completed
          label: Conclusa
        - value: cancelled
          label: Annullata
      - name: operator_email
        type: email
        label: Operatore assegnato
      access:
      - role: operator
        where:
          operator_email: '{user.email}'
        can:
        - read
        - write
      retentionDays: 1825
    - name: appointments
      ownedBy: user
      description: Appuntamenti per vedere un'auto
      fields:
      - name: notes
        type: text
        label: Note
  views:
  - key: home
    type: page
    title: Auto Garantite
    nav: false
    sections:
    - type: hero
      title: Auto usate **garantite**, scelte con calma e senza sorprese.
      text: Sfoglia il catalogo con foto, scheda tecnica e esito dei controlli. L'assistente ti aiuta a scegliere, confronta
        i modelli e calcola la rata. Poi prenoti un appuntamento o avvii l'acquisto online.
      actions:
      - label: Vedi le auto
        href: /v/catalog
        style: primary
      - label: Accedi
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title: Come funziona
      items:
      - title: Scegli
        text: Filtra il catalogo o chiedi all'assistente in base a budget ed esigenze.
      - title: Confronta
        text: L'assistente mette a confronto 2-3 modelli e calcola la rata indicativa.
      - title: Prenota o acquista
        text: Fissa un appuntamento oppure avvia la pratica caricando i documenti.
      - title: Un operatore ti segue
        text: Una persona prende in carico la pratica; l'acconto si versa online con carta.
    - type: note
      content: Questo portale gestisce catalogo e trattativa. Ispezione, ritiro e consegna sono servizi separati. I calcoli
        di rata sono indicativi e non costituiscono un'offerta di finanziamento.
  - key: catalog
    type: cards
    title: Catalogo
    source: collection:vehicles
    export: false
    data:
      display: cards
      fields:
      - key: title
        label: Auto
      - key: price
        label: Prezzo
        format: money
      - key: km
        label: Km
        format: number
      - key: year
        label: Anno
      - key: fuel
        label: Alimentazione
        format: badge
      - key: gearbox
        label: Cambio
        format: badge
      - key: inspection
        label: Controlli
      - key: status
        label: Stato
        format: badge
      filters:
      - field: status
        op: '!='
        value: venduta
      sort:
        field: price
        dir: asc
      limit: 100
      empty: Nessun veicolo disponibile.
  - key: assistant
    type: chat
    title: Assistente
    source: agent:advisor
    roles:
    - user
    - admin
    examples:
    - Cerco un'auto sotto i 15.000 € per la città
    - Confronta le prime due che mi hai proposto
    - Quanto sarebbe la rata in 48 mesi con 3.000 € di anticipo?
    placeholder: Scrivi budget ed esigenze…
  - key: saved
    type: list
    title: Salvati
    source: collection:saved_vehicles
    roles:
    - user
    data:
      display: list
      fields:
      - key: vehicle
        label: Veicolo
      - key: note
        label: Nota
      empty: Nessun veicolo salvato.
  - key: save_form
    type: form
    title: Salva un veicolo
    collection: saved_vehicles
    fields:
    - vehicle
    - note
    submit:
      label: Salva
      message: Veicolo salvato.
      redirect: saved
    roles:
    - user
  - key: book
    type: booking
    title: Prenota un appuntamento
    collection: appointments
    resources: collection:vehicles
    fields:
    - notes
    slots:
      days:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      from: 09:00
      to: '18:00'
      minutes: 30
      tz: Europe/Rome
      aheadDays: 21
      minNoticeHours: 4
      capacity: 1
    roles:
    - user
  - key: start_deal
    type: form
    title: Avvia l'acquisto
    collection: deals
    fields:
    - vehicle
    - financing
    - documents
    - notes
    submit:
      label: Invia la pratica
      message: 'Pratica ricevuta: un operatore la prenderà in carico.'
      redirect: deals
    edit: false
    roles:
    - user
  - key: deals
    type: table
    title: Le pratiche
    source: collection:deals
    roles:
    - user
    - operator
    - admin
    export: true
    data:
      display: table
      fields:
      - key: vehicle
        label: Veicolo
      - key: status
        label: Stato
        format: badge
      - key: financing
        label: Finanziamento
      - key: operator_email
        label: Operatore
      sort:
        field: status
        dir: asc
      limit: 100
      empty: Nessuna pratica.
  - key: deal_edit
    type: form
    title: Gestisci pratica
    collection: deals
    fields:
    - status
    - operator_email
    - notes
    edit: true
    submit:
      label: Aggiorna
      message: Pratica aggiornata.
      redirect: deals
    roles:
    - operator
    - admin
    nav: false
  - key: vehicle_form
    type: form
    title: Carica veicolo
    collection: vehicles
    submit:
      label: Pubblica
      message: Veicolo salvato nel catalogo.
    edit: true
    roles:
    - admin
  - key: appointments_admin
    type: table
    title: Appuntamenti
    source: collection:appointments
    roles:
    - admin
    export: true
  - key: account
    type: account
    title: Acconto e pagamenti
    roles:
    - user
  approvals: []
  triggers:
  - key: deal_new
    'on':
      collection: deals
      op: insert
    notify:
      to:
      - owner
      - admins
      subject: Pratica ricevuta
      body: La pratica di acquisto è stata ricevuta. Un operatore la prenderà in carico a breve.
      link: deals
  - key: deal_in_review
    'on':
      collection: deals
      op: update
      where:
        status: in_review
    notify:
      to: owner
      subject: La tua pratica è in lavorazione
      body: Un operatore sta lavorando alla tua pratica.
      link: deals
  - key: deal_docs_ok
    'on':
      collection: deals
      op: update
      where:
        status: docs_ok
    notify:
      to: owner
      subject: Documenti verificati
      body: I tuoi documenti sono stati verificati. Puoi versare l'acconto online con carta.
      link: account
  - key: deal_deposit
    'on':
      collection: deals
      op: update
      where:
        status: deposit_paid
    notify:
      to: owner
      subject: Acconto registrato
      body: Abbiamo registrato l'acconto. L'operatore ti contatterà per i passaggi successivi.
      link: deals
  - key: deal_completed
    'on':
      collection: deals
      op: update
      where:
        status: completed
    notify:
      to: owner
      subject: Pratica conclusa
      body: La tua pratica è conclusa. Grazie per aver scelto Auto Garantite.
      link: deals
  - key: deal_cancelled
    'on':
      collection: deals
      op: update
      where:
        status: cancelled
    notify:
      to: owner
      subject: Pratica annullata
      body: La tua pratica è stata annullata. Contattaci se vuoi riprenderla.
      link: deals
  - key: deposit_paid_event
    'on':
      payment: acconto
    notify:
      to:
      - owner
      - admins
      subject: Acconto ricevuto
      body: Il pagamento dell'acconto con carta è andato a buon fine.
      link: deals
  - key: booking_confirm
    'on':
      collection: appointments
      op: insert
    notify:
      to:
      - owner
      - admins
      subject: Appuntamento confermato
      body: Il tuo appuntamento è stato registrato.
      link: appointments_admin
  - key: booking_reminder
    'on':
      date:
        collection: appointments
        field: start
        offsetDays: -1
        hour: 8
    notify:
      to: owner
      subject: Promemoria appuntamento di domani
      body: Ti ricordiamo l'appuntamento di domani per vedere l'auto.
      link: book
  billing:
    modes:
    - credits
    currency: eur
    packs:
    - key: acconto
      credits: 0
      price: 500
      label: Acconto con carta (500 €)
  extensions:
  - key: deposit_amount
    description: 'L''acconto è modellato come pagamento Stripe a importo fisso (pack ''acconto'', 500 €). Un importo variabile
      per veicolo e l''imputazione automatica alla pratica non sono ancora disponibili: l''operatore porta la pratica a ''Acconto
      versato''.'
  - key: vehicle_detail_filters
    description: 'Il catalogo mostra le schede in ordine di prezzo; filtri interattivi dell''utente (marca, prezzo, km) e
      pagina di dettaglio con galleria foto non sono ancora disponibili: l''assistente in chat copre la ricerca per esigenze.'
