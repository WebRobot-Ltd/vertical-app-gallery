apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: saperiservato
  displayName: SapereRiservato
  tagline:
    it: L'assistente AI che conosce i tuoi documenti e non li fa uscire dall'azienda.
    en: The AI assistant that knows your documents and keeps them in-house.
  description:
    it: 'Carica procedure, contratti e manuali, scegli chi può vederli: i dipendenti chiedono in chat e ricevono risposte
      con la citazione della fonte, solo dai documenti a cui hanno accesso.'
    en: 'Upload procedures, contracts and manuals and choose who can see them: employees ask in chat and get answers citing
      the source, only from documents they can access.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#1f2d3d'
      accent: '#2f6f8f'
      background: '#f6f7f9'
      foreground: '#18212b'
    fonts:
      body: Inter
      display: Inter
    wordmark:
    - text: Sapere
      color: primary
    - text: Riservato
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Riservatezza
        en: Privacy
      href: '#riservatezza'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: employee
      label:
        it: Dipendente
        en: Employee
      assignedBy: invite
  limits:
  - action: chat
    per: user
    max: 200
    window: day
    roles:
    - employee
  agents:
  - key: assistant
    role: main
    description: Risponde ai dipendenti solo con i documenti a cui hanno accesso, citando la fonte.
    profile:
      inline:
        display_name: SapereRiservato assistente
        crews:
        - id: assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''assistente interno aziendale. Rispondi SOLO usando i documenti che trovi con il tool search_docs
            (e read_doc per il testo completo): vedi soltanto quelli a cui l''utente ha accesso. Non usare conoscenze esterne,
            non inventare procedure, cifre o clausole. Ogni affermazione va seguita dalla citazione tra parentesi quadre con
            il titolo del documento, es. [Procedura ferie 2026]. In fondo elenca ''Fonti:'' con i titoli usati. Se i documenti
            accessibili non contengono la risposta, dillo chiaramente, suggerisci di rivolgersi al referente e chiama UNA
            volta log_unanswered con la domanda riformulata in modo generico, senza nomi o dati personali. Non rivelare l''esistenza
            di documenti a cui l''utente non ha accesso. Rispondi nella lingua dell''utente, in modo breve e preciso.'
    goalTemplate: 'Conversazione finora:

      {history}


      Nuova domanda di {user}: {message}

      Lingua: {lang}. Data: {date}.'
    appTools:
    - name: search_docs
      description: Cerca nei documenti accessibili all'utente
      action: search
      collection: documents
      scope: all
    - name: read_doc
      description: Legge un documento accessibile all'utente
      action: read
      collection: documents
      scope: all
    - name: log_unanswered
      description: Registra una domanda rimasta senza risposta
      action: append
      collection: unanswered_questions
      scope: all
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.3
  - key: indexer
    role: helper
    description: Estrae il testo dei file caricati dall'admin e lo salva nel documento.
    profile:
      inline:
        display_name: SapereRiservato indicizzatore
        crews:
        - id: indexer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: Ricevi un documento interno appena caricato (index_status = pending). Se il campo content è vuoto,
            apri il file con read_upload (passando l'id del file), trascrivi fedelmente il testo (senza riassumere né aggiungere)
            e salvalo nel campo content del documento con update_doc. In ogni caso, al termine imposta index_status = done
            con update_doc. Non inventare testo.
    goalTemplate: 'Documento id {record.id}, titolo {record.title}. File: {record.file}. Contenuto già presente: {?record.content}sì{/record.content}{!record.content}no{/record.content}.'
    appTools:
    - name: read_upload
      description: Legge un file caricato (OCR incluso)
      action: read_file
    - name: update_doc
      description: Aggiorna il testo e lo stato di indicizzazione di un documento
      action: write
      collection: documents
      scope: all
    output: markdown
  - key: reporter
    role: scheduled
    description: Ogni mese riassume le domande senza risposta.
    profile:
      inline:
        display_name: SapereRiservato report mensile
        crews:
        - id: reporter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''analista della knowledge base aziendale. Leggi con read_unanswered le domande senza risposta
            dell''ultimo mese. Scrivi un report che inizia con ''# Domande senza risposta — <mese anno>''. Sezioni ##: Sintesi
            (numero di domande, temi principali), Temi ricorrenti (raggruppa le domande simili con conteggio), Documenti da
            creare o aggiornare (proposte concrete), Elenco domande. Usa solo i dati reali, non inventare numeri. Se non ci
            sono domande, dillo in una riga.'
    goalTemplate: 'Genera il report mensile delle domande senza risposta. Oggi è {date}. Lingua: {lang}.'
    appTools:
    - name: read_unanswered
      description: Legge le domande senza risposta
      action: read
      collection: unanswered_questions
      scope: all
    writesTo:
      collection: monthly_reports
      parse: whole
      keyBy: date
    output: markdown
  data:
    collections:
    - name: documents
      description: Documenti interni e gruppi di dipendenti (email) che possono vederli
      ownedBy: org
      fields:
      - name: title
        type: text
        required: true
        label:
          it: Titolo
          en: Title
      - name: category
        type: select
        label:
          it: Tipo
          en: Type
        options:
        - value: procedure
          label: Procedura
        - value: contract
          label: Contratto
        - value: manual
          label: Manuale
        - value: other
          label: Altro
      - name: group_name
        type: text
        label:
          it: Gruppo (es. Amministrazione)
          en: Group
      - name: members
        type: array
        required: true
        label:
          it: Email dei dipendenti autorizzati
          en: Authorised employee emails
        fields:
        - name: email
          type: email
      - name: file
        type: file
        accept:
        - pdf
        - docx
        - xlsx
        - txt
        - md
        maxMb: 15
        label:
          it: File
          en: File
      - name: content
        type: textarea
        label:
          it: Testo (se vuoto, estratto dal file)
          en: Text (extracted from file if empty)
      - name: index_status
        type: select
        default: pending
        label:
          it: Stato indicizzazione
          en: Index status
        options:
        - value: pending
          label: In attesa
        - value: done
          label: Indicizzato
      access:
      - role: employee
        where:
          members: '{user.email}'
        can:
        - read
      searchable: true
    - name: unanswered_questions
      description: Domande anonime a cui i documenti accessibili non hanno risposto
      ownedBy: org
      fields:
      - name: question
        type: text
        required: true
      - name: date
        type: date
      retentionDays: 400
    - name: monthly_reports
      description: Report mensili per l'admin
      ownedBy: org
      fields:
      - name: date
        type: date
      - name: title
        type: text
      - name: body
        type: textarea
  views:
  - key: home
    type: page
    title: SapereRiservato
    nav: false
    sections:
    - type: hero
      layout: stack
      band: true
      eyebrow:
        it: Assistente AI aziendale
        en: Company AI assistant
      title:
        it: Le risposte dei **tuoi documenti**, senza farli uscire.
        en: Answers from **your documents**, without them leaving.
      text:
        it: I dipendenti fanno domande in chat e ricevono risposte con la citazione della fonte, solo dai documenti che possono
          vedere.
        en: Employees ask in chat and get answers citing the source, only from documents they may see.
      actions:
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: 1 · Carica
          en: 1 · Upload
        text:
          it: L'admin carica procedure, contratti e manuali.
          en: The admin uploads procedures, contracts and manuals.
      - title:
          it: 2 · Assegna
          en: 2 · Assign
        text:
          it: Indica quali dipendenti o gruppi possono vedere ogni documento.
          en: Choose which employees or groups see each document.
      - title:
          it: 3 · Chiedi
          en: 3 · Ask
        text:
          it: Risposte con fonte citata, solo da ciò a cui si ha accesso.
          en: Answers with cited sources, only from what you can access.
      - title:
          it: 4 · Migliora
          en: 4 · Improve
        text:
          it: Ogni mese l'admin riceve il report delle domande senza risposta.
          en: Every month the admin gets the report of unanswered questions.
    - type: cards
      id: riservatezza
      title:
        it: Riservatezza
        en: Privacy
      items:
      - title:
          it: Permessi per documento
          en: Per-document permissions
        text:
          it: Ogni risposta usa solo i documenti autorizzati per quell'utente.
          en: Every answer uses only documents authorised for that user.
      - title:
          it: Domande anonime
          en: Anonymous questions
        text:
          it: Le domande senza risposta sono registrate senza nome e cancellate dopo 400 giorni.
          en: Unanswered questions are stored without names and deleted after 400 days.
      - title:
          it: Licenza annuale
          en: Annual licence
        text:
          it: Prezzo annuale in base al numero di utenti.
          en: Yearly price by number of users.
    - type: note
      content:
        it: Le risposte si basano solo sui documenti caricati; verifica sempre le decisioni importanti con il referente.
        en: Answers rely only on uploaded documents; always verify important decisions with the owner.
  - key: chat
    type: chat
    title:
      it: Chiedi ai documenti
      en: Ask the documents
    source: agent:assistant
    examples:
    - it: Quanti giorni di preavviso servono per le ferie?
      en: How much notice is needed for leave?
    - it: Come si gestisce una nota spese?
      en: How do I file an expense report?
    placeholder:
      it: Fai una domanda sulle procedure aziendali…
      en: Ask about company procedures…
    roles:
    - employee
    - admin
  - key: upload_doc
    type: form
    title:
      it: Carica documento
      en: Upload document
    collection: documents
    fields:
    - title
    - category
    - group_name
    - members
    - file
    - content
    submit:
      label:
        it: Salva documento
        en: Save document
      message:
        it: Documento salvato. Il testo verrà indicizzato a breve.
        en: Document saved. Text will be indexed shortly.
      redirect: docs
    edit: true
    roles:
    - admin
  - key: docs
    type: table
    title:
      it: Documenti
      en: Documents
    source: collection:documents
    columns:
    - title
    - category
    - group_name
    - members
    - index_status
    roles:
    - admin
  - key: unanswered
    type: table
    title:
      it: Domande senza risposta
      en: Unanswered questions
    source: collection:unanswered_questions
    columns:
    - date
    - question
    export: true
    roles:
    - admin
  - key: reports
    type: list
    title:
      it: Report mensili
      en: Monthly reports
    source: collection:monthly_reports
    columns:
    - date
    - title
    roles:
    - admin
  - key: account
    type: account
    title:
      it: Licenza
      en: Licence
    roles:
    - admin
  triggers:
  - key: index_new_doc
    'on':
      collection: documents
      op: insert
      where:
        index_status: pending
    start:
      agent: indexer
    goal: 'Indicizza il documento {record.title} (id {record.id}). File: {record.file}.'
    asUser: true
  schedules:
  - agent: reporter
    action: run
    cron: 0 7 1 * *
    owner: app
    deliver:
      to: admins
      subject: SapereRiservato — domande senza risposta del mese
      onlyIfNew: true
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: team_25
      price: 900
      interval: year
      label:
        it: Licenza annuale fino a 25 utenti
        en: Annual licence up to 25 users
      includes:
      - 25 utenti
      - documenti illimitati
      - report mensile
      roles:
      - admin
    - key: team_100
      price: 3000
      interval: year
      label:
        it: Licenza annuale fino a 100 utenti
        en: Annual licence up to 100 users
      includes:
      - 100 utenti
      - documenti illimitati
      - report mensile
      roles:
      - admin
    - key: team_500
      price: 11000
      interval: year
      label:
        it: Licenza annuale fino a 500 utenti
        en: Annual licence up to 500 users
      includes:
      - 500 utenti
      - documenti illimitati
      - report mensile
      roles:
      - admin
  extensions:
  - key: dedicated_llm
    description: 'Il modello linguistico su infrastruttura dedicata del cliente, senza servizi esterni, non è configurabile
      dal manifest: richiede un deployment dedicato del runtime e del modello.'
  - key: seat_limit
    description: 'Il tetto sul numero di utenti invitati per piano (25/100/500) non è applicabile dal manifest: va controllato
      dall''admin degli inviti o da logica del runtime.'
  - key: groups_directory
    description: I gruppi di dipendenti sono gestiti come elenco di email per documento; un'anagrafica gruppi riutilizzabile
      non è disponibile.
