apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: padel-in-viaggio
  displayName: PadelInViaggio
  tagline:
    it: Viaggi su misura per chi vive di padel.
    en: Trips made for people who live for padel.
    es: Viajes hechos para quien vive el pádel.
  description:
    it: Il marketplace dove club, tour operator e coach pubblicano pacchetti di viaggio per giocatori di padel e dove un assistente
      AI ti propone quello giusto per livello, budget e date.
    en: The marketplace where clubs, tour operators and coaches publish padel travel packages and an AI assistant suggests
      the right one for your level, budget and dates.
    es: El marketplace donde clubes, tour operadores y entrenadores publican paquetes de viaje de pádel y un asistente de
      IA te propone el adecuado según tu nivel, presupuesto y fechas.
  langs:
  - it
  - en
  - es
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#0b3d5c'
      accent: '#1aa37a'
      background: '#f6faf8'
      foreground: '#12222c'
    fonts:
      body: Inter
      display: Poppins
    wordmark:
    - text: Padel
      color: primary
    - text: InViaggio
      color: accent
    button: accent
    buttonShape: pill
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
        es: Cómo funciona
      href: '#come-funziona'
    - label:
        it: Viaggi
        en: Trips
        es: Viajes
      href: /v/catalog_view
    cta:
      label:
        it: Accedi
        en: Sign in
        es: Acceder
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
      - catalog_view
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: organizer
      label:
        it: Organizzatore
        en: Organizer
        es: Organizador
      assignedBy: admin
    - key: traveler
      label:
        it: Viaggiatore
        en: Traveler
        es: Viajero
      assignedBy: signup
  limits:
  - action: chat
    per: user
    max: 60
    window: day
    roles:
    - traveler
  - action: agent:package_desk
    per: user
    max: 10
    window: day
    roles:
    - organizer
  agents:
  - key: package_desk
    role: main
    description: Checks an organizer's package, saves it as pending and asks the admin for approval.
    awaits:
    - package_review
    appTools:
    - name: save_package
      description: Save the organizer's package (status pending)
      action: write
      collection: packages
      scope: user
    - name: save_organizer
      description: Create or read the organizer's own profile
      action: write
      collection: organizers
      scope: user
    profile:
      inline:
        display_name: PadelInViaggio package desk
        crews:
        - id: desk
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the package desk of PadelInViaggio, a padel travel marketplace. An organizer (club, tour
            operator or coach) submits a travel package. 1) Make sure the organizer profile exists (save_organizer). 2) Check
            the package is complete and coherent: destination, dates (end after start, in the future), required level, seats
            > 0, courts and accommodation, coaches, flights yes/no, price in EUR, cancellation policy. Never invent missing
            data: if something essential is missing say so and do not submit. 3) Save it with save_package with status ''pending''.
            4) Call request_package_review with the package summary. Reply with a level-1 ''# '' title ''Package submitted:
            <destination>'' followed by a short summary and a note that it becomes visible after admin approval. Reply in
            the user''s language.'
    goalTemplate: 'Organizer: {organizer_name} ({organizer_type_label})

      Destination: {destination}

      Dates: {start_date} to {end_date}

      Required level: {level_label}

      Seats: {seats}

      Courts and accommodation: {venue}

      {?coaches}Coaches included: {coaches}{/coaches}

      Flights included: {flights_label}

      Price per person (EUR): {price}

      Deposit percentage allowed: {deposit_pct}

      Cancellation policy: {cancellation}

      {?program}Program: {program}{/program}

      Today is {date}. Language: {lang}.'
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.3
  - key: concierge
    role: helper
    description: Chat assistant that matches travelers to approved trips and answers logistics questions.
    memory: user
    profile:
      inline:
        display_name: PadelInViaggio concierge
        chat_mode: true
        crews:
        - id: concierge
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You are the PadelInViaggio assistant, helping padel players find a trip. Use read_profile to see
            the traveler's profile (level, departure city, budget, free periods); if it is missing, ask for those four things
            conversationally and store them with save_profile. Use search_catalog to find APPROVED packages and tournament_digest
            to see which trips coincide with federal tournaments. Propose at most 3 trips, ranked, each with destination,
            dates, level, price, seats left, why it fits and any caveat (level too high, over budget, flights not included).
            Answer logistics and program questions only from the package data; if the data does not say, say so and suggest
            asking the organizer. Never invent prices, availability or tournaments. When the traveler wants to book, record
            a draft with save_booking (status 'pending_payment', payment_type 'full' or 'deposit') and tell them to complete
            payment online from My bookings. Be concise, friendly, in the traveler's language.
    goalTemplate: 'Conversation so far:

      {history}


      New message from {user}: {message}

      Today is {date}. Reply in the language with ISO code {lang}.'
    appTools:
    - name: search_catalog
      description: Search approved travel packages
      action: search
      collection: catalog
      scope: all
    - name: read_tournaments
      description: Read the latest tournament/trip matches
      action: read
      collection: tournament_digest
      scope: all
    - name: read_profile
      description: Read the traveler profile
      action: read
      collection: traveler_profiles
      scope: user
    - name: save_profile
      description: Save the traveler profile
      action: write
      collection: traveler_profiles
      scope: user
    - name: save_booking
      description: Record a booking draft for the traveler
      action: write
      collection: bookings
      scope: user
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.3
  - key: publisher
    role: helper
    description: Publishes an approved package into the public catalogue.
    profile:
      inline:
        display_name: PadelInViaggio publisher
        crews:
        - id: publisher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 3
          max_budget_usd: 0.1
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You receive an approval event with an approved travel package. Copy exactly its fields into the catalogue
            with publish_package, with status 'approved'. Do not change or invent any value. Reply with one line confirming
            the publication.
    appTools:
    - name: publish_package
      description: Add the approved package to the public catalogue
      action: write
      collection: catalog
      scope: all
    goalTemplate: 'Publish this approved package: {event}'
    output: markdown
  - key: tournament_scout
    role: scheduled
    description: Reads public federal padel tournament calendars daily and crosses them with the catalogue.
    writesTo:
      collection: tournament_digest
      parse: whole
      keyBy: date
    appTools:
    - name: read_catalog
      description: Read approved packages
      action: read
      collection: catalog
      scope: all
    profile:
      inline:
        display_name: PadelInViaggio tournament scout
        crews:
        - id: scout
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: You monitor the PUBLIC calendars of federal padel tournaments (national federations such as FIT Italy,
            RFEP Spain, and the FIP international calendar) using the WebRobot MCP to read those public pages; respect their
            terms and collect only name, city, country, dates, category and the page URL. Then read the approved catalogue
            (read_catalog) and flag trips whose destination and dates coincide with, or are within 2 days of, a tournament.
            Output a level-1 title '# Trips and tournaments — <date>' then '## Matches' with a table (trip, destination, dates,
            tournament, category, source URL) and '## Upcoming tournaments' with a short list. Never invent tournaments or
            dates; if a calendar cannot be read, say so.
    goalTemplate: 'Today is {date}. Update the tournament digest and cross it with the catalogue. Language: en.'
    output: markdown
    limits:
      maxTurns: 25
      maxBudgetUsd: 0.8
  - key: trip_matcher
    role: helper
    description: 'Weekly: finds new approved trips compatible with a traveler''s saved preferences.'
    memory: instance
    writesTo:
      collection: trip_alerts
      parse: whole
    appTools:
    - name: search_catalog
      description: Search approved packages
      action: search
      collection: catalog
      scope: all
    - name: read_tournaments
      description: Read the latest tournament matches
      action: read
      collection: tournament_digest
      scope: all
    profile:
      inline:
        display_name: PadelInViaggio trip matcher
        crews:
        - id: matcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You watch the approved catalogue for one traveler''s preferences. Start with ''# Trips for you —
            <date>''. List only packages compatible with level, budget, departure city and free periods, newest first, flagging
            those that coincide with a tournament. Your memory holds the packages you already reported: report only new ones
            under ''## New'', and say ''Nothing new this week'' if there are none. Never invent trips. At the end call remember
            once with the ids of all packages reported so far.'
    goalTemplate: 'Watch ''{instance}''. Level {level}, budget up to {budget} EUR, departing from {home_city}, free periods:
      {periods}. Today is {date}. Language {lang}.'
  templates:
  - key: trip_watch
    title:
      it: Avvisi viaggi
      en: Trip alerts
      es: Avisos de viajes
    description:
      it: Ricevi ogni settimana i nuovi pacchetti compatibili con le tue preferenze.
      en: Every week, the new packages that fit your preferences.
      es: Cada semana, los paquetes nuevos que encajan con tus preferencias.
    agent: trip_matcher
    params:
    - name: level
      type: select
      required: true
      label:
        it: Livello
        en: Level
        es: Nivel
      options:
      - beginner
      - intermediate
      - advanced
      - competitive
    - name: home_city
      type: city
      required: true
      label:
        it: Città di partenza
        en: Departure city
        es: Ciudad de salida
    - name: budget
      type: number
      required: true
      label:
        it: Budget massimo (EUR)
        en: Max budget (EUR)
        es: Presupuesto máximo (EUR)
    - name: periods
      type: textarea
      maxLength: 300
      label:
        it: Periodi liberi
        en: Free periods
        es: Periodos libres
    goal: 'Watch ''{instance}'': level {level}, budget {budget} EUR, from {home_city}, free periods {periods}. Today {date}.
      Language {lang}.'
    schedule:
      cron: 0 7 * * 1
      userCanChange: true
    maxPerUser: 3
    roles:
    - traveler
  approvals:
  - key: package_review
    title:
      it: Approvazione pacchetto
      en: Package approval
      es: Aprobación de paquete
    role: admin
    decidedBy: role
    fields:
    - destination
    - start_date
    - end_date
    - level
    - seats
    - price
    - organizer_name
    timeoutMinutes: 10080
    onTimeout: reject
  triggers:
  - key: on_package_approved
    'on':
      approval: package_review
      decision: approved
    start:
      agent: publisher
    goal: 'Publish this approved package: {event}'
    asUser: false
  inputForm:
    title:
      it: Pubblica un pacchetto
      en: Publish a package
      es: Publicar un paquete
    fields:
    - name: organizer_name
      type: text
      required: true
      label:
        it: Nome organizzatore
        en: Organizer name
        es: Nombre del organizador
    - name: organizer_type
      type: select
      required: true
      label:
        it: Tipo
        en: Type
        es: Tipo
      options:
      - value: club
        label: Club
      - value: tour_operator
        label: Tour operator
      - value: coach
        label: Coach
    - name: destination
      type: text
      required: true
      label:
        it: Destinazione
        en: Destination
        es: Destino
    - name: start_date
      type: date
      required: true
      label:
        it: Partenza
        en: Start
        es: Salida
    - name: end_date
      type: date
      required: true
      label:
        it: Ritorno
        en: End
        es: Regreso
    - name: level
      type: select
      required: true
      label:
        it: Livello richiesto
        en: Required level
        es: Nivel requerido
      options:
      - value: beginner
        label:
          it: Principiante
          en: Beginner
          es: Principiante
      - value: intermediate
        label:
          it: Intermedio
          en: Intermediate
          es: Intermedio
      - value: advanced
        label:
          it: Avanzato
          en: Advanced
          es: Avanzado
      - value: competitive
        label:
          it: Agonistico
          en: Competitive
          es: Competitivo
    - name: seats
      type: number
      required: true
      label:
        it: Posti
        en: Seats
        es: Plazas
    - name: venue
      type: textarea
      required: true
      maxLength: 600
      label:
        it: Campi e struttura
        en: Courts and accommodation
        es: Pistas y alojamiento
    - name: coaches
      type: text
      label:
        it: Coach inclusi
        en: Coaches included
        es: Entrenadores incluidos
    - name: flights
      type: select
      required: true
      label:
        it: Voli inclusi
        en: Flights included
        es: Vuelos incluidos
      options:
      - value: 'yes'
        label:
          it: Sì
          en: 'Yes'
          es: Sí
      - value: 'no'
        label: 'No'
    - name: price
      type: number
      required: true
      label:
        it: Prezzo a persona (EUR)
        en: Price per person (EUR)
        es: Precio por persona (EUR)
    - name: deposit_pct
      type: number
      default: 30
      label:
        it: Acconto consentito (%)
        en: Deposit allowed (%)
        es: Anticipo permitido (%)
    - name: cancellation
      type: textarea
      required: true
      maxLength: 500
      label:
        it: Politica di cancellazione
        en: Cancellation policy
        es: Política de cancelación
    - name: program
      type: textarea
      maxLength: 1000
      label:
        it: Programma
        en: Program
        es: Programa
  data:
    collections:
    - name: organizers
      ownedBy: user
      description: Organizer profile (club, tour operator, coach), paid through its own Connect account
      fields:
      - name: name
        type: text
      - name: type
        type: text
    - name: packages
      ownedBy: user
      description: An organizer's own packages with their approval status
      fields:
      - name: destination
        type: text
      - name: start_date
        type: date
      - name: end_date
        type: date
      - name: level
        type: text
      - name: seats
        type: number
      - name: venue
        type: textarea
      - name: coaches
        type: text
      - name: flights
        type: text
      - name: price
        type: number
      - name: deposit_pct
        type: number
      - name: cancellation
        type: textarea
      - name: program
        type: textarea
      - name: status
        type: text
    - name: catalog
      ownedBy: shared
      searchable: true
      description: Approved packages visible to everyone
      fields:
      - name: destination
        type: text
      - name: start_date
        type: date
      - name: end_date
        type: date
      - name: level
        type: text
      - name: seats
        type: number
      - name: venue
        type: textarea
      - name: coaches
        type: text
      - name: flights
        type: text
      - name: price
        type: number
      - name: deposit_pct
        type: number
      - name: cancellation
        type: textarea
      - name: program
        type: textarea
      - name: organizer_name
        type: text
      - name: status
        type: text
    - name: traveler_profiles
      ownedBy: user
      description: Traveler profile
      fields:
      - name: level
        type: text
      - name: home_city
        type: city
      - name: budget
        type: number
      - name: free_periods
        type: textarea
    - name: bookings
      ownedBy: user
      description: The traveler's own bookings
      fields:
      - name: package_id
        type: text
      - name: destination
        type: text
      - name: start_date
        type: date
      - name: amount
        type: number
      - name: payment_type
        type: text
      - name: status
        type: text
    - name: sales
      ownedBy: user
      description: The organizer's own bookings and earnings (net of the platform fee)
      fields:
      - name: package_id
        type: text
      - name: destination
        type: text
      - name: traveler
        type: text
      - name: amount
        type: number
      - name: net
        type: number
      - name: status
        type: text
    - name: tournament_digest
      ownedBy: app
      description: Daily tournament calendar and trip matches
    - name: trip_alerts
      ownedBy: instance
      description: Weekly matching trips for each traveler's alert
  schedules:
  - agent: tournament_scout
    cron: 0 5 * * *
    action: run
    owner: app
  views:
  - key: home
    type: page
    nav: false
    title: PadelInViaggio
    sections:
    - type: hero
      band: true
      eyebrow:
        it: Marketplace di viaggi padel
        en: Padel travel marketplace
        es: Marketplace de viajes de pádel
      title:
        it: Viaggia dove si **gioca a padel**.
        en: Travel where **padel** is played.
        es: Viaja donde se **juega al pádel**.
      text:
        it: Pacchetti di club, tour operator e coach verificati. Il nostro assistente sceglie per te in base a livello, budget
          e date.
        en: Verified packages from clubs, tour operators and coaches. Our assistant picks for you by level, budget and dates.
        es: Paquetes verificados de clubes, tour operadores y entrenadores. Nuestro asistente elige por ti según nivel, presupuesto
          y fechas.
      actions:
      - label:
          it: Trova il mio viaggio
          en: Find my trip
          es: Encuentra mi viaje
        href: /v/assistant
        style: primary
      - label:
          it: Sfoglia i viaggi
          en: Browse trips
          es: Ver viajes
        href: /v/catalog_view
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
        es: Cómo funciona
      items:
      - title:
          it: Racconta chi sei
          en: Tell us about you
          es: Cuéntanos quién eres
        text:
          it: Livello, città di partenza, budget e periodi liberi.
          en: Level, departure city, budget and free periods.
          es: Nivel, ciudad de salida, presupuesto y periodos libres.
        badge: 🎾
      - title:
          it: Scegli con l'assistente
          en: Choose with the assistant
          es: Elige con el asistente
        text:
          it: Proposte su misura, anche in coincidenza con tornei federali.
          en: Tailored proposals, including trips matching federal tournaments.
          es: Propuestas a medida, también coincidiendo con torneos federales.
        badge: 💬
      - title:
          it: Prenota online
          en: Book online
          es: Reserva online
        text:
          it: Paga tutto o un acconto; l'organizzatore riceve il resto, al netto della commissione.
          en: Pay in full or a deposit; the organizer is paid the rest, net of the platform fee.
          es: Paga todo o un anticipo; el organizador cobra el resto, neto de comisión.
        badge: 💳
    - type: cards
      title:
        it: Per organizzatori
        en: For organizers
        es: Para organizadores
      items:
      - title:
          it: Pubblica il pacchetto
          en: Publish your package
          es: Publica tu paquete
        text:
          it: Ogni pacchetto è approvato dal team prima di andare online. Dashboard con prenotazioni e incassi.
          en: Every package is reviewed by our team before going live. Dashboard with bookings and earnings.
          es: Cada paquete lo revisa nuestro equipo antes de publicarse. Panel con reservas e ingresos.
    - type: note
      content:
        it: PadelInViaggio · i dati dei tornei vengono da calendari pubblici delle federazioni.
        en: PadelInViaggio · tournament data comes from public federation calendars.
        es: PadelInViaggio · los datos de torneos proceden de calendarios públicos de las federaciones.
  - key: catalog_view
    type: cards
    title:
      it: Viaggi
      en: Trips
      es: Viajes
    source: collection:catalog
    data:
      display: cards
      fields:
      - key: destination
        label:
          it: Destinazione
          en: Destination
          es: Destino
      - key: start_date
        label:
          it: Dal
          en: From
          es: Desde
        format: date
      - key: end_date
        label:
          it: Al
          en: To
          es: Hasta
        format: date
      - key: level
        label:
          it: Livello
          en: Level
          es: Nivel
        format: badge
      - key: seats
        label:
          it: Posti
          en: Seats
          es: Plazas
        format: number
      - key: price
        label:
          it: Prezzo
          en: Price
          es: Precio
        format: money
      sort:
        field: start_date
        dir: asc
      limit: 60
      empty:
        it: Nessun viaggio disponibile.
        en: No trips available yet.
        es: Aún no hay viajes.
  - key: assistant
    type: chat
    title:
      it: Assistente viaggi
      en: Trip assistant
      es: Asistente de viajes
    source: agent:concierge
    roles:
    - traveler
    - admin
    placeholder:
      it: Es. Sono intermedio, parto da Milano, budget 900 €…
      en: E.g. I'm intermediate, leaving from Milan, budget €900…
      es: Ej. Soy intermedio, salgo de Milán, presupuesto 900 €…
    examples:
    - it: Cosa mi consigli per ottobre?
      en: What do you recommend for October?
      es: ¿Qué me recomiendas para octubre?
    - it: Ci sono viaggi in coincidenza con un torneo?
      en: Any trips matching a tournament?
      es: ¿Hay viajes que coincidan con un torneo?
  - key: my_bookings
    type: table
    title:
      it: Le mie prenotazioni
      en: My bookings
      es: Mis reservas
    source: collection:bookings
    roles:
    - traveler
    - admin
    data:
      display: table
      fields:
      - key: destination
        label:
          it: Destinazione
          en: Destination
          es: Destino
      - key: start_date
        label:
          it: Partenza
          en: Start
          es: Salida
        format: date
      - key: amount
        label:
          it: Importo
          en: Amount
          es: Importe
        format: money
      - key: payment_type
        label:
          it: Pagamento
          en: Payment
          es: Pago
