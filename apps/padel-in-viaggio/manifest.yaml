apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: padelinviaggio
  displayName: PadelInViaggio
  tagline:
    it: I viaggi giusti per chi vive di padel.
    en: The right trips for people who live for padel.
    es: Los viajes ideales para quienes viven del pádel.
  description:
    it: 'Marketplace di viaggi per giocatori di padel: pacchetti di club, tour operator e coach, assistente AI, avvisi sui
      tornei federali e pagamento online.'
    en: 'Marketplace of padel trips: packages from clubs, tour operators and coaches, an AI assistant, federation tournament
      alerts and online payment.'
    es: 'Marketplace de viajes de pádel: paquetes de clubes, tour operadores y entrenadores, asistente IA, avisos de torneos
      federativos y pago online.'
  langs:
  - it
  - en
  - es
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#0b3d5c'
      accent: '#c6e100'
      background: '#f6f9fb'
      foreground: '#13222e'
    fonts:
      body: Inter
      display: Poppins
    wordmark:
    - text: Padel
      color: primary
    - text: InViaggio
      color: accent
    buttonShape: pill
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
        es: Cómo funciona
      href: '#come-funziona'
    - label:
        it: Viaggi
        en: Trips
        es: Viajes
      href: /v/catalog
    cta:
      label:
        it: Accedi
        en: Sign in
        es: Entrar
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
      - catalog
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: organizer
      label:
        it: Organizzatore
        en: Organizer
        es: Organizador
      assignedBy: admin
    - key: user
      label:
        it: Viaggiatore
        en: Traveler
        es: Viajero
      assignedBy: signup
  limits:
  - action: chat
    per: user
    max: 60
    window: day
    roles:
    - user
  agents:
  - key: assistant
    role: main
    description: Chat assistant that recommends trips from the approved catalog and answers on logistics.
    context:
    - key: profile
      from: collection:traveler_profiles
    appTools:
    - name: search_catalog
      description: Search the approved trip catalog
      action: search
      collection: catalog
      scope: all
    - name: read_tournaments
      description: Read upcoming federation tournaments
      action: read
      collection: tournament_signals
      scope: all
    goalTemplate: 'Traveler profile (JSON lines, may be empty): {profile}

      Conversation so far:

      {history}

      New message: {message}

      Reply in the language with ISO code {lang}.'
    output: markdown
    profile:
      inline:
        display_name: PadelInViaggio assistant
        crews:
        - id: assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the travel assistant of PadelInViaggio, a marketplace of padel trips. Always search the
            catalog with search_catalog before recommending: propose at most 3 trips that fit the traveler''s level, budget,
            departure city and free periods, with destination, dates, price, seats left, coach/flights included and cancellation
            policy. Use read_tournaments to point out trips that coincide with interesting tournaments. Answer questions on
            logistics and programme only with data from the catalog record; if something is missing, say so and suggest asking
            the organizer. Never invent trips, prices or availability. Be friendly and concise. To book, point the user to
            the Book page.'
  - key: publisher
    role: helper
    description: Copies an approved package into the public catalog.
    appTools:
    - name: publish_catalog
      description: Write a record in the public catalog
      action: write
      collection: catalog
      scope: all
    goalTemplate: 'A package was approved by the admin. Publish it in the catalog. Event: {event}'
    output: markdown
    profile:
      inline:
        display_name: Catalog publisher
        crews:
        - id: publisher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 4
          max_budget_usd: 0.1
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You copy an approved travel package into the catalog with one call to publish_catalog. Copy every
            field of the package exactly (title, destination, country, start_date, end_date, level, seats, seats_left = seats,
            courts, accommodation, coach_included, flights_included, price, deposit_pct, cancellation_policy, description,
            organizer_email, organizer_name if present) and add package_id = the record id, using it as the key so a repeat
            does not duplicate. Do not change any value. Reply with one line.
  - key: booking_clerk
    role: helper
    description: Completes a new booking with organizer, amount and deposit from the catalog.
    appTools:
    - name: get_package
      description: Read a package of the catalog
      action: read
      collection: catalog
      scope: all
    - name: update_booking
      description: Update the traveler's booking
      action: write
      collection: bookings
      scope: user
    goalTemplate: 'New booking just saved: {event}. Complete it.'
    output: markdown
    profile:
      inline:
        display_name: Booking clerk
        crews:
        - id: clerk
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 5
          max_budget_usd: 0.1
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Read the booked package with get_package (package_id of the booking). Then update the booking with
            update_booking: organizer_email and package_title from the package, amount = price x travelers, due_now = full
            amount if payment_option is full, else amount x deposit_pct / 100, status = pending_payment. Compute exactly;
            never guess. If the package is missing, set status = rejected. Reply with one line.'
  - key: scout
    role: scheduled
    description: 'Weekly: reads public federation tournament calendars and flags trips coinciding with them.'
    mcpServers:
    - name: webrobot
      url: https://mcp-full.webrobot.eu/mcp
      allow: all
    appTools:
    - name: search_catalog
      description: Search the approved trip catalog
      action: search
      collection: catalog
      scope: all
    writesTo:
      collection: tournament_signals
      parse: markdown_sections
    goalTemplate: Today is {date}. Collect the upcoming padel tournaments from the public federation calendars (FIP, FIT Italy,
      RFEP/FEP Spain, others relevant to the catalog destinations) and match them with the catalog trips. Write in the language
      with ISO code {lang}.
    output: markdown
    profile:
      inline:
        display_name: Tournament scout
        crews:
        - id: scout
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You scan the PUBLIC calendars of federal padel tournaments through the WebRobot MCP (scrape the
            pages; respect terms and robots). Get the tournaments of the next 120 days: name, city, country, dates, category.
            Then read the catalog with search_catalog and find trips whose dates and destination overlap or neighbour a tournament.
            Output a level-1 title ''# Tournaments and trips — <date>'', then one ''## <tournament name> — <city>, <dates>''
            section per tournament with lines: Category, Source URL, Matching trips (titles and package ids, or ''none'').
            Only real data from the pages; never invent tournaments or dates.'
  - key: watcher
    role: helper
    description: 'Per-traveler alert: new compatible packages and tournament coincidences.'
    memory: instance
    writesTo:
      collection: alert_results
    appTools:
    - name: search_catalog
      description: Search the approved trip catalog
      action: search
      collection: catalog
      scope: all
    - name: read_tournaments
      description: Read upcoming federation tournaments
      action: read
      collection: tournament_signals
      scope: all
    output: markdown
    profile:
      inline:
        display_name: Trip alert watcher
        crews:
        - id: watcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You watch the catalog for one traveler''s preferences. Search with search_catalog; keep trips matching
            level (same or adjacent), budget and destinations. Use read_tournaments to flag coincidences with tournaments.
            Memory holds the package ids already reported: report only NEW ones. If there is nothing new, write ''# No news''
            and one line. Otherwise write ''# New trips for you — <date>'' and for each trip: title, destination, dates, price,
            seats left, why it fits, tournament if any. At the end call remember with all package ids reported so far. Never
            invent data.'
  templates:
  - key: trip_alert
    title:
      it: Avviso viaggi
      en: Trip alert
      es: Aviso de viajes
    description:
      it: Ricevi una email quando esce un pacchetto compatibile con le tue preferenze.
      en: Get an email when a package matching your preferences comes out.
      es: Recibe un email cuando salga un paquete que encaje con tus preferencias.
    agent: watcher
    params:
    - name: level
      type: select
      required: true
      label:
        it: Livello
        en: Level
        es: Nivel
      options:
      - beginner
      - intermediate
      - advanced
      - competitive
    - name: budget
      type: number
      label:
        it: Budget massimo (€)
        en: Max budget (€)
        es: Presupuesto máximo (€)
    - name: from_city
      type: text
      label:
        it: Città di partenza
        en: Departure city
        es: Ciudad de salida
    - name: destinations
      type: text
      label:
        it: Destinazioni preferite
        en: Preferred destinations
        es: Destinos preferidos
    goal: 'Alert "{instance}". Level {level}, max budget {budget} EUR, departing from {from_city}, preferred destinations:
      {destinations}. Today is {date}. Write in the language with ISO code {lang}.'
    schedule:
      cron: 0 7 * * *
      userCanChange: true
    maxPerUser: 3
    deliver:
      to: owner
      onlyIfNew: true
  data:
    collections:
    - name: traveler_profiles
      ownedBy: user
      description: Traveler profile
      retentionDays: 1095
      fields:
      - name: level
        type: select
        required: true
        options:
        - beginner
        - intermediate
        - advanced
        - competitive
      - name: home_city
        type: city
        required: true
      - name: budget
        type: number
      - name: free_periods
        type: textarea
        maxLength: 400
      - name: preferred_destinations
        type: text
    - name: organizers
      ownedBy: user
      description: Organizer profile (club, tour operator, coach); payee of the payments
      fields:
      - name: company_name
        type: text
        required: true
      - name: kind
        type: select
        options:
        - club
        - tour_operator
        - coach
      - name: country
        type: country
      - name: contact_email
        type: email
        required: true
      - name: bio
        type: textarea
        maxLength: 600
    - name: packages
      ownedBy: user
      description: Packages submitted by organizers; visible only after admin approval (copied to the catalog)
      fields:
      - name: title
        type: text
        required: true
      - name: destination
        type: text
        required: true
      - name: country
        type: country
      - name: start_date
        type: date
        required: true
      - name: end_date
        type: date
        required: true
      - name: level
        type: select
        required: true
        options:
        - beginner
        - intermediate
        - advanced
        - competitive
        - all
      - name: seats
        type: number
        required: true
      - name: courts
        type: text
      - name: accommodation
        type: text
        required: true
      - name: coach_included
        type: boolean
      - name: flights_included
        type: boolean
      - name: price
        type: number
        required: true
      - name: deposit_pct
        type: number
        default: 30
      - name: cancellation_policy
        type: textarea
        required: true
      - name: description
        type: textarea
      - name: organizer_email
        type: email
        required: true
      - name: organizer_name
        type: text
      - name: status
        type: select
        default: pending
        options:
        - pending
        - approved
        - rejected
    - name: catalog
      ownedBy: shared
      description: Approved packages visible to everyone
      searchable: true
      fields:
      - name: package_id
        type: text
      - name: title
        type: text
      - name: destination
        type: text
      - name: country
        type: country
      - name: start_date
        type: date
      - name: end_date
        type: date
      - name: level
        type: text
      - name: seats
        type: number
      - name: seats_left
        type: number
      - name: courts
        type: text
      - name: accommodation
        type: text
      - name: coach_included
        type: boolean
      - name: flights_included
        type: boolean
      - name: price
        type: number
      - name: deposit_pct
        type: number
      - name: cancellation_policy
        type: textarea
      - name: description
        type: textarea
      - name: organizer_email
        type: email
      - name: organizer_name
        type: text
    - name: bookings
      ownedBy: user
      description: Traveler bookings; organizers see those of their own packages
      retentionDays: 1825
      access:
      - role: organizer
        where:
          organizer_email: '{user.email}'
        can:
        - read
      fields:
      - name: package_id
        type: select
        required: true
        optionsFrom: collection:catalog
      - name: travelers
        type: number
        required: true
        default: 1
      - name: payment_option
        type: select
        required: true
        options:
        - full
        - deposit
      - name: notes
        type: textarea
        maxLength: 400
      - name: package_title
        type: text
      - name: organizer_email
        type: email
      - name: amount
        type: number
      - name: due_now
        type: number
      - name: status
        type: select
        default: new
        options:
        - new
        - pending_payment
        - paid
        - deposit_paid
        - cancelled
        - rejected
    - name: tournament_signals
      ownedBy: app
      description: Weekly tournaments and trips that coincide with them
    - name: alert_results
      ownedBy: instance
      description: Results of each trip alert
  egress:
    hosts:
    - mcp-full.webrobot.eu
    notes: Federation calendars are read through the WebRobot MCP scraping public pages only.
  views:
  - key: home
    type: page
    nav: false
    title: PadelInViaggio
    sections:
    - type: hero
      layout: stack
      band: true
      eyebrow:
        it: Marketplace di viaggi di padel
        en: Padel travel marketplace
        es: Marketplace de viajes de pádel
      title:
        it: Viaggia, gioca, **migliora** il tuo padel.
        en: Travel, play, **improve** your padel.
        es: Viaja, juega, **mejora** tu pádel.
      text:
        it: Pacchetti di club, tour operator e coach verificati, un assistente che ti consiglia il viaggio giusto e avvisi
          sui tornei.
        en: Verified packages from clubs, tour operators and coaches, an assistant that finds the right trip and tournament
          alerts.
        es: Paquetes verificados de clubes, tour operadores y entrenadores, un asistente que encuentra tu viaje y avisos de
          torneos.
      actions:
      - label:
          it: Esplora i viaggi
          en: Browse trips
          es: Ver viajes
        href: /v/catalog
        style: primary
      - label:
          it: Accedi
          en: Sign in
          es: Entrar
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
        es: Cómo funciona
      items:
      - title:
          it: Crea il profilo
          en: Create your profile
          es: Crea tu perfil
        text:
          it: Livello, città di partenza, budget e periodi liberi.
          en: Level, departure city, budget and free periods.
          es: Nivel, ciudad de salida, presupuesto y periodos libres.
        badge: '1'
      - title:
          it: Parla con l'assistente
          en: Chat with the assistant
          es: Habla con el asistente
        text:
          it: Ti propone i viaggi più adatti e risponde su logistica e programma.
          en: It suggests the best trips and answers on logistics and programme.
          es: Te propone los mejores viajes y responde sobre logística y programa.
        badge: '2'
      - title:
          it: Prenota e paga online
          en: Book and pay online
          es: Reserva y paga online
        text:
          it: Paga tutto o un acconto, in sicurezza.
          en: Pay in full or a deposit, securely.
          es: Paga todo o un anticipo, de forma segura.
        badge: '3'
    - type: cards
      title:
        it: Sei un organizzatore?
        en: Are you an organizer?
        es: ¿Eres organizador?
      items:
      - title:
          it: Pubblica i tuoi pacchetti
          en: Publish your packages
          es: Publica tus paquetes
        text:
          it: 'Club, tour operator e coach: dopo l''approvazione i tuoi viaggi sono online e gli incassi arrivano direttamente
            a te, al netto della commissione.'
          en: 'Clubs, tour operators and coaches: once approved your trips go live and payouts reach you, net of the platform
            fee.'
          es: 'Clubes, tour operadores y entrenadores: tras la aprobación tus viajes se publican y cobras directamente, menos
            la comisión.'
    - type: note
      content:
        it: 'Le date dei tornei provengono da calendari federali pubblici e vanno verificate. PadelInViaggio è un intermediario:
          il contratto di viaggio è con l''organizzatore.'
        en: 'Tournament dates come from public federation calendars and should be verified. PadelInViaggio is an intermediary:
          the travel contract is with the organizer.'
        es: 'Las fechas de torneos proceden de calendarios federativos públicos y deben verificarse. PadelInViaggio es intermediario:
          el contrato de viaje es con el organizador.'
  - key: catalog
    type: cards
    title:
      it: Viaggi
      en: Trips
      es: Viajes
    source: collection:catalog
    data:
      display: cards
      fields:
      - key: title
      - key: destination
      - key: start_date
        format: date
      - key: end_date
        format: date
      - key: level
        format: badge
      - key: price
        format: money
      - key: seats_left
        format: number
      sort:
        field: start_date
        dir: asc
      limit: 60
      empty:
        it: Nessun viaggio disponibile.
        en: No trips available.
        es: No hay viajes disponibles.
  - key: assistant
    type: chat
    title:
      it: Assistente
      en: Assistant
      es: Asistente
    source: agent:assistant
    roles:
    - user
    - admin
    examples:
    - it: Cerco un viaggio di una settimana a marzo, livello intermedio
      en: I want a week-long trip in March, intermediate level
      es: Busco un viaje de una semana en marzo, nivel intermedio
    - it: Quali viaggi coincidono con un torneo?
      en: Which trips coincide with a tournament?
      es: ¿Qué viajes coinciden con un torneo?
    placeholder:
      it: Scrivi la tua domanda…
      en: Type your question…
      es: Escribe tu pregunta…
  - key: profile
    type: form
    title:
      it: Il mio profilo
      en: My profile
      es: Mi perfil
    collection: traveler_profiles
    edit: true
    submit:
      label:
        it: Salva
        en: Save
        es: Guardar
      message:
        it: Profilo salvato
        en: Profile saved
        es: Perfil guardado
      redirect: assistant
    roles:
    - user
  - key: book
    type: form
    title:
      it: Prenota
      en: Book
      es: Reservar
    collection: bookings
    fields:
    - package_id
    - travelers
    - payment_option
    - notes
    submit:
      label:
        it: Prenota
        en: Book
        es: Reservar
      message:
        it: 'Prenotazione registrata: riceverai la conferma via email.'
        en: 'Booking saved: you will get a confirmation email.'
        es: 'Reserva registrada: recibirás confirmación por email.'
      redirect: my_bookings
    roles:
    - user
  - key: my_bookings
    type: table
    title:
      it: Le mie prenotazioni
      en: My bookings
      es: Mis reservas
    source: collection:bookings
    columns:
    - package_title
    - travelers
    - amount
    - due_now
    - payment_option
    - status
    roles:
    - user
  - key: alerts
    type: instances
    template: trip_alert
    title:
      it: I miei avvisi
      en: My alerts
      es: Mis avisos
    roles:
    - user
  - key: tournaments
    type: list
    title:
      it: Tornei e viaggi
      en: Tournaments and trips
      es: Torneos y viajes
    source: collection:tournament_signals
    roles:
    - user
    - organizer
    - admin
  - key: organizer_profile
    type: form
    title:
      it: Profilo organizzatore
      en: Organizer profile
      es: Perfil de organizador
    collection: organizers
    edit: true
    submit:
      label:
        it: Salva
        en: Save
        es: Guardar
    roles:
    - organizer
  - key: package_new
    type: form
    title:
      it: Nuovo pacchetto
      en: New package
      es: Nuevo paquete
    collection: packages
    fields:
    - title
    - destination
    - country
    - start_date
    - end_date
    - level
    - seats
    - courts
    - accommodation
    - coach_included
    - flights_included
    - price
    - deposit_pct
    - cancellation_policy
    - description
    - organizer_email
    - organizer_name
    submit:
      label:
        it: Invia per approvazione
        en: Submit for approval
        es: Enviar para aprobación
      message:
        it: 'Pacchetto inviato: sarà visibile dopo l''approvazione dell''admin.'
        en: 'Package submitted: it goes live after admin approval.'
        es: 'Paquete enviado: se publicará tras la aprobación.'
      redirect: my_packages
    roles:
    - organizer
  - key: my_packages
    type: table
    title:
      it: I miei pacchetti
      en: My packages
      es: Mis paquetes
    source: collection:packages
    columns:
    - title
    - destination
    - start_date
    - seats
    - price
    - status
    roles:
    - organizer
  - key: org_dashboard
    type: page
    title:
      it: Dashboard organizzatore
      en: Organizer dashboard
      es: Panel del organizador
    roles:
    - organizer
    sections:
    - type: data
      title:
        it: Incassi e prenotazioni
        en: Revenue and bookings
        es: Ingresos y reservas
      source: collection:bookings
      display: kpi
      kpis:
      - label:
          it: Prenotazioni
          en: Bookings
          es: Reservas
        agg: count
      - label:
          it: Valore prenotato
          en: Booked value
          es: Valor reservado
        agg: sum
        field: amount
        format: money
      - label:
          it: Incassato ora
          en: Collected now
          es: Cobrado ahora
        agg: sum
        field: due_now
        format: money
    - type: data
      title:
        it: Prenotazioni
        en: Bookings
        es: Reservas
      source: collection:bookings
      display: table
      fields:
      - key: package_title
      - key: travelers
        format: number
      - key: amount
        format: money
      - key: due_now
        format: money
      - key: status
        format: badge
      limit: 100
    - type: view
      view: my_packages
  - key: admin_review
    type: table
    title:
      it: Pacchetti da approvare
      en: Packages to review
      es: Paquetes por revisar
    source: collection:packages
    query: status = pending
    columns:
    - title
    - destination
    - organizer_email
    - price
    - seats
    - status
    roles:
    - admin
  - key: package_review
    type: form
    title:
      it: Approva pacchetto
      en: Review package
      es: Revisar paquete
    collection: packages
    fields:
    - status
    edit: true
    submit:
      label:
        it: Salva decisione
        en: Save decision
        es: Guardar decisión
      redirect: admin_review
    roles:
    - admin
    nav: false
  - key: all_bookings
    type: table
    title:
      it: Tutte le prenotazioni
      en: All bookings
      es: Todas las reservas
    source: collection:bookings
    export: true
    roles:
    - admin
  triggers:
  - key: new_package
    description: Tell the admins a package awaits review
    'on':
      collection: packages
      op: insert
    notify:
      to: admins
      subject:
        it: 'Nuovo pacchetto da approvare: {record.title}'
        en: 'New package to review: {record.title}'
        es: 'Nuevo paquete por revisar: {record.title}'
      body:
        it: Un organizzatore ha inviato un pacchetto per l'approvazione.
        en: An organizer submitted a package for approval.
        es: Un organizador envió un paquete para aprobación.
      link: admin_review
  - key: package_approved
    'on':
      collection: packages
      op: update
      where:
        status: approved
    start:
      agent: publisher
    goal: 'Publish this approved package in the catalog. Package: {event}'
  - key: package_approved_mail
    'on':
      collection: packages
      op: update
      where:
        status: approved
    notify:
      to: record.organizer_email
      subject:
        it: 'Pacchetto approvato: {record.title}'
        en: 'Package approved: {record.title}'
        es: 'Paquete aprobado: {record.title}'
      body:
        it: Il tuo pacchetto è stato approvato ed è ora visibile nel catalogo.
        en: Your package was approved and is now in the catalog.
        es: Tu paquete fue aprobado y ya está en el catálogo.
      link: my_packages
  - key: booking_new
    'on':
      collection: bookings
      op: insert
      where:
        status: new
    start:
      agent: booking_clerk
    goal: 'Complete this new booking. Booking: {event}'
  - key: booking_mail
    'on':
      collection: bookings
      op: insert
    notify:
      to: owner
      subject:
        it: Prenotazione ricevuta
        en: Booking received
        es: Reserva recibida
      body:
        it: Abbiamo registrato la tua prenotazione. Completa il pagamento dalla pagina Le mie prenotazioni.
        en: We saved your booking. Complete the payment from My bookings.
        es: Hemos registrado tu reserva. Completa el pago en Mis reservas.
      link: my_bookings
  schedules:
  - agent: scout
    action: run
    cron: 0 5 * * 1
    owner: app
    goal: Update the tournament calendar and the trips that coincide with it.
  billing:
    modes:
    - per_transaction
    currency: eur
    transactionFeePct: 12
    sellers: collection:organizers
  mobile:
    appId: eu.webrobot.padelinviaggio
  extensions:
  - key: checkout_deposit
    description: Online checkout of a booking through Stripe Connect with the split to the organizer (fee withheld by the
      platform) and the choice between deposit and full amount; the balance payment of a deposit booking and the automatic
      decrement of seats_left after payment are not expressible in the manifest.
  - key: organizer_email_prefill
    description: organizer_email on a package is typed by the organizer; automatic prefill from the signed-in user is not
      available.
