billing:
  modes:
  - per_transaction
  currency: eur
  transactionFeePct: 12
  sellers: collection:organizers
egress:
  hosts:
  - mcp-full.webrobot.eu
  notes: WebRobot MCP only, used to read public federal tournament calendars.
mobile:
  appId: eu.webrobot.padelinviaggio
extensions:
- key: checkout_split
  description: Online checkout of the full amount or deposit with Stripe Connect split (platform fee to PadelInViaggio, remainder
    to the organizer's connected account), balance reminders and refunds by cancellation policy; not expressible in the manifest
    yet.
- key: organizer_sales_mirror
  description: When a payment is confirmed, the booking must also appear in the organizer's own sales collection and decrease
    the package seats; a cross-user write done by the platform payment hook, not by an agent.
- key: email_alerts
  description: 'Email notifications to subscribers when a compatible package is published are not available yet: alerts appear
    in the Trip alerts view each week.'
- key: organizer_connect_onboarding
  description: Each organizer must connect their own Stripe account before their packages can be booked.
