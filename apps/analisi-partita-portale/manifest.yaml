apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: match-analytics
  displayName: Match Analytics
  tagline:
    it: Dai dati di gara alla scheda partita, con metriche confrontabili.
    en: From match data to a match sheet, with comparable metrics.
  description:
    it: 'Carica i dati già raccolti di una partita (eventi, posizioni, esiti): un agente calcola indicatori di squadra e individuali,
      individua gli schemi ricorrenti e prepara la scheda partita. Dashboard, tabelle, chat e report via email allo staff.'
    en: 'Upload the match data you already collected (events, positions, outcomes): an agent computes team and player indicators,
      detects recurring patterns and prepares the match sheet. Dashboards, tables, chat and an emailed report to staff.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#0b2e24'
      accent: '#1f9d55'
      background: '#f6f8f7'
      foreground: '#14211c'
    fonts:
      body: Inter
      display: Barlow Condensed
    wordmark:
    - text: Match
      color: primary
    - text: Analytics
      color: accent
    buttonShape: rounded
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#how'
    - label:
        it: Abbonamenti
        en: Plans
      href: '#plans'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  limits:
  - action: agent:analyst
    per: user
    max: 3
    window: total
    plans:
      season_20: 20
      season_40: 40
      season_unlimited: -1
    roles:
    - user
  - action: chat
    per: user
    max: 100
    window: day
    roles:
    - user
  agents:
  - key: analyst
    role: main
    description: Analyses the uploaded match data, computes metrics, patterns and the match sheet.
    profile:
      inline:
        display_name: Match analyst
        crews:
        - id: analyst
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are a football/team-sport performance analyst working on data the club already collected (events,
            positions, outcomes), licensed or supplied by the client. You do NOT track matches live.

            Procedure: 1) read the uploaded data (text is in the goal; for other files call read_upload with the file id).
            2) Call past_metrics to fetch previous matches of this club and compare. 3) Compute with explicit, standard formulas:
            possession %, passes and pass accuracy, shots and shot quality (xG only if the data has the inputs), pressing
            intensity (e.g. recoveries in the opposing half), territorial control by zone, per-player involvement, distances/speed
            if positions are given, all split by period (1H, 2H, full). State each formula briefly. 4) Detect recurring patterns
            of play (build-up routes, pressing triggers, set pieces) with how often they occur. 5) Save: save_match once (opponent,
            match_date, competition, score), then save_metrics for each metric (scope team|player, player, period, metric,
            value; use stable metric names like possession_pct, pass_accuracy_pct, shots, recoveries_opp_half, distance_km),
            save_zones for a 3x3 grid of touches per period (zone_x, zone_y in 0..2), save_patterns for each pattern, and
            finally save_report once with match_label, summary (max 5 lines) and the full report text, plus staff_email taken
            from the goal if present.

            Never invent figures: if the data does not support a metric, say so and skip it. Flag data quality problems (missing
            periods, gaps). Report structure: a level-1 "# " title "<Team> vs <Opponent> — <date>", then ## Summary, ## Team
            indicators (with a chart block), ## Individual performance, ## Recurring patterns, ## Comparison with previous
            matches and opponents, ## Data notes, ## Recommendations for staff. Add one chart as a fenced block ```chart {"type":"bar","title":"...","labels":[...],"series":[{"name":"...","values":[...]}]}```.
            Write in the language with the requested ISO code. Support for decisions, not certainty.'
          mcp_servers: []
    goalTemplate: 'Club: {?team_name}{team_name}{/team_name}{!team_name}n/d{/team_name}. Staff email: {?staff_email}{staff_email}{/staff_email}.

      Opponent: {opponent}. Date: {match_date}. Competition: {?competition}{competition}{/competition}. Our side: {our_side_label}.

      {?notes}Analyst notes: {notes}{/notes}

      Match data files: {match_data}

      {?match_data_text}Extracted data:

      {match_data_text}{/match_data_text}

      Today is {date}. Write the report in the language with ISO code {lang}.'
    context:
    - key: team_name
      from: collection:team_settings.team_name
    - key: staff_email
      from: collection:team_settings.staff_email
    appTools:
    - name: read_upload
      description: Read a file the user uploaded (images and scans included)
      action: read_file
    - name: past_metrics
      description: Metrics of this club's previous matches
      action: read
      collection: match_metrics
      scope: user
    - name: save_match
      description: Register the analysed match
      action: append
      collection: matches
    - name: save_metrics
      description: Save a computed metric
      action: append
      collection: match_metrics
    - name: save_zones
      description: Save touches per pitch zone
      action: append
      collection: match_zones
    - name: save_patterns
      description: Save a recurring pattern of play
      action: append
      collection: play_patterns
    - name: save_report
      description: Save the match report (triggers the staff email)
      action: append
      collection: match_reports
    output: markdown
    limits:
      maxTurns: 30
      maxBudgetUsd: 1.5
      timeoutSeconds: 900
  - key: coach
    role: helper
    description: Chat assistant answering questions on the club's own analysed matches.
    profile:
      inline:
        display_name: Match data assistant
        chat_mode: true
        crews:
        - id: coach
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You answer analysts' questions about their club's matches (e.g. how possession changed in the second
            half). Always query the tools first (chat_matches, chat_metrics, chat_zones, chat_patterns, chat_reports) and
            answer only from the records returned, quoting match, period and figures. Compare periods, matches and opponents
            when asked. If the data is missing say so and suggest uploading the match. Be concise, in the user's language.
            Never invent figures.
    goalTemplate: 'Conversation so far:

      {history}


      New question: {message}

      Answer in the language with ISO code {lang}.'
    appTools:
    - name: chat_matches
      description: The club's matches
      action: read
      collection: matches
      scope: user
    - name: chat_metrics
      description: The club's computed metrics
      action: read
      collection: match_metrics
      scope: user
    - name: chat_zones
      description: Touches per zone
      action: read
      collection: match_zones
      scope: user
    - name: chat_patterns
      description: Recurring patterns of play
      action: read
      collection: play_patterns
      scope: user
    - name: chat_reports
      description: Match reports
      action: read
      collection: match_reports
      scope: user
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.4
  inputForm:
    title:
      it: Analizza una partita
      en: Analyse a match
    fields:
    - name: opponent
      type: text
      required: true
      label:
        it: Avversario
        en: Opponent
    - name: match_date
      type: date
      required: true
      label:
        it: Data della partita
        en: Match date
    - name: competition
      type: text
      label:
        it: Competizione
        en: Competition
    - name: our_side
      type: select
      required: true
      label:
        it: Squadra analizzata
        en: Team analysed
      options:
      - value: home
        label:
          it: Casa
          en: Home
      - value: away
        label:
          it: Trasferta
          en: Away
    - name: match_data
      type: file
      required: true
      accept:
      - csv
      - json
      - xlsx
      - txt
      - xml
      maxMb: 15
      multiple: true
      label:
        it: Dati di gara (eventi, posizioni, esiti)
        en: Match data (events, positions, outcomes)
      help:
        it: Dati già raccolti, concessi in licenza o forniti dal cliente.
        en: Data already collected, licensed or supplied by the client.
    - name: notes
      type: textarea
      maxLength: 600
      label:
        it: Note per l'analisi (facoltative)
        en: Notes for the analysis (optional)
  data:
    collections:
    - name: team_settings
      ownedBy: user
      description: Club name and the staff email that receives match reports
      fields:
      - name: team_name
        type: text
        required: true
        label:
          it: Società
          en: Club
      - name: staff_email
        type: email
        required: true
        label:
          it: Email dello staff per i report
          en: Staff email for reports
    - name: matches
      ownedBy: user
      retentionDays: 1095
      fields:
      - name: opponent
        type: text
        label: Opponent
      - name: match_date
        type: date
        label: Date
      - name: competition
        type: text
        label: Competition
      - name: score
        type: text
        label: Score
    - name: match_metrics
      ownedBy: user
      retentionDays: 1095
      fields:
      - name: opponent
        type: text
      - name: match_date
        type: date
      - name: scope
        type: select
        options:
        - team
        - player
      - name: player
        type: text
      - name: period
        type: select
        options:
        - 1H
        - 2H
        - full
      - name: metric
        type: text
      - name: value
        type: number
    - name: match_zones
      ownedBy: user
      retentionDays: 1095
      fields:
      - name: opponent
        type: text
      - name: match_date
        type: date
      - name: period
        type: select
        options:
        - 1H
        - 2H
        - full
      - name: zone_x
        type: number
      - name: zone_y
        type: number
      - name: touches
        type: number
    - name: play_patterns
      ownedBy: user
      retentionDays: 1095
      fields:
      - name: opponent
        type: text
      - name: match_date
        type: date
      - name: pattern
        type: text
      - name: description
        type: textarea
      - name: frequency
        type: number
    - name: match_reports
      ownedBy: user
      retentionDays: 1095
      fields:
      - name: match_label
        type: text
      - name: summary
        type: textarea
      - name: report
        type: textarea
      - name: staff_email
        type: email
  views:
  - key: home
    type: page
    nav: false
    title: Match Analytics
    sections:
    - type: hero
      title:
        it: Dai dati di gara a una **scheda partita** confrontabile.
        en: From match data to a comparable **match sheet**.
      text:
        it: 'Carica i dati già raccolti: un agente calcola gli indicatori, trova gli schemi di gioco e invia il report allo
          staff.'
        en: 'Upload the data you already have: an agent computes the indicators, finds the patterns of play and emails the
          report to staff.'
      actions:
      - label:
          it: Inizia
          en: Start
        href: /login
        style: primary
    - type: steps
      id: how
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Carica
          en: Upload
        text:
          it: Eventi, posizioni ed esiti in CSV, JSON o Excel.
          en: Events, positions and outcomes as CSV, JSON or Excel.
        badge: 📤
      - title:
          it: Analisi
          en: Analysis
        text:
          it: Metriche di squadra e singolo, per tempo, con confronto tra gare e avversari.
          en: Team and player metrics by half, compared across matches and opponents.
        badge: 📊
      - title:
          it: Report e chat
          en: Report and chat
        text:
          it: Dashboard, tabelle filtrabili, domande in chat e report via email.
          en: Dashboards, filterable tables, chat questions and an emailed report.
        badge: 💬
    - type: cards
      id: plans
      title:
        it: Abbonamento stagionale per squadra
        en: Seasonal team subscription
      items:
      - title: '20'
        text:
          it: Fino a 20 partite analizzate nella stagione.
          en: Up to 20 analysed matches per season.
      - title: '40'
        text:
          it: Fino a 40 partite analizzate nella stagione.
          en: Up to 40 analysed matches per season.
      - title:
          it: Illimitato
          en: Unlimited
        text:
          it: Tutte le partite della stagione.
          en: Every match of the season.
    - type: note
      content:
        it: 'Solo strato di analisi: non include il tracciamento in tempo reale. Ogni società vede solo i propri dati. Supporto
          alle decisioni tecniche.'
        en: 'Analysis layer only: live tracking is not included. Each club sees only its own data. Decision support for coaching
          staff.'
  - key: new_match
    type: new_run
    title:
      it: Analizza partita
      en: Analyse match
    roles:
    - user
    - admin
  - key: history
    type: history
    title:
      it: Le mie analisi
      en: My analyses
    source: run
    roles:
    - user
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: dashboard
    type: dashboard
    title:
      it: Dashboard
      en: Dashboard
    children:
    - possession_trend
    - metrics_table
    - zones_table
    - patterns_table
    roles:
    - user
    - admin
  - key: possession_trend
    type: chart
    title:
      it: Possesso per partita
      en: Possession by match
    source: collection:match_metrics
    nav: false
    data:
      display: chart
      chart: line
      filters:
      - field: metric
        op: '='
        value: possession_pct
      - field: scope
        op: '='
        value: team
      - field: period
        op: '='
        value: full
      groupBy:
        field: match_date
        bucket: day
        aggs:
        - key: possession
          agg: avg
          field: value
      fields:
      - key: match_date
        label: Date
        format: date
      - key: possession
        label: Possession %
        format: number
  - key: metrics_table
    type: table
    title:
      it: Metriche
      en: Metrics
    source: collection:match_metrics
    export: true
    nav: false
    columns:
    - match_date
    - opponent
    - scope
    - player
    - period
    - metric
    - value
  - key: zones_table
    type: table
    title:
      it: Zone di gioco
      en: Pitch zones
    source: collection:match_zones
    export: true
    nav: false
    columns:
    - match_date
    - opponent
    - period
    - zone_x
    - zone_y
    - touches
  - key: patterns_table
    type: table
    title:
      it: Schemi ricorrenti
      en: Recurring patterns
    source: collection:play_patterns
    nav: false
    columns:
    - match_date
    - opponent
    - pattern
    - description
    - frequency
  - key: assistant
    type: chat
    title:
      it: Chiedi ai dati
      en: Ask the data
    source: agent:coach
    examples:
    - it: Come è cambiato il possesso nel secondo tempo?
      en: How did possession change in the second half?
    - it: Confronta le ultime 3 partite sul pressing
      en: Compare the last 3 matches on pressing
    placeholder:
      it: Fai una domanda sulle tue partite…
      en: Ask about your matches…
    roles:
    - user
    - admin
  - key: settings
    type: form
    collection: team_settings
    title:
      it: Società e staff
      en: Club and staff
    edit: true
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Salvato
        en: Saved
      redirect: dashboard
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Plan
    roles:
    - user
  triggers:
  - key: report_ready
    'on':
      collection: match_reports
      op: insert
    notify:
      to:
      - owner
      - record.staff_email
      subject:
        it: 'Report partita: {record.match_label}'
        en: 'Match report: {record.match_label}'
      body:
        it: '{record.summary}


          Il report completo è disponibile nell''app.'
        en: '{record.summary}


          The full report is available in the app.'
      link: history
  notifications:
    emailOnRunDone: false
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 50
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:analyst:
        estimate: 40
        metered: true
      agent:coach:
        estimate: 3
        metered: true
    packs:
    - key: extra_match
      credits: 500
      price: 9
      label:
        it: Partite extra
        en: Extra matches
    plans:
    - key: season_20
      price: 490
      interval: year
      credits: 1000
      creditsReset: never
      label:
        it: Stagione 20 partite
        en: Season 20 matches
    - key: season_40
      price: 890
      interval: year
      credits: 2000
      creditsReset: never
      label:
        it: Stagione 40 partite
        en: Season 40 matches
    - key: season_unlimited
      price: 1490
      interval: year
      credits: 4000
      creditsReset: never
      label:
        it: Stagione illimitata
        en: Season unlimited
  extensions:
  - key: pitch_map
    description: 'Heat/play maps on a pitch diagram are not available (the map view is geographic only): zones are shown as
      a 3x3 table and charts for now.'
  - key: data_link
    description: 'Direct connection to provider feeds is not available yet: data comes from file uploads (CSV, JSON, Excel).'
