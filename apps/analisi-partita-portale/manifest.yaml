apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: matchlab-analytics
  displayName: MatchLab
  tagline:
    it: Dalle partite già raccolte a schede, metriche e risposte in chat.
    en: From already-collected match data to match cards, metrics and chat answers.
  description:
    it: 'Portale software per l''analisi delle partite: l''analista carica o collega i dati di una gara (eventi, posizioni,
      esiti), un agente calcola indicatori di squadra e di giocatore, individua schemi ricorrenti e produce la scheda partita.
      Ogni società vede solo i propri dati. Non include il sistema di tracciamento in tempo reale.'
    en: 'Match analysis software portal: the analyst uploads or links the data of a game (events, positions, outcomes), an
      agent computes team and player indicators, spots recurring patterns and produces the match card. Each club sees only
      its own data. It does not include the real-time tracking system.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#0b3d2e'
      accent: '#e4572e'
      background: '#f6f8f7'
      foreground: '#16201b'
    fonts:
      body: Inter
      display: Barlow Condensed
    wordmark:
    - text: Match
      color: primary
    - text: Lab
      color: accent
    width: wide
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Metriche
        en: Metrics
      href: '#metriche'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: user
      label:
        it: Società
        en: Club
      assignedBy: signup
  limits:
  - action: agent:analyst
    per: user
    max: 10
    window: day
    roles:
    - user
  - action: chat
    per: user
    max: 100
    window: day
    roles:
    - user
  agents:
  - key: analyst
    role: main
    description: Reads the match data given by the analyst, computes team and player indicators, finds recurring patterns
      and writes the match card.
    profile:
      inline:
        display_name: MatchLab analyst
        crews:
        - id: analyst
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You are a football/sport performance analyst. You receive match data already collected and licensed
            or supplied by the client: pasted text (events, positions, outcomes) and/or a link to a page or dataset, which
            you read through the WebRobot MCP. Work ONLY on the data provided: never invent events, positions or figures;
            if something is missing, say so and leave the metric null.

            Write the report in the requested language. Structure: a level-1 title "# <Team> vs <Opponent> — <date>"; then
            ## Summary; ## Team indicators (possession by half, shots, xG if computable, pressing intensity/PPDA, passes,
            territory) as a table; ## Individual indicators (top and bottom performers with the numbers); ## Recurring patterns
            (build-up, pressing triggers, set pieces, zones of play described as a zone table such as left/centre/right by
            thirds); ## Comparison with previous matches and opponents (only if the client gave them); ## Data quality and
            limits; ## Suggestions for the staff. Add a chart block when comparing numbers:

            ```chart

            {"type":"bar","title":"Possession by half","labels":["1H","2H"],"series":[{"name":"Team","values":[0,0]}],"unit":"%"}

            ```

            with real figures only. Close with a single fenced json block (last thing in the answer) with keys: opponent,
            match_date (YYYY-MM-DD), competition, result, possession_1h, possession_2h, possession, shots, shots_on_target,
            xg, ppda, passes, pass_accuracy, top_player, key_patterns (short text), summary (3 sentences). Numbers as numbers,
            null if unknown.'
    goalTemplate: 'Team: {team}

      Opponent: {opponent}

      Date: {match_date}

      {?competition}Competition: {competition}{/competition}

      {?data_url}Data link: {data_url}{/data_url}

      {?data_text}Match data pasted by the analyst:

      {data_text}{/data_text}

      {?focus}Focus requested: {focus}{/focus}

      Write the match card in the language with ISO code {lang}. Today is {date}.'
    output: markdown+json
    resultSchema:
      type: object
      properties:
        opponent:
          type: string
        match_date:
          type: string
        competition:
          type: string
        result:
          type: string
        possession_1h:
          type:
          - number
          - 'null'
        possession_2h:
          type:
          - number
          - 'null'
        possession:
          type:
          - number
          - 'null'
        shots:
          type:
          - number
          - 'null'
        shots_on_target:
          type:
          - number
          - 'null'
        xg:
          type:
          - number
          - 'null'
        ppda:
          type:
          - number
          - 'null'
        passes:
          type:
          - number
          - 'null'
        pass_accuracy:
          type:
          - number
          - 'null'
        top_player:
          type: string
        key_patterns:
          type: string
        summary:
          type: string
    writesTo:
      collection: match_cards
      parse: json_last
    limits:
      maxTurns: 30
      maxBudgetUsd: 1.5
      timeoutSeconds: 900
  - key: assistant
    role: helper
    description: Answers the analyst's questions using the club's own match cards.
    profile:
      inline:
        display_name: MatchLab chat assistant
        crews:
        - id: assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You help a club analyst understand their matches. Use the tool read_cards to read the club's match
            cards (metrics per match, by half, patterns, summaries) and answer questions such as how possession changed in
            the second half, or how this match compares with previous ones. Answer only from the records; if the data does
            not contain the answer, say so and suggest which match to analyse again. Never invent figures. Be concise, use
            small tables, and reply in the language of the question. When comparing numbers add a chart block ```chart {"type":"bar","title":"…","labels":[…],"series":[{"name":"…","values":[…]}]}```.
    appTools:
    - name: read_cards
      description: Read the club's own match cards
      action: read
      collection: match_cards
      scope: user
    goalTemplate: 'Conversation so far:

      {history}


      New question: {message}

      Reply in the language with ISO code {lang}.'
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.4
  inputForm:
    title:
      it: Nuova partita
      en: New match
    fields:
    - name: team
      type: text
      required: true
      label:
        it: La tua squadra
        en: Your team
    - name: opponent
      type: text
      required: true
      label:
        it: Avversario
        en: Opponent
    - name: match_date
      type: date
      required: true
      label:
        it: Data della partita
        en: Match date
    - name: competition
      type: text
      label:
        it: Competizione
        en: Competition
    - name: data_url
      type: url
      label:
        it: Link ai dati (eventi, posizioni, esiti)
        en: Link to the data (events, positions, outcomes)
      help:
        it: 'Il caricamento di file non è ancora disponibile: incolla un link o il testo qui sotto.'
        en: 'File upload is not available yet: paste a link or the text below.'
    - name: data_text
      type: textarea
      maxLength: 20000
      label:
        it: Dati incollati (CSV/JSON/testo)
        en: Pasted data (CSV/JSON/text)
    - name: focus
      type: textarea
      maxLength: 400
      label:
        it: Focus (facoltativo)
        en: Focus (optional)
  data:
    collections:
    - name: match_cards
      ownedBy: user
      description: One card per analysed match, only visible to the club that owns it
      fields:
      - name: opponent
        type: text
        label:
          it: Avversario
          en: Opponent
      - name: match_date
        type: date
        label:
          it: Data
          en: Date
      - name: competition
        type: text
      - name: result
        type: text
      - name: possession_1h
        type: number
      - name: possession_2h
        type: number
      - name: possession
        type: number
      - name: shots
        type: number
      - name: shots_on_target
        type: number
      - name: xg
        type: number
      - name: ppda
        type: number
      - name: passes
        type: number
      - name: pass_accuracy
        type: number
      - name: top_player
        type: text
      - name: key_patterns
        type: textarea
      - name: summary
        type: textarea
  views:
  - key: home
    type: page
    nav: false
    title: MatchLab
    sections:
    - type: hero
      eyebrow:
        it: Analisi partite per società sportive
        en: Match analysis for sports clubs
      title:
        it: Ogni partita diventa una **scheda** confrontabile.
        en: Every match becomes a comparable **card**.
      text:
        it: 'Collega i dati già raccolti della gara: un agente calcola gli indicatori di squadra e di giocatore, trova gli
          schemi ricorrenti e risponde alle tue domande in chat. I dati della tua società restano solo tuoi.'
        en: 'Link the match data you already have: an agent computes team and player indicators, finds recurring patterns
          and answers your questions in chat. Your club''s data stays yours alone.'
      actions:
      - label:
          it: Analizza una partita
          en: Analyse a match
        href: /v/new_match
        style: primary
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: ghost
      note:
        it: 'Solo strato software di analisi: il tracciamento in tempo reale è un prodotto a parte.'
        en: 'Analysis software layer only: real-time tracking is a separate product.'
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Carica o collega
          en: Upload or link
        text:
          it: Eventi, posizioni ed esiti concessi in licenza o forniti dal cliente.
          en: Events, positions and outcomes licensed or supplied by the client.
        badge: 📥
      - title:
          it: L'agente calcola
          en: The agent computes
        text:
          it: Modelli matematici per indicatori di squadra e singoli, e schemi di gioco.
          en: Mathematical models for team and individual indicators, and play patterns.
        badge: 🧮
      - title:
          it: Scheda, dashboard, chat
          en: Card, dashboard, chat
        text:
          it: Confronta gare e avversari, filtra le tabelle, chiedi in chat.
          en: Compare games and opponents, filter tables, ask in chat.
        badge: 📊
    - type: cards
      id: metriche
      title:
        it: Metriche
        en: Metrics
      items:
      - title:
          it: Possesso per tempo
          en: Possession by half
        text:
          it: Come cambia il controllo del gioco tra primo e secondo tempo.
          en: How control of the game changes between halves.
      - title:
          it: Pressing e xG
          en: Pressing and xG
        text:
          it: PPDA, tiri, qualità delle occasioni.
          en: PPDA, shots, chance quality.
      - title:
          it: Schemi ricorrenti
          en: Recurring patterns
        text:
          it: Costruzione, palle inattive, zone di gioco.
          en: Build-up, set pieces, zones of play.
    - type: note
      content:
        it: 'Supporto alle decisioni tecniche: le metriche dipendono dalla qualità dei dati forniti.'
        en: 'Technical decision support: metrics depend on the quality of the supplied data.'
  - key: new_match
    type: new_run
    title:
      it: Nuova partita
      en: New match
    roles:
    - user
    - admin
  - key: matches
    type: history
    title:
      it: Le mie partite
      en: My matches
    source: run
    roles:
    - user
    - admin
  - key: match_report
    type: report
    source: run
    printable: true
    nav: false
  - key: dashboard
    type: dashboard
    title:
      it: Dashboard
      en: Dashboard
    children:
    - possession_chart
    - metrics_chart
    - cards_table
    roles:
    - user
    - admin
  - key: possession_chart
    type: chart
    title:
      it: Possesso per tempo
      en: Possession by half
    source: collection:match_cards
    nav: false
    data:
      display: chart
      chart: bar
      fields:
      - key: opponent
        label:
          it: Avversario
          en: Opponent
      - key: possession_1h
        label:
          it: 1° tempo
          en: 1st half
      - key: possession_2h
        label:
          it: 2° tempo
          en: 2nd half
      sort:
        field: match_date
        dir: desc
      limit: 20
      empty:
        it: Nessuna partita analizzata.
        en: No match analysed yet.
  - key: metrics_chart
    type: chart
    title:
      it: xG e tiri per gara
      en: xG and shots per match
    source: collection:match_cards
    nav: false
    data:
      display: chart
      chart: line
      fields:
      - key: match_date
        label:
          it: Data
          en: Date
      - key: xg
        label: xG
      - key: shots
        label:
          it: Tiri
          en: Shots
      - key: ppda
        label: PPDA
      sort:
        field: match_date
        dir: asc
      limit: 30
  - key: cards_table
    type: table
    title:
      it: Schede partita
      en: Match cards
    source: collection:match_cards
    nav: false
    data:
      display: table
      fields:
      - key: match_date
        label:
          it: Data
          en: Date
        format: date
      - key: opponent
        label:
          it: Avversario
          en: Opponent
      - key: competition
        label:
          it: Competizione
          en: Competition
      - key: result
        label:
          it: Esito
          en: Result
      - key: possession
        label:
          it: Possesso %
          en: Possession %
        format: number
      - key: xg
        label: xG
        format: number
      - key: ppda
        label: PPDA
        format: number
      - key: pass_accuracy
        label:
          it: Precisione passaggi %
          en: Pass accuracy %
        format: number
      - key: top_player
        label:
          it: Migliore
          en: Top player
      sort:
        field: match_date
        dir: desc
      limit: 100
  - key: chat
    type: chat
    title:
      it: Chiedi ai dati
      en: Ask the data
    source: agent:assistant
    examples:
    - it: Come è cambiato il possesso nel secondo tempo?
      en: How did possession change in the second half?
    - it: Confronta le ultime tre partite per pressing
      en: Compare the last three matches on pressing
    placeholder:
      it: Fai una domanda sulle tue partite…
      en: Ask about your matches…
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - user
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 20
    metering:
      creditEur: 0.05
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:analyst:
        estimate: 20
        metered: true
      agent:assistant: 1
    packs:
    - key: matches_10
      credits: 200
      price: 9
      label:
        it: 10 partite extra
        en: 10 extra matches
    - key: matches_40
      credits: 800
      price: 29
      label:
        it: 40 partite extra
        en: 40 extra matches
    plans:
    - key: season
      price: 590
      interval: year
      label:
        it: Stagione per squadra
        en: Season per team
      credits: 800
      creditsReset: never
      includes:
      - dashboard
      - chat
      - 40 matches included
      roles:
      - user
  extensions:
  - key: email_report
    description: Sending the post-match report by email to the staff is not available yet; the report is in the run history
      and printable.
  - key: file_upload
    description: Uploading files is not available yet; data is linked by URL or pasted as text.
  - key: pitch_maps
    description: Graphical pitch maps/heatmaps are not available as a block; the agent describes zones in tables and charts.
