apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: tavolopronto
  displayName: TavoloPronto
  tagline:
    it: Ordina e paga dal tavolo, senza app e senza registrarti.
    en: Order and pay from your table, no app and no sign-up.
  description:
    it: 'Ordinazione e pagamento al tavolo con QR per ristoranti, bar e lidi: menu bilingue, coda ordini per sala e cucina,
      riepilogo di fine giornata con un agente AI.'
    en: 'QR table ordering and payment for restaurants, bars and beach clubs: bilingual menu, order queue for floor and kitchen,
      end-of-day AI summary.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: dashboard
  branding:
    theme: light
    palette:
      primary: '#1f3a34'
      accent: '#e2582d'
      background: '#fbf8f3'
      foreground: '#1d2321'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Tavolo
      color: primary
    - text: Pronto
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label: Menu
      href: /v/menu
    cta:
      label:
        it: Area ristoratore
        en: Owner area
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
      - menu
      - order
    roles:
    - key: admin
      label:
        it: Titolare
        en: Owner
      assignedBy: admin_emails
    - key: waiter
      label:
        it: Cameriere
        en: Waiter
      assignedBy: invite
    - key: kitchen
      label:
        it: Cucina
        en: Kitchen
      assignedBy: invite
  limits:
  - action: login
    per: ip
    max: 10
    window: hour
  agents:
  - key: daily_analyst
    role: scheduled
    description: A fine giornata riassume incassi, piatti più venduti e tempi di preparazione e suggerisce cosa spingere o
      togliere.
    profile:
      inline:
        display_name: TavoloPronto daily analyst
        crews:
        - id: daily_analyst
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''analista di fine giornata di un ristorante. Leggi con gli strumenti gli ordini di oggi (orders)
            e il menu (menu_items). Scrivi in italiano un report che inizia con "# Riepilogo del <data>". Sezioni ## Incassi
            (totale, numero ordini, scontrino medio, pagati con carta), ## Piatti più venduti (tabella top 10), ## Tempi di
            preparazione (media tra created_at e ready_at, ordini più lenti), ## Da spingere (piatti con buon margine o poco
            venduti ma apprezzati), ## Da togliere o rivedere (piatti quasi mai ordinati o con ritardi). Aggiungi un blocco
            ```chart``` bar con i piatti più venduti. Usa solo cifre presenti nei dati: se mancano, dillo. Non inventare.
            I suggerimenti sono ipotesi da verificare, non certezze.'
    appTools:
    - name: read_orders
      description: Read the orders of the venue
      action: read
      collection: orders
      scope: all
    - name: read_menu
      description: Read the menu items
      action: read
      collection: menu_items
      scope: all
    goalTemplate: Oggi è {date}. Prepara il riepilogo di fine giornata degli ordini di oggi.
    output: markdown
    writesTo:
      collection: daily_reports
      parse: whole
    limits:
      maxTurns: 10
      maxBudgetUsd: 0.5
  data:
    collections:
    - name: venues
      description: Locale del ristoratore e dati per i pagamenti
      ownedBy: org
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome del locale
          en: Venue name
      - name: city
        type: city
        label:
          it: Città
          en: City
      - name: owner_email
        type: email
        label: Email
    - name: categories
      description: Categorie del menu
      ownedBy: shared
      fields:
      - name: name_it
        type: text
        required: true
        label: Nome (IT)
      - name: name_en
        type: text
        label: Name (EN)
      - name: position
        type: number
        label:
          it: Ordine
          en: Order
    - name: menu_items
      description: Piatti con prezzi, allergeni, varianti e foto
      ownedBy: shared
      searchable: true
      fields:
      - name: name_it
        type: text
        required: true
        label: Nome (IT)
      - name: name_en
        type: text
        label: Name (EN)
      - name: description_it
        type: textarea
        label: Descrizione (IT)
      - name: description_en
        type: textarea
        label: Description (EN)
      - name: category
        type: relation
        relation: categories
        label:
          it: Categoria
          en: Category
      - name: price
        type: number
        required: true
        label:
          it: Prezzo (€)
          en: Price (€)
      - name: allergens
        type: multiselect
        label:
          it: Allergeni
          en: Allergens
        options:
        - gluten
        - crustaceans
        - eggs
        - fish
        - peanuts
        - soy
        - milk
        - nuts
        - celery
        - mustard
        - sesame
        - sulphites
        - lupin
        - molluscs
      - name: variants
        type: textarea
        label:
          it: Varianti (una per riga, con supplemento)
          en: Variants (one per line, with surcharge)
      - name: photo
        type: file
        accept:
        - jpg
        - png
        - webp
        maxMb: 5
        label: Foto
      - name: available
        type: boolean
        default: true
        label:
          it: Disponibile
          en: Available
    - name: tables
      description: Tavoli con QR e cameriere assegnato
      ownedBy: shared
      fields:
      - name: label
        type: text
        required: true
        label:
          it: Tavolo
          en: Table
      - name: area
        type: text
        label:
          it: Zona/ombrellone
          en: Area
      - name: waiter_email
        type: email
        label:
          it: Cameriere di turno
          en: Waiter on shift
    - name: orders
      description: Ordini dei clienti ai tavoli (inbox del locale)
      ownedBy: org
      access:
      - role: kitchen
        can:
        - read
        - write
      - role: waiter
        where:
          waiter_email: '{user.email}'
        can:
        - read
        - write
      retentionDays: 730
      fields:
      - name: table
        type: text
        required: true
        label:
          it: Tavolo
          en: Table
      - name: items
        type: textarea
        required: true
        label:
          it: Piatti ordinati
          en: Items
      - name: notes
        type: textarea
        maxLength: 400
        label:
          it: Note
          en: Notes
      - name: total
        type: number
        label:
          it: Totale (€)
          en: Total (€)
      - name: lang
        type: select
        options:
        - it
        - en
        default: it
        label:
          it: Lingua
          en: Language
      - name: customer_email
        type: email
        label:
          it: Email per avviso (facoltativa)
          en: Email for ready alert (optional)
      - name: waiter_email
        type: email
        label: Cameriere
      - name: payment
        type: select
        default: unpaid
        options:
        - unpaid
        - paid
        - split
        label:
          it: Pagamento
          en: Payment
      - name: status
        type: select
        default: new
        options:
        - value: new
          label:
            it: Nuovo
            en: New
        - value: preparing
          label:
            it: In preparazione
            en: Preparing
        - value: ready
          label:
            it: Pronto
            en: Ready
        - value: served
          label:
            it: Servito
            en: Served
        label:
          it: Stato
          en: Status
      - name: ready_at
        type: text
        label: Ready at
    - name: daily_reports
      description: Riepiloghi di fine giornata, solo titolare
      ownedBy: org
  views:
  - key: home
    type: page
    nav: false
    title: TavoloPronto
    sections:
    - type: hero
      eyebrow:
        it: Per ristoranti, bar e lidi
        en: For restaurants, bars and beach clubs
      title:
        it: Il cliente inquadra, ordina e **paga** dal tavolo.
        en: Guests scan, order and **pay** from the table.
      text:
        it: Nessuna app né registrazione per il cliente. Sala e cucina vedono gli ordini in tempo reale; a fine giornata un
          agente AI riassume incassi e piatti.
        en: No app or sign-up for guests. Floor and kitchen see orders live; at day's end an AI agent summarises sales and
          dishes.
      actions:
      - label: Menu
        href: /v/menu
        style: primary
      - label:
          it: Area ristoratore
          en: Owner area
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Inquadra il QR
          en: Scan the QR
        text:
          it: Ogni tavolo ha il suo QR code.
          en: Every table has its own QR code.
        badge: 📱
      - title:
          it: Ordina e paga
          en: Order and pay
        text:
          it: Menu in italiano o inglese, note, pagamento con carta o conto diviso.
          en: Menu in Italian or English, notes, card payment or split bill.
        badge: 💳
      - title:
          it: Sala e cucina
          en: Floor and kitchen
        text:
          it: Nuovo, in preparazione, pronto, servito.
          en: New, preparing, ready, served.
        badge: 🍽️
    - type: note
      content:
        it: I suggerimenti dell'agente sono ipotesi basate sui dati del locale.
        en: The agent's suggestions are hypotheses based on the venue's data.
  - key: menu
    type: cards
    title: Menu
    source: collection:menu_items
    data:
      display: cards
      fields:
      - key: name_it
        label: Piatto / Dish
      - key: description_it
        label: Descrizione
      - key: price
        label: €
        format: money
      - key: allergens
        label: Allergeni
        format: badge
      filters:
      - field: available
        op: '='
        value: true
      limit: 200
  - key: order
    type: form
    title:
      it: Il tuo ordine
      en: Your order
    collection: orders
    fields:
    - table
    - items
    - notes
    - total
    - lang
    - customer_email
    submit:
      label:
        it: Invia ordine
        en: Send order
      message:
        it: Ordine inviato! Ti avvisiamo quando è pronto.
        en: Order sent! We'll let you know when it's ready.
  - key: orders_queue
    type: table
    title:
      it: Ordini
      en: Orders
    source: collection:orders
    roles:
    - admin
    - waiter
    - kitchen
    export: true
    data:
      display: table
      fields:
      - key: table
        label: Tavolo
      - key: items
        label: Piatti
      - key: notes
        label: Note
      - key: payment
        label: Pagamento
        format: badge
      - key: status
        label: Stato
        format: badge
      sort:
        field: createdAt
        dir: desc
      limit: 100
  - key: order_status
    type: form
    title:
      it: Cambia stato
      en: Change status
    collection: orders
    fields:
    - status
    edit: true
    roles:
    - admin
    - waiter
    - kitchen
    nav: false
    submit:
      label: Salva
      redirect: orders_queue
  - key: menu_admin
    type: form
    title:
      it: Aggiungi piatto
      en: Add dish
    collection: menu_items
    roles:
    - admin
    edit: true
  - key: categories_admin
    type: form
    title:
      it: Categorie
      en: Categories
    collection: categories
    roles:
    - admin
    edit: true
  - key: tables_admin
    type: form
    title:
      it: Tavoli
      en: Tables
    collection: tables
    roles:
    - admin
    edit: true
  - key: venue
    type: form
    title:
      it: Il mio locale
      en: My venue
    collection: venues
    roles:
    - admin
    edit: true
  - key: reports
    type: table
    title:
      it: Riepiloghi giornalieri
      en: Daily summaries
    source: collection:daily_reports
    roles:
    - admin
    printable: true
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - admin
  schedules:
  - agent: daily_analyst
    cron: 30 21 * * *
    action: run
    owner: app
    deliver:
      to: admins
      onlyIfNew: true
  triggers:
  - key: order_ready
    'on':
      collection: orders
      op: update
      where:
        status: ready
    notify:
      to:
      - record.customer_email
      subject:
        it: Il tuo ordine è pronto
        en: Your order is ready
      body:
        it: Il tuo ordine al tavolo {record.table} è pronto.
        en: Your order at table {record.table} is ready.
  billing:
    modes:
    - subscription
    - per_transaction
    currency: eur
    transactionFeePct: 1.5
    plans:
    - key: monthly
      price: 39
      interval: month
      label:
        it: TavoloPronto mensile
        en: TavoloPronto monthly
      roles:
      - admin
      includes:
      - Tavoli e QR illimitati
      - Riepilogo giornaliero AI
  extensions:
  - key: table_qr
    description: QR code per tavolo che apre /v/order con il tavolo precompilato e il menu.
  - key: customer_payment
    description: Pagamento carta al tavolo (Stripe Connect sul conto del ristoratore) e conto diviso tra amici, anche per
      clienti anonimi.
  - key: push_notification
    description: 'Notifica push sul telefono quando l''ordine è pronto: non disponibile, per ora email se il cliente la indica.'
  - key: kitchen_printer
    description: Stampa dell'ordine sulla stampante comande, non disponibile.
  - key: shift_assignment
    description: Il campo waiter_email dell'ordine va derivato dal tavolo assegnato; anche selezione lingua del menu e carrello.
