apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: tavolopronto
  displayName: TavoloPronto
  tagline:
    it: Ordina e paga al tavolo, senza app e senza registrazione.
    en: Order and pay at your table, no app and no sign-up.
  description:
    it: 'Ordinazione e pagamento al tavolo per ristoranti, bar e lidi: menu via QR, ordini per sala e cucina, riepilogo di
      fine giornata con un agente AI.'
    en: 'Table ordering and payment for restaurants, bars and beach clubs: QR menu, orders for floor and kitchen staff, and
      an end-of-day AI summary.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: dashboard
  branding:
    theme: light
    palette:
      primary: '#1f3a34'
      accent: '#e2703a'
      background: '#fbf8f3'
      foreground: '#1d1d1b'
    fonts:
      body: Inter
      display: DM Serif Display
    wordmark:
    - text: Tavolo
      color: primary
    - text: Pronto
      color: accent
    button: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Menu
        en: Menu
      href: /v/menu
    cta:
      label:
        it: Area ristoratore
        en: Owner area
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
      - menu
    roles:
    - key: admin
      label:
        it: Titolare
        en: Owner
      assignedBy: admin_emails
    - key: waiter
      label:
        it: Cameriere
        en: Waiter
      assignedBy: invite
    - key: kitchen
      label:
        it: Cucina
        en: Kitchen
      assignedBy: invite
  limits:
  - action: agent:analyst
    per: app
    max: 3
    window: day
  agents:
  - key: analyst
    role: scheduled
    description: A fine giornata riassume incassi, piatti più venduti, tempi di preparazione e suggerisce cosa spingere o
      togliere.
    profile:
      inline:
        display_name: TavoloPronto analista di fine giornata
        crews:
        - id: analyst
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''analista di un locale (ristorante, bar o lido). Con lo strumento read_orders leggi gli ordini
            di oggi e con read_menu il menu. Scrivi il riepilogo di fine giornata in italiano. Inizia con un titolo di livello
            1 "# Riepilogo del <data>". Sezioni ## Incassi (totale, numero ordini, scontrino medio), ## Piatti più venduti
            (tabella), ## Tempi di preparazione (media tra creazione e stato ''pronto'', per piatto se possibile), ## Da spingere,
            ## Da togliere o rivedere. Se i dati sono pochi dillo. Aggiungi un grafico dei piatti più venduti come blocco
            ```chart con numeri reali. Non inventare cifre: usa solo i dati letti. I suggerimenti sono ipotesi, non certezze.'
    appTools:
    - name: read_orders
      description: Ordini del locale
      action: read
      collection: orders
      scope: all
    - name: read_menu
      description: Menu del locale
      action: read
      collection: menu_items
      scope: all
    goalTemplate: Oggi è {date}. Prepara il riepilogo di fine giornata del locale.
    output: markdown
    writesTo:
      collection: daily_reports
      parse: whole
      keyBy: date
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.4
  data:
    collections:
    - name: menu_items
      ownedBy: shared
      description: Piatti e bevande del menu
      fields:
      - name: category
        type: text
        required: true
        label:
          it: Categoria
          en: Category
      - name: name_it
        type: text
        required: true
        label:
          it: Nome (IT)
          en: Name (IT)
      - name: name_en
        type: text
        label:
          it: Nome (EN)
          en: Name (EN)
      - name: description_it
        type: textarea
        label:
          it: Descrizione (IT)
          en: Description (IT)
      - name: description_en
        type: textarea
        label:
          it: Descrizione (EN)
          en: Description (EN)
      - name: price
        type: number
        required: true
        label:
          it: Prezzo
          en: Price
      - name: allergens
        type: multiselect
        label:
          it: Allergeni
          en: Allergens
        options:
        - gluten
        - crustaceans
        - eggs
        - fish
        - peanuts
        - soy
        - milk
        - nuts
        - celery
        - mustard
        - sesame
        - sulphites
        - lupin
        - molluscs
      - name: variants
        type: array
        label:
          it: Varianti
          en: Variants
        fields:
        - name: label
          type: text
        - name: extra_price
          type: number
      - name: photo_url
        type: url
        label:
          it: Link alla foto
          en: Photo link
      - name: available
        type: boolean
        default: true
    - name: tables
      ownedBy: shared
      description: Tavoli del locale; il QR punta a /v/menu?table=<codice>
      fields:
      - name: code
        type: text
        required: true
      - name: label
        type: text
        required: true
    - name: orders
      ownedBy: app
      description: Ordini dei clienti ai tavoli
      fields:
      - name: table
        type: text
        required: true
      - name: items
        type: json
        required: true
      - name: notes
        type: textarea
      - name: total
        type: number
      - name: paid
        type: boolean
      - name: status
        type: select
        options:
        - new
        - preparing
        - ready
        - served
        default: new
      - name: shift
        type: text
      - name: created_at
        type: date
      - name: ready_at
        type: date
    - name: daily_reports
      ownedBy: app
      description: Riepiloghi di fine giornata
      fields:
      - name: date
        type: date
  views:
  - key: home
    type: page
    title: TavoloPronto
    nav: false
    sections:
    - type: hero
      title:
        it: Il tuo locale, **ordina e paga** dal tavolo.
        en: Your venue, **order and pay** from the table.
      text:
        it: Il cliente inquadra il QR, sceglie dal menu in italiano o inglese, ordina e paga con carta o divide il conto.
          Sala e cucina vedono gli ordini in tempo reale.
        en: Guests scan the QR, browse the menu in Italian or English, order and pay by card or split the bill. Floor and
          kitchen see orders live.
      actions:
      - label:
          it: Area ristoratore
          en: Owner area
        href: /login
        style: primary
      - label:
          it: Vedi il menu
          en: See the menu
        href: /v/menu
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Configura
          en: Set up
        text:
          it: Registrati, collega Stripe, carica il menu e crea i tavoli con il loro QR.
          en: Sign up, connect Stripe, upload the menu and create tables with their QR.
      - title:
          it: Ordina e paga
          en: Order and pay
        text:
          it: Il cliente ordina senza registrarsi e paga subito.
          en: Guests order without signing up and pay right away.
      - title:
          it: Servi
          en: Serve
        text:
          it: 'Sala e cucina cambiano lo stato: in preparazione, pronto, servito.'
          en: Staff move orders to preparing, ready, served.
      - title:
          it: Capisci
          en: Understand
        text:
          it: A fine giornata un agente AI riassume incassi e piatti da spingere o togliere.
          en: At day's end an AI agent sums up sales and dishes to push or drop.
    - type: note
      content:
        it: Abbonamento mensile per il ristoratore; la piattaforma trattiene una piccola commissione su ogni pagamento.
        en: Monthly subscription for the owner; the platform keeps a small fee on each payment.
  - key: menu
    type: cards
    title:
      it: Menu
      en: Menu
    source: collection:menu_items
    nav: true
    data:
      display: cards
      fields:
      - key: name_it
        label:
          it: Piatto
          en: Dish
      - key: description_it
        label:
          it: Descrizione
          en: Description
      - key: price
        label:
          it: Prezzo
          en: Price
        format: money
      - key: allergens
        label:
          it: Allergeni
          en: Allergens
        format: badge
      filters:
      - field: available
        op: '='
        value: true
      sort:
        field: category
        dir: asc
      limit: 200
  - key: orders_list
    type: table
    title:
      it: Ordini
      en: Orders
    source: collection:orders
    roles:
    - admin
    - waiter
    - kitchen
    data:
      display: table
      fields:
      - key: table
        label:
          it: Tavolo
          en: Table
      - key: items
        label:
          it: Ordine
          en: Order
      - key: notes
        label: Note
      - key: total
        label:
          it: Totale
          en: Total
        format: money
      - key: paid
        label:
          it: Pagato
          en: Paid
        format: badge
      - key: status
        label:
          it: Stato
          en: Status
        format: badge
      - key: created_at
        label:
          it: Ora
          en: Time
        format: date
      sort:
        field: created_at
        dir: desc
      limit: 100
  - key: menu_admin
    type: table
    title:
      it: Gestione menu
      en: Menu management
    source: collection:menu_items
    roles:
    - admin
  - key: tables_admin
    type: table
    title:
      it: Tavoli e QR
      en: Tables and QR
    source: collection:tables
    roles:
    - admin
  - key: reports
    type: list
    title:
      it: Fine giornata
      en: End of day
    source: collection:daily_reports
    roles:
    - admin
    data:
      display: list
      fields:
      - key: date
        format: date
      sort:
        field: date
        dir: desc
      limit: 60
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - admin
  schedules:
  - agent: analyst
    cron: 30 22 * * *
    action: run
    owner: app
  billing:
    modes:
    - subscription
    - per_transaction
    currency: eur
    transactionFeePct: 1.5
    plans:
    - key: owner_monthly
      price: 39
      interval: month
      label:
        it: TavoloPronto — locale
        en: TavoloPronto — venue
      includes:
      - menu e tavoli illimitati
      - ordini e pagamenti al tavolo
      - riepilogo AI di fine giornata
      roles:
      - admin
  extensions:
  - key: anonymous_orders
    description: 'I clienti ordinano senza registrarsi, ma gli agenti anonimi non possono scrivere in collezioni app/shared:
      serve codice per creare ordini dal menu pubblico, dividere il conto e collegare il pagamento Stripe Connect del locale
      (incassi diretti al ristoratore).'
  - key: qr_codes
    description: Generazione e stampa del QR per tavolo (link /v/menu?table=<codice>) non è ancora disponibile.
  - key: photo_upload
    description: 'Il caricamento di foto non è disponibile: il menu usa un link alla foto.'
  - key: ready_notification
    description: La notifica sul telefono del cliente quando l'ordine è pronto non è disponibile (nessuna notifica supportata).
  - key: kitchen_printer
    description: La stampa delle comande sulla stampante di cucina richiede un connettore dedicato, non disponibile.
  - key: shift_scoping
    description: 'Il cameriere dovrebbe vedere solo gli ordini del suo turno e il titolare tutti: il filtro per turno e il
      cambio di stato da parte del personale richiedono logica custom.'
  - key: menu_language_switch
    description: Il selettore di lingua del menu (IT/EN) per il cliente è da implementare; il menu ha già i campi nelle due
      lingue.
