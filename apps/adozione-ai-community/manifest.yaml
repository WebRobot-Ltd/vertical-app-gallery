apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: ai-academy-team
  displayName: AI Academy Team
  tagline:
    it: Percorsi, community e un tutor AI per far adottare l'AI a tutto il team.
    en: Learning paths, community and an AI tutor to bring your whole team to AI.
  description:
    it: 'Piattaforma per le imprese: i collaboratori seguono percorsi formativi sull''AI (lezioni, quiz, progetti pratici),
      un agente consiglia i contenuti giusti per ruolo e livello e risponde citando i materiali; quando non sa, passa la domanda
      a un tutor umano. Il responsabile formazione segue l''avanzamento del team.'
    en: 'A platform for companies: employees follow AI learning paths (lessons, quizzes, hands-on projects), an agent recommends
      the right content for role and level and answers citing the course materials; when it does not know, it hands the question
      to a human tutor. The training manager follows the team''s progress.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#1d2b53'
      accent: '#0e9f8e'
      background: '#f7f9fc'
      foreground: '#17202e'
    fonts:
      body: Inter
      display: Sora
    wordmark:
    - text: AI Academy
      color: primary
    - text: ' Team'
      color: accent
    width: wide
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Per chi
        en: Who it is for
      href: '#per-chi'
    - label:
        it: Piani
        en: Plans
      href: '#piani'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: manager
      label:
        it: Responsabile formazione
        en: Training manager
      assignedBy: invite
    - key: tutor
      label:
        it: Tutor
        en: Tutor
      assignedBy: invite
    - key: user
      label:
        it: Collaboratore
        en: Learner
      assignedBy: signup
  limits:
  - action: chat
    per: user
    max: 60
    window: day
    roles:
    - user
    - manager
  agents:
  - key: coach
    role: main
    description: Recommends content by role and level, answers from the course materials citing the source, escalates to a
      human tutor when unsure.
    memory: user
    awaits:
    - tutor_answer
    profile:
      inline:
        display_name: AI Academy coach
        chat_mode: true
        crews:
        - id: coach
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the learning coach of AI Academy Team, a platform where company employees learn to use AI.
            You do three things.

            1) RECOMMEND: when asked what to study, or when the learner''s role or level is unknown, ask for role and level
            (beginner, intermediate, advanced) in one short question, then use search_courses and read_progress to propose
            3-5 next items (lessons, quizzes, hands-on projects) in order, with a one-line reason each. Do not recommend what
            is already completed.

            2) ANSWER: answer questions ONLY from the course materials returned by search_courses. Always cite the source
            at the end of the answer as ''Fonte / Source: <course title> — <lesson title>''. Never invent content, figures
            or links, and do not answer from general knowledge as if it were course material.

            3) ESCALATE: if search_courses returns nothing relevant, or you are not sure, say so honestly, log the question
            with log_question (topic in 1-3 words) and call request_tutor_answer with the question and topic, so a human tutor
            replies. Tell the learner a tutor will answer.

            Always call log_question for every learner question with its topic, so the training manager can see which topics
            need more support. Use update_progress only when the learner says they completed an item or reports a quiz score.
            Reply in the language with ISO code given in the goal, concise, friendly, in Markdown. No legal, HR or financial
            advice.'
    appTools:
    - name: search_courses
      description: Search the course materials (lessons, quizzes, projects) by keyword, level or target role
      action: search
      collection: courses
      scope: all
    - name: read_progress
      description: Read the current user's progress records
      action: read
      collection: progress
      scope: user
    - name: update_progress
      description: Record that the current user completed an item or got a quiz score
      action: write
      collection: progress
      scope: user
    - name: log_question
      description: Log a learner question with its topic and status
      action: append
      collection: questions
      scope: user
    goalTemplate: 'User: {user} (role {role}). Today is {date}. Reply in the language with ISO code {lang}.

      Conversation so far:

      {history}

      New message: {message}'
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.4
  approvals:
  - key: tutor_answer
    title:
      it: Domanda per il tutor
      en: Question for the tutor
    description: The agent could not answer from the course materials; a human tutor replies.
    role: tutor
    fields:
    - question
    - topic
    timeoutMinutes: 4320
    onTimeout: reject
    decidedBy: role
  data:
    collections:
    - name: courses
      ownedBy: shared
      searchable: true
      description: 'Learning paths: lessons, quizzes and hands-on projects, managed by the platform admin'
      fields:
      - name: title
        type: text
        required: true
        label:
          it: Titolo
          en: Title
      - name: path
        type: text
        label:
          it: Percorso
          en: Path
      - name: kind
        type: select
        label:
          it: Tipo
          en: Type
        options:
        - value: lesson
          label:
            it: Lezione
            en: Lesson
        - value: quiz
          label: Quiz
        - value: project
          label:
            it: Progetto pratico
            en: Hands-on project
      - name: level
        type: select
        label:
          it: Livello
          en: Level
        options:
        - value: beginner
          label:
            it: Base
            en: Beginner
        - value: intermediate
          label:
            it: Intermedio
            en: Intermediate
        - value: advanced
          label:
            it: Avanzato
            en: Advanced
      - name: target_role
        type: text
        label:
          it: Ruolo target
          en: Target role
      - name: summary
        type: textarea
        label:
          it: Sintesi
          en: Summary
      - name: body
        type: textarea
        label:
          it: Contenuto
          en: Content
      - name: url
        type: url
        label: URL
    - name: progress
      ownedBy: user
      sharing:
      - viewer
      description: Each learner's progress per item; the learner can share it with their training manager
      fields:
      - name: course_title
        type: text
        required: true
        label:
          it: Contenuto
          en: Item
      - name: path
        type: text
        label:
          it: Percorso
          en: Path
      - name: status
        type: select
        label:
          it: Stato
          en: Status
        options:
        - value: todo
          label:
            it: Da fare
            en: To do
        - value: in_progress
          label:
            it: In corso
            en: In progress
        - value: done
          label:
            it: Completato
            en: Done
      - name: score
        type: number
        label:
          it: Punteggio
          en: Score
      - name: updated
        type: date
        label:
          it: Aggiornato
          en: Updated
    - name: questions
      ownedBy: user
      sharing:
      - viewer
      description: Questions asked to the coach, with topic and whether a tutor was needed
      fields:
      - name: question
        type: textarea
        label:
          it: Domanda
          en: Question
      - name: topic
        type: text
        label:
          it: Tema
          en: Topic
      - name: status
        type: select
        label:
          it: Stato
          en: Status
        options:
        - value: answered
          label:
            it: Risposta dall'agente
            en: Answered by agent
        - value: escalated
          label:
            it: Passata al tutor
            en: Escalated to tutor
      - name: asked
        type: date
        label: Data
  views:
  - key: home
    type: page
    nav: false
    title: AI Academy Team
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow:
        it: Formazione AI per le imprese
        en: AI training for companies
      title:
        it: Porta tutto il team a usare l'**AI**, con un tutor sempre a disposizione.
        en: Bring your whole team to **AI**, with a tutor always at hand.
      text:
        it: Percorsi con lezioni, quiz e progetti pratici, una community per le domande e un agente che consiglia cosa studiare
          e risponde citando i materiali. Quando non sa, passa la domanda a un tutor umano.
        en: Paths with lessons, quizzes and hands-on projects, a community for questions, and an agent that recommends what
          to study and answers citing the course materials. When it does not know, it hands the question to a human tutor.
      actions:
      - label:
          it: Inizia a imparare
          en: Start learning
        href: /login
        style: primary
      - label:
          it: Vedi i piani
          en: See plans
        href: '#piani'
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - badge: 🎯
        title:
          it: Percorso su misura
          en: A tailored path
        text:
          it: L'agente consiglia lezioni, quiz e progetti in base a ruolo e livello.
          en: The agent recommends lessons, quizzes and projects by role and level.
      - badge: 💬
        title:
          it: Domande con fonte
          en: Questions with sources
        text:
          it: Risposte basate sui materiali del corso, con la fonte citata.
          en: Answers based on the course materials, with the source cited.
      - badge: 🧑‍🏫
        title:
          it: Tutor umano
          en: Human tutor
        text:
          it: Se l'agente non sa, la domanda passa a un tutor che risponde.
          en: If the agent does not know, the question goes to a tutor who replies.
      - badge: 📈
        title:
          it: Avanzamento del team
          en: Team progress
        text:
          it: Il responsabile formazione vede progressi e temi che richiedono più supporto.
          en: The training manager sees progress and the topics that need more support.
    - type: cards
      id: per-chi
      title:
        it: Per chi
        en: Who it is for
      items:
      - title:
          it: Collaboratori
          en: Learners
        text:
          it: I tuoi corsi, i tuoi risultati e un coach che risponde alle tue domande.
          en: Your courses, your results and a coach that answers your questions.
      - title:
          it: Responsabile formazione
          en: Training managers
        text:
          it: Avanzamento dei collaboratori e temi critici della tua azienda.
          en: Your employees' progress and your company's critical topics.
      - title:
          it: Admin della piattaforma
          en: Platform admins
        text:
          it: Gestione dei contenuti e visione d'insieme.
          en: Content management and the full picture.
    - type: cards
      id: piani
      title:
        it: Piani aziendali per numero di utenti
        en: Company plans by number of users
      items:
      - title: Team 10
        text:
          it: Fino a 10 utenti.
          en: Up to 10 users.
      - title: Team 50
        text:
          it: Fino a 50 utenti.
          en: Up to 50 users.
      - title: Team 200
        text:
          it: Fino a 200 utenti.
          en: Up to 200 users.
    - type: note
      content:
        it: 'Questa app è lo strato software: consulenza e servizi erogati da persone sono offerti a parte. L''agente non
          fornisce consulenza legale o HR.'
        en: 'This app is the software layer: consulting and human-delivered services are offered separately. The agent gives
          no legal or HR advice.'
  - key: assistant
    type: chat
    title:
      it: Coach AI
      en: AI coach
    source: agent:coach
    placeholder:
      it: Chiedi cosa studiare o fai una domanda sul corso…
      en: Ask what to study or a question about the course…
    examples:
    - it: 'Sono un responsabile marketing, livello base: da dove parto?'
      en: 'I am a marketing lead, beginner level: where do I start?'
    - it: Cos'è un prompt efficace?
      en: What makes an effective prompt?
    - it: Cosa mi manca per finire il percorso base?
      en: What is left to finish the beginner path?
    roles:
    - user
    - manager
    - admin
  - key: catalog
    type: page
    title:
      it: Corsi
      en: Courses
    roles:
    - user
    - manager
    - admin
    sections:
    - type: data
      source: collection:courses
      display: cards
      fields:
      - key: title
        label:
          it: Titolo
          en: Title
      - key: path
        label:
          it: Percorso
          en: Path
      - key: kind
        label:
          it: Tipo
          en: Type
        format: badge
      - key: level
        label:
          it: Livello
          en: Level
        format: badge
      - key: summary
        label:
          it: Sintesi
          en: Summary
      sort:
        field: path
        dir: asc
      limit: 100
      empty:
        it: Nessun contenuto ancora.
        en: No content yet.
  - key: my_results
    type: page
    title:
      it: I miei risultati
      en: My results
    roles:
    - user
    - manager
    - admin
    sections:
    - type: data
      source: collection:progress
      display: kpi
      kpis:
      - label:
          it: Elementi
          en: Items
        agg: count
      - label:
          it: Punteggio medio
          en: Average score
        agg: avg
        field: score
        format: number
    - type: data
      source: collection:progress
      display: table
      fields:
      - key: course_title
        label:
          it: Contenuto
          en: Item
      - key: path
        label:
          it: Percorso
          en: Path
      - key: status
        label:
          it: Stato
          en: Status
        format: badge
      - key: score
        label:
          it: Punteggio
          en: Score
        format: number
      - key: updated
        label:
          it: Aggiornato
          en: Updated
        format: date
      sort:
        field: updated
        dir: desc
      limit: 100
  - key: team
    type: page
    title:
      it: Il mio team
      en: My team
    roles:
    - manager
    - admin
    sections:
    - type: data
      title:
        it: Avanzamento
        en: Progress
      source: collection:progress
      display: table
      fields:
      - key: course_title
        label:
          it: Contenuto
          en: Item
      - key: path
        label:
          it: Percorso
          en: Path
      - key: status
        label:
          it: Stato
          en: Status
        format: badge
      - key: score
        label:
          it: Punteggio
          en: Score
        format: number
      - key: updated
        label:
          it: Aggiornato
          en: Updated
        format: date
      sort:
        field: updated
        dir: desc
      limit: 200
    - type: data
      title:
        it: Temi che richiedono più supporto
        en: Topics needing more support
      source: collection:questions
      display: table
      fields:
      - key: topic
        label:
          it: Tema
          en: Topic
      - key: question
        label:
          it: Domanda
          en: Question
      - key: status
        label:
          it: Stato
          en: Status
        format: badge
      - key: asked
        label: Data
        format: date
      sort:
        field: asked
        dir: desc
      limit: 200
  - key: tutor_queue
    type: approvals
    title:
      it: Domande per il tutor
      en: Tutor queue
    approvals:
    - tutor_answer
    roles:
    - tutor
    - admin
  - key: content_admin
    type: admin
    title:
      it: Gestione contenuti
      en: Content management
    source: collection:courses
    roles:
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - manager
    - admin
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: team_10
      price: 99
      interval: month
      label: Team 10
      includes:
      - up to 10 users
      roles:
      - manager
    - key: team_50
      price: 399
      interval: month
      label: Team 50
      includes:
      - up to 50 users
      roles:
      - manager
    - key: team_200
      price: 1290
      interval: month
      label: Team 200
      includes:
      - up to 200 users
      roles:
      - manager
  extensions:
  - key: company_scoping
    description: 'Records are scoped per user, not per company: the training manager sees only progress and questions the
      learners share with them (sharing viewer). Automatic scoping of a company''s employees to its manager, and admin-wide
      aggregates, need custom logic.'
  - key: seat_limits
    description: Plans are priced by number of users (10/50/200) but the runtime does not yet enforce a seat cap or invite
      employees by company.
  - key: monthly_email_report
    description: 'Monthly report to the training manager by email: notifications and email digests are not available yet.
      For now the manager reads the team view.'
  - key: community
    description: Community forum (public threads, replies between learners) is not available as a view type; questions go
      to the coach and, when needed, to a human tutor.
  - key: files
    description: 'Uploading course files is not available: the admin enters lessons as text and links in the courses collection.'
