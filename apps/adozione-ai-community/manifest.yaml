apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: ai-academy-impresa
  displayName: AI Academy
  tagline:
    it: Percorsi, community e un tutor AI per portare l'AI in azienda.
    en: Learning paths, community and an AI tutor to bring AI into your company.
  description:
    it: 'Piattaforma formativa per le imprese: percorsi sull''AI con lezioni, quiz e progetti, un assistente che consiglia
      i contenuti e risponde citando i materiali, tutor umani quando serve e report mensili per il responsabile formazione.'
    en: 'Training platform for companies: AI learning paths with lessons, quizzes and projects, an assistant that recommends
      content and answers citing the course materials, human tutors when needed and monthly reports for the training manager.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#1d2b53'
      accent: '#e4572e'
      background: '#f7f8fb'
      foreground: '#18202e'
    fonts:
      body: Inter
      display: Sora
    wordmark:
    - text: AI
      color: accent
    - text: ' Academy'
      color: primary
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Per le aziende
        en: For companies
      href: '#aziende'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: manager
      label:
        it: Responsabile formazione
        en: Training manager
      assignedBy: derived
      from: collection:companies.manager_email
    - key: tutor
      label:
        it: Tutor
        en: Tutor
      assignedBy: invite
    - key: user
      assignedBy: signup
  limits:
  - action: chat
    per: user
    max: 60
    window: day
    roles:
    - user
  agents:
  - key: assistant
    role: main
    description: Recommends content by role and level, answers from the course materials citing the source, escalates to a
      human tutor when unsure.
    memory: user
    profile:
      inline:
        display_name: AI Academy assistant
        crews:
        - id: assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the learning assistant of a corporate AI training platform. You do two things.

            1) Recommend: using the user''s role and level (context) and their progress (tool my_progress), propose 2-4 next
            courses or lessons from the catalogue (tool read_courses), with a one-line reason each. Never recommend content
            that does not exist in the catalogue.

            2) Answer questions ONLY from the course materials: always call search_lessons first and answer from what it returns.
            Cite the source at the end of the answer as ''Source: <course> — <lesson title>''. If the materials do not cover
            the question, or you are not sure, do NOT guess: say so, then call escalate_to_tutor once with the question, its
            topic and status ''escalated'', and tell the user a human tutor will answer in the community inbox. Reply in the
            user''s language, briefly and concretely. Never invent figures, course names or sources. Use the tool remember
            at the end with the user''s interests and open topics (a few lines).'
    context:
    - key: user_role
      from: collection:profiles.job_role
    - key: user_level
      from: collection:profiles.level
    - key: manager_email
      from: collection:profiles.manager_email
    goalTemplate: 'User role: {?user_role}{user_role}{/user_role}{!user_role}not set{/user_role}. Level: {?user_level}{user_level}{/user_level}{!user_level}not
      set{/user_level}. Manager email for escalations: {manager_email}.

      Conversation so far:

      {history}

      New message: {message}

      Reply in the language with ISO code {lang}.'
    appTools:
    - name: read_courses
      description: List the courses of the catalogue (title, level, target role, topics)
      action: read
      collection: courses
      scope: all
    - name: search_lessons
      description: Search the lessons, quizzes and projects (the course materials)
      action: search
      collection: lessons
      scope: all
    - name: my_progress
      description: The user's own progress and quiz scores
      action: read
      collection: progress
      scope: user
    - name: escalate_to_tutor
      description: Save a question for the human tutors
      action: write
      collection: questions
      scope: user
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.3
  - key: reporter
    role: helper
    description: 'Monthly report for a training manager: progress, results and topics needing more support.'
    memory: instance
    writesTo:
      collection: monthly_reports
    profile:
      inline:
        display_name: AI Academy monthly reporter
        crews:
        - id: reporter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write the monthly training report for the training manager of one company. Use only the data
            returned by the tools (you only see this company''s records): team_progress, team_profiles, team_questions. Start
            with ''# <Company> — training report <month>''. Sections with ## headings: Summary (enrolled, active, completion
            rate), Progress by course, Results (average quiz scores), Topics needing more support (low scores, many escalated
            questions), Who may need a nudge (first names/emails only as in data), Suggested actions. Add one chart as a fenced
            block ```chart {"type":"bar","title":"…","labels":[…],"series":[{"name":"…","values":[…]}]}``` with real figures
            only. Compare with your memory of last month, then call remember with the key figures. Never invent numbers; say
            when data is missing.'
    appTools:
    - name: team_progress
      description: Progress records of the manager's company
      action: read
      collection: progress
      scope: all
    - name: team_profiles
      description: Learner profiles of the manager's company
      action: read
      collection: profiles
      scope: all
    - name: team_questions
      description: Questions asked in the community by the company's learners
      action: read
      collection: questions
      scope: all
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.5
  templates:
  - key: monthly_report
    title:
      it: Report mensile
      en: Monthly report
    description:
      it: Ogni mese un report via email su avanzamento, risultati e temi da supportare.
      en: A monthly emailed report on progress, results and topics needing support.
    agent: reporter
    params:
    - name: company
      type: text
      required: true
      label:
        it: Azienda
        en: Company
    goal: Write the monthly training report for the company "{company}". Today is {date}. Write it in the language with ISO
      code {lang}.
    schedule:
      cron: 0 7 1 * *
      userCanChange: false
    maxPerUser: 1
    roles:
    - manager
    - admin
    deliver:
      to: owner
      subject: '{title}'
      onlyIfNew: true
  data:
    collections:
    - name: companies
      description: Customer companies and their training manager
      ownedBy: org
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Azienda
          en: Company
      - name: manager_email
        type: email
        required: true
        label:
          it: Email del responsabile formazione
          en: Training manager email
      - name: seats
        type: number
        label:
          it: Posti acquistati
          en: Seats purchased
      access:
      - role: manager
        where:
          manager_email: '{user.email}'
        can:
        - read
    - name: courses
      description: Learning paths
      ownedBy: shared
      searchable: true
      fields:
      - name: title
        type: text
        required: true
        label:
          it: Titolo
          en: Title
      - name: level
        type: select
        options:
        - beginner
        - intermediate
        - advanced
        label:
          it: Livello
          en: Level
      - name: target_role
        type: text
        label:
          it: Ruolo target
          en: Target role
      - name: topics
        type: text
        label:
          it: Temi
          en: Topics
      - name: description
        type: textarea
        label:
          it: Descrizione
          en: Description
    - name: lessons
      description: 'Lessons, quizzes and practical projects: the course materials the assistant cites'
      ownedBy: shared
      searchable: true
      fields:
      - name: course
        type: text
        required: true
        label:
          it: Corso
          en: Course
      - name: title
        type: text
        required: true
        label:
          it: Titolo
          en: Title
      - name: kind
        type: select
        options:
        - lesson
        - quiz
        - project
        label:
          it: Tipo
          en: Type
      - name: topic
        type: text
        label:
          it: Tema
          en: Topic
      - name: content
        type: textarea
        label:
          it: Contenuto
          en: Content
    - name: profiles
      description: Each learner's role, level and company
      ownedBy: user
      fields:
      - name: job_role
        type: text
        required: true
        label:
          it: Ruolo in azienda
          en: Job role
      - name: level
        type: select
        required: true
        options:
        - beginner
        - intermediate
        - advanced
        label:
          it: Livello AI
          en: AI level
      - name: company
        type: text
        required: true
        label:
          it: Azienda
          en: Company
      - name: manager_email
        type: email
        required: true
        label:
          it: Email del responsabile formazione
          en: Training manager email
      access:
      - role: manager
        where:
          manager_email: '{user.email}'
        can:
        - read
    - name: progress
      description: Lesson, quiz and project results of each learner
      ownedBy: user
      fields:
      - name: course
        type: text
        required: true
        label:
          it: Corso
          en: Course
      - name: lesson
        type: text
        required: true
        label:
          it: Lezione
          en: Lesson
      - name: topic
        type: text
        label:
          it: Tema
          en: Topic
      - name: status
        type: select
        required: true
        options:
        - started
        - completed
        label:
          it: Stato
          en: Status
      - name: score
        type: number
        label:
          it: Punteggio quiz (0-100)
          en: Quiz score (0-100)
      - name: manager_email
        type: email
        required: true
        label:
          it: Email del responsabile formazione
          en: Training manager email
      access:
      - role: manager
        where:
          manager_email: '{user.email}'
        can:
        - read
    - name: questions
      description: Community questions escalated to human tutors
      ownedBy: user
      retentionDays: 730
      fields:
      - name: question
        type: textarea
        required: true
        label:
          it: Domanda
          en: Question
      - name: topic
        type: text
        label:
          it: Tema
          en: Topic
      - name: status
        type: select
        options:
        - escalated
        - answered
        default: escalated
        label:
          it: Stato
          en: Status
      - name: answer
        type: textarea
        label:
          it: Risposta del tutor
          en: Tutor answer
      - name: manager_email
        type: email
        label:
          it: Email del responsabile formazione
          en: Training manager email
      access:
      - role: tutor
        can:
        - read
        - write
      - role: manager
        where:
          manager_email: '{user.email}'
        can:
        - read
    - name: monthly_reports
      ownedBy: instance
      description: Monthly reports of each company
  views:
  - key: home
    type: page
    nav: false
    title: AI Academy
    sections:
    - type: hero
      title:
        it: Porta l'**AI** in azienda, un percorso alla volta.
        en: Bring **AI** into your company, one path at a time.
      text:
        it: Percorsi con lezioni, quiz e progetti, una community per fare domande e un assistente che consiglia cosa studiare
          e risponde citando i materiali.
        en: Paths with lessons, quizzes and projects, a community to ask questions and an assistant that recommends what to
          study and answers citing the materials.
      actions:
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Percorsi su misura
          en: Tailored paths
        text:
          it: L'assistente consiglia i contenuti in base a ruolo e livello.
          en: The assistant recommends content by role and level.
      - title:
          it: Domande con fonte
          en: Sourced answers
        text:
          it: Risposte dai materiali del corso, con la fonte citata. Se non sa, passa a un tutor umano.
          en: Answers from the course materials with the source cited. If unsure, a human tutor takes over.
      - title:
          it: Avanzamento chiaro
          en: Clear progress
        text:
          it: Il responsabile formazione vede progressi e temi da supportare e riceve un report mensile.
          en: The training manager sees progress and topics needing support, and gets a monthly report.
    - type: cards
      id: aziende
      title:
        it: Per le aziende
        en: For companies
      items:
      - title:
          it: Abbonamento per numero di utenti
          en: Subscription by number of users
        text:
          it: Iscrivi i tuoi collaboratori e scegli il piano in base ai posti.
          en: Enrol your people and pick the plan by seats.
    - type: note
      content:
        it: La consulenza e i servizi erogati da persone sono offerti separatamente.
        en: Consulting and services delivered by people are offered separately.
  - key: assistant_chat
    type: chat
    title:
      it: Assistente
      en: Assistant
    source: agent:assistant
    examples:
    - it: Che corso mi consigli?
      en: Which course do you recommend?
    - it: Come scrivo un buon prompt?
      en: How do I write a good prompt?
    placeholder:
      it: Chiedi un consiglio o fai una domanda sul corso…
      en: Ask for advice or a question about the course…
    roles:
    - user
    - manager
    - admin
  - key: profile
    type: form
    title:
      it: Il mio profilo
      en: My profile
    collection: profiles
    edit: true
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Profilo salvato
        en: Profile saved
      redirect: assistant_chat
    roles:
    - user
    - manager
  - key: courses_list
    type: cards
    title:
      it: Corsi
      en: Courses
    source: collection:courses
    roles:
    - user
    - manager
    - admin
  - key: log_progress
    type: form
    title:
      it: Registra risultato
      en: Log a result
    collection: progress
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Risultato registrato
        en: Result saved
      redirect: my_progress
    roles:
    - user
  - key: my_progress
    type: table
    title:
      it: I miei risultati
      en: My results
    source: collection:progress
    columns:
    - course
    - lesson
    - status
    - score
    roles:
    - user
  - key: ask_tutor
    type: form
    title:
      it: Chiedi a un tutor
      en: Ask a tutor
    collection: questions
    submit:
      label:
        it: Invia
        en: Send
      message:
        it: Domanda inviata ai tutor
        en: Question sent to the tutors
    roles:
    - user
  - key: my_questions
    type: table
    title:
      it: Le mie domande
      en: My questions
    source: collection:questions
    columns:
    - question
    - status
    - answer
    roles:
    - user
  - key: team_progress_view
    type: table
    title:
      it: Avanzamento del team
      en: Team progress
    source: collection:progress
    columns:
    - course
    - lesson
    - status
    - score
    export: true
    roles:
    - manager
    - admin
  - key: team_topics
    type: chart
    title:
      it: Temi che richiedono supporto
      en: Topics needing support
    source: collection:progress
    data:
      display: chart
      chart: bar
      fields:
      - key: topic
        label:
          it: Tema
          en: Topic
      - key: avg_score
        label:
          it: Punteggio medio
          en: Average score
      groupBy:
        field: topic
        aggs:
        - key: avg_score
          agg: avg
          field: score
    roles:
    - manager
    - admin
  - key: team_reports
    type: instances
    title:
      it: Report mensile
      en: Monthly report
    template: monthly_report
    roles:
    - manager
    - admin
  - key: tutor_queue
    type: table
    title:
      it: Domande per i tutor
      en: Tutor queue
    source: collection:questions
    columns:
    - question
    - topic
    - status
    roles:
    - tutor
    - admin
  - key: answer
    type: form
    title:
      it: Rispondi
      en: Answer
    collection: questions
    fields:
    - answer
    - status
    edit: true
    nav: false
    submit:
      label:
        it: Invia risposta
        en: Send answer
      redirect: tutor_queue
    roles:
    - tutor
    - admin
  - key: admin_course
    type: form
    title:
      it: Nuovo corso
      en: New course
    collection: courses
    edit: true
    roles:
    - admin
  - key: admin_lesson
    type: form
    title:
      it: Nuova lezione
      en: New lesson
    collection: lessons
    edit: true
    roles:
    - admin
  - key: admin_lessons
    type: table
    title:
      it: Contenuti
      en: Content
    source: collection:lessons
    columns:
    - course
    - title
    - kind
    - topic
    roles:
    - admin
  - key: admin_company
    type: form
    title:
      it: Nuova azienda
      en: New company
    collection: companies
    edit: true
    roles:
    - admin
  - key: admin_companies
    type: table
    title:
      it: Aziende
      en: Companies
    source: collection:companies
    columns:
    - name
    - manager_email
    - seats
    export: true
    roles:
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - manager
    - admin
  triggers:
  - key: question_escalated
    description: Tell the tutors a question needs a human
    'on':
      collection: questions
      op: insert
      where:
        status: escalated
    notify:
      to: role:tutor
      subject:
        it: Nuova domanda per i tutor
        en: New question for the tutors
      body:
        it: 'Un utente ha una domanda a cui l''assistente non sa rispondere:

          {record.question}'
        en: 'A learner has a question the assistant could not answer:

          {record.question}'
      link: tutor_queue
  - key: question_answered
    description: Tell the learner the tutor answered
    'on':
      collection: questions
      op: update
      where:
        status: answered
    notify:
      to: owner
      subject:
        it: Un tutor ha risposto
        en: A tutor answered
      body:
        it: 'Domanda: {record.question}


          Risposta: {record.answer}'
        en: 'Question: {record.question}


          Answer: {record.answer}'
      link: my_questions
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: team
      price: 199
      interval: month
      label:
        it: Team — fino a 25 utenti
        en: Team — up to 25 users
      roles:
      - manager
      - admin
    - key: business
      price: 599
      interval: month
      label:
        it: Business — fino a 100 utenti
        en: Business — up to 100 users
      roles:
      - manager
      - admin
    - key: enterprise
      price: 1499
      interval: month
      label:
        it: Enterprise — fino a 500 utenti
        en: Enterprise — up to 500 users
      roles:
      - manager
      - admin
  extensions:
  - key: seat_limits
    description: Enforcing the per-company seat limit of the plan (25/100/500 learners) is not expressible per company; the
      admin records seats in companies and checks them.
  - key: auto_manager_link
    description: Learners' manager_email is typed in the profile and progress forms; automatic linking from the learner's
      company is not available.
