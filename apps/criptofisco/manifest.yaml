apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: criptofisco
  displayName: CriptoFisco
  tagline:
    it: Plusvalenze cripto e dati per i quadri RT e RW, pronti per la dichiarazione.
  description:
    it: 'Collega exchange e wallet, carica i CSV: gli agenti importano le transazioni, riconciliano i trasferimenti, calcolano
      plusvalenze e minusvalenze e preparano il prospetto per quadro RT e RW. Il commercialista delegato approva il report
      finale.'
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12304a'
      accent: '#e0a21b'
      background: '#f7f8fa'
      foreground: '#16202b'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Cripto
      color: primary
    - text: Fisco
      color: accent
  header:
    links:
    - label: Come funziona
      href: '#come-funziona'
    - label: Sicurezza
      href: '#sicurezza'
    cta:
      label: Inizia
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: taxpayer
      label: Contribuente
      assignedBy: signup
    - key: accountant
      label: Commercialista
      assignedBy: derived
      from: collection:delegations.accountant_email
  limits:
  - action: agent:calculator
    per: user
    max: 10
    window: day
    roles:
    - taxpayer
  - action: create:transactions
    max: 200
    window: total
    roles:
    - taxpayer
    plans:
      fascia_2000: 2000
      fascia_illimitata: -1
  egress:
    hosts:
    - blockstream.info
    - eth.blockscout.com
    - api.coingecko.com
    - api.binance.com
    notes: 'Explorer pubblici (Blockstream per BTC, Blockscout per ETH) e CoinGecko per prezzi storici, nei limiti dei termini
      d''uso con attribuzione. Binance: chiave API in sola lettura dell''utente.'
  agents:
  - key: calculator
    role: main
    description: Applica il metodo di calcolo, determina valori di inizio/fine anno (RW), plusvalenze/minusvalenze (RT), imposta
      dovuta e segnala le transazioni dubbie.
    delegates:
    - importer
    awaits:
    - cpa_review
    context:
    - key: accountant_email
      from: collection:delegations.accountant_email
    profile:
      inline:
        display_name: CriptoFisco calcolo
        crews:
        - id: calculator
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un assistente fiscale per cripto-attività per contribuenti residenti in Italia. Procedi così:
            1) chiedi all''agente importer (ask_importer) di importare e riconciliare tutte le transazioni dell''anno fiscale
            richiesto e dei precedenti (servono per il costo storico); 2) leggi le transazioni con read_tx; 3) applica il
            metodo scelto (FIFO, LIFO o costo medio) per lotto, in euro; 4) calcola per il quadro RT: corrispettivi, costi,
            plusvalenze e minusvalenze, minusvalenze riportabili, imposta sostitutiva dovuta all''aliquota vigente per l''anno
            fiscale (indica sempre l''aliquota e la norma usate, e la soglia di esenzione se applicabile per l''anno); 5)
            per il quadro RW: valore a inizio anno, valore a fine anno (prezzi in euro al 1 gennaio e al 31 dicembre), giorni
            di detenzione, per ciascuna piattaforma o wallet; 6) marca con save_tx needs_review=true e un motivo ogni transazione
            dubbia (trasferimenti non abbinati, prezzi mancanti, airdrop o staking di classificazione incerta, costo non determinabile)
            e NON includerla nei totali definitivi: elencala nel report; 7) salva il riepilogo con save_summary. Se l''accountant_email
            non è vuoto, chiedi con request_cpa_review l''approvazione del commercialista prima di dichiarare il report definitivo;
            altrimenti indica che il report è una bozza non verificata. Non inventare mai importi o prezzi; non è consulenza
            fiscale: il contribuente o il commercialista verificano. Il report inizia con un titolo ''# Prospetto cripto-attività
            — anno <anno>'', poi sezioni ## Riepilogo, ## Quadro RT, ## Quadro RW, ## Transazioni da confermare, ## Ipotesi
            e metodo. Usa tabelle Markdown per quadro e un blocco ```chart con le plusvalenze per mese. Dopo il report, aggiungi
            come ultimo elemento un blocco JSON con: tax_year, residence, method, gains, losses, tax_due, rw_start_value,
            rw_end_value, review_count, accountant_email, status (draft|pending_review).'
    goalTemplate: 'Anno fiscale: {tax_year}

      Residenza fiscale: {residence_label}

      Metodo di calcolo: {method_label}

      {?notes}Note del contribuente: {notes}{/notes}

      {?csv_files}CSV caricati (file id): {csv_files}

      Testo dei CSV:

      {csv_files_text}{/csv_files}

      Commercialista delegato: {accountant_email}

      Oggi è {date}. Scrivi in italiano.'
    appTools:
    - name: read_tx
      description: Legge le transazioni importate dell'utente
      action: read
      collection: transactions
      scope: user
    - name: save_tx
      description: Aggiorna o salva una transazione
      action: write
      collection: transactions
      scope: user
    - name: save_summary
      description: Salva il riepilogo fiscale dell'anno
      action: write
      collection: tax_summary
      scope: user
    output: markdown+json
    resultSchema:
      type: object
      properties:
        tax_year:
          type: integer
        residence:
          type: string
        method:
          type: string
        gains:
          type: number
        losses:
          type: number
        tax_due:
          type: number
        rw_start_value:
          type: number
        rw_end_value:
          type: number
        review_count:
          type: integer
        accountant_email:
          type: string
        status:
          type: string
    writesTo:
      collection: tax_reports
      parse: json_last
      keyBy: tax_year
    limits:
      maxTurns: 40
      maxBudgetUsd: 1.5
  - key: importer
    role: helper
    description: Importa transazioni da exchange, explorer on-chain e CSV, riconcilia i trasferimenti interni, classifica
      e recupera i prezzi in euro.
    context:
    - key: wallets
      from: collection:wallets
    profile:
      inline:
        display_name: CriptoFisco importer
        crews:
        - id: importer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 60
          max_budget_usd: 2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Importi le transazioni cripto di un contribuente. Fonti: gli exchange collegati (se la chiave non
            è collegata, dillo e passa ai CSV), gli indirizzi pubblici dei wallet (read_wallets: BTC con btc_explorer, EVM/ETH
            con eth_explorer) e i CSV caricati (read_upload per file/immagini). Per ogni operazione salva con save_tx: date,
            type (acquisto, vendita, swap, staking, airdrop, commissione, trasferimento), asset, quantity, eur_value, fee_eur,
            source, tx_hash, price_source, needs_review, review_reason. Riconcilia: un''uscita da un conto proprio e un''entrata
            di pari quantità (meno commissioni) su un altro conto proprio nel giro di poche ore è un trasferimento, non una
            vendita; la commissione resta un costo. Prezzi storici in euro con price_history (CoinGecko, /<id>/history?date=DD-MM-YYYY&localization=false);
            se manca un prezzo, needs_review=true. Evita duplicati usando tx_hash o una chiave source+data+quantità. Non inventare
            transazioni né prezzi. Rispondi con un riassunto di conteggi per fonte e per tipo e l''elenco dei problemi.'
    goalTemplate: '{message}'
    appTools:
    - name: read_wallets
      description: Legge gli indirizzi dei wallet dell'utente
      action: read
      collection: wallets
      scope: user
    - name: save_tx
      description: Aggiorna o salva una transazione
      action: write
      collection: transactions
      scope: user
    - name: read_upload
      description: Legge un file caricato dall'utente
      action: read_file
    - name: btc_explorer
      description: 'Transazioni di un indirizzo Bitcoin (path: /<indirizzo>/txs)'
      action: http
      http:
        method: GET
        url: https://blockstream.info/api/address
        allowPath: true
        attribution: Blockstream.info
    - name: eth_explorer
      description: 'Transazioni e trasferimenti token di un indirizzo EVM (path: /<indirizzo>/transactions o /token-transfers)'
      action: http
      http:
        method: GET
        url: https://eth.blockscout.com/api/v2/addresses
        allowPath: true
        attribution: Blockscout
    - name: price_history
      description: 'Prezzo storico in EUR (path: /<coin_id>/history, query: date=DD-MM-YYYY&localization=false)'
      action: http
      http:
        method: GET
        url: https://api.coingecko.com/api/v3/coins
        allowPath: true
        attribution: CoinGecko
    - name: binance_trades
      description: Operazioni dell'account Binance dell'utente (chiave in sola lettura)
      action: http
      http:
        method: GET
        url: https://api.binance.com/api/v3/myTrades
        credential:
          provider: binance
          header: X-MBX-APIKEY
          format: '{secret}'
        attribution: Binance
    output: markdown
    limits:
      maxTurns: 60
      maxBudgetUsd: 2
  inputForm:
    title: Nuovo calcolo
    fields:
    - name: tax_year
      type: select
      required: true
      label: Anno fiscale
      options:
      - '2023'
      - '2024'
      - '2025'
      - '2026'
      default: '2025'
    - name: residence
      type: select
      required: true
      label: Residenza fiscale
      options:
      - value: it
        label: Italia
      - value: other
        label: Altro (non residente)
      default: it
    - name: method
      type: select
      required: true
      label: Metodo di calcolo
      options:
      - value: fifo
        label: FIFO
      - value: lifo
        label: LIFO
      - value: avg
        label: Costo medio
      default: fifo
    - name: csv_files
      type: file
      label: CSV delle piattaforme non supportate
      accept:
      - csv
      - xlsx
      - pdf
      maxMb: 15
      multiple: true
    - name: notes
      type: textarea
      maxLength: 500
      label: Note (facoltative)
  data:
    collections:
    - name: wallets
      ownedBy: user
      description: Indirizzi pubblici dei wallet del contribuente
      fields:
      - name: label
        type: text
        required: true
        label: Nome
      - name: chain
        type: select
        required: true
        label: Rete
        options:
        - bitcoin
        - ethereum
        - altro_evm
      - name: address
        type: text
        required: true
        label: Indirizzo pubblico
    - name: transactions
      ownedBy: user
      description: Transazioni importate e classificate
      retentionDays: 3650
      fields:
      - name: date
        type: date
      - name: type
        type: select
        options:
        - acquisto
        - vendita
        - swap
        - staking
        - airdrop
        - commissione
        - trasferimento
      - name: asset
        type: text
      - name: quantity
        type: number
      - name: eur_value
        type: number
      - name: fee_eur
        type: number
      - name: source
        type: text
      - name: tx_hash
        type: text
      - name: price_source
        type: text
      - name: needs_review
        type: boolean
      - name: review_reason
        type: text
      - name: confirmed
        type: boolean
        label: Confermata dall'utente
      - name: user_note
        type: textarea
        label: Nota
    - name: tax_summary
      ownedBy: user
      description: Riepilogo fiscale per anno
      fields:
      - name: tax_year
        type: number
      - name: gains
        type: number
      - name: losses
        type: number
      - name: tax_due
        type: number
      - name: rw_start_value
        type: number
      - name: rw_end_value
        type: number
      - name: review_count
        type: number
    - name: delegations
      ownedBy: user
      description: Commercialista delegato dal contribuente
      fields:
      - name: accountant_email
        type: email
        required: true
        label: Email del commercialista
      - name: accountant_name
        type: text
        label: Nome
    - name: tax_reports
      ownedBy: user
      description: Report finali per anno, visibili al commercialista delegato
      access:
      - role: accountant
        where:
          accountant_email: '{user.email}'
        can:
        - read
        - write
      fields:
      - name: tax_year
        type: number
      - name: residence
        type: text
      - name: method
        type: text
      - name: gains
        type: number
      - name: losses
        type: number
      - name: tax_due
        type: number
      - name: rw_start_value
        type: number
      - name: rw_end_value
        type: number
      - name: review_count
        type: number
      - name: accountant_email
        type: email
      - name: status
        type: text
    credentials:
    - provider: binance
      kind: api_key
      scope: user
      label: Binance (sola lettura)
      help: Crea in Binance una chiave API con la sola autorizzazione di lettura, senza prelievi né trading, e incollala qui.
        È cifrata e non viene più mostrata.
  approvals:
  - key: cpa_review
    title: Approvazione del commercialista
    role: accountant
    decidedBy: role
    description: Il commercialista verifica e approva il report finale del cliente.
    timeoutMinutes: 10080
    onTimeout: reject
  triggers:
  - key: report_decided
    'on':
      approval: cpa_review
      decision: any
    notify:
      to: owner
      subject: Il commercialista ha esaminato il tuo report cripto
      body: Il tuo commercialista ha deciso sul report fiscale. Aprilo per vedere l'esito.
      link: reports
  views:
  - key: home
    type: page
    nav: false
    sections:
    - type: hero
      title: Plusvalenze cripto e **quadri RT e RW** senza fogli di calcolo
      text: 'Collega exchange e wallet, carica i CSV: gli agenti importano, riconciliano e calcolano. Tu confermi i casi dubbi,
        il commercialista approva.'
      actions:
      - label: Inizia
        href: /login
        style: primary
      note: Supporto alla compilazione, non consulenza fiscale.
    - type: steps
      id: come-funziona
      title: Come funziona
      items:
      - title: Indica anno e metodo
        text: Anno fiscale, residenza e FIFO, LIFO o costo medio.
      - title: Collega le fonti
        text: Chiavi API in sola lettura, indirizzi pubblici, CSV.
      - title: Importazione e calcolo
        text: Trasferimenti tra conti propri riconciliati, prezzi storici in euro, plusvalenze e valori RW.
      - title: Conferma e approva
        text: Confermi le transazioni dubbie; il commercialista delegato approva il report PDF.
    - type: cards
      id: sicurezza
      title: Sicurezza
      items:
      - title: Chiavi cifrate
        text: Cifrate a riposo, mai più visibili, usate dal sistema senza passare dall'agente.
      - title: Solo ciò che autorizzi
        text: Il commercialista vede solo i clienti che lo hanno delegato.
    - type: note
      content: CriptoFisco prepara dati e prospetti; la responsabilità della dichiarazione resta del contribuente e del suo
        professionista.
  - key: new_run
    type: new_run
    title: Nuovo calcolo
    roles:
    - taxpayer
    - admin
  - key: history
    type: history
    title: I miei calcoli
    source: run
    roles:
    - taxpayer
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: dashboard
    type: page
    title: Riepilogo
    roles:
    - taxpayer
    - admin
    sections:
    - type: data
      title: Riepilogo per anno
      source: collection:tax_summary
      display: kpi
      kpis:
      - label: Plusvalenze
        agg: sum
        field: gains
        format: money
      - label: Minusvalenze
        agg: sum
        field: losses
        format: money
      - label: Imposta dovuta
        agg: last
        field: tax_due
        format: money
      - label: Da confermare
        agg: last
        field: review_count
        format: number
    - type: data
      title: Anni
      source: collection:tax_summary
      display: table
      fields:
      - key: tax_year
        label: Anno
      - key: gains
        label: Plusvalenze
        format: money
      - key: losses
        label: Minusvalenze
        format: money
      - key: tax_due
        label: Imposta
        format: money
      - key: rw_start_value
        label: RW inizio anno
        format: money
      - key: rw_end_value
        label: RW fine anno
        format: money
      sort:
        field: tax_year
        dir: desc
  - key: reports
    type: table
    title: Report
    source: collection:tax_reports
    columns:
    - tax_year
    - method
    - gains
    - losses
    - tax_due
    - rw_start_value
    - rw_end_value
    - review_count
    - status
    export: true
    roles:
    - taxpayer
    - admin
  - key: to_confirm
    type: table
    title: Transazioni da confermare
    source: collection:transactions
    query: needs_review = true
    columns:
    - date
    - type
    - asset
    - quantity
    - eur_value
    - source
    - review_reason
    - confirmed
    export: true
    roles:
    - taxpayer
    - admin
  - key: confirm_tx
    type: form
    title: Conferma transazione
    collection: transactions
    fields:
    - type
    - eur_value
    - confirmed
    - user_note
    edit: true
    nav: false
    roles:
    - taxpayer
    submit:
      label: Salva
      message: Transazione aggiornata.
      redirect: to_confirm
  - key: add_wallet
    type: form
    title: Aggiungi wallet
    collection: wallets
    roles:
    - taxpayer
    submit:
      label: Aggiungi
      message: Wallet salvato.
  - key: my_wallets
    type: table
    title: I miei wallet
    source: collection:wallets
    columns:
    - label
    - chain
    - address
    roles:
    - taxpayer
  - key: delegate
    type: form
    title: Delega commercialista
    collection: delegations
    roles:
    - taxpayer
    submit:
      label: Autorizza
      message: Commercialista autorizzato.
  - key: clients
    type: table
    title: Clienti
    source: collection:tax_reports
    columns:
    - tax_year
    - gains
    - losses
    - tax_due
    - review_count
    - status
    - accountant_email
    export: true
    roles:
    - accountant
  - key: approvals
    type: approvals
    title: Report da approvare
    approvals:
    - cpa_review
    roles:
    - accountant
  - key: account
    type: account
    title: Piano e collegamenti
    roles:
    - taxpayer
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: fascia_200
      price: 49
      interval: year
      label: Fino a 200 transazioni/anno
      includes:
      - 200 transazioni
      - quadri RT e RW
      - report PDF ed Excel
    - key: fascia_2000
      price: 99
      interval: year
      label: Fino a 2.000 transazioni/anno
      includes:
      - 2.000 transazioni
      - delega al commercialista
    - key: fascia_illimitata
      price: 199
      interval: year
      label: Oltre 2.000 transazioni
      includes:
      - transazioni illimitate
      - delega al commercialista
  notifications:
    emailOnRunDone: true
  extensions:
  - key: exchange_signed_api
    description: 'Molti exchange (Binance, Kraken, Coinbase) richiedono richieste firmate (HMAC) con la chiave: il runtime
      non può firmarle. Oggi l''importazione da exchange funziona solo per endpoint con la sola chiave in header; per gli
      altri si usano i CSV di esportazione.'
  - key: excel_export
    description: 'L''esportazione Excel nativa non è disponibile: il prospetto è stampabile in PDF e le tabelle si scaricano
      in CSV (apribile in Excel).'
