apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: corsia-pratiche
  displayName: Corsia Pratiche
  tagline:
    it: Le pratiche amministrative della struttura sanitaria, istruite da agenti e approvate da te.
    en: Healthcare admin case files, prepared by agents and approved by you.
  description:
    it: 'Strato software amministrativo per gli uffici delle strutture sanitarie: estrazione dei dati dai documenti, controllo
      di completezza rispetto alle regole del fondo o della regione, compilazione dei moduli, approvazione dell''operatore
      e gestione dei rimborsi respinti. Nessuna decisione clinica.'
    en: 'Administrative software layer for healthcare facility offices: data extraction, completeness checks against fund
      or regional rules, form drafting, operator approval and handling of rejected reimbursements. No clinical decisions.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#0f3d4c'
      accent: '#1c8c7a'
      background: '#f6f9fa'
      foreground: '#16252b'
    fonts:
      body: Inter
      display: Source Serif 4
    wordmark:
    - text: 'Corsia '
      color: primary
    - text: Pratiche
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Privacy
        en: Privacy
      href: '#privacy'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: manager
      label:
        it: Responsabile
        en: Manager
      assignedBy: invite
    - key: operator
      label:
        it: Operatore
        en: Operator
      assignedBy: invite
  limits:
  - action: login
    per: ip
    max: 20
    window: hour
  agents:
  - key: processor
    role: main
    description: Legge i documenti di una pratica, estrae i dati, controlla la completezza rispetto alle regole e compila
      il modulo; poi chiede l'approvazione dell'operatore.
    awaits:
    - operator_review
    output: markdown
    appTools:
    - name: read_case
      description: Read the case records the agent is working on
      action: read
      collection: cases
      scope: all
    - name: update_case
      description: Write extracted data, missing items and the drafted form into the case
      action: write
      collection: cases
      scope: all
    - name: read_rules
      description: Read the completeness rules of the fund or region
      action: search
      collection: fund_rules
      scope: all
    - name: read_upload
      description: Read a document attached to the case (OCR included)
      action: read_file
    limits:
      maxTurns: 25
      maxBudgetUsd: 1.0
    profile:
      inline:
        display_name: Corsia Pratiche — istruttoria
        crews:
        - id: processor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un assistente amministrativo per l''ufficio pratiche di una struttura sanitaria. Lavori SOLO
            sullo strato amministrativo: non prendi decisioni cliniche, non interpreti diagnosi o terapie, non modifichi contenuti
            clinici. Tratta i dati sanitari come riservati: usa solo ciò che serve alla pratica, non ripeterli fuori dalla
            pratica.

            Per ogni pratica (autorizzazione, prescrizione, rimborso assicurativo, codifica SDO):

            1. Leggi il record con read_case e apri ogni documento allegato con read_upload (passa l''id del file).

            2. Estrai i dati richiesti (anagrafica amministrativa, riferimenti polizza o fondo, date, codici, importi). Se
            un dato non è nei documenti scrivilo come mancante: non inventare mai dati, codici o importi. Per la codifica
            SDO proponi i codici solo se supportati dal testo e indica la riga di origine; la verifica spetta all''operatore.

            3. Cerca con read_rules le regole del fondo, assicurazione o regione e confronta voce per voce: elenca cosa è
            presente, cosa manca, cosa è incoerente.

            4. Compila il modulo (bozza) con i dati estratti.

            5. Salva con update_case: extracted (JSON), missing (testo), draft_form (testo), status ''in_review'' se la pratica
            è completa, ''incomplete'' altrimenti.

            6. Chiama request_operator_review: nessuna pratica viene inviata senza approvazione dell''operatore.

            Formato della risposta: inizia con ''# Pratica <riferimento> — <tipo>'', poi ## Dati estratti, ## Controllo di
            completezza (tabella voce / esito / nota), ## Cosa manca, ## Bozza del modulo, ## Punti da verificare. Scrivi
            nella lingua con codice ISO indicato nel goal.'
  - key: responder
    role: helper
    description: Quando un rimborso è respinto, analizza il motivo e prepara la bozza di risposta o ricorso per l'operatore.
    output: markdown
    appTools:
    - name: read_case
      description: Read the case records the agent is working on
      action: read
      collection: cases
      scope: all
    - name: update_case
      description: Write extracted data, missing items and the drafted form into the case
      action: write
      collection: cases
      scope: all
    - name: read_rules
      description: Read the completeness rules of the fund or region
      action: search
      collection: fund_rules
      scope: all
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.6
    profile:
      inline:
        display_name: Corsia Pratiche — respinte
        crews:
        - id: responder
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un assistente amministrativo per l''ufficio pratiche di una struttura sanitaria. Una pratica
            di rimborso è stata respinta. Nessuna valutazione clinica. Leggi la pratica con read_case (motivo del rifiuto,
            dati estratti, modulo inviato) e le regole con read_rules. Individua la causa amministrativa (documento mancante,
            dato incoerente, termine scaduto, codice errato) e prepara una bozza di risposta o ricorso formale e cortese,
            indicando i documenti da allegare. Non inventare fatti, date o importi; segna tra [ ] ciò che l''operatore deve
            completare. Salva la bozza nel campo reply_draft con update_case. Formato: ''# Risposta al rifiuto — <riferimento>'',
            ## Motivo del rifiuto, ## Causa probabile, ## Azioni suggerite, ## Bozza di risposta. L''operatore rivede e invia.'
  approvals:
  - key: operator_review
    title:
      it: Verifica e approvazione della pratica
      en: Case review and approval
    role: operator
    decidedBy: role
    fields:
    - case_ref
    - type
    - insurer
    - missing
    timeoutMinutes: 10080
    onTimeout: reject
  data:
    collections:
    - name: cases
      description: 'Pratiche amministrative (dati sanitari: base giuridica e misure adeguate a carico della struttura)'
      ownedBy: org
      retentionDays: 1825
      access:
      - role: operator
        where:
          members: '{user.email}'
        can:
        - read
        - write
      - role: manager
        can:
        - read
        - write
      fields:
      - name: case_ref
        type: text
        required: true
        label:
          it: Riferimento pratica
          en: Case reference
      - name: type
        type: select
        required: true
        label:
          it: Tipo
          en: Type
        options:
        - value: authorization
          label:
            it: Richiesta di autorizzazione
            en: Authorization request
        - value: prescription
          label:
            it: Prescrizione
            en: Prescription
        - value: reimbursement
          label:
            it: Rimborso assicurativo
            en: Insurance reimbursement
        - value: sdo_coding
          label:
            it: Codifica scheda di dimissione
            en: Discharge record coding
      - name: department
        type: text
        required: true
        label:
          it: Reparto
          en: Department
      - name: members
        type: array
        label:
          it: Email degli operatori del reparto
          en: Department operators' emails
        help:
          it: Chi può vedere la pratica
          en: Who can see the case
      - name: operator_email
        type: email
        label:
          it: Operatore assegnato
          en: Assigned operator
      - name: patient_ref
        type: text
        label:
          it: Riferimento paziente (pseudonimo)
          en: Patient reference (pseudonym)
      - name: insurer
        type: text
        label:
          it: Fondo / assicurazione / regione
          en: Fund / insurer / region
      - name: received_at
        type: date
        label:
          it: Data di ricezione
          en: Received on
      - name: documents
        type: file
        multiple: true
        accept:
        - pdf
        - docx
        - jpg
        - png
        - txt
        maxMb: 15
        label:
          it: Documenti
          en: Documents
      - name: notes
        type: textarea
        maxLength: 1000
        label:
          it: Note amministrative
          en: Administrative notes
      - name: status
        type: select
        label:
          it: Stato
          en: Status
        default: received
        options:
        - value: received
          label:
            it: Ricevuta
            en: Received
        - value: incomplete
          label:
            it: Incompleta
            en: Incomplete
        - value: in_review
          label:
            it: Da approvare
            en: To approve
        - value: approved
          label:
            it: Approvata
            en: Approved
        - value: sent
          label:
            it: Inviata
            en: Sent
        - value: reimbursed
          label:
            it: Rimborsata
            en: Reimbursed
        - value: rejected
          label:
            it: Respinta
            en: Rejected
      - name: extracted
        type: json
        label:
          it: Dati estratti
          en: Extracted data
      - name: missing
        type: textarea
        label:
          it: Cosa manca
          en: Missing items
      - name: draft_form
        type: textarea
        label:
          it: Bozza del modulo
          en: Form draft
      - name: rejection_reason
        type: textarea
        label:
          it: Motivo del rifiuto
          en: Rejection reason
      - name: reply_draft
        type: textarea
        label:
          it: Bozza di risposta
          en: Reply draft
      - name: processing_hours
        type: number
        label:
          it: Ore di lavorazione
          en: Processing hours
    - name: fund_rules
      description: Regole di completezza per fondo, assicurazione o regione
      ownedBy: shared
      fields:
      - name: insurer
        type: text
        required: true
        label:
          it: Fondo / regione
          en: Fund / region
      - name: case_type
        type: text
        label:
          it: Tipo di pratica
          en: Case type
      - name: required_items
        type: textarea
        required: true
        label:
          it: Voci richieste
          en: Required items
      - name: deadline_days
        type: number
        label:
          it: Termine (giorni)
          en: Deadline (days)
  triggers:
  - key: his_intake
    description: Pratiche dal sistema informativo ospedaliero
    'on':
      webhook: true
    write:
      collection: cases
      keyBy: case_ref
      fields:
        case_ref: case_ref
        type: type
        department: department
        members: members
        patient_ref: patient_ref
        insurer: insurer
        received_at: received_at
        notes: notes
  - key: insurer_status
    description: Esiti dai portali delle assicurazioni
    'on':
      webhook: true
    write:
      collection: cases
      keyBy: case_ref
      fields:
        case_ref: case_ref
        status: status
        rejection_reason: reason
  - key: process_new_case
    'on':
      collection: cases
      op: insert
      where:
        status: received
    start:
      agent: processor
    asUser: false
    goal: 'Istruisci la pratica {record.case_ref} (tipo {record.type}, reparto {record.department}, ente {record.insurer}).
      Note: {record.notes}. Documenti (id file): {record.documents}. Data: {date}. Scrivi in lingua {lang}.'
  - key: case_rejected
    'on':
      collection: cases
      op: update
      where:
        status: rejected
    start:
      agent: responder
    asUser: false
    goal: 'La pratica {record.case_ref} ({record.insurer}) è stata respinta. Motivo: {record.rejection_reason}. Prepara la
      bozza di risposta. Scrivi in lingua {lang}.'
  - key: case_rejected_alert
    'on':
      collection: cases
      op: update
      where:
        status: rejected
    notify:
      to:
      - role:manager
      - record.operator_email
      subject:
        it: 'Pratica respinta: {record.case_ref}'
        en: 'Case rejected: {record.case_ref}'
      body:
        it: 'La pratica {record.case_ref} ({record.insurer}) è stata respinta. Motivo: {record.rejection_reason}. Una bozza
          di risposta è in preparazione: aprila nell''app per verificarla.'
        en: 'Case {record.case_ref} ({record.insurer}) was rejected. Reason: {record.rejection_reason}. A reply draft is being
          prepared: open the app to review it.'
      link: cases
  inputForm:
    title:
      it: Nuova pratica
      en: New case
    fields:
    - name: case_ref
      type: text
      required: true
      label:
        it: Riferimento pratica
        en: Case reference
  views:
  - key: home
    type: page
    nav: false
    title: Corsia Pratiche
    sections:
    - type: hero
      eyebrow:
        it: Per gli uffici amministrativi sanitari
        en: For healthcare admin offices
      title:
        it: Pratiche istruite dagli agenti, **approvate da te**.
        en: Cases prepared by agents, **approved by you**.
      text:
        it: Un agente legge i documenti, estrae i dati, controlla la completezza rispetto alle regole del fondo o della regione,
          compila i moduli e segnala ciò che manca. Nulla parte senza l'approvazione di un operatore.
        en: An agent reads the documents, extracts the data, checks completeness against the fund or regional rules, drafts
          the forms and flags what is missing. Nothing goes out without an operator's approval.
      actions:
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: primary
      note:
        it: 'Solo strato amministrativo: nessuna decisione clinica.'
        en: 'Administrative layer only: no clinical decisions.'
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Arriva la pratica
          en: The case arrives
        text:
          it: Dal sistema informativo ospedaliero o caricata dall'operatore.
          en: From the hospital information system or uploaded by staff.
        badge: 📥
      - title:
          it: L'agente istruisce
          en: The agent prepares it
        text:
          it: Estrae i dati, verifica le regole, compila il modulo e indica cosa manca.
          en: Extracts data, checks the rules, drafts the form and lists what is missing.
        badge: 🤖
      - title:
          it: L'operatore approva
          en: The operator approves
        text:
          it: Verifica e approva prima di ogni invio.
          en: Reviews and approves before any submission.
        badge: ✅
      - title:
          it: Rifiuti sotto controllo
          en: Rejections handled
        text:
          it: Se un rimborso è respinto, avviso e bozza di risposta pronta.
          en: 'If a reimbursement is rejected: an alert and a reply draft.'
        badge: 📨
    - type: cards
      id: privacy
      title:
        it: Dati sanitari e privacy
        en: Health data and privacy
      items:
      - title:
          it: Ogni reparto vede le sue pratiche
          en: Each department sees its own cases
        text:
          it: Gli operatori accedono solo alle pratiche del proprio reparto; il responsabile vede il quadro d'insieme.
          en: Operators only access their department's cases; the manager sees the overall picture.
      - title:
          it: Conservazione limitata
          en: Limited retention
        text:
          it: Le pratiche sono eliminate automaticamente dopo il periodo previsto.
          en: Cases are deleted automatically after the retention period.
    - type: note
      content:
        it: Corsia Pratiche supporta il lavoro amministrativo. La struttura resta titolare del trattamento e garantisce base
          giuridica e misure adeguate per i dati sanitari.
        en: Corsia Pratiche supports administrative work. The facility remains data controller and ensures a legal basis and
          adequate safeguards for health data.
  - key: new_case
    type: form
    title:
      it: Nuova pratica
      en: New case
    collection: cases
    fields:
    - case_ref
    - type
    - department
    - members
    - operator_email
    - patient_ref
    - insurer
    - received_at
    - documents
    - notes
    submit:
      label:
        it: Carica la pratica
        en: Upload case
      message:
        it: 'Pratica caricata: l''agente la sta istruendo.'
        en: 'Case uploaded: the agent is preparing it.'
      redirect: cases
    edit: false
    roles:
    - operator
    - manager
    - admin
  - key: cases
    type: table
    title:
      it: Pratiche
      en: Cases
    source: collection:cases
    columns:
    - case_ref
    - type
    - department
    - insurer
    - status
    - missing
    - received_at
    export: true
    roles:
    - operator
    - manager
    - admin
  - key: edit_case
    type: form
    title:
      it: Modifica pratica
      en: Edit case
    collection: cases
    edit: true
    nav: false
    submit:
      label:
        it: Salva
        en: Save
      redirect: cases
    roles:
    - operator
    - manager
    - admin
  - key: reviews
    type: approvals
    title:
      it: Da approvare
      en: To approve
    approvals:
    - operator_review
    roles:
    - operator
    - admin
  - key: dashboard
    type: page
    title:
      it: Dashboard responsabile
      en: Manager dashboard
    roles:
    - manager
    - admin
    sections:
    - type: data
      title:
        it: Pratiche per stato
        en: Cases by status
      source: collection:cases
      display: chart
      chart: pie
      groupBy:
        field: status
        aggs: []
      fields:
      - key: status
      - key: count
    - type: data
      title:
        it: Tempo medio di lavorazione per mese
        en: Average processing time per month
      source: collection:cases
      display: chart
      chart: line
      groupBy:
        field: received_at
        bucket: month
        aggs:
        - key: avg_hours
          agg: avg
          field: processing_hours
      fields:
      - key: received_at
      - key: avg_hours
    - type: data
      title:
        it: Pratiche respinte
        en: Rejected cases
      source: collection:cases
      display: table
      filters:
      - field: status
        op: '='
        value: rejected
      fields:
      - key: case_ref
      - key: insurer
      - key: department
      - key: rejection_reason
      limit: 50
      empty:
        it: Nessuna pratica respinta.
        en: No rejected cases.
    - type: data
      title:
        it: Carico per operatore
        en: Load per operator
      source: collection:cases
      display: bar
      groupBy:
        field: operator_email
        aggs: []
      fields:
      - key: operator_email
      - key: count
  - key: account
    type: account
    title:
      it: Contratto e consumi
      en: Contract and usage
    roles:
    - manager
    - admin
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 0
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:processor:
        estimate: 50
        metered: true
      agent:responder:
        estimate: 20
        metered: true
    packs:
    - key: extra
      credits: 5000
      price: 50
      label: Pratiche extra
    plans:
    - key: structure_annual
      price: 3000
      interval: year
      label:
        it: Contratto annuale per struttura
        en: Annual facility contract
      includes:
      - utenti illimitati
      - costo a pratica elaborata in crediti
      credits: 0
      roles:
      - manager
      - admin
  extensions:
  - key: his_connector
    description: Le pratiche arrivano dal sistema informativo ospedaliero via webhook (his_intake); il connettore lato ospedale
      (HL7/FHIR o altro) va configurato dal fornitore del sistema.
  - key: portal_submission
    description: 'Invio automatico dei moduli ai portali delle assicurazioni non disponibile: l''operatore invia la pratica
      approvata; gli esiti rientrano via webhook (insurer_status). Un''integrazione con i portali richiede API o credenziali
      per ciascun portale.'
  - key: department_scoping
    description: La visibilità per reparto si basa sull'elenco email 'members' di ogni pratica, compilato all'arrivo (dal
      sistema ospedaliero o dal modulo).
  notifications:
    emailOnRunDone: false
