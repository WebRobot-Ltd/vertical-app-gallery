apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: corsia-pratiche
  displayName: Corsia Pratiche
  tagline:
    it: Le pratiche amministrative sanitarie, pronte e verificate prima dell'invio.
    en: Healthcare administrative files, ready and checked before submission.
  description:
    it: 'Strato software amministrativo per gli uffici delle strutture sanitarie: un agente legge i documenti di autorizzazioni,
      prescrizioni, rimborsi e schede di dimissione, estrae i dati, controlla la completezza, prepara i moduli e segnala ciò
      che manca. Nessuna decisione clinica. Ogni pratica è approvata da un operatore.'
    en: 'Administrative software layer for healthcare facility offices: an agent reads documents for authorisations, prescriptions,
      reimbursements and discharge records, extracts data, checks completeness, drafts forms and flags gaps. No clinical decisions.
      Every file is approved by an operator.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12395b'
      accent: '#0f8b8d'
      background: '#f6f9fb'
      foreground: '#14212b'
    fonts:
      body: Inter
      display: Source Serif 4
    wordmark:
    - text: 'Corsia '
      color: primary
    - text: Pratiche
      color: accent
    button: accent
    width: wide
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Sicurezza
        en: Safety
      href: '#sicurezza'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label:
        it: Responsabile
        en: Manager
      assignedBy: admin_emails
    - key: user
      label:
        it: Operatore
        en: Operator
      assignedBy: signup
  limits:
  - action: run
    per: user
    max: 60
    window: day
    roles:
    - user
  agents:
  - key: pratica
    role: main
    when: modo == 'nuova'
    description: Reads the pasted documents of a file, extracts data, checks completeness, drafts the form and asks the operator
      to approve.
    awaits:
    - invio
    writesTo:
      collection: pratiche
      parse: whole
    profile:
      inline:
        display_name: Corsia Pratiche – istruttoria
        crews:
        - id: pratica
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un assistente amministrativo per l''ufficio pratiche di una struttura sanitaria. Lavori SOLO
            sullo strato amministrativo: non esprimi mai valutazioni cliniche, diagnosi o indicazioni terapeutiche. Tratti
            dati sanitari: usa solo ciò che è nel testo fornito, non ripeterlo oltre il necessario, non inventare dati, codici
            o importi. Se una regola del fondo o della regione non ti è stata fornita, dillo e indica cosa verificare, senza
            presumerla. Produci in Markdown: un titolo di livello 1 "# <Tipo pratica> — <riferimento pratica>", poi ## Dati
            estratti (tabella campo/valore), ## Controllo di completezza (tabella requisito / stato OK-MANCA-DA VERIFICARE
            / nota), ## Modulo compilato (bozza campo per campo, con [DA COMPLETARE] dove manca), ## Cosa manca o è incoerente,
            ## Da verificare dall''operatore. Per le schede di dimissione proponi la codifica solo come suggerimento amministrativo
            da confermare al codificatore. Alla fine chiama il tool request_invio con un riassunto della pratica: l''invio
            al portale avviene solo dopo l''approvazione dell''operatore. Non dire mai che la pratica è stata inviata.'
    goalTemplate: 'Tipo di pratica: {tipo_label}

      Reparto: {reparto}

      {?ente}Fondo/assicurazione/regione: {ente}{/ente}

      {?regole}Regole di completezza applicabili:

      {regole}{/regole}

      Documenti (testo incollato):

      {documenti}

      Scrivi il rapporto nella lingua con codice ISO {lang}. Data: {date}.'
    output: markdown
  - key: risposta
    role: main
    when: modo == 'respinta'
    description: Analyses a rejection notice and drafts the reply for the operator to review.
    profile:
      inline:
        display_name: Corsia Pratiche – risposta ai dinieghi
        crews:
        - id: risposta
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 4
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un assistente amministrativo di una struttura sanitaria. Ricevi il testo di un rifiuto o di
            una richiesta di integrazione di un rimborso/autorizzazione. Nessuna valutazione clinica; non inventare dati,
            norme o importi. Produci in Markdown: titolo di livello 1 "# Risposta al diniego — <riferimento>", ## Motivo del
            diniego (sintesi fedele), ## Documenti o dati da integrare, ## Bozza di risposta (lettera formale, con [DA COMPLETARE]
            dove manca un dato), ## Scadenze e passi successivi (solo quelle presenti nel testo). La bozza va sempre rivista
            dall''operatore prima dell''invio.'
    goalTemplate: 'Pratica respinta, reparto {reparto}. {?ente}Ente: {ente}.{/ente}

      Testo del diniego e contesto:

      {documenti}

      Scrivi nella lingua con codice ISO {lang}. Data: {date}.'
    output: markdown
  approvals:
  - key: invio
    title:
      it: Approva la pratica prima dell'invio
      en: Approve the file before submission
    description: L'operatore verifica la pratica compilata e la approva prima che sia inviata.
    decidedBy: requester
    fields:
    - riferimento
    - tipo
    - reparto
    - riepilogo
  inputForm:
    title:
      it: Nuova pratica
      en: New file
    fields:
    - name: modo
      type: select
      required: true
      label:
        it: Cosa vuoi fare
        en: What to do
      default: nuova
      options:
      - value: nuova
        label:
          it: Istruire una nuova pratica
          en: Prepare a new file
      - value: respinta
        label:
          it: Rispondere a un diniego
          en: Reply to a rejection
    - name: tipo
      type: select
      required: true
      label:
        it: Tipo di pratica
        en: File type
      options:
      - value: autorizzazione
        label:
          it: Richiesta di autorizzazione
          en: Authorisation request
      - value: prescrizione
        label:
          it: Prescrizione (aspetti amministrativi)
          en: Prescription (administrative aspects)
      - value: rimborso
        label:
          it: Rimborso assicurazione sanitaria
          en: Health insurance reimbursement
      - value: dimissione
        label:
          it: Codifica scheda di dimissione
          en: Discharge record coding
    - name: reparto
      type: text
      required: true
      label:
        it: Reparto
        en: Department
    - name: ente
      type: text
      label:
        it: Fondo / assicurazione / regione
        en: Fund / insurer / region
    - name: regole
      type: textarea
      maxLength: 3000
      label:
        it: Regole di completezza (facoltative)
        en: Completeness rules (optional)
      help:
        it: Incolla i requisiti del fondo o della regione.
        en: Paste the fund or region requirements.
    - name: documenti
      type: textarea
      required: true
      maxLength: 12000
      label:
        it: Documenti (testo)
        en: Documents (text)
      help:
        it: Incolla il testo dei documenti, senza dati non necessari. Il caricamento file non è ancora disponibile.
        en: Paste the document text, without unneeded data. File upload is not available yet.
  data:
    collections:
    - name: pratiche
      ownedBy: user
      description: Files prepared by each operator, with status and timings
      fields:
      - name: riferimento
        type: text
      - name: tipo
        type: text
      - name: reparto
        type: text
      - name: stato
        type: select
        options:
        - bozza
        - approvata
        - inviata
        - respinta
        - rimborsata
      - name: tempo_ore
        type: number
      - name: contenuto
        type: textarea
  views:
  - key: home
    type: page
    title: Corsia Pratiche
    nav: false
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow:
        it: Per gli uffici amministrativi sanitari
        en: For healthcare administrative offices
      title:
        it: Pratiche **complete** al primo invio, approvate da una persona.
        en: '**Complete** files on first submission, approved by a person.'
      text:
        it: 'Un agente legge i documenti, estrae i dati, controlla la completezza rispetto alle regole del fondo o della regione,
          compila i moduli e segnala ciò che manca. Solo strato amministrativo: nessuna decisione clinica.'
        en: 'An agent reads the documents, extracts the data, checks completeness against fund or regional rules, drafts forms
          and flags what is missing. Administrative layer only: no clinical decisions.'
      actions:
      - label:
          it: Nuova pratica
          en: New file
        href: /v/nuova
        style: primary
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Carica
          en: Submit
        text:
          it: Incolla i documenti della pratica e indica reparto ed ente.
          en: Paste the file documents and set department and payer.
        badge: 📄
      - title:
          it: Controlla
          en: Check
        text:
          it: L'agente estrae i dati, verifica la completezza e prepara il modulo.
          en: The agent extracts data, checks completeness and drafts the form.
        badge: ✅
      - title:
          it: Approva
          en: Approve
        text:
          it: L'operatore rivede e approva ogni pratica prima dell'invio.
          en: The operator reviews and approves each file before submission.
        badge: 🖊️
      - title:
          it: Rispondi
          en: Reply
        text:
          it: Se un rimborso è respinto, l'agente prepara la risposta.
          en: If a reimbursement is rejected, the agent drafts the reply.
        badge: ↩️
    - type: cards
      id: sicurezza
      title:
        it: Sicurezza e limiti
        en: Safety and limits
      items:
      - title:
          it: Nessuna decisione clinica
          en: No clinical decisions
        text:
          it: Lo strumento tratta solo aspetti amministrativi.
          en: The tool only handles administrative matters.
      - title:
          it: Dati sanitari
          en: Health data
        text:
          it: Trattati con base giuridica e misure adeguate, definite dalla struttura titolare.
          en: Processed with a legal basis and appropriate measures set by the facility as controller.
      - title:
          it: Controllo umano
          en: Human control
        text:
          it: Nulla è inviato senza approvazione di un operatore.
          en: Nothing is submitted without operator approval.
    - type: note
      content:
        it: Corsia Pratiche supporta il lavoro amministrativo; non sostituisce la verifica dell'operatore né fornisce consulenza
          medica o legale.
        en: Corsia Pratiche supports administrative work; it does not replace operator checks or give medical or legal advice.
  - key: nuova
    type: new_run
    title:
      it: Nuova pratica
      en: New file
    roles:
    - user
    - admin
  - key: storico
    type: history
    title:
      it: Le mie pratiche
      en: My files
    source: run
    roles:
    - user
    - admin
  - key: rapporto
    type: report
    source: run
    printable: true
    nav: false
  - key: approvazioni
    type: approvals
    title:
      it: Da approvare
      en: To approve
    approvals:
    - invio
    roles:
    - user
    - admin
  - key: elenco
    type: page
    title:
      it: Stato pratiche
      en: File status
    roles:
    - user
    - admin
    sections:
    - type: data
      source: collection:pratiche
      display: table
      fields:
      - key: riferimento
        label:
          it: Riferimento
          en: Reference
      - key: tipo
        label:
          it: Tipo
          en: Type
      - key: reparto
        label:
          it: Reparto
          en: Department
      - key: stato
        label:
          it: Stato
          en: Status
        format: badge
      limit: 100
      empty:
        it: Nessuna pratica.
        en: No files.
  - key: cruscotto
    type: page
    title:
      it: Cruscotto
      en: Dashboard
    roles:
    - admin
    sections:
    - type: data
      title:
        it: Indicatori
        en: Indicators
      source: collection:pratiche
      display: kpi
      kpis:
      - label:
          it: Pratiche
          en: Files
        agg: count
      - label:
          it: Tempo medio (ore)
          en: Average time (h)
        agg: avg
        field: tempo_ore
        format: number
    - type: data
      title:
        it: Pratiche per stato
        en: Files by status
      source: collection:pratiche
      display: table
      fields:
      - key: stato
        format: badge
      - key: reparto
      - key: tipo
      - key: tempo_ore
        format: number
      filters:
      - field: stato
        op: '='
        value: respinta
      limit: 100
      empty:
        it: Nessuna pratica respinta.
        en: No rejected files.
  - key: account
    type: account
    title:
      it: Crediti e contratto
      en: Credits and contract
    roles:
    - user
    - admin
  billing:
    modes:
    - credits
    - subscription
    currency: eur
    signupCredits: 30
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:pratica:
        estimate: 10
        metered: true
      agent:risposta:
        estimate: 10
        metered: true
    packs:
    - key: pratiche_500
      credits: 500
      price: 6
      label: 500 crediti
    plans:
    - key: struttura_annuale
      price: 3600
      interval: year
      label:
        it: Contratto annuale per struttura
        en: Annual facility contract
      includes:
      - accesso per tutti gli operatori della struttura
      - costo a pratica elaborata in crediti
      roles:
      - admin
  extensions:
  - key: integrazione_his
    description: 'Ricezione diretta delle pratiche dai sistemi informativi ospedalieri: non disponibile; per ora il testo
      si incolla (nessun caricamento file).'
  - key: invio_portali
    description: 'Invio dei moduli ai portali delle assicurazioni e lettura automatica dello stato delle pratiche inviate:
      richiede connettori con credenziali della struttura, non disponibili. L''operatore aggiorna lo stato a mano.'
  - key: avvisi_dinieghi
    description: 'Avvisi automatici (email) quando un rimborso è respinto: notifiche non disponibili; l''operatore incolla
      il diniego e ottiene la bozza di risposta.'
  - key: reparto_struttura
    description: 'Visibilità per reparto, multi-struttura e cruscotto del responsabile con carico per operatore: oggi i record
      sono per utente; serve un ambito per reparto e per struttura.'
  - key: protezione_dati
    description: Base giuridica, DPA, registro dei trattamenti e misure di sicurezza dei dati sanitari da definire con ciascuna
      struttura titolare prima della produzione.
