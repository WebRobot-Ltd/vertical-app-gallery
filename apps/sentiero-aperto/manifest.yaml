apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: sentieroaperto
  displayName: SentieroAperto
  tagline:
    it: Itinerari all'aperto su misura, con meteo e traccia GPX.
    de: Maßgeschneiderte Outdoor-Touren mit Wetter und GPX-Track.
    en: Tailor-made outdoor routes with weather and a GPX track.
  description:
    it: Un agente AI costruisce itinerari di escursionismo, bici e outdoor con i dati di OpenStreetMap, controlla il meteo
      lungo il tracciato con Open-Meteo e ti avvisa se le condizioni sono sconsigliate.
    de: Ein KI-Agent erstellt Wander-, Rad- und Outdoor-Touren mit OpenStreetMap-Daten, prüft das Wetter entlang der Strecke
      mit Open-Meteo und warnt bei ungünstigen Bedingungen.
    en: An AI agent builds hiking, cycling and outdoor routes from OpenStreetMap data, checks the weather along the track
      with Open-Meteo and warns you when conditions are not advisable.
  langs:
  - it
  - de
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f4d3a'
      accent: '#d9772b'
      background: '#f6f4ee'
      foreground: '#1c2a24'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Sentiero
      color: primary
    - text: Aperto
      color: accent
    width: wide
  header:
    links:
    - label:
        it: Come funziona
        de: So funktioniert's
        en: How it works
      href: '#come-funziona'
    - label:
        it: Piani
        de: Tarife
        en: Plans
      href: '#piani'
    cta:
      label:
        it: Pianifica
        de: Planen
        en: Plan a route
      href: /v/new
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  limits:
  - action: agent:planner
    per: user
    max: 5
    window: month
    roles:
    - user
    plans:
      pro: 100
  - action: chat
    per: user
    max: 30
    window: day
    roles:
    - user
    plans:
      pro: 200
  - action: create:routes
    max: 5
    window: total
    plans:
      pro: -1
  egress:
    hosts:
    - overpass-api.de
    - nominatim.openstreetmap.org
    - api.open-meteo.com
    notes: 'Overpass API and Nominatim: OpenStreetMap data under ODbL, light use within their usage policies. Open-Meteo:
      free tier is for non-commercial use; commercial use of this app requires an Open-Meteo API subscription.'
  agents:
  - key: planner
    role: main
    description: Builds a route from OpenStreetMap, adds weather along the track, warns if conditions are not advisable.
    output: markdown
    limits:
      maxTurns: 30
      maxBudgetUsd: 0.8
    goalTemplate: 'Area: {area}

      Activity: {activity_label}

      Difficulty: {difficulty_label}

      {?duration_h}Desired duration: {duration_h} hours.{/duration_h}

      {?max_ascent_m}Desired maximum ascent: {max_ascent_m} m.{/max_ascent_m}

      Date of the outing: {when}

      Starting point: {start_point}

      {?notes}Notes: {notes}{/notes}

      Today is {date}. Write the itinerary in the language with ISO code {lang}.'
    appTools:
    - name: geocode
      description: 'Find coordinates of a place (Nominatim). Query: q=<place>&format=json&limit=1'
      action: http
      http:
        method: GET
        url: https://nominatim.openstreetmap.org/search
        attribution: © OpenStreetMap contributors, ODbL
    - name: osm_query
      description: 'Overpass API query. Query: data=<Overpass QL, [out:json] with out geom/center>'
      action: http
      http:
        method: GET
        url: https://overpass-api.de/api/interpreter
        attribution: © OpenStreetMap contributors, ODbL
        maxBytes: 1000000
        timeoutMs: 30000
    - name: weather_forecast
      description: Open-Meteo forecast for a point
      action: http
      http:
        method: GET
        url: https://api.open-meteo.com/v1/forecast
        attribution: Weather data by Open-Meteo.com, CC BY 4.0
    - name: elevation
      description: Open-Meteo elevation for comma-separated latitude and longitude lists
      action: http
      http:
        method: GET
        url: https://api.open-meteo.com/v1/elevation
        attribution: Open-Meteo.com, CC BY 4.0
    - name: write_route
      description: Save the route summary record
      action: write
      collection: routes
      scope: user
    - name: write_stop
      description: Save one stop of a route
      action: write
      collection: stops
      scope: user
    - name: write_profile
      description: Save one elevation profile point
      action: write
      collection: profile_points
      scope: user
    profile:
      inline:
        display_name: SentieroAperto planner
        crews:
        - id: planner
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are an outdoor route planner. Build ONE itinerary for the request.

            Process: 1) geocode the starting point and area. 2) With osm_query find real hiking/cycling route relations (route=hiking|bicycle|mtb),
            paths and POIs (huts, viewpoints, water, shelters) near the start; use only geometry that OpenStreetMap returns.
            3) Choose a loop or A-B route matching activity, difficulty and the desired duration or ascent. Estimate time
            with realistic rules (hiking ~4 km/h plus 1 h per 300-400 m ascent; bike by surface and slope). 4) Take 10-40
            sample points along the track, call elevation, compute distance, ascent and descent. 5) Call weather_forecast
            (daily and hourly: temperature, precipitation, wind gusts, thunderstorm code, freezing level) for the start, the
            highest point and the end on the outing date (forecast covers about 16 days; if later, say only seasonal expectations).
            6) Give a verdict: GO, CAUTION or NOT ADVISABLE, with explicit reasons (thunderstorms, gusts >60 km/h, ice, heavy
            rain, heat). Flag exposed sections only if OSM tags indicate them (sac_scale, via_ferrata, exposure) and say so.
            7) Save: one write_route (title, area, activity, difficulty, distance_km, ascent_m, duration_h, start_name, start_lat,
            start_lon, when, status go|caution|no_go, warning, summary), one write_stop per stage (route_title, order, name,
            kind, lat, lon, km, elevation, eta_min, note), one write_profile per sample point (route_title, km, elevation).

            Report structure: first line "# <Route title>". Then ## Verdict (with weather warning first if any), ## Key figures
            (table: distance, ascent, descent, duration, highest point), ## Stages (table with km, elevation, time, notes),
            ## Weather along the track, ## Safety and alternatives, ## GPX. Add an elevation chart as a fenced block:

            ```chart

            {"type":"line","title":"...","labels":[...km],"series":[{"name":"...","values":[...m]}],"unit":"m"}

            ```

            In ## GPX put a complete GPX 1.1 file in a fenced ```gpx block built from the sampled coordinates (trk, trkseg,
            trkpt with ele; wpt for stages) and say it can be saved as .gpx for a navigator. Never invent coordinates, distances,
            hut opening times or forecasts; say when data is missing. You are decision support, not a mountain guide: the
            user is responsible for the final choice.'
  - key: variants
    role: helper
    description: 'Chat: modifies a saved route (shorter, avoid exposed sections, kid friendly).'
    output: markdown
    limits:
      maxTurns: 25
      maxBudgetUsd: 0.6
    context:
    - key: routes
      from: collection:routes
    goalTemplate: 'Conversation so far:

      {history}

      New message: {message}

      The user''s saved routes (JSON lines):

      {routes}

      Today is {date}. Answer in the language with ISO code {lang}.'
    appTools:
    - name: read_routes
      description: Read the user's saved routes
      action: read
      collection: routes
      scope: user
    - name: read_stops
      description: Read the stops of the user's routes
      action: read
      collection: stops
      scope: user
    - name: geocode
      description: 'Find coordinates of a place (Nominatim). Query: q=<place>&format=json&limit=1'
      action: http
      http:
        method: GET
        url: https://nominatim.openstreetmap.org/search
        attribution: © OpenStreetMap contributors, ODbL
    - name: osm_query
      description: 'Overpass API query. Query: data=<Overpass QL, [out:json] with out geom/center>'
      action: http
      http:
        method: GET
        url: https://overpass-api.de/api/interpreter
        attribution: © OpenStreetMap contributors, ODbL
        maxBytes: 1000000
        timeoutMs: 30000
    - name: weather_forecast
      description: Open-Meteo forecast for a point
      action: http
      http:
        method: GET
        url: https://api.open-meteo.com/v1/forecast
        attribution: Weather data by Open-Meteo.com, CC BY 4.0
    - name: elevation
      description: Open-Meteo elevation for comma-separated latitude and longitude lists
      action: http
      http:
        method: GET
        url: https://api.open-meteo.com/v1/elevation
        attribution: Open-Meteo.com, CC BY 4.0
    - name: write_route
      description: Save the route summary record
      action: write
      collection: routes
      scope: user
    - name: write_stop
      description: Save one stop of a route
      action: write
      collection: stops
      scope: user
    - name: write_profile
      description: Save one elevation profile point
      action: write
      collection: profile_points
      scope: user
    profile:
      inline:
        display_name: SentieroAperto variants
        chat_mode: true
        crews:
        - id: variants
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You are the route assistant of SentieroAperto. The user talks about their saved routes and asks for
            variants (shorter, easier, avoid exposed sections, kid friendly, fewer ascent). Read the route and its stops,
            then use osm_query to find real alternatives (shortcuts, lower paths, tags like sac_scale, exposure, surface,
            smoothness, playgrounds, huts) and elevation/weather_forecast to re-check figures. Answer concisely with the changes,
            new distance, ascent, time and weather verdict. If the user accepts a variant, save it as a NEW route with write_route/write_stop/write_profile
            (title with the suffix of the variant) and provide the updated GPX 1.1 in a fenced ```gpx block. Never invent
            geometry, distances or forecasts; say when OSM lacks data. Not a substitute for a mountain guide.
  - key: feasibility
    role: scheduled
    description: Daily recalculation of a saved route's feasibility from the forecast.
    memory: instance
    output: markdown
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.3
    writesTo:
      collection: feasibility_checks
      parse: whole
    goalTemplate: Check the saved route "{route}" (watch "{instance}"). Today is {date}. Write in the language with ISO code
      {lang}.
    appTools:
    - name: read_routes
      description: Read the user's saved routes
      action: read
      collection: routes
      scope: user
    - name: read_stops
      description: Read the stops of the user's routes
      action: read
      collection: stops
      scope: user
    - name: weather_forecast
      description: Open-Meteo forecast for a point
      action: http
      http:
        method: GET
        url: https://api.open-meteo.com/v1/forecast
        attribution: Weather data by Open-Meteo.com, CC BY 4.0
    - name: write_route
      description: Save the route summary record
      action: write
      collection: routes
      scope: user
    profile:
      inline:
        display_name: SentieroAperto feasibility
        crews:
        - id: feasibility
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You re-check the feasibility of one saved route. Find it with read_routes (by title or id) and its
            stops with read_stops. Call weather_forecast for the start, the highest stop and the end on the route''s planned
            date (if the date has passed, say so and stop). Verdict: GO, CAUTION or NOT ADVISABLE (thunderstorms, gusts >60
            km/h, heavy rain, snow or ice, extreme heat). Update the route''s status (go|caution|no_go) and warning with write_route.
            Report: first line "# <Route title> — <date>", then ## Verdict, ## What changed (compare with your memory of the
            last check; lead with differences), ## Figures (precipitation, gusts, temperatures, freezing level). Under 200
            words. At the end call remember once with the key points of this check. Never invent forecasts.'
  inputForm:
    title:
      it: Nuovo itinerario
      de: Neue Route
      en: New route
    fields:
    - name: area
      type: text
      required: true
      maxLength: 120
      label:
        it: Zona
        de: Gebiet
        en: Area
      help:
        it: es. Dolomiti di Brenta, Lago di Garda
        de: z. B. Brenta-Dolomiten, Gardasee
        en: e.g. Brenta Dolomites, Lake Garda
    - name: activity
      type: select
      required: true
      label:
        it: Attività
        de: Aktivität
        en: Activity
      options:
      - value: hike
        label:
          it: Escursione
          de: Wandern
          en: Hiking
      - value: road_bike
        label:
          it: Bici da strada
          de: Rennrad
          en: Road bike
      - value: mtb
        label: MTB
      - value: trail_run
        label:
          it: Trail running
          de: Trailrunning
          en: Trail running
      - value: walk
        label:
          it: Passeggiata
          de: Spaziergang
          en: Easy walk
    - name: difficulty
      type: select
      required: true
      label:
        it: Difficoltà
        de: Schwierigkeit
        en: Difficulty
      options:
      - value: easy
        label:
          it: Facile
          de: Leicht
          en: Easy
      - value: medium
        label:
          it: Media
          de: Mittel
          en: Medium
      - value: hard
        label:
          it: Impegnativa
          de: Schwer
          en: Hard
    - name: duration_h
      type: number
      label:
        it: Durata desiderata (ore)
        de: Gewünschte Dauer (Std.)
        en: Desired duration (hours)
    - name: max_ascent_m
      type: number
      label:
        it: Dislivello massimo (m)
        de: Max. Höhenmeter (m)
        en: Maximum ascent (m)
    - name: when
      type: date
      required: true
      label:
        it: Giorno
        de: Tag
        en: Day
    - name: start_point
      type: text
      required: true
      maxLength: 160
      label:
        it: Punto di partenza
        de: Startpunkt
        en: Starting point
    - name: notes
      type: textarea
      maxLength: 400
      label:
        it: Note (facoltative)
        de: Hinweise (optional)
        en: Notes (optional)
  data:
    collections:
    - name: routes
      ownedBy: user
      description: Saved routes of each user
      fields:
      - name: title
        type: text
        required: true
      - name: area
        type: text
      - name: activity
        type: text
      - name: difficulty
        type: text
      - name: distance_km
        type: number
      - name: ascent_m
        type: number
      - name: duration_h
        type: number
      - name: start_name
        type: text
      - name: start_lat
        type: number
      - name: start_lon
        type: number
      - name: when
        type: date
      - name: status
        type: select
        options:
        - go
        - caution
        - no_go
      - name: warning
        type: textarea
      - name: summary
        type: textarea
    - name: stops
      ownedBy: user
      description: Stages and points of interest of a route
      fields:
      - name: route_title
        type: text
      - name: order
        type: number
      - name: name
        type: text
      - name: kind
        type: text
      - name: lat
        type: number
      - name: lon
        type: number
      - name: km
        type: number
      - name: elevation
        type: number
      - name: eta_min
        type: number
      - name: note
        type: text
    - name: profile_points
      ownedBy: user
      description: Elevation profile samples
      fields:
      - name: route_title
        type: text
      - name: km
        type: number
      - name: elevation
        type: number
      retentionDays: 730
    - name: feasibility_checks
      ownedBy: instance
      description: Daily feasibility checks of each route watch
      retentionDays: 90
  templates:
  - key: route_watch
    title:
      it: Controllo meteo percorso
      de: Wetter-Check der Route
      en: Route weather watch
    description:
      it: Ogni giorno ricalcola la fattibilità di un percorso salvato in base al meteo e ti avvisa via email.
      de: Berechnet täglich die Machbarkeit einer gespeicherten Route anhand des Wetters und warnt per E-Mail.
      en: Every day recalculates a saved route's feasibility from the weather and emails you.
    agent: feasibility
    params:
    - name: route
      type: select
      required: true
      optionsFrom: collection:routes
      label:
        it: Percorso salvato
        de: Gespeicherte Route
        en: Saved route
    goal: Check the saved route "{route}" (watch "{instance}"). Today is {date}. Write in the language with ISO code {lang}.
    schedule:
      cron: 0 5 * * *
      userCanChange: false
    maxPerUser: 10
    roles:
    - user
    - admin
    deliver:
      to: owner
      onlyIfNew: true
  views:
  - key: home
    type: page
    nav: false
    title: SentieroAperto
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow:
        it: Escursioni · Bici · Outdoor
        de: Wandern · Rad · Outdoor
        en: Hiking · Cycling · Outdoor
      title:
        it: Il tuo **itinerario** su misura, con il meteo lungo il tracciato.
        de: Deine **Route** nach Maß, mit Wetter entlang der Strecke.
        en: Your **route** tailor-made, with the weather along the track.
      text:
        it: 'Dì dove, come e quando: un agente AI costruisce il percorso con OpenStreetMap, controlla Open-Meteo e ti avvisa
          se le condizioni sono sconsigliate. Mappa, profilo altimetrico, tappe, varianti in chat e traccia GPX.'
        de: 'Sag wo, wie und wann: Ein KI-Agent baut die Route mit OpenStreetMap, prüft Open-Meteo und warnt bei ungünstigen
          Bedingungen. Karte, Höhenprofil, Etappen, Varianten im Chat und GPX-Track.'
        en: 'Say where, how and when: an AI agent builds the route with OpenStreetMap, checks Open-Meteo and warns you if
          conditions are not advisable. Map, elevation profile, stages, variants in chat and a GPX track.'
      actions:
      - label:
          it: Pianifica un itinerario
          de: Route planen
          en: Plan a route
        href: /v/new
        style: primary
      - label:
          it: Accedi
          de: Anmelden
          en: Sign in
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        de: So funktioniert's
        en: How it works
      items:
      - title:
          it: Compila il modulo
          de: Formular ausfüllen
          en: Fill in the form
        text:
          it: Zona, attività, difficoltà, durata o dislivello, giorno e punto di partenza.
          de: Gebiet, Aktivität, Schwierigkeit, Dauer oder Höhenmeter, Tag und Startpunkt.
          en: Area, activity, difficulty, duration or ascent, day and starting point.
      - title:
          it: Percorso e meteo
          de: Route und Wetter
          en: Route and weather
        text:
          it: Tracciato da OpenStreetMap, quote, tappe, tempi stimati e previsione Open-Meteo con avviso se sconsigliato.
          de: Strecke aus OpenStreetMap, Höhen, Etappen, Zeiten und Open-Meteo-Vorhersage mit Warnung.
          en: Track from OpenStreetMap, elevations, stages, estimated times and an Open-Meteo forecast with a warning when
            not advisable.
      - title:
          it: Varianti e GPX
          de: Varianten und GPX
          en: Variants and GPX
        text:
          it: Chiedi in chat un percorso più corto, senza tratti esposti o adatto ai bambini; copia la traccia GPX per il
            navigatore.
          de: Frag im Chat nach kürzer, ohne ausgesetzte Stellen oder kinderfreundlich; GPX-Track für dein Navi.
          en: Ask in chat for shorter, no exposed sections or kid-friendly; take the GPX track to your navigator.
    - type: cards
      id: piani
      title:
        it: Piani
        de: Tarife
        en: Plans
      items:
      - title: Free
        badge: 0 €
        text:
          it: Itinerari base con mappa, profilo, tappe, meteo e GPX (5 al mese).
          de: Basis-Routen mit Karte, Profil, Etappen, Wetter und GPX (5 pro Monat).
          en: Basic routes with map, profile, stages, weather and GPX (5 per month).
      - title: Pro
        badge: 7,90 €
        text:
          it: Tracce offline nell'app nativa, controllo meteo giornaliero con avvisi email, più itinerari e chat.
          de: Offline-Tracks in der nativen App, tägliche Wetter-Checks mit E-Mail-Warnung, mehr Routen und Chat.
          en: Offline tracks in the native app, daily weather checks with email alerts, more routes and chat.
    - type: note
      content:
        it: Supporto alla decisione, non sostituisce una guida alpina. Verifica sempre meteo e condizioni sul posto. Dati
          © OpenStreetMap contributors (ODbL); meteo Open-Meteo.com.
        de: Entscheidungshilfe, kein Ersatz für einen Bergführer. Prüfe Wetter und Bedingungen vor Ort. Daten © OpenStreetMap-Mitwirkende
          (ODbL); Wetter Open-Meteo.com.
        en: Decision support, not a substitute for a mountain guide. Always check weather and conditions on site. Data © OpenStreetMap
          contributors (ODbL); weather by Open-Meteo.com.
  - key: new
    type: new_run
    title:
      it: Nuovo itinerario
      de: Neue Route
      en: New route
    roles:
    - user
    - admin
  - key: itineraries
    type: history
    title:
      it: I miei itinerari
      de: Meine Routen
      en: My itineraries
    source: run
    roles:
    - user
    - admin
  - key: itinerary
    type: report
    source: run
    printable: true
    nav: false
  - key: explore
    type: page
    title:
      it: Mappa e profilo
      de: Karte und Profil
      en: Map and profile
    roles:
    - user
    - admin
    sections:
    - type: view
      view: route_map
    - type: data
      title:
        it: Profilo altimetrico
        de: Höhenprofil
        en: Elevation profile
      source: collection:profile_points
      display: chart
      chart: line
      fields:
      - key: km
        label: km
      - key: elevation
        label:
          it: Quota (m)
          de: Höhe (m)
          en: Elevation (m)
      sort:
        field: km
        dir: asc
      limit: 200
    - type: data
      title:
        it: Tappe e tempi
        de: Etappen und Zeiten
        en: Stages and times
      source: collection:stops
      display: table
      fields:
      - key: route_title
        label:
          it: Percorso
          de: Route
          en: Route
      - key: order
        label: '#'
      - key: name
        label: Name
      - key: km
        label: km
        format: number
      - key: elevation
        label: m
        format: number
      - key: eta_min
        label: min
        format: number
      sort:
        field: order
        dir: asc
      limit: 200
  - key: route_map
    type: map
    source: collection:stops
    nav: false
    title:
      it: Mappa
      de: Karte
      en: Map
    map:
      lat: lat
      lon: lon
      title: name
      popup:
      - route_title
      - km
      - elevation
      - eta_min
  - key: my_routes
    type: table
    title:
      it: Percorsi salvati
      de: Gespeicherte Routen
      en: Saved routes
    source: collection:routes
    columns:
    - title
    - area
    - activity
    - distance_km
    - ascent_m
    - duration_h
    - when
    - status
    - warning
    export: true
    roles:
    - user
    - admin
  - key: variants_chat
    type: chat
    source: agent:variants
    title:
      it: Varianti in chat
      de: Varianten im Chat
      en: Variants chat
    examples:
    - it: Fammi una versione più corta
      de: Mach eine kürzere Version
      en: Make a shorter version
    - it: Evita i tratti esposti
      de: Vermeide ausgesetzte Stellen
      en: Avoid exposed sections
    - it: Adatto ai bambini
      de: Kinderfreundlich
      en: Suitable for children
    placeholder:
      it: Chiedi una variante del tuo percorso…
      de: Frag nach einer Variante deiner Route…
      en: Ask for a variant of your route…
    roles:
    - user
    - admin
  - key: watches
    type: instances
    template: route_watch
    title:
      it: Avvisi meteo
      de: Wetterwarnungen
      en: Weather alerts
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      de: Abo
      en: Subscription
    roles:
    - user
  notifications:
    emailOnRunDone: true
  billing:
    modes:
    - subscription
    currency: eur
    costs:
      agent:feasibility:
        requiresPlan: pro
    plans:
    - key: pro
      price: 7.9
      interval: month
      label: SentieroAperto Pro
      includes:
      - offline tracks in the native app
      - daily weather feasibility alerts by email
      - unlimited saved routes
      - more itineraries and variant chats
  mobile:
    appId: eu.webrobot.sentieroaperto
  extensions:
  - key: gpx_download
    description: 'A real .gpx file download is not available: the agent gives the GPX 1.1 text in a fenced block of the report
      to copy/save as .gpx. A dedicated download endpoint would need custom code.'
  - key: offline_native_gps
    description: 'Native app working offline in the mountains with GPS track following needs offline map tiles, local storage
      of routes and on-device location: the Capacitor shell (spec.mobile) wraps the web app only, so offline caching, GPS
      tracking and the Pro-only offline tracks gate are not covered by the manifest.'
  - key: open_meteo_commercial
    description: Open-Meteo's free API is for non-commercial use; the subscription model needs a commercial Open-Meteo API
      key/plan before publishing.
  - key: elevation_profile_on_map
    description: The map shows stages as markers and the elevation profile is a separate chart; a drawn track polyline with
      a cursor linked to the profile is not available.
