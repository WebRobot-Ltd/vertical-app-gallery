apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: sentiero-aperto
  displayName: SentieroAperto
  tagline:
    it: Itinerari outdoor su misura, con meteo e traccia GPX.
    de: Maßgeschneiderte Outdoor-Routen mit Wetter und GPX-Track.
    en: Tailor-made outdoor routes with weather and a GPX track.
  description:
    it: 'Indica zona, attività, difficoltà e periodo: un agente AI costruisce l''itinerario con OpenStreetMap, controlla il
      meteo con Open-Meteo e ti avvisa se le condizioni sono sconsigliate.'
    de: 'Gib Gebiet, Aktivität, Schwierigkeit und Zeitraum an: Ein KI-Agent erstellt die Route mit OpenStreetMap, prüft das
      Wetter mit Open-Meteo und warnt bei ungünstigen Bedingungen.'
    en: 'Enter area, activity, difficulty and period: an AI agent builds the route from OpenStreetMap, checks the weather
      with Open-Meteo and warns you when conditions are not advisable.'
  langs:
  - it
  - de
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f4d3a'
      accent: '#d9772b'
      background: '#f6f4ee'
      foreground: '#1c2420'
    fonts:
      body: Inter
      display: Merriweather
    wordmark:
    - text: Sentiero
      color: primary
    - text: Aperto
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        de: So funktioniert's
        en: How it works
      href: '#come-funziona'
    - label:
        it: Piani
        de: Tarife
        en: Plans
      href: '#piani'
    cta:
      label:
        it: Crea un itinerario
        de: Route erstellen
        en: Create a route
      href: /v/new_route
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  limits:
  - action: agent:planner
    per: user
    max: 10
    window: day
    roles:
    - user
  - action: chat
    per: user
    max: 40
    window: day
    roles:
    - user
  egress:
    hosts:
    - nominatim.openstreetmap.org
    - overpass-api.de
    - api.open-meteo.com
    notes: 'Nominatim and Overpass: OpenStreetMap data, ODbL (attribution required), low-volume use only per usage policy.
      Open-Meteo forecast and elevation: CC BY 4.0 data; the free API is for non-commercial use, so a commercial subscription
      needs an Open-Meteo API licence before launch.'
  agents:
  - key: planner
    role: main
    description: Builds a route from OpenStreetMap, adds weather along the track, warns if not advisable.
    profile:
      inline:
        display_name: SentieroAperto planner
        crews:
        - id: planner
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are an outdoor route planner for hiking, cycling and other outdoor activities. Use ONLY your
            tools for facts.

            Tools: osm_geocode (Nominatim: query like ''q=Bolzano&format=json&limit=3'' to locate the area and start point);
            osm_overpass (Overpass API: query ''data=<URL-encoded Overpass QL>'' with [out:json][timeout:25]; search hiking/cycling
            route relations, paths, huts, viewpoints, water, within a small bbox or ''around'' radius of the start; keep results
            small with ''out center 40;'' or ''out geom'' for a single chosen way); elevation (Open-Meteo: query ''latitude=46.5,46.6&longitude=11.3,11.4''
            up to 100 points, returns metres); weather (Open-Meteo forecast: query ''latitude=..&longitude=..&hourly=temperature_2m,precipitation_probability,precipitation,wind_speed_10m,wind_gusts_10m,freezing_level_height&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,wind_gusts_10m_max,sunrise,sunset&timezone=auto&start_date=YYYY-MM-DD&end_date=YYYY-MM-DD'',
            forecasts reach about 16 days ahead). Query weather at the start, the highest point and the end of the route.

            Process: 1) locate start; 2) find real OSM paths/routes fitting activity, difficulty and the wanted duration or
            ascent; 3) sample elevations along it to compute distance, ascent, descent and a profile; 4) estimate times per
            leg (hiking ~ 4 km/h on flat plus 400 m ascent per hour; cycling by surface and slope; children or slow groups
            slower); 5) check weather for the requested period.

            Output in the language with ISO code given in the goal, starting with a level-1 title ''# <Route name> — <activity>,
            <km> km''. Then ## Verdict (a line: RECOMMENDED / CAUTION / NOT ADVISABLE, with reasons: thunderstorms, rain probability
            above 60%, gusts above 60 km/h, freezing level near the summit, heat above 32 °C, short daylight); ## Key figures
            (table: distance, ascent, descent, highest point, estimated time, difficulty, surface); ## Stages (table: stage,
            from-to, km, ascent, time, point of interest, water/hut); ## Weather along the route (table by start/top/end and
            by time); ## Exposed or critical sections; ## Practical tips (equipment, public transport, bail-out points). Add
            an elevation profile as a fenced chart block: ```chart

            {"type":"line","title":"...","labels":[km values],"series":[{"name":"...","values":[metres]}],"unit":"m"}```.
            Add the waypoints as a fenced ```gpx block holding a valid GPX 1.1 file (trk with trkseg and trkpt lat/lon/ele,
            plus wpt for stages), using only coordinates actually read from OSM data. End with the attribution: ''Route data
            © OpenStreetMap contributors (ODbL); weather and elevation: Open-Meteo.com (CC BY 4.0)''.

            Never invent coordinates, figures or trails: if OSM data is insufficient, say so and propose a smaller alternative.
            You give advice, not guarantees: remind the user that conditions in the mountains change and to check local alerts
            and avalanche/trail closures.'
    goalTemplate: 'Area: {area}

      Start point: {start}

      Activity: {activity_label}

      Difficulty: {difficulty_label}

      {?duration_hours}Desired duration: {duration_hours} hours.{/duration_hours}

      {?ascent_m}Desired ascent: {ascent_m} m.{/ascent_m}

      Period / date: {period}

      {?notes}Notes: {notes}{/notes}

      Today is {date}. Write the route in the language with ISO code {lang}.'
    output: markdown
    writesTo:
      collection: routes
      parse: whole
    appTools:
    - name: osm_geocode
      description: Locate a place with Nominatim (OpenStreetMap)
      action: http
      http:
        method: GET
        url: https://nominatim.openstreetmap.org/search
        attribution: © OpenStreetMap contributors, ODbL
    - name: osm_overpass
      description: Query OpenStreetMap routes, paths and points of interest with Overpass QL
      action: http
      http:
        method: GET
        url: https://overpass-api.de/api/interpreter
        maxBytes: 300000
        timeoutMs: 30000
        attribution: © OpenStreetMap contributors, ODbL
    - name: elevation
      description: Elevation in metres for up to 100 coordinates (Open-Meteo)
      action: http
      http:
        method: GET
        url: https://api.open-meteo.com/v1/elevation
        attribution: Open-Meteo.com, CC BY 4.0
    - name: weather
      description: Weather forecast at a coordinate (Open-Meteo)
      action: http
      http:
        method: GET
        url: https://api.open-meteo.com/v1/forecast
        attribution: Open-Meteo.com, CC BY 4.0
    limits:
      maxTurns: 25
      maxBudgetUsd: 1.0
  - key: coach
    role: helper
    description: 'Chat that adjusts a route: shorter, avoid exposed sections, child-friendly.'
    profile:
      inline:
        display_name: SentieroAperto variants
        chat_mode: true
        crews:
        - id: coach
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 20
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You help users adjust their saved outdoor routes in conversation. Read the user''s saved routes
            with routes_read to find the one they mean (the latest if unclear). When they ask for a variant (''shorter'',
            ''avoid exposed sections'', ''suitable for children'', ''easier'', ''more scenic''), look for real alternatives
            with osm_overpass (query ''data=<URL-encoded Overpass QL>'', small areas, ''out center 40;''), check elevation
            and weather when needed, and answer briefly: what changes, new distance/ascent/time, and the new verdict on the
            weather. When the user wants the full new route, write it in the same structure as the original (# title, Verdict,
            Key figures, Stages, Weather) with a fenced ```gpx block of real OSM coordinates. Never invent coordinates, trails
            or figures; say when OSM data is missing. Answer in the user''s language. Remind about local conditions when risk
            is relevant.'
    goalTemplate: 'Conversation so far:

      {history}


      New message from {user}: {message}

      Today is {date}. Reply in the language with ISO code {lang}.'
    output: markdown
    appTools:
    - name: routes_read
      description: The user's saved routes
      action: read
      collection: routes
      scope: user
    - name: osm_overpass
      description: Query OpenStreetMap routes, paths and points of interest with Overpass QL
      action: http
      http:
        method: GET
        url: https://overpass-api.de/api/interpreter
        maxBytes: 300000
        timeoutMs: 30000
        attribution: © OpenStreetMap contributors, ODbL
    - name: elevation
      description: Elevation in metres for up to 100 coordinates (Open-Meteo)
      action: http
      http:
        method: GET
        url: https://api.open-meteo.com/v1/elevation
        attribution: Open-Meteo.com, CC BY 4.0
    - name: weather
      description: Weather forecast at a coordinate (Open-Meteo)
      action: http
      http:
        method: GET
        url: https://api.open-meteo.com/v1/forecast
        attribution: Open-Meteo.com, CC BY 4.0
    limits:
      maxTurns: 20
      maxBudgetUsd: 0.6
  - key: watcher
    role: helper
    description: 'Daily: recomputes the feasibility of one saved route against the latest forecast.'
    memory: instance
    profile:
      inline:
        display_name: SentieroAperto weather watch
        crews:
        - id: watcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You watch the weather feasibility of ONE planned outdoor route. Use geocode and weather tools: locate
            the start with osm_geocode (''q=...&format=json&limit=1''), then read the forecast at the start (and at the top
            altitude if given) for the planned date with weather (''latitude=..&longitude=..&hourly=temperature_2m,precipitation_probability,wind_gusts_10m,freezing_level_height&daily=weather_code,precipitation_sum,wind_gusts_10m_max&timezone=auto&start_date=..&end_date=..'').
            Start with ''# <Route> — <date>: RECOMMENDED | CAUTION | NOT ADVISABLE''. Then ## Why (max 4 bullets with real
            figures), ## What changed since last check (use your memory), ## Suggestion (alternative day or time window within
            the next 7 days if conditions are bad). Under 200 words. If the date is beyond the forecast horizon (16 days)
            say so. Never invent figures. At the end call the tool remember once with the verdict and key figures.'
    appTools:
    - name: osm_geocode
      description: Locate a place with Nominatim (OpenStreetMap)
      action: http
      http:
        method: GET
        url: https://nominatim.openstreetmap.org/search
        attribution: © OpenStreetMap contributors, ODbL
    - name: weather
      description: Weather forecast at a coordinate (Open-Meteo)
      action: http
      http:
        method: GET
        url: https://api.open-meteo.com/v1/forecast
        attribution: Open-Meteo.com, CC BY 4.0
    writesTo:
      collection: route_checks
      parse: whole
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.3
  inputForm:
    title:
      it: Nuovo itinerario
      de: Neue Route
      en: New route
    fields:
    - name: area
      type: text
      required: true
      label:
        it: Zona
        de: Gebiet
        en: Area
      help:
        it: es. Val Gardena, Dolomiti
        de: z. B. Gröden, Dolomiten
        en: e.g. Val Gardena, Dolomites
    - name: activity
      type: select
      required: true
      label:
        it: Attività
        de: Aktivität
        en: Activity
      options:
      - value: hiking
        label:
          it: Escursione
          de: Wandern
          en: Hiking
      - value: trail_running
        label:
          it: Trail running
          de: Trailrunning
          en: Trail running
      - value: road_bike
        label:
          it: Bici da strada
          de: Rennrad
          en: Road bike
      - value: mtb
        label: MTB
      - value: gravel
        label: Gravel
      - value: family_walk
        label:
          it: Passeggiata con bambini
          de: Familienspaziergang
          en: Family walk
    - name: difficulty
      type: select
      required: true
      label:
        it: Difficoltà
        de: Schwierigkeit
        en: Difficulty
      options:
      - value: easy
        label:
          it: Facile
          de: Leicht
          en: Easy
      - value: medium
        label:
          it: Media
          de: Mittel
          en: Medium
      - value: hard
        label:
          it: Impegnativa
          de: Schwer
          en: Hard
    - name: duration_hours
      type: number
      label:
        it: Durata desiderata (ore)
        de: Gewünschte Dauer (Stunden)
        en: Desired duration (hours)
    - name: ascent_m
      type: number
      label:
        it: Dislivello desiderato (m)
        de: Gewünschte Höhenmeter (m)
        en: Desired ascent (m)
    - name: period
      type: text
      required: true
      label:
        it: Periodo o data
        de: Zeitraum oder Datum
        en: Period or date
      help:
        it: es. 2026-11-15 o prossimo weekend
        de: z. B. 2026-11-15 oder nächstes Wochenende
        en: e.g. 2026-11-15 or next weekend
    - name: start
      type: text
      required: true
      label:
        it: Punto di partenza
        de: Startpunkt
        en: Starting point
    - name: notes
      type: textarea
      maxLength: 400
      label:
        it: Note (facoltative)
        de: Hinweise (optional)
        en: Notes (optional)
  data:
    collections:
    - name: routes
      ownedBy: user
      description: The user's saved routes (one per planner run)
    - name: route_checks
      ownedBy: instance
      description: Daily feasibility checks of each route watch
  templates:
  - key: route_watch
    title:
      it: Controllo meteo percorso
      de: Wetter-Check der Route
      en: Route weather check
    description:
      it: Ogni giorno ricalcola la fattibilità di un percorso in base alle previsioni.
      de: Berechnet täglich die Machbarkeit einer Route anhand der Vorhersage neu.
      en: Recomputes every day the feasibility of a route from the forecast.
    agent: watcher
    params:
    - name: route
      type: text
      required: true
      label:
        it: Nome del percorso
        de: Name der Route
        en: Route name
    - name: start
      type: text
      required: true
      label:
        it: Punto di partenza
        de: Startpunkt
        en: Starting point
    - name: top_altitude
      type: number
      label:
        it: Quota massima (m)
        de: Höchster Punkt (m)
        en: Highest point (m)
    - name: date
      type: date
      required: true
      label:
        it: Data prevista
        de: Geplantes Datum
        en: Planned date
    goal: Check the route "{route}" starting at {start}{?top_altitude}, highest point {top_altitude} m{/top_altitude}, planned
      for {date}. Today is {date}. Write in the language with ISO code {lang}.
    schedule:
      cron: 0 5 * * *
      userCanChange: false
    maxPerUser: 10
    cost:
      perRun: 3
  schedules: []
  views:
  - key: home
    type: page
    nav: false
    title: SentieroAperto
    sections:
    - type: hero
      band: true
      eyebrow:
        it: Escursioni · Bici · Outdoor
        de: Wandern · Rad · Outdoor
        en: Hiking · Cycling · Outdoor
      title:
        it: Il tuo **itinerario**, con il meteo già controllato.
        de: Deine **Route**, mit geprüftem Wetter.
        en: Your **route**, with the weather already checked.
      text:
        it: 'Scegli zona, attività e periodo: l''agente costruisce il percorso da OpenStreetMap, ti dà tappe, tempi, profilo
          altimetrico e traccia GPX, e ti dice se le condizioni sono sconsigliate.'
        de: 'Wähle Gebiet, Aktivität und Zeitraum: Der Agent erstellt die Route aus OpenStreetMap, liefert Etappen, Zeiten,
          Höhenprofil und GPX-Track und warnt bei ungünstigen Bedingungen.'
        en: 'Pick area, activity and period: the agent builds the route from OpenStreetMap, gives you stages, times, elevation
          profile and a GPX track, and tells you when conditions are not advisable.'
      actions:
      - label:
          it: Crea un itinerario
          de: Route erstellen
          en: Create a route
        href: /v/new_route
        style: primary
      - label:
          it: Accedi
          de: Anmelden
          en: Sign in
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        de: So funktioniert's
        en: How it works
      items:
      - title:
          it: 1 · Compila il modulo
          de: 1 · Formular ausfüllen
          en: 1 · Fill in the form
        text:
          it: Zona, attività, difficoltà, durata o dislivello, periodo e partenza.
          de: Gebiet, Aktivität, Schwierigkeit, Dauer oder Höhenmeter, Zeitraum und Start.
          en: Area, activity, difficulty, duration or ascent, period and start.
      - title:
          it: 2 · Itinerario e meteo
          de: 2 · Route und Wetter
          en: 2 · Route and weather
        text:
          it: Percorsi e punti di interesse da OpenStreetMap, previsioni lungo il tracciato da Open-Meteo, con verdetto chiaro.
          de: Wege und Sehenswürdigkeiten aus OpenStreetMap, Vorhersage entlang der Strecke von Open-Meteo, mit klarem Urteil.
          en: Paths and points of interest from OpenStreetMap, forecast along the track from Open-Meteo, with a clear verdict.
      - title:
          it: 3 · Varianti in chat
          de: 3 · Varianten im Chat
          en: 3 · Variants in chat
        text:
          it: «Più corto», «evita i tratti esposti», «adatto ai bambini».
          de: „Kürzer“, „ohne ausgesetzte Stellen“, „kindgerecht“.
          en: '"Shorter", "avoid exposed sections", "suitable for children".'
    - type: cards
      id: piani
      title:
        it: Piani
        de: Tarife
        en: Plans
      items:
      - title:
          it: Gratis
          de: Gratis
          en: Free
        text:
          it: Itinerari base con meteo, varianti in chat e traccia GPX.
          de: Basisrouten mit Wetter, Varianten im Chat und GPX-Track.
          en: Basic routes with weather, chat variants and GPX track.
      - title: Pro
        badge: ⛰️
        text:
          it: Avvisi meteo giornalieri sui percorsi salvati e tracce offline per l'app nativa.
          de: Tägliche Wetterwarnungen für gespeicherte Routen und Offline-Tracks für die native App.
          en: Daily weather alerts on saved routes and offline tracks for the native app.
    - type: note
      content:
        it: 'Dati dei percorsi © contributori di OpenStreetMap (ODbL); meteo e quote: Open-Meteo.com. Supporto alla pianificazione:
          le condizioni in montagna cambiano, verifica sempre bollettini e chiusure locali.'
        de: 'Routendaten © OpenStreetMap-Mitwirkende (ODbL); Wetter und Höhen: Open-Meteo.com. Planungshilfe: Die Bedingungen
          im Gebirge ändern sich, prüfe stets lokale Berichte und Sperrungen.'
        en: 'Route data © OpenStreetMap contributors (ODbL); weather and elevation: Open-Meteo.com. Planning aid: mountain
          conditions change, always check local bulletins and closures.'
  - key: new_route
    type: new_run
    title:
      it: Nuovo itinerario
      de: Neue Route
      en: New route
    roles:
    - user
    - admin
  - key: my_routes
    type: history
    title:
      it: I miei itinerari
      de: Meine Routen
      en: My routes
    source: run
    roles:
    - user
    - admin
  - key: route
    type: report
    source: run
    printable: true
    nav: false
  - key: variants
    type: chat
    title:
      it: Varianti
      de: Varianten
      en: Variants
    source: agent:coach
    placeholder:
      it: Chiedi una variante…
      de: Frag nach einer Variante…
      en: Ask for a variant…
    examples:
    - it: Più corto
      de: Kürzer
      en: Shorter
    - it: Evita i tratti esposti
      de: Ohne ausgesetzte Stellen
      en: Avoid exposed sections
    - it: Adatto ai bambini
      de: Kindgerecht
      en: Suitable for children
    roles:
    - user
    - admin
  - key: watches
    type: instances
    template: route_watch
    title:
      it: Avvisi meteo
      de: Wetterwarnungen
      en: Weather alerts
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      de: Abonnement
      en: Plan
    roles:
    - user
  billing:
    modes:
    - credits
    - subscription
    currency: eur
    signupCredits: 60
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:planner:
        estimate: 10
        metered: true
      agent:coach:
        estimate: 4
        metered: true
      agent:watcher:
        estimate: 3
        metered: true
        requiresPlan: pro
    packs:
    - key: routes_50
      credits: 500
      price: 5
      label: 500 credits
    plans:
    - key: pro
      price: 4.9
      interval: month
      label: Pro
      includes:
      - daily weather alerts on saved routes
      - offline tracks for the native app
      credits: 500
      creditsReset: monthly
  extensions:
  - key: interactive_map
    description: 'Interactive map with the route and an elevation profile linked to the cursor is not available as a view
      yet: the report shows stages, a chart of the elevation profile and the waypoints.'
  - key: gpx_download
    description: The GPX track is delivered as a fenced gpx block inside the report; a one-click .gpx file download button
      is not available yet.
  - key: email_alerts
    description: 'Emails when a route becomes not advisable are not available yet: the daily check writes its verdict to the
      route''s alerts view; e-mail notifications must be added later.'
  - key: native_offline_app
    description: 'Native app with GPS track following and offline maps/tracks for places without coverage: requires a separate
      native shell (Capacitor) with offline map tiles; not expressible in the manifest. Offline track access is reserved to
      the Pro plan.'
  - key: open_meteo_licence
    description: 'Open-Meteo''s free API is non-commercial: a commercial API licence is needed before charging for the Pro
      plan.'
