apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: segnali-deboli
  displayName: Segnali Deboli
  tagline:
    it: Vedi i trend prima che diventino ovvi.
    en: See trends before they become obvious.
  description:
    it: 'Previsione dei trend per uffici marketing, design e innovazione: un team di agenti segue ogni giorno fonti lecite
      e statistiche Wikipedia, classifica i temi emergenti e ti avvisa quando uno accelera.'
    en: 'Trend forecasting for marketing, design and innovation teams: a team of agents follows lawful sources and Wikipedia
      statistics every day, ranks emerging themes and alerts you when one accelerates.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: dashboard
  branding:
    theme: light
    palette:
      primary: '#1f2a44'
      accent: '#e0603a'
      background: '#f7f6f3'
      foreground: '#1b1f24'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: 'Segnali '
      color: primary
    - text: Deboli
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Fonti
        en: Sources
      href: '#fonti'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  egress:
    hosts:
    - wikimedia.org
    notes: 'Wikimedia REST API, pageviews per article: public, reuse allowed under Wikimedia API terms (CC0 data); a descriptive
      user agent and moderate rate are used. Instagram is NOT called: scraping is not allowed by its terms.'
  agents:
  - key: scanner
    role: scheduled
    description: Team that scans lawful sources for one sector and markets, measures interest and ranks trends.
    memory: instance
    writesTo:
      collection: scans
      parse: json_last
      keyBy: date
    output: markdown+json
    resultSchema:
      type: object
      properties:
        date:
          type: string
        sector:
          type: string
        summary:
          type: string
        alert:
          type: string
          enum:
          - 'yes'
          - 'no'
        trends:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              stage:
                type: string
                enum:
                - nascente
                - in crescita
                - maturo
              growth_pct:
                type: number
              spread:
                type: number
              evidence:
                type: string
    appTools:
    - name: wiki_pageviews
      description: 'Wikipedia daily pageviews of an article. Path: /<lang>.wikipedia/all-access/user/<Article_Title>/daily/<YYYYMMDD>/<YYYYMMDD>'
      action: http
      http:
        method: GET
        url: https://wikimedia.org/api/rest_v1/metrics/pageviews/per-article
        allowPath: true
        attribution: Wikimedia Foundation pageviews API
    profile:
      inline:
        display_name: Segnali Deboli scanner team
        crews:
        - id: collector
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'Sei il raccoglitore di Segnali Deboli. Per il settore e i mercati indicati raccogli, tramite il
            WebRobot MCP, contenuti recenti (ultimi 7 giorni) SOLO da fonti lecite: blog di settore, riviste online con feed
            RSS, comunicati stampa. Rispetta robots.txt e termini di servizio; NON accedere a Instagram o ad altri social
            che vietano lo scraping. Con wiki_pageviews misura l''interesse (ultimi 60 giorni) per gli articoli Wikipedia
            dei temi candidati, nella lingua dei mercati. Produci un elenco di 10-20 temi candidati, ciascuno con fonti (URL,
            titolo, data) e serie di visualizzazioni. Non inventare dati.'
        - id: classifier
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''analista di Segnali Deboli. Dai temi candidati raggruppa in trend, misura crescita (variazione
            % delle visualizzazioni, ultimi 14 giorni vs 14 precedenti) e diffusione (numero di fonti e mercati distinti),
            classifica ciascun trend come nascente, in crescita o maturo. Usa la memoria per confrontare con ieri: alert="yes"
            se un trend accelera in modo netto o ne compare uno nuovo rilevante. Scrivi un report breve che inizia con "#
            <Settore> — segnali del <data>" e termina con un unico blocco JSON {date (YYYY-MM-DD), sector, summary, alert,
            trends:[{name, stage (nascente|in crescita|maturo), growth_pct, spread, evidence}]}. Alla fine chiama remember
            con i 5 punti chiave. Mai cifre inventate.'
        orchestration:
          type: dag
          entry: collector
          nodes:
          - id: collector
            crew: collector
          - id: classifier
            crew: classifier
          edges:
          - from: collector
            to: classifier
  - key: reporter
    role: helper
    description: Writes the monthly sector report with examples, growth charts and business implications.
    output: markdown
    writesTo:
      collection: reports
      parse: whole
    appTools:
    - name: read_scans
      description: Read the daily scans of the user's watches
      action: read
      collection: scans
      scope: user
    - name: wiki_pageviews
      description: 'Wikipedia daily pageviews of an article. Path: /<lang>.wikipedia/all-access/user/<Article_Title>/daily/<YYYYMMDD>/<YYYYMMDD>'
      action: http
      http:
        method: GET
        url: https://wikimedia.org/api/rest_v1/metrics/pageviews/per-article
        allowPath: true
        attribution: Wikimedia Foundation pageviews API
    profile:
      inline:
        display_name: Segnali Deboli reporter
        crews:
        - id: reporter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Scrivi il report mensile di un settore per uffici marketing, design e innovazione. Usa read_scans
            per i segnali del mese e wiki_pageviews per verificare le curve. Inizia con "# <Settore> — report <mese anno>".
            Sezioni ##: Sintesi, Trend nascenti, Trend in crescita, Trend maturi, Esempi (con fonti e URL), Implicazioni per
            il business, Cosa monitorare. Aggiungi almeno un grafico di crescita in blocco ```chart {"type":"bar","title":"...","labels":[...],"series":[{"name":"...","values":[...]}],"unit":"%"}```
            con dati reali. Non inventare cifre; dichiara le incertezze. Non usare Instagram.'
  - key: advisor
    role: main
    description: Chat that produces on-demand custom trend reports.
    memory: user
    appTools:
    - name: read_scans
      description: Read the daily scans of the user's watches
      action: read
      collection: scans
      scope: user
    - name: wiki_pageviews
      description: 'Wikipedia daily pageviews of an article. Path: /<lang>.wikipedia/all-access/user/<Article_Title>/daily/<YYYYMMDD>/<YYYYMMDD>'
      action: http
      http:
        method: GET
        url: https://wikimedia.org/api/rest_v1/metrics/pageviews/per-article
        allowPath: true
        attribution: Wikimedia Foundation pageviews API
    goalTemplate: 'Conversazione finora:

      {history}


      Nuovo messaggio: {message}

      Rispondi in lingua {lang}. Data: {date}.'
    output: markdown
    profile:
      inline:
        display_name: Segnali Deboli advisor
        chat_mode: true
        crews:
        - id: advisor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'Sei il consulente trend di Segnali Deboli. Quando il cliente chiede un report su misura (es. il
            futuro delle bevande analcoliche in Germania), raccogli fonti lecite (blog, riviste con RSS, comunicati) via WebRobot
            MCP, misura l''interesse con wiki_pageviews e usa read_scans per i segnali già raccolti. Il report inizia con
            "# " e titolo, poi sezioni: Sintesi, Trend con stadio (nascente/in crescita/maturo), Esempi con fonti, Implicazioni
            per il business, Incertezze; aggiungi un grafico ```chart``` con dati reali. Mai inventare cifre. Non accedere
            a Instagram o a fonti che lo vietano.'
  templates:
  - key: sector_watch
    title:
      it: Osservatorio di settore
      en: Sector watch
    description:
      it: Scansione giornaliera di un settore sui mercati scelti.
      en: Daily scan of a sector in the chosen markets.
    agent: scanner
    params:
    - name: sector
      type: select
      required: true
      label:
        it: Settore
        en: Sector
      options:
      - value: cibo
        label:
          it: Cibo
          en: Food
      - value: moda
        label:
          it: Moda
          en: Fashion
      - value: bellezza
        label:
          it: Bellezza
          en: Beauty
      - value: casa
        label:
          it: Casa
          en: Home
      - value: mobilita
        label:
          it: Mobilità
          en: Mobility
    - name: markets
      type: multiselect
      required: true
      label:
        it: Mercati
        en: Markets
      options:
      - value: IT
        label: Italia
      - value: DE
        label: Germania
      - value: FR
        label: Francia
      - value: ES
        label: Spagna
      - value: UK
        label: Regno Unito
      - value: US
        label: USA
    goal: 'Osservatorio "{instance}": settore {sector}, mercati {markets}. Oggi è {date}. Scansiona, classifica i trend e
      scrivi il report in lingua {lang}.'
    schedule:
      cron: 0 5 * * *
      userCanChange: false
    maxPerUser: 5
  - key: sector_report
    title:
      it: Report mensile di settore
      en: Monthly sector report
    agent: reporter
    params:
    - name: sector
      type: select
      required: true
      label:
        it: Settore
        en: Sector
      options:
      - value: cibo
        label:
          it: Cibo
          en: Food
      - value: moda
        label:
          it: Moda
          en: Fashion
      - value: bellezza
        label:
          it: Bellezza
          en: Beauty
      - value: casa
        label:
          it: Casa
          en: Home
      - value: mobilita
        label:
          it: Mobilità
          en: Mobility
    - name: markets
      type: multiselect
      required: true
      label:
        it: Mercati
        en: Markets
      options:
      - value: IT
        label: Italia
      - value: DE
        label: Germania
      - value: FR
        label: Francia
      - value: ES
        label: Spagna
      - value: UK
        label: Regno Unito
      - value: US
        label: USA
    goal: 'Report mensile "{instance}": settore {sector}, mercati {markets}. Data {date}. Scrivi in lingua {lang}.'
    schedule:
      cron: 0 6 1 * *
      userCanChange: false
    maxPerUser: 5
    deliver:
      to: owner
      onlyIfNew: true
  triggers:
  - key: trend_accelerates
    'on':
      collection: scans
      op: insert
      where:
        alert: 'yes'
    notify:
      to: owner
      subject:
        it: 'Un trend sta accelerando: {record.sector}'
        en: 'A trend is accelerating: {record.sector}'
      body:
        it: '{record.summary}


          Apri la dashboard per i dettagli.'
        en: '{record.summary}


          Open the dashboard for details.'
      link: radar
  data:
    collections:
    - name: scans
      ownedBy: instance
      description: Daily scan result of each sector watch
      retentionDays: 730
      fields:
      - name: date
        type: date
        label: Data
      - name: sector
        type: text
        label: Settore
      - name: summary
        type: textarea
        label: Sintesi
      - name: alert
        type: select
        options:
        - 'yes'
        - 'no'
        label: Alert
      - name: trends
        type: json
        label: Trend
    - name: reports
      ownedBy: instance
      description: Monthly sector reports
      fields:
      - name: title
        type: text
      - name: content
        type: textarea
  views:
  - key: home
    type: page
    nav: false
    title: Segnali Deboli
    sections:
    - type: hero
      title:
        it: Vedi i **segnali deboli** prima che diventino trend.
        en: See **weak signals** before they become trends.
      text:
        it: 'Ogni giorno un team di agenti segue le fonti lecite del tuo settore, misura l''interesse su Wikipedia e classifica
          i temi: nascenti, in crescita, maturi.'
        en: 'Every day a team of agents follows your sector''s lawful sources, measures interest on Wikipedia and ranks themes:
          emerging, growing, mature.'
      actions:
      - label:
          it: Inizia
          en: Start
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Scegli settori e mercati
          en: Choose sectors and markets
        text:
          it: Cibo, moda, bellezza, casa, mobilità.
          en: Food, fashion, beauty, home, mobility.
      - title:
          it: Scansione quotidiana
          en: Daily scan
        text:
          it: Raccolta, misura di crescita e diffusione, classificazione.
          en: Collection, growth and spread measurement, classification.
      - title:
          it: Dashboard, alert e report
          en: Dashboard, alerts and reports
        text:
          it: Report mensile per settore e report su misura in chat.
          en: Monthly sector report and custom reports in chat.
    - type: cards
      id: fonti
      title:
        it: Fonti
        en: Sources
      items:
      - title:
          it: Blog, riviste e comunicati
          en: Blogs, magazines and press releases
        text:
          it: Solo fonti con feed RSS o accesso consentito.
          en: Only sources with RSS feeds or permitted access.
      - title: Wikipedia
        text:
          it: Statistiche di visualizzazione delle pagine come misura dell'interesse.
          en: Page view statistics as a measure of interest.
    - type: note
      content:
        it: 'Le immagini di Instagram non sono analizzate: i termini del servizio non lo consentono senza accesso ufficiale
          autorizzato. Supporto alle decisioni, non consulenza.'
        en: 'Instagram images are not analysed: its terms do not allow it without official authorised access. Decision support,
          not advice.'
  - key: radar
    type: page
    title:
      it: Dashboard trend
      en: Trend dashboard
    roles:
    - user
    - admin
    sections:
    - type: data
      title:
        it: Trend seguiti
        en: Followed trends
      source: collection:scans
      path: trends
      display: table
      fields:
      - key: name
        label:
          it: Trend
          en: Trend
      - key: stage
        label:
          it: Stadio
          en: Stage
        format: badge
      - key: growth_pct
        label:
          it: Crescita %
          en: Growth %
        format: percent
      - key: spread
        label:
          it: Diffusione
          en: Spread
        format: number
      - key: evidence
        label:
          it: Evidenze
          en: Evidence
      sort:
        field: growth_pct
        dir: desc
      limit: 50
      empty:
        it: 'Nessuna scansione ancora: crea un osservatorio.'
        en: 'No scans yet: create a watch.'
    - type: data
      title:
        it: Crescita
        en: Growth
      source: collection:scans
      path: trends
      display: chart
      chart: bar
      fields:
      - key: name
      - key: growth_pct
        label: '%'
      limit: 15
  - key: watches
    type: instances
    template: sector_watch
    title:
      it: I miei settori
      en: My sectors
    roles:
    - user
    - admin
  - key: report_watches
    type: instances
    template: sector_report
    title:
      it: Report mensili
      en: Monthly reports
    roles:
    - user
    - admin
  - key: reports
    type: list
    title:
      it: Archivio report
      en: Report archive
    source: collection:reports
    columns:
    - title
    - content
    export: true
    roles:
    - user
    - admin
  - key: chat
    type: chat
    title:
      it: Report su misura
      en: Custom report
    source: agent:advisor
    examples:
    - it: Il futuro delle bevande analcoliche in Germania
      en: The future of non-alcoholic drinks in Germany
    - it: Quali trend emergono nella mobilità urbana in Francia?
      en: Which trends are emerging in urban mobility in France?
    placeholder:
      it: Chiedi un report su un tema e un mercato…
      en: Ask for a report on a topic and market…
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - user
  notifications:
    emailOnRunDone: false
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: sectors_1
      price: 990
      interval: year
      label:
        it: 1 settore
        en: 1 sector
      includes:
      - 1 settore
      - report mensile
      - alert
      - chat
    - key: sectors_3
      price: 2490
      interval: year
      label:
        it: 3 settori
        en: 3 sectors
      includes:
      - 3 settori
      - report mensili
      - alert
      - chat
    - key: sectors_5
      price: 3790
      interval: year
      label:
        it: 5 settori
        en: 5 sectors
      includes:
      - 5 settori
      - report mensili
      - alert
      - chat
  extensions:
  - key: sector_quota
    description: 'Il numero di settori seguiti dovrebbe seguire il piano (1/3/5): da applicare come quota per piano sulle
      istanze di sector_watch.'
  - key: instagram_vision
    description: 'Analisi con modelli di visione delle immagini Instagram: non disponibile. Richiede accesso ufficiale consentito
      dai termini (API con consenso OAuth, non ancora disponibile); non si fa scraping.'
