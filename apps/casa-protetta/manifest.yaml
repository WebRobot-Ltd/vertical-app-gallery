apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: casa-protetta
  displayName: Casa Protetta
  tagline:
    it: Capisci quali coperture servono davvero alla tua casa.
    en: Understand which coverages your home really needs.
  description:
    it: 'Sito informativo: rispondi a un breve questionario e un assistente AI ti spiega, in modo semplice, quali coperture
      casa e responsabilità civile potrebbero esserti utili, sulla base dei documenti informativi della compagnia. Nessuna
      quotazione né emissione: per quelle ti richiama un agente abilitato.'
    en: 'Information site: answer a short questionnaire and an AI assistant explains in plain words which home and liability
      coverages may suit you, based on the insurer''s pre-contractual documents. No quotes or policy issuing: an authorised
      agent calls you for those.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#17415f'
      accent: '#d9822b'
      background: '#f7f9fb'
      foreground: '#16222d'
    fonts:
      body: Inter
      display: Merriweather
    wordmark:
    - text: Casa
      color: primary
    - text: Protetta
      color: accent
    buttonShape: rounded
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Coperture
        en: Coverages
      href: '#coperture'
    cta:
      label:
        it: Inizia il questionario
        en: Start the questionnaire
      href: /v/new
  auth:
    method: magic_link
    anonymous:
      agents:
      - advisor
      - assistant
      views:
      - home
      - new
      - report
      - chat
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: agent
      label:
        it: Agente assicurativo
        en: Insurance agent
      assignedBy: invite
    - key: user
      label:
        it: Utente
        en: User
      assignedBy: signup
  limits:
  - action: agent:advisor
    per: ip
    max: 5
    window: day
    roles:
    - anonymous
  - action: chat
    per: ip
    max: 40
    window: day
    roles:
    - anonymous
  - action: login
    per: ip
    max: 10
    window: hour
  agents:
  - key: advisor
    role: main
    when: consent != true
    description: Spiega le coperture utili in base al questionario, usando i documenti informativi pubblicati (visitatore
      anonimo).
    profile:
      inline:
        display_name: Consulente informativo Casa Protetta
        crews:
        - id: advisor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un assistente informativo di una compagnia che vende polizze casa e responsabilità civile. NON
            quoti prezzi, NON emetti polizze, NON gestisci sinistri e non dai consulenza assicurativa personalizzata: spieghi
            in modo semplice quali coperture potrebbero essere utili e perché. Prima di scrivere leggi i documenti informativi
            precontrattuali con il tool read_documents e basa condizioni, esclusioni e massimali SOLO su quelli, citando il
            titolo del documento; se un dato non c''è, dillo e non inventare cifre. Struttura del report: un titolo di livello
            1 "# Le coperture consigliate per la tua casa"; poi sezioni ## Il tuo profilo (riepilogo breve delle risposte),
            ## Coperture consigliate (una tabella: copertura, perché serve, priorità alta/media/bassa, riferimento al documento),
            ## Dettaglio (incendio, danni da acqua, furto, responsabilità civile verso terzi, eventi catastrofali: per ciascuna
            spiega in 2-3 frasi con linguaggio semplice, adatta a proprietà/affitto, anno di costruzione, zona, animali e
            bambini), ## Cosa controllare prima di decidere (esclusioni, franchigie, limiti), ## Prossimi passi (puoi lasciare
            i tuoi dati per essere richiamato da un agente abilitato). Chiudi con l''avvertenza: contenuto informativo, non
            è un preventivo né un''offerta contrattuale. Scrivi nella lingua richiesta e resta sotto le 600 parole.'
    goalTemplate: 'Questionario del visitatore:

      - Abitazione: {dwelling_type_label}

      - Rapporto con l''immobile: {tenure_label}

      - Superficie: {area_sqm} m²

      - Anno di costruzione: {build_year}

      - Zona: {zone}

      - Animali domestici: {pets_label}

      - Bambini in casa: {children_label}

      - Cosa vuole proteggere: {protect}

      Oggi è {date}. Scrivi il riepilogo nella lingua con codice ISO {lang}.'
    appTools:
    - name: read_documents
      description: Legge i documenti informativi precontrattuali pubblicati dalla compagnia
      action: read
      collection: documents
      scope: all
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.4
  - key: advisor_contact
    role: main
    when: consent == true
    description: Come advisor, ma in più chiede all'agenzia di richiamare il visitatore (richiede accesso con email).
    awaits:
    - callback
    profile:
      inline:
        display_name: Consulente informativo Casa Protetta (con richiamo)
        crews:
        - id: advisor_contact
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un assistente informativo di una compagnia che vende polizze casa e responsabilità civile. NON
            quoti prezzi, NON emetti polizze, NON gestisci sinistri e non dai consulenza personalizzata. Leggi i documenti
            informativi precontrattuali con read_documents e basa condizioni ed esclusioni SOLO su quelli, citandoli; non
            inventare cifre. Il visitatore ha dato il consenso al contatto: dopo aver scritto il report chiama UNA volta request_callback
            con nome, email, telefono, riepilogo del questionario e coperture consigliate, così un agente abilitato lo richiama.
            Non promettere tempi né prezzi. Struttura del report: "# Le coperture consigliate per la tua casa"; ## Il tuo
            profilo; ## Coperture consigliate (tabella: copertura, perché serve, priorità, documento); ## Dettaglio (incendio,
            danni da acqua, furto, responsabilità civile verso terzi, eventi catastrofali, in linguaggio semplice); ## Cosa
            controllare prima di decidere; ## Prossimi passi (conferma che un agente abilitato ti richiamerà). Chiudi con
            l''avvertenza: contenuto informativo, non è un preventivo né un''offerta. Sotto le 600 parole, nella lingua richiesta.'
    goalTemplate: 'Questionario del visitatore:

      - Abitazione: {dwelling_type_label}

      - Rapporto con l''immobile: {tenure_label}

      - Superficie: {area_sqm} m²

      - Anno di costruzione: {build_year}

      - Zona: {zone}

      - Animali domestici: {pets_label}

      - Bambini in casa: {children_label}

      - Cosa vuole proteggere: {protect}

      Contatto con consenso: nome {contact_name}, email {contact_email}, telefono {contact_phone}.

      Oggi è {date}. Scrivi nella lingua con codice ISO {lang}.'
    appTools:
    - name: read_documents
      description: Legge i documenti informativi precontrattuali pubblicati dalla compagnia
      action: read
      collection: documents
      scope: all
    output: markdown
    limits:
      maxTurns: 10
      maxBudgetUsd: 0.5
  - key: assistant
    role: helper
    description: Risponde in chat alle domande sulle coperture, usando i documenti informativi.
    profile:
      inline:
        display_name: Assistente Casa Protetta
        crews:
        - id: assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 5
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: Sei l'assistente informativo di Casa Protetta, compagnia di polizze casa e responsabilità civile.
            Rispondi in modo semplice e breve alle domande sulle coperture (incendio, danni da acqua, furto, responsabilità
            civile verso terzi, eventi catastrofali), usando read_documents e citando il documento. Se la risposta non è nei
            documenti, dillo e invita a parlare con un agente abilitato. Non dare preventivi, non emettere polizze, non valutare
            sinistri, non inventare cifre o condizioni. Non chiedere dati personali in chat.
    goalTemplate: 'Conversazione finora:

      {history}


      Nuovo messaggio del visitatore: {message}

      Rispondi nella lingua con codice ISO {lang}.'
    appTools:
    - name: read_documents
      description: Legge i documenti informativi precontrattuali pubblicati dalla compagnia
      action: read
      collection: documents
      scope: all
    output: markdown
  inputForm:
    title:
      it: Il tuo questionario
      en: Your questionnaire
    fields:
    - name: dwelling_type
      type: select
      required: true
      label:
        it: Tipo di abitazione
        en: Dwelling type
      options:
      - value: apartment
        label:
          it: Appartamento
          en: Apartment
      - value: house
        label:
          it: Casa indipendente
          en: Detached house
      - value: villa
        label:
          it: Villetta a schiera / villa
          en: Terraced house / villa
    - name: tenure
      type: select
      required: true
      label:
        it: Proprietà o affitto
        en: Own or rent
      options:
      - value: own
        label:
          it: Proprietà
          en: Owner
      - value: rent
        label:
          it: Affitto
          en: Tenant
    - name: area_sqm
      type: number
      required: true
      label:
        it: Metri quadri
        en: Square metres
    - name: build_year
      type: number
      required: true
      label:
        it: Anno di costruzione
        en: Year built
    - name: zone
      type: text
      required: true
      label:
        it: Zona (comune o CAP)
        en: Area (town or postcode)
      maxLength: 80
    - name: pets
      type: select
      required: true
      label:
        it: Animali domestici
        en: Pets
      options:
      - value: 'yes'
        label:
          it: Sì
          en: 'Yes'
      - value: 'no'
        label:
          it: 'No'
          en: 'No'
    - name: children
      type: select
      required: true
      label:
        it: Bambini in casa
        en: Children at home
      options:
      - value: 'yes'
        label:
          it: Sì
          en: 'Yes'
      - value: 'no'
        label:
          it: 'No'
          en: 'No'
    - name: protect
      type: multiselect
      required: true
      label:
        it: Cosa vuoi proteggere
        en: What to protect
      options:
      - value: building
        label:
          it: Struttura dell'immobile
          en: The building
      - value: contents
        label:
          it: Mobili e contenuto
          en: Furniture and contents
      - value: valuables
        label:
          it: Oggetti di valore
          en: Valuables
      - value: liability
        label:
          it: Danni a terzi
          en: Damage to others
    - name: consent
      type: boolean
      label:
        it: Voglio essere richiamato da un agente abilitato (richiede l'accesso con email)
        en: I want a call back from an authorised agent (requires email sign-in)
      default: false
    - name: contact_name
      type: text
      visibleWhen: consent == true
      label:
        it: Nome e cognome
        en: Full name
    - name: contact_email
      type: email
      visibleWhen: consent == true
      label: Email
    - name: contact_phone
      type: text
      visibleWhen: consent == true
      label:
        it: Telefono
        en: Phone
      help:
        it: Spuntando la casella acconsenti a essere contattato da un agente assicurativo abilitato per questa richiesta.
        en: By ticking the box you agree to be contacted by an authorised insurance agent about this request.
  data:
    collections:
    - name: documents
      ownedBy: shared
      description: Documenti informativi precontrattuali pubblicati dalla compagnia (testo incollato dall'agenzia)
      fields:
      - name: title
        type: text
        required: true
        label: Titolo
      - name: coverage
        type: select
        label: Copertura
        options:
        - fire
        - water
        - theft
        - liability
        - catastrophe
        - general
      - name: url
        type: url
        label: Link pubblico
      - name: content
        type: textarea
        required: true
        label: Testo
      searchable: true
  approvals:
  - key: callback
    title:
      it: Richiesta di richiamo
      en: Callback request
    description: Contatto lasciato con consenso da un visitatore
    role: agent
    decidedBy: role
    fields:
    - name
    - email
    - phone
    - summary
    - coverages
  views:
  - key: home
    type: page
    title: Casa Protetta
    nav: false
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow:
        it: Servizio gratuito e senza impegno
        en: Free, no commitment
      title:
        it: Scopri di quali coperture ha **davvero bisogno** la tua casa.
        en: Find out which coverages your home **really needs**.
      text:
        it: 'Rispondi a poche domande: un assistente AI ti spiega in parole semplici quali coperture casa e responsabilità
          civile potrebbero servirti e perché, in base ai documenti informativi della compagnia.'
        en: 'Answer a few questions: an AI assistant explains in plain words which home and liability coverages may suit you
          and why, based on the insurer''s documents.'
      actions:
      - label:
          it: Inizia il questionario
          en: Start the questionnaire
        href: /v/new
        style: primary
      - label:
          it: Fai una domanda in chat
          en: Ask in the chat
        href: /v/chat
        style: ghost
      note:
        it: 'Informativo: nessun preventivo, nessuna emissione di polizza.'
        en: 'Informational only: no quote, no policy issued.'
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Compila il questionario
          en: Fill in the questionnaire
        text:
          it: Tipo di casa, proprietà o affitto, metri quadri, anno, zona, animali e bambini.
          en: Home type, own or rent, size, year, area, pets and children.
        badge: 📝
      - title:
          it: Leggi il riepilogo
          en: Read your summary
        text:
          it: Le coperture consigliate, con il perché e i documenti di riferimento.
          en: Recommended coverages, with the why and the reference documents.
        badge: 🏠
      - title:
          it: Chiedi in chat
          en: Ask in chat
        text:
          it: Dubbi su franchigie o esclusioni? L'assistente risponde.
          en: Doubts about deductibles or exclusions? The assistant answers.
        badge: 💬
      - title:
          it: Ti richiama un agente
          en: An agent calls you
        text:
          it: 'Solo se lo vuoi, con il tuo consenso: un agente abilitato per quotazione ed emissione.'
          en: 'Only if you want, with your consent: an authorised agent for quotes and issuing.'
        badge: 📞
    - type: cards
      id: coperture
      title:
        it: Le coperture che spieghiamo
        en: Coverages we explain
      items:
      - title:
          it: Incendio
          en: Fire
        text:
          it: Danni a struttura e contenuto.
          en: Damage to structure and contents.
        badge: 🔥
      - title:
          it: Danni da acqua
          en: Water damage
        text:
          it: Rotture di tubi e spargimenti.
          en: Burst pipes and leaks.
        badge: 💧
      - title:
          it: Furto
          en: Theft
        text:
          it: Effrazione e oggetti di valore.
          en: Break-ins and valuables.
        badge: 🔒
      - title:
          it: Responsabilità civile
          en: Third-party liability
        text:
          it: Danni causati a terzi, anche da animali e bambini.
          en: Damage caused to others, including by pets and children.
        badge: ⚖️
      - title:
          it: Eventi catastrofali
          en: Catastrophic events
        text:
          it: Alluvione, terremoto e fenomeni naturali.
          en: Flood, earthquake and natural events.
        badge: 🌪️
    - type: note
      content:
        it: Casa Protetta è un sito informativo. Quotazione, emissione delle polizze e gestione dei sinistri sono svolte dall'agenzia
          e da agenti abilitati. I tuoi dati di contatto sono trattati solo con il tuo consenso. L'area clienti (polizza e
          sinistri con foto) è in arrivo.
        en: Casa Protetta is an information site. Quotes, policy issuing and claims are handled by the agency and authorised
          agents. Your contact details are used only with your consent. The customer area (policy and claims with photos)
          is coming soon.
  - key: new
    type: new_run
    title:
      it: Questionario
      en: Questionnaire
  - key: report
    type: report
    title:
      it: Il tuo riepilogo
      en: Your summary
    source: run
    printable: true
    nav: false
  - key: chat
    type: chat
    title:
      it: Chiedi all'assistente
      en: Ask the assistant
    source: agent:assistant
    placeholder:
      it: Es. Cosa copre la responsabilità civile se il mio cane morde qualcuno?
      en: E.g. What does liability cover if my dog bites someone?
    examples:
    - it: Che differenza c'è tra incendio e danni da acqua?
      en: What is the difference between fire and water damage?
    - it: 'Sono in affitto: cosa mi serve?'
      en: 'I rent: what do I need?'
    - it: Cosa sono gli eventi catastrofali?
      en: What are catastrophic events?
  - key: history
    type: history
    title:
      it: I miei riepiloghi
      en: My summaries
    source: run
    roles:
    - user
  - key: callbacks
    type: approvals
    title:
      it: Contatti ricevuti
      en: Received contacts
    approvals:
    - callback
    roles:
    - agent
    - admin
  - key: docs
    type: table
    title:
      it: Documenti informativi
      en: Information documents
    source: collection:documents
    data:
      display: table
      fields:
      - key: title
        label: Titolo
      - key: coverage
        label: Copertura
        format: badge
      - key: url
        label: Link
        format: link
      limit: 100
    roles:
    - admin
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: agency
      price: 149
      interval: month
      label:
        it: Agenzia
        en: Agency
      includes:
      - Contatti ricevuti
      - Gestione documenti informativi
      - Questionario e assistente per i visitatori
      roles:
      - admin
  extensions:
  - key: anonymous_contact
    description: 'Un visitatore anonimo non può inoltrare un contatto: la richiesta di richiamo richiede l''accesso con email
      (link magico), che serve anche come verifica del consenso.'
  - key: customer_area
    description: 'Fase 2, non disponibile: area clienti con la polizza e apertura sinistro con foto (il caricamento file non
      è ancora disponibile; servono anche i dati polizza dal sistema dell''agenzia).'
  - key: regulated_activities
    description: Quotazione, emissione e gestione sinistri restano fuori dall'app, svolte dall'agenzia.
  - key: documents_upload
    description: I documenti precontrattuali si inseriscono come testo o link nella collezione documents; il caricamento di
      file PDF non è ancora disponibile.
  - key: email_notification
    description: 'Nessuna email all''agenzia quando arriva un contatto: l''agente la vede nella vista Contatti ricevuti.'
