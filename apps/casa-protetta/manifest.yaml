apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: casa-protetta
  displayName: Casa Protetta
  tagline: Scopri quali coperture servono davvero alla tua casa, in parole semplici.
  description: 'Sito informativo per polizze casa e responsabilità civile: un questionario, un agente che spiega le coperture
    utili usando i documenti informativi della compagnia, una chat per le domande e il contatto con un agente abilitato. Nessuna
    quotazione, emissione o gestione sinistri.'
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f4e5f'
      accent: '#e07a2f'
      background: '#f8f6f1'
      foreground: '#1d2a30'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Casa
      color: primary
    - text: Protetta
      color: accent
    buttonShape: rounded
  header:
    links:
    - label: Come funziona
      href: '#come-funziona'
    - label: Coperture
      href: '#coperture'
    cta:
      label: Inizia il questionario
      href: /v/questionario
  auth:
    method: magic_link
    anonymous:
      agents:
      - advisor
      - assistant
      views:
      - home
      - questionario
      - riepilogo
      - assistente
      - richiamo
    roles:
    - key: admin
      label: Agenzia (amministratore)
      assignedBy: admin_emails
    - key: broker
      label: Agente assicurativo
      assignedBy: invite
    - key: user
      label: Cliente
      assignedBy: signup
  limits:
  - action: agent:advisor
    per: ip
    max: 5
    window: day
    roles:
    - anonymous
  - action: chat
    per: ip
    max: 40
    window: hour
    roles:
    - anonymous
  agents:
  - key: advisor
    role: main
    description: Spiega quali coperture casa e RC possono essere utili in base al questionario, citando i documenti informativi.
    profile:
      inline:
        display_name: Consulente informativo Casa Protetta
        crews:
        - id: advisor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un consulente informativo di una compagnia che vende polizze casa e responsabilità civile. Spieghi
            in italiano semplice, senza gergo, quali coperture potrebbero essere utili a chi compila il questionario e perché.
            NON fai preventivi, NON indichi premi, massimali o franchigie se non sono scritti nei documenti, NON emetti polizze,
            NON gestisci sinistri e NON dai consulenza personalizzata vincolante: l''offerta e il contratto spettano a un
            agente abilitato. Prima di scrivere usa lo strumento search_documents per cercare nei documenti informativi precontrattuali
            (DIP) della compagnia le coperture rilevanti (incendio, danni da acqua, furto, responsabilità civile verso terzi,
            eventi catastrofali) e cita il titolo del documento quando ti basi su di esso. Se un''informazione non è nei documenti,
            dillo e non inventarla. Considera: tipo di abitazione, proprietà o affitto (un inquilino assicura soprattutto
            rischio locativo, contenuto e RC; il proprietario anche il fabbricato), metri quadri, anno di costruzione (impianti
            datati = più rischio incendio/acqua), zona (rischio alluvione o sismico, da indicare come ipotesi da verificare),
            animali e bambini (RC), cosa vuole proteggere. Struttura del report: un titolo di livello 1 "# Le coperture utili
            per la tua casa"; poi ## In breve (3 righe); ## Coperture consigliate (una tabella: copertura, utilità per te
            - alta/media/bassa, perché); ## Spiegazione copertura per copertura (incendio, danni da acqua, furto, RC verso
            terzi, eventi catastrofali, includendo solo ciò che ha senso e motivando l''esclusione delle altre); ## Cosa chiedere
            all''agente (domande da fare); ## Note (promemoria che il documento è informativo, non è un preventivo né una
            proposta contrattuale, e che per leggere le condizioni complete va letto il set informativo). Sotto 500 parole.'
    goalTemplate: 'Questionario del visitatore:

      Abitazione: {housing_type_label}

      Situazione: {tenure_label}

      Superficie: {sqm} m²

      {?year_built}Anno di costruzione: {year_built}{/year_built}

      Zona: {zone}

      {?pets}Ci sono animali domestici in casa.{/pets}

      {?children}Ci sono bambini in casa.{/children}

      Vuole proteggere: {protect}

      {?notes}Note: {notes}{/notes}

      Scrivi il riepilogo nella lingua con codice ISO {lang}. Data: {date}.'
    appTools:
    - name: search_documents
      description: Cerca nei documenti informativi precontrattuali pubblicati dalla compagnia
      action: search
      collection: documents
      scope: all
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.4
  - key: assistant
    role: helper
    description: Risponde in chat alle domande sulle coperture usando i documenti informativi.
    profile:
      inline:
        display_name: Assistente Casa Protetta
        chat_mode: true
        crews:
        - id: assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''assistente informativo di Casa Protetta, compagnia di polizze casa e responsabilità civile.
            Rispondi in italiano semplice e breve alle domande sulle coperture (incendio, danni da acqua, furto, RC verso
            terzi, eventi catastrofali). Usa sempre search_documents per basarti sui documenti informativi precontrattuali
            e cita il documento. Se la risposta non è nei documenti, dillo. Non fai preventivi, non dai prezzi, non emetti
            polizze, non gestisci sinistri e non fornisci consulenza vincolante: per questo invita a lasciare i propri dati
            nella pagina di richiamo, così un agente abilitato li ricontatta. Non chiedere dati personali in chat.'
    goalTemplate: 'Conversazione finora:

      {history}


      Nuovo messaggio del visitatore: {message}

      Rispondi nella lingua con codice ISO {lang}.'
    appTools:
    - name: search_documents
      description: Cerca nei documenti informativi precontrattuali pubblicati dalla compagnia
      action: search
      collection: documents
      scope: all
    output: markdown
  inputForm:
    title: Raccontaci della tua casa
    fields:
    - name: housing_type
      type: select
      required: true
      label: Tipo di abitazione
      options:
      - value: appartamento
        label: Appartamento
      - value: villa
        label: Villa / casa indipendente
      - value: bifamiliare
        label: Villetta a schiera / bifamiliare
      - value: seconda_casa
        label: Seconda casa / casa vacanza
    - name: tenure
      type: select
      required: true
      label: Sei proprietario o in affitto?
      options:
      - value: proprieta
        label: Proprietario
      - value: affitto
        label: Inquilino
    - name: sqm
      type: number
      required: true
      label: Metri quadri
    - name: year_built
      type: number
      label: Anno di costruzione
      help: Anche approssimativo
    - name: zone
      type: text
      required: true
      maxLength: 120
      label: Zona (comune o CAP)
    - name: pets
      type: boolean
      label: Ci sono animali domestici
    - name: children
      type: boolean
      label: Ci sono bambini
    - name: protect
      type: multiselect
      required: true
      label: Cosa vuoi proteggere
      options:
      - value: fabbricato
        label: L'edificio / l'immobile
      - value: contenuto
        label: Mobili e beni contenuti
      - value: valori
        label: Gioielli e oggetti di valore
      - value: rc
        label: Danni causati ad altri (responsabilità civile)
      - value: eventi
        label: Eventi naturali (alluvione, terremoto, grandine)
    - name: notes
      type: textarea
      maxLength: 400
      label: Altro da sapere (facoltativo)
  data:
    collections:
    - name: documents
      description: Documenti informativi precontrattuali (DIP, DIP aggiuntivo, condizioni) pubblicati dalla compagnia
      ownedBy: shared
      searchable: true
      fields:
      - name: title
        type: text
        required: true
        label: Titolo
      - name: product
        type: select
        label: Prodotto
        options:
        - casa
        - responsabilita_civile
        - catastrofali
      - name: content
        type: textarea
        label: Testo
      - name: url
        type: url
        label: Link al documento
    - name: leads
      description: Richieste di richiamo ricevute dai visitatori (con consenso)
      ownedBy: org
      retentionDays: 730
      fields:
      - name: name
        type: text
        required: true
        label: Nome e cognome
      - name: email
        type: email
        required: true
        label: Email
      - name: phone
        type: text
        required: true
        label: Telefono
      - name: consent
        type: boolean
        required: true
        label: Acconsento al trattamento dei miei dati per essere ricontattato da un agente assicurativo
        help: Informativa privacy dell'agenzia
      - name: note
        type: textarea
        maxLength: 500
        label: Cosa vuoi chiedere all'agente (facoltativo)
      - name: status
        type: select
        label: Stato
        default: nuovo
        options:
        - nuovo
        - richiamato
        - chiuso
      access:
      - role: broker
        can:
        - read
        - write
  views:
  - key: home
    type: page
    title: Casa Protetta
    nav: false
    sections:
    - type: hero
      eyebrow: Gratis, senza registrazione
      title: Scopri quali coperture servono **davvero** alla tua casa.
      text: 'Rispondi a poche domande: un assistente AI ti spiega in parole semplici quali coperture casa e responsabilità
        civile potrebbero esserti utili e perché, basandosi sui documenti informativi della compagnia.'
      actions:
      - label: Inizia il questionario
        href: /v/questionario
        style: primary
      - label: Fai una domanda in chat
        href: /v/assistente
        style: ghost
      note: 'Servizio informativo: nessun preventivo e nessuna emissione di polizza.'
    - type: steps
      id: come-funziona
      title: Come funziona
      items:
      - title: Racconti la tua casa
        text: Tipo di abitazione, metri quadri, zona, chi ci vive e cosa vuoi proteggere.
        badge: 📝
      - title: Ricevi un riepilogo chiaro
        text: Le coperture consigliate, con il perché, e le domande da fare all'agente.
        badge: 📋
      - title: Parli con un agente abilitato
        text: Se vuoi, lasci nome, email e telefono (con il tuo consenso) e ti richiama.
        badge: 📞
    - type: cards
      id: coperture
      title: Le coperture di cui parliamo
      items:
      - title: Incendio
        text: Danni a casa e beni causati da fuoco, fulmine, esplosione.
        badge: 🔥
      - title: Danni da acqua
        text: Rotture di tubi, perdite, spese per ricerca del guasto.
        badge: 💧
      - title: Furto
        text: Beni sottratti e danni causati dai ladri.
        badge: 🔒
      - title: Responsabilità civile
        text: Danni causati involontariamente a terzi da te, dai tuoi familiari o animali.
        badge: 🛡️
      - title: Eventi catastrofali
        text: Alluvione, terremoto e altri eventi naturali.
        badge: 🌪️
    - type: note
      content: Casa Protetta è un servizio informativo. Il riepilogo non è un preventivo, né una proposta o un contratto di
        assicurazione. Quotazione, emissione delle polizze e gestione dei sinistri sono svolte solo da agenti abilitati. Leggi
        sempre il set informativo prima della sottoscrizione.
  - key: questionario
    type: new_run
    title: Questionario
    nav: true
  - key: riepilogo
    type: report
    title: Il tuo riepilogo
    source: run
    printable: true
    nav: false
  - key: assistente
    type: chat
    title: Chiedi all'assistente
    source: agent:assistant
    examples:
    - Cosa copre la responsabilità civile?
    - Cosa succede se si rompe un tubo e allaga il vicino?
    - Un inquilino ha bisogno di una polizza casa?
    - Il terremoto è incluso di solito?
    placeholder: Scrivi la tua domanda sulle coperture…
  - key: richiamo
    type: form
    title: Parla con un agente
    collection: leads
    fields:
    - name
    - email
    - phone
    - consent
    - note
    submit:
      label: Richiedimi un richiamo
      message: Grazie! Un agente assicurativo abilitato ti richiamerà al più presto.
      redirect: home
    edit: false
  - key: leads
    type: table
    title: Contatti ricevuti
    source: collection:leads
    columns:
    - name
    - phone
    - email
    - note
    - status
    roles:
    - admin
    - broker
    export: true
  - key: account
    type: account
    title: Abbonamento agenzia
    roles:
    - admin
  triggers:
  - key: lead_agent_notify
    description: Avvisa agenzia e agenti di un nuovo contatto
    'on':
      collection: leads
      op: insert
    notify:
      to:
      - admins
      - role:broker
      subject: 'Nuovo contatto da richiamare: {record.name}'
      body: 'Un visitatore ha chiesto di essere richiamato.

        Nome: {record.name}

        Telefono: {record.phone}

        Email: {record.email}

        Note: {record.note}'
      link: leads
  - key: lead_ack
    description: Conferma al visitatore
    'on':
      collection: leads
      op: insert
    notify:
      to: record.email
      subject: Abbiamo ricevuto la tua richiesta
      body: Ciao {record.name}, abbiamo ricevuto la tua richiesta. Un agente assicurativo abilitato ti richiamerà al numero
        indicato. Questo messaggio non costituisce un preventivo né una proposta contrattuale.
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: agenzia
      price: 149
      interval: month
      label: Piano Agenzia
      includes:
      - Questionario e assistente AI sul sito
      - Contatti ricevuti e notifiche agli agenti
      - Documenti informativi caricati
      roles:
      - admin
  extensions:
  - key: documenti_dip
    description: 'Caricamento dei documenti informativi precontrattuali (DIP) nella collezione documents da parte dell''agenzia:
      oggi va fatto dal back office dello studio; un form di caricamento per l''agenzia non è ancora disponibile.'
  - key: area_clienti
    description: 'Fase 2, non ancora inclusa: area clienti con visualizzazione della polizza e apertura sinistro con foto.
      Richiede l''integrazione con il gestionale dell''agenzia (non disponibile) e un''accesso cliente con ruolo dedicato.'
  - key: attivita_regolamentate
    description: 'Quotazione, emissione polizze e gestione sinistri restano fuori dall''app, come richiesto: sono attività
      regolamentate dell''agenzia.'
