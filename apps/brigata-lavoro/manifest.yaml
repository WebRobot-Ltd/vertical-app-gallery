apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: brigatalavoro
  displayName: BrigataLavoro
  tagline:
    it: Il marketplace del lavoro per ristorazione e hotellerie.
    en: The job marketplace for restaurants and hospitality.
  description:
    it: 'Ristoratori e lavoratori si incontrano: un agente AI abbina offerte e profili e spiega ogni match. Gratis per i lavoratori.'
    en: 'Restaurateurs and workers meet: an AI agent matches offers and profiles and explains every match. Free for workers.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: pipeline
  branding:
    theme: light
    palette:
      primary: '#7a1f2b'
      accent: '#d98a1f'
      background: '#fbf7f2'
      foreground: '#22201e'
    fonts:
      body: Inter
      display: Playfair Display
    wordmark:
    - text: Brigata
      color: primary
    - text: Lavoro
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Prezzi
        en: Pricing
      href: '#prezzi'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      label:
        it: Ristoratore o lavoratore
        en: Employer or worker
      assignedBy: signup
  limits:
  - action: agent:matcher
    per: user
    max: 10
    window: day
    roles:
    - user
  agents:
  - key: matcher
    role: main
    description: Matches a new job offer or a new worker profile against the other side and explains each match.
    profile:
      inline:
        display_name: BrigataLavoro matcher
        crews:
        - id: matcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the matching agent of BrigataLavoro, a job marketplace for restaurants and hotels. You receive
            an event: a new job offer or a new worker profile. Use the tools to read job_offers, worker_profiles and past
            feedback. RULES: only consider worker profiles where visible_to_employers is true or that have an application
            to that offer; never reveal contact data of workers who have not applied or consented; never show a worker any
            data of other workers. Score on role, city/zone, availability vs schedule, contract type, salary expectation vs
            offer, requirements vs skills and experience; use past feedback to adjust weights. Never invent facts about people.
            For a new offer: write up to 5 candidates for the employer. For a new profile: write up to 5 offers for the worker.
            Save each match with the tool write_match (fields: offer_id, worker_id, audience, score 0-100, explanation, status
            ''proposed''). Final answer: a report starting with a level-1 title ''# Match — <role> <city>'', then a table
            (candidate/offer, score, why) and a short ''Next steps'' list (contact in platform, propose a trial). Write in
            the language of the event. Do not give legal or contract advice as fact.'
          mcp_servers: []
    appTools:
    - name: read_offers
      description: Read job offers
      action: read
      collection: job_offers
      scope: all
    - name: read_profiles
      description: Read worker profiles (only consenting or applicants)
      action: read
      collection: worker_profiles
      scope: all
    - name: read_feedback
      description: Read hiring feedback
      action: read
      collection: feedback
      scope: all
    - name: write_match
      description: Save a proposed match
      action: write
      collection: matches
      scope: all
    goalTemplate: Match the new job offer or worker profile described in the task you were given. Today is {date}. Write in
      the language with ISO code {lang}.
    output: markdown
    writesTo:
      collection: matches
      parse: whole
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.6
      timeoutSeconds: 300
  triggers:
  - key: on_new_offer
    description: Match when a restaurateur publishes an offer
    'on':
      collection: job_offers
      op: insert
    start:
      agent: matcher
    goal: 'New job offer: {record.role} in {record.city}, contract {record.contract}, schedule {record.schedule}, salary {record.salary},
      requirements {record.requirements}. Offer id {record.id}.'
    asUser: false
  - key: on_new_profile
    description: Match when a worker creates a profile
    'on':
      collection: worker_profiles
      op: insert
    start:
      agent: matcher
    goal: 'New worker profile {record.id}: role {record.role}, zone {record.zone}, availability {record.availability}, expectations
      {record.salary_expectation}, skills {record.skills}.'
    asUser: false
  data:
    collections:
    - name: employer_profiles
      ownedBy: user
      description: The restaurateur's business profile
      fields:
      - name: business_name
        type: text
        required: true
      - name: city
        type: city
      - name: description
        type: textarea
    - name: job_offers
      ownedBy: user
      description: Offers published by restaurateurs
      fields:
      - name: role
        type: select
        required: true
        options:
        - value: cook
          label:
            it: Cuoco
            en: Cook
        - value: waiter
          label:
            it: Cameriere
            en: Waiter
        - value: dishwasher
          label:
            it: Lavapiatti
            en: Dishwasher
        - value: bartender
          label:
            it: Barman
            en: Bartender
      - name: city
        type: city
        required: true
      - name: contract
        type: text
      - name: schedule
        type: text
      - name: salary
        type: number
      - name: requirements
        type: textarea
    - name: worker_profiles
      ownedBy: user
      description: Worker profiles; visible to employers only with consent or application
      fields:
      - name: role
        type: select
        required: true
        options:
        - value: cook
          label:
            it: Cuoco
            en: Cook
        - value: waiter
          label:
            it: Cameriere
            en: Waiter
        - value: dishwasher
          label:
            it: Lavapiatti
            en: Dishwasher
        - value: bartender
          label:
            it: Barman
            en: Bartender
      - name: experience
        type: textarea
      - name: skills
        type: textarea
      - name: availability
        type: text
      - name: zone
        type: city
      - name: salary_expectation
        type: number
      - name: visible_to_employers
        type: boolean
        default: false
    - name: applications
      ownedBy: user
      description: A worker's application to an offer
      fields:
      - name: offer_id
        type: text
        required: true
      - name: note
        type: textarea
    - name: matches
      ownedBy: user
      description: Matches proposed by the agent, with explanation
      fields:
      - name: offer_id
        type: text
      - name: worker_id
        type: text
      - name: audience
        type: text
      - name: score
        type: number
      - name: explanation
        type: textarea
      - name: status
        type: text
    - name: messages
      ownedBy: user
      description: In-platform messages from employer to candidate
      fields:
      - name: to_worker_id
        type: text
      - name: offer_id
        type: text
      - name: body
        type: textarea
    - name: trials
      ownedBy: user
      description: Trial shifts proposed by employers
      fields:
      - name: worker_id
        type: text
      - name: offer_id
        type: text
      - name: date
        type: date
      - name: notes
        type: textarea
    - name: feedback
      ownedBy: user
      description: Feedback after hiring, from both sides, used for future matches
      fields:
      - name: offer_id
        type: text
      - name: from_side
        type: select
        options:
        - employer
        - worker
      - name: rating
        type: number
      - name: comment
        type: textarea
  views:
  - key: home
    type: page
    nav: false
    sections:
    - type: hero
      title:
        it: Trova la **brigata** giusta, o il posto giusto.
        en: Find the right **crew**, or the right job.
      text:
        it: 'Ristoratori e lavoratori della ristorazione e dell''hotellerie: un agente AI abbina offerte e profili e spiega
          perché. Gratis per i lavoratori.'
        en: 'For restaurateurs and hospitality workers: an AI agent matches offers and profiles and explains why. Free for
          workers.'
      actions:
      - label:
          it: Inizia
          en: Get started
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Pubblica o crea il profilo
          en: Post or build a profile
        text:
          it: Ruolo, città, orari, stipendio e requisiti; oppure esperienze, competenze e disponibilità.
          en: Role, city, schedule, pay and requirements; or experience, skills and availability.
      - title:
          it: L'agente fa il match
          en: The agent matches
        text:
          it: A ogni nuova offerta o profilo, con una spiegazione per ogni proposta.
          en: On every new offer or profile, with an explanation for each proposal.
      - title:
          it: Contatta e prova
          en: Contact and trial
        text:
          it: Messaggio in piattaforma e prova fissata; dopo l'assunzione, feedback reciproco.
          en: In-platform message and a trial shift; after hiring, mutual feedback.
    - type: cards
      id: prezzi
      title:
        it: Prezzi
        en: Pricing
      items:
      - title:
          it: Lavoratori
          en: Workers
        text:
          it: Sempre gratis.
          en: Always free.
        badge: 🧑‍🍳
      - title:
          it: Ristoratori
          en: Restaurateurs
        text:
          it: Abbonamento mensile oppure fee per assunzione.
          en: Monthly subscription or fee per hire.
        badge: 🍽️
    - type: note
      content:
        it: I ristoratori vedono solo i profili di chi si candida o ha acconsentito. I lavoratori non vedono i dati di altri
          lavoratori.
        en: Employers only see profiles of people who applied or consented. Workers never see other workers' data.
  - key: offers
    type: list
    title:
      it: Le mie offerte
      en: My job offers
    source: collection:job_offers
    roles:
    - user
    - admin
  - key: profile
    type: list
    title:
      it: Il mio profilo lavoratore
      en: My worker profile
    source: collection:worker_profiles
    roles:
    - user
    - admin
  - key: business
    type: list
    title:
      it: Il mio locale
      en: My business
    source: collection:employer_profiles
    roles:
    - user
    - admin
  - key: my_matches
    type: table
    title:
      it: Match proposti
      en: Proposed matches
    source: collection:matches
    data:
      display: table
      fields:
      - key: score
        label:
          it: Punteggio
          en: Score
        format: number
      - key: explanation
        label:
          it: Perché
          en: Why
      - key: status
        label:
          it: Stato
          en: Status
        format: badge
      sort:
        field: score
        dir: desc
      limit: 50
    roles:
    - user
    - admin
  - key: inbox
    type: list
    title:
      it: Messaggi
      en: Messages
    source: collection:messages
    roles:
    - user
    - admin
  - key: trial_list
    type: list
    title:
      it: Prove
      en: Trials
    source: collection:trials
    roles:
    - user
    - admin
  - key: feedback_list
    type: list
    title:
      it: Feedback
      en: Feedback
    source: collection:feedback
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Plan
    roles:
    - user
  billing:
    modes:
    - credits
    - subscription
    - per_transaction
    currency: eur
    signupCredits: 0
    transactionFeePct: 0
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:matcher:
        estimate: 10
        metered: true
    packs:
    - key: hire_fee
      price: 99
      credits: 9900
      label:
        it: Fee per assunzione
        en: Fee per hire
    plans:
    - key: employer_monthly
      price: 59
      interval: month
      label:
        it: Ristoratore — mensile
        en: Employer — monthly
      includes:
      - unlimited offers
      - candidate matching
      - in-platform messages
      credits: 0
  extensions:
  - key: email_notifications
    description: 'Emailing proposed candidates to employers and offers to workers is not available yet: matches appear in
      the ''Proposed matches'' view instead.'
  - key: cross_user_visibility
    description: Employers seeing only applicants or consenting workers (and workers never seeing others) needs per-record
      cross-user access; the matcher runs as the app with explicit rules in its prompt, and the match records are written
      to the owners. Needs runtime review.
  - key: account_types
    description: 'Employer vs worker are not separate signup roles: a user fills the business profile or the worker profile.
      Separate roles by account type are a later step.'
  - key: hire_fee_charging
    description: Fee per hire is a pack the employer buys when marking a hire; automatic charging on hire confirmation is
      not expressible yet.
