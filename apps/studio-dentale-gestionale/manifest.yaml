apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: studio-dentistico
  displayName: Studio Dentistico
  tagline:
    it: Agenda, pazienti e comunicazioni per il tuo studio dentistico.
  description:
    it: 'Gestionale per studi dentistici: agenda con medici e poltrone, anagrafiche, piani di cura e storico visite, promemoria
      e richiami automatici. I dati sanitari sono visibili solo al personale autorizzato.'
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#0f4c5c'
      accent: '#2a9d8f'
      background: '#f6fafa'
      foreground: '#14262b'
    fonts:
      body: Inter
      display: Inter
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Titolare
      assignedBy: admin_emails
    - key: secretary
      label: Segreteria
      assignedBy: invite
    - key: dentist
      label: Dentista
      assignedBy: derived
      from: collection:resources.email
    - key: patient
      label: Paziente
      assignedBy: derived
      from: collection:patients.email
    - key: user
      assignedBy: signup
  limits:
  - action: chat
    per: user
    max: 60
    window: day
  agents:
  - key: slot_assistant
    role: main
    description: Propone gli slot migliori per un appuntamento ottimizzando l'agenda di medici e poltrone.
    appTools:
    - name: appts_read
      description: Legge gli appuntamenti esistenti
      action: read
      collection: appointments
      scope: all
    - name: resources_read
      description: Legge medici e poltrone con i loro orari
      action: read
      collection: resources
      scope: all
    profile:
      inline:
        display_name: Assistente agenda
        crews:
        - id: slot_assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''assistente d''agenda di uno studio dentistico. Aiuti la segreteria a trovare gli slot migliori
            per una visita. Leggi con appts_read gli appuntamenti e con resources_read medici e poltrone. Proponi al massimo
            3 slot, indicando data, ora, medico e poltrona, e spiega in una riga perché (meno buchi in agenda, durata della
            prestazione, urgenza, stesso medico del paziente). Non inventare disponibilità: usa solo i dati letti. Non richiedere
            né riportare dati clinici: servono solo tipo di prestazione e durata. Rispondi in italiano, in modo breve.'
    goalTemplate: 'Conversazione finora:

      {history}

      Nuovo messaggio: {message}

      Oggi è {date}.'
    output: markdown
  - key: recall_agent
    role: scheduled
    description: Ogni settimana elenca i pazienti in ritardo con il controllo di richiamo.
    appTools:
    - name: patients_recall
      description: Legge nome, email, ultima visita e data di richiamo dei pazienti
      action: read
      collection: patients
      scope: all
    writesTo:
      collection: recall_reports
      parse: whole
    profile:
      inline:
        display_name: Richiami pazienti
        crews:
        - id: recall_agent
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''addetto ai richiami di uno studio dentistico. Con patients_recall leggi i pazienti e individua
            chi ha la data di richiamo (next_recall) già passata o entro 30 giorni. Usa solo nome, contatti, ultima visita
            e data di richiamo: non trattare mai dati clinici. Scrivi un report che inizia con "# Richiami da fare — <data>",
            poi una tabella (paziente, ultima visita, richiamo previsto, giorni di ritardo) ordinata per ritardo, poi una
            sezione ## Priorità con 3 righe. Non inventare date.'
    goalTemplate: Oggi è {date}. Prepara il report dei richiami in ritardo.
    output: markdown
  data:
    collections:
    - name: resources
      description: Medici e poltrone prenotabili
      ownedBy: shared
      fields:
      - name: name
        type: text
        required: true
        label: Nome
      - name: kind
        type: select
        label: Tipo
        options:
        - value: medico
          label: Medico
        - value: poltrona
          label: Poltrona
      - name: email
        type: email
        label: Email (solo medici)
    - name: patients
      description: Anagrafiche pazienti (dati personali, accesso limitato)
      ownedBy: org
      fields:
      - name: full_name
        type: text
        required: true
        label: Nome e cognome
      - name: email
        type: email
        required: true
        label: Email
      - name: phone
        type: text
        label: Telefono
      - name: birth_date
        type: date
        label: Data di nascita
      - name: tax_code
        type: text
        label: Codice fiscale
      - name: dentist_email
        type: email
        label: Dentista di riferimento
      - name: last_visit
        type: date
        label: Ultima visita
      - name: next_recall
        type: date
        label: Prossimo richiamo
      - name: contact_consent
        type: boolean
        label: Consenso a comunicazioni
      access:
      - role: secretary
        can:
        - read
        - write
      - role: dentist
        where:
          dentist_email: '{user.email}'
        can:
        - read
        - write
      - role: patient
        where:
          email: '{user.email}'
        can:
        - read
    - name: care_plans
      description: Piani di cura (dati sanitari art. 9 GDPR)
      ownedBy: org
      retentionDays: 3650
      fields:
      - name: patient_email
        type: email
        required: true
        label: Email paziente
      - name: patient_name
        type: text
        label: Paziente
      - name: dentist_email
        type: email
        required: true
        label: Dentista
      - name: title
        type: text
        required: true
        label: Piano
      - name: procedures
        type: textarea
        label: Prestazioni previste
      - name: status
        type: select
        label: Stato
        options:
        - value: proposto
          label: Proposto
        - value: in_corso
          label: In corso
        - value: concluso
          label: Concluso
      - name: estimate
        type: number
        label: Preventivo (€)
      access:
      - role: dentist
        where:
          dentist_email: '{user.email}'
        can:
        - read
        - write
      - role: secretary
    - name: visits
      description: Storico visite (dati sanitari art. 9 GDPR)
      ownedBy: org
      retentionDays: 3650
      fields:
      - name: patient_email
        type: email
        required: true
        label: Email paziente
      - name: patient_name
        type: text
        label: Paziente
      - name: dentist_email
        type: email
        required: true
        label: Dentista
      - name: visit_date
        type: date
        required: true
        label: Data
      - name: treatment
        type: text
        label: Trattamento
      - name: notes
        type: textarea
        label: Note cliniche
      access:
      - role: dentist
        where:
          dentist_email: '{user.email}'
        can:
        - read
        - write
      - role: secretary
    - name: documents
      description: Documenti condivisi con il paziente
      ownedBy: org
      fields:
      - name: patient_email
        type: email
        required: true
        label: Email paziente
      - name: title
        type: text
        required: true
        label: Titolo
      - name: file
        type: file
        label: File
      access:
      - role: secretary
        can:
        - read
        - write
      - role: dentist
        can:
        - read
        - write
      - role: patient
        where:
          patient_email: '{user.email}'
        can:
        - read
    - name: appointments
      description: Appuntamenti
      ownedBy: user
      fields:
      - name: patient_name
        type: text
        required: true
        label: Paziente
      - name: patient_email
        type: email
        required: true
        label: Email paziente
      - name: reason
        type: text
        label: Prestazione
      - name: notes
        type: textarea
        label: Note
      access:
      - role: secretary
        can:
        - read
        - write
      - role: dentist
    - name: recall_reports
      description: Report settimanali dei richiami
      ownedBy: org
      retentionDays: 180
      access:
      - role: secretary
      - role: dentist
  views:
  - key: home
    type: page
    nav: false
    title: Studio Dentistico
    sections:
    - type: hero
      eyebrow: Gestionale per studi dentistici
      title: Agenda, pazienti e **richiami** in un unico posto
      text: Calendario con medici e poltrone, cartelle e piani di cura, promemoria automatici. I dati sanitari sono visibili
        solo al personale autorizzato.
      actions:
      - label: Accedi
        href: /login
        style: primary
    - type: cards
      id: come-funziona
      title: Come funziona
      items:
      - title: Segreteria
        text: Gestisce agenda, anagrafiche e comunicazioni; l'assistente propone gli slot migliori.
        badge: 📅
      - title: Dentista
        text: Vede la cartella e i piani di cura dei propri pazienti.
        badge: 🦷
      - title: Paziente
        text: Area personale con appuntamenti e documenti condivisi.
        badge: 👤
    - type: note
      content: 'Dati sanitari trattati ai sensi dell''art. 9 GDPR: accesso limitato per ruolo, conservazione limitata. Ogni
        studio vede solo i propri pazienti.'
  - key: assistant
    type: chat
    source: agent:slot_assistant
    title: Assistente agenda
    roles:
    - secretary
    - admin
    examples:
    - Trova il miglior slot per una devitalizzazione di 60 minuti questa settimana
    - Quali buchi ci sono domani in agenda?
    placeholder: Chiedi uno slot...
  - key: book
    type: booking
    title: Prenota appuntamento
    collection: appointments
    resources: collection:resources
    fields:
    - patient_name
    - patient_email
    - reason
    - notes
    slots:
      days:
      - 1
      - 2
      - 3
      - 4
      - 5
      from: 09:00
      to: '18:30'
      minutes: 30
      tz: Europe/Rome
      aheadDays: 30
      minNoticeHours: 4
      capacity: 1
    roles:
    - secretary
    - patient
    - admin
  - key: agenda
    type: table
    title: Agenda
    source: collection:appointments
    columns:
    - start
    - end
    - resource
    - patient_name
    - reason
    - status
    roles:
    - secretary
    - dentist
    - admin
  - key: my_appointments
    type: table
    title: I miei appuntamenti
    source: collection:appointments
    columns:
    - start
    - resource
    - reason
    - status
    roles:
    - patient
  - key: my_documents
    type: list
    title: I miei documenti
    source: collection:documents
    columns:
    - title
    - file
    roles:
    - patient
  - key: patients
    type: table
    title: Pazienti
    source: collection:patients
    columns:
    - full_name
    - email
    - phone
    - dentist_email
    - last_visit
    - next_recall
    roles:
    - secretary
    - dentist
    - admin
    export: false
  - key: patient_form
    type: form
    title: Scheda paziente
    collection: patients
    edit: true
    submit:
      label: Salva
      message: Paziente salvato
      redirect: patients
    roles:
    - secretary
    - dentist
    - admin
    nav: false
  - key: care_plans
    type: table
    title: Piani di cura
    source: collection:care_plans
    columns:
    - patient_name
    - title
    - status
    - estimate
    roles:
    - dentist
    - admin
  - key: care_plan_form
    type: form
    title: Nuovo piano di cura
    collection: care_plans
    edit: true
    submit:
      label: Salva
      redirect: care_plans
    roles:
    - dentist
    - admin
  - key: visits
    type: table
    title: Storico visite
    source: collection:visits
    columns:
    - visit_date
    - patient_name
    - treatment
    - notes
    roles:
    - dentist
    - admin
  - key: visit_form
    type: form
    title: Registra visita
    collection: visits
    edit: true
    submit:
      label: Salva
      redirect: visits
    roles:
    - dentist
    - admin
  - key: document_form
    type: form
    title: Condividi documento
    collection: documents
    submit:
      label: Condividi
      message: Documento condiviso
    roles:
    - secretary
    - dentist
    - admin
  - key: recalls
    type: list
    title: Richiami
    source: collection:recall_reports
    roles:
    - secretary
    - dentist
    - admin
  - key: account
    type: account
    title: Abbonamento
    roles:
    - admin
  schedules:
  - cron: 0 7 * * 1
    agent: recall_agent
    action: run
    owner: app
    deliver:
      to: role:secretary
      subject: Richiami da fare
      onlyIfNew: true
  triggers:
  - key: appointment_confirm
    'on':
      collection: appointments
      op: insert
    notify:
      to:
      - record.patient_email
      subject: Appuntamento confermato
      body: Gentile {record.patient_name}, il suo appuntamento presso lo studio è confermato per il {record.date}. Per modifiche
        contatti la segreteria.
      link: my_appointments
  - key: appointment_reminder
    'on':
      date:
        collection: appointments
        field: start
        offsetDays: -1
        hour: 7
      where:
        status: booked
    notify:
      to:
      - record.patient_email
      subject: Promemoria appuntamento di domani
      body: Gentile {record.patient_name}, le ricordiamo il suo appuntamento di domani presso lo studio dentistico. Se non
        può venire, ci avvisi il prima possibile.
      link: my_appointments
  - key: recall_notice
    'on':
      date:
        collection: patients
        field: next_recall
        offsetDays: 0
        hour: 8
    notify:
      to:
      - record.email
      subject: È ora del controllo periodico
      body: Gentile {record.full_name}, è il momento del suo controllo di richiamo. Contatti lo studio o prenoti dalla sua
        area personale.
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: studio_s
      price: 49
      interval: month
      label: Studio S — fino a 2 poltrone
      includes:
      - fino a 2 poltrone
      - fino a 5 utenti
      roles:
      - admin
    - key: studio_m
      price: 89
      interval: month
      label: Studio M — fino a 5 poltrone
      includes:
      - fino a 5 poltrone
      - fino a 12 utenti
      roles:
      - admin
    - key: studio_l
      price: 149
      interval: month
      label: Studio L — poltrone illimitate
      includes:
      - poltrone illimitate
      - utenti illimitati
      roles:
      - admin
  extensions:
  - key: firma_consensi
    description: 'Firma elettronica dei consensi informati nell''app: non ancora disponibile, prevista in futuro.'
  - key: sms_whatsapp
    description: 'Messaggi SMS/WhatsApp ai pazienti non disponibili: i promemoria sono inviati via email.'
  - key: multi_studio
    description: Ogni studio usa la propria istanza dell'app, così i pazienti restano separati; DPA e registro dei trattamenti
      art. 9 GDPR a cura dello studio.
