apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: studio-dentistico
  displayName: Studio Dentistico
  tagline:
    it: Agenda, pazienti e richiami del tuo studio, con un assistente AI.
    en: Agenda, patients and recalls for your dental practice, with an AI assistant.
  description:
    it: 'Gestionale per studi dentistici: agenda con medici e poltrone, anagrafiche, piani di cura e storico visite, promemoria
      e richiami. I dati sanitari restano nello studio che li ha inseriti.'
    en: 'Dental practice management: agenda with doctors and chairs, patient records, treatment plans and visit history, reminders
      and recalls.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#0f4c5c'
      accent: '#2a9d8f'
      background: '#f6fafb'
      foreground: '#14232b'
    fonts:
      body: Inter
      display: Manrope
    wordmark:
    - text: Studio
      color: primary
    - text: Dentistico
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Privacy
        en: Privacy
      href: '#privacy'
    - label:
        it: Prezzi
        en: Pricing
      href: '#prezzi'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: studio
      label:
        it: Titolare dello studio
        en: Practice owner
      assignedBy: signup
    - key: segretaria
      label:
        it: Segretaria
        en: Secretary
      assignedBy: invite
    - key: dentista
      label:
        it: Dentista
        en: Dentist
      assignedBy: invite
    - key: paziente
      label:
        it: Paziente
        en: Patient
      assignedBy: invite
  limits:
  - action: chat
    per: user
    max: 100
    window: day
  agents:
  - key: agenda
    role: main
    description: Propone gli slot migliori, prenota e prepara i promemoria come bozze.
    profile:
      inline:
        display_name: Assistente agenda dello studio
        crews:
        - id: agenda
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''assistente di agenda di uno studio dentistico. Aiuti la segretaria a prenotare. Quando ti
            chiedono un appuntamento: leggi appuntamenti, medici e poltrone con gli strumenti, proponi 3 slot ordinati per
            qualità (meno buchi in agenda, medico giusto per la prestazione, poltrona libera, durata adeguata) e spiega in
            una riga perché. Prenota SOLO dopo conferma esplicita, scrivendo nella collezione appuntamenti. Per i promemoria
            scrivi una bozza nella collezione comunicazioni (canale email o messaggio, stato ''bozza'', testo breve e cortese,
            con data, ora, medico) senza dati clinici nel testo: non li invii tu, li approva e invia il personale. Tratta
            i dati sanitari come categoria particolare (art. 9 GDPR): usa solo il minimo necessario, non ripeterli senza motivo.
            Non inventare disponibilità: usa solo i dati letti. Rispondi in italiano, in modo sintetico.'
    appTools:
    - name: leggi_appuntamenti
      description: Legge gli appuntamenti
      action: read
      collection: appuntamenti
      scope: user
    - name: scrivi_appuntamento
      description: Crea o modifica un appuntamento
      action: write
      collection: appuntamenti
      scope: user
    - name: leggi_pazienti
      description: Cerca pazienti
      action: search
      collection: pazienti
      scope: user
    - name: leggi_medici
      description: Legge medici
      action: read
      collection: medici
      scope: user
    - name: leggi_poltrone
      description: Legge poltrone
      action: read
      collection: poltrone
      scope: user
    - name: scrivi_comunicazione
      description: Crea una bozza di comunicazione
      action: write
      collection: comunicazioni
      scope: user
    goalTemplate: 'Data di oggi: {date}.

      Conversazione finora:

      {history}

      Nuovo messaggio: {message}

      Rispondi in italiano.'
    output: markdown
    limits:
      maxTurns: 10
      maxBudgetUsd: 0.3
  - key: richiami
    role: helper
    description: Ogni settimana individua i pazienti in ritardo con i controlli di richiamo.
    writesTo:
      collection: richiami_settimana
      parse: whole
    profile:
      inline:
        display_name: Richiami pazienti
        crews:
        - id: richiami
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''assistente richiami di uno studio dentistico. Leggi pazienti e visite con gli strumenti e
            individua chi ha il controllo periodico scaduto o in scadenza nelle prossime 4 settimane, in base alla data dell''ultima
            visita e all''intervallo di richiamo del paziente. Scrivi un report che inizia con "# Richiami — settimana del
            <data>", poi una tabella (paziente, ultima visita, scadenza richiamo, giorni di ritardo, canale preferito) e infine
            ## Bozze di messaggio con un testo cortese per ciascuno, senza dati clinici. Non inventare date: se mancano, segnala
            il dato mancante. Dati sanitari: categoria particolare art. 9 GDPR, usa il minimo necessario.'
    appTools:
    - name: elenca_pazienti_richiamo
      description: Legge pazienti
      action: read
      collection: pazienti
      scope: user
    - name: leggi_visite
      description: Legge lo storico visite
      action: read
      collection: visite
      scope: user
    memory: instance
    output: markdown
  templates:
  - key: richiamo_settimanale
    title:
      it: Richiami settimanali
      en: Weekly recalls
    description:
      it: Ogni lunedì l'elenco dei pazienti in ritardo con i controlli, con bozze di messaggio.
      en: Every Monday the list of patients overdue for check-ups, with message drafts.
    agent: richiami
    params:
    - name: sede
      type: text
      label:
        it: Sede / nome studio
        en: Practice name
      required: true
    - name: anticipo_giorni
      type: number
      label:
        it: Giorni di anticipo
        en: Days ahead
      default: 28
    goal: Richiami per "{instance}" ({sede}), guarda {anticipo_giorni} giorni avanti. Oggi è {date}. Scrivi in italiano.
    schedule:
      cron: 0 6 * * 1
      userCanChange: true
    maxPerUser: 2
    roles:
    - studio
    - admin
    cost:
      perRun: 10
  data:
    collections:
    - name: pazienti
      ownedBy: user
      description: Anagrafica pazienti (dati personali, art. 9 GDPR per le note cliniche)
      sharing:
      - viewer
      - editor
      searchable: true
      fields:
      - name: cognome
        type: text
        required: true
        label: Cognome
      - name: nome
        type: text
        required: true
        label: Nome
      - name: data_nascita
        type: date
        label: Data di nascita
      - name: email
        type: email
        label: Email
      - name: telefono
        type: text
        label: Telefono
      - name: canale
        type: select
        label: Canale preferito
        options:
        - email
        - messaggio
      - name: intervallo_richiamo_mesi
        type: number
        label: Richiamo ogni (mesi)
        default: 6
      - name: consenso_privacy
        type: boolean
        label: Informativa privacy e consenso trattamento dati sanitari
      - name: note_cliniche
        type: textarea
        label: Note cliniche (solo personale autorizzato)
        roles:
        - studio
        - dentista
        - admin
    - name: piani_cura
      ownedBy: user
      description: Piani di cura
      sharing:
      - viewer
      - editor
      fields:
      - name: paziente
        type: relation
        relation: pazienti
        required: true
      - name: descrizione
        type: textarea
        label: Piano di cura
      - name: stato
        type: select
        label: Stato
        options:
        - proposto
        - accettato
        - in_corso
        - concluso
      - name: preventivo
        type: number
        label: Preventivo (EUR)
    - name: visite
      ownedBy: user
      description: Storico visite
      sharing:
      - viewer
      - editor
      fields:
      - name: paziente
        type: relation
        relation: pazienti
        required: true
      - name: data
        type: date
        required: true
      - name: medico
        type: relation
        relation: medici
      - name: prestazione
        type: text
      - name: esito
        type: textarea
        roles:
        - studio
        - dentista
        - admin
    - name: appuntamenti
      ownedBy: user
      description: Agenda
      sharing:
      - viewer
      - editor
      fields:
      - name: paziente
        type: relation
        relation: pazienti
        required: true
      - name: medico
        type: relation
        relation: medici
        required: true
      - name: poltrona
        type: relation
        relation: poltrone
      - name: inizio
        type: text
        label: Inizio (AAAA-MM-GG HH:MM)
        required: true
      - name: durata_min
        type: number
        label: Durata (minuti)
        default: 30
      - name: prestazione
        type: text
      - name: stato
        type: select
        options:
        - prenotato
        - confermato
        - completato
        - annullato
        - assente
    - name: medici
      ownedBy: user
      description: Medici dello studio
      fields:
      - name: nome
        type: text
        required: true
      - name: specialita
        type: text
      - name: giorni_orari
        type: text
        label: Giorni e orari di lavoro
    - name: poltrone
      ownedBy: user
      description: Poltrone / riuniti
      fields:
      - name: nome
        type: text
        required: true
      - name: note
        type: text
    - name: comunicazioni
      ownedBy: user
      description: Promemoria e messaggi ai pazienti (bozze da approvare e inviare)
      fields:
      - name: paziente
        type: relation
        relation: pazienti
      - name: canale
        type: select
        options:
        - email
        - messaggio
      - name: testo
        type: textarea
      - name: stato
        type: select
        options:
        - bozza
        - inviato
        - annullato
    - name: documenti_condivisi
      ownedBy: user
      description: Documenti condivisi con il paziente (link)
      sharing:
      - viewer
      fields:
      - name: paziente
        type: relation
        relation: pazienti
      - name: titolo
        type: text
        required: true
      - name: link
        type: url
    - name: richiami_settimana
      ownedBy: instance
      description: Report settimanali dei richiami
  views:
  - key: home
    type: page
    nav: false
    title: Studio Dentistico
    sections:
    - type: hero
      eyebrow: Gestionale per studi dentistici
      title: Agenda piena, **pazienti seguiti**, richiami mai dimenticati.
      text: Calendario con medici e poltrone, anagrafiche, piani di cura e storico visite. Un assistente AI propone gli slot
        migliori, prepara i promemoria e segnala i richiami in ritardo.
      actions:
      - label: Inizia
        href: /login
        style: primary
      - label: Come funziona
        href: '#come-funziona'
        style: ghost
    - type: steps
      id: come-funziona
      title: Come funziona
      items:
      - title: Prenota con l'assistente
        text: 'Chiedi uno slot: l''agente propone le 3 opzioni migliori tra medici e poltrone.'
        badge: 📅
      - title: Promemoria
        text: Le bozze di email o messaggio sono pronte da approvare e inviare.
        badge: ✉️
      - title: Richiami
        text: Ogni lunedì l'elenco di chi è in ritardo con il controllo periodico.
        badge: 🦷
    - type: cards
      id: privacy
      title: Dati sanitari protetti
      items:
      - title: Solo il tuo studio
        text: Ogni studio vede esclusivamente i propri pazienti.
      - title: Solo personale autorizzato
        text: Note cliniche ed esiti sono visibili a titolare e dentisti.
      - title: Area paziente
        text: Il paziente vede i propri appuntamenti e documenti condivisi.
    - type: cards
      id: prezzi
      title: Abbonamento mensile per studio
      items:
      - title: Studio 2 poltrone
        text: 49 € / mese
        badge: '2'
      - title: Studio 4 poltrone
        text: 89 € / mese
        badge: '4'
      - title: Studio 8 poltrone
        text: 149 € / mese
        badge: '8'
    - type: note
      content: Supporto alla gestione, non consulenza medica o legale. Il titolare resta responsabile del trattamento dei
        dati ai sensi dell'art. 9 GDPR.
  - key: assistente
    type: chat
    title: Assistente agenda
    source: agent:agenda
    placeholder: Es. Trova uno slot di 45 minuti per una pulizia della signora Rossi la prossima settimana
    examples:
    - Proponi gli slot per una igiene professionale di 30 minuti questa settimana
    - Prepara i promemoria per gli appuntamenti di domani
    - Quali poltrone sono libere giovedì pomeriggio?
    roles:
    - studio
    - segretaria
    - admin
  - key: agenda
    type: table
    title: Agenda
    source: collection:appuntamenti
    roles:
    - studio
    - segretaria
    - dentista
    - admin
    data:
      display: table
      fields:
      - key: inizio
        label: Inizio
      - key: paziente
        label: Paziente
      - key: medico
        label: Medico
      - key: poltrona
        label: Poltrona
      - key: prestazione
        label: Prestazione
      - key: stato
        label: Stato
        format: badge
      sort:
        field: inizio
        dir: asc
      limit: 200
      empty: Nessun appuntamento.
  - key: anagrafiche
    type: table
    title: Pazienti
    source: collection:pazienti
    roles:
    - studio
    - segretaria
    - dentista
    - admin
    data:
      display: table
      fields:
      - key: cognome
        label: Cognome
      - key: nome
        label: Nome
      - key: telefono
        label: Telefono
      - key: email
        label: Email
      - key: canale
        label: Canale
        format: badge
      sort:
        field: cognome
        dir: asc
      limit: 200
      empty: Nessun paziente.
  - key: cartella
    type: table
    title: Piani di cura
    source: collection:piani_cura
    roles:
    - studio
    - dentista
    - admin
    data:
      display: table
      fields:
      - key: paziente
        label: Paziente
      - key: descrizione
        label: Piano
      - key: stato
        label: Stato
        format: badge
      - key: preventivo
        label: Preventivo
        format: money
      limit: 200
  - key: storico
    type: table
    title: Storico visite
    source: collection:visite
    roles:
    - studio
    - dentista
    - admin
    data:
      display: table
      fields:
      - key: data
        label: Data
        format: date
      - key: paziente
        label: Paziente
      - key: medico
        label: Medico
      - key: prestazione
        label: Prestazione
      sort:
        field: data
        dir: desc
      limit: 200
  - key: comunicazioni_v
    type: table
    title: Comunicazioni
    source: collection:comunicazioni
    roles:
    - studio
    - segretaria
    - admin
    data:
      display: table
      fields:
      - key: paziente
        label: Paziente
      - key: canale
        label: Canale
        format: badge
      - key: testo
        label: Testo
      - key: stato
        label: Stato
        format: badge
      limit: 200
  - key: richiami_v
    type: instances
    template: richiamo_settimanale
    title: Richiami
    roles:
    - studio
    - admin
  - key: area_paziente
    type: table
    title: I miei appuntamenti
    source: collection:appuntamenti
    roles:
    - paziente
    data:
      display: list
      fields:
      - key: inizio
        label: Quando
      - key: medico
        label: Medico
      - key: prestazione
        label: Prestazione
      - key: stato
        label: Stato
        format: badge
      limit: 50
  - key: documenti_v
    type: table
    title: I miei documenti
    source: collection:documenti_condivisi
    roles:
    - paziente
    - studio
    - segretaria
    - dentista
    data:
      display: list
      fields:
      - key: titolo
        label: Documento
      - key: link
        label: Link
        format: link
      limit: 50
  - key: account
    type: account
    title: Abbonamento
    roles:
    - studio
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 50
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:agenda:
        estimate: 10
        metered: true
      agent:richiami:
        estimate: 10
        metered: true
    packs:
    - key: crediti_500
      credits: 500
      price: 8
      label: 500 crediti AI
    plans:
    - key: studio_2
      price: 49
      interval: month
      label: Studio fino a 2 poltrone
      credits: 500
      creditsReset: monthly
      roles:
      - studio
      includes:
      - 2 poltrone
      - fino a 5 utenti
    - key: studio_4
      price: 89
      interval: month
      label: Studio fino a 4 poltrone
      credits: 1000
      creditsReset: monthly
      roles:
      - studio
      includes:
      - 4 poltrone
      - fino a 10 utenti
    - key: studio_8
      price: 149
      interval: month
      label: Studio fino a 8 poltrone
      credits: 2000
      creditsReset: monthly
      roles:
      - studio
      includes:
      - 8 poltrone
      - utenti illimitati
  extensions:
  - key: staff_condiviso_studio
    description: 'Più utenti (segretaria, dentisti, pazienti) sullo stesso studio con visibilità per ruolo: oggi i dati sono
      del singolo account titolare e si condividono per record tramite inviti viewer/editor. Manca un vero ''studio'' con
      membri e permessi per ruolo.'
  - key: invio_promemoria
    description: 'Invio automatico di email e messaggi ai pazienti: non disponibile. L''agente prepara bozze in ''comunicazioni''
      che il personale invia.'
  - key: firma_consensi
    description: 'Firma elettronica dei consensi informati nell''app: prevista in futuro; per ora il consenso si registra
      come casella nell''anagrafica e il documento si condivide come link.'
  - key: upload_documenti
    description: 'Caricamento file non disponibile: i documenti condivisi sono link.'
  - key: adempimenti_gdpr
    description: Nomina a responsabile del trattamento (art. 28), registro dei trattamenti e DPIA da definire con il titolare
      prima dell'uso con dati reali.
