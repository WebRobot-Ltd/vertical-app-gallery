apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: normavigile
  displayName: NormaVigile
  tagline:
    it: La normativa finanziaria, leggibile e monitorata.
    en: Financial regulation, readable and monitored.
  description:
    it: NormaVigile segue ogni notte EUR-Lex, Gazzetta Ufficiale, Banca d'Italia, EBA ed ESMA, confronta le versioni degli
      atti articolo per articolo, classifica le modifiche per tema e impatto e le rende ricercabili. Chat con citazioni puntuali,
      report settimanale via email e alert sugli atti critici.
    en: NormaVigile follows EUR-Lex, Gazzetta Ufficiale, Banca d'Italia, EBA and ESMA every night, compares act versions article
      by article, classifies changes by theme and impact and makes them searchable. Chat with precise citations, a weekly
      email report and alerts on critical acts.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#0f2a43'
      accent: '#0b7a75'
      background: '#f6f8fa'
      foreground: '#101828'
    fonts:
      body: Inter
      display: Source Serif 4
    wordmark:
    - text: Norma
      color: primary
    - text: Vigile
      color: accent
    width: wide
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Fonti
        en: Sources
      href: '#fonti'
    - label:
        it: Piani
        en: Plans
      href: '#piani'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: user
      label:
        it: Utente compliance
        en: Compliance user
      assignedBy: signup
  limits:
  - action: chat
    per: user
    max: 100
    window: day
    roles:
    - user
  agents:
  - key: collector
    role: scheduled
    description: Every night collects new and amended acts from the official sources, stores each version and the article-by-article
      diff.
    profile:
      inline:
        display_name: NormaVigile collector
        crews:
        - id: collector
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 60
          max_budget_usd: 3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'Sei il raccoglitore normativo di NormaVigile. Ogni notte controlli, con gli strumenti di scraping
            WebRobot (costruisci ed esegui tu la pipeline), le novità pubblicate nelle ultime 48 ore su: EUR-Lex (eur-lex.europa.eu),
            Gazzetta Ufficiale (gazzettaufficiale.it), Banca d''Italia (bancaditalia.it, sezione normativa), EBA (eba.europa.eu)
            ed ESMA (esma.europa.eu). Considera solo atti di materia finanziaria (antiriciclaggio, credito, ICT/resilienza
            operativa, trasparenza e mercati, pagamenti). Rispetta i termini d''uso e robots.txt delle fonti; usa solo contenuti
            pubblici.

            Per ogni atto: 1) cerca con list_acts se esiste già (act_id stabile: numero ufficiale, es. CELEX o estremi GU).
            2) Se è nuovo: save_act (act_id, title, authority, type, source_url, published, status, current_version=1, topics)
            e save_version con il testo integrale diviso per articoli (version, date, text, source_url, hash). 3) Se esiste
            e il testo è cambiato: leggi l''ultima versione con search_versions, salva la nuova con save_version, aggiorna
            l''atto con save_act e salva con save_change il diff ARTICOLO PER ARTICOLO (articles_diff: per ogni articolo aggiunto/modificato/abrogato,
            il testo prima e dopo in breve; summary di 2-3 frasi; from_version, to_version, date, act_id, act_title, authority,
            url ufficiale; classified=false). Non classificare tema e impatto: lo fa un altro agente. Non inventare mai testo
            o numeri di articolo: se una fonte non è raggiungibile, annotalo e prosegui.

            Concludi con un riepilogo in Markdown che inizia con "# Aggiornamento normativo <data>": atti nuovi, atti modificati,
            fonti non raggiungibili.'
    goalTemplate: 'Data di oggi: {date}. Esegui la raccolta notturna delle novità normative.'
    appTools:
    - name: list_acts
      description: Look up acts already stored
      action: read
      collection: acts
      scope: all
    - name: save_act
      description: Create or update an act
      action: write
      collection: acts
      scope: all
    - name: search_versions
      description: Search stored act versions (full text)
      action: search
      collection: act_versions
      scope: all
    - name: save_version
      description: Store a new version of an act
      action: write
      collection: act_versions
      scope: all
    - name: save_change
      description: Store the article-by-article diff between two versions
      action: write
      collection: act_changes
      scope: all
    output: markdown
  - key: classifier
    role: scheduled
    description: Classifies unclassified changes by theme and impact and keeps the full-text archive consistent.
    profile:
      inline:
        display_name: NormaVigile classifier
        crews:
        - id: classifier
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei il classificatore di NormaVigile. Cerca con search_changes le modifiche con classified=false.
            Per ciascuna assegna con classify_change: theme (aml, credit, ict, transparency, other), impact (low, medium,
            high, critical) con una motivazione di una frase (impact_reason) basata sul diff, e classified=true. ''critical''
            solo per obblighi nuovi o sanzioni, scadenze di adeguamento vicine o abrogazioni di articoli chiave. Aggiorna
            anche i temi dell''atto con classify_act. Non inventare: se il diff è ambiguo scegli l''impatto più basso e dillo.
            Concludi con un riepilogo Markdown che inizia con "# Classificazione <data>" e il conteggio per tema e impatto.'
    goalTemplate: 'Data di oggi: {date}. Classifica le modifiche non ancora classificate.'
    appTools:
    - name: search_changes
      description: Search stored changes
      action: search
      collection: act_changes
      scope: all
    - name: classify_change
      description: Update a change with theme, impact and classified flag
      action: write
      collection: act_changes
      scope: all
    - name: classify_act
      description: Update the topics of an act
      action: write
      collection: acts
      scope: all
    output: markdown
  - key: assistant
    role: main
    description: Answers compliance questions with precise article citations and official links.
    profile:
      inline:
        display_name: NormaVigile assistant
        crews:
        - id: assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''assistente normativo di NormaVigile per uffici compliance di banche, SIM e fintech. Rispondi
            SOLO sulla base degli atti dell''archivio, che cerchi con search_acts, search_versions e search_changes. Ogni
            affermazione normativa cita l''atto, l''articolo (e comma se noto) e il link ufficiale, nel formato "[Atto, art.
            N](url)". Se l''archivio non contiene la risposta, dillo chiaramente e non inventare articoli, date o numeri.
            Quando rilevante indica cosa è cambiato di recente (search_changes) e l''impatto. Tieni conto del perimetro dell''azienda
            dell''utente (tipo di intermediario, temi, autorità) e delle sue note (search_notes). Le risposte sono supporto
            informativo, non parere legale: ricordalo in modo breve quando la decisione ha effetti rilevanti. Rispondi nella
            lingua dell''utente.'
    context:
    - key: perimeters
      from: collection:perimeters
    goalTemplate: 'Perimetro dell''utente:

      {perimeters}

      {?history}Conversazione finora:

      {history}

      {/history}Nuova domanda: {message}

      Rispondi nella lingua con codice ISO {lang}.'
    appTools:
    - name: search_acts
      description: Search acts in the archive
      action: search
      collection: acts
      scope: all
    - name: search_versions
      description: Search stored act versions (full text)
      action: search
      collection: act_versions
      scope: all
    - name: search_changes
      description: Search stored changes
      action: search
      collection: act_changes
      scope: all
    - name: search_notes
      description: Read the user's company notes
      action: search
      collection: notes
      scope: user
    output: markdown
  - key: watcher
    role: helper
    description: Weekly digest of relevant changes for one perimeter.
    profile:
      inline:
        display_name: NormaVigile weekly digest
        crews:
        - id: watcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Prepari il report settimanale per UN perimetro di compliance. Con search_changes cerca le modifiche
            degli ultimi 7 giorni, già classificate, e tieni solo quelle coerenti con i temi e le autorità del perimetro.
            Struttura: "# NormaVigile — novità della settimana <data>", poi ## Da fare subito (impatto critical/high), ##
            Da monitorare (medium), ## Altre variazioni (una riga ciascuna). Per ogni voce: atto, articoli toccati, cosa cambia
            in 1-2 frasi, link ufficiale. Se non ci sono novità rilevanti scrivi una sola riga sotto il titolo. Non inventare
            nulla.'
    appTools:
    - name: search_changes
      description: Search stored changes
      action: search
      collection: act_changes
      scope: all
    writesTo:
      collection: weekly_digests
      parse: whole
    output: markdown
  - key: alerter
    role: helper
    description: Daily check for changes to the acts the company marked as critical.
    profile:
      inline:
        display_name: NormaVigile critical alert
        crews:
        - id: alerter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Controlli se, nelle ultime 36 ore, è cambiato qualcuno degli atti che l''azienda ha marcato come
            critici (leggili con read_critical_acts; confronta act_id con search_changes). Se sì, scrivi "# ALERT NormaVigile
            — <data>" e per ogni atto: cosa cambia articolo per articolo, impatto, link ufficiale. Se non è cambiato nulla
            scrivi ESATTAMENTE e soltanto la riga "# Nessuna variazione sugli atti critici". Non inventare nulla.'
    appTools:
    - name: search_changes
      description: Search stored changes
      action: search
      collection: act_changes
      scope: all
    - name: read_critical_acts
      description: Read the acts the company marked as critical
      action: read
      collection: critical_acts
      scope: user
    writesTo:
      collection: critical_alerts
      parse: whole
    output: markdown
  data:
    collections:
    - name: perimeters
      ownedBy: user
      description: Company profile and monitoring perimeter; members are the compliance users of the company
      fields:
      - name: company
        type: text
        required: true
        label:
          it: Azienda
          en: Company
      - name: intermediary_type
        type: select
        required: true
        label:
          it: Tipo di intermediario
          en: Intermediary type
        options:
        - value: bank
          label:
            it: Banca
            en: Bank
        - value: sim
          label: SIM
        - value: fintech
          label: Fintech / IMEL / IP
        - value: other
          label:
            it: Altro
            en: Other
      - name: topics
        type: multiselect
        required: true
        label:
          it: Temi di interesse
          en: Topics
        options:
        - value: aml
          label:
            it: Antiriciclaggio
            en: AML
        - value: credit
          label:
            it: Credito
            en: Credit
        - value: ict
          label: ICT
        - value: transparency
          label:
            it: Trasparenza
            en: Transparency
      - name: authorities
        type: multiselect
        required: true
        label:
          it: Autorità da seguire
          en: Authorities
        options:
        - value: eurlex
          label: EUR-Lex
        - value: gu
          label: Gazzetta Ufficiale
        - value: bdi
          label: Banca d'Italia
        - value: eba
          label: EBA
        - value: esma
          label: ESMA
      - name: members
        type: array
        label:
          it: Email degli utenti compliance
          en: Compliance users' emails
        help:
          it: Chi può vedere e usare questo perimetro
          en: Who can see and use this perimeter
      access:
      - role: user
        where:
          members: '{user.email}'
        can:
        - read
        - write
    - name: notes
      ownedBy: user
      description: Company notes on acts
      fields:
      - name: act_ref
        type: text
        required: true
        label:
          it: Atto / articolo
          en: Act / article
      - name: body
        type: textarea
        required: true
        label:
          it: Nota
          en: Note
      - name: members
        type: array
        label:
          it: Email di chi può vedere la nota
          en: Emails who can see the note
      access:
      - role: user
        where:
          members: '{user.email}'
        can:
        - read
        - write
    - name: critical_acts
      ownedBy: user
      description: Acts the company marks as critical (alert on change)
      fields:
      - name: act_id
        type: text
        required: true
        label:
          it: Identificativo atto
          en: Act id
      - name: title
        type: text
        label:
          it: Titolo
          en: Title
      - name: reason
        type: textarea
        label:
          it: Perché è critico
          en: Why critical
      - name: members
        type: array
        label:
          it: Email degli utenti
          en: Users' emails
      access:
      - role: user
        where:
          members: '{user.email}'
        can:
        - read
        - write
    - name: acts
      ownedBy: app
      searchable: true
      description: Acts collected from the official sources
      fields:
      - name: act_id
        type: text
      - name: title
        type: text
      - name: authority
        type: text
      - name: type
        type: text
      - name: source_url
        type: url
      - name: published
        type: date
      - name: status
        type: text
      - name: current_version
        type: number
      - name: topics
        type: text
    - name: act_versions
      ownedBy: app
      searchable: true
      description: Every version of every act, full text by article
      fields:
      - name: act_id
        type: text
      - name: version
        type: number
      - name: date
        type: date
      - name: text
        type: textarea
      - name: source_url
        type: url
      - name: hash
        type: text
    - name: act_changes
      ownedBy: app
      searchable: true
      description: Article-by-article diff between versions, classified
      fields:
      - name: act_id
        type: text
      - name: act_title
        type: text
      - name: authority
        type: text
      - name: from_version
        type: number
      - name: to_version
        type: number
      - name: date
        type: date
      - name: articles_diff
        type: textarea
      - name: summary
        type: textarea
      - name: url
        type: url
      - name: classified
        type: boolean
      - name: theme
        type: select
        options:
        - aml
        - credit
        - ict
        - transparency
        - other
      - name: impact
        type: select
        options:
        - low
        - medium
        - high
        - critical
      - name: impact_reason
        type: text
    - name: weekly_digests
      ownedBy: instance
      description: Weekly digests of each perimeter watch
    - name: critical_alerts
      ownedBy: instance
      description: Alerts on critical acts of each watch
  templates:
  - key: weekly_digest
    title:
      it: Report settimanale
      en: Weekly report
    description:
      it: Ogni lunedì via email le novità rilevanti per il tuo perimetro.
      en: Every Monday by email, the news relevant to your perimeter.
    agent: watcher
    params:
    - name: perimeter
      type: text
      required: true
      label:
        it: Nome del perimetro
        en: Perimeter name
    - name: intermediary_type
      type: select
      required: true
      label:
        it: Intermediario
        en: Intermediary
      options:
      - value: bank
        label:
          it: Banca
          en: Bank
      - value: sim
        label: SIM
      - value: fintech
        label: Fintech
    - name: topics
      type: multiselect
      required: true
      label:
        it: Temi
        en: Topics
      options:
      - value: aml
        label:
          it: Antiriciclaggio
          en: AML
      - value: credit
        label:
          it: Credito
          en: Credit
      - value: ict
        label: ICT
      - value: transparency
        label:
          it: Trasparenza
          en: Transparency
    - name: authorities
      type: multiselect
      required: true
      label:
        it: Autorità
        en: Authorities
      options:
      - value: eurlex
        label: EUR-Lex
      - value: gu
        label: Gazzetta Ufficiale
      - value: bdi
        label: Banca d'Italia
      - value: eba
        label: EBA
      - value: esma
        label: ESMA
    goal: 'Perimetro "{instance}" ({perimeter}): intermediario {intermediary_type}, temi {topics}, autorità {authorities}.
      Oggi è {date}. Scrivi il report della settimana nella lingua con codice ISO {lang}.'
    schedule:
      cron: 0 7 * * 1
      userCanChange: true
    maxPerUser: 5
    deliver:
      to: owner
      subject:
        it: NormaVigile — novità della settimana
        en: NormaVigile — this week's changes
      onlyIfNew: true
  - key: critical_watch
    title:
      it: Alert atti critici
      en: Critical act alert
    description:
      it: Una email quando cambia un atto che hai marcato come critico (controllo dopo l'aggiornamento notturno).
      en: An email when an act you marked as critical changes (checked after the nightly update).
    agent: alerter
    params:
    - name: perimeter
      type: text
      required: true
      label:
        it: Nome del perimetro
        en: Perimeter name
    goal: Perimetro "{instance}". Oggi è {date}. Controlla gli atti critici nella lingua con codice ISO {lang}.
    schedule:
      cron: 30 5 * * *
      userCanChange: false
    maxPerUser: 3
    deliver:
      to: owner
      subject:
        it: 'ALERT NormaVigile: atto critico modificato'
        en: 'NormaVigile ALERT: critical act changed'
      onlyIfNew: true
  schedules:
  - agent: collector
    cron: 0 2 * * *
    action: run
    owner: app
    goal: Esegui la raccolta notturna delle novità normative.
  - agent: classifier
    cron: 0 4 * * *
    action: run
    owner: app
    goal: Classifica le modifiche non ancora classificate.
  views:
  - key: home
    type: page
    nav: false
    title: NormaVigile
    sections:
    - type: hero
      layout: stack
      band: true
      eyebrow:
        it: Per uffici compliance
        en: For compliance teams
      title:
        it: La normativa finanziaria, **leggibile** e **monitorata**.
        en: Financial regulation, **readable** and **monitored**.
      text:
        it: Ogni notte seguiamo EUR-Lex, Gazzetta Ufficiale, Banca d'Italia, EBA ed ESMA. Vedi cosa è cambiato articolo per
          articolo, chiedi alla chat con citazioni puntuali e ricevi ogni lunedì le novità del tuo perimetro.
        en: Every night we follow EUR-Lex, Gazzetta Ufficiale, Banca d'Italia, EBA and ESMA. See what changed article by article,
          ask the chat with precise citations and get your perimeter's news every Monday.
      actions:
      - label:
          it: Inizia
          en: Get started
        href: /login
        style: primary
      - label:
          it: Come funziona
          en: How it works
        href: '#come-funziona'
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Definisci il perimetro
          en: Define your perimeter
        text:
          it: Tipo di intermediario, temi e autorità da seguire. Solo la tua azienda lo vede.
          en: Intermediary type, topics and authorities. Only your company sees it.
      - title:
          it: Monitoraggio notturno
          en: Nightly monitoring
        text:
          it: Ogni atto è salvato con le sue versioni e il diff articolo per articolo, classificato per tema e impatto.
          en: Every act is stored with its versions and the article-by-article diff, classified by theme and impact.
      - title:
          it: Chiedi, ricevi, agisci
          en: Ask, receive, act
        text:
          it: Chat con citazioni e link ufficiali, report del lunedì e alert sugli atti critici.
          en: Chat with citations and official links, Monday report and alerts on critical acts.
    - type: cards
      id: fonti
      title:
        it: Fonti
        en: Sources
      items:
      - title: EUR-Lex
        text:
          it: Atti dell'Unione europea.
          en: European Union acts.
      - title: Gazzetta Ufficiale
        text:
          it: Atti nazionali.
          en: National acts.
      - title: Banca d'Italia
        text:
          it: Disposizioni e circolari.
          en: Provisions and circulars.
      - title: EBA · ESMA
        text:
          it: Linee guida, standard tecnici, Q&A.
          en: Guidelines, technical standards, Q&A.
    - type: cards
      id: piani
      title:
        it: Piani per numero di utenti
        en: Plans by number of users
      items:
      - title: Team 5
        text:
          it: Fino a 5 utenti compliance.
          en: Up to 5 compliance users.
        badge: €149
      - title: Team 15
        text:
          it: Fino a 15 utenti compliance.
          en: Up to 15 compliance users.
        badge: €349
      - title: Team 50
        text:
          it: Fino a 50 utenti compliance.
          en: Up to 50 compliance users.
        badge: €899
    - type: note
      content:
        it: NormaVigile è un supporto informativo, non consulenza legale. Verifica sempre sul testo ufficiale.
        en: NormaVigile is an information aid, not legal advice. Always check the official text.
  - key: assistant
    type: chat
    title:
      it: Chiedi alla normativa
      en: Ask the regulation
    source: agent:assistant
    examples:
    - it: Cosa è cambiato negli obblighi di adeguata verifica?
      en: What changed in customer due diligence obligations?
    - it: Quali scadenze DORA riguardano una SIM?
      en: Which DORA deadlines apply to an investment firm?
    placeholder:
      it: Fai una domanda sulla normativa…
      en: Ask a regulatory question…
    roles:
    - user
    - admin
  - key: perimeter_form
    type: form
    title:
      it: Azienda e perimetro
      en: Company and perimeter
    collection: perimeters
    edit: true
    submit:
      label:
        it: Salva perimetro
        en: Save perimeter
      message:
        it: Perimetro salvato.
        en: Perimeter saved.
      redirect: perimeter_list
    roles:
    - user
    - admin
  - key: perimeter_list
    type: table
    title:
      it: I miei perimetri
      en: My perimeters
    source: collection:perimeters
    columns:
    - company
    - intermediary_type
    - topics
    - authorities
    - members
    roles:
    - user
    - admin
  - key: note_form
    type: form
    title:
      it: Nuova nota
      en: New note
    collection: notes
    edit: true
    submit:
      label:
        it: Salva nota
        en: Save note
      message:
        it: Nota salvata.
        en: Note saved.
      redirect: notes_list
    roles:
    - user
    - admin
  - key: notes_list
    type: table
    title:
      it: Note
      en: Notes
    source: collection:notes
    columns:
    - act_ref
    - body
    roles:
    - user
    - admin
  - key: critical_form
    type: form
    title:
      it: Marca un atto come critico
      en: Mark an act as critical
    collection: critical_acts
    edit: true
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Atto marcato come critico.
        en: Act marked as critical.
      redirect: critical_list
    roles:
    - user
    - admin
  - key: critical_list
    type: table
    title:
      it: Atti critici
      en: Critical acts
    source: collection:critical_acts
    columns:
    - act_id
    - title
    - reason
    roles:
    - user
    - admin
  - key: changes
    type: table
    title:
      it: Modifiche recenti
      en: Recent changes
    source: collection:act_changes
    data:
      display: table
      fields:
      - key: date
        label:
          it: Data
          en: Date
        format: date
      - key: act_title
        label:
          it: Atto
          en: Act
      - key: authority
        label:
          it: Autorità
          en: Authority
        format: badge
      - key: theme
        label:
          it: Tema
          en: Theme
        format: badge
      - key: impact
        label:
          it: Impatto
          en: Impact
        format: badge
      - key: summary
        label:
          it: Sintesi
          en: Summary
      - key: url
        label: Link
        format: link
      sort:
        field: date
        dir: desc
      limit: 100
    export: true
    roles:
    - user
    - admin
  - key: acts
    type: table
    title:
      it: Archivio atti
      en: Act archive
    source: collection:acts
    columns:
    - title
    - authority
    - type
    - published
    - status
    - current_version
    - source_url
    export: true
    roles:
    - user
    - admin
  - key: watches
    type: instances
    template: weekly_digest
    title:
      it: Report settimanali
      en: Weekly reports
    roles:
    - user
    - admin
  - key: alerts
    type: instances
    template: critical_watch
    title:
      it: Alert atti critici
      en: Critical alerts
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - user
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: team_5
      price: 149
      interval: month
      label:
        it: Team 5 utenti
        en: Team 5 users
      includes:
      - up to 5 users
      - chat
      - weekly report
      - critical alerts
    - key: team_15
      price: 349
      interval: month
      label:
        it: Team 15 utenti
        en: Team 15 users
      includes:
      - up to 15 users
      - chat
      - weekly report
      - critical alerts
    - key: team_50
      price: 899
      interval: month
      label:
        it: Team 50 utenti
        en: Team 50 users
      includes:
      - up to 50 users
      - chat
      - weekly report
      - critical alerts
  extensions:
  - key: seat_limit
    description: Enforcing the maximum number of users per plan (5/15/50) on the emails listed in members is not available
      yet; plans are priced per seat tier.
  - key: team_email_delivery
    description: Weekly reports and critical alerts are emailed to the owner of each watch (the user who created it); delivery
      to every member of the perimeter is not available yet. Alerts are sent after the nightly update, not in real time.
