apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: sentinellapi
  displayName: SentinellaAPI
  tagline:
    it: Security testing automatico delle tue API REST, con autorizzazione scritta prima di ogni scansione.
    en: Automated security testing for your REST APIs, with written authorization before every scan.
  description:
    it: SentinellaAPI mappa le tue API, genera casi di test sulle categorie OWASP API Top 10, li esegue solo contro gli host
      dichiarati e nei limiti concordati, poi verifica i risultati per eliminare i falsi positivi. Nessun test parte senza
      l'autorizzazione firmata e verificata da un admin.
    en: SentinellaAPI maps your APIs, generates test cases across the OWASP API Top 10 categories, runs them only against
      declared hosts within agreed limits, then verifies the findings to remove false positives. No test starts without signed,
      admin-verified authorization.
  langs:
  - it
  - en
  defaultLang: it
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#0b1f3a'
      accent: '#c0392b'
      background: '#f6f7f9'
      foreground: '#141a24'
    fonts:
      body: Inter
      display: Space Grotesk
      mono: JetBrains Mono
    wordmark:
    - text: Sentinella
      color: primary
    - text: API
      color: accent
    button: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: OWASP Top 10
        en: OWASP Top 10
      href: '#owasp'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label:
        it: Admin piattaforma
        en: Platform admin
      assignedBy: admin_emails
    - key: owner
      label:
        it: Responsabile
        en: Owner
      assignedBy: signup
    - key: developer
      label:
        it: Sviluppatore
        en: Developer
      assignedBy: invite
    - key: auditor
      label:
        it: Auditor
        en: Auditor
      assignedBy: invite
  limits:
  - action: create:targets
    max: 3
    window: total
    roles:
    - owner
    plans:
      growth: 10
      enterprise: -1
  - action: agent:mapper
    max: 5
    window: day
    roles:
    - owner
    - developer
  agents:
  - key: mapper
    role: main
    description: Chiede l'autorizzazione scritta sul perimetro e, una volta approvata, mappa endpoint, parametri e ruoli del
      target.
    awaits:
    - scope_authorization
    appTools:
    - name: read_openapi
      description: Legge il testo della specifica OpenAPI o della collezione di chiamate caricata per il target
      action: read_file
    context:
    - key: base_url
      from: collection:targets.base_url
    - key: environment
      from: collection:targets.environment
    - key: rate_limit
      from: collection:targets.rate_limit
    - key: allowed_windows
      from: collection:targets.allowed_windows
    - key: openapi_file
      from: collection:targets.openapi_file
    - key: collection_file
      from: collection:targets.collection_file
    profile:
      inline:
        display_name: SentinellaAPI Mapper
        crews:
        - id: mapper
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei il primo agente di SentinellaAPI. Prima di qualsiasi analisi, chiama il tool request_scope_authorization
            riassumendo URL base, ambiente, limiti di richieste al secondo e finestre orarie consentite: nessun test può partire
            senza l''autorizzazione scritta verificata da un admin della piattaforma. Solo dopo l''approvazione, leggi la
            specifica OpenAPI o la collezione caricata con read_openapi e produci una mappa strutturata: endpoint, metodo,
            parametri, se richiede autenticazione, ruolo minimo atteso. Non inventare endpoint non presenti nella specifica.
            Rispondi in italiano o inglese secondo la lingua richiesta.'
    goalTemplate: 'Target: {base_url} (ambiente: {environment}).

      Limiti: {rate_limit} richieste/secondo. Finestre consentite: {allowed_windows}.

      {?openapi_file}Specifica OpenAPI caricata (file id: {openapi_file}).{/openapi_file}

      {?collection_file}Collezione di chiamate caricata (file id: {collection_file}).{/collection_file}

      Oggi è {date}. Scrivi in lingua con codice {lang}.'
  - key: generator
    role: helper
    description: Genera i casi di test sulle categorie OWASP API Top 10 a partire dalla mappa degli endpoint.
    context:
    - key: environment
      from: collection:targets.environment
    profile:
      inline:
        display_name: SentinellaAPI Test Generator
        crews:
        - id: generator
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Ricevi la mappa di endpoint, parametri e ruoli prodotta dall''agente precedente. Per ogni endpoint
            rilevante genera casi di test concreti sulle categorie OWASP API Top 10 pertinenti: Broken Object Level Authorization,
            Broken Authentication, Excessive Data Exposure, Mass Assignment, Lack of Resources & Rate Limiting. Per ogni caso
            specifica: categoria, endpoint, payload o header da alterare, risultato atteso se vulnerabile. Non generare casi
            contro ambienti diversi da quello dichiarato.'
    goalTemplate: 'Ambiente: {environment}. Genera i casi di test OWASP API Top 10 a partire dalla mappa ricevuta. Lingua:
      {lang}.'
  - key: executor
    role: helper
    description: Esegue le chiamate di test solo verso l'host dichiarato, rispettando i limiti di carico e le finestre orarie.
    context:
    - key: base_url
      from: collection:targets.base_url
    - key: environment
      from: collection:targets.environment
    - key: rate_limit
      from: collection:targets.rate_limit
    - key: allowed_windows
      from: collection:targets.allowed_windows
    - key: test_credential
      from: collection:targets.test_credential
    mcpServers:
    - name: webrobot
      url: https://mcp-full.webrobot.eu/mcp
      allow: all
    profile:
      inline:
        display_name: SentinellaAPI Executor
        crews:
        - id: executor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 2.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Esegui SOLO le chiamate verso l''host {base_url}: nessuna chiamata verso altri domini. Rispetta
            rigidamente il limite di {rate_limit} richieste al secondo e le finestre orarie consentite ({allowed_windows});
            se sei fuori da una finestra consentita, interrompi e segnalalo invece di eseguire. Usa le credenziali di test
            fornite solo per autenticarti nell''ambiente {environment}, mai in produzione se non esplicitamente indicato.
            Per ogni caso di test ricevuto dal generatore esegui la chiamata reale, registra richiesta e risposta grezze (metodo,
            path, header non sensibili, status, corpo troncato) e l''esito (vulnerabile / non vulnerabile / errore). Non modificare
            o cancellare dati reali degli utenti del target: usa solo le risorse create per il test.'
    goalTemplate: 'Host autorizzato: {base_url} (ambiente: {environment}). Limite: {rate_limit} richieste/secondo. Finestre
      consentite: {allowed_windows}.

      Esegui i casi di test OWASP ricevuti dal generatore e registra richiesta/risposta per ciascuno.'
  - key: verifier
    role: helper
    description: Verifica gli esiti dell'esecuzione, elimina i falsi positivi e scrive il report finale con gravità e rimedi.
    context:
    - key: base_url
      from: collection:targets.base_url
    - key: environment
      from: collection:targets.environment
    - key: members
      from: collection:targets.members
    output: markdown+json
    resultSchema:
      type: object
      properties:
        base_url:
          type: string
        max_severity:
          type: string
          enum:
          - none
          - low
          - medium
          - high
          - critical
        critical_count:
          type: integer
        high_count:
          type: integer
        medium_count:
          type: integer
        low_count:
          type: integer
        summary:
          type: string
        members:
          type: array
          items:
            type: string
    writesTo:
      collection: scan_results
      parse: json_last
    profile:
      inline:
        display_name: SentinellaAPI Verifier
        crews:
        - id: verifier
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Ricevi gli esiti grezzi delle chiamate di test. Scarta i falsi positivi (errori di rete, ambienti
            non raggiungibili, risposte ambigue senza prova concreta) e tieni solo le vulnerabilità confermate da richiesta
            e risposta reali. Inizia con un titolo Markdown di livello 1 "# Report sicurezza API — <base_url>". Per ogni vulnerabilità
            confermata: categoria OWASP, gravità (critical/high/medium/low), endpoint, richiesta di prova, risposta di prova
            (troncata), suggerimento di correzione concreto. Chiudi con una tabella riassuntiva per gravità. Alla fine del
            testo Markdown, aggiungi un blocco JSON conforme allo schema richiesto con base_url, max_severity, i conteggi
            per gravità, un summary di una frase e members copiato dal contesto. Non inventare mai vulnerabilità non provate
            dai dati ricevuti.'
    goalTemplate: 'Target: {base_url} (ambiente: {environment}). Verifica gli esiti ricevuti, elimina i falsi positivi e scrivi
      il report finale. Lingua: {lang}.'
  teams:
  - key: security_scan_team
    mode: sequence
    title:
      it: Scansione sicurezza API
      en: API security scan
    description: Mapper -> Generator -> Executor -> Verifier, in sequenza; nessuno parte senza l'autorizzazione approvata
      chiesta dal mapper.
    steps:
    - agent: mapper
    - agent: generator
      after:
      - mapper
    - agent: executor
      after:
      - generator
    - agent: verifier
      after:
      - executor
    maxMinutes: 60
  inputForm:
    title:
      it: Nuova scansione
      en: New scan
    fields:
    - name: target
      type: select
      required: true
      label:
        it: Target
        en: Target
      optionsFrom: collection:targets
  data:
    collections:
    - name: targets
      description: I target API configurati da ogni azienda
      ownedBy: user
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome target
          en: Target name
      - name: base_url
        type: url
        required: true
        label:
          it: URL base
          en: Base URL
      - name: environment
        type: select
        required: true
        default: staging
        label:
          it: Ambiente
          en: Environment
        options:
        - value: staging
          label:
            it: Staging (consigliato)
            en: Staging (recommended)
        - value: production
          label:
            it: Produzione
            en: Production
      - name: test_credential
        type: textarea
        required: true
        label:
          it: Credenziali di test
          en: Test credentials
        help:
          it: Token o chiave di un account di test, non un account reale
          en: Token or key of a test account, never a real one
      - name: rate_limit
        type: number
        required: true
        label:
          it: Limite richieste/secondo
          en: Rate limit (req/s)
      - name: allowed_windows
        type: textarea
        required: true
        label:
          it: Finestre orarie consentite
          en: Allowed time windows
        help:
          it: es. lun-ven 20:00-24:00 Europe/Rome
          en: e.g. Mon-Fri 20:00-24:00 Europe/Rome
      - name: openapi_file
        type: file
        accept:
        - json
        - txt
        - md
        maxMb: 10
        label:
          it: Specifica OpenAPI
          en: OpenAPI spec
      - name: collection_file
        type: file
        accept:
        - json
        - txt
        maxMb: 10
        label:
          it: Collezione di chiamate (opzionale)
          en: Call collection (optional)
      - name: members
        type: array
        label:
          it: Email sviluppatori/auditor con accesso
          en: Developer/auditor emails with access
      - name: status
        type: select
        default: pending_approval
        label:
          it: Stato autorizzazione
          en: Authorization status
        options:
        - pending_approval
        - approved
        - rejected
      access:
      - role: developer
        where:
          members: '{user.email}'
        can:
        - read
      - role: auditor
        where:
          members: '{user.email}'
        can:
        - read
    - name: scan_results
      description: Gli esiti di ogni scansione completata
      ownedBy: user
      fields:
      - name: base_url
        type: text
        label:
          it: Target
          en: Target
      - name: max_severity
        type: select
        label:
          it: Gravità massima
          en: Max severity
        options:
        - none
        - low
        - medium
        - high
        - critical
      - name: critical_count
        type: number
        label: Critical
      - name: high_count
        type: number
        label: High
      - name: medium_count
        type: number
        label: Medium
      - name: low_count
        type: number
        label: Low
      - name: summary
        type: text
        label:
          it: Riepilogo
          en: Summary
      - name: members
        type: array
        label:
          it: Email con accesso
          en: Emails with access
      access:
      - role: developer
        where:
          members: '{user.email}'
        can:
        - read
      - role: auditor
        where:
          members: '{user.email}'
        can:
        - read
      retentionDays: 365
  views:
  - key: home
    type: page
    nav: false
    sections:
    - type: hero
      layout: split
      band: true
      title:
        it: Security testing automatico delle tue **API REST**
        en: Automated security testing for your **REST APIs**
      text:
        it: SentinellaAPI mappa le tue API, genera casi di test OWASP API Top 10, li esegue solo contro gli host dichiarati
          nei limiti concordati, e verifica i risultati per eliminare i falsi positivi. Nessun test parte senza autorizzazione
          scritta e verificata.
        en: SentinellaAPI maps your APIs, generates OWASP API Top 10 test cases, runs them only against declared hosts within
          agreed limits, and verifies results to remove false positives. No test starts without written, verified authorization.
      actions:
      - label:
          it: Accedi e crea un target
          en: Sign in and create a target
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: 1 · Autorizzazione
          en: 1 · Authorization
        text:
          it: Il responsabile firma il perimetro del test; un admin della piattaforma lo verifica prima di qualsiasi scansione.
          en: The owner signs the test scope; a platform admin verifies it before any scan.
      - title:
          it: 2 · Mappatura
          en: 2 · Mapping
        text:
          it: Un agente mappa endpoint, parametri e ruoli dalla specifica OpenAPI o dalla collezione caricata.
          en: An agent maps endpoints, parameters and roles from the uploaded OpenAPI spec or collection.
      - title:
          it: 3 · Test OWASP
          en: 3 · OWASP test cases
        text:
          it: Casi di test sulle categorie OWASP API Top 10 più critiche, generati per ogni endpoint rilevante.
          en: Test cases across the most critical OWASP API Top 10 categories, generated for every relevant endpoint.
      - title:
          it: 4 · Esecuzione controllata
          en: 4 · Controlled execution
        text:
          it: Le chiamate vengono eseguite solo verso l'host dichiarato, rispettando i limiti di richieste e le finestre orarie.
          en: Calls run only against the declared host, respecting rate limits and allowed time windows.
      - title:
          it: 5 · Verifica e report
          en: 5 · Verification and report
        text:
          it: Un ultimo agente elimina i falsi positivi e scrive il report con gravità, prove e rimedi.
          en: A final agent removes false positives and writes the report with severity, evidence and fixes.
    - type: cards
      id: owasp
      title:
        it: Categorie OWASP API Top 10 testate
        en: OWASP API Top 10 categories tested
      items:
      - title: Broken Object Level Authorization
        text:
          it: Accesso a oggetti di altri utenti tramite ID manipolati.
          en: Access to other users' objects via manipulated IDs.
      - title: Broken Authentication
        text:
          it: Autenticazione debole o token mal verificati.
          en: Weak authentication or poorly verified tokens.
      - title: Excessive Data Exposure
        text:
          it: Risposte che espongono più dati del necessario.
          en: Responses exposing more data than necessary.
      - title: Mass Assignment
        text:
          it: Campi non previsti modificabili dal client.
          en: Unexpected fields writable by the client.
      - title: Lack of Resources & Rate Limiting
        text:
          it: Assenza di limiti su richieste e risorse.
          en: Missing limits on requests and resources.
    - type: note
      content:
        it: Supporto alla sicurezza, non un audit legale o una certificazione. Esegui test solo su sistemi di cui hai il diritto
          di testare la sicurezza.
        en: Security support, not a legal audit or certification. Only test systems you are authorized to test.
  - key: new_target
    type: form
    title:
      it: Nuovo target
      en: New target
    collection: targets
    fields:
    - name
    - base_url
    - environment
    - test_credential
    - rate_limit
    - allowed_windows
    - openapi_file
    - collection_file
    - members
    submit:
      label:
        it: Crea target e invia per autorizzazione
        en: Create target and submit for authorization
      message:
        it: Target creato. Nessuna scansione partirà finché un admin non verifica l'autorizzazione.
        en: Target created. No scan will start until an admin verifies the authorization.
      redirect: targets_list
    roles:
    - owner
  - key: targets_list
    type: table
    title:
      it: I miei target
      en: My targets
    source: collection:targets
    columns:
    - name
    - base_url
    - environment
    - status
    - rate_limit
    roles:
    - owner
    - developer
    - auditor
  - key: approvals_view
    type: approvals
    title:
      it: Autorizzazioni da verificare
      en: Authorizations to verify
    approvals:
    - scope_authorization
    roles:
    - admin
  - key: scan_watch
    type: instances
    template: security_watch
    title:
      it: Scansioni pianificate
      en: Scheduled scans
    roles:
    - owner
    - developer
  - key: scan_history
    type: history
    title:
      it: Storico scansioni
      en: Scan history
    source: run
    roles:
    - owner
    - developer
    - auditor
  - key: scan_report
    type: report
    title:
      it: Report scansione
      en: Scan report
    source: run
    printable: true
    nav: false
  - key: results_table
    type: table
    title:
      it: Vulnerabilità rilevate
      en: Detected vulnerabilities
    source: collection:scan_results
    columns:
    - base_url
    - max_severity
    - critical_count
    - high_count
    - medium_count
    - low_count
    - summary
    export: true
    roles:
    - owner
    - developer
    - auditor
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Plan
    roles:
    - owner
  templates:
  - key: security_watch
    title:
      it: Scansione sicurezza ricorrente
      en: Recurring security scan
    description:
      it: Scansiona un target su richiesta o ogni settimana e consegna il report.
      en: Scans a target on demand or every week and delivers the report.
    team: security_scan_team
    params:
    - name: target
      type: select
      required: true
      label:
        it: Target
        en: Target
      optionsFrom: collection:targets
    schedule:
      cron: 0 3 * * 1
      userCanChange: true
    maxPerUser: 20
    roles:
    - owner
    - developer
    goal: Scansione "{instance}" per il target selezionato. Oggi è {date}.
    deliver:
      to: owner
      subject:
        it: Report sicurezza API — {instance}
        en: API security report — {instance}
      onlyIfNew: false
  approvals:
  - key: scope_authorization
    title:
      it: Autorizzazione perimetro di test
      en: Test scope authorization
    description: 'Il responsabile ha firmato il perimetro: un admin della piattaforma verifica host, ambiente, limiti e finestre
      orarie prima che qualsiasi agente esegua test. / The owner has signed the scope: a platform admin verifies host, environment,
      limits and time windows before any agent runs tests.'
    role: admin
    fields:
    - base_url
    - environment
    - rate_limit
    - allowed_windows
    timeoutMinutes: 2880
    onTimeout: reject
    decidedBy: role
  triggers:
  - key: critical_alert
    description: Avvisa via email quando una scansione trova una vulnerabilità critica
    'on':
      collection: scan_results
      op: insert
      where:
        max_severity: critical
    notify:
      to: owner
      subject:
        it: Vulnerabilità critica rilevata su {record.base_url}
        en: Critical vulnerability found on {record.base_url}
      body:
        it: 'L''ultima scansione ha trovato {record.critical_count} vulnerabilità critiche su {record.base_url}. Riepilogo:
          {record.summary}'
        en: 'The latest scan found {record.critical_count} critical vulnerabilities on {record.base_url}. Summary: {record.summary}'
      link: results_table
  notifications:
    emailOnRunDone: true
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: starter
      price: 49
      interval: month
      label:
        it: Starter — fino a 3 API
        en: Starter — up to 3 APIs
      roles:
      - owner
    - key: growth
      price: 149
      interval: month
      label:
        it: Growth — fino a 10 API
        en: Growth — up to 10 APIs
      roles:
      - owner
    - key: enterprise
      price: 399
      interval: month
      label:
        it: Enterprise — API illimitate
        en: Enterprise — unlimited APIs
      roles:
      - owner
  extensions:
  - key: digital_signature
    description: La 'firma digitale' del perimetro da parte del responsabile è approssimata come conferma in-app all'invio
      del form target; una firma qualificata (es. con certificato) non è ancora disponibile nella piattaforma.
    where: new_target form submit
  - key: runtime_rate_limit_enforcement
    description: Il rispetto dei limiti di richieste al secondo e delle finestre orarie durante l'esecuzione è imposto dalle
      istruzioni dell'agente executor, non da un limitatore di rete a livello di piattaforma.
