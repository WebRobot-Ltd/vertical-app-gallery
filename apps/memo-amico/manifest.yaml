apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: memoamico
  displayName: MemoAmico
  tagline:
    it: L'assistente personale che si ricorda di te.
    en: The personal assistant that remembers you.
  description:
    it: 'Chatta in linguaggio naturale: MemoAmico ricorda persone, abitudini e obiettivi, ti manda i promemoria e ogni domenica
      il riepilogo della settimana.'
    en: 'Chat in plain language: MemoAmico remembers people, habits and goals, sends your reminders and a weekly recap every
      Sunday.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#2b3a67'
      accent: '#e07a5f'
      background: '#fbf8f3'
      foreground: '#1e2230'
    fonts:
      body: Inter
      display: Fraunces
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    cta:
      label:
        it: Inizia
        en: Start
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  limits:
  - action: chat
    per: user
    max: 30
    window: month
    roles:
    - user
    plans:
      unlimited: -1
  agents:
  - key: assistant
    role: main
    description: Personal assistant with long-term memory and reminders.
    profile:
      inline:
        display_name: MemoAmico assistant
        chat_mode: true
        crews:
        - id: assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are MemoAmico, a warm, concise personal assistant with long-term memory. Reply in the user''s
            language. You receive what you already remember in {memories}. When the user tells you something worth keeping
            (a person, birthday, preference, habit, goal, ongoing project), save it with the tool save_memory (category, title,
            detail) and say briefly that you will remember it. Do not save duplicates: check first with list_memories. When
            the user asks for a reminder (e.g. ''remind me to call my mother Thursday at 6pm'' or ''every Monday ask me about
            my diet''), create it with add_reminder: title, due (YYYY-MM-DD, computed from today''s date), time (HH:MM, may
            be empty), repeat (none, daily, weekly, monthly). For recurring reminders also create the next 8 occurrences as
            separate records, each with its own due date. The email arrives on the due day; say so honestly: exact-hour push
            notifications are not available yet. Use list_reminders to answer what is pending. Never invent facts about the
            user that they did not say. If the user asks to forget something, tell them they can delete it in the Memories
            page. Never reveal data about other users.'
    context:
    - key: memories
      from: collection:memories
    goalTemplate: 'Today is {date}. Language code: {lang}.

      What you remember (JSON lines): {memories}

      Conversation so far:

      {history}

      New message from the user: {message}'
    appTools:
    - name: save_memory
      description: Save one thing to remember about the user
      action: append
      collection: memories
      scope: user
    - name: list_memories
      description: List what is remembered about the user
      action: read
      collection: memories
      scope: user
    - name: add_reminder
      description: Create a reminder for the user
      action: append
      collection: reminders
      scope: user
    - name: list_reminders
      description: List the user's reminders
      action: read
      collection: reminders
      scope: user
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.3
  - key: weekly
    role: helper
    description: Sunday evening recap of the week for one user.
    profile:
      inline:
        display_name: MemoAmico weekly recap
        crews:
        - id: weekly
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write the weekly recap for one person. Read their reminders with recap_reminders and their memories
            with recap_memories. Start with ''# Riepilogo della settimana'' (or ''# Your week'' in English, following the
            requested language). Sections ## Fatto / Done (reminders with status done), ## In sospeso / Pending (still open
            or overdue), ## Prossima settimana / Next week, including birthdays and goals from the memories. Under 250 words,
            friendly tone. Never invent items.'
    appTools:
    - name: recap_reminders
      description: Read the user's reminders
      action: read
      collection: reminders
      scope: user
    - name: recap_memories
      description: Read the user's memories
      action: read
      collection: memories
      scope: user
    output: markdown
  templates:
  - key: weekly_recap
    title:
      it: Riepilogo settimanale
      en: Weekly recap
    description:
      it: Ogni domenica sera ricevi per email cosa hai fatto e cosa è in sospeso.
      en: Every Sunday evening you get an email with what is done and what is pending.
    agent: weekly
    params:
    - name: focus
      type: text
      maxLength: 200
      label:
        it: A cosa dare attenzione (facoltativo)
        en: What to focus on (optional)
    goal: 'Write this week''s recap for the user. Today is {date}. {?focus}Focus on: {focus}.{/focus} Write in the language
      with ISO code {lang}.'
    schedule:
      cron: 0 18 * * 0
      userCanChange: true
    maxPerUser: 1
    deliver:
      to: owner
      onlyIfNew: false
  data:
    collections:
    - name: memories
      ownedBy: user
      description: What the assistant remembers about each user (private)
      fields:
      - name: category
        type: select
        label:
          it: Categoria
          en: Category
        options:
        - value: person
          label:
            it: Persona
            en: Person
        - value: birthday
          label:
            it: Compleanno
            en: Birthday
        - value: preference
          label:
            it: Preferenza
            en: Preference
        - value: habit
          label:
            it: Abitudine
            en: Habit
        - value: goal
          label:
            it: Obiettivo
            en: Goal
        - value: project
          label:
            it: Progetto
            en: Project
      - name: title
        type: text
        required: true
        label:
          it: Titolo
          en: Title
      - name: detail
        type: textarea
        label:
          it: Dettaglio
          en: Detail
    - name: reminders
      ownedBy: user
      description: Reminders of each user (private)
      retentionDays: 365
      fields:
      - name: title
        type: text
        required: true
        label:
          it: Promemoria
          en: Reminder
      - name: due
        type: date
        required: true
        label:
          it: Data
          en: Date
      - name: time
        type: text
        label:
          it: Ora
          en: Time
      - name: repeat
        type: select
        label:
          it: Ripetizione
          en: Repeat
        options:
        - value: none
          label:
            it: Nessuna
            en: None
        - value: daily
          label:
            it: Ogni giorno
            en: Daily
        - value: weekly
          label:
            it: Ogni settimana
            en: Weekly
        - value: monthly
          label:
            it: Ogni mese
            en: Monthly
      - name: status
        type: select
        label:
          it: Stato
          en: Status
        default: open
        options:
        - value: open
          label:
            it: Aperto
            en: Open
        - value: done
          label:
            it: Fatto
            en: Done
  triggers:
  - key: reminder_due
    description: Email the owner on the day of a reminder
    'on':
      date:
        collection: reminders
        field: due
        offsetDays: 0
        hour: 7
      where:
        status: open
    notify:
      to: owner
      subject:
        it: 'Promemoria: {record.title}'
        en: 'Reminder: {record.title}'
      body:
        it: 'Ciao! Ti ricordo: {record.title} (ore {record.time}).'
        en: 'Hi! Just a reminder: {record.title} (at {record.time}).'
      link: reminders
  views:
  - key: home
    type: page
    nav: false
    sections:
    - type: hero
      title:
        it: Un assistente che **si ricorda** di te.
        en: An assistant that **remembers** you.
      text:
        it: 'Racconta impegni, persone e obiettivi: MemoAmico li ricorda, ti manda i promemoria e ogni domenica ti riassume
          la settimana. I tuoi dati sono solo tuoi.'
        en: 'Tell it your plans, people and goals: MemoAmico remembers them, sends your reminders and recaps your week every
          Sunday. Your data is yours alone.'
      actions:
      - label:
          it: Inizia gratis
          en: Start free
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Chatta
          en: Chat
        text:
          it: Scrivi come parleresti a un amico.
          en: Write as you would to a friend.
        badge: 💬
      - title:
          it: Ricorda
          en: Remembers
        text:
          it: Compleanni, preferenze e progetti restano da una conversazione all'altra.
          en: Birthdays, preferences and projects persist across conversations.
        badge: 🧠
      - title:
          it: Ti avvisa
          en: Notifies you
        text:
          it: Promemoria via email e riepilogo ogni domenica.
          en: Email reminders and a recap every Sunday.
        badge: ⏰
    - type: note
      content:
        it: Piano gratuito con 30 messaggi al mese; abbonamento mensile per uso illimitato. Le notifiche push arriveranno
          con l'app mobile.
        en: Free plan with 30 messages a month; monthly subscription for unlimited use. Push notifications will come with
          the mobile app.
  - key: chat
    type: chat
    source: agent:assistant
    title:
      it: Chat
      en: Chat
    roles:
    - user
    - admin
    examples:
    - it: Ricordami di chiamare mia madre giovedì alle 18
      en: Remind me to call my mother on Thursday at 6pm
    - it: Ogni lunedì chiedimi come va la dieta
      en: Every Monday ask me how my diet is going
    - it: Il compleanno di Marco è il 14 marzo
      en: Marco's birthday is March 14
    placeholder:
      it: Scrivi un messaggio…
      en: Write a message…
  - key: memories
    type: table
    title:
      it: Cosa ricordo di te
      en: What I remember
    source: collection:memories
    columns:
    - category
    - title
    - detail
    export: true
    roles:
    - user
    - admin
  - key: edit_memory
    type: form
    title:
      it: Modifica ricordo
      en: Edit memory
    collection: memories
    edit: true
    submit:
      label:
        it: Salva
        en: Save
      message:
        it: Salvato
        en: Saved
      redirect: memories
    nav: false
    roles:
    - user
    - admin
  - key: reminders
    type: table
    title:
      it: Promemoria
      en: Reminders
    source: collection:reminders
    columns:
    - title
    - due
    - time
    - repeat
    - status
    roles:
    - user
    - admin
  - key: recap
    type: instances
    template: weekly_recap
    title:
      it: Riepilogo domenicale
      en: Sunday recap
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Plan
    roles:
    - user
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: unlimited
      price: 6
      interval: month
      label:
        it: MemoAmico Illimitato
        en: MemoAmico Unlimited
      includes:
      - unlimited messages
  notifications:
    emailOnRunDone: false
  extensions:
  - key: push_notifications
    description: 'Push notifications on the phone are not available yet: reminders are sent by email on the due day (exact
      hour not supported).'
  - key: delete_memory
    description: Deleting single memories from the Memories page needs a row-delete action not yet available in table views;
      for now the user edits records and asks the assistant to forget.
  - key: admin_privacy
    description: Admins of the app can technically read user-owned records; strict exclusion of admins from conversations
      and memories is not expressible in the manifest.
