apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: memoamico
  displayName: MemoAmico
  tagline:
    it: L'assistente personale che si ricorda di te.
    en: The personal assistant that remembers you.
  description:
    it: 'Chatta in linguaggio naturale: MemoAmico ricorda impegni, persone e obiettivi, crea promemoria e ogni domenica ti
      manda il riepilogo della settimana. Tutto resta privato.'
    en: 'Chat in plain language: MemoAmico remembers your commitments, people and goals, creates reminders and every Sunday
      gives you a weekly recap. Everything stays private.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#2f3e6b'
      accent: '#e07a5f'
      background: '#faf8f5'
      foreground: '#1f2430'
    fonts:
      body: Inter
      display: Nunito
    wordmark:
    - text: Memo
      color: primary
    - text: Amico
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Privacy
        en: Privacy
      href: '#privacy'
    cta:
      label:
        it: Inizia
        en: Start
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: user
      label:
        it: Utente
        en: User
      assignedBy: signup
  limits:
  - action: chat
    per: user
    max: 60
    window: hour
    roles:
    - user
  agents:
  - key: assistant
    role: main
    description: Personal assistant with long-term private memory per user; saves facts and reminders.
    memory: user
    profile:
      inline:
        display_name: MemoAmico assistant
        crews:
        - id: assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are MemoAmico, a warm, concise personal assistant with long-term memory, speaking the user''s
            language (ISO code given in the goal). Your memory (read at every task) plus the records you can read with the
            tools memory_read and reminder_read are everything you know about the user. Rules:

            1. When the user tells you something worth keeping (birthdays, people, preferences, habits, goals, ongoing projects),
            save it with memory_write (fields: category = person|preference|habit|goal|project|event|other, text, date if
            any) and say briefly what you saved. Do not save trivia or sensitive data the user did not mean to share.

            2. When the user asks for a reminder ("remind me to call my mum Thursday at 6pm", "every Monday ask me about my
            diet"), create it with reminder_write: title, due (ISO 8601 date-time in the user''s timezone Europe/Rome for
            the next occurrence), recurrence (empty, or a plain rule like ''weekly on Monday''), status ''active''. Confirm
            date, time and recurrence. If the time is ambiguous, ask one short question. Be honest: right now reminders are
            shown in the app''s Reminders page; email/push delivery is not active yet, so never promise a notification.

            3. When asked ''what do you remember about me'' use memory_read and list it; when asked to forget something, tell
            the user they can delete it on the Memory page, and mark reminders done or cancelled with reminder_write when
            asked.

            4. Use what you remember to answer in a personal way, but never invent memories or facts. Never give medical,
            legal or financial advice as fact.

            5. At the end call the tool remember once with the 5-10 most important facts about the user (they replace the
            old ones).

            Reply in short Markdown, no title needed.'
    goalTemplate: 'Today is {date}. User language: {lang}.

      Conversation so far:

      {history}

      New message from the user: {message}'
    appTools:
    - name: memory_read
      description: Read what is remembered about the user
      action: read
      collection: memories
      scope: user
    - name: memory_write
      description: Save a fact about the user (category, text, date)
      action: write
      collection: memories
      scope: user
    - name: reminder_read
      description: Read the user's reminders
      action: read
      collection: reminders
      scope: user
    - name: reminder_write
      description: Create or update a reminder (title, due, recurrence, status)
      action: write
      collection: reminders
      scope: user
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.3
  - key: recapper
    role: helper
    description: Writes the user's weekly recap every Sunday evening.
    memory: instance
    writesTo:
      collection: weekly_recaps
    profile:
      inline:
        display_name: MemoAmico weekly recap
        crews:
        - id: recapper
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write the personal weekly recap of one user, in the language given in the goal. Use memory_read
            and reminder_read to see what the user shared and their reminders. Start with "# Riepilogo / Recap — week of <date>"
            (title in the user''s language). Sections ## Done, ## Still pending, ## Coming up next week, ## A thought for
            the week. Under 250 words, warm tone. Only use real records; if there is little, say so plainly and never invent.
            Your memory holds the last recap: mention progress since then. At the end call remember once with the key points
            (they replace the old ones).'
          mcp_servers: []
    appTools:
    - name: memory_read
      description: Read what is remembered about the user
      action: read
      collection: memories
      scope: user
    - name: reminder_read
      description: Read the user's reminders
      action: read
      collection: reminders
      scope: user
  templates:
  - key: weekly_recap
    title:
      it: Riepilogo settimanale
      en: Weekly recap
    description:
      it: 'Ogni domenica sera il riepilogo della tua settimana: cose fatte e in sospeso.'
      en: 'Every Sunday evening a recap of your week: what is done and what is pending.'
    agent: recapper
    params:
    - name: focus
      type: text
      label:
        it: Cosa ti interessa di più (facoltativo)
        en: What matters most to you (optional)
    goal: 'Write this week''s recap for the user. Today is {date}. {?focus}Focus on: {focus}.{/focus}

      Write in the language with ISO code {lang}.'
    schedule:
      cron: 0 18 * * 0
      userCanChange: true
    maxPerUser: 1
    cost:
      perRun: 5
  data:
    collections:
    - name: memories
      ownedBy: user
      description: What the assistant remembers about each user. Private to the user.
      fields:
      - name: category
        type: select
        label:
          it: Categoria
          en: Category
        options:
        - person
        - preference
        - habit
        - goal
        - project
        - event
        - other
      - name: text
        type: textarea
        label:
          it: Ricordo
          en: Memory
      - name: date
        type: text
        label:
          it: Data
          en: Date
    - name: reminders
      ownedBy: user
      description: The user's reminders, one-off or recurring.
      fields:
      - name: title
        type: text
        label:
          it: Promemoria
          en: Reminder
      - name: due
        type: text
        label:
          it: Scadenza
          en: Due
      - name: recurrence
        type: text
        label:
          it: Ricorrenza
          en: Recurrence
      - name: status
        type: select
        label:
          it: Stato
          en: Status
        options:
        - active
        - done
        - cancelled
    - name: weekly_recaps
      ownedBy: instance
      description: The weekly recaps of each user's recap instance.
  views:
  - key: home
    type: page
    nav: false
    title: MemoAmico
    sections:
    - type: hero
      title:
        it: Un assistente che **si ricorda** di te.
        en: An assistant that **remembers** you.
      text:
        it: 'Racconta i tuoi impegni, le persone importanti, le tue abitudini: MemoAmico lo ricorda tra una conversazione
          e l''altra, crea promemoria e ogni domenica ti riassume la settimana.'
        en: 'Tell it about your commitments, important people and habits: MemoAmico remembers between conversations, creates
          reminders and sums up your week every Sunday.'
      actions:
      - label:
          it: Inizia gratis
          en: Start free
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Chatta
          en: Chat
        text:
          it: Scrivi in modo naturale, come a un amico.
          en: Write naturally, like to a friend.
        badge: 💬
      - title:
          it: Ricorda
          en: It remembers
        text:
          it: 'Compleanni, preferenze, progetti: costruisce il tuo profilo privato.'
          en: 'Birthdays, preferences, projects: it builds your private profile.'
        badge: 🧠
      - title:
          it: Promemoria e riepilogo
          en: Reminders and recap
        text:
          it: Promemoria anche ricorrenti e riepilogo ogni domenica sera.
          en: Reminders, even recurring, and a recap every Sunday evening.
        badge: ⏰
    - type: cards
      id: privacy
      title:
        it: La tua privacy
        en: Your privacy
      items:
      - title:
          it: Solo tuo
          en: Only yours
        text:
          it: 'I ricordi sono visibili solo a te: nessun amministratore ha una schermata per leggerli.'
          en: 'Memories are visible only to you: no admin has a screen to read them.'
      - title:
          it: Sotto il tuo controllo
          en: Under your control
        text:
          it: Vedi e cancelli quello che l'assistente ricorda quando vuoi.
          en: See and delete what the assistant remembers whenever you want.
    - type: note
      content:
        it: MemoAmico non offre consulenza medica, legale o finanziaria.
        en: MemoAmico does not give medical, legal or financial advice.
  - key: chat
    type: chat
    title:
      it: Chat
      en: Chat
    source: agent:assistant
    roles:
    - user
    placeholder:
      it: Scrivi a MemoAmico…
      en: Write to MemoAmico…
    examples:
    - it: Ricordami di chiamare mia madre giovedì alle 18
      en: Remind me to call my mum on Thursday at 6pm
    - it: Ogni lunedì chiedimi come va la dieta
      en: Every Monday ask me how my diet is going
    - it: Il compleanno di Marco è il 12 marzo
      en: Marco's birthday is March 12
    - it: Cosa ricordi di me?
      en: What do you remember about me?
  - key: memory
    type: table
    title:
      it: Cosa ricordo di te
      en: What I remember about you
    source: collection:memories
    roles:
    - user
    data:
      display: table
      fields:
      - key: category
        label:
          it: Categoria
          en: Category
        format: badge
      - key: text
        label:
          it: Ricordo
          en: Memory
      - key: date
        label:
          it: Data
          en: Date
      limit: 200
      empty:
        it: Ancora nessun ricordo.
        en: No memories yet.
  - key: reminders
    type: table
    title:
      it: Promemoria
      en: Reminders
    source: collection:reminders
    roles:
    - user
    data:
      display: table
      fields:
      - key: title
        label:
          it: Promemoria
          en: Reminder
      - key: due
        label:
          it: Scadenza
          en: Due
      - key: recurrence
        label:
          it: Ricorrenza
          en: Recurrence
      - key: status
        label:
          it: Stato
          en: Status
        format: badge
      sort:
        field: due
        dir: asc
      limit: 200
      empty:
        it: Nessun promemoria.
        en: No reminders.
  - key: recap
    type: instances
    template: weekly_recap
    title:
      it: Riepilogo settimanale
      en: Weekly recap
    roles:
    - user
  - key: account
    type: account
    title:
      it: Piano e messaggi
      en: Plan and messages
    roles:
    - user
  billing:
    modes:
    - credits
    - subscription
    currency: eur
    signupCredits: 30
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:assistant: 1
    packs:
    - key: msgs100
      credits: 100
      price: 3
      label:
        it: 100 messaggi
        en: 100 messages
    plans:
    - key: unlimited
      price: 6.99
      interval: month
      label:
        it: Illimitato
        en: Unlimited
      includes:
      - unlimited messages
      - weekly recap
      credits: 100000
      creditsReset: monthly
  extensions:
  - key: reminder_delivery
    description: 'Delivering reminders at the due time (email now, push on the phone later) is not available yet: notifications
      are not supported. Reminders are stored and shown in the Reminders page; the agent says so honestly. The weekly recap
      is likewise shown in the app, not emailed.'
  - key: memory_delete_ui
    description: A per-row delete button on the Memory page may need runtime support for deleting records; until then the
      user asks the assistant or an owner-scoped delete action is needed.
  - key: admin_privacy
    description: No admin role or admin view is declared, so no screen exposes conversations. Platform-level run records exist
      as built-ins and must be restricted to their owner by the runtime.
