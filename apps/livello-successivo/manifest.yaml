apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: livello-successivo
  displayName: Livello Successivo
  tagline:
    it: 'Dal gioco ai risultati: competenze, recuperi e report per ogni classe.'
    en: 'From game to results: skills, recovery plans and reports for every class.'
  description:
    it: Piattaforma di gestione e analisi per un prodotto di apprendimento basato sul gioco, per scuole e aziende. Riceve
      gli eventi di gioco, stima la competenza per obiettivo, individua chi è in difficoltà e prepara report e lezioni.
    en: Management and analytics platform for a game-based learning product, for schools and companies. It receives game events,
      estimates skill per objective, spots who is struggling and prepares reports and lessons.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: dashboard
  branding:
    theme: light
    palette:
      primary: '#1f2a6b'
      accent: '#f28c28'
      background: '#f7f8fc'
      foreground: '#16182b'
    fonts:
      body: Inter
      display: Poppins
    wordmark:
    - text: Livello
      color: primary
    - text: Successivo
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Privacy
        en: Privacy
      href: '#privacy'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: teacher
      label:
        it: Docente / formatore
        en: Teacher / trainer
      assignedBy: invite
    - key: school
      label:
        it: Scuola / azienda (dati aggregati)
        en: School / company (aggregate data)
      assignedBy: invite
    - key: user
      label:
        it: Studente
        en: Student
      assignedBy: signup
  limits:
  - action: chat
    per: user
    max: 40
    window: day
    roles:
    - teacher
  agents:
  - key: analyst
    role: scheduled
    description: Analizza gli eventi di gioco di una classe, stima la competenza per studente e obiettivo, assegna badge e
      scrive il report settimanale.
    memory: instance
    writesTo:
      collection: class_reports
      parse: whole
    appTools:
    - name: read_events
      description: Legge gli eventi di gioco delle classi del docente
      action: read
      collection: game_events
      scope: all
    - name: write_assessment
      description: Salva la stima di competenza di uno studente su un obiettivo
      action: write
      collection: assessments
    - name: write_badge
      description: Assegna un badge a uno studente
      action: write
      collection: badges
    - name: write_summary
      description: Salva il riepilogo aggregato (senza nomi) di una classe per obiettivo
      action: write
      collection: class_summaries
    profile:
      inline:
        display_name: Livello Successivo analyst
        crews:
        - id: analyst
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un analista di apprendimento. Ogni settimana analizzi gli eventi di gioco (livello, risposte
            corrette, tempo, errori) di UNA classe. Procedura: 1) leggi gli eventi della classe con read_events (filtra per
            class_code); 2) per ogni studente (student_id) e obiettivo stima un livello di competenza 0-100 e una fascia (struggling,
            developing, proficient, advanced) basandoti SOLO sui dati; indica nell''evidenza quante partite/risposte sono
            alla base e dichiara bassa affidabilità se i dati sono pochi; 3) salva ogni stima con write_assessment (campi:
            class_code, student_id, student_email, teacher_email, objective, level_estimate, band, evidence, suggestion, updated);
            4) assegna badge con write_badge per traguardi reali (primo livello completato, miglioramento costante, obiettivo
            padroneggiato); 5) salva con write_summary un riepilogo aggregato per obiettivo (class_code, teacher_email, objective,
            avg_level, struggling_count, students, week) senza alcun dato personale. Non inventare numeri, non giudicare le
            persone: parla di competenze, non di capacità. Usa solo gli identificativi pseudonimi (student_id), mai nomi.
            Report finale in Markdown che inizia con "# " titolo (Classe <nome> — settimana del <data>), con sezioni: ## Sintesi,
            ## Competenza per obiettivo (con grafico), ## Chi ha bisogno di supporto (student_id, obiettivo, motivo), ## Attività
            di recupero (3-5 attività concrete), ## Domande per la discussione in classe, ## Cambiamenti rispetto alla settimana
            scorsa. Aggiungi un grafico come blocco ```chart con JSON {"type":"bar","title":"…","labels":[…],"series":[{"name":"…","values":[…]}],"unit":"%"}.
            Al termine chiama remember con i 5 punti chiave.'
  - key: coach
    role: helper
    description: Chat che aiuta il docente a preparare la lezione partendo dai risultati.
    appTools:
    - name: read_assessments
      description: Legge le stime di competenza degli studenti delle classi del docente
      action: read
      collection: assessments
      scope: all
    - name: read_summaries
      description: Legge i riepiloghi aggregati per classe e obiettivo
      action: read
      collection: class_summaries
      scope: all
    goalTemplate: 'Conversazione finora:

      {history}


      Nuovo messaggio del docente {user}: {message}

      Rispondi in lingua {lang}. Data: {date}.'
    profile:
      inline:
        display_name: Livello Successivo coach
        crews:
        - id: coach
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un assistente didattico per docenti e formatori. Aiuti a preparare lezioni, attività di recupero
            e discussioni partendo dai risultati reali della classe, che leggi con read_assessments e read_summaries. Proponi
            piani di lezione concreti (obiettivo, durata, attività, domande, verifica). Non inventare dati: se mancano, dillo.
            Parla di studenti solo con identificativi pseudonimi, non cercare di identificare minori. Sii breve e pratico.'
  templates:
  - key: class_watch
    title:
      it: Classe
      en: Class
    description:
      it: Una classe con il suo codice, i percorsi scelti e un report settimanale.
      en: A class with its code, chosen paths and a weekly report.
    agent: analyst
    params:
    - name: class_name
      type: text
      required: true
      label:
        it: Nome della classe
        en: Class name
    - name: class_code
      type: text
      required: true
      label:
        it: Codice classe (per gli studenti)
        en: Class code (for students)
    - name: objectives
      type: multiselect
      required: true
      label:
        it: Obiettivi didattici
        en: Learning objectives
      options:
      - value: educazione_finanziaria
        label:
          it: Educazione finanziaria
          en: Financial literacy
      - value: sicurezza_lavoro
        label:
          it: Sicurezza sul lavoro
          en: Workplace safety
      - value: cittadinanza_digitale
        label:
          it: Cittadinanza digitale
          en: Digital citizenship
    goal: 'Analizza la classe "{class_name}" (class_code: {class_code}) sugli obiettivi: {objectives}. Oggi è {date}. Scrivi
      il report settimanale nella lingua con codice ISO {lang}.'
    schedule:
      cron: 0 6 * * 1
      userCanChange: false
    maxPerUser: 10
    roles:
    - teacher
    - admin
    deliver:
      to: owner
      subject: Report settimanale della classe — {title}
      onlyIfNew: true
  views:
  - key: home
    type: page
    nav: false
    sections:
    - type: hero
      eyebrow:
        it: Per scuole e aziende
        en: For schools and companies
      title:
        it: Dal gioco ai **risultati di apprendimento**
        en: From game to **learning results**
      text:
        it: Livello Successivo raccoglie gli eventi delle partite, stima la competenza di ogni studente su ogni obiettivo
          e consegna al docente recuperi, domande per la classe e un report ogni settimana.
        en: Livello Successivo collects game events, estimates each student's skill on each objective and gives teachers recovery
          activities, discussion questions and a weekly report.
      actions:
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Crea la classe
          en: Create the class
        text:
          it: Il docente crea la classe, sceglie i percorsi e condivide il codice con gli studenti.
          en: The teacher creates the class, picks the paths and shares the code.
        badge: 🏫
      - title:
          it: Gli studenti giocano
          en: Students play
        text:
          it: Ogni partita invia livello, risposte, tempo ed errori alla piattaforma.
          en: Each game sends level, answers, time and errors to the platform.
        badge: 🎮
      - title:
          it: L'agente analizza
          en: The agent analyses
        text:
          it: Stima della competenza, studenti in difficoltà, attività di recupero e domande per la discussione.
          en: Skill estimates, struggling students, recovery activities and discussion questions.
        badge: 📊
      - title:
          it: Report e chat
          en: Report and chat
        text:
          it: Report settimanale via email e una chat per preparare la lezione.
          en: Weekly email report and a chat to prepare the lesson.
        badge: 💬
    - type: cards
      id: privacy
      title:
        it: Dati dei minori con cura
        en: Minors' data, handled with care
      items:
      - title:
          it: Il docente vede solo le sue classi
          en: Teachers see only their classes
        text:
          it: Ogni docente accede solo ai dati delle classi che gli sono assegnate.
          en: Each teacher only reaches the data of their own classes.
      - title:
          it: La scuola vede solo aggregati
          en: Schools see aggregates only
        text:
          it: Dirigenza e responsabili formazione vedono medie per classe e obiettivo, mai singoli studenti.
          en: School leaders see class and objective averages, never individual students.
      - title:
          it: Pseudonimi e conservazione limitata
          en: Pseudonyms and limited retention
        text:
          it: Gli eventi usano identificativi pseudonimi e vengono cancellati dopo 12 mesi.
          en: Events use pseudonymous IDs and are deleted after 12 months.
    - type: note
      content:
        it: 'Strumento di supporto alla didattica: le stime sono indicative e non sostituiscono la valutazione del docente.'
        en: 'A teaching support tool: estimates are indicative and do not replace the teacher''s judgement.'
  - key: classes
    type: instances
    template: class_watch
    title:
      it: Le mie classi
      en: My classes
    roles:
    - teacher
    - admin
  - key: reports
    type: list
    title:
      it: Report settimanali
      en: Weekly reports
    source: collection:class_reports
    export: false
    roles:
    - teacher
    - admin
    data:
      display: list
      fields:
      - key: title
        label:
          it: Report
          en: Report
      - key: week
        label:
          it: Settimana
          en: Week
        format: date
      sort:
        field: week
        dir: desc
      limit: 50
  - key: students
    type: table
    title:
      it: Competenze degli studenti
      en: Student skills
    source: collection:assessments
    roles:
    - teacher
    - admin
    export: true
    data:
      display: table
      fields:
      - key: class_code
        label:
          it: Classe
          en: Class
      - key: student_id
        label:
          it: Studente
          en: Student
      - key: objective
        label:
          it: Obiettivo
          en: Objective
      - key: level_estimate
        label:
          it: Livello stimato
          en: Estimated level
        format: number
      - key: band
        label:
          it: Fascia
          en: Band
        format: badge
      - key: suggestion
        label:
          it: Suggerimento
          en: Suggestion
      sort:
        field: updated
        dir: desc
      limit: 200
  - key: coach_chat
    type: chat
    title:
      it: Prepara la lezione
      en: Prepare the lesson
    source: agent:coach
    roles:
    - teacher
    - admin
    placeholder:
      it: Chiedi un piano di lezione dai risultati…
      en: Ask for a lesson plan from the results…
    examples:
    - it: Prepara una lezione di recupero sugli obiettivi più deboli
      en: Prepare a recovery lesson on the weakest objectives
    - it: Dammi 5 domande per la discussione in classe
      en: Give me 5 class discussion questions
  - key: school_overview
    type: table
    title:
      it: Panoramica scuola (aggregati)
      en: School overview (aggregate)
    source: collection:class_summaries
    roles:
    - school
    - admin
    export: true
    data:
      display: chart
      chart: bar
      fields:
      - key: objective
        label:
          it: Obiettivo
          en: Objective
      - key: avg_level
        label:
          it: Livello medio
          en: Average level
      groupBy:
        field: objective
        aggs:
        - key: avg_level
          agg: avg
          field: avg_level
        - key: struggling
          agg: sum
          field: struggling_count
      limit: 100
  - key: my_progress
    type: cards
    title:
      it: I miei progressi
      en: My progress
    source: collection:assessments
    roles:
    - user
    data:
      display: cards
      fields:
      - key: objective
        label:
          it: Obiettivo
          en: Objective
      - key: level_estimate
        label:
          it: Livello
          en: Level
        format: number
      - key: band
        label:
          it: Fascia
          en: Band
        format: badge
      sort:
        field: updated
        dir: desc
      limit: 50
  - key: my_badges
    type: cards
    title:
      it: I miei badge
      en: My badges
    source: collection:badges
    roles:
    - user
    data:
      display: cards
      fields:
      - key: badge
        label: Badge
      - key: objective
        label:
          it: Obiettivo
          en: Objective
      - key: awarded
        label:
          it: Data
          en: Date
        format: date
      sort:
        field: awarded
        dir: desc
      limit: 50
  - key: account
    type: account
    title:
      it: Licenza
      en: License
    roles:
    - admin
    - teacher
    - school
  data:
    collections:
    - name: game_events
      ownedBy: org
      description: Eventi inviati dal gioco (pseudonimi)
      retentionDays: 365
      fields:
      - name: class_code
        type: text
        required: true
      - name: student_id
        type: text
        required: true
      - name: student_email
        type: email
      - name: teacher_email
        type: email
        required: true
      - name: objective
        type: text
      - name: path
        type: text
      - name: level
        type: number
      - name: question_id
        type: text
      - name: correct
        type: boolean
      - name: seconds
        type: number
      - name: errors
        type: number
      - name: played_at
        type: date
      access:
      - role: teacher
        where:
          teacher_email: '{user.email}'
        can:
        - read
    - name: assessments
      ownedBy: org
      description: Stima di competenza per studente e obiettivo
      retentionDays: 365
      fields:
      - name: class_code
        type: text
      - name: student_id
        type: text
      - name: student_email
        type: email
      - name: teacher_email
        type: email
      - name: objective
        type: text
      - name: level_estimate
        type: number
      - name: band
        type: select
        options:
        - struggling
        - developing
        - proficient
        - advanced
      - name: evidence
        type: textarea
      - name: suggestion
        type: textarea
      - name: updated
        type: date
      access:
      - role: teacher
        where:
          teacher_email: '{user.email}'
        can:
        - read
      - role: user
        where:
          student_email: '{user.email}'
        can:
        - read
    - name: badges
      ownedBy: org
      description: Badge degli studenti
      retentionDays: 365
      fields:
      - name: student_id
        type: text
      - name: student_email
        type: email
      - name: teacher_email
        type: email
      - name: objective
        type: text
      - name: badge
        type: text
      - name: awarded
        type: date
      access:
      - role: teacher
        where:
          teacher_email: '{user.email}'
        can:
        - read
      - role: user
        where:
          student_email: '{user.email}'
        can:
        - read
    - name: class_summaries
      ownedBy: org
      description: Riepiloghi aggregati per classe e obiettivo, senza dati personali
      retentionDays: 1095
      fields:
      - name: class_code
        type: text
      - name: teacher_email
        type: email
      - name: school
        type: text
      - name: objective
        type: text
      - name: avg_level
        type: number
      - name: struggling_count
        type: number
      - name: students
        type: number
      - name: week
        type: date
      access:
      - role: teacher
        where:
          teacher_email: '{user.email}'
        can:
        - read
      - role: school
    - name: class_reports
      ownedBy: instance
      description: Report settimanali di ogni classe
      retentionDays: 365
      fields:
      - name: title
        type: text
      - name: week
        type: date
      - name: body
        type: textarea
  triggers:
  - key: game_event
    description: Evento di gioco ricevuto dal gioco
    'on':
      webhook: true
    write:
      collection: game_events
      fields:
        class_code: class_code
        student_id: student_id
        student_email: student_email
        teacher_email: teacher_email
        objective: objective
        path: path
        level: level
        question_id: question_id
        correct: correct
        seconds: seconds
        errors: errors
        played_at: played_at
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: school_annual
      price: 1200
      interval: year
      label:
        it: Licenza annuale scuola
        en: School annual license
      includes:
      - classi illimitate
      - report settimanali
      - chat didattica
      roles:
      - school
      - admin
    - key: company_annual
      price: 2400
      interval: year
      label:
        it: Licenza annuale azienda
        en: Company annual license
      includes:
      - classi illimitate
      - report settimanali
      - chat didattica
      roles:
      - school
      - admin
  extensions:
  - key: game_connection
    description: Il gioco (sviluppato a parte) invia gli eventi con POST a /api/hooks/game_event usando il secret dell'app,
      includendo class_code, student_id pseudonimo, teacher_email e student_email se lo studente ha un account. L'iscrizione
      con codice classe avviene nel gioco.
  - key: minors_compliance
    description: Consenso dei genitori, informativa GDPR e nomina a responsabile del trattamento vanno gestiti contrattualmente
      con la scuola; non sono modellati qui.
