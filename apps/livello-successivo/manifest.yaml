apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: livello-successivo
  displayName: Livello Successivo
  tagline:
    it: Dal gioco ai risultati di apprendimento, classe per classe.
    en: From gameplay to learning outcomes, class by class.
  description:
    it: 'Piattaforma di gestione e analisi per l''apprendimento basato sul gioco: classi, percorsi, stima delle competenze,
      report settimanali e un assistente per preparare la lezione.'
    en: 'Management and analytics platform for game-based learning: classes, learning paths, skill estimates, weekly reports
      and a lesson-planning assistant.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: dashboard
  branding:
    theme: light
    palette:
      primary: '#1f2a5a'
      accent: '#f28c28'
      background: '#f7f8fc'
      foreground: '#161a2e'
    fonts:
      body: Inter
      display: Poppins
    wordmark:
    - text: Livello
      color: primary
    - text: Successivo
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Privacy
        en: Privacy
      href: '#privacy'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: school
      label:
        it: Referente scuola/azienda
        en: School/company lead
      assignedBy: invite
    - key: teacher
      label:
        it: Docente/formatore
        en: Teacher/trainer
      assignedBy: invite
    - key: student
      label:
        it: Studente
        en: Student
      assignedBy: signup
  limits:
  - action: chat
    per: user
    max: 60
    window: day
    roles:
    - teacher
  agents:
  - key: class_analyst
    role: scheduled
    description: Analizza ogni settimana gli eventi di gioco di una classe, stima la competenza per obiettivo e suggerisce
      recuperi.
    memory: instance
    profile:
      inline:
        display_name: Analista di classe
        crews:
        - id: analyst
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un analista didattico. Leggi con lo strumento read_events gli eventi di gioco della classe (livello
            raggiunto, risposte, tempo, errori, obiettivo didattico, pseudonimo dello studente). Scrivi il report settimanale
            per il docente. Inizia con un titolo ''# <Classe> — settimana del <data>''. Sezioni ##: Sintesi della classe;
            Competenza per obiettivo (tabella: studente pseudonimo, obiettivo, livello stimato Base/Intermedio/Avanzato, affidabilità
            della stima in base al numero di eventi); Chi è in difficoltà (con motivazione basata sui dati); Attività di recupero
            (concrete, 15-30 minuti); Domande per la discussione in classe; Badge meritati. Aggiungi un blocco ```chart con
            la competenza media per obiettivo (valori reali). Usa solo pseudonimi, mai dati personali. Non inventare dati:
            se gli eventi sono pochi, dillo e abbassa l''affidabilità. Le stime sono di supporto, non valutazioni formali.
            Alla fine chiama remember con i 5 punti chiave della settimana: il report confronta con la settimana precedente.'
          mcp_servers: []
    appTools:
    - name: read_events
      description: Eventi di gioco della classe corrente
      action: read
      collection: game_events
      scope: session
    writesTo:
      collection: class_reports
      parse: whole
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.5
  - key: lesson_coach
    role: main
    description: Chat che aiuta il docente a preparare la lezione dai risultati.
    profile:
      inline:
        display_name: Assistente alla lezione
        crews:
        - id: coach
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un assistente per docenti e formatori. Aiuti a preparare lezioni, attività di recupero e discussioni
            partendo dai report della classe, che leggi con read_reports. Rispondi in modo pratico e breve, con scalette temporali
            e domande. Non inventare risultati: se non trovi i dati, chiedi quale classe. Parla solo di studenti con i loro
            pseudonimi. Non dare giudizi formali sugli studenti.'
    appTools:
    - name: read_reports
      description: Report settimanali delle classi del docente
      action: read
      collection: class_reports
      scope: user
    goalTemplate: 'Conversazione finora:

      {history}


      Nuovo messaggio del docente: {message}

      Rispondi in lingua {lang}.'
    output: markdown
  templates:
  - key: class
    title:
      it: Classe
      en: Class
    description:
      it: Una classe con i suoi percorsi di gioco e un report settimanale.
      en: A class with its game paths and a weekly report.
    agent: class_analyst
    params:
    - name: class_name
      type: text
      required: true
      label:
        it: Nome classe
        en: Class name
    - name: paths
      type: multiselect
      required: true
      label:
        it: Percorsi di gioco
        en: Game paths
      options:
      - value: financial
        label:
          it: Educazione finanziaria
          en: Financial literacy
      - value: safety
        label:
          it: Sicurezza sul lavoro
          en: Workplace safety
      - value: digital
        label:
          it: Cittadinanza digitale
          en: Digital citizenship
    - name: join_code
      type: text
      required: true
      label:
        it: Codice di invito
        en: Invite code
      help:
        it: Lo comunichi agli studenti
        en: Share it with students
    schedule:
      cron: 0 6 * * 1
      userCanChange: false
    maxPerUser: 10
    roles:
    - teacher
    - school
    - admin
    goal: 'Classe "{instance}" ({class_name}), percorsi: {paths}. Oggi è {date}. Scrivi il report settimanale in lingua {lang}.'
  triggers:
  - key: game_event_in
    description: Il gioco invia gli eventi di una partita
    'on':
      webhook: true
    start:
      agent: class_analyst
    goal: Registra l'evento {event}
    asUser: true
  views:
  - key: home
    type: page
    nav: false
    sections:
    - type: hero
      eyebrow:
        it: Per scuole e aziende
        en: For schools and companies
      title:
        it: Dal gioco ai **risultati di apprendimento**
        en: From gameplay to **learning outcomes**
      text:
        it: Crea la classe, invita gli studenti con un codice, scegli i percorsi. Un agente stima la competenza su ogni obiettivo,
          trova chi è in difficoltà e ti propone recuperi e domande per la classe.
        en: Create a class, invite students with a code, pick the paths. An agent estimates skills per objective, spots who
          struggles and suggests remedial activities and discussion questions.
      actions:
      - label:
          it: Accedi
          en: Sign in
        href: /login
        style: primary
      band: true
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Crea la classe
          en: Create the class
        text:
          it: Scegli i percorsi legati agli obiettivi didattici e condividi il codice.
          en: Choose paths tied to learning goals and share the code.
        badge: 🏫
      - title:
          it: Gli studenti giocano
          en: Students play
        text:
          it: Ogni partita invia livello, risposte, tempi ed errori.
          en: Each game sends level, answers, time and errors.
        badge: 🎮
      - title:
          it: Report settimanale
          en: Weekly report
        text:
          it: Competenze, studenti da supportare, attività di recupero.
          en: Skills, students to support, remedial activities.
        badge: 📊
      - title:
          it: Prepara la lezione
          en: Plan the lesson
        text:
          it: Una chat parte dai risultati per costruire la lezione.
          en: A chat builds the lesson from the results.
        badge: 💬
    - type: cards
      id: privacy
      title:
        it: Dati dei minori con cura
        en: Minors' data, handled with care
      items:
      - title:
          it: Il docente vede solo le sue classi
          en: Teachers see only their classes
      - title:
          it: Pseudonimi nei report
          en: Pseudonyms in reports
      - title:
          it: La scuola vede solo dati aggregati
          en: Schools see aggregates only
    - type: note
      content:
        it: Le stime sono un supporto alla didattica, non una valutazione formale.
        en: Estimates support teaching; they are not a formal assessment.
  - key: classes
    type: instances
    template: class
    title:
      it: Le mie classi
      en: My classes
    roles:
    - teacher
    - school
    - admin
  - key: reports
    type: table
    title:
      it: Report settimanali
      en: Weekly reports
    source: collection:class_reports
    data:
      display: list
      fields:
      - key: title
        label:
          it: Report
      - key: createdAt
        label:
          it: Data
        format: date
      sort:
        field: createdAt
        dir: desc
      limit: 50
    roles:
    - teacher
    - admin
  - key: coach
    type: chat
    source: agent:lesson_coach
    title:
      it: Prepara la lezione
      en: Plan the lesson
    examples:
    - it: Prepara 30 minuti di recupero per chi è in difficoltà
      en: Prepare 30 minutes of remedial work for struggling students
    - it: Dammi 5 domande di discussione dal report
      en: Give me 5 discussion questions from the report
    placeholder:
      it: Chiedi aiuto per la lezione…
      en: Ask for lesson help…
    roles:
    - teacher
    - admin
  - key: school_overview
    type: dashboard
    title:
      it: 'Scuola: dati aggregati'
      en: 'School: aggregates'
    children:
    - school_kpi
    roles:
    - school
    - admin
  - key: school_kpi
    type: cards
    source: collection:school_stats
    data:
      display: kpi
      kpis:
      - label:
          it: Classi attive
          en: Active classes
        agg: count
      - label:
          it: Competenza media
          en: Average skill
        agg: avg
        field: avg_skill
        format: percent
    nav: false
  - key: my_progress
    type: cards
    title:
      it: I miei progressi e badge
      en: My progress and badges
    source: collection:student_progress
    data:
      display: cards
      fields:
      - key: objective
        label:
          it: Obiettivo
      - key: level
        label:
          it: Livello
        format: badge
      - key: badges
        label:
          it: Badge
    roles:
    - student
  - key: account
    type: account
    title:
      it: Licenza
      en: License
    roles:
    - school
    - admin
  schedules: []
  data:
    collections:
    - name: game_events
      ownedBy: instance
      description: 'Eventi inviati dal gioco: pseudonimo studente, obiettivo, livello, risposta, tempo, errori'
      fields:
      - name: student
        type: text
      - name: objective
        type: text
      - name: level
        type: number
      - name: answer
        type: text
      - name: correct
        type: boolean
      - name: seconds
        type: number
      - name: errors
        type: number
    - name: class_reports
      ownedBy: instance
      description: Report settimanale di ciascuna classe
    - name: student_progress
      ownedBy: user
      description: Progressi e badge del singolo studente
      fields:
      - name: objective
        type: text
      - name: level
        type: text
      - name: badges
        type: text
    - name: school_stats
      ownedBy: app
      description: Dati aggregati anonimi per scuola/azienda
      fields:
      - name: org
        type: text
      - name: avg_skill
        type: number
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: school_year
      price: 1200
      interval: year
      label:
        it: Licenza annuale scuola
        en: School annual license
      includes:
      - classi illimitate
      - report settimanali
      - chat docente
      roles:
      - school
      - admin
    - key: company_year
      price: 2400
      interval: year
      label:
        it: Licenza annuale azienda
        en: Company annual license
      includes:
      - classi illimitate
      - report settimanali
      - chat formatore
      roles:
      - school
      - admin
  extensions:
  - key: event_ingestion
    description: Il gioco deve inviare gli eventi al webhook con segreto dell'app e indicare la classe (codice di invito).
      Il webhook scrive in game_events della classe; la verifica del codice e l'autenticazione del gioco vanno completate
      fuori dal manifest.
  - key: student_join
    description: 'Ingresso dello studente con codice di invito e collegamento account studente alla classe non ancora espressi:
      oggi il progresso dello studente (student_progress) e i dati aggregati di scuola (school_stats) richiedono un passo
      di sincronizzazione dedicato.'
  - key: weekly_email
    description: 'L''invio via email del report settimanale al docente non è ancora disponibile: il docente lo trova nella
      vista Report.'
