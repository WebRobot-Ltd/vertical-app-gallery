apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: menuglobale
  displayName: MenuGlobale
  tagline:
    it: Il menu del tuo locale in oltre cento lingue, con allergeni.
    en: Your venue's menu in 100+ languages, with allergens.
  description:
    it: 'Inserisci i piatti o carica la foto del menu cartaceo: un agente ricava le voci, le traduce e segnala gli allergeni.
      I clienti lo aprono dal QR code al tavolo.'
    en: 'Enter your dishes or upload a photo of the paper menu: an agent extracts the items, translates them and flags allergens.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#7a2e1d'
      accent: '#d9822b'
      background: '#fffaf3'
      foreground: '#2a1c16'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Menu
      color: primary
    - text: Globale
      color: accent
  header:
    links:
    - label: Come funziona
      href: '#come-funziona'
    - label: Allergeni
      href: '#allergeni'
    cta:
      label: Accedi
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      label: Ristoratore
      assignedBy: signup
  limits:
  - action: agent:importer
    per: user
    max: 10
    window: day
    roles:
    - user
  - action: agent:translator
    per: user
    max: 200
    window: day
    roles:
    - user
  - action: chat
    per: user
    max: 50
    window: day
    roles:
    - user
  agents:
  - key: importer
    role: main
    description: Legge la foto o il testo del menu cartaceo e crea le voci da controllare.
    profile:
      inline:
        display_name: MenuGlobale importer
        crews:
        - id: importer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un assistente che trasforma il menu cartaceo di un locale in voci digitali. Se l''utente ha
            caricato foto o scansioni, chiama read_upload con l''id del file per leggerle. Per ogni piatto o bevanda trovata
            chiama save_dish con name, description, price (numero in euro, vuoto se illeggibile), category (antipasti, primi,
            secondi, contorni, dolci, bevande, altro), allergens (solo tra: glutine, crostacei, uova, pesce, arachidi, soia,
            latte, frutta_a_guscio, sedano, senape, sesamo, solfiti, lupini, molluschi) e available=true. Gli allergeni sono
            una STIMA dagli ingredienti dichiarati: non inventare ingredienti e segna ''da verificare'' nella descrizione
            quando sei incerto. Imposta status="da_controllare". Chiudi con un report che inizia con ''# Menu importato —
            <n> voci'' e una tabella delle voci, evidenziando prezzi o allergeni dubbi che il ristoratore deve controllare.'
    goalTemplate: 'Importa il menu del locale.

      {?menu_file}File caricati: {menu_file}

      {/menu_file}{?menu_file_text}Testo estratto:

      {menu_file_text}

      {/menu_file_text}{?menu_text}Testo incollato:

      {menu_text}

      {/menu_text}Data: {date}.'
    appTools:
    - name: read_upload
      description: Legge un file caricato dall'utente (foto o scansione, OCR incluso)
      action: read_file
    - name: save_dish
      description: Crea una voce di menu del locale
      action: write
      collection: dishes
      scope: user
    output: markdown
    limits:
      maxTurns: 25
      maxBudgetUsd: 0.5
  - key: translator
    role: helper
    description: Traduce ogni piatto nelle lingue del locale, mantenendo coerenti i nomi tipici.
    profile:
      inline:
        display_name: MenuGlobale translator
        crews:
        - id: translator
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: Traduci le voci del menu di un locale nelle lingue richieste (codici ISO a due lettere). Mantieni
            i nomi tipici dei piatti (es. carbonara, tiramisù, arancini) in originale, aggiungendo una breve spiegazione nella
            lingua di destinazione. Traduci descrizioni e categorie fedelmente, senza aggiungere ingredienti né cambiare allergeni
            o prezzi. Per ogni lingua chiama save_translation con dish_id, lang, name, description, category. Prima, con list_translations,
            controlla le traduzioni esistenti dello stesso piatto e sostituiscile/aggiornale. Rispondi con un breve riepilogo.
    goalTemplate: 'Traduci il piatto {record.name} (id {record.id}).

      Descrizione: {record.description}

      Categoria: {record.category}

      Lingue richieste (codici ISO, separati da virgola): {langs}

      Se l''elenco è vuoto usa: en, fr, de, es.'
    context:
    - key: langs
      from: collection:venue_profile.languages
    appTools:
    - name: list_translations
      description: Traduzioni già salvate
      action: read
      collection: translations
      scope: user
    - name: save_translation
      description: Salva la traduzione di un piatto in una lingua
      action: write
      collection: translations
      scope: user
    output: markdown
    limits:
      maxTurns: 15
      maxBudgetUsd: 0.2
  - key: assistant
    role: helper
    description: Risponde sul menu del locale (anteprima per il ristoratore; stesso comportamento previsto per WhatsApp).
    profile:
      inline:
        display_name: MenuGlobale assistant
        crews:
        - id: assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.1
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei il cameriere digitale di un locale. Rispondi nella lingua del cliente. Usa solo i piatti restituiti
            da read_dishes e read_translations: mostra solo quelli con available=true, con prezzo e allergeni. Per domande
            come ''cosa avete senza glutine?'' filtra per allergeni e dichiara sempre che gli allergeni vanno confermati con
            il personale in caso di allergie gravi. Non inventare piatti, ingredienti o prezzi.'
    goalTemplate: 'Conversazione finora:

      {history}


      Nuovo messaggio: {message}'
    appTools:
    - name: read_dishes
      description: Piatti del locale
      action: search
      collection: dishes
      scope: user
    - name: read_translations
      description: Traduzioni dei piatti
      action: search
      collection: translations
      scope: user
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.1
  inputForm:
    title: Importa il menu cartaceo
    fields:
    - name: menu_file
      type: file
      accept:
      - pdf
      - jpg
      - jpeg
      - png
      - webp
      - docx
      maxMb: 10
      multiple: true
      label: Foto o file del menu
    - name: menu_text
      type: textarea
      maxLength: 6000
      label: Oppure incolla il testo del menu
  data:
    collections:
    - name: venue_profile
      description: Dati del locale e lingue del menu
      ownedBy: user
      fields:
      - name: venue_name
        type: text
        required: true
        label: Nome del locale
      - name: languages
        type: text
        label: Lingue (codici ISO separati da virgola)
        help: es. en, fr, de, es, zh, ar
      - name: whatsapp_number
        type: text
        label: Numero WhatsApp del locale
    - name: dishes
      description: Piatti del menu di ogni locale
      ownedBy: user
      fields:
      - name: name
        type: text
        required: true
        label: Nome
      - name: description
        type: textarea
        label: Descrizione
      - name: price
        type: number
        label: Prezzo (€)
      - name: category
        type: select
        label: Categoria
        options:
        - antipasti
        - primi
        - secondi
        - contorni
        - dolci
        - bevande
        - altro
      - name: allergens
        type: multiselect
        label: Allergeni
        options:
        - glutine
        - crostacei
        - uova
        - pesce
        - arachidi
        - soia
        - latte
        - frutta_a_guscio
        - sedano
        - senape
        - sesamo
        - solfiti
        - lupini
        - molluschi
      - name: available
        type: boolean
        default: true
        label: Disponibile
      - name: status
        type: select
        label: Stato
        options:
        - da_controllare
        - confermato
        default: confermato
    - name: translations
      description: Traduzioni dei piatti per lingua
      ownedBy: user
      fields:
      - name: dish_id
        type: text
        required: true
      - name: lang
        type: text
        required: true
      - name: name
        type: text
      - name: description
        type: textarea
      - name: category
        type: text
  triggers:
  - key: translate_new_dish
    description: Traduce ogni nuovo piatto
    'on':
      collection: dishes
      op: insert
    start:
      agent: translator
    goal: 'Traduci il piatto {record.name} (id {record.id}).

      Descrizione: {record.description}

      Categoria: {record.category}

      Lingue richieste: {langs}'
    asUser: true
  views:
  - key: home
    type: page
    title: MenuGlobale
    nav: false
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow: Per bar e ristoranti
      title: Il tuo menu in **oltre cento lingue**, con allergeni
      text: 'Inserisci i piatti o fotografa il menu cartaceo: un agente AI li traduce e segnala gli allergeni. I clienti lo
        aprono dal QR code al tavolo, nella lingua del loro telefono.'
      actions:
      - label: Inizia
        href: /login
        style: primary
      aside: '<div style="padding:16px"><b>Carbonara</b> · €12<br>🌾 🥚 🥛<br><i>EN: Roman pasta with egg, pecorino and guanciale</i></div>'
    - type: steps
      id: come-funziona
      title: Come funziona
      items:
      - title: Carica il menu
        text: Scrivi i piatti o carica una foto del menu cartaceo.
        badge: 📷
      - title: L'agente traduce
        text: Nomi tipici coerenti e allergeni con icone in ogni lingua.
        badge: 🌍
      - title: QR code al tavolo
        text: 'Il cliente apre il menu aggiornato: prezzi e disponibilità cambiano in tempo reale.'
        badge: 📱
    - type: cards
      id: allergeni
      title: Allergeni sempre in evidenza
      items:
      - title: 14 allergeni UE
        text: Ogni piatto indica gli allergeni con icone chiare.
        badge: ⚠️
      - title: Ogni locale il suo menu
        text: Vedi e gestisci solo i tuoi dati.
        badge: 🔒
    - type: note
      content: 'Gli allergeni proposti dall''agente sono una stima: il ristoratore è responsabile di verificarli.'
  - key: setup
    type: form
    collection: venue_profile
    title: Il mio locale
    edit: true
    submit:
      label: Salva
      message: Locale salvato
      redirect: dishes
    roles:
    - user
    - admin
  - key: import
    type: new_run
    title: Importa da foto
    roles:
    - user
    - admin
  - key: import_report
    type: report
    source: run
    printable: true
    nav: false
  - key: dishes
    type: table
    title: Il mio menu
    source: collection:dishes
    columns:
    - name
    - category
    - price
    - allergens
    - available
    - status
    export: true
    roles:
    - user
    - admin
  - key: add_dish
    type: form
    collection: dishes
    title: Nuovo piatto
    edit: true
    submit:
      label: Salva piatto
      message: Piatto online
      redirect: dishes
    roles:
    - user
    - admin
  - key: translations_view
    type: table
    title: Traduzioni
    source: collection:translations
    columns:
    - dish_id
    - lang
    - name
    - description
    roles:
    - user
    - admin
  - key: preview
    type: chat
    title: Prova il cameriere digitale
    source: agent:assistant
    examples:
    - Cosa avete senza glutine?
    - Do you have vegetarian dishes?
    placeholder: Scrivi come un cliente…
    roles:
    - user
    - admin
  - key: account
    type: account
    title: Abbonamento
    roles:
    - user
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: locale
      price: 9
      interval: month
      label: Per locale
      includes:
      - Menu illimitato
      - Traduzioni in oltre 100 lingue
      - Importazione da foto
  notifications:
    emailOnRunDone: true
  extensions:
  - key: public_menu_qr
    description: 'Pagina pubblica del menu per locale raggiungibile da QR code (senza login) nella lingua del telefono: oggi
      i dati dei locali sono privati per utente e i visitatori anonimi non possono leggerli; serve una vista pubblica per-locale.'
  - key: whatsapp_channel
    description: 'Agente su WhatsApp al numero del locale: canale non disponibile ancora (solo web, telefono, Telegram, email).
      L''assistente è pronto come anteprima in chat.'
