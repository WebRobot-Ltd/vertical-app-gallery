apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: menuglobale
  displayName: MenuGlobale
  tagline:
    it: Il tuo menu in oltre cento lingue, con allergeni, via QR e WhatsApp.
    en: Your menu in 100+ languages, with allergens, via QR and WhatsApp.
  description:
    it: Inserisci i piatti, un agente li traduce mantenendo coerenti i nomi tipici e segnala gli allergeni. Ogni locale gestisce
      solo il proprio menu.
    en: Enter your dishes and an agent translates them, keeping typical dish names consistent and flagging allergens. Each
      venue manages only its own menu.
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#7a2e1d'
      accent: '#e08a1e'
      background: '#fffaf3'
      foreground: '#2a1d17'
    fonts:
      body: Inter
      display: Playfair Display
    wordmark:
    - text: Menu
      color: primary
    - text: Globale
      color: accent
    button: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Prezzi
        en: Pricing
      href: '#prezzi'
    cta:
      label:
        it: Inizia
        en: Start
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      label:
        it: Ristoratore
        en: Venue owner
      assignedBy: signup
  limits:
  - action: agent:translator
    per: user
    max: 20
    window: day
    roles:
    - user
  - action: chat
    per: user
    max: 100
    window: day
    roles:
    - user
  agents:
  - key: translator
    role: main
    description: Turns pasted menu text or a list of dishes into checked dish entries and translates them, with allergens.
    profile:
      inline:
        display_name: MenuGlobale translator
        crews:
        - id: translator
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are a professional restaurant menu translator and allergen checker. Input: the venue''s menu
            text (pasted or typed) and the target languages. Steps: 1) Extract each dish: name, description, price, category.
            2) Flag the EU 14 allergens (gluten, crustaceans, eggs, fish, peanuts, soy, milk, nuts, celery, mustard, sesame,
            sulphites, lupin, molluscs) ONLY when stated or clearly implied by the recipe; when unsure write ''DA VERIFICARE''
            for the owner, never guess that a dish is allergen-free. 3) Translate each dish into every requested language:
            keep typical dish names (e.g. carbonara, tiramisù) in the original with a short gloss, keep terminology consistent
            across the menu, never change prices. 4) Use the tool save_dish to store each dish (name, description, price,
            category, allergens, available=true, translations as an object {lang_code:{name,description}}). Report format:
            start with a level-1 title ''# Menu — <venue> — <N> piatti, <M> lingue''. Then ## Piatti da controllare (table:
            dish, price, category, allergens, doubts), ## Traduzioni (one subsection per language with a table dish -> translated
            name and description), ## Note (allergen doubts and missing data). Written in Italian for the owner. Never invent
            prices or ingredients.'
          mcp_servers: []
    goalTemplate: 'Locale: {venue}

      Lingue richieste: {languages}

      Menu (testo incollato o elenco piatti):

      {menu_text}

      {?notes}Note del ristoratore: {notes}{/notes}

      Data: {date}.'
    appTools:
    - name: save_dish
      description: Save or update one dish of the venue's menu
      action: write
      collection: dishes
      scope: user
    - name: list_dishes
      description: Read the dishes of the venue
      action: read
      collection: dishes
      scope: user
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.5
  - key: assistant
    role: helper
    description: Answers questions about the venue's menu (allergens, diets, translations) in the asker's language.
    profile:
      inline:
        display_name: MenuGlobale assistant
        chat_mode: true
        crews:
        - id: assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 4
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You are the friendly waiter-assistant of a bar or restaurant. Read the menu with list_dishes (only
            available dishes) and answer in the language of the customer's message. Handle questions like 'what is gluten-free?'
            using the recorded allergens only; if a dish has allergens 'DA VERIFICARE' or the data is missing, say so and
            tell the customer to ask the staff. Never claim a dish is safe for allergies without data; never invent dishes
            or prices. Keep answers short, list dish name and price.
    goalTemplate: 'Conversazione finora:

      {history}

      Nuovo messaggio: {message}

      Lingua dell''interfaccia: {lang}.'
    appTools:
    - name: list_dishes
      description: Read the dishes of the venue
      action: read
      collection: dishes
      scope: user
    output: markdown
  inputForm:
    title:
      it: Importa e traduci il menu
      en: Import and translate the menu
    fields:
    - name: venue
      type: text
      required: true
      label:
        it: Nome del locale
        en: Venue name
    - name: menu_text
      type: textarea
      required: true
      maxLength: 8000
      label:
        it: Menu (incolla il testo)
        en: Menu (paste text)
      help:
        it: Incolla il testo del menu o l'elenco dei piatti con prezzi e ingredienti. Il caricamento della foto non è ancora
          disponibile.
        en: Paste the menu text or the dish list with prices and ingredients. Photo upload is not available yet.
    - name: languages
      type: text
      required: true
      label:
        it: Lingue (es. inglese, tedesco, cinese, arabo)
        en: Languages
    - name: notes
      type: textarea
      maxLength: 500
      label:
        it: Note (facoltative)
        en: Notes (optional)
  data:
    collections:
    - name: dishes
      ownedBy: user
      description: The venue's dishes with allergens, availability and translations
      searchable: true
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome
          en: Name
      - name: description
        type: textarea
        label:
          it: Descrizione
          en: Description
      - name: price
        type: number
        required: true
        label:
          it: Prezzo (€)
          en: Price
      - name: category
        type: select
        label:
          it: Categoria
          en: Category
        options:
        - value: antipasti
          label: Antipasti
        - value: primi
          label: Primi
        - value: secondi
          label: Secondi
        - value: contorni
          label: Contorni
        - value: dessert
          label: Dessert
        - value: bevande
          label: Bevande
      - name: allergens
        type: multiselect
        label:
          it: Allergeni
          en: Allergens
        options:
        - gluten
        - crustaceans
        - eggs
        - fish
        - peanuts
        - soy
        - milk
        - nuts
        - celery
        - mustard
        - sesame
        - sulphites
        - lupin
        - molluscs
      - name: available
        type: boolean
        default: true
        label:
          it: Disponibile
          en: Available
      - name: translations
        type: json
        label:
          it: Traduzioni
          en: Translations
  views:
  - key: home
    type: page
    nav: false
    title: MenuGlobale
    sections:
    - type: hero
      title:
        it: Il menu del tuo locale in **oltre cento lingue**, con gli allergeni.
        en: Your venue's menu in **100+ languages**, with allergens.
      text:
        it: 'Inserisci i piatti o incolla il menu: un agente AI li traduce mantenendo coerenti i nomi tipici e segnala gli
          allergeni. Ogni locale gestisce solo il proprio menu.'
        en: 'Enter your dishes or paste your menu: an AI agent translates them keeping typical names consistent and flags
          allergens.'
      actions:
      - label:
          it: Inizia
          en: Start
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Inserisci il menu
          en: Add your menu
        text:
          it: Piatti con prezzo, categoria e allergeni, oppure incolla il testo del menu.
          en: Dishes with price, category and allergens, or paste the menu text.
        badge: 📝
      - title:
          it: Traduzione automatica
          en: Automatic translation
        text:
          it: L'agente traduce ogni piatto e segnala gli allergeni da verificare.
          en: The agent translates each dish and flags allergens to check.
        badge: 🌍
      - title:
          it: Aggiorna quando vuoi
          en: Update anytime
        text:
          it: Prezzi e disponibilità si modificano in qualsiasi momento.
          en: Prices and availability can be changed anytime.
        badge: ⚡
    - type: cards
      id: prezzi
      title:
        it: Prezzi
        en: Pricing
      items:
      - title:
          it: Abbonamento per locale
          en: Per-venue plan
        text:
          it: Un canone mensile basso per locale, più crediti per le traduzioni.
          en: A low monthly fee per venue, plus credits for translations.
        badge: 💶
    - type: note
      content:
        it: 'Gli allergeni sono indicati dal ristoratore e controllati dall''agente: il locale resta responsabile della loro
          correttezza.'
        en: 'Allergens are provided by the owner and checked by the agent: the venue remains responsible for their accuracy.'
  - key: new
    type: new_run
    title:
      it: Importa e traduci
      en: Import and translate
    roles:
    - user
    - admin
  - key: dishes_list
    type: table
    title:
      it: Il mio menu
      en: My menu
    source: collection:dishes
    data:
      display: table
      fields:
      - key: name
        label: Piatto
      - key: category
        label: Categoria
        format: badge
      - key: price
        label: Prezzo
        format: money
      - key: allergens
        label: Allergeni
      - key: available
        label: Disponibile
        format: badge
      sort:
        field: category
        dir: asc
      limit: 200
      empty: 'Nessun piatto: importa il menu.'
    roles:
    - user
    - admin
  - key: history
    type: history
    title:
      it: Le mie traduzioni
      en: My translations
    source: run
    roles:
    - user
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: ask
    type: chat
    title:
      it: Prova l'assistente
      en: Try the assistant
    source: agent:assistant
    examples:
    - Cosa avete senza glutine?
    - What vegetarian dishes do you have?
    placeholder: Scrivi una domanda sul menu…
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Plan
    roles:
    - user
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 100
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:translator:
        estimate: 10
        metered: true
      agent:assistant:
        estimate: 2
        metered: true
    packs:
    - key: small
      credits: 500
      price: 5
      label: Crediti 500
    plans:
    - key: venue
      price: 9
      interval: month
      label:
        it: Locale
        en: Venue
      credits: 300
      creditsReset: monthly
      includes:
      - Menu e piatti illimitati
      - Assistente sul menu
      roles:
      - user
  extensions:
  - key: public_menu_qr
    description: 'Public per-venue menu page opened by the table QR code, in the phone language: needs anonymous reads of
      one venue''s records by a public slug, not available yet.'
  - key: whatsapp_channel
    description: 'WhatsApp number per venue answering customers with the assistant: needs per-venue WhatsApp credentials,
      not available yet. Only web chat (owner test) is included.'
  - key: menu_photo_upload
    description: 'Upload of a photo of the paper menu: file upload is not available yet; the owner pastes the text for now.'
