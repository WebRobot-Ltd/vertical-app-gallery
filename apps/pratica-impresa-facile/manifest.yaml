apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: praticafacile
  displayName: PraticaFacile
  tagline:
    it: Apri la tua impresa senza andare in studio.
  description:
    it: 'Scegli la pratica, compila il modulo guidato: un agente AI controlla i dati e prepara la bozza, un avvocato la rivede
      e la approva prima che arrivi a te.'
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1d3557'
      accent: '#2a9d8f'
      background: '#f7f9fb'
      foreground: '#17212b'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Pratica
      color: primary
    - text: Facile
      color: accent
  header:
    links:
    - label:
        it: Come funziona
      href: '#come-funziona'
    - label:
        it: Pratiche
      href: '#pratiche'
    cta:
      label:
        it: Inizia
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
      - listino
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: avvocato
      label:
        it: Avvocato
      assignedBy: invite
    - key: user
      label:
        it: Cliente
      assignedBy: signup
  limits:
  - action: run
    per: user
    max: 10
    window: day
    roles:
    - user
  agents:
  - key: pratica_srl
    role: main
    when: tipo_pratica == 'srl'
    description: Verifica i dati e prepara la bozza per la costituzione di una SRL; chiede la revisione dell'avvocato.
    awaits:
    - revisione_bozza
    profile:
      inline:
        display_name: PraticaFacile - SRL
        crews:
        - id: srl
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'Sei un assistente di studio legale societario italiano. Prepari la pratica di costituzione di una
            SRL (anche semplificata) a partire dai dati del cliente. Passi: 1) verifica la coerenza dei dati con il Codice
            civile (artt. 2462 e seguenti), con la normativa sulla SRL semplificata e con i moduli pubblici del Registro Imprese
            / Camera di Commercio, che consulti sul web tramite gli strumenti webrobot; 2) elenca cosa manca o è incoerente
            (quote che non sommano al 100%, capitale sotto il minimo, ATECO non valido, sede incompleta, PEC mancante, amministratori
            senza poteri); 3) scrivi la bozza dell''atto costitutivo, dello statuto e l''elenco dei moduli camerali (ComUnica,
            modello S1 o equivalenti) con i campi precompilati. Non inventare mai dati, codici fiscali o importi: dove manca
            un dato scrivi [DA COMPLETARE]. Cita le fonti normative. Non dare consulenza definitiva: la bozza è soggetta a
            revisione di un avvocato. Quando la bozza è pronta, chiama lo strumento request_revisione_bozza con un riassunto
            dei dati, le criticità e la bozza; non dire mai che i documenti sono stati inviati al cliente. Struttura del report,
            con titolo di primo livello ''# '' iniziale (es. ''# Costituzione SRL - <ragione sociale>''): ## Stato della pratica,
            ## Verifiche di coerenza, ## Dati mancanti, ## Bozza atto costitutivo, ## Bozza statuto, ## Modulistica Camera
            di Commercio, ## Prossimi passi (notaio, firma digitale, versamento del capitale: solo dopo l''approvazione dell''avvocato).'
    goalTemplate: 'Pratica: {tipo_pratica_label}

      Ragione sociale: {ragione_sociale}

      Soci e quote: {soci}

      Capitale sociale: {capitale} EUR

      Sede: {sede}

      Codice ATECO: {ateco}

      Amministratori: {amministratori}

      PEC: {pec}

      {?note}Note del cliente: {note}{/note}

      Oggi è {date}. Scrivi in italiano.'
    output: markdown
    limits:
      maxTurns: 30
      maxBudgetUsd: 1.5
  - key: pratica_ditta
    role: main
    when: tipo_pratica == 'ditta'
    description: Verifica i dati e prepara la modulistica per l'apertura di una ditta individuale.
    awaits:
    - revisione_bozza
    profile:
      inline:
        display_name: PraticaFacile - Ditta individuale
        crews:
        - id: ditta
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'Sei un assistente di studio legale italiano. Prepari la pratica di apertura di una ditta individuale
            (iscrizione al Registro Imprese, inizio attività, INPS/INAIL se pertinenti) dai dati del cliente. Passi: 1) verifica
            la coerenza dei dati con la normativa e con i moduli pubblici della Camera di Commercio, che consulti sul web
            tramite gli strumenti webrobot; 2) elenca cosa manca o è incoerente (ATECO, sede, PEC, titolare, requisiti per
            attività regolamentate); 3) prepara la modulistica precompilata (ComUnica e allegati). Non inventare dati, codici
            fiscali o importi: scrivi [DA COMPLETARE] dove manca un dato. Non dare consulenza definitiva: la bozza è soggetta
            a revisione di un avvocato. Quando è pronta, chiama request_revisione_bozza con riassunto, criticità e bozza;
            non dire mai che i documenti sono stati inviati al cliente. Report con titolo ''# '' iniziale (es. ''# Ditta individuale
            - <denominazione>''): ## Stato della pratica, ## Verifiche di coerenza, ## Dati mancanti, ## Modulistica Camera
            di Commercio, ## Prossimi passi.'
    goalTemplate: 'Pratica: {tipo_pratica_label}

      Denominazione/ditta: {ragione_sociale}

      Sede: {sede}

      Codice ATECO: {ateco}

      Titolare/amministratori: {amministratori}

      PEC: {pec}

      {?note}Note del cliente: {note}{/note}

      Oggi è {date}. Scrivi in italiano.'
    output: markdown
    limits:
      maxTurns: 25
      maxBudgetUsd: 1.0
  - key: pratica_statuto
    role: main
    when: tipo_pratica == 'modifica'
    description: Verifica e prepara il verbale e lo statuto aggiornato per una modifica statutaria.
    awaits:
    - revisione_bozza
    profile:
      inline:
        display_name: PraticaFacile - Modifica statutaria
        crews:
        - id: statuto
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 1.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'Sei un assistente di studio legale societario italiano. Prepari una modifica statutaria (sede, capitale,
            oggetto sociale, amministratori, ATECO) per una società esistente. Passi: 1) verifica la coerenza dei dati con
            il Codice civile e con i moduli pubblici del Registro Imprese, consultati sul web tramite gli strumenti webrobot;
            2) segnala cosa manca (maggioranze richieste, delibera, quote, PEC); 3) scrivi la bozza del verbale di assemblea,
            delle clausole statutarie modificate e la modulistica camerale. Non inventare dati: usa [DA COMPLETARE]. La bozza
            è soggetta a revisione di un avvocato: chiama request_revisione_bozza con riassunto, criticità e bozza; non dire
            mai che i documenti sono stati inviati al cliente. Report con titolo ''# '' iniziale: ## Stato della pratica,
            ## Verifiche di coerenza, ## Dati mancanti, ## Bozza verbale e clausole modificate, ## Modulistica Camera di Commercio,
            ## Prossimi passi.'
    goalTemplate: 'Pratica: {tipo_pratica_label}

      Società: {ragione_sociale}

      Soci e quote: {soci}

      Capitale sociale: {capitale} EUR

      Sede: {sede}

      Codice ATECO: {ateco}

      Amministratori: {amministratori}

      PEC: {pec}

      {?note}Modifica richiesta: {note}{/note}

      Oggi è {date}. Scrivi in italiano.'
    output: markdown
    limits:
      maxTurns: 25
      maxBudgetUsd: 1.2
  inputForm:
    title:
      it: Nuova pratica
    fields:
    - name: tipo_pratica
      type: select
      required: true
      label:
        it: Tipo di pratica
      options:
      - value: srl
        label:
          it: Costituzione SRL
      - value: ditta
        label:
          it: Apertura ditta individuale
      - value: modifica
        label:
          it: Modifica statutaria
    - name: ragione_sociale
      type: text
      required: true
      label:
        it: Ragione sociale / denominazione
    - name: soci
      type: array
      label:
        it: Soci e quote
      visibleWhen: tipo_pratica != 'ditta'
      fields:
      - name: nome
        type: text
        required: true
        label:
          it: Nome e cognome / denominazione
      - name: codice_fiscale
        type: text
        label:
          it: Codice fiscale
      - name: quota_pct
        type: number
        required: true
        label:
          it: Quota %
    - name: capitale
      type: number
      label:
        it: Capitale sociale (EUR)
      visibleWhen: tipo_pratica != 'ditta'
    - name: sede
      type: text
      required: true
      label:
        it: Sede (via, CAP, comune)
    - name: ateco
      type: text
      required: true
      label:
        it: Codice ATECO
      help:
        it: es. 62.01.00
    - name: amministratori
      type: textarea
      required: true
      maxLength: 800
      label:
        it: Amministratori / titolare
      help:
        it: Nome, carica, poteri
    - name: pec
      type: email
      required: true
      label:
        it: PEC
    - name: note
      type: textarea
      maxLength: 800
      label:
        it: Note o modifica richiesta
  data:
    collections:
    - name: catalogo_pratiche
      ownedBy: shared
      description: Catalogo e listino delle pratiche
      fields:
      - name: tipo
        type: text
        required: true
        label:
          it: Tipo
      - name: descrizione
        type: textarea
        label:
          it: Descrizione
      - name: prezzo_eur
        type: number
        label:
          it: Prezzo (EUR)
  approvals:
  - key: revisione_bozza
    title:
      it: Revisione della bozza
    description: L'avvocato apre la bozza, la corregge e la approva prima che il cliente riceva i documenti.
    role: avvocato
    decidedBy: role
    fields:
    - tipo_pratica
    - ragione_sociale
    - riassunto
    - criticita
    - bozza
  views:
  - key: home
    type: page
    nav: false
    title: PraticaFacile
    sections:
    - type: hero
      title:
        it: Apri la tua impresa, **senza andare in studio**.
      text:
        it: Scegli la pratica, compila un modulo guidato. Un agente AI controlla i dati e prepara la bozza; un avvocato la
          rivede e la approva prima che tu riceva i documenti.
      actions:
      - label:
          it: Inizia una pratica
        href: /v/new
        style: primary
      - label:
          it: Accedi
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
      items:
      - title:
          it: 1 · Scegli la pratica
        text:
          it: SRL, ditta individuale o modifica statutaria.
        badge: 📋
      - title:
          it: 2 · Compila il modulo
        text:
          it: Soci, capitale, sede, ATECO, amministratori e PEC.
        badge: ✍️
      - title:
          it: 3 · Verifica e bozza
        text:
          it: L'agente controlla normativa e moduli camerali e segnala cosa manca.
        badge: 🔍
      - title:
          it: 4 · Approva l'avvocato
        text:
          it: Nulla parte senza la revisione di un avvocato dello studio.
        badge: ⚖️
    - type: data
      id: pratiche
      title:
        it: Pratiche e prezzi
      source: collection:catalogo_pratiche
      display: cards
      fields:
      - key: tipo
        label:
          it: Pratica
      - key: descrizione
        label:
          it: Cosa include
      - key: prezzo_eur
        label:
          it: Prezzo
        format: money
      empty:
        it: Listino in aggiornamento.
    - type: note
      content:
        it: PraticaFacile prepara bozze soggette a revisione di un avvocato. Non sostituisce il notaio dove la legge lo richiede.
  - key: new
    type: new_run
    title:
      it: Nuova pratica
    roles:
    - user
    - admin
  - key: pratiche
    type: history
    title:
      it: Le mie pratiche
    source: run
    columns:
    - createdAt
    - tipo_pratica
    - ragione_sociale
    - status
    roles:
    - user
  - key: pratica
    type: report
    title:
      it: Pratica
    source: run
    printable: true
    nav: false
  - key: coda
    type: approvals
    title:
      it: Coda dell'avvocato
    approvals:
    - revisione_bozza
    roles:
    - avvocato
    - admin
  - key: tutte
    type: history
    title:
      it: Tutte le pratiche
    source: run
    roles:
    - admin
  - key: listino
    type: table
    title:
      it: Listino
    source: collection:catalogo_pratiche
    columns:
    - tipo
    - descrizione
    - prezzo_eur
    roles:
    - admin
    - user
  - key: admin
    type: admin
    title: Admin
    roles:
    - admin
  - key: account
    type: account
    title:
      it: Pagamenti
    roles:
    - user
  billing:
    modes:
    - credits
    currency: eur
    signupCredits: 0
    costs:
      agent:pratica_srl: 250
      agent:pratica_ditta: 90
      agent:pratica_statuto: 150
    packs:
    - key: ditta
      credits: 90
      price: 90
      label:
        it: Ditta individuale
    - key: modifica
      credits: 150
      price: 150
      label:
        it: Modifica statutaria
    - key: srl
      credits: 250
      price: 250
      label:
        it: Costituzione SRL
  extensions:
  - key: email_documenti
    description: 'Email al cliente con documenti e prossimi passi (notaio, firma digitale, versamento del capitale) dopo l''approvazione
      dell''avvocato: le notifiche email non sono ancora disponibili; il cliente trova lo stato e i documenti nella pratica.'
  - key: promemoria_pratica_incompleta
    description: 'Promemoria email se la pratica resta a metà per più di tre giorni: non disponibile, richiede notifiche email.'
  - key: assegnazione_avvocato
    description: 'Assegnazione di ogni pratica a un avvocato specifico: oggi la coda è condivisa tra gli avvocati; l''assegnazione
      richiede logica personalizzata.'
  - key: pagamento_all_invio
    description: Il prezzo per tipo di pratica è un costo fisso in crediti (1 credito = 1 EUR) acquistati con carta prima
      dell'invio.
