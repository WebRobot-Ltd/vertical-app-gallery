apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: praticafacile
  displayName: PraticaFacile
  tagline:
    it: Apri o modifica la tua impresa senza andare in studio.
  description:
    it: Scegli la pratica, compila il modulo guidato e ricevi atto costitutivo, statuto e modulistica camerale, controllati
      e approvati da un avvocato.
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#16324f'
      accent: '#2a7f62'
      background: '#f7f8fa'
      foreground: '#1a2230'
    fonts:
      body: Inter
      display: Source Serif 4
    wordmark:
    - text: Pratica
      color: primary
    - text: Facile
      color: accent
  header:
    links:
    - label: Come funziona
      href: '#come-funziona'
    - label: Listino
      href: '#listino'
    cta:
      label: Accedi
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Amministratore
      assignedBy: admin_emails
    - key: user
      label: Cliente
      assignedBy: signup
    - key: lawyer
      label: Avvocato
      assignedBy: derived
      from: collection:pratiche.lawyer_email
  limits:
  - action: login
    per: ip
    max: 20
    window: hour
  agents:
  - key: istruttore
    role: main
    description: Verifica la coerenza dei dati della pratica e prepara la bozza di atto, statuto e modulistica per l'avvocato.
    profile:
      inline:
        display_name: PraticaFacile istruttore
        crews:
        - id: istruttore
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'Sei l''istruttore di pratiche societarie di uno studio legale italiano. Ricevi i dati di una pratica
            (SRL, ditta individuale o modifica statutaria) inseriti dal cliente. Compiti: 1) verifica la coerenza dei dati
            con la normativa italiana (codice civile, capitale minimo SRL e versamento dei decimi, somma delle quote dei soci
            pari al 100% e coerenti con il capitale, formato di codice fiscale, PEC, codice ATECO plausibile, poteri degli
            amministratori, sede completa); 2) consulta tramite lo strumento web i moduli pubblici delle Camere di Commercio
            / Registro Imprese per individuare la modulistica corretta per il tipo di pratica; 3) elenca con precisione cosa
            manca o è incoerente; 4) prepara le bozze di atto costitutivo (o atto di modifica), statuto e modulistica camerale
            (elenco dei moduli con i campi precompilati). Non inventare mai dati, importi o riferimenti normativi: dove un
            dato manca scrivi [DA COMPLETARE]; dove non sei sicuro scrivilo esplicitamente. Le bozze non sono consulenza legale
            e saranno riviste da un avvocato: non contattare mai il cliente. Salva il risultato con lo strumento update_pratica
            passando l''id della pratica e i campi: anomalie (elenco puntato), atto_costitutivo, statuto, modulistica, e stato
            = "in_revisione". Se mancano dati essenziali imposta comunque stato "in_revisione" indicando le lacune in anomalie.
            Rispondi alla fine con un report che inizia con un titolo di livello 1 "# Istruttoria pratica — <ragione sociale>"
            e le sezioni ## Esito della verifica, ## Dati mancanti o incoerenti, ## Documenti preparati, ## Punti per l''avvocato.'
          mcp_servers_note: webrobot
    appTools:
    - name: update_pratica
      description: Aggiorna la pratica del cliente (anomalie, bozze, stato) indicandone l'id
      action: write
      collection: pratiche
      scope: user
    output: markdown
    limits:
      maxTurns: 25
      maxBudgetUsd: 0.8
      timeoutSeconds: 900
  data:
    collections:
    - name: listino
      ownedBy: shared
      description: Catalogo delle pratiche e relativo prezzo, tenuto dagli admin
      fields:
      - name: tipo
        type: select
        required: true
        label: Tipo
        options:
        - value: srl
          label: Costituzione SRL
        - value: ditta
          label: Ditta individuale
        - value: statuto
          label: Modifica statutaria
      - name: nome
        type: text
        required: true
        label: Pratica
      - name: prezzo
        type: number
        required: true
        label: Prezzo (€)
      - name: descrizione
        type: textarea
        label: Cosa include
    - name: pratiche
      ownedBy: user
      description: Le pratiche dei clienti, con verifica, bozze e stato
      retentionDays: 1825
      access:
      - role: lawyer
        where:
          lawyer_email: '{user.email}'
        can:
        - read
        - write
      fields:
      - name: tipo
        type: select
        required: true
        label: Tipo di pratica
        options:
        - value: srl
          label: Costituzione SRL
        - value: ditta
          label: Ditta individuale
        - value: statuto
          label: Modifica statutaria
      - name: ragione_sociale
        type: text
        required: true
        label: Ragione sociale / denominazione
      - name: soci
        type: array
        label: Soci e quote
        fields:
        - name: nome
          type: text
          required: true
          label: Nome e cognome / denominazione
        - name: codice_fiscale
          type: text
          label: Codice fiscale
        - name: quota_pct
          type: number
          label: Quota (%)
        - name: quota_eur
          type: number
          label: Quota (€)
      - name: capitale
        type: number
        label: Capitale sociale (€)
      - name: sede
        type: text
        required: true
        label: Sede legale (via, civico, CAP, comune)
      - name: ateco
        type: text
        label: Codice ATECO
      - name: amministratori
        type: array
        label: Amministratori
        fields:
        - name: nome
          type: text
          required: true
          label: Nome e cognome
        - name: codice_fiscale
          type: text
          label: Codice fiscale
        - name: carica
          type: text
          label: Carica
        - name: poteri
          type: text
          label: Poteri (disgiunti, congiunti...)
      - name: pec
        type: email
        label: PEC
      - name: email_cliente
        type: email
        required: true
        label: Email per le comunicazioni
      - name: note
        type: textarea
        maxLength: 1000
        label: Note
      - name: invio
        type: select
        required: true
        default: bozza
        label: Azione
        options:
        - value: bozza
          label: Salva e continua più tardi
        - value: inviata
          label: Invia la pratica e paga
      - name: creata_il
        type: date
        default: '{date}'
        label: Creata il
      - name: stato
        type: select
        default: bozza
        label: Stato
        options:
        - value: bozza
          label: In compilazione
        - value: in_istruttoria
          label: In verifica
        - value: in_revisione
          label: In revisione dall'avvocato
        - value: da_correggere
          label: Da integrare
        - value: approvata
          label: Approvata
      - name: lawyer_email
        type: email
        label: Avvocato assegnato
      - name: anomalie
        type: textarea
        label: Dati mancanti o incoerenti
      - name: atto_costitutivo
        type: textarea
        label: Atto costitutivo / di modifica
      - name: statuto
        type: textarea
        label: Statuto
      - name: modulistica
        type: textarea
        label: Modulistica Camera di Commercio
      - name: note_avvocato
        type: textarea
        label: Note dell'avvocato
  views:
  - key: home
    type: page
    title: PraticaFacile
    nav: false
    sections:
    - type: hero
      title: Apri o modifica la tua impresa **senza andare in studio**
      text: 'Scegli la pratica, compila un modulo guidato: un agente verifica i dati e prepara le bozze, un avvocato le controlla
        e le approva prima che ti vengano inviate.'
      actions:
      - label: Inizia una pratica
        href: /login
        style: primary
      - label: Vedi il listino
        href: '#listino'
        style: ghost
    - type: steps
      id: come-funziona
      title: Come funziona
      items:
      - title: 1 · Scegli e compila
        text: Selezioni la pratica e inserisci soci, quote, capitale, sede, ATECO, amministratori e PEC. Puoi salvare e riprendere
          più tardi.
      - title: 2 · Verifica automatica
        text: L'agente controlla la coerenza con la normativa e con i moduli camerali pubblici, segnala cosa manca e prepara
          le bozze.
      - title: 3 · Revisione dell'avvocato
        text: Un avvocato dello studio corregge e approva. Nulla ti viene inviato senza la sua approvazione.
      - title: 4 · Documenti e prossimi passi
        text: 'Ricevi un''email con i documenti e i passi successivi: notaio, firma digitale, versamento del capitale.'
    - type: data
      id: listino
      title: Listino
      source: collection:listino
      display: cards
      fields:
      - key: nome
        label: Pratica
      - key: prezzo
        label: Prezzo (€)
        format: money
      - key: descrizione
        label: Include
      empty: Listino in aggiornamento.
    - type: note
      content: PraticaFacile prepara bozze revisionate da un avvocato dello studio. Il pagamento avviene con carta, per pratica,
        al momento dell'invio.
  - key: nuova
    type: form
    title: Nuova pratica
    collection: pratiche
    fields:
    - tipo
    - ragione_sociale
    - soci
    - capitale
    - sede
    - ateco
    - amministratori
    - pec
    - email_cliente
    - note
    - creata_il
    - invio
    edit: true
    submit:
      label: Salva
      message: Pratica salvata. Se hai scelto di inviarla, l'istruttoria parte subito.
      redirect: pratiche
    roles:
    - user
    - admin
  - key: pratiche
    type: table
    title: Le mie pratiche
    source: collection:pratiche
    columns:
    - ragione_sociale
    - tipo
    - invio
    - stato
    - creata_il
    roles:
    - user
    - admin
  - key: documenti
    type: cards
    title: Documenti approvati
    source: collection:pratiche
    query: stato = approvata
    columns:
    - ragione_sociale
    - atto_costitutivo
    - statuto
    - modulistica
    printable: true
    roles:
    - user
    - admin
  - key: coda
    type: table
    title: Coda dell'avvocato
    source: collection:pratiche
    query: stato = in_revisione
    columns:
    - ragione_sociale
    - tipo
    - stato
    - anomalie
    - lawyer_email
    roles:
    - lawyer
    - admin
  - key: revisione
    type: form
    title: Revisione pratica
    collection: pratiche
    fields:
    - anomalie
    - atto_costitutivo
    - statuto
    - modulistica
    - note_avvocato
    - stato
    edit: true
    submit:
      label: Salva revisione
      message: Revisione salvata. Con stato «Approvata» il cliente riceve i documenti.
      redirect: coda
    nav: false
    roles:
    - lawyer
    - admin
  - key: account
    type: account
    title: Crediti e pagamenti
    roles:
    - user
  triggers:
  - key: carica_srl
    'on':
      collection: pratiche
      op: any
      where:
        invio: inviata
        stato: bozza
        tipo: srl
    charge:
      credits: 290
      reason: Pratica costituzione SRL
  - key: carica_ditta
    'on':
      collection: pratiche
      op: any
      where:
        invio: inviata
        stato: bozza
        tipo: ditta
    charge:
      credits: 120
      reason: Pratica ditta individuale
  - key: carica_statuto
    'on':
      collection: pratiche
      op: any
      where:
        invio: inviata
        stato: bozza
        tipo: statuto
    charge:
      credits: 190
      reason: Pratica modifica statutaria
  - key: avvia_istruttoria
    'on':
      collection: pratiche
      op: any
      where:
        invio: inviata
        stato: bozza
    start:
      agent: istruttore
    goal: 'Istruisci questa pratica (id {record.id}). Tipo: {record.tipo}. Ragione sociale: {record.ragione_sociale}. Soci
      e quote: {record.soci}. Capitale: {record.capitale}. Sede: {record.sede}. ATECO: {record.ateco}. Amministratori: {record.amministratori}.
      PEC: {record.pec}. Note del cliente: {record.note}. Verifica, segnala le lacune, prepara le bozze e salvale con update_pratica
      portando lo stato a in_revisione. Scrivi in italiano.'
  - key: da_rivedere
    'on':
      collection: pratiche
      op: update
      where:
        stato: in_revisione
    notify:
      to: admins
      subject: Pratica {record.ragione_sociale} pronta per la revisione
      body: La bozza della pratica {record.ragione_sociale} è pronta. Assegna un avvocato (campo «Avvocato assegnato») se
        non lo hai già fatto.
      link: coda
  - key: pratica_approvata
    'on':
      collection: pratiche
      op: update
      where:
        stato: approvata
    notify:
      to: record.email_cliente
      subject: La tua pratica {record.ragione_sociale} è pronta
      body: 'I documenti della pratica {record.ragione_sociale} (atto costitutivo, statuto e modulistica camerale) sono stati
        rivisti e approvati dal nostro avvocato. Li trovi nell''area «Documenti approvati». Prossimi passi: 1) appuntamento
        dal notaio per l''atto; 2) firma digitale dei documenti; 3) versamento del capitale sociale; 4) deposito al Registro
        Imprese.'
      link: documenti
  - key: promemoria_bozza
    'on':
      date:
        collection: pratiche
        field: creata_il
        offsetDays: 3
        hour: 9
      where:
        invio: bozza
    notify:
      to: record.email_cliente
      subject: La tua pratica è rimasta a metà
      body: Hai lasciato in compilazione la pratica {record.ragione_sociale}. Riprendila quando vuoi e inviala per avviare
        la verifica.
      link: pratiche
  billing:
    modes:
    - credits
    currency: eur
    signupCredits: 0
    packs:
    - key: c150
      credits: 150
      price: 150
      label: 150 crediti
    - key: c300
      credits: 300
      price: 300
      label: 300 crediti
    - key: c600
      credits: 600
      price: 600
      label: 600 crediti
  extensions:
  - key: prezzi_per_tipo
    description: 1 credito = 1 €. I prezzi (SRL 290, ditta 120, modifica statutaria 190) sono fissati nei trigger carica_*;
      se l'admin cambia il listino va aggiornato anche il trigger. Il pagamento con carta avviene acquistando i crediti nella
      pagina Crediti prima dell'invio.
  - key: assegnazione_avvocato
    description: L'assegnazione dell'avvocato (campo lawyer_email) la fa l'admin dalla pagina dati /admin/data; non c'è assegnazione
      automatica.
  - key: data_creazione_automatica
    description: Il campo creata_il usa come default la data odierna ({date}); se il runtime non lo compila da solo va impostato
      al salvataggio, perché il promemoria dopo 3 giorni parte da questa data.
