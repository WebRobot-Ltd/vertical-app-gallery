apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: autosereno
  displayName: AutoSereno
  tagline:
    it: Polizze auto a consumo, con un punteggio di guida chiaro e sconti equi.
  description:
    it: Lo strato software per le polizze auto a consumo. Gli assicurati registrano veicolo e consenso e prenotano l'installazione
      della scatola nera. Un agente AI calcola ogni mese il punteggio di guida e dà consigli. Alla scadenza della polizza
      propone lo sconto, che l'agente assicurativo approva. I sinistri si aprono con una denuncia guidata.
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12355b'
      accent: '#1f9d7a'
      background: '#f6f8fb'
      foreground: '#16202c'
    fonts:
      body: Inter
      display: Manrope
    wordmark:
    - text: Auto
      color: primary
    - text: Sereno
      color: accent
  header:
    links:
    - label: Come funziona
      href: '#come-funziona'
    - label: Privacy
      href: '#privacy'
    cta:
      label: Accedi
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Responsabile tecnico
      assignedBy: admin_emails
    - key: broker
      label: Agente assicurativo
      assignedBy: derived
      from: collection:vehicles.agent_email
    - key: liquidator
      label: Liquidatore
      assignedBy: invite
    - key: user
      label: Assicurato
      assignedBy: signup
  limits:
  - action: agent:scorer
    per: user
    max: 5
    window: day
    roles:
    - user
  agents:
  - key: scorer
    role: main
    description: Calcola il punteggio di guida mensile di un veicolo e spiega i fattori.
    memory: user
    appTools:
    - name: trips_read
      description: Legge i dati aggregati di viaggio dell'assicurato (km, km notturni, frenate brusche, km oltre i limiti)
      action: read
      collection: trips
      scope: user
    - name: vehicle_read
      description: Legge veicolo, polizza e agente dell'assicurato
      action: read
      collection: vehicles
      scope: user
    - name: score_calc
      description: Calcola il punteggio da km, night_km, harsh_braking, speeding_km
      action: call
      slot: score_calc
    - name: score_write
      description: Salva il punteggio del mese (plate, month, score, band, km, factors, tips, agent_email)
      action: write
      collection: scores
      scope: user
    profile:
      inline:
        display_name: AutoSereno - punteggio di guida
        crews:
        - id: scorer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''analista di guida di AutoSereno, per un''assicurazione auto a consumo. Procedi così: 1) con
            vehicle_read prendi il veicolo (verifica che il consenso sia dato; altrimenti fermati e spiega che manca). 2)
            Con trips_read leggi i viaggi della targa nel mese precedente a oggi. 3) Somma km, night_km, harsh_braking, speeding_km
            e chiama score_calc: il punteggio lo calcola solo lo strumento, non inventarlo. 4) Salva con score_write (includi
            agent_email del veicolo). 5) Scrivi il report in italiano, tono rispettoso, senza colpevolizzare. Struttura: titolo
            ''# Punteggio di guida — <targa> — <mese>'', poi ## Il tuo punteggio (valore e fascia), ## Cosa ha influito (frenate
            ogni 100 km, quota di guida notturna, velocità, con cifre reali), ## Consigli pratici (3 consigli concreti e misurabili),
            ## Rispetto al mese scorso (se hai memoria). Aggiungi un blocco ```chart``` a barre con i fattori solo se hai
            cifre reali. Se non ci sono viaggi nel mese, dillo senza inventare. Non fare promesse di sconto: lo decide l''agente
            assicurativo. Alla fine chiama remember con i 5 punti chiave.'
          mcp_servers: []
    goalTemplate: Calcola il punteggio di guida del mese precedente per la targa {plate}. Oggi è {date}. Scrivi in lingua
      {lang}.
    output: markdown
    limits:
      maxTurns: 10
      maxBudgetUsd: 0.4
  - key: discounter
    role: helper
    description: Prepara la proposta di sconto al rinnovo; l'agente assicurativo approva prima dell'invio.
    awaits:
    - discount_approval
    appTools:
    - name: trips_read
      description: Legge i dati aggregati di viaggio dell'assicurato (km, km notturni, frenate brusche, km oltre i limiti)
      action: read
      collection: trips
      scope: user
    - name: vehicle_read
      description: Legge veicolo, polizza e agente dell'assicurato
      action: read
      collection: vehicles
      scope: user
    - name: scores_read
      description: Legge i punteggi mensili dell'assicurato
      action: read
      collection: scores
      scope: user
    - name: proposal_write
      description: Salva la proposta di sconto (plate, policy_number, policy_expiry, avg_score, discount_pct, motivation,
        status, agent_email)
      action: write
      collection: proposals
      scope: user
    profile:
      inline:
        display_name: AutoSereno - sconto al rinnovo
        crews:
        - id: discounter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Prepari la proposta di sconto al rinnovo di una polizza auto a consumo. Leggi veicolo (vehicle_read)
            e punteggi degli ultimi 12 mesi (scores_read); usa trips_read solo per verificare i km. Calcola il punteggio medio.
            Fasce di sconto sul premio: media >= 85 → fino a 20%; 75-84 → 12%; 60-74 → 5%; sotto 60 → 0%. Con meno di 3 mesi
            di dati proponi 0% e spiegane il motivo. Non superare mai la fascia. Salva la proposta con proposal_write (status
            proposed, agent_email del veicolo) e poi chiedi l''approvazione con request_discount_approval, indicando targa,
            sconto e motivazione. Non comunicare nulla all''assicurato: l''invio dipende dall''approvazione. Rispondi in italiano
            con ''# Proposta di sconto — <targa>'', poi ## Dati usati, ## Sconto proposto, ## Motivazione. Non inventare cifre.'
          mcp_servers: []
    goalTemplate: 'Evento di rinnovo: {event}. Oggi è {date}. Scrivi in lingua {lang}.'
    output: markdown
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.5
  inputForm:
    title: Calcola il punteggio ora
    fields:
    - name: plate
      type: select
      required: true
      label: Veicolo
      optionsFrom: collection:vehicles
  slots:
  - key: score_calc
    description: Punteggio di guida 0-100 da dati aggregati di viaggio, regola fissa e trasparente.
    timeoutMs: 2000
    example:
      args:
        km: 900
        night_km: 60
        harsh_braking: 9
        speeding_km: 40
      userId: x
    code: "def main(input):\n    a = input.get('args') or {}\n    km = float(a.get('km') or 0)\n    if km < 50:\n        return\
      \ {'score': None, 'band': 'dati insufficienti', 'note': 'meno di 50 km nel mese'}\n    hb = float(a.get('harsh_braking')\
      \ or 0) / km * 100\n    night = float(a.get('night_km') or 0) / km * 100\n    sp = float(a.get('speeding_km') or 0)\
      \ / km * 100\n    p_b = min(35.0, hb * 5)\n    p_n = min(20.0, night * 0.4)\n    p_s = min(35.0, sp * 1.0)\n    score\
      \ = int(round(max(0.0, 100 - p_b - p_n - p_s)))\n    band = 'ottimo' if score >= 85 else 'buono' if score >= 75 else\
      \ 'migliorabile' if score >= 60 else 'da migliorare'\n    return {'score': score, 'band': band, 'brakes_per_100km':\
      \ round(hb, 2), 'night_share_pct': round(night, 1), 'speeding_share_pct': round(sp, 1), 'penalty_brakes': round(p_b,\
      \ 1), 'penalty_night': round(p_n, 1), 'penalty_speed': round(p_s, 1)}\n"
  templates:
  - key: score_monthly
    title: Punteggio mensile
    description: Ogni mese ricevi il punteggio di guida del tuo veicolo, cosa ha influito e i consigli.
    agent: scorer
    params:
    - name: plate
      type: text
      required: true
      label: Targa
    goal: 'Osserva «{instance}»: calcola il punteggio di guida del mese precedente per la targa {plate}. Oggi è {date}. Scrivi
      in lingua {lang}.'
    schedule:
      cron: 0 7 2 * *
      userCanChange: false
    maxPerUser: 3
    deliver:
      to: owner
      onlyIfNew: true
  approvals:
  - key: discount_approval
    title: Sconto al rinnovo
    description: L'agente assicurativo approva lo sconto prima dell'invio all'assicurato.
    role: broker
    fields:
    - plate
    - avg_score
    - discount_pct
    - motivation
    timeoutMinutes: 10080
    onTimeout: reject
  data:
    collections:
    - name: vehicles
      ownedBy: user
      description: Veicolo, polizza e consenso al trattamento dei dati di guida
      fields:
      - name: plate
        type: text
        required: true
        label: Targa
      - name: make
        type: text
        label: Marca
      - name: model
        type: text
        label: Modello
      - name: year
        type: number
        label: Anno di immatricolazione
      - name: policy_number
        type: text
        required: true
        label: Numero polizza
      - name: policy_expiry
        type: date
        required: true
        label: Scadenza polizza
      - name: agent_email
        type: email
        required: true
        label: Email del tuo agente assicurativo
      - name: device_id
        type: text
        label: Codice scatola nera (se già installata)
      - name: consent
        type: boolean
        required: true
        label: Acconsento al trattamento dei dati di guida (km, fasce orarie, frenate, velocità) per il calcolo del punteggio
        help: Puoi revocare il consenso in ogni momento contattando il tuo agente.
      access:
      - role: broker
        where:
          agent_email: '{user.email}'
        can:
        - read
    - name: trips
      ownedBy: user
      description: Dati aggregati di viaggio dalla piattaforma del partner telematico
      retentionDays: 730
      fields:
      - name: trip_id
        type: text
      - name: policy_number
        type: text
      - name: plate
        type: text
      - name: date
        type: date
      - name: km
        type: number
      - name: night_km
        type: number
      - name: harsh_braking
        type: number
      - name: speeding_km
        type: number
      - name: max_speed
        type: number
    - name: scores
      ownedBy: user
      description: Punteggi di guida mensili
      fields:
      - name: plate
        type: text
      - name: month
        type: text
      - name: score
        type: number
      - name: band
        type: text
      - name: km
        type: number
      - name: factors
        type: textarea
      - name: tips
        type: textarea
      - name: agent_email
        type: email
      access:
      - role: broker
        where:
          agent_email: '{user.email}'
        can:
        - read
    - name: proposals
      ownedBy: user
      description: Proposte di sconto al rinnovo
      fields:
      - name: plate
        type: text
      - name: policy_number
        type: text
      - name: policy_expiry
        type: date
      - name: avg_score
        type: number
      - name: discount_pct
        type: number
      - name: motivation
        type: textarea
      - name: status
        type: select
        options:
        - proposed
        - approved
        - rejected
      - name: agent_email
        type: email
      access:
      - role: broker
        where:
          agent_email: '{user.email}'
        can:
        - read
        - write
    - name: claims
      ownedBy: user
      description: Denunce di sinistro; coda del liquidatore
      fields:
      - name: plate
        type: text
        required: true
        label: Targa del veicolo
      - name: event_date
        type: date
        required: true
        label: Data del sinistro
      - name: location
        type: text
        required: true
        label: Dove è avvenuto
      - name: third_parties
        type: boolean
        label: Sono coinvolti altri veicoli o persone?
      - name: injuries
        type: boolean
        label: Ci sono feriti?
      - name: description
        type: textarea
        required: true
        label: Cosa è successo
        help: Descrivi la dinamica, in ordine.
      - name: photos
        type: file
        accept:
        - jpg
        - jpeg
        - png
        - pdf
        maxMb: 10
        multiple: true
        label: Foto dei danni e del luogo
      - name: status
        type: select
        label: Stato
        default: open
        options:
        - value: open
          label: Aperta
        - value: in_review
          label: In lavorazione
        - value: closed
          label: Chiusa
      access:
      - role: liquidator
        can:
        - read
        - write
    - name: installations
      ownedBy: user
      description: Prenotazioni di installazione della scatola nera
      fields:
      - name: plate
        type: text
        label: Targa
      - name: notes
        type: textarea
        label: Note
    - name: workshops
      ownedBy: shared
      description: Officine convenzionate per l'installazione
      fields:
      - name: name
        type: text
        required: true
        label: Officina
      - name: address
        type: text
        label: Indirizzo
      - name: city
        type: city
        label: Città
      - name: phone
        type: text
        label: Telefono
  views:
  - key: home
    type: page
    title: AutoSereno
    nav: false
    sections:
    - type: hero
      layout: stack
      band: true
      eyebrow: Assicurazione auto a consumo
      title: Guida bene, **paga il giusto**.
      text: Registra il tuo veicolo, prenota l'installazione della scatola nera presso un'officina convenzionata e ricevi
        ogni mese il tuo punteggio di guida con consigli pratici. Al rinnovo, uno sconto che si basa sui fatti.
      actions:
      - label: Accedi o registrati
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title: Come funziona
      items:
      - title: Registra veicolo e consenso
        text: Targa, dati della polizza e consenso al trattamento dei dati di guida.
        badge: '1'
      - title: Prenota l'installazione
        text: Scegli un'officina convenzionata e uno slot.
        badge: '2'
      - title: Ricevi il punteggio
        text: Ogni mese vedi cosa ha influito e come migliorare.
        badge: '3'
      - title: Sconto al rinnovo
        text: Il tuo agente approva la proposta prima che ti arrivi.
        badge: '4'
    - type: text
      id: privacy
      title: I tuoi dati
      content: Vedi solo i tuoi dati. Il tuo agente vede i dati dei propri clienti. Arrivano solo dati aggregati di viaggio
        (chilometri, fasce orarie, frenate brusche, velocità), mai la posizione dei singoli tragitti. Puoi revocare il consenso
        in ogni momento.
    - type: note
      content: AutoSereno · il punteggio di guida è calcolato con una regola fissa e trasparente; lo sconto è deciso dal tuo
        agente assicurativo.
  - key: vehicle
    type: form
    title: Il mio veicolo e consenso
    collection: vehicles
    fields:
    - plate
    - make
    - model
    - year
    - policy_number
    - policy_expiry
    - agent_email
    - device_id
    - consent
    submit:
      label: Salva
      message: Veicolo salvato. Ora prenota l'installazione.
      redirect: book
    edit: true
    roles:
    - user
  - key: book
    type: booking
    title: Prenota l'installazione
    collection: installations
    resources: collection:workshops
    fields:
    - plate
    - notes
    slots:
      days:
      - 1
      - 2
      - 3
      - 4
      - 5
      from: 08:30
      to: '17:30'
      minutes: 60
      tz: Europe/Rome
      aheadDays: 30
      minNoticeHours: 24
      capacity: 1
    roles:
    - user
  - key: score_now
    type: new_run
    title: Calcola il punteggio
    roles:
    - user
  - key: my_scores
    type: table
    title: I miei punteggi
    source: collection:scores
    columns:
    - month
    - plate
    - score
    - band
    - km
    roles:
    - user
  - key: runs
    type: history
    title: I miei report
    source: run
    roles:
    - user
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: watches
    type: instances
    template: score_monthly
    title: Report mensile automatico
    roles:
    - user
  - key: my_proposals
    type: page
    title: Sconto al rinnovo
    roles:
    - user
    sections:
    - type: data
      title: Sconti approvati dal tuo agente
      source: collection:proposals
      display: table
      fields:
      - key: plate
        label: Targa
      - key: policy_expiry
        label: Scadenza polizza
        format: date
      - key: avg_score
        label: Punteggio medio
        format: number
      - key: discount_pct
        label: Sconto %
        format: number
      - key: motivation
        label: Motivazione
      filters:
      - field: status
        op: '='
        value: approved
      empty: Nessuno sconto approvato per ora.
  - key: claim
    type: form
    title: Denuncia sinistro
    collection: claims
    fields:
    - plate
    - event_date
    - location
    - third_parties
    - injuries
    - description
    - photos
    submit:
      label: Invia denuncia
      message: Denuncia ricevuta. Un liquidatore la prenderà in carico.
    roles:
    - user
  - key: clients
    type: table
    title: I miei clienti
    source: collection:vehicles
    columns:
    - plate
    - make
    - model
    - policy_number
    - policy_expiry
    export: true
    roles:
    - broker
  - key: client_scores
    type: table
    title: Punteggi dei clienti
    source: collection:scores
    columns:
    - month
    - plate
    - score
    - band
    - km
    export: true
    roles:
    - broker
  - key: approvals
    type: approvals
    title: Sconti da approvare
    approvals:
    - discount_approval
    roles:
    - broker
  - key: claims_queue
    type: table
    title: Coda sinistri
    source: collection:claims
    columns:
    - event_date
    - plate
    - location
    - injuries
    - status
    - description
    export: true
    roles:
    - liquidator
    - admin
  - key: portfolio
    type: page
    title: Portafoglio
    roles:
    - admin
    sections:
    - type: data
      title: Polizze attive
      source: collection:vehicles
      display: kpi
      kpis:
      - label: Veicoli registrati
        agg: count
    - type: data
      title: Punteggio medio per mese
      source: collection:scores
      display: chart
      chart: line
      fields:
      - key: month
        label: Mese
      - key: avg_score
        label: Punteggio medio
      groupBy:
        field: month
        aggs:
        - key: avg_score
          agg: avg
          field: score
    - type: data
      title: Sinistri aperti
      source: collection:claims
      display: kpi
      filters:
      - field: status
        op: '='
        value: open
      kpis:
      - label: Da lavorare
        agg: count
    - type: data
      title: Proposte di sconto
      source: collection:proposals
      display: table
      fields:
      - key: plate
        label: Targa
      - key: avg_score
        label: Punteggio medio
      - key: discount_pct
        label: Sconto %
      - key: status
        label: Stato
        format: badge
      limit: 50
  - key: workshops_admin
    type: form
    title: Officine convenzionate
    collection: workshops
    submit:
      label: Aggiungi officina
      message: Officina salvata.
    roles:
    - admin
  triggers:
  - key: trips_in
    description: Dati aggregati dalla piattaforma del partner telematico
    'on':
      webhook: true
    write:
      collection: trips
      fields:
        trip_id: trip_id
        policy_number: policy_number
        plate: plate
        date: date
        km: km
        night_km: night_km
        harsh_braking: harsh_braking
        speeding_km: speeding_km
        max_speed: max_speed
      keyBy: trip_id
  - key: renewal
    description: 45 giorni prima della scadenza prepara lo sconto
    'on':
      date:
        collection: vehicles
        field: policy_expiry
        offsetDays: -45
        hour: 7
    start:
      agent: discounter
    goal: 'Prepara la proposta di sconto al rinnovo per la polizza {record.policy_number}, targa {record.plate}, in scadenza
      il {record.policy_expiry}. Agente: {record.agent_email}.'
    asUser: true
  - key: discount_approved
    'on':
      approval: discount_approval
      decision: approved
    notify:
      to: owner
      subject: Il tuo sconto al rinnovo
      body: 'Buone notizie: il tuo agente ha approvato la proposta di sconto per il rinnovo della polizza. Trovi i dettagli
        nell''app.'
      link: my_proposals
  - key: claim_new
    'on':
      collection: claims
      op: insert
    notify:
      to:
      - role:liquidator
      subject: Nuovo sinistro {record.plate}
      body: È arrivata una nuova denuncia per la targa {record.plate}, evento del {record.event_date}. È in coda.
      link: claims_queue
  - key: claim_status
    'on':
      collection: claims
      op: update
      where:
        status: closed
    notify:
      to: owner
      subject: 'Sinistro {record.plate}: pratica chiusa'
      body: La pratica per la targa {record.plate} è stata chiusa. Per dubbi contatta il tuo agente.
      link: claim
  - key: install_confirmed
    'on':
      collection: installations
      op: insert
    notify:
      to: owner
      subject: Installazione prenotata
      body: La tua installazione della scatola nera è prenotata per il {record.date}. Porta libretto e documento.
      link: book
  - key: install_reminder
    'on':
      date:
        collection: installations
        field: start
        offsetDays: -1
        hour: 8
    notify:
      to: owner
      subject: Domani l'installazione della scatola nera
      body: Ricordati l'appuntamento di domani in officina.
      link: book
  notifications:
    emailOnRunDone: true
  billing:
    modes:
    - free
  mobile:
    appId: eu.autosereno.app
  extensions:
  - key: license_per_policy
    description: 'Licenza alla compagnia per polizza attiva: la fatturazione per polizza attiva (veicoli con polizza non scaduta)
      non è modellata nel manifest e va gestita dal contratto/fatturazione WebRobot con la compagnia.'
