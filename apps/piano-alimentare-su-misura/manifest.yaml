apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: nutripasso
  displayName: NutriPasso
  tagline: Il tuo piano alimentare settimanale, su misura e sempre aggiornato.
  description: NutriPasso calcola il tuo fabbisogno con formule standard e un agente AI compone ogni settimana un piano di
    sette giorni con ricette, porzioni e lista della spesa, usando i valori nutrizionali CREA e USDA. Ogni domenica si rigenera
    in base al tuo peso aggiornato e ai piatti che hai gradito o no.
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f5f3f'
      accent: '#e07a1f'
      background: '#f8faf5'
      foreground: '#1c2620'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Nutri
      color: primary
    - text: Passo
      color: accent
  header:
    links:
    - label: Come funziona
      href: '#come-funziona'
    - label: Fonti
      href: '#fonti'
    cta:
      label: Inizia
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  limits:
  - action: agent:planner
    per: user
    max: 3
    window: day
    roles:
    - user
  slots:
  - key: needs
    description: Fabbisogno calorico (Mifflin-St Jeor) e macronutrienti dai dati del modulo
    timeoutMs: 2000
    example:
      values:
        age: 35
        sex: f
        weight_kg: 65
        height_cm: 165
        activity: light
        goal: maintain
    code: "def main(input):\n    v = input.get('values') or input.get('args') or {}\n    w = float(v.get('weight_kg') or 70)\n\
      \    h = float(v.get('height_cm') or 170)\n    a = float(v.get('age') or 30)\n    male = v.get('sex') == 'm'\n    bmr\
      \ = 10*w + 6.25*h - 5*a + (5 if male else -161)\n    f = {'sedentary':1.2,'light':1.375,'moderate':1.55,'high':1.725}.get(v.get('activity'),\
      \ 1.375)\n    tdee = bmr*f\n    g = v.get('goal')\n    k = {'lose':0.85,'gain':1.10}.get(g, 1.0)\n    kcal = tdee*k\n\
      \    kcal = max(kcal, 1500 if male else 1200)\n    p_kg = {'lose':1.8,'gain':1.8}.get(g, 1.4)\n    protein = p_kg*w\n\
      \    fat = kcal*0.27/9\n    carb = max((kcal - protein*4 - fat*9)/4, 0)\n    return {'bmr': round(bmr), 'tdee': round(tdee),\
      \ 'kcal': round(kcal), 'protein_g': round(protein), 'fat_g': round(fat), 'carb_g': round(carb)}\n"
  agents:
  - key: planner
    role: main
    description: Compone il piano di sette giorni con ricette, porzioni e lista della spesa.
    profile:
      inline:
        display_name: NutriPasso planner
        crews:
        - id: planner
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 20
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei il pianificatore alimentare di NutriPasso. Componi piani settimanali di alimentazione per adulti
            sani, in italiano. Il fabbisogno calorico e i macro ti sono già forniti (calcolati con Mifflin-St Jeor): usali,
            non ricalcolarli. Usa i valori nutrizionali delle tabelle CREA (da tua conoscenza, citando ''CREA'') e, per gli
            alimenti che non conosci, cerca con lo strumento usda_search (query: parametro ''query'', es. ''query=lentils
            cooked&pageSize=3''; risposta JSON con foods[].foodNutrients); cita ''USDA FoodData Central''. Non inventare valori:
            se incerto, di'' che è una stima.

            REGOLE: rispetta rigorosamente dieta, allergie e cibi non graditi; rispetta budget settimanale e tempo massimo
            di cottura per pasto. Se l''utente indica di avere una patologia (health_flag), NON fornire un piano restrittivo:
            apri il report con un avviso chiaro che deve rivolgersi a un medico o dietista, e fornisci solo un''indicazione
            generale di alimentazione equilibrata. Non dare mai consigli medici né diagnosi.

            STRUTTURA del report: titolo ''# Piano alimentare — settimana del <data>''. Poi ## Il tuo fabbisogno (kcal, proteine,
            carboidrati, grassi, tabella breve), ## Piano dei 7 giorni (per ogni giorno colazione, pranzo, cena, spuntino:
            piatto, porzioni in grammi, kcal e macro approssimativi, totale giornaliero vicino al target), ## Ricette (ingredienti
            e passaggi brevi per ogni piatto distinto), ## Lista della spesa (raggruppata per reparto con quantità totali
            e costo stimato), ## Note e fonti. Termina con la frase: ''Questo piano non sostituisce il parere di un medico
            o di un dietista.'''
          mcp_servers: []
    goalTemplate: 'Profilo: {age} anni, sesso {sex_label}, {weight_kg} kg, {height_cm} cm, attività {activity_label}.

      Obiettivo: {goal_label}. Dieta: {diet_label}.

      {?allergies}Allergie/intolleranze: {allergies}{/allergies}

      {?dislikes}Cibi non graditi: {dislikes}{/dislikes}

      Budget settimanale: {budget} euro. Tempo massimo di cottura per pasto: {cook_minutes} minuti.

      {?health_flag}L''utente segnala una patologia: segui la regola sull''invito al professionista.{/health_flag}

      Fabbisogno calcolato: {kcal} kcal/giorno (BMR {bmr}, TDEE {tdee}); proteine {protein_g} g, carboidrati {carb_g} g, grassi
      {fat_g} g.

      Data di oggi: {date}. Scrivi in italiano.'
    context:
    - key: bmr
      from: slot:needs
    - key: tdee
      from: slot:needs
    - key: kcal
      from: slot:needs
    - key: protein_g
      from: slot:needs
    - key: fat_g
      from: slot:needs
    - key: carb_g
      from: slot:needs
    appTools:
    - name: usda_search
      description: Cerca valori nutrizionali in USDA FoodData Central
      action: http
      http:
        method: GET
        url: https://api.nal.usda.gov/fdc/v1/foods/search
        attribution: USDA FoodData Central, dominio pubblico (CC0)
        credential:
          provider: usda
          query: api_key
    output: markdown
    limits:
      maxTurns: 20
      maxBudgetUsd: 0.8
  - key: weekly
    role: scheduled
    description: Rigenera ogni domenica il piano dell'utente con peso aggiornato e gradimento dei piatti.
    memory: instance
    writesTo:
      collection: weekly_plans
    profile:
      inline:
        display_name: NutriPasso weekly
        crews:
        - id: weekly
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 20
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei il pianificatore settimanale di NutriPasso. Ogni domenica rigeneri il piano di sette giorni
            per una persona, in italiano. Passi: 1) prendi il peso più recente dai pesi registrati (se presente, sostituisce
            quello del profilo); 2) chiama lo strumento calc_needs con age, sex, weight_kg, height_cm, activity, goal per
            ottenere kcal e macro (non calcolare a mano); 3) leggi i piatti graditi e non graditi: riproponi alcuni graditi,
            non ripetere quelli non graditi, varia il resto rispetto alla settimana scorsa (la tua memoria contiene i piatti
            già proposti); 4) per i valori nutrizionali usa CREA (conoscenza, citandola) e usda_search (parametro query) quando
            serve; non inventare valori. Rispetta dieta, allergie, cibi non graditi, budget e tempo di cottura. Se il peso
            cambia molto in una settimana (oltre 1,5 kg) suggerisci con garbo di parlarne con un professionista. Non dare
            consigli medici né diagnosi. Struttura: ''# Piano alimentare — settimana del <data>'', ## Cosa è cambiato, ##
            Il tuo fabbisogno, ## Piano dei 7 giorni (pasti, porzioni in grammi, kcal e macro), ## Ricette, ## Lista della
            spesa con costo stimato, ## Note e fonti. Chiudi con: ''Questo piano non sostituisce il parere di un medico o
            di un dietista.'' Alla fine chiama una volta remember con i nomi dei piatti proposti.'
          mcp_servers: []
    goalTemplate: 'Rigenera il piano per "{instance}". Profilo: {age} anni, sesso {sex}, peso iniziale {weight_kg} kg, altezza
      {height_cm} cm, attività {activity}, obiettivo {goal}, dieta {diet}. Allergie: {allergies}. Cibi non graditi: {dislikes}.
      Budget settimanale {budget} euro, cottura max {cook_minutes} minuti. Note: {notes}

      Pesi registrati dall''utente (JSON): {weights}

      Gradimento dei piatti (JSON): {feedback}

      Oggi è {date}. Scrivi in italiano.'
    context:
    - key: weights
      from: collection:weigh_ins
    - key: feedback
      from: collection:dish_feedback
    appTools:
    - name: calc_needs
      description: Calcola kcal e macronutrienti (Mifflin-St Jeor) da age, sex (m|f), weight_kg, height_cm, activity (sedentary|light|moderate|high),
        goal (lose|maintain|gain)
      action: call
      slot: needs
    - name: usda_search
      description: Cerca valori nutrizionali in USDA FoodData Central
      action: http
      http:
        method: GET
        url: https://api.nal.usda.gov/fdc/v1/foods/search
        attribution: USDA FoodData Central, dominio pubblico (CC0)
        credential:
          provider: usda
          query: api_key
    output: markdown
    limits:
      maxTurns: 20
      maxBudgetUsd: 0.8
  inputForm:
    title: Nuovo piano
    fields:
    - name: age
      type: number
      required: true
      label: Età
    - name: sex
      type: select
      required: true
      label: Sesso
      options:
      - value: f
        label: Donna
      - value: m
        label: Uomo
    - name: weight_kg
      type: number
      required: true
      label: Peso (kg)
    - name: height_cm
      type: number
      required: true
      label: Altezza (cm)
    - name: activity
      type: select
      required: true
      label: Livello di attività
      options:
      - value: sedentary
        label: Sedentario
      - value: light
        label: Leggero (1-3 allenamenti a settimana)
      - value: moderate
        label: Moderato (3-5 allenamenti)
      - value: high
        label: Alto (6-7 allenamenti)
    - name: goal
      type: select
      required: true
      label: Obiettivo
      options:
      - value: lose
        label: Dimagrire
      - value: maintain
        label: Mantenere il peso
      - value: gain
        label: Aumentare la massa muscolare
    - name: diet
      type: select
      required: true
      label: Preferenze alimentari
      options:
      - value: omnivore
        label: Onnivoro
      - value: vegetarian
        label: Vegetariano
      - value: vegan
        label: Vegano
    - name: allergies
      type: text
      maxLength: 200
      label: Allergie o intolleranze
    - name: dislikes
      type: text
      maxLength: 200
      label: Cibi che non ami
    - name: budget
      type: number
      required: true
      label: Budget settimanale per la spesa (€)
    - name: cook_minutes
      type: number
      required: true
      label: Minuti disponibili per cucinare a pasto
    - name: health_flag
      type: boolean
      label: Ho una patologia o seguo una terapia
      help: 'Non chiediamo quale: ti consiglieremo di rivolgerti a un professionista.'
  templates:
  - key: weekly_plan
    title: Piano settimanale automatico
    description: Ogni domenica un nuovo piano, aggiornato con il tuo peso e i tuoi gusti.
    agent: weekly
    params:
    - name: age
      type: number
      required: true
      label: Età
    - name: sex
      type: select
      required: true
      label: Sesso
      options:
      - value: f
        label: Donna
      - value: m
        label: Uomo
    - name: weight_kg
      type: number
      required: true
      label: Peso iniziale (kg)
    - name: height_cm
      type: number
      required: true
      label: Altezza (cm)
    - name: activity
      type: select
      required: true
      label: Livello di attività
      options:
      - value: sedentary
        label: Sedentario
      - value: light
        label: Leggero
      - value: moderate
        label: Moderato
      - value: high
        label: Alto
    - name: goal
      type: select
      required: true
      label: Obiettivo
      options:
      - value: lose
        label: Dimagrire
      - value: maintain
        label: Mantenere
      - value: gain
        label: Massa muscolare
    - name: diet
      type: select
      required: true
      label: Dieta
      options:
      - value: omnivore
        label: Onnivoro
      - value: vegetarian
        label: Vegetariano
      - value: vegan
        label: Vegano
    - name: allergies
      type: text
      label: Allergie o intolleranze
    - name: dislikes
      type: text
      label: Cibi che non ami
    - name: budget
      type: number
      required: true
      label: Budget settimanale (€)
    - name: cook_minutes
      type: number
      required: true
      label: Minuti per cucinare a pasto
    - name: notes
      type: textarea
      maxLength: 300
      label: Note (facoltative)
    schedule:
      cron: 0 6 * * 0
      userCanChange: false
    maxPerUser: 1
    deliver:
      to: owner
      subject: Il tuo piano NutriPasso della settimana
      onlyIfNew: true
  data:
    collections:
    - name: weigh_ins
      ownedBy: user
      description: Pesate inserite dall'utente
      fields:
      - name: date
        type: date
        required: true
        label: Data
      - name: weight_kg
        type: number
        required: true
        label: Peso (kg)
      retentionDays: 730
    - name: dish_feedback
      ownedBy: user
      description: Piatti graditi o no
      fields:
      - name: dish
        type: text
        required: true
        label: Piatto
      - name: rating
        type: select
        required: true
        label: Giudizio
        options:
        - value: liked
          label: Mi è piaciuto
        - value: disliked
          label: Non mi è piaciuto
      retentionDays: 365
    - name: weekly_plans
      ownedBy: instance
      description: I piani generati ogni domenica
    credentials:
    - provider: usda
      kind: api_key
      scope: org
      label: Chiave API USDA FoodData Central
      help: Gratuita su fdc.nal.usda.gov/api-key-signup
  egress:
    hosts:
    - api.nal.usda.gov
    notes: 'USDA FoodData Central: dati di pubblico dominio (CC0). Le tabelle CREA sono usate come conoscenza di riferimento,
      senza chiamate esterne.'
  views:
  - key: home
    type: page
    nav: false
    title: NutriPasso
    sections:
    - type: hero
      eyebrow: Piani alimentari settimanali
      title: Mangia bene, **una settimana alla volta**.
      text: Compili un modulo, NutriPasso calcola il tuo fabbisogno e un agente AI compone sette giorni di ricette, porzioni
        e lista della spesa. Ogni domenica il piano si aggiorna con il tuo peso e i tuoi gusti.
      actions:
      - label: Prova una settimana
        href: /login
        style: primary
      - label: Come funziona
        href: '#come-funziona'
        style: ghost
    - type: steps
      id: come-funziona
      title: Come funziona
      items:
      - title: Racconta di te
        text: Età, peso, obiettivo, preferenze, allergie, budget e tempo in cucina.
      - title: Calcoliamo il fabbisogno
        text: Formule standard per calorie e macronutrienti.
      - title: Ricevi il piano
        text: Sette giorni di ricette, porzioni e lista della spesa, in pagina e per email.
      - title: Si rigenera ogni domenica
        text: Con il peso aggiornato e i piatti che hai gradito o no.
    - type: cards
      id: fonti
      title: Fonti nutrizionali
      items:
      - title: CREA
        text: Tabelle di composizione degli alimenti italiani.
      - title: USDA FoodData Central
        text: Banca dati pubblica statunitense dei valori nutrizionali.
    - type: note
      content: NutriPasso non raccoglie dati clinici né diagnosi e non sostituisce il parere di un medico o di un dietista.
        Se hai una patologia, rivolgiti a un professionista.
  - key: new_plan
    type: new_run
    title: Nuovo piano
    roles:
    - user
    - admin
  - key: plans
    type: history
    title: I miei piani
    source: run
    roles:
    - user
    - admin
  - key: plan
    type: report
    source: run
    printable: true
    nav: false
  - key: auto
    type: instances
    template: weekly_plan
    title: Piano della domenica
    roles:
    - user
    - admin
  - key: weekly_history
    type: list
    title: Piani settimanali
    source: collection:weekly_plans
    roles:
    - user
    - admin
  - key: weigh
    type: form
    collection: weigh_ins
    title: Inserisci il peso
    fields:
    - date
    - weight_kg
    submit:
      label: Salva
      message: 'Peso salvato: lo useremo domenica.'
    roles:
    - user
    - admin
  - key: feedback
    type: form
    collection: dish_feedback
    title: Com'era quel piatto?
    fields:
    - dish
    - rating
    submit:
      label: Salva
      message: Grazie, ne terremo conto.
    roles:
    - user
    - admin
  - key: account
    type: account
    title: Abbonamento
    roles:
    - user
  notifications:
    emailOnRunDone: true
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: mensile
      price: 9.9
      interval: month
      label: NutriPasso mensile
      includes:
      - Piani illimitati
      - Rigenerazione ogni domenica
      - Piano per email
  extensions:
  - key: free_trial_week
    description: 'La settimana di prova gratuita dell''abbonamento non è esprimibile nel manifesto: va configurata come periodo
      di prova nel piano Stripe del proprietario.'
  - key: crea_tables
    description: 'Le tabelle CREA non hanno un''API pubblica: l''agente le usa come conoscenza di riferimento; per dati esatti
      andrebbe caricato un dataset CREA.'
