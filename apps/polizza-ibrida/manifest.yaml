apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: portale-polizze
  displayName: Portale Polizze
  tagline:
    it: Preventivo, polizze e sinistri in un unico portale, con un consulente autorizzato accanto a te.
  description:
    it: 'Portale software di preventivo e gestione delle polizze. L''attività assicurativa regolamentata e la sottoscrizione
      dei rischi restano in capo all''intermediario autorizzato: un consulente umano verifica e perfeziona ogni pratica prima
      dell''emissione.'
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12355b'
      accent: '#1f8a70'
      background: '#f6f8fb'
      foreground: '#16222f'
    fonts:
      body: Inter
      display: Source Serif 4
    wordmark:
    - text: Portale
      color: primary
    - text: Polizze
      color: accent
  header:
    links:
    - label:
        it: Come funziona
      href: '#come-funziona'
    - label:
        it: Assistente
      href: '#assistente'
    cta:
      label:
        it: Richiedi un preventivo
      href: /v/nuovo_preventivo
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Amministratore
      assignedBy: admin_emails
    - key: consulente
      label:
        it: Consulente autorizzato
      assignedBy: invite
    - key: user
      label:
        it: Cliente
      assignedBy: signup
  limits:
  - action: agent:preventivo
    per: user
    max: 10
    window: day
    roles:
    - user
  - action: chat
    per: user
    max: 60
    window: day
    roles:
    - user
  agents:
  - key: preventivo
    role: main
    description: Stima indicativa e confronto delle coperture in parole semplici.
    profile:
      inline:
        display_name: Preventivatore
        crews:
        - id: preventivo
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 4
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''assistente di preventivo di un portale assicurativo. Non sei un intermediario: la stima è
            indicativa, non vincolante, e il prezzo definitivo e l''emissione dipendono dalla verifica di un consulente umano
            autorizzato. Non inventare tariffe esatte, compagnie o garanzie non descritte: usa intervalli di premio annuo
            chiaramente indicati come orientativi e spiega le ipotesi. Struttura obbligatoria: inizia con un titolo di primo
            livello "# Preventivo <tipo di copertura> — <data>". Poi sezioni ## Riepilogo dei dati, ## Stima indicativa (intervallo
            annuo e fattori che lo muovono), ## Coperture disponibili (tabella con copertura, cosa include, cosa esclude,
            a chi serve), ## Differenze in parole semplici, ## Cosa serve per procedere (dati e documenti, da inviare come
            link o testo incollato), ## Avvertenze (stima non vincolante, verifica del consulente, leggere il set informativo).
            Se la tabella confronta importi, aggiungi un blocco ```chart con valori reali dichiarati come orientativi. Scrivi
            in italiano, tono chiaro, senza gergo, massimo 500 parole.'
    goalTemplate: 'Tipo di copertura: {copertura_label}

      Chi o cosa si assicura: {soggetto}

      Dettagli: {dettagli}

      {?valore}Valore del bene / massimale desiderato: {valore} EUR{/valore}

      {?eta_anno}Età della persona o anno del bene: {eta_anno}{/eta_anno}

      {?provincia}Provincia: {provincia}{/provincia}

      Data di oggi: {date}. Scrivi il preventivo in italiano.'
    output: markdown
    limits:
      maxTurns: 4
      maxBudgetUsd: 0.3
  - key: assistente
    role: helper
    description: 'Chat con il cliente: spiega la copertura, prepara la pratica e apre i sinistri, poi passa al consulente.'
    awaits:
    - verifica_pratica
    - verifica_sinistro
    appTools:
    - name: leggi_polizze
      description: Legge le polizze del cliente
      action: read
      collection: polizze
      scope: user
    - name: leggi_pratiche
      description: Legge le pratiche del cliente
      action: read
      collection: pratiche
      scope: user
    - name: crea_pratica
      description: Crea la pratica di nuova polizza con dati e link ai documenti
      action: write
      collection: pratiche
      scope: user
    - name: apri_sinistro
      description: Registra la richiesta di sinistro compilata col cliente
      action: write
      collection: sinistri
      scope: user
    profile:
      inline:
        display_name: Assistente cliente
        chat_mode: true
        crews:
        - id: assistente
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''assistente di un portale assicurativo per i clienti. L''attività regolamentata e la sottoscrizione
            dei rischi spettano all''intermediario autorizzato: tu non emetti polizze, non accetti rischi, non confermi indennizzi
            e non dai consulenza personalizzata come fatto. Fai tre cose. (1) Spieghi la copertura: leggi le polizze del cliente
            con leggi_polizze e rispondi in parole semplici, citando solo ciò che è nei dati; se manca, dillo e rimanda al
            consulente. (2) Prepari una pratica di nuova polizza: raccogli a domande guidate i dati necessari al tipo di copertura
            e i documenti, che il cliente fornisce come link o testo incollato (il caricamento file non è ancora disponibile);
            riepiloga, chiedi conferma, poi usa crea_pratica e request_verifica_pratica: il consulente verifica e perfeziona
            prima dell''emissione. (3) Apri un sinistro con modulo guidato, una domanda per volta: polizza, data e luogo,
            descrizione, danni, persone coinvolte, link alle foto; in caso di pericolo o feriti invita prima a chiamare i
            soccorsi. Riepiloga, chiedi conferma, usa apri_sinistro e request_verifica_sinistro, e spiega che la pratica passa
            all''operatore. Non inventare numeri di polizza, importi o tempi. Rispondi in italiano, breve e cordiale.

            '
    goalTemplate: 'Cliente: {user}. Data: {date}.

      Conversazione finora:

      {history}

      Nuovo messaggio: {message}'
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.4
  inputForm:
    title:
      it: Richiedi un preventivo
    fields:
    - name: copertura
      type: select
      required: true
      label:
        it: Tipo di copertura
      options:
      - value: persona
        label:
          it: Persona (infortuni, salute, vita)
      - value: famiglia
        label:
          it: Famiglia (casa, responsabilità civile)
      - value: attivita
        label:
          it: Attività (negozio, studio, impresa)
      - value: bene
        label:
          it: Bene (auto, moto, immobile, altro)
    - name: soggetto
      type: text
      required: true
      label:
        it: Chi o cosa vuoi assicurare
      maxLength: 200
    - name: eta_anno
      type: number
      label:
        it: Età della persona o anno del bene
    - name: valore
      type: number
      label:
        it: Valore del bene / massimale (EUR)
    - name: provincia
      type: text
      label:
        it: Provincia
    - name: dettagli
      type: textarea
      required: true
      maxLength: 800
      label:
        it: Dettagli utili
      help:
        it: Es. composizione del nucleo, attività svolta, uso del bene, esigenze particolari.
  data:
    collections:
    - name: polizze
      ownedBy: user
      description: Polizze emesse del cliente e link ai documenti
      fields:
      - name: numero
        type: text
        label: Numero
      - name: copertura
        type: text
        label: Copertura
      - name: stato
        type: select
        options:
        - attiva
        - scaduta
        - in_rinnovo
        label: Stato
      - name: scadenza
        type: date
        label: Scadenza
      - name: premio
        type: number
        label: Premio annuo
      - name: documenti
        type: urls
        label: Documenti
    - name: pratiche
      ownedBy: user
      description: Pratiche di nuova polizza in verifica dal consulente
      fields:
      - name: copertura
        type: text
        label: Copertura
      - name: dati
        type: textarea
        label: Dati raccolti
      - name: documenti
        type: urls
        label: Link ai documenti
      - name: stato
        type: select
        options:
        - bozza
        - in_verifica
        - emessa
        - respinta
        label: Stato
      - name: note_consulente
        type: textarea
        label: Note del consulente
    - name: sinistri
      ownedBy: user
      description: Richieste di sinistro aperte dal cliente
      fields:
      - name: polizza
        type: text
        label: Polizza
      - name: data_evento
        type: date
        label: Data evento
      - name: luogo
        type: text
        label: Luogo
      - name: descrizione
        type: textarea
        label: Descrizione
      - name: foto
        type: urls
        label: Link alle foto
      - name: stato
        type: select
        options:
        - aperto
        - in_gestione
        - chiuso
        label: Stato
  approvals:
  - key: verifica_pratica
    title:
      it: Verifica pratica di nuova polizza
    description: Il consulente autorizzato verifica e perfeziona la pratica prima dell'emissione.
    role: consulente
    fields:
    - copertura
    - dati
    - documenti
    timeoutMinutes: 10080
    onTimeout: reject
  - key: verifica_sinistro
    title:
      it: Presa in carico sinistro
    description: L'operatore prende in carico la richiesta di sinistro.
    role: consulente
    fields:
    - polizza
    - data_evento
    - descrizione
    - foto
    timeoutMinutes: 4320
    onTimeout: reject
  views:
  - key: home
    type: page
    title: Portale Polizze
    nav: false
    sections:
    - type: hero
      layout: stack
      band: true
      eyebrow:
        it: Preventivo e gestione polizze
      title:
        it: Una **stima immediata**, poi un consulente vero che perfeziona la tua polizza.
      text:
        it: Compili un modulo, ricevi subito una stima e le coperture spiegate in parole semplici. Se procedi, prepariamo
          la pratica e un consulente autorizzato la verifica prima dell'emissione.
      actions:
      - label:
          it: Richiedi un preventivo
        href: /v/nuovo_preventivo
        style: primary
      - label:
          it: Accedi
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
      items:
      - title:
          it: Stima
        text:
          it: 'Indichi persona, famiglia, attività o bene: l''agente mostra una stima e confronta le coperture.'
        badge: 📝
      - title:
          it: Pratica
        text:
          it: Raccogliamo dati e documenti (come link o testo) e prepariamo la pratica.
        badge: 📂
      - title:
          it: Verifica umana
        text:
          it: Un consulente autorizzato verifica e perfeziona prima dell'emissione.
        badge: ✅
      - title:
          it: Area personale
        text:
          it: Polizza e documenti restano nella tua area, visibili solo a te.
        badge: 🔒
    - type: cards
      id: assistente
      title:
        it: Un assistente sempre disponibile
      items:
      - title:
          it: Capire la copertura
        text:
          it: Chiedi cosa copre la tua polizza e cosa no.
      - title:
          it: Aprire un sinistro
        text:
          it: Modulo guidato in chat, con link alle foto; poi la pratica passa all'operatore.
    - type: note
      content:
        it: Lo strato software è incluso nel servizio. L'attività assicurativa regolamentata e la sottoscrizione dei rischi
          restano in capo all'intermediario autorizzato. Le stime sono indicative e non vincolanti; leggi sempre il set informativo
          prima di sottoscrivere.
  - key: nuovo_preventivo
    type: new_run
    title:
      it: Nuovo preventivo
    roles:
    - user
    - admin
  - key: preventivi
    type: history
    title:
      it: I miei preventivi
    source: run
    roles:
    - user
    - admin
  - key: preventivo_report
    type: report
    source: run
    printable: true
    nav: false
  - key: assistente_chat
    type: chat
    title:
      it: Assistente
    source: agent:assistente
    examples:
    - Cosa copre la mia polizza?
    - Voglio aprire un sinistro
    - Vorrei procedere con la pratica del preventivo
    placeholder:
      it: Scrivi qui la tua domanda…
    roles:
    - user
    - admin
  - key: mie_polizze
    type: table
    title:
      it: Le mie polizze
    source: collection:polizze
    data:
      display: table
      fields:
      - key: numero
        label: Numero
      - key: copertura
        label: Copertura
      - key: stato
        label: Stato
        format: badge
      - key: scadenza
        label: Scadenza
        format: date
      - key: premio
        label: Premio
        format: money
      - key: documenti
        label: Documenti
        format: link
      sort:
        field: scadenza
        dir: asc
      empty:
        it: Nessuna polizza emessa.
    roles:
    - user
  - key: mie_pratiche
    type: table
    title:
      it: Le mie pratiche
    source: collection:pratiche
    data:
      display: table
      fields:
      - key: copertura
        label: Copertura
      - key: stato
        label: Stato
        format: badge
      - key: note_consulente
        label: Note del consulente
      empty:
        it: Nessuna pratica.
    roles:
    - user
  - key: miei_sinistri
    type: table
    title:
      it: I miei sinistri
    source: collection:sinistri
    data:
      display: table
      fields:
      - key: polizza
        label: Polizza
      - key: data_evento
        label: Data
        format: date
      - key: descrizione
        label: Descrizione
      - key: stato
        label: Stato
        format: badge
      sort:
        field: data_evento
        dir: desc
      empty:
        it: Nessun sinistro aperto.
    roles:
    - user
  - key: verifiche
    type: approvals
    title:
      it: Da verificare
    approvals:
    - verifica_pratica
    - verifica_sinistro
    roles:
    - consulente
    - admin
  billing:
    modes:
    - free
  extensions:
  - key: caricamento_file
    description: 'Il caricamento di documenti e foto non è ancora disponibile: il cliente fornisce link o testo incollato.'
  - key: promemoria_email
    description: 'Promemoria email per scadenze e rinnovi non disponibili ancora (le notifiche non sono supportate): la scadenza
      è visibile nell''area personale.'
  - key: clienti_seguiti
    description: La vista del consulente sui clienti che segue (oltre alle approvazioni) richiede un back office dedicato;
      ora il consulente decide le pratiche nella vista Da verificare.
  - key: emissione_polizza
    description: L'emissione e il caricamento della polizza e dei documenti nell'area del cliente avvengono a cura dell'intermediario
      autorizzato.
