apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: polizze-portale
  displayName: Portale Polizze
  tagline:
    it: Preventivo in pochi minuti, polizze e sinistri in un'unica area personale.
  description:
    it: 'Portale software per un intermediario assicurativo autorizzato: stima immediata, pratica verificata da un consulente
      umano, area personale con polizze e documenti, assistente per i sinistri e promemoria di scadenza. L''attività assicurativa
      regolamentata e la sottoscrizione dei rischi restano in capo all''intermediario.'
  langs:
  - it
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12355b'
      accent: '#1f8a70'
      background: '#f6f8fb'
      foreground: '#16202c'
    fonts:
      body: Inter
      display: Fraunces
  header:
    links:
    - label: Come funziona
      href: '#come-funziona'
    cta:
      label: Richiedi una stima
      href: /v/new_quote
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      label: Cliente
      assignedBy: signup
    - key: advisor
      label: Consulente autorizzato
      assignedBy: invite
  limits:
  - action: agent:quote
    per: user
    max: 10
    window: day
    roles:
    - user
  - action: chat
    per: user
    max: 60
    window: day
    roles:
    - user
  agents:
  - key: quote
    role: main
    description: Mostra una stima indicativa e le coperture disponibili spiegandone le differenze.
    profile:
      inline:
        display_name: Assistente preventivi
        crews:
        - id: quote
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 4
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''assistente preventivi del portale di un intermediario assicurativo autorizzato. Non sottoscrivi
            rischi e non emetti polizze: dai solo una STIMA INDICATIVA e non vincolante. Scrivi in italiano semplice. Struttura:
            titolo di primo livello "# Stima per <tipo di copertura>"; poi sezioni ## Riepilogo dei dati, ## Stima indicativa
            (un intervallo annuo in euro, con le ipotesi dichiarate), ## Coperture disponibili (tabella con copertura, cosa
            include, cosa NON include, per chi è adatta), ## Differenze in parole semplici, ## Cosa serve per procedere (dati
            e documenti), ## Avvertenze. Se i dati non bastano, dillo e indica l''intervallo più ampio. Non inventare cifre
            di mercato precise, premi definitivi, massimali o garanzie di compagnie specifiche, e non dare consulenza legale
            o finanziaria come fatto. Ricorda che la pratica è verificata e perfezionata da un consulente umano autorizzato
            prima dell''emissione. Se utile, aggiungi un grafico con blocco chart che confronti le coperture con valori reali
            dichiarati come indicativi.'
    goalTemplate: 'Tipo di copertura: {cover_type_label}

      Città/zona: {city}

      {?value}Valore del bene o massimale desiderato: {value} euro{/value}

      Dettagli forniti dal cliente: {details}

      {?insured_count}Persone da assicurare: {insured_count}{/insured_count}

      Data di oggi: {date}. Scrivi in italiano (lingua {lang}).'
    output: markdown
    limits:
      maxTurns: 6
      maxBudgetUsd: 0.3
  - key: assistant
    role: helper
    description: Assiste il cliente in chat su coperture e sinistri e apre le richieste di sinistro.
    memory: user
    profile:
      inline:
        display_name: Assistente clienti e sinistri
        crews:
        - id: assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''assistente clienti del portale di un intermediario assicurativo autorizzato. Rispondi in
            italiano semplice. Usa lo strumento practices_read per leggere le pratiche e le polizze del cliente e spiegare
            in parole semplici cosa copre la sua polizza, citando solo ciò che trovi nei dati: se un''informazione non c''è,
            dillo e rimanda al consulente. Non decidi sulla copertura di un sinistro, non prometti rimborsi, non dai consulenza
            legale. Per un sinistro: chiedi in ordine polizza interessata, data e luogo dell''evento, descrizione, eventuali
            terzi coinvolti, danni stimati, e invita a caricare le foto con il modulo ''Apri sinistro'' (ID dei file letti
            con read_upload se il cliente li indica). Quando hai i dati, riepilogali, chiedi conferma e usa claim_open per
            aprire la richiesta con stato ''aperto''. Poi spiega che la pratica passa al consulente umano che contatterà il
            cliente. In caso di emergenza o pericolo invita a chiamare i numeri di emergenza.'
    goalTemplate: 'Conversazione finora:

      {history}


      Nuovo messaggio del cliente ({user}): {message}

      Oggi è {date}.'
    appTools:
    - name: practices_read
      description: Legge le pratiche e le polizze del cliente
      action: read
      collection: practices
      scope: user
    - name: claim_open
      description: Apre una richiesta di sinistro del cliente
      action: append
      collection: claims
      scope: user
    - name: read_upload
      description: Legge un file caricato dal cliente (foto o documento)
      action: read_file
    output: markdown
    limits:
      maxTurns: 10
      maxBudgetUsd: 0.4
  inputForm:
    title: Richiedi una stima
    fields:
    - name: cover_type
      type: select
      required: true
      label: Che cosa vuoi assicurare?
      options:
      - value: persona
        label: Persona (infortuni, salute, vita)
      - value: famiglia
        label: Famiglia
      - value: attivita
        label: Attività / impresa
      - value: bene
        label: Bene (casa, auto, altro)
    - name: city
      type: text
      required: true
      label: Città di residenza o sede
    - name: insured_count
      type: number
      label: Persone da assicurare (se applicabile)
    - name: value
      type: number
      label: Valore del bene o massimale desiderato (euro)
    - name: details
      type: textarea
      required: true
      maxLength: 1200
      label: Descrivi la tua situazione
      help: Es. età, tipo di attività, caratteristiche del bene, esigenze particolari. Non inserire dati sanitari dettagliati.
  data:
    collections:
    - name: practices
      description: 'Pratiche di polizza: dai dati raccolti alla polizza emessa'
      ownedBy: user
      fields:
      - name: cover_type
        type: select
        required: true
        label: Tipo di copertura
        options:
        - value: persona
          label: Persona
        - value: famiglia
          label: Famiglia
        - value: attivita
          label: Attività
        - value: bene
          label: Bene
      - name: full_name
        type: text
        required: true
        label: Nome e cognome / ragione sociale
      - name: tax_code
        type: text
        required: true
        label: Codice fiscale / P.IVA
      - name: contact_email
        type: email
        required: true
        label: Email di contatto
      - name: phone
        type: text
        label: Telefono
      - name: details
        type: textarea
        required: true
        label: Dati della copertura richiesta
        help: Descrivi persone, attività o bene da assicurare, valori e decorrenza desiderata
      - name: documents
        type: file
        accept:
        - pdf
        - jpg
        - png
        - docx
        maxMb: 10
        multiple: true
        label: Documenti (identità, libretto, visura, ecc.)
      - name: status
        type: select
        default: in_verifica
        label: Stato
        options:
        - value: in_verifica
          label: In verifica dal consulente
        - value: integrazione
          label: Richiesta integrazione
        - value: emessa
          label: Polizza emessa
        - value: rifiutata
          label: Non procede
      - name: advisor_notes
        type: textarea
        label: Note del consulente
      - name: policy_number
        type: text
        label: Numero polizza
      - name: insurer
        type: text
        label: Compagnia
      - name: premium
        type: number
        label: Premio annuo (euro)
      - name: expiry_date
        type: date
        label: Scadenza / rinnovo
      - name: policy_documents
        type: file
        accept:
        - pdf
        maxMb: 15
        multiple: true
        label: Polizza e documenti emessi
      access:
      - role: advisor
        can:
        - read
        - write
    - name: claims
      description: Richieste di sinistro
      ownedBy: user
      fields:
      - name: policy_number
        type: text
        required: true
        label: Numero di polizza
      - name: event_date
        type: date
        required: true
        label: Data dell'evento
      - name: place
        type: text
        required: true
        label: Luogo
      - name: description
        type: textarea
        required: true
        label: Cosa è successo
      - name: third_parties
        type: textarea
        label: Terzi coinvolti (nome, contatti, targa)
      - name: estimated_damage
        type: number
        label: Danno stimato (euro)
      - name: photos
        type: file
        accept:
        - jpg
        - png
        - pdf
        maxMb: 10
        multiple: true
        label: Foto e documenti
      - name: contact_email
        type: email
        required: true
        label: Email di contatto
      - name: status
        type: select
        default: aperto
        label: Stato
        options:
        - value: aperto
          label: Aperto
        - value: in_gestione
          label: In gestione dal consulente
        - value: chiuso
          label: Chiuso
      - name: advisor_notes
        type: textarea
        label: Note del consulente
      access:
      - role: advisor
        can:
        - read
        - write
      retentionDays: 3650
  views:
  - key: home
    type: page
    title: Portale Polizze
    nav: false
    sections:
    - type: hero
      layout: stack
      title: La tua assicurazione, **semplice** e a portata di mano
      text: Ottieni subito una stima e capisci le differenze tra le coperture. Se prosegui, un consulente autorizzato verifica
        la tua pratica prima dell'emissione. Polizze, documenti e sinistri sempre nella tua area personale.
      actions:
      - label: Richiedi una stima
        href: /v/new_quote
        style: primary
      - label: Accedi
        href: /login
        style: ghost
    - type: steps
      id: come-funziona
      title: Come funziona
      items:
      - title: 1 · Stima immediata
        text: Compili un modulo sulla copertura che cerchi e ricevi una stima indicativa con le coperture spiegate in parole
          semplici.
        badge: 📝
      - title: 2 · Pratica verificata
        text: 'Se prosegui, carichi dati e documenti: un consulente umano autorizzato verifica e perfeziona la pratica prima
          dell''emissione.'
        badge: ✅
      - title: 3 · Area personale
        text: La polizza emessa e i documenti sono sempre disponibili. Ricevi un promemoria prima di ogni scadenza.
        badge: 📂
      - title: 4 · Sinistri con assistente
        text: Un assistente in chat ti aiuta a capire la copertura e ad aprire un sinistro con foto, poi passa la pratica
          al consulente.
        badge: 💬
    - type: note
      content: 'Il portale è lo strato software al servizio dell''intermediario assicurativo autorizzato, incluso nel servizio.
        La stima non è vincolante: l''attività assicurativa regolamentata e la sottoscrizione dei rischi restano in capo all''intermediario.'
  - key: new_quote
    type: new_run
    title: Nuova stima
    roles:
    - user
    - admin
  - key: quotes
    type: history
    title: Le mie stime
    source: run
    roles:
    - user
    - admin
  - key: quote
    type: report
    source: run
    printable: true
    nav: false
  - key: new_practice
    type: form
    title: Procedi con la pratica
    collection: practices
    fields:
    - cover_type
    - full_name
    - tax_code
    - contact_email
    - phone
    - details
    - documents
    submit:
      label: Invia la pratica al consulente
      message: Pratica inviata. Un consulente autorizzato la verificherà e ti contatterà.
      redirect: my_policies
    edit: false
    roles:
    - user
  - key: my_policies
    type: page
    title: Le mie polizze e pratiche
    roles:
    - user
    sections:
    - type: data
      title: Polizze emesse
      source: collection:practices
      display: table
      fields:
      - key: cover_type
        label: Copertura
        format: badge
      - key: insurer
        label: Compagnia
      - key: policy_number
        label: Numero polizza
      - key: premium
        label: Premio annuo
        format: money
      - key: expiry_date
        label: Scadenza
        format: date
      - key: policy_documents
        label: Documenti
      filters:
      - field: status
        op: '='
        value: emessa
      sort:
        field: expiry_date
        dir: asc
      empty: Nessuna polizza emessa.
    - type: data
      title: Le mie pratiche
      source: collection:practices
      display: table
      fields:
      - key: cover_type
        label: Copertura
        format: badge
      - key: status
        label: Stato
        format: badge
      - key: advisor_notes
        label: Note del consulente
      filters:
      - field: status
        op: '!='
        value: emessa
      empty: Nessuna pratica in corso.
    - type: data
      title: I miei sinistri
      source: collection:claims
      display: table
      fields:
      - key: event_date
        label: Data
        format: date
      - key: policy_number
        label: Polizza
      - key: status
        label: Stato
        format: badge
      - key: advisor_notes
        label: Note del consulente
      sort:
        field: event_date
        dir: desc
      empty: Nessun sinistro aperto.
  - key: assistant_chat
    type: chat
    title: Assistente
    source: agent:assistant
    examples:
    - Cosa copre la mia polizza?
    - Devo aprire un sinistro
    - Quando scade la mia polizza?
    placeholder: Scrivi la tua domanda o descrivi il sinistro
    roles:
    - user
    - admin
  - key: new_claim
    type: form
    title: Apri sinistro
    collection: claims
    fields:
    - policy_number
    - event_date
    - place
    - description
    - third_parties
    - estimated_damage
    - photos
    - contact_email
    submit:
      label: Invia il sinistro
      message: Sinistro inviato. Il consulente prenderà in carico la pratica.
      redirect: my_policies
    edit: false
    roles:
    - user
  - key: advisor_practices
    type: table
    title: Pratiche clienti
    source: collection:practices
    columns:
    - full_name
    - cover_type
    - status
    - policy_number
    - expiry_date
    export: true
    roles:
    - advisor
    - admin
  - key: advisor_claims
    type: table
    title: Sinistri clienti
    source: collection:claims
    columns:
    - event_date
    - policy_number
    - place
    - status
    - estimated_damage
    roles:
    - advisor
    - admin
  triggers:
  - key: new_practice_notice
    'on':
      collection: practices
      op: insert
    notify:
      to:
      - role:advisor
      - admins
      subject: 'Nuova pratica da verificare: {record.full_name}'
      body: Un cliente ha inviato una pratica ({record.cover_type}). Verificala e perfezionala prima dell'emissione.
      link: advisor_practices
  - key: practice_issued
    'on':
      collection: practices
      op: update
      where:
        status: emessa
    notify:
      to:
      - owner
      - record.contact_email
      subject: La tua polizza è stata emessa
      body: La polizza {record.policy_number} è disponibile nella tua area personale insieme ai documenti.
      link: my_policies
  - key: practice_integration
    'on':
      collection: practices
      op: update
      where:
        status: integrazione
    notify:
      to:
      - owner
      - record.contact_email
      subject: Serve un'integrazione alla tua pratica
      body: 'Il consulente ha bisogno di ulteriori informazioni: {record.advisor_notes}'
      link: my_policies
  - key: new_claim_notice
    'on':
      collection: claims
      op: insert
    notify:
      to:
      - role:advisor
      - admins
      subject: 'Nuovo sinistro: polizza {record.policy_number}'
      body: È stato aperto un sinistro del {record.event_date}. Prendi in carico la pratica.
      link: advisor_claims
  - key: renewal_reminder
    'on':
      date:
        collection: practices
        field: expiry_date
        offsetDays: -30
        hour: 8
      where:
        status: emessa
    notify:
      to:
      - owner
      - record.contact_email
      subject: La tua polizza {record.policy_number} scade tra 30 giorni
      body: La polizza scade il {record.expiry_date}. Contatta il consulente per il rinnovo o per valutare alternative.
      link: my_policies
  - key: expiry_reminder
    'on':
      date:
        collection: practices
        field: expiry_date
        offsetDays: -3
        hour: 8
      where:
        status: emessa
    notify:
      to:
      - owner
      - record.contact_email
      subject: 'Ultimi giorni: la polizza {record.policy_number} sta per scadere'
      body: La polizza scade il {record.expiry_date}. Se vuoi rinnovarla, scrivi al consulente.
      link: my_policies
  billing:
    modes:
    - free
  extensions:
  - key: consulente_assegnato
    description: 'Assegnazione di ciascun cliente a un consulente specifico: ora i consulenti invitati vedono tutte le pratiche;
      l''assegnazione per cliente richiede che un amministratore registri l''email del consulente sulla pratica.'
  - key: caricamento_polizza_emessa
    description: 'L''emissione resta un atto del consulente autorizzato: il consulente aggiorna la pratica (numero, compagnia,
      premio, scadenza, PDF). Nessuna integrazione con i sistemi delle compagnie.'
