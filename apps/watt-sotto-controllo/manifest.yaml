apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: watt-sotto-controllo
  displayName: Watt sotto Controllo
  tagline:
    it: Trova gli sprechi di energia dei tuoi edifici e sai quanto risparmi.
    en: Find the energy waste in your buildings and know what you save.
  description:
    it: 'Piattaforma di analisi dei consumi energetici per edifici commerciali e industriali: un agente AI legge le curve
      di consumo, individua sprechi e anomalie, stima il risparmio degli interventi con i prezzi del tuo contratto e ti scrive
      un report mensile. Solo strato software: sensori e hardware sono esclusi.'
    en: 'Energy consumption analytics for commercial and industrial buildings: an AI agent reads load curves, spots waste
      and anomalies, estimates the savings of each action using your contract prices and writes a monthly report. Software
      layer only: sensors and hardware are not included.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#0b3d2e'
      accent: '#f2a900'
      background: '#f6f8f5'
      foreground: '#14201a'
    fonts:
      body: Inter
      display: Space Grotesk
    wordmark:
    - text: 'Watt sotto '
      color: primary
    - text: Controllo
      color: accent
    button: primary
    width: wide
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Cosa rileva
        en: What it detects
      href: '#rilevazioni'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: user
      label:
        it: Gestore edificio
        en: Building manager
      assignedBy: signup
    - key: maintainer
      label:
        it: Manutentore
        en: Maintainer
      assignedBy: invite
  limits:
  - action: agent:analyst
    per: user
    max: 10
    window: day
    roles:
    - user
  - action: chat
    per: user
    max: 60
    window: day
    roles:
    - user
  slots:
  - key: period_range
    description: Start and end date of the analysis period from the chosen period
    timeoutMs: 2000
    example:
      values:
        period: prev_month
      lang: it
    code: "import datetime\n\ndef main(input):\n    v = input.get('values') or {}\n    p = v.get('period') or 'last_30d'\n\
      \    today = datetime.date.today()\n    if p == 'prev_month':\n        first = today.replace(day=1)\n        end = first\
      \ - datetime.timedelta(days=1)\n        start = end.replace(day=1)\n    elif p == 'last_7d':\n        end = today -\
      \ datetime.timedelta(days=1)\n        start = end - datetime.timedelta(days=6)\n    else:\n        end = today - datetime.timedelta(days=1)\n\
      \        start = end - datetime.timedelta(days=29)\n    return {'start': start.isoformat(), 'end': end.isoformat()}\n"
  agents:
  - key: analyst
    role: main
    description: Imports pasted CSV readings (optional), analyses the load curves of one site and writes the report with waste,
      anomalies and estimated savings.
    profile:
      inline:
        display_name: Watt sotto Controllo analyst
        crews:
        - id: analyst
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un energy manager esperto di edifici commerciali e industriali. Lavori solo con i dati dell''utente,
            letti con gli strumenti: sede (orari di attività, contratto con prezzi dell''energia, fattore di emissione), impianti
            (tipo, potenza nominale, orari) e letture di consumo a 15 minuti. Se l''utente ha incollato un CSV (colonne: timestamp,
            asset, kwh), salvalo prima con append_readings, scartando le righe non valide e dicendo quante ne hai scartate.
            Poi analizza il periodo richiesto: (1) consumi totali e profilo giornaliero; (2) sprechi: impianti accesi fuori
            orario, di notte, nei festivi o nel weekend, carico di base (baseload) eccessivo; (3) picchi anomali; (4) apparecchiature
            che consumano più del normale rispetto alla loro storia o alla potenza nominale. Per ogni problema stima kWh sprecati,
            costo con i prezzi del contratto (usa le fasce orarie se presenti) e risparmio annuo dell''intervento consigliato,
            dichiarando le ipotesi. Registra ogni anomalia importante con append_alerts (site, asset, severity low|medium|high,
            kind, message, detected_at, est_saving_eur_year). Le emissioni usano il fattore della sede; se manca, dillo e
            usa un valore indicato come ipotesi. NON inventare dati: se le letture sono poche o hanno buchi, dichiaralo e
            abbassa la fiducia. Non dare consulenza legale o fiscale. Struttura del report: titolo di livello 1 "# <Sede>
            — analisi consumi <periodo>"; poi ## Sintesi (3 KPI in tabella: kWh, costo, kg CO2); ## Sprechi e anomalie (tabella:
            impianto, problema, kWh, costo, gravità); ## Interventi consigliati (ordinati per risparmio annuo, con costo stimato
            e tempo di ritorno se noto); ## Qualità dei dati. Aggiungi un blocco ```chart``` di tipo line o bar con i consumi
            per giorno, con valori reali: {"type":"bar","title":"...","labels":[...],"series":[{"name":"kWh","values":[...]}],"unit":"kWh"}.
            Scrivi nella lingua richiesta.'
    appTools:
    - name: read_sites
      description: Read the user's sites with hours, contract prices and emission factor
      action: read
      collection: sites
      scope: user
    - name: read_assets
      description: Read the user's equipment
      action: read
      collection: assets
      scope: user
    - name: read_readings
      description: Read consumption readings
      action: read
      collection: readings
      scope: user
    - name: append_readings
      description: Store new consumption readings parsed from pasted CSV
      action: append
      collection: readings
      scope: user
    - name: append_alerts
      description: Record a detected anomaly as an alert
      action: append
      collection: alerts
      scope: user
    context:
    - key: start
      from: slot:period_range
    - key: end
      from: slot:period_range
    goalTemplate: 'Sede: {site}

      Periodo: dal {start} al {end}.

      {?focus}Attenzione particolare a: {focus}{/focus}

      {?csv}CSV incollato dall''utente (timestamp,asset,kwh):

      {csv}{/csv}{!csv}Nessun CSV nuovo: usa le letture già presenti.{/csv}

      Data di oggi: {date}. Scrivi il report nella lingua con codice ISO {lang}.'
    output: markdown
    limits:
      maxTurns: 25
      maxBudgetUsd: 1.5
  - key: monitor
    role: scheduled
    description: 'Daily check of one site: looks at yesterday''s readings and records new anomalies as alerts.'
    memory: instance
    writesTo:
      collection: watch_runs
    profile:
      inline:
        display_name: Watt sotto Controllo monitor
        crews:
        - id: monitor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Controlli ogni giorno una sede. Leggi sede, impianti e le letture dell''ultimo giorno disponibile
            con gli strumenti, confrontale con il comportamento tipico (la tua memoria contiene i valori tipici emersi in
            precedenza) e con gli orari di attività. Cerca: impianti accesi fuori orario/notte/festivi, picchi anomali, impianti
            che consumano più del normale. Per ogni nuova anomalia chiama append_alerts (site, asset, severity low|medium|high,
            kind, message, detected_at, est_saving_eur_year) senza duplicare quelle già note. Non inventare dati; se mancano
            letture, segnalalo come unico avviso. Rispondi con "# <Sede> — controllo del <data>", poi ## Esito (1-3 righe),
            ## Anomalie nuove (elenco o ''nessuna''), ## Dati ricevuti. Meno di 200 parole. Alla fine chiama remember una
            volta con i valori tipici aggiornati (baseload, picco giornaliero per impianto).'
    appTools:
    - name: read_sites
      description: Read the user's sites with hours, contract prices and emission factor
      action: read
      collection: sites
      scope: user
    - name: read_assets
      description: Read the user's equipment
      action: read
      collection: assets
      scope: user
    - name: read_readings
      description: Read consumption readings
      action: read
      collection: readings
      scope: user
    - name: append_alerts
      description: Record a detected anomaly as an alert
      action: append
      collection: alerts
      scope: user
    goalTemplate: Controlla la sede {site} per il giorno più recente con letture. Oggi è {date}. Scrivi nella lingua con codice
      ISO {lang}.
  - key: reporter
    role: scheduled
    description: 'Monthly report of one site: consumption, cost, emissions and recommended actions.'
    writesTo:
      collection: monthly_reports
    profile:
      inline:
        display_name: Watt sotto Controllo monthly reporter
        crews:
        - id: reporter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 20
          max_budget_usd: 1.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Scrivi il report mensile dei consumi di una sede, leggendo con gli strumenti sede (contratto, fattore
            di emissione), impianti, letture del mese precedente e alert registrati. Titolo "# <Sede> — report energia <mese
            anno>". Sezioni: ## Sintesi (kWh, costo, kg CO2, variazione rispetto al mese prima se i dati ci sono), ## Consumi
            per impianto (tabella), ## Sprechi e anomalie del mese, ## Azioni consigliate (ordinate per risparmio annuo stimato
            con prezzi del contratto, ipotesi dichiarate), ## Qualità dei dati. Aggiungi un blocco ```chart``` con i consumi
            per impianto o per giorno, solo con valori reali. Non inventare cifre né dare consulenza fiscale; se i dati sono
            incompleti dillo.'
    appTools:
    - name: read_sites
      description: Read the user's sites with hours, contract prices and emission factor
      action: read
      collection: sites
      scope: user
    - name: read_assets
      description: Read the user's equipment
      action: read
      collection: assets
      scope: user
    - name: read_readings
      description: Read consumption readings
      action: read
      collection: readings
      scope: user
    - name: read_alerts
      description: Read alerts
      action: read
      collection: alerts
      scope: user
    goalTemplate: Report mensile della sede {site} per il mese precedente a {date}. Scrivi nella lingua con codice ISO {lang}.
  - key: advisor
    role: helper
    description: Chat assistant that explains consumption, alerts and reports to the building manager.
    profile:
      inline:
        display_name: Watt sotto Controllo advisor
        chat_mode: true
        crews:
        - id: advisor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''assistente energetico del gestore di un edificio. Rispondi alle domande spiegando consumi,
            alert, costi e report usando gli strumenti per leggere sedi, impianti, letture, alert e report mensili. Sii concreto
            e breve, cita sempre i dati su cui ti basi (impianto, periodo, kWh, euro). Non inventare cifre: se un dato manca,
            dillo e suggerisci come ottenerlo (per esempio caricare il CSV). Non dare consulenza legale o fiscale. Rispondi
            nella lingua dell''utente.'
    appTools:
    - name: read_sites
      description: Read the user's sites with hours, contract prices and emission factor
      action: read
      collection: sites
      scope: user
    - name: read_assets
      description: Read the user's equipment
      action: read
      collection: assets
      scope: user
    - name: read_readings
      description: Read consumption readings
      action: read
      collection: readings
      scope: user
    - name: read_alerts
      description: Read alerts
      action: read
      collection: alerts
      scope: user
    - name: read_reports
      description: Read monthly reports
      action: read
      collection: monthly_reports
      scope: user
    goalTemplate: 'Conversazione finora:

      {history}


      Nuovo messaggio dell''utente: {message}

      Oggi è {date}. Rispondi nella lingua con codice ISO {lang}.'
    output: markdown
  inputForm:
    title:
      it: Nuova analisi
      en: New analysis
    fields:
    - name: site
      type: relation
      relation: sites
      required: true
      label:
        it: Sede
        en: Site
    - name: period
      type: select
      required: true
      default: prev_month
      label:
        it: Periodo
        en: Period
      options:
      - value: last_7d
        label:
          it: Ultimi 7 giorni
          en: Last 7 days
      - value: last_30d
        label:
          it: Ultimi 30 giorni
          en: Last 30 days
      - value: prev_month
        label:
          it: Mese scorso
          en: Previous month
    - name: focus
      type: text
      maxLength: 200
      label:
        it: Cosa ti preoccupa (facoltativo)
        en: What worries you (optional)
    - name: csv
      type: textarea
      maxLength: 20000
      label:
        it: Letture CSV (facoltativo)
        en: CSV readings (optional)
      help:
        it: Incolla righe timestamp,asset,kwh a 15 minuti. Il caricamento di file non è ancora disponibile.
        en: Paste timestamp,asset,kwh rows at 15 minutes. File upload is not available yet.
  data:
    collections:
    - name: sites
      ownedBy: user
      description: Buildings of the customer with hours, contract and emission factor
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome sede
          en: Site name
      - name: address
        type: text
        label:
          it: Indirizzo
          en: Address
      - name: kind
        type: select
        label:
          it: Tipo
          en: Type
        options:
        - value: commercial
          label:
            it: Commerciale
            en: Commercial
        - value: industrial
          label:
            it: Industriale
            en: Industrial
      - name: opening_hours
        type: textarea
        maxLength: 600
        label:
          it: Orari di attività (giorni, orari, festivi)
          en: Operating hours (days, times, holidays)
      - name: price_f1
        type: number
        label:
          it: Prezzo energia F1 €/kWh
          en: Energy price peak €/kWh
      - name: price_f2
        type: number
        label:
          it: Prezzo energia F2 €/kWh
          en: Energy price shoulder €/kWh
      - name: price_f3
        type: number
        label:
          it: Prezzo energia F3 €/kWh
          en: Energy price off-peak €/kWh
      - name: co2_factor
        type: number
        label:
          it: Fattore emissioni kg CO2/kWh
          en: Emission factor kg CO2/kWh
    - name: assets
      ownedBy: user
      description: Equipment of each site
      fields:
      - name: site
        type: relation
        relation: sites
        required: true
        label:
          it: Sede
          en: Site
      - name: name
        type: text
        required: true
        label:
          it: Impianto
          en: Equipment
      - name: kind
        type: select
        label:
          it: Tipo
          en: Type
        options:
        - value: hvac
          label:
            it: Climatizzazione
            en: HVAC
        - value: lighting
          label:
            it: Illuminazione
            en: Lighting
        - value: production
          label:
            it: Linea di produzione
            en: Production line
        - value: other
          label:
            it: Altro
            en: Other
      - name: nominal_kw
        type: number
        label:
          it: Potenza nominale kW
          en: Rated power kW
      - name: schedule
        type: text
        label:
          it: Orario di funzionamento previsto
          en: Expected operating hours
      - name: maintainer_email
        type: email
        label:
          it: Email manutentore
          en: Maintainer email
    - name: readings
      ownedBy: user
      description: 15-minute consumption readings per equipment or meter
      fields:
      - name: site
        type: relation
        relation: sites
      - name: asset
        type: text
      - name: timestamp
        type: text
      - name: kwh
        type: number
      - name: source
        type: select
        options:
        - value: csv
        - value: sensor
    - name: alerts
      ownedBy: user
      sharing:
      - viewer
      description: Anomalies detected by the agents; the maintainer is invited as viewer on the alerts of his equipment
      fields:
      - name: site
        type: relation
        relation: sites
      - name: asset
        type: text
      - name: severity
        type: select
        options:
        - value: low
        - value: medium
        - value: high
      - name: kind
        type: text
      - name: message
        type: textarea
      - name: detected_at
        type: text
      - name: est_saving_eur_year
        type: number
    - name: watch_runs
      ownedBy: instance
      description: Daily check results of each site watch
    - name: monthly_reports
      ownedBy: instance
      description: Monthly reports of each site
  templates:
  - key: site_watch
    title:
      it: Controllo giornaliero sede
      en: Daily site check
    description:
      it: Ogni mattina l'agente controlla le letture più recenti della sede e registra le anomalie.
      en: Every morning the agent checks the latest readings of the site and records anomalies.
    agent: monitor
    params:
    - name: site
      type: relation
      relation: sites
      required: true
      label:
        it: Sede
        en: Site
    goal: Controlla la sede {site} ({instance}) per il giorno più recente con letture. Oggi è {date}. Scrivi nella lingua
      con codice ISO {lang}.
    schedule:
      cron: 0 5 * * *
      userCanChange: true
    maxPerUser: 10
    roles:
    - user
    - admin
    cost:
      perRun: 5
  - key: monthly_report
    title:
      it: Report mensile sede
      en: Monthly site report
    description:
      it: Il primo del mese un report con consumi, costi, emissioni e azioni consigliate.
      en: On the 1st of each month a report with consumption, costs, emissions and recommended actions.
    agent: reporter
    params:
    - name: site
      type: relation
      relation: sites
      required: true
      label:
        it: Sede
        en: Site
    goal: Report mensile della sede {site} ({instance}) per il mese precedente a {date}. Scrivi nella lingua con codice ISO
      {lang}.
    schedule:
      cron: 0 6 1 * *
      userCanChange: false
    maxPerUser: 10
    roles:
    - user
    - admin
    cost:
      perRun: 15
  views:
  - key: home
    type: page
    title: Watt sotto Controllo
    nav: false
    sections:
    - type: hero
      band: true
      eyebrow:
        it: Analisi energetica con agenti AI
        en: Energy analytics with AI agents
      title:
        it: Trova dove **sprechi energia** e quanto risparmi.
        en: Find where you **waste energy** and how much you save.
      text:
        it: Descrivi le tue sedi, gli impianti e gli orari. Un agente AI analizza le curve di consumo, scova impianti accesi
          di notte, picchi anomali e apparecchiature fuori norma e stima il risparmio di ogni intervento con i prezzi del
          tuo contratto.
        en: Describe your sites, equipment and hours. An AI agent analyses load curves, spots equipment left on at night,
          abnormal peaks and out-of-norm machines, and estimates the savings of each action using your contract prices.
      actions:
      - label:
          it: Inizia
          en: Get started
        href: /login
        style: primary
      - label:
          it: Come funziona
          en: How it works
        href: '#come-funziona'
        style: ghost
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Descrivi le sedi
          en: Describe your sites
        text:
          it: Sedi, impianti, orari di attività e prezzi del contratto energetico.
          en: Sites, equipment, operating hours and energy contract prices.
        badge: 🏢
      - title:
          it: Carica i consumi
          en: Load the readings
        text:
          it: Per ora incollando un CSV a 15 minuti; il collegamento automatico con i contatori è in arrivo.
          en: For now by pasting a 15-minute CSV; automatic metering link is coming.
        badge: 📈
      - title:
          it: Ricevi analisi e alert
          en: Get analysis and alerts
        text:
          it: Controllo giornaliero, report mensile e una chat per chiedere spiegazioni.
          en: Daily check, monthly report and a chat to ask for explanations.
        badge: ⚡
    - type: cards
      id: rilevazioni
      title:
        it: Cosa rileva
        en: What it detects
      items:
      - title:
          it: Sprechi fuori orario
          en: Out-of-hours waste
        text:
          it: Impianti accesi di notte, nei festivi e nel weekend, carico di base eccessivo.
          en: Equipment on at night, on holidays and weekends, excessive baseload.
      - title:
          it: Picchi e anomalie
          en: Peaks and anomalies
        text:
          it: Picchi anomali e apparecchiature che consumano più del normale.
          en: Abnormal peaks and equipment consuming more than usual.
      - title:
          it: Risparmio stimato
          en: Estimated savings
        text:
          it: Costo dello spreco e risparmio annuo di ogni intervento, con ipotesi dichiarate.
          en: Cost of the waste and yearly saving of each action, with stated assumptions.
      - title:
          it: Manutentori
          en: Maintainers
        text:
          it: Il manutentore vede solo gli alert degli impianti di sua competenza.
          en: The maintainer only sees alerts for his own equipment.
    - type: note
      content:
        it: Abbonamento mensile per sede. Le stime sono un supporto alle decisioni, non una diagnosi tecnica né consulenza
          fiscale. Sensori e hardware non sono inclusi.
        en: Monthly subscription per site. Estimates are decision support, not a technical diagnosis or tax advice. Sensors
          and hardware are not included.
  - key: sites_list
    type: list
    title:
      it: Sedi
      en: Sites
    source: collection:sites
    roles:
    - user
    - admin
  - key: assets_list
    type: list
    title:
      it: Impianti
      en: Equipment
    source: collection:assets
    roles:
    - user
    - admin
  - key: new_analysis
    type: new_run
    title:
      it: Nuova analisi
      en: New analysis
    roles:
    - user
    - admin
  - key: analyses
    type: history
    title:
      it: Le mie analisi
      en: My analyses
    source: run
    roles:
    - user
    - admin
  - key: analysis
    type: report
    title:
      it: Analisi
      en: Analysis
    source: run
    printable: true
    nav: false
  - key: alerts_table
    type: table
    title:
      it: Alert
      en: Alerts
    source: collection:alerts
    roles:
    - user
    - maintainer
    - admin
    data:
      display: table
      fields:
      - key: detected_at
        label:
          it: Rilevato
          en: Detected
        format: date
      - key: site
        label:
          it: Sede
          en: Site
      - key: asset
        label:
          it: Impianto
          en: Equipment
      - key: severity
        label:
          it: Gravità
          en: Severity
        format: badge
      - key: message
        label:
          it: Messaggio
          en: Message
      - key: est_saving_eur_year
        label:
          it: Risparmio €/anno
          en: Saving €/yr
        format: money
      sort:
        field: detected_at
        dir: desc
      limit: 100
      empty:
        it: Nessun alert.
        en: No alerts.
  - key: watches
    type: instances
    template: site_watch
    title:
      it: Controlli giornalieri
      en: Daily checks
    roles:
    - user
    - admin
  - key: monthly
    type: instances
    template: monthly_report
    title:
      it: Report mensili
      en: Monthly reports
    roles:
    - user
    - admin
  - key: assistant
    type: chat
    title:
      it: Chiedi all'assistente
      en: Ask the assistant
    source: agent:advisor
    placeholder:
      it: Perché la sede di Milano ha consumato di più a ottobre?
      en: Why did the Milan site use more in October?
    examples:
    - Quali sono gli sprechi più costosi questo mese?
    - Perché è scattato l'ultimo alert?
    - Quanto risparmio spegnendo la climatizzazione di notte?
    roles:
    - user
    - admin
  - key: account
    type: account
    title:
      it: Abbonamento
      en: Subscription
    roles:
    - user
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 100
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:analyst:
        estimate: 30
        metered: true
      agent:advisor:
        estimate: 5
        metered: true
    packs:
    - key: extra
      credits: 1000
      price: 10
      label: Extra 1000
    plans:
    - key: site
      price: 49
      interval: month
      label:
        it: Per sede
        en: Per site
      includes:
      - 1 sede
      - controllo giornaliero
      - report mensile
      - chat
      credits: 500
      creditsReset: monthly
      roles:
      - user
  extensions:
  - key: realtime_ingestion
    description: 'Automatic ingestion of sensor and meter data every 15 minutes (and real-time anomaly detection) is not available
      yet: for now readings are pasted as CSV and the monitor runs once a day.'
  - key: email_alerts
    description: 'Email alerts on anomalies and the email delivery of the monthly report are not available yet: alerts and
      reports appear in the app.'
  - key: maintainer_scope
    description: The maintainer sees only alerts on his equipment through per-record viewer invitations on alerts (inviting
      the email in assets.maintainer_email); automatic sharing by that email needs custom logic.
  - key: per_site_billing
    description: The plan is a single per-site subscription; charging one subscription per site actually created (quantity)
      needs custom billing logic.
  - key: csv_file_upload
    description: 'File upload of CSV is not available: users paste the text or later use the automatic ingestion.'
