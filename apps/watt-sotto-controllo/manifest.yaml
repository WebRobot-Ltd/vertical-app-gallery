apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: watt-sotto-controllo
  displayName: Watt sotto Controllo
  tagline:
    it: Trova gli sprechi energetici dei tuoi edifici prima che li paghi in bolletta.
    en: Find the energy waste in your buildings before it shows up on the bill.
  description:
    it: 'Piattaforma di analisi dei consumi energetici per edifici commerciali e industriali: curve di consumo, sprechi, anomalie,
      alert via email, report mensile e chat con l''agente.'
    en: 'Energy consumption analytics for commercial and industrial buildings: load curves, waste, anomalies, email alerts,
      monthly report and chat with the agent.'
  langs:
  - it
  - en
  defaultLang: it
  timezone: Europe/Rome
spec:
  pattern: dashboard
  branding:
    theme: light
    palette:
      primary: '#0f2f3a'
      accent: '#e8a317'
      background: '#f6f8f8'
      foreground: '#14232a'
    fonts:
      body: Inter
      display: Manrope
    wordmark:
    - text: 'Watt sotto '
      color: primary
    - text: Controllo
      color: accent
  header:
    links:
    - label:
        it: Come funziona
        en: How it works
      href: '#come-funziona'
    - label:
        it: Cosa rileva
        en: What it detects
      href: '#rileva'
    cta:
      label:
        it: Accedi
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      label:
        it: Gestore edificio
        en: Building manager
      assignedBy: signup
    - key: maintainer
      label:
        it: Manutentore
        en: Maintainer
      assignedBy: derived
      from: collection:plants.maintainer_email
  limits:
  - action: create:sites
    max: 1
    window: total
    plans:
      sede_1: 1
      sede_5: 5
      sede_20: 20
  - action: chat
    per: user
    max: 50
    window: day
  agents:
  - key: importer
    role: main
    description: Legge un CSV di letture e le salva come letture della sede.
    profile:
      inline:
        display_name: Importatore letture
        crews:
        - id: importer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei l''importatore di letture energetiche. Ricevi il testo di un CSV di contatori/sensori (timestamp,
            impianto, kWh o kW). Prima chiama read_plants per associare i nomi degli impianti della sede. Poi salva ogni riga
            valida con append_readings (campi: site, plant, ts in ISO 8601, kwh, kw). Non inventare valori; salta le righe
            malformate e contale. Concludi con un report che inizia con "# Importazione letture" e riassume righe importate,
            scartate, intervallo coperto e problemi (buchi, duplicati, valori negativi).'
    appTools:
    - name: read_plants
      description: Impianti dell'utente
      action: read
      collection: plants
      scope: user
    - name: append_readings
      description: Salva una lettura
      action: append
      collection: readings
      scope: user
    goalTemplate: 'Sede: {site}

      CSV caricato: {csv}

      {?csv_text}Contenuto:

      {csv_text}{/csv_text}

      Data: {date}. Lingua: {lang}.'
    output: markdown
  - key: detector
    role: scheduled
    description: Controlla periodicamente le letture recenti di una sede e registra gli alert.
    profile:
      inline:
        display_name: Rilevatore anomalie
        crews:
        - id: detector
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un analista di consumi energetici. Per la sede indicata leggi sede, impianti (orari, potenza
            nominale, manutentore), contratto e letture recenti con gli strumenti read_*. Cerca: impianti accesi fuori orario
            (notte, festivi), picchi anomali rispetto alla media dello stesso impianto e fascia oraria, apparecchiature che
            consumano oltre il normale rispetto allo storico o alla potenza nominale. Leggi gli alert già aperti con read_alerts
            e non duplicarli. Per ogni anomalia nuova chiama append_alert con: site, plant, kind (fuori_orario|picco|consumo_anomalo),
            severity (bassa|media|alta), message (chiaro, con valori reali), detected_at, est_saving_eur (stima con i prezzi
            del contratto, mai inventati: se manca il contratto lascia vuoto), status "aperto", maintainer_email dell''impianto.
            Usa solo dati realmente letti; se i dati sono scarsi dillo. Chiudi con un report che inizia con "# Controllo <sede>
            — <data>" e l''elenco degli alert creati (o nessuna anomalia).'
    context:
    - key: contract
      from: collection:contracts
    appTools:
    - name: read_sites
      description: Sedi dell'utente
      action: read
      collection: sites
      scope: user
    - name: read_plants
      description: Impianti dell'utente
      action: read
      collection: plants
      scope: user
    - name: read_contracts
      description: Contratti energia
      action: read
      collection: contracts
      scope: user
    - name: read_readings
      description: Letture di consumo
      action: read
      collection: readings
      scope: user
    - name: read_alerts
      description: Alert esistenti
      action: read
      collection: alerts
      scope: user
    - name: append_alert
      description: Registra un alert
      action: append
      collection: alerts
      scope: user
    goalTemplate: 'Controlla la sede {site}. Oggi è {date}. Contratto: {contract}'
    output: markdown
  - key: reporter
    role: scheduled
    description: 'Report mensile per sede: consumi, costi, emissioni, azioni consigliate.'
    profile:
      inline:
        display_name: Report mensile energia
        crews:
        - id: reporter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei un energy manager. Scrivi il report mensile di una sede usando solo dati letti con gli strumenti
            read_* (letture del mese precedente, impianti, contratto, alert). Struttura: "# Report energia — <sede> — <mese
            anno>", poi ## Sintesi, ## Consumi (per impianto e per fascia, confronto col mese prima), ## Costi (con i prezzi
            del contratto), ## Emissioni (kWh × fattore CO2 del contratto; se manca il fattore dillo), ## Sprechi e anomalie,
            ## Azioni consigliate (ogni intervento con risparmio stimato in kWh e €/anno e il metodo di calcolo), ## Note
            sui dati. Aggiungi un grafico come blocco ```chart con valori reali dei consumi per impianto. Non inventare cifre;
            dichiara i buchi nei dati.'
    context:
    - key: contract
      from: collection:contracts
    appTools:
    - name: read_sites
      description: Sedi dell'utente
      action: read
      collection: sites
      scope: user
    - name: read_plants
      description: Impianti dell'utente
      action: read
      collection: plants
      scope: user
    - name: read_contracts
      description: Contratti energia
      action: read
      collection: contracts
      scope: user
    - name: read_readings
      description: Letture di consumo
      action: read
      collection: readings
      scope: user
    - name: read_alerts
      description: Alert esistenti
      action: read
      collection: alerts
      scope: user
    goalTemplate: 'Report mensile della sede {site}. Oggi è {date}. Lingua {lang}. Contratto: {contract}'
    writesTo:
      collection: reports
      parse: whole
    output: markdown
  - key: advisor
    role: helper
    description: 'Chat: spiega consumi, alert e interventi.'
    profile:
      inline:
        display_name: Consulente energia
        crews:
        - id: advisor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'Sei il consulente energetico del gestore. Rispondi in modo chiaro e breve a domande su consumi,
            costi, emissioni, alert e interventi, leggendo i dati reali con gli strumenti read_*. Spiega il perché di un''anomalia
            e come calcoli i risparmi. Non inventare numeri: se il dato non c''è, dillo. Non dare consulenza legale o fiscale.'
    appTools:
    - name: read_sites
      description: Sedi dell'utente
      action: read
      collection: sites
      scope: user
    - name: read_plants
      description: Impianti dell'utente
      action: read
      collection: plants
      scope: user
    - name: read_contracts
      description: Contratti energia
      action: read
      collection: contracts
      scope: user
    - name: read_readings
      description: Letture di consumo
      action: read
      collection: readings
      scope: user
    - name: read_alerts
      description: Alert esistenti
      action: read
      collection: alerts
      scope: user
    - name: read_reports
      description: Report mensili
      action: read
      collection: reports
      scope: user
    goalTemplate: 'Conversazione finora:

      {history}


      Nuovo messaggio dell''utente: {message}

      Rispondi in lingua {lang}.'
    output: markdown
  templates:
  - key: site_watch
    title:
      it: Sorveglianza anomalie
      en: Anomaly watch
    description:
      it: Controlla ogni poche ore le letture della sede e manda alert via email.
      en: Checks the site's readings every few hours and emails alerts.
    agent: detector
    params:
    - name: site
      type: select
      required: true
      optionsFrom: collection:sites
      label:
        it: Sede
        en: Site
    goal: Controlla la sede {site} ({instance}). Oggi è {date}. Lingua {lang}.
    schedule:
      cron: 0 */2 * * *
      userCanChange: false
    maxPerUser: 20
  - key: monthly_report
    title:
      it: Report mensile
      en: Monthly report
    description:
      it: Ogni mese un report con consumi, costi, emissioni e azioni consigliate.
      en: A monthly report with consumption, costs, emissions and recommended actions.
    agent: reporter
    params:
    - name: site
      type: select
      required: true
      optionsFrom: collection:sites
      label:
        it: Sede
        en: Site
    goal: Report mensile della sede {site} ({instance}). Oggi è {date}. Lingua {lang}.
    schedule:
      cron: 0 6 1 * *
      userCanChange: false
    maxPerUser: 20
    deliver:
      to: owner
      onlyIfNew: true
  triggers:
  - key: alert_notify
    description: Email immediata per ogni nuovo alert
    'on':
      collection: alerts
      op: insert
    notify:
      to:
      - owner
      - record.maintainer_email
      subject:
        it: 'Alert energia: {record.kind} — {record.site}'
        en: 'Energy alert: {record.kind} — {record.site}'
      body:
        it: 'Anomalia rilevata ({record.severity}) sull''impianto {record.plant} della sede {record.site}.


          {record.message}


          Risparmio stimato: {record.est_saving_eur} EUR'
        en: 'Anomaly detected ({record.severity}) on plant {record.plant} at site {record.site}.


          {record.message}


          Estimated saving: {record.est_saving_eur} EUR'
      link: alerts
  - key: meter_feed
    description: Letture in arrivo dai contatori (ogni quarto d'ora)
    'on':
      webhook: true
    write:
      collection: readings
      fields:
        site: site
        plant: plant
        ts: ts
        kwh: kwh
        kw: kw
  inputForm:
    title:
      it: Carica letture (CSV)
      en: Upload readings (CSV)
    fields:
    - name: site
      type: select
      required: true
      optionsFrom: collection:sites
      label:
        it: Sede
        en: Site
    - name: csv
      type: file
      required: true
      accept:
      - csv
      - txt
      maxMb: 15
      label:
        it: File CSV (timestamp, impianto, kWh)
        en: CSV file (timestamp, plant, kWh)
  data:
    collections:
    - name: sites
      description: Sedi dell'edificio
      ownedBy: user
      fields:
      - name: name
        type: text
        required: true
        label:
          it: Nome sede
          en: Site name
      - name: address
        type: text
        label:
          it: Indirizzo
          en: Address
      - name: building_type
        type: select
        label:
          it: Tipo
          en: Type
        options:
        - value: commerciale
          label:
            it: Commerciale
            en: Commercial
        - value: industriale
          label:
            it: Industriale
            en: Industrial
      - name: area_sqm
        type: number
        label:
          it: Superficie m²
          en: Area m²
      - name: opening_hours
        type: textarea
        label:
          it: Orari di attività e giorni di chiusura
          en: Operating hours and closing days
    - name: plants
      description: Impianti di una sede
      ownedBy: user
      fields:
      - name: site
        type: select
        required: true
        optionsFrom: collection:sites
        label:
          it: Sede
          en: Site
      - name: name
        type: text
        required: true
        label:
          it: Impianto
          en: Plant
      - name: kind
        type: select
        required: true
        label:
          it: Tipo
          en: Type
        options:
        - value: climatizzazione
          label:
            it: Climatizzazione
            en: HVAC
        - value: illuminazione
          label:
            it: Illuminazione
            en: Lighting
        - value: produzione
          label:
            it: Linea di produzione
            en: Production line
        - value: altro
          label:
            it: Altro
            en: Other
      - name: rated_kw
        type: number
        label:
          it: Potenza nominale kW
          en: Rated kW
      - name: schedule
        type: textarea
        label:
          it: Orari di funzionamento previsti
          en: Expected operating hours
      - name: maintainer_email
        type: email
        label:
          it: Email del manutentore
          en: Maintainer email
      access:
      - role: maintainer
        where:
          maintainer_email: '{user.email}'
        can:
        - read
    - name: contracts
      description: Contratto di fornitura e prezzi energia
      ownedBy: user
      fields:
      - name: site
        type: select
        required: true
        optionsFrom: collection:sites
        label:
          it: Sede
          en: Site
      - name: supplier
        type: text
        label:
          it: Fornitore
          en: Supplier
      - name: price_f1
        type: number
        required: true
        label:
          it: Prezzo F1 €/kWh
          en: Price F1 €/kWh
      - name: price_f2
        type: number
        label:
          it: Prezzo F2 €/kWh
          en: Price F2 €/kWh
      - name: price_f3
        type: number
        label:
          it: Prezzo F3 €/kWh
          en: Price F3 €/kWh
      - name: co2_kg_per_kwh
        type: number
        label:
          it: Fattore emissioni kgCO2/kWh
          en: Emission factor kgCO2/kWh
      - name: valid_from
        type: date
        label:
          it: Valido dal
          en: Valid from
    - name: readings
      description: Letture dei contatori ogni 15 minuti
      ownedBy: user
      retentionDays: 730
      fields:
      - name: site
        type: text
      - name: plant
        type: text
      - name: ts
        type: date
      - name: kwh
        type: number
      - name: kw
        type: number
    - name: alerts
      description: Anomalie rilevate
      ownedBy: user
      fields:
      - name: site
        type: text
        label:
          it: Sede
          en: Site
      - name: plant
        type: text
        label:
          it: Impianto
          en: Plant
      - name: kind
        type: text
        label:
          it: Tipo
          en: Kind
      - name: severity
        type: text
        label:
          it: Gravità
          en: Severity
      - name: message
        type: textarea
        label:
          it: Dettaglio
          en: Detail
      - name: detected_at
        type: date
        label:
          it: Rilevato il
          en: Detected
      - name: est_saving_eur
        type: number
        label:
          it: Risparmio stimato €
          en: Estimated saving €
      - name: status
        type: text
        label:
          it: Stato
          en: Status
      - name: maintainer_email
        type: email
      access:
      - role: maintainer
        where:
          maintainer_email: '{user.email}'
        can:
        - read
        - write
    - name: reports
      description: Report mensili
      ownedBy: instance
  views:
  - key: home
    type: page
    nav: false
    title: Watt sotto Controllo
    sections:
    - type: hero
      eyebrow:
        it: Analisi dei consumi energetici
        en: Energy consumption analytics
      title:
        it: Trova gli **sprechi energetici** prima che arrivi la bolletta.
        en: Find **energy waste** before the bill arrives.
      text:
        it: Un agente AI analizza le curve di consumo dei tuoi edifici, segnala impianti accesi fuori orario, picchi e apparecchiature
          anomale, e stima il risparmio di ogni intervento con i prezzi del tuo contratto.
        en: An AI agent analyses your buildings' load curves, flags plants running off-hours, spikes and abnormal equipment,
          and estimates the saving of each action using your contract prices.
      actions:
      - label:
          it: Inizia
          en: Start
        href: /login
        style: primary
    - type: steps
      id: come-funziona
      title:
        it: Come funziona
        en: How it works
      items:
      - title:
          it: Descrivi sedi e impianti
          en: Describe sites and plants
        text:
          it: Sedi, impianti, orari di attività e contratto energia.
          en: Sites, plants, operating hours and energy contract.
      - title:
          it: Arrivano le letture
          en: Readings arrive
        text:
          it: Dai contatori ogni quarto d'ora, oppure caricando un CSV.
          en: From meters every 15 minutes, or by uploading a CSV.
      - title:
          it: Alert, report e chat
          en: Alerts, report and chat
        text:
          it: Alert via email, report mensile e domande in chat.
          en: Email alerts, a monthly report and questions in chat.
    - type: cards
      id: rileva
      title:
        it: Cosa rileva
        en: What it detects
      items:
      - title:
          it: Accensioni fuori orario
          en: Off-hours operation
        text:
          it: Impianti accesi di notte o nei festivi.
          en: Plants on at night or on holidays.
        badge: 🌙
      - title:
          it: Picchi anomali
          en: Abnormal spikes
        text:
          it: Consumi fuori dalla norma dell'impianto.
          en: Consumption outside the plant's norm.
        badge: ⚡
      - title:
          it: Apparecchiature inefficienti
          en: Inefficient equipment
        text:
          it: Macchine che consumano più del normale.
          en: Machines using more than usual.
        badge: 🔧
    - type: note
      content:
        it: Questo servizio copre solo lo strato software; installazione di sensori e hardware sono esclusi. Le stime di risparmio
          sono indicative.
        en: This service covers the software layer only; sensor and hardware installation are excluded. Savings estimates
          are indicative.
  - key: sites_form
    type: form
    title:
      it: Nuova sede
      en: New site
    collection: sites
    submit:
      label:
        it: Salva sede
        en: Save site
      message:
        it: Sede salvata
        en: Site saved
      redirect: sites
    edit: true
    roles:
    - user
    - admin
  - key: sites
    type: table
    title:
      it: Le mie sedi
      en: My sites
    source: collection:sites
    columns:
    - name
    - address
    - building_type
    - area_sqm
    roles:
    - user
    - admin
  - key: plant_form
    type: form
    title:
      it: Nuovo impianto
      en: New plant
    collection: plants
    submit:
      label:
        it: Salva impianto
        en: Save plant
      message:
        it: Impianto salvato
        en: Plant saved
      redirect: plants
    edit: true
    roles:
    - user
    - admin
  - key: plants
    type: table
    title:
      it: Impianti
      en: Plants
    source: collection:plants
    columns:
    - site
    - name
    - kind
    - rated_kw
    - maintainer_email
    roles:
    - user
    - admin
  - key: contract_form
    type: form
    title:
      it: Contratto energia
      en: Energy contract
    collection: contracts
    submit:
      label:
        it: Salva contratto
        en: Save contract
      message:
        it: Contratto salvato
        en: Contract saved
    edit: true
    roles:
    - user
    - admin
  - key: import
    type: new_run
    title:
      it: Carica letture CSV
      en: Upload readings CSV
    roles:
    - user
    - admin
  - key: imports
    type: history
    title:
      it: Importazioni
      en: Imports
    source: run
    roles:
    - user
    - admin
  - key: consumption
    type: page
    title:
      it: Consumi
      en: Consumption
    roles:
    - user
    - admin
    sections:
    - type: data
      title:
        it: Consumo giornaliero (kWh)
        en: Daily consumption (kWh)
      source: collection:readings
      display: chart
      chart: line
      fields:
      - key: ts
        label: Data
        format: date
      - key: kwh
        label: kWh
        format: number
      groupBy:
        field: ts
        bucket: day
        aggs:
        - key: kwh
          agg: sum
          field: kwh
      empty:
        it: Nessuna lettura ancora.
        en: No readings yet.
    - type: data
      title:
        it: Totale mensile
        en: Monthly total
      source: collection:readings
      display: table
      fields:
      - key: ts
        label: Mese
        format: date
      - key: kwh
        label: kWh
        format: number
      groupBy:
        field: ts
        bucket: month
        aggs:
        - key: kwh
          agg: sum
          field: kwh
  - key: alerts
    type: table
    title:
      it: Alert
      en: Alerts
    source: collection:alerts
    columns:
    - detected_at
    - site
    - plant
    - kind
    - severity
    - message
    - est_saving_eur
    - status
    export: true
    roles:
    - user
    - admin
    - maintainer
  - key: watches
    type: instances
    template: site_watch
    title:
      it: Sorveglianza sedi
      en: Site watches
    roles:
    - user
    - admin
  - key: monthly
    type: instances
    template: monthly_report
    title:
      it: Report mensili
      en: Monthly reports
    roles:
    - user
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: chat
    type: chat
    source: agent:advisor
    title:
      it: Chiedi all'esperto
      en: Ask the expert
    examples:
    - it: Perché ieri notte la sede di Milano ha consumato così tanto?
      en: Why did the Milan site use so much last night?
    - it: Quanto risparmio se spengo la climatizzazione alle 20?
