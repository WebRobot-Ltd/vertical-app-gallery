  - key: reports
    type: instances
    title:
      en: Daily reports
      pl: Raporty dzienne
    template: daily_report
    roles:
    - manager
    - admin
  - key: account
    type: account
    title:
      en: Subscription
      pl: Subskrypcja
    roles:
    - admin
  triggers:
  - key: booking_new
    'on':
      collection: bookings
      op: insert
      where:
        status: booked
    start:
      agent: dispatcher
    goal: New booking {record.id} for site {record.site} on {record.date}, dock {record.resource}, status {record.status}.
      Stamp the site manager on it.
  - key: booking_approved
    'on':
      collection: bookings
      op: update
      where:
        status: approved
    notify:
      to: record.haulier_email
      subject:
        en: 'Slot confirmed: {record.site} {record.date}'
        pl: 'Slot potwierdzony: {record.site} {record.date}'
      body:
        en: Your slot at {record.site} on {record.date} {record.start} (trailer {record.trailer}, ref {record.reference})
          is approved.
        pl: Twój slot w {record.site} dnia {record.date} {record.start} (naczepa {record.trailer}, nr {record.reference})
          został zatwierdzony.
      link: my_bookings
  - key: booking_moved
    'on':
      collection: bookings
      op: update
      where:
        status: moved
    notify:
      to: record.haulier_email
      subject:
        en: 'Slot moved: {record.site}'
        pl: 'Slot przesunięty: {record.site}'
      body:
        en: Your slot at {record.site} was moved to {record.date} {record.start}. {record.notes}
        pl: Twój slot w {record.site} został przesunięty na {record.date} {record.start}. {record.notes}
      link: my_bookings
  - key: booking_refused
    'on':
      collection: bookings
      op: update
      where:
        status: refused
    notify:
      to: record.haulier_email
      subject:
        en: 'Slot refused: {record.site}'
        pl: 'Slot odrzucony: {record.site}'
      body:
        en: Your booking at {record.site} on {record.date} was refused. {record.notes}
        pl: Twoja rezerwacja w {record.site} na {record.date} została odrzucona. {record.notes}
      link: book
  - key: booking_reminder
    'on':
      date:
        collection: bookings
        field: date
        offsetDays: -1
        hour: 7
      where:
        status: approved
    notify:
      to: record.haulier_email
      subject:
        en: 'Reminder: slot tomorrow at {record.site}'
        pl: 'Przypomnienie: jutro slot w {record.site}'
      body:
        en: Tomorrow {record.start} at {record.site}, trailer {record.trailer}, ref {record.reference}.
        pl: Jutro {record.start} w {record.site}, naczepa {record.trailer}, nr {record.reference}.
      link: my_bookings
  - key: move_assigned
    'on':
      collection: yard_moves
      op: insert
    notify:
      to: record.assigned_to
      subject:
        en: Move trailer {record.trailer} to {record.to_dock}
        pl: Przestaw naczepę {record.trailer} do {record.to_dock}
      body:
        en: 'Next move: trailer {record.trailer} from {record.from_zone} to {record.to_dock}.'
        pl: 'Następny ruch: naczepa {record.trailer} z {record.from_zone} do {record.to_dock}.'
      link: moves
  billing:
    modes:
    - subscription
    currency: gbp
    plans:
    - key: site
      price: 400
      interval: month
      label:
        en: Per site
        pl: Za obiekt
      includes:
      - Unlimited docks, bookings and users for one site
      - Daily performance email
      - Mobile app for yard staff
      roles:
      - admin
  mobile:
    appId: com.yardline.yard
    appName: Yardline
    capabilities:
    - name: barcode
      reason:
        en: To scan the trailer barcode at the gate
        pl: Aby skanować kod kreskowy naczepy przy bramie
    - name: camera
      reason:
        en: To photograph the number plate
        pl: Aby zrobić zdjęcie tablicy rejestracyjnej
    - name: location
      reason:
        en: To record where a trailer is parked
        pl: Aby zapisać, gdzie zaparkowano naczepę
    - name: push
  extensions:
  - key: multi_company
    description: This design serves one company's sites (the admin fills sites and docks on the data page). Separate companies
      each signing up and managing their own sites, charging £400 per site automatically, and reading the plate text by OCR
      are not expressible yet; per-site billing is a single plan to be bought once per site.
  - key: site_scoping_yard_staff
    description: Site managers and hauliers are scoped by manager_email / haulier_email stamped on records. Yard operators
      see only their own entries and the moves assigned to them; sharing one site's timeline between several operators needs
      a shared-site access rule.
