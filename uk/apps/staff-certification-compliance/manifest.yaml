apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: certiroll
  displayName: Certiroll
  tagline:
    en: SM&CR workforce compliance, always audit-ready.
  description:
    en: Certiroll tracks certification, fitness and propriety, conduct rule training, regulatory references and breaches for
      every person in a financial services firm, with AI agents that do the checking and drafting and humans who sign off.
  langs:
  - en
  defaultLang: en
  timezone: Europe/London
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12263f'
      accent: '#1f7a6d'
      background: '#f6f8fa'
      foreground: '#172033'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Certi
      color: primary
    - text: roll
      color: accent
    width: wide
  header:
    links:
    - label: How it works
      href: '#how'
    - label: Roles
      href: '#roles'
    cta:
      label: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: HR administrator
      assignedBy: admin_emails
    - key: compliance
      label: Compliance
      assignedBy: invite
    - key: manager
      label: Line manager
      assignedBy: derived
      from: collection:employees.manager_email
    - key: employee
      label: Employee
      assignedBy: derived
      from: collection:employees.email
  agents:
  - key: analyst
    role: main
    description: Maps roles to certification functions, cross-checks senior managers against the FCA register, summarises
      evidence.
    profile:
      inline:
        display_name: Certiroll compliance analyst
        crews:
        - id: analyst
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You are a UK financial services SM&CR compliance analyst. Tasks: (1) certification_map: read the
            employee record with read_employees and say which FCA/PRA certification functions their job role needs (significant
            management, CF30 customer dealing, proprietary traders, client dealing, algorithmic trading, material risk takers,
            managers of certification employees, etc.), compare with certifications held (read_certifications) and list gaps.
            (2) fca_check: for senior managers or staff with an FCA individual reference number, look the person up on the
            public FCA Register (register.fca.org.uk) by scraping with the webrobot MCP, compare name, status and approved
            functions with the firm''s record, then save the result with log_fca_check. (3) evidence_summary: summarise training,
            certifications, references and breaches for the person. (4) sweep: for all active staff, set risk (low|medium|high)
            and compliance_status (compliant|due_soon|overdue) with update_employee, based on dates and open breaches. Start
            every report with a level-1 ''# '' title, then sections ## Findings, ## Gaps, ## Recommended actions, ## Sources.
            Never invent facts: if the register cannot be read, say so. This is decision support, not legal advice; the firm''s
            compliance officer decides.'
    goalTemplate: 'Task: {task_label}

      {?employee_email}Employee: {employee_email}{/employee_email}

      {?notes}Notes: {notes}{/notes}

      Today is {date}. Write the report in language {lang}.'
    output: markdown
    appTools:
    - name: read_employees
      description: Read the staff records
      action: read
      collection: employees
      scope: all
    - name: update_employee
      description: Update risk and compliance status of an employee
      action: write
      collection: employees
      scope: all
    - name: read_certifications
      description: Read certifications
      action: read
      collection: certifications
      scope: all
    - name: read_training
      description: Read conduct rule training records
      action: read
      collection: training
      scope: all
    - name: read_references
      description: Read regulatory references
      action: read
      collection: references
      scope: all
    - name: read_breaches
      description: Read conduct breaches
      action: read
      collection: breaches
      scope: all
    - name: log_fca_check
      description: Record an FCA register cross-check result
      action: append
      collection: fca_checks
      scope: all
    limits:
      maxTurns: 30
      maxBudgetUsd: 1.5
  - key: assessment_drafter
    role: helper
    description: Drafts the annual fitness and propriety assessment questions when an assessment is requested.
    profile:
      inline:
        display_name: Certiroll assessment drafter
        crews:
        - id: drafter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You draft the annual fitness and propriety assessment for one employee under SM&CR. Read the employee,
            certifications, training, references and breaches with the tools. Write 8-12 targeted questions for the line manager
            (honesty, integrity and reputation; competence and capability; financial soundness; conduct rule adherence; training
            completion; breaches in the year) and a short evidence summary with only real data. Save them to the assessment
            record with write_assessment (fields questions, evidence_summary, status 'awaiting_manager'). Start the reply
            with a '# ' title. Never invent evidence.
    goalTemplate: Draft the {record.year} assessment for {record.employee_email} (assessment id {record.id}). Today is {date}.
    output: markdown
    appTools:
    - name: read_employees
      description: Read the staff records
      action: read
      collection: employees
      scope: all
    - name: read_certifications
      description: Read certifications
      action: read
      collection: certifications
      scope: all
    - name: read_training
      description: Read conduct rule training records
      action: read
      collection: training
      scope: all
    - name: read_references
      description: Read regulatory references
      action: read
      collection: references
      scope: all
    - name: read_breaches
      description: Read conduct breaches
      action: read
      collection: breaches
      scope: all
    - name: write_assessment
      description: Write questions and evidence summary into an assessment
      action: write
      collection: assessments
      scope: all
  - key: assessment_reviewer
    role: helper
    description: Summarises a completed assessment and asks compliance to approve it.
    awaits:
    - assessment_signoff
    profile:
      inline:
        display_name: Certiroll assessment reviewer
        crews:
        - id: reviewer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: A line manager has completed an annual fitness and propriety assessment. Read it with read_assessments,
            summarise the manager's answers against the evidence, flag inconsistencies or concerns, then call request_assessment_signoff
            with your summary so compliance can approve or reject. Never decide yourself. Start with a '# ' title.
    goalTemplate: Review the submitted assessment {record.id} for {record.employee_email} ({record.year}). Today is {date}.
    output: markdown
    appTools:
    - name: read_assessments
      description: Read assessments
      action: read
      collection: assessments
      scope: all
  - key: breach_drafter
    role: helper
    description: Drafts the notification of a conduct breach for compliance to review.
    awaits:
    - breach_review
    profile:
      inline:
        display_name: Certiroll breach drafter
        crews:
        - id: breach
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You draft a regulatory notification (e.g. a Form C or a Directory-person conduct rule breach notification)
            for a logged conduct breach, using only the facts in the record and the employee's record (read_employees). Mark
            unknown items 'TO CONFIRM'. Save the draft with write_breach (field notification_draft, status 'draft_ready')
            then call request_breach_review. Do not state a legal conclusion on whether the rule was breached; compliance
            decides. Start with a '# ' title.
    goalTemplate: 'Conduct breach logged for {record.employee_email}: rule {record.rule}, date {record.breach_date}. Description:
      {record.description}. Breach id {record.id}. Today is {date}.'
    output: markdown
    appTools:
    - name: read_employees
      description: Read the staff records
      action: read
      collection: employees
      scope: all
    - name: write_breach
      description: Write the notification draft into the breach record
      action: write
      collection: breaches
      scope: all
  inputForm:
    title: New compliance check
    fields:
    - name: task
      type: select
      required: true
      label: Task
      options:
      - value: certification_map
        label: Map role to certification functions
      - value: fca_check
        label: Cross-check against FCA register
      - value: evidence_summary
        label: Summarise evidence
      - value: sweep
        label: Risk sweep of all staff
    - name: employee_email
      type: email
      label: Employee email
      help: Not needed for the risk sweep
    - name: notes
      type: textarea
      maxLength: 500
      label: Notes (optional)
  data:
    collections:
    - name: employees
      ownedBy: org
      description: 'Staff register: one record per person. Filled by HR through CSV, the form or the HR webhook.'
      fields:
      - name: name
        type: text
        required: true
        label: Name
      - name: email
        type: email
        required: true
        label: Email
      - name: manager_email
        type: email
        label: Line manager email
      - name: job_role
        type: text
        label: Job role
      - name: function
        type: text
        label: Function / team
      - name: start_date
        type: date
        label: Start date
      - name: certification_functions
        type: text
        label: Certification functions
      - name: smf
        type: boolean
        label: Senior manager (SMF)
      - name: frn_irn
        type: text
        label: FCA individual reference (IRN)
      - name: cert_expiry
        type: date
        label: Certificate expiry
      - name: training_due
        type: date
        label: Training due
      - name: assessment_due
        type: date
        label: Assessment due
      - name: compliance_status
        type: select
        options:
        - compliant
        - due_soon
        - overdue
        label: Status
      - name: risk
        type: select
        options:
        - low
        - medium
        - high
        label: Risk
      - name: status
        type: select
        options:
        - active
        - leaver
        label: Employment
      access:
      - role: compliance
        can:
        - read
        - write
      - role: manager
        where:
          manager_email: '{user.email}'
      - role: employee
        where:
          email: '{user.email}'
    - name: certifications
      ownedBy: org
      fields:
      - name: employee_email
        type: email
        required: true
      - name: manager_email
        type: email
      - name: function
        type: text
        label: Certification function
      - name: issued
        type: date
      - name: expiry
        type: date
      - name: status
        type: select
        options:
        - valid
        - due_soon
        - expired
      access:
      - role: compliance
        can:
        - read
        - write
      - role: manager
        where:
          manager_email: '{user.email}'
      - role: employee
        where:
          employee_email: '{user.email}'
    - name: training
      ownedBy: org
      fields:
      - name: employee_email
        type: email
        required: true
      - name: manager_email
        type: email
      - name: course
        type: text
        label: Conduct rule training
      - name: due_date
        type: date
      - name: completed_date
        type: date
      - name: status
        type: select
        options:
        - scheduled
        - complete
        - overdue
      access:
      - role: compliance
        can:
        - read
        - write
      - role: manager
        where:
          manager_email: '{user.email}'
      - role: employee
        where:
          employee_email: '{user.email}'
    - name: references
      ownedBy: org
      description: Regulatory references
      fields:
      - name: employee_email
        type: email
        required: true
      - name: referee
        type: text
      - name: period
        type: text
      - name: received_date
        type: date
      - name: status
        type: select
        options:
        - requested
        - received
        - gap
      access:
      - role: compliance
        can:
        - read
        - write
      - role: employee
        where:
          employee_email: '{user.email}'
    - name: assessments
      ownedBy: org
      description: Annual fitness and propriety assessments
      fields:
      - name: employee_email
        type: email
        required: true
      - name: manager_email
        type: email
      - name: year
        type: number
      - name: questions
        type: textarea
      - name: evidence_summary
        type: textarea
      - name: manager_answers
        type: textarea
        label: Your assessment
      - name: status
        type: select
        options:
        - requested
        - awaiting_manager
        - submitted
        - approved
        - rejected
      access:
      - role: compliance
        can:
        - read
        - write
      - role: manager
        where:
          manager_email: '{user.email}'
        can:
        - read
        - write
      - role: employee
        where:
          employee_email: '{user.email}'
    - name: breaches
      ownedBy: org
      fields:
      - name: employee_email
        type: email
        required: true
        label: Employee email
      - name: manager_email
        type: email
        label: Line manager email
      - name: rule
        type: select
        required: true
        label: Conduct rule
        options:
        - Rule 1 integrity
        - Rule 2 skill, care and diligence
        - Rule 3 open with regulators
        - Rule 4 customers' interests
        - Rule 5 market conduct
      - name: breach_date
        type: date
        required: true
        label: Date
      - name: description
        type: textarea
        required: true
        label: What happened
      - name: notification_draft
        type: textarea
      - name: status
        type: select
        options:
        - logged
        - draft_ready
        - reported
        - closed
        default: logged
      access:
      - role: compliance
        can:
        - read
        - write
      - role: manager
        where:
          manager_email: '{user.email}'
        can:
        - read
        - write
    - name: fca_checks
      ownedBy: org
      fields:
      - name: employee_email
        type: email
      - name: checked_on
        type: date
      - name: register_status
        type: text
      - name: matches
        type: boolean
      - name: findings
        type: textarea
      access:
      - role: compliance
  views:
  - key: home
    type: page
    nav: false
    title: Certiroll
    sections:
    - type: hero
      layout: stack
      band: true
      title: SM&CR compliance for **every person** in your firm
      text: Certifications, fitness and propriety assessments, conduct rule training, references and breaches in one register,
        with agents that check and draft, and people who approve.
      actions:
      - label: Sign in
        href: /login
        style: primary
    - type: steps
      id: how
      title: How it works
      items:
      - title: Import your staff
        text: HR uploads a CSV, adds people by form, or lets the HR system post joiners and leavers.
      - title: Agents check
        text: Certification functions per role, FCA register cross-checks, assessment questions and evidence summaries.
      - title: People decide
        text: Managers complete assessments, compliance approves, breach notifications are reviewed before they go out.
    - type: cards
      id: roles
      title: Who sees what
      items:
      - title: HR
        text: Imports and maintains the staff register.
      - title: Compliance
        text: Sees everyone, approves assessments and breach notifications.
      - title: Line managers
        text: See only their own team.
      - title: Employees
        text: See only their own record.
    - type: note
      content: Decision support, not legal advice. Compliance officers remain responsible for regulatory decisions.
  - key: dash
    type: page
    title: Dashboard
    roles:
    - admin
    - compliance
    - manager
    sections:
    - type: data
      title: Coverage
      source: collection:employees
      display: kpi
      kpis:
      - label: People
        agg: count
      - label: 'Smart: senior managers'
        agg: count
      filters:
      - field: status
        op: '='
        value: active
    - type: data
      title: Risk by team
      source: collection:employees
      display: chart
      chart: stacked
      groupBy:
        field: function
        aggs:
        - key: people
          agg: count
      fields:
      - key: function
        label: Team
      - key: count
        label: People
    - type: data
      title: Overdue people
      source: collection:employees
      display: table
      filters:
      - field: compliance_status
        op: '='
        value: overdue
      fields:
      - key: name
      - key: function
      - key: job_role
      - key: cert_expiry
        format: date
      - key: training_due
        format: date
      - key: assessment_due
        format: date
      - key: risk
        format: badge
      empty: Nothing overdue.
    - type: data
      title: Expired certifications
      source: collection:certifications
      display: table
      filters:
      - field: status
        op: '='
        value: expired
      fields:
      - key: employee_email
      - key: function
      - key: expiry
        format: date
  - key: people
    type: table
    title: People
    source: collection:employees
    columns:
    - name
    - email
    - job_role
    - function
    - manager_email
    - cert_expiry
    - training_due
    - assessment_due
    - compliance_status
    - risk
    export: true
    roles:
    - admin
    - compliance
    - manager
    - employee
  - key: add_person
    type: form
    title: Add person
    collection: employees
    submit:
      label: Save
      message: Person saved.
      redirect: people
    edit: true
    roles:
    - admin
  - key: certs
    type: table
    title: Certifications
    source: collection:certifications
    roles:
    - admin
    - compliance
    - manager
    - employee
  - key: trainings
    type: table
    title: Training
    source: collection:training
    roles:
    - admin
    - compliance
    - manager
    - employee
  - key: assessments_list
    type: table
    title: Assessments
    source: collection:assessments
    columns:
    - employee_email
    - year
    - status
    roles:
    - admin
    - compliance
    - manager
    - employee
  - key: complete_assessment
    type: form
    title: Complete assessment
    collection: assessments
    fields:
    - manager_answers
    - status
    edit: true
    nav: false
    submit:
      label: Submit for approval
      message: Assessment submitted to compliance.
      redirect: assessments_list
    roles:
    - manager
  - key: log_breach
    type: form
    title: Log conduct breach
    collection: breaches
    fields:
    - employee_email
    - manager_email
    - rule
    - breach_date
    - description
    submit:
      label: Log breach
      message: Logged. Compliance will review the drafted notification.
    roles:
    - manager
    - compliance
    - admin
  - key: breaches_list
    type: table
    title: Breaches
    source: collection:breaches
    columns:
    - employee_email
    - rule
    - breach_date
    - status
    roles:
    - admin
    - compliance
    - manager
  - key: checks
    type: table
    title: FCA register checks
    source: collection:fca_checks
    roles:
    - admin
    - compliance
  - key: new_check
    type: new_run
    title: New compliance check
    roles:
    - admin
    - compliance
  - key: history
    type: history
    title: Past checks
    source: run
    roles:
    - admin
    - compliance
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: approvals_view
    type: approvals
    title: Approvals
    roles:
    - compliance
    - admin
  - key: account
    type: account
    title: Subscription
    roles:
    - admin
  approvals:
  - key: assessment_signoff
    title: Approve annual assessment
    role: compliance
    fields:
    - employee_email
    - year
    decidedBy: role
  - key: breach_review
    title: Review breach notification
    role: compliance
    fields:
    - employee_email
    - rule
    decidedBy: role
  triggers:
  - key: assessment_requested
    'on':
      collection: assessments
      op: insert
      where:
        status: requested
    start:
      agent: assessment_drafter
    goal: Draft the {record.year} assessment for {record.employee_email} (assessment id {record.id}). Today is {date}.
  - key: assessment_submitted
    'on':
      collection: assessments
      op: update
      where:
        status: submitted
    start:
      agent: assessment_reviewer
    goal: Review the submitted assessment {record.id} for {record.employee_email} ({record.year}).
  - key: breach_logged
    'on':
      collection: breaches
      op: insert
      where:
        status: logged
    start:
      agent: breach_drafter
    goal: 'Conduct breach logged for {record.employee_email}: rule {record.rule}, date {record.breach_date}. Description:
      {record.description}. Breach id {record.id}.'
  - key: breach_alert
    'on':
      collection: breaches
      op: insert
    notify:
      to:
      - role:compliance
      subject: 'Conduct breach logged: {record.employee_email}'
      body: A conduct breach was logged ({record.rule}). A draft notification is being prepared for your review.
      link: breaches_list
  - key: assessment_approved
    'on':
      approval: assessment_signoff
      decision: approved
    notify:
      to:
      - owner
      - admins
      subject: Assessment approved
      body: The annual assessment has been approved by compliance.
      link: assessments_list
  - key: hr_sync
    description: Joiners and leavers posted by the HR or payroll system
    'on':
      webhook: true
    write:
      collection: employees
      fields:
        name: employee.name
        email: employee.email
        job_role: employee.job_role
        function: employee.function
        start_date: employee.start_date
        manager_email: employee.manager_email
        status: employee.status
      keyBy: email
  - key: cert_remind
    'on':
      date:
        collection: employees
        field: cert_expiry
        offsetDays: -30
        hour: 8
    notify:
      to:
      - record.email
      - record.manager_email
      subject: 'Certificate renewal due in 30 days: {record.name}'
      body: The certification of {record.name} expires on {record.cert_expiry}. Please arrange renewal.
      link: people
  - key: cert_escalate
    'on':
      date:
        collection: employees
        field: cert_expiry
        offsetDays: 7
        hour: 8
    notify:
      to:
      - role:compliance
      - record.manager_email
      subject: 'OVERDUE certificate: {record.name}'
      body: The certification of {record.name} expired on {record.cert_expiry} and is still not renewed.
      link: people
  - key: training_remind
    'on':
      date:
        collection: employees
        field: training_due
        offsetDays: -14
        hour: 8
    notify:
      to:
      - record.email
      - record.manager_email
      subject: Conduct rule training due in 14 days
      body: Training for {record.name} is due on {record.training_due}.
      link: trainings
  - key: training_escalate
    'on':
      date:
        collection: employees
        field: training_due
        offsetDays: 7
        hour: 8
    notify:
      to:
      - role:compliance
      - record.manager_email
      subject: 'OVERDUE training: {record.name}'
      body: Training for {record.name} was due on {record.training_due} and is overdue.
      link: people
  - key: assessment_remind
    'on':
      date:
        collection: employees
        field: assessment_due
        offsetDays: -30
        hour: 8
    notify:
      to:
      - record.manager_email
      subject: 'Annual assessment due in 30 days: {record.name}'
      body: The annual fitness and propriety assessment for {record.name} is due on {record.assessment_due}.
      link: assessments_list
  - key: assessment_escalate
    'on':
      date:
        collection: employees
        field: assessment_due
        offsetDays: 7
        hour: 8
    notify:
      to:
      - role:compliance
      - record.manager_email
      subject: 'OVERDUE assessment: {record.name}'
      body: The annual assessment for {record.name} was due on {record.assessment_due} and is overdue.
      link: assessments_list
  schedules:
  - agent: analyst
    cron: 0 6 * * 1
    action: run
    owner: app
