apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: daytrova
  displayName: Daytrova
  tagline:
    en: Find and book local attractions and experiences across Britain.
    cy: Dewch o hyd i atyniadau a phrofiadau lleol ledled Prydain a'u harchebu.
  description:
    en: 'A marketplace for local attractions outside London: browse by region, category, age, price and accessibility, see
      them on a map, book a time slot and pay by card.'
    cy: 'Marchnad ar gyfer atyniadau lleol y tu allan i Lundain: pori yn ôl rhanbarth, categori, oedran, pris a hygyrchedd,
      gweld ar fap, archebu slot a thalu â cherdyn.'
  langs:
  - en
  - cy
  defaultLang: en
  timezone: Europe/London
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1d3b53'
      accent: '#e07a2f'
      background: '#fbf8f3'
      foreground: '#1c2229'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Day
      color: primary
    - text: trova
      color: accent
    width: wide
  header:
    links:
    - label:
        en: How it works
        cy: Sut mae'n gweithio
      href: '#how'
    - label:
        en: For operators
        cy: I weithredwyr
      href: '#operators'
    cta:
      label:
        en: Browse attractions
        cy: Pori atyniadau
      href: /v/catalogue
  auth:
    method: magic_link
    anonymous:
      views:
      - home
      - catalogue
      - map
      - attraction
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: user
      label:
        en: Visitor
        cy: Ymwelydd
      assignedBy: signup
    - key: operator
      label:
        en: Operator
        cy: Gweithredwr
      assignedBy: derived
      from: collection:attractions.operator_email
  agents:
  - key: writer
    role: main
    description: Drafts listing descriptions and weekend guides in English and Welsh, then waits for admin approval before
      publishing.
    profile:
      inline:
        display_name: Daytrova writer
        crews:
        - id: writer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 14
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write for Daytrova, a marketplace for local attractions in Britain outside London. Two tasks.
            (1) Listing description: read the attraction with read_attractions, then write a warm, factual description of
            80-120 words using only facts in the record (never invent opening times, prices or facilities). (2) Weekend guide:
            pick 5-7 attractions of the chosen region from read_attractions that suit the season and the date, and write a
            short ''things to do this weekend'' guide with a one-line reason each. For regional context (population, tourism
            or area statistics) you may call ons_search (ONS open data, Open Government Licence) and cite it; VisitBritain
            open data is context you may mention only when you are sure of it, never invent figures. Always write both English
            and Welsh versions (Welsh in clear, natural standard Welsh). Start every draft with a level-1 title ''# <title>''.
            When the draft is ready, call request_text_review with fields title, kind (listing or guide), text (English and
            Welsh together) and attraction_id if any, then stop. When you are resumed because the admin approved a draft,
            publish it: for a listing call write_attraction to update description_en and description_cy; for a guide call
            write_guide with title_en, title_cy, body_en, body_cy, region, week (the date) and status published. Never publish
            without approval.'
    goalTemplate: 'Task: {task_label}.

      Region: {region_label}.

      {?subject}Attraction or theme: {subject}{/subject}

      Today is {date}. Interface language: {lang}.'
    appTools:
    - name: read_attractions
      description: Read attraction records of the catalogue
      action: read
      collection: attractions
      scope: all
    - name: write_attraction
      description: Update the descriptions of an attraction
      action: write
      collection: attractions
      scope: all
    - name: write_guide
      description: Publish an approved weekend guide
      action: write
      collection: guides
      scope: all
    - name: ons_search
      description: Query ONS open data (datasets and area statistics)
      action: http
      http:
        method: GET
        url: https://api.beta.ons.gov.uk/v1/datasets
        allowPath: true
        attribution: Office for National Statistics, Open Government Licence v3.0
    awaits:
    - text_review
    output: markdown
    limits:
      maxTurns: 14
      maxBudgetUsd: 0.8
  inputForm:
    title:
      en: New text
      cy: Testun newydd
    fields:
    - name: task
      type: select
      required: true
      label:
        en: Task
        cy: Tasg
      options:
      - value: listing
        label:
          en: Listing description
          cy: Disgrifiad o atyniad
      - value: guide
        label:
          en: Weekend guide
          cy: Canllaw penwythnos
    - name: region
      type: select
      required: true
      label:
        en: Region
        cy: Rhanbarth
      options:
      - value: north-east
        label: North East
      - value: north-west
        label: North West
      - value: yorkshire
        label: Yorkshire and the Humber
      - value: east-midlands
        label: East Midlands
      - value: west-midlands
        label: West Midlands
      - value: east
        label: East of England
      - value: south-east
        label: South East
      - value: south-west
        label: South West
      - value: scotland
        label:
          en: Scotland
          cy: Yr Alban
      - value: wales
        label:
          en: Wales
          cy: Cymru
    - name: subject
      type: text
      maxLength: 200
      label:
        en: Attraction id or theme (optional)
        cy: ID atyniad neu thema (dewisol)
  data:
    collections:
    - name: attractions
      ownedBy: shared
      description: The catalogue of attractions; operators edit their own listing
      searchable: true
      fields:
      - name: name
        type: text
        required: true
        label:
          en: Name
          cy: Enw
      - name: region
        type: select
        required: true
        label:
          en: Region
          cy: Rhanbarth
        options:
        - north-east
        - north-west
        - yorkshire
        - east-midlands
        - west-midlands
        - east
        - south-east
        - south-west
        - scotland
        - wales
      - name: category
        type: select
        label:
          en: Category
          cy: Categori
        options:
        - museum
        - heritage
        - nature
        - family
        - adventure
        - food-drink
        - arts
        - tour
      - name: age_suitability
        type: select
        label:
          en: Age suitability
          cy: Addasrwydd oedran
        options:
        - all-ages
        - under-5
        - family
        - teens
        - adults
      - name: setting
        type: select
        label:
          en: Indoor / outdoor
          cy: Dan do / awyr agored
        options:
        - indoor
        - outdoor
        - both
      - name: price
        type: number
        label:
          en: Price from (GBP)
          cy: Pris o (GBP)
      - name: accessibility
        type: multiselect
        label:
          en: Accessibility
          cy: Hygyrchedd
        options:
        - step-free
        - wheelchair
        - hearing-loop
        - assistance-dogs
        - quiet-hours
        - accessible-toilet
      - name: town
        type: text
      - name: address
        type: text
      - name: lat
        type: number
      - name: lon
        type: number
      - name: photo
        type: url
        label:
          en: Photo URL
          cy: URL llun
      - name: opening_times
        type: textarea
        label:
          en: Opening times
          cy: Oriau agor
      - name: description_en
        type: textarea
        label: English description
      - name: description_cy
        type: textarea
        label: Disgrifiad Cymraeg
      - name: capacity
        type: number
        label:
          en: Capacity per slot
          cy: Capasiti fesul slot
      - name: slots
        type: json
        label:
          en: Days and hours of slots
          cy: Diwrnodau ac oriau slotiau
      - name: operator_email
        type: email
        label:
          en: Operator email
          cy: E-bost y gweithredwr
      - name: payout_account
        type: text
        label:
          en: Payout account reference
          cy: Cyfeirnod cyfrif talu
      access:
      - role: operator
        where:
          operator_email: '{user.email}'
        can:
        - read
        - write
    - name: bookings
      ownedBy: user
      description: Each booking of a visitor
      retentionDays: 1095
      fields:
      - name: party_size
        type: number
        required: true
        label:
          en: Number of people
          cy: Nifer o bobl
      - name: notes
        type: textarea
        label:
          en: Notes
          cy: Nodiadau
      - name: attraction_name
        type: text
      - name: region
        type: text
      - name: operator_email
        type: email
      - name: price
        type: number
      access:
      - role: operator
        where:
          operator_email: '{user.email}'
        can:
        - read
    - name: guides
      ownedBy: shared
      description: Published weekend guides (written by the agent after admin approval)
      fields:
      - name: title_en
        type: text
      - name: title_cy
        type: text
      - name: body_en
        type: textarea
      - name: body_cy
        type: textarea
      - name: region
        type: text
      - name: week
        type: date
      - name: status
        type: text
    - name: claims
      ownedBy: org
      description: Operators' requests to claim a listing; admins review them
      fields:
      - name: attraction_name
        type: text
        required: true
        label:
          en: Attraction name
          cy: Enw'r atyniad
      - name: contact_name
        type: text
        required: true
        label:
          en: Your name
          cy: Eich enw
      - name: contact_email
        type: email
        required: true
        label:
          en: Your email
          cy: Eich e-bost
      - name: phone
        type: text
        label:
          en: Phone
          cy: Ffôn
      - name: notes
        type: textarea
        label:
          en: Proof of connection / notes
          cy: Prawf o gysylltiad / nodiadau
    - name: payouts
      ownedBy: org
      description: Monthly payout statements per operator, filled by the admins; each operator reads only their own
      fields:
      - name: operator_email
        type: email
      - name: month
        type: date
      - name: gross
        type: number
      - name: commission
        type: number
      - name: net
        type: number
      - name: status
        type: text
      access:
      - role: operator
        where:
          operator_email: '{user.email}'
        can:
        - read
  views:
  - key: home
    type: page
    nav: false
    title: Daytrova
    sections:
    - type: hero
      layout: stack
      band: true
      title:
        en: Find **local days out** across Britain
        cy: Dewch o hyd i **ddiwrnodau allan** lleol ledled Prydain
      text:
        en: Browse attractions outside London, filter by what suits your family, book a time slot and pay by card. Free for
          visitors.
        cy: Porwch atyniadau y tu allan i Lundain, hidlwch yn ôl yr hyn sy'n addas i'ch teulu, archebwch slot a thalu â cherdyn.
          Am ddim i ymwelwyr.
      actions:
      - label:
          en: Browse attractions
          cy: Pori atyniadau
        href: /v/catalogue
        style: primary
      - label:
          en: See the map
          cy: Gweld y map
        href: /v/map
        style: ghost
    - type: steps
      id: how
      title:
        en: How it works
        cy: Sut mae'n gweithio
      items:
      - title:
          en: Browse
          cy: Pori
        text:
          en: Filter by region, category, age, indoor or outdoor, price and accessibility.
          cy: Hidlwch yn ôl rhanbarth, categori, oedran, dan do neu awyr agored, pris a hygyrchedd.
      - title:
          en: Book
          cy: Archebu
        text:
          en: Pick a time slot and pay by card. You get an email confirmation.
          cy: Dewiswch slot a thalu â cherdyn. Cewch e-bost cadarnhau.
      - title:
          en: Enjoy
          cy: Mwynhau
        text:
          en: A reminder arrives the day before your visit.
          cy: Daw nodyn atgoffa'r diwrnod cyn eich ymweliad.
    - type: cards
      id: operators
      title:
        en: For attraction operators
        cy: I weithredwyr atyniadau
      items:
      - title:
          en: Claim your listing
          cy: Hawliwch eich rhestriad
        text:
          en: Edit details, set slots and capacity, see only your bookings and payouts.
          cy: Golygwch fanylion, gosodwch slotiau a chapasiti, gwelwch eich archebion a'ch taliadau yn unig.
      - title:
          en: Commission per booking
          cy: Comisiwn fesul archeb
        text:
          en: No fee to list. Payouts are made monthly after the visit has happened.
          cy: Dim ffi i restru. Telir yn fisol ar ôl i'r ymweliad ddigwydd.
    - type: data
      id: weekend
      title:
        en: Things to do this weekend
        cy: Pethau i'w gwneud y penwythnos hwn
      source: collection:guides
      display: cards
      fields:
      - key: title_en
        label: Title
      - key: region
        format: badge
      - key: body_en
        label: Guide
      filters:
      - field: status
        op: '='
        value: published
      sort:
        field: week
        dir: desc
      limit: 6
      empty:
        en: Guides will appear here.
        cy: Bydd canllawiau yn ymddangos yma.
    - type: note
      content:
        en: Daytrova · Regional context uses ONS open data (Open Government Licence v3.0).
        cy: Daytrova · Mae cyd-destun rhanbarthol yn defnyddio data agored yr ONS (Trwydded Llywodraeth Agored v3.0).
  - key: catalogue
    type: cards
    title:
      en: Attractions
      cy: Atyniadau
    source: collection:attractions
    export: false
    data:
      display: cards
      fields:
      - key: name
      - key: region
        format: badge
      - key: category
        format: badge
      - key: age_suitability
        format: badge
      - key: setting
        format: badge
      - key: price
        format: money
      - key: accessibility
      sort:
        field: name
        dir: asc
      limit: 60
      empty:
        en: No attractions yet.
        cy: Dim atyniadau eto.
      actions:
      - type: directions
        field: address
        label:
          en: Directions
          cy: Cyfarwyddiadau
  - key: map
    type: map
    title:
      en: Map
      cy: Map
    source: collection:attractions
    map:
      lat: lat
      lon: lon
      title: name
      popup:
      - town
      - category
      - price
  - key: attraction
    type: cards
    title:
      en: Attraction
      cy: Atyniad
    source: collection:attractions
    param: id
    nav: false
    data:
      display: cards
      fields:
      - key: name
      - key: photo
        format: link
      - key: description_en
      - key: description_cy
      - key: opening_times
      - key: price
        format: money
      - key: accessibility
  - key: book
    type: booking
    title:
      en: Book a visit
      cy: Archebu ymweliad
    collection: bookings
    resources: collection:attractions
    fields:
    - party_size
    - notes
    slots:
      days:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      from: 09:00
      to: '17:00'
      minutes: 60
      tz: Europe/London
      aheadDays: 60
      minNoticeHours: 4
      capacity: 10
    roles:
    - user
    - admin
  - key: my_bookings
    type: table
    title:
      en: My bookings
      cy: Fy archebion
    source: collection:bookings
    roles:
    - user
    - admin
    data:
      display: table
      fields:
      - key: attraction_name
      - key: date
        format: date
      - key: party_size
      - key: price
        format: money
      - key: status
        format: badge
      sort:
        field: date
        dir: desc
      actions:
      - type: calendar
        title: attraction_name
        start: start
        end: end
  - key: claim
    type: form
    title:
      en: Claim your listing
      cy: Hawliwch eich rhestriad
    collection: claims
    submit:
      label:
        en: Send claim
        cy: Anfon hawliad
      message:
        en: Thanks, we will contact you after checking your claim.
        cy: Diolch, byddwn yn cysylltu ar ôl gwirio eich hawliad.
    roles:
    - user
    - admin
  - key: edit_listing
    type: form
    title:
      en: Edit my listing
      cy: Golygu fy rhestriad
    collection: attractions
    edit: true
    fields:
    - name
    - category
    - age_suitability
    - setting
    - price
    - accessibility
    - address
    - town
    - lat
    - lon
    - photo
    - opening_times
    - capacity
    - slots
    - payout_account
    submit:
      label:
        en: Save
        cy: Cadw
    roles:
    - operator
    - admin
    nav: true
  - key: my_listings
    type: table
    title:
      en: My listings
      cy: Fy rhestriadau
    source: collection:attractions
    roles:
    - operator
    data:
      display: table
      fields:
      - key: name
      - key: region
        format: badge
      - key: capacity
      - key: price
        format: money
  - key: operator_bookings
    type: table
    title:
      en: Bookings for my attractions
      cy: Archebion ar gyfer fy atyniadau
    source: collection:bookings
    roles:
    - operator
    - admin
    export: true
    data:
      display: table
      fields:
      - key: attraction_name
      - key: date
        format: date
      - key: party_size
      - key: price
        format: money
      - key: status
        format: badge
      sort:
        field: date
        dir: desc
  - key: my_payouts
    type: table
    title:
      en: Payouts
      cy: Taliadau
    source: collection:payouts
    roles:
    - operator
    - admin
    export: true
    data:
      display: table
      fields:
      - key: month
        format: date
      - key: gross
        format: money
      - key: commission
        format: money
      - key: net
        format: money
      - key: status
        format: badge
      sort:
        field: month
        dir: desc
  - key: insights
    type: dashboard
    title:
      en: Dashboards
      cy: Dangosfyrddau
    children:
    - by_region
    - revenue
    - top_attractions
    roles:
    - admin
    - operator
  - key: by_region
    type: table
    title:
      en: Bookings by region
      cy: Archebion fesul rhanbarth
    source: collection:bookings
    nav: false
    data:
      display: chart
      chart: bar
      fields:
      - key: region
      - key: count
      groupBy:
        field: region
        aggs:
        - key: revenue
          agg: sum
          field: price
  - key: revenue
    type: table
    title:
      en: Operator revenue
      cy: Refeniw gweithredwyr
    source: collection:bookings
    nav: false
    data:
      display: table
      fields:
      - key: operator_email
      - key: count
      - key: revenue
        format: money
      groupBy:
        field: operator_email
        aggs:
        - key: revenue
          agg: sum
          field: price
  - key: top_attractions
    type: table
    title:
      en: Top attractions
      cy: Atyniadau gorau
    source: collection:bookings
    nav: false
    data:
      display: chart
      chart: bar
      fields:
      - key: attraction_name
      - key: count
      groupBy:
        field: attraction_name
        aggs:
        - key: revenue
          agg: sum
          field: price
      sort:
        field: count
        dir: desc
      limit: 10
  - key: new_text
    type: new_run
    title:
      en: Write a text
      cy: Ysgrifennu testun
    roles:
    - admin
  - key: texts
    type: history
    title:
      en: Texts
      cy: Testunau
    source: run
    roles:
    - admin
  - key: text_report
    type: report
    source: run
    printable: true
    nav: false
  - key: review_texts
    type: approvals
    title:
      en: Texts to approve
      cy: Testunau i'w cymeradwyo
    approvals:
    - text_review
    roles:
    - admin
  approvals:
  - key: text_review
    title:
      en: Approve text before it goes live
      cy: Cymeradwyo testun cyn iddo fynd yn fyw
    role: admin
    fields:
    - title
    - kind
    - text
    - attraction_id
    decidedBy: role
  triggers:
  - key: text_approved
    'on':
      approval: text_review
      decision: approved
    start:
      agent: writer
    goal: 'The admin approved the draft. Publish it now as instructed (listing: write_attraction; guide: write_guide with
      status published). Approval event: {event}'
    asUser: false
  - key: booking_confirmed
    'on':
      collection: bookings
      op: insert
    notify:
      to: owner
      subject:
        en: 'Booking confirmed: {record.attraction_name}'
        cy: 'Archeb wedi''i chadarnhau: {record.attraction_name}'
      body:
        en: Your booking for {record.attraction_name} on {record.date} for {record.party_size} people is confirmed. Show your
          booking reference {record.id} on arrival.
        cy: Mae eich archeb ar gyfer {record.attraction_name} ar {record.date} ar gyfer {record.party_size} o bobl wedi'i
          chadarnhau. Dangoswch eich cyfeirnod archeb {record.id} wrth gyrraedd.
      link: my_bookings
  - key: booking_reminder
    'on':
      date:
        collection: bookings
        field: start
        offsetDays: -1
        hour: 8
    notify:
      to: owner
      subject:
        en: 'Tomorrow: {record.attraction_name}'
        cy: 'Yfory: {record.attraction_name}'
      body:
        en: 'A reminder: your visit to {record.attraction_name} is tomorrow.'
        cy: 'Nodyn atgoffa: mae eich ymweliad ag {record.attraction_name} yfory.'
      link: my_bookings
  - key: claim_received
    'on':
      collection: claims
      op: insert
    notify:
      to: admins
      subject: 'New listing claim: {record.attraction_name}'
      body: '{record.contact_name} ({record.contact_email}) claims {record.attraction_name}. Review it and set operator_email
        on the listing in /admin/data.'
      link: /admin/data
  schedules:
  - agent: writer
    action: run
    cron: 0 6 * * 4
    owner: app
    goal: Draft this week's 'things to do this weekend' guide for the region of your choice that has the most listings (rotate
      regions). Today is {date}. Write English and Welsh, then request approval.
  billing:
    modes:
    - per_transaction
    currency: gbp
    transactionFeePct: 12
    sellers: collection:attractions
  notifications:
    emailOnRunDone: false
  egress:
    hosts:
    - api.beta.ons.gov.uk
    notes: ONS open data API, Open Government Licence v3.0, reuse allowed with attribution.
  extensions:
  - key: escrow_payouts
    description: Holding the visitor's payment until the visit has happened, then paying each of ~2,700 operators monthly
      minus commission, is not expressible yet. The manifest declares per_transaction billing with sellers = attractions and
      a 12% fee (placeholder, set your rate); escrow release after the visit and the monthly batch payout need platform support.
      Meanwhile admins record monthly statements in the payouts collection (admin-only back office; each operator reads only
      their own rows).
  - key: qr_code
    description: The confirmation email is plain text with a booking reference; a QR code image in the email is not available
      yet.
  - key: booking_stamping
    description: The bookings collection needs attraction_name, region, operator_email and price copied from the attraction
      for operators' views and the dashboards; the booking view does not fill them automatically yet.
  - key: reviews
    description: Public visitor reviews on a listing (written by visitors, readable by everyone) are not available yet.
  - key: catalogue_filters
    description: Interactive visitor filters (region, category, age, indoor/outdoor, price, accessibility) on the catalogue
      depend on the runtime's table/cards filter bar; the fields are all declared.
  - key: visitbritain_data
    description: VisitBritain has no suitable open API in the allowed list; the agent uses ONS through an http tool and VisitBritain
      open data only from the admin's context. CSV bulk import of listings uses the built-in /admin/data page.
