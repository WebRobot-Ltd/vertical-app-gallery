  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 50
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:suggester:
        estimate: 10
        metered: true
      agent:auditor:
        estimate: 60
        metered: true
    packs:
    - key: credits_1000
      credits: 1000
      price: 10
      label: 1,000 extra run credits
    - key: credits_5000
      credits: 5000
      price: 45
      label: 5,000 extra run credits
    plans:
    - key: starter
      price: 49
      interval: month
      label: Starter
      includes:
      - Up to 25 questions
      - 2 models
      - Weekly runs
      credits: 600
      creditsReset: monthly
      roles:
      - user
    - key: growth
      price: 149
      interval: month
      label: Growth
      includes:
      - Up to 100 questions
      - 4 models
      - Daily runs
      credits: 3000
      creditsReset: monthly
      roles:
      - user
    - key: agency
      price: 449
      interval: month
      label: Agency
      includes:
      - Up to 400 questions
      - All models
      - Daily runs
      - Unlimited client brands
      credits: 12000
      creditsReset: monthly
      roles:
      - user
  extensions:
  - key: plan_enforcement
    description: The number of questions tracked, the models queried and daily-vs-weekly frequency per plan are described
      in the plans but not enforced automatically; the marketer picks the schedule on the tracking page and run credits are
      charged per run.
  - key: pdf_report
    description: The monthly report is a printable page (save as PDF from the browser) and the email links to it; a PDF file
      attachment is not generated.
