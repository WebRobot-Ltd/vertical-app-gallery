apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: hirepair
  displayName: Hirepair
  tagline:
    en: Two AI recruiters, one for you and one for the company. Nothing is shared until you agree.
  description:
    en: Candidates talk to their own AI agent. Hiring managers talk to theirs. A matching agent proposes introductions, and
      candidates decide before any company sees them.
  langs:
  - en
  defaultLang: en
  timezone: Europe/London
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#17324d'
      accent: '#e4572e'
      background: '#f7f8fa'
      foreground: '#16202b'
    fonts:
      body: Inter
      display: Sora
    wordmark:
    - text: Hire
      color: primary
    - text: pair
      color: accent
    width: wide
  header:
    links:
    - label: How it works
      href: '#how'
    - label: Privacy
      href: '#privacy'
    - label: Pricing
      href: '#pricing'
    cta:
      label: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: user
      label: Member
      assignedBy: signup
    - key: employer
      label: Employer
      assignedBy: derived
      from: collection:companies.contact_email
  limits:
  - action: chat
    per: user
    max: 300
    window: day
    roles:
    - user
  agents:
  - key: candidate_agent
    role: main
    description: 'The candidate''s own recruiter: interviews them, builds their profile, reads the CV, and relays opportunities
      and consent.'
    memory: user
    profile:
      inline:
        display_name: Hirepair candidate agent
        chat_mode: true
        crews:
        - id: candidate_agent
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the candidate''s personal recruiting agent at Hirepair. You work for the candidate only.
            Keep turns short and conversational: people may be talking to you by voice. Ask one question at a time.


            Goal: build a complete, honest profile through a friendly interview. Cover: recent experience and achievements,
            skills and tools, seniority, salary expectations (min, max, currency), location and work mode (remote, hybrid,
            onsite), notice period, and what they want next (role, industry, culture, deal-breakers). If the profile context
            lists CV file ids, open each with the read_upload tool and use it to avoid asking what the CV already says. If
            there is no CV yet, invite them to upload it on the My CV page.


            After each substantial answer call save_profile with the fields you learned (full_name, email, headline, skills,
            experience, salary_min, salary_max, currency, location, work_modes, notice_period, wants_next). Never invent facts.
            When the profile is complete, ask clearly whether they agree to be considered for matching. Only if they say yes,
            call publish_to_pool with an anonymous summary (no name, no employer names, no phone) and set shared_with_matching
            to yes through save_profile. If they say no, or later withdraw, set it to no and tell them they will not be matched.


            Opportunities: call my_opportunities to see proposed introductions. Present each one: company, role, why it fits,
            and the gaps, honestly. Nothing is shared with the company until the candidate explicitly agrees. When they decide,
            call answer_opportunity with the record id and set only the field shared to yes or no. Never change any other
            field. Companies only see candidates who answered yes.


            You do not check right to work (the employer does) and you give no legal advice. Never reveal other candidates.
            Be candid about what you cannot do: you cannot place phone calls yet.'
    context:
    - key: profile
      from: collection:candidate_profiles
    - key: opportunities
      from: collection:matches
    goalTemplate: 'Candidate: {user}. Today is {date}. Reply in the language with ISO code {lang}.

      Profile so far (JSON lines): {profile}

      Opportunities proposed (JSON lines): {opportunities}

      Conversation so far:

      {history}

      New message: {message}'
    appTools:
    - name: save_profile
      description: Create or update the candidate's own profile record
      action: write
      collection: candidate_profiles
      scope: user
    - name: publish_to_pool
      description: Publish the candidate's anonymous matching summary (only after explicit consent)
      action: write
      collection: talent_pool
      scope: all
    - name: my_opportunities
      description: List the introductions proposed to this candidate
      action: read
      collection: matches
      scope: user
    - name: answer_opportunity
      description: Record the candidate's decision (shared = yes or no) on one proposed introduction
      action: write
      collection: matches
      scope: user
    - name: read_upload
      description: Read an uploaded CV by file id (OCR included)
      action: read_file
    output: markdown
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.5
  - key: company_agent
    role: helper
    description: 'The hiring manager''s recruiter: turns a conversation into a structured job post and runs the pipeline.'
    memory: user
    profile:
      inline:
        display_name: Hirepair company agent
        chat_mode: true
        crews:
        - id: company_agent
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the company''s recruiting agent at Hirepair. You work for the hiring manager. Keep turns
            short and conversational: they may be talking by voice. Ask one question at a time.


            Job intake: interview the manager about the role: title, team and department, location and work mode, seniority,
            must-have skills, nice-to-haves, responsibilities, salary range and currency, start date, and what a great hire
            looks like. Then call save_job with a structured post (title, department, location, work_mode, salary_min, salary_max,
            currency, skills, description, requirements, nice_to_have, status, company_name, contact_email). Read the draft
            back, and only when the manager confirms set status to open and call publish_role with the same facts plus employer_email,
            so the matcher can use it. Use clear, non-discriminatory wording; never put requirements on age, gender, nationality
            or family status.


            Pipeline: call my_pipeline to see candidates who have agreed to be introduced for this company''s roles. Present
            each with fit and gaps, and ask which should move forward. Record the manager''s choice with decide_candidate
            (record id; employer_decision = approved or declined; interview_at as a YYYY-MM-DD date and interview_note when
            they propose an interview; employer_decision = hired when they tell you someone was hired, after confirming, because
            a success fee is charged then). Change no other field. Email reminders and status updates go to both sides automatically
            when you record a decision and date.


            Right-to-work checks stay with the employer: remind them once, never perform them. You only see candidates who
            consented. Never invent candidate details.'
    context:
    - key: company
      from: collection:companies
    - key: jobs
      from: collection:job_posts
    - key: pipeline
      from: collection:matches
    goalTemplate: 'Hiring manager: {user}. Today is {date}. Reply in the language with ISO code {lang}.

      Company (JSON lines): {company}

      Job posts so far (JSON lines): {jobs}

      Pipeline (JSON lines): {pipeline}

      Conversation so far:

      {history}

      New message: {message}'
    appTools:
    - name: save_job
      description: Create or update a job post of this company
      action: write
      collection: job_posts
      scope: user
    - name: publish_role
      description: Publish a confirmed open role for matching
      action: write
      collection: open_roles
      scope: all
    - name: my_pipeline
      description: List the matches of this company's roles that candidates agreed to share
      action: read
      collection: matches
      scope: user
    - name: decide_candidate
      description: Record the hiring manager's decision, interview date and note on a match
      action: write
      collection: matches
      scope: user
    output: markdown
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.5
  - key: matcher
    role: scheduled
    description: Compares the consenting talent pool with open roles and proposes introductions, nothing shared until the
      candidate agrees.
    profile:
      inline:
        display_name: Hirepair matcher
        crews:
        - id: matcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the Hirepair matching agent. Start your report with a level-1 title "# Matching run <date>".


            Steps: (1) read open roles with roles_search; (2) read the talent pool with pool_search (only candidates who consented
            are in it); (3) read the existing matches with matches_read and never propose the same candidate_email + employer_email
            + job_title twice; (4) for each role, compare candidates on skills, seniority, location and work mode, salary
            overlap, notice period and what the candidate wants next. For every pair with a fit_score of 70 or more (0-100)
            call matches_add with: candidate_email, candidate_name (from the pool summary or the headline), employer_email,
            company_name, job_title, fit_score, fit_summary (why it fits, 2-3 sentences), gaps (honest gaps and risks), status
            proposed, shared no, employer_decision pending. Propose at most 5 candidates per role per run.


            Fairness: judge only job-relevant evidence. Never use age, gender, ethnicity, nationality, religion, disability,
            family status or photos. Never judge right to work: the employer checks it. Never invent candidate facts. End
            with a short summary: roles processed, matches proposed, roles with no match.'
    appTools:
    - name: roles_search
      description: Read the open roles
      action: read
      collection: open_roles
      scope: all
    - name: pool_search
      description: Read the consenting talent pool
      action: read
      collection: talent_pool
      scope: all
    - name: matches_read
      description: Read the existing matches
      action: read
      collection: matches
      scope: all
    - name: matches_add
      description: Propose an introduction (a new match record)
      action: append
      collection: matches
      scope: all
    goalTemplate: Run the matching for {date}.
    output: markdown
    limits:
      maxTurns: 25
      maxBudgetUsd: 1.0
  schedules:
  - agent: matcher
    action: run
    cron: 0 6 * * *
    owner: app
    goal: Run the daily matching of the talent pool against open roles.
  data:
    collections:
    - name: candidate_profiles
      ownedBy: user
      description: Each candidate's own profile, private to them
      fields:
      - name: full_name
        type: text
        label: Full name
      - name: email
        type: email
        label: Contact email
      - name: headline
        type: text
        label: Headline
      - name: skills
        type: textarea
        label: Skills
      - name: experience
        type: textarea
        label: Experience
      - name: salary_min
        type: number
        label: Salary minimum
      - name: salary_max
        type: number
        label: Salary maximum
      - name: currency
        type: select
        label: Currency
        options:
        - EUR
        - GBP
        - USD
      - name: location
        type: text
        label: Location
      - name: work_modes
        type: select
        label: Work mode
        options:
        - remote
        - hybrid
        - onsite
      - name: notice_period
        type: text
        label: Notice period
      - name: wants_next
        type: textarea
        label: What I want next
      - name: cv
        type: file
        label: CV
        accept:
        - pdf
        - docx
        - txt
        maxMb: 10
        multiple: false
      - name: shared_with_matching
        type: select
        label: Included in matching
        options:
        - 'yes'
        - 'no'
    - name: talent_pool
      ownedBy: org
      retentionDays: 365
      description: Anonymous summaries of candidates who consented to matching (platform back office, never shown to companies)
      fields:
      - name: candidate_email
        type: email
      - name: candidate_name
        type: text
      - name: headline
        type: text
      - name: skills
        type: textarea
      - name: seniority
        type: text
      - name: summary
        type: textarea
      - name: salary_min
        type: number
      - name: salary_max
        type: number
      - name: currency
        type: text
      - name: location
        type: text
      - name: work_modes
        type: text
      - name: notice_period
        type: text
      - name: wants_next
        type: textarea
    - name: companies
      ownedBy: user
      description: Each employer's company profile
      fields:
      - name: name
        type: text
        label: Company name
        required: true
      - name: contact_email
        type: email
        label: Your work email
        required: true
      - name: website
        type: url
        label: Website
      - name: size
        type: select
        label: Size
        options:
        - 1-10
        - 11-50
        - 51-200
        - 201-1000
        - 1000+
      - name: location
        type: text
        label: Headquarters
      - name: description
        type: textarea
        label: About the company
    - name: job_posts
      ownedBy: user
      description: Structured job posts written by the company agent
      fields:
      - name: title
        type: text
        label: Title
      - name: department
        type: text
        label: Department
      - name: location
        type: text
        label: Location
      - name: work_mode
        type: select
        label: Work mode
        options:
        - remote
        - hybrid
        - onsite
      - name: salary_min
        type: number
        label: Salary minimum
      - name: salary_max
        type: number
        label: Salary maximum
      - name: currency
        type: select
        label: Currency
        options:
        - EUR
        - GBP
        - USD
      - name: skills
        type: textarea
        label: Skills
      - name: description
        type: textarea
        label: Description
      - name: requirements
        type: textarea
        label: Requirements
      - name: nice_to_have
        type: textarea
        label: Nice to have
      - name: status
        type: select
        label: Status
        options:
        - draft
        - open
        - closed
      - name: company_name
        type: text
        label: Company
      - name: contact_email
        type: email
        label: Contact
    - name: open_roles
      ownedBy: org
      description: Confirmed open roles used by the matcher (platform back office)
      fields:
      - name: employer_email
        type: email
      - name: company_name
        type: text
      - name: title
        type: text
      - name: location
        type: text
      - name: work_mode
        type: text
      - name: salary_min
        type: number
      - name: salary_max
        type: number
      - name: currency
        type: text
      - name: skills
        type: textarea
      - name: requirements
        type: textarea
      - name: description
        type: textarea
    - name: matches
      ownedBy: org
      retentionDays: 730
      description: Proposed introductions. The candidate sees their own; the employer sees a match only after the candidate
        agreed (shared = yes).
      fields:
      - name: candidate_email
        type: email
      - name: candidate_name
        type: text
        label: Candidate
      - name: employer_email
        type: email
      - name: company_name
        type: text
        label: Company
      - name: job_title
        type: text
        label: Role
      - name: fit_score
        type: number
        label: Fit
      - name: fit_summary
        type: textarea
        label: Why it fits
      - name: gaps
        type: textarea
        label: Gaps
      - name: status
        type: select
        label: Status
        options:
        - proposed
        - agreed
        - declined
        - interview
        - hired
      - name: shared
        type: select
        label: Candidate agreed
        options:
        - 'yes'
        - 'no'
      - name: employer_decision
        type: select
        label: Decision
        options:
        - pending
        - approved
        - declined
        - hired
      - name: interview_at
        type: date
        label: Interview date
      - name: interview_note
        type: textarea
        label: Interview note
      access:
      - role: user
        where:
          candidate_email: '{user.email}'
        can:
        - read
        - write
      - role: employer
        where:
          employer_email: '{user.email}'
          shared: 'yes'
        can:
        - read
        - write
  triggers:
  - key: new_match_candidate
    'on':
      collection: matches
      op: insert
    notify:
      to: record.candidate_email
      subject: A new opportunity for you on Hirepair
      body: 'Your agent found a role that fits: {record.job_title}. Nothing is shared with the company until you agree. Open
        Hirepair and talk to your agent to decide.'
      link: opportunities
  - key: candidate_agreed
    'on':
      collection: matches
      op: update
      where:
        shared: 'yes'
    notify:
      to: record.employer_email
      subject: A candidate agreed to be introduced for {record.job_title}
      body: '{record.candidate_name} agreed to be introduced for {record.job_title}. Review the fit and decide who moves forward
        in your pipeline.'
      link: pipeline
  - key: approved_candidate
    'on':
      collection: matches
      op: update
      where:
        employer_decision: approved
    notify:
      to: record.candidate_email
      subject: '{record.company_name} wants to move forward'
      body: 'Good news: {record.company_name} wants to move forward for {record.job_title}. Interview date, if set: {record.interview_at}.
        {record.interview_note}'
      link: opportunities
  - key: approved_employer
    'on':
      collection: matches
      op: update
      where:
        employer_decision: approved
    notify:
      to: record.employer_email
      subject: '{record.candidate_name} moved forward for {record.job_title}'
      body: 'Status update: {record.candidate_name} has been approved for {record.job_title}. Interview date, if set: {record.interview_at}.
        Remember that right-to-work checks are the employer''s responsibility.'
      link: pipeline
  - key: reminder_candidate
    'on':
      date:
        collection: matches
        field: interview_at
        offsetDays: -1
        hour: 8
    notify:
      to: record.candidate_email
      subject: 'Interview tomorrow: {record.job_title}'
      body: 'Reminder: you have an interview with {record.company_name} tomorrow for {record.job_title}. {record.interview_note}'
      link: opportunities
  - key: reminder_employer
    'on':
      date:
        collection: matches
        field: interview_at
        offsetDays: -1
        hour: 8
    notify:
      to: record.employer_email
      subject: 'Interview tomorrow: {record.candidate_name}'
      body: 'Reminder: interview with {record.candidate_name} tomorrow for {record.job_title}. {record.interview_note}'
      link: pipeline
  - key: hired_fee
    'on':
      collection: matches
      op: update
      where:
        employer_decision: hired
    charge:
      credits: 500
      reason: Hirepair success fee per hire
  - key: hired_candidate
    'on':
      collection: matches
      op: update
      where:
        employer_decision: hired
    notify:
      to: record.candidate_email
      subject: Congratulations from Hirepair
      body: '{record.company_name} marked the {record.job_title} role as filled with you. Congratulations!'
      link: opportunities
  views:
  - key: home
    type: page
    title: Hirepair
    nav: false
    sections:
    - type: hero
      band: true
      eyebrow: AI recruiting, on both sides
      title: Your own **AI recruiter**. Nothing shared until you agree.
      text: Candidates talk to their agent by voice or text. Hiring managers describe a role and get a structured job post.
        A matching agent proposes introductions, and candidates decide first.
      actions:
      - label: Sign in and start
        href: /login
        style: primary
      - label: How it works
        href: '#how'
        style: ghost
    - type: steps
      id: how
      title: How it works
      items:
      - title: 'Candidates: interview your agent'
        text: Upload your CV, then chat about experience, skills, salary, location, notice period and what you want next.
      - title: 'Companies: describe the role'
        text: Set up your company, then talk to your agent. It turns the conversation into a structured job post.
      - title: Matching and introductions
        text: The matching agent explains fit and gaps. The candidate agrees first, then the hiring manager approves who moves
          forward.
      - title: Interviews and updates
        text: Interview reminders and status updates go by email to both sides. Employers see the pipeline on a dashboard.
    - type: cards
      id: privacy
      title: Privacy by design
      items:
      - title: Candidates stay in control
        text: You see only your own profile and opportunities. A company sees you only after you agreed to an introduction.
      - title: Fair matching
        text: Matching uses job-relevant evidence only. Right-to-work checks stay with the employer.
    - type: cards
      id: pricing
      title: Pricing
      items:
      - title: 'Candidates: free'
        text: Always free.
      - title: 'Companies: success fee per hire'
        text: Pay only when a hire is recorded in your pipeline.
    - type: note
      content: Hirepair supports hiring decisions and gives no legal advice. Employers are responsible for right-to-work checks.
  - key: candidate_cv
    type: form
    title: My CV
    collection: candidate_profiles
    fields:
    - full_name
    - email
    - location
    - cv
    submit:
      label: Save
      message: Saved. Now talk to your agent.
      redirect: candidate_chat
    roles:
    - user
  - key: candidate_chat
    type: chat
    title: My recruiter
    source: agent:candidate_agent
    examples:
    - Let's start my interview
    - Which opportunities do I have?
    - I want to change my salary expectations
    placeholder: Talk or type to your agent…
    roles:
    - user
  - key: my_profile
    type: cards
    title: My profile
    source: collection:candidate_profiles
    data:
      display: cards
      fields:
      - key: full_name
        label: Name
      - key: headline
        label: Headline
      - key: skills
        label: Skills
      - key: location
        label: Location
      - key: salary_min
        label: Salary from
        format: number
      - key: salary_max
        label: Salary to
        format: number
      - key: notice_period
        label: Notice
      - key: wants_next
        label: Next
      - key: shared_with_matching
        label: In matching
        format: badge
    roles:
    - user
  - key: opportunities
    type: cards
    title: My opportunities
    source: collection:matches
    data:
      display: cards
      fields:
      - key: company_name
        label: Company
      - key: job_title
        label: Role
      - key: fit_score
        label: Fit
        format: number
      - key: fit_summary
        label: Why it fits
      - key: gaps
        label: Gaps
      - key: shared
        label: I agreed
        format: badge
      - key: employer_decision
        label: Company decision
        format: badge
      - key: interview_at
        label: Interview
        format: date
      sort:
        field: fit_score
        dir: desc
      empty: No opportunities yet. Complete your interview with your agent.
    roles:
    - user
  - key: company_setup
    type: form
    title: Set up my company
    collection: companies
    submit:
      label: Save company
      message: Company saved. Sign out and in again if the employer pages do not appear.
      redirect: company_chat
    roles:
    - user
  - key: company_chat
    type: chat
    title: Hiring assistant
    source: agent:company_agent
    examples:
    - I need to hire a senior backend engineer
    - Show me my pipeline
    - Approve the first candidate and set the interview for next Tuesday
    placeholder: Talk or type to your agent…
    roles:
    - employer
  - key: jobs
    type: table
    title: My job posts
    source: collection:job_posts
    data:
      display: table
      fields:
      - key: title
        label: Title
      - key: location
        label: Location
      - key: work_mode
        label: Mode
        format: badge
      - key: salary_min
        label: From
        format: number
      - key: salary_max
        label: To
        format: number
      - key: status
        label: Status
        format: badge
      empty: No job posts yet. Describe a role to your agent.
    roles:
    - employer
  - key: pipeline
    type: page
    title: Pipeline
    roles:
    - employer
    sections:
    - type: data
      title: Overview
      source: collection:matches
      display: kpi
      kpis:
      - label: Candidates who agreed
        agg: count
      - label: Average fit
        agg: avg
        field: fit_score
        format: number
    - type: data
      title: By decision
      source: collection:matches
      display: chart
      chart: bar
      groupBy:
        field: employer_decision
        aggs:
        - key: total
          agg: count
      fields:
      - key: employer_decision
        label: Decision
      - key: total
        label: Candidates
    - type: data
      title: Candidates
      source: collection:matches
      display: table
      fields:
      - key: candidate_name
        label: Candidate
      - key: job_title
        label: Role
      - key: fit_score
        label: Fit
        format: number
      - key: fit_summary
        label: Why it fits
      - key: gaps
        label: Gaps
      - key: employer_decision
        label: Decision
        format: badge
      - key: interview_at
        label: Interview
        format: date
      sort:
        field: fit_score
        dir: desc
      empty: No candidate has agreed to an introduction yet.
  - key: account
    type: account
    title: Credits
    roles:
    - employer
  billing:
    modes:
    - credits
    currency: eur
    signupCredits: 0
    metering:
      creditEur: 1
      markupPct: 0
      drivers:
      - llm_tokens
      allowNegative: true
    packs:
    - key: fees_1
      credits: 500
      price: 500
      label: 1 hire
    - key: fees_3
      credits: 1500
      price: 1400
      label: 3 hires
  extensions:
  - key: phone_calls
    description: Phone calls with candidates are not included in this version. Candidates talk to their agent by voice or
      text in the browser.
  - key: interview_negotiation
    description: 'Interview scheduling is date-based: the hiring manager sets the date through the agent, and both sides get
      email notifications and a reminder. Two-way negotiation of times by replying to emails is not available yet.'
  - key: network_effects
    description: The value of a large two-sided network of candidates and employers is a business and growth problem, not
      something this manifest can solve. It needs supply and demand to be acquired outside the app.
  - key: right_to_work
    description: Right-to-work checks are not performed by the app. They stay with the employer.
