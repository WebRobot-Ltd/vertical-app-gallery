apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: netvia
  displayName: Netvia
  tagline: Carbon accounting and decarbonisation for larger companies.
  description: Netvia turns utility, fleet, travel and procurement data into audit-ready emissions, tracks progress against
    science-based targets, and plans costed reduction measures that your head of sustainability approves.
  langs:
  - en
  defaultLang: en
  timezone: Europe/London
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#0f3d2e'
      accent: '#1f9d6b'
      background: '#f6f8f5'
      foreground: '#14201a'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Net
      color: primary
    - text: via
      color: accent
    width: wide
  header:
    links:
    - label: How it works
      href: '#how'
    - label: Traceability
      href: '#trace'
    - label: Pricing
      href: '#pricing'
    cta:
      label: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Netvia admin
      assignedBy: admin_emails
    - key: user
      label: Head of sustainability / team
      assignedBy: signup
    - key: site_lead
      label: Site lead
      assignedBy: derived
      from: collection:sites.site_lead_email
  limits:
  - action: agent:calculator
    per: user
    max: 20
    window: month
    plans:
      growth: 100
      enterprise: -1
  notifications:
    emailOnRunDone: true
  agents:
  - key: calculator
    role: main
    when: task == 'calculate'
    description: Maps uploaded activity data to DESNZ conversion factors and calculates emissions, one traceable row per activity.
    profile:
      inline:
        display_name: Netvia emissions calculator
        crews:
        - id: calculator
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are a GHG Protocol carbon accountant. Read the activity data rows with read_activity (filter
            by the requested year). For each row pick the matching factor with search_factors (category, activity, unit; prefer
            the factor version for the reporting year). If the activity data row has an attached file and the quantity is
            missing, open it with read_upload using the file id. Compute kgCO2e = quantity x factor (convert units explicitly,
            never guess). Write one row per activity with write_emissions: site, entity, region, year, scope (1, 2 location-based,
            3), category, quantity, unit, factor_id, factor_version, factor_value, kgco2e, source_record (the activity row
            id), source_file (file name or id), head_email (given in the goal), site_lead_email (copied from the activity
            row). If no factor matches, do NOT invent one: list the row as unmapped. Final report: a level-1 ''# '' title
            ''Emissions calculation <year>'', then ## Summary (totals by scope in tCO2e, a table by entity), ## Method (factor
            versions used), ## Unmapped or doubtful rows, ## Next steps. Add a chart as a fenced chart block comparing scopes
            with real figures only. Never invent figures.'
    goalTemplate: 'Reporting year: {year}.

      {?entity}Limit to entity: {entity}.{/entity}

      The head of sustainability''s email (use it as head_email): {email}.

      {?notes}Notes: {notes}{/notes}

      Calculate and record emissions for every activity row of that year. Today is {date}. Write in English.'
    context:
    - key: email
      from: user.email
    appTools:
    - name: read_activity
      description: Read the activity data rows the user may see
      action: read
      collection: activity_data
      scope: user
    - name: search_factors
      description: Search the DESNZ conversion factor tables
      action: search
      collection: factors
      scope: all
    - name: write_emissions
      description: Write an emission row
      action: write
      collection: emissions
      scope: user
    - name: read_upload
      description: Read a file the user uploaded
      action: read_file
    output: markdown
    limits:
      maxTurns: 40
      maxBudgetUsd: 1.5
  - key: planner
    role: main
    when: task == 'pathway'
    description: Builds a decarbonisation pathway with costed measures towards the science-based targets, for the head of
      sustainability to approve.
    awaits:
    - pathway_review
    profile:
      inline:
        display_name: Netvia pathway planner
        crews:
        - id: planner
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are a decarbonisation strategist. Read the emissions with read_emissions and the targets with
            read_targets. Identify the biggest hot spots by entity, site and category. Propose 5-12 reduction measures, each
            with: title, site, entity, owner_email (only an email already present in sites or measures, otherwise leave empty
            and flag it), budget_gbp, est_reduction_tco2e per year, milestone_date and due_date (YYYY-MM-DD), status ''proposed'',
            head_email (given in the goal) and site_lead_email of the site. Budgets and savings are estimates: label them
            as such and state the assumption; never present them as quotes. Save them with write_measures, then call request_pathway_review
            once with a one-paragraph summary. Report: ''# Decarbonisation pathway <year>'' then ## Gap to target (a table
            baseline, current, target), ## Proposed measures (table with cost, tCO2e saved, cost per tCO2e), ## Pathway by
            year (add a fenced chart block, line, real figures only), ## Risks and assumptions. No legal or financial advice.'
    goalTemplate: 'Reporting year: {year}.

      The head of sustainability''s email (use it as head_email): {email}.

      {?notes}Priorities or constraints: {notes}{/notes}

      Build the pathway towards the science-based targets. Today is {date}. Write in English.'
    context:
    - key: email
      from: user.email
    appTools:
    - name: read_emissions
      description: Read emission rows the user may see
      action: read
      collection: emissions
      scope: user
    - name: read_targets
      description: Read the company's targets
      action: read
      collection: targets
      scope: user
    - name: read_measures
      description: Read reduction measures
      action: read
      collection: measures
      scope: user
    - name: write_measures
      description: Create or update reduction measures
      action: write
      collection: measures
      scope: user
    output: markdown
    limits:
      maxTurns: 30
      maxBudgetUsd: 1.2
  - key: assistant
    role: helper
    description: Answers questions about the methodology and cites the factor tables.
    profile:
      inline:
        display_name: Netvia methodology assistant
        chat_mode: true
        crews:
        - id: assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You explain the carbon accounting method used in Netvia: GHG Protocol scopes 1, 2 and 3, organisational
            boundary (operational or financial control), DESNZ conversion factors, SECR, UK SRS (UK Sustainability Reporting
            Standards) and science-based targets. When a question concerns a factor, look it up with search_factors and cite
            category, activity, value, unit and factor version. You can read the user''s emissions with read_emissions to
            explain a figure. If a factor is not in the tables, say so; never invent factors or figures. You do not give legal
            or assurance advice. Keep answers short and in English.'
    goalTemplate: 'Conversation so far:

      {history}


      New question: {message}'
    appTools:
    - name: search_factors
      description: Search the DESNZ conversion factor tables
      action: search
      collection: factors
      scope: all
    - name: read_emissions
      description: Read emission rows the user may see
      action: read
      collection: emissions
      scope: user
    output: markdown
  - key: reporter
    role: helper
    description: Writes the monthly SECR / UK SRS report for one company and instance.
    writesTo:
      collection: report_archive
      parse: whole
    profile:
      inline:
        display_name: Netvia reporter
        crews:
        - id: reporter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write the monthly disclosure report for stakeholders. Read emissions (read_emissions), targets
            (read_targets), measures (read_measures). SECR: total tCO2e by scope, energy use if available, intensity ratio,
            methodology, year-on-year change. UK SRS: climate-related metrics, targets and progress, transition plan measures
            with owner, budget and status. Start with ''# <Framework> report - <period>''. Every figure must cite its emission
            record ids, source file and factor version (use the source_record, source_file and factor_version fields), in
            a final ## Evidence table. Add a fenced chart block for the trend. Mark anything missing as a data gap; never
            invent figures. This is a management report, not assurance.'
    goalTemplate: 'Report "{instance}": framework {framework}, reporting year {year}. Today is {date}. Write in English.'
    appTools:
    - name: read_emissions
      description: Read emission rows the user may see
      action: read
      collection: emissions
      scope: user
    - name: read_targets
      description: Read the company's targets
      action: read
      collection: targets
      scope: user
    - name: read_measures
      description: Read reduction measures
      action: read
      collection: measures
      scope: user
    output: markdown
  inputForm:
    title: New analysis
    fields:
    - name: task
      type: select
      required: true
      label: What do you want?
      default: calculate
      options:
      - value: calculate
        label: Calculate emissions
      - value: pathway
        label: Build decarbonisation pathway
    - name: year
      type: number
      required: true
      label: Reporting year
      default: 2025
    - name: entity
      type: text
      label: Entity (optional)
      visibleWhen: task == 'calculate'
    - name: notes
      type: textarea
      maxLength: 600
      label: Notes (optional)
  templates:
  - key: monthly_report
    title: Monthly report
    description: A SECR or UK SRS report every month, emailed to you with the evidence table.
    agent: reporter
    params:
    - name: framework
      type: select
      required: true
      label: Framework
      options:
      - value: SECR
        label: SECR
      - value: UK SRS
        label: UK SRS
    - name: year
      type: number
      required: true
      label: Reporting year
    goal: 'Report "{instance}": framework {framework}, reporting year {year}. Today is {date}. Write in English.'
    schedule:
      cron: 0 6 1 * *
      userCanChange: true
    maxPerUser: 4
    deliver:
      to: owner
      subject: Netvia {title} - {date}
      onlyIfNew: true
  approvals:
  - key: pathway_review
    title: Approve decarbonisation pathway
    description: The head of sustainability reviews the proposed measures.
    decidedBy: requester
    fields:
    - summary
  triggers:
  - key: pathway_approved
    'on':
      approval: pathway_review
      decision: approved
    start:
      agent: planner
    goal: The head of sustainability approved the pathway ({event}). Read the measures with read_measures and set every one
      with status 'proposed' to 'approved' with write_measures. Reply with a one-line confirmation.
  - key: milestone_soon
    'on':
      date:
        collection: measures
        field: milestone_date
        offsetDays: -7
        hour: 8
    notify:
      to:
      - record.owner_email
      - owner
      subject: 'Milestone in 7 days: {record.title}'
      body: 'The milestone for the reduction measure "{record.title}" is due on {record.milestone_date}. Budget: GBP {record.budget_gbp}.
        Current status: {record.status}. Please update the status in Netvia.'
      link: measures
  - key: due_soon
    'on':
      date:
        collection: measures
        field: due_date
        offsetDays: -14
        hour: 8
    notify:
      to:
      - record.owner_email
      - owner
      subject: 'Measure due in 14 days: {record.title}'
      body: 'The reduction measure "{record.title}" is due on {record.due_date}. Current status: {record.status}.'
      link: measures
  data:
    collections:
    - name: entities
      description: Legal entities in the organisational boundary
      ownedBy: user
      fields:
      - name: name
        type: text
        required: true
      - name: country
        type: country
      - name: region
        type: text
        required: true
      - name: control_approach
        type: select
        options:
        - operational control
        - financial control
        - equity share
      - name: head_email
        type: email
        required: true
        help: Email of the head of sustainability
      access:
      - role: user
        where:
          head_email: '{user.email}'
        can:
        - read
        - write
    - name: sites
      description: Sites of each entity
      ownedBy: user
      fields:
      - name: name
        type: text
        required: true
      - name: entity
        type: select
        required: true
        optionsFrom: collection:entities
      - name: region
        type: text
        required: true
      - name: address
        type: text
      - name: site_lead_email
        type: email
        required: true
        help: The site lead sees only this site
      - name: head_email
        type: email
        required: true
      access:
      - role: user
        where:
          head_email: '{user.email}'
        can:
        - read
        - write
      - role: site_lead
        where:
          site_lead_email: '{user.email}'
        can:
        - read
    - name: activity_data
      description: Uploaded utility, fleet, travel and procurement data
      ownedBy: user
      fields:
      - name: site
        type: select
        required: true
        optionsFrom: collection:sites
      - name: entity
        type: text
      - name: region
        type: text
      - name: year
        type: number
        required: true
      - name: period
        type: text
        help: e.g. 2025-03
      - name: category
        type: select
        required: true
        options:
        - electricity
        - natural gas
        - other fuels
        - fleet fuel
        - business travel
        - employee commuting
        - procurement
        - waste
        - water
      - name: quantity
        type: number
      - name: unit
        type: text
        help: kWh, litres, km, GBP spend, tonnes
      - name: source_file
        type: file
        accept:
        - pdf
        - xlsx
        - csv
        - jpg
        - png
        maxMb: 15
        multiple: true
      - name: site_lead_email
        type: email
      - name: head_email
        type: email
        required: true
      access:
      - role: user
        where:
          head_email: '{user.email}'
        can:
        - read
        - write
      - role: site_lead
        where:
          site_lead_email: '{user.email}'
        can:
        - read
        - write
    - name: factors
      description: DESNZ conversion factor tables, one row per factor and version
      ownedBy: shared
      searchable: true
      fields:
      - name: category
        type: text
        required: true
      - name: activity
        type: text
        required: true
      - name: unit
        type: text
        required: true
      - name: kgco2e_per_unit
        type: number
        required: true
      - name: scope
        type: select
        options:
        - '1'
        - '2'
        - '3'
      - name: version
        type: text
        required: true
        help: e.g. DESNZ 2025
      - name: table_ref
        type: text
      - name: source_url
        type: url
    - name: emissions
      description: Calculated emissions, each row traceable to its source and factor version
      ownedBy: user
      fields:
      - name: site
        type: text
      - name: entity
        type: text
      - name: region
        type: text
      - name: year
        type: number
      - name: scope
        type: text
      - name: category
        type: text
      - name: quantity
        type: number
      - name: unit
        type: text
      - name: factor_id
        type: text
      - name: factor_version
        type: text
      - name: factor_value
        type: number
      - name: kgco2e
        type: number
      - name: source_record
        type: text
      - name: source_file
        type: text
      - name: site_lead_email
        type: email
      - name: head_email
        type: email
      access:
      - role: user
        where:
          head_email: '{user.email}'
        can:
        - read
        - write
      - role: site_lead
        where:
          site_lead_email: '{user.email}'
        can:
        - read
    - name: targets
      description: Science-based targets
      ownedBy: user
      fields:
      - name: baseline_year
        type: number
        required: true
      - name: baseline_tco2e
        type: number
        required: true
      - name: target_year
        type: number
        required: true
      - name: target_reduction_pct
        type: number
        required: true
      - name: net_zero_year
        type: number
      - name: head_email
        type: email
        required: true
      access:
      - role: user
        where:
          head_email: '{user.email}'
        can:
        - read
        - write
    - name: measures
      description: Reduction measures with owner, budget, due date and status
      ownedBy: user
      fields:
      - name: title
        type: text
        required: true
      - name: site
        type: text
      - name: entity
        type: text
      - name: owner_email
        type: email
        required: true
      - name: budget_gbp
        type: number
      - name: est_reduction_tco2e
        type: number
      - name: milestone_date
        type: date
      - name: due_date
        type: date
        required: true
      - name: status
        type: select
        required: true
        options:
        - proposed
        - approved
        - in_progress
        - done
        - rejected
      - name: site_lead_email
        type: email
      - name: head_email
        type: email
      access:
      - role: user
        where:
          head_email: '{user.email}'
        can:
        - read
        - write
      - role: site_lead
        where:
          site_lead_email: '{user.email}'
        can:
        - read
        - write
    - name: report_archive
      description: Monthly SECR and UK SRS reports
      ownedBy: instance
      fields:
      - name: title
        type: text
      - name: content
        type: textarea
      - name: date
        type: date
  views:
  - key: home
    type: page
    title: Netvia
    nav: false
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow: Carbon accounting
      title: Audit-ready **carbon accounting** and a decarbonisation plan you can approve.
      text: Upload utility, fleet, travel and procurement data. An AI agent maps it to DESNZ conversion factors, calculates
        emissions by entity, site and year, and builds a costed pathway to your science-based targets.
      actions:
      - label: Sign in
        href: /login
        style: primary
      - label: How it works
        href: '#how'
        style: ghost
      note: SECR and UK SRS reports, monthly, by email.
    - type: steps
      id: how
      title: How it works
      items:
      - title: Define your boundary
        text: Entities and sites, each with a site lead who sees only their site.
      - title: Upload your data
        text: Utility bills, fleet, travel and procurement files, with the source kept.
      - title: Calculate
        text: The agent maps each activity to a DESNZ factor and records emissions.
      - title: Plan and approve
        text: Costed measures with owner, budget, due date and status; you approve.
      - title: Report
        text: SECR and UK SRS reports monthly, emailed to you.
    - type: cards
      id: trace
      title: Every figure is traceable
      items:
      - title: Source file
        text: Each emission links back to the uploaded activity record and file.
      - title: Factor version
        text: The exact DESNZ factor and version used is stored with the figure.
        badge: 🔍
      - title: Methodology assistant
        text: Ask how a number was derived and get the factor table cited.
    - type: cards
      id: pricing
      title: Pricing
      intro: Annual subscription by company size.
      items:
      - title: Essential - from £6,000 / year
        text: 'Smaller groups: up to 5 sites.'
      - title: Growth - £14,000 / year
        text: Up to 25 sites, more runs, monthly reports.
      - title: Enterprise - £30,000 / year
        text: Unlimited sites and runs for large groups.
    - type: note
      content: Netvia supports reporting; it is not assurance or legal advice. Factors are the published DESNZ tables.
  - key: new_analysis
    type: new_run
    title: New analysis
    roles:
    - user
    - admin
  - key: analyses
    type: history
    title: My analyses
    source: run
    roles:
    - user
    - admin
  - key: analysis
    type: report
    title: Analysis
    source: run
    printable: true
    nav: false
  - key: progress
    type: page
    title: Progress
    roles:
    - user
    - admin
    - site_lead
    sections:
    - type: data
      title: 'Emissions by year (tCO2e basis: kgCO2e)'
      source: collection:emissions
      display: chart
      chart: bar
      fields:
      - key: year
        label: Year
      - key: total
        label: kgCO2e
      groupBy:
        field: year
        aggs:
        - key: total
          agg: sum
          field: kgco2e
    - type: data
      title: By scope
      source: collection:emissions
      display: chart
      chart: pie
      fields:
      - key: scope
        label: Scope
      - key: total
        label: kgCO2e
      groupBy:
        field: scope
        aggs:
        - key: total
          agg: sum
          field: kgco2e
    - type: data
      title: By entity
      source: collection:emissions
      display: table
      fields:
      - key: entity
        label: Entity
      - key: total
        label: kgCO2e
        format: number
      groupBy:
        field: entity
        aggs:
        - key: total
          agg: sum
          field: kgco2e
    - type: data
      title: By region
      source: collection:emissions
      display: table
      fields:
      - key: region
        label: Region
      - key: total
        label: kgCO2e
        format: number
      groupBy:
        field: region
        aggs:
        - key: total
          agg: sum
          field: kgco2e
    - type: data
      title: Science-based targets
      source: collection:targets
      display: table
      fields:
      - key: baseline_year
        label: Baseline year
      - key: baseline_tco2e
        label: Baseline tCO2e
        format: number
      - key: target_year
        label: Target year
      - key: target_reduction_pct
        label: Reduction %
        format: percent
      - key: net_zero_year
        label: Net zero
    - type: data
      title: Measures
      source: collection:measures
      display: table
      fields:
      - key: title
        label: Measure
      - key: owner_email
        label: Owner
      - key: budget_gbp
        label: Budget
        format: money
      - key: due_date
        label: Due
        format: date
      - key: status
        label: Status
        format: badge
  - key: emissions_table
    type: table
    title: Emissions and audit trail
    source: collection:emissions
    export: true
    roles:
    - user
    - admin
    - site_lead
    data:
      display: table
      fields:
      - key: year
        label: Year
      - key: entity
        label: Entity
      - key: region
        label: Region
      - key: site
        label: Site
      - key: scope
        label: Scope
      - key: category
        label: Category
      - key: kgco2e
        label: kgCO2e
        format: number
      - key: factor_version
        label: Factor version
      - key: factor_id
        label: Factor
      - key: source_record
        label: Source record
      - key: source_file
        label: Source file
      sort:
        field: year
        dir: desc
      limit: 200
  - key: measures
    type: table
    title: Reduction measures
    source: collection:measures
    export: true
    roles:
    - user
    - admin
    - site_lead
    data:
      display: table
      fields:
      - key: title
        label: Measure
      - key: site
        label: Site
      - key: owner_email
        label: Owner
      - key: budget_gbp
        label: Budget
        format: money
      - key: est_reduction_tco2e
        label: tCO2e saved
        format: number
      - key: milestone_date
        label: Milestone
        format: date
      - key: due_date
        label: Due
        format: date
      - key: status
        label: Status
        format: badge
      sort:
        field: due_date
        dir: asc
      limit: 200
  - key: measure_form
    type: form
    title: Add or edit a measure
    collection: measures
    edit: true
    submit:
      label: Save measure
      message: Measure saved.
      redirect: measures
    roles:
    - user
    - admin
    - site_lead
  - key: upload_form
    type: form
    title: Upload activity data
    collection: activity_data
    fields:
    - site
    - year
    - period
    - category
    - quantity
    - unit
    - source_file
    - site_lead_email
    - head_email
    submit:
      label: Save data
      message: Data saved. Run a calculation to turn it into emissions.
    roles:
    - user
    - admin
    - site_lead
  - key: uploads
    type: table
    title: Uploaded data
    source: collection:activity_data
    export: true
    roles:
    - user
    - admin
    - site_lead
    data:
      display: table
      fields:
      - key: year
        label: Year
      - key: site
        label: Site
      - key: category
        label: Category
      - key: period
        label: Period
      - key: quantity
        label: Quantity
        format: number
      - key: unit
        label: Unit
      limit: 200
  - key: entity_form
    type: form
    title: Add entity
    collection: entities
    edit: true
    submit:
      label: Save entity
      message: Entity saved.
    roles:
    - user
    - admin
  - key: site_form
    type: form
    title: Add site
    collection: sites
    edit: true
    submit:
      label: Save site
      message: Site saved.
    roles:
    - user
    - admin
  - key: boundary
    type: table
    title: 'Boundary: entities and sites'
    source: collection:sites
    roles:
    - user
    - admin
    - site_lead
    data:
      display: table
      fields:
      - key: name
        label: Site
      - key: entity
        label: Entity
      - key: region
        label: Region
      - key: site_lead_email
        label: Site lead
      limit: 200
  - key: target_form
    type: form
    title: Set science-based target
    collection: targets
    edit: true
    submit:
      label: Save target
      message: Target saved.
      redirect: progress
    roles:
    - user
    - admin
  - key: factors_table
    type: table
    title: DESNZ factor tables
    source: collection:factors
    roles:
    - user
    - admin
    - site_lead
    data:
      display: table
      fields:
      - key: category
        label: Category
      - key: activity
        label: Activity
      - key: unit
        label: Unit
      - key: kgco2e_per_unit
        label: kgCO2e/unit
        format: number
      - key: version
        label: Version
      limit: 200
  - key: approvals
    type: approvals
    title: Approvals
    approvals:
    - pathway_review
    roles:
    - user
    - admin
  - key: reports
    type: instances
    template: monthly_report
    title: Monthly reports
    roles:
    - user
    - admin
  - key: assistant_chat
    type: chat
    title: Methodology assistant
    source: agent:assistant
    examples:
    - Which factor was used for grid electricity in 2025?
    - How do you treat Scope 2 location-based vs market-based?
    - What does SECR require?
    placeholder: Ask about the methodology
    roles:
    - user
    - admin
    - site_lead
  - key: account
    type: account
    title: Subscription
    roles:
    - user
  billing:
    modes:
    - subscription
    currency: gbp
    plans:
    - key: essential
      price: 6000
      interval: year
      label: Essential
      includes:
      - Up to 5 sites
      - Emissions calculation
      - SECR and UK SRS reports
    - key: growth
      price: 14000
      interval: year
      label: Growth
      includes:
      - Up to 25 sites
      - Higher run allowance
      - Monthly reports
    - key: enterprise
      price: 30000
      interval: year
      label: Enterprise
      includes:
      - Unlimited sites
      - Unlimited runs
      - Priority support
  extensions:
  - key: erp_oauth
    description: ERP connections through OAuth to pull data automatically are not available yet. For now the team uploads
      files; an API-key connection can be added for ERPs that support keys.
  - key: stakeholder_distribution
    description: Monthly reports are emailed to the report owner, who forwards them. A distribution list of stakeholders per
      report is not available yet.
  - key: site_head_link
    description: Site leads enter the head of sustainability's email on their uploads so the head sees the whole group; automatic
      copying from the site record is not available yet.
