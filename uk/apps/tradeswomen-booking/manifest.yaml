  extensions:
  - key: escrow_hold
    description: Card payment is taken through Stripe Connect with a 12% commission. Holding the money until the customer
      marks the job complete, then releasing the payout, is not expressible in the manifest yet; the payments collection tracks
      held/due/released manually via admin.
  - key: accept_quote_button
    description: A one-click Accept quote button on the leads table, linking each row to the respond form, is not available;
      customers and tradeswomen update records through the edit form.
  - key: booking_staff_access
    description: Tradeswomen seeing their own slot bookings needs the booking's resource to be linked to her email; today
      admins see all bookings and tradeswomen see jobs and leads.
  - key: sms_push
    description: SMS, WhatsApp and push alerts to matched tradeswomen are not available; email notifications are used.
