apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: plotwise
  displayName: Plotwise
  tagline:
    en: Find residential sites that fit planning policy, and appraise them in minutes.
  description:
    en: Plotwise helps small developers search land, check green belt, conservation areas, flood zones, brownfield registers
      and Article 4 directions from public planning data, and get a cited one-page appraisal for landowners and lenders.
  langs:
  - en
  defaultLang: en
  timezone: Europe/London
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f3b2d'
      accent: '#c76b1f'
      background: '#f7f6f1'
      foreground: '#1a2420'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Plot
      color: primary
    - text: wise
      color: accent
  header:
    links:
    - label: How it works
      href: '#how'
    - label: Data
      href: '#data'
    - label: Pricing
      href: '#pricing'
    cta:
      label: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: owner
      label: Owner
      assignedBy: signup
    - key: team_member
      label: Team member
      assignedBy: invite
  limits:
  - action: agent:appraiser
    per: user
    max: 30
    window: month
    plans:
      team: 150
  - action: chat
    per: user
    max: 100
    window: day
  egress:
    hosts:
    - www.planning.data.gov.uk
    - api.os.uk
    notes: 'planning.data.gov.uk: Open Government Licence v3.0 (planning datasets incl. green belt, conservation areas, flood
      risk zones, brownfield land, article 4 directions, local plans, planning applications). api.os.uk: OS Data Hub; OS OpenData
      products are free under OGL, OS MasterMap (NGD) is used only when the app owner has added a licensed key.'
  agents:
  - key: appraiser
    role: main
    description: Checks policy, planning history and constraints for a saved site, estimates capacity and writes a cited one-page
      appraisal.
    profile:
      inline:
        display_name: Plotwise appraiser
        crews:
        - id: appraiser
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You are a planning-aware site appraisal analyst for small UK residential developers. You appraise
            ONE site using public data only.


            Process:

            1. Call planning_data several times with the site point (query like dataset=green-belt&geometry=POINT(lon lat)&geometry_relation=intersects&limit=10;
            repeat for datasets conservation-area, flood-risk-zone, brownfield-land, article-4-direction-area, listed-building-outline,
            tree-preservation-zone, local-plan, planning-application with a buffer or the local authority). Use the exact
            entity fields returned.

            2. Use the webrobot MCP only to read the council''s public local plan or policy pages when needed. Never use paid
            or licensed data except through the os_mastermap tool, and only if it returns data (if it says the key is not
            connected, state that MasterMap was not used).

            3. Estimate capacity with explicit assumptions: net developable ratio, density range in dwellings per hectare
            appropriate to the setting, and a low / central / high number of homes. Show the arithmetic.

            4. Planning history: list relevant past applications and decisions from public data only, with reference and outcome.


            Output: a Markdown report starting with a level-1 title "# Site appraisal — <site name>". Sections with ## headings:
            Summary (3 lines, RAG verdict), Policy fit, Likely number of homes, Access, Constraints and risks, Planning history,
            Next steps. Cite every policy or designation inline as [dataset / entity reference or policy number] with its
            source URL. If a policy number or text was not retrieved, do not invent it: write ''to verify with the council''.
            Never invent figures. Keep it to about one page (under 450 words) so it prints as a one-page PDF. End with a note:
            ''Decision support, not planning or legal advice. Data: planning.data.gov.uk, OS OpenData (OGL v3).'''
    goalTemplate: 'Appraise this site.

      Name: {site_name}

      {?site_address}Address: {site_address}{/site_address}

      Location (lat,lng): {site_location}

      Local authority: {site_authority}

      Area (ha): {site_area}

      {?site_notes}User notes: {site_notes}{/site_notes}

      {?focus}Focus on: {focus}{/focus}

      Today is {date}. Write the report in the language with ISO code {lang}.'
    context:
    - key: site_name
      from: collection:sites.name
    - key: site_address
      from: collection:sites.address
    - key: site_location
      from: collection:sites.location
    - key: site_authority
      from: collection:sites.local_authority
    - key: site_area
      from: collection:sites.area_ha
    - key: site_notes
      from: collection:sites.notes
    appTools:
    - name: planning_data
      description: 'Query planning.data.gov.uk entities (datasets: green-belt, conservation-area, flood-risk-zone, brownfield-land,
        article-4-direction-area, local-plan, planning-application, listed-building-outline...). Fill query, e.g. dataset=green-belt&geometry=POINT(-1.5
        52.4)&geometry_relation=intersects&limit=10'
      action: http
      http:
        method: GET
        url: https://www.planning.data.gov.uk/entity.json
        attribution: planning.data.gov.uk, Open Government Licence v3.0
    - name: os_mastermap
      description: OS MasterMap (OS NGD) features, only available when the app owner has a licensed key. Append the collection
        path and query.
      action: http
      http:
        method: GET
        url: https://api.os.uk/features/ngd/ofa/v1/collections
        allowPath: true
        attribution: Contains OS data © Crown copyright, licensed OS MasterMap
        credential:
          provider: os_mastermap
          query: key
    output: markdown
    limits:
      maxTurns: 30
      maxBudgetUsd: 1.5
  - key: finder
    role: helper
    description: Chat assistant that searches land by area, size and constraints and saves candidate sites.
    profile:
      inline:
        display_name: Plotwise site finder
        chat_mode: true
        crews:
        - id: finder
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 20
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are Plotwise''s site-finding assistant for small UK residential developers. The user describes
            an area, a size range and constraints to include or avoid (green belt, conservation areas, flood zones, brownfield
            land register, Article 4 directions, allocations). Search with planning_data (planning.data.gov.uk: e.g. dataset=brownfield-land&geometry_relation=intersects&geometry=POLYGON/POINT...,
            or organisation/local authority filters) and os_opendata (OS Names/Places to geocode an area name). Use os_mastermap
            only if it works; if it says the key is not connected, say MasterMap needs a licence and carry on with open data.
            For each good candidate, check the constraint datasets at its point, then call save_candidate with name, address,
            local_authority, lat, lon, location as ''lat,lng'', area_ha, constraints, source and source_ref and status ''candidate''.
            Reply with a short table of what you found (name, ha, constraints, source link) and tell the user the sites appear
            on the Map and Sites pages, where they can save, annotate and share them, and ask for an appraisal. Never invent
            sites, sizes or designations: report only what the data returned and say when a search returned nothing. Use list_sites
            to avoid duplicating saved sites.'
    goalTemplate: 'Conversation so far:

      {history}


      New message from {user}: {message}

      Today is {date}.'
    appTools:
    - name: planning_data
      description: 'Query planning.data.gov.uk entities (datasets: green-belt, conservation-area, flood-risk-zone, brownfield-land,
        article-4-direction-area, local-plan, planning-application, listed-building-outline...). Fill query, e.g. dataset=green-belt&geometry=POINT(-1.5
        52.4)&geometry_relation=intersects&limit=10'
      action: http
      http:
        method: GET
        url: https://www.planning.data.gov.uk/entity.json
        attribution: planning.data.gov.uk, Open Government Licence v3.0
    - name: os_opendata
      description: 'OS Names (OS OpenData) place and address search to geocode an area name: query=<place text>'
      action: http
      http:
        method: GET
        url: https://api.os.uk/search/names/v1/find
        attribution: Contains OS data © Crown copyright, OS OpenData OGL v3
        credential:
          provider: os_data_hub
          query: key
    - name: os_mastermap
      description: OS MasterMap (OS NGD) features, only available when the app owner has a licensed key. Append the collection
        path and query.
      action: http
      http:
        method: GET
        url: https://api.os.uk/features/ngd/ofa/v1/collections
        allowPath: true
        attribution: Contains OS data © Crown copyright, licensed OS MasterMap
        credential:
          provider: os_mastermap
          query: key
    - name: save_candidate
      description: Save a candidate site for the user
      action: append
      collection: sites
      scope: user
    - name: list_sites
      description: List the user's saved sites
      action: read
      collection: sites
      scope: user
    output: markdown
  - key: watcher
    role: scheduled
    description: Watches one search area for newly published brownfield or allocated sites.
    memory: instance
    writesTo:
      collection: area_alerts
      parse: markdown_sections
    profile:
      inline:
        display_name: Plotwise area watcher
        crews:
        - id: watcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You watch one search area for one developer. Query planning_data (brownfield-land, and local-plan
            / site allocation datasets as available) for the local authority given and list entries NOT mentioned in your
            memory. Start with "# New sites — <area> — <date>". Sections: ## New sites (name, reference, hectares, minimum/maximum
            dwellings if given, link), ## Why it matters (one line each). If nothing is new write exactly ''No new sites.''
            under the title. Never invent entries. At the end call remember once with the reference list of all sites seen
            so far (they replace the old ones).'
    appTools:
    - name: planning_data
      description: 'Query planning.data.gov.uk entities (datasets: green-belt, conservation-area, flood-risk-zone, brownfield-land,
        article-4-direction-area, local-plan, planning-application, listed-building-outline...). Fill query, e.g. dataset=green-belt&geometry=POINT(-1.5
        52.4)&geometry_relation=intersects&limit=10'
      action: http
      http:
        method: GET
        url: https://www.planning.data.gov.uk/entity.json
        attribution: planning.data.gov.uk, Open Government Licence v3.0
    output: markdown
  templates:
  - key: area_watch
    title: Area alert
    description: Get an email when new brownfield or allocated sites appear in a local authority area.
    agent: watcher
    params:
    - name: authority
      type: text
      required: true
      label: Local authority
      help: e.g. Stroud District
    - name: kind
      type: select
      required: true
      label: Watch for
      options:
      - value: brownfield
        label: Brownfield register sites
      - value: allocated
        label: Local plan allocations
      - value: both
        label: Both
    - name: min_ha
      type: number
      label: Minimum size (ha)
    goal: 'Watch "{instance}": local authority {authority}, looking for {kind_label}.{?min_ha} Only sites of at least {min_ha}
      ha.{/min_ha} Today is {date}.'
    schedule:
      cron: 0 6 * * 1-5
      userCanChange: true
    maxPerUser: 5
    deliver:
      to: owner
      onlyIfNew: true
      subject: 'Plotwise: new sites in your area — {date}'
  inputForm:
    title: New site appraisal
    fields:
    - name: site
      type: select
      required: true
      label: Saved site
      optionsFrom: collection:sites
    - name: focus
      type: textarea
      maxLength: 400
      label: Anything to focus on (optional)
      help: e.g. access from the north, 20% affordable
  data:
    collections:
    - name: sites
      ownedBy: user
      description: Candidate and saved sites, shared with the team through the members list
      fields:
      - name: name
        type: text
        required: true
        label: Site name
      - name: address
        type: text
        label: Address
      - name: local_authority
        type: text
        label: Local authority
      - name: location
        type: location
        label: Position
      - name: lat
        type: number
        label: Latitude
      - name: lon
        type: number
        label: Longitude
      - name: area_ha
        type: number
        label: Area (ha)
      - name: constraints
        type: multiselect
        label: Constraints
        options:
        - green_belt
        - conservation_area
        - flood_zone_2
        - flood_zone_3
        - brownfield
        - article_4
        - allocated
        - listed_building
        - none_found
      - name: source
        type: select
        label: Source
        options:
        - planning_data
        - os_opendata
        - os_mastermap
        - manual
      - name: source_ref
        type: text
        label: Source reference
      - name: status
        type: select
        label: Status
        default: candidate
        options:
        - candidate
        - shortlisted
        - appraising
        - rejected
        - acquired
      - name: notes
        type: textarea
        label: Notes
      - name: members
        type: array
        label: Shared with (team emails)
        help: Emails of team members who can see and edit this site
      access:
      - role: owner
        where:
          members: '{user.email}'
        can:
        - read
        - write
      - role: team_member
        where:
          members: '{user.email}'
        can:
        - read
        - write
      retentionDays: 1825
    - name: area_alerts
      ownedBy: instance
      description: Results of each area watch run
      fields:
      - name: title
        type: text
      - name: body
        type: textarea
    credentials:
    - provider: os_data_hub
      kind: api_key
      scope: org
      required: false
      label: OS Data Hub key (OpenData)
      help: Free key from the OS Data Hub project; used for OS OpenData products.
    - provider: os_mastermap
      kind: api_key
      scope: org
      required: false
      label: OS MasterMap licensed key
      help: Only add this if you hold an OS MasterMap licence; without it MasterMap is never used.
  views:
  - key: home
    type: page
    title: Plotwise
    nav: false
    sections:
    - type: hero
      layout: stack
      band: true
      eyebrow: For small developers
      title: Find **residential sites** that fit planning policy.
      text: Search land by size and constraint, check green belt, conservation areas, flood zones, brownfield registers and
        Article 4 directions, and get a cited one-page appraisal you can send to landowners and lenders.
      actions:
      - label: Start finding sites
        href: /login
        style: primary
      - label: How it works
        href: '#how'
        style: ghost
    - type: steps
      id: how
      title: How it works
      items:
      - title: Search
        text: Describe an area, size and constraints. The assistant searches public planning data and puts candidates on your
          map.
        badge: 🗺️
      - title: Save and share
        text: Keep notes, set a status and share sites with your team.
        badge: 📌
      - title: Appraise
        text: An agent checks policy and planning history, estimates homes and drafts a cited appraisal.
        badge: 📄
      - title: Get alerts
        text: Email when new brownfield or allocated sites appear in your areas.
        badge: 🔔
    - type: cards
      id: data
      title: Data
      items:
      - title: planning.data.gov.uk
        text: Green belt, conservation areas, flood risk zones, brownfield land registers, Article 4 directions, local plans
          and planning applications (OGL v3).
      - title: OS OpenData
        text: Place search and open mapping data from Ordnance Survey (OGL v3).
      - title: OS MasterMap
        text: Used only where a licence is held. Never required.
    - type: cards
      id: pricing
      title: Pricing
      items:
      - title: Solo — £49 / month
        text: One user. Search, save, appraise, alerts and PDF export.
      - title: Team — £149 / month
        text: Team sharing, a higher appraisal allowance and everything in Solo.
        badge: Teams
    - type: note
      content: Decision support, not planning, legal or financial advice. Planning history comes from public data only. Contains
        public sector information licensed under the Open Government Licence v3.0; contains OS data © Crown copyright.
  - key: finder
    type: chat
    title: Find sites
    source: agent:finder
    placeholder: e.g. Brownfield sites of 0.5–3 ha near Stroud, not in green belt or flood zone 3
    examples:
    - Brownfield register sites of 0.5–3 ha in Stroud, outside flood zone 3
    - Sites in Warwick District outside green belt and conservation areas
    - Allocated housing sites over 1 ha in South Cambridgeshire
    roles:
    - owner
    - team_member
    - admin
  - key: map
    type: map
    title: Map
    source: collection:sites
    map:
      lat: lat
      lon: lon
      title: name
      popup:
      - status
      - area_ha
      - local_authority
      - constraints
    roles:
    - owner
    - team_member
    - admin
  - key: sites
    type: table
    title: Saved sites
    source: collection:sites
    export: true
    data:
      display: table
      fields:
      - key: name
        label: Site
      - key: local_authority
        label: Authority
      - key: area_ha
        label: Ha
        format: number
      - key: constraints
        label: Constraints
      - key: status
        label: Status
        format: badge
      - key: notes
        label: Notes
      sort:
        field: name
        dir: asc
      limit: 200
      actions:
      - type: directions
        label: Directions
        field: location
      - type: share
        label: Share
        field: name
      empty: No sites yet. Ask the finder or add one.
    roles:
    - owner
    - team_member
    - admin
  - key: site_form
    type: form
    title: Add or edit a site
    collection: sites
    edit: true
    submit:
      label: Save site
      message: Site saved.
      redirect: sites
    roles:
    - owner
    - team_member
    - admin
  - key: new_appraisal
    type: new_run
    title: New appraisal
    roles:
    - owner
    - team_member
    - admin
  - key: appraisals
    type: history
    title: Appraisals
    source: run
    roles:
    - owner
    - team_member
    - admin
  - key: appraisal
    type: report
    title: Appraisal
    source: run
    printable: true
    nav: false
  - key: watches
    type: instances
    title: Area alerts
    template: area_watch
    roles:
    - owner
    - team_member
    - admin
  - key: alerts
    type: table
    title: Alert history
    source: collection:area_alerts
    roles:
    - owner
    - team_member
    - admin
  - key: account
    type: account
    title: Subscription
    roles:
    - owner
    - admin
  billing:
    modes:
    - subscription
    currency: gbp
    plans:
    - key: solo
      price: 49
      interval: month
      label: Solo
      includes:
      - 1 user
      - site search, map and saved sites
      - 30 appraisals a month
      - area alerts
      - one-page PDF export
      roles:
      - owner
    - key: team
      price: 149
      interval: month
      label: Team
      includes:
      - team sharing of saved sites
      - 150 appraisals a month
      - area alerts
      - one-page PDF export
      roles:
      - owner
  notifications:
    emailOnRunDone: true
  extensions:
  - key: pdf_export
    description: The one-page PDF is produced with the report view's print / save as PDF; there is no separate branded PDF
      generator yet.
  - key: team_seats
    description: Team seat limits (how many members per Team plan) are not enforced by the runtime; sharing is by the members
      email list on each site.
  - key: parcel_boundaries
    description: The map shows site points; true parcel polygons (INSPIRE index polygons, OS MasterMap) are not drawn yet.
