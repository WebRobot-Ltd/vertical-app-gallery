apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: minutory
  displayName: Minutory
  tagline:
    en: Meeting notes, file notes and follow-ups written for you. You approve every change.
  description:
    en: Minutory turns adviser-client meetings into a summary, a file note in your firm's template, a client follow-up email,
      proposed CRM updates and suitability report sections (FCA COBS 9). The adviser reviews everything before it is used.
  langs:
  - en
  defaultLang: en
  timezone: Europe/London
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12304a'
      accent: '#1f8a70'
      background: '#f6f8fa'
      foreground: '#16222e'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Minu
      color: primary
    - text: tory
      color: accent
  header:
    links:
    - label: How it works
      href: '#how'
    - label: Roles
      href: '#roles'
    cta:
      label: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Firm admin
      assignedBy: admin_emails
    - key: adviser
      label: Adviser
      assignedBy: signup
    - key: paraplanner
      label: Paraplanner
      assignedBy: invite
    - key: compliance
      label: Compliance
      assignedBy: invite
  limits:
  - action: agent:scribe
    per: user
    max: 30
    window: day
    roles:
    - adviser
  agents:
  - key: scribe
    role: main
    description: Turns a meeting transcript into the summary, file note, follow-up email, proposed CRM updates and suitability
      sections.
    memory: none
    profile:
      inline:
        display_name: Minutory scribe
        crews:
        - id: scribe
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 14
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are a documentation assistant for UK financial advice firms. You work from the transcript or
            notes of ONE adviser-client meeting. Never invent facts, figures, dates or advice that are not in the material;
            mark gaps as ''Not discussed'' or ''To confirm''. You do not give advice yourself.


            Write the report in Markdown, starting with a level-1 title ''# <Client name> — <meeting type> meeting — <date>''.
            Sections with ## headings: Meeting summary; Changes to circumstances; Goals; Risk profile (attitude to risk and
            capacity for loss, with any change); File note (follow the firm''s file note template given in the goal; if none,
            use: purpose, discussion, advice or recommendations, client decisions, next steps); Follow-up email to the client
            (plain, friendly, no jargon, ready to send, with the action list); Action list (who, what, by when); Documents
            still needed; Proposed CRM and platform updates (a table: system, field, current value, proposed value, source
            quote); Suitability report sections.


            Suitability sections are drafts for the paraplanner, structured to meet FCA COBS 9: client''s objectives, financial
            situation, knowledge and experience, attitude to risk and capacity for loss, the recommendation and why it is
            suitable, alternatives considered, charges and costs, risks and disadvantages. Use only what the meeting supports
            and list the information still missing under ''Gaps to close before the report can be issued''.


            Call the tool append_crm_update once per proposed CRM or platform change (status pending) and append_document_request
            once per document still needed (status requested, with a due date at most 14 days away). Then call request_crm_review:
            the adviser must approve before anything is written to any system. You never write to a CRM yourself; changes
            are only prepared.


            End your answer with a fenced ```json block with keys: client_name, client_email (from the context, empty if unknown),
            meeting_type, meeting_date (YYYY-MM-DD), summary (max 120 words), followup_email (full text), action_list (text),
            file_note (full text), suitability_draft (text), minutes_saved (integer: honest estimate of admin minutes saved
            versus writing this by hand), status (always "draft").'
          mcp_servers: []
    goalTemplate: 'Client: {client}. Client name: {client_name}. Client email: {?client_email}{client_email}{/client_email}.
      Meeting type: {meeting_type_label}. Date: {date}.

      Known risk profile: {?risk_profile}{risk_profile}{/risk_profile}{!risk_profile}none recorded{/risk_profile}.

      Firm file note template:

      {?file_note_template}{file_note_template}{/file_note_template}{!file_note_template}(use the default structure){/file_note_template}

      {?adviser_notes}Adviser notes: {adviser_notes}{/adviser_notes}

      {?transcript_text}Transcript from file:

      {transcript_text}{/transcript_text}

      {?pasted_transcript}Pasted transcript:

      {pasted_transcript}{/pasted_transcript}

      Write the report in the language with ISO code {lang}.'
    context:
    - key: client_name
      from: collection:clients.name
    - key: client_email
      from: collection:clients.email
    - key: risk_profile
      from: collection:clients.risk_profile
    - key: file_note_template
      from: collection:firm_settings.file_note_template
    appTools:
    - name: append_crm_update
      description: Record one proposed CRM or investment platform update for the adviser to review
      action: append
      collection: crm_updates
      scope: user
    - name: append_document_request
      description: Record one document the client still has to provide
      action: append
      collection: document_requests
      scope: user
    awaits:
    - crm_review
    output: markdown+json
    resultSchema:
      type: object
      properties:
        client_name:
          type: string
        client_email:
          type: string
        meeting_type:
          type: string
        meeting_date:
          type: string
        summary:
          type: string
        followup_email:
          type: string
        action_list:
          type: string
        file_note:
          type: string
        suitability_draft:
          type: string
        minutes_saved:
          type: integer
        status:
          type: string
    writesTo:
      collection: meeting_notes
      parse: json_last
    limits:
      maxTurns: 14
      maxBudgetUsd: 0.8
      timeoutSeconds: 600
  inputForm:
    title: New meeting
    fields:
    - name: client
      type: select
      required: true
      label: Client
      optionsFrom: collection:clients
    - name: meeting_type
      type: select
      required: true
      label: Meeting type
      options:
      - value: initial
        label: Initial
      - value: review
        label: Review
      - value: pension
        label: Pension
      - value: protection
        label: Protection
    - name: transcript
      type: file
      label: Transcript or call notes (from your video call tool)
      accept:
      - txt
      - docx
      - pdf
      - md
      maxMb: 15
      multiple: false
    - name: pasted_transcript
      type: textarea
      label: Or paste the transcript
      maxLength: 20000
    - name: adviser_notes
      type: textarea
      label: Your own notes (optional)
      maxLength: 2000
  data:
    collections:
    - name: clients
      ownedBy: user
      description: The adviser's clients
      searchable: true
      fields:
      - name: name
        type: text
        required: true
        label: Name
      - name: email
        type: email
        label: Email
      - name: phone
        type: text
        label: Phone
      - name: crm_id
        type: text
        label: CRM client ID
      - name: risk_profile
        type: text
        label: Risk profile
      - name: goals
        type: textarea
        label: Goals
      access:
      - role: paraplanner
        can:
        - read
      - role: compliance
        can:
        - read
    - name: meeting_notes
      ownedBy: user
      description: Documentation produced from each meeting
      searchable: true
      fields:
      - name: client_name
        type: text
        label: Client
      - name: client_email
        type: email
        label: Client email
      - name: meeting_type
        type: text
        label: Type
      - name: meeting_date
        type: date
        label: Date
      - name: summary
        type: textarea
        label: Summary
      - name: followup_email
        type: textarea
        label: Follow-up email
      - name: action_list
        type: textarea
        label: Action list
      - name: file_note
        type: textarea
        label: File note
      - name: suitability_draft
        type: textarea
        label: Suitability draft (COBS 9)
      - name: minutes_saved
        type: number
        label: Minutes saved
      - name: status
        type: select
        label: Status
        options:
        - draft
        - approved
      - name: compliance_review
        type: select
        label: Compliance sample
        options:
        - not_sampled
        - ok
        - issue
      access:
      - role: paraplanner
        can:
        - read
        - write
      - role: compliance
        can:
        - read
        - write
      retentionDays: 2555
    - name: crm_updates
      ownedBy: user
      description: Proposed changes to the CRM and investment platform, waiting for the adviser
      fields:
      - name: client_name
        type: text
        label: Client
      - name: system
        type: text
        label: System
      - name: field
        type: text
        label: Field
      - name: current_value
        type: text
        label: Current
      - name: proposed_value
        type: text
        label: Proposed
      - name: source_quote
        type: textarea
        label: Source in the meeting
      - name: status
        type: select
        label: Status
        options:
        - pending
        - approved
        - rejected
        - applied
      access:
      - role: paraplanner
        can:
        - read
        - write
      - role: compliance
        can:
        - read
    - name: document_requests
      ownedBy: user
      description: Documents the client still has to provide
      fields:
      - name: client_name
        type: text
        label: Client
      - name: client_email
        type: email
        label: Client email
      - name: document
        type: text
        label: Document
      - name: due_date
        type: date
        label: Due
      - name: status
        type: select
        label: Status
        options:
        - requested
        - received
      access:
      - role: paraplanner
        can:
        - read
        - write
    - name: firm_settings
      ownedBy: shared
      description: The firm's file note template, kept by the admins
      fields:
      - name: file_note_template
        type: textarea
        label: File note template
    credentials: []
  views:
  - key: home
    type: page
    title: Minutory
    nav: false
    sections:
    - type: hero
      layout: stack
      band: true
      eyebrow: For regulated advice firms
      title: Meetings in, **documentation** out.
      text: Minutory turns each adviser-client meeting into a summary, a file note in your template, a follow-up email, proposed
        CRM updates and suitability report sections. You approve every change.
      actions:
      - label: Sign in
        href: /login
        style: primary
    - type: steps
      id: how
      title: How it works
      items:
      - title: Pick the client and meeting type
        text: Add the call transcript or paste it.
      - title: The agent writes it up
        text: Summary, changes to circumstances, goals and risk profile, file note, follow-up email.
      - title: You review
        text: Proposed CRM and platform updates are approved by you before anything is written.
      - title: The client is followed up
        text: The approved email goes out with an action list and reminders for missing documents.
    - type: cards
      id: roles
      title: Roles
      items:
      - title: Adviser
        text: Runs meetings, approves notes and updates.
      - title: Paraplanner
        text: Completes suitability reports from the drafts.
      - title: Compliance
        text: Searches all notes and samples files.
      - title: Admin
        text: Seats, template and hours saved.
    - type: note
      content: Minutory drafts documentation. Advisers remain responsible for advice and for checking every output.
  - key: new_meeting
    type: new_run
    title: New meeting
    roles:
    - adviser
    - admin
  - key: meetings
    type: history
    title: My meetings
    source: run
    roles:
    - adviser
    - admin
  - key: meeting
    type: report
    title: Meeting report
    source: run
    printable: true
    nav: false
  - key: client_form
    type: form
    title: Add client
    collection: clients
    edit: true
    submit:
      label: Save client
      message: Client saved
      redirect: clients
    roles:
    - adviser
    - admin
    nav: false
  - key: clients
    type: table
    title: Clients
    source: collection:clients
    columns:
    - name
    - email
    - risk_profile
    - crm_id
    roles:
    - adviser
    - paraplanner
    - compliance
    - admin
  - key: review_note
    type: form
    title: Review and approve note
    collection: meeting_notes
    fields:
    - followup_email
    - action_list
    - file_note
    - suitability_draft
    - status
    edit: true
    submit:
      label: Save
      message: Saved. If approved, the client receives the follow-up email.
    roles:
    - adviser
    - paraplanner
    - admin
    nav: false
  - key: notes
    type: table
    title: Notes
    source: collection:meeting_notes
    columns:
    - meeting_date
    - client_name
    - meeting_type
    - status
    - summary
    roles:
    - adviser
    - paraplanner
    - admin
  - key: crm_review
    type: table
    title: CRM updates
    source: collection:crm_updates
    columns:
    - client_name
    - system
    - field
    - current_value
    - proposed_value
    - status
    roles:
    - adviser
    - paraplanner
    - admin
  - key: crm_edit
    type: form
    title: Edit CRM update
    collection: crm_updates
    edit: true
    submit:
      label: Save
      message: Saved
    roles:
    - adviser
    - paraplanner
    - admin
    nav: false
  - key: decisions
    type: approvals
    title: Approvals
    approvals:
    - crm_review
    roles:
    - adviser
    - admin
  - key: documents
    type: table
    title: Documents needed
    source: collection:document_requests
    columns:
    - client_name
    - document
    - due_date
    - status
    roles:
    - adviser
    - paraplanner
    - admin
  - key: compliance
    type: table
    title: Compliance search
    source: collection:meeting_notes
    columns:
    - meeting_date
    - client_name
    - meeting_type
    - summary
    - file_note
    - compliance_review
    export: true
    roles:
    - compliance
    - admin
  - key: dashboard
    type: page
    title: Hours saved
    roles:
    - admin
    - compliance
    sections:
    - type: data
      title: Admin time saved
      source: collection:meeting_notes
      display: kpi
      kpis:
      - label: Meetings documented
        agg: count
      - label: Minutes saved
        agg: sum
        field: minutes_saved
        format: number
    - type: data
      title: Minutes saved per month
      source: collection:meeting_notes
      display: chart
      chart: bar
      groupBy:
        field: meeting_date
        bucket: month
        aggs:
        - key: minutes
          agg: sum
          field: minutes_saved
      fields:
      - key: meeting_date
        label: Month
      - key: minutes
        label: Minutes saved
  - key: settings
    type: form
    title: File note template
    collection: firm_settings
    edit: true
    submit:
      label: Save
      message: Template saved
    roles:
    - admin
  - key: account
    type: account
    title: Seats and plan
    roles:
    - adviser
    - admin
  approvals:
  - key: crm_review
    title: Approve updates to the CRM and platform
    decidedBy: requester
    fields:
    - client_name
    - system
    - field
    - proposed_value
  triggers:
  - key: send_followup
    description: Send the approved follow-up email to the client
    'on':
      collection: meeting_notes
      op: update
      where:
        status: approved
    notify:
      to:
      - record.client_email
      subject: Following our meeting
      body: '{record.followup_email}


        Actions:

        {record.action_list}'
      link: documents
  - key: doc_reminder
    description: Remind clients of documents still needed
    'on':
      date:
        collection: document_requests
        field: due_date
        offsetDays: -2
        hour: 8
      where:
        status: requested
    notify:
      to:
      - record.client_email
      subject: 'Reminder: document needed'
      body: 'Hello, a reminder that we still need: {record.document}. Please send it by {record.due_date}.'
  notifications:
    emailOnRunDone: true
  billing:
    modes:
    - subscription
    currency: gbp
    plans:
    - key: adviser_seat
      price: 79
      interval: month
      label: Adviser seat
      includes:
      - Unlimited meeting documentation for one adviser
      - Paraplanner and compliance access
      roles:
      - adviser
      - admin
  extensions:
  - key: audio_recording
    description: 'Not available yet: recording audio in the browser or phone and transcribing it. For now the adviser adds
      the transcript exported from the video call tool (txt, docx, pdf) or pastes it.'
  - key: crm_oauth
    description: 'Not available yet: OAuth connection to Intelliflo or another CRM and the investment platform. Updates are
      prepared and approved in the app; write-back needs the connection.'
  - key: seat_billing
    description: 'Per-adviser seat billing across a firm: the plan is sold per adviser account; firm-level invoicing and seat
      counting are not expressed in the manifest.'
  - key: client_actions_by_sms
    description: SMS and WhatsApp reminders are not available; clients get email only.
