apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: suitwell
  displayName: Suitwell
  tagline: Meeting notes and suitability reports for advice firms, drafted by AI and approved by people.
  description: Suitwell turns client meeting transcripts, fact-finds and policy documents into structured meeting notes and
    COBS 9 / Consumer Duty suitability reports. The paraplanner edits, the adviser approves, compliance samples the files,
    and nothing reaches a client without approval.
  langs:
  - en
  defaultLang: en
  timezone: Europe/London
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12304a'
      accent: '#1f8a82'
      background: '#f6f8fa'
      foreground: '#16222e'
    fonts:
      body: Inter
      display: Source Serif 4
    wordmark:
    - text: Suit
      color: primary
    - text: well
      color: accent
    width: wide
  header:
    links:
    - label: How it works
      href: '#how'
    - label: Controls
      href: '#controls'
    cta:
      label: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Firm admin
      assignedBy: admin_emails
    - key: adviser
      label: Adviser
      assignedBy: invite
    - key: paraplanner
      label: Paraplanner
      assignedBy: invite
    - key: compliance
      label: Compliance
      assignedBy: invite
    - key: client
      label: Client
      assignedBy: derived
      from: collection:cases.client_email
  limits:
  - action: agent:report_drafter
    per: user
    max: 20
    window: day
  - action: chat
    per: user
    max: 30
    window: day
    roles:
    - client
  agents:
  - key: notes_writer
    role: main
    when: mode == 'notes'
    description: Turns a meeting transcript into structured meeting notes.
    writesTo:
      collection: meeting_notes
      parse: json_last
    output: markdown+json
    resultSchema:
      type: object
      properties:
        client_name:
          type: string
        client_email:
          type: string
        meeting_date:
          type: string
        objectives:
          type: string
        attitude_to_risk:
          type: string
        capacity_for_loss:
          type: string
        existing_arrangements:
          type: string
        actions:
          type: string
        summary:
          type: string
    appTools:
    - name: read_upload
      description: Read a file the user uploaded (scans and photos included)
      action: read_file
    goalTemplate: 'Write structured meeting notes.

      Client: {client_name} ({client_email}). Meeting date: {meeting_date}.

      {?notes}Adviser''s remarks: {notes}{/notes}

      Transcript file: {transcript}

      Transcript text:

      {transcript_text}

      {?documents}Supporting documents: {documents}

      {documents_text}{/documents}

      Write in English.'
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.6
    profile:
      inline:
        display_name: Suitwell notes writer
        crews:
        - id: notes_writer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are a note-taker for a UK financial advice firm. From the transcript and documents you write
            structured meeting notes. Start with a level-1 title "# Meeting notes — <client> — <date>". Sections (## headings):
            Objectives, Attitude to risk, Capacity for loss, Existing arrangements, Actions (who, what, by when), Open questions.
            Record only what is in the sources. Where something was not discussed write "Not discussed" and list it under
            Open questions; never invent figures, products or opinions. If a file is a scan or image, call read_upload with
            its file id. After the notes, end with ONE fenced json block with the keys client_name, client_email, meeting_date,
            objectives, attitude_to_risk, capacity_for_loss, existing_arrangements, actions, summary (plain-text values).'
  - key: report_drafter
    role: main
    when: mode == 'report'
    description: Drafts the COBS 9 / Consumer Duty suitability report (and pension transfer analysis when relevant) as a draft
      for the paraplanner.
    writesTo:
      collection: cases
      parse: json_last
    output: markdown+json
    resultSchema:
      type: object
      properties:
        client_name:
          type: string
        client_email:
          type: string
        title:
          type: string
        body:
          type: string
        stage:
          type: string
        review_date:
          type: string
        hours_saved:
          type: number
        case_type:
          type: string
    awaits:
    - paraplanner_review
    - adviser_signoff
    appTools:
    - name: read_meeting_notes
      description: Read the saved meeting notes for the client
      action: read
      collection: meeting_notes
      scope: user
    - name: read_client
      description: Read the client's onboarding record and risk questionnaire
      action: read
      collection: clients
      scope: user
    - name: read_upload
      description: Read a file the user uploaded (scans and photos included)
      action: read_file
    goalTemplate: 'Draft a suitability report.

      Client: {client_name} ({client_email}). Case type: {case_type_label}. Date: {date}.

      {?notes}Adviser''s instructions: {notes}{/notes}

      First read the client''s meeting notes (read_meeting_notes) and onboarding record (read_client). Documents uploaded:
      {documents}

      {?documents_text}Document text:

      {documents_text}{/documents_text}

      Write in English.'
    limits:
      maxTurns: 25
      maxBudgetUsd: 1.5
    profile:
      inline:
        display_name: Suitwell report drafter
        crews:
        - id: report_drafter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You draft suitability reports for UK financial advisers, to be edited by a paraplanner and approved
            by the adviser. You never send anything to the client. Use only facts from the meeting notes, onboarding record
            and uploaded documents (call read_upload with a file id for scans). Never invent figures, product features, charges
            or fund names: where information is missing, write "[TO CONFIRM: …]" so the paraplanner can fill it. Start with
            a level-1 title "# Suitability report — <client>". Follow FCA COBS 9 and 9A: ## Summary of your needs and objectives,
            ## Your circumstances (income, expenditure, existing arrangements), ## Attitude to risk, ## Capacity for loss,
            ## Knowledge and experience, ## Our recommendation, ## Why it is suitable for you (link every element of the recommendation
            to a stated objective, the ATR and the capacity for loss), ## Alternatives considered, ## Charges and costs, ##
            Risks and disadvantages, ## Consumer Duty: how this meets your needs (products and services, price and value,
            consumer understanding, consumer support — written in plain English a layperson can follow), ## Ongoing service
            and annual review, ## Next steps. If the case type is a pension transfer, add ## Pension transfer analysis: the
            starting assumption is that a transfer from a defined benefit scheme is NOT suitable unless the evidence clearly
            shows otherwise (COBS 19.1); cover the benefits given up, the critical yield and transfer value comparison as
            given in the documents, the client''s objectives beyond the headline, income needs, death benefits, flexibility,
            and the risks; flag that a pension transfer specialist must check it and that it needs compliance review. Add
            a short ## Reviewer checklist for the paraplanner listing every [TO CONFIRM] item. Say plainly that this is a
            draft for human review. When the draft is ready, call request_paraplanner_review, and once it is approved call
            request_adviser_signoff; never mark anything final yourself. End with ONE fenced json block: client_name, client_email,
            title ("Suitability report — <client> — <date>"), body (the full report in Markdown), stage "paraplanner_review",
            review_date (YYYY-MM-DD, twelve months from today), hours_saved (your honest estimate of the manual hours the
            draft saved, between 1 and 8), case_type.'
  - key: releaser
    role: helper
    description: After the adviser approves, marks the case approved so the client email goes out.
    appTools:
    - name: find_cases
      description: Read the user's cases
      action: read
      collection: cases
      scope: user
    - name: update_case
      description: Update a case record
      action: write
      collection: cases
      scope: user
    limits:
      maxTurns: 6
      maxBudgetUsd: 0.2
    profile:
      inline:
        display_name: Suitwell releaser
        crews:
        - id: releaser
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: An adviser has just approved a suitability report. Identify the case the approval refers to (use
            find_cases), then call update_case once to set its stage to "approved". Change nothing else. If you cannot identify
            exactly one case, change nothing and say why.
  - key: client_assistant
    role: helper
    description: Answers a client's questions about their own approved report.
    appTools:
    - name: my_case
      description: Read the client's own approved case and report
      action: read
      collection: cases
      scope: user
    context:
    - key: email
      from: user.email
    goalTemplate: 'Client email: {email}

      Conversation so far:

      {history}

      New question: {message}

      Answer in English.'
    limits:
      maxTurns: 6
      maxBudgetUsd: 0.3
    profile:
      inline:
        display_name: Suitwell client assistant
        crews:
        - id: client_assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You help a client of a UK advice firm understand the suitability report their adviser approved.
            Call my_case first and answer only from that report, in plain, warm English. Explain terms and the reasons for
            the recommendation. You give no new advice and do not change or reinterpret the recommendation: for anything beyond
            the report (a different product, a change in circumstances, a decision) tell the client to contact their adviser.
            Never discuss other clients. Never invent figures.'
  inputForm:
    title: New piece of work
    fields:
    - name: mode
      type: select
      required: true
      label: What do you need?
      default: notes
      options:
      - value: notes
        label: Meeting notes from a transcript
      - value: report
        label: Draft a suitability report
    - name: client_name
      type: text
      required: true
      label: Client name
    - name: client_email
      type: email
      required: true
      label: Client email
      help: The report link is sent here only after the adviser approves.
    - name: meeting_date
      type: date
      visibleWhen: mode == 'notes'
      label: Meeting date
    - name: transcript
      type: file
      visibleWhen: mode == 'notes'
      accept:
      - txt
      - docx
      - pdf
      - md
      maxMb: 15
      label: Meeting transcript
    - name: case_type
      type: select
      visibleWhen: mode == 'report'
      label: Case type
      options:
      - value: investment
        label: Investment / retirement planning
      - value: pension_transfer
        label: Pension transfer
      - value: annual_review
        label: Annual review
    - name: documents
      type: file
      accept:
      - pdf
      - docx
      - xlsx
      - csv
      - jpg
      - png
      maxMb: 15
      multiple: true
      label: Fact-find and policy documents
    - name: notes
      type: textarea
      maxLength: 800
      label: Notes for the agent (optional)
  data:
    collections:
    - name: clients
      description: 'Client onboarding: identity details and risk questionnaire'
      ownedBy: user
      access:
      - role: paraplanner
        can:
        - read
        - write
      - role: compliance
        can:
        - read
      fields:
      - name: full_name
        type: text
        required: true
        label: Full name
      - name: email
        type: email
        required: true
        label: Email
      - name: phone
        type: text
        label: Phone
      - name: date_of_birth
        type: date
        required: true
        label: Date of birth
      - name: address
        type: textarea
        label: Address
      - name: id_type
        type: select
        required: true
        label: ID document
        options:
        - passport
        - driving_licence
        - other
      - name: id_document
        type: file
        accept:
        - pdf
        - jpg
        - png
        maxMb: 10
        capture: true
        label: ID document scan
      - name: rq_horizon
        type: select
        required: true
        label: When will you need this money?
        options:
        - under_3_years
        - 3_to_5_years
        - 5_to_10_years
        - over_10_years
      - name: rq_reaction
        type: select
        required: true
        label: If your investment fell 20% in a year you would
        options:
        - sell_everything
        - sell_some
        - do_nothing
        - invest_more
      - name: rq_experience
        type: select
        required: true
        label: Investment experience
        options:
        - none
        - some
        - experienced
      - name: rq_income_dependence
        type: select
        required: true
        label: Do you depend on this money for income?
        options:
        - fully
        - partly
        - not_at_all
      - name: rq_loss
        type: select
        required: true
        label: Loss you could absorb without changing your lifestyle
        options:
        - none
        - up_to_10_percent
        - up_to_25_percent
        - over_25_percent
      - name: consent
        type: boolean
        required: true
        label: I agree to my data being processed to give advice
    - name: meeting_notes
      description: Structured notes written by the notes agent
      ownedBy: user
      access:
      - role: paraplanner
        can:
        - read
        - write
      - role: compliance
        can:
        - read
      fields:
      - name: client_name
        type: text
      - name: client_email
        type: email
      - name: meeting_date
        type: text
      - name: objectives
        type: textarea
      - name: attitude_to_risk
        type: textarea
      - name: capacity_for_loss
        type: textarea
      - name: existing_arrangements
        type: textarea
      - name: actions
        type: textarea
      - name: summary
        type: textarea
    - name: cases
      description: 'One record per advice case: the draft report and its stage'
      ownedBy: user
      access:
      - role: paraplanner
        can:
        - read
        - write
      - role: compliance
        can:
        - read
      - role: client
        where:
          client_email: '{user.email}'
          stage: approved
        can:
        - read
      fields:
      - name: client_name
        type: text
        label: Client
      - name: client_email
        type: email
        label: Client email
      - name: title
        type: text
        label: Title
      - name: case_type
        type: text
        label: Case type
      - name: stage
        type: select
        label: Stage
        options:
        - intake
        - draft
        - paraplanner_review
        - adviser_approval
        - approved
        - annual_review
      - name: body
        type: textarea
        label: Report (Markdown)
      - name: review_date
        type: date
        label: Annual review date
      - name: hours_saved
        type: number
        label: Hours saved
    - name: compliance_checks
      description: File checks done by compliance
      ownedBy: user
      fields:
      - name: case_ref
        type: text
        required: true
        label: Client / case
      - name: adviser_email
        type: email
        label: Adviser
      - name: outcome
        type: select
        required: true
        label: Outcome
        options:
        - pass
        - needs_rework
        - fail
      - name: comments
        type: textarea
        label: Findings
      - name: checked_on
        type: date
        label: Checked on
  approvals:
  - key: paraplanner_review
    title: Paraplanner review complete
    description: The paraplanner has edited the draft and cleared every [TO CONFIRM] item.
    role: paraplanner
    fields:
    - client_name
    - title
  - key: adviser_signoff
    title: Adviser approval to release to the client
    description: The adviser confirms the report is suitable and may be sent to the client.
    role: adviser
    fields:
    - client_name
    - title
  triggers:
  - key: release_case
    description: Adviser approval marks the case approved
    'on':
      approval: adviser_signoff
      decision: approved
    start:
      agent: releaser
    goal: 'The adviser approved a suitability report. Approval event: {event}. Set that case''s stage to approved.'
  - key: client_report_ready
    description: Email the client once the case is approved
    'on':
      collection: cases
      op: update
      where:
        stage: approved
    notify:
      to:
      - record.client_email
      subject: Your suitability report from your adviser is ready
      body: 'Hello {record.client_name},


        Your adviser has approved your suitability report ({record.title}). Sign in with this email address to read it and
        ask questions about it.


        If you have any concerns, please contact your adviser directly.'
      link: client_chat
  - key: annual_review_reminder
    description: Remind the adviser a month before the annual review
    'on':
      date:
        collection: cases
        field: review_date
        offsetDays: -30
        hour: 8
      where:
        stage: approved
    notify:
      to:
      - owner
      subject: 'Annual review due: {record.client_name}'
      body: The annual review for {record.client_name} ({record.title}) is due on {record.review_date}. Book the meeting and
        upload a new transcript to start the review.
      link: new_work
  views:
  - key: home
    type: page
    title: Suitwell
    nav: false
    sections:
    - type: hero
      title: Less paperwork, **better advice**.
      text: Suitwell writes meeting notes and drafts COBS 9 / Consumer Duty suitability reports for your advisers. Your paraplanner
        edits, your adviser approves, and nothing reaches a client without approval.
      actions:
      - label: Sign in
        href: /login
        style: primary
      band: true
    - type: steps
      id: how
      title: How it works
      items:
      - title: Capture
        text: Upload the meeting transcript, fact-find and policy documents, and complete the client onboarding form with
          the risk questionnaire.
      - title: Draft
        text: Agents write structured meeting notes and a suitability report, with pension transfer analysis where relevant.
      - title: Review and approve
        text: The paraplanner edits, the adviser signs off, and compliance samples the files.
      - title: Deliver
        text: The client gets the report by email with a link to ask questions. Annual review reminders are scheduled for
          you.
    - type: cards
      id: controls
      title: Built for regulated firms
      items:
      - title: Human in the loop
        text: 'Two approvals before release: paraplanner review and adviser sign-off.'
      - title: Compliance sampling
        text: Compliance can read every file and record check outcomes.
      - title: Dashboards
        text: Cases by stage and hours saved, per firm.
    - type: note
      content: Suitwell drafts documents for qualified humans to review. It does not give regulated advice itself; the adviser
        remains responsible for every recommendation.
  - key: new_work
    type: new_run
    title: New work
    roles:
    - adviser
    - paraplanner
    - admin
  - key: runs
    type: history
    title: My runs
    source: run
    roles:
    - adviser
    - paraplanner
    - admin
  - key: run_report
    type: report
    source: run
    printable: true
    nav: false
  - key: onboarding
    type: form
    title: Client onboarding
    collection: clients
    submit:
      label: Save client
      message: Client saved.
      redirect: client_list
    roles:
    - adviser
    - admin
  - key: client_list
    type: table
    title: Clients
    source: collection:clients
    columns:
    - full_name
    - email
    - date_of_birth
    - rq_horizon
    - rq_loss
    roles:
    - adviser
    - paraplanner
    - compliance
    - admin
  - key: cases_list
    type: table
    title: Cases
    source: collection:cases
    columns:
    - client_name
    - title
    - stage
    - review_date
    - hours_saved
    export: true
    roles:
    - adviser
    - paraplanner
    - compliance
    - admin
  - key: case_edit
    type: form
    title: Edit case
    collection: cases
    fields:
    - title
    - stage
    - body
    - review_date
    - hours_saved
    edit: true
    submit:
      label: Save
      message: Case updated.
      redirect: cases_list
    nav: false
    roles:
    - adviser
    - paraplanner
    - admin
  - key: approvals_view
    type: approvals
    title: Approvals
    roles:
    - adviser
    - paraplanner
    - admin
  - key: check_form
    type: form
    title: Record a file check
    collection: compliance_checks
    submit:
      label: Save check
      message: Check recorded.
    roles:
    - compliance
    - admin
  - key: checks_list
    type: table
    title: File checks
    source: collection:compliance_checks
    columns:
    - case_ref
    - adviser_email
    - outcome
    - checked_on
    export: true
    roles:
    - compliance
    - admin
  - key: dashboard
    type: page
    title: Dashboard
    roles:
    - adviser
    - paraplanner
    - compliance
    - admin
    sections:
    - type: data
      title: Cases by stage
      source: collection:cases
      display: bar
      fields:
      - key: stage
        label: Stage
      - key: count
        label: Cases
      groupBy:
        field: stage
        aggs:
        - key: hours
          agg: sum
          field: hours_saved
      empty: No cases yet.
    - type: data
      title: Time saved
      source: collection:cases
      display: kpi
      kpis:
      - label: Hours saved
        agg: sum
        field: hours_saved
        format: number
      - label: Cases
        agg: count
    - type: data
      title: Hours saved by month
      source: collection:cases
      display: chart
      chart: line
      fields:
      - key: review_date
        label: Month
      - key: hours
        label: Hours saved
      groupBy:
        field: review_date
        bucket: month
        aggs:
        - key: hours
          agg: sum
          field: hours_saved
  - key: client_chat
    type: chat
    title: My report
    source: agent:client_assistant
    examples:
    - Why was this recommended for me?
    - What are the risks?
    - What happens at the annual review?
    placeholder: Ask a question about your report
    roles:
    - client
  - key: account
    type: account
    title: Subscription
    roles:
    - admin
  billing:
    modes:
    - subscription
    currency: gbp
    plans:
    - key: per_adviser
      price: 89
      interval: month
      label: Suitwell — per adviser
      includes:
      - Meeting notes and suitability report drafting
      - Paraplanner, compliance and client views
      - Dashboards and annual review reminders
      roles:
      - admin
  notifications:
    emailOnRunDone: true
  extensions:
  - key: audio_transcription
    description: Recording audio in the browser or uploading audio files, with automatic transcription, is not available yet.
      Upload the transcript (txt, docx, pdf) from your recording tool.
  - key: crm_oauth
    description: Connecting Intelliflo or another CRM/platform by OAuth to pull and push client records is not available yet
      (OAuth is unsupported). Use the onboarding form and CSV export of cases meanwhile.
  - key: per_adviser_seats
    description: The subscription is a flat monthly price per adviser seat plan; counting seats per invited adviser is billed
      manually for now.
  - key: compliance_sampling
    description: Compliance picks files to check from the cases table and records outcomes; automatic random sampling is not
      included.
