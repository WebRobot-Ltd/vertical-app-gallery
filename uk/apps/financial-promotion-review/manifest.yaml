apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: clearvane
  displayName: Clearvane
  tagline:
    en: Check financial promotions against FCA rules before they go live.
  description:
    en: Clearvane reviews financial promotions against the FCA Handbook (COBS 4, CONC 3), Consumer Duty and finalised guidance.
      Every issue comes with the rule cited, a risk level and a suggested rewrite. A compliance reviewer and an approver sign
      off, and the app keeps an audit trail.
  langs:
  - en
  defaultLang: en
  timezone: Europe/London
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12304a'
      accent: '#0e8a7d'
      background: '#f6f8fa'
      foreground: '#16222e'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Clear
      color: primary
    - text: vane
      color: accent
    width: wide
  header:
    links:
    - label: How it works
      href: '#how-it-works'
    - label: What we check
      href: '#coverage'
    cta:
      label: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: marketer
      label: Marketer
      assignedBy: signup
    - key: reviewer
      label: Compliance reviewer
      assignedBy: invite
    - key: approver
      label: Approver
      assignedBy: invite
  agents:
  - key: checker
    role: main
    description: Extracts the text of a promotion and checks it against the FCA rules in the knowledge base; confirms the
      firm on the FCA register.
    profile:
      inline:
        display_name: Clearvane promotion checker
        crews:
        - id: checker
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are a UK financial promotions compliance analyst. You review ONE promotion before it goes live
            and never invent rules or quotes.


            Method:

            1. Read the copy given in the goal. For every uploaded file, use the goal''s file text if present; for images
            and scans call read_upload with the file id (OCR included). Video scripts are treated as spoken copy.

            2. Call search_rules several times (product type, channel, audience, topics such as risk warning, APR, balance,
            small print, vulnerable customers) to retrieve the relevant rules from the knowledge base: FCA Handbook COBS 4
            and CONC 3, Consumer Duty (PRIN 2A) and finalised guidance (e.g. FG15/4, FG24/1). Cite ONLY rules returned by
            the knowledge base (reference + short title). If no rule supports a concern, say it is a judgement point, not
            a breach.

            3. Call fca_firm_lookup with the path of the firm''s FRN (the path is /Firm/<FRN>) to confirm status on the public
            FCA register. If the FRN is missing or the register is not connected, say so; never assume the firm is authorised.
            Report: name, status, whether it is authorised for the product type. Flag s21 approver situations if the firm
            is unauthorised.

            4. For each issue found, call add_issue once with: promotion (the title), rule (reference), category (risk_warning
            | unbalanced_claim | unclear_apr | small_print | target_audience | misleading | other), risk (high | medium |
            low), excerpt (the exact words), explanation, suggested_rewrite, submitted_on (today''s date).


            Report (start with a level-1 title "# <Promotion title> — FCA promotion review"). Sections with ## headings: Verdict
            (overall risk and one-paragraph summary), Firm status on the FCA register, Findings (a table: #, excerpt, rule
            cited, risk, suggested rewrite), Missing elements (mandatory warnings or information that are absent), Consumer
            Duty considerations (consumer understanding, vulnerable customers), Next steps. This is decision support for the
            firm''s compliance team, not legal advice and not an FCA approval; say so in one line at the end.


            Then end the answer with a single fenced json block and nothing after it: {"title":"<promotion title>","firm_name":"…","frn":"…","product_type":"<value>","channel":"<value>","audience":"<value>","overall_risk":"high|medium|low","issues_count":<n>,"high_count":<n>,"register_status":"<status
            on the register or not_checked>","summary":"<3 sentences>","status":"pending_review","version":1,"submitted_on":"YYYY-MM-DD"}.
            Use today''s date from the goal.'
    goalTemplate: 'Review this financial promotion. Today is {date}. Write the report in English.

      Title: {title}

      Firm: {firm_name}

      {?frn}FCA firm reference number (FRN): {frn}{/frn}{!frn}FRN: not provided.{/frn}

      Product type: {product_type_label} (value {product_type})

      Channel: {channel_label} (value {channel})

      Target audience: {audience_label} (value {audience})

      Copy:

      {copy}

      {?files}Uploaded files (ids): {files}{/files}

      {?files_text}Text extracted from the files:

      {files_text}{/files_text}'
    output: markdown+json
    resultSchema:
      type: object
      properties:
        title:
          type: string
        firm_name:
          type: string
        frn:
          type: string
        product_type:
          type: string
        channel:
          type: string
        audience:
          type: string
        overall_risk:
          type: string
        issues_count:
          type: number
        high_count:
          type: number
        register_status:
          type: string
        summary:
          type: string
        status:
          type: string
        version:
          type: number
        submitted_on:
          type: string
    writesTo:
      collection: reviews
      parse: json_last
    limits:
      maxTurns: 30
      maxBudgetUsd: 1.2
    appTools:
    - name: read_upload
      description: Read a file the user uploaded (images and scans included, OCR)
      action: read_file
    - name: search_rules
      description: Search the FCA rules knowledge base (COBS 4, CONC 3, Consumer Duty, finalised guidance)
      action: search
      collection: fca_rules
      scope: all
    - name: fca_firm_lookup
      description: Look up a firm on the public FCA register; path is /Firm/<FRN>
      action: http
      http:
        method: GET
        url: https://register.fca.org.uk/services/V0.1
        allowPath: true
        headers:
          Accept: application/json
        attribution: Financial Conduct Authority Financial Services Register
        credential:
          provider: fca_register
          header: X-Auth-Key
          format: '{secret}'
    - name: add_issue
      description: Record one issue found in the promotion
      action: append
      collection: issues
      scope: user
  - key: registrar
    role: helper
    description: Prepares the sign-off pack for the approver and records the final decision on the review.
    awaits:
    - final_signoff
    profile:
      inline:
        display_name: Clearvane registrar
        crews:
        - id: registrar
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You run the sign-off step of a financial promotion review.

            Two kinds of tasks:

            (1) PREPARE: find the review with reviews_read (by title). Summarise in a short level-1 titled note ("# Sign-off
            pack — <title>"): overall risk, number of issues, whether the reviewer edited the findings (edited_findings, reviewer_notes),
            and register status. Then call request_final_signoff once with that summary so the approver can decide. Never
            decide yourself.

            (2) FINALISE: the goal gives the approver''s decision. Find the review with reviews_read, then call review_update
            once: if approved set status=approved, approved_on=today, cycle_hours=hours between its submission date and today
            (days x 24, at least 1); if rejected set status=rejected. Confirm in two sentences.

            Never alter findings or invent figures.'
    goalTemplate: '{event}'
    output: markdown
    limits:
      maxTurns: 10
      maxBudgetUsd: 0.3
    appTools:
    - name: reviews_read
      description: Read the reviews the user may see
      action: read
      collection: reviews
      scope: user
    - name: review_update
      description: Update fields of a review record
      action: write
      collection: reviews
      scope: user
  - key: watcher
    role: scheduled
    description: 'Weekly: finds new FCA publications that touch financial promotions and records them.'
    profile:
      inline:
        display_name: Clearvane FCA publications watcher
        crews:
        - id: watcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You monitor new FCA publications relevant to financial promotions, consumer credit and Consumer
            Duty. Use the webrobot tools to read the public FCA pages: news and press releases, policy statements, finalised
            guidance, Handbook Notices, consultation papers, ''Dear CEO'' letters and enforcement notices on financial promotions
            (fca.org.uk/publications and fca.org.uk/news). Only consider items published in the last 8 days. First call updates_read
            to see what is already recorded and skip duplicates (same url). For every new relevant item call add_update with:
            published (YYYY-MM-DD), title, url, summary (2 sentences, factual), affected_rules (Handbook references such as
            COBS 4.2, CONC 3.3, PRIN 2A that the item touches, only if the publication says so), topics (comma separated:
            risk_warning, apr, finfluencers, consumer_duty, crypto, bnpl, claims, other), severity (high = new or changed
            rule, medium = guidance or warning, low = informational). Never invent publications or dates. Finish with a short
            level-1 titled summary "# FCA publications — week of <date>" listing what you added, or saying that nothing relevant
            was found.'
    goalTemplate: Today is {date}. Check the FCA publications of the last 8 days and record the new relevant ones.
    output: markdown
    limits:
      maxTurns: 30
      maxBudgetUsd: 1.0
    appTools:
    - name: updates_read
      description: Read the FCA publications already recorded
      action: read
      collection: fca_updates
      scope: all
    - name: add_update
      description: Record one new FCA publication
      action: append
      collection: fca_updates
      scope: all
  - key: reflagger
    role: helper
    description: 'Weekly, for one firm: re-checks its approved promotions against new FCA publications and re-flags the affected
      ones.'
    memory: instance
    profile:
      inline:
        display_name: Clearvane re-flagger
        crews:
        - id: reflagger
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You re-check a firm''s APPROVED financial promotions against new FCA publications.

            1. Call updates_read for the publications of the last 14 days (the goal gives today''s date).

            2. Call reviews_read and keep only reviews with status approved (and optionally the product focus given in the
            goal).

            3. For each approved promotion, decide whether a publication plausibly affects it: same product type or topic,
            or an affected rule that applies to its channel or audience. Be conservative: flag only with a concrete link,
            and say what to re-check.

            4. For each affected promotion call add_reflag (promotion, update_title, update_url, reason, risk high|medium|low,
            status open) and review_update with status=reflagged for that review (find it by title).

            Begin your answer with "# Re-flag check — <date>". List what was flagged and why, then the approved promotions
            you checked and found unaffected. Your memory holds the publications already handled: skip them and call remember
            at the end with the urls handled. This is decision support, not legal advice.'
    goalTemplate: Today is {date}. Re-check the approved promotions of this firm against the FCA publications of the last
      14 days. Write in English.
    output: markdown
    limits:
      maxTurns: 15
      maxBudgetUsd: 0.5
    appTools:
    - name: updates_read
      description: Read the FCA publications already recorded
      action: read
      collection: fca_updates
      scope: all
    - name: reviews_read
      description: Read the reviews the user may see
      action: read
      collection: reviews
      scope: user
    - name: review_update
      description: Update fields of a review record
      action: write
      collection: reviews
      scope: user
    - name: add_reflag
      description: Record that an approved promotion is affected by a new publication
      action: append
      collection: reflags
      scope: user
  inputForm:
    title: Submit a promotion for review
    fields:
    - name: title
      type: text
      required: true
      maxLength: 120
      label: Promotion title
      help: An internal name, e.g. Spring ISA social campaign
    - name: firm_name
      type: text
      required: true
      label: Firm name
    - name: frn
      type: text
      maxLength: 10
      label: FCA firm reference number (FRN)
      help: 6 or 7 digits, to confirm your status on the FCA register
    - name: product_type
      type: select
      required: true
      label: Product type
      options:
      - value: consumer_credit
        label: Consumer credit / loan
      - value: bnpl
        label: Buy now pay later
      - value: investment
        label: Investment / ISA
      - value: pension
        label: Pension
      - value: mortgage
        label: Mortgage
      - value: savings
        label: Savings / current account
      - value: crypto
        label: Cryptoasset
      - value: insurance
        label: Insurance
      - value: other
        label: Other
    - name: channel
      type: select
      required: true
      label: Channel
      options:
      - value: social
        label: Social media
      - value: email
        label: Email
      - value: web_page
        label: Web page
      - value: leaflet
        label: Leaflet / print
    - name: audience
      type: select
      required: true
      label: Target audience
      options:
      - value: retail
        label: Retail consumers
      - value: retail_vulnerable
        label: Retail incl. potentially vulnerable
      - value: high_net_worth
        label: High net worth
      - value: sophisticated
        label: Sophisticated investors
      - value: professional
        label: Professional clients
    - name: copy
      type: textarea
      required: true
      maxLength: 8000
      label: Promotion copy
      help: Paste the full text including the small print
    - name: files
      type: file
      accept:
      - pdf
      - docx
      - txt
      - jpg
      - jpeg
      - png
      - webp
      maxMb: 15
      multiple: true
      label: Files (PDF, image, video script)
      help: Artwork, leaflet PDFs, screenshots or a script of a video
  data:
    collections:
    - name: reviews
      description: 'One record per submitted promotion review: verdict, workflow status and version'
      ownedBy: user
      fields:
      - name: title
        type: text
      - name: firm_name
        type: text
      - name: frn
        type: text
      - name: product_type
        type: text
      - name: channel
        type: text
      - name: audience
        type: text
      - name: overall_risk
        type: select
        options:
        - high
        - medium
        - low
      - name: issues_count
        type: number
      - name: high_count
        type: number
      - name: register_status
        type: text
      - name: summary
        type: textarea
      - name: status
        type: select
        options:
        - pending_review
        - reviewed
        - approved
        - rejected
        - reflagged
      - name: version
        type: number
      - name: submitted_on
        type: date
      - name: approved_on
        type: date
      - name: cycle_hours
        type: number
      - name: reviewer_notes
        type: textarea
      - name: edited_findings
        type: textarea
        help: The findings as accepted or edited by the reviewer
      access:
      - role: reviewer
        can:
        - read
        - write
      - role: approver
        can:
        - read
    - name: issues
      description: 'Each issue found: rule cited, risk and suggested rewrite'
      ownedBy: user
      fields:
      - name: promotion
        type: text
      - name: rule
        type: text
      - name: category
        type: select
        options:
        - risk_warning
        - unbalanced_claim
        - unclear_apr
        - small_print
        - target_audience
        - misleading
        - other
      - name: risk
        type: select
        options:
        - high
        - medium
        - low
      - name: excerpt
        type: textarea
      - name: explanation
        type: textarea
      - name: suggested_rewrite
        type: textarea
      - name: submitted_on
        type: date
      access:
      - role: reviewer
        can:
        - read
        - write
      - role: approver
        can:
        - read
    - name: audit_log
      description: Every change to a review, kept for record keeping
      ownedBy: org
      fields:
      - name: review_title
        type: text
      - name: status
        type: text
      - name: version
        type: number
      - name: overall_risk
        type: text
      access:
      - role: reviewer
      - role: approver
    - name: fca_rules
      description: 'Knowledge base: FCA Handbook COBS 4, CONC 3, Consumer Duty and finalised guidance (filled by the admins
        from a CSV)'
      ownedBy: shared
      searchable: true
      fields:
      - name: source
        type: select
        options:
        - COBS 4
        - CONC 3
        - PRIN 2A Consumer Duty
        - Finalised guidance
        - Other
      - name: reference
        type: text
        required: true
      - name: title
        type: text
      - name: text
        type: textarea
      - name: url
        type: url
      - name: effective_date
        type: date
    - name: fca_updates
      description: New FCA publications found by the weekly watcher
      ownedBy: app
      fields:
      - name: published
        type: date
      - name: title
        type: text
      - name: url
        type: url
      - name: summary
        type: textarea
      - name: affected_rules
        type: text
      - name: topics
        type: text
      - name: severity
        type: select
        options:
        - high
        - medium
        - low
    - name: reflags
      description: Approved promotions re-flagged because of a new FCA publication
      ownedBy: instance
      fields:
      - name: promotion
        type: text
      - name: update_title
        type: text
      - name: update_url
        type: url
      - name: reason
        type: textarea
      - name: risk
        type: select
        options:
        - high
        - medium
        - low
      - name: status
        type: select
        options:
        - open
        - resolved
    credentials:
    - provider: fca_register
      kind: api_key
      scope: org
      label: FCA Financial Services Register API key
      help: Request a key from the FCA Register API developer portal and paste it here (admins only).
  views:
  - key: home
    type: page
    title: Clearvane
    nav: false
    sections:
    - type: hero
      layout: stack
      band: true
      eyebrow: For fintechs, lenders and wealth firms
      title: Catch FCA problems **before** a promotion goes live.
      text: Submit your copy and files. Clearvane checks them against COBS 4, CONC 3, Consumer Duty and FCA guidance, cites
        the rule for every issue, rates the risk and suggests a rewrite. Your compliance reviewer and approver sign off, and
        every step is kept in an audit trail.
      actions:
      - label: Submit a promotion
        href: /v/new_review
        style: primary
      - label: Sign in
        href: /login
        style: ghost
    - type: steps
      id: how-it-works
      title: How it works
      items:
      - title: 1 · Submit
        text: 'Product type, channel, audience, the copy and your files: PDF, images or a video script.'
      - title: 2 · AI check
        text: The agent extracts the text, checks the rules and confirms your firm on the public FCA register.
      - title: 3 · Review
        text: A compliance reviewer accepts or edits each finding.
      - title: 4 · Sign-off
        text: An approver signs off. Every version and decision is logged.
      - title: 5 · Stay current
        text: Each week Clearvane scans new FCA publications and re-flags approved promotions that may be affected.
    - type: cards
      id: coverage
      title: What we check
      items:
      - title: Balance and clarity
        text: Missing risk warnings, one-sided claims, unclear APR, small print that contradicts the headline.
        badge: ⚖️
      - title: Rules cited
        text: FCA Handbook COBS 4 and CONC 3, Consumer Duty and finalised guidance, from our knowledge base.
        badge: 📚
      - title: Firm status
        text: Your authorisation is confirmed on the public FCA register.
        badge: ✅
      - title: Audit trail
        text: Version history and decisions kept for record keeping, with CSV export.
        badge: 🗂️
    - type: note
      content: Clearvane is decision support for your compliance team. It is not legal advice and not an FCA approval of a
        promotion.
  - key: new_review
    type: new_run
    title: Submit a promotion
    roles:
    - marketer
    - admin
  - key: my_reviews
    type: history
    title: My reviews
    source: run
    columns:
    - createdAt
    - title
    - channel
    - status
    roles:
    - marketer
    - admin
  - key: review
    type: report
    title: Review report
    source: run
    printable: true
    nav: false
  - key: submissions
    type: table
    title: Submissions and status
    source: collection:reviews
    export: true
    roles:
    - marketer
    - reviewer
    - approver
    - admin
    data:
      display: table
      fields:
      - key: title
        label: Promotion
      - key: firm_name
        label: Firm
      - key: channel
        label: Channel
        format: badge
      - key: overall_risk
        label: Risk
        format: badge
      - key: issues_count
        label: Issues
        format: number
      - key: register_status
        label: FCA register
        format: badge
      - key: status
        label: Status
        format: badge
      - key: version
        label: Version
        format: number
      - key: submitted_on
        label: Submitted
        format: date
      sort:
        field: submitted_on
        dir: desc
      limit: 100
      empty: No promotions submitted yet.
  - key: findings
    type: table
    title: Findings
    source: collection:issues
    export: true
    roles:
    - marketer
    - reviewer
    - approver
    - admin
    data:
      display: table
      fields:
      - key: promotion
        label: Promotion
      - key: rule
        label: Rule cited
      - key: category
        label: Type
        format: badge
      - key: risk
        label: Risk
        format: badge
      - key: excerpt
        label: Excerpt
      - key: suggested_rewrite
        label: Suggested rewrite
      sort:
        field: submitted_on
        dir: desc
      limit: 200
      empty: No findings yet.
  - key: edit_review
    type: form
    title: 'Reviewer: accept or edit findings'
    collection: reviews
    fields:
    - status
    - edited_findings
    - reviewer_notes
    - version
    edit: true
    submit:
      label: Save review
      message: Review saved. The approver has been notified when you set the status to reviewed.
      redirect: submissions
    roles:
    - reviewer
    - admin
    nav: false
  - key: queue
    type: approvals
    title: Sign-off queue
    approvals:
    - final_signoff
    roles:
    - approver
    - admin
  - key: watches
    type: instances
    template: reflag_watch
    title: Weekly re-check of approved promotions
    roles:
    - marketer
    - admin
  - key: reflag_list
    type: table
    title: Re-flagged promotions
    source: collection:reflags
    roles:
    - marketer
    - reviewer
    - admin
    data:
      display: table
      fields:
      - key: promotion
        label: Promotion
      - key: update_title
        label: FCA publication
      - key: update_url
        label: Link
        format: link
      - key: reason
        label: Why
      - key: risk
        label: Risk
        format: badge
      - key: status
        label: Status
        format: badge
      limit: 100
      empty: No re-flags.
  - key: fca_news
    type: table
    title: New FCA publications
    source: collection:fca_updates
    roles:
    - marketer
    - reviewer
    - approver
    - admin
    data:
      display: table
      fields:
      - key: published
        label: Published
        format: date
      - key: title
        label: Title
      - key: severity
        label: Severity
        format: badge
      - key: affected_rules
        label: Rules
      - key: url
        label: Link
        format: link
      sort:
        field: published
        dir: desc
      limit: 50
      empty: 'Nothing yet: the watcher runs every Monday.'
  - key: insights
    type: page
    title: Dashboards
    roles:
    - reviewer
    - approver
    - admin
    sections:
    - type: data
      id: kpis
      title: Review activity
      source: collection:reviews
      display: kpi
      kpis:
      - label: Promotions reviewed
        agg: count
      - label: Average hours to sign-off
        agg: avg
        field: cycle_hours
        format: number
      - label: High-risk issues found
        agg: sum
        field: high_count
        format: number
    - type: data
      title: Approval time by week of submission (hours)
      source: collection:reviews
      display: chart
      chart: line
      groupBy:
        field: submitted_on
        bucket: week
        aggs:
        - key: avg_hours
          agg: avg
          field: cycle_hours
      fields:
      - key: submitted_on
        label: Week
      - key: avg_hours
        label: Avg hours
    - type: data
      title: Recurring issues by rule cited
      source: collection:issues
      display: bar
      groupBy:
        field: rule
        aggs: []
      fields:
      - key: rule
        label: Rule
      - key: count
        label: Issues
      limit: 15
    - type: data
      title: Recurring issues by type
      source: collection:issues
      display: chart
      chart: pie
      groupBy:
        field: category
        aggs: []
      fields:
      - key: category
        label: Type
      - key: count
        label: Issues
    - type: data
      title: Reviews by status
      source: collection:reviews
      display: chart
      chart: bar
      groupBy:
        field: status
        aggs: []
      fields:
      - key: status
        label: Status
      - key: count
        label: Promotions
  - key: audit
    type: table
    title: Audit trail
    source: collection:audit_log
    export: true
    roles:
    - reviewer
    - approver
    - admin
    data:
      display: table
      fields:
      - key: review_title
        label: Promotion
      - key: status
        label: Status
        format: badge
      - key: version
        label: Version
        format: number
      - key: overall_risk
        label: Risk
        format: badge
      limit: 200
      empty: No events yet.
  - key: account
    type: account
    title: Plan and credits
    roles:
    - marketer
  approvals:
  - key: final_signoff
    title: Sign off the promotion
    description: The approver signs off a promotion once the compliance reviewer has accepted or edited the findings.
    role: approver
    decidedBy: role
    fields:
    - title
    - firm_name
    - overall_risk
    - issues_count
    - register_status
    timeoutMinutes: 10080
    onTimeout: reject
  templates:
  - key: reflag_watch
    title: Re-check approved promotions weekly
    description: Every Tuesday, your approved promotions are compared with new FCA publications and the affected ones are
      re-flagged.
    agent: reflagger
    params:
    - name: product_focus
      type: select
      required: true
      label: Product focus
      options:
      - value: all
        label: All product types
      - value: consumer_credit
        label: Consumer credit and BNPL
      - value: investment
        label: Investments and pensions
      - value: crypto
        label: Cryptoassets
    goal: 'Today is {date}. Re-check the approved promotions of this firm against the FCA publications of the last 14 days.
      Product focus: {product_focus}. Write in English.'
    schedule:
      cron: 0 8 * * 2
      userCanChange: false
    maxPerUser: 1
    cost:
      perRun: 5
    deliver:
      to: owner
      subject: 'Clearvane weekly re-check: {title}'
      onlyIfNew: true
  schedules:
  - agent: watcher
    action: run
    cron: 0 6 * * 1
    owner: app
    goal: Check the FCA publications of the last 8 days and record the new relevant ones.
  triggers:
  - key: new_submission
    description: A reviewed promotion is waiting for the compliance reviewers
    'on':
      collection: reviews
      op: insert
    notify:
      to: role:reviewer
      subject: 'New promotion to review: {record.title}'
      body: A new promotion, {record.title} ({record.firm_name}), has been checked by the AI agent with overall risk {record.overall_risk}
        and {record.issues_count} issues. Please accept or edit the findings.
      link: submissions
  - key: to_signoff_start
    description: 'Reviewer finished: prepare the sign-off pack'
    'on':
      collection: reviews
      op: update
      where:
        status: reviewed
    start:
      agent: registrar
    goal: 'PREPARE the sign-off pack for the review titled "{record.title}" (firm {record.firm_name}). Today is {date}. Event:
      {event}'
  - key: to_signoff_notify
    'on':
      collection: reviews
      op: update
      where:
        status: reviewed
    notify:
      to: role:approver
      subject: 'Ready for sign-off: {record.title}'
      body: The compliance reviewer has completed the review of {record.title}. It is waiting for your sign-off in the queue.
      link: queue
  - key: signoff_finalise
    'on':
      approval: final_signoff
      decision: approved
    start:
      agent: registrar
    goal: 'FINALISE: the approver APPROVED the promotion. Today is {date}. Decision event: {event}. Find the review it concerns
      and record the approval.'
  - key: signoff_reject_finalise
    'on':
      approval: final_signoff
      decision: rejected
    start:
      agent: registrar
    goal: 'FINALISE: the approver REJECTED the promotion. Today is {date}. Decision event: {event}. Find the review it concerns
      and set status rejected.'
  - key: signoff_approved_email
    'on':
      approval: final_signoff
      decision: approved
    notify:
      to: owner
      subject: Your promotion was approved
      body: Your financial promotion has been signed off by the approver and can go live. The review, versions and decisions
        are kept in the audit trail.
      link: submissions
  - key: signoff_rejected_email
    'on':
      approval: final_signoff
      decision: rejected
    notify:
      to: owner
      subject: Your promotion was not approved
      body: The approver did not sign off your financial promotion. Open the review to see the findings and suggested rewrites,
        then submit a revised version.
      link: submissions
  - key: reflag_email
    'on':
      collection: reviews
      op: update
      where:
        status: reflagged
    notify:
      to:
      - owner
      - role:reviewer
      subject: 'Approved promotion re-flagged: {record.title}'
      body: A new FCA publication may affect the approved promotion {record.title}. Please re-check it before it is used again.
      link: reflag_list
  - key: audit_reviews
    description: 'Audit trail: one record per change of a review'
    'on':
      collection: reviews
      op: any
    write:
      collection: audit_log
      fields:
        review_title: title
        status: status
        version: version
        overall_risk: overall_risk
  notifications:
    emailOnRunDone: true
  egress:
    hosts:
    - register.fca.org.uk
    notes: 'FCA Financial Services Register API: public register of firms, used to confirm a firm''s status by FRN. Requires
      an API key set by the admins.'
  limits:
  - action: agent:checker
    per: user
    max: 200
    window: day
    roles:
    - marketer
  billing:
    modes:
    - subscription
    - credits
    currency: gbp
    signupCredits: 20
    costs:
      agent:checker: 10
    packs:
    - key: extra_10
      credits: 100
      price: 90
      label: 10 extra reviews
    - key: extra_50
      credits: 500
      price: 400
      label: 50 extra reviews
    plans:
    - key: starter
      price: 249
      interval: month
      label: 'Starter: 25 reviews a month'
      credits: 250
      creditsReset: monthly
      roles:
      - marketer
    - key: growth
      price: 799
      interval: month
      label: 'Growth: 100 reviews a month'
      credits: 1000
      creditsReset: monthly
      roles:
      - marketer
    - key: scale
      price: 2499
      interval: month
      label: 'Scale: 400 reviews a month'
      credits: 4000
      creditsReset: monthly
      roles:
      - marketer
  extensions:
  - key: fca_register_auth
    description: The FCA Register API also expects an X-Auth-Email header next to the key; the manifest only carries the key,
      so the connection may need the platform team to add the email header.
  - key: reviewer_findings_editing
    description: Reviewers edit findings as one text field per review plus the issues table; per-finding accept/reject buttons
      are not available yet.
  - key: video_files
    description: Videos themselves are not read; submit the video script as PDF, Word or text.
