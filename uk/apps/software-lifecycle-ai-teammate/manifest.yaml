apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: tandem
  displayName: Tandem
  tagline:
    en: An AI teammate for your whole development lifecycle.
  description:
    en: 'Tandem reads your repositories, tickets and docs, then takes tasks from Jira or Slack: specs, bug triage, codebase
      answers, release notes and small changes delivered as pull requests that a human must review and merge.'
  langs:
  - en
  defaultLang: en
  timezone: Europe/London
spec:
  pattern: dashboard
  branding:
    theme: light
    palette:
      primary: '#1f2a44'
      accent: '#6c5ce7'
      background: '#f7f8fb'
      foreground: '#151a2c'
    fonts:
      body: Inter
      display: Space Grotesk
    wordmark:
    - text: Tan
      color: primary
    - text: dem
      color: accent
    byline: your AI teammate
  header:
    links:
    - label: How it works
      href: '#how'
    - label: Safety
      href: '#safety'
    - label: Pricing
      href: '#pricing'
    cta:
      label: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: engineer
      label: Engineer
      assignedBy: invite
    - key: product_manager
      label: Product manager
      assignedBy: invite
    - key: viewer
      label: Viewer
      assignedBy: invite
  limits:
  - action: agent:teammate
    per: app
    max: 100
    window: day
  agents:
  - key: teammate
    role: main
    description: Takes one task (spec, triage, codebase question, release notes, small change as a pull request) and records
      its progress on the board.
    profile:
      inline:
        display_name: Tandem teammate
        crews:
        - id: teammate
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are Tandem, an AI teammate of a software team. You work only with the team''s own GitHub repositories,
            Jira project and Slack, through your tools. You never invent code, files, figures or ticket contents: read them
            first.


            WORKFLOW

            1. Call ratings_read and apply the engineers'' recent comments and scores (style, length, level of detail) to
            your work.

            2. Call tasks_write to set the task (by task_key) to status in_progress with started_at (ISO timestamp). If the
            task has no task_key, make one (TAN-<date>-<short word>) and create it with status in_progress.

            3. Search kb_search for what the team already knows; read the real sources with github_get (contents, search/code,
            issues, pulls, commits), jira_issue / jira_search and jira_docs (Confluence). After learning something durable
            about the codebase, store a short note with kb_write (topic, repo, content, source_url).

            4. Do the task:

            - spec: a technical spec from the ticket: context, goals / non-goals, proposed design, affected files, API/data
            changes, risks, test plan, open questions. Post it as a Jira comment (jira_comment).

            - triage: classify the bug (severity, component, likely area of code, duplicates, missing info, suggested owner),
            and comment on the ticket.

            - question: answer from the code and docs, citing file paths and links; say plainly when unsure.

            - release_notes: from merged pull requests and Jira tickets in the period, group by Features, Fixes, Internal;
            customer-readable.

            - code_change: only small, well-scoped changes. Read the code, create a branch named tandem/<task_key> (github_post
            to /repos/{owner}/{repo}/git/refs), commit the files with github_put (/repos/{owner}/{repo}/contents/{path}),
            then open a pull request with github_post (/repos/{owner}/{repo}/pulls) whose description explains what and why,
            links the ticket and lists how to test. You cannot run code yourself: the team''s CI runs the tests on the pull
            request; read the check runs with github_get (/repos/{owner}/{repo}/commits/{sha}/check-runs) and fix your branch
            if they fail, up to 3 attempts, then report honestly. If the change is not small or is unclear, do not code: write
            a spec instead.

            5. HARD RULES: NEVER merge a pull request, never push to the default or a protected branch, never delete branches
            or files, never deploy, never call a /merge path. A human must review and merge every pull request. Never put
            secrets in code or comments.

            6. Finish with tasks_write: status needs_review (code changes, with pr_url) or done, output_url, summary (2 sentences)
            and minutes (time spent). On failure set status failed with the reason in summary. If the task came from Slack,
            reply in the thread with slack_post.


            Your final answer is a short report that starts with a level-1 title ''# <task type>: <task title>'', then What
            I did, Links (ticket, pull request, docs), Open questions. No filler.'
    appTools:
    - name: github_get
      description: Read from the GitHub API (repos, contents, search, issues, pulls, checks). Path starts with /repos/...
        or /search/...
      action: http
      http:
        method: GET
        url: https://api.github.com
        allowPath: true
        headers:
          Accept: application/vnd.github+json
          X-GitHub-Api-Version: '2022-11-28'
        attribution: GitHub REST API, customer's own repositories
        credential:
          provider: github
          header: Authorization
          format: Bearer {secret}
    - name: github_post
      description: Create a branch ref, a pull request or an issue comment on GitHub. Never merge.
      action: http
      http:
        method: POST
        url: https://api.github.com
        allowPath: true
        headers:
          Accept: application/vnd.github+json
          X-GitHub-Api-Version: '2022-11-28'
        attribution: GitHub REST API, customer's own repositories
        credential:
          provider: github
          header: Authorization
          format: Bearer {secret}
    - name: github_put
      description: Create or update a file on a tandem/* branch via /repos/{owner}/{repo}/contents/{path}. Never use for merging.
      action: http
      http:
        method: PUT
        url: https://api.github.com
        allowPath: true
        headers:
          Accept: application/vnd.github+json
          X-GitHub-Api-Version: '2022-11-28'
        attribution: GitHub REST API, customer's own repositories
        credential:
          provider: github
          header: Authorization
          format: Bearer {secret}
    - name: jira_issue
      description: 'Read a Jira issue: path like /PROJ-123'
      action: http
      http:
        method: GET
        url: https://{host}/rest/api/3/issue
        allowPath: true
        attribution: Customer's own Jira
        credential:
          provider: jira
          header: Authorization
          format: Basic {secret}
    - name: jira_search
      description: Search Jira issues with JQL in the query (jql=...)
      action: http
      http:
        method: GET
        url: https://{host}/rest/api/3/search/jql
        attribution: Customer's own Jira
        credential:
          provider: jira
          header: Authorization
          format: Basic {secret}
    - name: jira_comment
      description: 'Add a comment to a Jira issue: POST path /PROJ-123/comment with an Atlassian document body'
      action: http
      http:
        method: POST
        url: https://{host}/rest/api/3/issue
        allowPath: true
        attribution: Customer's own Jira
        credential:
          provider: jira
          header: Authorization
          format: Basic {secret}
    - name: jira_docs
      description: Search the team's Confluence documentation (query cql=text~"...")
      action: http
      http:
        method: GET
        url: https://{host}/wiki/rest/api/content/search
        attribution: Customer's own Confluence
        credential:
          provider: jira
          header: Authorization
          format: Basic {secret}
    - name: slack_post
      description: 'Post a message in a Slack channel or thread: body {channel, text, thread_ts?}'
      action: http
      http:
        method: POST
        url: https://slack.com/api/chat.postMessage
        attribution: Customer's own Slack workspace
        credential:
          provider: slack
          header: Authorization
          format: Bearer {secret}
    - name: kb_search
      description: Search the team's knowledge base
      action: search
      collection: kb_notes
      scope: all
    - name: kb_write
      description: Save or update a knowledge-base note
      action: write
      collection: kb_notes
      scope: all
    - name: tasks_read
      description: Read the task board
      action: read
      collection: tasks
      scope: all
    - name: tasks_write
      description: Create or update a task on the board (by task_key)
      action: write
      collection: tasks
      scope: all
    - name: ratings_read
      description: Read engineers' ratings and comments on past outputs
      action: read
      collection: ratings
      scope: all
    goalTemplate: 'Task type: {task_type_label}

      Repository: {repo}

      {?ticket}Jira ticket: {ticket}{/ticket}

      Details: {details}

      Requested by: {user}. Today is {date}. Write in language {lang}.'
    output: markdown
    limits:
      maxTurns: 40
      maxBudgetUsd: 2
      timeoutSeconds: 1500
  - key: standup
    role: scheduled
    description: Posts the daily standup summary in Slack.
    profile:
      inline:
        display_name: Tandem standup
        crews:
        - id: standup
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are Tandem, posting the daily standup for the team. Read the board with tasks_read. Summarise:
            done since yesterday, in progress, waiting for human review (with pull request links), blocked or failed, and
            what you plan to take next. Be brief (under 150 words), use real data only, never invent. Post it with slack_post
            to the channel named in the goal. Your final answer starts with ''# Standup <date>'' and repeats the message posted.'
    appTools:
    - name: tasks_read
      description: Read the task board
      action: read
      collection: tasks
      scope: all
    - name: slack_post
      description: 'Post a message in a Slack channel or thread: body {channel, text, thread_ts?}'
      action: http
      http:
        method: POST
        url: https://slack.com/api/chat.postMessage
        attribution: Customer's own Slack workspace
        credential:
          provider: slack
          header: Authorization
          format: Bearer {secret}
    output: markdown
    limits:
      maxTurns: 10
      maxBudgetUsd: 0.4
  - key: weekly
    role: scheduled
    description: Writes the weekly report of completed tasks, sent by email.
    profile:
      inline:
        display_name: Tandem weekly report
        crews:
        - id: weekly
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write the weekly email report of Tandem''s work. Read the board with tasks_read and the ratings
            with ratings_read. Start with ''# Tandem weekly report — week of <date>''. Sections: ## Completed (a table: task,
            type, requester, time spent, link), ## Pull requests waiting for review, ## Not completed and why, ## Quality
            (average rating, what engineers asked to change). Plain, short, real figures only; never invent.'
    appTools:
    - name: tasks_read
      description: Read the task board
      action: read
      collection: tasks
      scope: all
    - name: ratings_read
      description: Read engineers' ratings and comments on past outputs
      action: read
      collection: ratings
      scope: all
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.4
  inputForm:
    title: Assign a task
    fields:
    - name: task_type
      type: select
      required: true
      label: Task
      options:
      - value: spec
        label: Write a technical spec from a ticket
      - value: triage
        label: Triage a bug
      - value: question
        label: Answer a question about the codebase
      - value: release_notes
        label: Draft release notes
      - value: code_change
        label: Implement a small change (opens a pull request)
    - name: repo
      type: text
      required: true
      label: Repository
      help: owner/name
    - name: ticket
      type: text
      label: Jira ticket (optional)
      help: e.g. PROJ-123
    - name: details
      type: textarea
      required: true
      maxLength: 2000
      label: Details
  data:
    collections:
    - name: tasks
      ownedBy: app
      description: 'The task board: what the agent works on, status, time spent, outputs'
      fields:
      - name: task_key
        type: text
      - name: title
        type: text
      - name: type
        type: select
        options:
        - spec
        - triage
        - question
        - release_notes
        - code_change
      - name: source
        type: select
        options:
        - jira
        - slack
        - web
      - name: requester
        type: text
      - name: jira_key
        type: text
      - name: repo
        type: text
      - name: channel
        type: text
      - name: details
        type: textarea
      - name: status
        type: select
        options:
        - queued
        - in_progress
        - needs_review
        - done
        - failed
      - name: started_at
        type: date
      - name: minutes
        type: number
      - name: output_url
        type: url
      - name: pr_url
        type: url
      - name: summary
        type: textarea
    - name: kb_notes
      ownedBy: app
      description: Knowledge base built by the agent from repositories, tickets and docs
      fields:
      - name: topic
        type: text
      - name: repo
        type: text
      - name: content
        type: textarea
      - name: source_url
        type: url
      searchable: true
    - name: ratings
      ownedBy: org
      description: Engineers' ratings of outputs; the agent reads them to tune its behaviour for this team
      fields:
      - name: task_key
        type: text
        required: true
        label: Task key
      - name: score
        type: select
        required: true
        label: Rating
        options:
        - '1'
        - '2'
        - '3'
        - '4'
        - '5'
      - name: comment
        type: textarea
        maxLength: 800
        label: What should it do differently?
    credentials:
    - provider: github
      kind: api_key
      scope: org
      required: true
      label: GitHub
      help: 'Fine-grained token for the team''s own repositories: contents and pull requests read/write, checks read. No merge
        or admin rights; keep branch protection with required reviews on.'
    - provider: jira
      kind: api_key
      scope: org
      required: true
      label: Jira and Confluence
      help: Base64 of 'email:API-token' from id.atlassian.com > Security > API tokens.
      hostLabel: your-team.atlassian.net
    - provider: slack
      kind: api_key
      scope: org
      required: true
      label: Slack
      help: Bot token (xoxb-…) of a Slack app with chat:write, installed in your workspace.
  egress:
    hosts:
    - api.github.com
    - slack.com
    - '*.atlassian.net'
    notes: Only the customer's own GitHub repositories, Jira/Confluence site and Slack workspace, with credentials the customer
      provides. Calls are made by the runtime; the agent never sees the keys.
  views:
  - key: home
    type: page
    nav: false
    title: Tandem
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow: AI teammate for engineering teams
      title: Meet **Tandem**, the teammate that never drops a ticket.
      text: Tandem reads your repositories, tickets and docs, then takes specs, bug triage, codebase questions, release notes
        and small changes. Code arrives as a pull request that your team reviews and merges.
      actions:
      - label: Sign in
        href: /login
        style: primary
      - label: How it works
        href: '#how'
        style: ghost
      note: £300 per month per AI teammate.
    - type: steps
      id: how
      title: How it works
      items:
      - title: Connect
        text: An admin adds the team's GitHub, Jira and Slack keys on the account page.
        badge: 🔌
      - title: Assign
        text: Tag Tandem in Jira or Slack, or assign a task here. It builds a knowledge base as it works.
        badge: 📌
      - title: Review
        text: Follow progress on the board, review outputs and pull requests, and rate them. Ratings tune Tandem for your
          team.
        badge: ✅
      - title: Stay in the loop
        text: A Slack standup every weekday and an email every Monday with completed tasks.
        badge: 📬
    - type: cards
      id: safety
      title: Safety by design
      items:
      - title: Humans merge
        text: Tandem never merges or deploys. Every change is a pull request that an engineer reviews.
        badge: 🛡️
      - title: Your tools only
        text: It reaches only your repositories, Jira and Slack, with the keys you give it.
        badge: 🔒
      - title: Roles
        text: Admin, engineer, product manager and viewer.
        badge: 👥
    - type: cards
      id: pricing
      title: Pricing
      items:
      - title: £300 / month
        text: One AI teammate, all task types, daily standup and weekly report.
        badge: 💷
    - type: note
      content: 'Tandem is decision support: always review its output. Tests run in your own CI on each pull request.'
  - key: board
    type: page
    title: Task board
    roles:
    - admin
    - engineer
    - product_manager
    - viewer
    sections:
    - type: data
      title: Overview
      source: collection:tasks
      display: kpi
      kpis:
      - label: Tasks
        agg: count
      - label: Minutes worked
        agg: sum
        field: minutes
        format: number
    - type: data
      title: Tasks
      source: collection:tasks
      display: table
      fields:
      - key: title
        label: Task
      - key: type
        label: Type
        format: badge
      - key: status
        label: Status
        format: badge
      - key: requester
        label: Requested by
      - key: minutes
        label: Minutes
        format: number
      - key: pr_url
        label: Pull request
        format: link
      - key: output_url
        label: Output
        format: link
      - key: summary
        label: Summary
      sort:
        field: started_at
        dir: desc
      limit: 100
      empty: No tasks yet.
  - key: new_task
    type: new_run
    title: Assign a task
    roles:
    - admin
    - engineer
    - product_manager
  - key: runs
    type: history
    title: Runs
    source: run
    roles:
    - admin
    - engineer
    - product_manager
  - key: output
    type: report
    source: run
    printable: true
    nav: false
  - key: knowledge
    type: table
    title: Knowledge base
    source: collection:kb_notes
    export: true
    roles:
    - admin
    - engineer
    - product_manager
    - viewer
    data:
      display: table
      fields:
      - key: topic
        label: Topic
      - key: repo
        label: Repository
      - key: content
        label: Note
      - key: source_url
        label: Source
        format: link
      limit: 200
  - key: rate
    type: form
    title: Rate an output
    collection: ratings
    submit:
      label: Send rating
      message: Thanks, Tandem will take it into account.
      redirect: board
    roles:
    - admin
    - engineer
  - key: ratings_list
    type: table
    title: Ratings
    source: collection:ratings
    roles:
    - admin
    data:
      display: table
      fields:
      - key: task_key
        label: Task
      - key: score
        label: Rating
        format: badge
      - key: comment
        label: Comment
      limit: 200
  - key: account
    type: account
    title: Connections and plan
    roles:
    - admin
  schedules:
  - agent: standup
    cron: 0 8 * * 1-5
    action: run
    owner: app
    goal: 'Post today''s standup ({date}) in the Slack channel #dev-standup.'
  - agent: weekly
    cron: 0 8 * * 1
    action: run
    owner: app
    goal: Write the report of the week ending {date}.
    deliver:
      to:
      - admins
      - role:engineer
      - role:product_manager
      subject: 'Tandem weekly report: completed tasks'
      onlyIfNew: false
  triggers:
  - key: jira_hook
    description: A Jira automation rule or Slack workflow posts the task here
    'on':
      webhook: true
    write:
      collection: tasks
      fields:
        task_key: task_key
        title: title
        type: type
        source: source
        requester: requester
        jira_key: jira_key
        repo: repo
        channel: channel
        details: details
        status: status
      keyBy: task_key
  - key: task_queued
    'on':
      collection: tasks
      op: insert
      where:
        status: queued
    start:
      agent: teammate
    asUser: false
    goal: 'New task {record.task_key} of type {record.type} from {record.source}.

      Title: {record.title}

      Repository: {record.repo}

      Jira ticket: {record.jira_key}

      Slack channel: {record.channel}

      Requested by: {record.requester}

      Details: {record.details}

      Today is {date}.'
  - key: task_failed
    'on':
      collection: tasks
      op: update
      where:
        status: failed
    notify:
      to: admins
      subject: Tandem could not finish {record.title}
      body: 'The task {record.task_key} failed.


        {record.summary}'
      link: board
  billing:
    modes:
    - subscription
    currency: gbp
    plans:
    - key: teammate
      price: 300
      interval: month
      label: 'Tandem: one AI teammate'
      includes:
      - All task types
      - Daily Slack standup
      - Weekly email report
      roles:
      - admin
  extensions:
  - key: oauth_connections
    description: OAuth sign-in to GitHub, Jira and Slack is not available yet. Admins paste an API token for each (fine-grained
      GitHub token, Atlassian API token, Slack bot token) on the account page.
  - key: code_execution
    description: The agent cannot run code or tests on the platform. It commits to a tandem/* branch and opens a pull request
      through the GitHub API; tests run in the customer's own CI and the agent reads the check results.
  - key: repository_permissions
    description: Access cannot yet mirror per-repository GitHub permissions. The agent can reach what its token reaches, and
      app roles (admin, engineer, product manager, viewer) govern who sees the board. Use a token scoped to the intended repositories.
  - key: inbound_assignment
    description: Tasks assigned in Jira or Slack arrive through a Jira automation rule or Slack workflow that POSTs {task_key,
      title, type, source, requester, jira_key, repo, channel, details, status:'queued'} to /api/hooks/jira_hook with the
      app's hook secret. @mention listening in Slack is not available.
  - key: merge_protection
    description: 'Tandem is told never to merge and has no merge tool, but GitHub enforces it: enable branch protection with
      required reviews and give the token no merge rights on protected branches.'
  - key: rating_tuning
    description: Ratings tune behaviour per team because the agent reads them at the start of each task; there is no model
      fine-tuning.
