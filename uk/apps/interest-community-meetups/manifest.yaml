apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: kindred
  displayName: Kindred
  tagline: Find your people. Meet in real life.
  description: Join interest communities such as run clubs, pop-up gigs and supper clubs, find events near you on a map, book
    a place and show up.
  langs:
  - en
  defaultLang: en
  timezone: Europe/London
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#2b1f4a'
      accent: '#ff6b4a'
      background: '#fffaf5'
      foreground: '#1d1830'
    fonts:
      body: Inter
      display: Poppins
    wordmark:
    - text: Kin
      color: primary
    - text: dred
      color: accent
    buttonShape: pill
  header:
    links:
    - label: How it works
      href: '#how'
    - label: For organisers
      href: '#organisers'
    cta:
      label: Join
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: organiser
      label: Organiser
      assignedBy: admin
    - key: moderator
      label: Moderator
      assignedBy: admin
    - key: user
      label: Member
      assignedBy: signup
  limits:
  - action: run
    per: user
    max: 10
    window: day
    roles:
    - user
  agents:
  - key: recommender
    role: main
    when: mode == 'recommend'
    description: Recommends communities and events from the member's interests and attendance.
    profile:
      inline:
        display_name: Kindred recommender
        crews:
        - id: recommender
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are Kindred''s friendly matchmaker. You recommend real-life communities and upcoming events
            to one member. Use the tools to read the communities, the events, and the member''s own bookings and memberships.
            Only recommend things that exist in the data; never invent communities, dates or prices. Prefer things in the
            member''s area, matching their interests, and similar to events they attended. Never recommend communities they
            already joined. Output: a level-1 title "# Picks for you — <date>", then ## Communities (3-5, each with a one-line
            reason), ## Events coming up (3-5 with date, place, price, capacity left if known), ## Try something new (1 suggestion).
            Keep it under 350 words, warm and concrete.'
    context:
    - key: interests
      from: collection:profiles.interests
    - key: area
      from: collection:profiles.area
    - key: age_range
      from: collection:profiles.age_range
    appTools:
    - name: list_communities
      description: Read the communities
      action: read
      collection: communities
      scope: all
    - name: list_events
      description: Read the events
      action: read
      collection: events
      scope: all
    - name: my_bookings
      description: Read the member's own bookings (attendance)
      action: read
      collection: bookings
      scope: user
    - name: my_memberships
      description: Read the communities the member joined
      action: read
      collection: memberships
      scope: user
    goalTemplate: 'Recommend communities and events for {user}.

      Interests: {interests}

      Area: {area}

      Age range: {age_range}

      {?focus}The member also asks: {focus}{/focus}

      Today is {date}. Write in the language with ISO code {lang}.'
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.4
  - key: organiser_helper
    role: main
    when: mode == 'write'
    description: Helps organisers write event descriptions and check-in messages.
    profile:
      inline:
        display_name: Kindred organiser helper
        crews:
        - id: organiser_helper
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 4
          max_budget_usd: 0.25
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You help community organisers of social groups (run clubs, pop-up gigs, supper clubs) write copy.
            Start with a level-1 title "# <Event or message name>". For an event description write: a catchy first line, what
            to expect, who it is for, what to bring, practical details only from the information given. For a check-in message
            write a short friendly message (under 60 words) members get on arrival, plus a reminder variant. Never invent
            times, prices, venues or promises not given. Offer two tone variants when asked for a draft. Keep it inclusive
            and safe.'
    goalTemplate: 'Organiser task: {kind_label}.

      Community: {community}

      Event idea / details: {details}

      Tone: {tone_label}

      Write in the language with ISO code {lang}.'
    output: markdown
    limits:
      maxTurns: 4
      maxBudgetUsd: 0.25
  inputForm:
    title: Ask Kindred
    fields:
    - name: mode
      type: select
      required: true
      label: What do you need?
      options:
      - value: recommend
        label: Recommendations for me
      - value: write
        label: Help writing (organisers)
    - name: focus
      type: text
      maxLength: 200
      label: Anything specific? (optional)
      visibleWhen: mode == 'recommend'
    - name: kind
      type: select
      label: Write a
      visibleWhen: mode == 'write'
      options:
      - value: event
        label: Event description
      - value: checkin
        label: Check-in message
    - name: community
      type: text
      label: Community
      visibleWhen: mode == 'write'
    - name: details
      type: textarea
      maxLength: 800
      label: Details (date, place, price, vibe)
      visibleWhen: mode == 'write'
    - name: tone
      type: select
      label: Tone
      visibleWhen: mode == 'write'
      options:
      - value: friendly
        label: Friendly
      - value: energetic
        label: Energetic
      - value: calm
        label: Calm and cosy
  data:
    collections:
    - name: profiles
      ownedBy: user
      description: Each member's profile
      fields:
      - name: name
        type: text
        required: true
        label: Name
      - name: age_range
        type: select
        required: true
        label: Age range
        options:
        - 18-24
        - 25-34
        - 35-44
        - 45-54
        - 55+
      - name: area
        type: text
        required: true
        label: Area
      - name: interests
        type: multiselect
        required: true
        label: Interests
        options:
        - running
        - live music
        - supper clubs
        - hiking
        - board games
        - art
        - yoga
        - cycling
        - book club
        - food
        - photography
        - football
      - name: home_location
        type: location
        label: My position
    - name: communities
      ownedBy: shared
      description: Interest communities created by organisers
      fields:
      - name: name
        type: text
        required: true
        label: Name
      - name: category
        type: select
        label: Category
        options:
        - run club
        - pop-up gig
        - supper club
        - outdoors
        - social
        - creative
      - name: description
        type: textarea
        required: true
        label: Description
      - name: photos
        type: file
        accept:
        - jpg
        - jpeg
        - png
        - webp
        maxMb: 8
        multiple: true
        capture: true
        label: Photos
      - name: area
        type: text
        label: Area
      - name: location
        type: location
        label: Meeting point
      - name: lat
        type: number
        label: Latitude
      - name: lon
        type: number
        label: Longitude
      - name: rules
        type: textarea
        label: Community rules
      - name: organiser_email
        type: email
        required: true
        label: Organiser email
    - name: events
      ownedBy: shared
      description: Events published by organisers
      fields:
      - name: community_name
        type: text
        required: true
        label: Community
      - name: title
        type: text
        required: true
        label: Title
      - name: description
        type: textarea
        label: Description
      - name: event_date
        type: date
        required: true
        label: Date
      - name: place_name
        type: text
        label: Place
      - name: location
        type: location
        label: Place on map
      - name: lat
        type: number
        label: Latitude
      - name: lon
        type: number
        label: Longitude
      - name: capacity
        type: number
        required: true
        label: Capacity
      - name: ticket_price
        type: number
        label: Ticket price (EUR, empty = free)
      - name: organiser_email
        type: email
        required: true
        label: Organiser email
    - name: memberships
      ownedBy: user
      description: Communities a member joined
      fields:
      - name: community_name
        type: text
        required: true
        label: Community
      - name: organiser_email
        type: email
        required: true
        label: Organiser email
      - name: member_name
        type: text
        label: Your name
      access:
      - role: organiser
        where:
          organiser_email: '{user.email}'
        can:
        - read
      - role: moderator
    - name: bookings
      ownedBy: user
      description: A member's place at an event
      fields:
      - name: event_title
        type: text
        required: true
        label: Event
      - name: event_date
        type: date
        required: true
        label: Event date
      - name: organiser_email
        type: email
        required: true
        label: Organiser email
      - name: member_name
        type: text
        label: Your name
      - name: checked_in
        type: boolean
        label: Checked in
      access:
      - role: organiser
        where:
          organiser_email: '{user.email}'
        can:
        - read
        - write
    - name: messages
      ownedBy: user
      description: Community and private messages
      retentionDays: 365
      fields:
      - name: community_name
        type: text
        label: Community
      - name: recipient_email
        type: email
        label: To (private message)
      - name: text
        type: textarea
        required: true
        label: Message
      access:
      - role: moderator
    - name: reports
      ownedBy: user
      description: Reported messages and users
      fields:
      - name: reported_email
        type: email
        required: true
        label: Reported person's email
      - name: message_text
        type: textarea
        label: The message
      - name: reason
        type: select
        required: true
        label: Reason
        options:
        - harassment
        - spam
        - unsafe
        - other
      - name: status
        type: select
        label: Status
        options:
        - open
        - reviewed
        - user_removed
      access:
      - role: moderator
        can:
        - read
        - write
    - name: blocks
      ownedBy: user
      description: People a member blocked
      fields:
      - name: blocked_email
        type: email
        required: true
        label: Email to block
  views:
  - key: home
    type: page
    title: Kindred
    nav: false
    sections:
    - type: hero
      layout: stack
      band: true
      eyebrow: Interest communities, in real life
      title: Find your **people**. Meet in real life.
      text: Join run clubs, pop-up gigs and supper clubs near you. Book a place, get a reminder and show up. Free for members.
      actions:
      - label: Join Kindred
        href: /login
        style: primary
    - type: steps
      id: how
      title: How it works
      items:
      - title: Tell us what you like
        text: Name, age range, area and interests.
        badge: 👋
      - title: Discover near you
        text: Communities and events on a map, plus picks from our AI matchmaker.
        badge: 📍
      - title: Book and meet
        text: Join, book a place, pay by card if ticketed and get a reminder before.
        badge: 🎟️
    - type: cards
      id: organisers
      title: For organisers
      items:
      - title: Build your community
        text: Description, photos, location and rules.
      - title: Publish events
        text: Capacity, map place and optional card tickets; we take a small fee.
      - title: Know your members
        text: See who joined and who showed up. AI helps write event copy.
    - type: note
      content: 'Meet safely: report or block anyone at any time. Kindred moderators review reports.'
  - key: profile
    type: form
    title: My profile
    collection: profiles
    fields:
    - name
    - age_range
    - area
    - interests
    - home_location
    edit: true
    submit:
      label: Save profile
      message: Profile saved
      redirect: discover
    roles:
    - user
    - organiser
    - admin
  - key: discover
    type: cards
    title: Communities
    source: collection:communities
    export: false
    data:
      display: cards
      fields:
      - key: name
        label: Name
      - key: category
        label: Category
        format: badge
      - key: area
        label: Area
      - key: description
        label: About
      - key: rules
        label: Rules
      actions:
      - type: directions
        label: Directions
        field: location
      - type: share
        label: Invite a friend
        field: name
    roles:
    - user
    - organiser
    - moderator
    - admin
  - key: communities_map
    type: map
    title: Communities map
    source: collection:communities
    map:
      lat: lat
      lon: lon
      title: name
      popup:
      - category
      - area
    roles:
    - user
    - organiser
    - admin
  - key: events_list
    type: cards
    title: Events
    source: collection:events
    data:
      display: cards
      fields:
      - key: title
        label: Event
      - key: community_name
        label: Community
      - key: event_date
        label: Date
        format: date
      - key: place_name
        label: Place
      - key: ticket_price
        label: Price
        format: money
      - key: capacity
        label: Capacity
      sort:
        field: event_date
        dir: asc
      actions:
      - type: directions
        label: Directions
        field: location
      - type: calendar
        label: Add to calendar
        title: title
        start: event_date
        location: place_name
      - type: share
        label: Share
        field: title
    roles:
    - user
    - organiser
    - admin
  - key: events_map
    type: map
    title: Events map
    source: collection:events
    map:
      lat: lat
      lon: lon
      title: title
      popup:
      - community_name
      - event_date
      - place_name
      - ticket_price
    roles:
    - user
    - organiser
    - admin
  - key: join
    type: form
    title: Join a community
    collection: memberships
    fields:
    - community_name
    - organiser_email
    - member_name
    submit:
      label: Join
      message: Welcome to the community!
      redirect: my_communities
    roles:
    - user
    - organiser
    - admin
  - key: my_communities
    type: list
    title: My communities
    source: collection:memberships
    data:
      display: list
      fields:
      - key: community_name
        label: Community
    roles:
    - user
    - organiser
    - admin
  - key: book
    type: form
    title: Book a place
    collection: bookings
    fields:
    - event_title
    - event_date
    - organiser_email
    - member_name
    submit:
      label: Book my place
      message: You're booked. We'll remind you the day before.
      redirect: my_bookings
    roles:
    - user
    - organiser
    - admin
  - key: my_bookings
    type: list
    title: My bookings
    source: collection:bookings
    data:
      display: list
      fields:
      - key: event_title
        label: Event
      - key: event_date
        label: Date
        format: date
      - key: checked_in
        label: Checked in
        format: badge
      sort:
        field: event_date
        dir: asc
      actions:
      - type: calendar
        label: Add to calendar
        title: event_title
        start: event_date
    roles:
    - user
    - organiser
    - admin
  - key: chat_post
    type: form
    title: Send a message
    collection: messages
    fields:
    - community_name
    - recipient_email
    - text
    submit:
      label: Send
      message: Sent
    roles:
    - user
    - organiser
    - admin
  - key: report_form
    type: form
    title: Report someone
    collection: reports
    fields:
    - reported_email
    - message_text
    - reason
    submit:
      label: Send report
      message: Thanks, a moderator will review it.
    roles:
    - user
    - organiser
    - admin
  - key: block_form
    type: form
    title: Block someone
    collection: blocks
    fields:
    - blocked_email
    submit:
      label: Block
      message: Blocked
    roles:
    - user
    - organiser
    - admin
  - key: create_community
    type: form
    title: Create a community
    collection: communities
    fields:
    - name
    - category
    - description
    - photos
    - area
    - location
    - lat
    - lon
    - rules
    - organiser_email
    edit: true
    submit:
      label: Publish community
      message: Community published
    roles:
    - organiser
    - admin
  - key: create_event
    type: form
    title: Publish an event
    collection: events
    fields:
    - community_name
    - title
    - description
    - event_date
    - place_name
    - location
    - lat
    - lon
    - capacity
    - ticket_price
    - organiser_email
    edit: true
    submit:
      label: Publish event
      message: Event published
    roles:
    - organiser
    - admin
  - key: my_members
    type: table
    title: My members
    source: collection:memberships
    export: true
    data:
      display: table
      fields:
      - key: member_name
        label: Member
      - key: community_name
        label: Community
    roles:
    - organiser
    - admin
  - key: attendance
    type: table
    title: Attendance
    source: collection:bookings
    export: true
    data:
      display: table
      fields:
      - key: event_title
        label: Event
      - key: event_date
        label: Date
        format: date
      - key: member_name
        label: Member
      - key: checked_in
        label: Checked in
        format: badge
      groupBy:
        field: event_date
        bucket: month
        aggs:
        - key: attended
          agg: count
    roles:
    - organiser
    - admin
  - key: reported
    type: table
    title: Reports to review
    source: collection:reports
    data:
      display: table
      fields:
      - key: reported_email
        label: Reported
      - key: message_text
        label: Message
      - key: reason
        label: Reason
        format: badge
      - key: status
        label: Status
        format: badge
    roles:
    - moderator
    - admin
  - key: ask
    type: new_run
    title: Ask Kindred
    roles:
    - user
    - organiser
    - admin
  - key: history
    type: history
    title: My picks and drafts
    source: run
    roles:
    - user
    - organiser
    - admin
  - key: result
    type: report
    source: run
    printable: true
    nav: false
  - key: account
    type: account
    title: Plan
    roles:
    - organiser
    - user
  - key: admin_tabs
    type: tabs
    title: Admin
    children:
    - admin_overview
    - admin_users
    - admin_data
    roles:
    - admin
  - key: admin_overview
    type: admin
    title: Overview
    roles:
    - admin
    nav: false
  - key: admin_users
    type: admin
    title: Users
    roles:
    - admin
    nav: false
  - key: admin_data
    type: admin
    title: Data
    roles:
    - admin
    nav: false
  triggers:
  - key: event_reminder
    description: Push reminder the day before the event
    'on':
      date:
        collection: bookings
        field: event_date
        offsetDays: -1
        hour: 8
    notify:
      to: owner
      subject: 'Tomorrow: {record.event_title}'
      body: Your place at {record.event_title} is booked for tomorrow. See you there!
      link: my_bookings
  - key: booking_confirmed
    'on':
      collection: bookings
      op: insert
    notify:
      to:
      - owner
      - record.organiser_email
      subject: 'Booking confirmed: {record.event_title}'
      body: '{record.member_name} has a place at {record.event_title} on {record.event_date}.'
      link: my_bookings
  - key: new_report
    'on':
      collection: reports
      op: insert
    notify:
      to:
      - role:moderator
      - admins
      subject: New report to review
      body: A message was reported ({record.reason}). Please review it.
      link: reported
  billing:
    modes:
    - subscription
    - per_transaction
    currency: eur
    transactionFeePct: 8
    sellers: collection:communities
    plans:
    - key: organiser_pro
      price: 19
      interval: month
      label: Organiser Pro
      includes:
      - Unlimited communities and events
      - Paid tickets by card
      - Member and attendance exports
      - AI event copy
      roles:
      - organiser
  notifications:
    emailOnRunDone: true
  mobile:
    appId: eu.webrobot.kindred
    appName: Kindred
    capabilities:
    - name: location
      reason: To show communities and events near you
    - name: camera
      reason: To take photos for your community
    - name: calendar
      reason: To add events to your calendar
    - name: push
    - name: share
  extensions:
  - key: realtime_chat
    description: 'Real-time chat inside each community and private member-to-member chat is not available yet: messages are
      saved as records visible to the sender and moderators only. Blocking is stored but not yet enforced on delivery.'
  - key: friend_feed_invites
    description: Invite-by-link with attribution and a feed of what friends are joining need a friends graph and referral
      links that the runtime does not provide yet; the Invite a friend button shares the community text only.
  - key: ticket_checkout
    description: Card payment of tickets with the organiser's payout (revenue minus 8% fee) needs Stripe Connect onboarding
      per organiser and a ticket checkout flow; the plan and fee are declared, the per-event checkout is not.
  - key: moderation_actions
    description: Removing a user is done by admins on the Users tab; a moderator-only remove action is not available yet.
      Map views read numeric lat/lon, entered with the location field.
