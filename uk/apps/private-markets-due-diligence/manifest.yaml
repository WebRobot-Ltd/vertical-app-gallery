apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: dilivo
  displayName: Dilivo
  tagline:
    en: AI due diligence for private markets and alternative assets.
  description:
    en: Upload the data room, and a team of AI agents indexes it, fills your DDQ, checks the manager against public registers,
      searches the web, and drafts a due diligence report with red flags and follow-up questions. Your analysts review and
      approve; your investment committee decides.
  langs:
  - en
  defaultLang: en
  timezone: Europe/London
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12263f'
      accent: '#1f7a6d'
      background: '#f6f7f9'
      foreground: '#16202c'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Dili
      color: primary
    - text: vo
      color: accent
    width: wide
  header:
    links:
    - label: How it works
      href: '#how-it-works'
    - label: Sources
      href: '#sources'
    cta:
      label: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: analyst
      label: Analyst
      assignedBy: invite
    - key: ic
      label: Investment committee
      assignedBy: invite
  limits:
  - action: agent:lead
    per: user
    max: 10
    window: day
  egress:
    hosts:
    - api.company-information.service.gov.uk
    - efts.sec.gov
    - data.sec.gov
    notes: Companies House API (Open Government Licence, free API key set by the app admins); SEC EDGAR public APIs (public
      domain, fair-access policy with identifying User-Agent). FCA Register and ESMA registers are read as public web pages
      through the WebRobot MCP.
  data:
    credentials:
    - provider: companies_house
      kind: api_key
      scope: org
      label:
        en: Companies House API key
      help:
        en: Create a free key at developer.company-information.service.gov.uk, then paste it as base64 of "KEY:" (the key
          followed by a colon).
    collections:
    - name: deals
      description: Deals under due diligence (one record per manager/fund)
      ownedBy: user
      fields:
      - name: name
        type: text
        required: true
        label: Deal name
      - name: manager_name
        type: text
        required: true
        label: Manager name
      - name: strategy
        type: text
        required: true
        label: Strategy
      - name: fund_size_m
        type: number
        label: Fund size (millions)
      - name: vintage
        type: number
        label: Vintage (year)
      - name: target_close
        type: date
        label: Target close
      - name: asset_class
        type: select
        required: true
        label: Asset class
        options:
        - value: private_equity
          label: Private equity
        - value: private_credit
          label: Private credit
        - value: venture
          label: Venture capital
        - value: real_estate
          label: Real estate
        - value: infrastructure
          label: Infrastructure
        - value: hedge_funds
          label: Hedge funds
        - value: secondaries
          label: Secondaries
        - value: other
          label: Other alternatives
      - name: stage
        type: select
        label: Stage
        default: screening
        options:
        - value: screening
          label: Screening
        - value: data_room
          label: Data room
        - value: drafting
          label: Report drafting
        - value: review
          label: Analyst review
        - value: ic
          label: Investment committee
        - value: decided
          label: Decided
      - name: members
        type: multiselect
        label: Team members (emails)
        help: Emails of the colleagues who work on this deal
      access:
      - role: analyst
        where:
          members: '{user.email}'
        can:
        - read
        - write
    - name: data_room_index
      description: Indexed passages of the data room, with page and paragraph for citations
      ownedBy: user
      fields:
      - name: deal
        type: text
      - name: document
        type: text
      - name: file_id
        type: text
      - name: doc_type
        type: text
      - name: page
        type: number
      - name: paragraph
        type: number
      - name: text
        type: textarea
      - name: members
        type: multiselect
      searchable: true
      access:
      - role: analyst
        where:
          members: '{user.email}'
        can:
        - read
    - name: ddq_template
      description: The firm's standard DDQ questions, kept by the admins
      ownedBy: shared
      fields:
      - name: question_id
        type: text
        required: true
      - name: section
        type: text
      - name: question
        type: textarea
        required: true
    - name: ddq_answers
      description: DDQ answers drafted from the documents, with unanswered questions marked
      ownedBy: user
      fields:
      - name: deal
        type: text
      - name: question_id
        type: text
      - name: section
        type: text
      - name: question
        type: textarea
      - name: answer
        type: textarea
      - name: status
        type: select
        options:
        - value: answered
          label: Answered
        - value: partial
          label: Partial
        - value: unanswered
          label: Unanswered
      - name: citations
        type: textarea
      - name: members
        type: multiselect
      access:
      - role: analyst
        where:
          members: '{user.email}'
        can:
        - read
        - write
    - name: findings
      description: Registry checks and web findings on the manager and its entities
      ownedBy: user
      fields:
      - name: deal
        type: text
      - name: source
        type: text
      - name: category
        type: select
        options:
        - registry
        - regulatory
        - litigation
        - news
        - sanctions
        - other
      - name: severity
        type: select
        options:
        - info
        - low
        - medium
        - high
      - name: summary
        type: textarea
      - name: url
        type: url
      - name: members
        type: multiselect
      access:
      - role: analyst
        where:
          members: '{user.email}'
        can:
        - read
        - write
    - name: reports
      description: Draft and approved due diligence reports
      ownedBy: user
      fields:
      - name: deal
        type: text
      - name: title
        type: text
      - name: summary
        type: textarea
        label: Executive summary
      - name: red_flags
        type: textarea
        label: Red flags
      - name: followups
        type: textarea
        label: Follow-up questions for the manager
      - name: body
        type: textarea
        label: Full report
      - name: status
        type: select
        label: Status
        default: draft
        options:
        - value: draft
          label: Draft
        - value: in_review
          label: In review
        - value: approved
          label: Approved
      - name: members
        type: multiselect
      access:
      - role: analyst
        where:
          members: '{user.email}'
        can:
        - read
        - write
      - role: ic
        where:
          members: '{user.email}'
          status: approved
        can:
        - read
    - name: ic_decisions
      description: Investment committee decisions on approved reports
      ownedBy: user
      fields:
      - name: report
        type: relation
        relation: reports
        required: true
        label: Report
      - name: decision
        type: select
        required: true
        label: Decision
        options:
        - value: approve
          label: Approve
        - value: approve_conditions
          label: Approve with conditions
        - value: defer
          label: Defer
        - value: decline
          label: Decline
      - name: conditions
        type: textarea
        label: Conditions
      - name: rationale
        type: textarea
        required: true
        label: Rationale
      - name: decided_on
        type: date
        label: Date
      access:
      - role: analyst
  agents:
  - key: lead
    role: main
    description: Coordinates the four specialists and drafts the due diligence report.
    delegates:
    - indexer
    - ddq_filler
    - registry
    - research
    context:
    - key: manager
      from: collection:deals.manager_name
    - key: strategy
      from: collection:deals.strategy
    - key: fund_size
      from: collection:deals.fund_size_m
    - key: vintage
      from: collection:deals.vintage
    - key: asset_class
      from: collection:deals.asset_class
    - key: target_close
      from: collection:deals.target_close
    - key: members_list
      from: collection:deals.members
    goalTemplate: 'Deal record id: {deal}

      Manager: {manager}

      Strategy: {strategy}

      Asset class: {asset_class}

      Fund size (millions): {fund_size}

      Vintage: {vintage}

      Target close: {target_close}

      Deal team emails: {members_list}

      {?data_room}Uploaded data room files (names and ids): {data_room}{/data_room}

      {?notes}Analyst notes: {notes}{/notes}

      Today is {date}. Work in this order: ask_indexer (give it the file ids, the deal id and the team emails), then ask_ddq_filler,
      then ask_registry and ask_research, then write the report. Write in the language with ISO code {lang}.'
    appTools:
    - name: read_index
      description: Search the indexed data room passages
      action: search
      collection: data_room_index
      scope: user
    - name: read_ddq_answers
      description: Read the drafted DDQ answers
      action: read
      collection: ddq_answers
      scope: user
    - name: read_findings
      description: Read registry and web findings
      action: read
      collection: findings
      scope: user
    - name: save_report
      description: Save the draft report as a record (status draft) with the deal id and team emails
      action: write
      collection: reports
      scope: user
    output: markdown
    limits:
      maxTurns: 40
      maxBudgetUsd: 2.0
    profile:
      inline:
        display_name: Dilivo lead
        crews:
        - id: lead
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 2.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the lead of a due diligence team for institutional investors in private markets. You delegate
            to your specialists, then write a draft due diligence report from what they stored (read_index, read_ddq_answers,
            read_findings). Never invent facts or figures: every statement is backed by a data room citation (document, page,
            paragraph) or a finding with its source; say plainly when evidence is missing. You give analysis for professionals,
            not investment, legal or tax advice. Commercial fund performance data is used only if the customer connected a
            licence; otherwise do not quote any third-party performance figures. The final answer starts with a level-1 title
            "# Due diligence report — <manager> (<strategy>)". Sections with ## headings: Executive summary; Manager and entities;
            Strategy and terms (LPA/PPM); Team and governance; Financials; Legal and regulatory; Operations and compliance;
            DDQ coverage (answered / partial / unanswered counts); Red flags (a table: severity, issue, evidence, source);
            Follow-up questions for the manager (numbered); Sources. Then call save_report once with fields deal (the deal
            record id), title, summary, red_flags, followups, body (the full report), status draft and members (the deal team
            emails).'
  - key: indexer
    role: helper
    description: Reads and indexes the data room, including scanned pages.
    appTools:
    - name: read_upload
      description: Read a file the user uploaded (text, tables, OCR for scans), page by page
      action: read_file
    - name: index_passage
      description: Store one indexed passage of a document
      action: append
      collection: data_room_index
      scope: user
    output: markdown
    limits:
      maxTurns: 80
      maxBudgetUsd: 3.0
    profile:
      inline:
        display_name: Dilivo indexer
        crews:
        - id: indexer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 80
          max_budget_usd: 3.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You index a data room. For each file id you are given, call read_upload, identify the document type
            (LPA, PPM, DDQ, financial statements, other) and store the substantive passages with index_passage: deal (the
            deal id), document (file name), file_id, doc_type, page, paragraph (numbering within the page), text (faithful
            extract, key terms and figures kept verbatim) and members (the deal team emails you were given). Cover fees, carry,
            key-person, term, investment restrictions, governance, conflicts, valuation, audit, litigation and financial figures
            first. For scanned pages rely on OCR and flag low legibility in the text. Never invent content. Reply with a short
            list of documents indexed and anything unreadable.'
  - key: ddq_filler
    role: helper
    description: Fills the standard DDQ template from the indexed documents.
    appTools:
    - name: read_index
      description: Search the indexed data room passages
      action: search
      collection: data_room_index
      scope: user
    - name: read_ddq_template
      description: Read the firm's standard DDQ questions
      action: read
      collection: ddq_template
      scope: all
    - name: save_ddq_answer
      description: Store the answer to one DDQ question
      action: append
      collection: ddq_answers
      scope: user
    output: markdown
    limits:
      maxTurns: 60
      maxBudgetUsd: 2.0
    profile:
      inline:
        display_name: Dilivo DDQ filler
        crews:
        - id: ddq_filler
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 60
          max_budget_usd: 2.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You fill the firm's standard DDQ from the data room only. Read the template with read_ddq_template.
            For each question search the index with read_index and call save_ddq_answer with deal, question_id, section, question,
            answer, status (answered, partial or unanswered), citations (document, page, paragraph) and members (the deal
            team emails). Answer only from the documents; if the documents do not say, status is unanswered and the answer
            is empty. Never guess. Reply with the counts per status.
  - key: registry
    role: helper
    description: Checks the manager and its entities against Companies House, the FCA Register, and SEC/ESMA filings.
    appTools:
    - name: ch_search
      description: Search Companies House for a company or officer name (query q)
      action: http
      http:
        method: GET
        url: https://api.company-information.service.gov.uk/search/companies
        attribution: Companies House, Open Government Licence v3.0
        credential:
          provider: companies_house
          header: Authorization
          format: Basic {secret}
    - name: ch_company
      description: 'Companies House record by number: path /<number>, /<number>/officers, /<number>/persons-with-significant-control,
        /<number>/filing-history, /<number>/charges'
      action: http
      http:
        method: GET
        url: https://api.company-information.service.gov.uk/company
        allowPath: true
        attribution: Companies House, Open Government Licence v3.0
        credential:
          provider: companies_house
          header: Authorization
          format: Basic {secret}
    - name: sec_search
      description: SEC EDGAR full-text search (query q, optional forms, dateRange)
      action: http
      http:
        method: GET
        url: https://efts.sec.gov/LATEST/search-index
        headers:
          User-Agent: Dilivo due diligence support@dilivo.app
        attribution: SEC EDGAR, public domain
    - name: sec_submissions
      description: 'SEC filings of an entity: path /CIK##########.json'
      action: http
      http:
        method: GET
        url: https://data.sec.gov/submissions
        allowPath: true
        headers:
          User-Agent: Dilivo due diligence support@dilivo.app
        attribution: SEC EDGAR, public domain
    - name: save_finding
      description: Store one finding
      action: append
      collection: findings
      scope: user
    output: markdown
    limits:
      maxTurns: 30
      maxBudgetUsd: 1.5
    profile:
      inline:
        display_name: Dilivo registry checker
        crews:
        - id: registry
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You verify a fund manager and its entities against public registers. Use ch_search and ch_company
            for UK entities (status, incorporation date, officers, persons with significant control, charges, overdue filings,
            disqualified directors); sec_search and sec_submissions for SEC registrants (Form ADV, Form D, enforcement mentions);
            and, through the WebRobot MCP, scrape the public FCA Register (register.fca.org.uk) and the ESMA registers (AIFMD/UCITS
            managers) for authorisation status, permissions, disciplinary history and passporting. Compare what you find with
            what the documents claim (names, dates, addresses, regulatory status) and store each result with save_finding:
            deal, source, category (registry or regulatory), severity, summary, url and members (the deal team emails). Report
            only what the registers show; if an entity cannot be found, say so and record it as a finding of medium severity.
            Never present a name match as certain identity.'
  - key: research
    role: helper
    description: Searches the web for news, litigation and reputational issues.
    appTools:
    - name: save_finding_web
      description: Store one web finding
      action: append
      collection: findings
      scope: user
    output: markdown
    limits:
      maxTurns: 30
      maxBudgetUsd: 1.5
    profile:
      inline:
        display_name: Dilivo web researcher
        crews:
        - id: research
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You research a fund manager, its principals and entities on the open web through the WebRobot MCP:
            news, litigation and court records, regulatory actions, investor complaints, departures of key people, press on
            past funds. For each relevant item call save_finding_web with deal, source, category (litigation, news, sanctions
            or other), severity (info, low, medium, high), a factual summary with the date, the url and members (the deal
            team emails). Prefer primary sources, flag unverified or old claims as such, never repeat allegations as facts,
            and do not use paywalled commercial performance databases. Reply with a short list of what you stored.'
  - key: qa
    role: helper
    description: Answers questions about a deal's data room with citations.
    appTools:
    - name: read_index
      description: Search the indexed data room passages
      action: search
      collection: data_room_index
      scope: user
    goalTemplate: 'Conversation so far:

      {history}


      New question: {message}

      Answer in the language with ISO code {lang}.'
    output: markdown
    limits:
      maxTurns: 10
      maxBudgetUsd: 0.3
    profile:
      inline:
        display_name: Dilivo data room Q&A
        crews:
        - id: qa
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You answer analysts' questions about a data room using only read_index. Cite every statement as (document,
            page, paragraph). If the passages do not answer, say the data room does not contain it and suggest a follow-up
            question for the manager. If several deals match, ask which one. Never invent figures.
  inputForm:
    title: Process a data room
    fields:
    - name: deal
      type: select
      required: true
      label: Deal
      optionsFrom: collection:deals
    - name: data_room
      type: file
      required: true
      label: Data room files
      accept:
      - pdf
      - docx
      - xlsx
      maxMb: 15
      multiple: true
      extract: none
      help: 'LPA, PPM, DDQ, financial statements; scans are read with OCR. Up to 10 files per run: run again to add more.'
    - name: notes
      type: textarea
      maxLength: 600
      label: Focus areas (optional)
  views:
  - key: home
    type: page
    nav: false
    title: Dilivo
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow: Due diligence for private markets
      title: From data room to **draft report** in one run.
      text: Dilivo indexes your data room, fills your DDQ, checks the manager against public registers, searches for news
        and litigation, and drafts a report with red flags and follow-up questions. Your analysts review it; your committee
        decides.
      actions:
      - label: Sign in
        href: /login
        style: primary
      aside: '<div style="padding:16px"><b>Red flags</b><br>High: manager not found on the FCA Register under the name in
        the PPM<br>Medium: key-person clause differs between LPA and DDQ<br><br><b>DDQ</b>: 74 answered, 9 partial, 12 unanswered</div>'
    - type: steps
      id: how-it-works
      title: How it works
      items:
      - title: Create the deal
        text: Manager, strategy, fund size, vintage, target close, asset class.
      - title: Upload the data room
        text: LPAs, PPMs, DDQs, financial statements in PDF, DOCX, XLSX, scans included.
      - title: Agents work step by step
        text: Index with citations, DDQ draft, registry checks, web research.
      - title: Review and decide
        text: Analysts edit and approve each report; the committee sees approved reports and records a decision.
    - type: cards
      id: sources
      title: Sources
      items:
      - title: Companies House
        text: Entities, officers, control, filings.
      - title: FCA Register and ESMA
        text: Authorisations, permissions, disciplinary history.
      - title: SEC EDGAR
        text: Registrants and filings.
      - title: Open web
        text: News, litigation, reputational issues.
    - type: note
      content: Decision support for professional investors, not investment, legal or tax advice. Commercial performance data
        is used only with your own licence.
  - key: new_deal
    type: form
    title: New deal
    collection: deals
    fields:
    - name
    - manager_name
    - strategy
    - fund_size_m
    - vintage
    - target_close
    - asset_class
    - members
    submit:
      label: Create deal
      message: Deal created. Upload its data room next.
      redirect: data_room
    roles:
    - analyst
    - admin
  - key: deal_edit
    type: form
    title: Edit deal
    collection: deals
    edit: true
    submit:
      label: Save
      message: Deal updated.
    nav: false
    roles:
    - analyst
    - admin
  - key: data_room
    type: new_run
    title: Upload data room
    roles:
    - analyst
    - admin
  - key: runs
    type: history
    title: Processing history
    source: run
    roles:
    - analyst
    - admin
  - key: run_report
    type: report
    source: run
    printable: true
    nav: false
    title: Run report
  - key: pipeline
    type: page
    title: Pipeline
    roles:
    - analyst
    - admin
    sections:
    - type: data
      title: Deals by stage
      source: collection:deals
      display: chart
      chart: bar
      fields:
      - key: stage
        label: Stage
      - key: count
        label: Deals
      groupBy:
        field: stage
        aggs:
        - key: fund
          agg: sum
          field: fund_size_m
    - type: data
      title: Deals
      source: collection:deals
      display: table
      fields:
      - key: name
        label: Deal
      - key: manager_name
        label: Manager
      - key: asset_class
        label: Asset class
        format: badge
      - key: fund_size_m
        label: Fund size (m)
        format: number
      - key: target_close
        label: Target close
        format: date
      - key: stage
        label: Stage
        format: badge
      sort:
        field: target_close
        dir: asc
      limit: 100
      empty: No deals yet.
  - key: deals
    type: table
    title: Deals
    source: collection:deals
    columns:
    - name
    - manager_name
    - asset_class
    - fund_size_m
    - vintage
    - target_close
    - stage
    export: true
    roles:
    - analyst
    - admin
  - key: ask
    type: chat
    title: Ask the data room
    source: agent:qa
    examples:
    - What are the management fee and carry in the LPA?
    - Is there a key-person clause?
    - Which entities are named as general partner?
    placeholder: Ask a question, with the deal name
    roles:
    - analyst
    - admin
  - key: ddq
    type: table
    title: DDQ answers
    source: collection:ddq_answers
    columns:
    - section
    - question_id
    - question
    - answer
    - status
    - citations
    export: true
    roles:
    - analyst
    - admin
  - key: findings_view
    type: table
    title: Registry and web findings
    source: collection:findings
    columns:
    - category
    - severity
    - source
    - summary
    - url
    export: true
    roles:
    - analyst
    - admin
  - key: reports
    type: table
    title: Reports
    source: collection:reports
    columns:
    - title
    - status
    - summary
    roles:
    - analyst
    - admin
  - key: report_review
    type: form
    title: Review report
    collection: reports
    fields:
    - title
    - summary
    - red_flags
    - followups
    - body
    - status
    edit: true
    submit:
      label: Save
      message: Report saved. Set the status to Approved to release it to the committee.
    nav: false
    roles:
    - analyst
    - admin
  - key: ic_reports
    type: cards
    title: Approved reports
    source: collection:reports
    data:
      display: cards
      fields:
      - key: title
        label: Report
      - key: summary
        label: Summary
      - key: red_flags
        label: Red flags
      - key: followups
        label: Follow-ups
      - key: body
        label: Full report
      filters:
      - field: status
        op: '='
        value: approved
      limit: 50
      empty: No approved reports yet.
    roles:
    - ic
    - admin
  - key: ic_decision
    type: form
    title: Record a decision
    collection: ic_decisions
    fields:
    - report
    - decision
    - conditions
    - rationale
    - decided_on
    submit:
      label: Record decision
      message: Decision recorded.
    roles:
    - ic
    - admin
  - key: decisions
    type: table
    title: Decisions
    source: collection:ic_decisions
    columns:
    - report
    - decision
    - conditions
    - rationale
    - decided_on
    export: true
    roles:
    - ic
    - analyst
    - admin
  - key: account
    type: account
    title: Plan and credits
    roles:
    - analyst
    - admin
  triggers:
  - key: report_approved
    'on':
      collection: reports
      op: update
      where:
        status: approved
    notify:
      to:
      - role:ic
      subject: 'Report approved: {record.title}'
      body: A due diligence report has been approved by the analyst and is ready for the investment committee.
      link: ic_reports
  - key: decision_recorded
    'on':
      collection: ic_decisions
      op: insert
    notify:
      to:
      - role:analyst
      - admins
      subject: 'IC decision recorded: {record.decision}'
      body: 'The investment committee recorded a decision. Rationale: {record.rationale}'
      link: decisions
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 0
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:lead:
        estimate: 200
        metered: true
      agent:qa:
        estimate: 3
        metered: true
    packs:
    - key: dataroom_5
      credits: 1000
      price: 10
      label: Data room pack
    - key: dataroom_25
      credits: 5000
      price: 45
      label: Data room pack XL
    plans:
    - key: seat
      price: 149
      interval: month
      label: Per seat
      credits: 300
      creditsReset: monthly
      roles:
      - analyst
      - ic
      - admin
      includes:
      - Workspace seat for one analyst or committee member
      - 300 credits per month
  notifications:
    emailOnRunDone: true
  extensions:
  - key: seat_management
    description: 'Per-seat subscription: the seat count follows the invited analysts and committee members; automatic seat
      counting and billing per seat is not available yet, so the owner adjusts seats in Stripe.'
  - key: licensed_performance_data
    description: 'Commercial fund performance data (licensed databases) is not wired in: it needs the customer''s own licence
      and API host. Add a credential and an http tool once the provider is known; until then the agents use no third-party
      performance figures.'
  - key: fca_api_and_esma_files
    description: The FCA Register API needs two headers (email and key); until that is supported the FCA Register and ESMA
      registers are read as public web pages through the WebRobot MCP.
