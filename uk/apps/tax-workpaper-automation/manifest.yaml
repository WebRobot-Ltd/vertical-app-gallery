  notifications:
    emailOnRunDone: true
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 20
    costs:
      agent:preparer: 25
    packs:
    - key: returns_100
      credits: 100
      price: 90
      label:
        en: 100 credits (4 returns)
        nl: 100 tegoed (4 aangiftes)
    - key: returns_500
      credits: 500
      price: 400
      label:
        en: 500 credits (20 returns)
        nl: 500 tegoed (20 aangiftes)
    plans:
    - key: seat
      price: 59
      interval: month
      label:
        en: Taxloom seat (per user)
        nl: Taxloom-licentie (per gebruiker)
      credits: 50
      creditsReset: monthly
      roles:
      - partner
      - admin
  egress:
    hosts:
    - www.gov.uk
    - www.legislation.gov.uk
    notes: 'GOV.UK search and content APIs (HMRC internal manuals) and legislation.gov.uk: both published under the Open Government
      Licence v3.0, reuse allowed with attribution.'
  extensions:
  - key: oauth_connectors
    description: 'Connecting practice management and ledger software by OAuth (client lists, figures) is not available yet.
      Until then: import client lists as CSV on the data page and upload trial balances as files; an API-key connector can
      be added when the software offers one.'
  - key: seat_pricing
    description: Per-seat billing is modelled as a monthly plan bought by each partner/admin; automatic seat counting per
      firm is not available.
  - key: hmrc_filing
    description: Filing and MTD submissions are done by the firm in HMRC-recognised software; Taxloom only prepares and tracks.
