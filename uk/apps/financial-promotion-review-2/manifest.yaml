apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: finvetta
  displayName: Finvetta
  tagline:
    en: Financial promotions reviewed against the FCA rules before they go live.
  description:
    en: Marketers submit a financial promotion. An AI agent checks it against the FCA Handbook, the s21 FSMA regime, Consumer
      Duty and ASA rulings, and marks up every problem with a citation and a rewrite. A compliance reviewer signs it off,
      and every decision is kept in an audit log.
  langs:
  - en
  defaultLang: en
  timezone: Europe/London
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12304a'
      accent: '#0b7a75'
      background: '#f6f8fa'
      foreground: '#16222e'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Fin
      color: primary
    - text: vetta
      color: accent
  header:
    links:
    - label: How it works
      href: '#how'
    - label: Rules covered
      href: '#rules'
    cta:
      label: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: reviewer
      label: Compliance reviewer
      assignedBy: invite
    - key: marketer
      label: Marketer
      assignedBy: signup
  limits:
  - action: agent:reviewer
    per: user
    max: 30
    window: day
    roles:
    - marketer
  agents:
  - key: reviewer
    role: main
    description: Extracts and reads the promotion, checks the firm on the FCA Register, tests the content against the rules
      and marks it up.
    profile:
      inline:
        display_name: Finvetta promotion reviewer
        crews:
        - id: reviewer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You are a UK financial promotions compliance analyst preparing a first-pass review for a human compliance
            reviewer. You never approve anything: a human signs off.


            INPUT: the promotion text pasted by the marketer, the extracted text of uploaded PDFs/Word files, and any uploaded
            images (banners, social graphics, brochure scans). For images and scans call the read_upload tool with each file
            id and read the text (OCR). For video ads the marketer supplies a transcript in the form; if none is given for
            a video, say so plainly and review only what you were given. Never invent text that was not in the material.


            FIRM CHECK: if a firm reference number (FRN) is given, call fca_firm with path /<FRN> and report the firm''s status
            and whether its permissions cover the product type. If the call fails or no FRN was given, say the check could
            not be done; do not guess.


            RULES: test the promotion against COBS 4 (fair, clear and not misleading; balanced risk warnings; past performance;
            prominence), the s21 FSMA financial promotion restriction and its exemptions (approver status, the firm''s permissions,
            high-risk investment and cryptoasset regimes, appropriate target audience), the Consumer Duty (consumer understanding,
            vulnerable customers, avoiding foreseeable harm) and published ASA/CAP rulings and the CAP Code for the channel.
            Use the webrobot tools to open the FCA Handbook (handbook.fca.org.uk) and asa.org.uk rulings when you need the
            exact wording; cite only rules and rulings you have read. Quote section numbers (e.g. COBS 4.2.1R) and ruling
            references. If unsure, say it is a point for the reviewer instead of asserting a breach. This is decision support,
            not legal advice.


            FOR EVERY FLAGGED SENTENCE call add_finding once with: review_title (the promotion title), excerpt (the exact
            sentence), rule (short rule name), citation (e.g. COBS 4.2.1R or ASA ruling ref), severity (critical, major or
            minor), rewrite (a compliant suggested rewrite), reviewer_decision "pending".


            REPORT (Markdown): a level-1 title "# Promotion review — <title>". Then ## Summary (verdict, headline reasons),
            ## Firm permissions, ## Marked-up promotion (the full text with each flagged sentence in **bold** followed by
            [F1], [F2]...), ## Findings (a table: #, sentence, rule and citation, severity, suggested rewrite), ## Missing
            or weak risk warnings, ## Audience and Consumer Duty notes, ## Points for the reviewer. Add a chart block when
            useful for counts per severity.


            Finish with one fenced json block: {"title":..,"product_type":..,"channel":..,"audience":..,"launch_date":..,"firm_frn":..,"firm_status":..,"verdict":"compliant|minor_changes|major_changes|reject","max_severity":"none|minor|major|critical","finding_count":N,"summary":"two
            sentences"}. Then call request_signoff with that title and verdict so a human reviewer decides. Write in English.'
    goalTemplate: 'Review this financial promotion.

      Title: {title}

      Product type: {product_type_label}

      Channel: {channel_label}

      Target audience: {audience_label}

      Risk warnings included by the marketer: {risk_warnings}

      Intended launch date: {launch_date}

      {?frn}Firm reference number (FRN): {frn}{/frn}{!frn}No FRN given.{/frn}

      {?copy}Promotion text:

      {copy}{/copy}

      {?transcript}Video transcript:

      {transcript}{/transcript}

      {?files}Uploaded files (ids): {files}{/files}

      {?files_text}Extracted text of the files:

      {files_text}{/files_text}

      Write the review in English. Today is {date}.'
    output: markdown+json
    resultSchema:
      type: object
      properties:
        title:
          type: string
        product_type:
          type: string
        channel:
          type: string
        audience:
          type: string
        launch_date:
          type: string
        firm_frn:
          type: string
        firm_status:
          type: string
        verdict:
          type: string
        max_severity:
          type: string
        finding_count:
          type: number
        summary:
          type: string
    writesTo:
      collection: reviews
      parse: json_last
    awaits:
    - signoff
    appTools:
    - name: read_upload
      description: Read a file the user uploaded (image or scan, OCR included) by file id
      action: read_file
    - name: fca_firm
      description: 'Look up a firm on the FCA Register by FRN (path /<FRN>): status and permissions'
      action: http
      http:
        method: GET
        url: https://register.fca.org.uk/services/V0.1/Firm
        allowPath: true
        headers:
          Accept: application/json
        attribution: FCA Financial Services Register
        credential:
          provider: fca_register
          header: X-Auth-Key
          format: '{secret}'
    - name: add_finding
      description: Record one flagged sentence with its rule, citation, severity and suggested rewrite
      action: append
      collection: findings
      scope: user
    limits:
      maxTurns: 40
      maxBudgetUsd: 1.5
  - key: guidance
    role: scheduled
    description: Every week collects new FCA guidance and ASA rulings relevant to financial promotions.
    profile:
      inline:
        display_name: Finvetta guidance watcher
        crews:
        - id: guidance
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 1
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You monitor new UK financial promotions guidance. Using the webrobot tools, read the FCA news, publications,
            Handbook notices and policy statements (fca.org.uk, handbook.fca.org.uk) and new ASA rulings on financial advertising
            (asa.org.uk) published in the last 7 days. Start with the level-1 title "# Finvetta guidance digest — week of
            <date>". Sections: ## New FCA guidance (title, date, link, what changed, which promotion types and channels it
            affects), ## New ASA rulings, ## What reviewers should check this week. List only items you have actually read
            with their links; if nothing is new, say so. Never invent items. Write in English.'
    goalTemplate: Prepare the weekly digest. Today is {date}.
    output: markdown
    writesTo:
      collection: guidance_updates
      parse: whole
  inputForm:
    title: Submit a promotion for review
    fields:
    - name: title
      type: text
      required: true
      label: Promotion title
      maxLength: 120
    - name: product_type
      type: select
      required: true
      label: Product type
      options:
      - value: investment
        label: Investment / funds
      - value: crypto
        label: Cryptoassets
      - value: credit
        label: Consumer credit / BNPL
      - value: mortgage
        label: Mortgages
      - value: insurance
        label: Insurance
      - value: pension
        label: Pensions
      - value: payments
        label: Payments / e-money
      - value: other
        label: Other
    - name: channel
      type: select
      required: true
      label: Channel
      options:
      - value: web
        label: Web copy
      - value: email
        label: Email
      - value: social
        label: Social post
      - value: brochure
        label: PDF brochure
      - value: banner
        label: Banner image
      - value: video
        label: Short video ad
    - name: audience
      type: select
      required: true
      label: Target audience
      options:
      - value: retail
        label: Retail consumers
      - value: retail_vulnerable
        label: Retail incl. potentially vulnerable
      - value: hnw
        label: High net worth / sophisticated
      - value: professional
        label: Professional clients
    - name: risk_warnings
      type: boolean
      label: Risk warnings included
      default: false
    - name: launch_date
      type: date
      required: true
      label: Intended launch date
    - name: frn
      type: text
      label: Firm reference number (FRN)
      help: Used to check the firm's permissions on the FCA Register
      maxLength: 10
    - name: copy
      type: textarea
      label: Promotion text
      maxLength: 20000
      help: Paste web, email or social copy
    - name: transcript
      type: textarea
      label: Video transcript
      maxLength: 8000
      help: For a video ad paste the transcript, or describe the voiceover
    - name: files
      type: file
      label: Files (PDF, Word, image)
      accept:
      - pdf
      - docx
      - txt
      - jpg
      - jpeg
      - png
      - webp
      maxMb: 15
      multiple: true
  data:
    collections:
    - name: reviews
      ownedBy: user
      description: One record per reviewed promotion (the agent's summary and verdict). Reviewers see all of them.
      retentionDays: 1825
      fields:
      - name: title
        type: text
      - name: product_type
        type: text
      - name: channel
        type: text
      - name: audience
        type: text
      - name: launch_date
        type: date
      - name: firm_frn
        type: text
      - name: firm_status
        type: text
      - name: verdict
        type: select
        options:
        - compliant
        - minor_changes
        - major_changes
        - reject
      - name: max_severity
        type: select
        options:
        - none
        - minor
        - major
        - critical
      - name: finding_count
        type: number
      - name: summary
        type: textarea
      access:
      - role: reviewer
        can:
        - read
        - write
    - name: findings
      ownedBy: user
      description: Each flagged sentence with rule, citation, severity, rewrite and the reviewer's decision
      retentionDays: 1825
      fields:
      - name: review_title
        type: text
      - name: excerpt
        type: textarea
      - name: rule
        type: text
      - name: citation
        type: text
      - name: severity
        type: select
        options:
        - critical
        - major
        - minor
      - name: rewrite
        type: textarea
      - name: reviewer_decision
        type: select
        label: Decision
        options:
        - pending
        - accepted
        - edited
        - rejected
        default: pending
      - name: reviewer_rewrite
        type: textarea
        label: Edited rewrite
      - name: reviewer_note
        type: textarea
        label: Note to the marketer
      access:
      - role: reviewer
        can:
        - read
        - write
    - name: audit_log
      ownedBy: org
      description: Every sign-off decision, kept for audit
      retentionDays: 3650
      fields:
      - name: title
        type: text
      - name: decision
        type: text
      - name: decided_by
        type: text
      - name: decided_at
        type: date
      - name: comment
        type: textarea
      access:
      - role: reviewer
    - name: guidance_updates
      ownedBy: app
      description: Weekly digests of new FCA guidance and ASA rulings
      fields:
      - name: title
        type: text
      - name: content
        type: textarea
      - name: date
        type: date
    credentials:
    - provider: fca_register
      kind: api_key
      scope: org
      label: FCA Register API key
      help: Register for the FCA Financial Services Register API and paste the key here (admins only).
  egress:
    hosts:
    - register.fca.org.uk
    notes: FCA Financial Services Register API, used to confirm a firm's status and permissions; key held by the app's admins.
  approvals:
  - key: signoff
    title: Compliance sign-off
    description: A compliance reviewer approves the promotion or asks the marketer for changes. Nothing is approved without
      this.
    role: reviewer
    decidedBy: role
    fields:
    - title
    - verdict
  triggers:
  - key: audit_decision
    'on':
      approval: signoff
      decision: any
    write:
      collection: audit_log
  - key: notify_approved
    'on':
      approval: signoff
      decision: approved
    notify:
      to: owner
      subject: Your promotion has been approved
      body: A compliance reviewer has signed off your promotion. You can see the review and the decision in Finvetta.
      link: my_reviews
  - key: notify_changes
    'on':
      approval: signoff
      decision: rejected
    notify:
      to: owner
      subject: Changes requested on your promotion
      body: A compliance reviewer has asked for changes before this promotion can go live. Open the review to see the notes
        and the suggested rewrites.
      link: my_reviews
  - key: new_review_queue
    'on':
      collection: reviews
      op: insert
    notify:
      to: role:reviewer
      subject: 'New promotion to review: {record.title}'
      body: 'A promotion is waiting for your sign-off: {record.title} (AI verdict: {record.verdict}, {record.finding_count}
        findings).'
      link: queue
  schedules:
  - agent: guidance
    cron: 0 7 * * 1
    action: run
    owner: app
    goal: Prepare the weekly digest of new FCA guidance and ASA rulings on financial promotions.
    deliver:
      to:
      - role:reviewer
      - admins
      subject: 'Finvetta weekly digest: new FCA guidance'
      onlyIfNew: true
  notifications:
    emailOnRunDone: true
  views:
  - key: home
    type: page
    title: Finvetta
    nav: false
    sections:
    - type: hero
      eyebrow: Financial promotions compliance
      title: Know what the **FCA will flag** before your promotion goes live.
      text: Upload web copy, emails, social posts, brochures, banners or video scripts. Finvetta marks up every risky sentence
        with the rule, a citation, a severity and a rewrite, and a compliance reviewer signs off.
      actions:
      - label: Submit a promotion
        href: /v/new_review
        style: primary
      - label: Sign in
        href: /login
        style: ghost
      note: A human reviewer always makes the final decision.
    - type: steps
      id: how
      title: How it works
      items:
      - title: Submit
        text: 'Marketers fill a short form and upload the promotion: text, PDF, image or video transcript.'
      - title: AI mark-up
        text: The agent reads files and images, checks the firm on the FCA Register and tests the content against the rules.
      - title: Human sign-off
        text: Reviewers accept or edit each suggestion, ask for changes or approve. Every decision is logged.
    - type: cards
      id: rules
      title: What we check against
      items:
      - title: COBS 4
        text: Fair, clear and not misleading; balanced risk warnings; prominence.
        badge: 📘
      - title: s21 FSMA
        text: The financial promotion restriction, approvers and exemptions, audience.
        badge: ⚖️
      - title: Consumer Duty
        text: Consumer understanding, vulnerable customers, foreseeable harm.
        badge: 🛡️
      - title: ASA rulings
        text: Published ASA and CAP Code decisions on financial advertising.
        badge: 📣
    - type: note
      content: Finvetta supports compliance reviewers; it is not legal advice and does not approve promotions. The regulated
        firm remains responsible for every promotion it communicates or approves.
  - key: new_review
    type: new_run
    title: Submit a promotion
    roles:
    - marketer
    - admin
  - key: my_reviews
    type: history
    title: My promotions
    source: run
    roles:
    - marketer
    - admin
  - key: report
    type: report
    title: Review
    source: run
    printable: true
    nav: false
  - key: queue
    type: table
    title: Review queue
    source: collection:reviews
    roles:
    - reviewer
    - admin
    export: true
    data:
      display: table
      fields:
      - key: title
        label: Promotion
      - key: channel
        label: Channel
      - key: product_type
        label: Product
      - key: launch_date
        label: Launch
        format: date
      - key: firm_status
        label: Firm
      - key: verdict
        label: AI verdict
        format: badge
      - key: max_severity
        label: Max severity
        format: badge
      - key: finding_count
        label: Findings
        format: number
      sort:
        field: launch_date
        dir: asc
      limit: 200
  - key: finding_list
    type: table
    title: Findings
    source: collection:findings
    roles:
    - reviewer
    - admin
    data:
      display: table
      fields:
      - key: review_title
        label: Promotion
      - key: excerpt
        label: Flagged sentence
      - key: rule
        label: Rule
      - key: citation
        label: Citation
      - key: severity
        label: Severity
        format: badge
      - key: rewrite
        label: Suggested rewrite
      - key: reviewer_decision
        label: Decision
        format: badge
      limit: 200
  - key: finding_edit
    type: form
    title: Review a finding
    collection: findings
    fields:
    - reviewer_decision
    - reviewer_rewrite
    - reviewer_note
    edit: true
    submit:
      label: Save decision
      message: Decision saved.
      redirect: finding_list
    roles:
    - reviewer
    nav: false
  - key: signoffs
    type: approvals
    title: Sign-off
    approvals:
    - signoff
    roles:
    - reviewer
    - admin
  - key: audit
    type: table
    title: Audit log
    source: collection:audit_log
    roles:
    - reviewer
    - admin
    export: true
    data:
      display: table
      fields:
      - key: title
        label: Promotion
      - key: decision
        label: Decision
        format: badge
      - key: decided_by
        label: Decided by
      - key: decided_at
        label: When
        format: date
      - key: comment
        label: Comment
      sort:
        field: decided_at
        dir: desc
      limit: 200
  - key: turnaround
    type: table
    title: Decisions per week
    source: collection:audit_log
    nav: false
    data:
      display: chart
      chart: bar
      fields:
      - key: decided_at
      - key: total
      groupBy:
        field: decided_at
        bucket: week
        aggs:
        - key: total
          agg: count
  - key: issues
    type: table
    title: Recurring issues
    source: collection:findings
    nav: false
    data:
      display: chart
      chart: bar
      fields:
      - key: rule
      - key: total
      groupBy:
        field: rule
        aggs:
        - key: total
          agg: count
      limit: 15
  - key: volume
    type: table
    title: Promotions per month
    source: collection:reviews
    nav: false
    data:
      display: chart
      chart: line
      fields:
      - key: launch_date
      - key: total
      - key: findings
      groupBy:
        field: launch_date
        bucket: month
        aggs:
        - key: findings
          agg: sum
          field: finding_count
  - key: dashboard
    type: dashboard
    title: Dashboard
    children:
    - turnaround
    - issues
    - volume
    roles:
    - reviewer
    - admin
  - key: guidance_feed
    type: list
    title: FCA guidance digests
    source: collection:guidance_updates
    roles:
    - reviewer
    - admin
    - marketer
    data:
      display: list
      fields:
      - key: title
        label: Digest
      - key: date
        label: Date
        format: date
      sort:
        field: date
        dir: desc
      limit: 52
  - key: account
    type: account
    title: Plan and credits
    roles:
    - admin
    - marketer
  billing:
    modes:
    - subscription
    - credits
    currency: gbp
    signupCredits: 3
    costs:
      agent:reviewer: 1
    packs:
    - key: extra_10
      credits: 10
      price: 60
      label: 10 extra reviews
    - key: extra_50
      credits: 50
      price: 250
      label: 50 extra reviews
    plans:
    - key: starter
      price: 149
      interval: month
      label: 'Starter: 25 reviews a month'
      credits: 25
      creditsReset: monthly
      roles:
      - admin
    - key: growth
      price: 449
      interval: month
      label: 'Growth: 100 reviews a month'
      credits: 100
      creditsReset: monthly
      roles:
      - admin
    - key: scale
      price: 1190
      interval: month
      label: 'Scale: 300 reviews a month'
      credits: 300
      creditsReset: monthly
      roles:
      - admin
  extensions:
  - key: organisations
    description: Each regulated firm needs its own deployment of this app (one tenant per firm). Multiple firms inside one
      app, with each firm's marketers and reviewers kept apart, are not expressible yet.
  - key: video_audio_transcription
    description: Automatic transcription of video audio is not available yet. Marketers paste the transcript of a video ad;
      image OCR works through the read_upload tool.
  - key: fca_register_headers
    description: The FCA Register API also expects an X-Auth-Email header. The key is sent by the runtime; the account email
      must be configured by the platform team.
  - key: turnaround_time
    description: Turnaround time (submission to decision) needs both timestamps in one record. The dashboard shows decisions
      per week and findings by rule; an exact turnaround figure needs a computed field.
  - key: digest_affected_promotions
    description: The weekly digest lists the promotion types and channels each new guidance item affects. Matching it to individual
      promotions across all users is not possible without a cross-user read tool.
  - key: sign_off_status
    description: The sign-off decision lives in the approvals view and the audit log. A trigger cannot update the review record,
      so the queue shows the AI verdict, not the human decision.
