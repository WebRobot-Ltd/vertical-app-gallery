  approvals:
  - key: chase_plan
    title: Approve tone and first message
    description: The credit controller approves the tone and first reminder for a customer; the rest of the schedule then
      runs automatically.
    decidedBy: requester
    fields:
    - customer
    - tone
    - first_message
    - summary
  - key: match_review
    title: Confirm an uncertain payment match
    description: The agent is not sure how a bank payment maps to invoices.
    decidedBy: requester
    fields:
    - payment
    - proposed_invoices
    - reason
  triggers:
  - key: dispute_routed
    'on':
      collection: disputes
      op: insert
    notify:
      to:
      - record.account_owner_email
      subject: 'Dispute logged: {record.customer} invoice {record.invoice_number}'
      body: 'A dispute was logged for {record.customer}, invoice {record.invoice_number}.

        Reason: {record.reason}

        Amount disputed: {record.amount_disputed}

        {record.details}


        Please contact the customer and update the dispute in Cashcadence.'
      link: disputes
  - key: chase_send
    description: Sends each approved reminder on its date
    'on':
      date:
        collection: chase_schedule
        field: send_date
        offsetDays: 0
        hour: 8
      where:
        status: approved
    notify:
      to:
      - record.contact_email
      subject: '{record.subject}'
      body: '{record.body}'
  - key: promise_check
    description: Reminds the account owner the day after a promised date
    'on':
      date:
        collection: promises
        field: promised_date
        offsetDays: 1
        hour: 8
      where:
        status: open
    notify:
      to:
      - record.account_owner_email
      subject: 'Promise to pay due yesterday: {record.customer}'
      body: '{record.customer} promised to pay {record.amount} on {record.promised_date} (invoice {record.invoice_number}).
        Please check whether the payment arrived and follow up.'
      link: promises
  - key: chase_plan_approved
    'on':
      approval: chase_plan
      decision: approved
    start:
      agent: chaser
    goal: 'The credit controller approved a chasing plan. Details: {event}. Set the proposed chase steps of that customer
      to approved, then stop.'
  - key: chase_plan_rejected
    'on':
      approval: chase_plan
      decision: rejected
    start:
      agent: chaser
    goal: 'The credit controller rejected a chasing plan. Details: {event}. Set the proposed chase steps of that customer
      to stopped, then stop.'
  - key: match_approved
    'on':
      approval: match_review
      decision: approved
    start:
      agent: matcher
    goal: 'The credit controller approved a payment match. Details: {event}. Apply the allocations and invoice updates for
      that payment and set it matched, then stop.'
  - key: match_rejected
    'on':
      approval: match_review
      decision: rejected
    start:
      agent: matcher
    goal: 'The credit controller rejected a proposed payment match. Details: {event}. Set that payment to unmatched, then
      stop.'
  views:
  - key: home
    type: page
    title: Cashcadence
    nav: false
    sections:
    - type: hero
      layout: stack
      band: true
      eyebrow: Accounts receivable, run by agents
      title: Get paid **sooner**, without the awkward emails.
      text: Cashcadence builds a chasing schedule for every customer, drafts polite-then-firmer reminders, matches bank payments
        to invoices and shows DSO, ageing and your cash forecast. You stay in control of tone and uncertain matches.
      actions:
      - label: Start free
        href: /login
        style: primary
      - label: See how it works
        href: '#how-it-works'
        style: ghost
    - type: steps
      id: how-it-works
      title: How it works
      items:
      - title: Import
        text: 'Upload open invoices as CSV: customer, invoice number, amount, due date, contact email.'
        badge: '1'
      - title: Approve
        text: The agent proposes a schedule per customer from payment history and risk. You approve the tone and the first
          message once; the rest runs automatically.
        badge: '2'
      - title: Apply cash
        text: 'Upload bank CSVs: payments are matched to invoices, including partial and grouped payments. Doubtful matches
          come to you.'
        badge: '3'
      - title: Track
        text: DSO, ageing, promises to pay and a 30-day cash forecast, plus UK statutory interest on request.
        badge: '4'
    - type: cards
      id: roles
      title: Made for the whole finance team
      items:
      - title: Credit controller
        text: Imports, approves chasers, resolves match questions, logs disputes and promises.
      - title: Finance manager
        text: Reads the dashboard and every customer's status across the team.
      - title: Sales account owner
        text: Sees only their own customers, receives disputes and promise reminders.
    - type: cards
      id: pricing
      title: Pricing by invoices managed
      items:
      - title: Starter
        text: Up to 250 invoices managed. £149 per month.
      - title: Growth
        text: Up to 2,000 invoices managed. £399 per month.
      - title: Scale
        text: Unlimited invoices. £999 per month.
    - type: note
      content: Cashcadence supports collections work; interest calculations are an aid, not legal advice. ERP connections
        via OAuth, an inbound mailbox for customer replies and Open Banking feeds are planned with licensed partners; for
        now invoices and bank lines are imported by CSV and promises are logged by hand.
  - key: work
    type: new_run
    title: Run an agent
    roles:
    - credit_controller
    - admin
  - key: runs
    type: history
    title: Agent runs
    source: run
    roles:
    - credit_controller
    - admin
  - key: run_report
    type: report
    source: run
    printable: true
    nav: false
  - key: approvals
    type: approvals
    title: To approve
    approvals:
    - chase_plan
    - match_review
    roles:
    - credit_controller
    - admin
  - key: dashboard
    type: page
    title: Dashboard
    roles:
    - credit_controller
    - finance_manager
    - admin
    sections:
    - type: data
      id: kpis
      title: Receivables at a glance
      source: collection:metrics
      display: kpi
      sort:
        field: date
        dir: asc
      kpis:
      - label: DSO (days)
        agg: last
        field: dso
        format: number
      - label: Outstanding
        agg: last
        field: total_outstanding
        format: money
      - label: Overdue
        agg: last
        field: overdue
        format: money
      - label: Promised, next 30 days
        agg: last
        field: promised_total
        format: money
      - label: Cash forecast, 30 days
        agg: last
        field: forecast_30d
        format: money
      empty: Run "Refresh dashboard figures" to compute the first figures.
    - type: data
      id: ageing
      title: Ageing of unpaid invoices
      source: collection:invoices
      display: chart
      chart: bar
      filters:
      - field: status
        op: '!='
        value: paid
      groupBy:
        field: aging_bucket
        aggs:
        - key: outstanding
          agg: sum
          field: outstanding
      fields:
      - key: aging_bucket
        label: Ageing
      - key: outstanding
        label: Outstanding
        format: money
      empty: No invoices yet.
    - type: data
      id: promises-chart
      title: Promises to pay
      source: collection:promises
      display: chart
      chart: bar
      filters:
      - field: status
        op: '='
        value: open
      groupBy:
        field: promised_date
        bucket: week
        aggs:
        - key: promised
          agg: sum
          field: amount
      fields:
      - key: promised_date
        label: Week
      - key: promised
        label: Promised
        format: money
      empty: No open promises.
    - type: data
      id: forecast
      title: Cash forecast by expected payment week
      source: collection:invoices
      display: chart
      chart: line
      filters:
      - field: status
        op: '!='
        value: paid
      groupBy:
        field: expected_date
        bucket: week
        aggs:
        - key: expected
          agg: sum
          field: outstanding
      fields:
      - key: expected_date
        label: Week
      - key: expected
        label: Expected cash
        format: money
      empty: No invoices yet.
