apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: quizzent
  displayName: Quizzent
  tagline: Your AI tutor for GCSE and A-level exams.
  description: Quizzent explains topics grounded in the published specifications, sets exam-style questions, marks typed or
    handwritten answers against the assessment objectives, tracks progress by topic and builds a revision plan up to exam
    day.
  langs:
  - en
  defaultLang: en
  timezone: Europe/London
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#1d2b53'
      accent: '#00a6a6'
      background: '#f7f9fc'
      foreground: '#17202e'
    fonts:
      body: Inter
      display: Poppins
    wordmark:
    - text: Quiz
      color: primary
    - text: zent
      color: accent
  header:
    links:
    - label: How it works
      href: '#how'
    - label: Pricing
      href: '#pricing'
    cta:
      label: Start free
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      label: Student
      assignedBy: signup
    - key: teacher
      label: Teacher
      assignedBy: invite
    - key: parent
      label: Parent
      assignedBy: derived
      from: collection:student_profile.parent_email
  limits:
  - action: agent:marker
    per: user
    max: 20
    window: month
    roles:
    - user
    plans:
      monthly: -1
      yearly: -1
  - action: chat
    per: user
    max: 60
    window: day
    roles:
    - user
  agents:
  - key: tutor
    role: main
    description: Explains topics in chat and sets exam-style questions, grounded in the published specifications.
    context:
    - key: profile
      from: collection:student_profile
    goalTemplate: 'Student profile (subjects, boards, level, exam year): {profile}

      Conversation so far:

      {history}

      New message from the student: {message}

      Today is {date}. Reply in English.'
    appTools:
    - name: read_progress
      description: Read the student's marked answers and topic scores
      action: read
      collection: progress
      scope: user
    profile:
      inline:
        display_name: Quizzent tutor
        chat_mode: true
        crews:
        - id: tutor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You are Quizzent, a friendly, rigorous tutor for GCSE and A-level students in England, Wales and
            Northern Ireland. Ground every explanation in the published Ofqual-regulated specification of the student''s exam
            board and subject (use the web tool to read the public specification page when unsure; name the specification
            section). Explain step by step, check understanding with one short question, and when asked set exam-style questions
            of the right command word and mark allocation, written by you in the style of the board. Use read_progress to
            target weak topics. NEVER reproduce past papers or official mark schemes verbatim: we hold no exam-board licence.
            Do not invent specification content; say plainly when unsure. Tell students that to get a question marked they
            should use the Mark my answer page. Keep replies concise and encouraging. Never ask for personal data beyond what
            is needed.'
  - key: marker
    role: main
    description: Marks a typed or photographed answer against the specification's assessment objectives and records the result.
    context:
    - key: email
      from: user.email
    - key: parent_email
      from: collection:student_profile.parent_email
    - key: teacher_email
      from: collection:student_profile.teacher_email
    goalTemplate: 'Subject: {subject_label}

      Board: {board_label}

      Level: {level_label}

      Topic: {topic}

      Question: {question}

      Marks available: {max_mark}

      {?answer}Typed answer: {answer}{/answer}

      {?answer_photo}Handwritten work uploaded (file ids): {answer_photo}. Open each file with read_upload to read it.{/answer_photo}

      Student email: {email}. Parent email: {parent_email}. Teacher email: {teacher_email}.

      Today is {date}. Write the report in English.'
    appTools:
    - name: read_upload
      description: Read a file the student uploaded (photo, scan, OCR included)
      action: read_file
    - name: save_progress
      description: Save the mark for this answer to the student's progress record
      action: append
      collection: progress
      scope: user
    - name: read_progress
      description: Read the student's marked answers and topic scores
      action: read
      collection: progress
      scope: user
    output: markdown
    limits:
      maxTurns: 10
      maxBudgetUsd: 0.5
    profile:
      inline:
        display_name: Quizzent marker
        crews:
        - id: marker
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are an experienced GCSE and A-level examiner. Mark the student''s answer fairly against the
            assessment objectives (AO1 knowledge, AO2 application, AO3 analysis/evaluation, or the subject''s equivalents)
            in the style of the named exam board, awarding whole marks up to the marks available. If a photo was uploaded,
            call read_upload with each file id first; if handwriting is unreadable say so and do not guess. You do not have
            the official mark scheme, so build your own criteria from the specification and say that this is an estimate,
            not an official mark. Report structure: a level-1 title ''# Marked: <topic> — <mark>/<max>''; ## Mark and AO breakdown
            (small table); ## What you did well; ## How to gain more marks (specific, quote the student''s words); ## Model
            answer outline (short, written by you); ## Revise next (2-3 specification topics). Then call save_progress exactly
            once with: student_email, subject, board, topic, ao (main AO weakest), mark, max_mark, pct (0-100 integer), feedback
            (two sentences), date (YYYY-MM-DD), parent_email, teacher_email (copy from the goal; leave empty if blank). Never
            invent marks or content; be kind but honest.'
  - key: planner
    role: helper
    description: Builds the revision plan up to exam day when the student saves their profile.
    context:
    - key: email
      from: user.email
    goalTemplate: 'Student {email} saved their profile. Exam date: {record.exam_date}. Subjects: {record.subjects}. Boards:
      {record.boards}. Level: {record.level}. Today is {date}.'
    appTools:
    - name: read_progress
      description: Read the student's marked answers and topic scores
      action: read
      collection: progress
      scope: user
    - name: read_profile
      description: Read the student's profile
      action: read
      collection: student_profile
      scope: user
    - name: save_plan
      description: Add one revision session to the student's plan
      action: append
      collection: revision_plan
      scope: user
    output: markdown
    limits:
      maxTurns: 30
      maxBudgetUsd: 0.8
    profile:
      inline:
        display_name: Quizzent planner
        crews:
        - id: planner
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You plan revision for a GCSE or A-level student from today to their exam date. Read the profile
            and progress with the tools. Spread the main topics of each subject (from your knowledge of the specification)
            across the weeks, give weak topics (low pct) more sessions, include a final week of mixed practice and spaced
            repetition of earlier topics. Maximum 3 sessions per week and 40 sessions in total; sessions on weekdays or weekends
            of 20-60 minutes. For each session call save_plan once with: subject, topic, task (one concrete sentence), date
            (YYYY-MM-DD, not in the past, not after the exam), minutes. Finish with a short markdown summary starting ''#
            Revision plan'' and say that reminders are emailed on the morning of each session. Never invent exam dates.'
  inputForm:
    title: Mark my answer
    fields:
    - name: subject
      type: select
      required: true
      label: Subject
      options:
      - value: maths
        label: Mathematics
      - value: english_lang
        label: English Language
      - value: english_lit
        label: English Literature
      - value: biology
        label: Biology
      - value: chemistry
        label: Chemistry
      - value: physics
        label: Physics
      - value: history
        label: History
      - value: geography
        label: Geography
      - value: computer_science
        label: Computer Science
    - name: board
      type: select
      required: true
      label: Exam board
      options:
      - value: aqa
        label: AQA
      - value: edexcel
        label: Pearson Edexcel
      - value: ocr
        label: OCR
      - value: wjec
        label: WJEC / Eduqas
    - name: level
      type: select
      required: true
      label: Level
      options:
      - value: gcse
        label: GCSE
      - value: a_level
        label: A-level
    - name: topic
      type: text
      required: true
      label: Topic
      maxLength: 120
    - name: question
      type: textarea
      required: true
      label: Question
      maxLength: 2000
    - name: max_mark
      type: number
      required: true
      label: Marks available
    - name: answer
      type: textarea
      label: Your answer (typed)
      maxLength: 8000
    - name: answer_photo
      type: file
      label: Or a photo of your handwritten work
      accept:
      - jpg
      - jpeg
      - png
      - webp
      - pdf
      maxMb: 10
      multiple: true
      capture: true
      extract: none
  data:
    collections:
    - name: student_profile
      ownedBy: user
      description: The student's subjects, boards, exam year and optional parent and teacher links
      retentionDays: 1095
      fields:
      - name: level
        type: select
        required: true
        label: Level
        options:
        - value: gcse
          label: GCSE
        - value: a_level
          label: A-level
      - name: subjects
        type: multiselect
        required: true
        label: Subjects
        options:
        - Mathematics
        - English Language
        - English Literature
        - Biology
        - Chemistry
        - Physics
        - History
        - Geography
        - Computer Science
      - name: boards
        type: multiselect
        required: true
        label: Exam boards
        options:
        - AQA
        - Pearson Edexcel
        - OCR
        - WJEC / Eduqas
      - name: exam_year
        type: select
        required: true
        label: Year you sit
        options:
        - '2027'
        - '2028'
        - '2029'
      - name: exam_date
        type: date
        required: true
        label: First exam date
        help: The date your revision plan counts down to
      - name: parent_email
        type: email
        label: Parent or guardian email (optional)
        help: They will see your progress, never your chats
      - name: teacher_email
        type: email
        label: Teacher email (optional)
        help: Your teacher sees your progress and class heat map
      access:
      - role: parent
        where:
          parent_email: '{user.email}'
        can:
        - read
      - role: teacher
        where:
          teacher_email: '{user.email}'
        can:
        - read
    - name: progress
      ownedBy: user
      description: One marked answer per record, written by the marker
      retentionDays: 1095
      fields:
      - name: student_email
        type: email
        label: Student
      - name: subject
        type: text
        label: Subject
      - name: board
        type: text
        label: Board
      - name: topic
        type: text
        label: Topic
      - name: ao
        type: text
        label: Weakest AO
      - name: mark
        type: number
        label: Mark
      - name: max_mark
        type: number
        label: Out of
      - name: pct
        type: number
        label: Score %
      - name: feedback
        type: textarea
        label: Feedback
      - name: date
        type: date
        label: Date
      - name: parent_email
        type: email
        label: Parent email
      - name: teacher_email
        type: email
        label: Teacher email
      access:
      - role: parent
        where:
          parent_email: '{user.email}'
        can:
        - read
      - role: teacher
        where:
          teacher_email: '{user.email}'
        can:
        - read
    - name: revision_plan
      ownedBy: user
      description: Revision sessions up to exam day
      retentionDays: 730
      fields:
      - name: date
        type: date
        label: Date
      - name: subject
        type: text
        label: Subject
      - name: topic
        type: text
        label: Topic
      - name: task
        type: text
        label: Task
      - name: minutes
        type: number
        label: Minutes
    - name: assignments
      ownedBy: user
      description: Questions a teacher sets for their class
      fields:
      - name: title
        type: text
        required: true
        label: Title
      - name: subject
        type: text
        required: true
        label: Subject
      - name: topic
        type: text
        required: true
        label: Topic
      - name: question
        type: textarea
        required: true
        label: Question
      - name: max_mark
        type: number
        required: true
        label: Marks
      - name: due
        type: date
        label: Due date
      - name: class_emails
        type: array
        required: true
        label: Student emails in the class
      access:
      - role: user
        where:
          class_emails: '{user.email}'
        can:
        - read
  views:
  - key: home
    type: page
    nav: false
    title: Quizzent
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow: GCSE and A-level
      title: Revise smarter with a tutor that **marks your work**.
      text: Quizzent explains topics from the published specifications, sets exam-style questions, marks typed or handwritten
        answers against the assessment objectives and builds a revision plan to exam day.
      actions:
      - label: Start free
        href: /login
        style: primary
      - label: See pricing
        href: '#pricing'
        style: ghost
      note: Five marked answers a week on the free plan.
    - type: steps
      id: how
      title: How it works
      items:
      - title: Tell us your exams
        text: Choose subjects, boards and the year you sit.
        badge: '1'
      - title: Learn and practise
        text: Chat with the tutor and get exam-style questions.
        badge: '2'
      - title: Get marked
        text: Type or photograph your answer for a mark and specific feedback.
        badge: '3'
      - title: Follow your progress
        text: See strengths and weak spots by topic and a plan with email reminders.
        badge: '4'
    - type: cards
      title: For everyone
      items:
      - title: Students
        text: A private tutor and examiner on your phone.
      - title: Parents
        text: Link to your child's account and see progress, never their chats.
      - title: Teachers
        text: Create a class, set questions and see the class heat map.
    - type: cards
      id: pricing
      title: Pricing
      items:
      - title: Free
        text: Five marked answers a week and unlimited tutor chat.
      - title: Plus £12 / month
        text: Unlimited marking, full progress and revision plan.
      - title: Plus £90 / year
        text: Everything in Plus, two months free.
      - title: School licences
        text: Contact us for a class or whole-school licence.
    - type: note
      content: Quizzent marks are estimates written by AI against the published specifications. They are not official marks.
        Quizzent is not affiliated with Ofqual or any exam board, and does not use past papers or official mark schemes without
        a licence.
  - key: profile
    type: form
    title: My exams
    collection: student_profile
    edit: true
    submit:
      label: Save
      message: Saved. Your revision plan is being built.
      redirect: plan
    roles:
    - user
    - admin
  - key: tutor_chat
    type: chat
    title: Tutor
    source: agent:tutor
    placeholder: Ask about a topic or ask for an exam-style question
    examples:
    - Explain photosynthesis for AQA GCSE Biology
    - Set me a 6-mark question on the causes of WW1
    - What are the AOs in A-level Maths?
    roles:
    - user
    - admin
  - key: mark
    type: new_run
    title: Mark my answer
    roles:
    - user
    - admin
  - key: my_marks
    type: history
    title: My marked answers
    source: run
    roles:
    - user
    - admin
  - key: mark_report
    type: report
    source: run
    printable: true
    nav: false
  - key: progress
    type: page
    title: My progress
    roles:
    - user
    - admin
    sections:
    - type: data
      title: Strengths and weak spots by topic
      source: collection:progress
      display: chart
      chart: bar
      groupBy:
        field: topic
        aggs:
        - key: avg_pct
          agg: avg
          field: pct
      fields:
      - key: topic
        label: Topic
      - key: avg_pct
        label: Average %
        format: number
      empty: Get an answer marked to see your progress.
    - type: data
      title: Progress over time
      source: collection:progress
      display: chart
      chart: line
      groupBy:
        field: date
        bucket: week
        aggs:
        - key: avg_pct
          agg: avg
          field: pct
      fields:
      - key: date
        label: Week
      - key: avg_pct
        label: Average %
        format: number
    - type: data
      title: Recent answers
      source: collection:progress
      display: table
      fields:
      - key: date
        label: Date
        format: date
      - key: subject
        label: Subject
      - key: topic
        label: Topic
      - key: mark
        label: Mark
      - key: max_mark
        label: Out of
      - key: feedback
        label: Feedback
      sort:
        field: date
        dir: desc
      limit: 30
  - key: plan
    type: page
    title: Revision plan
    roles:
    - user
    - admin
    sections:
    - type: text
      content: Your plan is built when you save your exams. You get an email on the morning of each session.
    - type: data
      source: collection:revision_plan
      display: table
      fields:
      - key: date
        label: Date
        format: date
      - key: subject
        label: Subject
      - key: topic
        label: Topic
      - key: task
        label: Task
      - key: minutes
        label: Minutes
      sort:
        field: date
        dir: asc
      limit: 100
      empty: Fill in 'My exams' to get a plan.
  - key: homework
    type: table
    title: Set by my teacher
    source: collection:assignments
    roles:
    - user
    data:
      display: table
      fields:
      - key: title
        label: Title
      - key: subject
        label: Subject
      - key: topic
        label: Topic
      - key: question
        label: Question
      - key: max_mark
        label: Marks
      - key: due
        label: Due
        format: date
      sort:
        field: due
        dir: asc
  - key: child_progress
    type: page
    title: My child's progress
    roles:
    - parent
    sections:
    - type: data
      title: By topic
      source: collection:progress
      display: chart
      chart: bar
      groupBy:
        field: topic
        aggs:
        - key: avg_pct
          agg: avg
          field: pct
      fields:
      - key: topic
        label: Topic
      - key: avg_pct
        label: Average %
        format: number
      empty: No marked answers yet.
    - type: data
      title: Recent answers
      source: collection:progress
      display: table
      fields:
      - key: date
        label: Date
        format: date
      - key: subject
        label: Subject
      - key: topic
        label: Topic
      - key: pct
        label: Score %
      sort:
        field: date
        dir: desc
      limit: 30
  - key: new_assignment
    type: form
    title: Set a question
    collection: assignments
    submit:
      label: Set for class
      message: The question is now visible to your class.
    roles:
    - teacher
    - admin
  - key: class_heatmap
    type: page
    title: Class heat map
    roles:
    - teacher
    - admin
    sections:
    - type: data
      title: Average score by topic
      source: collection:progress
      display: chart
      chart: bar
      groupBy:
        field: topic
        aggs:
        - key: avg_pct
          agg: avg
          field: pct
        minCount: 1
      fields:
      - key: topic
        label: Topic
      - key: avg_pct
        label: Class average %
        format: number
      empty: Students link you as their teacher in 'My exams'.
    - type: data
      title: Average score by student
      source: collection:progress
      display: table
      groupBy:
        field: student_email
        aggs:
        - key: avg_pct
          agg: avg
          field: pct
      fields:
      - key: student_email
        label: Student
      - key: avg_pct
        label: Average %
        format: number
      - key: count
        label: Answers
    - type: data
      title: Weak spots (student by topic)
      source: collection:progress
      display: table
      fields:
      - key: student_email
        label: Student
      - key: topic
        label: Topic
      - key: pct
        label: Score %
        format: badge
      sort:
        field: pct
        dir: asc
      limit: 100
  - key: account
    type: account
    title: Plan
    roles:
    - user
  triggers:
  - key: build_plan
    description: Build the revision plan when the student saves their exams
    'on':
      collection: student_profile
      op: any
    start:
      agent: planner
    goal: Build my revision plan. Exam date {record.exam_date}; subjects {record.subjects}; boards {record.boards}; level
      {record.level}. Today is {date}.
  - key: revision_reminder
    description: Email the student on the morning of each revision session
    'on':
      date:
        collection: revision_plan
        field: date
        offsetDays: 0
        hour: 7
    notify:
      to: owner
      subject: 'Today''s revision: {record.topic}'
      body: 'Today''s Quizzent session: {record.subject} - {record.topic}.


        {record.task} ({record.minutes} minutes)'
      link: plan
  billing:
    modes:
    - subscription
    currency: gbp
    plans:
    - key: monthly
      price: 12
      interval: month
      label: Plus monthly
      includes:
      - Unlimited marked answers
      - Full progress charts
      - Revision plan with reminders
    - key: yearly
      price: 90
      interval: year
      label: Plus yearly
      includes:
      - Unlimited marked answers
      - Full progress charts
      - Revision plan with reminders
  extensions:
  - key: weekly_free_limit
    description: The free tier is five marked answers a WEEK, but quotas only support minute/hour/day/month/total windows.
      The manifest approximates it with 20 per month on the free plan; a weekly window is needed.
  - key: school_licences
    description: School licences (seat-based billing, teachers invited by the school admin) are not available as a billing
      mode yet. Teachers are invited by the app admin; invoicing is handled outside the app.
  - key: parent_link_consent
    description: Parent linking works by the student entering the parent's email in their profile. A parent-initiated invite
      with student confirmation is not available yet. Review consent rules for under-13s and under-16s before launch.
  - key: past_papers_licence
    description: Past papers and official mark schemes are deliberately not used. Add them only after an exam-board licence
      is signed.
