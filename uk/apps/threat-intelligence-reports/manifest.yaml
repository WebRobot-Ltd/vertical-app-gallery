apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: lanternhouse
  displayName: Lanternhouse
  tagline: Open-source and lawfully sourced dark-web intelligence, signed off by a human analyst.
  description: 'Security and risk teams define what matters: organisations, executive roles, brands, domains, suppliers, regions
    and threat types. Research agents collect findings, cluster them and draft an intelligence report. A human analyst reviews
    and signs every report before the client sees it.'
  langs:
  - en
  defaultLang: en
  timezone: Europe/London
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#101a2e'
      accent: '#d9902f'
      background: '#f7f5f0'
      foreground: '#14181f'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Lantern
      color: primary
    - text: house
      color: accent
    width: wide
  header:
    links:
    - label: How it works
      href: '#how-it-works'
    - label: Sources & safeguards
      href: '#safeguards'
    cta:
      label: Client sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: analyst
      label: Analyst
      assignedBy: invite
    - key: client
      label: Client reader
      assignedBy: signup
  limits:
  - action: agent:intel_analyst
    per: user
    max: 40
    window: month
    roles:
    - client
  agents:
  - key: intel_analyst
    role: main
    description: 'Lead research analyst agent: plans the collection, delegates to the collector, clusters findings and drafts
      the report for human review.'
    delegates:
    - collector
    memory: user
    profile:
      inline:
        display_name: Lanternhouse lead analyst
        crews:
        - id: lead
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the lead intelligence analyst agent of Lanternhouse, writing for a corporate security or
            risk team. Your work is always reviewed and signed off by a human analyst before the client sees it.


            Process:

            1. Call read_requirements to get this client''s requirements (organisations, executive roles, brands, domains,
            suppliers, regions, threat types). Executive roles are roles only: never search for or record personal data about
            named private individuals.

            2. Delegate collection to the collector with ask_collector: give it the active requirements, the period and any
            specific question. Ask for findings covering open web, news and official sources, plus licensed dark-web provider
            data only if a provider tool is available.

            3. Call read_findings, drop duplicates, and cluster the findings by theme or threat actor/campaign. Use only findings
            that have a source, date and excerpt.

            4. Draft the report and store it with save_report with status "draft". Put the same text in your final answer.


            Report structure (the first line is a level-1 title): "# <Report type> — <client scope> — <period>", then ## Summary,
            ## Key judgements (each with an assessed likelihood using the yardstick: remote 1-5%, highly unlikely 5-20%, unlikely
            20-45%, realistic possibility 45-55%, likely 55-80%, highly likely 80-95%, almost certain 95-99%, and a confidence
            level low/medium/high), ## Evidence (clusters, each finding with source, date, excerpt, confidence, relevance),
            ## Gaps and caveats (what was not covered, for example no dark-web coverage if no licensed provider is connected),
            ## Recommendations (practical, prioritised). Include a ```chart``` block only when comparing real counts.


            Rules: never invent sources, quotes, dates or figures; separate fact from assessment; label single-source or unverified
            claims; do not give legal advice as fact; do not recommend contacting, paying or engaging criminals; do not repeat
            stolen credentials or personal data in full (mask them). Mark findings that need immediate attention as urgency
            "urgent" only when there is a credible, imminent threat to the client. Write in English.'
    appTools:
    - name: read_requirements
      description: Read the client's requirements (what to monitor)
      action: read
      collection: requirements
      scope: user
    - name: read_findings
      description: Read the client's collected findings
      action: read
      collection: findings
      scope: user
    - name: save_report
      description: Save the draft intelligence report (status draft) for analyst review
      action: append
      collection: reports
      scope: user
    goalTemplate: Produce an intelligence report for the client {user}. Today is {date}. Follow your process and report structure.
      Write in English.
    output: markdown
    limits:
      maxTurns: 40
      maxBudgetUsd: 3
      timeoutSeconds: 1800
  - key: collector
    role: helper
    description: 'Research collector: searches public web, news and official sources, and licensed dark-web provider data
      when connected; records every finding with its provenance.'
    profile:
      inline:
        display_name: Lanternhouse collector
        crews:
        - id: collector
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You are the collection agent of Lanternhouse. You receive the client''s requirements, a period and
            sometimes a question. You search the public web, news sites and official sources (registries, regulators, courts,
            sanctions and vulnerability lists, breach notification pages) where their terms allow automated access: respect
            robots.txt and terms of use, rate-limit, never bypass logins, paywalls or access controls. Use the WebRobot tools
            to scrape pages when search is not enough.


            DARK WEB: you NEVER connect to Tor, forums or marketplaces yourself, and you never buy, download or access stolen
            data. Dark-web material may enter only through a licensed, lawful provider whose tool is connected to this app
            by the administrators. If no such tool is available, record nothing from the dark web and state clearly in your
            answer that dark-web coverage was not collected.


            For every relevant item call save_finding once with: title, source (publisher or site name), source_url, source_type
            (open_web, news, official or licensed_darkweb), found_date (date of the item, YYYY-MM-DD), excerpt (a short quote
            or faithful summary, max 400 chars, with personal data and credentials masked), requirement (which requirement
            it matches), confidence (low, medium, high: how reliable the source and corroboration are), relevance (low, medium,
            high: how much it matters to the requirement), urgency (routine, or urgent only for a credible imminent threat),
            cluster (a short theme label), status "new". Never invent items. Finish with a short list of what was searched
            and what could not be covered.'
    appTools:
    - name: save_finding
      description: Save one finding with its source, date, excerpt, confidence and relevance
      action: append
      collection: findings
      scope: user
    goalTemplate: Collect findings for the client {user}. Today is {date}.
    output: markdown
    limits:
      maxTurns: 40
      maxBudgetUsd: 3
      timeoutSeconds: 1800
  data:
    collections:
    - name: requirements
      description: What each client wants monitored
      ownedBy: user
      fields:
      - name: name
        type: text
        required: true
        label: Name or label
      - name: kind
        type: select
        required: true
        label: Type
        options:
        - value: organisation
          label: Organisation
        - value: executive_role
          label: Executive role (role only, no personal data)
        - value: brand
          label: Brand
        - value: domain
          label: Domain
        - value: supplier
          label: Supplier
        - value: region
          label: Region
        - value: threat_type
          label: Threat type
      - name: value
        type: text
        label: Value (domain, brand name, region...)
      - name: notes
        type: textarea
        maxLength: 600
        label: Notes
      - name: active
        type: boolean
        default: true
        label: Active
      access:
      - role: analyst
        can:
        - read
        - write
    - name: findings
      description: Collected findings with provenance; analysts validate them
      ownedBy: user
      fields:
      - name: title
        type: text
        required: true
        label: Title
      - name: source
        type: text
        label: Source
      - name: source_url
        type: url
        label: Link
      - name: source_type
        type: select
        label: Source type
        options:
        - open_web
        - news
        - official
        - licensed_darkweb
      - name: found_date
        type: date
        label: Date
      - name: excerpt
        type: textarea
        label: Excerpt
      - name: requirement
        type: text
        label: Requirement
      - name: cluster
        type: text
        label: Cluster
      - name: confidence
        type: select
        label: Confidence
        options:
        - low
        - medium
        - high
      - name: relevance
        type: select
        label: Relevance
        options:
        - low
        - medium
        - high
      - name: urgency
        type: select
        label: Urgency
        default: routine
        options:
        - routine
        - urgent
      - name: status
        type: select
        label: Review status
        default: new
        options:
        - new
        - validated
        - dismissed
      access:
      - role: analyst
        can:
        - read
        - write
    - name: reports
      description: Intelligence reports. Drafts stay hidden from clients until an analyst signs them off (status signed_off).
      ownedBy: user
      fields:
      - name: title
        type: text
        required: true
        label: Title
      - name: kind
        type: select
        label: Type
        options:
        - weekly
        - monthly
        - ad_hoc
      - name: period
        type: text
        label: Period
      - name: summary
        type: textarea
        label: Summary
      - name: key_judgements
        type: textarea
        label: Key judgements
      - name: likelihood
        type: select
        label: Assessed likelihood
        options:
        - remote
        - highly_unlikely
        - unlikely
        - realistic_possibility
        - likely
        - highly_likely
        - almost_certain
      - name: evidence
        type: textarea
        label: Evidence
      - name: recommendations
        type: textarea
        label: Recommendations
      - name: status
        type: select
        label: Status
        default: draft
        options:
        - draft
        - signed_off
        - rejected
      - name: analyst_notes
        type: textarea
        label: Analyst notes (internal)
      - name: signed_off_by
        type: email
        label: Signed off by
      - name: signed_off_at
        type: date
        label: Signed off on
      access:
      - role: analyst
        can:
        - read
        - write
    - name: requests
      description: Ad-hoc questions from clients, with a deadline
      ownedBy: user
      fields:
      - name: question
        type: textarea
        required: true
        maxLength: 1500
        label: Your question
      - name: deadline
        type: date
        required: true
        label: Deadline
      - name: priority
        type: select
        label: Priority
        default: routine
        options:
        - routine
        - urgent
      - name: context
        type: textarea
        maxLength: 800
        label: Context (optional)
      access:
      - role: analyst
        can:
        - read
  views:
  - key: home
    type: page
    nav: false
    title: Lanternhouse
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow: Intelligence for security and risk teams
      title: Know what is said about you **before it becomes an incident**.
      text: Tell Lanternhouse which organisations, brands, domains, suppliers, regions and threat types matter. Research agents
        collect and cluster the evidence, and a human analyst signs every report before you see it.
      actions:
      - label: Client sign in
        href: /login
        style: primary
      - label: How it works
        href: '#how-it-works'
        style: ghost
      aside: '<div style="padding:16px"><strong>Sample report</strong><br>Summary · Key judgements · Evidence · Recommendations<br><em>Assessed
        likelihood: likely (55-80%), confidence medium</em><br>Signed off by a named analyst.</div>'
    - type: steps
      id: how-it-works
      title: How it works
      items:
      - title: Define requirements
        text: Add organisations, executive roles (never personal data), brands, domains, suppliers, regions and threat types.
      - title: Agents collect and draft
        text: Research agents search, record each finding with source, date, excerpt, confidence and relevance, cluster them
          and draft the report.
      - title: An analyst signs off
        text: Every report is reviewed by a human analyst. You only see signed-off reports.
      - title: You read and ask
        text: Reports and a findings table in your portal, ad-hoc questions with a deadline, and email alerts for urgent findings.
    - type: cards
      id: safeguards
      title: Sources and safeguards
      items:
      - title: Public web, news and official sources
        text: Collected where site terms allow, respecting robots.txt and access controls.
      - title: Dark-web data
        text: Forums and marketplaces are covered only through a licensed, lawful provider. Agents never access Tor or stolen
          data themselves; where the provider is not connected, the report says coverage was not collected.
      - title: Human sign-off
        text: No report reaches a client without analyst approval.
      - title: Your data stays yours
        text: Each client sees only its own requirements, findings and reports.
    - type: cards
      title: Reports on a schedule
      items:
      - title: Weekly brief
        text: Automatically drafted every Monday, then reviewed.
      - title: Monthly report
        text: A deeper trend review on the first of each month.
        badge: 📅
      - title: Ad-hoc requests
        text: Ask a specific question with a deadline.
    - type: note
      content: Lanternhouse provides decision support, not legal advice. Assessments are probabilistic and reviewed by analysts;
        they are not statements of fact.
  - key: reports
    type: cards
    title: Reports
    source: collection:reports
    roles:
    - client
    data:
      display: cards
      fields:
      - key: title
        label: Title
      - key: kind
        label: Type
        format: badge
      - key: period
        label: Period
      - key: likelihood
        label: Assessed likelihood
        format: badge
      - key: summary
        label: Summary
      - key: key_judgements
        label: Key judgements
      - key: evidence
        label: Evidence
      - key: recommendations
        label: Recommendations
      - key: signed_off_at
        label: Signed off
        format: date
      filters:
      - field: status
        op: '='
        value: signed_off
      sort:
        field: signed_off_at
        dir: desc
      limit: 50
      empty: No signed-off reports yet.
    printable: true
  - key: findings
    type: table
    title: Findings
    source: collection:findings
    roles:
    - client
    export: true
    data:
      display: table
      fields:
      - key: found_date
        label: Date
        format: date
      - key: title
        label: Finding
      - key: source
        label: Source
      - key: source_url
        label: Link
        format: link
      - key: excerpt
        label: Excerpt
      - key: confidence
        label: Confidence
        format: badge
      - key: relevance
        label: Relevance
        format: badge
      - key: urgency
        label: Urgency
        format: badge
      - key: cluster
        label: Cluster
      filters:
      - field: status
        op: '='
        value: validated
      sort:
        field: found_date
        dir: desc
      limit: 200
      empty: No validated findings yet.
  - key: requirements
    type: table
    title: My requirements
    source: collection:requirements
    roles:
    - client
    data:
      display: table
      fields:
      - key: name
        label: Name
      - key: kind
        label: Type
        format: badge
      - key: value
        label: Value
      - key: active
        label: Active
      limit: 100
      empty: Add your first requirement.
  - key: add_requirement
    type: form
    title: Add requirement
    collection: requirements
    roles:
    - client
    fields:
    - name
    - kind
    - value
    - notes
    - active
    submit:
      label: Save requirement
      message: Requirement saved.
      redirect: requirements
  - key: ask
    type: form
    title: Ask a question
    collection: requests
    roles:
    - client
    fields:
    - question
    - deadline
    - priority
    - context
    submit:
      label: Send request
      message: Request received. An analyst-reviewed answer will be published in Reports.
      redirect: my_requests
  - key: my_requests
    type: table
    title: My requests
    source: collection:requests
    roles:
    - client
    data:
      display: table
      fields:
      - key: question
        label: Question
      - key: deadline
        label: Deadline
        format: date
      - key: priority
        label: Priority
        format: badge
      limit: 100
      empty: No requests yet.
  - key: weekly_watch
    type: instances
    title: Weekly brief
    template: weekly_brief
    roles:
    - client
  - key: monthly_watch
    type: instances
    title: Monthly report
    template: monthly_report
    roles:
    - client
  - key: account
    type: account
    title: Subscription and credits
    roles:
    - client
  - key: queue
    type: table
    title: Review queue
    source: collection:reports
    roles:
    - analyst
    - admin
    data:
      display: table
      fields:
      - key: title
        label: Draft
      - key: kind
        label: Type
        format: badge
      - key: period
        label: Period
      - key: likelihood
        label: Likelihood
        format: badge
      - key: status
        label: Status
        format: badge
      filters:
      - field: status
        op: '='
        value: draft
      limit: 100
      empty: No drafts waiting.
  - key: review
    type: form
    title: Review and sign off a report
    collection: reports
    edit: true
    roles:
    - analyst
    - admin
    fields:
    - title
    - summary
    - key_judgements
    - likelihood
    - evidence
    - recommendations
    - status
    - analyst_notes
    - signed_off_by
    - signed_off_at
    submit:
      label: Save review
      message: Saved. Set status to signed_off to publish to the client.
      redirect: queue
  - key: findings_review
    type: table
    title: Findings to validate
    source: collection:findings
    roles:
    - analyst
    - admin
    data:
      display: table
      fields:
      - key: found_date
        label: Date
        format: date
      - key: title
        label: Finding
      - key: source
        label: Source
      - key: source_type
        label: Source type
        format: badge
      - key: confidence
        label: Confidence
        format: badge
      - key: urgency
        label: Urgency
        format: badge
      filters:
      - field: status
        op: '='
        value: new
      limit: 200
      empty: Nothing to validate.
  - key: finding_review
    type: form
    title: Validate a finding
    collection: findings
    edit: true
    roles:
    - analyst
    - admin
    fields:
    - title
    - excerpt
    - confidence
    - relevance
    - urgency
    - cluster
    - status
    submit:
      label: Save
      message: Finding updated.
      redirect: findings_review
  - key: runs
    type: history
    title: Agent runs
    source: run
    roles:
    - analyst
    - admin
  - key: run_report
    type: report
    source: run
    printable: true
    nav: false
    roles:
    - analyst
    - admin
  templates:
  - key: weekly_brief
    title: Weekly brief
    description: A weekly intelligence report on your requirements, reviewed by an analyst before publication.
    agent: intel_analyst
    params:
    - name: focus
      type: text
      label: Extra focus (optional)
      maxLength: 200
    goal: 'Produce the WEEKLY intelligence brief (kind weekly) covering the last 7 days up to {date} for all active requirements.
      {?focus}Extra focus: {focus}.{/focus} Save it as a draft report with save_report (kind weekly). Write in English.'
    schedule:
      cron: 0 6 * * 1
      userCanChange: false
    maxPerUser: 1
  - key: monthly_report
    title: Monthly report
    description: A monthly trend report on your requirements, reviewed by an analyst before publication.
    agent: intel_analyst
    params:
    - name: focus
      type: text
      label: Extra focus (optional)
      maxLength: 200
    goal: 'Produce the MONTHLY intelligence report (kind monthly) covering the last 30 days up to {date} for all active requirements,
      with trends against previous reports. {?focus}Extra focus: {focus}.{/focus} Save it as a draft report with save_report
      (kind monthly). Write in English.'
    schedule:
      cron: 0 6 1 * *
      userCanChange: false
    maxPerUser: 1
  triggers:
  - key: adhoc_request
    description: A client request starts the analyst agent
    'on':
      collection: requests
      op: insert
    start:
      agent: intel_analyst
    goal: 'Answer this ad-hoc request from the client. Question: {record.question}. Deadline: {record.deadline}. Priority:
      {record.priority}. Context: {record.context}. Collect findings, then save a draft report with save_report (kind ad_hoc).
      Write in English.'
  - key: draft_ready
    description: Tell analysts a draft awaits review
    'on':
      collection: reports
      op: insert
      where:
        status: draft
    notify:
      to: role:analyst
      subject: 'Lanternhouse: draft report to review - {record.title}'
      body: A new draft report is waiting for analyst review and sign-off.
      link: queue
  - key: urgent_for_analysts
    description: 'Urgent finding: alert analysts at once'
    'on':
      collection: findings
      op: insert
      where:
        urgency: urgent
    notify:
      to: role:analyst
      subject: 'Lanternhouse: urgent finding - {record.title}'
      body: 'An agent flagged an urgent finding: {record.title}. Please validate it so the client can be alerted.'
      link: findings_review
  - key: urgent_for_client
    description: 'Urgent finding validated by an analyst: alert the client'
    'on':
      collection: findings
      op: update
      where:
        urgency: urgent
        status: validated
    notify:
      to: owner
      subject: 'Urgent finding: {record.title}'
      body: 'An analyst validated an urgent finding for your requirements: {record.title}. Source: {record.source}. Open the
        portal for the excerpt, confidence and recommendations.'
      link: findings
  - key: report_published
    description: 'Report signed off: tell the client'
    'on':
      collection: reports
      op: update
      where:
        status: signed_off
    notify:
      to: owner
      subject: 'New report: {record.title}'
      body: A new analyst-reviewed intelligence report is available in your Lanternhouse portal.
      link: reports
  billing:
    modes:
    - subscription
    - credits
    currency: gbp
    signupCredits: 0
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:intel_analyst:
        estimate: 60
        metered: true
    plans:
    - key: retainer
      price: 2500
      interval: month
      label: Lanternhouse monthly retainer (from £2,500)
      includes:
      - Weekly and monthly analyst-reviewed reports
      - Findings table and email alerts
      - Ad-hoc requests using the monthly credit allowance
      credits: 2000
      creditsReset: monthly
      roles:
      - client
    packs:
    - key: adhoc_credits
      credits: 1500
      price: 450
      label: Ad-hoc request credits
  extensions:
  - key: licensed_darkweb_provider
    description: Dark-web forum and marketplace collection must run only through a licensed, lawful provider with a documented
      API. The provider, its host, terms, and an org-scoped API key are to be confirmed and added later as an http tool and
      egress host. Until then agents report that dark-web coverage was not collected. Legal review is required before enabling
      it.
  - key: draft_visibility
    description: Drafts and unvalidated findings are hidden from clients by view filters (status signed_off / validated).
      A separate draft store would give stronger isolation.
  - key: client_teams
    description: Each signed-up user sees its own records. Several readers in one client company sharing the same requirements
      would need a members list on the records; not configured yet.
