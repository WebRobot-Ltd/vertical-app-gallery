apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: ledgerlark
  displayName: Ledgerlark
  tagline:
    en: AI-native bookkeeping and month-end close for accounting firms and their clients.
  description:
    en: Clients snap or drop receipts, an agent extracts and matches them to bank transactions, bookkeepers clear the uncertain
      queue, and a reviewed close pack goes to the client every month.
  langs:
  - en
  defaultLang: en
  timezone: Europe/London
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f3a34'
      accent: '#d98e04'
      background: '#f8f6f1'
      foreground: '#17211f'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Ledger
      color: primary
    - text: lark
      color: accent
  header:
    links:
    - label: How it works
      href: '#how'
    - label: Pricing
      href: '#pricing'
    cta:
      label: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Firm admin
      assignedBy: admin_emails
    - key: bookkeeper
      label: Bookkeeper
      assignedBy: derived
      from: collection:clients.bookkeeper_email
    - key: reviewer
      label: Reviewer
      assignedBy: derived
      from: collection:clients.reviewer_email
    - key: client
      label: Client
      assignedBy: derived
      from: collection:clients.client_email
    - key: user
      assignedBy: signup
  limits:
  - action: agent:closer
    per: user
    max: 20
    window: day
  agents:
  - key: closer
    role: main
    description: Runs the month-end close checklist for one client and asks the reporter for the draft management report.
    delegates:
    - reporter
    profile:
      inline:
        display_name: Ledgerlark close agent
        crews:
        - id: closer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You run the month-end close for ONE client of an accounting firm (UK context, VAT). Steps: 1) read
            the client record with read_client. 2) list_documents and list_bank for the period. 3) Record with add_close_item
            one item per issue, always filling client_name, client_email, bookkeeper_email, reviewer_email, period, status
            open: kind unmatched_txn for bank transactions with no document; kind missing_receipt for payments that need a
            receipt (detail says what to ask the client for, in plain friendly words); kind accrual or prepayment for suggestions
            you can justify from the documents (state the reasoning and amount); kind vat_check for VAT anomalies (rate vs
            category, missing VAT number, totals that do not add up). 4) Then call ask_reporter to draft the management report
            for the same client and period. 5) Finish with a Markdown report starting with a level-1 title ''# Close checklist
            — <client> — <period>'' with sections ## Summary, ## Items to clear, ## VAT checks, ## Accruals and prepayments,
            ## Next steps. Never invent figures: use only the data the tools return, and say when data is missing. You suggest,
            a human decides: do not state anything as final tax or legal advice.'
    appTools:
    - name: read_client
      description: Read the client records you may see
      action: read
      collection: clients
      scope: all
    - name: list_documents
      description: Search uploaded documents
      action: search
      collection: documents
      scope: all
    - name: list_bank
      description: Search imported bank transactions
      action: search
      collection: bank_transactions
      scope: all
    - name: add_close_item
      description: Add a close checklist item
      action: append
      collection: close_items
      scope: all
    context:
    - key: clients
      from: collection:clients
    goalTemplate: 'Run the month-end close.

      Client: {client}

      Period: {period}

      Client records visible to you (one JSON per line): {clients}

      Today is {date}. Write in the language with ISO code {lang}.'
    output: markdown
    limits:
      maxTurns: 30
      maxBudgetUsd: 1.0
  - key: reporter
    role: helper
    description: Drafts the management report for a client and period; a reviewer must approve it before the client sees it.
    profile:
      inline:
        display_name: Ledgerlark report drafter
        crews:
        - id: reporter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You draft a short management report for a small business client from its documents, bank transactions
            and close items. Use list_documents, list_bank, list_close_items and read_client. Sections: ## Headlines, ## Income
            and spending by category, ## Cash position, ## VAT position, ## Open points for the client. Add one chart block
            ```chart {"type":"bar","title":"Spending by category","labels":[...],"series":[{"name":"GBP","values":[...]}],"unit":"GBP"}
            ``` with real figures only. Plain language for a non-accountant owner. Never invent numbers; mark unknowns as
            ''to confirm''. Save it with add_report: client_name, client_email, bookkeeper_email, reviewer_email, period,
            body (the Markdown) and status draft. Never set status to reviewed or shared: a reviewer does that.'
    appTools:
    - name: read_client
      description: Read the client records you may see
      action: read
      collection: clients
      scope: all
    - name: list_documents
      description: Search uploaded documents
      action: search
      collection: documents
      scope: all
    - name: list_bank
      description: Search imported bank transactions
      action: search
      collection: bank_transactions
      scope: all
    - name: list_close_items
      description: Search close checklist items
      action: search
      collection: close_items
      scope: all
    - name: add_report
      description: Save the draft management report
      action: append
      collection: reports
      scope: all
    output: markdown
    limits:
      maxTurns: 15
      maxBudgetUsd: 0.6
  - key: extractor
    role: helper
    description: Reads an uploaded receipt or invoice, extracts the fields, matches a bank transaction and suggests the ledger
      code.
    profile:
      inline:
        display_name: Ledgerlark document extractor
        crews:
        - id: extractor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: A client has uploaded a receipt or invoice (the event gives the record id and file ids). 1) Open
            each file with read_upload (OCR included). 2) Extract supplier, doc_date (YYYY-MM-DD), amount (gross), vat, currency,
            category. 3) read_client to find the client's record (client_name, client_email, bookkeeper_email, reviewer_email)
            and copy them into the document. 4) list_ledger and choose the best ledger_code. 5) search_bank for a transaction
            with the same amount within a few days and a similar description; if exactly one fits, set matched_txn to its
            id and status matched. 6) Save with update_document on the same record id. Set confidence 0-1. If any field is
            unreadable, the match is ambiguous, or confidence is below 0.75, set status needs_review and explain in notes.
            Never guess figures you cannot read.
    appTools:
    - name: read_upload
      description: Read a file the user uploaded
      action: read_file
    - name: read_client
      description: Read the client records you may see
      action: read
      collection: clients
      scope: all
    - name: list_ledger
      description: The chart of accounts
      action: read
      collection: ledger_codes
      scope: all
    - name: search_bank
      description: Search imported bank transactions
      action: search
      collection: bank_transactions
      scope: all
    - name: update_document
      description: Save the extracted fields on the document record
      action: write
      collection: documents
      scope: user
    goalTemplate: 'Process the newly uploaded document. Record id and file ids: {record.file}. Event: {event}'
    output: markdown
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.3
  - key: importer
    role: helper
    description: Imports a bank statement CSV into bank transactions.
    profile:
      inline:
        display_name: Ledgerlark bank importer
        crews:
        - id: importer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: A bookkeeper uploaded a bank statement CSV for one client (the event has the record with client_email
            and the file id). Open it with read_statement, read_client for the client's bookkeeper_email and reviewer_email,
            then add_transaction once per row with client_email, bookkeeper_email, reviewer_email, tx_date (YYYY-MM-DD), description,
            amount (negative for money out), period (YYYY-MM). Skip header and total rows; do not invent rows; do not add
            a row that is clearly a duplicate within the file.
    appTools:
    - name: read_statement
      description: Read an uploaded bank statement file
      action: read_file
    - name: read_client
      description: Read the client records you may see
      action: read
      collection: clients
      scope: all
    - name: add_transaction
      description: Add a bank transaction
      action: append
      collection: bank_transactions
      scope: all
    goalTemplate: 'Import the bank statement. Client: {record.client_email}. File ids: {record.file}. Event: {event}'
    output: markdown
    limits:
      maxTurns: 25
      maxBudgetUsd: 0.5
  inputForm:
    title: Run a month-end close
    fields:
    - name: client
      type: select
      required: true
      label: Client
      optionsFrom: collection:clients
    - name: period
      type: text
      required: true
      label: Period (YYYY-MM)
      help: e.g. 2026-10
  data:
    collections:
    - name: clients
      description: Client companies with their assigned bookkeeper and reviewer. Filled by the firm admins on the data page
        (or CSV).
      ownedBy: org
      fields:
      - name: name
        type: text
        required: true
        label: Company
      - name: client_email
        type: email
        required: true
        label: Client login email
      - name: bookkeeper_email
        type: email
        required: true
        label: Bookkeeper email
      - name: reviewer_email
        type: email
        required: true
        label: Reviewer email
      - name: vat_scheme
        type: select
        label: VAT scheme
        options:
        - standard
        - flat_rate
        - cash
        - not_registered
      - name: close_deadline
        type: date
        label: Next close deadline
      - name: accounting_package
        type: select
        label: Package
        options:
        - xero
        - quickbooks
        - none
      access:
      - role: bookkeeper
        where:
          bookkeeper_email: '{user.email}'
        can:
        - read
      - role: reviewer
        where:
          reviewer_email: '{user.email}'
        can:
        - read
      - role: client
        where:
          client_email: '{user.email}'
        can:
        - read
    - name: ledger_codes
      description: Chart of accounts the agent picks from
      ownedBy: shared
      fields:
      - name: code
        type: text
        required: true
      - name: name
        type: text
        required: true
      - name: vat_rate
        type: number
        label: Default VAT %
    - name: documents
      description: Receipts and invoices uploaded by clients
      ownedBy: user
      retentionDays: 2555
      fields:
      - name: file
        type: file
        required: true
        label: Receipt or invoice
        accept:
        - pdf
        - jpg
        - jpeg
        - png
        - webp
        maxMb: 10
        multiple: true
        capture: true
        extract: none
      - name: notes
        type: text
        label: Note
      - name: supplier
        type: text
      - name: doc_date
        type: date
        label: Date
      - name: amount
        type: number
        label: Amount
      - name: vat
        type: number
        label: VAT
      - name: currency
        type: text
      - name: category
        type: text
      - name: ledger_code
        type: text
        label: Ledger code
      - name: matched_txn
        type: text
        label: Matched transaction
      - name: confidence
        type: number
      - name: status
        type: select
        options:
        - new
        - matched
        - needs_review
        - approved
        default: new
      - name: client_name
        type: text
      - name: client_email
        type: email
      - name: bookkeeper_email
        type: email
      - name: reviewer_email
        type: email
      access:
      - role: bookkeeper
        where:
          bookkeeper_email: '{user.email}'
        can:
        - read
        - write
      - role: reviewer
        where:
          reviewer_email: '{user.email}'
        can:
        - read
    - name: bank_statements
      description: Bank CSV files uploaded by bookkeepers; each starts an import
      ownedBy: org
      fields:
      - name: client_email
        type: select
        required: true
        label: Client
        optionsFrom: collection:clients
      - name: file
        type: file
        required: true
        label: Bank CSV
        accept:
        - csv
        maxMb: 10
        extract: none
    - name: bank_transactions
      description: Imported bank transactions
      ownedBy: org
      retentionDays: 2555
      fields:
      - name: client_email
        type: email
      - name: bookkeeper_email
        type: email
      - name: reviewer_email
        type: email
      - name: tx_date
        type: date
        label: Date
      - name: description
        type: text
      - name: amount
        type: number
      - name: period
        type: text
      access:
      - role: bookkeeper
        where:
          bookkeeper_email: '{user.email}'
        can:
        - read
        - write
      - role: reviewer
        where:
          reviewer_email: '{user.email}'
        can:
        - read
      - role: client
        where:
          client_email: '{user.email}'
        can:
        - read
    - name: close_items
      description: Month-end close checklist items written by the close agent
      ownedBy: org
      fields:
      - name: client_name
        type: text
      - name: client_email
        type: email
      - name: bookkeeper_email
        type: email
      - name: reviewer_email
        type: email
      - name: period
        type: text
      - name: kind
        type: select
        options:
        - unmatched_txn
        - missing_receipt
        - accrual
        - prepayment
        - vat_check
      - name: detail
        type: textarea
      - name: amount
        type: number
      - name: status
        type: select
        options:
        - open
        - resolved
        default: open
      access:
      - role: bookkeeper
        where:
          bookkeeper_email: '{user.email}'
        can:
        - read
        - write
      - role: reviewer
        where:
          reviewer_email: '{user.email}'
        can:
        - read
        - write
    - name: reports
      description: 'Draft management reports: reviewer approves, then shared with the client'
      ownedBy: org
      fields:
      - name: client_name
        type: text
      - name: client_email
        type: email
      - name: bookkeeper_email
        type: email
      - name: reviewer_email
        type: email
      - name: period
        type: text
      - name: body
        type: textarea
      - name: status
        type: select
        options:
        - draft
        - reviewed
        - shared
        default: draft
      access:
      - role: bookkeeper
        where:
          bookkeeper_email: '{user.email}'
        can:
        - read
      - role: reviewer
        where:
          reviewer_email: '{user.email}'
        can:
        - read
        - write
      - role: client
        where:
          client_email: '{user.email}'
          status: shared
        can:
        - read
  views:
  - key: home
    type: page
    title: Ledgerlark
    nav: false
    sections:
    - type: hero
      layout: stack
      band: true
      eyebrow: For accounting firms and their clients
      title: Month-end close that **chases itself**.
      text: Clients snap receipts on their phone. An agent extracts, matches and codes them. Your team only handles the uncertain
        items, and a reviewer signs off every report before the client sees it.
      actions:
      - label: Sign in
        href: /login
        style: primary
    - type: steps
      id: how
      title: How it works
      items:
      - title: Upload
        text: Clients photograph or drop receipts and invoices; bookkeepers import bank CSVs.
        badge: 📷
      - title: Extract and match
        text: Supplier, date, amount, VAT, category and ledger code, matched to bank lines. Doubtful items go to the bookkeeper
          queue.
        badge: 🤖
      - title: Close
        text: Checklist for unmatched lines, missing receipts, accruals, prepayments and VAT checks, plus a draft management
          report.
        badge: ✅
      - title: Review and share
        text: A reviewer approves; the client gets the report. Missing receipts are chased by email.
        badge: 📬
    - type: cards
      id: pricing
      title: Pricing
      items:
      - title: Per client, per month
        text: One simple price for each client company you manage, billed to your firm through Stripe.
    - type: note
      content: Ledgerlark suggests; qualified people decide. It does not give tax or legal advice.
  - key: upload
    type: form
    title: Upload receipt
    collection: documents
    fields:
    - file
    - notes
    submit:
      label: Send
      message: Received. We are reading it now.
      redirect: my_documents
    roles:
    - client
    - admin
  - key: my_documents
    type: table
    title: Documents
    source: collection:documents
    export: true
    roles:
    - client
    - bookkeeper
    - reviewer
    - admin
    data:
      display: table
      fields:
      - key: supplier
        label: Supplier
      - key: doc_date
        label: Date
        format: date
      - key: amount
        label: Amount
        format: money
      - key: vat
        label: VAT
        format: money
      - key: category
        label: Category
      - key: ledger_code
        label: Ledger
      - key: status
        label: Status
        format: badge
      sort:
        field: doc_date
        dir: desc
      limit: 100
  - key: review_queue
    type: table
    title: Bookkeeper queue
    source: collection:documents
    roles:
    - bookkeeper
    - admin
    data:
      display: table
      fields:
      - key: client_name
        label: Client
      - key: supplier
        label: Supplier
      - key: doc_date
        label: Date
        format: date
      - key: amount
        label: Amount
        format: money
      - key: ledger_code
        label: Suggested code
      - key: confidence
        label: Confidence
        format: ratio
      - key: notes
        label: Why
      filters:
      - field: status
        op: '='
        value: needs_review
      limit: 100
      empty: Nothing waiting. Well done.
  - key: review_doc
    type: form
    title: Check document
    collection: documents
    fields:
    - supplier
    - doc_date
    - amount
    - vat
    - category
    - ledger_code
    - matched_txn
    - status
    edit: true
    submit:
      label: Save
      message: Saved.
      redirect: review_queue
    roles:
    - bookkeeper
    - admin
    nav: false
  - key: bank_import
    type: form
    title: Import bank CSV
    collection: bank_statements
    submit:
      label: Import
      message: Import started; transactions appear within a few minutes.
    roles:
    - bookkeeper
    - admin
  - key: new_close
    type: new_run
    title: Run month-end close
    roles:
    - bookkeeper
    - admin
  - key: closes
    type: history
    title: Closes
    source: run
    roles:
    - bookkeeper
    - reviewer
    - admin
  - key: close_report
    type: report
    title: Close checklist
    source: run
    printable: true
    nav: false
  - key: close_items_view
    type: table
    title: Close items
    source: collection:close_items
    export: true
    roles:
    - bookkeeper
    - reviewer
    - admin
    data:
      display: table
      fields:
      - key: client_name
        label: Client
      - key: period
        label: Period
      - key: kind
        label: Type
        format: badge
      - key: detail
        label: Detail
      - key: amount
        label: Amount
        format: money
      - key: status
        label: Status
        format: badge
      limit: 200
  - key: status
    type: page
    title: Close status
    roles:
    - bookkeeper
    - reviewer
    - admin
    sections:
    - type: data
      title: Items by status
      source: collection:close_items
      display: chart
      chart: bar
      fields:
      - key: status
        label: Status
      - key: n
        label: Items
      groupBy:
        field: status
        aggs:
        - key: n
          agg: count
    - type: data
      title: 'Bottlenecks: open items by type'
      source: collection:close_items
      display: chart
      chart: bar
      fields:
      - key: kind
        label: Type
      - key: n
        label: Open
      filters:
      - field: status
        op: '='
        value: open
      groupBy:
        field: kind
        aggs:
        - key: n
          agg: count
    - type: data
      title: Open items per client
      source: collection:close_items
      display: table
      fields:
      - key: client_name
        label: Client
      - key: n
        label: Open items
      filters:
      - field: status
        op: '='
        value: open
      groupBy:
        field: client_name
        aggs:
        - key: n
          agg: count
    - type: data
      title: Documents waiting for a bookkeeper
      source: collection:documents
      display: kpi
      kpis:
      - label: Needs review
        agg: count
      filters:
      - field: status
        op: '='
        value: needs_review
  - key: review_reports
    type: table
    title: Reports to review
    source: collection:reports
    roles:
    - reviewer
    - bookkeeper
    - admin
    data:
      display: table
      fields:
      - key: client_name
        label: Client
      - key: period
        label: Period
      - key: status
        label: Status
        format: badge
      limit: 100
  - key: review_report
    type: form
    title: Review report
    collection: reports
    fields:
    - body
    - status
    edit: true
    submit:
      label: Save
      message: Saved. Set status to shared to send it to the client.
      redirect: review_reports
    roles:
    - reviewer
    - admin
    nav: false
  - key: my_reports
    type: cards
    title: My reports
    source: collection:reports
    roles:
    - client
    data:
      display: cards
      fields:
      - key: period
        label: Period
      - key: body
        label: Report
      sort:
        field: period
        dir: desc
      limit: 24
      empty: Your first report will appear after the month-end close.
  - key: account
    type: account
    title: Billing
    roles:
    - admin
  triggers:
  - key: on_document
    'on':
      collection: documents
      op: insert
      where:
        status: new
    start:
      agent: extractor
    goal: 'Process the newly uploaded document. File ids: {record.file}. Event: {event}'
  - key: on_statement
    'on':
      collection: bank_statements
      op: insert
    start:
      agent: importer
    goal: 'Import the bank statement for {record.client_email}. File ids: {record.file}. Event: {event}'
  - key: chase_receipt
    'on':
      collection: close_items
      op: insert
      where:
        kind: missing_receipt
    notify:
      to:
      - record.client_email
      subject: Receipt needed for {record.period}
      body: 'Hello,


        To finish your books for {record.period} we are missing a receipt or invoice:


        {record.detail}


        You can take a photo and upload it in a minute.'
      link: upload
  - key: deadline_reminder
    'on':
      date:
        collection: clients
        field: close_deadline
        offsetDays: -2
        hour: 8
    notify:
      to:
      - record.bookkeeper_email
      - record.reviewer_email
      subject: 'Close deadline in 2 days: {record.name}'
      body: The month-end close for {record.name} is due in two days. Check the close status and the bookkeeper queue.
      link: status
  - key: report_shared
    'on':
      collection: reports
      op: update
      where:
        status: shared
    notify:
      to:
      - record.client_email
      subject: Your management report for {record.period} is ready
      body: Your reviewed management report for {record.period} is ready to read.
      link: my_reports
  notifications:
    emailOnRunDone: true
  billing:
    modes:
    - subscription
    currency: gbp
    plans:
    - key: per_client
      price: 12
      interval: month
      label: Per client per month
      includes:
      - Receipt extraction and matching
      - Month-end close checklist
      - Reviewed management reports
      roles:
      - admin
  mobile:
    appId: com.ledgerlark.app
    appName: Ledgerlark
    capabilities:
    - name: camera
      reason:
        en: To photograph receipts and invoices
    - name: push
  extensions:
  - key: xero_quickbooks_sync
    description: Two-way sync with Xero and QuickBooks needs OAuth sign-in to those services, which is not available yet.
      For now accountants post the approved ledger codes by hand or by CSV export.
  - key: inbound_email
    description: Receiving receipts by forwarding to an inbound email address is not available yet. Clients upload from the
      phone app or the web (drag and drop).
  - key: open_banking_feeds
    description: Live bank feeds via Open Banking need FCA authorisation as an account information service provider, or a
      licensed partner (OAuth consent flow). Not available yet; bank transactions are imported as CSV.
  - key: per_client_quantity_billing
    description: Stripe billing is a flat monthly plan; automatic quantity billing by the number of active clients is not
      available yet, so the firm adjusts the number of subscriptions to its client count.
