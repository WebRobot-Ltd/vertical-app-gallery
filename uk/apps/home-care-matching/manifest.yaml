apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: kindrova
  displayName: Kindrova
  tagline: Find and organise home care for an older relative, together as a family.
  description: 'Kindrova helps UK families find vetted independent carers and helpers, compare them with the CQC register,
    book trial visits and keep a shared care diary. Kindrova is an introductory service: carers are independent and are not
    employed by Kindrova.'
  langs:
  - en
  defaultLang: en
  timezone: Europe/London
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f4d4a'
      accent: '#d9825b'
      background: '#fbf8f3'
      foreground: '#1d2b2a'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Kind
      color: primary
    - text: rova
      color: accent
    buttonShape: rounded
  header:
    links:
    - label: How it works
      href: '#how'
    - label: Pricing
      href: '#pricing'
    cta:
      label: Get started
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Operator
      assignedBy: admin_emails
    - key: user
      label: Family member or carer
      assignedBy: signup
    - key: carer
      label: Approved carer
      assignedBy: derived
      from: collection:carer_listings.email
  limits:
  - action: agent:finder
    per: user
    max: 10
    window: day
    roles:
    - user
  agents:
  - key: finder
    role: main
    description: Builds a shortlist of carers for a care profile from the Kindrova catalogue and the CQC register.
    profile:
      inline:
        display_name: Kindrova care finder
        crews:
        - id: finder
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 14
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You help UK families find home and community care for an older relative. You are an introductory
            service, not a care provider and not a regulated adviser.


            Sources: (1) the tool search_carers over Kindrova''s own catalogue of vetted independent carers; (2) the tool
            cqc, a read-only call to the CQC public register API (api.service.cqc.org.uk/public/v1). Use path /locations or
            /locations/<locationId> or /providers/<providerId>, with query parameters such as partnerCode, postalCode, regulatedActivity
            or careHome=N; report the overall rating only when the register returns one. Do not use any other directory or
            website.


            Process: read the care needs, search the catalogue for carers covering the town or postcode area, matching needs,
            languages, hourly budget and pets. Then look up CQC-registered domiciliary care providers near the postcode for
            comparison. Pick at most 5 catalogue carers and at most 3 CQC providers.


            Output in Markdown. Start with a level-1 title "# Care shortlist for <relative''s first name or ''your relative''>
            - <town>". Sections with ## headings: Summary of needs, Independent carers from Kindrova (a table: name, services,
            areas, hourly rate, why they fit, book at /v/book), Registered agencies on the CQC register (name, rating and
            inspection date where available, or ''No CQC rating''; source link), Questions to ask, Next steps (book a trial
            visit). Say plainly that independent carers are not CQC-rated and that Kindrova has checked identity, right to
            work and enhanced DBS before listing. Never invent ratings, prices or availability; say when data is missing.
            No medical advice.'
          mcp_servers: []
    goalTemplate: 'Care profile id: {profile}

      Relative''s town: {town}, postcode: {postcode}

      Mobility: {mobility}

      Memory: {memory}

      Personal care needs: {personal_care}

      Hours wanted per week: {hours}

      Budget per hour (GBP): {budget}

      Languages: {languages}

      Pets at home: {pets}

      {?notes}Extra notes: {notes}{/notes}

      Today is {date}. Write the shortlist in English.'
    context:
    - key: town
      from: collection:care_profiles.town
    - key: postcode
      from: collection:care_profiles.postcode
    - key: mobility
      from: collection:care_profiles.mobility
    - key: memory
      from: collection:care_profiles.memory
    - key: personal_care
      from: collection:care_profiles.personal_care
    - key: hours
      from: collection:care_profiles.hours_per_week
    - key: budget
      from: collection:care_profiles.budget_hourly
    - key: languages
      from: collection:care_profiles.languages
    - key: pets
      from: collection:care_profiles.pets
    appTools:
    - name: search_carers
      description: Search Kindrova's catalogue of approved independent carers
      action: search
      collection: carer_listings
      scope: all
    - name: cqc
      description: Read the CQC public register (locations, providers, ratings)
      action: http
      http:
        method: GET
        url: https://api.service.cqc.org.uk/public/v1
        allowPath: true
        attribution: CQC, Open Government Licence v3.0
    output: markdown
    limits:
      maxTurns: 14
      maxBudgetUsd: 0.6
  - key: desk
    role: helper
    description: 'Completes a new booking or diary entry: copies the co-managers from the care profile and the carer''s email
      from the listing.'
    profile:
      inline:
        display_name: Kindrova booking desk
        crews:
        - id: desk
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.15
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You finish records for Kindrova. For a new booking: read the care profile named in the record (tool
            read_profiles), read the carer listing named as the resource (tool read_carers), then update the booking with
            write_bookings so that members = the profile''s members and carer_email = the carer''s email. For a new diary
            entry: read the profile and update the entry with write_diary so that members = the profile''s members and desk_status
            = ''done''. Change nothing else. Answer in one line saying what you did.'
    appTools:
    - name: read_profiles
      description: Read the user's care profiles
      action: read
      collection: care_profiles
      scope: user
    - name: read_carers
      description: Read approved carer listings
      action: read
      collection: carer_listings
      scope: all
    - name: write_bookings
      description: Update the user's bookings
      action: write
      collection: bookings
      scope: user
    - name: write_diary
      description: Update the user's diary entries
      action: write
      collection: diary_entries
      scope: user
    output: markdown
  - key: vetter
    role: helper
    description: Checks a new carer profile is complete and asks the operator to approve it.
    awaits:
    - carer_go_live
    profile:
      inline:
        display_name: Kindrova carer vetter
        crews:
        - id: vetter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.15
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You prepare carer applications for the operator of Kindrova, an introductory care service. Read the
            carer's profile (tool read_my_profile). Check it is complete (services, areas, availability, hourly rate, right-to-work
            and DBS declarations) and has no red flags such as an hourly rate below the national minimum wage or services
            outside what an independent carer may offer. Then call request_carer_go_live once with a short summary and the
            key profile fields (name, email, phone, services, areas, hourly_rate, availability, bio). Remind the operator
            that identity, right-to-work and enhanced DBS results arrive from the checking partner and must be seen as cleared
            in the checks table before approving. You never approve anything yourself and never state that checks are passed.
    appTools:
    - name: read_my_profile
      description: Read the carer's own profile
      action: read
      collection: carer_profiles
      scope: user
    output: markdown
  - key: lister
    role: helper
    description: Publishes an approved carer in the catalogue.
    profile:
      inline:
        display_name: Kindrova lister
        crews:
        - id: lister
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.1
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: The operator has approved a carer. Read the carer's profile (tool read_my_profile) and create one
            listing with write_listing copying name, email, phone, services, areas, availability, hourly_rate, rtw_status,
            dbs_status, bio, and setting engagement to 'independent' and verified_at to today's date. Do not add anything
            else. Answer in one line.
    appTools:
    - name: read_my_profile
      description: Read the carer's own profile
      action: read
      collection: carer_profiles
      scope: user
    - name: write_listing
      description: Create a carer listing in the catalogue
      action: write
      collection: carer_listings
      scope: all
    output: markdown
  inputForm:
    title: Find care
    fields:
    - name: profile
      type: select
      required: true
      label: Care profile
      optionsFrom: collection:care_profiles
    - name: notes
      type: textarea
      maxLength: 500
      label: Anything else we should know (optional)
  data:
    collections:
    - name: care_profiles
      ownedBy: user
      description: The care profile of an older relative, shared with co-managers
      fields:
      - name: relative_name
        type: text
        required: true
        label: Relative's name
      - name: town
        type: text
        required: true
        label: Town
      - name: postcode
        type: text
        required: true
        label: Postcode
      - name: mobility
        type: select
        label: Mobility
        options:
        - Fully mobile
        - Uses a stick or frame
        - Wheelchair user
        - Bed-bound
      - name: memory
        type: select
        label: Memory
        options:
        - No concerns
        - Mild forgetfulness
        - Dementia diagnosed
        - Advanced dementia
      - name: personal_care
        type: multiselect
        label: Personal care needs
        options:
        - Washing and dressing
        - Toileting
        - Medication prompts
        - Meal preparation
        - Companionship
        - Housework
        - Transport and appointments
      - name: hours_per_week
        type: number
        label: Hours wanted per week
      - name: budget_hourly
        type: number
        label: Budget per hour (GBP)
      - name: languages
        type: text
        label: Languages spoken
      - name: pets
        type: text
        label: Pets at home
      - name: members
        type: array
        label: Co-managers (emails of siblings or family)
        help: They get the same access to this profile, bookings and diary.
      access:
      - role: user
        where:
          members: '{user.email}'
        can:
        - read
        - write
    - name: carer_profiles
      ownedBy: user
      description: A carer's own application profile (private to the carer and the operator)
      fields:
      - name: name
        type: text
        required: true
        label: Full name
      - name: email
        type: email
        required: true
        label: Email
      - name: phone
        type: text
        required: true
        label: Mobile phone
      - name: services
        type: multiselect
        required: true
        label: Services
        options:
        - Personal care
        - Companionship
        - Meal preparation
        - Housework
        - Dementia support
        - Medication prompts
        - Transport and appointments
        - Overnight
      - name: areas
        type: text
        required: true
        label: Areas covered (towns or postcode districts)
      - name: availability
        type: textarea
        label: Usual availability
      - name: hourly_rate
        type: number
        required: true
        label: Hourly rate (GBP)
      - name: rtw_status
        type: select
        label: Right to work (declared)
        options:
        - British or Irish citizen
        - Share code
        - Visa
        - Other
      - name: dbs_status
        type: select
        label: DBS (declared)
        options:
        - Enhanced DBS held
        - Not yet
      - name: bio
        type: textarea
        maxLength: 800
        label: About you
    - name: carer_listings
      ownedBy: shared
      description: Approved independent carers, bookable by families. Written only after the operator approves.
      fields:
      - name: name
        type: text
        label: Name
      - name: email
        type: email
        label: Email
      - name: phone
        type: text
        label: Phone
      - name: services
        type: text
        label: Services
      - name: areas
        type: text
        label: Areas covered
      - name: availability
        type: text
        label: Availability
      - name: hourly_rate
        type: number
        label: Hourly rate (GBP)
      - name: rtw_status
        type: text
        label: Right to work
      - name: dbs_status
        type: text
        label: DBS
      - name: bio
        type: textarea
        label: About
      - name: engagement
        type: select
        label: Engagement model
        options:
        - independent
        - employed
        default: independent
      - name: verified_at
        type: date
        label: Verified on
      - name: slots
        type: json
        label: Opening slots (optional override)
      searchable: true
    - name: check_results
      ownedBy: org
      description: Identity, right-to-work and enhanced DBS results sent by the checking partner (operator only)
      fields:
      - name: carer_email
        type: email
        label: Carer
      - name: check_type
        type: select
        label: Check
        options:
        - identity
        - right_to_work
        - enhanced_dbs
      - name: result
        type: select
        label: Result
        options:
        - pending
        - cleared
        - refer
        - failed
      - name: reference
        type: text
        label: Partner reference
      retentionDays: 1095
    - name: bookings
      ownedBy: user
      description: Trial visits and visits booked by a family into a carer's slot
      fields:
      - name: profile
        type: select
        required: true
        label: For which relative
        optionsFrom: collection:care_profiles
      - name: notes
        type: textarea
        label: Notes for the carer
      - name: members
        type: array
        label: Co-managers (filled automatically)
      - name: carer_email
        type: email
        label: Carer (filled automatically)
      - name: visit_notes
        type: textarea
        label: Visit notes (written by the carer)
      access:
      - role: user
        where:
          members: '{user.email}'
        can:
        - read
        - write
      - role: carer
        where:
          carer_email: '{user.email}'
        can:
        - read
        - write
    - name: diary_entries
      ownedBy: user
      description: The shared care diary of a relative
      fields:
      - name: profile
        type: select
        required: true
        label: Relative
        optionsFrom: collection:care_profiles
      - name: date
        type: date
        required: true
        label: Date
      - name: entry
        type: textarea
        required: true
        label: What happened
      - name: mood
        type: select
        label: Mood
        options:
        - Good
        - Fine
        - Low
        - Unwell
      - name: members
        type: array
        label: Co-managers (filled automatically)
      - name: desk_status
        type: select
        label: Processing (automatic)
        options:
        - new
        - done
        default: new
      access:
      - role: user
        where:
          members: '{user.email}'
        can:
        - read
        - write
      retentionDays: 1825
  views:
  - key: home
    type: page
    title: Kindrova
    nav: false
    sections:
    - type: hero
      title: Care for someone you love, **organised together**.
      text: Create a care profile, get a shortlist of vetted independent carers and CQC-registered agencies, book a trial
        visit and keep a shared care diary with your family.
      actions:
      - label: Find care
        href: /login
        style: primary
      - label: I am a carer
        href: /login
        style: ghost
      note: Kindrova is an introductory service. Carers are independent and are not employed by Kindrova.
    - type: steps
      id: how
      title: How it works
      items:
      - title: Create a care profile
        text: Needs, hours, budget and languages. Invite siblings as co-managers.
      - title: Get a shortlist
        text: We search our vetted carers and the CQC register and tell you why each fits.
      - title: Book a trial visit
        text: Pick a slot and pay securely. Confirmations and reminders by email.
      - title: Keep a shared diary
        text: Visit notes and family entries in one place for everyone who helps.
    - type: cards
      title: Every carer is checked
      items:
      - title: Identity
        text: Verified by a third-party checking service.
        badge: 🪪
      - title: Right to work
        text: Checked before a carer goes live.
        badge: ✅
      - title: Enhanced DBS
        text: Required, and each carer is approved by hand.
        badge: 🛡️
    - type: cards
      id: pricing
      title: Pricing
      items:
      - title: 'Browse and find: free'
        text: Profiles, shortlists and carer search cost nothing.
      - title: 'Care diary: £15 a month'
        text: The shared diary and visit notes for your whole family.
      - title: Bookings
        text: A small service fee is added to each paid visit.
    - type: note
      content: Kindrova does not provide care or employ carers. Always check a provider's current CQC rating on cqc.org.uk.
        Ratings shown come from the CQC public register (Open Government Licence v3.0).
  - key: profile_form
    type: form
    title: Care profile
    collection: care_profiles
    edit: true
    submit:
      label: Save profile
      message: Profile saved.
      redirect: profiles
    roles:
    - user
    - admin
  - key: profiles
    type: cards
    title: My relatives
    source: collection:care_profiles
    data:
      display: cards
      fields:
      - key: relative_name
        label: Name
      - key: town
        label: Town
      - key: postcode
        label: Postcode
      - key: hours_per_week
        label: Hours/week
      - key: budget_hourly
        label: Budget/h
        format: money
    roles:
    - user
    - admin
  - key: new_search
    type: new_run
    title: Find care
    roles:
    - user
    - admin
  - key: searches
    type: history
    title: My shortlists
    source: run
    roles:
    - user
    - admin
  - key: shortlist
    type: report
    title: Shortlist
    source: run
    printable: true
    nav: false
  - key: carers
    type: cards
    title: Browse carers
    source: collection:carer_listings
    data:
      display: cards
      fields:
      - key: name
        label: Name
      - key: services
        label: Services
      - key: areas
        label: Areas
      - key: hourly_rate
        label: Per hour
        format: money
      - key: verified_at
        label: Verified
        format: date
      sort:
        field: hourly_rate
        dir: asc
      actions:
      - type: call
        label: Call
        field: phone
    roles:
    - user
    - admin
  - key: book
    type: booking
    title: Book a trial visit
    collection: bookings
    resources: collection:carer_listings
    fields:
    - profile
    - notes
    slots:
      days:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      from: 08:00
      to: '20:00'
      minutes: 60
      tz: Europe/London
      aheadDays: 28
      minNoticeHours: 12
      capacity: 1
    roles:
    - user
    - admin
  - key: my_bookings
    type: table
    title: Visits
    source: collection:bookings
    data:
      display: table
      fields:
      - key: date
        label: Date
        format: date
      - key: start
        label: Start
        format: date
      - key: resource
        label: Carer
      - key: status
        label: Status
        format: badge
      - key: visit_notes
        label: Visit notes
      sort:
        field: start
        dir: desc
      actions:
      - type: calendar
        label: Add to calendar
        title: resource
        start: start
        end: end
    roles:
    - user
    - admin
  - key: visit_note
    type: form
    title: Visit notes
    collection: bookings
    fields:
    - visit_notes
    edit: true
    submit:
      label: Save notes
      message: Notes saved for the family.
      redirect: my_bookings
    nav: false
    roles:
    - carer
    - admin
  - key: diary
    type: table
    title: Care diary
    source: collection:diary_entries
    data:
      display: list
      fields:
      - key: date
        label: Date
        format: date
      - key: mood
        label: Mood
        format: badge
      - key: entry
        label: Entry
      sort:
        field: date
        dir: desc
    preview:
      rows: 3
      unlessPlan: care_diary
    export: true
    roles:
    - user
    - admin
  - key: diary_add
    type: form
    title: Add diary entry
    collection: diary_entries
    fields:
    - profile
    - date
    - entry
    - mood
    submit:
      label: Save entry
      message: Entry added to the diary.
      redirect: diary
    roles:
    - user
    - admin
  - key: carer_apply
    type: form
    title: Carer profile
    collection: carer_profiles
    edit: true
    submit:
      label: Send for approval
      message: Thank you. We will run your checks and an operator will review your profile.
    roles:
    - user
    - admin
  - key: approvals
    type: approvals
    title: Carer approvals
    approvals:
    - carer_go_live
    roles:
    - admin
  - key: checks
    type: table
    title: Check results
    source: collection:check_results
    data:
      display: table
      fields:
      - key: carer_email
        label: Carer
      - key: check_type
        label: Check
        format: badge
      - key: result
        label: Result
        format: badge
      - key: reference
        label: Reference
    roles:
    - admin
  - key: account
    type: account
    title: Plan and payments
    roles:
    - user
    - carer
  approvals:
  - key: carer_go_live
    title: Approve carer to go live
    description: Approve only when identity, right-to-work and enhanced DBS checks show cleared.
    role: admin
    fields:
    - name
    - email
    - phone
    - services
    - areas
    - hourly_rate
    - availability
    - bio
    decidedBy: role
    timeoutMinutes: 10080
    onTimeout: reject
  triggers:
  - key: new_carer
    description: 'A carer applies: prepare the approval request'
    'on':
      collection: carer_profiles
      op: insert
    start:
      agent: vetter
    goal: 'A new carer application was saved: {event}. Review it and request approval.'
  - key: carer_approved
    description: 'Operator approved: publish the carer'
    'on':
      approval: carer_go_live
      decision: approved
    start:
      agent: lister
    goal: 'The operator approved this carer: {event}. Publish the listing.'
  - key: carer_live
    'on':
      collection: carer_listings
      op: insert
    notify:
      to: record.email
      subject: You are live on Kindrova
      body: Hello {record.name}, your checks are complete and your profile is now visible to families on Kindrova.
      link: carer_apply
  - key: checks_result
    description: Result from the checking partner
    'on':
      webhook: true
    write:
      collection: check_results
      fields:
        carer_email: carer_email
        check_type: type
        result: result
        reference: ref
      keyBy: reference
  - key: booking_desk
    'on':
      collection: bookings
      op: insert
      where:
        status: booked
    start:
      agent: desk
    goal: 'New booking: {event}. Complete it.'
  - key: diary_desk
    'on':
      collection: diary_entries
      op: insert
      where:
        desk_status: new
    start:
      agent: desk
    goal: 'New diary entry: {event}. Complete it.'
  - key: booking_family_confirm
    'on':
      collection: bookings
      op: insert
    notify:
      to: owner
      subject: Your Kindrova visit is booked
      body: Your visit on {record.date} is booked. We will email you a reminder the day before.
      link: my_bookings
  - key: booking_carer_confirm
    'on':
      collection: bookings
      op: update
      where:
        status: booked
    notify:
      to: record.carer_email
      subject: New Kindrova booking
      body: You have a visit on {record.date}. Details are in your bookings.
      link: my_bookings
  - key: visit_reminder
    'on':
      date:
        collection: bookings
        field: start
        offsetDays: -1
        hour: 8
    notify:
      to:
      - owner
      - record.carer_email
      subject: 'Reminder: visit tomorrow'
      body: A Kindrova visit is booked for tomorrow ({record.date}).
      link: my_bookings
  egress:
    hosts:
    - api.service.cqc.org.uk
    notes: 'CQC public register API: data under the Open Government Licence v3.0. Local authority directories are not queried
      until each one''s terms are confirmed.'
  mobile:
    appId: com.kindrova.app
    appName: Kindrova
    capabilities:
    - name: push
  billing:
    modes:
    - subscription
    - per_transaction
    currency: gbp
    transactionFeePct: 10
    sellers: collection:carer_listings
    plans:
    - key: care_diary
      price: 15
      interval: month
      label: Care diary
      includes:
      - Shared care diary
      - Visit notes for all co-managers
      - CSV export
      roles:
      - user
  notifications:
    emailOnRunDone: true
  extensions:
  - key: sms_whatsapp
    description: Booking confirmations and shift reminders to carers by SMS and WhatsApp are not available yet. Carers get
      them by email and by push notification in the phone app.
  - key: checks_provider
    description: Identity, right-to-work and enhanced DBS checks come from a third-party checking provider that must be chosen
      and contracted. Its results reach Kindrova on the checks_result webhook (carer_email, type, result, ref) and show in
      the Check results table; the provider's API host and key are not set up yet, so ordering a check from inside the app
      is not available.
  - key: local_authority_directories
    description: 'Local authority care directories are not queried yet: each one''s terms of use must be confirmed first.'
  - key: cqc_ready
    description: Introductory-service model today (carers have engagement = independent). If Kindrova later employs carers,
      the CQC registration for personal care will be Kindrova's own. The data model already carries an engagement field, and
      diary entries, visit notes and check results are kept for audit. Rotas, care plans, medication records, incident logs
      and CQC notifications are not built yet.
  - key: stripe_connect_carers
    description: Paying a visit through Stripe with a platform fee needs the operator's Stripe account and each carer onboarded
      as a Connect seller; the 10% fee is a starting value to confirm.
