apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: theatrix
  displayName: Theatrix
  tagline:
    en: Pre-operative assessment, ready before the day of surgery.
  description:
    en: Patients on a surgical waiting list complete their pre-operative assessment online and upload documents. Nurses work
      a prioritised list and decide fitness for surgery. An AI assistant only flags incomplete forms and drafts chase messages
      for a nurse to approve. Managers follow pathway status per specialty, with NHS waiting-time statistics as context.
  langs:
  - en
  defaultLang: en
  timezone: Europe/London
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#005eb8'
      accent: '#007f3b'
      background: '#f0f4f5'
      foreground: '#212b32'
    fonts:
      body: Inter
      display: Inter
    wordmark:
    - text: Theat
      color: primary
    - text: rix
      color: accent
    width: wide
  header:
    links:
    - label: How it works
      href: '#how-it-works'
    - label: Roles
      href: '#roles'
    cta:
      label: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Trust admin
      assignedBy: admin_emails
    - key: patient
      label: Patient
      assignedBy: signup
    - key: nurse
      label: Pre-assessment nurse
      assignedBy: invite
    - key: surgeon
      label: Surgeon
      assignedBy: invite
    - key: pathway_manager
      label: Pathway manager
      assignedBy: invite
  agents:
  - key: checker
    role: helper
    description: Flags incomplete pre-operative forms and drafts chase messages for a nurse to approve. Never judges fitness
      for surgery.
    profile:
      inline:
        display_name: Theatrix form checker
        crews:
        - id: checker
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are an administrative assistant for a hospital pre-assessment team. You receive one patient''s
            pre-operative questionnaire. Your ONLY jobs are: (1) check COMPLETENESS and (2) draft a polite chase message.


            Completeness: the form must contain medical history, current medications (or an explicit ''none''), allergies
            (or an explicit ''none''), smoking status, alcohol use, mobility, anaesthetic history, and at least one uploaded
            document when the history mentions a condition that typically needs a letter or test result. Empty, vague (''see
            GP'') or contradictory answers count as missing. You may open an uploaded file with read_upload (using its file
            id) only to check that it is readable and relevant, never to interpret it clinically.


            You must NEVER decide, suggest or hint at whether the patient is fit for surgery, estimate clinical risk, interpret
            answers medically, or give medical advice. Fitness is decided only by a pre-assessment nurse.


            If something is missing: call flag_assessment once with status ''incomplete_flagged'' and missing_info = a short
            bullet list of what is missing (no clinical comment). Then call save_chase_draft once with patient_email, patient_name,
            subject, message and status ''draft''. The message is plain English, kind, short (under 120 words), lists only
            the outstanding steps, tells the patient to sign in with the link they received to complete them, and asks them
            to contact the pre-assessment team by phone for any health question. Do not include clinical details of their
            answers.

            If nothing is missing: call flag_assessment once with status ''ready_for_nurse'' and missing_info ''Complete''.
            Do not draft a message.

            Finish with a one-sentence summary starting with ''# Check''. Never invent data.'
          mcp_servers: []
    appTools:
    - name: flag_assessment
      description: Set status and missing_info on the patient's assessment record
      action: write
      collection: assessments
      scope: user
    - name: save_chase_draft
      description: Save a draft chase message for a nurse to approve
      action: append
      collection: chase_drafts
      scope: user
    - name: read_upload
      description: Read a file the patient uploaded to check it is readable
      action: read_file
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.3
  data:
    collections:
    - name: assessments
      ownedBy: user
      description: Each patient's pre-operative assessment questionnaire, its completeness status and the nurse's decision
      fields:
      - name: patient_name
        type: text
        required: true
        label: Full name
      - name: patient_email
        type: email
        required: true
        label: Email
      - name: patient_phone
        type: text
        label: Mobile phone
      - name: specialty
        type: select
        required: true
        label: Specialty
        options:
        - orthopaedics
        - general_surgery
        - ophthalmology
        - ent
        - gynaecology
        - urology
        - vascular
        - other
      - name: procedure
        type: text
        label: Planned operation
      - name: surgery_date
        type: date
        label: Date of surgery (from your letter)
      - name: history
        type: textarea
        required: true
        label: Medical history
        help: Conditions, previous operations, hospital stays.
      - name: medications
        type: textarea
        required: true
        label: Current medications
        help: Write 'none' if you take none.
      - name: allergies
        type: textarea
        required: true
        label: Allergies
        help: Write 'none' if you have none.
      - name: smoking
        type: select
        required: true
        label: Smoking
        options:
        - never
        - former
        - current
      - name: alcohol_units
        type: number
        label: Alcohol units per week
      - name: mobility
        type: select
        required: true
        label: Mobility
        options:
        - independent
        - uses_stick_or_frame
        - needs_help
        - wheelchair
      - name: anaesthetic_history
        type: textarea
        required: true
        label: Previous anaesthetics
        help: Any problems for you or your family with anaesthetics. Write 'none' if no previous anaesthetic.
      - name: documents
        type: file
        label: Documents (GP letters, test results, medication lists)
        accept:
        - pdf
        - jpg
        - jpeg
        - png
        maxMb: 10
        multiple: true
        capture: true
      - name: status
        type: select
        label: Form status
        default: submitted
        options:
        - submitted
        - incomplete_flagged
        - ready_for_nurse
        - reviewed
      - name: missing_info
        type: textarea
        label: Missing information
      - name: nurse_decision
        type: select
        label: Nurse decision
        options:
        - fit_for_surgery
        - not_fit_for_surgery
        - more_information_needed
        - refer_to_anaesthetist
        - defer
      - name: nurse_notes
        type: textarea
        label: Nurse notes
      access:
      - role: nurse
        can:
        - read
        - write
      - role: surgeon
        can:
        - read
      - role: pathway_manager
        can:
        - read
    - name: chase_drafts
      ownedBy: user
      description: Chase messages drafted by the assistant; sent to the patient only after a nurse approves
      retentionDays: 365
      fields:
      - name: patient_email
        type: email
        required: true
        label: To
      - name: patient_name
        type: text
        label: Patient
      - name: subject
        type: text
        required: true
        label: Subject
      - name: message
        type: textarea
        required: true
        label: Message
      - name: status
        type: select
        label: Status
        default: draft
        options:
        - draft
        - approved
        - discarded
      access:
      - role: nurse
        can:
        - read
        - write
    - name: rtt_stats
      ownedBy: shared
      description: NHS England Referral-to-Treatment waiting-time statistics per specialty and month, imported by the trust
        admin (CSV on /admin/data) from the published NHS statistics
      fields:
      - name: month
        type: date
        required: true
        label: Month
      - name: specialty
        type: text
        required: true
        label: Specialty
      - name: waiting_list
        type: number
        label: Patients waiting
      - name: pct_within_18_weeks
        type: number
        label: '% within 18 weeks'
      - name: over_52_weeks
        type: number
        label: Waiting over 52 weeks
  views:
  - key: home
    type: page
    title: Theatrix
    nav: false
    sections:
    - type: hero
      layout: stack
      band: true
      eyebrow: Pre-operative assessment
      title: Ready for theatre, **before** the day of surgery.
      text: Complete your pre-operative assessment online, from your phone or computer. Your pre-assessment nurse reviews
        it and decides if you are fit for surgery.
      actions:
      - label: Start my assessment
        href: /v/assessment
        style: primary
      - label: Staff sign in
        href: /login
        style: ghost
    - type: steps
      id: how-it-works
      title: How it works
      items:
      - title: 1 · You get a link
        text: Your hospital invites you by link. Sign in with your email, no password.
      - title: 2 · You answer and upload
        text: History, medicines, allergies, smoking, alcohol, mobility, previous anaesthetics, plus any letters or results.
      - title: 3 · Gaps are flagged
        text: An assistant spots missing answers and drafts a reminder. A nurse approves every message before it is sent.
      - title: 4 · A nurse decides
        text: Only your pre-assessment nurse decides if you are fit for surgery.
    - type: cards
      id: roles
      title: Built for the whole pathway
      items:
      - title: Patients
        text: One clear form, reminders by email for outstanding steps.
      - title: Pre-assessment nurses
        text: A work list ordered by date of surgery, with missing information visible.
      - title: Surgeons
        text: See which of their patients have been assessed as fit.
      - title: Pathway managers
        text: Status per specialty with NHS waiting-time statistics as context.
      - title: Trust admins
        text: Invite staff and manage the trust's reference data.
    - type: note
      content: Theatrix supports administrative work. It does not make clinical decisions and gives no medical advice. Fitness
        for surgery is always decided by a clinician. If you feel unwell, contact your GP or call NHS 111; in an emergency
        call 999.
  - key: assessment
    type: form
    title: My pre-operative assessment
    collection: assessments
    fields:
    - patient_name
    - patient_email
    - patient_phone
    - specialty
    - procedure
    - surgery_date
    - history
    - medications
    - allergies
    - smoking
    - alcohol_units
    - mobility
    - anaesthetic_history
    - documents
    submit:
      label: Submit assessment
      message: Thank you. Your pre-assessment team will review it. You will get an email if anything is still needed.
      redirect: my_assessments
    edit: true
    roles:
    - patient
  - key: my_assessments
    type: table
    title: My assessments
    source: collection:assessments
    roles:
    - patient
    data:
      display: table
      fields:
      - key: procedure
        label: Operation
      - key: surgery_date
        label: Surgery date
        format: date
      - key: status
        label: Status
        format: badge
      - key: missing_info
        label: Still needed
      sort:
        field: surgery_date
        dir: asc
      limit: 20
      empty: You have not submitted an assessment yet.
  - key: worklist
    type: table
    title: Work list
    source: collection:assessments
    roles:
    - nurse
    - admin
    data:
      display: table
      fields:
      - key: surgery_date
        label: Surgery date
        format: date
      - key: patient_name
        label: Patient
      - key: specialty
        label: Specialty
        format: badge
      - key: procedure
        label: Operation
      - key: status
        label: Form status
        format: badge
      - key: missing_info
        label: Missing information
      - key: nurse_decision
        label: Decision
        format: badge
      - key: patient_phone
        label: Phone
      sort:
        field: surgery_date
        dir: asc
      limit: 200
      actions:
      - type: call
        field: patient_phone
        label: Call
      empty: No assessments yet.
    export: true
  - key: review
    type: form
    title: Nurse review
    collection: assessments
    fields:
    - nurse_decision
    - nurse_notes
    - status
    edit: true
    submit:
      label: Save decision
      message: Decision saved.
      redirect: worklist
    roles:
    - nurse
    nav: false
  - key: chase_queue
    type: table
    title: Chase messages
    source: collection:chase_drafts
    roles:
    - nurse
    - admin
    data:
      display: table
      fields:
      - key: patient_name
        label: Patient
      - key: subject
        label: Subject
      - key: message
        label: Draft
      - key: status
        label: Status
        format: badge
      filters:
      - field: status
        op: '='
        value: draft
      limit: 100
      empty: No drafts waiting for approval.
  - key: chase_review
    type: form
    title: Edit and approve message
    collection: chase_drafts
    fields:
    - subject
    - message
    - status
    edit: true
    submit:
      label: Save
      message: Saved. Approved messages are emailed to the patient.
      redirect: chase_queue
    roles:
    - nurse
    nav: false
  - key: surgeon_list
    type: table
    title: My assessed patients
    source: collection:assessments
    roles:
    - surgeon
    - admin
    data:
      display: table
      fields:
      - key: surgery_date
        label: Surgery date
        format: date
      - key: patient_name
        label: Patient
      - key: specialty
        label: Specialty
        format: badge
      - key: procedure
        label: Operation
      - key: nurse_decision
        label: Nurse decision
        format: badge
      - key: nurse_notes
        label: Nurse notes
      filters:
      - field: status
        op: '='
        value: reviewed
      sort:
        field: surgery_date
        dir: asc
      limit: 200
      empty: No reviewed patients yet.
  - key: dashboard
    type: page
    title: Pathway dashboard
    roles:
    - pathway_manager
    - admin
    sections:
    - type: data
      id: kpis
      title: Pathway at a glance
      source: collection:assessments
      display: kpi
      kpis:
      - label: Assessments
        agg: count
    - type: data
      id: by-specialty
      title: Assessments per specialty
      source: collection:assessments
      display: chart
      chart: bar
      fields:
      - key: specialty
        label: Specialty
      - key: count
        label: Assessments
      groupBy:
        field: specialty
        aggs: []
    - type: data
      id: by-status
      title: Form status
      source: collection:assessments
      display: chart
      chart: pie
      fields:
      - key: status
        label: Status
      - key: count
        label: Forms
      groupBy:
        field: status
        aggs: []
    - type: data
      id: by-decision
      title: Nurse decisions
      source: collection:assessments
      display: chart
      chart: bar
      fields:
      - key: nurse_decision
        label: Decision
      - key: count
        label: Patients
      groupBy:
        field: nurse_decision
        aggs: []
    - type: data
      id: rtt
      title: 'Context: NHS waiting times'
      intro: Referral-to-Treatment statistics published by NHS England, loaded by the trust admin.
      source: collection:rtt_stats
      display: table
      fields:
      - key: month
        label: Month
        format: date
      - key: specialty
        label: Specialty
      - key: waiting_list
        label: Waiting
        format: number
      - key: pct_within_18_weeks
        label: '% within 18 weeks'
        format: number
      - key: over_52_weeks
        label: Over 52 weeks
        format: number
      sort:
        field: month
        dir: desc
      limit: 60
      empty: No NHS statistics loaded yet.
  triggers:
  - key: check_new_form
    description: When a patient submits a form, the assistant checks completeness and drafts a chase message
    'on':
      collection: assessments
      op: insert
      where:
        status: submitted
    start:
      agent: checker
    goal: 'Check this pre-operative questionnaire for completeness and, if needed, draft a chase message. Record: {event}.
      Fields: name {record.patient_name}, email {record.patient_email}, history {record.history}, medications {record.medications},
      allergies {record.allergies}, smoking {record.smoking}, alcohol units {record.alcohol_units}, mobility {record.mobility},
      anaesthetic history {record.anaesthetic_history}, uploaded document ids {record.documents}. Write in English.'
    asUser: true
  - key: send_chase
    description: 'A nurse approved a chase message: email it to the patient'
    'on':
      collection: chase_drafts
      op: update
      where:
        status: approved
    notify:
      to:
      - record.patient_email
      subject: '{record.subject}'
      body: '{record.message}'
      link: my_assessments
  - key: remind_14
    description: Reminder 14 days before surgery for forms still incomplete
    'on':
      date:
        collection: assessments
        field: surgery_date
        offsetDays: -14
        hour: 8
      where:
        status: incomplete_flagged
    notify:
      to:
      - record.patient_email
      subject: Your pre-operative assessment is not complete
      body: Hello {record.patient_name}, your surgery is planned for {record.surgery_date} and some steps of your pre-operative
        assessment are still outstanding. Please sign in to complete them. If you have a health question, call your pre-assessment
        team.
      link: my_assessments
  - key: remind_7
    description: Final reminder 7 days before surgery
    'on':
      date:
        collection: assessments
        field: surgery_date
        offsetDays: -7
        hour: 8
      where:
        status: incomplete_flagged
    notify:
      to:
      - record.patient_email
      - role:nurse
      subject: 'Urgent: pre-operative assessment still incomplete'
      body: '{record.patient_name}''s pre-operative assessment is still incomplete and surgery is planned for {record.surgery_date}.
        Patients: please sign in and finish the outstanding steps, or call your pre-assessment team.'
      link: my_assessments
  billing:
    modes:
    - free
  extensions:
  - key: pas_theatre_integration
    description: Integration with each trust's patient administration system and theatre scheduling system (waiting-list import,
      surgery dates, write-back of decisions) is trust-specific and not available in the manifest. Until built, patients enter
      the surgery date from their letter and admins load reference data on /admin/data.
  - key: sms_reminders
    description: SMS reminders are not available yet; reminders go by email only.
  - key: readiness_risk_prediction
    description: The readiness and cancellation-risk prediction is regulated software as a medical device (DCB0129 safety
      case, clinical validation) and is deliberately NOT part of this manifest or of the agent, which only checks completeness
      and drafts messages.
  - key: per_trust_licensing
    description: Pricing is per trust per year by contract, outside the app's credits and Stripe packs. Deploy one app instance
      per trust so each trust's patient data stays separate.
  - key: patient_invite_link
    description: Patients receive the sign-in link from the trust; bulk invitations generated from the waiting list need the
      PAS integration.
  - key: nhs_stats_import
    description: NHS England RTT statistics are loaded into rtt_stats as CSV by the trust admin; no automatic feed.
  - key: clinical_governance
    description: DCB0160 clinical safety, DPIA, DSPT and NHS data-security assurance for the trust deployment are the customer's
      and vendor's governance work.
