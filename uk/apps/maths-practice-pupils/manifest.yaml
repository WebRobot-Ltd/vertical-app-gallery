apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: numbloom
  displayName: Numbloom
  tagline: Maths practice that adapts to every pupil.
  description: AI maths practice for primary and lower secondary pupils, aligned with the DfE National Curriculum. Adaptive
    exercises, step-by-step explanations, misconception spotting and weekly teacher insights.
  langs:
  - en
  defaultLang: en
  timezone: Europe/London
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#2b3a8c'
      accent: '#f28c28'
      background: '#fbf9f4'
      foreground: '#1c2233'
    fonts:
      body: Nunito
      display: Baloo 2
    wordmark:
    - text: Num
      color: primary
    - text: bloom
      color: accent
    buttonShape: rounded
  header:
    links:
    - label: How it works
      href: '#how'
    - label: Safety
      href: '#safety'
    - label: Pricing
      href: '#pricing'
    cta:
      label: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Numbloom admin
      assignedBy: admin_emails
    - key: school_admin
      label: School admin
      assignedBy: invite
    - key: teacher
      label: Teacher
      assignedBy: invite
    - key: parent
      label: Parent
      assignedBy: derived
      from: collection:progress.parent_email
    - key: pupil
      label: Pupil
      assignedBy: signup
  limits:
  - action: agent:tutor
    per: user
    max: 15
    window: day
    roles:
    - pupil
  agents:
  - key: tutor
    role: main
    description: Generates curriculum-aligned practice, adapts to previous results, explains mistakes and spots misconceptions.
      No chat.
    profile:
      inline:
        display_name: Numbloom tutor
        crews:
        - id: tutor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 4
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are a kind, encouraging maths tutor for pupils aged 5-14 in England. Everything you set is aligned
            with the DfE National Curriculum for mathematics for the pupil''s year group. Use plain, friendly language with
            short sentences, suited to the age. You only use the pupil''s first name. Never ask for or reveal any personal
            information, never chat freely, never discuss anything but maths.


            Start with a level-1 title: "# <Topic> practice for <first name>".

            If the pupil submitted answers to a previous set, first mark each one under ## Your answers, and for each mistake
            explain step by step in plain language what to do, using a tiny worked example. Then under ## What I noticed name
            any misconception you suspect (for example adding denominators, place-value slips) kindly and without blame.

            Then give ## Your next practice: 6 exercises, numbered, starting easier and adapting difficulty to the recent
            results supplied (raise it after strong results, lower it after weak ones). Do not give the answers to the new
            exercises. Keep it under 450 words. Add a short encouraging closing line.


            Finally, end with one fenced json block and nothing after it: {"first_name":"","class_name":"","teacher_email":"","parent_email":"","year":"","topic":"","score":<0-100
            percent correct on the submitted answers, or null if none>,"questions":<number marked>,"misconception":"<short
            label or empty>","summary":"<one sentence for the teacher>","date":"<YYYY-MM-DD>"}. Copy first_name, class_name,
            teacher_email, parent_email exactly from the values given. Never invent results.'
    context:
    - key: first_name
      from: collection:pupil_profile.first_name
    - key: class_name
      from: collection:pupil_profile.class_name
    - key: teacher_email
      from: collection:pupil_profile.teacher_email
    - key: parent_email
      from: collection:pupil_profile.parent_email
    - key: recent
      from: collection:progress
    goalTemplate: 'Pupil first name: {first_name}. Class: {class_name}. Year group: {year_label}. Topic: {topic_label}.

      teacher_email: {teacher_email}

      parent_email: {parent_email}

      Recent results (one JSON line each): {recent}

      {?answers}Answers to the previous set: {answers}{/answers}{!answers}This is the first set on this topic.{/answers}

      Today is {date}. Write in English.'
    output: markdown+json
    writesTo:
      collection: progress
      parse: json_last
  - key: digest
    role: helper
    description: Weekly summary for a teacher of who is struggling and with what.
    profile:
      inline:
        display_name: Numbloom weekly digest
        crews:
        - id: digest
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write a weekly briefing for a class teacher. Use the read_progress tool to read the last 7 days
            of pupil results the teacher can see. Start with "# Weekly maths digest — week of <date>". Sections: ## Who needs
            help (pupil first names, topic, score trend), ## Common misconceptions (grouped by class), ## Doing well, ## Suggested
            homework topics for next week (National Curriculum topics). Add a chart block for average score by topic: ```chart

            {"type":"bar","title":"Average score by topic","labels":[...],"series":[{"name":"Score","values":[...]}],"unit":"%"}```.
            Use first names and class only; never add other personal data. Use only real figures from the data; if there is
            little data, say so. Under 400 words.'
    appTools:
    - name: read_progress
      description: Read pupil progress records the teacher can see
      action: read
      collection: progress
      scope: user
    goalTemplate: Write this week's digest for "{instance}". {?class_name}Focus on class {class_name}.{/class_name} Today
      is {date}. Write in English.
    output: markdown
    writesTo:
      collection: digests
  templates:
  - key: weekly_digest
    title: Weekly class digest
    description: A Friday email of who is struggling and with what.
    agent: digest
    params:
    - name: class_name
      type: text
      label: Class (optional)
    schedule:
      cron: 0 15 * * 5
      userCanChange: true
    maxPerUser: 1
    roles:
    - teacher
    goal: Write this week's digest for "{instance}". {?class_name}Focus on class {class_name}.{/class_name} Today is {date}.
      Write in English.
    deliver:
      to: owner
      subject: Numbloom weekly digest
      onlyIfNew: true
  inputForm:
    title: New practice
    fields:
    - name: year
      type: select
      required: true
      label: Year group
      options:
      - value: y1
        label: Year 1
      - value: y2
        label: Year 2
      - value: y3
        label: Year 3
      - value: y4
        label: Year 4
      - value: y5
        label: Year 5
      - value: y6
        label: Year 6
      - value: y7
        label: Year 7
      - value: y8
        label: Year 8
      - value: y9
        label: Year 9
    - name: topic
      type: select
      required: true
      label: Topic
      options:
      - value: number_place_value
        label: Number and place value
      - value: addition_subtraction
        label: Addition and subtraction
      - value: multiplication_division
        label: Multiplication and division
      - value: fractions
        label: Fractions, decimals and percentages
      - value: ratio_proportion
        label: Ratio and proportion
      - value: algebra
        label: Algebra
      - value: measurement
        label: Measurement
      - value: geometry
        label: 'Geometry: shapes, position and direction'
      - value: statistics
        label: Statistics
    - name: answers
      type: textarea
      maxLength: 500
      label: Answers to your last set (optional)
      help: 'Write 1: your answer, 2: your answer…'
  data:
    collections:
    - name: pupil_profile
      ownedBy: user
      description: A pupil's first name and class only
      fields:
      - name: first_name
        type: text
        required: true
        maxLength: 30
        label: First name
      - name: class_name
        type: text
        required: true
        maxLength: 20
        label: Class
      - name: teacher_email
        type: email
        required: true
        label: Teacher's email
      - name: parent_email
        type: email
        label: Parent's email (optional, to link at home)
      access:
      - role: school_admin
    - name: progress
      ownedBy: user
      description: One record per practice set marked
      retentionDays: 730
      fields:
      - name: first_name
        type: text
      - name: class_name
        type: text
      - name: teacher_email
        type: email
      - name: parent_email
        type: email
      - name: year
        type: text
      - name: topic
        type: text
      - name: score
        type: number
      - name: questions
        type: number
      - name: misconception
        type: text
      - name: summary
        type: text
      - name: date
        type: date
      access:
      - role: teacher
        where:
          teacher_email: '{user.email}'
      - role: parent
        where:
          parent_email: '{user.email}'
      - role: school_admin
    - name: roster
      ownedBy: user
      description: The teacher's class lists with pupil login codes
      fields:
      - name: first_name
        type: text
        required: true
        maxLength: 30
        label: Pupil first name
      - name: class_name
        type: text
        required: true
        maxLength: 20
        label: Class
      - name: login_code
        type: text
        required: true
        maxLength: 12
        label: Login code
      access:
      - role: school_admin
    - name: homework
      ownedBy: user
      description: Weekly homework set by teachers
      fields:
      - name: class_name
        type: text
        required: true
        label: Class
      - name: year
        type: select
        required: true
        label: Year group
        options:
        - Year 1
        - Year 2
        - Year 3
        - Year 4
        - Year 5
        - Year 6
        - Year 7
        - Year 8
        - Year 9
      - name: topic
        type: select
        required: true
        label: Topic
        options:
        - Number and place value
        - Addition and subtraction
        - Multiplication and division
        - Fractions, decimals and percentages
        - Ratio and proportion
        - Algebra
        - Measurement
        - Geometry
        - Statistics
      - name: due_date
        type: date
        required: true
        label: Due
      access:
      - role: school_admin
    - name: digests
      ownedBy: instance
      description: Weekly teacher digests
      retentionDays: 365
  views:
  - key: home
    type: page
    nav: false
    title: Numbloom
    sections:
    - type: hero
      title: Maths practice that **grows** with every pupil.
      text: Curriculum-aligned exercises, kind step-by-step explanations and a weekly view of who needs help, for primary
        and lower secondary schools and families.
      actions:
      - label: Sign in
        href: /login
        style: primary
      - label: Pricing
        href: '#pricing'
        style: ghost
      band: true
    - type: steps
      id: how
      title: How it works
      items:
      - title: School sets up
        text: The school admin invites teachers; teachers add classes and pupils with a login code.
      - title: Pupils practise
        text: Adaptive sets matched to the DfE National Curriculum, with mistakes explained step by step.
      - title: Teachers see progress
        text: Class and pupil charts, homework by topic and a weekly email of who is struggling.
      - title: Parents follow along
        text: Link at home to see your child's progress, streaks and badges.
    - type: cards
      id: safety
      title: Safe by design
      items:
      - title: No free chat
        text: 'Pupils never chat freely with the AI: only set maths exercises.'
      - title: Minimal data
        text: Only a first name and class. Designed to follow DfE data protection guidance and KCSIE.
      - title: Right people, right view
        text: Pupils see their own work, teachers their classes, school admins their school, parents their child.
    - type: cards
      id: pricing
      title: Pricing
      items:
      - title: Schools
        text: £2 per pupil per year.
        badge: 🏫
      - title: Families
        text: £5 a month.
        badge: 🏠
    - type: note
      content: Numbloom is a learning aid and does not replace teaching. Content is AI-generated and aligned with the DfE
        National Curriculum for mathematics.
  - key: join
    type: form
    title: My details
    collection: pupil_profile
    submit:
      label: Save
      message: Saved. Let's practise!
      redirect: practice
    edit: true
    roles:
    - pupil
  - key: practice
    type: new_run
    title: Practise
    roles:
    - pupil
  - key: my_work
    type: history
    title: My practice
    source: run
    roles:
    - pupil
  - key: set
    type: report
    source: run
    printable: true
    nav: false
  - key: my_progress
    type: page
    title: My streak and scores
    roles:
    - pupil
    sections:
    - type: data
      title: My scores over time
      source: collection:progress
      display: chart
      chart: line
      fields:
      - key: date
        label: Date
      - key: score
        label: Score %
      sort:
        field: date
        dir: asc
      limit: 60
      kpis:
      - label: Sets completed (streak and badges grow with each one)
        agg: count
      - label: Average score
        agg: avg
        field: score
        format: percent
      empty: Complete a set to start your streak.
  - key: class_progress
    type: page
    title: Class progress
    roles:
    - teacher
    - school_admin
    - admin
    sections:
    - type: data
      title: Average score by topic
      source: collection:progress
      display: chart
      chart: bar
      groupBy:
        field: topic
        aggs:
        - key: avg_score
          agg: avg
          field: score
      fields:
      - key: topic
        label: Topic
      - key: avg_score
        label: Average %
    - type: data
      title: Average score by class
      source: collection:progress
      display: chart
      chart: bar
      groupBy:
        field: class_name
        aggs:
        - key: avg_score
          agg: avg
          field: score
      fields:
      - key: class_name
        label: Class
      - key: avg_score
        label: Average %
    - type: data
      title: Pupils who need help
      source: collection:progress
      display: table
      filters:
      - field: score
        op: <
        value: 50
      sort:
        field: date
        dir: desc
      limit: 50
      fields:
      - key: first_name
        label: Pupil
      - key: class_name
        label: Class
      - key: topic
        label: Topic
      - key: score
        label: Score %
      - key: misconception
        label: Misconception
      - key: date
        label: Date
        format: date
      empty: Nobody below 50% this period.
  - key: pupil_table
    type: table
    title: All results
    source: collection:progress
    columns:
    - first_name
    - class_name
    - topic
    - score
    - misconception
    - summary
    - date
    export: true
    roles:
    - teacher
    - school_admin
  - key: add_pupil
    type: form
    title: Add a pupil
    collection: roster
    submit:
      label: Add pupil
      message: Pupil added.
    roles:
    - teacher
  - key: my_roster
    type: table
    title: My pupils and codes
    source: collection:roster
    columns:
    - first_name
    - class_name
    - login_code
    roles:
    - teacher
    - school_admin
  - key: set_homework
    type: form
    title: Set homework
    collection: homework
    submit:
      label: Set homework
      message: Homework set.
    roles:
    - teacher
  - key: homework_list
    type: table
    title: Homework set
    source: collection:homework
    columns:
    - class_name
    - year
    - topic
    - due_date
    roles:
    - teacher
    - school_admin
  - key: watch
    type: instances
    title: Weekly digest
    template: weekly_digest
    roles:
    - teacher
  - key: my_child
    type: page
    title: My child's progress
    roles:
    - parent
    sections:
    - type: data
      title: Scores over time
      source: collection:progress
      display: chart
      chart: line
      fields:
      - key: date
        label: Date
      - key: score
        label: Score %
      sort:
        field: date
        dir: asc
      limit: 60
    - type: data
      title: Recent practice
      source: collection:progress
      display: table
      fields:
      - key: first_name
        label: Pupil
      - key: topic
        label: Topic
      - key: score
        label: Score %
      - key: summary
        label: Note
      - key: date
        label: Date
        format: date
      sort:
        field: date
        dir: desc
      limit: 20
  - key: account
    type: account
    title: Plan
    roles:
    - school_admin
    - parent
    - admin
  schedules: []
  billing:
    modes:
    - subscription
    currency: gbp
    plans:
    - key: school
      price: 2
      interval: year
      label: School (per pupil per year)
      includes:
      - All pupils, teachers and classes of the school
      roles:
      - school_admin
    - key: family
      price: 5
      interval: month
      label: Family
      includes:
      - Home practice and progress for your child
      roles:
      - parent
      - pupil
  notifications:
    emailOnRunDone: false
  extensions:
  - key: pupil_login_code
    description: Pupils sign in by magic link; a pupil login code (no pupil email) is not available yet. For now pupils use
      a school-managed address and enter first name, class and teacher in My details. Roster codes are recorded for teachers
      only.
  - key: school_isolation
    description: 'School admins and teachers are scoped by teacher email, but one app serves one school''s data set: for several
      schools, publish one app per school, since the school admin role sees all records.'
  - key: homework_to_pupils
    description: Homework is stored for teachers; showing it to pupils of a class needs class-level sharing, not available
      yet. Teachers see it in Homework set.
  - key: per_pupil_pricing
    description: The school plan is £2 per pupil per year; per-seat quantity billing is not available yet, so the plan is
      a flat price to adjust by the owner.
  - key: badges
    description: Streaks and badges are shown as counts of completed sets and scores; dedicated badge artwork and logic are
      not available yet.
