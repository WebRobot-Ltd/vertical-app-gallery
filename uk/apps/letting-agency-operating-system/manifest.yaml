        - certificate
        - statement
        - inspection
        - other
      - name: branch
        type: text
      - name: property_ref
        type: text
      - name: landlord_email
        type: email
        required: true
      - name: file
        type: file
        accept:
        - pdf
        - docx
        - jpg
        - png
        maxMb: 15
      access:
      - role: branch_manager
        can:
        - read
        - write
      - role: property_manager
        can:
        - read
        - write
      - role: landlord
        where:
          landlord_email: '{user.email}'
    - name: compliance_items
      description: Gas safety, EICR, EPC and Right to Rent records with expiry dates
      ownedBy: org
      fields:
      - name: property_ref
        type: text
        required: true
      - name: branch
        type: text
      - name: type
        type: select
        required: true
        options:
        - gas_safety
        - eicr
        - epc
        - right_to_rent
      - name: expiry_date
        type: date
        required: true
      - name: status
        type: select
        options:
        - valid
        - due_soon
        - expired
      - name: landlord_email
        type: email
      - name: evidence
        type: file
        accept:
        - pdf
        - jpg
        - png
        maxMb: 10
      access:
      - role: branch_manager
        can:
        - read
        - write
      - role: property_manager
        can:
        - read
        - write
      - role: negotiator
      - role: landlord
        where:
          landlord_email: '{user.email}'
    - name: maintenance_requests
      description: Repairs reported by tenants
      ownedBy: org
      fields:
      - name: tenant_email
        type: email
        required: true
        help: Your account email
      - name: property_ref
        type: text
        required: true
        label: Property
      - name: branch
        type: text
      - name: landlord_email
        type: email
      - name: category
        type: select
        required: true
        options:
        - plumbing
        - heating
        - electrical
        - appliance
        - structure
        - pest
        - other
      - name: urgency
        type: select
        options:
        - routine
        - urgent
        - emergency
      - name: description
        type: textarea
        required: true
        maxLength: 1500
      - name: photo
        type: file
        accept:
        - jpg
        - png
        - webp
        maxMb: 10
        capture: true
        label: Photo
      - name: status
        type: select
        default: new
        options:
        - new
        - quoting
        - awaiting_approval
        - approved
        - done
      access:
      - role: branch_manager
        can:
        - read
        - write
      - role: property_manager
        can:
        - read
        - write
      - role: landlord
        where:
          landlord_email: '{user.email}'
      - role: tenant
        where:
          tenant_email: '{user.email}'
    - name: contractors
      description: Approved contractor catalogue
      ownedBy: shared
      fields:
      - name: name
        type: text
        required: true
      - name: email
        type: email
      - name: phone
        type: text
      - name: trade
        type: select
        options:
        - plumbing
        - heating
        - electrical
        - appliance
        - structure
        - pest
        - general
      - name: area
        type: text
    - name: quotes
      description: Contractor quote requests and replies
      ownedBy: org
      fields:
      - name: maintenance_ref
        type: text
      - name: branch
        type: text
      - name: contractor_name
        type: text
      - name: contractor_email
        type: email
      - name: scope
        type: textarea
      - name: amount
        type: number
      - name: earliest_start
        type: date
      - name: status
        type: select
        options:
        - requested
        - received
        - approved
        - rejected
      access:
      - role: branch_manager
        can:
        - read
        - write
      - role: property_manager
        can:
        - read
        - write
  views:
  - key: home
    type: page
    title: Agentry
    nav: false
    sections:
    - type: hero
      title: The **operating system** for your letting agencies.
      text: 'One platform for every acquired branch: AI agents handle the routine work, staff approve what matters, landlords
        and tenants get their own portals, and the group sees every branch side by side.'
      actions:
      - label: Sign in
        href: /login
        style: primary
      band: true
    - type: cards
      id: what-it-runs
      title: What the agents handle
      items:
      - title: Enquiries and viewings
        text: Portal enquiries from the email feed are answered and viewings proposed.
      - title: Referencing and agreements
        text: Referencing results reviewed, tenancy agreements drafted, a manager signs off.
      - title: Deposits and compliance
        text: Deposit registrations prepared; gas safety, EICR, EPC and Right to Rent reminders sent.
      - title: Arrears
        text: Arrears letters drafted from the ledger and approved before sending.
      - title: Maintenance
        text: Repairs triaged, contractor quotes compared, spend approved by a manager.
      - title: Group dashboards
        text: Lets, arrears, compliance and staff productivity compared across branches.
    - type: steps
      id: roles
      title: Who uses it
      items:
      - title: Group admin
        text: Adds branches, imports data from the old software, sees every branch.
      - title: Branch manager, negotiator, property manager
        text: Run the day-to-day and approve agreements, spend and arrears letters.
      - title: Landlords and tenants
        text: Landlords read statements and documents; tenants report repairs from the phone app.
    - type: note
      content: Agentry supports decisions; it does not give legal or financial advice. Rent handling, referencing and deposit
        protection are done by the group's regulated partners.
  - key: group_dashboard
    type: page
    title: Group dashboard
    roles:
    - admin
    - branch_manager
    sections:
    - type: data
      title: Active lets by branch
      source: collection:tenancies
      display: chart
      chart: bar
      filters:
      - field: status
        op: '='
        value: active
      groupBy:
        field: branch
        aggs:
        - key: rent
          agg: sum
          field: rent_pcm
      fields:
      - key: branch
        label: Branch
      - key: count
        label: Active lets
    - type: data
      title: Arrears by branch
      source: collection:rent_ledger
      display: chart
      chart: bar
      filters:
      - field: status
        op: '='
        value: arrears
      groupBy:
        field: branch
        aggs:
        - key: total
          agg: sum
          field: balance
      fields:
      - key: branch
        label: Branch
      - key: total
        label: Arrears (GBP)
        format: money
    - type: data
      title: Expired compliance records by branch
      source: collection:compliance_items
      display: chart
      chart: bar
      filters:
      - field: status
        op: '='
        value: expired
      groupBy:
        field: branch
        aggs: []
      fields:
      - key: branch
        label: Branch
      - key: count
        label: Expired
    - type: data
      title: Completed viewings per negotiator
      source: collection:viewings
      display: chart
      chart: bar
      filters:
      - field: status
        op: '='
        value: completed
      groupBy:
        field: negotiator_email
        aggs: []
      fields:
      - key: negotiator_email
        label: Negotiator
      - key: count
        label: Viewings
    - type: data
      title: Open repairs by branch
      source: collection:maintenance_requests
      display: chart
      chart: bar
      filters:
      - field: status
        op: '!='
        value: done
      groupBy:
        field: branch
        aggs: []
      fields:
      - key: branch
        label: Branch
      - key: count
        label: Open repairs
  - key: branches
    type: table
    title: Branches
    source: collection:branches
    columns:
    - code
    - name
    - address
    - manager_email
    - licence_status
    roles:
    - admin
    - branch_manager
    - property_manager
    - negotiator
  - key: migration
    type: page
    title: Import data
    roles:
    - admin
    sections:
    - type: text
      title: Migrate from the old agency software
      content: Export landlords, properties and tenancies from the old software as CSV. Open [Data](/admin/data) and import
        them into the landlords, properties and tenancies collections, one file each. Add each acquired agency to branches
        first so the branch codes match, then check the rows on the Tenancies page.
  - key: enquiries
    type: table
    title: Enquiries
    source: collection:enquiries
    columns:
    - applicant_name
    - applicant_email
    - property_ref
    - branch
    - status
    - message
    roles:
    - admin
    - branch_manager
    - negotiator
    - property_manager
    export: true
    data:
      actions:
      - type: call
        field: applicant_phone
        label: Call
  - key: viewings
    type: table
    title: Viewings
    source: collection:viewings
    columns:
    - property_ref
    - applicant_name
    - viewing_date
    - negotiator_email
    - status
    roles:
    - admin
    - branch_manager
    - negotiator
    - property_manager
    data:
      actions:
      - type: calendar
        title: property_ref
        start: viewing_date
        label: Add to calendar
  - key: properties
    type: table
    title: Properties
    source: collection:properties
    columns:
    - ref
    - address
    - branch
    - bedrooms
    - rent_pcm
    - status
    roles:
    - admin
    - branch_manager
    - negotiator
    - property_manager
    - landlord
    export: true
    data:
      actions:
      - type: directions
        field: address
        label: Directions
  - key: tenancies
    type: table
    title: Tenancies
    source: collection:tenancies
    columns:
    - reference
    - property_ref
    - branch
    - tenant_name
    - rent_pcm
    - start_date
    - end_date
    - status
    roles:
    - admin
    - branch_manager
    - negotiator
    - property_manager
    - landlord
    - tenant
    export: true
    data:
      actions:
      - type: call
        field: tenant_phone
        label: Call tenant
  - key: reference_checks
    type: table
    title: Referencing
    source: collection:reference_checks
    columns:
    - tenancy_ref
    - branch
    - status
    - outcome
    - affordability_pct
    - review_note
    roles:
    - admin
    - branch_manager
    - property_manager
    - negotiator
  - key: deposits
    type: table
    title: Deposits
    source: collection:deposits
    columns:
    - tenancy_ref
    - branch
    - amount
    - due_by
    - scheme_ref
    - status
    roles:
    - admin
    - branch_manager
    - property_manager
  - key: new_agreement
    type: new_run
    title: Prepare agreement
    roles:
    - admin
    - branch_manager
    - property_manager
    - negotiator
  - key: agreements
    type: history
    title: Agent reports
    source: run
    roles:
    - admin
    - branch_manager
    - property_manager
    - negotiator
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: approvals
    type: approvals
    title: Approvals
    roles:
    - admin
    - branch_manager
  - key: compliance
    type: table
    title: Compliance
    source: collection:compliance_items
    columns:
    - property_ref
    - branch
    - type
    - expiry_date
    - status
    roles:
    - admin
    - branch_manager
    - property_manager
    - negotiator
    - landlord
    export: true
  - key: compliance_add
    type: form
    title: Add compliance record
    collection: compliance_items
    fields:
    - property_ref
    - branch
    - type
    - expiry_date
    - status
    - landlord_email
    - evidence
    submit:
      label: Save
      message: Compliance record saved. Reminders go out 30 and 7 days before expiry.
      redirect: compliance
    roles:
    - admin
    - branch_manager
    - property_manager
  - key: rent
    type: table
    title: Rent
    source: collection:rent_ledger
    columns:
    - tenancy_ref
    - branch
    - period
    - due
    - paid
    - balance
    - status
    roles:
    - admin
    - branch_manager
    - property_manager
    - landlord
    - tenant
    export: true
  - key: maintenance
    type: table
    title: Repairs
    source: collection:maintenance_requests
    columns:
    - property_ref
    - branch
    - category
    - urgency
    - description
    - status
    roles:
    - admin
    - branch_manager
    - property_manager
    - landlord
    - tenant
  - key: quotes
    type: table
    title: Contractor quotes
    source: collection:quotes
    columns:
    - maintenance_ref
    - contractor_name
    - scope
    - amount
    - earliest_start
    - status
    roles:
    - admin
    - branch_manager
    - property_manager
  - key: report_repair
    type: form
    title: Report a repair
    collection: maintenance_requests
    fields:
    - tenant_email
    - property_ref
    - category
    - urgency
    - description
    - photo
    submit:
      label: Send repair report
      message: Thanks, your repair has been reported. We will be in touch.
      redirect: maintenance
    roles:
    - tenant
  - key: statements
    type: table
    title: Statements
    source: collection:statements
    columns:
    - period
    - branch
    - rent_collected
    - fees
    - repairs
    - net_paid
    roles:
    - admin
    - branch_manager
    - property_manager
    - landlord
    export: true
  - key: documents
    type: table
    title: Documents
    source: collection:documents
    columns:
    - title
    - kind
    - property_ref
    - file
    roles:
    - admin
    - branch_manager
    - property_manager
    - landlord
  - key: document_add
    type: form
    title: Share a document
    collection: documents
    submit:
      label: Share
      message: Document shared with the landlord.
      redirect: documents
    roles:
    - admin
    - branch_manager
    - property_manager
  notifications:
    emailOnRunDone: true
  channels:
  - key: portal_feed
    type: email
    agent: enquiry_agent
    greeting: Thanks for your enquiry.
  billing:
    modes:
    - free
  mobile:
    appId: com.agentry.os
    appName: Agentry
    capabilities:
    - name: camera
      reason: To photograph a repair
    - name: push
  extensions:
  - key: branch_licence
    description: 'Pricing is internal use across the group with a per-branch licence. The runtime has no per-branch licence
      billing yet: invoice licences outside the app and track them in branches.licence_status.'
  - key: partner_integrations
    description: 'Referencing, deposit protection and client money partners: the partners post results, ledger lines and statements
      to the webhook triggers (referencing_result, deposit_result, rent_feed, statement_feed). Calling the partners'' APIs
      (sending the referencing request, the deposit registration and payouts) needs their contracts and is not available yet.'
  - key: tenant_identity_prefill
    description: The repair form asks for the tenant's account email; prefilling it from the signed-in user is not available
      yet.
  - key: compliance_status_refresh
    description: compliance_items.status is set by staff or the CSV import; reminders are sent from expiry_date automatically.
