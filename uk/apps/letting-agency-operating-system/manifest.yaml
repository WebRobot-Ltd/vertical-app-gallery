      - name: tenancy_ref
        type: text
      - name: branch
        type: text
      - name: landlord_email
        type: email
      - name: tenant_email
        type: email
      - name: period
        type: text
      - name: due
        type: number
      - name: paid
        type: number
      - name: balance
        type: number
      - name: status
