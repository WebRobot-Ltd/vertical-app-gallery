        type: text
        required: true
      - name: branch
        type: text
      - name: landlord_email
        type: email
      - name: period
        type: text
      - name: rent_collected
        type: number
      - name: fees
        type: number
      - name: repairs
        type: number
      - name: net_paid
        type: number
      access:
      - role: branch_manager
      - role: property_manager
      - role: landlord
        where:
          landlord_email: '{user.email}'
    - name: documents
      description: Documents shared with landlords
      ownedBy: org
      fields:
      - name: title
        type: text
        required: true
      - name: kind
        type: select
        options:
