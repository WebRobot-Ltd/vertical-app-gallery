apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: learnhive
  displayName: Learnhive
  tagline: Corporate learning that knows your people, your skills gaps and your content.
  description: Learnhive turns a company's own documents, videos, links and courses into a skills-tagged catalogue. An AI
    agent recommends content to each employee, answers questions from the company's content with sources and builds learning
    paths. Managers assign mandatory training with deadlines, and L&D sees completion, skills coverage and engagement.
  langs:
  - en
  defaultLang: en
  timezone: Europe/London
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#1f2a44'
      accent: '#f2a900'
      background: '#fbfaf6'
      foreground: '#1b1f2a'
    fonts:
      body: Inter
      display: Poppins
    wordmark:
    - text: Learn
      color: primary
    - text: hive
      color: accent
    buttonShape: rounded
  header:
    links:
    - label: How it works
      href: '#how'
    - label: Who it is for
      href: '#roles'
    - label: Pricing
      href: '#pricing'
    cta:
      label: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: L&D admin
      assignedBy: admin_emails
    - key: manager
      label: Manager
      assignedBy: derived
      from: collection:directory.manager_email
    - key: user
      label: Employee
      assignedBy: signup
  limits:
  - action: chat
    per: user
    max: 60
    window: day
  agents:
  - key: advisor
    role: main
    description: 'Learning assistant: recommends content, answers from the company''s content with sources, builds learning
      paths.'
    memory: user
    profile:
      inline:
        display_name: Learnhive advisor
        crews:
        - id: advisor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the Learnhive learning advisor of one company. You help the signed-in employee learn. Always
            start by reading their directory record (role, department), their goals, their approved skills and their open
            assignments with the tools. You do three jobs. 1) Recommend: search the catalogue with search_content and suggest
            at most 5 items that fit the role, close skills gaps and serve the goals; say why each one fits, its type, duration
            and link. Mandatory assignments come first. 2) Answer questions ONLY from the company''s own content found with
            search_content (title, description and text fields). Cite every claim with the content title and link in a Sources
            list. If the catalogue does not contain the answer, say so plainly; never invent policies, figures or content.
            3) Build learning paths: an ordered list of catalogue items with a reason and estimated time, then save it with
            save_path when the person agrees. Only skills with status approved count as skills the person has; pending claims
            are not yet counted. Be concise and friendly. Reply in the language with ISO code of the user''s message.'
    goalTemplate: 'User: {user}. Today: {date}. Language: {lang}.

      Conversation so far:

      {history}

      New message: {message}'
    appTools:
    - name: search_content
      description: Search the company catalogue (documents, videos, links, courses) by words or skills
      action: search
      collection: content
      scope: all
    - name: read_directory
      description: Read the signed-in person's directory record (job title, department, manager)
      action: read
      collection: directory
      scope: all
    - name: read_goals
      description: Read the person's learning goals
      action: read
      collection: goals
      scope: user
    - name: read_assignments
      description: Read the mandatory training assigned to the person
      action: read
      collection: assignments
      scope: all
    - name: read_skills
      description: Read skills claims; only status approved counts
      action: read
      collection: skill_claims
      scope: all
    - name: save_path
      description: Save a learning path for the person
      action: write
      collection: learning_paths
      scope: user
    output: markdown
  - key: skills_reviewer
    role: helper
    description: Reads a logged external course or certificate and proposes skills claims for the manager to approve.
    profile:
      inline:
        display_name: Learnhive skills reviewer
        crews:
        - id: skills_reviewer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You process one external course or certificate an employee has logged. Open the uploaded certificate
            with read_upload (use the file id you are given; it reads images and scans too). Check that the document matches
            the course title and the person. From it and from the description, propose 1 to 4 concrete skills the learning
            supports, with a level (beginner, intermediate or advanced) and a one-sentence evidence. Look up the person''s
            manager with read_directory. Save each proposal with write_claim with status exactly pending, the manager_email,
            the employee_email, the skill, level, source (the course title) and evidence. NEVER set a status other than pending:
            the manager decides. If the certificate is unreadable or does not match, save one claim with a note saying what
            must be checked. Finish with a short summary.'
    goalTemplate: 'Employee: {record.employee_email}. Course: {record.title} from {record.provider}, completed on {record.completed_on},
      {record.hours} hours. Skills the employee mentions: {record.skills}. Certificate file ids: {record.certificate}. Propose
      skills claims.'
    appTools:
    - name: read_upload
      description: Read a file the user uploaded
      action: read_file
    - name: read_directory
      description: Read the directory record of the person (manager, role)
      action: read
      collection: directory
      scope: all
    - name: write_claim
      description: Save a pending skills claim
      action: write
      collection: skill_claims
      scope: user
    output: markdown
  - key: reporter
    role: scheduled
    description: Monthly learning report for the person's own scope (employee, team or company).
    profile:
      inline:
        display_name: Learnhive reporter
        crews:
        - id: reporter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write the monthly learning report for the person who owns this instance, using only the records
            the tools return for them (admins get the whole company, managers their team). Start with a level-1 title "# Learning
            report — <month year>". Sections (##): Headlines, Completion of mandatory training (done, open, overdue, by department
            when available), Skills coverage (approved skills only; pending claims counted separately), Engagement (minutes
            learned, active people), Attention needed (overdue people and teams), Next month. Add at least one chart as a
            fenced block, for example ```chart

            {"type":"bar","title":"Assignments by status","labels":["done","open","overdue"],"series":[{"name":"Assignments","values":[1,2,3]}]}

            ```. Use real figures only; if data is missing say so. Under 450 words.'
    goalTemplate: 'Write the report for {focus_label}. Today is {date}. Language: {lang}.'
    appTools:
    - name: read_assignments
      description: Read the mandatory training assigned to the person
      action: read
      collection: assignments
      scope: all
    - name: read_skills
      description: Read skills claims; only status approved counts
      action: read
      collection: skill_claims
      scope: all
    - name: read_activity
      description: Read logged learning activity
      action: read
      collection: activity
      scope: all
    - name: read_directory
      description: Read directory records the person may see
      action: read
      collection: directory
      scope: all
    output: markdown
  inputForm:
    title: Report
    fields:
    - name: focus
      type: select
      label: Scope
      options:
      - value: mine
        label: My own learning
      - value: team
        label: My team
      - value: company
        label: The whole company
  data:
    collections:
    - name: directory
      description: Employees, departments, roles and managers. Filled by admins (CSV on the data page) until HR sync is available.
      ownedBy: org
      fields:
      - name: email
        type: email
        required: true
        label: Work email
      - name: full_name
        type: text
        label: Name
      - name: job_title
        type: text
        label: Job title
      - name: department
        type: text
        label: Department
      - name: manager_email
        type: email
        label: Manager email
      access:
      - role: user
        where:
          email: '{user.email}'
        can:
        - read
      - role: manager
        where:
          manager_email: '{user.email}'
        can:
        - read
    - name: content
      description: 'The company catalogue: documents, videos, links and courses with skills tags.'
      ownedBy: shared
      searchable: true
      fields:
      - name: title
        type: text
        required: true
        label: Title
      - name: type
        type: select
        label: Type
        options:
        - document
        - video
        - link
        - course
      - name: url
        type: url
        label: Link
      - name: description
        type: textarea
        label: Description
      - name: text
        type: textarea
        label: Text of the content (used to answer questions)
      - name: skills
        type: text
        label: Skills tags (comma separated)
      - name: audience
        type: text
        label: Roles or departments
      - name: level
        type: select
        label: Level
        options:
        - beginner
        - intermediate
        - advanced
      - name: duration_min
        type: number
        label: Minutes
    - name: goals
      description: Each employee's learning goals
      ownedBy: user
      fields:
      - name: goal
        type: textarea
        required: true
        label: What do you want to learn or become?
      - name: target_date
        type: date
        label: By when
    - name: assignments
      description: Mandatory training assigned by a manager with a deadline
      ownedBy: user
      fields:
      - name: employee_email
        type: email
        required: true
        label: Employee email
      - name: content_title
        type: text
        required: true
        label: Training
      - name: due_date
        type: date
        required: true
        label: Due date
      - name: status
        type: select
        label: Status
        default: assigned
        options:
        - assigned
        - completed
      access:
      - role: user
        where:
          employee_email: '{user.email}'
        can:
        - read
        - write
    - name: skill_claims
      description: Skills the agent proposes from external learning; they count only when approved by the manager
      ownedBy: user
      fields:
      - name: employee_email
        type: email
      - name: manager_email
        type: email
      - name: skill
        type: text
        label: Skill
      - name: level
        type: select
        label: Level
        options:
        - beginner
        - intermediate
        - advanced
      - name: source
        type: text
        label: Source course
      - name: evidence
        type: textarea
        label: Evidence
      - name: status
        type: select
        label: Status
        default: pending
        options:
        - pending
        - approved
        - rejected
      - name: manager_note
        type: text
        label: Manager note
      access:
      - role: manager
        where:
          manager_email: '{user.email}'
        can:
        - read
        - write
    - name: external_learning
      description: External courses and certificates logged by employees
      ownedBy: user
      fields:
      - name: employee_email
        type: email
        required: true
        label: Your work email
      - name: title
        type: text
        required: true
        label: Course or certificate
      - name: provider
        type: text
        label: Provider
      - name: completed_on
        type: date
        label: Completed on
      - name: hours
        type: number
        label: Hours
      - name: skills
        type: text
        label: Skills you gained
      - name: certificate
        type: file
        accept:
        - pdf
        - jpg
        - png
        maxMb: 10
        label: Certificate
    - name: activity
      description: Learning time logged by employees, for engagement charts
      ownedBy: user
      fields:
      - name: date
        type: date
        required: true
        label: Date
      - name: content_title
        type: text
        required: true
        label: What did you learn?
      - name: minutes
        type: number
        required: true
        label: Minutes
      - name: department
        type: text
        label: Department
    - name: learning_paths
      description: Learning paths built by the advisor
      ownedBy: user
      fields:
      - name: title
        type: text
        label: Title
      - name: steps
        type: textarea
        label: Steps
      - name: skills
        type: text
        label: Skills covered
  views:
  - key: home
    type: page
    nav: false
    title: Learnhive
    sections:
    - type: hero
      title: Learning that fits **every employee** and every role.
      text: Upload your own content, sync your people, and let an AI agent recommend, answer with sources and build learning
        paths. Managers assign mandatory training; L&D sees the whole picture.
      actions:
      - label: Sign in
        href: /login
        style: primary
      - label: How it works
        href: '#how'
        style: ghost
    - type: steps
      id: how
      title: How it works
      items:
      - title: Build the catalogue
        text: L&D admins add documents, videos, links and courses with skills tags.
      - title: Learn with an agent
        text: Recommendations, answers from your own content with sources, and learning paths.
      - title: Assign and remind
        text: Managers set mandatory training with deadlines; employees get email reminders.
      - title: See the impact
        text: Completion, skills coverage and engagement charts, and a monthly report by email.
    - type: cards
      id: roles
      title: One platform, three views
      items:
      - title: Employees
        text: Your own learning, goals, external certificates and skills profile.
      - title: Managers
        text: Your team's progress, assignments and skills approvals.
      - title: L&D admins
        text: 'The whole company: catalogue, dashboards and reports.'
    - type: cards
      id: pricing
      title: Pricing
      items:
      - title: £6 per active user per month
        text: Annual contracts, invoiced through Stripe.
    - type: note
      content: Learnhive · Support for learning decisions; skills only count after manager approval.
  - key: assistant
    type: chat
    title: Learning assistant
    source: agent:advisor
    placeholder: Ask for recommendations, a question about our content, or a learning path
    examples:
    - What should I learn next for my role?
    - Build me a 4-week path to close my skills gaps
    - What is our policy on data protection? Show sources
    - What mandatory training is due?
    roles:
    - user
    - manager
    - admin
  - key: my_learning
    type: page
    title: My learning
    roles:
    - user
    - manager
    - admin
    sections:
    - type: data
      title: Due and mandatory training
      source: collection:assignments
      display: table
      fields:
      - key: content_title
        label: Training
      - key: due_date
        label: Due
        format: date
      - key: status
        label: Status
        format: badge
      filters:
      - field: status
        op: '='
        value: assigned
      sort:
        field: due_date
        dir: asc
      empty: Nothing due. Well done!
    - type: data
      title: My minutes learned
      source: collection:activity
      display: chart
      chart: bar
      groupBy:
        field: date
        bucket: month
        aggs:
        - key: minutes
          agg: sum
          field: minutes
      fields:
      - key: date
      - key: minutes
    - type: data
      title: My skills
      source: collection:skill_claims
      display: table
      fields:
      - key: skill
        label: Skill
      - key: level
        label: Level
      - key: status
        label: Status
        format: badge
    - type: data
      title: My learning paths
      source: collection:learning_paths
      display: cards
      fields:
      - key: title
      - key: steps
      - key: skills
  - key: team
    type: page
    title: My team
    roles:
    - manager
    - admin
    sections:
    - type: data
      title: Team assignments by status
      source: collection:assignments
      display: chart
      chart: pie
      groupBy:
        field: status
        aggs: []
      fields:
      - key: status
      - key: count
    - type: data
      title: Team assignments
      source: collection:assignments
      display: table
      fields:
      - key: employee_email
        label: Employee
      - key: content_title
        label: Training
      - key: due_date
        label: Due
        format: date
      - key: status
        label: Status
        format: badge
      sort:
        field: due_date
        dir: asc
    - type: data
      title: Skills claims waiting for you
      source: collection:skill_claims
      display: table
      fields:
      - key: employee_email
        label: Employee
      - key: skill
        label: Skill
      - key: level
        label: Level
      - key: source
        label: Source
      - key: evidence
        label: Evidence
      - key: status
        label: Status
        format: badge
      filters:
      - field: status
        op: '='
        value: pending
    - type: view
      title: Decide a claim
      view: review_claim
  - key: company
    type: page
    title: Company dashboard
    roles:
    - admin
    sections:
    - type: data
      title: Completion
      source: collection:assignments
      display: chart
      chart: bar
      groupBy:
        field: status
        aggs: []
      fields:
      - key: status
      - key: count
    - type: data
      title: Assignments due per month
      source: collection:assignments
      display: chart
      chart: line
      groupBy:
        field: due_date
        bucket: month
        aggs: []
      fields:
      - key: due_date
      - key: count
    - type: data
      title: Skills coverage (approved)
      source: collection:skill_claims
      display: chart
      chart: bar
      groupBy:
        field: skill
        aggs: []
      filters:
      - field: status
        op: '='
        value: approved
      fields:
      - key: skill
      - key: count
    - type: data
      title: 'Engagement: minutes per month'
      source: collection:activity
      display: chart
      chart: line
      groupBy:
        field: date
        bucket: month
        aggs:
        - key: minutes
          agg: sum
          field: minutes
      fields:
      - key: date
      - key: minutes
    - type: data
      title: Engagement by department
      source: collection:activity
      display: chart
      chart: bar
      groupBy:
        field: department
        aggs:
        - key: minutes
          agg: sum
          field: minutes
      fields:
      - key: department
      - key: minutes
    - type: data
      title: People directory
      source: collection:directory
      display: table
      fields:
      - key: full_name
        label: Name
      - key: job_title
        label: Role
      - key: department
        label: Department
      - key: manager_email
        label: Manager
      limit: 200
  - key: catalogue
    type: cards
    title: Catalogue
    source: collection:content
    roles:
    - user
    - manager
    - admin
    data:
      display: cards
      fields:
      - key: title
        label: Title
      - key: type
        label: Type
        format: badge
      - key: skills
        label: Skills
      - key: duration_min
        label: Minutes
        format: number
      - key: url
        label: Open
        format: link
  - key: assign
    type: form
    title: Assign training
    collection: assignments
    roles:
    - manager
    - admin
    submit:
      label: Assign
      message: Assigned. The employee has been notified.
      redirect: team
  - key: set_goal
    type: form
    title: My goals
    collection: goals
    roles:
    - user
    - manager
    - admin
    submit:
      label: Save goal
      message: Goal saved.
      redirect: my_learning
  - key: log_activity
    type: form
    title: Log learning time
    collection: activity
    roles:
    - user
    - manager
    - admin
    submit:
      label: Log
      message: Logged.
      redirect: my_learning
  - key: log_external
    type: form
    title: Log an external course
    collection: external_learning
    roles:
    - user
    - manager
    - admin
    submit:
      label: Submit
      message: Received. The agent proposes skills and your manager approves them.
      redirect: my_learning
  - key: review_claim
    type: form
    title: Review a skills claim
    collection: skill_claims
    fields:
    - status
    - manager_note
    edit: true
    roles:
    - manager
    - admin
    nav: false
    submit:
      label: Save decision
      message: Decision saved.
      redirect: team
  - key: reports
    type: instances
    template: monthly_report
    title: Monthly reports
    roles:
    - manager
    - admin
  - key: account
    type: account
    title: Plan
    roles:
    - admin
  templates:
  - key: monthly_report
    title: Monthly learning report
    description: A report by email on the first of every month for your scope.
    agent: reporter
    params:
    - name: focus
      type: select
      required: true
      label: Scope
      options:
      - value: team
        label: My team
      - value: company
        label: The whole company
    goal: 'Write the monthly learning report for {focus}. Today is {date}. Language: {lang}.'
    schedule:
      cron: 0 7 1 * *
      userCanChange: true
    maxPerUser: 2
    deliver:
      to: owner
      subject: Your Learnhive monthly report
      onlyIfNew: true
  triggers:
  - key: assigned
    'on':
      collection: assignments
      op: insert
    notify:
      to:
      - record.employee_email
      subject: 'New mandatory training: {record.content_title}'
      body: You have been assigned {record.content_title}, due {record.due_date}.
      link: my_learning
  - key: reminder
    'on':
      date:
        collection: assignments
        field: due_date
        offsetDays: -3
        hour: 8
    notify:
      to:
      - record.employee_email
      subject: 'Reminder: {record.content_title} is due in 3 days'
      body: Your mandatory training {record.content_title} is due on {record.due_date}. Please complete it.
      link: my_learning
  - key: overdue
    'on':
      date:
        collection: assignments
        field: due_date
        offsetDays: 1
        hour: 8
    notify:
      to:
      - record.employee_email
      - owner
      subject: 'Overdue check: {record.content_title}'
      body: The training {record.content_title} was due on {record.due_date}. If it is not completed yet, please finish it
        now.
      link: team
  - key: external_logged
    'on':
      collection: external_learning
      op: insert
    start:
      agent: skills_reviewer
    goal: 'Review the external learning of {record.employee_email}: {record.title} ({record.provider}), skills mentioned:
      {record.skills}, certificate files: {record.certificate}.'
  - key: claim_pending
    'on':
      collection: skill_claims
      op: insert
    notify:
      to:
      - record.manager_email
      subject: 'Skills claim to approve: {record.skill}'
      body: '{record.employee_email} claims {record.skill} ({record.level}) from {record.source}. Please review it.'
      link: team
  - key: claim_decided
    'on':
      collection: skill_claims
      op: update
      where:
        status: approved
    notify:
      to:
      - owner
      subject: 'Skill approved: {record.skill}'
      body: Your manager approved {record.skill}. It now counts in your skills profile.
      link: my_learning
  billing:
    modes:
    - subscription
    currency: gbp
    plans:
    - key: annual
      price: 72
      interval: year
      label: Per active user, £6 a month, billed annually
      roles:
      - admin
      includes:
      - Catalogue and agent
      - Manager and company dashboards
      - Monthly report by email
  notifications:
    emailOnRunDone: false
  extensions:
  - key: sso
    description: Single sign-on (SAML/OIDC) for the company is not available yet; employees sign in with email magic link.
  - key: hr_sync
    description: Automatic HR system sync (employees, departments, roles) is not available yet; admins import the directory
      as CSV on the data page. Managers are derived from the manager_email column.
  - key: video_hosting
    description: Video hosting and streaming are not available; videos are added to the catalogue as links (e.g. to the company's
      video platform). Uploaded files are limited to 15 MB and document types.
  - key: content_files
    description: Admins paste the text of documents into the catalogue's text field so the agent can answer from it with sources;
      automatic reading of uploaded catalogue files is not available.
  - key: per_active_user_pricing
    description: Billing per active user (£6 a month, annual contract invoiced through Stripe) is modelled as an annual plan
      of £72 per seat; counting active users and invoicing for the contract need to be set up in Stripe.
  - key: in_app_reminders
    description: In-app reminders are the due list on My learning; push and SMS reminders are not available yet.
  - key: languages
    description: English only for now; French and German to be added later.
  - key: directory_csv_export
    description: The CSV export of the people directory is available from the built-in data page (/admin/data), not from the
      dashboard table.
  - key: overdue_filter
    description: The overdue email is sent for every assignment one day after its due date; the date trigger cannot filter
