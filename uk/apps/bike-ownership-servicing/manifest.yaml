apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: spokeful
  displayName: Spokeful
  tagline: Every bike you own, looked after and proven yours.
  description: Register your bikes, track maintenance, get reminders, book servicing with partner workshops, and keep an ownership
    record for insurance and resale.
  langs:
  - en
  defaultLang: en
  timezone: Europe/Rome
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12343b'
      accent: '#f26b3a'
      background: '#f7f5f0'
      foreground: '#1a1f24'
    fonts:
      body: Inter
      display: Space Grotesk
    wordmark:
    - text: Spoke
      color: primary
    - text: ful
      color: accent
  header:
    links:
    - label: How it works
      href: '#how'
    - label: Workshops
      href: '#workshops'
    cta:
      label: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
    - key: workshop
      label: Partner workshop
      assignedBy: derived
      from: collection:workshops.owner_email
  limits:
  - action: agent:advisor
    per: user
    max: 10
    window: day
    roles:
    - user
  agents:
  - key: advisor
    role: main
    description: Suggests maintenance from mileage and photos of worn parts, and explains safe DIY fixes.
    profile:
      inline:
        display_name: Spokeful maintenance advisor
        crews:
        - id: advisor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are a careful bicycle mechanic advising a bike owner. Use read_bikes to get the bike picked
            by the owner (brand, model, purchase date, mileage), read_mileage to see the owner''s logged rides and read_bookings
            for past services. If photos were uploaded, open each one with read_upload (pass the file id) and describe the
            wear you actually see (chain stretch, pad thickness, tyre cracking, rust, cable fraying). Write the report starting
            with a level-1 title ''# Maintenance plan — <bike name>''. Sections with ## headings: Summary, What to service
            now (with urgency: now / soon / routine), What the photos show, Do it yourself (small fixes an owner can safely
            do: step-by-step, tools needed, time), Leave to a workshop (brakes bleeding, wheel truing, anything safety-critical),
            Next service date. Base intervals on logged kilometres and known component life ranges and say they are estimates.
            Never invent measurements or diagnose from a photo that is unclear: say what you cannot tell. Flag any safety-critical
            concern prominently and recommend a workshop. Under 600 words. Reply in the language with ISO code en.'
          mcp_servers: []
    appTools:
    - name: read_bikes
      description: Read the owner's bikes
      action: read
      collection: bikes
      scope: user
    - name: read_mileage
      description: Read the owner's logged mileage and worn-part notes
      action: read
      collection: mileage_logs
      scope: user
    - name: read_bookings
      description: Read the owner's bookings and job history
      action: read
      collection: bookings
      scope: user
    - name: read_upload
      description: Read a file the user uploaded
      action: read_file
    goalTemplate: 'Bike (record id): {bike}

      {?current_km}Current odometer: {current_km} km.{/current_km}

      {?riding}Typical riding: {riding_label}.{/riding}

      {?notes}Owner notes: {notes}{/notes}

      {?worn_photos}Photos of worn parts (file ids): {worn_photos}{/worn_photos}

      Today is {date}. Write the plan in the language with ISO code {lang}.'
    output: markdown
  - key: theft_reporter
    role: helper
    description: Writes a stolen-bike report the owner can hand to police and insurer.
    profile:
      inline:
        display_name: Spokeful theft report writer
        crews:
        - id: theft
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You prepare a stolen-bike report for the owner to give to the police and the insurer. Use read_bikes
            to get the bike''s brand, model, serial number, purchase date and price, then read_accessories for the accessories
            and their value, and read_components for the components. Open the serial-number photo, the bike photo and the
            receipt with read_upload if file ids are present. Start with ''# Stolen bike report — <bike name>''. Sections
            with ## headings: Owner and bike identification (serial number, brand, model, colour if known), Distinguishing
            features, Purchase proof, Accessories and components with values and a total, Circumstances of the theft (as given
            by the owner), Recommended next steps (file a police report and quote the reference, notify the insurer, check
            online marketplaces, register the serial with local databases). Use only facts from the records and the owner''s
            statement; never invent values or details. Keep it printable and factual.'
          mcp_servers: []
    appTools:
    - name: read_bikes
      description: Read the owner's bikes
      action: read
      collection: bikes
      scope: user
    - name: read_accessories
      description: Read the owner's accessories
      action: read
      collection: accessories
      scope: user
    - name: read_components
      description: Read the owner's components
      action: read
      collection: components
      scope: user
    - name: read_upload
      description: Read a file the user uploaded
      action: read_file
    goalTemplate: 'Stolen bike report for bike record {record.bike}. Stolen on {record.stolen_date}, location {record.location}.
      Circumstances: {record.circumstances}. Police reference: {record.police_ref}. Today is {date}.'
    output: markdown
  - key: router
    role: helper
    description: Copies the workshop's email onto a new booking so only that workshop sees it.
    profile:
      inline:
        display_name: Spokeful booking router
        crews:
        - id: router
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 5
          max_budget_usd: 0.1
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You process a new booking. Read the workshops with read_workshops, find the workshop whose record
            id or name matches the booking's resource, and write its owner_email into the booking's workshop_email field with
            write_bookings (update the booking record only; change no other field). Reply with one line '# Routed' and the
            workshop name. If no workshop matches, say so and change nothing.
          mcp_servers: []
    appTools:
    - name: read_workshops
      description: Read the partner workshops
      action: read
      collection: workshops
      scope: all
    - name: write_bookings
      description: Update the owner's booking
      action: write
      collection: bookings
      scope: user
    goalTemplate: 'New booking: {event}'
    output: markdown
  inputForm:
    title: Maintenance advice
    fields:
    - name: bike
      type: select
      required: true
      label: Bike
      optionsFrom: collection:bikes
    - name: current_km
      type: number
      label: Current odometer (km)
    - name: riding
      type: select
      label: How you ride
      options:
      - value: commute
        label: Commuting
      - value: road
        label: Road
      - value: mtb
        label: Off-road
      - value: leisure
        label: Leisure
    - name: worn_photos
      type: file
      label: Photos of worn parts (optional)
      accept:
      - jpg
      - png
      - webp
      maxMb: 10
      multiple: true
      capture: true
    - name: notes
      type: textarea
      maxLength: 500
      label: What worries you? (optional)
  data:
    collections:
    - name: bikes
      ownedBy: user
      description: Each owner's bikes
      fields:
      - name: name
        type: text
        required: true
        label: Name
      - name: brand
        type: text
        label: Brand
      - name: model
        type: text
        label: Model
      - name: serial_number
        type: barcode
        label: Serial number
      - name: serial_photo
        type: file
        label: Photo of the serial number
        accept:
        - jpg
        - png
        - webp
        capture: true
      - name: photo
        type: file
        label: Bike photo
        accept:
        - jpg
        - png
        - webp
        capture: true
      - name: purchase_date
        type: date
        label: Purchase date
      - name: purchase_price
        type: number
        label: Purchase price
      - name: receipt
        type: file
        label: Purchase receipt
        accept:
        - pdf
        - jpg
        - png
        capture: true
      - name: mileage_km
        type: number
        label: Mileage (km)
      - name: next_service_date
        type: date
        label: Next service due
      - name: status
        type: select
        label: Status
        default: active
        options:
        - value: active
          label: Active
        - value: stolen
          label: Stolen
        - value: transferred
          label: Transferred
    - name: accessories
      ownedBy: user
      fields:
      - name: bike
        type: select
        required: true
        label: Bike
        optionsFrom: collection:bikes
      - name: name
        type: text
        required: true
        label: Accessory
      - name: value
        type: number
        label: Value
      - name: photo
        type: file
        label: Photo
        accept:
        - jpg
        - png
        - webp
        capture: true
    - name: components
      ownedBy: user
      fields:
      - name: bike
        type: select
        required: true
        label: Bike
        optionsFrom: collection:bikes
      - name: name
        type: text
        required: true
        label: Component
      - name: brand
        type: text
        label: Brand / model
      - name: installed_date
        type: date
        label: Installed on
      - name: notes
        type: text
        label: Notes
    - name: mileage_logs
      ownedBy: user
      fields:
      - name: bike
        type: select
        required: true
        label: Bike
        optionsFrom: collection:bikes
      - name: date
        type: date
        label: Date
      - name: km
        type: number
        required: true
        label: Odometer (km)
      - name: worn_photo
        type: file
        label: Photo of a worn part
        accept:
        - jpg
        - png
        - webp
        capture: true
      - name: notes
        type: text
        label: Notes
    - name: service_records
      ownedBy: user
      fields:
      - name: bike
        type: select
        required: true
        label: Bike
        optionsFrom: collection:bikes
      - name: date
        type: date
        label: Date
      - name: description
        type: textarea
        label: What was done
      - name: workshop
        type: text
        label: Workshop
      - name: cost
        type: number
        label: Cost
      - name: invoice
        type: file
        label: Invoice
        accept:
        - pdf
        - jpg
        - png
        capture: true
    - name: stolen_reports
      ownedBy: user
      fields:
      - name: bike
        type: select
        required: true
        label: Bike
        optionsFrom: collection:bikes
      - name: stolen_date
        type: date
        required: true
        label: When
      - name: location
        type: location
        label: Where it was taken
      - name: circumstances
        type: textarea
        label: What happened
      - name: police_ref
        type: text
        label: Police report number
    - name: transfers
      ownedBy: user
      fields:
      - name: bike
        type: select
        required: true
        label: Bike
        optionsFrom: collection:bikes
      - name: new_owner_email
        type: email
        required: true
        label: New owner's email
      - name: message
        type: textarea
        label: Message
    - name: workshops
      ownedBy: shared
      description: Spokeful partner workshops, filled by the admins
      fields:
      - name: name
        type: text
        required: true
      - name: address
        type: text
      - name: phone
        type: text
      - name: lat
        type: number
      - name: lon
        type: number
      - name: owner_email
        type: email
        required: true
      - name: slots
        type: json
        help: Opening days and hours, e.g. {"days":[1,2,3,4,5],"from":"09:00","to":"17:00"}
      access:
      - role: workshop
        where:
          owner_email: '{user.email}'
        can:
        - read
        - write
    - name: services
      ownedBy: shared
      description: Services and prices each workshop offers
      fields:
      - name: workshop
        type: text
        required: true
        label: Workshop name
      - name: name
        type: text
        required: true
        label: Service
      - name: description
        type: textarea
        label: What is included
      - name: price
        type: number
        required: true
        label: Price
      - name: deposit
        type: number
        label: Deposit
      - name: duration_minutes
        type: number
        label: Duration (min)
      - name: owner_email
        type: email
        required: true
        label: Your login email
      access:
      - role: workshop
        where:
          owner_email: '{user.email}'
        can:
        - read
        - write
    - name: bookings
      ownedBy: user
      fields:
      - name: bike
        type: select
        required: true
        label: Bike
        optionsFrom: collection:bikes
      - name: service
        type: select
        required: true
        label: Service
        optionsFrom: collection:services
      - name: notes
        type: textarea
        label: Notes for the workshop
      - name: workshop_email
        type: email
      - name: job_status
        type: select
        label: Job status
        default: booked
        options:
        - value: booked
          label: Booked
        - value: in_progress
          label: In progress
        - value: done
          label: Done
      - name: job_notes
        type: textarea
        label: Job notes
      - name: final_price
        type: number
        label: Final price
      access:
      - role: workshop
        where:
          workshop_email: '{user.email}'
        can:
        - read
        - write
  views:
  - key: home
    type: page
    title: Spokeful
    nav: false
    sections:
    - type: hero
      title: Every bike you own, **looked after** and proven yours.
      text: Register your bikes, log your rides, get service reminders, and book trusted Spokeful workshops. Your ownership
        record is ready for insurance and resale.
      actions:
      - label: Get the app
        href: /login
        style: primary
      - label: How it works
        href: '#how'
        style: ghost
    - type: steps
      id: how
      title: How it works
      items:
      - title: Register
        text: Scan the serial barcode or photograph it, add photos, receipt, accessories and their value.
        badge: 🚲
      - title: Maintain
        text: Log your mileage and worn parts; the advisor tells you what to service and what you can fix yourself.
        badge: 🔧
      - title: Book
        text: Pick a Spokeful workshop, choose a free slot and pay a deposit.
        badge: 📅
      - title: Keep the record
        text: Components, service history and receipts in one place. Transfer it with the bike.
        badge: 📄
    - type: cards
      id: workshops
      title: For workshops
      intro: 'Join the Spokeful network: set your services, prices and free slots, and see only your own customers'' bookings.
        We take a commission on bookings.'
      items:
      - title: Your portal
        text: Bookings, job notes and final prices in one place.
      - title: Your slots
        text: You decide the hours and capacity.
    - type: note
      content: Free for owners. Maintenance suggestions are estimates; have safety-critical parts checked by a workshop.
  - key: ownership
    type: tabs
    title: My bikes
    children:
    - bikes_list
    - accessories_list
    - components_list
    - service_history
    roles:
    - user
    - admin
  - key: bikes_list
    type: cards
    title: Bikes
    source: collection:bikes
    nav: false
    export: true
    data:
      display: cards
      fields:
      - key: name
        label: Bike
      - key: brand
        label: Brand
      - key: serial_number
        label: Serial
      - key: purchase_price
        label: Price
        format: money
      - key: next_service_date
        label: Next service
        format: date
      - key: status
        label: Status
        format: badge
  - key: accessories_list
    type: table
    title: Accessories
    source: collection:accessories
    nav: false
    export: true
    data:
      display: table
      fields:
      - key: bike
        label: Bike
      - key: name
        label: Accessory
      - key: value
        label: Value
        format: money
      kpis:
      - label: Total value
        agg: sum
        field: value
        format: money
  - key: components_list
    type: table
    title: Components
    source: collection:components
    nav: false
    export: true
    data:
      display: table
      fields:
      - key: bike
        label: Bike
      - key: name
        label: Component
      - key: brand
        label: Brand
      - key: installed_date
        label: Installed
        format: date
  - key: service_history
    type: table
    title: Service history
    source: collection:service_records
    nav: false
    export: true
    data:
      display: table
      fields:
      - key: date
        label: Date
        format: date
      - key: bike
        label: Bike
      - key: description
        label: Work
      - key: workshop
        label: Workshop
      - key: cost
        label: Cost
        format: money
      sort:
        field: date
        dir: desc
  - key: add_bike
    type: form
    title: Add a bike
    collection: bikes
    submit:
      label: Save bike
      message: Bike saved.
      redirect: ownership
    edit: true
    roles:
    - user
    - admin
  - key: add_accessory
    type: form
    title: Add accessory
    collection: accessories
    submit:
      label: Save
      message: Accessory saved.
      redirect: ownership
    roles:
    - user
    - admin
  - key: add_component
    type: form
    title: Add component
    collection: components
    submit:
      label: Save
      message: Component saved.
      redirect: ownership
    roles:
    - user
    - admin
  - key: log_ride
    type: form
    title: Log mileage
    collection: mileage_logs
    submit:
      label: Save
      message: Mileage logged.
    roles:
    - user
    - admin
  - key: add_service
    type: form
    title: Add past service
    collection: service_records
    submit:
      label: Save
      message: Service saved.
      redirect: ownership
    roles:
    - user
    - admin
  - key: advise
    type: new_run
    title: Maintenance advice
    roles:
    - user
    - admin
  - key: advice_history
    type: history
    title: My advice
    source: run
    roles:
    - user
    - admin
  - key: advice
    type: report
    source: run
    printable: true
    nav: false
  - key: workshop_map
    type: map
    title: Workshops
    source: collection:workshops
    map:
      lat: lat
      lon: lon
      title: name
      popup:
      - address
      - phone
    roles:
    - user
    - admin
  - key: workshop_list
    type: cards
    title: Workshop details
    source: collection:workshops
    nav: false
    data:
      display: cards
      fields:
      - key: name
        label: Workshop
      - key: address
        label: Address
      - key: phone
        label: Phone
      actions:
      - type: call
        field: phone
        label: Call
      - type: directions
        field: address
        label: Directions
    roles:
    - user
    - admin
  - key: book
    type: booking
    title: Book a service
    collection: bookings
    resources: collection:workshops
    fields:
    - bike
    - service
    - notes
    slots:
      days:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      from: 09:00
      to: '18:00'
      minutes: 60
      tz: Europe/Rome
      aheadDays: 30
      minNoticeHours: 12
      capacity: 1
    roles:
    - user
    - admin
  - key: my_bookings
    type: table
    title: My bookings
    source: collection:bookings
    data:
      display: table
      fields:
      - key: date
        label: Date
        format: date
      - key: bike
        label: Bike
      - key: service
        label: Service
      - key: job_status
        label: Status
        format: badge
      - key: final_price
        label: Price
        format: money
      sort:
        field: date
        dir: desc
      actions:
      - type: calendar
        label: Add to calendar
        title: service
        start: start
        location: resource
    roles:
    - user
    - admin
  - key: report_stolen
    type: form
    title: Report stolen bike
    collection: stolen_reports
    submit:
      label: Create report
      message: Report requested. You will find it in your email and in your advice history.
    roles:
    - user
    - admin
  - key: transfer
    type: form
    title: Transfer a bike
    collection: transfers
    submit:
      label: Send transfer
      message: The new owner has been invited.
    roles:
    - user
    - admin
  - key: portal
    type: tabs
    title: Workshop portal
    children:
    - portal_bookings
    - job_update
    - portal_services
    - service_form
    roles:
    - workshop
  - key: portal_bookings
    type: table
    title: Bookings
    source: collection:bookings
    nav: false
    data:
      display: table
      fields:
      - key: date
        label: Date
        format: date
      - key: service
        label: Service
      - key: bike
        label: Bike
      - key: notes
        label: Customer notes
      - key: job_status
        label: Status
        format: badge
      - key: job_notes
        label: Job notes
      - key: final_price
        label: Price
        format: money
      sort:
        field: date
        dir: desc
    roles:
    - workshop
  - key: job_update
    type: form
    title: Update a job
    collection: bookings
    fields:
    - job_status
    - job_notes
    - final_price
    edit: true
    submit:
      label: Save job
      message: Job updated.
    nav: false
    roles:
    - workshop
  - key: portal_services
    type: table
    title: My services
    source: collection:services
    nav: false
    data:
      display: table
      fields:
      - key: name
        label: Service
      - key: price
        label: Price
        format: money
      - key: deposit
        label: Deposit
        format: money
      - key: duration_minutes
        label: Minutes
        format: number
    roles:
    - workshop
  - key: service_form
    type: form
    title: Add or edit a service
    collection: services
    edit: true
    submit:
      label: Save service
      message: Service saved.
    nav: false
    roles:
    - workshop
  triggers:
  - key: route_booking
    'on':
      collection: bookings
      op: insert
      where:
        job_status: booked
    start:
      agent: router
    goal: 'A new booking was created: {event}. Set its workshop_email.'
    asUser: true
  - key: booking_confirmed
    'on':
      collection: bookings
      op: insert
    notify:
      to: owner
      subject: Your Spokeful booking is received
      body: Thanks! Your booking is saved. The workshop will confirm details and your deposit is handled at checkout.
      link: my_bookings
  - key: booking_reminder
    'on':
      date:
        collection: bookings
        field: date
        offsetDays: -1
        hour: 8
    notify:
      to: owner
      subject: Your bike service is tomorrow
      body: 'Reminder: you have a service booked tomorrow. Bring your bike and any notes.'
      link: my_bookings
  - key: service_due
    'on':
      date:
        collection: bikes
        field: next_service_date
        offsetDays: -7
        hour: 8
    notify:
      to: owner
      subject: Time to service {record.name}
      body: '{record.name} is due for service in a week. Book a Spokeful workshop.'
      link: book
  - key: job_done
    'on':
      collection: bookings
      op: update
      where:
        job_status: done
    notify:
      to: owner
      subject: Your bike is ready
      body: 'The workshop finished the job. Final price: {record.final_price}.'
      link: my_bookings
  - key: stolen_report
    'on':
      collection: stolen_reports
      op: insert
    start:
      agent: theft_reporter
    goal: 'Prepare the stolen bike report for bike {record.bike}, stolen {record.stolen_date}, location {record.location}.
      Circumstances: {record.circumstances}. Police ref: {record.police_ref}.'
    asUser: true
  - key: transfer_invite
    'on':
      collection: transfers
      op: insert
    notify:
      to:
      - record.new_owner_email
      - admins
      subject: A bike is being transferred to you on Spokeful
      body: Someone wants to transfer a bike and its ownership record to you. Sign in to Spokeful with this email address.
        {record.message}
      link: ownership
  notifications:
    emailOnRunDone: true
  billing:
    modes:
    - per_transaction
    currency: eur
    transactionFeePct: 12
    sellers: collection:workshops
  mobile:
    appId: eu.spokeful.app
    appName: Spokeful
    capabilities:
    - name: camera
      reason: To photograph your bike, serial number, receipts and worn parts
    - name: location
      reason: To record where your bike was stolen
    - name: barcode
      reason: To scan the serial number barcode on your bike
    - name: calendar
      reason: To add your service appointments to your calendar
    - name: push
  extensions:
  - key: stripe_deposit_checkout
    description: Charging the owner's deposit through Stripe at the moment of booking, with payout to the workshop and Spokeful's
      commission, is not wired to the booking view yet. Billing is declared as per_transaction with a 12% commission on workshops;
      the checkout step must be set up in Stripe Connect.
  - key: ownership_transfer
    description: Moving a bike and its records to another owner is not available as an automatic action. The transfer form
      invites the new owner by email and the admins complete the handover from /admin/data.
  - key: workshop_onboarding
    description: Workshops are added by the Spokeful admins on /admin/data (name, address, owner_email, slots). Once added,
      the workshop owner signs in with that email and gets the portal.
  - key: sms_whatsapp
    description: SMS and WhatsApp reminders are not available; owners get email and push reminders.
