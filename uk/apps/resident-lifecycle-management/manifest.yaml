apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: movora
  displayName: Movora
  tagline: Every resident, from first enquiry to renewal.
  description: 'Movora runs the resident lifecycle for rental operators: enquiry replies, viewings, applications, referencing
    files, tenancy agreements and renewal reminders, with dashboards for pipeline, voids and time to let.'
  langs:
  - en
  defaultLang: en
  timezone: Europe/London
spec:
  pattern: dashboard
  branding:
    theme: light
    palette:
      primary: '#1f3a5f'
      accent: '#e07a3f'
      background: '#f7f8fa'
      foreground: '#18212b'
    fonts:
      body: Inter
      display: Manrope
    wordmark:
    - text: Mov
      color: primary
    - text: ora
      color: accent
  header:
    links:
    - label: How it works
      href: '#how'
    - label: Available homes
      href: /v/listings
    cta:
      label: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
      - listings
    roles:
    - key: admin
      label: Operator admin
      assignedBy: admin_emails
    - key: lettings_manager
      label: Lettings manager
      assignedBy: invite
    - key: negotiator
      label: Negotiator
      assignedBy: invite
    - key: applicant
      label: Applicant
      assignedBy: signup
    - key: resident
      label: Resident
      assignedBy: derived
      from: collection:tenancies.resident_email
  agents:
  - key: enquiry_agent
    role: helper
    description: Replies at once to a new enquiry, answers from the property details, qualifies the lead and points to the
      viewing booking page.
    profile:
      inline:
        display_name: Movora enquiry agent
        crews:
        - id: enquiry_agent
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the first-response leasing assistant of a UK rental operator. A new enquiry has arrived
            from a listing portal email feed or WhatsApp. Steps: 1) Use search_properties to find the property the enquiry
            refers to (by reference, address or description). 2) Write a short, warm, accurate reply that answers the questions
            asked using ONLY the property details found (rent, bedrooms, availability, pets, features). If something is not
            in the details, say a negotiator will confirm; never invent facts, rents or availability. 3) Qualify the lead
            gently: ask for target move date, number of occupants, employment/income situation and pets, unless already given.
            4) Invite them to book a viewing at the booking page of the app (sign in with their email, then choose a slot
            with a negotiator). Never promise a tenancy or a price. 5) Call update_enquiry once for the enquiry id found in
            the event with: reply_text (the reply), qualification (2-4 lines: budget, move date, occupants, pets, readiness),
            score (0-100 likelihood to proceed), stage ''replied'', and reply_status ''ready_email'' if the enquiry has an
            email address, else ''ready_whatsapp'' (staff will send it by WhatsApp). Reply in plain text, no markdown, in
            English. Finish with a one-line summary starting with ''# Enquiry handled''.'
    output: markdown
    appTools:
    - name: search_properties
      description: Search the operator's properties (reference, address, rent, bedrooms, availability, pets, details)
      action: search
      collection: properties
      scope: all
    - name: update_enquiry
      description: Update an enquiry record with the reply, qualification, score, stage and reply status
      action: write
      collection: enquiries
      scope: all
  - key: file_compiler
    role: helper
    description: Compiles the application file, reads the uploaded documents, highlights gaps and asks the lettings manager
      to decide.
    awaits:
    - tenancy_decision
    profile:
      inline:
        display_name: Movora file compiler
        crews:
        - id: file_compiler
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 14
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You prepare tenancy application files for a lettings manager in England. Read the application with
            read_application and open each uploaded document with read_upload (call it with the file id; it reads PDFs and
            images, OCR included). Check: identity document, proof of income (payslips or contracts or accounts) against the
            stated income, employer or employment status, current address evidence, guarantor details when income looks short,
            pets and move date versus property availability. Compute the rent-to-income ratio only from stated and document-verified
            figures; never invent figures. Referencing with credit data is done separately by a licensed partner: you never
            run credit checks and never state a credit result. Then call update_application with: file_summary (concise markdown:
            verified facts, ratio, concerns), gaps (bulleted list of missing or inconsistent items, or ''None''), and status
            ''awaiting_documents'' if gaps exist, otherwise ''in_review''. Finally call request_tenancy_decision with a short
            recommendation (proceed, proceed with conditions, or hold) and the reasons. Never decide yourself, and be fair:
            do not use protected characteristics. Start your final answer with ''# Application file <applicant name>''.'
    output: markdown
    appTools:
    - name: read_application
      description: Read the applicant's application record
      action: read
      collection: applications
      scope: user
    - name: update_application
      description: Update the application record (file summary, gaps, status)
      action: write
      collection: applications
      scope: user
    - name: read_upload
      description: Read a file the applicant uploaded
      action: read_file
  - key: tenancy_drafter
    role: helper
    description: Drafts the tenancy agreement after approval, updated for the Renters' Rights Act transition, and records
      the tenancy.
    profile:
      inline:
        display_name: Movora tenancy drafter
        crews:
        - id: tenancy_drafter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You draft assured tenancy agreements for an English letting operator after the lettings manager
            approved an application. Read the application (read_application) and the property (read_property). Draft the agreement
            in Markdown with a level-1 title, parties, property, rent and payment date, deposit (protected in a government-approved
            scheme, within the statutory cap), start date, rights and obligations, pets, access, repairs, and notice. Reflect
            the Renters'' Rights Act transition as you understand it: tenancies are assured periodic with no fixed term and
            no section 21 no-fault eviction, rent increases only through a section 13 notice once a year, no rent bidding,
            rent in advance limited to one month, possession only on the statutory grounds, and the government-issued information
            sheet must be given. Where a point depends on the exact commencement rules or the operator''s own terms, insert
            a visible [CHECK: ...] marker instead of guessing. State at the top that the draft must be reviewed by the lettings
            manager or a solicitor before sending; it is not legal advice. Then call create_tenancy once with: property, resident_name,
            resident_email, rent_pcm, deposit, start_date (the move date), renewal_date and rent_review_date (12 months after
            the start date, YYYY-MM-DD), status ''pending_signature'', signature_status ''pending'', deposit_status ''pending'',
            first_rent_status ''pending'', agreement_md (the full text) and move_out_checklist (a checklist in Markdown: notice,
            final meter readings, inventory check-out, keys, forwarding address, cleaning, deposit return). Then call update_application
            with status ''approved''. Finish with a short summary starting with ''# Tenancy drafted''. Do not claim anything
            has been signed or paid.'
    output: markdown
    appTools:
    - name: read_application
      description: Read the applicant's application record
      action: read
      collection: applications
      scope: user
    - name: update_application
      description: Update the application record (file summary, gaps, status)
      action: write
      collection: applications
      scope: user
    - name: read_property
      description: Read the property details (rent, deposit, address, availability)
      action: read
      collection: properties
      scope: all
    - name: create_tenancy
      description: Create the tenancy record with the agreement text and dates
      action: append
      collection: tenancies
      scope: user
  data:
    collections:
    - name: properties
      ownedBy: shared
      description: The operator's portfolio, one record per unit; kept by the admins on the data page
      fields:
      - name: reference
        type: text
        required: true
        label: Reference
      - name: address
        type: text
        required: true
        label: Address
      - name: postcode
        type: text
        label: Postcode
      - name: bedrooms
        type: number
        label: Bedrooms
      - name: rent_pcm
        type: number
        label: Rent per month (GBP)
      - name: deposit
        type: number
        label: Deposit (GBP)
      - name: available_from
        type: date
        label: Available from
      - name: status
        type: select
        label: Status
        options:
        - available
        - let
        - void
        - off_market
      - name: pets_allowed
        type: boolean
        label: Pets considered
      - name: features
        type: textarea
        label: Features
      - name: details
        type: textarea
        label: Details for answering questions (EPC, council tax, bills, parking, etc.)
      - name: lat
        type: number
        label: Latitude
      - name: lon
        type: number
        label: Longitude
    - name: negotiators
      ownedBy: shared
      description: Negotiators whose calendar viewings are booked into
      fields:
      - name: name
        type: text
        required: true
        label: Name
      - name: email
        type: email
        label: Email
      - name: phone
        type: text
        label: Phone
    - name: enquiries
      ownedBy: org
      description: Enquiries from the portal email feed and WhatsApp
      fields:
      - name: name
        type: text
        label: Name
      - name: email
        type: email
        label: Email
      - name: phone
        type: text
        label: Phone
      - name: source
        type: text
        label: Source
      - name: property_ref
        type: text
        label: Listing reference
      - name: message
        type: textarea
        label: Message
      - name: stage
        type: select
        label: Stage
        default: new
        options:
        - new
        - replied
        - viewing_booked
        - applied
        - let
        - lost
      - name: qualification
        type: textarea
        label: Qualification
      - name: score
        type: number
        label: Lead score
      - name: reply_text
        type: textarea
        label: Reply
      - name: reply_status
        type: select
        label: Reply status
        options:
        - ready_email
        - ready_whatsapp
        - sent
      access:
      - role: lettings_manager
        can:
        - read
        - write
      - role: negotiator
        can:
        - read
        - write
      retentionDays: 730
    - name: viewings
      ownedBy: user
      description: Viewings booked by prospects
      fields:
      - name: property
        type: select
        optionsFrom: collection:properties
        label: Property
      - name: notes
        type: textarea
        label: Notes
      access:
      - role: lettings_manager
        can:
        - read
        - write
      - role: negotiator
    - name: applications
      ownedBy: user
      description: Tenancy applications with documents
      fields:
      - name: property
        type: select
        optionsFrom: collection:properties
        required: true
        label: Property
      - name: full_name
        type: text
        required: true
        label: Full name
      - name: email
        type: email
        required: true
        label: Email
      - name: phone
        type: text
        label: Phone
      - name: employment_status
        type: select
        required: true
        label: Employment
        options:
        - employed
        - self_employed
        - student
        - retired
        - other
      - name: employer
        type: text
        label: Employer
      - name: annual_income
        type: number
        required: true
        label: Annual income (GBP)
      - name: current_address
        type: textarea
        required: true
        label: Current address
      - name: guarantor_name
        type: text
        label: Guarantor name
      - name: guarantor_email
        type: email
        label: Guarantor email
      - name: pets
        type: text
        label: Pets (type and number)
      - name: move_date
        type: date
        required: true
        label: Desired move date
      - name: documents
        type: file
        accept:
        - pdf
        - jpg
        - jpeg
        - png
        maxMb: 10
        multiple: true
        label: ID, proof of income, address evidence
      - name: status
        type: select
        label: Status
        default: submitted
        options:
        - submitted
        - awaiting_documents
        - in_review
        - approved
        - declined
      - name: gaps
        type: textarea
        label: Gaps
      - name: file_summary
        type: textarea
        label: File summary
      access:
      - role: lettings_manager
        can:
        - read
        - write
      - role: negotiator
      retentionDays: 1095
    - name: referencing_results
      ownedBy: org
      description: Results sent by the licensed referencing partner
      fields:
      - name: application_ref
        type: text
        label: Application
      - name: applicant_name
        type: text
        label: Applicant
      - name: outcome
        type: text
        label: Outcome
      - name: affordability
        type: text
        label: Affordability
      - name: report_url
        type: url
        label: Partner report
      access:
      - role: lettings_manager
      retentionDays: 365
    - name: tenancies
      ownedBy: user
      description: 'Tenancies: agreement, signature, payments, review dates, move-out'
      fields:
      - name: property
        type: text
        label: Property
      - name: resident_name
        type: text
        label: Resident
      - name: resident_email
        type: email
        label: Resident email
      - name: rent_pcm
        type: number
        label: Rent per month
      - name: deposit
        type: number
        label: Deposit
      - name: start_date
        type: date
        label: Start date
      - name: renewal_date
        type: date
        label: Review date
      - name: rent_review_date
        type: date
        label: Rent review date
      - name: days_to_let
        type: number
        label: Days to let
      - name: status
        type: select
        label: Status
        options:
        - pending_signature
        - active
        - notice_given
        - ended
      - name: signature_status
        type: select
        label: Signature
        options:
        - pending
        - signed
      - name: deposit_status
        type: select
        label: Deposit
        options:
        - pending
        - paid
      - name: first_rent_status
        type: select
        label: First rent
        options:
        - pending
        - paid
      - name: agreement_md
        type: textarea
        label: Tenancy agreement
      - name: move_out_checklist
        type: textarea
        label: Move-out checklist
      access:
      - role: lettings_manager
        can:
        - read
        - write
      - role: negotiator
    - name: partner_events
      ownedBy: org
      description: Events from the e-signature and payment partners
      fields:
      - name: tenancy_ref
        type: text
        label: Tenancy
      - name: type
        type: text
        label: Type
      - name: status
        type: text
        label: Status
      access:
      - role: lettings_manager
      retentionDays: 365
  views:
  - key: home
    type: page
    title: Movora
    nav: false
    sections:
    - type: hero
      title: From first enquiry to **renewal**, in one place.
      text: Movora answers enquiries instantly, books viewings, compiles application files and drafts tenancy agreements,
        then keeps residents and lettings managers on top of reviews and move-outs.
      actions:
      - label: Browse available homes
        href: /v/listings
        style: primary
      - label: Sign in
        href: /login
        style: ghost
    - type: steps
      id: how
      title: How it works
      items:
      - title: Enquire
        text: Portal and WhatsApp enquiries get an immediate, accurate reply and a qualification.
      - title: View
        text: Prospects book a slot with a negotiator and get reminders.
      - title: Apply
        text: One form with documents; the agent compiles the file and flags gaps.
      - title: Sign and move in
        text: After approval the agreement is drafted for review; reminders follow for reviews and move-out.
    - type: note
      content: Movora supports lettings staff and does not replace legal advice. Agreements must be reviewed before sending.
  - key: listings
    type: cards
    title: Available homes
    source: collection:properties
    nav: true
    data:
      display: cards
      fields:
      - key: address
        label: Address
      - key: bedrooms
        label: Beds
        format: number
      - key: rent_pcm
        label: Rent pcm
        format: money
      - key: available_from
        label: Available
        format: date
      filters:
      - field: status
        op: '='
        value: available
      sort:
        field: rent_pcm
        dir: asc
  - key: book
    type: booking
    title: Book a viewing
    collection: viewings
    resources: collection:negotiators
    fields:
    - property
    - notes
    slots:
      days:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      from: 09:00
      to: '18:00'
      minutes: 30
      tz: Europe/London
      aheadDays: 14
      minNoticeHours: 2
      capacity: 1
    roles:
    - applicant
    - resident
    - admin
    - lettings_manager
    - negotiator
  - key: apply
    type: form
    title: Apply for a tenancy
    collection: applications
    fields:
    - property
    - full_name
    - email
    - phone
    - employment_status
    - employer
    - annual_income
    - current_address
    - guarantor_name
    - guarantor_email
    - pets
    - move_date
    - documents
    submit:
      label: Submit application
      message: Thanks. Your application and documents are being checked; we will email you if anything is missing.
      redirect: my_applications
    roles:
    - applicant
    - resident
    - admin
  - key: my_applications
    type: table
    title: My applications
    source: collection:applications
    roles:
    - applicant
    - resident
    data:
      display: table
      fields:
      - key: property
        label: Property
      - key: move_date
        label: Move date
        format: date
      - key: status
        label: Status
        format: badge
      - key: gaps
        label: What is missing
  - key: my_tenancy
    type: table
    title: My tenancy
    source: collection:tenancies
    roles:
    - resident
    - applicant
    data:
      display: table
      fields:
      - key: property
        label: Property
      - key: rent_pcm
        label: Rent pcm
        format: money
      - key: start_date
        label: Start
        format: date
      - key: renewal_date
        label: Review
        format: date
      - key: status
        label: Status
        format: badge
      - key: agreement_md
        label: Agreement
      - key: move_out_checklist
        label: Move-out checklist
  - key: pipeline
    type: page
    title: Pipeline
    roles:
    - admin
    - lettings_manager
    - negotiator
    sections:
    - type: data
      id: k-enq
      title: Enquiries
      source: collection:enquiries
      display: kpi
      kpis:
      - label: Enquiries
        agg: count
      - label: Average lead score
        agg: avg
        field: score
        format: number
    - type: data
      id: k-app
      title: Applications by status
      source: collection:applications
      display: chart
      chart: bar
      fields:
      - key: status
        label: Status
      - key: count
        label: Applications
      groupBy:
        field: status
        aggs:
        - key: n
          agg: count
    - type: data
      id: k-stage
      title: Enquiries by stage
      source: collection:enquiries
      display: chart
      chart: bar
      fields:
      - key: stage
        label: Stage
      - key: count
        label: Enquiries
      groupBy:
        field: stage
        aggs:
        - key: n
          agg: count
    - type: data
      id: k-void
      title: Voids
      source: collection:properties
      display: table
      fields:
      - key: address
        label: Address
      - key: bedrooms
        label: Beds
        format: number
      - key: rent_pcm
        label: Rent pcm
        format: money
      - key: available_from
        label: Available from
        format: date
      filters:
      - field: status
        op: '='
        value: void
      empty: No voids.
    - type: data
      id: k-ttl
      title: Time to let
      source: collection:tenancies
      display: kpi
      kpis:
      - label: Average days to let
        agg: avg
        field: days_to_let
        format: number
      - label: Tenancies
        agg: count
  - key: enquiries_list
    type: table
    title: Enquiries
    source: collection:enquiries
    export: true
    roles:
    - admin
    - lettings_manager
    - negotiator
    data:
      display: table
      fields:
      - key: name
        label: Name
      - key: source
        label: Source
      - key: property_ref
        label: Listing
      - key: stage
        label: Stage
        format: badge
      - key: score
        label: Score
        format: number
      - key: qualification
        label: Qualification
      - key: reply_text
        label: Reply
      actions:
      - type: call
        field: phone
        label: Call
  - key: applications_list
    type: table
    title: Applications
    source: collection:applications
    export: true
    roles:
    - admin
    - lettings_manager
    - negotiator
    data:
      display: table
      fields:
      - key: full_name
        label: Applicant
      - key: property
        label: Property
      - key: annual_income
        label: Income
        format: money
      - key: move_date
        label: Move date
        format: date
      - key: status
        label: Status
        format: badge
      - key: gaps
        label: Gaps
      - key: file_summary
        label: File summary
      actions:
      - type: call
        field: phone
        label: Call
  - key: edit_application
    type: form
    title: Update application
    collection: applications
    fields:
    - status
    - gaps
    edit: true
    nav: false
    roles:
    - admin
    - lettings_manager
    submit:
      label: Save
      message: Saved.
  - key: referencing_list
    type: table
    title: Referencing results
    source: collection:referencing_results
    roles:
    - admin
    - lettings_manager
    data:
      display: table
      fields:
      - key: applicant_name
        label: Applicant
      - key: outcome
        label: Outcome
        format: badge
      - key: affordability
        label: Affordability
      - key: report_url
        label: Report
        format: link
  - key: decisions
    type: approvals
    title: Decisions
    approvals:
    - tenancy_decision
    roles:
    - admin
    - lettings_manager
  - key: tenancies_list
    type: table
    title: Tenancies
    source: collection:tenancies
    export: true
    roles:
    - admin
    - lettings_manager
    - negotiator
    data:
      display: table
      fields:
      - key: property
        label: Property
      - key: resident_name
        label: Resident
      - key: status
        label: Status
        format: badge
      - key: signature_status
        label: Signature
        format: badge
      - key: deposit_status
        label: Deposit
        format: badge
      - key: first_rent_status
        label: First rent
        format: badge
      - key: renewal_date
        label: Review
        format: date
  - key: edit_tenancy
    type: form
    title: Update tenancy
    collection: tenancies
    fields:
    - status
    - signature_status
    - deposit_status
    - first_rent_status
    - days_to_let
    edit: true
    nav: false
    roles:
    - admin
    - lettings_manager
    submit:
      label: Save
      message: Saved.
  - key: account
    type: account
    title: Subscription
    roles:
    - admin
  approvals:
  - key: tenancy_decision
    title: Approve or decline this application
    description: The lettings manager decides after reading the compiled file and the referencing result.
    role: lettings_manager
    fields:
    - file_summary
    - gaps
  triggers:
  - key: email_feed
    description: Enquiries forwarded by the listing portal email parser
    'on':
      webhook: true
    write:
      collection: enquiries
      fields:
        name: from_name
        email: from_email
        source: source
        property_ref: listing_ref
        message: body
  - key: whatsapp_feed
    description: Inbound WhatsApp messages from the WhatsApp provider
    'on':
      webhook: true
    write:
      collection: enquiries
      fields:
        name: profile_name
        phone: from
        source: source
        property_ref: listing_ref
        message: text
  - key: enquiry_in
    'on':
      collection: enquiries
      op: insert
      where:
        stage: new
    start:
      agent: enquiry_agent
    asUser: false
    goal: 'New enquiry. Name: {record.name}. Email: {record.email}. Phone: {record.phone}. Source: {record.source}. Listing
      reference: {record.property_ref}. Message: {record.message}. Full event (contains the enquiry id): {event}'
  - key: reply_ready
    description: Email the reply to the prospect
    'on':
      collection: enquiries
      op: update
      where:
        reply_status: ready_email
    notify:
      to: record.email
      subject: Your enquiry about {record.property_ref}
      body: '{record.reply_text}'
      link: book
  - key: whatsapp_reply_waiting
    'on':
      collection: enquiries
      op: update
      where:
        reply_status: ready_whatsapp
    notify:
      to: role:negotiator
      subject: 'WhatsApp reply ready to send: {record.name}'
      body: 'A reply for {record.name} ({record.phone}) is ready: {record.reply_text}'
      link: enquiries_list
  - key: viewing_confirm
    'on':
      collection: viewings
      op: insert
    notify:
      to:
      - owner
      - role:negotiator
      subject: Viewing confirmed
      body: Your viewing is booked for {record.date}. Reply to the email feed or contact us if you need to change it.
      link: book
  - key: viewing_reminder
    'on':
      date:
        collection: viewings
        field: date
        offsetDays: 0
        hour: 7
    notify:
      to:
      - owner
      - role:negotiator
      subject: Viewing today
      body: 'Reminder: viewing today at {record.property}.'
      link: book
  - key: application_in
    'on':
      collection: applications
      op: insert
      where:
        status: submitted
    start:
      agent: file_compiler
    goal: 'A new tenancy application was submitted. Compile the file. Event: {event}. Document file ids: {record.documents}.'
  - key: referencing_in
    'on':
      collection: referencing_results
      op: insert
    notify:
      to: role:lettings_manager
      subject: 'Referencing result received: {record.applicant_name}'
      body: The referencing partner returned an outcome of {record.outcome} for {record.applicant_name}.
      link: referencing_list
  - key: application_approved
    'on':
      approval: tenancy_decision
      decision: approved
    start:
      agent: tenancy_drafter
    goal: 'The lettings manager approved the application. Draft the tenancy agreement and record the tenancy. Event: {event}'
  - key: application_declined
    'on':
      approval: tenancy_decision
      decision: rejected
    notify:
      to: owner
      subject: Your application
      body: Thank you for applying. Unfortunately we are unable to offer you this tenancy. Please contact us if you would
        like to know more.
      link: my_applications
  - key: agreement_ready
    'on':
      collection: tenancies
      op: insert
    notify:
      to:
      - role:lettings_manager
      subject: 'Tenancy agreement drafted: {record.property}'
      body: A draft agreement for {record.resident_name} is ready for your review.
      link: tenancies_list
  - key: partner_events_in
    description: E-signature and payment partner events
    'on':
      webhook: true
    write:
      collection: partner_events
      fields:
        tenancy_ref: tenancy_ref
        type: type
        status: status
  - key: partner_event_notify
    'on':
      collection: partner_events
      op: insert
    notify:
      to: role:lettings_manager
      subject: 'Partner event: {record.type} {record.status}'
      body: Event {record.type} ({record.status}) received for tenancy {record.tenancy_ref}. Update the tenancy record.
      link: tenancies_list
  - key: renewal_reminder
    'on':
      date:
        collection: tenancies
        field: renewal_date
        offsetDays: -60
        hour: 8
    notify:
      to:
      - owner
      - role:lettings_manager
      subject: 'Tenancy review coming up: {record.property}'
      body: The review date for {record.property} is in 60 days. Please talk to us about your plans.
      link: my_tenancy
  - key: rent_review_reminder
    'on':
      date:
        collection: tenancies
        field: rent_review_date
        offsetDays: -30
        hour: 8
    notify:
      to: role:lettings_manager
      subject: 'Rent review due: {record.property}'
      body: The rent review for {record.property} ({record.resident_name}) is due in 30 days.
      link: tenancies_list
  - key: move_out
    'on':
      collection: tenancies
      op: update
      where:
        status: notice_given
    notify:
      to:
      - owner
      - role:lettings_manager
      subject: 'Move-out checklist: {record.property}'
      body: 'Notice has been given. Your move-out checklist: {record.move_out_checklist}'
      link: my_tenancy
  billing:
    modes:
    - subscription
    currency: gbp
    plans:
    - key: units_50
      price: 79
      interval: month
      label: Up to 50 units
      roles:
      - admin
    - key: units_250
      price: 249
      interval: month
      label: Up to 250 units
      roles:
      - admin
    - key: units_1000
      price: 699
      interval: month
      label: Up to 1,000 units
      roles:
      - admin
  extensions:
  - key: multi_operator
    description: This manifest serves one operator (its admins fill the portfolio on the data page). Several operators signing
      up with their own portfolios means one app per operator.
  - key: unit_cap
    description: The unit limit of each plan is not enforced automatically for properties added by admins; staff keep within
      their plan.
  - key: whatsapp_replies
    description: 'WhatsApp inbound works through the webhook, but sending WhatsApp replies is not available yet: the negotiator
      receives the ready reply and sends it manually.'
  - key: calendar_sync
    description: Viewings are booked in the app's booking calendar; syncing to Google or Microsoft calendars (OAuth) is not
      available yet.
  - key: referencing_partner
    description: 'The licensed referencing partner is not called from the app: the partner posts its result to the referencing
      webhook and the agent never runs credit checks.'
  - key: esignature_and_payments
    description: E-signature and collection of deposit and first rent run at the partners; their status arrives by webhook
      and the manager updates the tenancy record. Sending the agreement to the signature provider is not available yet.
