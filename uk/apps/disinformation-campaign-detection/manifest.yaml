apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: countersignal
  displayName: Countersignal
  tagline:
    en: Detect disinformation campaigns against your organisation, and answer them.
    fr: Détectez les campagnes de désinformation visant votre organisation et répondez-y.
    de: Desinformationskampagnen gegen Ihre Organisation erkennen und beantworten.
    ru: Выявляйте дезинформационные кампании против вашей организации и отвечайте на них.
    ar: اكتشف حملات التضليل ضد مؤسستك وتصدَّ لها.
  description:
    en: Agents watch news sites and licensed social data feeds, cluster posts into narratives, track their spread and look
      for coordination signals. Analysts review every narrative before it becomes a campaign or triggers an alert. Clients
      get alerts, a weekly briefing and counter-messaging options to approve.
  langs:
  - en
  - fr
  - de
  - ru
  - ar
  defaultLang: en
  timezone: Europe/London
spec:
  pattern: dashboard
  branding:
    theme: light
    palette:
      primary: '#0f1f33'
      accent: '#d9822b'
      background: '#f6f7f9'
      foreground: '#142033'
    fonts:
      body: Inter
      display: Source Serif 4
    wordmark:
    - text: Counter
      color: primary
    - text: signal
      color: accent
    width: wide
  header:
    links:
    - label:
        en: How it works
      href: '#how'
    - label:
        en: Sources and limits
      href: '#sources'
    cta:
      label:
        en: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: analyst
      label: Analyst
      assignedBy: invite
    - key: client
      label:
        en: Client viewer
      assignedBy: invite
  agents:
  - key: monitor
    role: scheduled
    description: 'Daily watch for one client: clusters news articles and licensed-feed posts into narratives, tracks spread
      and coordination signals, saves candidate narratives for analyst review.'
    memory: instance
    profile:
      inline:
        display_name: Countersignal monitor
        crews:
        - id: monitor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You are a disinformation analyst''s assistant watching one client organisation. You receive its
            entities, topics, keywords, languages and regions.


            SOURCES. (1) News sites and open web pages, collected through the WebRobot MCP, only where the site''s terms and
            robots.txt allow it. (2) Posts from social platforms ONLY through the search_posts tool, which reads posts delivered
            by an official API or licensed data feed. NEVER scrape, crawl or log in to any social network, and never try to
            get around a platform''s terms.


            WORK. Collect recent articles and posts matching the watch. Cluster them into narratives (the same claim or framing).
            For each narrative estimate: first and last seen, spread over time (a timeline of dated points), the main sources,
            a reach estimate with an explicit basis (state the figures, that they come from feed or page metrics, and the
            uncertainty; never invent reach), and a risk score 0-100 with reasons (falsifiability of the claim, harm to the
            client, speed of spread, reach).


            COORDINATION SIGNALS. Look for many newly created accounts sharing the same or near-identical text within a short
            window, identical links or hashtags pushed in bursts, accounts posting at machine-regular intervals, and recycled
            old media. Report only what the data shows, quote the numbers, and say these are signals, not proof of coordination
            or of who is behind it. Never attribute a campaign to a state or a person.


            VIDEO. You do not analyse video yourself. If a feed record has has_video true, use only the transcript, the metadata
            and any synthetic-media score supplied by the feed vendor; label them as vendor signals and flag the narrative
            for the analyst''s manual video check. Never state that a video is fake or genuine as fact.


            SAVE. For each narrative call save_narrative once, with review_status "candidate", client_visible false and alert_status
            "none". You never mark anything as a campaign, never approve an alert and never make anything visible to the client:
            the analyst does. Use your memory (remember) to keep the narratives already tracked so you update rather than
            duplicate them.


            FINISH with a report that starts with a level-1 title "# Watch run — <organisation> — <date>", then sections ##
            New narratives, ## Changed since last run, ## Coordination signals, ## Gaps and limits. Write the narrative fields
            in the language of the client''s brief; never invent figures.'
    appTools:
    - name: search_posts
      description: Search posts delivered by licensed social data feeds (platform, account, text, time, language, region,
        video flags)
      action: search
      collection: feed_posts
      scope: all
    - name: save_narrative
      description: Save a candidate narrative for analyst review
      action: append
      collection: narratives
  - key: counter_drafter
    role: helper
    description: Drafts counter-messaging options for a narrative an analyst confirmed as a campaign.
    profile:
      inline:
        display_name: Countersignal counter-messaging drafter
        crews:
        - id: drafter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You draft counter-messaging options for an organisation targeted by a confirmed disinformation narrative.
            Produce 3 options that differ in approach: a factual rebuttal, a pre-bunking or context message, and a low-profile
            option (no public reply, brief stakeholders and monitor). For each give: tone, channel, the message text in the
            client''s language, the evidence it relies on, and the risk (for example amplifying the narrative). Use only facts
            present in the narrative record and analyst notes; mark anything to verify with the client as [TO VERIFY]. Never
            invent facts, quotes or figures, never attack individuals, never use deceptive tactics or fake accounts. Save
            each option with save_counter_option with decision "pending" and client_visible false; the analyst releases them
            and the client decides. Finish with a short report starting with "# Counter-messaging options — <narrative title>".'
    appTools:
    - name: save_counter_option
      description: Save one counter-messaging option for review
      action: append
      collection: counter_options
  - key: briefer
    role: scheduled
    description: Weekly briefing for one client from the reviewed narratives.
    profile:
      inline:
        display_name: Countersignal weekly briefer
        crews:
        - id: briefer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write the weekly briefing for one client from the narratives recorded for it (use search_narratives).
            Only describe narratives with review_status campaign or watch; mention candidates only as ''under analyst review''
            without details. Structure: # Weekly briefing — <organisation> — <week>; ## Headlines; ## Active campaigns (risk,
            reach with basis, coordination signals, what changed); ## Narratives being watched; ## Decisions waiting for you
            (counter-messaging options); ## Outlook. Under 600 words, plain wording, real figures only, say where evidence
            is weak. Then call save_briefing once with status "draft"; an analyst approves it before it is emailed.'
    appTools:
    - name: search_narratives
      description: Read the narratives recorded for this client
      action: search
      collection: narratives
    - name: save_briefing
      description: Save the weekly briefing draft
      action: append
      collection: briefings
  templates:
  - key: watch
    title:
      en: Client watch
    description:
      en: 'What to watch for one client: entities, topics, keywords, languages and regions. Runs daily.'
    agent: monitor
    roles:
    - analyst
    - admin
    maxPerUser: 200
    params:
    - name: organisation
      type: text
      required: true
      label:
        en: Client organisation
    - name: client_email
      type: email
      required: true
      label:
        en: Client contact email (alerts)
    - name: entities
      type: textarea
      required: true
      label:
        en: Entities to watch (names, brands, officials)
    - name: topics
      type: textarea
      label:
        en: Topics
    - name: keywords
      type: textarea
      label:
        en: Keywords and hashtags
    - name: languages
      type: multiselect
      required: true
      label:
        en: Languages
      options:
      - value: en
        label: English
      - value: fr
        label: Français
      - value: de
        label: Deutsch
      - value: ru
        label: Русский
      - value: ar
        label: العربية
    - name: regions
      type: textarea
      label:
        en: Regions and countries
    goal: 'Client: {organisation} (alert contact {client_email}). Watch "{instance}". Today is {date}.

      Entities: {entities}

      {?topics}Topics: {topics}{/topics}

      {?keywords}Keywords: {keywords}{/keywords}

      Languages: {languages}

      {?regions}Regions: {regions}{/regions}

      Run the daily watch and save candidate narratives with client_email set to {client_email} and organisation {organisation}.'
    schedule:
      cron: 0 5 * * *
      userCanChange: true
    cost:
      perRun: 0
  - key: weekly_briefing
    title:
      en: Weekly briefing
    description:
      en: A weekly briefing for one client, approved by an analyst before it is emailed.
    agent: briefer
    roles:
    - analyst
    - admin
    maxPerUser: 200
    params:
    - name: organisation
      type: text
      required: true
      label:
        en: Client organisation
    - name: client_email
      type: email
      required: true
      label:
        en: Client contact email
    goal: Write the weekly briefing for {organisation} (contact {client_email}) for the week ending {date}. Save it with client_email
      {client_email}. Write in the language with ISO code {lang}.
    schedule:
      cron: 0 6 * * 1
      userCanChange: true
  triggers:
  - key: social_feed
    description: Licensed social data feed or official API relay posts here
    'on':
      webhook: true
    write:
      collection: feed_posts
      fields:
        post_id: post.id
        platform: post.platform
        account_id: post.account_id
        account_created: post.account_created
        text: post.text
        url: post.url
        posted_at: post.posted_at
        language: post.language
        region: post.region
        likes: post.likes
        shares: post.shares
        views: post.views
        has_video: post.has_video
        video_url: post.video_url
        video_transcript: post.transcript
        vendor_synthetic_score: post.synthetic_score
        feed: feed
      keyBy: post_id
  - key: campaign_alert
    description: Email the client when an analyst has confirmed a campaign and approved the alert
    'on':
      collection: narratives
      op: update
      where:
        review_status: campaign
        alert_status: approved
    notify:
      to:
      - record.client_email
      subject:
        en: 'Countersignal alert: {record.title}'
      body:
        en: 'Our analysts have confirmed a disinformation campaign relevant to {record.organisation}.


          Narrative: {record.title}

          Risk score: {record.risk_score}


          Open Countersignal to see the timeline, sources and reach estimate.'
      link: my_narratives
  - key: counter_request
    description: Draft counter-messaging when an analyst asks for it
    'on':
      collection: narratives
      op: update
      where:
        review_status: campaign
        draft_counter: true
    start:
      agent: counter_drafter
    goal: 'Draft counter-messaging options for the confirmed campaign "{record.title}" against {record.organisation}. Summary:
      {record.summary}

      Sources: {record.sources}

      Coordination signals: {record.coordination_signals}

      Analyst notes: {record.analyst_notes}

      Save each option with client_email {record.client_email}.'
  - key: briefing_approved
    description: Email the weekly briefing once an analyst approved it
    'on':
      collection: briefings
      op: update
      where:
        status: approved
    notify:
      to:
      - record.client_email
      subject:
        en: 'Countersignal weekly briefing: {record.title}'
      body:
        en: 'Your weekly disinformation briefing is ready.


          {record.body}'
      link: my_briefings
  - key: counter_decided
    description: Tell the analysts when the client decided on an option
    'on':
      collection: counter_options
      op: update
      where:
        decision: approved
    notify:
      to:
      - role:analyst
      subject:
        en: 'Counter-messaging approved: {record.narrative_title}'
      body:
        en: 'The client approved an option for {record.narrative_title}. Option: {record.option_text}'
      link: narratives_review
  data:
    collections:
    - name: feed_posts
      ownedBy: org
      description: Posts delivered by official APIs or licensed data feeds (never scraped). Admins can also load a CSV on
        the data page.
      retentionDays: 180
      fields:
      - name: post_id
        type: text
        required: true
      - name: feed
        type: text
      - name: platform
        type: text
      - name: account_id
        type: text
      - name: account_created
        type: date
      - name: text
        type: textarea
      - name: url
        type: url
      - name: posted_at
        type: date
      - name: language
        type: text
      - name: region
        type: text
      - name: likes
        type: number
      - name: shares
        type: number
      - name: views
        type: number
      - name: has_video
        type: boolean
      - name: video_url
        type: url
      - name: video_transcript
        type: textarea
      - name: vendor_synthetic_score
        type: number
      access:
      - role: analyst
        can:
        - read
    - name: narratives
      ownedBy: user
      description: Narratives per client watch, reviewed by analysts before the client sees them
      fields:
      - name: title
        type: text
        required: true
      - name: organisation
        type: text
      - name: client_email
        type: email
      - name: summary
        type: textarea
      - name: review_status
        type: select
        options:
        - value: candidate
          label: Candidate
        - value: watch
          label: Watch
        - value: campaign
          label: Campaign
        - value: dismissed
          label: Dismissed
      - name: risk_score
        type: number
      - name: risk_reasons
        type: textarea
      - name: reach_estimate
        type: number
      - name: reach_basis
        type: textarea
      - name: first_seen
        type: date
      - name: last_seen
        type: date
      - name: timeline
        type: textarea
        help: Dated points of spread
      - name: sources
        type: textarea
      - name: coordination_signals
        type: textarea
      - name: video_notes
        type: textarea
        help: Vendor signals and the analyst's manual video check
      - name: analyst_notes
        type: textarea
      - name: client_visible
        type: boolean
      - name: alert_status
        type: select
        options:
        - value: none
          label: None
        - value: approved
          label: Approved to send
      - name: draft_counter
        type: boolean
      access:
      - role: analyst
        can:
        - read
        - write
      - role: client
        where:
          client_email: '{user.email}'
          client_visible: true
        can:
        - read
    - name: counter_options
      ownedBy: user
      description: Counter-messaging options; the client approves or rejects
      fields:
      - name: narrative_title
        type: text
      - name: client_email
        type: email
      - name: option_text
        type: textarea
      - name: tone
        type: text
      - name: channel
        type: text
      - name: evidence
        type: textarea
      - name: risk
        type: textarea
      - name: client_visible
        type: boolean
      - name: decision
        type: select
        options:
        - value: pending
          label: Pending
        - value: approved
          label: Approved
        - value: rejected
          label: Rejected
        - value: changes
          label: Changes requested
      - name: client_comment
        type: textarea
      access:
      - role: analyst
        can:
        - read
        - write
      - role: client
        where:
          client_email: '{user.email}'
          client_visible: true
        can:
        - read
        - write
    - name: briefings
      ownedBy: user
      description: Weekly briefings, approved by an analyst before emailing
      fields:
      - name: title
        type: text
      - name: client_email
        type: email
      - name: organisation
        type: text
      - name: body
        type: textarea
      - name: status
        type: select
        options:
        - value: draft
          label: Draft
        - value: approved
          label: Approved
      access:
      - role: analyst
        can:
        - read
        - write
      - role: client
        where:
          client_email: '{user.email}'
          status: approved
        can:
        - read
  views:
  - key: home
    type: page
    nav: false
    title: Countersignal
    sections:
    - type: hero
      band: true
      eyebrow:
        en: Disinformation defence
      title:
        en: See the **campaign** before it becomes the story.
      text:
        en: Countersignal watches news sites and licensed data feeds for narratives targeting your organisation, tracks how
          they spread, flags coordination signals, and gives you analyst-reviewed alerts and counter-messaging you approve.
      actions:
      - label:
          en: Sign in
        href: /login
        style: primary
      note:
        en: Annual contracts from £50,000. English, Français, Deutsch, Русский, العربية.
    - type: steps
      id: how
      title:
        en: How it works
      items:
      - title:
          en: Define the watch
        text:
          en: Entities, topics, keywords, languages and regions for your organisation.
      - title:
          en: Agents find narratives
        text:
          en: Posts and articles are clustered into narratives with a timeline, sources, reach estimate and risk score.
      - title:
          en: Analysts decide
        text:
          en: Every narrative is reviewed by an analyst before it is called a campaign or triggers an alert.
      - title:
          en: You respond
        text:
          en: Email alerts, a weekly briefing and counter-messaging options for you to approve.
    - type: cards
      id: sources
      title:
        en: Sources and limits
      items:
      - title:
          en: News and open web
        text:
          en: Collected only where site terms and robots.txt allow.
      - title:
          en: Social platforms
        text:
          en: Only through official APIs or licensed data feeds. We never scrape social networks.
      - title:
          en: Signals, not verdicts
        text:
          en: Coordination and synthetic-media indicators are evidence for analysts, not proof of attribution.
    - type: note
      content:
        en: Government and election clients may require security-vetted staff; this is arranged outside the software.
  - key: watches
    type: instances
    template: watch
    title:
      en: Client watches
      fr: Veilles clients
      de: Kunden-Beobachtungen
      ru: Наблюдения клиентов
      ar: مراقبة العملاء
    roles:
    - analyst
    - admin
  - key: briefing_setup
    type: instances
    template: weekly_briefing
    title:
      en: Weekly briefings setup
      fr: Briefings hebdomadaires
      de: Wochenbriefings
      ru: Еженедельные брифинги
      ar: الإحاطات الأسبوعية
    roles:
    - analyst
    - admin
  - key: narratives_review
    type: table
    title:
      en: Narratives to review
      fr: Récits à examiner
      de: Narrative zur Prüfung
      ru: Нарративы на проверку
      ar: الروايات للمراجعة
    source: collection:narratives
    roles:
    - analyst
    - admin
    export: true
    data:
      display: table
      fields:
      - key: title
        label: Title
      - key: organisation
        label: Client
      - key: review_status
        label: Status
        format: badge
      - key: risk_score
        label: Risk
        format: number
      - key: reach_estimate
        label: Reach
        format: number
      - key: last_seen
        label: Last seen
        format: date
      - key: alert_status
        label: Alert
        format: badge
      sort:
        field: risk_score
        dir: desc
      limit: 100
  - key: narrative_review
    type: form
    title:
      en: Review narrative
    collection: narratives
    edit: true
    nav: false
    roles:
    - analyst
    - admin
    fields:
    - title
    - summary
    - review_status
    - risk_score
    - risk_reasons
    - reach_estimate
    - reach_basis
    - timeline
    - sources
    - coordination_signals
    - video_notes
    - analyst_notes
    - client_visible
    - alert_status
    - draft_counter
    submit:
      label: Save review
      message: Review saved
      redirect: narratives_review
  - key: counter_review
    type: table
    title:
      en: Counter-messaging drafts
    source: collection:counter_options
    roles:
    - analyst
    - admin
    data:
      display: table
      fields:
      - key: narrative_title
        label: Narrative
      - key: tone
        label: Tone
      - key: channel
        label: Channel
      - key: client_visible
        label: Released
      - key: decision
        label: Decision
        format: badge
      limit: 100
  - key: counter_release
    type: form
    title:
      en: Release option to client
    collection: counter_options
    edit: true
    nav: false
    roles:
    - analyst
    - admin
    fields:
    - option_text
    - tone
    - channel
    - evidence
    - risk
    - client_visible
    submit:
      label: Save
      redirect: counter_review
  - key: briefings_review
    type: table
    title:
      en: Briefings to approve
    source: collection:briefings
    roles:
    - analyst
    - admin
    data:
      display: table
      fields:
      - key: title
        label: Title
      - key: organisation
        label: Client
      - key: status
        label: Status
        format: badge
      limit: 50
  - key: briefing_approve
    type: form
    title:
      en: Approve briefing
    collection: briefings
    edit: true
    nav: false
    roles:
    - analyst
    - admin
    fields:
    - title
    - body
    - status
    submit:
      label: Save
      redirect: briefings_review
  - key: my_narratives
    type: cards
    title:
      en: Narratives
      fr: Récits
      de: Narrative
      ru: Нарративы
      ar: الروايات
    source: collection:narratives
    roles:
    - client
    data:
      display: cards
      fields:
      - key: title
        label: Narrative
      - key: review_status
        label: Status
        format: badge
      - key: risk_score
        label: Risk score
        format: number
      - key: reach_estimate
        label: Reach estimate
        format: number
      - key: reach_basis
        label: Basis
      - key: first_seen
        label: First seen
        format: date
      - key: timeline
        label: Timeline
      - key: sources
        label: Sources
      - key: coordination_signals
        label: Coordination signals
      sort:
        field: risk_score
        dir: desc
      limit: 50
      empty:
        en: No narratives have been shared with you yet.
  - key: my_counter
    type: cards
    title:
      en: Counter-messaging
      fr: Contre-messages
      de: Gegenbotschaften
      ru: Контрсообщения
      ar: الرسائل المضادة
    source: collection:counter_options
    roles:
    - client
    data:
      display: cards
      fields:
      - key: narrative_title
        label: Narrative
      - key: option_text
        label: Option
      - key: tone
        label: Tone
      - key: channel
        label: Channel
      - key: risk
        label: Risk
      - key: decision
        label: Decision
        format: badge
      limit: 50
  - key: counter_decide
    type: form
    title:
      en: Your decision
    collection: counter_options
    edit: true
    nav: false
    roles:
    - client
    fields:
    - decision
    - client_comment
    submit:
      label: Send decision
      message: Thank you, your decision is recorded.
      redirect: my_counter
  - key: my_briefings
    type: cards
    title:
      en: Weekly briefings
      fr: Briefings hebdomadaires
      de: Wochenbriefings
      ru: Еженедельные брифинги
      ar: الإحاطات الأسبوعية
    source: collection:briefings
    roles:
    - client
    data:
      display: cards
      fields:
      - key: title
        label: Briefing
      - key: body
        label: Briefing
      limit: 30
  - key: account
    type: account
    title:
      en: Contract
    roles:
    - admin
  billing:
    modes:
    - subscription
    currency: gbp
    plans:
    - key: annual
      price: 50000
      interval: year
      label:
        en: Annual contract
      includes:
      - Unlimited client watches within the contract scope
      - Analyst-reviewed alerts
      - Weekly briefing
      - Counter-messaging drafts
      roles:
      - admin
  limits:
  - action: login
    per: ip
    max: 20
    window: hour
  extensions:
  - key: video_forensics
    description: 'Analysing video, including AI-generated or inauthentic video, is not available in the platform yet: agents
      cannot run forensic or deepfake detection and the run form accepts no video files. This version uses only the transcript,
      metadata and synthetic-media scores supplied by a licensed feed vendor, flags the narrative for manual analyst video
      checks, and never asserts that a video is fake. A video-analysis service would have to be integrated separately.'
  - key: licensed_social_feeds
    description: 'The licensed social data feed or official API relay is not connected yet: pick the vendor and have it POST
      posts to the app webhook /api/hooks/social_feed with the hook secret (or load them by CSV on the admin data page). Each
      vendor integration with its own API key needs its host added to egress and a credential. No social network is ever scraped.'
  - key: security_vetting
    description: Security vetting of staff for government and election clients is an organisational process outside the software.
      Limit the analyst role invitations accordingly.
  - key: ui_translations
    description: Page copy is written in English; titles of the main views are given in five languages. Full French, German,
      Russian and Arabic translations of the home page and field labels should be added in the studio. Arabic needs right-to-left
      layout review.
  - key: sms_push
    description: SMS, WhatsApp and push alerts are not available; alerts and briefings go by email only.
