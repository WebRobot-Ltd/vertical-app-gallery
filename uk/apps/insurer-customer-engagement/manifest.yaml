apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: policyhum
  displayName: Policyhum
  tagline:
    en: Agentic customer engagement for insurers and brokers.
  description:
    en: An assistant that answers policyholders' questions with references to their policy wording, takes first notification
      of loss, nudges on renewals and missing documents, and hands claims decisions, complaints and vulnerable customers to
      a human. Compliance can review samples against the FCA's conduct rules.
  langs:
  - en
  defaultLang: en
  timezone: Europe/London
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#12355b'
      accent: '#1f8a70'
      background: '#f6f8fb'
      foreground: '#16202c'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Policy
      color: primary
    - text: hum
      color: accent
  header:
    links:
    - label: How it works
      href: '#how'
    - label: Channels
      href: '#channels'
    cta:
      label: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: CX admin
      assignedBy: admin_emails
    - key: agent
      label: Service agent
      assignedBy: invite
    - key: compliance
      label: Compliance reviewer
      assignedBy: invite
    - key: user
      label: Policyholder
      assignedBy: signup
  limits:
  - action: chat
    per: user
    max: 60
    window: day
    roles:
    - user
  agents:
  - key: assistant
    role: main
    description: Answers policyholders from the policy wording, explains claims, hands sensitive matters to a human.
    profile:
      inline:
        display_name: Policyhum assistant
        crews:
        - id: assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the customer assistant of an insurer or broker. You talk with policyholders in plain, warm
            English.


            WHAT YOU DO

            - Answer questions about cover ONLY from the documents you find with search_documents (policy wordings, product
            summaries, claims procedures, FAQs) and from the customer''s own policies (read_policies, and the context below).
            Always cite the document title and the section or clause you used, e.g. (Home Policy Wording, clause 4.2). If
            the documents do not say, say so and offer a human; never guess about cover, limits or excess.

            - Explain how to make a claim from the claims procedure documents. To report a loss, send the customer to the
            form ''Report a claim'' (/v/fnol), where they enter the date, type of incident, description and photos.

            - Nudge gently: if a policy renews within 45 days, mention it; if a claim needs documents, say which.


            ALWAYS HAND OVER TO A HUMAN (call escalate, then tell the customer a colleague will contact them and what happens
            next) when the message is about: a claims decision (accepted, declined, settlement amount, dispute), a complaint
            or dissatisfaction with service, or a possibly vulnerable customer (bereavement, serious illness, financial difficulty,
            distress, difficulty understanding, domestic abuse). Do not argue, promise outcomes or give your opinion on the
            decision. In escalate give reason (claims_decision, complaint or vulnerable), a short neutral summary and the
            policy number if known.


            CONDUCT (FCA Consumer Duty, ICOBS, DISP): be clear, fair and not misleading; do not pressure; do not give personal
            advice on which product to buy; use plain language; if the customer seems to struggle to understand, simplify
            or offer a human. Never reveal other customers'' data. Never invent figures, dates or clauses.


            AT THE END of a conversation (the customer says thanks or the topic is closed) call log_contact once: reason (coverage,
            claim_howto, fnol, renewal, documents, complaint, other), deflected 1 if you fully resolved it without a human
            else 0, a one-sentence summary without personal data, date (today), and satisfaction 1-5 only if the customer
            gave a rating (you may ask once: ''How helpful was this, 1 to 5?'').


            Keep answers short: under 150 words unless the customer asks for detail.'
          mcp_servers: []
    goalTemplate: 'Today is {date}. Customer: {user}.

      Their policies (JSON lines): {policies}

      Conversation so far:

      {history}

      New message: {message}

      Answer in the language with ISO code {lang}.'
    context:
    - key: policies
      from: collection:policies
    appTools:
    - name: search_documents
      description: Search the insurer's policy wordings, product summaries, claims procedures and FAQs
      action: search
      collection: documents
      scope: all
    - name: read_policies
      description: Read the signed-in customer's own policies
      action: read
      collection: policies
      scope: user
    - name: escalate
      description: 'Hand the conversation to a human: claims decision, complaint or vulnerable customer'
      action: append
      collection: escalations
      scope: user
    - name: log_contact
      description: 'Record the finished conversation: reason, deflection, satisfaction'
      action: append
      collection: contacts
      scope: user
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.3
  data:
    collections:
    - name: documents
      ownedBy: shared
      searchable: true
      description: Policy wordings, product summaries, claims procedures and FAQs, kept by the CX admins on the data page
        (by hand or CSV)
      fields:
      - name: title
        type: text
        required: true
      - name: doc_type
        type: select
        required: true
        options:
        - wording
        - product_summary
        - claims_procedure
        - faq
      - name: product
        type: text
      - name: version
        type: text
      - name: content
        type: textarea
        required: true
    - name: policies
      ownedBy: user
      description: The policyholder's own policies
      fields:
      - name: policy_number
        type: text
        required: true
      - name: product
        type: text
        required: true
      - name: renewal_date
        type: date
        required: true
      - name: insured_item
        type: text
    - name: claims
      ownedBy: user
      retentionDays: 2555
      description: First notification of loss and claim status
      fields:
      - name: policy_number
        type: text
        required: true
      - name: incident_date
        type: date
        required: true
      - name: incident_type
        type: select
        required: true
        options:
        - theft
        - fire
        - water_damage
        - accident
        - storm
        - liability
        - other
      - name: description
        type: textarea
        required: true
      - name: photos
        type: file
        accept:
        - jpg
        - jpeg
        - png
        - pdf
        maxMb: 10
        multiple: true
        capture: true
      - name: status
        type: select
        default: new
        options:
        - new
        - documents_requested
        - in_review
        - decided
        - closed
      - name: documents_missing
        type: textarea
      - name: agent_email
        type: email
      - name: first_response_hours
        type: number
      access:
      - role: agent
        where:
          agent_email: '{user.email}'
        can:
        - read
        - write
      - role: compliance
    - name: escalations
      ownedBy: user
      description: Conversations handed to a human
      fields:
      - name: reason
        type: select
        required: true
        options:
        - claims_decision
        - complaint
        - vulnerable
      - name: summary
        type: textarea
      - name: policy_number
        type: text
      - name: status
        type: select
        default: open
        options:
        - open
        - in_progress
        - resolved
      - name: agent_email
        type: email
      access:
      - role: agent
        where:
          agent_email: '{user.email}'
        can:
        - read
        - write
      - role: compliance
    - name: contacts
      ownedBy: user
      retentionDays: 730
      description: One record per finished conversation, for dashboards and compliance sampling
      fields:
      - name: date
        type: date
      - name: reason
        type: select
        options:
        - coverage
        - claim_howto
        - fnol
        - renewal
        - documents
        - complaint
        - other
      - name: deflected
        type: number
      - name: satisfaction
        type: number
      - name: summary
        type: textarea
      access:
      - role: compliance
    - name: reviews
      ownedBy: user
      description: Compliance reviews of sampled conversations
      fields:
      - name: contact_date
        type: date
        required: true
      - name: contact_summary
        type: textarea
        required: true
      - name: rule
        type: select
        required: true
        options:
        - consumer_duty
        - icobs_clear_fair_not_misleading
        - vulnerable_customers
        - complaints_disp
        - other
      - name: outcome
        type: select
        required: true
        options:
        - compliant
        - minor_issue
        - breach
      - name: notes
        type: textarea
  views:
  - key: home
    type: page
    title: Policyhum
    nav: false
    sections:
    - type: hero
      layout: stack
      band: true
      eyebrow: For insurers and brokers
      title: Customer engagement that **answers, notifies and hands over** at the right moment.
      text: Policyholders get answers about their cover with references to their policy wording, report a claim in minutes,
        and are reminded about renewals and missing documents. Claims decisions, complaints and vulnerable customers always
        go to a person.
      actions:
      - label: Sign in
        href: /login
        style: primary
      - label: How it works
        href: '#how'
        style: ghost
    - type: steps
      id: how
      title: How it works
      items:
      - title: Upload your documents
        text: CX admins add policy wordings, product summaries, claims procedures and FAQs.
      - title: Customers ask
        text: The assistant answers with clause references and explains how to claim.
      - title: Claims and hand-overs
        text: First notification of loss is collected by form; sensitive matters go to the service agent's queue.
      - title: Review and measure
        text: Compliance samples conversations; dashboards show contacts, deflection, notification times and satisfaction.
    - type: cards
      id: channels
      title: Channels
      intro: 'Available now: web chat, email and push notifications in the insurer''s mobile app.'
      items:
      - title: Web and mobile app
        text: Chat, claim form with camera photos, push notifications.
      - title: Email
        text: Renewal reminders and claim status updates.
    - type: note
      content: Policyhum supports customer service and does not give regulated advice or decide claims.
  - key: chat
    type: chat
    title: Assistant
    source: agent:assistant
    examples:
    - What does my policy say about water damage?
    - How do I make a claim?
    - When does my policy renew?
    placeholder: Ask about your cover or a claim
    roles:
    - user
    - admin
  - key: fnol
    type: form
    title: Report a claim
    collection: claims
    fields:
    - policy_number
    - incident_date
    - incident_type
    - description
    - photos
    submit:
      label: Send claim notification
      message: Thank you. We have received your claim and will be in touch.
      redirect: my_claims
    roles:
    - user
  - key: my_claims
    type: table
    title: My claims
    source: collection:claims
    data:
      display: table
      fields:
      - key: policy_number
        label: Policy
      - key: incident_date
        label: Date
        format: date
      - key: incident_type
        label: Type
      - key: status
        label: Status
        format: badge
      - key: documents_missing
        label: Documents needed
      sort:
        field: incident_date
        dir: desc
    roles:
    - user
  - key: my_policy
    type: form
    title: Add a policy
    collection: policies
    submit:
      label: Save policy
      message: Policy saved.
      redirect: policies_list
    roles:
    - user
  - key: policies_list
    type: table
    title: My policies
    source: collection:policies
    data:
      display: table
      fields:
      - key: policy_number
        label: Policy
      - key: product
        label: Product
      - key: renewal_date
        label: Renewal
        format: date
    roles:
    - user
  - key: queue
    type: table
    title: Claims queue
    source: collection:claims
    export: true
    data:
      display: table
      fields:
      - key: policy_number
        label: Policy
      - key: incident_date
        label: Date
        format: date
      - key: incident_type
        label: Type
      - key: description
        label: Description
      - key: status
        label: Status
        format: badge
      - key: agent_email
        label: Assigned to
      - key: first_response_hours
        label: Hours to first response
        format: number
    roles:
    - agent
    - admin
  - key: handovers
    type: table
    title: Hand-overs
    source: collection:escalations
    data:
      display: table
      fields:
      - key: reason
        label: Reason
        format: badge
      - key: summary
        label: Summary
      - key: policy_number
        label: Policy
      - key: status
        label: Status
        format: badge
      - key: agent_email
        label: Assigned to
    roles:
    - agent
    - compliance
    - admin
  - key: samples
    type: table
    title: Conversations to review
    source: collection:contacts
    export: true
    data:
      display: table
      fields:
      - key: date
        label: Date
        format: date
      - key: reason
        label: Reason
        format: badge
      - key: summary
        label: Summary
      - key: satisfaction
        label: Satisfaction
        format: number
      sort:
        field: date
        dir: desc
      limit: 100
    roles:
    - compliance
    - admin
  - key: review_form
    type: form
    title: Record a review
    collection: reviews
    submit:
      label: Save review
      message: Review saved.
    roles:
    - compliance
    - admin
  - key: reviews_list
    type: table
    title: Reviews
    source: collection:reviews
    export: true
    data:
      display: table
      fields:
      - key: contact_date
        label: Date
        format: date
      - key: rule
        label: Rule
      - key: outcome
        label: Outcome
        format: badge
      - key: notes
        label: Notes
    roles:
    - compliance
    - admin
  - key: dashboard
    type: page
    title: Dashboards
    roles:
    - admin
    sections:
    - type: data
      title: Service at a glance
      source: collection:contacts
      display: kpi
      kpis:
      - label: Conversations
        agg: count
      - label: Deflection rate
        agg: avg
        field: deflected
        format: percent
      - label: Average satisfaction (1-5)
        agg: avg
        field: satisfaction
        format: number
    - type: data
      title: Contacts by reason
      source: collection:contacts
      display: chart
      chart: bar
      fields:
      - key: reason
        label: Reason
      - key: count
        label: Contacts
      groupBy:
        field: reason
        aggs: []
    - type: data
      title: Satisfaction by month
      source: collection:contacts
      display: chart
      chart: line
      fields:
      - key: date
        label: Month
      - key: sat
        label: Satisfaction
      groupBy:
        field: date
        bucket: month
        aggs:
        - key: sat
          agg: avg
          field: satisfaction
    - type: data
      title: Claim notifications and time to first response
      source: collection:claims
      display: chart
      chart: bar
      fields:
      - key: incident_date
        label: Month
      - key: count
        label: Claims
      - key: hours
        label: Avg hours to first response
      groupBy:
        field: incident_date
        bucket: month
        aggs:
        - key: hours
          agg: avg
          field: first_response_hours
  - key: account
    type: account
    title: Credits and plan
    roles:
    - user
    - admin
  triggers:
  - key: renewal_30
    'on':
      date:
        collection: policies
        field: renewal_date
        offsetDays: -30
        hour: 8
    notify:
      to: owner
      subject: Your {record.product} policy renews soon
      body: Your policy {record.policy_number} renews on {record.renewal_date}. Check your cover and ask our assistant if
        you have questions.
      link: chat
  - key: renewal_7
    'on':
      date:
        collection: policies
        field: renewal_date
        offsetDays: -7
        hour: 8
    notify:
      to: owner
      subject: Your policy renews in 7 days
      body: Policy {record.policy_number} renews on {record.renewal_date}. Contact us if anything has changed.
      link: chat
  - key: docs_needed
    'on':
      collection: claims
      op: update
      where:
        status: documents_requested
    notify:
      to: owner
      subject: Documents needed for your claim
      body: 'To move your claim forward we need: {record.documents_missing}. You can reply through the assistant.'
      link: my_claims
  - key: claim_in_review
    'on':
      collection: claims
      op: update
      where:
        status: in_review
    notify:
      to: owner
      subject: Your claim is being reviewed
      body: Your claim for policy {record.policy_number} is now being reviewed by our team.
      link: my_claims
  - key: claim_decided
    'on':
      collection: claims
      op: update
      where:
        status: decided
    notify:
      to: owner
      subject: An update on your claim
      body: There is an update on your claim for policy {record.policy_number}. Please open the app to read it.
      link: my_claims
  - key: new_claim
    'on':
      collection: claims
      op: insert
    notify:
      to: admins
      subject: New claim notification
      body: A new {record.incident_type} claim was reported for policy {record.policy_number}. Please assign it to a service
        agent.
      link: queue
  - key: new_handover
    'on':
      collection: escalations
      op: insert
    notify:
      to:
      - admins
      - role:agent
      subject: 'Customer hand-over: {record.reason}'
      body: 'A conversation needs a person: {record.summary}'
      link: handovers
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 10
    metering:
      creditEur: 0.02
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:assistant:
        estimate: 2
        metered: true
    packs:
    - key: conversations_1000
      credits: 1000
      price: 20
      label: 1,000 conversation credits
    plans:
    - key: platform
      price: 499
      interval: month
      label: Policyhum platform
      credits: 2000
      creditsReset: monthly
      roles:
      - admin
      includes:
      - Assistant, claim form, queues, compliance review and dashboards
      - 2,000 conversation credits per month
  mobile:
    appId: com.policyhum.app
    capabilities:
    - name: camera
      reason:
        en: To photograph damage when reporting a claim
    - name: push
      reason:
        en: Renewal reminders and claim updates
    - name: microphone
      reason:
        en: To talk to the assistant by voice
  extensions:
  - key: whatsapp_sms
    description: WhatsApp and SMS channels are not available yet. Customers are reached by email and by push notifications
      in the mobile app.
  - key: policy_admin_claims_integration
    description: Connection to the insurer's policy administration and claims systems is not available yet. Policies are entered
      by the policyholder and claims are handled in the claims queue; documents are kept by admins on the data page.
  - key: fca_sampling
    description: Compliance reviews are done by people on sampled conversations. There is no automatic scoring against the
      FCA's conduct rules.
