  - key: account
    type: account
    title: Plan & Stripe
    roles:
    - user
  slots:
  - key: pricing
    description: Revenue (included quantity, tiers) and AI cost of one event
    timeoutMs: 2000
    example:
      args:
        quantity: 1
        used_before: 999
        unit_price: 0.5
        included_qty: 1000
        tiers: []
        tokens_in: 5000
        tokens_out: 800
        tool_calls: 3
        input_per_mtok: 3
        output_per_mtok: 15
        tool_call_cost: 0.002
      userId: u1
    code: "def main(input):\n    a = input.get('args') or {}\n    def f(k):\n        try:\n            return float(a.get(k)\
      \ or 0)\n        except Exception:\n            return 0.0\n    qty = f('quantity')\n    used = f('used_before')\n \
      \   price = f('unit_price')\n    inc = f('included_qty')\n    tiers = a.get('tiers') or []\n    start = max(used, inc)\n\
      \    end = used + qty\n    revenue = 0.0\n    if end > start:\n        if tiers:\n            lo = 0.0\n           \
      \ for t in tiers:\n                up = t.get('up_to')\n                p = float(t.get('price') or 0)\n           \
      \     hi = float(up) if up is not None else float('inf')\n                s = max(start, lo)\n                e = min(end,\
      \ hi)\n                if e > s:\n                    revenue += (e - s) * p\n                lo = hi\n        else:\n\
      \            revenue = (end - start) * price\n    cost = f('tokens_in') * f('input_per_mtok') / 1e6 + f('tokens_out')\
      \ * f('output_per_mtok') / 1e6 + f('tool_calls') * f('tool_call_cost')\n    return {'revenue': round(revenue, 6), 'ai_cost':\
      \ round(cost, 6), 'margin': round(revenue - cost, 6), 'billable_qty': max(0.0, end - start)}\n"
  triggers:
  - key: usage_events
    description: Events from the SDK saved as records
    'on':
      webhook: true
    write:
      collection: usage_events
      fields:
        event_id: event_id
        customer_ref: customer
        agent: agent
        unit: unit
        quantity: quantity
        outcome: outcome
        model: model
        tokens_in: tokens_in
        tokens_out: tokens_out
        tool_calls: tool_calls
        timestamp: timestamp
      keyBy: event_id
  - key: alert_email
    description: Email the owner when an alert is raised
    'on':
      collection: alerts
      op: insert
    notify:
      to: owner
      subject: 'Meterwise alert: {record.kind} {record.customer_ref}'
      body: '{record.message}


        Severity: {record.severity}'
      link: alerts_table
  - key: invoice_ready
    description: Email when an invoice is ready
    'on':
      collection: invoices
      op: any
      where:
        status: ready
    notify:
      to:
      - owner
      subject: 'Invoice ready: {record.customer_ref} {record.period}'
      body: The invoice for {record.customer_ref}, period {record.period}, amount {record.amount} {record.currency}, is ready
        to review.
      link: invoices_table
  - key: customer_invoice
    description: Tell the end customer that the invoice is sent
    'on':
      collection: invoices
      op: any
      where:
        status: sent
    notify:
      to:
      - record.customer_email
      subject: Your invoice for {record.period}
      body: Your invoice for {record.period} ({record.amount} {record.currency}) is available in your usage portal.
      link: portal
  - key: price_decided
    description: Tell the owner a price change was approved
    'on':
      approval: price_change
      decision: approved
    notify:
      to: owner
      subject: Price changes approved
      body: The proposed price changes were approved. Update the price models and notify your customers.
      link: suggestions
  egress:
    hosts:
    - api.stripe.com
    notes: Stripe API called with the user's own restricted key to read customers and draft invoices in their account.
  notifications:
    emailOnRunDone: true
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 200
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:analyst:
        estimate: 10
        metered: true
    packs:
    - key: topup
      credits: 1000
      price: 10
      label: 1,000 credits
    plans:
    - key: platform
      price: 199
      interval: month
      label: Meterwise platform (monthly minimum)
      credits: 2000
      creditsReset: monthly
      includes:
      - Metering and invoicing
      - Margin analyst
      - End-customer portal
  extensions:
  - key: revenue_percentage
    description: Pricing is a percentage of the revenue billed through Meterwise with a monthly minimum (the 199 EUR plan).
      The percentage fee on billed revenue is not expressible in the manifest and must be configured by WebRobot platform
      billing.
  - key: per_tenant_api_keys
    description: Events arrive on one webhook protected by the app's hook secret. Per-company API keys that attribute each
      event to its company, and the SDK packages themselves, are not available yet.
  - key: stripe_oauth_and_form_bodies
    description: Stripe is connected with a restricted API key, not OAuth (Connect). Stripe's write endpoints expect form-encoded
      bodies, which the http tool does not send yet; invoices are recorded in Meterwise and drafted in Stripe only when supported.
  - key: team_roles
    description: Finance and engineering colleagues are team members listed on the workspace; separate finance/engineering
      roles per company, and a finance-only approver, are not available. Price changes are approved by the account that ran
      the review.
