apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: statutia
  displayName: Statutia
  tagline: Source-grounded UK tax research and drafting for advisers.
  description: Statutia answers UK tax questions with citations to the exact section or HMRC manual paragraph, quotes the
    text, and says when the sources do not settle the point. It drafts letters, memos and HMRC responses from your templates,
    with manager approval before export, and alerts you when sources cited in a client file change.
  langs:
  - en
  defaultLang: en
  timezone: Europe/London
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f2a44'
      accent: '#8b1e3f'
      background: '#f7f5f0'
      foreground: '#1a1a1a'
    fonts:
      body: Inter
      display: Source Serif 4
    wordmark:
    - text: Stat
      color: primary
    - text: utia
      color: accent
    width: wide
  header:
    links:
    - label: How it works
      href: '#how'
    - label: Sources
      href: '#sources'
    - label: Pricing
      href: '#pricing'
    cta:
      label: Start free trial
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Firm admin
      assignedBy: admin_emails
    - key: partner
      label: Partner
      assignedBy: invite
    - key: manager
      label: Manager
      assignedBy: invite
    - key: junior
      label: Junior
      assignedBy: signup
  limits:
  - action: run
    per: user
    max: 60
    window: day
  egress:
    hosts:
    - www.legislation.gov.uk
    - www.gov.uk
    notes: 'legislation.gov.uk: UK legislation under the Open Government Licence v3.0. GOV.UK search and content APIs: HMRC
      internal manuals published on gov.uk under the Open Government Licence v3.0. Used for read-only lookups with attribution.'
  agents:
  - key: researcher
    role: main
    when: task == 'research'
    description: Answers a research question with exact citations, quoted text and a clear statement of what the sources do
      not settle.
    profile:
      inline:
        display_name: Statutia researcher
        crews:
        - id: researcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 24
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are a UK tax research assistant for advisers in accounting and tax firms. You answer ONLY from
            sources you have just retrieved with your tools: legislation.gov.uk (leg_search, leg_fetch) and HMRC internal
            manuals on gov.uk (hmrc_search, hmrc_manual). Never quote or cite from memory: fetch the provision or manual page
            first, then quote it verbatim. Call leg_fetch with a path such as /ukpga/2007/3/section/24/data.xml (add a date
            segment for a point-in-time version) and hmrc_manual with a path such as /hmrc-internal-manuals/capital-gains-manual/cg15250.
            Check whether a provision has been amended, repealed or is not yet in force and say so; note the version date
            you read.


            Before answering, call house_memos to look for the firm''s past memos on the topic and follow the house view when
            one exists (cite the memo title and say it is a firm view, not law).


            Report structure, starting with a level-1 title "# <Tax> — <question in under 8 words>":

            ## Short answer (2-4 sentences, with a confidence statement: settled / arguable / not settled by the sources)

            ## Authorities (for each: exact citation such as ''Income Tax (Trading and Other Income) Act 2005, s 34(1)'' or
            ''HMRC CG15250, para 2'', a link, and the quoted text in a blockquote)

            ## Application to the facts (apply the quoted text to the facts given; label assumptions)

            ## House view (only if a firm memo applies)

            ## Where the sources do not settle the point (always present; write ''None identified'' only if true; list missing
            facts, case law not covered by your sources, and HMRC practice versus law)

            ## Sources checked (list with version or retrieval date)

            The knowledge base covers legislation and HMRC manuals only: for case law, tribunal decisions or non-HMRC guidance
            say you have no source and recommend checking. Never invent section numbers, rates or figures. This is research
            support for a qualified adviser, not advice to the client.


            When a client file id is given, call record_cited_source once per authority you relied on (source_type legislation
            or manual, ref, url, title, client_file, members copied from the file). At the end call log_research once with
            the date, a short question, the tax, kind ''research'', the client file if any, and your honest estimate of minutes
            an adviser would have needed to research this by hand (usually 20-120).'
          mcp_servers: []
    context:
    - key: file_facts
      from: collection:client_files.facts
    - key: file_members
      from: collection:client_files.members
    goalTemplate: 'Research question: {question}

      Tax: {tax_label}

      Client type: {client_type_label}

      {?period}Period: {period}{/period}

      {?facts}Facts given: {facts}{/facts}

      {?client_file}Client file id: {client_file}

      File facts: {file_facts}

      File team emails: {file_members}{/client_file}

      Today is {date}. Write the answer in the language with ISO code {lang}.'
    output: markdown
    limits:
      maxTurns: 24
      maxBudgetUsd: 1.0
    appTools:
    - name: leg_search
      description: 'Search legislation.gov.uk by title (query: title=<words>&type=ukpga). Returns an Atom feed of matching
        legislation.'
      action: http
      http:
        method: GET
        url: https://www.legislation.gov.uk/all/data.feed
        attribution: Contains public sector information licensed under the Open Government Licence v3.0 (legislation.gov.uk)
    - name: leg_fetch
      description: Fetch a provision or contents page from legislation.gov.uk by path, e.g. /ukpga/2007/3/section/24/data.xml
      action: http
      http:
        method: GET
        url: https://www.legislation.gov.uk
        allowPath: true
        attribution: Contains public sector information licensed under the Open Government Licence v3.0 (legislation.gov.uk)
    - name: hmrc_search
      description: 'Search HMRC internal manual sections on GOV.UK (query: q=<words>&filter_format=hmrc_manual_section&count=10).'
      action: http
      http:
        method: GET
        url: https://www.gov.uk/api/search.json
        attribution: Contains public sector information licensed under the Open Government Licence v3.0 (GOV.UK / HMRC)
    - name: hmrc_manual
      description: Fetch one HMRC manual page from the GOV.UK content API by path, e.g. /hmrc-internal-manuals/capital-gains-manual/cg15250
      action: http
      http:
        method: GET
        url: https://www.gov.uk/api/content
        allowPath: true
        attribution: Contains public sector information licensed under the Open Government Licence v3.0 (GOV.UK / HMRC)
    - name: house_memos
      description: Search the firm's past memos (house views) by topic
      action: search
      collection: house_memos
      scope: all
    - name: record_cited_source
      description: Save an authority cited in a client file so changes to it raise an alert
      action: append
      collection: file_sources
      scope: user
    - name: log_research
      description: Log a finished research task for the dashboards
      action: append
      collection: research_log
      scope: user
  - key: drafter
    role: main
    when: task == 'draft'
    description: Drafts an advice letter, technical memo or HMRC response from the firm's templates and sends it for manager
      approval.
    profile:
      inline:
        display_name: Statutia drafter
        crews:
        - id: drafter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 28
          max_budget_usd: 1.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You draft UK tax documents (advice letters, technical memos, responses to HMRC enquiries) for review
            by a manager. First call doc_templates and use the firm''s template for the requested document type: keep its
            structure, headings and tone, and fill it in. Then ground every technical statement in sources you have retrieved
            yourself with leg_fetch / hmrc_manual (and leg_search / hmrc_search to find them); cite the exact section or manual
            paragraph inline and quote key wording verbatim. Check house_memos and follow the firm''s house view where one
            exists. Never invent figures, dates, references or facts: put [TO CONFIRM: …] where information is missing, and
            state plainly in the draft''s cover note where the sources do not settle a point. The draft is never final: it
            is unsigned and marked DRAFT — SUBJECT TO MANAGER APPROVAL.


            Output the full draft starting with a level-1 title "# <Document type> — <client file or subject>", then the document,
            then a short ## Reviewer notes section (assumptions, open points, authorities used). Then call save_draft with
            client_file, doc_type, title, body (the whole document), status ''pending_review'' and members (the file''s team
            emails). Then call request_manager_review with the draft title and document type, and stop: the document can be
            exported only after a manager approves it. When a client file id is given, call record_cited_source for each authority
            relied on, and finally log_research with kind ''draft'' and your estimate of minutes saved versus drafting by
            hand.'
          mcp_servers: []
    context:
    - key: file_facts
      from: collection:client_files.facts
    - key: file_members
      from: collection:client_files.members
    goalTemplate: 'Draft a {doc_type_label}.

      Instructions: {question}

      Tax: {tax_label}

      Client type: {client_type_label}

      {?period}Period: {period}{/period}

      {?facts}Facts given: {facts}{/facts}

      {?client_file}Client file id: {client_file}

      File facts: {file_facts}

      File team emails: {file_members}{/client_file}

      Document type key: {doc_type}

      Today is {date}. Write in the language with ISO code {lang}.'
    awaits:
    - manager_review
    output: markdown
    limits:
      maxTurns: 28
      maxBudgetUsd: 1.2
    appTools:
    - name: leg_search
      description: 'Search legislation.gov.uk by title (query: title=<words>&type=ukpga). Returns an Atom feed of matching
        legislation.'
      action: http
      http:
        method: GET
        url: https://www.legislation.gov.uk/all/data.feed
        attribution: Contains public sector information licensed under the Open Government Licence v3.0 (legislation.gov.uk)
    - name: leg_fetch
      description: Fetch a provision or contents page from legislation.gov.uk by path, e.g. /ukpga/2007/3/section/24/data.xml
      action: http
      http:
        method: GET
        url: https://www.legislation.gov.uk
        allowPath: true
        attribution: Contains public sector information licensed under the Open Government Licence v3.0 (legislation.gov.uk)
    - name: hmrc_search
      description: 'Search HMRC internal manual sections on GOV.UK (query: q=<words>&filter_format=hmrc_manual_section&count=10).'
      action: http
      http:
        method: GET
        url: https://www.gov.uk/api/search.json
        attribution: Contains public sector information licensed under the Open Government Licence v3.0 (GOV.UK / HMRC)
    - name: hmrc_manual
      description: Fetch one HMRC manual page from the GOV.UK content API by path, e.g. /hmrc-internal-manuals/capital-gains-manual/cg15250
      action: http
      http:
        method: GET
        url: https://www.gov.uk/api/content
        allowPath: true
        attribution: Contains public sector information licensed under the Open Government Licence v3.0 (GOV.UK / HMRC)
    - name: house_memos
      description: Search the firm's past memos (house views) by topic
      action: search
      collection: house_memos
      scope: all
    - name: doc_templates
      description: Read the firm's document templates (advice letter, technical memo, HMRC response)
      action: read
      collection: doc_templates
      scope: all
    - name: save_draft
      description: Save the draft for review
      action: append
      collection: drafts
      scope: user
    - name: record_cited_source
      description: Save an authority cited in a client file so changes to it raise an alert
      action: append
      collection: file_sources
      scope: user
    - name: log_research
      description: Log a finished research task for the dashboards
      action: append
      collection: research_log
      scope: user
  - key: chat_assistant
    role: helper
    description: Conversational research assistant with the same source rules as the researcher.
    profile:
      inline:
        display_name: Statutia assistant
        chat_mode: true
        crews:
        - id: chat_assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 16
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You are Statutia, a UK tax research assistant for advisers, in a chat. Answer only from sources you
            retrieve in this conversation with leg_search / leg_fetch (legislation.gov.uk) and hmrc_search / hmrc_manual (HMRC
            internal manuals). Cite the exact section or manual paragraph, show the quoted text verbatim in a blockquote with
            a link, and mention the version or date you read. Never cite from memory or invent section numbers or figures.
            Check house_memos and follow the firm's house view when one exists, labelling it as a firm view. If the sources
            do not settle the point, or the question needs case law or facts you do not have, say so plainly and ask for the
            missing facts. Keep answers short and structured; offer to run a full research report or a draft from the form.
            You support a qualified adviser and do not give final advice to clients. After a substantive answer call log_research
            (kind 'chat', your estimate of minutes saved).
          mcp_servers: []
    goalTemplate: 'Conversation so far:

      {history}


      New message from {user}: {message}

      Today is {date}. Reply in the language with ISO code {lang}.'
    output: markdown
    limits:
      maxTurns: 16
      maxBudgetUsd: 0.6
    appTools:
    - name: leg_search
      description: 'Search legislation.gov.uk by title (query: title=<words>&type=ukpga). Returns an Atom feed of matching
        legislation.'
      action: http
      http:
        method: GET
        url: https://www.legislation.gov.uk/all/data.feed
        attribution: Contains public sector information licensed under the Open Government Licence v3.0 (legislation.gov.uk)
    - name: leg_fetch
      description: Fetch a provision or contents page from legislation.gov.uk by path, e.g. /ukpga/2007/3/section/24/data.xml
      action: http
      http:
        method: GET
        url: https://www.legislation.gov.uk
        allowPath: true
        attribution: Contains public sector information licensed under the Open Government Licence v3.0 (legislation.gov.uk)
    - name: hmrc_search
      description: 'Search HMRC internal manual sections on GOV.UK (query: q=<words>&filter_format=hmrc_manual_section&count=10).'
      action: http
      http:
        method: GET
        url: https://www.gov.uk/api/search.json
        attribution: Contains public sector information licensed under the Open Government Licence v3.0 (GOV.UK / HMRC)
    - name: hmrc_manual
      description: Fetch one HMRC manual page from the GOV.UK content API by path, e.g. /hmrc-internal-manuals/capital-gains-manual/cg15250
      action: http
      http:
        method: GET
        url: https://www.gov.uk/api/content
        allowPath: true
        attribution: Contains public sector information licensed under the Open Government Licence v3.0 (GOV.UK / HMRC)
    - name: house_memos
      description: Search the firm's past memos (house views) by topic
      action: search
      collection: house_memos
      scope: all
    - name: log_research
      description: Log a finished research task for the dashboards
      action: append
      collection: research_log
      scope: user
  - key: finaliser
    role: helper
    description: Marks a draft approved after the manager's decision.
    profile:
      inline:
        display_name: Statutia finaliser
        crews:
        - id: finaliser
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You record a manager''s decision on a draft. Use find_draft to locate the draft the approval event
            refers to (match its title and document type) and then call update_draft to set its status to the decision given
            (approved or rejected). Change nothing else. Reply with one line: ''# Draft <title> <status>''.'
    goalTemplate: 'The approval manager_review was decided. Event: {event}

      Set the matching draft''s status accordingly.'
    output: markdown
    limits:
      maxTurns: 6
      maxBudgetUsd: 0.2
    appTools:
    - name: find_draft
      description: Read the user's drafts to find the one under review
      action: read
      collection: drafts
      scope: user
    - name: update_draft
      description: Change the status of a draft
      action: write
      collection: drafts
      scope: user
  - key: monitor
    role: scheduled
    description: 'Weekly: checks the knowledge base sources for changes and reports what changed.'
    profile:
      inline:
        display_name: Statutia source monitor
        crews:
        - id: monitor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 2.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the weekly source monitor for a UK tax research knowledge base: UK legislation on legislation.gov.uk
            and the HMRC internal manuals on gov.uk, both under the Open Government Licence. First call previous_changes to
            see when you last reported. Then find what changed since: for legislation use leg_fetch on the Atom feeds (e.g.
            /changes/affected/ukpga/2007/3/data.feed for an Act, or recently updated items in /all/data.feed) for the core
            tax statutes (ITA 2007, ITTOIA 2005, ITEPA 2003, CTA 2009, CTA 2010, TCGA 1992, IHTA 1984, VATA 1994, FA 2003,
            TMA 1970, the latest Finance Acts and key SIs); for HMRC manuals use hmrc_search with filter_format=hmrc_manual_section
            and order=-public_timestamp, and hmrc_manual (public_updated_at and change_history). Report only what you actually
            retrieved. Output starting with "# Source changes — week of <date>", then ## Legislation changed (citation, what
            changed, effective date, link), ## HMRC manuals updated (manual and paragraph, summary of the change, link), ##
            Why it may matter (one line each for the commonly affected taxes), ## Checked, no change (the list of sources
            checked). If nothing changed write ''# No source changes — week of <date>'' and the checked list. Never guess
            a change.'
          mcp_servers: []
    goalTemplate: Run the weekly source check. Today is {date}. Write in English.
    output: markdown
    limits:
      maxTurns: 40
      maxBudgetUsd: 2.0
    writesTo:
      collection: source_changes
      parse: whole
    appTools:
    - name: leg_search
      description: 'Search legislation.gov.uk by title (query: title=<words>&type=ukpga). Returns an Atom feed of matching
        legislation.'
      action: http
      http:
        method: GET
        url: https://www.legislation.gov.uk/all/data.feed
        attribution: Contains public sector information licensed under the Open Government Licence v3.0 (legislation.gov.uk)
    - name: leg_fetch
      description: Fetch a provision or contents page from legislation.gov.uk by path, e.g. /ukpga/2007/3/section/24/data.xml
      action: http
      http:
        method: GET
        url: https://www.legislation.gov.uk
        allowPath: true
        attribution: Contains public sector information licensed under the Open Government Licence v3.0 (legislation.gov.uk)
    - name: hmrc_search
      description: 'Search HMRC internal manual sections on GOV.UK (query: q=<words>&filter_format=hmrc_manual_section&count=10).'
      action: http
      http:
        method: GET
        url: https://www.gov.uk/api/search.json
        attribution: Contains public sector information licensed under the Open Government Licence v3.0 (GOV.UK / HMRC)
    - name: hmrc_manual
      description: Fetch one HMRC manual page from the GOV.UK content API by path, e.g. /hmrc-internal-manuals/capital-gains-manual/cg15250
      action: http
      http:
        method: GET
        url: https://www.gov.uk/api/content
        allowPath: true
        attribution: Contains public sector information licensed under the Open Government Licence v3.0 (GOV.UK / HMRC)
    - name: previous_changes
      description: Read the previous weekly change reports
      action: read
      collection: source_changes
      scope: all
  - key: file_watcher
    role: helper
    description: 'Weekly, for one client file: re-reads the sources cited in it and reports what changed.'
    memory: instance
    writesTo:
      collection: file_alerts
      parse: whole
    profile:
      inline:
        display_name: Statutia client file watcher
        crews:
        - id: file_watcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 24
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You watch the legislation and HMRC manual paragraphs cited in ONE client file. Call cited_sources
            and keep the rows whose client_file matches the file id you are given; add any extra sources the user listed.
            Re-fetch each with leg_fetch (legislation.gov.uk, check amendments, repeals, commencement and the latest version
            date) or hmrc_manual (public_updated_at, change_history, text). Your memory holds what you saw last time (version
            dates and a one-line digest of the text): compare and report only real differences, quoting the changed wording.
            Output starting with "# <Client file> — sources changed <date>" when something changed, with one ## section per
            changed source (citation, link, what changed, effect on the file''s advice to re-check). If nothing changed output
            exactly ''# No changes in cited sources'' and one line saying how many sources were checked. At the end call remember
            once with the current version date and digest of every source (it replaces the old memory). Never invent a change.'
          mcp_servers: []
    output: markdown
    limits:
      maxTurns: 24
      maxBudgetUsd: 0.8
    appTools:
    - name: leg_fetch
      description: Fetch a provision or contents page from legislation.gov.uk by path, e.g. /ukpga/2007/3/section/24/data.xml
      action: http
      http:
        method: GET
        url: https://www.legislation.gov.uk
        allowPath: true
        attribution: Contains public sector information licensed under the Open Government Licence v3.0 (legislation.gov.uk)
    - name: hmrc_manual
      description: Fetch one HMRC manual page from the GOV.UK content API by path, e.g. /hmrc-internal-manuals/capital-gains-manual/cg15250
      action: http
      http:
        method: GET
        url: https://www.gov.uk/api/content
        allowPath: true
        attribution: Contains public sector information licensed under the Open Government Licence v3.0 (GOV.UK / HMRC)
    - name: cited_sources
      description: Read the authorities cited in the user's client files
      action: read
      collection: file_sources
      scope: user
  inputForm:
    title: New research or draft
    fields:
    - name: task
      type: select
      required: true
      label: What do you need?
      default: research
      options:
      - value: research
        label: Research report
      - value: draft
        label: Draft a document
    - name: question
      type: textarea
      required: true
      maxLength: 2000
      label: Question or drafting instructions
      help: e.g. Does the trading allowance apply where the client also receives rent?
    - name: tax
      type: select
      required: true
      label: Tax
      options:
      - value: income_tax
        label: Income tax
      - value: corporation_tax
        label: Corporation tax
      - value: cgt
        label: Capital gains tax
      - value: iht
        label: Inheritance tax
      - value: vat
        label: VAT
      - value: paye_ni
        label: PAYE and National Insurance
      - value: sdlt
        label: Stamp taxes
      - value: other
        label: Other
    - name: client_type
      type: select
      required: true
      label: Client type
      options:
      - value: individual
        label: Individual
      - value: sole_trader
        label: Sole trader
      - value: partnership
        label: Partnership
      - value: company
        label: Company
      - value: trust
        label: Trust
      - value: estate
        label: Estate
      - value: charity
        label: Charity
    - name: period
      type: text
      label: Period or tax year
      help: e.g. 2025/26 or year ended 31 March 2026
    - name: facts
      type: textarea
      maxLength: 3000
      label: Facts
    - name: client_file
      type: select
      optionsFrom: collection:client_files
      label: Client file (optional)
      help: Links the work to a file and its team
    - name: doc_type
      type: select
      label: Document type
      visibleWhen: task == 'draft'
      options:
      - value: advice_letter
        label: Advice letter
      - value: technical_memo
        label: Technical memo
      - value: hmrc_response
        label: Response to an HMRC enquiry
  data:
    collections:
    - name: client_files
