      - role: manager
        where:
          members: '{user.email}'
        can:
        - read
        - write
      - role: junior
        where:
          members: '{user.email}'
        can:
        - read
    - name: file_sources
      description: Authorities cited in each client file, watched for changes
      ownedBy: user
      fields:
      - name: client_file
        type: text
        label: Client file
      - name: source_type
        type: select
        label: Type
        options:
        - legislation
        - manual
      - name: ref
        type: text
        label: Citation
      - name: url
        type: url
        label: Link
      - name: title
        type: text
        label: Title
      - name: members
