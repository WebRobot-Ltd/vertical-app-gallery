  approvals:
  - key: manager_review
    title: Manager review of draft
    description: A manager must approve every draft before it can be exported.
    role: manager
    decidedBy: role
    fields:
    - title
    - doc_type
  templates:
  - key: file_watch
    title: Client file watch
    description: Every week, re-checks the legislation and manual paragraphs cited in a client file and emails you what changed.
    agent: file_watcher
    params:
    - name: file
      type: select
      required: true
      optionsFrom: collection:client_files
      label: Client file
    - name: extra_sources
      type: textarea
      label: Extra sources to watch (optional)
      help: Section references or gov.uk manual links
    goal: 'Watch client file id {file} ({instance}). {?extra_sources}Also watch: {extra_sources}{/extra_sources} Today is
      {date}. Write in English.'
    schedule:
      cron: 0 6 * * 1
      userCanChange: true
    maxPerUser: 50
    cost:
      perRun: 3
    deliver:
      to: owner
      subject: 'Statutia alert: {title}'
      onlyIfNew: true
  triggers:
  - key: draft_pending
    description: Tell the managers a draft awaits review
    'on':
      collection: drafts
      op: insert
      where:
        status: pending_review
    notify:
      to: role:manager
      subject: 'Draft awaiting your review: {record.title}'
      body: A {record.doc_type} for {record.client_file} is waiting for manager approval in Statutia. It cannot be exported
        until it is approved.
      link: reviews
  - key: draft_decided
    description: Record the manager's decision on the draft
    'on':
      approval: manager_review
      decision: any
    start:
      agent: finaliser
    goal: 'The approval manager_review was decided. Event: {event}. Set the matching draft''s status to approved or rejected
      accordingly.'
  - key: draft_approved_mail
    'on':
      approval: manager_review
      decision: approved
    notify:
      to: owner
      subject: Your draft was approved
      body: A manager approved your draft in Statutia. You can now export it.
      link: approved
  - key: draft_rejected_mail
    'on':
      approval: manager_review
      decision: rejected
    notify:
      to: owner
      subject: Your draft needs changes
      body: A manager did not approve your draft in Statutia. Open it, revise and resubmit.
      link: drafts
  schedules:
  - agent: monitor
    cron: 0 5 * * 1
    action: run
    owner: app
    goal: Run the weekly source check and report what changed in UK tax legislation and HMRC manuals.
    deliver:
      to: role:partner
      subject: Statutia weekly source changes
      onlyIfNew: true
  views:
  - key: home
    type: page
    title: Statutia
    nav: false
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow: For tax advisers and accounting firms
      title: UK tax research you can **cite**, and drafts a manager has signed off.
      text: Statutia answers from legislation.gov.uk and the HMRC internal manuals, cites the exact section or paragraph,
        shows the quoted text, and tells you when the sources do not settle the point.
      actions:
      - label: Start free trial
        href: /login
        style: primary
      - label: How it works
        href: '#how'
        style: ghost
      note: Research support for qualified advisers, not advice to clients.
      aside: '<div style="padding:16px;border:1px solid #ddd;border-radius:12px;background:#fff"><strong>ITTOIA 2005, s 783A(1)</strong><blockquote
        style="margin:8px 0;color:#444">quoted text from the section as retrieved</blockquote><em>Sources do not settle: HMRC
        practice on mixed trading and property income. Check the facts.</em></div>'
    - type: steps
      id: how
      title: How it works
      items:
      - title: Ask
        text: Chat, or fill the research form with the tax, client type, facts and period.
        badge: 💬
      - title: Read the authorities
        text: Exact citations, verbatim quotes, version dates, and the firm's house view from your past memos.
        badge: 📖
      - title: Draft and review
        text: Letters, memos and HMRC responses from your templates. A manager approves before anything is exported.
        badge: ✍️
      - title: Stay current
        text: A weekly report of changes, and email alerts when sources cited in a client file change.
        badge: 🔔
    - type: cards
      id: sources
      title: Knowledge base
      items:
      - title: UK legislation
        text: legislation.gov.uk, with point-in-time versions and amendment checks. Open Government Licence v3.0.
      - title: HMRC internal manuals
        text: Published on gov.uk, cited by manual and paragraph. Open Government Licence v3.0.
      - title: Your house views
        text: Your firm's past memos are searched so answers follow your positions, always labelled as firm views.
    - type: cards
      id: pricing
      title: Pricing
      items:
      - title: Per seat, per month
        text: Free trial with starter credits. Then a monthly subscription for each seat, billed through Stripe.
    - type: note
      content: Statutia supports qualified advisers. Contains public sector information licensed under the Open Government
        Licence v3.0.
  - key: new
    type: new_run
    title: Research / Draft
    roles:
    - admin
    - partner
    - manager
    - junior
  - key: assistant
    type: chat
    title: Ask Statutia
    source: agent:chat_assistant
    examples:
    - What does the legislation say about the trading allowance for a sole trader with rental income?
    - Which HMRC manual covers the loan relationship late-paid interest rules?
    - Is a gift with reservation caught if the donor pays a market rent?
    placeholder: Ask a UK tax question…
    roles:
    - admin
    - partner
    - manager
    - junior
  - key: history
    type: history
    title: My work
    source: run
    roles:
    - admin
    - partner
    - manager
    - junior
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: files
    type: table
    title: Client files
    source: collection:client_files
    data:
      display: table
      fields:
      - key: name
        label: File
      - key: client_type
        label: Client type
        format: badge
      - key: members
        label: Team
      limit: 200
      empty: No client files yet.
    roles:
    - admin
    - partner
    - manager
    - junior
  - key: new_file
    type: form
    title: New client file
    collection: client_files
    fields:
    - name
    - client_type
    - facts
    - members
    submit:
      label: Create file
      message: Client file created. Only the team you listed can see it.
      redirect: files
    edit: true
    roles:
    - admin
    - partner
    - manager
    - junior
  - key: drafts
    type: table
    title: Drafts
    source: collection:drafts
    data:
      display: table
      fields:
      - key: title
        label: Title
      - key: doc_type
        label: Type
      - key: client_file
        label: File
      - key: status
        label: Status
        format: badge
      limit: 200
      empty: No drafts yet.
    roles:
    - admin
    - partner
    - manager
    - junior
  - key: reviews
    type: approvals
    title: Drafts to approve
    approvals:
    - manager_review
    roles:
    - manager
    - admin
  - key: approved
    type: table
    title: Approved drafts (export)
    source: collection:drafts
    export: true
    data:
      display: table
      fields:
      - key: title
        label: Title
      - key: doc_type
        label: Type
      - key: client_file
        label: File
      - key: body
        label: Document
      filters:
      - field: status
        op: '='
        value: approved
      limit: 200
      empty: No approved drafts yet.
    roles:
    - admin
    - partner
    - manager
    - junior
  - key: watches
    type: instances
    title: Client file alerts
    template: file_watch
    roles:
    - admin
    - partner
    - manager
    - junior
  - key: changes
    type: table
    title: What changed this week
    source: collection:source_changes
    data:
      display: list
      fields:
      - key: title
        label: Report
      - key: date
        label: Date
        format: date
      - key: content
        label: Changes
      sort:
        field: date
        dir: desc
      limit: 20
      empty: The first weekly report appears after the next Monday run.
    roles:
    - admin
    - partner
    - manager
    - junior
  - key: dashboard
    type: page
    title: Dashboard
    roles:
    - admin
    - partner
    - manager
    sections:
    - type: data
      title: Research and time saved
      source: collection:research_log
      display: kpi
      kpis:
      - label: Tasks
        agg: count
      - label: Minutes saved (estimate)
        agg: sum
        field: minutes_saved
        format: number
    - type: data
      title: Research volume by month
      source: collection:research_log
      display: chart
      chart: bar
      groupBy:
        field: date
        bucket: month
        aggs:
        - key: tasks
          agg: count
        - key: minutes
          agg: sum
          field: minutes_saved
      fields:
      - key: date
        label: Month
      - key: tasks
        label: Tasks
    - type: data
      title: Open drafts
      source: collection:drafts
      display: table
      fields:
      - key: title
        label: Title
      - key: doc_type
        label: Type
      - key: client_file
        label: File
      - key: status
        label: Status
        format: badge
      filters:
      - field: status
        op: '='
        value: pending_review
      limit: 50
      empty: No drafts waiting for review.
  - key: account
    type: account
    title: Subscription
    roles:
    - admin
    - partner
    - manager
    - junior
  billing:
    modes:
    - subscription
    - credits
    currency: gbp
    signupCredits: 100
    costs:
      agent:researcher: 8
      agent:drafter: 15
      agent:chat_assistant: 3
    packs:
    - key: topup
      credits: 500
      price: 25
      label: 500 credits
    plans:
    - key: seat
      price: 89
      interval: month
      label: Statutia seat
      includes:
      - Research, chat and drafting
      - Weekly source change report
      - Client file alerts
      - Manager approval workflow
      credits: 3000
      creditsReset: monthly
  extensions:
  - key: seat_billing_trial
    description: 'Per-seat quantity billing and a Stripe free-trial period are not expressible yet: the free trial is approximated
      by signup credits, and the seat plan is one subscription per user.'
  - key: memo_upload
    description: Firms' past memos and templates are loaded by admins on the built-in data page (/admin/data, by hand or CSV).
      Self-service memo upload by partners is not available yet.
  - key: partner_approval
    description: The approval is decided by the manager role. Partners approving as well needs a combined reviewer role in
      the firm's invite setup.
