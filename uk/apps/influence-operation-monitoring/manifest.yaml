apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: narrativa
  displayName: Narrativa
  tagline:
    en: Narrative intelligence on AI-driven influence operations.
  description:
    en: Analysts open investigations from seed topics, accounts, domains and hashtags. Agents collect articles and analyse
      licensed social data, build entity and narrative tables, flag AI-generated text and coordinated behaviour, and draft
      reports. Only confirmed findings reach a report, and a senior analyst signs it off before PDF export.
  langs:
  - en
  defaultLang: en
  timezone: Europe/London
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#0f1e33'
      accent: '#d1495b'
      background: '#f6f7f9'
      foreground: '#16202c'
    fonts:
      body: Inter
      display: IBM Plex Sans
    wordmark:
    - text: Narr
      color: primary
    - text: ativa
      color: accent
    width: wide
  header:
    links:
    - label: How it works
      href: '#how'
    - label: Safeguards
      href: '#safeguards'
    cta:
      label: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: senior_analyst
      label: Senior analyst
      assignedBy: invite
    - key: analyst
      label: Analyst
      assignedBy: signup
    - key: external_reader
      label: External reader
      assignedBy: invite
  limits:
  - action: run
    per: user
    max: 30
    window: day
    roles:
    - analyst
    - senior_analyst
  notifications:
    emailOnRunDone: true
  agents:
  - key: analyst
    role: main
    when: task == 'analyse'
    description: Extracts entities, claims and narratives from the collected documents, builds the links between them and
      flags signals of AI-generated text and coordinated behaviour, with its reasoning.
    profile:
      inline:
        display_name: Narrativa analyst
        crews:
        - id: analyst
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are a narrative-intelligence analyst. Work on ONE investigation. Steps: (1) read the investigation
            record (search_investigations) and its documents (search_documents). Documents may be in any of ten European languages:
            analyse them in the original language and write explanations in English. (2) Extract entities (account, domain,
            hashtag, outlet) with append_entity, recording the first_seen date and an amplification_count from the documents.
            (3) Extract claims and group them into narratives with write_narrative (key = a short slug): first_appearance
            date and entity, amplification count, and trend = ''accelerating'' only when the number of documents or accounts
            carrying it clearly rises over recent days, else ''stable'' or ''fading''. (4) Record links (source entity, target
            entity, relation such as shared_link, reshares, same_text, posts_in_sync, hosts_claim, weight) with append_link;
            the app shows these as a network. (5) Record signals with append_finding: kind ''ai_generated_text'' or ''coordinated_behaviour'',
            subject, evidence (document ids), a reasoning field that explains step by step what you observed and what the
            alternative explanations are, a confidence of low, medium or high, and status always ''pending''. Stylometric
            cues alone are weak evidence: never state that a text IS machine-written or that accounts ARE coordinated as fact;
            say ''consistent with'' and give the limits. Never set a status other than pending: analysts decide. Copy the
            investigation''s members field into every record you write, and set the investigation field to its id. Never invent
            documents, accounts, dates or figures. Finish with a report titled ''# Analysis — <investigation name> — <date>''
            giving what was added, the narratives sorted by trend, the signals and what to check next.'
    goalTemplate: 'Analyse investigation {investigation}. {?focus}Focus: {focus}{/focus} Today is {date}. Write the explanations
      in English.'
    appTools:
    - name: search_investigations
      description: Read the user's investigations
      action: search
      collection: investigations
      scope: user
    - name: search_documents
      description: Read collected documents
      action: search
      collection: documents
      scope: user
    - name: search_entities
      description: Read entities
      action: search
      collection: entities
      scope: user
    - name: append_entity
      description: Add an entity
      action: append
      collection: entities
      scope: user
    - name: append_link
      description: Add a link between two entities
      action: append
      collection: links
      scope: user
    - name: write_narrative
      description: Create or update a narrative
      action: write
      collection: narratives
      scope: user
    - name: search_narratives
      description: Read narratives
      action: search
      collection: narratives
      scope: user
    - name: append_finding
      description: Add a finding (always pending)
      action: append
      collection: findings
      scope: user
    output: markdown
  - key: reporter
    role: main
    when: task == 'report'
    description: Drafts the investigation report from CONFIRMED findings only and asks a senior analyst to sign it off.
    awaits:
    - report_signoff
    writesTo:
      collection: reports
      parse: whole
    profile:
      inline:
        display_name: Narrativa report drafter
        crews:
        - id: reporter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 20
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You draft intelligence reports for one investigation. Read the investigation, narratives, entities,
            links and findings with the search tools. Use ONLY findings whose status is exactly ''confirmed''. Ignore pending,
            disputed and false_positive findings and do not mention them, except that you may say how many findings were excluded
            because they are not confirmed. Start with ''# <Investigation name> — Narrative intelligence report''. Then ##
            Summary, ## Key narratives (first appearance, amplification, trend), ## Key actors and links, ## Confirmed findings
            (each with evidence and the analyst''s reasoning, using hedged language for AI-text and coordination signals),
            ## Limits and methodology (sources, languages, what was not covered, no scraping of social platforms), ## Recommended
            next steps. Add a chart block when comparing amplification across narratives:

            ```chart

            {"type":"bar","title":"Amplification by narrative","labels":[],"series":[{"name":"Posts","values":[]}]}

            ```

            Real figures only. When the draft is complete, call request_report_signoff once; the report is not final until
            a senior analyst approves it. The record you produce has status ''draft'', the investigation id and the investigation''s
            members copied over.'
    goalTemplate: Draft the report for investigation {investigation}. Today is {date}. Use confirmed findings only.
    appTools:
    - name: search_investigations
      description: Read the user's investigations
      action: search
      collection: investigations
      scope: user
    - name: search_findings
      description: Read findings
      action: search
      collection: findings
      scope: user
    - name: search_narratives
      description: Read narratives
      action: search
      collection: narratives
      scope: user
    - name: search_entities
      description: Read entities
      action: search
      collection: entities
      scope: user
    - name: search_links
      description: Read links
      action: search
      collection: links
      scope: user
    output: markdown
  - key: collector
    role: helper
    description: Gathers new articles and blog posts about an investigation's seeds, where site terms allow, and stores them
      as documents.
    profile:
      inline:
        display_name: Narrativa collector
        crews:
        - id: collector
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: You collect public articles and blog posts for one investigation. Read the investigation (search_investigations)
            for its seed topics, domains, accounts, hashtags and monitoring languages, and the documents already stored (search_documents)
            so you do not duplicate. Use the WebRobot MCP to build and run a small collection pipeline over news sites and
            blogs only, and only where robots.txt and the site's terms allow automated access. NEVER scrape social-media platforms,
            never log in anywhere, never bypass paywalls or blocks. Social posts reach the app only through the licensed data
            provider that analysts import. Search in the monitoring languages (English, German, French, Spanish, Italian,
            Portuguese, Dutch, Polish, Swedish, Greek as selected). For every new article call append_document with investigation
            (id), source_type 'article', url, author, published_at, language (ISO code), text (the original-language text,
            trimmed to the relevant part) and the investigation's members copied over. Do not translate or alter quotes. End
            with '# Collection — <investigation> — <date>' and a short list of what was added and sites skipped for terms
            reasons.
    appTools:
    - name: search_investigations
      description: Read the user's investigations
      action: search
      collection: investigations
      scope: user
    - name: search_documents
      description: Read stored documents
      action: search
      collection: documents
      scope: user
    - name: append_document
      description: Store a collected document
      action: append
      collection: documents
      scope: user
    output: markdown
  approvals:
  - key: report_signoff
    title: Report sign-off
    description: A senior analyst reviews the draft report and approves it before PDF export.
    role: senior_analyst
    decidedBy: role
    timeoutMinutes: 10080
    onTimeout: reject
  templates:
  - key: watch
    title: Investigation watch
    description: Collects new articles for an investigation every day.
    agent: collector
    params:
    - name: investigation
      type: select
      required: true
      label: Investigation
      optionsFrom: collection:investigations
    goal: Collect new articles for investigation {investigation}. Today is {date}.
    schedule:
      cron: 0 6 * * *
      userCanChange: true
    maxPerUser: 10
  inputForm:
    title: New analysis
    fields:
    - name: task
      type: select
      required: true
      label: Task
      default: analyse
      options:
      - value: analyse
        label: Analyse collected material
      - value: report
        label: Draft a report (confirmed findings only)
    - name: investigation
      type: select
      required: true
      label: Investigation
      optionsFrom: collection:investigations
    - name: focus
      type: textarea
      maxLength: 500
      label: Focus (optional)
      visibleWhen: task == 'analyse'
  data:
    collections:
    - name: investigations
      description: Investigations with seeds and team members
      ownedBy: user
      fields:
      - name: name
        type: text
        required: true
        label: Name
      - name: seed_topics
        type: textarea
        label: Seed topics
      - name: seed_accounts
        type: textarea
        label: Seed accounts
      - name: seed_domains
        type: textarea
        label: Seed domains
      - name: seed_hashtags
        type: textarea
        label: Seed hashtags
      - name: languages
        type: multiselect
        label: Monitoring languages
        options:
        - value: en
          label: English
        - value: de
          label: German
        - value: fr
          label: French
        - value: es
          label: Spanish
        - value: it
          label: Italian
        - value: pt
          label: Portuguese
        - value: nl
          label: Dutch
        - value: pl
          label: Polish
        - value: sv
          label: Swedish
        - value: el
          label: Greek
      - name: members
        type: array
        label: Team member emails
        help: Colleagues who share this investigation
      access:
      - role: analyst
        where:
          members: '{user.email}'
        can:
        - read
        - write
      - role: senior_analyst
        where:
          members: '{user.email}'
        can:
        - read
        - write
    - name: documents
      description: Collected articles and imported social posts
      ownedBy: user
      fields:
      - name: investigation
        type: text
        required: true
        label: Investigation id
      - name: source_type
        type: select
        label: Type
        options:
        - article
        - social_post
      - name: platform
        type: text
        label: Platform / outlet
      - name: url
        type: url
        label: URL
      - name: author
        type: text
        label: Author / account
      - name: published_at
        type: date
        label: Published
      - name: language
        type: text
        label: Language
      - name: text
        type: textarea
        label: Text
      - name: members
        type: array
        label: Members
      retentionDays: 730
      access:
      - role: analyst
        where:
          members: '{user.email}'
        can:
        - read
        - write
      - role: senior_analyst
        where:
          members: '{user.email}'
        can:
        - read
        - write
    - name: entities
      description: Accounts, domains, hashtags and outlets
      ownedBy: user
      fields:
      - name: investigation
        type: text
        label: Investigation id
      - name: kind
        type: select
        label: Kind
        options:
        - account
        - domain
        - hashtag
        - outlet
      - name: name
        type: text
        label: Name
      - name: first_seen
        type: date
        label: First seen
      - name: amplification_count
        type: number
        label: Amplification
      - name: members
        type: array
        label: Members
      access:
      - role: analyst
        where:
          members: '{user.email}'
        can:
        - read
        - write
      - role: senior_analyst
        where:
          members: '{user.email}'
        can:
        - read
        - write
    - name: links
      description: Edges of the entity network
      ownedBy: user
      fields:
      - name: investigation
        type: text
        label: Investigation id
      - name: source
        type: text
        label: From
      - name: target
        type: text
        label: To
      - name: relation
        type: text
        label: Relation
      - name: weight
        type: number
        label: Weight
      - name: members
        type: array
        label: Members
      access:
      - role: analyst
        where:
          members: '{user.email}'
        can:
        - read
        - write
      - role: senior_analyst
        where:
          members: '{user.email}'
        can:
        - read
        - write
    - name: narratives
      description: Claims grouped into narratives
      ownedBy: user
      fields:
      - name: investigation
        type: text
        label: Investigation id
      - name: slug
        type: text
        label: Key
      - name: claim
        type: textarea
        label: Claim
      - name: first_appearance
        type: date
        label: First appearance
      - name: first_entity
        type: text
        label: First seen on
      - name: amplification_count
        type: number
        label: Amplification
      - name: trend
        type: select
        label: Trend
        options:
        - accelerating
        - stable
        - fading
      - name: members
        type: array
        label: Members
      access:
      - role: analyst
        where:
          members: '{user.email}'
        can:
        - read
        - write
      - role: senior_analyst
        where:
          members: '{user.email}'
        can:
        - read
        - write
    - name: findings
      description: Signals with reasoning; analysts label them
      ownedBy: user
      fields:
      - name: investigation
        type: text
        label: Investigation id
      - name: kind
        type: select
        label: Signal
        options:
        - ai_generated_text
        - coordinated_behaviour
      - name: subject
        type: text
        label: Subject
      - name: evidence
        type: textarea
        label: Evidence
      - name: reasoning
        type: textarea
        label: Agent reasoning
      - name: confidence
        type: select
        label: Confidence
        options:
        - low
        - medium
        - high
      - name: status
        type: select
        label: Status
        default: pending
        options:
        - pending
        - confirmed
        - disputed
        - false_positive
      - name: analyst_note
        type: textarea
        label: Analyst note
      - name: members
        type: array
        label: Members
      access:
      - role: analyst
        where:
          members: '{user.email}'
        can:
        - read
        - write
      - role: senior_analyst
        where:
          members: '{user.email}'
        can:
        - read
        - write
    - name: reports
      description: Drafted reports; readers see them once signed off
      ownedBy: user
      fields:
      - name: investigation
        type: text
        label: Investigation id
      - name: title
        type: text
        label: Title
      - name: body
        type: textarea
        label: Report
      - name: status
        type: select
        label: Status
        default: draft
        options:
        - draft
        - signed_off
      - name: members
        type: array
        label: Members
      access:
      - role: analyst
        where:
          members: '{user.email}'
        can:
        - read
      - role: senior_analyst
        where:
          members: '{user.email}'
        can:
        - read
        - write
      - role: external_reader
        where:
          members: '{user.email}'
          status: signed_off
        can:
        - read
  triggers:
  - key: narrative_accelerating
    description: Alert the owner when a narrative accelerates
    'on':
      collection: narratives
      op: any
      where:
        trend: accelerating
    notify:
      to:
      - owner
      subject: 'Narrative accelerating: {record.slug}'
      body: 'A narrative in your investigation is accelerating.


        Claim: {record.claim}

        Amplification: {record.amplification_count}


        Open Narrativa to review.'
      link: narratives
  - key: report_signed_off
    description: Tell the owner the report is signed off and ready for PDF export
    'on':
      approval: report_signoff
      decision: approved
    notify:
      to:
      - owner
      subject: Report signed off
      body: A senior analyst signed off your report. You can now export it to PDF.
      link: reports
  views:
  - key: home
    type: page
    nav: false
    title: Narrativa
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow: Narrative intelligence
      title: See how **AI-driven influence operations** spread
      text: Open an investigation, let agents collect and analyse the material, and keep only what your analysts confirm.
        Built for security teams, newsrooms and research groups. Monitoring in ten European languages.
      actions:
      - label: Sign in
        href: /login
        style: primary
      - label: How it works
        href: '#how'
        style: ghost
      note: £1,500 per team per month.
    - type: steps
      id: how
      title: How it works
      items:
      - title: Open an investigation
        text: Seed topics, accounts, domains and hashtags, and pick the languages to monitor.
      - title: Collect
        text: Agents gather news and blog articles where site terms allow. Social posts come from your licensed data provider.
      - title: Map narratives
        text: Entity and narrative tables with first appearance, amplification and a link table between them.
      - title: Detect and explain
        text: An agent flags signals of AI-generated text and coordinated behaviour and shows its reasoning.
      - title: Label and report
        text: Analysts mark findings confirmed, disputed or false positive. Only confirmed findings enter the report, signed
          off by a senior analyst.
    - type: cards
      id: safeguards
      title: Safeguards
      items:
      - title: No scraping of social platforms
        text: Social data only through official APIs or a licensed provider.
      - title: Human in the loop
        text: Signals are leads, not verdicts. Analysts decide and a senior analyst signs off.
      - title: Roles
        text: Admin, senior analyst, analyst and external reader, each with their own access.
    - type: note
      content: Detection of AI-generated text and coordination is probabilistic. Treat findings as evidence to verify, not
        proof.
  - key: new_run
    type: new_run
    title: Analyse or report
    roles:
    - analyst
    - senior_analyst
    - admin
  - key: history
    type: history
    title: Runs
    source: run
    roles:
    - analyst
    - senior_analyst
    - admin
  - key: run_report
    type: report
    source: run
    printable: true
    nav: false
  - key: new_investigation
    type: form
    title: New investigation
    collection: investigations
    submit:
      label: Create investigation
      message: Investigation created.
      redirect: investigations
    roles:
    - analyst
    - senior_analyst
    - admin
  - key: investigations
    type: table
    title: Investigations
    source: collection:investigations
    roles:
    - analyst
    - senior_analyst
    - admin
    data:
      display: table
      fields:
      - key: name
        label: Name
      - key: seed_topics
        label: Topics
      - key: languages
        label: Languages
      - key: members
        label: Team
      limit: 100
  - key: watches
    type: instances
    template: watch
    title: Daily watches
    roles:
    - analyst
    - senior_analyst
    - admin
  - key: import_posts
    type: form
    title: Import social posts
    collection: documents
    fields:
    - investigation
    - source_type
    - platform
    - url
    - author
    - published_at
    - language
    - text
    - members
    submit:
      label: Import
      message: Post stored.
    roles:
    - analyst
    - senior_analyst
    - admin
  - key: workspace
    type: tabs
    title: Workspace
    children:
    - documents_table
    - entities_table
    - links_table
    - narratives_table
    roles:
    - analyst
    - senior_analyst
    - admin
  - key: documents_table
    type: table
    title: Documents
    source: collection:documents
    nav: false
    export: true
    data:
      display: table
      fields:
      - key: published_at
        label: Published
        format: date
      - key: source_type
        label: Type
        format: badge
      - key: platform
        label: Source
      - key: author
        label: Author
      - key: language
        label: Lang
      - key: url
        label: URL
        format: link
      sort:
        field: published_at
        dir: desc
      limit: 200
  - key: entities_table
    type: table
    title: Entities
    source: collection:entities
    nav: false
    export: true
    data:
      display: table
      fields:
      - key: kind
        label: Kind
        format: badge
      - key: name
        label: Name
      - key: first_seen
        label: First seen
        format: date
      - key: amplification_count
        label: Amplification
        format: number
      sort:
        field: amplification_count
        dir: desc
      limit: 200
  - key: links_table
    type: table
    title: Links (network)
    source: collection:links
    nav: false
    export: true
    data:
      display: table
      fields:
      - key: source
        label: From
      - key: relation
        label: Relation
        format: badge
      - key: target
        label: To
      - key: weight
        label: Weight
        format: number
      sort:
        field: weight
        dir: desc
      limit: 200
  - key: narratives_table
    type: table
    title: Narratives
    source: collection:narratives
    nav: false
    export: true
    data:
      display: table
      fields:
      - key: slug
        label: Narrative
      - key: claim
        label: Claim
      - key: first_appearance
        label: First appearance
        format: date
      - key: first_entity
        label: First seen on
      - key: amplification_count
        label: Amplification
        format: number
      - key: trend
        label: Trend
        format: badge
      sort:
        field: amplification_count
        dir: desc
      limit: 200
  - key: narratives
    type: chart
    title: Narrative amplification
    source: collection:narratives
    roles:
    - analyst
    - senior_analyst
    - admin
    data:
      display: chart
      chart: bar
      fields:
      - key: slug
        label: Narrative
      - key: amplification_count
        label: Amplification
      sort:
        field: amplification_count
        dir: desc
      limit: 20
  - key: findings
    type: table
    title: Findings
    source: collection:findings
    roles:
    - analyst
    - senior_analyst
    - admin
    export: true
    data:
      display: table
      fields:
      - key: kind
        label: Signal
        format: badge
      - key: subject
        label: Subject
      - key: confidence
        label: Confidence
        format: badge
      - key: status
        label: Status
        format: badge
      - key: reasoning
        label: Agent reasoning
      - key: analyst_note
        label: Note
      limit: 200
  - key: finding_review
    type: form
    title: Label a finding
    collection: findings
    fields:
    - status
    - analyst_note
    edit: true
    submit:
      label: Save label
      message: Finding labelled.
      redirect: findings
    nav: false
    roles:
    - analyst
    - senior_analyst
    - admin
  - key: reports
    type: table
    title: Reports
    source: collection:reports
    printable: true
    export: true
    roles:
    - analyst
    - senior_analyst
    - external_reader
    - admin
    data:
      display: table
      fields:
      - key: title
        label: Title
      - key: status
        label: Status
        format: badge
      - key: body
        label: Report
      limit: 100
