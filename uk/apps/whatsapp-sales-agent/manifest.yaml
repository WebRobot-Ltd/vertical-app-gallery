apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: chatterly
  displayName: Chatterly
  tagline:
    en: An AI sales and support agent for your shop, set up without code.
  description:
    en: Upload your catalogue, FAQs, policies and opening hours, pick a template and a tone. Chatterly's agent answers customers,
      recommends products, takes bookings and hands angry or refund cases to your staff inbox.
  langs:
  - en
  defaultLang: en
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#0b3d3a'
      accent: '#25a56a'
      background: '#f7faf8'
      foreground: '#14201e'
    fonts:
      body: Inter
      display: Poppins
    wordmark:
    - text: Chatter
      color: primary
    - text: ly
      color: accent
  header:
    links:
    - label: How it works
      href: '#how'
    - label: Pricing
      href: '#pricing'
    cta:
      label: Get started
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: user
      label: Business owner
      assignedBy: signup
    - key: staff
      label: Staff
      assignedBy: derived
      from: collection:handovers.staff_email
  limits:
  - action: chat
    per: user
    max: 200
    window: day
    roles:
    - user
  agents:
  - key: sales
    role: main
    description: Answers customers from the business's catalogue, FAQs and policies, recommends products, takes bookings and
      hands over to staff.
    profile:
      inline:
        display_name: Chatterly sales and support agent
        chat_mode: true
        crews:
        - id: sales
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the sales and support agent of one small shop, salon or restaurant. Speak in the tone given
            in your context. Answer ONLY from the catalogue (search_products), FAQs (read_faqs), the delivery and returns
            policy and the opening hours in your context. Never invent products, prices, stock or policies. If you do not
            know the answer, say so politely and call log_unanswered with the question. Recommend at most 3 products, with
            price. To book, ask for service, date, time, name and contact, check them against the opening hours, then call
            create_booking. If the customer asks for a refund, is angry, or asks for a person, apologise briefly, call handover_to_staff
            with a reason (refund, angry or other) and a short summary, and tell them a member of staff will reply. You cannot
            take payments or send payment links yet: say a staff member will send one. Keep replies short and friendly, in
            the customer''s language.'
        mcp_servers: []
    context:
    - key: business_name
      from: collection:business.name
    - key: tone
      from: collection:business.tone
    - key: hours
      from: collection:business.opening_hours
    - key: delivery
      from: collection:business.delivery_policy
    - key: returns
      from: collection:business.returns_policy
    goalTemplate: 'Business: {business_name}

      Tone: {tone}

      Opening hours: {hours}

      Delivery policy: {delivery}

      Returns policy: {returns}

      Today is {date}.

      Conversation so far:

      {history}

      New customer message: {message}'
    appTools:
    - name: search_products
      description: Search the business's product catalogue
      action: search
      collection: products
      scope: user
    - name: read_faqs
      description: Read the business's FAQs
      action: read
      collection: faqs
      scope: user
    - name: create_booking
      description: Save a customer's booking
      action: append
      collection: bookings
      scope: user
    - name: handover_to_staff
      description: Open a handover for a human staff member
      action: append
      collection: handovers
      scope: user
    - name: log_unanswered
      description: Record a question the agent could not answer
      action: append
      collection: unanswered
      scope: user
    - name: log_conversation
      description: Save a short summary of the conversation
      action: append
      collection: conversations
      scope: user
    - name: shopify_products
      description: List products from the business's Shopify store
      action: http
      http:
        method: GET
        url: https://{host}/admin/api/2025-01/products.json
        allowPath: false
        attribution: Shopify store of the business
        credential:
          provider: shopify
          header: X-Shopify-Access-Token
          format: '{secret}'
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.3
  - key: reporter
    role: helper
    description: Writes each business's weekly results summary.
    profile:
      inline:
        display_name: Chatterly weekly reporter
        crews:
        - id: reporter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write a short weekly email summary for a shop owner. Start with "# Chatterly weekly summary
            — <date>". Sections: ## Conversations, ## Sales attributed to the agent, ## Bookings, ## Handovers to staff, ##
            Unanswered questions (suggest FAQs to add). Use only data from your tools; never invent figures. Under 250 words.'
    goalTemplate: Write this week's summary for the business. Today is {date}.
    appTools:
    - name: week_sales
      description: Read the business's attributed sales
      action: read
      collection: sales
      scope: user
    - name: week_bookings
      description: Read the business's bookings
      action: read
      collection: bookings
      scope: user
    - name: week_handovers
      description: Read the business's handovers
      action: read
      collection: handovers
      scope: user
    - name: week_unanswered
      description: Read unanswered questions
      action: read
      collection: unanswered
      scope: user
    - name: week_conversations
      description: Read conversation summaries
      action: read
      collection: conversations
      scope: user
    output: markdown
    limits:
      maxTurns: 6
      maxBudgetUsd: 0.3
  templates:
  - key: weekly_summary
    title: Weekly summary
    description: A results summary emailed to you every Monday.
    agent: reporter
    params:
    - name: focus
      type: select
      required: true
      label: Emphasis
      options:
      - value: sales
        label: Sales
      - value: support
        label: Support
      - value: balanced
        label: Balanced
    goal: 'Write this week''s summary for "{instance}". Today is {date}. Emphasis: {focus}.'
    schedule:
      cron: 0 7 * * 1
      userCanChange: false
    maxPerUser: 1
    cost:
      perRun: 5
    deliver:
      to: owner
      subject: Your Chatterly weekly summary
      onlyIfNew: false
  data:
    collections:
    - name: business
      ownedBy: user
      description: The business profile and the agent's settings
      fields:
      - name: name
        type: text
        required: true
        label: Business name
      - name: template
        type: select
        required: true
        label: Template
        options:
        - value: shop
          label: Shop
        - value: salon
          label: Salon
        - value: restaurant
          label: Restaurant
      - name: tone
        type: select
        required: true
        label: Agent tone
        options:
        - value: friendly
          label: Friendly
        - value: professional
          label: Professional
        - value: playful
          label: Playful
      - name: opening_hours
        type: textarea
        label: Opening hours
      - name: delivery_policy
        type: textarea
        label: Delivery policy
      - name: returns_policy
        type: textarea
        label: Returns policy
    - name: products
      ownedBy: user
      searchable: true
      fields:
      - name: name
        type: text
        required: true
      - name: description
        type: textarea
      - name: price
        type: number
        required: true
      - name: sku
        type: text
      - name: url
        type: url
    - name: faqs
      ownedBy: user
      fields:
      - name: question
        type: text
        required: true
      - name: answer
        type: textarea
        required: true
    - name: bookings
      ownedBy: user
      fields:
      - name: customer_name
        type: text
      - name: customer_contact
        type: text
      - name: service
        type: text
      - name: date
        type: date
      - name: time
        type: text
      - name: status
        type: select
        options:
        - booked
        - cancelled
        - done
    - name: handovers
      ownedBy: user
      description: Chats handed over to a human; staff see only those assigned to them
      fields:
      - name: customer
        type: text
      - name: reason
        type: select
        options:
        - refund
        - angry
        - other
      - name: summary
        type: textarea
      - name: staff_email
        type: email
        label: Assigned staff (email)
      - name: reply
        type: textarea
        label: Reply to the customer
      - name: status
        type: select
        options:
        - open
        - replied
        - resolved
      access:
      - role: staff
        where:
          staff_email: '{user.email}'
        can:
        - read
        - write
    - name: unanswered
      ownedBy: user
      fields:
      - name: question
        type: text
      - name: date
        type: date
    - name: conversations
      ownedBy: user
      retentionDays: 90
      fields:
      - name: customer
        type: text
      - name: summary
        type: textarea
      - name: date
        type: date
    - name: sales
      ownedBy: user
      fields:
      - name: date
        type: date
      - name: customer
        type: text
      - name: order_ref
        type: text
      - name: amount
        type: number
    credentials:
    - provider: shopify
      kind: api_key
      scope: user
      label: Shopify
      help: In Shopify admin create a custom app and copy its Admin API access token.
      hostLabel: your-shop.myshopify.com
  egress:
    hosts:
    - '*.myshopify.com'
    notes: Each business's own Shopify store, read with the API key the business pastes.
  views:
  - key: home
    type: page
    title: Chatterly
    nav: false
    sections:
    - type: hero
      title: An AI agent that sells and supports for your **small shop**
      text: Upload your catalogue, FAQs and policies, pick a tone, and let the agent answer, recommend, book and hand over
        to your team.
      actions:
      - label: Get started
        href: /login
        style: primary
    - type: steps
      id: how
      title: How it works
      items:
      - title: Set up
        text: Add your business details, products, FAQs, policies and hours.
      - title: Test the agent
        text: Chat with it and tune the tone.
      - title: Hand over
        text: Refunds and angry customers go to your staff inbox.
      - title: Follow results
        text: A dashboard and a weekly email show sales, bookings and gaps.
    - type: cards
      id: pricing
      title: Pricing
      items:
      - title: Starter
        text: Monthly plan with 500 conversations.
      - title: Growth
        text: Monthly plan with 2,000 conversations.
      - title: Overage
        text: Extra messages are paid per use.
    - type: note
      content: 'WhatsApp delivery is not connected yet: today the agent runs in the web chat.'
  - key: setup
    type: form
    title: Business setup
    collection: business
    edit: true
    submit:
      label: Save
      message: Saved
      redirect: assistant
    roles:
    - user
    - admin
  - key: add_product
    type: form
    title: Add product
    collection: products
    submit:
      label: Add
      message: Product added
      redirect: catalogue
    roles:
    - user
    - admin
  - key: catalogue
    type: table
    title: Catalogue
    source: collection:products
    export: true
    roles:
    - user
    - admin
  - key: add_faq
    type: form
    title: Add FAQ
    collection: faqs
    submit:
      label: Add
      message: FAQ added
    roles:
    - user
    - admin
  - key: assistant
    type: chat
    title: Test the agent
    source: agent:sales
    examples:
    - Do you have gift ideas under 30 euro?
    - What is your returns policy?
    - I'd like to book for Saturday
    placeholder: Write as a customer…
    roles:
    - user
    - admin
  - key: inbox
    type: table
    title: Staff inbox
    source: collection:handovers
    columns:
    - customer
    - reason
    - summary
    - status
    - staff_email
    roles:
    - user
    - staff
    - admin
  - key: reply
    type: form
    title: Reply / assign
    collection: handovers
    edit: true
    fields:
    - staff_email
    - reply
    - status
    submit:
      label: Save
      message: Saved
      redirect: inbox
    nav: false
    roles:
    - user
    - staff
    - admin
  - key: dashboard
    type: page
    title: Dashboard
    roles:
    - user
    - admin
    sections:
    - type: data
      title: Sales attributed to the agent
      source: collection:sales
      display: kpi
      kpis:
      - label: Total sales
        agg: sum
        field: amount
        format: money
      - label: Orders
        agg: count
    - type: data
      title: Sales by month
      source: collection:sales
      display: chart
      chart: bar
      fields:
      - key: date
      - key: total
      groupBy:
        field: date
        bucket: month
        aggs:
        - key: total
          agg: sum
          field: amount
    - type: data
      title: Conversations
      source: collection:conversations
      display: table
      fields:
      - key: date
        format: date
      - key: customer
      - key: summary
      sort:
        field: date
        dir: desc
      limit: 20
    - type: data
      title: Bookings
      source: collection:bookings
      display: table
      fields:
      - key: date
        format: date
      - key: time
      - key: customer_name
      - key: service
      - key: status
        format: badge
      limit: 20
    - type: data
      title: Unanswered questions
      source: collection:unanswered
      display: list
      fields:
      - key: question
      - key: date
        format: date
      limit: 20
  - key: watches
    type: instances
    template: weekly_summary
    title: Weekly email
    roles:
    - user
  - key: account
    type: account
    title: Plan and integrations
    roles:
    - user
  triggers:
  - key: handover_opened
    'on':
      collection: handovers
      op: insert
    notify:
      to: owner
      subject: 'A customer needs a human: {record.reason}'
      body: '{record.summary}


        Open the inbox to assign it to a staff member.'
      link: inbox
  - key: handover_replied
    'on':
      collection: handovers
      op: update
      where:
        status: resolved
    notify:
      to: owner
      subject: Handover resolved
      body: A handover with {record.customer} was resolved.
      link: inbox
  billing:
    modes:
    - subscription
    - credits
    currency: eur
    signupCredits: 20
    costs:
      agent:sales: 1
    plans:
    - key: starter
      price: 29
      interval: month
      label: Starter — 500 conversations
      credits: 500
      creditsReset: monthly
    - key: growth
      price: 79
      interval: month
      label: Growth — 2,000 conversations
      credits: 2000
      creditsReset: monthly
    packs:
    - key: overage
      credits: 500
      price: 10
      label: Extra 500 messages
  notifications:
    emailOnRunDone: false
  extensions:
  - key: whatsapp_channel
    description: The WhatsApp Business Platform channel (Meta approval, paid messaging, receiving and sending customer messages)
      is not available yet. The agent runs in the web chat; channels support only web, phone, telegram, email.
  - key: shopify_oauth
    description: OAuth sign-in to Shopify is not available; the business pastes a Shopify API token on the account page instead.
  - key: payment_links
    description: Sending card payment links from the agent to the customer's chat is not available yet; staff send them.
  - key: abandoned_cart_followup
    description: Follow-ups of abandoned carts with an approved WhatsApp message template need the WhatsApp channel and cart
      events; not available yet.
  - key: per_message_overage
    description: Overage is sold as credit packs (1 credit per agent message), not billed per message in arrears.
