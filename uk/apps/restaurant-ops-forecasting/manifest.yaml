  approvals:
  - key: order_ok
    title: Approve purchase order
    description: The site manager approves each order before it is emailed to the supplier.
    decidedBy: requester
    fields:
    - site
    - supplier
    - total
  templates:
  - key: ops_monitor
    title: Daily operations monitor
    description: Every morning checks waste, stock below par, sales drops and food cost for all your sites and emails the
      managers.
    agent: monitor
    params:
    - name: waste_pct
      type: number
      required: true
      default: 4
      label: Waste alert above (% of sales)
    - name: drop_pct
      type: number
      required: true
      default: 25
      label: Sales drop alert above (%)
    - name: food_cost_target
      type: number
      required: true
      default: 30
      label: Food cost target (% of sales)
    goal: 'Run the daily check for "{instance}". Today is {date}. Thresholds: waste above {waste_pct}% of sales, sales drop
      above {drop_pct}% against the same weekday, food cost above {food_cost_target}% of sales. Write in the language with
      ISO code {lang}.'
    schedule:
      cron: 0 5 * * *
      userCanChange: true
    maxPerUser: 1
  triggers:
  - key: order_approved
    description: Mark the order approved once the site manager decides
    'on':
      approval: order_ok
      decision: approved
    start:
      agent: dispatcher
    goal: 'The site manager approved a purchase order. Approval event: {event}. Mark that purchase order as approved.'
  - key: order_to_supplier
    description: Email the approved order to the supplier
    'on':
      collection: purchase_orders
      op: update
      where:
        status: approved
    notify:
      to:
      - record.supplier_email
      - owner
      subject: Purchase order from {record.site} for {record.supplier}
      body: 'Hello,


        Please find our purchase order for {record.site}, delivery on {record.ordered_for}:


        {record.lines}


        Total: {record.total}


        Please confirm by replying to this email.


        Sent through Kitchenly.'
      link: orders
  - key: alert_mail
    description: Email the site and area managers when the monitor raises an alert
    'on':
      collection: alerts
      op: insert
    notify:
      to:
      - record.manager_email
      - record.area_manager_email
      subject: '[Kitchenly] {record.kind} alert at {record.site}'
      body: '{record.message}


        Severity: {record.severity}

        Date: {record.date}'
      link: alerts
  notifications:
    emailOnRunDone: true
  views:
  - key: home
    type: page
    title: Kitchenly
    nav: false
    sections:
    - type: hero
      layout: stack
      band: true
      eyebrow: For quick-service restaurant chains
      title: Know what to **prep**, what to **order** and where money leaks.
      text: Daily counts on the phone, demand forecasts per item and site, orders approved by the site manager, and alerts
        when waste, stock or sales go off track.
      actions:
      - label: Get started
        href: /login
        style: primary
      - label: How it works
        href: '#how'
        style: ghost
    - type: steps
      id: how
      title: How it works
      items:
      - title: Add your sites
        text: 'Name the site manager, area manager and head office for each site: they are invited by email.'
        badge: '1'
      - title: Count and import
        text: Count stock on the phone by scanning barcodes, and import sales from your POS as CSV.
        badge: '2'
      - title: Forecast and approve
        text: The agent proposes the prep list and purchase orders; the site manager approves each order before it goes to
          the supplier.
        badge: '3'
      - title: Watch the numbers
        text: Daily monitors email alerts; dashboards show sales vs forecast, food cost, waste and labour; ask questions in
          plain words.
        badge: '4'
    - type: cards
      id: roles
      title: Who sees what
      items:
      - title: Site managers
        text: 'Only their own site: counts, forecasts, orders, alerts.'
      - title: Area managers
        text: Every site in their region, read only.
      - title: Head office
        text: All the sites of the chain, with dashboards and the analytics assistant.
    - type: cards
      id: pricing
      title: Pricing
      intro: A monthly fee per site, in packs.
      items:
      - title: 3 sites
        text: EUR 89 per month
      - title: 10 sites
        text: EUR 249 per month
      - title: 30 sites
        text: EUR 649 per month
    - type: note
      content: Forecasts and alerts support decisions; check them before ordering. Live POS sales need a partner agreement
        with each vendor; until then import sales as CSV.
  - key: plan
    type: new_run
    title: Forecast & import
    roles:
    - user
    - admin
    - site_manager
    - area_manager
    - head_office
  - key: runs
    type: history
    title: My runs
    source: run
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: orders_to_approve
    type: approvals
    title: Orders to approve
    approvals:
    - order_ok
  - key: orders
    type: table
    title: Purchase orders
    source: collection:purchase_orders
    columns:
    - site
    - supplier
    - ordered_for
    - total
    - status
    export: true
  - key: count
    type: form
    title: Daily count
    collection: stock_counts
    fields:
    - site
    - date
    - barcode
    - item
    - counted_qty
    - manager_email
    - area_manager_email
    - head_office_email
    submit:
      label: Save count
      message: Count saved. Scan the next item.
      redirect: count
  - key: waste_entry
    type: form
    title: Log waste
    collection: waste_log
    fields:
    - site
    - date
    - item
    - qty
    - cost
    - reason
    - manager_email
    - area_manager_email
    - head_office_email
    submit:
      label: Save waste
      message: Waste logged.
  - key: labour_entry
    type: form
    title: Labour hours
    collection: labour
    fields:
    - site
    - date
    - hours
    - cost
    - manager_email
    - area_manager_email
    - head_office_email
    submit:
      label: Save hours
      message: Hours saved.
  - key: event_entry
    type: form
    title: Local event
    collection: local_events
    fields:
    - site
    - date
    - name
    - impact
    - manager_email
    - area_manager_email
    - head_office_email
    submit:
      label: Save event
      message: 'Event saved: the forecast will use it.'
  - key: stock_item
    type: form
    title: Add or edit stock item
    collection: stock
    edit: true
    submit:
      label: Save item
      message: Item saved.
  - key: stock_list
    type: table
    title: Stock
    source: collection:stock
    columns:
    - site
    - item
    - unit
    - supplier
    - par_level
    - cost
    - quantity
    export: true
  - key: site_form
    type: form
    title: Add or edit site
    collection: sites
    edit: true
    roles:
    - user
    - admin
    submit:
      label: Save site
      message: Site saved. The managers named here can now sign in.
  - key: site_list
    type: table
    title: Sites
    source: collection:sites
    columns:
    - name
    - region
    - manager_email
    - area_manager_email
    - pos_vendor
  - key: alerts
    type: table
    title: Alerts
    source: collection:alerts
    columns:
    - date
    - site
    - kind
    - severity
    - message
  - key: dashboard
    type: page
    title: Dashboards
    sections:
    - type: data
      id: sales-vs-forecast
      title: Sales vs forecast
      source: collection:daily_kpis
      display: chart
      chart: line
      fields:
      - key: date
        label: Day
        format: date
      - key: sales
        label: Sales
        format: money
      - key: forecast_sales
        label: Forecast
        format: money
      groupBy:
        field: date
        bucket: day
        aggs:
        - key: sales
          agg: sum
          field: sales
        - key: forecast_sales
          agg: sum
          field: forecast_sales
      limit: 60
      empty: 'No KPI rows yet: they appear after the first daily check.'
    - type: data
      id: food-cost
      title: Food cost % per site
      source: collection:daily_kpis
      display: bar
      fields:
      - key: site
        label: Site
      - key: food_cost_pct
        label: Food cost %
        format: number
      groupBy:
        field: site
        aggs:
        - key: food_cost_pct
          agg: avg
          field: food_cost_pct
      empty: No data yet.
    - type: data
      id: waste
      title: Waste cost per site
      source: collection:daily_kpis
      display: bar
      fields:
      - key: site
        label: Site
      - key: waste_cost
        label: Waste cost
        format: money
      groupBy:
        field: site
        aggs:
        - key: waste_cost
          agg: sum
          field: waste_cost
      empty: No data yet.
    - type: data
      id: labour
      title: Labour hours per site
      source: collection:daily_kpis
      display: bar
      fields:
      - key: site
        label: Site
      - key: labour_hours
        label: Labour hours
        format: number
      groupBy:
        field: site
        aggs:
        - key: labour_hours
          agg: sum
          field: labour_hours
      empty: No data yet.
  - key: ask
    type: chat
    title: Ask
    source: agent:analyst
    examples:
    - Which sites had the worst waste last week?
    - Show sales vs forecast for the last 14 days
    - Which items are below par today?
    - Compare labour hours across my region
    placeholder: Ask about sales, waste, stock or labour
  - key: monitors
    type: instances
    template: ops_monitor
    title: Daily monitor
    roles:
    - user
    - admin
  - key: account
    type: account
    title: Plan
    roles:
    - user
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: site_pack_3
      price: 89
      interval: month
      label: Up to 3 sites
      includes:
      - 3 sites
      - forecasts, orders and alerts
      - analytics assistant
      roles:
      - user
    - key: site_pack_10
      price: 249
      interval: month
      label: Up to 10 sites
      includes:
      - 10 sites
      - forecasts, orders and alerts
      - analytics assistant
      roles:
      - user
    - key: site_pack_30
      price: 649
      interval: month
      label: Up to 30 sites
      includes:
      - 30 sites
      - forecasts, orders and alerts
      - analytics assistant
      roles:
      - user
  mobile:
    appId: com.kitchenly.ops
    appName: Kitchenly
    capabilities:
    - name: barcode
      reason:
        en: To scan the barcode of each item during the daily count
    - name: push
    - name: microphone
      reason:
        en: To ask the assistant questions by voice
  extensions:
  - key: pos_live_sales
    description: Live sales from POS vendor APIs need a partner agreement and OAuth sign-in with each vendor, which is not
      available yet. Until then managers import sales as CSV. Enable per vendor once the agreement exists.
  - key: per_site_billing
    description: The fee is per site, sold as packs of 3, 10 and 30 sites with a cap on the number of sites. Exact per-site
      metering (a quantity-based Stripe subscription) is not available yet.
  - key: site_emails_on_records
    description: Visibility per site, region and head office follows the manager emails stored on each record. Forms ask for
      them; copying them automatically from the site record is not available yet.
