  - key: dashboard
    type: page
    title: Spend dashboard
    roles:
    - buyer
    - budget_holder
    - finance
    - admin
    sections:
    - type: data
      id: kpis
      title: Overview
      source: collection:purchase_orders
      display: kpi
      kpis:
      - label: Spend under management
        agg: sum
        field: amount
        format: money
      - label: Savings
        agg: sum
        field: savings
        format: money
      - label: Average cycle time (days)
        agg: avg
        field: cycle_days
        format: number
      - label: Orders
        agg: count
    - type: data
      id: spend-category
      title: Spend by category
      source: collection:purchase_orders
      display: chart
      chart: bar
      groupBy:
        field: category
        aggs:
        - key: spend
          agg: sum
          field: amount
      fields:
      - key: category
        label: Category
      - key: spend
        label: Spend
    - type: data
      id: savings-month
      title: Savings by month
      source: collection:purchase_orders
      display: chart
      chart: line
      groupBy:
        field: issued_date
        bucket: month
        aggs:
        - key: savings
          agg: sum
          field: savings
      fields:
      - key: issued_date
        label: Month
      - key: savings
        label: Savings
    - type: data
      id: cycle-month
      title: Cycle time by month (days)
      source: collection:purchase_orders
      display: chart
      chart: line
      groupBy:
        field: issued_date
        bucket: month
        aggs:
        - key: cycle
          agg: avg
          field: cycle_days
      fields:
      - key: issued_date
        label: Month
      - key: cycle
        label: Avg days
  - key: account
    type: account
    title: Subscription and integrations
    roles:
    - admin
    - finance
  billing:
    modes:
    - subscription
    currency: gbp
    plans:
    - key: starter
      price: 4800
      interval: year
      label: Starter — up to £2M spend under management
      includes:
      - Up to 300 agent-checked requests a month
      - All five roles
    - key: growth
      price: 14400
      interval: year
      label: Growth — up to £10M spend under management
      includes:
      - Up to 1,500 agent-checked requests a month
      - Dashboards and exports
    - key: scale
      price: 36000
      interval: year
      label: Scale — above £10M spend under management
      includes:
      - Unlimited requests
      - Priority support
  egress:
    hosts:
    - api.company-information.service.gov.uk
    - www.thegazette.co.uk
    notes: Companies House API (company profile, officers, filing history, insolvency; Open Government Licence v3.0, free
      API key) and The Gazette notices data (Open Government Licence v3.0) for supplier risk checks.
  extensions:
  - key: inbound_supplier_email
    description: 'Not available yet: reading supplier replies from an inbox. For now suppliers reply to the sender address
      and the buyer enters each quote in the quote form (agents then score it).'
  - key: erp_p2p_oauth
    description: 'Not available yet: OAuth connection to the company''s ERP and purchase-to-pay system (orders, invoices,
      budgets). For now POs, savings and cycle times are entered in the app; budgets are checked by the budget holder.'
  - key: spend_tier_billing
    description: Plan is chosen by the customer; automatic tier selection from measured spend under management needs the ERP
      connection.
  - key: single_company_workspace
    description: 'Assumes one company per app deployment: suppliers, contracts and staff roles are not separated between different
      signed-up companies.'
