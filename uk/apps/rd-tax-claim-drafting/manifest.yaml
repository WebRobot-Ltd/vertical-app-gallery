apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: claimforge
  displayName: Claimforge
  tagline: R&D tax credit claims for UK tech companies, drafted from your engineering evidence and reviewed by your adviser.
  description: Claimforge turns commits, tickets and design discussions into HMRC-style technical narratives, a qualifying
    cost breakdown and the content for the additional information form. Engineers confirm the facts, the adviser reviews and
    approves, and files in their own software.
  langs:
  - en
  defaultLang: en
  timezone: Europe/London
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#0f2a43'
      accent: '#d9822b'
      background: '#f7f8fa'
      foreground: '#17212b'
    fonts:
      body: Inter
      display: Source Serif 4
    wordmark:
    - text: Claim
      color: primary
    - text: forge
      color: accent
    width: wide
  header:
    links:
    - label: How it works
      href: '#how'
    - label: Roles
      href: '#roles'
    - label: Pricing
      href: '#pricing'
    cta:
      label: Start a claim
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Claimforge admin
      assignedBy: admin_emails
    - key: company_admin
      label: Company admin
      assignedBy: signup
    - key: adviser
      label: Adviser
      assignedBy: derived
      from: collection:claims.adviser_email
    - key: engineer
      label: Engineer
      assignedBy: derived
      from:
      - collection:projects.engineer_email
      - collection:engineer_questions.engineer_email
  limits:
  - action: login
    per: ip
    max: 20
    window: hour
  - action: agent:analyst
    per: user
    max: 10
    window: day
  agents:
  - key: analyst
    role: main
    description: Reads the evidence from the connected engineering tools, groups it into projects, identifies the uncertainty,
      advance and work done, drafts the narratives, asks engineers to confirm facts and requests the adviser's sign-off.
    profile:
      inline:
        display_name: Claimforge analyst
        crews:
        - id: analyst
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 60
          max_budget_usd: 3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are an R&D tax relief analyst for UK technology companies. You work under the merged R&D relief
            scheme (accounting periods starting on or after 1 April 2024), HMRC''s R&D guidance and the CIRD manual. You prepare
            drafts for a regulated adviser, who reviews and approves everything. You never file anything with HMRC.


            Process:

            1. Call read_claim to load the claim (company, period, headcount, staff, subcontractor and cloud costs, project
            hints).

            2. Collect evidence for the accounting period with the tools github_api (repos, commits, pull requests: GET with
            a path such as /search/commits?q=... or /repos/{owner}/{repo}/pulls), linear_graphql (POST a GraphQL query in
            the body: issues, projects, cycles), jira_search (GET with query jql=...), slack_api (GET with a path such as
            /conversations.list or /conversations.history). If a tool says the user has not connected the service, continue
            with the others and say so in the report. Use only what comes back; never invent commits, tickets or quotes.

            3. Group the evidence into candidate R&D projects. For each project call add_project once with: name, claim_ref
            (the company name and period end), engineer_email (the lead engineer if the evidence names one, else empty), field
            (the area of science or technology), baseline (what was already known or readily deducible by a competent professional),
            uncertainty (the scientific or technological uncertainty: what could not be known or worked out in advance, and
            why), advance (the advance in overall knowledge or capability in the field sought, not just for the company),
            work_done (the systematic work to resolve it: hypotheses, experiments, prototypes, failures, iterations, with
            evidence references such as PR numbers and ticket ids), narrative (the technical narrative, 250-450 words, plain,
            accurate, written to HMRC guidance), evidence_refs, status (needs_engineer when facts need confirming, else ready_for_review).
            Exclude routine development, cosmetic changes, ordinary integration and work whose outcome was knowable; say what
            you excluded and why.

            4. For every fact you are not sure of, call add_question with the project name, the engineer''s email, and one
            short, concrete question (confirm or correct). Do not ask more than 5 questions per project.

            5. Call ask_cost_analyst with the claim context and the list of project names so the qualifying cost breakdown
            and additional information form content are prepared.

            6. Call update_claim with the status, an indicative estimated_benefit (a number in GBP; state the rate assumptions
            in the report, e.g. the 20% merged-scheme credit or the enhanced R&D-intensive relief if the company may qualify,
            and say plainly that the adviser must confirm eligibility, subcontractor and externally provided worker rules
            and tax position), the filing_deadline (two years after the period end, YYYY-MM-DD) and a short summary. Set status
            to adviser_review when drafts are ready.

            7. Call request_adviser_signoff once with the company name and a summary.


            Output a Markdown claim pack. The first line is a level-1 title: "# R&D claim pack — <company> — period ending
            <date>". Then ## Summary (projects, indicative benefit and the assumptions), ## Projects (each with ### name and
            its narrative), ## Excluded work, ## Open questions for engineers, ## Notes for the adviser. Add a chart block
            for the cost mix by category if figures exist:

            ```chart

            {"type":"pie","title":"Qualifying costs by category","labels":["A"],"series":[{"name":"GBP","values":[1]}],"unit":"GBP"}

            ```

            Never invent figures, never present eligibility or the benefit as certain, never give final tax advice. Write
            in English.'
    appTools:
    - name: read_claim
      description: Read the company's claim records
      action: read
      collection: claims
      scope: user
    - name: update_claim
      description: Update the claim's status, estimated benefit, deadline and summary
      action: write
      collection: claims
      scope: user
    - name: add_project
      description: Save a drafted R&D project
      action: append
      collection: projects
      scope: user
    - name: add_question
      description: Ask an engineer to confirm or correct a fact
      action: append
      collection: engineer_questions
      scope: user
    - name: github_api
      description: Call the GitHub REST API with the user's connected key
      action: http
      http:
        method: GET
        url: https://api.github.com
        allowPath: true
        headers:
          Accept: application/vnd.github+json
        credential:
          provider: github
          header: Authorization
          format: Bearer {secret}
        attribution: GitHub REST API
    - name: linear_graphql
      description: Run a GraphQL query on the user's Linear workspace
      action: http
      http:
        method: POST
        url: https://api.linear.app/graphql
        credential:
          provider: linear
          header: Authorization
          format: '{secret}'
        attribution: Linear API
    - name: jira_search
      description: Search the user's Jira issues with a JQL query
      action: http
      http:
        method: GET
        url: https://{host}/rest/api/3/search/jql
        credential:
          provider: jira
          header: Authorization
          format: Basic {secret}
        attribution: Jira Cloud API
    - name: slack_api
      description: Read channels and messages from the user's Slack workspace
      action: http
      http:
        method: GET
        url: https://slack.com/api
        allowPath: true
        credential:
          provider: slack
          header: Authorization
          format: Bearer {secret}
        attribution: Slack Web API
    delegates:
    - cost_analyst
    awaits:
    - adviser_signoff
    output: markdown
    limits:
      maxTurns: 60
      maxBudgetUsd: 3
  - key: cost_analyst
    role: helper
    description: Prepares the qualifying cost breakdown and the content for the HMRC additional information form.
    profile:
      inline:
        display_name: Claimforge cost analyst
        crews:
        - id: cost_analyst
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You prepare the qualifying expenditure breakdown and the additional information form content for
            a UK R&D claim under the merged scheme (periods starting on or after 1 April 2024), following HMRC guidance. Call
            read_claim and read_projects. From the figures the company supplied (staff costs, headcount, subcontractor costs,
            cloud costs) create cost lines with add_cost: category (staff, epw, subcontractor, software, cloud, consumables,
            other), description, amount (as supplied), qualifying_amount (the part you consider qualifying), basis (the rule
            applied and your assumptions, e.g. the proportion of time on R&D, the 65% restriction for unconnected subcontractors,
            cloud and data costs used directly in R&D, no overseas costs unless stated), status draft. Use only supplied figures;
            when a split is unknown, put the full amount in amount, leave qualifying_amount at 0 and say in basis what the
            adviser must confirm. Then call add_aif once per section of the additional information form (company and claim
            context, a section per project with the field of science or technology, the baseline, the uncertainty, the advance
            and the work done in the form''s length limits, and the cost summary), status draft. Never invent figures or facts.
            Reply with a short summary of the lines and open points.'
    appTools:
    - name: read_claim
      description: Read the company's claim records
      action: read
      collection: claims
      scope: user
    - name: read_projects
      description: Read the drafted R&D projects
      action: read
      collection: projects
      scope: user
    - name: add_cost
      description: Save a qualifying cost line
      action: append
      collection: costs
      scope: user
    - name: add_aif
      description: Save one section of the additional information form content
      action: append
      collection: aif_sections
      scope: user
    output: markdown
    limits:
      maxTurns: 25
      maxBudgetUsd: 1.5
  data:
    collections:
    - name: claims
      ownedBy: user
      description: One R&D claim per company accounting period
      fields:
      - name: company_name
        type: text
        label: Company name
        required: true
      - name: company_number
        type: text
        label: Companies House number
      - name: adviser_email
        type: email
        label: Your adviser's email
        required: true
      - name: period_start
        type: date
        label: Accounting period start
        required: true
      - name: period_end
        type: date
        label: Accounting period end
        required: true
      - name: projects_hint
        type: textarea
        label: Projects you think are R&D
        maxLength: 2000
        help: Names or short descriptions; the agents also find projects in your tools.
      - name: headcount
        type: number
        label: Headcount working on R&D
      - name: staff_costs
        type: number
        label: Staff costs in the period (GBP)
      - name: subcontractors
        type: textarea
        label: Subcontractors (names, what they did, connected or not)
        maxLength: 1500
      - name: subcontractor_costs
        type: number
        label: Subcontractor costs (GBP)
      - name: cloud_costs
        type: number
        label: Cloud and data costs (GBP)
      - name: status
        type: select
        label: Status
        options:
        - draft
        - evidence_gathering
        - drafting
        - engineer_review
        - adviser_review
        - approved
        - filed_by_adviser
        default: draft
      - name: estimated_benefit
        type: number
        label: Estimated benefit (GBP)
      - name: filing_deadline
        type: date
        label: Claim deadline
      - name: summary
        type: textarea
        label: Summary
      access:
      - role: adviser
        can:
        - read
        - write
    - name: projects
      ownedBy: user
      description: Drafted R&D projects with narratives
      fields:
      - name: name
        type: text
        label: Project
        required: true
      - name: claim_ref
        type: text
        label: Claim
      - name: engineer_email
        type: email
        label: Lead engineer
      - name: field
        type: text
        label: Field of science or technology
      - name: baseline
        type: textarea
        label: Baseline knowledge
      - name: uncertainty
        type: textarea
        label: Scientific or technological uncertainty
      - name: advance
        type: textarea
        label: Advance sought
      - name: work_done
        type: textarea
        label: Work done
      - name: narrative
        type: textarea
        label: Technical narrative
      - name: evidence_refs
        type: textarea
        label: Evidence references
      - name: status
        type: select
        label: Status
        options:
        - needs_engineer
        - ready_for_review
        - approved
        - rejected
        default: ready_for_review
      - name: adviser_notes
        type: textarea
        label: Adviser notes
      access:
      - role: adviser
        can:
        - read
        - write
      - role: engineer
        where:
          engineer_email: '{user.email}'
        can:
        - read
    - name: engineer_questions
      ownedBy: user
      description: Facts engineers are asked to confirm or correct
      fields:
      - name: project_name
        type: text
        label: Project
      - name: engineer_email
        type: email
        label: Engineer
        required: true
      - name: question
        type: textarea
        label: Question
      - name: answer
        type: textarea
        label: Your answer or correction
      - name: status
        type: select
        label: Your response
        options:
        - asked
        - confirmed
        - corrected
        default: asked
      access:
      - role: engineer
        where:
          engineer_email: '{user.email}'
        can:
        - read
        - write
      - role: adviser
        can:
        - read
    - name: costs
      ownedBy: user
      description: Qualifying cost breakdown
      fields:
      - name: category
        type: select
        label: Category
        options:
        - staff
        - epw
        - subcontractor
        - software
        - cloud
        - consumables
        - other
      - name: description
        type: text
        label: Description
      - name: amount
        type: number
        label: Amount (GBP)
      - name: qualifying_amount
        type: number
        label: Qualifying amount (GBP)
      - name: basis
        type: textarea
        label: Basis and assumptions
      - name: status
        type: select
        label: Status
        options:
        - draft
        - reviewed
        default: draft
      access:
      - role: adviser
        can:
        - read
        - write
    - name: aif_sections
      ownedBy: user
      description: Content for the HMRC additional information form
      fields:
      - name: section
        type: text
        label: Section
      - name: content
        type: textarea
        label: Content
      - name: status
        type: select
        label: Status
        options:
        - draft
        - reviewed
        default: draft
      access:
      - role: adviser
        can:
        - read
        - write
    credentials:
    - provider: github
      kind: api_key
      scope: user
      label: GitHub
      help: A fine-grained personal access token with read-only access to repositories (Settings > Developer settings).
    - provider: linear
      kind: api_key
      scope: user
      label: Linear
      help: A personal API key from Linear Settings > API.
    - provider: jira
      kind: api_key
      scope: user
      label: Jira
      help: Paste your email and an Atlassian API token as base64 of email:token.
      hostLabel: your-company.atlassian.net
    - provider: slack
      kind: api_key
      scope: user
      label: Slack
      help: A bot token (xoxb-) with channels:read and channels:history on the engineering channels.
  egress:
    hosts:
    - api.github.com
    - api.linear.app
    - slack.com
    - '*.atlassian.net'
    notes: Read-only access to the company's own engineering tools with keys the company connects. GitHub, Linear, Atlassian
      and Slack APIs, used on the customer's own data.
  approvals:
  - key: adviser_signoff
    title: Adviser sign-off on the claim pack
    description: The adviser reviews every narrative and the cost figures, edits and approves.
    role: adviser
    fields:
    - company_name
    - summary
  triggers:
  - key: start_analysis
    'on':
      collection: claims
      op: insert
      where:
        status: draft
    start:
      agent: analyst
    goal: 'New R&D claim for {record.company_name} (company number {record.company_number}), accounting period {record.period_start}
      to {record.period_end}. Adviser: {record.adviser_email}. Headcount {record.headcount}; staff costs {record.staff_costs};
      subcontractor costs {record.subcontractor_costs}; cloud costs {record.cloud_costs}. Subcontractors: {record.subcontractors}.
      Projects the company mentions: {record.projects_hint}. Follow your process, starting with read_claim. Write in English.
      Today is {date}.'
  - key: claim_fee
    'on':
      collection: claims
      op: insert
    charge:
      credits: 300
      reason: Fixed fee per R&D claim
  - key: ask_engineer
    'on':
      collection: engineer_questions
      op: insert
    notify:
      to: record.engineer_email
      subject: Please confirm a fact about project {record.project_name}
      body: 'Hello,


        Your company is preparing an R&D tax credit claim and we need you to confirm or correct a fact about the project {record.project_name}:


        {record.question}


        It takes a couple of minutes. Open the link, answer, and mark whether you confirm or correct it.'
      link: my_questions
  - key: ready_for_adviser
    'on':
      collection: claims
      op: update
      where:
        status: adviser_review
    notify:
      to:
      - record.adviser_email
      subject: 'Claim ready for review: {record.company_name}'
      body: The draft claim pack for {record.company_name} (period ending {record.period_end}) is ready. Please review every
        narrative and the cost figures, edit and approve. Filing with HMRC is done in your own software.
      link: dashboard
  - key: decided
    'on':
      approval: adviser_signoff
      decision: any
    notify:
      to: owner
      subject: Your adviser has reviewed your claim pack
      body: Your adviser has made a decision on your R&D claim pack. Open the app to see the status and any notes.
      link: claims
  - key: deadline_60
    'on':
      date:
        collection: claims
        field: filing_deadline
        offsetDays: -60
        hour: 8
    notify:
      to:
      - owner
      - record.adviser_email
      subject: 'R&D claim deadline in 60 days: {record.company_name}'
      body: 'The deadline to claim R&D relief for {record.company_name}, period ending {record.period_end}, is {record.filing_deadline}.
        Current status: {record.status}.'
      link: dashboard
  - key: deadline_14
    'on':
      date:
        collection: claims
        field: filing_deadline
        offsetDays: -14
        hour: 8
    notify:
      to:
      - owner
      - record.adviser_email
      subject: 'R&D claim deadline in 14 days: {record.company_name}'
      body: 'Only 14 days remain to claim R&D relief for {record.company_name}. The deadline is {record.filing_deadline}.
        Current status: {record.status}.'
      link: dashboard
  notifications:
    emailOnRunDone: true
  views:
  - key: home
    type: page
    title: Claimforge
    nav: false
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow: R&D tax credits for UK tech companies
      title: Turn your **engineering work** into a claim your adviser can sign off.
      text: Connect GitHub, Jira, Linear and Slack. Claimforge groups the evidence into projects, drafts HMRC-style technical
        narratives and the cost breakdown, asks your engineers to confirm the facts, and hands everything to your adviser.
      actions:
      - label: Start a claim
        href: /login
        style: primary
      - label: How it works
        href: '#how'
        style: ghost
      aside: '<div style="padding:16px"><strong>Example project</strong><p>Uncertainty: whether a streaming index could keep
        p99 latency under 50 ms at 10x volume.</p><p>Advance: a sharding approach not available in the field. Evidence: 14
        PRs, 9 tickets, 1 design thread.</p><em>Draft, reviewed by your adviser</em></div>'
    - type: steps
      id: how
      title: How it works
      items:
      - title: Tell us about the period
        text: 'A short form: accounting period, projects, headcount, staff, subcontractor and cloud costs, and your adviser.'
      - title: Evidence comes in
        text: Agents read commits, tickets and design discussions for the period and group them into candidate R&D projects.
      - title: Narratives and costs
        text: 'For each project: the uncertainty, the advance sought and the work done, following HMRC guidance and the CIRD
          manual under the merged scheme. A qualifying cost breakdown and the additional information form content come with
          them.'
      - title: Engineers confirm
        text: Engineers get an email asking them to confirm or correct specific facts about their projects.
      - title: Adviser approves
        text: The adviser reviews every narrative and cost figure, edits and approves, then files with HMRC in their own software.
    - type: cards
      id: roles
      title: Built for three roles
      items:
      - title: Company admin
        text: Starts claims, connects the engineering tools, sees status and estimated benefit.
      - title: Engineer
        text: Sees only their own projects and the questions addressed to them.
      - title: Adviser
        text: Sees every client company, reviews and approves, and tracks deadlines on one dashboard.
    - type: cards
      id: pricing
      title: Pricing
      items:
      - title: Fixed fee per claim
        text: A fixed price for each claim, paid with credits.
      - title: Adviser plans
        text: Monthly plans by number of client companies.
    - type: note
      content: 'Claimforge prepares drafts and indicative figures. It is decision support, not tax advice: the adviser is
        responsible for the claim, and filing with HMRC is done by the adviser outside the app.'
  - key: new_claim
    type: form
    title: New claim
    collection: claims
    fields:
    - company_name
    - company_number
    - adviser_email
    - period_start
    - period_end
    - projects_hint
    - headcount
    - staff_costs
    - subcontractors
    - subcontractor_costs
    - cloud_costs
    submit:
      label: Start the claim
      message: Claim started. The agents are gathering your evidence.
      redirect: claims
    roles:
    - company_admin
    - admin
  - key: dashboard
    type: page
    title: Dashboard
    roles:
    - adviser
    - company_admin
    - admin
    sections:
    - type: data
      title: Pipeline
      source: collection:claims
      display: kpi
      kpis:
      - label: Claims
        agg: count
      - label: Estimated benefit
        agg: sum
        field: estimated_benefit
        format: money
    - type: data
      title: Claims by status
      source: collection:claims
      display: chart
      chart: bar
      groupBy:
        field: status
        aggs:
        - key: benefit
          agg: sum
          field: estimated_benefit
      fields:
      - key: status
        label: Status
      - key: count
        label: Claims
      - key: benefit
        label: Estimated benefit
    - type: data
      title: Claims per client
      source: collection:claims
      display: table
      fields:
      - key: company_name
        label: Client
      - key: period_end
        label: Period end
        format: date
      - key: status
        label: Status
        format: badge
      - key: estimated_benefit
        label: Estimated benefit
        format: money
      - key: filing_deadline
        label: Deadline
        format: date
      sort:
        field: filing_deadline
        dir: asc
      limit: 100
      empty: No claims yet.
  - key: claims
    type: table
    title: Claims
    source: collection:claims
    columns:
    - company_name
    - period_end
    - status
    - estimated_benefit
    - filing_deadline
    export: true
    roles:
    - company_admin
    - adviser
    - admin
  - key: edit_claim
    type: form
    title: Update claim
    collection: claims
    fields:
    - status
    - estimated_benefit
    - summary
    edit: true
    submit:
      label: Save
      message: Claim updated.
      redirect: claims
    roles:
    - adviser
    - admin
    nav: false
  - key: projects
    type: table
    title: Projects and narratives
    source: collection:projects
    columns:
    - name
    - claim_ref
    - engineer_email
    - status
    - uncertainty
    - narrative
    roles:
    - adviser
    - company_admin
    - engineer
    - admin
  - key: edit_project
    type: form
    title: Review project
    collection: projects
    fields:
    - name
    - uncertainty
    - advance
    - work_done
    - narrative
    - status
    - adviser_notes
    edit: true
    submit:
      label: Save review
      message: Project saved.
      redirect: projects
    roles:
    - adviser
    - admin
    nav: false
  - key: costs
    type: table
    title: Qualifying costs
    source: collection:costs
    columns:
    - category
    - description
    - amount
    - qualifying_amount
    - basis
    - status
    export: true
    roles:
    - adviser
    - company_admin
    - admin
  - key: edit_cost
    type: form
    title: Review cost line
    collection: costs
    edit: true
    submit:
      label: Save
      message: Cost line saved.
      redirect: costs
    roles:
    - adviser
    - admin
    nav: false
  - key: aif
    type: table
    title: Additional information form
    source: collection:aif_sections
    columns:
    - section
    - content
    - status
    export: true
    roles:
    - adviser
    - company_admin
    - admin
  - key: edit_aif
    type: form
    title: Edit form section
    collection: aif_sections
    edit: true
    submit:
