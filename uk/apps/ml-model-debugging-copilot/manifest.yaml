apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: probewise
  displayName: Probewise
  tagline: Test and debug your ML models and pipelines, with a copilot that explains every failure.
  description: 'The web workspace for the Probewise SDK: projects, uploaded code and data samples, agent-written test plans,
    a pass/warn/fail scorecard, fix suggestions with code, lead approval before production, and a RAG assistant over your
    team''s own docs.'
  langs:
  - en
  defaultLang: en
  timezone: Europe/London
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1d2a44'
      accent: '#2f7d6d'
      background: '#f6f8fb'
      foreground: '#16202e'
    fonts:
      body: Inter
      display: Space Grotesk
      mono: JetBrains Mono
    wordmark:
    - text: Probe
      color: primary
    - text: wise
      color: accent
    tokens:
      pass: '#2e7d4f'
      warn: '#b26a00'
      fail: '#b3261e'
  header:
    links:
    - label: How it works
      href: '#how-it-works'
    - label: Tests
      href: '#tests'
    - label: Pricing
      href: '#pricing'
    cta:
      label: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: data_scientist
      label: Data scientist
      assignedBy: signup
    - key: reviewer
      label: Reviewer (lead)
      assignedBy: invite
  limits:
  - action: agent:planner
    per: user
    max: 5
    window: month
    plans:
      team: 200
  - action: chat
    per: user
    max: 50
    window: day
  - action: create:projects
    max: 1
    window: total
    plans:
      team: -1
  agents:
  - key: planner
    role: main
    description: Reviews uploaded code, data sample and metrics and writes the test plan.
    context:
    - key: project_name
      from: collection:projects.name
    - key: project_framework
      from: collection:projects.framework
    - key: project_description
      from: collection:projects.description
    goalTemplate: 'Project: {project_name} (framework: {project_framework}).

      {?project_description}Description: {project_description}{/project_description}

      Problem type: {problem_type_label}

      {?target}Target column: {target}{/target}

      {?segments}Segments to check for bias: {segments}{/segments}

      {?code}Code pasted by the user:

      {code}{/code}

      {?files_text}Text of the uploaded files:

      {files_text}{/files_text}

      {?data_sample_text}Training data sample:

      {data_sample_text}{/data_sample_text}

      {?metrics}Model metrics:

      {metrics}{/metrics}

      {?notes}Notes: {notes}{/notes}

      Today is {date}. Write the plan in English.'
    output: markdown
    writesTo:
      collection: test_plans
      parse: whole
    appTools:
    - name: read_upload
      description: Read a file the user uploaded (notebook, script, image)
      action: read_file
    profile:
      inline:
        display_name: Probewise test planner
        crews:
        - id: planner
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are a senior ML reliability engineer. You review ONLY the customer''s code, data sample and
            metrics provided in the goal or read with read_upload; never use outside data and never invent figures. Produce
            a test plan the Probewise SDK will run locally. Start with a level-1 title "# Test plan — <project name>". Sections
            (## headings): Summary of what you reviewed; Risks found by reading the code (point to files/lines when possible);
            Test plan. The Test plan is a table with columns: ID, Category, What is checked, How the SDK checks it, Pass /
            Warn / Fail thresholds. Cover these categories: data leakage (target leakage, train/test overlap, preprocessing
            fit on full data), drift between training and test sets, missing values, bias across segments, performance on
            edge cases. Thresholds must be justified from the metrics given; if you lack information say so and propose a
            default marked as an assumption. End with ## Open questions for the data scientist. Under 700 words.'
  - key: explainer
    role: helper
    description: Explains a failed test and proposes a fix with code.
    goalTemplate: 'A test failed in project "{record.project}".

      Test: {record.test} (category: {record.category})

      Result: {record.status}, metric {record.metric}, threshold {record.threshold}

      Details from the SDK: {record.details}

      Training/pipeline code may be found with the read_artifacts tool. Explain and propose a fix. Today is {date}.'
    output: markdown
    writesTo:
      collection: fixes
      parse: whole
    appTools:
    - name: read_artifacts
      description: Read the project's uploaded code, notebooks and data notes
      action: read
      collection: artifacts
      scope: user
    - name: read_upload
      description: Read a file the user uploaded (notebook, script, image)
      action: read_file
    profile:
      inline:
        display_name: Probewise failure explainer
        crews:
        - id: explainer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You explain why an ML test failed and how to fix it, using only the SDK result and the customer''s
            own code/data notes. Start with "# Fix — <test name>". Sections: ## What failed (plain words, with the numbers
            given), ## Likely cause (state your confidence; do not claim certainty without evidence in the code), ## Suggested
            fix (a Python code block the user can paste, minimal and commented), ## How to verify (what result the SDK should
            show after the fix). Never invent figures or file contents.'
  - key: assistant
    role: helper
    description: RAG assistant answering from the team's own docs.
    goalTemplate: 'Conversation so far:

      {history}


      New question from {user}: {message}

      Answer in English using the team''s docs.'
    output: markdown
    appTools:
    - name: search_docs
      description: Search the team's own documents (title and content)
      action: search
      collection: docs
      scope: user
    - name: read_upload
      description: Read a file attached to a doc
      action: read_file
    profile:
      inline:
        display_name: Probewise docs assistant
        chat_mode: true
        crews:
        - id: assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You answer questions about the team's ML standards, model cards and runbooks. ALWAYS call search_docs
            first (and read_upload for attached files) and answer only from what you find, citing the doc title. If the docs
            do not cover it, say so plainly and offer general guidance clearly marked as not from the team's docs. Be concise;
            use code blocks for code.
  - key: release_gate
    role: helper
    description: Prepares the evidence for a production release, asks a reviewer to approve, and records the decision.
    awaits:
    - model_release
    goalTemplate: '{event}

      Project record: {record.name}. Release requested: {record.release_requested}. Release note: {record.release_note}. If
      an approval decision is present in the event, record it; otherwise compile the evidence and request approval. Today
      is {date}.'
    output: markdown
    appTools:
    - name: read_results
      description: Read the project's SDK test results
      action: read
      collection: test_results
      scope: user
    - name: read_project
      description: Read the projects
      action: read
      collection: projects
      scope: user
    - name: set_project
      description: Update a project's status and release flag
      action: write
      collection: projects
      scope: user
    - name: log_decision
      description: Append a line to the approval log
      action: append
      collection: approval_log
      scope: user
    profile:
      inline:
        display_name: Probewise release gate
        crews:
        - id: release_gate
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You run the production-readiness gate for one project. Case 1 (a release was requested, no decision
            yet): read the project''s results with read_results, count pass/warn/fail per category, list every open fail and
            warn, then call request_model_release with a short evidence summary and a recommendation (approve only if there
            are no fails). Never approve or mark ready yourself. Case 2 (the event carries an approval decision): if approved,
            call set_project with status ready_for_production and release_requested false; if rejected or timed out, set status
            in_testing and release_requested false. In both cases call log_decision once with project, decision, decided_by,
            decided_at (from the event), the reviewer''s comment and a one-line evidence summary. Start your final message
            with "# Release decision — <project>". Never invent results.'
  - key: digester
    role: scheduled
    description: Weekly summary of open issues for one project.
    goalTemplate: Write the weekly open-issues summary for project "{project}". Today is {date}. Use the tools to read the
      test results and fixes of that project only.
    output: markdown
    appTools:
    - name: read_results
      description: Read the project's SDK test results
      action: read
      collection: test_results
      scope: user
    - name: read_fixes
      description: Read the suggested fixes
      action: read
      collection: fixes
      scope: user
    profile:
      inline:
        display_name: Probewise weekly digest
        crews:
        - id: digester
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You summarise a project''s open ML test issues for a weekly email. Start with "# <project> — open
            issues, week of <date>". Sections: ## Scorecard (counts of pass/warn/fail), ## Open failures (test, category,
            one line on the suggested fix), ## Warnings, ## Next steps. Plain text friendly, under 250 words. Use only data
            from the tools; if there are no results say so.'
  templates:
  - key: weekly_digest
    title: Weekly digest
    description: A weekly email summarising the open issues of one project.
    agent: digester
    params:
    - name: project
      type: select
      required: true
      label: Project
      optionsFrom: collection:projects
    goal: Write the weekly open-issues summary for project "{project}". Today is {date}.
    schedule:
      cron: 0 7 * * 1
      userCanChange: true
    maxPerUser: 10
    deliver:
      to: owner
      subject: Probewise weekly digest — {title}
      onlyIfNew: true
  inputForm:
    title: New test plan
    fields:
    - name: project
      type: select
      required: true
      label: Project
      optionsFrom: collection:projects
    - name: problem_type
      type: select
      required: true
      label: Problem type
      options:
      - value: classification
        label: Classification
      - value: regression
        label: Regression
      - value: ranking
        label: Ranking / recommendation
      - value: forecasting
        label: Forecasting
      - value: nlp
        label: NLP / LLM
      - value: other
        label: Other
    - name: target
      type: text
      label: Target column
    - name: segments
      type: text
      label: Segments to check for bias
      help: e.g. age band, region, gender
    - name: files
      type: file
      label: Notebooks and code
      accept:
      - json
      - txt
      - md
      maxMb: 15
      multiple: true
      help: Notebooks (.ipynb saved as .json) and Python files renamed to .txt
    - name: code
      type: textarea
      maxLength: 8000
      label: Or paste code
    - name: data_sample
      type: file
      label: Training data sample
      accept:
      - csv
      - xlsx
      maxMb: 15
    - name: metrics
      type: textarea
      maxLength: 3000
      label: Model metrics
      help: e.g. AUC 0.91 train, 0.84 test
    - name: notes
      type: textarea
      maxLength: 600
      label: Notes (optional)
  data:
    collections:
    - name: projects
      ownedBy: user
      description: ML projects. members lists teammates' emails who share the project.
      fields:
      - name: name
        type: text
        required: true
        label: Project name
      - name: description
        type: textarea
        label: Description
      - name: framework
        type: select
        label: Framework
        options:
        - scikit-learn
        - PyTorch
        - TensorFlow
        - XGBoost
        - Spark ML
        - Other
      - name: sdk_connected
        type: boolean
        label: SDK connected
      - name: members
        type: array
        label: Team members (emails)
      - name: status
        type: select
        default: draft
        label: Status
        options:
        - draft
        - in_testing
        - ready_for_production
        - blocked
      - name: release_requested
        type: boolean
        label: Request production release
      - name: release_note
        type: textarea
        label: Release note
      access:
      - role: data_scientist
        where:
          members: '{user.email}'
        can:
        - read
        - write
      - role: reviewer
    - name: artifacts
      ownedBy: user
      description: Uploaded notebooks, code, data samples and metrics
      fields:
      - name: project
        type: select
        required: true
        label: Project
        optionsFrom: collection:projects
      - name: kind
        type: select
        label: Kind
        options:
        - notebook
        - code
        - data_sample
        - metrics
      - name: title
        type: text
        required: true
        label: Title
      - name: file
        type: file
        label: File
        accept:
        - json
        - txt
        - md
        - csv
        - xlsx
        - pdf
        maxMb: 15
      - name: content
        type: textarea
        label: Or paste content
      access:
      - role: reviewer
      retentionDays: 365
    - name: test_plans
      ownedBy: user
      description: Test plans written by the planner agent
      fields:
      - name: project
        type: text
      - name: title
        type: text
      - name: content
        type: textarea
      access:
      - role: reviewer
    - name: test_results
      ownedBy: user
      description: Results posted by the Probewise SDK
      fields:
      - name: project
        type: text
        required: true
      - name: test
        type: text
        required: true
      - name: category
        type: select
        options:
        - leakage
        - drift
        - missing_values
        - bias
        - edge_cases
        - other
      - name: status
        type: select
        required: true
        options:
        - pass
        - warn
        - fail
      - name: metric
        type: number
      - name: threshold
        type: number
      - name: details
        type: textarea
      - name: run_at
        type: date
      access:
      - role: reviewer
    - name: fixes
      ownedBy: user
      description: Failure explanations and fixes with code
      fields:
      - name: project
        type: text
      - name: title
        type: text
      - name: content
        type: textarea
      access:
      - role: reviewer
    - name: approval_log
      ownedBy: user
      description: Every production approval decision
      fields:
      - name: project
        type: text
      - name: decision
        type: text
      - name: decided_by
        type: text
      - name: decided_at
        type: date
      - name: comment
        type: textarea
      - name: evidence
        type: textarea
      access:
      - role: reviewer
    - name: docs
      ownedBy: user
      description: The team's own docs used by the assistant
      fields:
      - name: title
        type: text
        required: true
        label: Title
      - name: content
        type: textarea
        label: Content
      - name: file
        type: file
        label: Attachment
        accept:
        - pdf
        - docx
        - md
        - txt
        maxMb: 15
      searchable: true
  views:
  - key: home
    type: page
    title: Probewise
    nav: false
    sections:
    - type: hero
      title: Test and debug your **ML models** before they ship.
      text: Probewise runs inside your IDE and notebooks. This workspace plans the tests, shows the scorecard, explains each
        failure with a fix, and gates production behind a lead's approval.
      actions:
      - label: Get started
        href: /login
        style: primary
      note: Your code and data only. Free for one user.
    - type: steps
      id: how-it-works
      title: How it works
      items:
      - title: Create a project
        text: Connect the SDK or upload notebooks, Python files, a data sample and metrics.
        badge: '1'
      - title: Get a test plan
        text: An agent reviews your code and data and plans the tests.
        badge: '2'
      - title: Read the scorecard
        text: The SDK posts results; each failure gets an explanation and a code fix.
        badge: '3'
      - title: Approve for production
        text: A lead approves; every decision is logged.
        badge: '4'
    - type: cards
      id: tests
      title: What gets tested
      items:
      - title: Data leakage
        text: Target leakage, train/test overlap, preprocessing fitted on all data.
        badge: 🔎
      - title: Drift
        text: Distribution shift between training and test sets.
        badge: 📈
      - title: Missing values
        text: Gaps, bad imputation, silent nulls.
        badge: 🧩
      - title: Bias across segments
        text: Performance gaps between groups.
        badge: ⚖️
      - title: Edge cases
        text: Rare and extreme inputs.
        badge: 🧪
    - type: cards
      id: pricing
      title: Pricing
      items:
      - title: Free
        text: One user, one project.
      - title: Team — £49 per user / month
        text: Unlimited projects, shared projects, lead approvals, weekly digests.
      - title: Enterprise
        text: On request — contact us.
    - type: note
      content: Probewise gives decision support for model quality; it does not replace your own review. Only your own code
        and data are analysed.
  - key: projects
    type: cards
    title: Projects
    source: collection:projects
    roles:
    - data_scientist
    - admin
    - reviewer
    data:
      display: cards
      fields:
      - key: name
        label: Project
      - key: framework
        label: Framework
      - key: status
        label: Status
        format: badge
      - key: sdk_connected
        label: SDK
      sort:
        field: name
        dir: asc
  - key: new_project
    type: form
    title: New project
    collection: projects
    fields:
    - name
    - description
    - framework
    - sdk_connected
    - members
    submit:
      label: Create project
      message: Project created.
      redirect: projects
    roles:
    - data_scientist
    - admin
  - key: edit_project
    type: form
    title: Edit project
    collection: projects
    fields:
    - name
    - description
    - framework
    - sdk_connected
    - members
    edit: true
    nav: false
    submit:
      label: Save
      redirect: projects
    roles:
    - data_scientist
    - admin
  - key: add_files
    type: form
    title: Upload code and data
    collection: artifacts
    submit:
      label: Upload
      message: Saved.
      redirect: new_plan
    roles:
    - data_scientist
    - admin
  - key: new_plan
    type: new_run
    title: New test plan
    roles:
    - data_scientist
    - admin
  - key: plans
    type: history
    title: My test plans
    source: run
    roles:
    - data_scientist
    - admin
    - reviewer
  - key: plan
    type: report
    title: Test plan
    source: run
    printable: true
    nav: false
  - key: scorecard
    type: page
    title: Scorecard
    roles:
    - data_scientist
    - admin
    - reviewer
    sections:
    - type: data
      title: Results by status
      source: collection:test_results
      display: chart
      chart: bar
      fields:
      - key: status
        label: Status
      - key: count
        label: Tests
      groupBy:
        field: status
        aggs: []
    - type: data
      title: All tests
      source: collection:test_results
      display: table
      fields:
      - key: project
        label: Project
      - key: test
        label: Test
      - key: category
        label: Category
        format: badge
      - key: status
        label: Result
        format: badge
      - key: metric
        label: Metric
        format: number
      - key: threshold
        label: Threshold
        format: number
      - key: run_at
        label: Run
        format: date
      sort:
        field: run_at
        dir: desc
      limit: 100
      empty: No results yet. Connect the SDK and run the plan.
    - type: data
      title: Fixes and explanations
      source: collection:fixes
      display: list
      fields:
      - key: project
        label: Project
      - key: title
        label: Fix
      - key: content
        label: Details
      limit: 50
      empty: No failures to explain.
  - key: request_release
    type: form
    title: Request production release
    collection: projects
    fields:
    - release_requested
    - release_note
    edit: true
    submit:
      label: Send to reviewers
      message: Release requested. A reviewer will decide.
    roles:
    - data_scientist
    - admin
    nav: false
  - key: release_approvals
    type: approvals
    title: Approvals
    approvals:
    - model_release
    roles:
    - reviewer
    - admin
  - key: audit
    type: table
    title: Approval log
    source: collection:approval_log
    export: true
    roles:
    - reviewer
    - admin
    - data_scientist
    data:
      display: table
      fields:
      - key: project
        label: Project
      - key: decision
        label: Decision
        format: badge
      - key: decided_by
        label: Decided by
      - key: decided_at
        label: When
        format: date
      - key: comment
        label: Comment
      sort:
        field: decided_at
        dir: desc
  - key: add_doc
    type: form
    title: Add a doc
    collection: docs
    submit:
      label: Save doc
      message: Doc saved.
    roles:
    - data_scientist
    - admin
  - key: ask
    type: chat
    title: Ask the docs
    source: agent:assistant
    examples:
    - What is our policy for handling PII in training data?
    - How do we validate a model before release?
    placeholder: Ask about your team's docs…
    roles:
    - data_scientist
    - admin
    - reviewer
  - key: digests
    type: instances
    template: weekly_digest
    title: Weekly digests
    roles:
    - data_scientist
    - admin
  - key: account
    type: account
    title: Plan
    roles:
    - data_scientist
    - admin
  triggers:
  - key: sdk_results
    description: The SDK posts a test result
    'on':
      webhook: true
    write:
      collection: test_results
      fields:
        project: project
        test: test
        category: category
        status: status
        metric: metric
        threshold: threshold
        details: details
        run_at: run_at
      keyBy: test
  - key: explain_failure
    'on':
      collection: test_results
      op: insert
      where:
        status: fail
    start:
      agent: explainer
    goal: Explain the failed test "{record.test}" of project "{record.project}" and suggest a fix with code.
  - key: release_notify
    'on':
      collection: projects
      op: update
      where:
        release_requested: true
    notify:
      to: role:reviewer
      subject: 'Release approval requested: {record.name}'
      body: '{record.name} is waiting for your decision before going to production.'
      link: release_approvals
  - key: release_request
    'on':
      collection: projects
      op: update
      where:
        release_requested: true
    start:
      agent: release_gate
    goal: A production release was requested for project {record.name}. Compile the evidence from the test results and request
      approval.
  - key: release_decided
    'on':
      approval: model_release
      decision: any
    start:
      agent: release_gate
    goal: 'The approval model_release was decided. Event: {event}. Update the project and write the approval log.'
  approvals:
  - key: model_release
    title: Approve model for production
    description: A lead approves that the model can be marked ready for production. Each decision is logged.
    role: reviewer
    decidedBy: role
    timeoutMinutes: 10080
    onTimeout: reject
  notifications:
    emailOnRunDone: true
  billing:
    modes:
    - subscription
