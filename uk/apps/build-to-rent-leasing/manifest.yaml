apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: tenantide
  displayName: Tenantide
  tagline: Lease-up for build-to-rent, from first enquiry to move-in.
  description: Tenantide captures every enquiry, answers and qualifies leads with an AI leasing agent, books viewings, chases
    applications, routes offers to the leasing manager for approval and schedules move-in.
  langs:
  - en
  defaultLang: en
  timezone: Europe/London
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#1f3a5f'
      accent: '#e07a3f'
      background: '#f7f5f1'
      foreground: '#1c2430'
    fonts:
      body: Inter
      display: DM Serif Display
    wordmark:
    - text: Tenant
      color: primary
    - text: ide
      color: accent
    width: wide
  header:
    links:
    - label: How it works
      href: '#how'
    - label: Pricing
      href: '#pricing'
    cta:
      label: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Platform admin
      assignedBy: admin_emails
    - key: operator
      label: Operator admin
      assignedBy: signup
    - key: leasing_manager
      label: Leasing manager
      assignedBy: derived
      from: collection:buildings.manager_email
    - key: leasing_agent
      label: Leasing agent
      assignedBy: derived
      from: collection:buildings.agent_email
  limits:
  - action: create:buildings
    max: 1
    window: total
    plans:
      starter: 1
      growth: 5
      scale: -1
  - action: create:units
    max: 20
    window: total
    plans:
      starter: 50
      growth: 250
      scale: -1
  - action: chat
    per: user
    max: 200
    window: day
  agents:
  - key: concierge
    role: main
    description: Answers questions about the buildings, qualifies each lead and proposes viewing slots.
    profile:
      inline:
        display_name: Tenantide leasing concierge
        crews:
        - id: concierge
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the leasing concierge of a build-to-rent operator. Answer questions about buildings, units,
            rent, availability and floor plans ONLY from the data returned by your tools; never invent rents, dates, fees
            or policies, and say you will check with the team when unsure. For each lead qualify politely, one or two questions
            at a time: monthly budget, desired move-in date, household size, household income, preferred contact channel (email,
            SMS, WhatsApp or phone). Save what you learn with save_lead and set the stage (new, qualified, viewing_booked,
            lost). Offer two or three viewing slots inside the building''s viewing_hours, and once the lead agrees record
            it with save_viewing (the platform then sends the confirmation and reminder emails). Copy manager_email and agent_email
            from the building onto every lead and viewing you save. Do not discuss other tenants, give legal advice or promise
            a unit before the manager approves an offer. If the lead asks for a person, set stage to handover in notes and
            say a team member will follow up. Keep replies short and friendly; reply in the language with ISO code given in
            the goal.'
    goalTemplate: 'Conversation so far:

      {history}

      New message from {user}: {message}

      Today is {date}. Reply in the language with ISO code {lang}.'
    appTools:
    - name: read_buildings
      description: List buildings with address, amenities and viewing hours
      action: read
      collection: buildings
      scope: all
    - name: search_units
      description: Search units by building, bedrooms, rent, availability
      action: search
      collection: units
      scope: all
    - name: search_leads
      description: Search leads
      action: search
      collection: leads
      scope: all
    - name: save_lead
      description: Create or update a lead with the qualification data
      action: write
      collection: leads
      scope: all
    - name: save_viewing
      description: Record a viewing booked with a lead
      action: write
      collection: viewings
      scope: all
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.4
  - key: applications
    role: helper
    description: After a viewing sends the application link, chases missing documents, passes the file to referencing and
      asks the manager to approve the offer.
    awaits:
    - offer_approval
    profile:
      inline:
        display_name: Tenantide applications agent
        crews:
        - id: applications
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You move a lead from viewing to offer. Create an application record with save_application (status
            sent, the unit, rent, a short note with the application link placeholder APPLICATION_LINK that the team replaces).
            List the documents still missing (ID, proof of income, previous landlord reference) in missing_docs and set status
            docs_missing; the platform emails the applicant. When nothing is missing set status referencing so the file goes
            to referencing. When referencing is clear, call request_offer_approval with unit, rent and holding deposit and
            wait for the manager. Never approve anything yourself and never invent referencing results.
    appTools:
    - name: search_leads
      description: Search leads
      action: search
      collection: leads
      scope: all
    - name: search_units
      description: Search units by building, bedrooms, rent, availability
      action: search
      collection: units
      scope: all
    - name: read_applications
      description: List applications
      action: read
      collection: applications
      scope: all
    - name: save_application
      description: Create or update an application
      action: write
      collection: applications
      scope: all
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.4
  - key: onboarder
    role: helper
    description: After the offer is approved, creates the tenancy and schedules the move-in tasks.
    profile:
      inline:
        display_name: Tenantide move-in agent
        crews:
        - id: onboarder
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: An offer was approved. Create the tenancy with save_tenancy (tenant, unit, rent, deposit, listed_date,
            let_date today, move_in_date, days_to_let = let_date minus listed_date), mark the unit let with save_unit, set
            the lead stage to let with save_lead, and add move-in tasks with add_task (sign tenancy agreement, receive first
            rent and deposit, utilities and council tax, inventory and keys, welcome pack), each with a due_date relative
            to move-in and an owner_email. Use only dates present in the records; if the move-in date is missing, ask the
            manager in the report instead of guessing. End with a short summary.
    appTools:
    - name: search_leads
      description: Search leads
      action: search
      collection: leads
      scope: all
    - name: save_lead
      description: Create or update a lead with the qualification data
      action: write
      collection: leads
      scope: all
    - name: read_applications
      description: List applications
      action: read
      collection: applications
      scope: all
    - name: save_tenancy
      description: Create or update a tenancy
      action: write
      collection: tenancies
      scope: all
    - name: save_unit
      description: Update a unit (status, availability)
      action: write
      collection: units
      scope: all
    - name: add_task
      description: Add a move-in task
      action: append
      collection: movein_tasks
      scope: all
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.4
  channels:
  - key: portal_email
    type: email
    agent: concierge
    greeting: Thanks for your enquiry. Tell us your budget, move-in date and household size and we will suggest viewing times.
  - key: phone_line
    type: phone
    agent: concierge
    greeting: Hello, you have reached the leasing team. How can I help?
    language: en
  data:
    collections:
    - name: buildings
      ownedBy: user
      description: The operator's buildings and the team assigned to each
      fields:
      - name: name
        type: text
        required: true
        label: Building name
      - name: address
        type: text
        required: true
      - name: city
        type: city
      - name: amenities
        type: textarea
      - name: viewing_hours
        type: text
        label: Viewing hours
        help: e.g. Mon-Sat 10:00-18:00
      - name: manager_email
        type: email
        label: Leasing manager email
      - name: agent_email
        type: email
        label: Leasing agent email
    - name: units
      ownedBy: user
      description: Units with rent, availability and floor plans
      fields:
      - name: building
        type: text
        required: true
      - name: unit_ref
        type: text
        required: true
        label: Unit
      - name: bedrooms
        type: number
      - name: rent
        type: number
        required: true
        label: Monthly rent
      - name: available_from
        type: date
      - name: status
        type: select
        options:
        - available
        - reserved
        - let
        default: available
      - name: floor_plan
        type: file
        accept:
        - pdf
        - png
        - jpg
        maxMb: 10
      - name: manager_email
        type: email
      - name: agent_email
        type: email
      access:
      - role: leasing_manager
        where:
          manager_email: '{user.email}'
        can:
        - read
        - write
      - role: leasing_agent
        where:
          agent_email: '{user.email}'
        can:
        - read
    - name: leads
      ownedBy: user
      description: Every enquiry, whatever the channel
      fields:
      - name: name
        type: text
        required: true
      - name: email
        type: email
      - name: phone
        type: text
      - name: source
        type: select
        options:
        - website
        - portal
        - whatsapp
        - phone
        - referral
        - walk_in
        required: true
      - name: campaign
        type: text
      - name: building
        type: text
      - name: budget
        type: number
        label: Monthly budget
      - name: move_date
        type: date
      - name: household_size
        type: number
      - name: income
        type: number
        label: Household income
      - name: preferred_contact
        type: select
        options:
        - email
        - sms
        - whatsapp
        - phone
      - name: stage
        type: select
        options:
        - new
        - qualified
        - viewing_booked
        - viewed
        - applied
        - referencing
        - offer
        - let
        - lost
        default: new
      - name: notes
        type: textarea
      - name: manager_email
        type: email
      - name: agent_email
        type: email
      access:
      - role: leasing_manager
        where:
          manager_email: '{user.email}'
        can:
        - read
        - write
      - role: leasing_agent
        where:
          agent_email: '{user.email}'
        can:
        - read
        - write
      retentionDays: 730
    - name: viewings
      ownedBy: user
      description: Viewings and the team's feedback
      fields:
      - name: lead_name
        type: text
        required: true
      - name: lead_email
        type: email
      - name: phone
        type: text
      - name: building
        type: text
      - name: unit_ref
        type: text
      - name: start
        type: date
        required: true
        label: Viewing date and time
      - name: status
        type: select
        options:
        - scheduled
        - done
        - no_show
        - cancelled
        default: scheduled
      - name: feedback
        type: textarea
      - name: outcome
        type: select
        options:
        - interested
        - undecided
        - not_interested
      - name: manager_email
        type: email
      - name: agent_email
        type: email
      access:
      - role: leasing_manager
        where:
          manager_email: '{user.email}'
        can:
        - read
        - write
      - role: leasing_agent
        where:
          agent_email: '{user.email}'
        can:
        - read
        - write
    - name: applications
      ownedBy: user
      description: Applications, documents and referencing
      fields:
      - name: lead_name
        type: text
        required: true
      - name: lead_email
        type: email
      - name: building
        type: text
      - name: unit_ref
        type: text
      - name: rent
        type: number
      - name: deposit
        type: number
        label: Holding deposit
      - name: status
        type: select
        options:
        - sent
        - docs_missing
        - referencing
        - offer
        - approved
        - declined
        default: sent
      - name: missing_docs
        type: textarea
      - name: manager_email
        type: email
      - name: agent_email
        type: email
      access:
      - role: leasing_manager
        where:
          manager_email: '{user.email}'
        can:
        - read
        - write
      - role: leasing_agent
        where:
          agent_email: '{user.email}'
        can:
        - read
        - write
    - name: tenancies
      ownedBy: user
      description: 'Let units: basis for time to let and move-in'
      fields:
      - name: tenant_name
        type: text
      - name: tenant_email
        type: email
      - name: building
        type: text
      - name: unit_ref
        type: text
      - name: rent
        type: number
      - name: deposit
        type: number
      - name: listed_date
        type: date
      - name: let_date
        type: date
      - name: move_in_date
        type: date
      - name: days_to_let
        type: number
      - name: manager_email
        type: email
      access:
      - role: leasing_manager
        where:
          manager_email: '{user.email}'
        can:
        - read
        - write
    - name: movein_tasks
      ownedBy: user
      description: Move-in checklist
      fields:
      - name: tenant_name
        type: text
      - name: task
        type: text
        required: true
      - name: due_date
        type: date
      - name: status
        type: select
        options:
        - todo
        - done
        default: todo
      - name: owner_email
        type: email
      access:
      - role: leasing_manager
        where:
          owner_email: '{user.email}'
        can:
        - read
        - write
      - role: leasing_agent
        where:
          owner_email: '{user.email}'
        can:
        - read
        - write
    - name: campaigns
      ownedBy: user
      description: Marketing campaigns and their results
      fields:
      - name: name
        type: text
        required: true
      - name: channel
        type: select
        options:
        - portal
        - social
        - search
        - email
        - offline
      - name: spend
        type: number
      - name: leads
        type: number
      - name: viewings
        type: number
      - name: lets
        type: number
  views:
  - key: home
    type: page
    title: Tenantide
    nav: false
    sections:
    - type: hero
      layout: stack
      band: true
      eyebrow: Build-to-rent lease-up
      title: From first enquiry to **move-in**, on one platform.
      text: Capture every lead, answer instantly, book viewings, chase documents and get offers approved, with an AI leasing
        agent working beside your team.
      actions:
      - label: Get started
        href: /login
        style: primary
      - label: How it works
        href: '#how'
        style: ghost
    - type: steps
      id: how
      title: How it works
      items:
      - title: Capture
        text: Website form, listing-portal emails, calls and messages all become leads in one pipeline.
      - title: Qualify and book
        text: The agent answers questions, asks budget, move date, household size and income, and offers viewing slots.
      - title: Apply and approve
        text: After the viewing it sends the application link, chases documents, passes the file to referencing and asks your
          manager to approve the offer.
      - title: Move in
        text: Tenancy, move-in tasks and welcome emails are created automatically.
    - type: cards
      id: pricing
      title: Pricing
      intro: A monthly fee per building plus a tier by number of units.
      items:
      - title: Starter
        text: 1 building, up to 50 units.
        badge: €149/mo
      - title: Growth
        text: Up to 5 buildings, 250 units.
        badge: €399/mo
      - title: Scale
        text: Unlimited buildings and units.
        badge: €899/mo
    - type: note
      content: Tenantide supports leasing decisions; referencing outcomes and tenancy terms remain the operator's responsibility.
  - key: assistant
    type: chat
    title: Leasing assistant
    source: agent:concierge
    examples:
    - Which 2-bed units are available next month?
    - Summarise today's new leads
    - Suggest viewing slots for a lead who wants to move on 1 January
    placeholder: Ask about units, leads or viewings
    roles:
    - operator
    - leasing_manager
    - leasing_agent
    - admin
  - key: pipeline
    type: table
    title: Lead pipeline
    source: collection:leads
    export: true
    data:
      display: table
      fields:
      - key: name
        label: Lead
      - key: stage
        label: Stage
        format: badge
      - key: source
        label: Source
        format: badge
      - key: building
        label: Building
      - key: budget
        label: Budget
        format: money
      - key: move_date
        label: Move date
        format: date
      - key: household_size
        label: Household
      - key: preferred_contact
        label: Prefers
      - key: phone
        label: Phone
      sort:
        field: move_date
        dir: asc
      limit: 200
      actions:
      - type: call
        field: phone
        label: Call
    roles:
    - operator
    - leasing_manager
    - leasing_agent
    - admin
  - key: add_lead
    type: form
    title: Add a lead
    collection: leads
    submit:
      label: Save lead
      message: Lead saved. The agent will qualify it.
      redirect: pipeline
    roles:
    - operator
    - leasing_manager
    - leasing_agent
  - key: edit_lead
    type: form
    title: Edit lead
    collection: leads
    edit: true
    submit:
      label: Update
      redirect: pipeline
    nav: false
    roles:
    - operator
    - leasing_manager
    - leasing_agent
  - key: log_viewing
    type: form
    title: Add a viewing
    collection: viewings
    submit:
      label: Save viewing
      message: Viewing saved. The lead receives a confirmation.
      redirect: viewings
    roles:
    - operator
    - leasing_manager
    - leasing_agent
  - key: viewings
    type: table
    title: Viewings
    source: collection:viewings
    data:
      display: table
      fields:
      - key: lead_name
        label: Lead
      - key: building
        label: Building
      - key: unit_ref
        label: Unit
      - key: start
        label: When
        format: date
      - key: status
        label: Status
        format: badge
      - key: outcome
        label: Outcome
        format: badge
      sort:
        field: start
        dir: desc
      actions:
      - type: calendar
        title: lead_name
        start: start
        location: building
        label: Add to calendar
      - type: call
        field: phone
        label: Call
    roles:
    - operator
    - leasing_manager
    - leasing_agent
  - key: viewing_feedback
    type: form
    title: Viewing feedback
    collection: viewings
    edit: true
    fields:
    - status
    - feedback
    - outcome
    submit:
      label: Save feedback
      message: Feedback saved.
      redirect: viewings
    nav: false
    roles:
    - operator
    - leasing_manager
    - leasing_agent
  - key: applications_list
    type: table
    title: Applications
    source: collection:applications
    data:
      display: table
      fields:
      - key: lead_name
        label: Applicant
      - key: unit_ref
        label: Unit
      - key: rent
        label: Rent
        format: money
      - key: deposit
        label: Deposit
        format: money
      - key: status
        label: Status
        format: badge
      - key: missing_docs
        label: Missing documents
    roles:
    - operator
    - leasing_manager
    - leasing_agent
  - key: offers
    type: approvals
    title: Offers to approve
    approvals:
    - offer_approval
    roles:
    - leasing_manager
    - admin
  - key: add_building
    type: form
    title: Add a building
    collection: buildings
    submit:
      label: Save building
      redirect: buildings
    roles:
    - operator
  - key: buildings
    type: table
    title: Buildings
    source: collection:buildings
    data:
      display: table
      fields:
      - key: name
        label: Building
      - key: address
        label: Address
      - key: viewing_hours
        label: Viewing hours
      - key: manager_email
        label: Manager
      - key: agent_email
        label: Agent
      actions:
      - type: directions
        field: address
        label: Directions
    roles:
    - operator
  - key: add_unit
    type: form
    title: Add a unit
    collection: units
    submit:
      label: Save unit
      redirect: units
    roles:
    - operator
    - leasing_manager
  - key: units
    type: table
    title: Units
    source: collection:units
    export: true
    data:
      display: table
      fields:
      - key: building
        label: Building
      - key: unit_ref
        label: Unit
      - key: bedrooms
        label: Beds
      - key: rent
        label: Rent
        format: money
      - key: available_from
        label: Available
        format: date
      - key: status
        label: Status
        format: badge
      limit: 200
    roles:
    - operator
    - leasing_manager
    - leasing_agent
  - key: add_campaign
    type: form
    title: Add a campaign
    collection: campaigns
    submit:
      label: Save campaign
      redirect: insights
    roles:
    - operator
    - leasing_manager
  - key: tasks
    type: table
    title: Move-in tasks
    source: collection:movein_tasks
    data:
      display: table
      fields:
      - key: tenant_name
        label: Tenant
      - key: task
        label: Task
      - key: due_date
        label: Due
        format: date
      - key: status
        label: Status
        format: badge
      sort:
        field: due_date
        dir: asc
    roles:
    - operator
    - leasing_manager
    - leasing_agent
  - key: insights
    type: page
    title: Dashboards
    roles:
    - operator
    - leasing_manager
    - admin
    sections:
    - type: data
      title: Leads
      source: collection:leads
      display: kpi
      kpis:
      - label: Total leads
        agg: count
      - label: Average budget
        agg: avg
        field: budget
        format: money
    - type: data
      title: Leads by source
      source: collection:leads
      display: chart
      chart: bar
      fields:
      - key: source
        label: Source
      - key: count
        label: Leads
      groupBy:
        field: source
        aggs: []
    - type: data
      title: Lets by source (conversion)
      source: collection:leads
      display: chart
      chart: bar
      fields:
      - key: source
        label: Source
      - key: count
        label: Lets
      filters:
      - field: stage
        op: '='
        value: let
      groupBy:
        field: source
        aggs: []
    - type: data
      title: Time to let (days, by month)
      source: collection:tenancies
      display: chart
      chart: line
      fields:
      - key: let_date
        label: Month
      - key: avg_days
        label: Avg days to let
      groupBy:
        field: let_date
        bucket: month
        aggs:
        - key: avg_days
          agg: avg
          field: days_to_let
    - type: data
      title: Occupancy
      source: collection:units
      display: chart
      chart: pie
      fields:
      - key: status
        label: Status
      - key: count
        label: Units
      groupBy:
        field: status
        aggs: []
    - type: data
      title: Campaign performance
      source: collection:campaigns
      display: table
      fields:
      - key: name
        label: Campaign
      - key: channel
        label: Channel
        format: badge
      - key: spend
        label: Spend
        format: money
      - key: leads
        label: Leads
      - key: viewings
        label: Viewings
      - key: lets
        label: Lets
  - key: account
    type: account
    title: Plan
    roles:
    - operator
  approvals:
  - key: offer_approval
    title: Approve offer and holding deposit
    role: leasing_manager
    fields:
    - lead_name
    - unit_ref
    - rent
    - deposit
    timeoutMinutes: 4320
    onTimeout: reject
  triggers:
  - key: website_enquiry
    description: Operator website form posts here
    'on':
      webhook: true
    write:
      collection: leads
      fields:
        name: name
        email: email
        phone: phone
        notes: message
        building: building
        source: source
        campaign: campaign
  - key: qualify_new_lead
    'on':
      collection: leads
      op: insert
      where:
        stage: new
    start:
      agent: concierge
    goal: 'A new lead arrived: {record.name}, source {record.source}, building {record.building}, email {record.email}, phone
      {record.phone}, message: {record.notes}. Check the building''s units, qualify what is missing (budget, move date, household
      size, income, preferred contact), save it with save_lead and propose viewing slots in your report.'
  - key: lead_ack
    'on':
      collection: leads
      op: insert
    notify:
      to:
      - record.email
      subject: Thanks for your enquiry
      body: Hello {record.name}, thank you for your interest. Our leasing team will be in touch shortly with availability
        and viewing times.
  - key: viewing_confirmation
    'on':
      collection: viewings
      op: insert
    notify:
      to:
      - owner
      - record.lead_email
      subject: 'Viewing confirmed: {record.building}'
      body: Hello {record.lead_name}, your viewing at {record.building} (unit {record.unit_ref}) is confirmed for {record.start}.
        Reply to this email if you need to change it.
  - key: viewing_reminder
    'on':
      date:
        collection: viewings
        field: start
        offsetDays: -1
        hour: 8
    notify:
      to:
      - record.lead_email
      subject: 'Reminder: your viewing tomorrow'
      body: Hello {record.lead_name}, a reminder of your viewing at {record.building} on {record.start}. We look forward to
        meeting you.
  - key: after_viewing
    'on':
      collection: viewings
      op: update
      where:
        outcome: interested
    start:
      agent: applications
    goal: '{record.lead_name} ({record.lead_email}) viewed unit {record.unit_ref} at {record.building} and is interested.
      Create the application, list the documents needed and follow the file through referencing to an offer approval request.'
  - key: chase_documents
    'on':
      collection: applications
      op: update
      where:
        status: docs_missing
    notify:
      to:
      - record.lead_email
      subject: Documents needed for your application
      body: 'Hello {record.lead_name}, to progress your application for unit {record.unit_ref} we still need: {record.missing_docs}.
        Please send them as soon as you can.'
  - key: to_referencing
    'on':
      collection: applications
      op: update
      where:
        status: referencing
    notify:
      to:
      - role:leasing_manager
      subject: 'File ready for referencing: {record.lead_name}'
      body: The application of {record.lead_name} for unit {record.unit_ref} is complete and ready for referencing.
      link: applications_list
  - key: offer_approved
    'on':
      approval: offer_approval
      decision: approved
    start:
      agent: onboarder
    goal: 'The offer was approved. Create the tenancy, mark the unit let, set the lead to let and schedule move-in tasks.
      Event: {event}'
  - key: offer_email
    'on':
      approval: offer_approval
      decision: approved
    notify:
      to:
      - owner
      subject: Offer approved
      body: The offer and holding deposit were approved. Move-in tasks are being scheduled.
      link: tasks
  - key: movein_prep
    'on':
      date:
        collection: tenancies
        field: move_in_date
        offsetDays: -3
        hour: 8
    notify:
      to:
      - record.tenant_email
      - owner
      subject: Your move-in is in 3 days
      body: Hello {record.tenant_name}, your move-in to unit {record.unit_ref} is on {record.move_in_date}. Please have your
        ID and the first rent payment ready.
  - key: welcome_email
    'on':
      date:
        collection: tenancies
        field: move_in_date
        offsetDays: 0
        hour: 8
    notify:
      to:
      - record.tenant_email
      subject: Welcome home
      body: Hello {record.tenant_name}, welcome to {record.building}. Keys, inventory and building information will be handled
        by the team today.
  billing:
    modes:
    - subscription
    currency: eur
    plans:
    - key: starter
      price: 149
      interval: month
      label: 'Starter: 1 building, up to 50 units'
      includes:
      - 1 building
      - 50 units
      - AI leasing agent
    - key: growth
      price: 399
      interval: month
      label: 'Growth: up to 5 buildings, 250 units'
      includes:
      - 5 buildings
      - 250 units
      - AI leasing agent
      - dashboards
    - key: scale
      price: 899
      interval: month
      label: 'Scale: unlimited buildings and units'
      includes:
      - unlimited buildings
      - unlimited units
      - AI leasing agent
      - dashboards
  extensions:
  - key: sms_whatsapp
    description: 'SMS and WhatsApp confirmations, reminders and inbound WhatsApp capture are not available yet: notifications
      go by email only, and WhatsApp leads must be added by the team or a webhook.'
  - key: phone_follow_up
    description: Outbound follow-up calls to leads who prefer phone are not available; the phone channel answers inbound calls
      and the pipeline shows the preferred contact.
  - key: referencing_provider
    description: 'Passing the file to an external referencing provider is not wired: the file moves to status referencing
      and the manager is notified.'
  - key: per_building_metering
    description: Billing per building is modelled as three plan tiers with building and unit quotas rather than a metered
      per-building fee.
  - key: webhook_routing
    description: The website webhook saves leads under the app's hook secret; routing each enquiry to the right operator account
      needs per-operator setup.
