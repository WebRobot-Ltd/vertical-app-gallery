  triggers:
  - key: new_application
    'on':
      collection: operator_applications
      op: insert
    notify:
      to: admins
      subject: 'New operator application: {record.company}'
      body: '{record.company} ({record.contact_email}) applied to list tours. Review it and add them to the operators collection
        to approve.'
  - key: new_submission
    'on':
      collection: tour_submissions
      op: insert
    notify:
      to: admins
      subject: 'Tour awaiting approval: {record.title}'
      body: '{record.operator_email} submitted "{record.title}" ({record.destination}). Set its status to approved on the
        data page to publish it.'
  - key: tour_approved
    'on':
      collection: tour_submissions
      op: update
      where:
        status: approved
    start:
      agent: publisher
    asUser: false
    goal: 'Publish this approved tour. code: {record.code}; title: {record.title}; destination: {record.destination}; country:
      {record.country}; days: {record.days}; activity_level: {record.activity_level}; activity: {record.activity}; max_group:
      {record.max_group}; price_from: {record.price_from}; currency: {record.currency}; summary: {record.summary}; itinerary:
      {record.itinerary}; inclusions: {record.inclusions}; exclusions: {record.exclusions}; package_type: {record.package_type};
      flights_included: {record.flights_included}; operator_email: {record.operator_email}.'
  - key: tour_approved_mail
    'on':
      collection: tour_submissions
      op: update
      where:
        status: approved
    notify:
      to:
      - record.operator_email
      subject: 'Your tour is live: {record.title}'
      body: Your tour "{record.title}" was approved and is now published on Trekkora.
  - key: booking_new
    'on':
      collection: bookings
      op: insert
      where:
        status: requested
    start:
      agent: booking_clerk
    asUser: true
    goal: 'Price booking {event}. Departure id: {record.departure_id}; travellers: {record.travellers}. Today is {date}.'
  - key: booking_confirmed
    'on':
      collection: bookings
      op: update
      where:
        status: deposit_paid
    notify:
      to:
      - owner
      - record.operator_email
      subject: 'Booking confirmed: {record.tour_title}'
      body: 'Deposit received for {record.tour_title}, departing {record.start_date}. Balance of {record.balance} is due on
        {record.balance_due_date}. Protection: {record.protection}.'
  - key: balance_reminder
    'on':
      date:
        collection: bookings
        field: balance_due_date
        offsetDays: -14
        hour: 8
      where:
        status: deposit_paid
    notify:
      to: owner
      subject: 'Balance due in 14 days: {record.tour_title}'
      body: The balance of {record.balance} for {record.tour_title} is due on {record.balance_due_date}, 60 days before departure.
      link: my_bookings
  - key: balance_due
    'on':
      date:
        collection: bookings
        field: balance_due_date
        offsetDays: 0
        hour: 8
      where:
        status: deposit_paid
    notify:
      to: owner
      subject: 'Balance due today: {record.tour_title}'
      body: The balance of {record.balance} for {record.tour_title} is due today. Please pay it to keep your place.
      link: my_bookings
  - key: payout_due
    'on':
      date:
        collection: bookings
        field: end_date
        offsetDays: 1
        hour: 6
      where:
        status: paid_in_full
    start:
      agent: payout_clerk
    asUser: false
    goal: 'Record the payout: booking_id {event}; operator_email {record.operator_email}; tour_title {record.tour_title};
      gross {record.total}; commission {record.commission}. Today is {date}.'
  slots:
  - key: booking_terms
    description: Deposit, balance date, commission and protection for a booking
    timeoutMs: 2000
    example:
      args:
        price_per_person: 1200
        travellers: 2
        start_date: '2027-05-10'
        today: '2026-11-12'
        package_type: trekkora_package
        flights_included: true
        commission_pct: 15
    code: "from datetime import date, timedelta\n\ndef main(input):\n    a = input.get('args') or {}\n    price = float(a.get('price_per_person')\
      \ or 0)\n    n = int(a.get('travellers') or 1)\n    pct = float(a.get('commission_pct') or 15)\n    today = date.fromisoformat(a['today'])\n\
      \    start = date.fromisoformat(a['start_date'])\n    total = round(price * n, 2)\n    due = start - timedelta(days=60)\n\
      \    if due <= today:\n        deposit = total\n        balance = 0.0\n        due = today\n    else:\n        deposit\
      \ = round(total * 0.2, 2)\n        balance = round(total - deposit, 2)\n    pkg = a.get('package_type') or 'operator_package'\n\
      \    flights = bool(a.get('flights_included'))\n    if pkg == 'trekkora_package':\n        atol = flights\n        prot\
      \ = 'Package Travel Regulations protection (Trekkora package)' + ('; ATOL protected (flights included)' if flights else\
      \ '')\n    elif pkg == 'operator_package':\n        atol = False\n        prot = 'Packaged by the operator: operator\
      \ provides its own package travel protection'\n    else:\n        atol = False\n        prot = 'Land arrangements only:\
      \ check the operator terms for protection'\n    return {'total': total, 'deposit': deposit, 'balance': balance, 'balance_due_date':\
      \ due.isoformat(), 'commission': round(total * pct / 100, 2), 'atol_covered': atol, 'protection': prot, 'package_type':\
      \ pkg}\n"
  notifications:
    emailOnRunDone: true
  billing:
    modes:
    - per_transaction
    currency: gbp
    transactionFeePct: 15
    sellers: collection:operators
  extensions:
  - key: operator_inventory_api
    description: 'Live availability from operator inventory APIs under contract is not available yet: each operator has its
      own host and format. Until then operators update departures by hand (departure form) or in bulk. Departures carry a
      source field (manual or api) ready for the integration.'
  - key: two_stage_card_payment
    description: 'Card deposit at booking and the balance 60 days before departure as two Stripe charges are not expressed
      by the manifest: the booking status moves from requested to deposit_paid to paid_in_full once payments are confirmed.
      Reminders are emails.'
  - key: operator_payout_transfer
    description: Payouts are recorded per booking after departure (gross, commission, amount). The Stripe Connect transfer
      to each operator is made by the payments side per billing.sellers.
  - key: faceted_filters
    description: Interactive filter controls (destination, length, level, group size, start date, price) on the browse page
      and a route line on the map are not available; the search agent covers filtered search and the map shows route stops.
  - key: legal_protection
    description: 'PTR/ATOL: the app records the package type and ATOL cover per booking and shows the protection. The owner
      must hold its own ATOL licence and bonding, and have counsel confirm which tours count as Trekkora packages.'
  - key: operator_csv_departures
    description: CSV upload covers tours; departures are entered by form or by admins on the data page.
