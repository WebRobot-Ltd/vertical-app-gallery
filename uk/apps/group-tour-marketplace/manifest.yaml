apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: trekkora
  displayName: Trekkora
  tagline:
    en: Multi-day group and adventure tours from trusted operators.
  description:
    en: 'A marketplace for multi-day group and adventure tours: search with filters, a map of the route, or ask an AI search
      agent in plain English. Pay a deposit by card and the balance 60 days before departure. Package travel protections are
      shown and recorded on every booking.'
  langs:
  - en
  defaultLang: en
  timezone: Europe/London
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#1f4d3a'
      accent: '#d9822b'
      background: '#f7f4ee'
      foreground: '#1c2420'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Trek
      color: primary
    - text: kora
      color: accent
    width: wide
  header:
    links:
    - label: How it works
      href: '#how'
    - label: Protection
      href: '#protection'
    - label: For operators
      href: '#operators'
    cta:
      label: Find a tour
      href: /v/search
  auth:
    method: magic_link
    anonymous:
      views:
      - home
      - search
      - tours
      - tour
      - departures
      - tour_map
      - op_apply
      agents:
      - concierge
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: user
      label: Traveller
      assignedBy: signup
    - key: operator
      label: Operator
      assignedBy: derived
      from: collection:operators.contact_email
  limits:
  - action: chat
    per: ip
    max: 40
    window: day
    roles:
    - anonymous
  - action: agent:importer
    per: user
    max: 10
    window: day
    roles:
    - operator
  agents:
  - key: concierge
    role: main
    description: 'AI search agent: turns a plain-English request into matching tours with reasons.'
    profile:
      inline:
        display_name: Trekkora search agent
        chat_mode: true
        crews:
        - id: concierge
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are Trekkora''s tour search agent. A traveller describes the trip they want in plain English
            (destination, length, pace or activity level, group size, month or start date, budget). Use the search_tours tool
            to find matching tours (filter on destination/country, days, activity_level, price_from, max_group) and search_departures
            to check real departures with seats left for the requested dates. Recommend 3 to 5 tours at most. For each give:
            the title, destination, number of days, activity level, price from, the next suitable departure and seats left,
            and 2 or 3 short reasons it fits the request, plus a link /v/tour?code=<code>. Say which protection applies (package_type:
            trekkora_package = Package Travel Regulations protection, with ATOL where flights are included; operator_package
            = protection provided by the operator; land_only = check the operator''s terms). Only recommend tours the tools
            return; never invent tours, prices, dates or availability. If nothing matches, say so and suggest the closest
            alternative or which criterion to relax. Ask one short clarifying question only when the request is too vague
            to search. Keep answers concise and in English.'
    goalTemplate: 'Conversation so far:

      {history}


      Traveller: {message}

      Today is {date}. Answer in English.'
    appTools:
    - name: search_tours
      description: Search the published tours (filter by destination, country, days, activity level, price, group size)
      action: search
      collection: tours
      scope: all
    - name: search_departures
      description: Search departures with dates, price and seats left
      action: search
      collection: departures
      scope: all
    - name: show_tours
      description: Show tour records in the reply
      action: show
      collection: tours
      scope: all
  - key: importer
    role: helper
    description: Reads an operator's CSV and submits each tour for admin approval.
    profile:
      inline:
        display_name: Tour CSV importer
        crews:
        - id: importer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You import tours for a tour operator from a CSV. For each row call submit_tour once with: code (the
            operator''s own unique tour code), title, destination, country, days (number), activity_level (easy, moderate
            or challenging), activity (walking, cycling, trekking, multi-activity, other), max_group, price_from, currency,
            summary, itinerary (day by day, one line per day), inclusions, exclusions, package_type (operator_package unless
            the CSV says otherwise), operator_email (the one given in the goal), status pending. Map columns by meaning; skip
            rows lacking a code, title, destination, days or price and list them. Never invent values. Start the answer with
            a level-1 title ''# Tour import'', then a short table of what was submitted and what was skipped and why, and
            say that every tour needs admin approval before it is published.'
    context:
    - key: email
      from: user.email
    goalTemplate: 'Operator email: {email}

      Import the tours in this CSV (file {tours_csv}):

      {tours_csv_text}

      Today is {date}.'
    appTools:
    - name: submit_tour
      description: Submit one tour for admin approval
      action: append
      collection: tour_submissions
      scope: user
    output: markdown
  - key: publisher
    role: helper
    description: Publishes an approved tour submission into the public catalogue.
    profile:
      inline:
        display_name: Tour publisher
        crews:
        - id: publisher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: An admin has approved a tour submission. Copy it faithfully into the public catalogue with publish_tour
            (same field values, no rewriting of facts) and add operator_name from the operators collection via read_operator.
            Then, if the itinerary names places with known coordinates you are certain of, add one publish_stop per day (tour_code,
            day, name, lat, lon); skip stops you are not sure of. Never invent data. Finish with one line confirming the publication.
    appTools:
    - name: publish_tour
      description: Create or update a published tour
      action: write
      collection: tours
      scope: all
    - name: publish_stop
      description: Add a route stop to a published tour
      action: append
      collection: tour_stops
      scope: all
    - name: read_operator
      description: Look up an operator by email
      action: search
      collection: operators
      scope: all
  - key: booking_clerk
    role: helper
    description: 'Prices a new booking: deposit, balance date, commission and the protection that applies.'
    profile:
      inline:
        display_name: Booking clerk
        crews:
        - id: booking_clerk
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'A traveller has requested a booking. Look up the departure with read_departure and the tour with
            read_tour. Call booking_terms with price_per_person, travellers, start_date, today, package_type, flights_included
            and commission_pct (the operator''s commission_pct from read_operator; 15 if empty). Then call update_booking
            once to store: tour_title, destination, start_date, end_date, operator_email, price_per_person, total, deposit,
            balance, balance_due_date, commission, package_type, atol_covered, protection, status requested. Use only the
            figures the booking_terms tool returned; never calculate prices yourself. Reply with a short summary of amounts
            and the protection.'
    appTools:
    - name: read_departure
      description: Read departures
      action: search
      collection: departures
      scope: all
    - name: read_tour
      description: Read published tours
      action: search
      collection: tours
      scope: all
    - name: read_operator
      description: Look up an operator by email
      action: search
      collection: operators
      scope: all
    - name: booking_terms
      description: Deterministic deposit, balance date, commission and protection for a booking
      action: call
      slot: booking_terms
    - name: update_booking
      description: Update the traveller's booking record
      action: write
      collection: bookings
      scope: user
  - key: payout_clerk
    role: helper
    description: Records the operator payout after a departure.
    profile:
      inline:
        display_name: Payout clerk
        crews:
        - id: payout_clerk
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.1
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'A departure has finished and the booking was paid in full. Record the operator''s payout with write_payout:
            booking_id, operator_email, tour_title, gross (the booking total), commission, amount = gross minus commission,
            due_date (today), status pending. Use exactly the figures in the goal; do not recalculate. Reply with one line.'
    appTools:
    - name: write_payout
      description: Record an operator payout
      action: write
      collection: payouts
      scope: all
  inputForm:
    title: Import tours from CSV
    fields:
    - name: tours_csv
      type: file
      required: true
      label: Tours CSV
      accept:
      - csv
      maxMb: 5
      help: 'One row per tour: code, title, destination, country, days, activity level, group size, price, summary, itinerary,
        inclusions.'
  data:
    collections:
    - name: operators
      ownedBy: shared
      description: Approved operators. Admins add an operator after approving their application.
      fields:
      - name: name
        type: text
        required: true
      - name: contact_email
        type: email
        required: true
      - name: country
        type: country
      - name: commission_pct
        type: number
        help: Commission on each booking, %
      - name: inventory
        type: select
        options:
        - manual
        - api
      - name: status
        type: select
        options:
        - approved
        - suspended
      - name: description
        type: textarea
    - name: operator_applications
      ownedBy: org
      retentionDays: 730
      description: Operator applications waiting for admin approval
      fields:
      - name: company
        type: text
        required: true
      - name: contact_name
        type: text
        required: true
      - name: contact_email
        type: email
        required: true
      - name: website
        type: url
      - name: country
        type: country
      - name: tour_count
        type: number
        label: Approximate number of tours
      - name: has_inventory_api
        type: boolean
        label: We have an availability API
      - name: protection_info
        type: textarea
        label: Package travel protection / bonding you hold
      - name: message
        type: textarea
    - name: tour_submissions
      ownedBy: org
      description: Tours submitted by operators, waiting for admin approval
      fields:
      - name: code
        type: text
        required: true
        help: Your own unique tour code
      - name: title
        type: text
        required: true
      - name: destination
        type: text
        required: true
      - name: country
        type: country
      - name: days
        type: number
        required: true
      - name: activity_level
        type: select
        options:
        - easy
        - moderate
        - challenging
      - name: activity
        type: select
        options:
        - walking
        - cycling
        - trekking
        - multi-activity
        - other
      - name: max_group
        type: number
      - name: price_from
        type: number
        required: true
      - name: currency
        type: text
        default: GBP
      - name: summary
        type: textarea
      - name: itinerary
        type: textarea
        help: One line per day
      - name: inclusions
        type: textarea
      - name: exclusions
        type: textarea
      - name: package_type
        type: select
        options:
        - operator_package
        - trekkora_package
        - land_only
        default: operator_package
      - name: flights_included
        type: boolean
      - name: operator_email
        type: email
        required: true
        help: Your login email
      - name: status
        type: select
        options:
        - pending
        - approved
        - rejected
        default: pending
      - name: admin_note
        type: textarea
      access:
      - role: operator
        where:
          operator_email: '{user.email}'
        can:
        - read
    - name: tours
      ownedBy: shared
      searchable: true
      description: Published, approved tours
      fields:
      - name: code
        type: text
      - name: title
        type: text
      - name: destination
        type: text
      - name: country
        type: country
      - name: days
        type: number
      - name: activity_level
        type: select
        options:
        - easy
        - moderate
        - challenging
      - name: activity
        type: text
      - name: max_group
        type: number
      - name: price_from
        type: number
      - name: currency
        type: text
      - name: summary
        type: textarea
      - name: itinerary
        type: textarea
      - name: inclusions
        type: textarea
      - name: exclusions
        type: textarea
      - name: package_type
        type: text
      - name: flights_included
        type: boolean
      - name: operator_name
        type: text
      - name: operator_email
        type: email
    - name: tour_stops
      ownedBy: shared
      description: Route stops of each tour, for the map
      fields:
      - name: tour_code
        type: text
      - name: day
        type: number
      - name: name
        type: text
      - name: lat
        type: number
      - name: lon
        type: number
    - name: departures
      ownedBy: shared
      description: Dated departures with seats left. Operators without an inventory API keep them by hand.
      fields:
      - name: tour_code
        type: text
        required: true
      - name: tour_title
        type: text
      - name: operator_email
        type: email
        required: true
        help: Your login email
      - name: start_date
        type: date
        required: true
      - name: end_date
        type: date
        required: true
      - name: price
        type: number
        required: true
        label: Price per person
      - name: seats_total
        type: number
      - name: seats_left
        type: number
        required: true
      - name: source
        type: select
        options:
        - manual
        - api
        default: manual
      - name: status
        type: select
        options:
        - open
        - full
        - closed
        default: open
      access:
      - role: operator
        where:
          operator_email: '{user.email}'
        can:
        - read
        - write
    - name: bookings
      ownedBy: user
      description: Traveller bookings with deposit, balance, commission and the protection that applies
      fields:
      - name: departure_id
        type: select
        required: true
        label: Departure
        optionsFrom: collection:departures
      - name: travellers
        type: number
        required: true
        default: 1
      - name: lead_name
        type: text
        required: true
        label: Lead traveller name
      - name: phone
        type: text
      - name: notes
        type: textarea
      - name: tour_code
        type: text
      - name: tour_title
        type: text
      - name: destination
        type: text
      - name: start_date
        type: date
      - name: end_date
        type: date
      - name: operator_email
        type: email
      - name: price_per_person
        type: number
      - name: total
        type: number
      - name: deposit
        type: number
      - name: balance
        type: number
      - name: balance_due_date
        type: date
      - name: commission
        type: number
      - name: package_type
        type: text
      - name: atol_covered
        type: boolean
      - name: protection
        type: text
      - name: status
        type: select
        options:
        - requested
        - deposit_paid
        - paid_in_full
        - cancelled
        default: requested
      access:
      - role: operator
        where:
          operator_email: '{user.email}'
        can:
        - read
    - name: payouts
      ownedBy: org
      description: What each operator is owed after a departure
      fields:
      - name: booking_id
        type: text
      - name: operator_email
        type: email
      - name: tour_title
        type: text
      - name: gross
        type: number
      - name: commission
        type: number
      - name: amount
        type: number
      - name: due_date
        type: date
      - name: status
        type: select
        options:
        - pending
        - paid
        default: pending
      access:
      - role: operator
        where:
          operator_email: '{user.email}'
        can:
        - read
  views:
  - key: home
    type: page
    title: Trekkora
    nav: false
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow: Group and adventure tours
      title: Find your next **multi-day adventure** in minutes.
      text: Thousands of group tours from vetted operators. Filter by destination, length and pace, see the route on a map,
        or just describe the trip you want.
      actions:
      - label: Ask the search agent
        href: /v/search
        style: primary
      - label: Browse tours
        href: /v/tours
        style: ghost
      aside: <div style="padding:16px"><b>Try:</b><br>"A gentle 7-day walking tour in Portugal in May"<br><br>You get matching
        tours, with reasons, and live departures.</div>
    - type: steps
      id: how
      title: How it works
      items:
      - title: Search
        text: Use filters and the route map, or ask the agent in plain English.
      - title: Pick a departure
        text: See the itinerary day by day, what is included, departures and seats left.
      - title: Pay a deposit
        text: Secure your place with a card deposit; the balance is due 60 days before departure, with email reminders.
      - title: Travel protected
        text: Every booking records which travel protection applies.
    - type: cards
      id: protection
      title: Your protection
      items:
      - title: Package Travel Regulations
        text: Where Trekkora packages your trip, it is covered by the Package Travel Regulations.
      - title: ATOL
        text: Where a package includes flights, ATOL protection applies and is recorded on your booking.
      - title: Operator packages
        text: Tours packaged by the operator show the operator's own protection. Check each tour page.
    - type: cards
      id: operators
      title: For tour operators
      items:
      - title: Apply to list your tours
        text: Admins approve new operators and every new tour before it is published. [Apply now](/v/op_apply)
      - title: Manage your own
        text: Upload tours by CSV, keep departures up to date and see your bookings and payouts.
    - type: note
      content: Trekkora is a marketplace. Protection depends on who packages the trip and is shown on each tour and booking.
  - key: search
    type: chat
    title: Ask the search agent
    source: agent:concierge
    examples:
    - A gentle 7-day walking tour in Portugal in May
    - Challenging trekking in Nepal for a group of 6, under £2500
    - Cycling tour in Italy in September, 8 to 10 days
    placeholder: Describe the trip you want
  - key: tours
    type: cards
    title: Browse tours
    source: collection:tours
    data:
      display: cards
      fields:
      - key: title
        label: Tour
      - key: destination
        label: Destination
      - key: days
        label: Days
        format: number
      - key: activity_level
        label: Level
        format: badge
      - key: max_group
        label: Max group
        format: number
      - key: price_from
        label: From
        format: money
      - key: operator_name
        label: Operator
      sort:
        field: price_from
        dir: asc
      limit: 60
      empty: No tours published yet.
    nav: true
  - key: tour
    type: cards
    title: Tour
    source: collection:tours
    param: code
    nav: false
    data:
      display: cards
      fields:
      - key: title
      - key: destination
      - key: days
        format: number
      - key: activity_level
        format: badge
      - key: itinerary
        label: Itinerary day by day
      - key: inclusions
        label: Included
      - key: exclusions
        label: Not included
      - key: package_type
        label: Protection
        format: badge
      - key: operator_name
        label: Operator
      limit: 1
  - key: departures
    type: table
    title: Departures and availability
    source: collection:departures
    param: tour_code
    nav: false
    data:
      display: table
      fields:
      - key: tour_title
        label: Tour
      - key: start_date
        label: Start
        format: date
      - key: end_date
        label: End
        format: date
      - key: price
        label: Price pp
        format: money
      - key: seats_left
        label: Seats left
        format: number
      - key: status
        format: badge
      filters:
      - field: status
        op: '='
        value: open
      sort:
        field: start_date
        dir: asc
      limit: 100
      empty: No open departures.
  - key: tour_map
    type: map
    title: Route map
    source: collection:tour_stops
    param: tour_code
    nav: false
    map:
      lat: lat
      lon: lon
      title: name
      popup:
      - day
  - key: book
    type: form
    title: Book a departure
    collection: bookings
    fields:
    - departure_id
    - travellers
    - lead_name
    - phone
    - notes
    submit:
      label: Request booking
      message: Booking requested. You will see your deposit, balance date and protection in My bookings.
      redirect: my_bookings
    roles:
    - user
    - admin
  - key: my_bookings
    type: table
    title: My bookings
    source: collection:bookings
    roles:
    - user
    - admin
    data:
      display: table
      fields:
      - key: tour_title
        label: Tour
      - key: start_date
        label: Departure
        format: date
      - key: travellers
        format: number
      - key: total
        format: money
      - key: deposit
        format: money
      - key: balance
        format: money
      - key: balance_due_date
        label: Balance due
        format: date
      - key: protection
        label: Protection
      - key: status
        format: badge
      sort:
        field: start_date
        dir: asc
      empty: No bookings yet.
  - key: op_apply
    type: form
    title: Apply as an operator
    collection: operator_applications
    submit:
      label: Send application
      message: Thanks. We will review your application and email you.
    roles:
    - user
    - admin
    - operator
  - key: op_import
    type: new_run
    title: Upload tours (CSV)
    roles:
    - operator
    - admin
  - key: op_tour
    type: form
    title: Submit a tour
    collection: tour_submissions
    submit:
      label: Submit for approval
      message: Submitted. An admin will review it before it is published.
      redirect: op_tours
    roles:
    - operator
    - admin
  - key: op_tours
    type: table
    title: My tours
    source: collection:tour_submissions
    roles:
    - operator
    - admin
    data:
      display: table
      fields:
      - key: code
      - key: title
      - key: destination
      - key: price_from
        format: money
      - key: status
        format: badge
      - key: admin_note
        label: Admin note
      empty: No tours submitted yet.
  - key: op_departure
    type: form
    title: Add or update a departure
    collection: departures
    edit: true
    submit:
      label: Save departure
      message: Departure saved.
      redirect: op_departures
    roles:
    - operator
    - admin
  - key: op_departures
    type: table
    title: My departures
    source: collection:departures
    export: true
    roles:
    - operator
    - admin
    data:
      display: table
      fields:
      - key: tour_code
      - key: start_date
        format: date
      - key: price
        format: money
      - key: seats_left
        format: number
      - key: source
        format: badge
      - key: status
        format: badge
      sort:
        field: start_date
        dir: asc
  - key: op_dash
    type: page
    title: Operator dashboard
    roles:
    - operator
    sections:
    - type: data
      title: My bookings
      source: collection:bookings
      display: kpi
      kpis:
      - label: Bookings
        agg: count
      - label: Booked value
        agg: sum
        field: total
        format: money
      - label: Commission
        agg: sum
        field: commission
