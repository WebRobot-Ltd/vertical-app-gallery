apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: barkbowl
  displayName: Barkbowl
  tagline: Premium fresh dog food, portioned for your dog.
  description: Barkbowl is a subscription for premium fresh dog food. Owners build a dog profile, get a calorie and portion
    plan with recipe recommendations, and manage their subscription and deliveries online. Retail partners place wholesale
    orders.
  langs:
  - en
  defaultLang: en
  timezone: Europe/London
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#2f4a3a'
      accent: '#e07a3f'
      background: '#fbf7f0'
      foreground: '#22262a'
    fonts:
      body: Nunito
      display: Fraunces
    wordmark:
    - text: Bark
      color: primary
    - text: bowl
      color: accent
  header:
    links:
    - label: How it works
      href: '#how-it-works'
    - label: Recipes
      href: '#recipes'
    cta:
      label: Start
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      label: Owner
      assignedBy: signup
    - key: support
      label: Customer service
      assignedBy: invite
    - key: advisor
      label: Nutrition advisor
      assignedBy: invite
    - key: partner
      label: Retail partner
      assignedBy: invite
  agents:
  - key: planner
    role: main
    description: Calculates calories and portions, recommends recipes, and adjusts portions after weight check-ins.
    profile:
      inline:
        display_name: Barkbowl nutrition planner
        crews:
        - id: planner
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the nutrition planner of Barkbowl, a fresh dog food subscription. For one dog you work out
            the daily calories, the daily portion in grams and the recipes that fit, and explain the choice in plain words
            to the owner.

            Method: read the dog with read_dogs and the recipes with read_recipes (the recipes carry kcal_per_100g, ingredients
            and allergens: use only these figures, never invent a recipe or a figure). Resting energy RER = 70 x (weight_kg
            ^ 0.75). Daily kcal = RER x a factor: neutered adult 1.6, intact adult 1.8, puppies under 1 year 2.0-3.0, then
            adjust for activity (low -10%, high +15%) and body condition (overweight or obese: target weight at about 0.8
            x RER-based factor; underweight: +10%). Portion grams per day = daily kcal / kcal_per_100g x 100 of the recommended
            recipe. Exclude every recipe that contains an ingredient or allergen the dog is allergic to, and say which you
            excluded and why. Recommend one to three recipes.

            MEDICAL CONDITIONS: if the dog has medical_conditions filled in and advisor_status is not approved, do NOT activate
            the plan. Save the proposed figures with update_dog (plan_status awaiting_review, advisor_status pending) and
            call request_vet_review with the dog name, the conditions and your proposed plan. Tell the owner that a nutrition
            advisor reviews the plan before it starts. When the review was approved (your task says so) set plan_status active
            and advisor_status approved. Never give veterinary advice or diagnose; recommend the owner''s vet for medical
            questions.

            No conditions: save the plan with update_dog (daily_kcal, portion_g, recommended_recipes, plan_rationale, plan_status
            active, advisor_status not_needed) and set next_checkin to the date 28 days after today.

            WEIGHT CHECK-IN: compare the new weight with the previous one. Recalculate with the new weight and body condition,
            change the portion by small steps (at most 10% at a time), update the dog''s weight_kg, daily_kcal, portion_g,
            plan_rationale and set next_checkin 28 days later. Flag a loss or gain faster than 2% of body weight per week
            as something to discuss with a vet.

            Finish with a report starting with a level-1 title "# Feeding plan: <dog name>" and the sections ## Daily calories,
            ## Portion, ## Recommended recipes, ## Why this plan, ## Next check-in. Write in English. Keep it under 300 words.'
    appTools:
    - name: read_dogs
      description: Read the owner's dog profiles
      action: read
      collection: dogs
      scope: user
    - name: update_dog
      description: Save the plan figures and check-in date on the owner's dog record
      action: write
      collection: dogs
      scope: user
    - name: read_recipes
      description: Read the Barkbowl recipe catalogue (kcal, ingredients, allergens)
      action: read
      collection: recipes
      scope: all
    awaits:
    - vet_review
    output: markdown
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.5
  data:
    collections:
    - name: recipes
      ownedBy: shared
      description: The recipe catalogue, kept by the admins
      fields:
      - name: name
        type: text
        required: true
      - name: description
        type: textarea
      - name: kcal_per_100g
        type: number
        required: true
      - name: ingredients
        type: textarea
      - name: allergens
        type: text
        help: Comma-separated, e.g. chicken, egg
    - name: dogs
      ownedBy: user
      description: Each owner's dogs with their feeding plan
      fields:
      - name: name
        type: text
        required: true
        label: Dog's name
      - name: breed
        type: text
        required: true
      - name: age_years
        type: number
        required: true
        label: Age (years)
      - name: weight_kg
        type: number
        required: true
        label: Weight (kg)
      - name: neutered
        type: boolean
        label: Neutered
      - name: body_condition
        type: select
        required: true
        options:
        - value: underweight
          label: Underweight
        - value: ideal
          label: Ideal
        - value: overweight
          label: Overweight
        - value: obese
          label: Obese
      - name: activity
        type: select
        required: true
        label: Activity level
        options:
        - value: low
          label: Low
        - value: moderate
          label: Moderate
        - value: high
          label: High
      - name: allergies
        type: textarea
        help: Ingredients your dog cannot eat
      - name: current_food
        type: text
      - name: medical_conditions
        type: textarea
        help: Leave empty if none. A nutrition advisor reviews dogs with medical conditions before the plan starts.
      - name: daily_kcal
        type: number
        label: Daily kcal
      - name: portion_g
        type: number
        label: Daily portion (g)
      - name: recommended_recipes
        type: text
      - name: plan_rationale
        type: textarea
        label: Why this plan
      - name: plan_status
        type: select
        default: pending
        options:
        - pending
        - awaiting_review
        - active
      - name: advisor_status
        type: select
        options:
        - not_needed
        - pending
        - approved
      - name: next_checkin
        type: date
        label: Next weight check-in
      access:
      - role: advisor
        can:
        - read
      - role: support
        can:
        - read
    - name: subscriptions
      ownedBy: user
      description: One subscription per dog
      fields:
      - name: dog
        type: select
        required: true
        optionsFrom: collection:dogs
        label: Dog
      - name: recipe
        type: select
        required: true
        optionsFrom: collection:recipes
      - name: box_kg
        type: number
        required: true
        label: Box size (kg)
      - name: frequency
        type: select
        required: true
        label: Delivery frequency
        options:
        - value: weekly
          label: Every week
        - value: fortnightly
          label: Every 2 weeks
        - value: monthly
          label: Every 4 weeks
      - name: address
        type: textarea
        required: true
        label: Delivery address
      - name: status
        type: select
        required: true
        default: active
        options:
        - value: active
          label: Active
        - value: paused
          label: Paused
        - value: cancelled
          label: Cancelled
      - name: next_dispatch
        type: date
        label: Next dispatch
      - name: skip_next
        type: boolean
        label: Skip the next delivery
      - name: dispatch_status
        type: select
        options:
        - scheduled
        - dispatched
      - name: tracking
        type: text
      - name: cancel_reason
        type: textarea
        label: Reason (optional)
      - name: cancelled_date
        type: date
        label: Cancellation date
      access:
      - role: support
        can:
        - read
        - write
    - name: weight_checkins
      ownedBy: user
      description: Four-weekly weight check-ins
      fields:
      - name: dog
        type: select
        required: true
        optionsFrom: collection:dogs
      - name: weight_kg
        type: number
        required: true
        label: Current weight (kg)
      - name: body_condition
        type: select
        required: true
        options:
        - underweight
        - ideal
        - overweight
        - obese
      - name: notes
        type: textarea
      access:
      - role: advisor
        can:
        - read
      - role: support
        can:
        - read
    - name: wholesale_orders
      ownedBy: user
      description: Wholesale orders placed by retail partners
      fields:
      - name: recipe
        type: select
        required: true
        optionsFrom: collection:recipes
      - name: cases
        type: number
        required: true
      - name: delivery_date
        type: date
        required: true
      - name: shop_address
        type: textarea
        required: true
      - name: notes
        type: textarea
      - name: status
        type: select
        default: submitted
        options:
        - submitted
        - confirmed
        - dispatched
        - cancelled
      access:
      - role: support
        can:
        - read
        - write
  approvals:
  - key: vet_review
    title: Nutrition review for a dog with medical conditions
    role: advisor
    decidedBy: role
    fields:
    - dog
    - conditions
    - proposed_plan
    timeoutMinutes: 4320
    onTimeout: reject
  triggers:
  - key: new_dog
    'on':
      collection: dogs
      op: insert
      where:
        plan_status: pending
    start:
      agent: planner
    goal: 'A new dog profile was saved: {record.name} ({record.breed}), age {record.age_years} years, {record.weight_kg} kg,
      body condition {record.body_condition}, activity {record.activity}. Allergies: {record.allergies}. Medical conditions:
      {record.medical_conditions}. Current food: {record.current_food}. Create the feeding plan. Today is {date}. Write in
      the language with ISO code {lang}.'
  - key: weight_checkin
    'on':
      collection: weight_checkins
      op: insert
    start:
      agent: planner
    goal: 'Weight check-in for the dog {record.dog}: new weight {record.weight_kg} kg, body condition {record.body_condition}.
      Notes: {record.notes}. Adjust the portion and the next check-in date. Today is {date}. Write in the language with ISO
      code {lang}.'
  - key: plan_approved
    'on':
      approval: vet_review
      decision: approved
    start:
      agent: planner
    goal: 'The nutrition advisor APPROVED the plan for this request: {event}. Activate the plan: set plan_status active, advisor_status
      approved and next_checkin 28 days after today ({date}).'
  - key: plan_rejected
    'on':
      approval: vet_review
      decision: rejected
    notify:
      to: owner
      subject: Your dog's feeding plan needs a change
      body: Our nutrition advisor reviewed your dog's plan and asked for changes. Please open your dog's profile, check the
        details, and contact us if you have questions.
      link: my_dogs
  - key: dispatched
    'on':
      collection: subscriptions
      op: update
      where:
        dispatch_status: dispatched
    notify:
      to: owner
      subject: Your Barkbowl box is on its way
      body: 'Your fresh dog food box has been dispatched. Tracking: {record.tracking}. Keep it in the freezer or fridge as
        soon as it arrives.'
      link: my_subscriptions
  - key: dispatch_reminder
    'on':
      date:
        collection: subscriptions
        field: next_dispatch
        offsetDays: -7
        hour: 8
    notify:
      to: owner
      subject: 'Your next Barkbowl box: changes close in 2 days'
      body: Your next box is dispatched in 7 days. You can pause, skip or change the recipe until 5 days before dispatch.
      link: manage_subscription
  - key: checkin_reminder
    'on':
      date:
        collection: dogs
        field: next_checkin
        offsetDays: 0
        hour: 8
    notify:
      to: owner
      subject: Time for {record.name}'s weight check-in
      body: It has been four weeks. Please weigh {record.name} and tell us the weight so we can adjust the portions.
      link: weight_checkin_form
  - key: cancelled
    'on':
      collection: subscriptions
      op: update
      where:
        status: cancelled
    notify:
      to: owner
      subject: Your Barkbowl subscription is cancelled
      body: Your subscription has been cancelled and no further boxes will be sent. You can restart any time from the app.
      link: subscribe
  - key: wholesale_placed
    'on':
      collection: wholesale_orders
      op: insert
    notify:
      to:
      - role:support
      - admins
      subject: 'New wholesale order: {record.cases} cases of {record.recipe}'
      body: A retail partner placed a wholesale order for delivery on {record.delivery_date}.
      link: all_wholesale
  views:
  - key: home
    type: page
    title: Barkbowl
    nav: false
    sections:
    - type: hero
      title: Fresh food, **portioned for your dog**.
      text: Tell us about your dog. We work out the daily calories, the portion and the right recipes, and deliver fresh food
        on your schedule. Pause, skip or cancel any time.
      actions:
      - label: Get started
        href: /login
        style: primary
    - type: steps
      id: how-it-works
      title: How it works
      items:
      - title: Build a dog profile
        text: Breed, age, weight, body condition, activity, allergies and current food.
      - title: Get a plan
        text: Calories, daily portion and recipes, with the reasons. A nutrition advisor reviews dogs with medical conditions
          first.
      - title: Subscribe
        text: Choose the frequency and pay monthly by card. Change or pause up to 5 days before dispatch.
      - title: Check in every 4 weeks
        text: Send us your dog's weight and we adjust the portions.
    - type: data
      id: recipes
      title: Recipes
      source: collection:recipes
      display: cards
      fields:
      - key: name
      - key: description
      - key: allergens
        label: Contains
      empty: Recipes coming soon.
    - type: note
      content: Barkbowl food is made and delivered under APHA and DEFRA pet-food rules. Feeding plans are guidance, not veterinary
        advice. Cancel your subscription at any time in a few clicks.
  - key: dog_profile
    type: form
    title: Add a dog
    collection: dogs
    fields:
    - name
    - breed
    - age_years
    - weight_kg
    - neutered
    - body_condition
    - activity
    - allergies
    - current_food
    - medical_conditions
    submit:
      label: Save and create the plan
      message: Saved. We are preparing your dog's feeding plan.
      redirect: my_dogs
    edit: true
    roles:
    - user
    - admin
  - key: my_dogs
    type: cards
    title: My dogs
    source: collection:dogs
    data:
      display: cards
      fields:
      - key: name
      - key: weight_kg
        label: Weight (kg)
      - key: daily_kcal
        label: Daily kcal
      - key: portion_g
        label: Portion (g/day)
      - key: recommended_recipes
        label: Recipes
      - key: plan_status
        format: badge
        label: Plan
      - key: next_checkin
        format: date
        label: Next check-in
    roles:
    - user
    - admin
  - key: plans
    type: history
    title: Plan reports
    source: run
    roles:
    - user
    - admin
  - key: plan
    type: report
    title: Feeding plan
    source: run
    printable: true
    nav: false
  - key: subscribe
    type: form
    title: Subscribe
    collection: subscriptions
    fields:
    - dog
    - recipe
    - box_kg
    - frequency
    - address
    - next_dispatch
    submit:
      label: Start my subscription
      message: Subscription saved. Choose your monthly plan on the Plan page to pay by card.
      redirect: my_subscriptions
    edit: false
    roles:
    - user
    - admin
  - key: my_subscriptions
    type: table
    title: My subscriptions
    source: collection:subscriptions
    data:
      display: table
      fields:
      - key: dog
      - key: recipe
      - key: frequency
      - key: status
        format: badge
      - key: next_dispatch
        format: date
      - key: dispatch_status
        format: badge
      - key: tracking
    roles:
    - user
    - admin
  - key: manage_subscription
    type: form
    title: Pause, skip or change
    collection: subscriptions
    fields:
    - recipe
    - box_kg
    - frequency
    - address
    - status
    - skip_next
    submit:
      label: Save changes
      message: Saved. Changes made less than 5 days before dispatch apply to the following box.
      redirect: my_subscriptions
    edit: true
    roles:
    - user
    - admin
  - key: cancel_subscription
    type: form
    title: Cancel subscription
    collection: subscriptions
    fields:
    - status
    - cancel_reason
    - cancelled_date
    submit:
      label: Cancel my subscription
      message: Your subscription is cancelled.
      redirect: my_subscriptions
    edit: true
    roles:
    - user
    - admin
  - key: weight_checkin_form
    type: form
    title: Weight check-in
    collection: weight_checkins
    fields:
    - dog
    - weight_kg
    - body_condition
    - notes
    submit:
      label: Send check-in
      message: Thanks. We are adjusting the portions.
      redirect: my_dogs
    roles:
    - user
    - admin
  - key: reviews
    type: approvals
    title: Nutrition reviews
    approvals:
    - vet_review
    roles:
    - advisor
    - admin
  - key: advisor_dogs
    type: table
    title: Dogs with conditions
    source: collection:dogs
    data:
      display: table
      fields:
      - key: name
      - key: breed
      - key: weight_kg
      - key: medical_conditions
      - key: allergies
      - key: daily_kcal
      - key: advisor_status
        format: badge
      filters:
      - field: advisor_status
        op: '!='
        value: not_needed
    roles:
    - advisor
    - admin
  - key: all_subs
    type: table
    title: All subscriptions
    source: collection:subscriptions
    data:
      display: table
      fields:
      - key: dog
      - key: recipe
      - key: frequency
      - key: status
        format: badge
      - key: next_dispatch
        format: date
      - key: dispatch_status
        format: badge
      - key: tracking
      - key: address
      sort:
        field: next_dispatch
        dir: asc
      limit: 200
    export: true
    roles:
    - support
    - admin
  - key: wholesale_order
    type: form
    title: Place a wholesale order
    collection: wholesale_orders
    fields:
    - recipe
    - cases
    - delivery_date
    - shop_address
    - notes
    submit:
      label: Place order
      message: Order received. We will confirm it shortly.
      redirect: my_wholesale
    roles:
    - partner
    - admin
  - key: my_wholesale
    type: table
    title: My wholesale orders
    source: collection:wholesale_orders
    data:
      display: table
      fields:
      - key: recipe
      - key: cases
      - key: delivery_date
        format: date
      - key: status
        format: badge
    roles:
    - partner
    - admin
  - key: all_wholesale
    type: table
    title: All wholesale orders
    source: collection:wholesale_orders
    data:
      display: table
      fields:
      - key: recipe
      - key: cases
      - key: delivery_date
        format: date
      - key: shop_address
      - key: status
        format: badge
      sort:
        field: delivery_date
        dir: asc
    export: true
    roles:
    - support
    - admin
  - key: dashboard
    type: page
    title: Dashboard
    roles:
    - admin
    sections:
    - type: data
      title: Subscribers
      source: collection:subscriptions
      display: kpi
      filters:
      - field: status
        op: '='
        value: active
      kpis:
      - label: Active subscriptions
        agg: count
      - label: Kg per delivery cycle
        agg: sum
        field: box_kg
        format: number
    - type: data
      title: Paused subscriptions
      source: collection:subscriptions
      display: kpi
      filters:
      - field: status
        op: '='
        value: paused
      kpis:
      - label: Paused
        agg: count
    - type: data
      title: 'Churn: cancellations per month'
      source: collection:subscriptions
      display: chart
      chart: bar
      filters:
      - field: status
        op: '='
        value: cancelled
      groupBy:
        field: cancelled_date
        bucket: month
        aggs: []
      fields:
      - key: cancelled_date
        label: Month
      - key: count
        label: Cancellations
    - type: data
      title: 'Kitchen: subscription production per recipe'
      source: collection:subscriptions
      display: chart
      chart: bar
      filters:
      - field: status
        op: '='
        value: active
      groupBy:
        field: recipe
        aggs:
        - key: kg
          agg: sum
          field: box_kg
      fields:
      - key: recipe
        label: Recipe
      - key: kg
        label: Kg per cycle
      - key: count
        label: Boxes
    - type: data
      title: 'Kitchen: wholesale cases per recipe'
      source: collection:wholesale_orders
      display: table
      filters:
      - field: status
        op: '!='
        value: cancelled
      groupBy:
        field: recipe
        aggs:
        - key: cases
          agg: sum
          field: cases
      fields:
      - key: recipe
        label: Recipe
      - key: cases
        label: Cases
      - key: count
        label: Orders
  - key: admin
    type: admin
    title: Admin
    roles:
    - admin
  - key: account
    type: account
    title: Plan and payment
    roles:
    - user
  billing:
    modes:
    - subscription
    currency: gbp
    plans:
    - key: small_dog
      price: 39
      interval: month
      label: Barkbowl small dog
      includes:
      - Fresh food for dogs under 10 kg
      - Pause, skip or cancel any time
      roles:
      - user
    - key: medium_dog
      price: 59
      interval: month
      label: Barkbowl medium dog
      includes:
      - Fresh food for dogs 10-25 kg
      - Pause, skip or cancel any time
      roles:
      - user
    - key: large_dog
      price: 79
      interval: month
      label: Barkbowl large dog
      includes:
      - Fresh food for dogs over 25 kg
      - Pause, skip or cancel any time
      roles:
      - user
  extensions:
  - key: change_cutoff
    description: 'Pause, skip and recipe changes are allowed up to 5 days before dispatch: the app sends a reminder 7 days
      before dispatch and states the rule, but a hard block of edits inside the 5-day window needs custom logic.'
  - key: revenue_dashboard
    description: Revenue figures come from Stripe (Connect dashboard); the app does not record payments in a collection yet.
      The dashboard shows subscribers, churn and production volumes.
  - key: dispatch_scheduling
    description: Next dispatch dates and the dispatch status are set by customer service (or the owner when subscribing);
      automatic date rollover after each delivery is not available.
  - key: uk_cancellation
    description: Cancellation is one page (cancel_subscription), reachable in the navigation like sign-up. The billing cancellation
      of the card plan is done on the account page; ending the Stripe plan automatically on cancellation is not available.
  - key: sms_push
    description: SMS, WhatsApp and push messages are not available; all notices are plain-text emails.
