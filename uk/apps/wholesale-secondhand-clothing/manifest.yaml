apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: bundlebay
  displayName: Bundlebay
  tagline:
    en: Wholesale second-hand clothing, graded and traded with confidence.
    es: Ropa de segunda mano al por mayor, clasificada y comprada con confianza.
    it: Abbigliamento usato all'ingrosso, classificato e venduto con fiducia.
  description:
    en: A B2B marketplace where vetted sorting warehouses list graded bundles and resellers request quotes, negotiate, pay
      and track their orders.
    es: Un marketplace B2B donde almacenes de clasificación verificados publican lotes con grado y los revendedores piden
      presupuestos, negocian, pagan y siguen sus pedidos.
    it: Un marketplace B2B dove magazzini di selezione verificati pubblicano lotti con grado e i rivenditori chiedono preventivi,
      trattano, pagano e tracciano gli ordini.
  langs:
  - en
  - es
  - it
  defaultLang: en
  timezone: Europe/Madrid
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f3a34'
      accent: '#e07a3f'
      background: '#f7f3ec'
      foreground: '#1d2421'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Bundle
      color: primary
    - text: bay
      color: accent
    width: wide
  header:
    links:
    - label:
        en: How it works
        es: Cómo funciona
        it: Come funziona
      href: '#how-it-works'
    - label:
        en: Grading
        es: Clasificación
        it: Classificazione
      href: '#grading'
    cta:
      label:
        en: Apply
        es: Solicitar acceso
        it: Richiedi accesso
      href: /v/apply
  auth:
    method: magic_link
    anonymous:
      views:
      - home
      - apply
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: seller
      label:
        en: Seller (warehouse)
        es: Vendedor (almacén)
        it: Venditore (magazzino)
      assignedBy: invite
    - key: buyer
      label:
        en: Buyer (reseller)
        es: Comprador (revendedor)
        it: Acquirente (rivenditore)
      assignedBy: invite
    - key: user
      label: User
      assignedBy: signup
  limits:
  - action: agent:grader
    per: user
    max: 10
    window: day
    roles:
    - seller
    - buyer
  - action: agent:listing_grader
    per: user
    max: 40
    window: day
    roles:
    - seller
  agents:
  - key: grader
    role: main
    description: 'Pre-listing grade check: scores garment condition from photos.'
    profile:
      inline:
        display_name: Bundlebay grade check
        crews:
        - id: grader
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You grade wholesale second-hand clothing bundles from photos. Open every photo with the read_photo
            tool (call it with each file id). Score condition 0-100 from what you SEE: stains, holes, pilling, fading, stretched
            fabric, broken zips, label visibility, odour cannot be judged. Map the score to a grade: A (85-100, like new or
            premium vintage), B (65-84, good, light wear), C (40-64, visible wear, repairable), D (0-39, heavy wear, rags
            or recycling). Start with a level-1 title "# Grade <letter> — <category>". Then sections ## Score (number and
            one-line rationale), ## What I see (bullets per photo), ## Defects found, ## Confidence (low/medium/high; say
            plainly if photos are too few, dark or blurry to grade). Never invent details you cannot see. This is an automated
            estimate, the seller may contest it.'
    appTools:
    - name: read_photo
      description: Read a photo the user uploaded
      action: read_file
    goalTemplate: 'Category: {category_label}

      Photos (file ids): {photos}

      {?notes}Seller notes: {notes}{/notes}

      Write the report in the language with ISO code {lang}.'
    output: markdown
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.6
  - key: listing_grader
    role: helper
    description: Grades each new bundle from its photos and saves the grade on the listing.
    profile:
      inline:
        display_name: Bundlebay listing grader
        crews:
        - id: listing_grader
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 14
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You grade a newly listed wholesale clothing bundle from its photos. Open every photo with read_photo
            (file ids are in the goal). Score condition 0-100 from what you see (stains, holes, pilling, fading, stretching,
            hardware) and map to a grade: A 85-100, B 65-84, C 40-64, D 0-39. Then call save_grade ONCE for the bundle record
            id in the event, setting ai_grade (A/B/C/D), ai_score (number), ai_notes (max 400 characters, buyer-facing, factual)
            and grade_status "ai_graded". If photos are unusable, set ai_notes to say so and grade_status "needs_photos" without
            a grade. Never guess beyond what photos show. End with a one-line summary.'
    appTools:
    - name: read_photo
      description: Read a photo the user uploaded
      action: read_file
    - name: save_grade
      description: Save the grade fields on the bundle record
      action: write
      collection: bundles
      scope: user
    goalTemplate: 'Grade this new bundle.

      Title: {record.title}

      Category: {record.category}

      Photo file ids: {record.photos}

      Event: {event}'
    output: markdown
    limits:
      maxTurns: 14
      maxBudgetUsd: 0.6
  inputForm:
    title:
      en: Grade check
      es: Control de grado
      it: Controllo del grado
    fields:
    - name: category
      type: select
      required: true
      label: Category
      options:
      - value: tops
        label: Tops & T-shirts
      - value: jeans
        label: Jeans & denim
      - value: outerwear
        label: Outerwear
      - value: sportswear
        label: Sportswear
      - value: dresses
        label: Dresses & skirts
      - value: mixed
        label: Mixed
    - name: photos
      type: file
      required: true
      accept:
      - jpg
      - jpeg
      - png
      - webp
      maxMb: 10
      multiple: true
      capture: true
      label: Photos of the bundle
      help: 'Up to 10 photos: close-ups of labels, defects and a spread of items.'
    - name: notes
      type: textarea
      maxLength: 400
      label: Notes (optional)
  data:
    collections:
    - name: seller_profiles
      ownedBy: user
      description: Company details of each vetted seller (also the payee for payouts)
      fields:
      - name: company_name
        type: text
        required: true
        label: Company name
      - name: vat_number
        type: text
        required: true
        label: VAT number
      - name: country
        type: country
        required: true
        label: Country
      - name: address
        type: text
        label: Warehouse address
      - name: phone
        type: text
        label: Phone
      - name: website
        type: url
        label: Website
    - name: applications
      ownedBy: org
      description: Applications of sellers and buyers, vetted by an admin
      fields:
      - name: account_type
        type: select
        required: true
        label: I am a
        options:
        - value: seller
          label: Seller (sorting warehouse)
        - value: buyer
          label: Buyer (reseller / vintage shop)
      - name: company_name
        type: text
        required: true
        label: Company name
      - name: vat_number
        type: text
        required: true
        label: VAT number
      - name: country
        type: country
        required: true
        label: Country
      - name: contact_name
        type: text
        required: true
        label: Contact name
      - name: email
        type: email
        required: true
        label: Work email
      - name: phone
        type: text
        label: Phone
      - name: website
        type: url
        label: Website
      - name: message
        type: textarea
        maxLength: 800
        label: Tell us about your business
      - name: documents
        type: file
        accept:
        - pdf
        - jpg
        - png
        maxMb: 10
        multiple: true
        label: Company registration (optional)
    - name: bundles
      ownedBy: user
      description: Bundles listed by sellers; published ones are readable by buyers
      fields:
      - name: title
        type: text
        required: true
        label: Title
      - name: category
        type: select
        required: true
        label: Category
        options:
        - tops
        - jeans
        - outerwear
        - sportswear
        - dresses
        - mixed
      - name: brands
        type: text
        required: true
        label: Brands
      - name: era
        type: select
        required: true
        label: Era
        options:
        - 2010s-today
        - 2000s
        - 1990s
        - 1980s
        - 1970s-older
        - mixed
      - name: items
        type: number
        required: true
        label: Number of items
      - name: weight_kg
        type: number
        required: true
        label: Weight (kg)
      - name: price_per_kg
        type: number
        required: true
        label: Price per kg (EUR)
      - name: origin_country
        type: country
        label: Ships from
      - name: seller_email
        type: email
        required: true
        label: Your contact email (quotes arrive here)
      - name: photos
        type: file
        required: true
        accept:
        - jpg
        - jpeg
        - png
        - webp
        maxMb: 10
        multiple: true
        capture: true
        label: Photos
      - name: status
        type: select
        label: Status
        default: published
        options:
        - draft
        - published
        - sold
      - name: ai_grade
        type: select
        label: Grade
        options:
        - A
        - B
        - C
        - D
      - name: ai_score
        type: number
        label: Condition score (0-100)
      - name: ai_notes
        type: textarea
        label: Grading notes
      - name: grade_status
        type: select
        label: Grade status
        default: pending
        options:
        - pending
        - ai_graded
        - needs_photos
        - contested
        - confirmed
      access:
      - role: buyer
        where:
          status: published
        can:
        - read
    - name: grade_contests
      ownedBy: user
      description: A seller contests the AI grade; an admin decides
      fields:
      - name: bundle_title
        type: text
        required: true
        label: Bundle
      - name: seller_email
        type: email
        required: true
        label: Your email
      - name: ai_grade
        type: select
        required: true
        label: Grade given
        options:
        - A
        - B
        - C
        - D
      - name: requested_grade
        type: select
        required: true
        label: Grade you ask for
        options:
        - A
        - B
        - C
        - D
      - name: reason
        type: textarea
        required: true
        maxLength: 1000
        label: Why the grade is wrong
      - name: evidence
        type: file
        accept:
        - jpg
        - jpeg
        - png
        - webp
        - pdf
        maxMb: 10
        multiple: true
        label: Extra photos or evidence
      - name: status
        type: select
        label: Decision
        default: open
        options:
        - open
        - upheld
        - overturned
      - name: admin_decision
        type: textarea
        label: Admin decision notes
      - name: final_grade
        type: select
        label: Final grade
        options:
        - A
        - B
        - C
        - D
    - name: rfqs
      ownedBy: user
      description: Requests for quotes from buyers and the negotiation that follows
      fields:
      - name: bundle_title
        type: text
        required: true
        label: Bundle
        optionsFrom: collection:bundles
      - name: seller_email
        type: email
        required: true
        label: Seller email (shown on the listing)
      - name: buyer_email
        type: email
        required: true
        label: Your email
      - name: kilos
        type: number
        required: true
        label: Kilos wanted
      - name: target_price_per_kg
        type: number
        label: Target price per kg (EUR)
      - name: destination_country
        type: country
        required: true
        label: Deliver to
      - name: message
        type: textarea
        maxLength: 800
        label: Message to the seller
      - name: status
        type: select
        label: Status
        default: requested
        options:
        - requested
        - quoted
        - accepted
        - declined
      - name: quoted_price_per_kg
        type: number
        label: Quoted price per kg (EUR)
      - name: valid_until
        type: date
        label: Quote valid until
      - name: seller_reply
        type: textarea
        maxLength: 800
        label: Reply
      - name: buyer_response
        type: select
        label: Your response
        options:
        - value: accept
          label: Accept the quote
        - value: counter
          label: Counter-offer
        - value: walk_away
          label: Decline
      - name: counter_price_per_kg
        type: number
        label: Counter price per kg (EUR)
      access:
      - role: seller
        where:
          seller_email: '{user.email}'
        can:
        - read
        - write
    - name: orders
      ownedBy: user
      description: Orders created by the seller from an accepted quote; the buyer reads them by email
      fields:
      - name: bundle_title
        type: text
        required: true
        label: Bundle
      - name: category
        type: select
        required: true
        label: Category
        options:
        - tops
        - jeans
        - outerwear
        - sportswear
        - dresses
        - mixed
      - name: buyer_email
        type: email
        required: true
        label: Buyer email
      - name: seller_email
        type: email
        required: true
        label: Your email
      - name: kilos
        type: number
        required: true
        label: Kilos
      - name: price_per_kg
        type: number
        required: true
        label: Agreed price per kg (EUR)
      - name: total_eur
        type: number
        required: true
        label: Total (EUR)
      - name: order_date
        type: date
        required: true
        label: Order date
      - name: commission_pct
        type: number
        roles:
        - admin
        default: 8
        label: Commission %
      - name: status
        type: select
        roles:
        - admin
        default: awaiting_payment
        label: Status
        options:
        - awaiting_payment
        - paid_held
        - shipped
        - delivered
        - released
        - disputed
        - refunded
      - name: carrier
        type: select
        optionsFrom: collection:carriers
        label: Logistics partner
      - name: pickup_date
        type: date
        label: Pickup date
      - name: shipping_notes
        type: textarea
        label: Shipping notes
      - name: shipping_requested
        type: boolean
        label: Request shipping booking
      - name: tracking_number
        type: text
        roles:
        - admin
        label: Tracking number
      - name: tracking_url
        type: url
        roles:
        - admin
        label: Tracking link
      - name: eta
        type: date
        roles:
        - admin
        label: Estimated delivery
      - name: receipt_confirmed
        type: boolean
        label: I received the goods and they match the listing
      access:
      - role: user
        where:
          buyer_email: '{user.email}'
        can:
        - read
        - write
    - name: disputes
      ownedBy: user
      description: Disputes on an order, decided by an admin
      fields:
      - name: order_ref
        type: text
        required: true
        label: Order (bundle title and date)
      - name: opened_on
        type: date
        required: true
        label: Date
      - name: seller_email
        type: email
        required: true
        label: Seller email
      - name: kind
        type: select
        required: true
        label: Issue
        options:
        - grade_mismatch
        - damaged
        - missing_items
        - late_delivery
        - other
      - name: description
        type: textarea
        required: true
        maxLength: 1500
        label: What happened
      - name: evidence
        type: file
        accept:
        - jpg
        - jpeg
        - png
        - webp
        - pdf
        maxMb: 10
        multiple: true
        capture: true
        label: Photos or documents
      - name: status
        type: select
        label: Status
        default: open
        options:
        - open
        - resolved_refund
        - resolved_release
        - rejected
      - name: admin_decision
        type: textarea
        label: Admin decision
      access:
      - role: seller
        where:
          seller_email: '{user.email}'
        can:
        - read
    - name: carriers
      ownedBy: shared
      description: Logistics partners, kept by the admins
      fields:
      - name: name
        type: text
        required: true
        label: Partner
      - name: regions
        type: text
        label: Regions served
      - name: service
        type: text
        label: Service
      - name: rate_per_kg_eur
        type: number
        label: Indicative rate per kg (EUR)
      - name: contact_email
        type: email
        label: Contact
  views:
  - key: home
    type: page
    title: Bundlebay
    nav: false
    sections:
    - type: hero
      layout: stack
      band: true
      eyebrow:
        en: B2B wholesale
        es: Mayorista B2B
        it: Ingrosso B2B
      title:
        en: Wholesale second-hand clothing, **graded** before you buy.
        es: Ropa de segunda mano al por mayor, **clasificada** antes de comprar.
        it: Abbigliamento usato all'ingrosso, **classificato** prima di comprare.
      text:
        en: Vetted sorting warehouses list bundles with photos and an AI condition grade. Resellers request quotes, negotiate,
          pay by card and track shipping. Funds are held until you confirm receipt.
        es: Almacenes de clasificación verificados publican lotes con fotos y un grado de estado por IA. Los revendedores
          piden presupuestos, negocian, pagan con tarjeta y siguen el envío. Los fondos se retienen hasta confirmar la recepción.
        it: Magazzini di selezione verificati pubblicano lotti con foto e un grado di condizione calcolato dall'IA. I rivenditori
          chiedono preventivi, trattano, pagano con carta e tracciano la spedizione. I fondi restano bloccati fino alla conferma
          di ricezione.
      actions:
      - label:
          en: Apply for access
          es: Solicitar acceso
          it: Richiedi accesso
        href: /v/apply
        style: primary
      - label:
          en: Sign in
          es: Entrar
          it: Accedi
        href: /login
        style: ghost
    - type: steps
      id: how-it-works
      title:
        en: How it works
        es: Cómo funciona
        it: Come funziona
      items:
      - title:
          en: Apply and get vetted
          es: Solicita y sé verificado
          it: Candidati e vieni verificato
        text:
          en: Company details and VAT number are checked by our team.
          es: Nuestro equipo verifica los datos de la empresa y el NIF/IVA.
          it: Il nostro team verifica i dati aziendali e la partita IVA.
      - title:
          en: List or browse bundles
          es: Publica o explora lotes
          it: Pubblica o sfoglia i lotti
        text:
          en: Category, brands, era, weight, grade, photos and price per kilo.
          es: Categoría, marcas, época, peso, grado, fotos y precio por kilo.
          it: Categoria, marchi, epoca, peso, grado, foto e prezzo al chilo.
      - title:
          en: Quote, negotiate, pay
          es: Presupuesto, negociación, pago
          it: Preventivo, trattativa, pagamento
        text:
          en: Request a quote, agree a price, pay by card; funds are held in escrow.
          es: Pide presupuesto, acuerda precio y paga con tarjeta; los fondos quedan en depósito.
          it: Chiedi un preventivo, concorda il prezzo e paga con carta; i fondi restano in escrow.
      - title:
          en: Ship, track, release
          es: Envía, sigue, libera
          it: Spedisci, traccia, rilascia
        text:
          en: Book a logistics partner, follow tracking, confirm receipt to release payment.
          es: Reserva un socio logístico, sigue el seguimiento y confirma la recepción para liberar el pago.
          it: Prenota un partner logistico, segui il tracking e conferma la ricezione per sbloccare il pagamento.
    - type: cards
      id: grading
      title:
        en: Grades you can read
        es: Grados claros
        it: Gradi chiari
      items:
      - title: A
        text:
          en: Like new or premium vintage.
          es: Como nuevo o vintage premium.
          it: Come nuovo o vintage premium.
      - title: B
        text:
          en: Good condition, light wear.
          es: Buen estado, desgaste ligero.
          it: Buone condizioni, usura leggera.
      - title: C
        text:
          en: Visible wear, repairable.
          es: Desgaste visible, reparable.
          it: Usura visibile, riparabile.
      - title: D
        text:
          en: Heavy wear, rags or recycling. Sellers can contest a grade; an admin decides.
          es: Mucho desgaste, trapos o reciclaje. Los vendedores pueden impugnar un grado; decide un administrador.
          it: Forte usura, stracci o riciclo. I venditori possono contestare un grado; decide un amministratore.
    - type: note
      content:
        en: Grades are automated estimates from photos, not a guarantee of every item.
        es: Los grados son estimaciones automáticas a partir de fotos, no una garantía de cada prenda.
        it: I gradi sono stime automatiche dalle foto, non una garanzia su ogni capo.
  - key: apply
    type: form
    title:
      en: Apply for access
      es: Solicitar acceso
      it: Richiedi accesso
    collection: applications
    nav: false
    submit:
      label:
        en: Send application
        es: Enviar solicitud
        it: Invia candidatura
      message:
        en: Thank you. Our team will vet your company and email you.
        es: Gracias. Nuestro equipo verificará tu empresa y te escribirá.
        it: Grazie. Il nostro team verificherà la tua azienda e ti scriverà.
  - key: company
    type: form
    title:
      en: Company details
      es: Datos de la empresa
      it: Dati aziendali
    collection: seller_profiles
    roles:
    - seller
    edit: true
    submit:
      label: Save
      message:
        en: Saved.
        es: Guardado.
        it: Salvato.
  - key: new_bundle
    type: form
    title:
      en: List a bundle
      es: Publicar un lote
      it: Pubblica un lotto
    collection: bundles
    fields:
    - title
    - category
    - brands
    - era
    - items
    - weight_kg
    - price_per_kg
    - origin_country
    - seller_email
    - photos
    - status
    roles:
    - seller
    submit:
      label:
        en: Publish
        es: Publicar
        it: Pubblica
      message:
        en: Bundle saved. The AI grade appears within a minute.
        es: Lote guardado. El grado por IA aparece en un minuto.
        it: Lotto salvato. Il grado IA appare entro un minuto.
      redirect: my_bundles
  - key: my_bundles
    type: table
    title:
      en: My bundles
      es: Mis lotes
      it: I miei lotti
    source: collection:bundles
    roles:
    - seller
    - admin
    data:
      display: table
      fields:
      - key: title
        label: Title
      - key: category
        label: Category
        format: badge
      - key: items
        label: Items
        format: number
      - key: weight_kg
        label: kg
        format: number
      - key: price_per_kg
        label: EUR/kg
        format: money
      - key: ai_grade
        label: Grade
        format: badge
      - key: grade_status
        label: Grade status
        format: badge
      - key: status
        label: Status
        format: badge
      sort:
        field: title
        dir: asc
    export: true
  - key: browse
    type: cards
    title:
      en: Browse bundles
      es: Explorar lotes
      it: Sfoglia i lotti
    source: collection:bundles
    roles:
    - buyer
    - admin
    data:
      display: cards
      fields:
      - key: title
        label: Title
      - key: category
        label: Category
        format: badge
      - key: brands
        label: Brands
      - key: era
        label: Era
