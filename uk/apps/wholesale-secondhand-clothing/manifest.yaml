  triggers:
  - key: grade_new_bundle
    'on':
      collection: bundles
      op: insert
      where:
        grade_status: pending
    start:
      agent: listing_grader
    goal: 'Grade the new bundle {record.title}. Photo file ids: {record.photos}. Event: {event}'
  - key: application_in
    'on':
      collection: applications
      op: insert
    notify:
      to: admins
      subject: 'New {record.account_type} application: {record.company_name}'
      body: '{record.company_name} ({record.country}, VAT {record.vat_number}) applied as {record.account_type}. Review it
        and grant the role.'
  - key: rfq_in
    'on':
      collection: rfqs
      op: insert
    notify:
      to: record.seller_email
      subject: 'New quote request: {record.bundle_title}'
      body: A buyer asks for {record.kilos} kg of {record.bundle_title}, delivered to {record.destination_country}. Reply
        with your price.
      link: quotes
  - key: rfq_quoted
    'on':
      collection: rfqs
      op: update
      where:
        status: quoted
    notify:
      to: record.buyer_email
      subject: You have a quote for {record.bundle_title}
      body: The seller quoted {record.quoted_price_per_kg} EUR/kg. Accept, counter or decline.
      link: quotes
  - key: rfq_buyer_accepts
    'on':
      collection: rfqs
      op: update
      where:
        buyer_response: accept
    notify:
      to: record.seller_email
      subject: 'Quote accepted: {record.bundle_title}'
      body: The buyer accepted your quote. Create the order so payment can be requested.
      link: new_order
  - key: order_paid
    'on':
      collection: orders
      op: update
      where:
        status: paid_held
    notify:
      to:
      - record.buyer_email
      - record.seller_email
      subject: 'Payment received and held: {record.bundle_title}'
      body: 'The payment of {record.total_eur} EUR is held in escrow. Seller: prepare the shipment and book shipping.'
      link: orders
  - key: shipping_requested
    'on':
      collection: orders
      op: update
      where:
        shipping_requested: true
    notify:
      to: admins
      subject: 'Shipping booking requested: {record.bundle_title}'
      body: The seller asks for {record.carrier}, pickup {record.pickup_date}. Book it and add the tracking.
      link: orders
  - key: order_shipped
    'on':
      collection: orders
      op: update
      where:
        status: shipped
    notify:
      to: record.buyer_email
      subject: 'Your order is on its way: {record.bundle_title}'
      body: Carrier {record.carrier}, tracking {record.tracking_number}. Follow it in your orders.
      link: orders
  - key: receipt_confirmed
    'on':
      collection: orders
      op: update
      where:
        receipt_confirmed: true
    notify:
      to:
      - admins
      - record.seller_email
      subject: 'Receipt confirmed: {record.bundle_title}'
      body: The buyer confirmed receipt. Funds are due for release to the seller minus commission.
      link: orders
  - key: order_released
    'on':
      collection: orders
      op: update
      where:
        status: released
    notify:
      to: record.seller_email
      subject: 'Payment released: {record.bundle_title}'
      body: The payout for {record.bundle_title} has been released, minus our commission.
      link: orders
  - key: contest_in
    'on':
      collection: grade_contests
      op: insert
    notify:
      to: admins
      subject: 'Grade contested: {record.bundle_title}'
      body: 'A seller asks to change grade {record.ai_grade} to {record.requested_grade}: {record.reason}'
      link: contests
  - key: contest_upheld
    'on':
      collection: grade_contests
      op: update
      where:
        status: upheld
    notify:
      to: record.seller_email
      subject: 'Grade confirmed: {record.bundle_title}'
      body: An admin reviewed your contest and kept the grade. {record.admin_decision}
      link: contests
  - key: contest_overturned
    'on':
      collection: grade_contests
      op: update
      where:
        status: overturned
    notify:
      to: record.seller_email
      subject: 'Grade changed: {record.bundle_title}'
      body: 'An admin accepted your contest. New grade: {record.final_grade}. {record.admin_decision}'
      link: contests
  - key: dispute_in
    'on':
      collection: disputes
      op: insert
    notify:
      to:
      - admins
      - record.seller_email
      subject: 'Dispute opened: {record.order_ref}'
      body: 'Issue: {record.kind}. {record.description}'
      link: disputes
  notifications:
    emailOnRunDone: true
  billing:
    modes:
    - per_transaction
    currency: eur
    transactionFeePct: 8
    sellers: collection:seller_profiles
  extensions:
  - key: escrow_payouts
    description: Card payment, holding funds until the buyer confirms receipt, release to the seller minus commission, and
      refunds on disputes are done by the payment and escrow partner. In the app admins set order status (paid_held, released,
      refunded) on the data page.
  - key: logistics_partners_api
    description: Shipping is booked with partners by the admins from the booking request; live carrier tracking via their
      API is not connected yet, so tracking number, link and ETA are entered on the order.
  - key: vision_model
    description: Grading here uses the platform's image reading by an agent. The proprietary Bundlebay vision model can replace
      it later, writing the same ai_grade, ai_score and ai_notes fields.
  - key: quote_prefill
    description: The quote form asks for the seller's email, which is shown on each listing; automatic prefill from the chosen
      bundle and automatic order creation from an accepted quote are not available yet.
