apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: coverstack
  displayName: Coverstack
  tagline:
    en: Business insurance, explained and arranged by an AI broker team.
  description:
    en: Coverstack helps small businesses work out which covers they need, compares quotes side by side, and has a qualified
      broker approve every recommendation before you buy.
  langs:
  - en
  defaultLang: en
  timezone: Europe/London
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12304a'
      accent: '#1f8a70'
      background: '#f6f8fa'
      foreground: '#17222d'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Cover
      color: primary
    - text: stack
      color: accent
  header:
    links:
    - label: How it works
      href: '#how'
    - label: Covers
      href: '#covers'
    cta:
      label: Get a quote
      href: /v/intake
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: broker
      label: Qualified broker
      assignedBy: invite
    - key: compliance
      label: Compliance
      assignedBy: invite
    - key: customer
      label: Customer
      assignedBy: signup
  limits:
  - action: chat
    per: user
    max: 60
    window: day
    roles:
    - customer
  agents:
  - key: adviser
    role: main
    description: Checks the business on Companies House, recommends covers, drafts the ICOBS demands-and-needs statement and
      asks the broker to approve.
    awaits:
    - broker_review
    profile:
      inline:
        display_name: Coverstack adviser
        crews:
        - id: adviser
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 14
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the preparation assistant of a regulated UK insurance broker serving small businesses. You
            do NOT give final advice: a qualified broker reviews and approves everything before the customer sees a recommendation
            as final.

            Steps: 1) read the customer''s intake with read_submission. 2) If a company number is given, call companies_house
            with path /company/<number> (and /company/<number>/officers if useful) to confirm name, status, incorporation
            date, SIC codes; if there is no number, search with query q=<business name> on path /search/companies. Report
            mismatches with the intake. 3) Recommend the covers the business probably needs (public liability, employers''
            liability - legally required in the UK if it has employees, professional indemnity, contents/property, cyber and
            others) with a plain-English reason for each, and say which of the wanted covers seem unnecessary. 4) Draft a
            demands-and-needs statement following FCA ICOBS 5.2 and 6: the customer''s demands, needs, the information relied
            on, assumptions, and what is NOT covered or not advised. 5) Save the recommendation with save_recommendation (status
            draft). 6) Call request_broker_review so a qualified broker can approve it. 7) Quotes: only save a quote with
            save_quote if real insurer panel data was given to you; never invent premiums, limits or exclusions. If none are
            available say quotes are pending.

            Final answer: Markdown starting with ''# Recommendation - <business name>'', then ## Company check, ## Recommended
            covers (table: cover, why, priority), ## Demands and needs statement, ## Open questions, ## Next steps. Clearly
            label it as awaiting broker approval. Never promise cover or prices.'
          mcp_servers: []
    appTools:
    - name: read_submission
      description: Read the customer's quote intake
      action: read
      collection: submissions
      scope: user
    - name: companies_house
      description: Query the Companies House public API (GET). path e.g. /company/12345678 or /search/companies with query
        q
      action: http
      http:
        method: GET
        url: https://api.company-information.service.gov.uk
        allowPath: true
        attribution: Companies House, Open Government Licence v3.0
        credential:
          provider: companies_house
          header: Authorization
          format: Basic {secret}
    - name: save_recommendation
      description: Save the draft recommendation for broker review
      action: append
      collection: recommendations
      scope: user
    - name: save_quote
      description: Save one insurer quote (only real data from a panel)
      action: append
      collection: quotes
      scope: user
    output: markdown
    limits:
      maxTurns: 14
      maxBudgetUsd: 0.6
  - key: assistant
    role: helper
    description: Chat assistant that asks follow-up questions about the business and explains covers.
    profile:
      inline:
        display_name: Coverstack assistant
        chat_mode: true
        crews:
        - id: assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are Coverstack''s friendly assistant for small-business owners buying insurance in the UK. Read
            the customer''s intake with read_submission. Ask short follow-up questions (one or two at a time) about what is
            missing or unclear: what the business really does, subcontractors, work done at client sites, data held, stock
            and equipment values, past claims. Save useful answers with update_submission. Explain covers in plain English.
            You are not the adviser: say that a qualified broker reviews the recommendation before anything is bought, and
            never state that something is covered or quote prices you were not given. You may check a company with companies_house.'
    goalTemplate: 'Conversation so far:

      {history}


      Customer says: {message}'
    appTools:
    - name: read_submission
      description: Read the customer's quote intake
      action: read
      collection: submissions
      scope: user
    - name: update_submission
      description: Add details to the customer's intake
      action: write
      collection: submissions
      scope: user
    - name: companies_house
      description: Query the Companies House public API (GET). path e.g. /company/12345678 or /search/companies with query
        q
      action: http
      http:
        method: GET
        url: https://api.company-information.service.gov.uk
        allowPath: true
        attribution: Companies House, Open Government Licence v3.0
        credential:
          provider: companies_house
          header: Authorization
          format: Basic {secret}
    output: markdown
  data:
    credentials:
    - provider: companies_house
      kind: api_key
      scope: org
      label: Companies House API key
      help: Register at developer.company-information.service.gov.uk, create a REST key, and paste base64 of '<key>:' (key,
        then a colon).
    collections:
    - name: submissions
      description: Quote intakes filled by customers
      ownedBy: user
      fields:
      - name: business_name
        type: text
        required: true
        label: Business name
      - name: company_number
        type: text
        label: Companies House number
        help: Leave empty for sole traders
      - name: activity
        type: textarea
        required: true
        label: What the business does
        maxLength: 1000
      - name: turnover
        type: number
        required: true
        label: Annual turnover (GBP)
      - name: employees
        type: number
        required: true
        label: Number of employees
      - name: premises
        type: textarea
        label: Premises (owned, rented, home, none)
      - name: claims_history
        type: textarea
        label: Claims in the last 5 years
      - name: covers_wanted
        type: multiselect
        required: true
        label: Covers wanted
        options:
        - value: public_liability
          label: Public liability
        - value: employers_liability
          label: Employers' liability
        - value: professional_indemnity
          label: Professional indemnity
        - value: contents
          label: Contents
        - value: cyber
          label: Cyber
      - name: status
        type: select
        label: Status
        default: new
        options:
        - value: new
          label: New
        - value: in_review
          label: In broker review
        - value: quoted
          label: Quoted
        - value: bought
          label: Bought
        - value: lost
          label: Lost
      access:
      - role: broker
        can:
        - read
        - write
      - role: compliance
        can:
        - read
    - name: recommendations
      description: Draft recommendations and demands-and-needs statements
      ownedBy: user
      fields:
      - name: submission
        type: text
        label: Submission
      - name: business_name
        type: text
        label: Business
      - name: covers
        type: textarea
        label: Recommended covers
      - name: rationale
        type: textarea
        label: Why
      - name: demands_needs
        type: textarea
        label: Demands and needs statement
      - name: status
        type: select
        label: Status
        default: draft
        options:
        - draft
        - approved
        - rejected
      access:
      - role: broker
        can:
        - read
        - write
      - role: compliance
        can:
        - read
    - name: quotes
      description: Insurer quotes to compare
      ownedBy: user
      fields:
      - name: submission
        type: text
        label: Submission
      - name: insurer
        type: text
        label: Insurer
      - name: cover
        type: text
        label: Cover
      - name: premium
        type: number
        label: Annual premium (GBP)
      - name: limit
        type: text
        label: Limit of indemnity
      - name: excess
        type: text
        label: Excess
      - name: exclusions
        type: textarea
        label: Key exclusions
      - name: status
        type: select
        label: Status
        default: offered
        options:
        - offered
        - accepted
        - declined
        - expired
      access:
      - role: broker
        can:
        - read
        - write
      - role: compliance
        can:
        - read
    - name: policies
      description: Bought policies and renewal dates
      ownedBy: user
      fields:
      - name: policy_number
        type: text
        label: Policy number
      - name: insurer
        type: text
        label: Insurer
      - name: cover
        type: text
        label: Cover
      - name: premium
        type: number
        label: Annual premium (GBP)
      - name: start_date
        type: date
        label: Start date
      - name: expiry_date
        type: date
        label: Expiry date
      - name: status
        type: select
        label: Status
        default: active
        options:
        - active
        - cancelled
        - lapsed
      access:
      - role: broker
        can:
        - read
        - write
      - role: compliance
        can:
        - read
    - name: policy_changes
      description: Mid-term change requests
      ownedBy: user
      fields:
      - name: policy_number
        type: text
        required: true
        label: Policy number
      - name: change_type
        type: select
        required: true
        label: Change
        options:
        - value: address
          label: New address
        - value: turnover
          label: Turnover change
        - value: employees
          label: Employee numbers
        - value: cover
          label: Add or remove cover
        - value: other
          label: Other
      - name: details
        type: textarea
        required: true
        label: Details
      - name: effective_date
        type: date
        label: Effective from
      - name: status
        type: select
        label: Status
        default: requested
        options:
        - requested
        - done
        - rejected
      access:
      - role: broker
        can:
        - read
        - write
      - role: compliance
        can:
        - read
  approvals:
  - key: broker_review
    title: Broker review of recommendation
    description: A qualified broker approves the recommendation and demands-and-needs statement before the customer buys.
    role: broker
    decidedBy: role
    fields:
    - business_name
    - covers
    - rationale
    timeoutMinutes: 10080
  triggers:
  - key: intake_received
    'on':
      collection: submissions
      op: insert
    start:
      agent: adviser
    goal: 'New quote intake. Business: {record.business_name}; company number: {record.company_number}. Activity: {record.activity}.
      Turnover: {record.turnover} GBP; employees: {record.employees}. Premises: {record.premises}. Claims history: {record.claims_history}.
      Covers wanted: {record.covers_wanted}. Prepare the recommendation as instructed. Today is {date}.'
  - key: intake_notify
    'on':
      collection: submissions
      op: insert
    notify:
      to:
      - role:broker
      subject: 'New quote intake: {record.business_name}'
      body: A new intake from {record.business_name} has been received. A draft recommendation will appear for your review.
      link: broker_queue
  - key: recommendation_approved
    'on':
      approval: broker_review
      decision: approved
    notify:
      to:
      - owner
      subject: Your recommendation is approved
      body: A qualified broker has approved your recommendation. You can now review it and your quotes in Coverstack.
      link: my_recommendations
  - key: renewal_60
    'on':
      date:
        collection: policies
        field: expiry_date
        offsetDays: -60
        hour: 8
    notify:
      to:
      - owner
      - role:broker
      subject: Your policy {record.policy_number} renews in 60 days
      body: Your {record.cover} policy with {record.insurer} expires on {record.expiry_date}. Open Coverstack to review your
        cover and start your renewal.
      link: my_policies
  - key: change_requested
    'on':
      collection: policy_changes
      op: insert
    notify:
      to:
      - role:broker
      subject: Mid-term change request on {record.policy_number}
      body: 'A customer asked for a change: {record.change_type}. Details: {record.details}'
      link: broker_queue
  views:
  - key: home
    type: page
    title: Coverstack
    nav: false
    sections:
    - type: hero
      layout: stack
      band: true
      eyebrow: Business insurance, simplified
      title: The right **cover** for your small business, checked by a real broker.
      text: Tell us about your business, chat with our AI assistant, and get a clear recommendation, side-by-side quotes and
        a qualified broker's approval before you buy.
      actions:
      - label: Get a quote
        href: /v/intake
        style: primary
      - label: Sign in
        href: /login
        style: ghost
    - type: steps
      id: how
      title: How it works
      items:
      - title: Tell us about your business
        text: 'A short intake: activity, turnover, staff, premises and claims.'
      - title: Chat and check
        text: Our assistant asks follow-up questions and checks your company on Companies House.
      - title: Broker-approved recommendation
        text: You get the covers you probably need, why, and a demands-and-needs statement approved by a qualified broker.
      - title: Compare and buy
        text: Compare price, limits and exclusions, then buy online.
    - type: cards
      id: covers
      title: Covers we arrange
      items:
      - title: Public liability
        text: If a customer or member of the public is hurt or their property damaged.
        badge: 🛡️
      - title: Employers' liability
        text: Legally required in most cases once you employ staff.
        badge: 👷
      - title: Professional indemnity
        text: Claims arising from your advice or services.
        badge: 📋
      - title: Contents
        text: Equipment, stock and tools at your premises.
        badge: 📦
      - title: Cyber
        text: Data breaches, ransomware and business interruption.
        badge: 💻
    - type: note
      content: 'Coverstack arranges insurance as an appointed representative of an FCA-authorised broker. Our fee: commission
        from insurers plus a small broker fee, disclosed before you buy. Recommendations are not final until approved by a
        qualified broker.'
  - key: intake
    type: form
    title: Quote intake
    collection: submissions
    fields:
    - business_name
    - company_number
    - activity
    - turnover
    - employees
    - premises
    - claims_history
    - covers_wanted
    submit:
      label: Send my details
      message: Thanks. Our assistant has questions for you in the chat.
      redirect: chat
    roles:
    - customer
    - admin
  - key: chat
    type: chat
    title: Ask Coverstack
    source: agent:assistant
    examples:
    - Do I need employers' liability?
    - What does professional indemnity cover?
    - I use subcontractors, does that matter?
    placeholder: Ask a question or answer our follow-ups
    roles:
    - customer
    - admin
  - key: my_recommendations
    type: table
    title: My recommendations
    source: collection:recommendations
    data:
      display: table
      fields:
      - key: business_name
        label: Business
      - key: covers
        label: Recommended covers
      - key: rationale
        label: Why
      - key: demands_needs
        label: Demands and needs
      - key: status
        label: Status
        format: badge
    roles:
    - customer
    - admin
  - key: my_quotes
    type: table
    title: Compare quotes
    source: collection:quotes
    data:
      display: table
      fields:
      - key: insurer
        label: Insurer
      - key: cover
        label: Cover
      - key: premium
        label: Premium
        format: money
      - key: limit
        label: Limit
      - key: excess
        label: Excess
      - key: exclusions
        label: Exclusions
      - key: status
        label: Status
        format: badge
      sort:
        field: premium
        dir: asc
    roles:
    - customer
    - admin
  - key: my_policies
    type: table
    title: My policies
    source: collection:policies
    data:
      display: table
      fields:
      - key: policy_number
        label: Policy
      - key: insurer
        label: Insurer
      - key: cover
        label: Cover
      - key: premium
        label: Premium
        format: money
      - key: expiry_date
        label: Expires
        format: date
      - key: status
        label: Status
        format: badge
      sort:
        field: expiry_date
        dir: asc
    roles:
    - customer
    - admin
  - key: change_request
    type: form
    title: Request a change
    collection: policy_changes
    fields:
    - policy_number
    - change_type
    - details
    - effective_date
    submit:
      label: Send request
      message: Your broker has been notified.
    roles:
    - customer
    - admin
  - key: account
    type: account
    title: Account
    roles:
    - customer
    - admin
  - key: approvals
    type: approvals
    title: Broker approvals
    approvals:
    - broker_review
    roles:
    - broker
    - admin
  - key: broker_queue
    type: table
    title: Recommendations queue
    source: collection:recommendations
    data:
      display: table
      fields:
      - key: business_name
        label: Business
      - key: covers
        label: Covers
      - key: demands_needs
        label: Demands and needs
      - key: status
        label: Status
        format: badge
    export: true
    roles:
    - broker
    - compliance
    - admin
  - key: dashboard
    type: page
    title: Dashboard
    roles:
    - broker
    - compliance
    - admin
    sections:
    - type: data
      title: Quote requests by status (conversion)
      source: collection:submissions
      display: chart
      chart: bar
      fields:
      - key: status
        label: Status
      - key: count
        label: Requests
      groupBy:
        field: status
        aggs: []
    - type: data
      title: Quotes by insurer
      source: collection:quotes
      display: table
      fields:
      - key: insurer
        label: Insurer
      - key: count
        label: Quotes
      - key: avg_premium
        label: Average premium
        format: money
      groupBy:
        field: insurer
        aggs:
        - key: avg_premium
          agg: avg
          field: premium
    - type: data
      title: Quotes by status
      source: collection:quotes
      display: chart
      chart: pie
      fields:
      - key: status
        label: Status
      - key: count
        label: Quotes
      groupBy:
        field: status
        aggs: []
    - type: data
      title: Upcoming renewals
      source: collection:policies
      display: table
      fields:
      - key: policy_number
        label: Policy
      - key: insurer
        label: Insurer
      - key: cover
        label: Cover
      - key: premium
        label: Premium
        format: money
      - key: expiry_date
        label: Expires
        format: date
      sort:
        field: expiry_date
        dir: asc
      limit: 50
    - type: data
      title: Open change requests
      source: collection:policy_changes
      display: table
      fields:
      - key: policy_number
        label: Policy
      - key: change_type
        label: Change
      - key: effective_date
        label: From
        format: date
      - key: status
        label: Status
        format: badge
      filters:
      - field: status
        op: '='
        value: requested
  egress:
    hosts:
    - api.company-information.service.gov.uk
    notes: Companies House public API, free reuse under the Open Government Licence v3.0.
  extensions:
  - key: insurer_panel_apis
    description: 'Requesting quotes from insurer panels through their APIs needs a contract and a specific API per insurer
      (hosts, keys, request formats). Not wired: until then quotes are saved from data supplied by the panel integration.'
  - key: online_payment_and_premium_finance
    description: Taking the premium online, monthly instalments through a premium finance partner, and the broker fee plus
      insurer commission model are not available yet in the runtime billing.
  - key: policy_document_email
    description: Emailing policy documents as attachments is not available yet; only plain-text notifications are sent.
  - key: fca_regulatory_set_up
    description: FCA authorisation or appointed-representative status, ICOBS record keeping and complaints handling are the
      operator's regulatory responsibility.
