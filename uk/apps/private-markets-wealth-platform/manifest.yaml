apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: altivo
  displayName: Altivo
  tagline:
    en: Public market portfolios, and private markets for those who qualify.
  description:
    en: Altivo is the client and adviser software around an FCA-authorised wealth manager. Custody and dealing are done by
      a regulated partner. Clients onboard, are categorised, see a managed portfolio and, if eligible, private market opportunities.
      An AI agent prepares the suitability file, and an adviser approves it before the client can invest.
  langs:
  - en
  defaultLang: en
  timezone: Europe/London
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12263a'
      accent: '#b08d57'
      background: '#f7f5f0'
      foreground: '#1b1f24'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Alti
      color: primary
    - text: vo
      color: accent
    width: wide
  header:
    links:
    - label: How it works
      href: '#how'
    - label: Fees
      href: '#fees'
    cta:
      label: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: client
      label: Client
      assignedBy: signup
    - key: adviser
      label: Adviser
      assignedBy: derived
      from: collection:clients.adviser_email
    - key: compliance
      label: Compliance
      assignedBy: invite
    - key: eligible
      label: Eligible investor
      assignedBy: derived
      from: collection:eligibility_grants.client_email
  limits:
  - action: chat
    per: user
    max: 40
    window: day
    roles:
    - client
  agents:
  - key: assistant
    role: main
    description: Summarises fund documents and answers client questions with citations. Not personalised advice.
    profile:
      inline:
        display_name: Altivo research assistant
        crews:
        - id: assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the research assistant of Altivo, an FCA-authorised wealth manager. You summarise fund documents
            and answer questions about the managed public portfolio and, only when the tools return them, private market opportunities.
            Always search with the tools first. Answer only from what the tools return and cite every claim as [Document title,
            section or page]. If the documents do not say, say so plainly. Never invent figures, past performance or forecasts.
            You give information, not personal advice: for a recommendation tell the client their adviser will assess suitability.
            If the tools return no private market material, do not suggest it exists; say private opportunities are only available
            to clients categorised as eligible. Keep answers short, with bullet points for summaries. Mention capital at risk
            when discussing investments.'
        chat_mode: true
    appTools:
    - name: read_funds
      description: The managed public fund portfolio
      action: read
      collection: funds
      scope: all
    - name: search_fund_docs
      description: Search public fund documents (factsheets, KIDs, reports)
      action: search
      collection: public_fund_docs
      scope: all
    - name: search_private_opportunities
      description: Search private market opportunities (eligible clients only)
      action: search
      collection: private_opportunities
      scope: all
    - name: search_private_docs
      description: Search private market documents (eligible clients only)
      action: search
      collection: private_docs
      scope: all
    goalTemplate: 'Conversation so far:

      {history}


      Client message: {message}

      Reply in the language with ISO code {lang}.'
    output: markdown
  - key: suitability
    role: helper
    description: Prepares the suitability file for a requested private market investment; an adviser approves it.
    profile:
      inline:
        display_name: Altivo suitability preparer
        crews:
        - id: suitability
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You prepare a suitability file for an FCA-authorised wealth manager. The client has asked to invest
            in a private market opportunity. Steps: 1) read the client''s profile and categorisation with the tools; 2) read
            the opportunity and search its documents; 3) write the file with sections: Client profile, Categorisation status,
            Objectives and time horizon, Capacity for loss and liquidity, Opportunity summary (minimum ticket, term, fees,
            key risks, with citations [Document, section]), Concentration (the amount against the client''s stated assets),
            Fit assessment (suitable / suitable with conditions / not suitable, with reasons), Questions for the adviser.
            If the categorisation is not approved, or data is missing, say so and recommend not suitable. Never invent figures.
            You make a recommendation to the adviser, not a decision. 4) Call save_suitability_file once with the file (status
            pending_review, adviser_email from the profile, client_email from the profile email field). 5) Call request_suitability_review
            with client_email, opportunity, amount and a 3-line summary. Start the report with a level-1 title "# Suitability
            file — <opportunity>".'
    appTools:
    - name: read_client_profile
      description: The client's onboarding profile
      action: read
      collection: clients
      scope: user
    - name: read_categorisation
      description: The client's categorisation questionnaire and status
      action: read
      collection: categorisation
      scope: user
    - name: read_private_opportunities
      description: Private market opportunities
      action: read
      collection: private_opportunities
      scope: all
    - name: search_private_docs
      description: Search private market documents (eligible clients only)
      action: search
      collection: private_docs
      scope: all
    - name: save_suitability_file
      description: Save the suitability file for adviser review
      action: append
      collection: suitability_files
      scope: user
    awaits:
    - suitability_review
    output: markdown
  approvals:
  - key: suitability_review
    title: Suitability review
    description: An adviser reviews the suitability file before the client can invest
    role: adviser
    fields:
    - client_email
    - opportunity
    - amount
    - summary
    timeoutMinutes: 10080
    onTimeout: reject
  triggers:
  - key: new_client
    'on':
      collection: clients
      op: insert
    notify:
      to: admins
      subject: 'New client onboarded: {record.full_name}'
      body: A client has completed onboarding. Please assign an adviser and check the identity result from the partner.
      link: client_book
  - key: categorisation_submitted
    'on':
      collection: categorisation
      op: insert
    notify:
      to: role:compliance
      subject: Categorisation to review
      body: A client submitted the categorisation questionnaire. Please review it.
      link: compliance_queue
  - key: suitability_start
    'on':
      collection: investment_requests
      op: insert
    start:
      agent: suitability
    goal: 'The client asks to invest {record.amount} GBP in the private market opportunity "{record.opportunity}". Client
      rationale: {record.rationale}. Today is {date}. Prepare the suitability file.'
  - key: suitability_approved
    'on':
      approval: suitability_review
      decision: approved
    notify:
      to: owner
      subject: Your investment request has been approved
      body: Your adviser has approved the suitability review. Your adviser will confirm the next steps with our regulated
        partner. Capital is at risk.
      link: my_files
  - key: suitability_rejected
    'on':
      approval: suitability_review
      decision: rejected
    notify:
      to: owner
      subject: Your investment request needs a conversation
      body: Your adviser could not approve the request as submitted. Please contact them to discuss.
      link: my_files
  - key: eligibility_granted
    'on':
      collection: eligibility_grants
      op: insert
    notify:
      to:
      - record.client_email
      subject: You can now see private market opportunities
      body: Compliance has confirmed your categorisation. Private market opportunities are now available in your account.
      link: private_markets
  - key: call_due_week
    'on':
      date:
        collection: capital_calls
        field: due_date
        offsetDays: -7
        hour: 8
      where:
        status: due
    notify:
      to:
      - record.client_email
      subject: 'Capital call due in 7 days: {record.opportunity}'
      body: A capital call of {record.amount} {record.currency} for {record.opportunity} is due on {record.due_date}. Please
        make sure funds are available.
      link: dashboard
  - key: call_due_tomorrow
    'on':
      date:
        collection: capital_calls
        field: due_date
        offsetDays: -1
        hour: 8
      where:
        status: due
    notify:
      to:
      - record.client_email
      subject: 'Capital call due tomorrow: {record.opportunity}'
      body: A capital call of {record.amount} {record.currency} for {record.opportunity} is due tomorrow, {record.due_date}.
      link: dashboard
  - key: hook_holdings
    'on':
      webhook: true
    write:
      collection: holdings
      keyBy: ref
  - key: hook_commitments
    'on':
      webhook: true
    write:
      collection: commitments
      keyBy: ref
  - key: hook_capital_calls
    'on':
      webhook: true
    write:
      collection: capital_calls
      keyBy: ref
  - key: hook_distributions
    'on':
      webhook: true
    write:
      collection: distributions
      keyBy: ref
  data:
    collections:
    - name: clients
      description: Client onboarding profile. Identity result comes from the regulated partner.
      ownedBy: user
      fields:
      - name: full_name
        type: text
        required: true
        label: Full name
      - name: phone
        type: text
        label: Phone
      - name: employment_status
        type: select
        options:
        - employed
        - self_employed
        - business_owner
        - retired
        - other
        label: Employment
      - name: liquid_assets
        type: number
        required: true
        label: Liquid assets (GBP)
      - name: property_assets
        type: number
        label: Property (GBP, excluding main residence)
      - name: annual_income
        type: number
        required: true
        label: Annual income (GBP)
      - name: experience
        type: select
        required: true
        options:
        - none
        - some
        - experienced
        - professional
        label: Investment experience
      - name: goals
        type: multiselect
        options:
        - growth
        - income
        - preservation
        - legacy
        - tax_planning
        label: Goals
      - name: time_horizon
        type: select
        options:
        - under_3y
        - 3_to_5y
        - 5_to_10y
        - over_10y
        label: Time horizon
      - name: risk_tolerance
        type: select
        options:
        - low
        - medium
        - high
        label: Risk tolerance
      - name: adviser_email
        type: email
        label: Adviser
      - name: kyc_status
        type: select
        options:
        - pending
        - passed
        - failed
        - review
        default: pending
        label: Identity check
      access:
      - role: adviser
        where:
          adviser_email: '{user.email}'
        can:
        - read
        - write
      - role: compliance
        can:
        - read
        - write
    - name: categorisation
      description: High net worth / sophisticated investor questionnaire and compliance decision
      ownedBy: user
      fields:
      - name: net_worth
        type: number
        required: true
        label: Net assets excluding main residence and pensions (GBP)
      - name: annual_income
        type: number
        required: true
        label: Annual income (GBP)
      - name: hnw_basis
        type: select
        options:
        - income_100k
        - net_assets_250k
        - none
        label: High net worth basis
      - name: sophisticated_basis
        type: select
        options:
        - angel_network
        - director_two_years
        - prior_unlisted_investments
        - professional_role
        - none
        label: Sophisticated investor basis
      - name: investments_last_2y
        type: number
        label: Unlisted investments in the last 2 years
      - name: statement_accepted
        type: boolean
        required: true
        label: I confirm these answers are true and I understand the risks of private markets (illiquid, capital at risk,
          no compensation scheme)
      - name: category
        type: select
        options:
        - retail
        - high_net_worth
        - sophisticated
        - restricted
        label: Category (compliance)
      - name: status
        type: select
        options:
        - pending
        - approved
        - rejected
        default: pending
        label: Status
      - name: compliance_notes
        type: textarea
        label: Compliance notes
      access:
      - role: compliance
        can:
        - read
        - write
    - name: eligibility_grants
      description: Clients confirmed by compliance as eligible for private markets
      ownedBy: org
      fields:
      - name: client_email
        type: email
        required: true
        label: Client email
      - name: category
        type: select
        options:
        - high_net_worth
        - sophisticated
        label: Category
      - name: note
        type: text
        label: Note
      access:
      - role: compliance
        can:
        - read
        - write
    - name: funds
      description: The managed public fund portfolio
      ownedBy: shared
      fields:
      - name: name
        type: text
        required: true
      - name: isin
        type: text
      - name: asset_class
        type: text
      - name: weight
        type: number
        label: Weight %
      - name: ongoing_charge
        type: number
        label: Ongoing charge %
      - name: risk_rating
        type: number
        label: Risk (1-7)
      - name: factsheet_url
        type: url
    - name: public_fund_docs
      description: Public fund documents (text extracted) for summaries and Q&A
      ownedBy: shared
      searchable: true
      fields:
      - name: fund
        type: text
        required: true
      - name: title
        type: text
        required: true
      - name: doc_type
        type: select
        options:
        - factsheet
        - kid
        - annual_report
        - prospectus
      - name: content
        type: textarea
      - name: url
        type: url
    - name: private_opportunities
      description: Private market opportunities, visible to eligible clients only
      ownedBy: org
      searchable: true
      fields:
      - name: name
        type: text
        required: true
      - name: manager
        type: text
      - name: strategy
        type: select
        options:
        - private_equity
        - private_credit
        - infrastructure
        - real_estate
        - venture
      - name: min_ticket
        type: number
        label: Minimum ticket (GBP)
      - name: target_return
        type: text
      - name: term_years
        type: number
      - name: fees
        type: text
      - name: closing_date
        type: date
      - name: status
        type: select
        options:
        - open
        - closing_soon
        - closed
      - name: summary
        type: textarea
      access:
      - role: eligible
      - role: adviser
      - role: compliance
    - name: private_docs
      description: Private market documents (text extracted)
      ownedBy: org
      searchable: true
      fields:
      - name: opportunity
        type: text
        required: true
      - name: title
        type: text
        required: true
      - name: doc_type
        type: select
        options:
        - memorandum
        - ddq
        - presentation
        - terms
        - report
      - name: content
        type: textarea
      - name: url
        type: url
      access:
      - role: eligible
      - role: adviser
      - role: compliance
    - name: investment_requests
      description: A client's request to invest in a private opportunity
      ownedBy: user
      fields:
      - name: opportunity
        type: select
        required: true
        optionsFrom: collection:private_opportunities
        label: Opportunity
      - name: amount
        type: number
        required: true
        label: Amount (GBP)
      - name: rationale
        type: textarea
        maxLength: 800
        label: Why this investment?
    - name: suitability_files
      description: Suitability files prepared by the agent and reviewed by advisers and compliance
      ownedBy: user
      fields:
      - name: opportunity
        type: text
      - name: amount
        type: number
      - name: client_email
        type: email
      - name: adviser_email
        type: email
      - name: summary
        type: textarea
      - name: assessment
        type: textarea
      - name: risks
        type: textarea
      - name: status
        type: select
        options:
        - draft
        - pending_review
        - approved
        - rejected
      access:
      - role: adviser
        where:
          adviser_email: '{user.email}'
        can:
        - read
        - write
      - role: compliance
        can:
        - read
        - write
    - name: holdings
      description: Valuations of holdings, fed by the partner (webhook) or loaded by admins
      ownedBy: org
      fields:
      - name: ref
        type: text
      - name: client_email
        type: email
        required: true
      - name: adviser_email
        type: email
      - name: name
        type: text
      - name: type
        type: select
        options:
        - public
        - private
      - name: asset_class
        type: text
      - name: units
        type: number
      - name: value
        type: number
        label: Value (GBP)
      - name: currency
        type: text
      - name: as_of
        type: date
      access:
      - role: client
        where:
          client_email: '{user.email}'
      - role: adviser
        where:
          adviser_email: '{user.email}'
      - role: compliance
    - name: commitments
      description: Private market commitments
      ownedBy: org
      fields:
      - name: ref
        type: text
      - name: client_email
        type: email
        required: true
      - name: adviser_email
        type: email
      - name: opportunity
        type: text
      - name: committed
        type: number
      - name: called
        type: number
      - name: remaining
        type: number
      - name: currency
        type: text
      - name: status
        type: text
      access:
      - role: client
        where:
          client_email: '{user.email}'
      - role: adviser
        where:
          adviser_email: '{user.email}'
      - role: compliance
    - name: capital_calls
      description: Capital calls on private commitments
      ownedBy: org
      fields:
      - name: ref
        type: text
      - name: client_email
        type: email
        required: true
      - name: adviser_email
        type: email
      - name: opportunity
        type: text
      - name: amount
        type: number
      - name: currency
        type: text
      - name: due_date
        type: date
      - name: status
        type: select
        options:
        - due
        - paid
        - overdue
      access:
      - role: client
        where:
          client_email: '{user.email}'
      - role: adviser
        where:
          adviser_email: '{user.email}'
      - role: compliance
    - name: distributions
      description: Distributions received from private investments
      ownedBy: org
      fields:
      - name: ref
        type: text
      - name: client_email
        type: email
        required: true
      - name: adviser_email
        type: email
      - name: opportunity
        type: text
      - name: amount
        type: number
      - name: currency
        type: text
      - name: paid_date
        type: date
      - name: kind
        type: select
        options:
        - income
        - capital_return
        - exit
      access:
      - role: client
        where:
          client_email: '{user.email}'
      - role: adviser
        where:
          adviser_email: '{user.email}'
      - role: compliance
    - name: tasks
      description: Each adviser's own task list
      ownedBy: user
      fields:
      - name: title
        type: text
        required: true
      - name: client_email
        type: email
      - name: due_date
        type: date
      - name: priority
        type: select
        options:
        - low
        - normal
        - high
      - name: status
        type: select
        options:
        - open
        - done
        default: open
      - name: notes
        type: textarea
  views:
  - key: home
    type: page
    title: Altivo
    nav: false
    sections:
    - type: hero
      title: Wealth management, with **private markets** for those who qualify.
      text: A managed portfolio of public funds for every client, and access to private market opportunities once you are
        categorised as eligible. Your adviser reviews every investment for suitability before you invest.
      eyebrow: FCA-authorised wealth manager
      actions:
      - label: Get started
        href: /login
        style: primary
      - label: How it works
        href: '#how'
        style: ghost
      band: true
    - type: steps
      id: how
      title: How it works
      items:
      - title: Sign up and verify
        text: Create your account and pass identity checks through our regulated partner.
      - title: Tell us about you
        text: Your assets, income, experience and goals, plus a short categorisation questionnaire.
      - title: Invest
        text: Everyone gets our managed public portfolio. Eligible clients also see private opportunities, documents and minimum
          tickets.
      - title: Adviser approval
        text: Our AI prepares a suitability file and your adviser approves it before you invest.
      - title: Follow everything
        text: Holdings, valuations, commitments, capital calls and distributions in one dashboard, with email reminders.
    - type: cards
      id: fees
      title: Fees
      items:
      - title: Annual management fee
        text: A percentage of the assets we manage for you, set out in your client agreement.
        badge: '%'
      - title: Private markets supplement
        text: An additional fee applies to private market allocations. It is shown before you invest.
        badge: +
    - type: note
      content: Altivo is an FCA-authorised wealth manager. Custody and dealing are provided by our regulated partner. Capital
        is at risk. Private market investments are illiquid and are only available to clients categorised as high net worth
        or sophisticated investors. Nothing here is personal advice until your adviser has assessed suitability.
  - key: onboarding
    type: form
    title: Onboarding
    collection: clients
    fields:
    - full_name
    - phone
    - employment_status
    - liquid_assets
    - property_assets
    - annual_income
    - experience
    - goals
    - time_horizon
    - risk_tolerance
    submit:
      label: Save and continue
      message: Thanks. Next, complete the categorisation questionnaire.
      redirect: categorisation_form
    edit: true
    roles:
    - client
  - key: categorisation_form
    type: form
    title: Categorisation
    collection: categorisation
    fields:
    - net_worth
    - annual_income
    - hnw_basis
    - sophisticated_basis
    - investments_last_2y
    - statement_accepted
    submit:
      label: Submit for review
      message: Submitted. Compliance will review your categorisation.
    edit: true
    roles:
    - client
  - key: model_portfolio
    type: page
    title: Managed portfolio
    roles:
    - client
    - adviser
    - compliance
    - admin
    sections:
    - type: data
      title: Allocation
      source: collection:funds
      display: chart
      chart: pie
      fields:
      - key: name
      - key: weight
      empty: The portfolio will appear here.
    - type: data
      title: Funds
      source: collection:funds
      display: table
      fields:
      - key: name
        label: Fund
      - key: asset_class
        label: Asset class
      - key: weight
        label: Weight %
        format: number
      - key: ongoing_charge
        label: Ongoing charge %
        format: number
      - key: risk_rating
        label: Risk
      - key: factsheet_url
        label: Factsheet
        format: link
  - key: private_markets
    type: table
    title: Private markets
    source: collection:private_opportunities
    columns:
    - name
    - manager
    - strategy
    - min_ticket
    - target_return
    - term_years
    - fees
    - closing_date
    - status
    roles:
    - eligible
    - adviser
    - compliance
    - admin
  - key: assistant
    type: chat
    title: Ask about funds
    source: agent:assistant
    examples:
    - Summarise the latest factsheet of the global equity fund
    - What are the main risks in the private credit opportunity?
    - What fees apply to private market allocations?
    placeholder: Ask about a fund or a document
    roles:
    - client
    - adviser
    - compliance
    - admin
  - key: invest
    type: form
    title: Request to invest
    collection: investment_requests
    submit:
      label: Send for suitability review
      message: Received. We are preparing your suitability file; your adviser will review it before you can invest.
      redirect: my_files
    roles:
    - eligible
  - key: my_files
    type: table
    title: My suitability files
    source: collection:suitability_files
    columns:
    - opportunity
    - amount
    - status
    - summary
    roles:
    - client
  - key: dashboard
    type: page
    title: My portfolio
    roles:
    - client
    sections:
    - type: data
      title: Total value
      source: collection:holdings
      display: kpi
      kpis:
      - label: Total value (GBP)
        agg: sum
        field: value
        format: money
      - label: Positions
        agg: count
    - type: data
      title: By asset class
      source: collection:holdings
      display: chart
      chart: pie
      groupBy:
        field: asset_class
        aggs:
        - key: total
