  billing:
    modes:
    - free
  extensions:
  - key: partner_identity_checks
    description: Identity verification by the regulated partner is not integrated. The partner's result can be sent to a webhook
      or set by compliance in the client's kyc_status field. A native partner connection needs OAuth or a partner API with
      its own terms.
  - key: partner_feed
    description: Holdings, commitments, capital calls and distributions come from the partner by webhook (hook_holdings, hook_commitments,
      hook_capital_calls, hook_distributions) or admin CSV upload on /admin/data.
  - key: dealing_gate
    description: The app records the adviser approval and notifies the client. Dealing and custody are executed by the partner.
      Blocking the order at the partner until approval needs a partner-side integration.
  - key: percentage_fee_billing
    description: The annual management fee as a percentage of assets, plus the extra fee on private market allocations, is
      not a billing mode. Fees are invoiced by Altivo or the partner outside the app. The app only describes them.
