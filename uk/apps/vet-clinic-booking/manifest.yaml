apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: pawsend
  displayName: Pawsend
  tagline:
    en: Veterinary care where you stay with your pet.
  description:
    en: Book, pay a deposit, tell us the symptoms and stay with your pet during treatment. Clinical care stays with the clinics'
      RCVS-registered vets and nurses; Pawsend handles the booking, reminders and records around it.
  langs:
  - en
  defaultLang: en
  timezone: Europe/London
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f4e5f'
      accent: '#e07a3f'
      background: '#fbf8f3'
      foreground: '#1d2a30'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Paws
      color: primary
    - text: end
      color: accent
  header:
    links:
    - label: How it works
      href: '#how'
    - label: Membership
      href: '#membership'
    cta:
      label: Book a visit
      href: /v/book
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Head office
      assignedBy: admin_emails
    - key: user
      label: Pet owner
      assignedBy: signup
    - key: reception
      label: Reception
      assignedBy: invite
    - key: vet
      label: Vet / nurse
      assignedBy: invite
    - key: manager
      label: Clinic manager
      assignedBy: invite
  limits:
  - action: login
    per: ip
    max: 20
    window: hour
  agents:
  - key: triage
    role: helper
    description: Reads a pre-visit symptom form and suggests urgency and appointment length for reception to check.
    profile:
      inline:
        display_name: Pawsend triage assistant
        crews:
        - id: triage
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You help veterinary clinic reception staff prepare bookings. You read an owner''s pre-visit symptom
            form and the pet''s record (use the read tools for the pet and the appointment). You do NOT diagnose and you do
            not give treatment advice: a receptionist and the clinic''s vets decide. Suggest only (1) an urgency: routine,
            soon (within 2-3 days), urgent (same day) or emergency (immediately; the owner should phone the clinic or an emergency
            vet now), and (2) a suggested appointment length in minutes (multiples of 15, between 15 and 90). Treat as at
            least urgent: difficulty breathing, collapse, seizures, suspected poisoning, heavy bleeding, bloated abdomen,
            inability to urinate, trauma, repeated vomiting in puppies/kittens/rabbits. When in doubt choose the higher urgency.
            Consider species, age, weight and existing conditions. Never invent facts. Answer with ONE JSON object and nothing
            else: {"appointment_id":"<appointment id>","urgency":"routine|soon|urgent|emergency","suggested_minutes":30,"rationale":"2-3
            plain sentences for reception","red_flags":"short list or empty"}'
    appTools:
    - name: read_pets
      description: Read the owner's pets
      action: read
      collection: pets
      scope: user
    - name: read_appointments
      description: Read the owner's appointments
      action: read
      collection: appointments
      scope: user
    output: json
    resultSchema:
      type: object
      properties:
        appointment_id:
          type: string
        urgency:
          type: string
        suggested_minutes:
          type: integer
        rationale:
          type: string
        red_flags:
          type: string
    writesTo:
      collection: triage
      parse: json_last
      keyBy: appointment_id
    limits:
      maxTurns: 6
      maxBudgetUsd: 0.3
  data:
    collections:
    - name: clinics
      ownedBy: shared
      description: The clinics of the chain
      fields:
      - name: name
        type: text
        required: true
      - name: address
        type: text
      - name: phone
        type: text
    - name: vets
      ownedBy: shared
      description: Vets bookable online. Put the clinic in the name, e.g. 'Dr Patel - Leeds'.
      fields:
      - name: name
        type: text
        required: true
      - name: clinic
        type: text
      - name: email
        type: email
    - name: services
      ownedBy: shared
      description: Bookable services
      fields:
      - name: name
        type: text
        required: true
      - name: minutes
        type: number
      - name: price
        type: number
    - name: pets
      ownedBy: user
      description: Each owner's pets
      retentionDays: 3650
      fields:
      - name: name
        type: text
        required: true
        label: Pet name
      - name: species
        type: select
        required: true
        options:
        - dog
        - cat
        - rabbit
        - small mammal
        - bird
        - reptile
        - other
      - name: breed
        type: text
      - name: dob
        type: date
        label: Date of birth
      - name: weight_kg
        type: number
        label: Weight (kg)
      - name: microchip
        type: text
        label: Microchip number
      - name: vaccinations
        type: textarea
        label: Vaccination history
      - name: next_vaccination_due
        type: date
        label: Next vaccination due
      - name: next_flea_due
        type: date
        label: Next flea/worm treatment due
      - name: insurer
        type: text
      - name: policy_number
        type: text
      - name: conditions
        type: textarea
        label: Existing conditions
      access:
      - role: vet
        can:
        - read
        - write
      - role: reception
    - name: appointments
      ownedBy: user
      description: Bookings; also holds reception confirmation, visit status, fee and the vet's summary
      fields:
      - name: pet
        type: select
        required: true
        optionsFrom: collection:pets
      - name: clinic
        type: select
        required: true
        optionsFrom: collection:clinics
      - name: service
        type: select
        required: true
        optionsFrom: collection:services
      - name: notes
        type: textarea
      - name: confirmation
        type: select
        options:
        - pending
        - confirmed
        - moved
        default: pending
      - name: reception_note
        type: text
        label: Note to owner (e.g. new time)
      - name: visit_state
        type: select
        options:
        - booked
        - completed
        - no_show
        default: booked
      - name: fee
        type: number
        label: Fee charged (GBP)
      - name: summary
        type: textarea
        label: Visit summary for the owner
      access:
      - role: reception
        can:
        - read
        - write
      - role: vet
        can:
        - read
        - write
      - role: manager
    - name: previsit_forms
      ownedBy: user
      description: Pre-visit symptom forms
      retentionDays: 730
      fields:
      - name: appointment
        type: select
        required: true
        optionsFrom: collection:appointments
      - name: symptoms
        type: textarea
        required: true
        label: What are you worried about?
      - name: since_when
        type: text
        label: Since when?
      - name: eating_drinking
        type: select
        options:
        - normal
        - reduced
        - not at all
      - name: photo
        type: file
        accept:
        - jpg
        - jpeg
        - png
        capture: true
        maxMb: 10
        label: Photo (optional)
      access:
      - role: vet
      - role: reception
    - name: triage
      ownedBy: user
      description: Agent suggestions of urgency and length, checked by reception
      fields:
      - name: appointment_id
        type: text
      - name: urgency
        type: text
      - name: suggested_minutes
        type: number
      - name: rationale
        type: textarea
      - name: red_flags
        type: text
      access:
      - role: reception
        can:
        - read
        - write
      - role: vet
  views:
  - key: home
    type: page
    title: Pawsend
    nav: false
    sections:
    - type: hero
      title: Stay with your pet. We handle **everything around the care**.
      text: Book your clinic, vet and time, pay a small deposit, tell us the symptoms beforehand and get reminders and a written
        summary after the visit.
      actions:
      - label: Book a visit
        href: /v/book
        style: primary
      - label: Sign in
        href: /login
        style: ghost
      note: In an emergency phone your clinic or nearest emergency vet immediately; do not wait for an online booking.
    - type: steps
      id: how
      title: How it works
      items:
      - title: Add your pet
        text: Species, breed, weight, microchip, vaccinations and insurer, once.
      - title: Book and pay a deposit
        text: Choose clinic, service and vet, then pay the deposit by card.
      - title: Tell us the symptoms
        text: Our assistant suggests urgency and length; reception confirms or moves your booking.
      - title: Visit and follow-up
        text: Reminders the day before, then a summary written by your vet.
    - type: cards
      id: membership
      title: Membership
      intro: A monthly plan that covers check-ups and vaccinations.
      items:
      - title: Pawsend Member
        text: Monthly fee; routine check-ups and vaccinations included. Subscribe from the Plan page.
        badge: 🐾
    - type: note
      content: Clinical care is provided by the clinics' RCVS-registered vets and nurses under the RCVS Practice Standards.
        Pawsend is booking and record software and does not diagnose or give treatment advice.
  - key: book
    type: booking
    title: Book a visit
    collection: appointments
    resources: collection:vets
    fields:
    - pet
    - clinic
    - service
    - notes
    slots:
      days:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      from: 08:00
      to: '18:00'
      minutes: 30
      tz: Europe/London
      aheadDays: 28
      minNoticeHours: 2
      capacity: 1
    roles:
    - user
  - key: add_pet
    type: form
    title: Add or edit a pet
    collection: pets
    edit: true
    submit:
      label: Save pet
      message: Pet saved.
      redirect: my_pets
    roles:
    - user
  - key: my_pets
    type: table
    title: My pets
    source: collection:pets
    data:
      display: table
      fields:
      - key: name
      - key: species
      - key: breed
      - key: weight_kg
        format: number
      - key: next_vaccination_due
        format: date
      - key: next_flea_due
        format: date
      empty: 'No pets yet: add your first one.'
    roles:
    - user
  - key: previsit
    type: form
    title: Pre-visit form
    collection: previsit_forms
    submit:
      label: Send
      message: Thank you. The clinic will confirm your booking.
      redirect: my_appointments
    roles:
    - user
  - key: my_appointments
    type: table
    title: My appointments
    source: collection:appointments
    data:
      display: table
      fields:
      - key: date
        format: date
      - key: clinic
      - key: service
      - key: confirmation
        format: badge
      - key: reception_note
      - key: summary
      sort:
        field: date
        dir: desc
      actions:
      - type: calendar
        label: Add to calendar
        title: service
        start: start
        end: end
    roles:
    - user
  - key: day_list
    type: table
    title: Day list
    source: collection:appointments
    data:
      display: table
      fields:
      - key: date
        format: date
      - key: start
      - key: pet
      - key: service
      - key: clinic
      - key: confirmation
        format: badge
      - key: notes
      filters:
      - field: visit_state
        op: '='
        value: booked
      sort:
        field: start
        dir: asc
      limit: 100
    roles:
    - vet
    - admin
  - key: pet_records
    type: table
    title: Pet histories
    source: collection:pets
    data:
      display: table
      fields:
      - key: name
      - key: species
      - key: breed
      - key: dob
        format: date
      - key: weight_kg
        format: number
      - key: microchip
      - key: vaccinations
      - key: conditions
      - key: insurer
      limit: 200
    roles:
    - vet
    - reception
    - admin
  - key: visit
    type: form
    title: Visit summary
    collection: appointments
    fields:
    - visit_state
    - summary
    - fee
    edit: true
    submit:
      label: Save summary
      message: Saved. The owner is notified when the visit is marked completed.
      redirect: day_list
    roles:
    - vet
    - admin
    nav: false
  - key: pet_update
    type: form
    title: Update pet record
    collection: pets
    fields:
    - weight_kg
    - vaccinations
    - next_vaccination_due
    - next_flea_due
    - conditions
    edit: true
    submit:
      label: Save
      message: Saved.
    roles:
    - vet
    - admin
    nav: false
  - key: bookings
    type: table
    title: Bookings
    source: collection:appointments
    data:
      display: table
      fields:
      - key: date
        format: date
      - key: start
      - key: clinic
      - key: service
      - key: pet
      - key: confirmation
        format: badge
      - key: visit_state
        format: badge
      sort:
        field: start
        dir: asc
      limit: 200
    roles:
    - reception
    - admin
  - key: confirm
    type: form
    title: Confirm or move booking
    collection: appointments
    fields:
    - confirmation
    - reception_note
    edit: true
    submit:
      label: Save
      message: The owner has been notified.
      redirect: bookings
    roles:
    - reception
    - admin
    nav: false
  - key: triage_list
    type: table
    title: Triage suggestions
    source: collection:triage
    data:
      display: table
      fields:
      - key: urgency
        format: badge
      - key: suggested_minutes
        format: number
      - key: rationale
      - key: red_flags
      - key: appointment_id
      limit: 100
    roles:
    - reception
    - vet
    - admin
  - key: clinic_dashboard
    type: page
    title: Clinic dashboard
    sections:
    - type: data
      title: Totals
      source: collection:appointments
      display: kpi
      kpis:
      - label: Appointments
        agg: count
      - label: Revenue (GBP)
        agg: sum
        field: fee
        format: money
    - type: data
      title: Appointments and revenue per clinic
      source: collection:appointments
      display: chart
      chart: bar
      fields:
      - key: clinic
      - key: appointments
      - key: revenue
      groupBy:
        field: clinic
        aggs:
        - key: appointments
          agg: count
        - key: revenue
          agg: sum
          field: fee
    - type: data
      title: No-shows per clinic
      source: collection:appointments
      display: table
      fields:
      - key: clinic
      - key: no_shows
      filters:
      - field: visit_state
        op: '='
        value: no_show
      groupBy:
        field: clinic
        aggs:
        - key: no_shows
          agg: count
    roles:
    - manager
    - admin
  - key: account
    type: account
    title: Plan and deposits
    roles:
    - user
  triggers:
  - key: deposit
    description: Deposit taken when a booking is made
    'on':
      collection: appointments
      op: insert
    charge:
      credits: 20
      reason: Appointment deposit
  - key: booking_received
    'on':
      collection: appointments
      op: insert
    notify:
      to: owner
      subject: 'Pawsend: booking received'
      body: We have received your booking on {record.date}. Please fill in the pre-visit form; reception will confirm shortly.
      link: previsit
  - key: booking_confirmed
    'on':
      collection: appointments
      op: update
      where:
        confirmation: confirmed
    notify:
      to: owner
      subject: 'Pawsend: booking confirmed'
      body: Your appointment on {record.date} is confirmed. {record.reception_note}
      link: my_appointments
  - key: booking_moved
    'on':
      collection: appointments
      op: update
      where:
        confirmation: moved
    notify:
      to: owner
      subject: 'Pawsend: your booking has moved'
      body: Reception has moved your appointment. {record.reception_note}
      link: my_appointments
  - key: day_before
    'on':
      date:
        collection: appointments
        field: date
        offsetDays: -1
        hour: 8
    notify:
      to: owner
      subject: 'Reminder: appointment tomorrow'
      body: Your pet's appointment is tomorrow. Please arrive a few minutes early.
      link: my_appointments
  - key: visit_summary
    'on':
      collection: appointments
      op: update
      where:
        visit_state: completed
    notify:
      to: owner
      subject: Summary of your visit
      body: Your vet has written a summary of today's visit. You can read it in the app.
      link: my_appointments
  - key: vaccination_due
    'on':
      date:
        collection: pets
        field: next_vaccination_due
        offsetDays: -7
        hour: 9
    notify:
      to: owner
      subject: Vaccination due soon for {record.name}
      body: '{record.name}''s vaccination is due in a week. Book a visit in the app.'
      link: book
  - key: flea_due
    'on':
      date:
        collection: pets
        field: next_flea_due
        offsetDays: -3
        hour: 9
    notify:
      to: owner
      subject: Flea/worm treatment due for {record.name}
      body: '{record.name}''s flea and worm treatment is due in three days.'
      link: book
  - key: triage_run
    description: Suggest urgency when a pre-visit form is saved
    'on':
      collection: previsit_forms
      op: insert
    start:
      agent: triage
    goal: 'Pre-visit form for appointment {record.appointment}. Symptoms: {record.symptoms}. Since when: {record.since_when}.
      Eating and drinking: {record.eating_drinking}. Read the appointment and the pet''s record, then answer with the JSON
      object.'
  - key: emergency_alert
    'on':
      collection: triage
      op: insert
      where:
        urgency: emergency
    notify:
      to: role:reception
      subject: Possible emergency booking
      body: 'Triage flagged an emergency: {record.rationale}. Please call the owner now.'
      link: triage_list
  notifications:
    emailOnRunDone: false
  billing:
    modes:
    - credits
    - subscription
    currency: gbp
    signupCredits: 0
    packs:
    - key: deposit_20
      credits: 20
      price: 20
      label: One booking deposit (GBP 20)
    - key: deposit_60
      credits: 60
      price: 60
      label: Three booking deposits
    plans:
    - key: member
      price: 25
      interval: month
      label: Pawsend Member
      includes:
      - Routine check-ups
      - Annual and booster vaccinations
      credits: 0
  mobile:
    appId: com.pawsend.app
    appName: Pawsend
    capabilities:
    - name: camera
      reason:
        en: To photograph your pet's symptom for the pre-visit form
    - name: calendar
      reason:
        en: To add your appointment to your calendar
    - name: push
  extensions:
  - key: clinic_scoping
    description: 'Staff roles see records of every clinic, not only their own: access rules cannot yet be limited to one clinic.
      Clinic managers and vets for a single clinic need per-clinic filtering; head office (admin) sees all.'
  - key: deposit_credits
    description: Deposits are charged as credits (1 credit = GBP 1) bought by card; a member's covered visits are not yet
      exempted from the deposit automatically, and refunds for no-shows are handled by head office.
  - key: no_sms
    description: SMS, WhatsApp and campaign messages are not available; reminders go by email and phone push.
