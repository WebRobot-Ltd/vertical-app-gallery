apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: brightlo
  displayName: Brightlo
  tagline:
    en: Live online lessons for 10 to 18-year-olds, with AI study tools.
  description:
    en: Weekly live classes with qualified teachers, homework set after every lesson, an AI tutor for hints and practice,
      and a weekly progress email for parents.
  langs:
  - en
  defaultLang: en
  timezone: Europe/London
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1e3a8a'
      accent: '#f59e0b'
      background: '#f8fafc'
      foreground: '#0f172a'
    fonts:
      body: Inter
      display: Poppins
    wordmark:
    - text: Bright
      color: primary
    - text: lo
      color: accent
  header:
    links:
    - label: How it works
      href: '#how'
    - label: Pricing
      href: '#pricing'
    cta:
      label: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: teacher
      label: Teacher
      assignedBy: invite
    - key: parent
      label: Parent
      assignedBy: signup
    - key: pupil
      label: Pupil
      assignedBy: derived
      from: collection:children.pupil_email
  limits:
  - action: chat
    per: user
    max: 60
    window: day
  agents:
  - key: tutor
    role: main
    description: 'AI study tutor: hints, practice questions marked against the exam-board specification.'
    memory: user
    context:
    - key: parent_email
      from: collection:children.parent_email
    - key: year_group
      from: collection:children.year_group
    goalTemplate: 'Pupil: {user}, {?year_group}{year_group}{/year_group}. Parent email for records: {parent_email}.

      Conversation so far:

      {history}

      New message: {message}

      Reply in English.'
    output: markdown
    appTools:
    - name: read_subjects
      description: Read subjects with exam board and specification summary
      action: read
      collection: subjects
      scope: all
    - name: read_homework
      description: Read homework set by teachers
      action: read
      collection: homework
      scope: all
    - name: save_score
      description: Save the result of a marked practice question set
      action: write
      collection: practice_scores
      scope: user
    profile:
      inline:
        display_name: Brightlo AI tutor
        crews:
        - id: tutor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are Brightlo''s friendly AI study tutor for pupils aged 10-18 in England. First call read_subjects
            to see the exam board and specification points for the pupil''s subject, and use read_homework when asked about
            set homework. Rules: for homework questions give hints and guide the pupil step by step, never the full answer
            to a main assignment; teachers mark those. For practice questions: set questions matching the specification and
            year group, one set at a time, mark the pupil''s answers against the specification''s mark scheme style, explain
            errors briefly, and then call save_score once with subject, topic, score, outof, and parent_email (from the context
            above, if present). Keep language age-appropriate, encouraging and concise. Never invent specification content;
            say when unsure. If a pupil mentions being unsafe, hurt, bullied or distressed, respond kindly, encourage them
            to speak to a trusted adult and tell them to contact Brightlo''s safeguarding lead; do not continue as normal
            tutoring. Never ask for personal details beyond what is needed.'
  - key: reporter
    role: helper
    description: Writes the weekly progress report for one child, emailed to the parent.
    output: markdown
    appTools:
    - name: read_attendance
      description: Read attendance records the parent may see
      action: read
      collection: attendance
      scope: all
    - name: read_submissions
      description: Read homework submissions and marks the parent may see
      action: read
      collection: submissions
      scope: all
    - name: read_scores
      description: Read AI practice scores the parent may see
      action: read
      collection: practice_scores
      scope: all
    profile:
      inline:
        display_name: Brightlo weekly reporter
        crews:
        - id: reporter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write a weekly progress email for a parent about ONE child, identified by the child''s pupil
            email in the goal. Use read_attendance, read_submissions and read_scores and keep only records for that pupil
            email from the last 7 days. Start with a level-1 title ''# <Child name> — week ending <date>''. Sections with
            ## headings: Attendance (classes attended of classes held), Homework (set, submitted, marked, with teacher scores),
            Practice scores (AI tutor), Next week. Include a small table per section when there is data. Warm, plain, factual
            tone; under 300 words. Never invent figures; if there is no data say so. Add a ```chart bar block of homework
            scores by subject when there are at least two.'
  inputForm:
    title: Unused
    fields: []
  data:
    collections:
    - name: subjects
      ownedBy: shared
      description: Subjects with exam board and specification summary
      fields:
      - name: name
        type: text
        required: true
      - name: exam_board
        type: text
      - name: spec_summary
        type: textarea
    - name: classes
      ownedBy: shared
      description: Weekly timetable of live classes
      fields:
      - name: subject
        type: select
        optionsFrom: collection:subjects
        required: true
      - name: title
        type: text
        required: true
      - name: year_group
        type: text
      - name: weekday
        type: select
        options:
        - Monday
        - Tuesday
        - Wednesday
        - Thursday
        - Friday
        - Saturday
        - Sunday
      - name: start_time
        type: text
        help: HH:MM, UK time
      - name: minutes
        type: number
      - name: teacher_name
        type: text
      - name: teacher_email
        type: email
      - name: join_url
        type: url
      - name: recording_url
        type: url
    - name: children
      ownedBy: user
      description: A parent's children
      fields:
      - name: name
        type: text
        required: true
      - name: year_group
        type: select
        required: true
        options:
        - Year 6
        - Year 7
        - Year 8
        - Year 9
        - Year 10
        - Year 11
        - Year 12
        - Year 13
      - name: subjects
        type: multiselect
        optionsFrom: collection:subjects
      - name: pupil_email
        type: email
        required: true
        help: The email the pupil signs in with
      - name: parent_email
        type: email
        required: true
        help: Your email
      access:
      - role: pupil
        where:
          pupil_email: '{user.email}'
        can:
        - read
    - name: homework
      ownedBy: org
      description: Homework set by teachers after each class
      fields:
      - name: title
        type: text
        required: true
      - name: subject
        type: select
        optionsFrom: collection:subjects
        required: true
      - name: year_group
        type: text
      - name: kind
        type: select
        options:
        - practice
        - main
      - name: instructions
        type: textarea
        required: true
      - name: due_date
        type: date
      access:
      - role: teacher
        can:
        - read
        - write
      - role: pupil
        can:
        - read
    - name: submissions
      ownedBy: user
      description: Pupils' homework answers and teacher marks
      retentionDays: 730
      fields:
      - name: homework_title
        type: text
        required: true
      - name: subject
        type: text
      - name: pupil_email
        type: email
      - name: parent_email
        type: email
        help: Your parent's email, so they see your progress
      - name: answer
        type: textarea
      - name: photo
        type: file
        accept:
        - jpg
        - png
        - pdf
        capture: true
        maxMb: 10
      - name: status
        type: select
        options:
        - submitted
        - marked
        default: submitted
      - name: score
        type: number
      - name: feedback
        type: textarea
      access:
      - role: teacher
        can:
        - read
        - write
      - role: parent
        where:
          parent_email: '{user.email}'
        can:
        - read
    - name: attendance
      ownedBy: org
      description: Class attendance recorded by teachers
      fields:
      - name: pupil_email
        type: email
        required: true
      - name: parent_email
        type: email
        required: true
      - name: class_title
        type: text
        required: true
      - name: date
        type: date
        required: true
      - name: present
        type: boolean
      access:
      - role: teacher
        can:
        - read
        - write
      - role: parent
        where:
          parent_email: '{user.email}'
        can:
        - read
    - name: practice_scores
      ownedBy: user
      description: Results of AI-marked practice
      retentionDays: 730
      fields:
      - name: subject
        type: text
      - name: topic
        type: text
      - name: score
        type: number
      - name: outof
        type: number
      - name: parent_email
        type: email
      access:
      - role: parent
        where:
          parent_email: '{user.email}'
        can:
        - read
  views:
  - key: home
    type: page
    nav: false
    sections:
    - type: hero
      title: Live lessons that help your child **get ahead**
      text: Small live classes with qualified teachers for ages 10 to 18, homework after every lesson, and an AI tutor for
        hints and exam-board practice.
      actions:
      - label: Get started
        href: /login
        style: primary
      - label: See pricing
        href: '#pricing'
        style: ghost
    - type: steps
      id: how
      title: How it works
      items:
      - title: Add your child
        text: Choose their year group and subjects.
      - title: Join live classes
        text: Weekly timetable with video, chat and recordings.
      - title: Do the homework
        text: AI hints and practice; teachers mark main assignments.
      - title: Follow progress
        text: A weekly email on attendance, homework and scores.
    - type: cards
      id: pricing
      title: Pricing
      items:
      - title: 1 subject
        text: £30 per month
        badge: 📘
      - title: 2 subjects
        text: £60 per month
        badge: 📚
      - title: 3 subjects
        text: £75 per month — save £15
        badge: 🎓
    - type: note
      content: 'Brightlo teachers are qualified and DBS checked. Safeguarding concerns: contact our safeguarding lead.'
  - key: add_child
    type: form
    title: Add a child
    collection: children
    fields:
    - name
    - year_group
    - subjects
    - pupil_email
    - parent_email
    submit:
      label: Save child
      message: Child added.
      redirect: my_children
    roles:
    - parent
    - admin
  - key: my_children
    type: cards
    title: My children
    source: collection:children
    data:
      display: cards
      fields:
      - key: name
      - key: year_group
      - key: subjects
    roles:
    - parent
    - pupil
    - admin
  - key: timetable
    type: table
    title: Timetable
    source: collection:classes
    data:
      display: table
      fields:
      - key: subject
      - key: title
      - key: weekday
      - key: start_time
      - key: year_group
      - key: teacher_name
      - key: join_url
        label: Join live
        format: link
      - key: recording_url
        label: Recording
        format: link
      actions:
      - type: calendar
        title: title
        start: start_time
    roles:
    - pupil
    - teacher
    - parent
    - admin
  - key: homework_list
    type: table
    title: Homework
    source: collection:homework
    data:
      display: table
      fields:
      - key: title
      - key: subject
      - key: kind
        format: badge
      - key: due_date
        format: date
      - key: instructions
      sort:
        field: due_date
        dir: asc
    roles:
    - pupil
    - teacher
    - admin
  - key: set_homework
    type: form
    title: Set homework
    collection: homework
    submit:
      label: Set homework
      message: Homework set.
    roles:
    - teacher
    - admin
  - key: submit_homework
    type: form
    title: Submit homework
    collection: submissions
    fields:
    - homework_title
    - subject
    - pupil_email
    - parent_email
    - answer
    - photo
    submit:
      label: Submit
      message: Submitted.
      redirect: my_work
    roles:
    - pupil
  - key: my_work
    type: table
    title: My work and progress
    source: collection:submissions
    data:
      display: table
      fields:
      - key: homework_title
      - key: subject
      - key: status
        format: badge
      - key: score
        format: number
      - key: feedback
    roles:
    - pupil
    - parent
  - key: progress
    type: chart
    title: Practice scores
    source: collection:practice_scores
    data:
      display: chart
      chart: bar
      fields:
      - key: topic
      - key: score
    roles:
    - pupil
    - parent
  - key: mark_work
    type: form
    title: Mark a submission
    collection: submissions
    fields:
    - status
    - score
    - feedback
    edit: true
    submit:
      label: Save mark
      message: Mark saved.
    roles:
    - teacher
    - admin
    nav: false
  - key: all_submissions
    type: table
    title: Submissions to mark
    source: collection:submissions
    data:
      display: table
      fields:
      - key: homework_title
      - key: subject
      - key: pupil_email
      - key: answer
      - key: status
        format: badge
      - key: score
    roles:
    - teacher
    - admin
  - key: record_attendance
    type: form
    title: Record attendance
    collection: attendance
    submit:
      label: Save
      message: Attendance saved.
    roles:
    - teacher
    - admin
  - key: tutor_chat
    type: chat
    title: AI tutor
    source: agent:tutor
    examples:
    - Give me a hint on question 3
    - Test me on fractions
    - Mark my practice answers
    placeholder: Ask your tutor…
    roles:
    - pupil
  - key: weekly
    type: instances
    template: weekly_summary
    title: Weekly reports
    roles:
    - parent
  - key: account
    type: account
    title: Subscription
    roles:
    - parent
  templates:
  - key: weekly_summary
    title: Weekly progress email
    description: A weekly email with attendance, homework completion and scores for one child.
    agent: reporter
    params:
    - name: child_name
      type: text
      required: true
      label: Child's name
    - name: child_email
      type: email
      required: true
      label: Child's sign-in email
    goal: Write the weekly report for {child_name}, pupil email {child_email}, week ending {date}. English.
    schedule:
      cron: 0 16 * * 5
      userCanChange: false
    maxPerUser: 5
    deliver:
      to: owner
      subject: Brightlo weekly progress
  triggers:
  - key: homework_marked
    'on':
      collection: submissions
      op: update
      where:
        status: marked
    notify:
      to:
      - record.parent_email
      subject: 'Homework marked: {record.homework_title}'
      body: 'Your child''s homework ''{record.homework_title}'' has been marked. Score: {record.score}.'
      link: my_work
  billing:
    modes:
    - subscription
    currency: gbp
    plans:
    - key: one_subject
      price: 30
      interval: month
      label: 1 subject
      roles:
      - parent
    - key: two_subjects
      price: 60
      interval: month
      label: 2 subjects
      roles:
      - parent
    - key: three_subjects
      price: 75
      interval: month
      label: 3 subjects (discount)
      roles:
      - parent
  mobile:
    appId: com.brightlo.app
    capabilities:
    - name: camera
      reason: To photograph handwritten homework
    - name: microphone
      reason: To talk to the AI tutor by voice
    - name: push
  extensions:
  - key: live_video
    description: 'Live video classes with in-class chat and recordings are not available in the runtime yet: teachers paste
      an external meeting link into classes.join_url and recording links into recording_url. Needs an integration.'
  - key: safeguarding_dbs
    description: Teacher DBS check tracking and safeguarding case management remain with Brightlo's own processes; the app
      only holds teacher accounts via invite.
  - key: subject_count_pricing
    description: Per-subject pricing is modelled as three plans (1, 2, 3 subjects); the 3-subject price of £75 is an assumed
      discount. Enforcement that the number of subjects matches the plan is not automatic.
  - key: autofill_parent_email
    description: Pupils type their parent's email on submissions so parents see the record; automatic linking is not available
      yet.
