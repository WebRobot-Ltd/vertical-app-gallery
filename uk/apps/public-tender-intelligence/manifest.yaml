apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: tenderlens
  displayName: Tenderlens
  tagline: Public procurement intelligence for companies selling to government.
  description: Tenderlens reads Find a Tender, Contracts Finder and council spending data, scores every opportunity against
    your company profile, names the buying team and alerts you by email. Track buyers and opportunities in your own pipeline.
  langs:
  - en
  defaultLang: en
  timezone: Europe/London
spec:
  pattern: dashboard
  branding:
    theme: light
    palette:
      primary: '#12304a'
      accent: '#0f7c7c'
      background: '#f6f8fa'
      foreground: '#16212b'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Tender
      color: primary
    - text: lens
      color: accent
    width: wide
  header:
    links:
    - label: How it works
      href: '#how'
    - label: Sources
      href: '#sources'
    - label: Pricing
      href: '#pricing'
    cta:
      label: Start 14-day trial
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Platform admin
      assignedBy: admin_emails
    - key: user
      label: Company admin (signup)
      assignedBy: signup
    - key: company_admin
      label: Company admin
      assignedBy: invite
    - key: sales_lead
      label: Sales lead
      assignedBy: invite
    - key: bid_manager
      label: Bid manager
      assignedBy: invite
  limits:
  - action: agent:scorer
    per: user
    max: 5
    window: day
  egress:
    hosts:
    - www.find-tender.service.gov.uk
    - www.contractsfinder.service.gov.uk
    notes: Find a Tender and Contracts Finder OCDS APIs; data published under the Open Government Licence v3.0. Council spending
      data is fetched from councils' published pages (OGL) via the WebRobot MCP.
  agents:
  - key: collector
    role: scheduled
    description: Reads Find a Tender and Contracts Finder daily and stores tenders, early signals and award notices.
    profile:
      inline:
        display_name: Tenderlens collector
        crews:
        - id: collector
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You collect UK public procurement notices. Use find_tender_search and contracts_finder_search (OCDS
            APIs) to fetch notices published in the last 2 days. For each notice call append_notice with: ref (unique notice
            id), kind (tender | planned | early_signal), title, buyer, buyer_contact (team or contact name if published),
            description (max 600 chars), cpv, region, value (number, GBP), deadline (YYYY-MM-DD), published (YYYY-MM-DD),
            url, source. Pre-market engagement and planned procurement notices are kind early_signal or planned. For award
            notices call append_award with: ref, title, buyer, supplier, value, awarded (date), contract_end (YYYY-MM-DD,
            if published), renewal_soon (true when contract_end is within the next 18 months from today), cpv, region, url,
            source. Only record what the APIs return; never invent values or contacts. Finish with a short markdown report
            that starts with ''# Collection <date>'' listing counts per kind.'
    goalTemplate: Today is {date}. Collect the latest notices and awards from Find a Tender and Contracts Finder and store
      them.
    appTools:
    - name: find_tender_search
      description: 'Search Find a Tender OCDS release packages. Query params: updatedFrom, updatedTo (ISO datetime), stages
        (planning,tender,award), limit.'
      action: http
      http:
        method: GET
        url: https://www.find-tender.service.gov.uk/api/1.0/ocdsReleasePackages
        attribution: Find a Tender, Open Government Licence v3.0
    - name: contracts_finder_search
      description: Search Contracts Finder OCDS notices. Path searches published notices; query params publishedFrom, publishedTo,
        stages, size.
      action: http
      http:
        method: GET
        url: https://www.contractsfinder.service.gov.uk/Published/Notices/OCDS/Search
        attribution: Contracts Finder, Open Government Licence v3.0
    - name: append_notice
      description: Store a tender or early-signal notice
      action: append
      collection: notices
      scope: all
    - name: append_award
      description: Store an award notice with contract end date
      action: append
      collection: awards
      scope: all
    limits:
      maxTurns: 30
      maxBudgetUsd: 1.0
  - key: spend_collector
    role: scheduled
    description: Weekly collection of council spending over £500 data.
    profile:
      inline:
        display_name: Tenderlens council spend collector
        crews:
        - id: spend
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You collect council spending data (payments over £500) published under the Open Government Licence.
            Using the WebRobot MCP, find the latest published spending files of the councils listed in the goal, extract rows
            and call append_spend for each aggregated row: buyer (council), supplier, amount (GBP number), month (YYYY-MM-01),
            category, source_url. Only use published figures; skip rows you cannot parse. End with a markdown report starting
            with ''# Council spend <date>'' with counts per council.'
    goalTemplate: Today is {date}. Collect the newest spending data for the 10 largest English councils by published spend,
      and store aggregated rows.
    appTools:
    - name: append_spend
      description: Store a council spend row
      action: append
      collection: spend
      scope: all
    limits:
      maxTurns: 40
      maxBudgetUsd: 1.5
  - key: scorer
    role: helper
    description: 'For one company: finds relevant notices, summarises them, scores fit, names the buying team, and learns
      from pursue/skip decisions.'
    memory: instance
    writesTo:
      collection: matches_digest
    profile:
      inline:
        display_name: Tenderlens scorer
        crews:
        - id: scorer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are a bid-intelligence analyst for one supplier company. Use search_notices to read notices
            from the last 2 days (tenders, early signals) and search_awards for contracts ending soon. For each plausible
            match call save_match with: ref, kind, title, buyer, summary (2 sentences), fit_score (0-100), fit_reason (one
            sentence), buying_team (the team or contact named in the notice; say ''not published'' otherwise), deadline, value,
            url. Score using the company profile and the company''s past pursue/skip decisions: raise scores for notices similar
            to those they pursued and lower for similar to skipped; mention this in fit_reason. Never invent contacts or figures.
            Your memory holds the signals learned so far; at the end call remember with up to 8 short rules about what this
            company pursues or skips. Final output is a markdown alert email starting with ''# Tenderlens alert — <date>''
            with sections ## New tenders, ## Early signals, ## Contracts expiring, each a short list with score, buyer, deadline,
            link. If nothing is relevant write ''# Tenderlens alert — <date>'' and ''Nothing new today.'''
    context:
    - key: offering
      from: collection:company_profile.offering
    - key: target_buyers
      from: collection:company_profile.target_buyers
    - key: regions
      from: collection:company_profile.regions
    - key: cpv_codes
      from: collection:company_profile.cpv_codes
    - key: decisions
      from: collection:opportunities
    goalTemplate: 'Today is {date}. Company offers: {offering}. Target buyers: {target_buyers}. Regions: {regions}. CPV codes:
      {cpv_codes}. Past decisions on opportunities (pursue/skip): {decisions}.

      Watch: {keywords}. Minimum value: {min_value}.'
    appTools:
    - name: search_notices
      description: Read stored tender and early-signal notices
      action: search
      collection: notices
      scope: all
    - name: search_awards
      description: Read stored award notices and contract end dates
      action: search
      collection: awards
      scope: all
    - name: save_match
      description: Save a scored match for this watch
      action: append
      collection: matches
    limits:
      maxTurns: 25
      maxBudgetUsd: 0.8
  - key: digest
    role: helper
    description: Weekly Monday digest per company.
    profile:
      inline:
        display_name: Tenderlens weekly digest
        crews:
        - id: digest
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write the Monday digest for one supplier company. Use search_notices (last 7 days), search_awards
            (contracts ending in the next 18 months in the company''s sector) and search_spend (buyers it targets). Start
            with ''# Tenderlens weekly digest — <date>''. Sections: ## Top opportunities this week (up to 8, with fit reason
            and deadline), ## Early signals, ## Contracts up for renewal, ## Competitor wins (supplier, buyer, value), ##
            Buyer spend movers. Real figures from the tools only; say when data is thin. Under 500 words.'
    context:
    - key: offering
      from: collection:company_profile.offering
    - key: target_buyers
      from: collection:company_profile.target_buyers
    - key: regions
      from: collection:company_profile.regions
    goalTemplate: 'Today is {date}. Write this week''s digest. Company offers: {offering}. Target buyers: {target_buyers}.
      Regions: {regions}.'
    appTools:
    - name: search_notices
      description: Read stored tender and early-signal notices
      action: search
      collection: notices
      scope: all
    - name: search_awards
      description: Read stored award notices and contract end dates
      action: search
      collection: awards
      scope: all
    - name: search_spend
      description: Read council spend rows
      action: search
      collection: spend
      scope: all
    limits:
      maxTurns: 15
      maxBudgetUsd: 0.5
  schedules:
  - agent: collector
    action: run
    cron: 0 5 * * *
    owner: app
  - agent: spend_collector
    action: run
    cron: 0 3 * * 0
    owner: app
  templates:
  - key: tender_watch
    title: Tender watch
    description: A daily scan of new tenders, early signals and expiring contracts for your profile, scored and emailed to
      you.
    agent: scorer
    params:
    - name: keywords
      type: text
      required: true
      label: Keywords
      help: e.g. cyber security, cloud migration
    - name: min_value
      type: number
      label: Minimum contract value (GBP)
    goal: 'Watch "{instance}" on {date}. Company offers: {offering}. Target buyers: {target_buyers}. Regions: {regions}. CPV
      codes: {cpv_codes}. Past decisions: {decisions}. Keywords: {keywords}. Minimum value: {min_value}.'
    schedule:
      cron: 0 7 * * 1-5
      userCanChange: true
    maxPerUser: 5
    cost:
      perRun: 5
    deliver:
      to: owner
      onlyIfNew: true
      subject: Tenderlens alert — {title}
  - key: weekly_digest
    title: Monday digest
    description: Your weekly procurement digest, every Monday at 07:00.
    agent: digest
    params:
    - name: focus
      type: text
      label: Focus (optional)
    goal: 'Write the weekly digest for {date}. Focus: {focus}.'
    schedule:
      cron: 0 7 * * 1
      userCanChange: false
    maxPerUser: 1
    cost:
      perRun: 10
    deliver:
      to: owner
      onlyIfNew: false
      subject: Tenderlens weekly digest — {date}
  data:
    collections:
    - name: notices
      ownedBy: app
      description: Tenders and early signals from Find a Tender and Contracts Finder
      retentionDays: 730
      fields:
      - name: ref
        type: text
      - name: kind
        type: select
        options:
        - tender
        - planned
        - early_signal
      - name: title
        type: text
      - name: buyer
        type: text
      - name: buyer_contact
        type: text
      - name: description
        type: textarea
      - name: cpv
        type: text
      - name: region
        type: text
      - name: value
        type: number
      - name: deadline
        type: date
      - name: published
        type: date
      - name: url
        type: url
      - name: source
        type: text
    - name: awards
      ownedBy: app
      description: Published award notices and contract end dates
      fields:
      - name: ref
        type: text
      - name: title
        type: text
      - name: buyer
        type: text
      - name: supplier
        type: text
      - name: value
        type: number
      - name: awarded
        type: date
      - name: contract_end
        type: date
      - name: renewal_soon
        type: boolean
      - name: cpv
        type: text
      - name: region
        type: text
      - name: url
        type: url
      - name: source
        type: text
    - name: spend
      ownedBy: app
      description: Council spending over £500, aggregated
      fields:
      - name: buyer
        type: text
      - name: supplier
        type: text
      - name: amount
        type: number
      - name: month
        type: date
      - name: category
        type: text
      - name: source_url
        type: url
    - name: matches
      ownedBy: instance
      description: Scored matches of each tender watch
      fields:
      - name: ref
        type: text
      - name: kind
        type: text
      - name: title
        type: text
      - name: buyer
        type: text
      - name: summary
        type: textarea
      - name: fit_score
        type: number
      - name: fit_reason
        type: text
      - name: buying_team
        type: text
      - name: deadline
        type: date
      - name: value
        type: number
      - name: url
        type: url
    - name: matches_digest
      ownedBy: instance
      description: Alert text of each run
      fields:
      - name: title
        type: text
    - name: company_profile
      ownedBy: user
      description: What the company sells, target buyers and regions
      fields:
      - name: company_name
        type: text
        required: true
        label: Company
      - name: offering
        type: textarea
        required: true
        label: What you sell
      - name: target_buyers
        type: textarea
        label: Target buyers
      - name: regions
        type: text
        label: Regions
      - name: cpv_codes
        type: text
        label: CPV codes (optional)
      - name: members
        type: array
        label: Team member emails
        fields:
        - name: email
          type: email
      access:
      - role: company_admin
        where:
          members: '{user.email}'
        can:
        - read
        - write
      - role: sales_lead
        where:
          members: '{user.email}'
        can:
        - read
      - role: bid_manager
        where:
          members: '{user.email}'
        can:
        - read
    - name: buyers
      ownedBy: user
      description: 'CRM: buyer organisations'
      fields:
      - name: name
        type: text
        required: true
        label: Buyer
      - name: team
        type: text
        label: Buying team
      - name: contact
        type: text
        label: Contact
      - name: contact_email
        type: email
        label: Contact email
      - name: phone
        type: text
        label: Phone
      - name: stage
        type: select
        label: Relationship
        options:
        - unknown
        - introduced
        - engaged
        - preferred
      - name: notes
        type: textarea
        label: Notes
      - name: members
        type: array
        label: Share with (emails)
        fields:
        - name: email
          type: email
      access:
      - role: company_admin
        where:
          members: '{user.email}'
        can:
        - read
        - write
      - role: sales_lead
        where:
          members: '{user.email}'
        can:
        - read
        - write
      - role: bid_manager
        where:
          members: '{user.email}'
        can:
        - read
        - write
    - name: opportunities
      ownedBy: user
      description: CRM pipeline; pursue/skip decisions teach the scoring
      fields:
      - name: title
        type: text
        required: true
        label: Opportunity
      - name: tender_ref
        type: text
        label: Notice reference
      - name: buyer
        type: text
        label: Buyer
      - name: decision
        type: select
        required: true
        label: Decision
        options:
        - value: pursue
          label: Pursue
        - value: skip
          label: Skip
      - name: reason
        type: textarea
        label: Why (teaches the scoring)
      - name: stage
        type: select
        label: Stage
        options:
        - identified
        - qualifying
        - bidding
        - submitted
        - won
        - lost
      - name: value
        type: number
        label: Value (GBP)
      - name: deadline
        type: date
        label: Deadline
      - name: owner_email
        type: email
        label: Owner
      - name: notes
        type: textarea
        label: Notes
      - name: url
        type: url
        label: Notice link
      - name: members
        type: array
        label: Share with (emails)
        fields:
        - name: email
          type: email
      access:
      - role: company_admin
        where:
          members: '{user.email}'
        can:
        - read
        - write
      - role: sales_lead
        where:
          members: '{user.email}'
        can:
        - read
        - write
      - role: bid_manager
        where:
          members: '{user.email}'
        can:
        - read
        - write
  views:
  - key: home
    type: page
    title: Tenderlens
    nav: false
    sections:
    - type: hero
      layout: stack
      band: true
      eyebrow: Public procurement intelligence
      title: Win more **government contracts** with earlier signals.
      text: Tenderlens reads Find a Tender, Contracts Finder and council spending data, scores every opportunity against your
        company, names the buying team and emails you what matters.
      actions:
      - label: Start 14-day free trial
        href: /login
        style: primary
    - type: steps
      id: how
      title: How it works
      items:
      - title: Describe your company
        text: Tell us what you sell, which buyers and regions you target.
      - title: Agents watch the market
        text: Scheduled agents scan new tenders, early signals and expiring contracts every day.
      - title: Act on scored alerts
        text: 'Mark opportunities pursue or skip: Tenderlens learns what you want.'
    - type: cards
      id: sources
      title: Sources
      items:
      - title: Find a Tender
        text: Above-threshold notices, Open Government Licence v3.0.
      - title: Contracts Finder
        text: Tenders and awards, Open Government Licence v3.0.
      - title: Council spending
        text: Payments over £500 published by councils, Open Government Licence.
    - type: cards
      id: pricing
      title: Pricing
      items:
      - title: Starter £100/month
        text: One company, tender watch and weekly digest.
      - title: Growth £250/month
        text: More watches and credits for larger teams.
      - title: Scale £500/month
        text: High volume watches for multi-division suppliers.
    - type: note
      content: Contains public sector information licensed under the Open Government Licence v3.0. Decision support, not legal
        or bidding advice.
  - key: profile
    type: form
    title: Company profile
    collection: company_profile
    fields:
    - company_name
    - offering
    - target_buyers
    - regions
    - cpv_codes
    - members
    edit: true
    submit:
      label: Save profile
      message: Profile saved.
      redirect: watches
    roles:
    - user
    - company_admin
    - admin
  - key: watches
    type: instances
    template: tender_watch
    title: My tender watches
    roles:
    - user
    - company_admin
    - sales_lead
    - bid_manager
    - admin
  - key: digest
    type: instances
    template: weekly_digest
    title: Weekly digest
    roles:
    - user
    - company_admin
    - sales_lead
    - bid_manager
    - admin
  - key: matches_view
    type: table
    title: Scored matches
    source: collection:matches
    data:
      display: table
      fields:
      - key: title
        label: Opportunity
      - key: buyer
        label: Buyer
      - key: fit_score
        label: Fit
        format: number
      - key: fit_reason
        label: Why
      - key: buying_team
        label: Buying team
      - key: deadline
        label: Deadline
        format: date
      - key: value
        label: Value
        format: money
      - key: url
        label: Notice
        format: link
      sort:
        field: fit_score
        dir: desc
      limit: 100
      actions:
      - type: calendar
        label: Add deadline
        title: title
        start: deadline
  - key: opportunity_form
    type: form
    title: Add opportunity / decide
    collection: opportunities
    edit: true
    submit:
      label: Save
      message: Saved. Your decision will teach the scoring.
      redirect: pipeline
    roles:
    - user
    - company_admin
    - sales_lead
    - bid_manager
    - admin
  - key: pipeline
    type: table
    title: Pipeline
    source: collection:opportunities
    export: true
    data:
      display: table
      fields:
      - key: title
        label: Opportunity
      - key: buyer
        label: Buyer
      - key: decision
        label: Decision
        format: badge
      - key: stage
        label: Stage
        format: badge
      - key: value
        label: Value
        format: money
      - key: deadline
        label: Deadline
        format: date
      - key: owner_email
        label: Owner
      sort:
        field: deadline
        dir: asc
      limit: 200
      actions:
      - type: calendar
        label: Add deadline
        title: title
        start: deadline
    roles:
    - user
    - company_admin
    - sales_lead
    - bid_manager
    - admin
  - key: buyer_form
    type: form
    title: Add buyer
    collection: buyers
    edit: true
    submit:
      label: Save buyer
      message: Buyer saved.
      redirect: buyers
    roles:
    - user
    - company_admin
    - sales_lead
    - bid_manager
    - admin
  - key: buyers
    type: table
    title: Buyers
    source: collection:buyers
    export: true
    data:
      display: table
      fields:
      - key: name
        label: Buyer
      - key: team
        label: Team
      - key: contact
        label: Contact
      - key: stage
        label: Relationship
        format: badge
      - key: notes
        label: Notes
      limit: 200
      actions:
      - type: call
        label: Call
        field: phone
    roles:
    - user
    - company_admin
    - sales_lead
    - bid_manager
    - admin
  - key: market
    type: page
    title: Market dashboards
    roles:
    - user
    - company_admin
    - sales_lead
    - bid_manager
    - admin
    sections:
    - type: data
      id: spend-by-buyer
      title: Spend by buyer
      intro: Council payments over £500, totalled per buyer.
      source: collection:spend
      display: bar
      fields:
      - key: buyer
        label: Buyer
      - key: total
        label: Total spend (GBP)
        format: money
      groupBy:
        field: buyer
        aggs:
        - key: total
          agg: sum
          field: amount
      limit: 20
      empty: No spend data yet.
    - type: data
      id: renewals
      title: Contract renewals in the next 18 months
      source: collection:awards
      display: table
      fields:
      - key: title
        label: Contract
      - key: buyer
        label: Buyer
      - key: supplier
        label: Incumbent
      - key: value
        label: Value
        format: money
      - key: contract_end
        label: Ends
        format: date
      - key: url
        label: Notice
        format: link
      filters:
      - field: renewal_soon
        op: '='
        value: true
      sort:
        field: contract_end
        dir: asc
      limit: 100
      empty: No renewals found yet.
    - type: data
      id: competitors
      title: Competitor wins
      intro: Suppliers ranked by published award notices.
      source: collection:awards
      display: chart
      chart: bar
      fields:
      - key: supplier
        label: Supplier
      - key: total
        label: Awarded value (GBP)
        format: money
      groupBy:
        field: supplier
        aggs:
        - key: total
          agg: sum
          field: value
      limit: 20
      empty: No award notices yet.
    - type: data
      id: recent-awards
      title: Latest awards
      source: collection:awards
      display: table
      fields:
      - key: supplier
        label: Supplier
