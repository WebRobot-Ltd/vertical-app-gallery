      - name: qty
        type: number
      - name: supplier
        type: text
      - name: order_date
        type: date
      - name: expected_date
        type: date
      - name: status
        type: text
      - name: members
        type: array
      - name: site_members
        type: array
      access:
      - role: manager
        where:
