apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: partwise
  displayName: Partwise
  tagline:
    en: The AI operating system for spare-parts supply chains.
    de: Das KI-Betriebssystem für Ersatzteil-Lieferketten.
  description:
    en: Import inventory, sales, purchase orders and lead times. Partwise forecasts demand per part, including slow and intermittent
      movers, and recommends reorders, transfers, scrapping and price changes. Planners review them in a queue, managers approve
      large purchase orders, and nothing reaches your ERP without approval.
    de: Importieren Sie Bestand, Verkäufe, Bestellungen und Lieferzeiten. Partwise prognostiziert den Bedarf je Teil, auch
      bei Langsamdrehern und sporadischem Bedarf, und empfiehlt Nachbestellungen, Umlagerungen, Verschrottung und Preisänderungen.
      Disponenten prüfen sie in einer Warteschlange, Manager genehmigen große Bestellungen, und nichts gelangt ohne Freigabe
      ins ERP.
  langs:
  - en
  - de
  defaultLang: en
  timezone: Europe/London
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12263a'
      accent: '#e07a1f'
      background: '#f6f7f9'
      foreground: '#16202b'
    fonts:
      body: Inter
      display: Space Grotesk
    wordmark:
    - text: Part
      color: primary
    - text: wise
      color: accent
    width: wide
  header:
    links:
    - label:
        en: How it works
        de: So funktioniert's
      href: '#how'
    - label:
        en: ERP
        de: ERP
      href: '#erp'
    - label:
        en: Pricing
        de: Preise
      href: '#pricing'
    cta:
      label:
        en: Sign in
        de: Anmelden
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label:
        en: Admin
        de: Admin
      assignedBy: admin_emails
    - key: user
      label:
        en: Company owner
        de: Unternehmensinhaber
      assignedBy: signup
    - key: planner
      label:
        en: Planner
        de: Disponent
      assignedBy: invite
    - key: manager
      label:
        en: Manager
        de: Manager
      assignedBy: invite
    - key: viewer
      label:
        en: Viewer
        de: Betrachter
      assignedBy: invite
  limits:
  - action: agent:forecaster
    per: user
    max: 10
    window: day
  - action: create:parts
    max: 5000
    window: total
    plans:
      growth: 25000
      scale: -1
  agents:
  - key: importer
    role: setup
    description: Reads uploaded CSV/Excel files and stores parts, sales history, purchase orders and suppliers.
    when: mode == 'import'
    profile:
      inline:
        display_name: Partwise importer
        crews:
        - id: importer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You import spare-parts data for one site. You receive the text of up to four files (inventory, sales
            history, purchase orders, supplier lead times) as CSV/Excel text, or file ids for scans (open them with read_upload).
            Map the columns to the collections, tolerating English or German headers and different column orders. Store rows
            with the tools: append_parts (part_number, description, site, location, stock, cost, price, lead_time_days, supplier,
            installed_base), append_sales (part_number, site, date YYYY-MM-DD, qty), append_pos (po_number, part_number, site,
            qty, supplier, order_date, expected_date, status), append_suppliers (name, lead_time_days, min_order_value). On
            every record set site, members (array: the company emails given to you plus the uploader''s email) and site_members
            (array: the emails given for this site plus the uploader''s email). Numbers must be numbers; dates ISO. Never
            invent rows or values: skip and report rows that cannot be read. Do not write anything to an ERP. Start with a
            level-1 title "# Import — <site>", then a short table of rows read / stored / skipped per file and a list of data-quality
            issues (missing costs, zero lead times, duplicates).'
    goalTemplate: 'Import for site: {site}

      Company emails with access to all sites: {company_members}

      Emails with access to this site: {site_members}

      Uploader email: {email}

      {?inventory_file}Inventory files: {inventory_file}

      {?inventory_file_text}INVENTORY:

      {inventory_file_text}{/inventory_file_text}{/inventory_file}

      {?sales_file}Sales history files: {sales_file}

      {?sales_file_text}SALES:

      {sales_file_text}{/sales_file_text}{/sales_file}

      {?po_file}Purchase order files: {po_file}

      {?po_file_text}PURCHASE ORDERS:

      {po_file_text}{/po_file_text}{/po_file}

      {?supplier_file}Supplier files: {supplier_file}

      {?supplier_file_text}SUPPLIERS:

      {supplier_file_text}{/supplier_file_text}{/supplier_file}

      Write the report in the language with ISO code {lang}.'
    context:
    - key: email
      from: user.email
    output: markdown
    appTools:
    - name: append_parts
      description: Store a part record
      action: append
      collection: parts
      scope: user
    - name: append_sales
      description: Store a sales history record
      action: append
      collection: sales_history
      scope: user
    - name: append_pos
      description: Store a purchase order record
      action: append
      collection: purchase_orders
      scope: user
    - name: append_suppliers
      description: Store a supplier record
      action: append
      collection: suppliers
      scope: user
    - name: read_upload
      description: Read a file the user uploaded
      action: read_file
    limits:
      maxTurns: 40
      maxBudgetUsd: 1.5
  - key: forecaster
    role: main
    description: Forecasts demand per part (smooth, intermittent, lumpy) and recommends reorders, transfers, scrapping and
      price changes with impact and reasons.
    when: mode == 'forecast'
    profile:
      inline:
        display_name: Partwise forecaster
        crews:
        - id: forecaster
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 90
          max_budget_usd: 3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are a spare-parts demand planner. Work on the site given in the goal. 1) Read parts, sales,
            purchase orders and suppliers with the read tools. 2) Take the 40 parts with the highest stock value or demand
            value (plus any with no sales in 52 weeks). For each, build the weekly demand series for the last 104 weeks (zeros
            included) and call forecast_demand with {weekly, lead_time_weeks, service_level, stock}. It returns the demand
            pattern (smooth, erratic, intermittent, lumpy, dead), a Croston/SBA forecast per week, safety stock, reorder point
            and a suggested order quantity. Never compute forecasts by hand. Save each with save_forecast (part_number, site,
            pattern, weekly_forecast, horizon_weeks, reorder_point, safety_stock, run_date). 3) Create recommendations with
            add_recommendation. Fields: type (reorder | transfer | scrap | price), part_number, site, to_site (transfers),
            qty, value (GBP, qty x cost for reorders), new_price (price changes), impact_gbp (expected annual saving or avoided
            cost, estimated only from the data), reason (2 sentences citing the figures), confidence (high|medium|low), status
            "pending", members and site_members copied from the part record. Reorder when stock plus open orders is below
            the reorder point. Transfer when another site holds surplus above its own 12-month need. Scrap when a part has
            no demand for 24 months and the installed base is zero or retired. Price change only with a clear margin or demand
            reason. Check read_recommendations first and do not duplicate pending ones. 4) Save one KPI snapshot with save_kpis
            (date, service_level, stock_value, dead_stock_value, forecast_accuracy, savings, all ratios as fractions 0-1,
            values in GBP) using only what the data supports; leave a field out if it cannot be measured. Never invent figures,
            never claim to write to an ERP: all recommendations await human approval. Start with "# Forecast and recommendations
            — <site> — <date>", then Summary, Recommendations by type (table), Parts by demand pattern, Data gaps. Add a chart
            block for the top 10 reorder values:

            ```chart

            {"type":"bar","title":"...","labels":["A"],"series":[{"name":"...","values":[1]}],"unit":"GBP"}

            ```'
    goalTemplate: 'Site: {site}

      Forecast horizon: {horizon_weeks} weeks

      Target service level: {service_level}

      Today is {date}.

      Write the report in the language with ISO code {lang}.'
    output: markdown
    appTools:
    - name: read_parts
      description: Read the parts
      action: read
      collection: parts
      scope: user
    - name: read_sales
      description: Read the sales history
      action: read
      collection: sales_history
      scope: user
    - name: read_pos
      description: Read the purchase orders
      action: read
      collection: purchase_orders
      scope: user
    - name: read_suppliers
      description: Read the suppliers and lead times
      action: read
      collection: suppliers
      scope: user
    - name: read_recommendations
      description: Read existing recommendations
      action: read
      collection: recommendations
      scope: user
    - name: forecast_demand
      description: Run the intermittent-demand forecast for one part
      action: call
      slot: intermittent_forecast
    - name: save_forecast
      description: Save the forecast of a part
      action: write
      collection: forecasts
      scope: user
    - name: add_recommendation
      description: Add a recommendation to the planners' queue
      action: append
      collection: recommendations
      scope: user
    - name: save_kpis
      description: Save a KPI snapshot
      action: append
      collection: kpi_snapshots
      scope: user
    limits:
      maxTurns: 90
      maxBudgetUsd: 3
  - key: erp_writer
    role: helper
    description: Writes an approved recommendation back to the user's ERP (SAP or Oracle) after manager approval when the
      purchase order is large.
    awaits:
    - po_manager
    profile:
      inline:
        display_name: Partwise ERP writer
        crews:
        - id: erp_writer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write ONE planner-approved recommendation back to the ERP. For type reorder: if value is above
            10000 GBP, first call request_po_manager with part_number, qty, supplier, value and the reason, and wait; proceed
            only if approved. Then create the purchase order with sap_create_po (SAP S/4HANA OData A_PurchaseOrder, JSON body
            with Supplier, PurchasingOrganization, PurchaseOrderItem lines: Material, OrderQuantity, Plant) or oracle_create_po
            (Oracle Fusion purchaseOrders, JSON body with SupplierName, ProcurementBU, lines), whichever the company connected;
            if neither is connected, say so, set status ready_to_apply and stop. On success set status written_back with update_recommendation
            and the ERP document reference in erp_ref. For transfer, scrap and price types do not call the ERP: set status
            ready_to_apply. If the manager rejects, set status rejected_by_manager. Never write anything that was not approved,
            never change quantities. Answer with a short "# ERP write-back — <part>" result.'
    goalTemplate: 'Write back this approved recommendation (id {record.id}): type {record.type}, part {record.part_number},
      site {record.site}, quantity {record.qty}, supplier {record.supplier}, value GBP {record.value}, reason: {record.reason}.
      Write the answer in the language with ISO code {lang}.'
    output: markdown
    appTools:
    - name: update_recommendation
      description: Update the status of a recommendation
      action: write
      collection: recommendations
      scope: user
    - name: sap_create_po
      description: Create a purchase order in the user's SAP system
      action: http
      http:
        method: POST
        url: https://{host}/sap/opu/odata/sap/API_PURCHASEORDER_PROCESS_SRV/A_PurchaseOrder
        allowPath: false
        credential:
          provider: sap
        attribution: User's own SAP system
    - name: oracle_create_po
      description: Create a purchase order in the user's Oracle Fusion system
      action: http
      http:
        method: POST
        url: https://{host}/fscmRestApi/resources/11.13.18.05/purchaseOrders
        allowPath: false
        credential:
          provider: oracle
        attribution: User's own Oracle system
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.5
  - key: digest
    role: scheduled
    description: Weekly summary of recommendations waiting for review.
    profile:
      inline:
        display_name: Partwise weekly digest
        crews:
        - id: digest
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You summarise the recommendations waiting for review (status pending, or awaiting a manager) with
            digest_recs, for the site named in the goal (all sites you can read if blank). Start with "# Partwise — recommendations
            waiting — <date>". Give counts by type, total expected impact in GBP, the 5 largest items (part, action, impact,
            reason in one line), and items older than 7 days. Under 250 words, plain, no invented figures. If nothing is waiting
            say so in one line.
    goalTemplate: 'Site: {site}. Today is {date}. Write in the language with ISO code {lang}.'
    writesTo:
      collection: digests
    output: markdown
    appTools:
    - name: digest_recs
      description: Read the recommendations of the user
      action: read
      collection: recommendations
      scope: user
    limits:
      maxTurns: 6
      maxBudgetUsd: 0.3
  slots:
  - key: intermittent_forecast
    description: Croston/SBA demand forecast, demand pattern class, safety stock, reorder point and suggested order quantity
      for one part.
    timeoutMs: 3000
    example:
      args:
        weekly:
        - 0
        - 0
        - 2
        - 0
        - 0
        - 0
        - 1
        - 0
        - 0
        - 3
        - 0
        - 0
        lead_time_weeks: 6
        service_level: 0.95
        stock: 2
    code: "import math\nZ={0.9:1.28,0.95:1.645,0.98:2.05,0.99:2.33}\ndef main(inp):\n    a=inp.get('args') or {}\n    d=[float(x)\
      \ for x in a.get('weekly',[])]\n    L=float(a.get('lead_time_weeks',4)); sl=float(a.get('service_level',0.95)); stock=float(a.get('stock',0))\n\
      \    z=Z[min(Z,key=lambda k:abs(k-sl))]\n    nz=[x for x in d if x>0]\n    if not nz:\n        return {'pattern':'dead','forecast_per_week':0,'safety_stock':0,'reorder_point':0,'suggested_order_qty':0}\n\
      \    n=len(d); adi=n/len(nz); m=sum(nz)/len(nz)\n    cv2=sum((x-m)**2 for x in nz)/len(nz)/(m*m)\n    if adi<1.32: pat='smooth'\
      \ if cv2<0.49 else 'erratic'\n    else: pat='intermittent' if cv2<0.49 else 'lumpy'\n    al=0.1; zz=nz[0]; p=adi; q=1\n\
      \    for x in d:\n        if x>0:\n            zz+=al*(x-zz); p+=al*(q-p); q=1\n        else:\n            q+=1\n  \
      \  f=(1-al/2)*zz/p\n    mu=sum(d)/n\n    sd=math.sqrt(sum((x-mu)**2 for x in d)/n)\n    ss=z*sd*math.sqrt(L)\n    rop=f*L+ss\n\
      \    up=f*(L+4)+ss\n    return {'pattern':pat,'adi':round(adi,2),'cv2':round(cv2,2),'forecast_per_week':round(f,3),'safety_stock':round(ss,2),'reorder_point':round(rop,2),'suggested_order_qty':max(0,math.ceil(up-stock)),'weeks_of_cover':round(stock/f,1)\
      \ if f>0 else None}\n"
  inputForm:
    title:
      en: New run
      de: Neuer Lauf
    fields:
    - name: mode
      type: select
      required: true
      default: forecast
      label:
        en: What do you want to do?
        de: Was möchten Sie tun?
      options:
      - value: forecast
        label:
          en: Forecast and recommend
          de: Prognose und Empfehlungen
      - value: import
        label:
          en: Import data (CSV / Excel)
          de: Daten importieren (CSV / Excel)
    - name: site
      type: text
      required: true
      label:
        en: Site / warehouse
        de: Standort / Lager
    - name: horizon_weeks
      type: number
      default: 26
      visibleWhen: mode == 'forecast'
      label:
        en: Forecast horizon (weeks)
        de: Prognosehorizont (Wochen)
    - name: service_level
      type: select
      default: '0.95'
      visibleWhen: mode == 'forecast'
      label:
        en: Target service level
        de: Ziel-Servicegrad
      options:
      - value: '0.9'
        label: 90%
      - value: '0.95'
        label: 95%
      - value: '0.98'
        label: 98%
      - value: '0.99'
        label: 99%
    - name: company_members
      type: text
      visibleWhen: mode == 'import'
      label:
        en: Emails who see all sites (managers), comma-separated
        de: E-Mails mit Zugriff auf alle Standorte (Manager), kommagetrennt
    - name: site_members
      type: text
      visibleWhen: mode == 'import'
      label:
        en: Emails who see this site (planners, viewers)
        de: E-Mails mit Zugriff auf diesen Standort (Disponenten, Betrachter)
    - name: inventory_file
      type: file
      accept:
      - csv
      - xlsx
      - pdf
      maxMb: 15
      visibleWhen: mode == 'import'
      label:
        en: Inventory (part, description, location, stock, cost, price, lead time, supplier, installed base)
        de: Bestand (Teil, Beschreibung, Lagerort, Bestand, Kosten, Preis, Lieferzeit, Lieferant, Installed Base)
    - name: sales_file
      type: file
      accept:
      - csv
      - xlsx
      maxMb: 15
      visibleWhen: mode == 'import'
      label:
        en: Sales history
        de: Verkaufshistorie
    - name: po_file
      type: file
      accept:
      - csv
      - xlsx
      maxMb: 15
      visibleWhen: mode == 'import'
      label:
        en: Purchase orders
        de: Bestellungen
    - name: supplier_file
      type: file
      accept:
      - csv
      - xlsx
      maxMb: 15
      visibleWhen: mode == 'import'
      label:
        en: Supplier lead times
        de: Lieferantenlieferzeiten
  data:
    collections:
    - name: parts
      ownedBy: user
      description: Parts master and stock per site
      fields:
      - name: part_number
        type: text
        required: true
      - name: description
        type: text
      - name: site
        type: text
      - name: location
        type: text
      - name: stock
        type: number
      - name: cost
        type: number
      - name: price
        type: number
      - name: lead_time_days
        type: number
      - name: supplier
        type: text
      - name: installed_base
        type: number
      - name: members
        type: array
      - name: site_members
        type: array
      access:
      - role: manager
        where:
          members: '{user.email}'
        can:
        - read
        - write
      - role: planner
        where:
          site_members: '{user.email}'
        can:
        - read
        - write
      - role: viewer
        where:
          site_members: '{user.email}'
        can:
        - read
      searchable: true
    - name: sales_history
      ownedBy: user
      fields:
      - name: part_number
        type: text
        required: true
      - name: site
        type: text
      - name: date
        type: date
      - name: qty
        type: number
      - name: members
        type: array
      - name: site_members
        type: array
      access:
      - role: manager
        where:
          members: '{user.email}'
        can:
        - read
      - role: planner
        where:
          site_members: '{user.email}'
        can:
        - read
      - role: viewer
        where:
          site_members: '{user.email}'
        can:
