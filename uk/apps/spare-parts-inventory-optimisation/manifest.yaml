        - write
      - role: viewer
        where:
          site_members: '{user.email}'
        can:
        - read
    - name: kpi_snapshots
      ownedBy: user
      fields:
      - name: date
        type: date
      - name: service_level
        type: number
      - name: stock_value
        type: number
      - name: dead_stock_value
        type: number
      - name: forecast_accuracy
        type: number
      - name: savings
        type: number
      - name: members
        type: array
      - name: site_members
        type: array
      access:
      - role: manager
        where:
          members: '{user.email}'
        can:
        - read
      - role: planner
        where:
          site_members: '{user.email}'
        can:
        - read
      - role: viewer
        where:
          site_members: '{user.email}'
        can:
        - read
    - name: digests
      ownedBy: instance
      description: Weekly summaries of recommendations waiting
    credentials:
    - provider: sap
      kind: api_key
      scope: user
      label:
        en: SAP S/4HANA (API token)
        de: SAP S/4HANA (API-Token)
      help:
        en: An API token or technical-user token for your SAP OData API, from your SAP Basis/API administrator.
        de: Ein API-Token oder Token eines technischen Benutzers für Ihre SAP-OData-API, vom SAP-Basis-/API-Administrator.
      hostLabel:
        en: your-tenant.s4hana.ondemand.com / xxx.hana.ondemand.com
        de: ihr-tenant.hana.ondemand.com
    - provider: oracle
      kind: api_key
      scope: user
      label:
        en: Oracle Fusion (API token)
        de: Oracle Fusion (API-Token)
      help:
        en: An access token for your Oracle Fusion REST API, from your Oracle administrator.
        de: Ein Zugriffstoken für Ihre Oracle-Fusion-REST-API, vom Oracle-Administrator.
      hostLabel:
        en: your-tenant.fa.us2.oraclecloud.com
        de: ihr-tenant.fa.eu1.oraclecloud.com
  egress:
    hosts:
    - '*.hana.ondemand.com'
    - '*.oraclecloud.com'
    notes: Only the customer's own SAP and Oracle Fusion tenants, called with the customer's own API token, to create purchase
      orders after human approval.
  approvals:
  - key: po_manager
    title:
      en: Purchase order above threshold
      de: Bestellung über dem Schwellenwert
    description: A manager must approve purchase orders above 10,000 GBP before they are written to the ERP.
    role: manager
    fields:
    - part_number
    - qty
    - supplier
    - value
    timeoutMinutes: 4320
    onTimeout: reject
  triggers:
  - key: rec_approved
    description: 'A planner approved a recommendation: prepare the ERP write-back (large purchase orders wait for a manager).'
    'on':
      collection: recommendations
      op: update
      where:
        status: approved
    start:
      agent: erp_writer
    goal: 'Write back this approved recommendation (id {record.id}): type {record.type}, part {record.part_number}, site {record.site},
      quantity {record.qty}, supplier {record.supplier}, value GBP {record.value}, reason: {record.reason}.'
  - key: po_rejected
    'on':
      approval: po_manager
      decision: rejected
    notify:
      to:
      - owner
      subject:
        en: Purchase order rejected by manager
        de: Bestellung vom Manager abgelehnt
      body:
        en: A manager rejected a purchase order above the threshold. It was not written to the ERP.
        de: Ein Manager hat eine Bestellung über dem Schwellenwert abgelehnt. Sie wurde nicht ins ERP geschrieben.
      link: queue
  templates:
  - key: weekly_digest
    title:
      en: Weekly summary
      de: Wöchentliche Zusammenfassung
    description:
      en: Every Monday an email with the recommendations waiting for review.
      de: Jeden Montag eine E-Mail mit den Empfehlungen, die auf Prüfung warten.
    agent: digest
    params:
    - name: site
      type: text
      label:
        en: Site (blank = all you can see)
        de: Standort (leer = alle sichtbaren)
    goal: 'Site: {site}. Today is {date}. Write in the language with ISO code {lang}.'
    schedule:
      cron: 0 7 * * 1
      userCanChange: true
    maxPerUser: 5
    deliver:
      to: owner
      onlyIfNew: true
  notifications:
    emailOnRunDone: true
  views:
  - key: home
    type: page
    nav: false
    title: Partwise
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow:
        en: Spare-parts supply chain AI
        de: KI für Ersatzteil-Lieferketten
      title:
        en: Right part, right place, **less dead stock**.
        de: Richtiges Teil, richtiger Ort, **weniger Ladenhüter**.
      text:
        en: Partwise forecasts demand for every part, including slow and intermittent movers, and tells your planners what
          to reorder, move, scrap or reprice, with the impact and the reasons. Nothing reaches your ERP without approval.
        de: Partwise prognostiziert den Bedarf jedes Teils, auch bei Langsamdrehern und sporadischem Bedarf, und sagt Ihren
          Disponenten, was nachzubestellen, umzulagern, zu verschrotten oder neu zu bepreisen ist, mit Wirkung und Begründung.
          Nichts gelangt ohne Freigabe ins ERP.
      actions:
      - label:
          en: Sign in
          de: Anmelden
        href: /login
        style: primary
      - label:
          en: How it works
          de: So funktioniert's
        href: '#how'
        style: ghost
      aside:
        en: <div style="padding:8px"><b>Queue this week</b><br>Reorder 12 × bearing kit — impact £4,200<br>Transfer 6 × valve
          from Leeds to Hamburg<br>Scrap 40 parts — free £18,000</div>
        de: <div style="padding:8px"><b>Warteschlange diese Woche</b><br>12 × Lagersatz nachbestellen — Wirkung £4.200<br>6
          × Ventil von Leeds nach Hamburg umlagern<br>40 Teile verschrotten — £18.000 freisetzen</div>
    - type: steps
      id: how
      title:
        en: How it works
        de: So funktioniert's
      items:
      - title:
          en: Import
          de: Importieren
        text:
          en: Upload inventory, sales history, purchase orders and supplier lead times as CSV or Excel.
          de: Laden Sie Bestand, Verkaufshistorie, Bestellungen und Lieferzeiten als CSV oder Excel hoch.
        badge: 📥
      - title:
          en: Forecast
          de: Prognose
        text:
          en: Each part is classified (smooth, intermittent, lumpy) and forecast with a method that fits its pattern.
          de: Jedes Teil wird klassifiziert (stetig, sporadisch, klumpig) und mit passender Methode prognostiziert.
        badge: 📈
      - title:
          en: Review
          de: Prüfen
        text:
          en: Planners approve, edit or reject recommendations; managers approve large purchase orders.
          de: Disponenten genehmigen, ändern oder lehnen Empfehlungen ab; Manager genehmigen große Bestellungen.
        badge: ✅
      - title:
          en: Write back
          de: Zurückschreiben
        text:
          en: Approved purchase orders go to your ERP, only then.
          de: Genehmigte Bestellungen gehen ins ERP, erst dann.
        badge: 🔗
    - type: cards
      id: erp
      title:
        en: ERP connectors
        de: ERP-Anbindung
      items:
      - title: SAP S/4HANA
        text:
          en: Connect your tenant with an API token; approved purchase orders are created through the OData API.
          de: Verbinden Sie Ihren Tenant mit einem API-Token; genehmigte Bestellungen werden über die OData-API angelegt.
        badge: 🔌
      - title: Oracle Fusion
        text:
          en: Same flow through the Fusion REST API.
          de: Gleicher Ablauf über die Fusion-REST-API.
        badge: 🔌
      - title:
          en: Sites and roles
          de: Standorte und Rollen
        text:
          en: Planners and viewers see their own site unless permitted; managers see all sites.
          de: Disponenten und Betrachter sehen ihren Standort, sofern nicht erweitert; Manager sehen alle Standorte.
        badge: 🏭
    - type: cards
      id: pricing
      title:
        en: Pricing
        de: Preise
      intro:
        en: Priced by number of parts, billed monthly.
        de: Preis nach Anzahl der Teile, monatliche Abrechnung.
      items:
      - title:
          en: Starter — from £3,000/month
          de: Starter — ab £3.000/Monat
        text:
          en: Up to 5,000 parts.
          de: Bis zu 5.000 Teile.
      - title:
          en: Growth — £6,500/month
          de: Growth — £6.500/Monat
        text:
          en: Up to 25,000 parts.
          de: Bis zu 25.000 Teile.
      - title:
          en: Scale — £12,000/month
          de: Scale — £12.000/Monat
        text:
          en: Unlimited parts.
          de: Unbegrenzte Teile.
    - type: note
      content:
        en: Partwise is decision support. Recommendations are estimates from your data and are written to your ERP only after
          human approval.
        de: Partwise ist Entscheidungsunterstützung. Empfehlungen sind Schätzungen aus Ihren Daten und werden erst nach menschlicher
          Freigabe ins ERP geschrieben.
  - key: new_run
    type: new_run
    title:
      en: Import / Forecast
      de: Import / Prognose
    roles:
    - admin
    - user
    - planner
    - manager
  - key: history
    type: history
    title:
      en: Runs
      de: Läufe
    source: run
    roles:
    - admin
    - user
    - planner
    - manager
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: queue
    type: table
    title:
      en: Review queue
      de: Prüf-Warteschlange
    source: collection:recommendations
    export: true
    roles:
    - admin
    - user
    - planner
    - manager
    - viewer
    data:
      display: table
      fields:
      - key: type
        label:
          en: Type
          de: Art
        format: badge
      - key: part_number
        label:
          en: Part
          de: Teil
      - key: site
        label:
          en: Site
          de: Standort
      - key: to_site
        label:
          en: To site
          de: Nach
      - key: qty
        label:
          en: Qty
          de: Menge
        format: number
      - key: value
        label:
          en: Value
          de: Wert
        format: money
      - key: impact_gbp
        label:
          en: Impact
          de: Wirkung
        format: money
      - key: reason
        label:
          en: Reason
          de: Begründung
      - key: status
        label:
          en: Status
          de: Status
        format: badge
      sort:
        field: impact_gbp
        dir: desc
      limit: 200
      empty:
        en: No recommendations yet. Run a forecast.
        de: Noch keine Empfehlungen. Starten Sie eine Prognose.
  - key: review
    type: form
    title:
      en: Review a recommendation
      de: Empfehlung prüfen
    collection: recommendations
    fields:
    - qty
    - new_price
    - planner_note
    - status
    edit: true
    submit:
      label:
        en: Save decision
        de: Entscheidung speichern
      message:
        en: Saved. Approved items go to the ERP step.
        de: Gespeichert. Genehmigte Einträge gehen in den ERP-Schritt.
      redirect: queue
    roles:
    - admin
    - user
    - planner
    - manager
    nav: false
  - key: approvals
    type: approvals
    title:
      en: Manager approvals
      de: Manager-Freigaben
    approvals:
    - po_manager
    roles:
    - admin
    - manager
  - key: dashboard
    type: page
    title:
      en: Dashboard
      de: Dashboard
    roles:
    - admin
    - user
    - planner
    - manager
    - viewer
    sections:
    - type: data
      title:
        en: Key figures
        de: Kennzahlen
      source: collection:kpi_snapshots
      display: kpi
      sort:
        field: date
        dir: asc
      kpis:
      - label:
          en: Service level
          de: Servicegrad
        agg: last
        field: service_level
        format: percent
      - label:
          en: Stock value
          de: Lagerwert
        agg: last
        field: stock_value
        format: money
      - label:
          en: Dead stock
          de: Ladenhüter
        agg: last
        field: dead_stock_value
        format: money
      - label:
          en: Forecast accuracy
          de: Prognosegenauigkeit
        agg: last
        field: forecast_accuracy
        format: percent
      - label:
          en: Savings achieved
          de: Erzielte Einsparungen
        agg: sum
        field: savings
        format: money
      empty:
        en: Run a forecast to see figures.
        de: Starten Sie eine Prognose für Kennzahlen.
    - type: data
      title:
        en: Service level and forecast accuracy
        de: Servicegrad und Prognosegenauigkeit
      source: collection:kpi_snapshots
      display: chart
      chart: line
      fields:
      - key: date
        format: date
      - key: service_level
        label:
          en: Service level
          de: Servicegrad
      - key: forecast_accuracy
        label:
          en: Forecast accuracy
          de: Prognosegenauigkeit
      sort:
        field: date
        dir: asc
      limit: 60
    - type: data
      title:
        en: Stock value and dead stock
        de: Lagerwert und Ladenhüter
      source: collection:kpi_snapshots
      display: chart
      chart: bar
      fields:
      - key: date
        format: date
      - key: stock_value
        label:
          en: Stock value
          de: Lagerwert
      - key: dead_stock_value
        label:
          en: Dead stock
          de: Ladenhüter
      sort:
        field: date
        dir: asc
      limit: 60
    - type: data
      title:
        en: Expected impact by type
        de: Erwartete Wirkung nach Art
      source: collection:recommendations
      display: bar
      groupBy:
        field: type
        aggs:
        - key: impact
          agg: sum
          field: impact_gbp
      fields:
      - key: type
      - key: impact
  - key: parts
    type: table
    title:
      en: Parts
      de: Teile
    source: collection:parts
    export: true
    roles:
    - admin
    - user
    - planner
    - manager
    - viewer
    data:
      display: table
      fields:
      - key: part_number
        label:
          en: Part
          de: Teil
      - key: description
        label:
          en: Description
          de: Beschreibung
      - key: site
        label:
          en: Site
          de: Standort
      - key: location
        label:
          en: Location
          de: Lagerort
      - key: stock
        label:
          en: Stock
          de: Bestand
        format: number
      - key: cost
        label:
          en: Cost
          de: Kosten
        format: money
      - key: price
        label:
          en: Price
          de: Preis
        format: money
      - key: lead_time_days
        label:
          en: Lead time (d)
          de: Lieferzeit (T)
        format: number
      - key: supplier
        label:
          en: Supplier
          de: Lieferant
      limit: 200
  - key: digests
    type: table
    title:
      en: Weekly summaries
      de: Wochenzusammenfassungen
    source: collection:digests
    roles:
    - admin
    - user
    - planner
    - manager
    data:
      display: list
      limit: 20
  - key: watches
    type: instances
    template: weekly_digest
    title:
      en: Weekly email
      de: Wöchentliche E-Mail
    roles:
    - admin
    - user
    - planner
    - manager
  - key: account
    type: account
    title:
      en: Plan and ERP connections
      de: Tarif und ERP-Verbindungen
    roles:
    - admin
    - user
    - manager
  billing:
    modes:
    - subscription
    currency: gbp
    plans:
    - key: starter
      price: 3000
      interval: month
      label:
        en: Starter — up to 5,000 parts
        de: Starter — bis 5.000 Teile
      includes:
      - Up to 5,000 parts
      - Forecasts and recommendations
      - SAP and Oracle write-back
      roles:
      - user
      - admin
    - key: growth
      price: 6500
      interval: month
      label:
        en: Growth — up to 25,000 parts
        de: Growth — bis 25.000 Teile
      includes:
      - Up to 25,000 parts
      roles:
      - user
      - admin
    - key: scale
      price: 12000
      interval: month
      label:
        en: Scale — unlimited parts
        de: Scale — unbegrenzte Teile
      includes:
      - Unlimited parts
      roles:
      - user
      - admin
  extensions:
  - key: deep_forecasting
    description: Deep-learning forecasting models are not available yet; forecasts use Croston/SBA intermittent-demand methods
      with safety stock in a sandboxed slot.
  - key: erp_oauth_and_direct_connectors
    description: ERP connection is limited to API tokens over HTTPS (SAP OData, Oracle Fusion REST). OAuth sign-in, RFC/IDoc,
      database-level and scheduled bulk ERP sync are not available yet; data comes in by CSV/Excel upload.
  - key: threshold_setting
    description: The manager approval threshold (10,000 GBP) is fixed in the ERP writer's instructions; a per-company setting
      is not available yet.
  - key: queue_row_links
    description: Rows in the review queue do not yet open the edit form directly; planners open /v/review?id=<record> from
      the record.
