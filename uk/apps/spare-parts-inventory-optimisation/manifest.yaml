      access:
      - role: manager
        where:
          members: '{user.email}'
        can:
        - read
      - role: planner
        where:
          site_members: '{user.email}'
        can:
        - read
      - role: viewer
        where:
          site_members: '{user.email}'
        can:
        - read
    - name: forecasts
      ownedBy: user
      fields:
