apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: lessonary
  displayName: Lessonary
  tagline:
    en: Curriculum-aligned lesson plans for English teachers, in minutes.
  description:
    en: 'Lessonary retrieves the matching DfE National Curriculum programme of study and writes a full lesson or half-term
      unit: objectives, starter, main activities, differentiation, assessment for learning, plenary, slide outline and worksheet
      with answer key.'
  langs:
  - en
  defaultLang: en
  timezone: Europe/London
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1d3557'
      accent: '#e07a1f'
      background: '#fbfaf7'
      foreground: '#1c2430'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Lesson
      color: primary
    - text: ary
      color: accent
  header:
    links:
    - label: How it works
      href: '#how'
    - label: Pricing
      href: '#pricing'
    cta:
      label: Plan a lesson
      href: /v/new
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      label: Teacher
      assignedBy: signup
    - key: hod
      label: Head of department
      assignedBy: derived
      from: collection:lessons.hod_email
  limits:
  - action: run
    per: user
    max: 5
    window: month
    roles:
    - user
    plans:
      teacher: -1
      school: -1
  agents:
  - key: planner
    role: main
    when: mode == 'lesson'
    description: Retrieves the National Curriculum programme of study and writes a complete lesson.
    profile:
      inline:
        display_name: Lessonary lesson planner
        crews:
        - id: planner
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You are an experienced English teacher and curriculum designer. First, retrieve the relevant statutory
            National Curriculum programme of study (DfE, gov.uk, Open Government Licence v3.0) for the subject and key stage
            using the WebRobot tools, and quote the matching statements briefly with the source URL. If you cannot retrieve
            it, say so plainly and do not invent statutory wording. Then write a full lesson for the given year group, length
            and class. Begin with a level-1 title ''# <Topic> — <Subject>, Year <n>''. Sections (## headings): Curriculum
            link (quoted statements + source), Learning objectives and success criteria, Prior knowledge and key vocabulary,
            Starter, Main activities (with timings that add up to the lesson length), Differentiation (stretch, support, SEND
            adaptations, EAL strategies sized to the numbers given), Assessment for learning (questions, mini-plenaries, misconceptions),
            Plenary, Resources and preparation, Slide outline (slide-by-slide: title and content), Worksheet (ready to print)
            and Answer key. Use British English and UK terminology. Never invent facts, statistics or statutory text. Teachers
            will review and edit the plan; flag any item needing a safety check (e.g. practical science, PE).'
    goalTemplate: 'Plan one lesson.

      Subject: {subject_label}

      Key stage: {key_stage_label}

      Year group: {year_group}

      Topic: {topic}

      Lesson length: {lesson_length} minutes

      {?prior_knowledge}Prior knowledge: {prior_knowledge}{/prior_knowledge}

      {?send_count}Pupils with SEND: {send_count}{/send_count}

      {?eal_count}Pupils with EAL: {eal_count}{/eal_count}

      {?resources}Resources available: {resources}{/resources}

      Today is {date}. Write in British English.'
    output: markdown
  - key: sequencer
    role: main
    when: mode == 'unit'
    description: Plans a half-term sequence of lessons.
    profile:
      inline:
        display_name: Lessonary sequence builder
        crews:
        - id: sequencer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You are a head of department planning a half-term unit of work in England. First retrieve the relevant
            DfE National Curriculum programme of study (gov.uk, OGL v3.0) with the WebRobot tools and cite the source URL;
            never invent statutory wording. Then write a sequence. Start with ''# <Unit title> — <Subject>, Year <n> (half-term
            plan)''. Sections: Curriculum coverage, Big ideas and end-of-unit outcomes, Lesson-by-lesson sequence (a table:
            lesson number, title, objective, key activity, assessment), Retrieval practice and spaced recall, Key vocabulary,
            Assessment points, Adaptations for SEND and EAL, Risks and what to check. Match the number of lessons and weekly
            lesson length given. British English; real content only.'
    goalTemplate: 'Plan a half-term unit.

      Subject: {subject_label}

      Key stage: {key_stage_label}

      Year group: {year_group}

      Unit topic: {topic}

      Number of lessons: {unit_lessons}

      Lesson length: {lesson_length} minutes

      {?prior_knowledge}Prior knowledge: {prior_knowledge}{/prior_knowledge}

      {?send_count}Pupils with SEND: {send_count}{/send_count}

      {?eal_count}Pupils with EAL: {eal_count}{/eal_count}

      {?resources}Resources available: {resources}{/resources}

      Today is {date}.'
    output: markdown
  inputForm:
    title: New plan
    fields:
    - name: mode
      type: select
      required: true
      default: lesson
      label: What do you need?
      options:
      - value: lesson
        label: A single lesson
      - value: unit
        label: A half-term unit
    - name: subject
      type: select
      required: true
      label: Subject
      options:
      - English
      - Mathematics
      - Science
      - History
      - Geography
      - Computing
      - Art and design
      - Design and technology
      - Music
      - Physical education
      - Modern foreign languages
      - Citizenship
    - name: key_stage
      type: select
      required: true
      label: Key stage
      options:
      - value: ks1
        label: Key Stage 1
      - value: ks2
        label: Key Stage 2
      - value: ks3
        label: Key Stage 3
      - value: ks4
        label: Key Stage 4
    - name: year_group
      type: select
      required: true
      label: Year group
      dependsOn: key_stage
      options:
      - value: Year 1
        parent: ks1
      - value: Year 2
        parent: ks1
      - value: Year 3
        parent: ks2
      - value: Year 4
        parent: ks2
      - value: Year 5
        parent: ks2
      - value: Year 6
        parent: ks2
      - value: Year 7
        parent: ks3
      - value: Year 8
        parent: ks3
      - value: Year 9
        parent: ks3
      - value: Year 10
        parent: ks4
      - value: Year 11
        parent: ks4
    - name: topic
      type: text
      required: true
      maxLength: 200
      label: Topic
    - name: lesson_length
      type: number
      required: true
      default: 60
      label: Lesson length (minutes)
    - name: unit_lessons
      type: number
      default: 6
      visibleWhen: mode == 'unit'
      label: Number of lessons in the unit
    - name: prior_knowledge
      type: textarea
      maxLength: 600
      label: Prior knowledge (optional)
    - name: send_count
      type: number
      label: Pupils with SEND
    - name: eal_count
      type: number
      label: Pupils with EAL
    - name: resources
      type: textarea
      maxLength: 400
      label: Resources available (optional)
      help: e.g. iPads, science lab, whiteboard only
  data:
    collections:
    - name: lessons
      ownedBy: user
      description: The teacher's lesson library. Members' emails share a lesson with the department; the head of department
        named in hod_email sees it.
      fields:
      - name: title
        type: text
        required: true
      - name: subject
        type: text
      - name: key_stage
        type: text
      - name: year_group
        type: text
      - name: topic
        type: text
      - name: content
        type: textarea
        required: true
        label: Lesson plan
      - name: members
        type: array
        label: Share with colleagues (emails)
        fields:
        - name: email
          type: email
      - name: hod_email
        type: email
        label: Head of department (email)
      access:
      - role: user
        where:
          members: '{user.email}'
        can:
        - read
      - role: hod
        where:
          hod_email: '{user.email}'
        can:
        - read
  views:
  - key: home
    type: page
    nav: false
    title: Lessonary
    sections:
    - type: hero
      eyebrow: For teachers in England
      title: Plan a **National Curriculum** lesson in minutes.
      text: 'Tell Lessonary your subject, year group and class. It finds the matching DfE programme of study and writes the
        full lesson: objectives, starter, activities, differentiation, assessment, plenary, slides and a worksheet with answer
        key.'
      actions:
      - label: Plan a lesson
        href: /v/new
        style: primary
      - label: Sign in
        href: /login
        style: ghost
      note: 'Free: five lessons a month.'
    - type: steps
      id: how
      title: How it works
      items:
      - title: Describe your class
        text: Subject, key stage, topic, length, prior knowledge, SEND and EAL numbers, resources.
      - title: Get a full plan
        text: Grounded in the statutory programme of study, with differentiation and AfL built in.
      - title: Edit, save, share
        text: Keep lessons in your library, share them with your department, and build half-term sequences.
    - type: cards
      id: pricing
      title: Pricing
      items:
      - title: Free
        text: Five lessons a month.
        badge: £0
      - title: Teacher
        text: Unlimited lessons and units for one teacher.
        badge: £8/mo
      - title: School
        text: Per-head pricing for departments, with shared folders and head of department view.
        badge: Per head
    - type: note
      content: 'Curriculum content: DfE National Curriculum in England, used under the Open Government Licence v3.0. AI-generated
        plans are drafts: review before teaching. England only for now.'
  - key: new
    type: new_run
    title: Plan
    roles:
    - user
    - admin
    - hod
  - key: history
    type: history
    title: My runs
    source: run
    roles:
    - user
    - admin
    - hod
  - key: plan
    type: report
    source: run
    printable: true
    nav: false
  - key: save_lesson
    type: form
    title: Save to library
    collection: lessons
    edit: true
    submit:
      label: Save lesson
      message: Saved to your library.
      redirect: library
    roles:
    - user
    - admin
    - hod
  - key: library
    type: table
    title: Lesson library
    source: collection:lessons
    export: true
    data:
      display: table
      fields:
      - key: title
        label: Title
      - key: subject
        label: Subject
      - key: year_group
        label: Year
      - key: topic
        label: Topic
      sort:
        field: title
        dir: asc
    roles:
    - user
    - admin
    - hod
  - key: department
    type: cards
    title: Department folder
    source: collection:lessons
    data:
      display: cards
      fields:
      - key: title
        label: Title
      - key: subject
        label: Subject
      - key: year_group
        label: Year
      limit: 100
    roles:
    - hod
    - user
  - key: account
    type: account
    title: Plan and billing
    roles:
    - user
    - hod
  triggers:
  - key: lesson_shared
    'on':
      collection: lessons
      op: insert
    notify:
      to:
      - record.hod_email
      subject: 'New lesson in your department: {record.title}'
      body: A colleague saved the lesson "{record.title}" to the department folder in Lessonary.
      link: department
  notifications:
    emailOnRunDone: true
  billing:
    modes:
    - subscription
    currency: gbp
    plans:
    - key: teacher
      price: 8
      interval: month
      label: Teacher
      includes:
      - Unlimited lessons and units
      - Library and department sharing
    - key: school
      price: 6
      interval: month
      label: School (per head)
      includes:
      - Everything in Teacher
      - Department folders
      - Head of department view
  extensions:
  - key: pptx_docx_export
    description: Native PowerPoint (.pptx) and Word (.docx) export is not available yet. The plan, slide outline and worksheet
      are in a printable report (PDF via print).
  - key: school_accounts
    description: School sign-up, per-head seat quantity through Stripe and a school-wide membership are not expressible yet.
      The school plan is a per-teacher monthly price; departments share by listing colleague emails and a head of department
      email on each lesson.
  - key: curriculum_retrieval
    description: The agent fetches the DfE National Curriculum (gov.uk, OGL v3.0) through the WebRobot MCP at run time; no
      cached copy. Scotland and Wales are later.
