apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: framewright
  displayName: Framewright
  tagline: 'From site to handover: mid-rise housing built by factory robots, tracked in one place.'
  description: Framewright is the platform around a robotic construction business. Developers and landowners submit a site
    and get a reviewed feasibility proposal. Signed projects are then tracked through design gates, factory batches, deliveries
    and on-site assembly, with client sign-offs, payment milestones and email updates.
  langs:
  - en
  defaultLang: en
  timezone: Europe/London
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f2d3a'
      accent: '#e07a1f'
      background: '#f6f5f2'
      foreground: '#1a1f24'
    fonts:
      body: Inter
      display: Space Grotesk
    wordmark:
    - text: Frame
      color: primary
    - text: wright
      color: accent
    width: wide
  header:
    links:
    - label: How it works
      href: '#how'
    - label: Pricing
      href: '#pricing'
    cta:
      label: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: client
      label: Client
      assignedBy: signup
    - key: design_team
      label: Design team
      assignedBy: invite
    - key: production_manager
      label: Production manager
      assignedBy: invite
    - key: site_manager
      label: Site manager
      assignedBy: invite
  limits:
  - action: agent:feasibility
    per: user
    max: 10
    window: day
    roles:
    - client
  agents:
  - key: feasibility
    role: main
    description: Checks a submitted site against public planning, flood and nearby-application data and drafts a feasibility
      layout with cost, carbon and timeline. The design team reviews it before the client sees it.
    profile:
      inline:
        display_name: Framewright feasibility analyst
        crews:
        - id: feasibility
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the feasibility analyst of Framewright, a company that builds mid-rise housing from components
            made by robots in a factory. You produce a DRAFT that our design team will review and adjust before any client
            sees it.


            STEPS

            1. Geocode the address with the geocode tool (query: q=<address>, format=json, limit=1, countrycodes=gb). Use
            one request only. If nothing is found, say so and stop guessing.

            2. Planning constraints: call planning_data with query latitude=<lat>&longitude=<lon>&dataset=<name>&limit=20
            for each of: flood-risk-zone, conservation-area, listed-building, green-belt, article-4-direction-area, tree-preservation-zone.
            A dataset with no entity means nothing found in that dataset, not that it is certain to be clear.

            3. Flood risk: use the flood-risk-zone result (Environment Agency data, zones 2 and 3) and also call flood_warnings
            with query lat=<lat>&long=<lon>&dist=3 for current warnings. Report the flood zone as 1, 2 or 3 and what it means
            for the scheme.

            4. Nearby planning applications: call planning_data with dataset=planning-application and the site coordinates,
            and report what you find (reference, description, decision, date). If the dataset has no coverage for the area,
            say so.

            5. Layout: call read_components to get the Framewright component catalogue (code, category, area_m2, cost_gbp,
            carbon_kgco2e, factory_hours). Propose a layout that fits the site area, the number of homes and the unit mix
            requested, using ONLY components in the catalogue: storeys, homes per floor, components per unit type, and a bill
            of components with quantities. Never invent component codes or prices.

            6. Estimates: cost_gbp = sum of component costs plus clearly stated allowances for foundations, site works and
            fees (give the percentages you assume); carbon_tco2e from component carbon figures; timeline_months from factory
            hours, delivery and on-site assembly, stating the assumptions. Compare the cost with the client''s budget.

            If the planning status or the site is a blocker, say so plainly. This is decision support, not legal or planning
            advice; never present uncertain facts as certain and never invent figures.


            OUTPUT

            First a Markdown report starting with a level-1 title "# Feasibility draft — <address>", then sections ## Summary,
            ## Planning constraints, ## Flood risk, ## Nearby applications, ## Proposed layout (with a table of components),
            ## Cost, carbon and timeline, ## Risks and next steps, ## Sources. Add a chart block for the cost breakdown:

            ```chart

            {"type":"pie","title":"Cost breakdown","labels":["A","B"],"series":[{"name":"GBP","values":[1,2]}],"unit":"GBP"}

            ```

            At the very end, ONE fenced json block with exactly these keys: site_address, flood_zone, planning_summary, nearby_applications,
            layout, homes_delivered, cost_gbp, carbon_tco2e, timeline_months, report, status (always "draft"). report holds
            the Markdown above.'
    context:
    - key: client_email
      from: user.email
    output: markdown+json
    resultSchema:
      type: object
      properties:
        site_address:
          type: string
        flood_zone:
          type: string
        planning_summary:
          type: string
        nearby_applications:
          type: string
        layout:
          type: string
        homes_delivered:
          type: number
        cost_gbp:
          type: number
        carbon_tco2e:
          type: number
        timeline_months:
          type: number
        report:
          type: string
        status:
          type: string
    writesTo:
      collection: proposals
      parse: json_last
    limits:
      maxTurns: 30
      maxBudgetUsd: 1.5
      timeoutSeconds: 900
    appTools:
    - name: geocode
      description: 'Find the latitude and longitude of an address (OpenStreetMap Nominatim). Query example: q=...&format=json&limit=1&countrycodes=gb'
      action: http
      http:
        method: GET
        url: https://nominatim.openstreetmap.org/search
        attribution: © OpenStreetMap contributors, ODbL
    - name: planning_data
      description: 'Query planning.data.gov.uk entities by dataset and location. Query example: latitude=..&longitude=..&dataset=flood-risk-zone&limit=20'
      action: http
      http:
        method: GET
        url: https://www.planning.data.gov.uk/entity.json
        attribution: planning.data.gov.uk, Open Government Licence v3.0
    - name: flood_warnings
      description: 'Current flood warnings near a point from the Environment Agency. Query example: lat=..&long=..&dist=3'
      action: http
      http:
        method: GET
        url: https://environment.data.gov.uk/flood-monitoring/id/floods
        attribution: Environment Agency, Open Government Licence v3.0
    - name: read_components
      description: Read the Framewright component catalogue
      action: read
      collection: components
      scope: all
  data:
    collections:
    - name: components
      ownedBy: shared
      description: 'The Framewright component system: what the factory can make, with cost, carbon and factory hours. Admins
        keep it on /admin/data.'
      fields:
      - name: code
        type: text
        required: true
      - name: name
        type: text
        required: true
      - name: category
        type: select
        options:
        - wall_panel
        - floor_cassette
        - roof_module
        - core
        - stair
        - services
        - facade
        - other
      - name: area_m2
        type: number
      - name: cost_gbp
        type: number
      - name: carbon_kgco2e
        type: number
      - name: factory_hours
        type: number
      - name: notes
        type: textarea
    - name: sites
      ownedBy: user
      description: Sites submitted by clients for a feasibility study
      fields:
      - name: address
        type: text
        required: true
        label: Site address
      - name: site_area_m2
        type: number
        required: true
        label: Site area (m²)
      - name: planning_status
        type: select
        required: true
        label: Planning status
        options:
        - value: none
          label: No application yet
        - value: pre_application
          label: Pre-application advice
        - value: submitted
          label: Application submitted
        - value: outline_granted
          label: Outline permission granted
        - value: full_granted
          label: Full permission granted
        - value: allocated
          label: Allocated in local plan
      - name: homes
        type: number
        required: true
        label: Number of homes wanted
      - name: units_studio
        type: number
        label: Studios
      - name: units_1bed
        type: number
        label: 1-bed homes
      - name: units_2bed
        type: number
        label: 2-bed homes
      - name: units_3bed
        type: number
        label: 3-bed homes
      - name: budget_gbp
        type: number
        label: Budget (GBP)
      - name: notes
        type: textarea
        maxLength: 800
        label: Anything else we should know
      access:
      - role: design_team
        can:
        - read
    - name: proposals
      ownedBy: user
      description: Feasibility proposals drafted by the agent, adjusted by the design team, then sent to the client (status
        sent)
      fields:
      - name: site_address
        type: text
      - name: flood_zone
        type: text
      - name: planning_summary
        type: textarea
      - name: nearby_applications
        type: textarea
      - name: layout
        type: textarea
      - name: homes_delivered
        type: number
      - name: cost_gbp
        type: number
        label: Estimated cost (GBP)
      - name: carbon_tco2e
        type: number
        label: Embodied carbon (tCO2e)
      - name: timeline_months
        type: number
        label: Timeline (months)
      - name: report
        type: textarea
      - name: status
        type: select
        options:
        - draft
        - reviewed
        - sent
        default: draft
      - name: design_notes
        type: textarea
        label: Design team notes
      access:
      - role: design_team
        can:
        - read
        - write
    - name: projects
      ownedBy: org
      description: Signed projects (back office record; each client sees their own through client_email)
      fields:
      - name: name
        type: text
        required: true
      - name: client_email
        type: email
        required: true
      - name: site_address
        type: text
      - name: stage
        type: select
        required: true
        options:
        - contracted
        - design
        - manufacturing
        - delivery
        - assembly
        - handover
        default: contracted
      - name: homes
        type: number
      - name: contract_value_gbp
        type: number
      - name: start_date
        type: date
      - name: target_handover
        type: date
      access:
      - role: client
        where:
          client_email: '{user.email}'
        can:
        - read
      - role: design_team
        can:
        - read
        - write
      - role: production_manager
        can:
        - read
        - write
      - role: site_manager
        can:
        - read
    - name: design_gates
      ownedBy: org
      description: Design approval gates; the client signs each one off
      fields:
      - name: project_name
        type: text
        required: true
      - name: client_email
        type: email
        required: true
      - name: gate
        type: select
        required: true
        options:
        - concept
        - planning
        - technical
        - manufacturing_release
      - name: summary
        type: textarea
        label: What the client is asked to approve
      - name: document
        type: file
        accept:
        - pdf
        - png
        - jpg
        maxMb: 15
      - name: status
        type: select
        options:
        - pending_client
        - approved
        - changes_requested
        default: pending_client
        label: Decision
      - name: client_comment
        type: textarea
        label: Your comment
      access:
      - role: client
        where:
          client_email: '{user.email}'
        can:
        - read
        - write
      - role: design_team
        can:
        - read
        - write
      - role: production_manager
        can:
        - read
    - name: batches
      ownedBy: org
      description: Component manufacturing batches
      fields:
      - name: batch_code
        type: text
        required: true
      - name: project_name
        type: text
        required: true
      - name: client_email
        type: email
        required: true
      - name: component_type
        type: text
      - name: units
        type: number
      - name: planned_week
        type: date
        label: Planned week (Monday)
      - name: status
        type: select
        options:
        - planned
        - in_production
        - quality_check
        - ready
        - shipped
        default: planned
      - name: qa_notes
        type: textarea
      access:
      - role: client
        where:
          client_email: '{user.email}'
        can:
        - read
      - role: production_manager
        can:
        - read
        - write
      - role: design_team
        can:
        - read
      - role: site_manager
        can:
        - read
    - name: deliveries
      ownedBy: org
      description: Deliveries of batches to site
      fields:
      - name: project_name
        type: text
        required: true
      - name: client_email
        type: email
        required: true
      - name: batch_code
        type: text
      - name: delivery_date
        type: date
      - name: status
        type: select
        options:
        - scheduled
        - in_transit
        - delivered
        - issue
        default: scheduled
      - name: notes
        type: textarea
      access:
      - role: client
        where:
          client_email: '{user.email}'
        can:
        - read
      - role: production_manager
        can:
        - read
        - write
      - role: site_manager
        can:
        - read
        - write
      - role: design_team
        can:
        - read
    - name: milestones
      ownedBy: org
      description: On-site assembly milestones and progress updates with photos
      fields:
      - name: project_name
        type: text
        required: true
      - name: client_email
        type: email
        required: true
      - name: milestone
        type: text
        required: true
        label: Milestone (e.g. Level 3 floor cassettes fitted)
      - name: status
        type: select
        options:
        - planned
        - in_progress
        - done
        default: in_progress
      - name: date
        type: date
      - name: notes
        type: textarea
      - name: photos
        type: file
        accept:
        - jpg
        - jpeg
        - png
        - webp
        maxMb: 10
        multiple: true
        capture: true
        label: Site photos
      access:
      - role: client
        where:
          client_email: '{user.email}'
        can:
        - read
      - role: site_manager
        can:
        - read
        - write
      - role: production_manager
        can:
        - read
      - role: design_team
        can:
        - read
    - name: payments
      ownedBy: org
      description: Payment milestones of each contract
      fields:
      - name: project_name
        type: text
        required: true
      - name: client_email
        type: email
        required: true
      - name: label
        type: text
        required: true
      - name: amount_gbp
        type: number
        required: true
      - name: due_date
        type: date
      - name: status
        type: select
        options:
        - upcoming
        - invoiced
        - paid
        default: upcoming
      - name: reference
        type: text
      access:
      - role: client
        where:
          client_email: '{user.email}'
        can:
        - read
      - role: design_team
        can:
        - read
    - name: documents
      ownedBy: org
      description: Project documents shared with the client
      fields:
      - name: project_name
        type: text
        required: true
      - name: client_email
        type: email
        required: true
      - name: title
        type: text
        required: true
      - name: kind
        type: select
        options:
        - drawing
        - planning
        - contract
        - warranty
        - certificate
        - other
      - name: file
        type: file
        accept:
        - pdf
        - docx
        - xlsx
        - png
        - jpg
        maxMb: 15
      access:
      - role: client
        where:
          client_email: '{user.email}'
        can:
        - read
      - role: design_team
        can:
        - read
        - write
      - role: production_manager
        can:
        - read
      - role: site_manager
        can:
        - read
    - name: factory_capacity
      ownedBy: org
      description: Weekly factory capacity per production line
      fields:
      - name: week_start
        type: date
        required: true
      - name: line
        type: text
      - name: capacity_units
        type: number
        required: true
      - name: booked_units
        type: number
      access:
      - role: production_manager
        can:
        - read
        - write
      - role: design_team
        can:
        - read
  views:
  - key: home
    type: page
    title: Framewright
    nav: false
    sections:
    - type: hero
      band: true
      eyebrow: Robotic construction, tracked end to end
      title: Mid-rise housing, **built in a factory**, delivered with full visibility.
      text: Submit your site and get a feasibility proposal checked against planning, flood and nearby-application data, reviewed
        by our design team. Once signed, follow every approval, batch, delivery and assembly milestone.
      actions:
      - label: Submit a site
        href: /v/submit_site
        style: primary
      - label: Sign in
        href: /login
        style: ghost
    - type: steps
      id: how
      title: How it works
      items:
      - title: Submit your site
        text: Address, area, planning status, homes wanted, unit mix and budget.
      - title: Feasibility proposal
        text: An AI agent checks planning.data.gov.uk, Environment Agency flood data and nearby applications, then drafts
          a layout from our component system with cost, carbon and timeline.
      - title: Design team review
        text: Our designers adjust the draft and send it to you.
      - title: Build with visibility
        text: Sign off each design gate, follow factory batches, deliveries and site photos, and see payment milestones and
          documents.
    - type: cards
      id: pricing
      title: Pricing
      items:
      - title: Feasibility study
        text: A fixed fee per site, paid in credits when you submit it.
        badge: '1'
      - title: Project contract
        text: Contract value agreed per project, with payment milestones tracked here.
        badge: '2'
    - type: note
      content: Feasibility proposals are decision support based on public data, not planning or legal advice. Figures are
        estimates until confirmed in a signed contract.
  - key: submit_site
    type: form
    title: Submit a site
    collection: sites
    roles:
    - client
    - admin
    submit:
      label: Request feasibility study
      message: Site received. Our agent is checking it now and the design team will send you a reviewed proposal.
      redirect: my_sites
  - key: my_sites
    type: table
    title: My sites
    source: collection:sites
    columns:
    - address
    - site_area_m2
    - homes
    - planning_status
    - budget_gbp
    roles:
    - client
    - design_team
    - admin
  - key: my_proposals
    type: table
    title: My proposals
    source: collection:proposals
    query: status = sent
    columns:
    - site_address
    - homes_delivered
    - cost_gbp
    - carbon_tco2e
    - timeline_months
    - flood_zone
    printable: true
    roles:
    - client
  - key: review_queue
    type: table
    title: Proposal review
    source: collection:proposals
    columns:
    - site_address
    - status
    - homes_delivered
    - cost_gbp
    - carbon_tco2e
    - timeline_months
    roles:
    - design_team
    - admin
  - key: review_proposal
    type: form
    title: Adjust proposal
    collection: proposals
    edit: true
    roles:
    - design_team
    - admin
    nav: false
    submit:
      label: Save proposal
      message: Saved. Set the status to sent to release it to the client.
      redirect: review_queue
  - key: project_form
    type: form
    title: Project
    collection: projects
    edit: true
    roles:
    - design_team
    - production_manager
    - admin
    submit:
      label: Save project
      message: Project saved.
      redirect: projects
  - key: projects
    type: table
    title: Projects
    source: collection:projects
    columns:
    - name
    - client_email
    - site_address
    - stage
    - homes
    - contract_value_gbp
    - target_handover
    export: true
    roles:
    - client
    - design_team
    - production_manager
    - site_manager
    - admin
  - key: gate_form
    type: form
    title: Request design approval
    collection: design_gates
    fields:
    - project_name
    - client_email
    - gate
    - summary
    - document
    roles:
    - design_team
    - admin
    submit:
      label: Send to client
      message: The client has been asked to sign off this gate.
      redirect: gates
  - key: gates
    type: table
    title: Design approvals
    source: collection:design_gates
    columns:
    - project_name
    - gate
    - status
    - client_comment
    roles:
    - client
    - design_team
    - production_manager
    - admin
  - key: gate_signoff
    type: form
    title: Sign off design gate
    collection: design_gates
    fields:
    - status
    - client_comment
    edit: true
    roles:
    - client
    nav: false
    submit:
      label: Submit decision
      message: Thank you, your decision is recorded.
      redirect: gates
  - key: batch_form
    type: form
    title: Manufacturing batch
    collection: batches
    edit: true
    roles:
    - production_manager
    - admin
    submit:
      label: Save batch
      message: Batch saved.
      redirect: batches
  - key: batches
    type: table
    title: Manufacturing batches
    source: collection:batches
    columns:
    - batch_code
    - project_name
    - component_type
    - units
    - planned_week
    - status
    roles:
    - client
    - design_team
    - production_manager
    - site_manager
    - admin
  - key: delivery_form
    type: form
    title: Delivery
    collection: deliveries
    edit: true
    roles:
    - production_manager
    - site_manager
    - admin
    submit:
      label: Save delivery
      message: Delivery saved.
      redirect: deliveries
  - key: deliveries
    type: table
    title: Deliveries
    source: collection:deliveries
    columns:
    - project_name
    - batch_code
    - delivery_date
    - status
    - notes
    roles:
    - client
    - design_team
    - production_manager
    - site_manager
    - admin
  - key: milestone_form
    type: form
    title: Site update
    collection: milestones
    edit: true
    roles:
    - site_manager
    - admin
    submit:
      label: Post update
      message: Update posted, the client is notified.
      redirect: progress
  - key: progress
    type: table
    title: Site progress
    source: collection:milestones
    columns:
    - project_name
    - milestone
    - status
    - date
    - notes
    - photos
    roles:
    - client
    - design_team
    - production_manager
    - site_manager
    - admin
  - key: payments
    type: table
    title: Payment milestones
    source: collection:payments
    columns:
    - project_name
    - label
    - amount_gbp
    - due_date
    - status
    roles:
    - client
    - design_team
    - admin
  - key: payment_form
    type: form
    title: Payment milestone
    collection: payments
    edit: true
    roles:
    - admin
    submit:
      label: Save
      message: Saved.
      redirect: payments
  - key: documents
    type: table
    title: Documents
    source: collection:documents
    columns:
    - project_name
    - title
    - kind
    - file
    roles:
    - client
    - design_team
    - production_manager
    - site_manager
    - admin
  - key: document_form
    type: form
    title: Add document
    collection: documents
    roles:
    - design_team
    - admin
    submit:
      label: Share with client
      message: Document added.
      redirect: documents
  - key: capacity_form
    type: form
    title: Factory capacity
    collection: factory_capacity
    edit: true
    roles:
    - production_manager
    - admin
    submit:
      label: Save
      message: Capacity saved.
  - key: dashboard
    type: page
    title: Dashboard
    roles:
    - design_team
    - production_manager
    - site_manager
    - admin
    sections:
    - type: data
      title: Projects
      source: collection:projects
      display: kpi
      kpis:
      - label: Projects
        agg: count
      - label: Contract value
        agg: sum
        field: contract_value_gbp
        format: money
      - label: Homes
        agg: sum
        field: homes
        format: number
    - type: data
      title: Projects by stage
      source: collection:projects
      display: chart
      chart: bar
      fields:
      - key: stage
        label: Stage
      - key: count
        label: Projects
      groupBy:
        field: stage
        aggs:
        - key: value
          agg: sum
          field: contract_value_gbp
    - type: data
      title: Factory capacity by week
      source: collection:factory_capacity
      display: chart
      chart: bar
      fields:
      - key: week_start
        label: Week
      - key: capacity
        label: Capacity
      - key: booked
        label: Booked
      groupBy:
        field: week_start
        bucket: week
        aggs:
        - key: capacity
          agg: sum
          field: capacity_units
        - key: booked
          agg: sum
          field: booked_units
      sort:
        field: week_start
        dir: asc
    - type: data
      title: Batches by status
      source: collection:batches
      display: chart
      chart: pie
      fields:
      - key: status
        label: Status
      - key: count
        label: Batches
      groupBy:
        field: status
        aggs: []
    - type: data
      title: Next deliveries
      source: collection:deliveries
      display: table
      fields:
      - key: project_name
        label: Project
      - key: batch_code
        label: Batch
      - key: delivery_date
        label: Date
        format: date
      - key: status
        label: Status
        format: badge
      sort:
        field: delivery_date
        dir: asc
      limit: 15
  - key: account
    type: account
    title: Credits
    roles:
    - client
  triggers:
  - key: site_submitted
    description: 'A client submitted a site: draft the feasibility proposal'
    'on':
      collection: sites
      op: insert
    start:
      agent: feasibility
    goal: 'Prepare a feasibility draft for this site.

      Address: {record.address}

      Site area: {record.site_area_m2} m2

      Planning status: {record.planning_status}

      Homes wanted: {record.homes}

      Unit mix: studios {record.units_studio}, 1-bed {record.units_1bed}, 2-bed {record.units_2bed}, 3-bed {record.units_3bed}

      Budget: {record.budget_gbp} GBP

      Client notes: {record.notes}

      Client email: {client_email}

      Today is {date}. Write the report in English.'
  - key: site_fee
    description: Feasibility study fee per site
    'on':
      collection: sites
      op: insert
    charge:
      credits: 100
      reason: Feasibility study
  - key: proposal_sent
    'on':
      collection: proposals
      op: update
      where:
        status: sent
    notify:
      to: owner
      subject: Your Framewright feasibility proposal is ready
      body: Our design team has reviewed your feasibility proposal for {record.site_address}. Estimated cost, carbon and timeline
        are in the app.
      link: my_proposals
  - key: gate_requested
    'on':
      collection: design_gates
      op: insert
    notify:
      to: record.client_email
      subject: 'Design approval needed: {record.gate}'
      body: Your sign-off is needed for the {record.gate} gate of {record.project_name}. Please review and approve or request
        changes.
      link: gates
  - key: gate_approved
    'on':
      collection: design_gates
      op: update
      where:
        status: approved
    notify:
      to: role:design_team
      subject: 'Gate approved: {record.project_name}'
      body: The client approved the {record.gate} gate of {record.project_name}.
      link: gates
  - key: gate_changes
    'on':
      collection: design_gates
      op: update
      where:
        status: changes_requested
    notify:
      to: role:design_team
      subject: 'Changes requested: {record.project_name}'
      body: 'The client asked for changes on the {record.gate} gate of {record.project_name}: {record.client_comment}'
      link: gates
  - key: site_update
    'on':
      collection: milestones
      op: insert
    notify:
      to: record.client_email
      subject: 'Site update: {record.project_name}'
      body: 'New update on {record.project_name}: {record.milestone} ({record.status}). Photos and notes are in the app.'
      link: progress
  - key: delivery_done
    'on':
      collection: deliveries
      op: any
      where:
        status: delivered
    notify:
      to: record.client_email
      subject: 'Delivery arrived on site: {record.project_name}'
      body: A delivery for {record.project_name} (batch {record.batch_code}) has arrived on site.
      link: deliveries
  - key: stage_changed
    'on':
      collection: projects
      op: update
    notify:
      to: record.client_email
      subject: '{record.name} moved to {record.stage}'
      body: 'Your project {record.name} is now at stage: {record.stage}.'
      link: projects
  - key: payment_reminder
    'on':
      date:
        collection: payments
        field: due_date
        offsetDays: -3
        hour: 8
      where:
        status: invoiced
    notify:
      to: record.client_email
      subject: 'Payment milestone due soon: {record.label}'
      body: The payment milestone {record.label} for {record.project_name} ({record.amount_gbp} GBP) is due on {record.due_date}.
      link: payments
  egress:
    hosts:
    - www.planning.data.gov.uk
    - environment.data.gov.uk
    - nominatim.openstreetmap.org
    notes: 'planning.data.gov.uk and Environment Agency data: Open Government Licence v3.0, reuse allowed with attribution.
      Nominatim (OpenStreetMap, ODbL): geocoding of one address per study, within its usage policy.'
  billing:
    modes:
    - credits
    currency: gbp
    signupCredits: 0
    packs:
    - key: study_1
      credits: 100
      price: 250
      label: 1 feasibility study
    - key: study_5
      credits: 500
      price: 1100
      label: 5 feasibility studies
  mobile:
    appId: com.framewright.app
    capabilities:
    - name: camera
      reason:
        en: To photograph assembly progress on site
    - name: push
  extensions:
  - key: contract_billing
    description: Contract value is agreed per project and payment milestones are tracked and reminded here, but invoicing
      and collecting the contract payments is not automated by this app.
  - key: proposal_release
    description: Draft proposals live in the client's own record and are hidden from the client by the status filter on their
      view until the design team sets status to sent.
