apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: closetly
  displayName: Closetly
  tagline:
    en: Your digital wardrobe with an AI stylist.
  description:
    en: Photograph your clothes, build a digital wardrobe, get outfits for the weather and the occasion, plan your week, see
      what each piece really costs per wear, and resell what you no longer wear.
  langs:
  - en
  defaultLang: en
  timezone: Europe/London
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#2b2a33'
      accent: '#d4577b'
      background: '#fbf8f5'
      foreground: '#1f1e24'
    fonts:
      body: Inter
      display: Playfair Display
    wordmark:
    - text: Closet
      color: primary
    - text: ly
      color: accent
  header:
    links:
    - label: How it works
      href: '#how'
    - label: Premium
      href: '#premium'
    cta:
      label: Get started
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  limits:
  - action: agent:stylist
    per: user
    max: 5
    window: month
    roles:
    - user
    plans:
      premium: -1
  - action: run
    per: user
    max: 40
    window: day
    roles:
    - user
  agents:
  - key: stylist
    role: main
    when: task == 'outfit'
    description: Creates outfits from the user's own wardrobe for weather, occasion and plans.
    profile:
      inline:
        display_name: Closetly stylist
        crews:
        - id: stylist
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 14
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are a friendly personal stylist. Use ONLY clothes found with the tool items_read (the user''s
            own wardrobe, ignore items with status sold). If a location ("lat,lng") is given, call weather_forecast with query
            "lat=<lat>&lon=<lng>" (MET Norway locationforecast compact) and use the temperature and rain of the requested
            day; otherwise ask nothing and say weather was not considered. Start with a level-1 title "# Outfits for <occasion
            or day>". Give 2 or 3 outfits as ## sections, each listing the exact item names, then a short "Why it works" (weather,
            occasion, colour, season, favourite pieces, not worn recently). Mention the weather used. Save each outfit with
            outfit_save (title, items, explanation). If the user asks to plan a day, also call plan_add (day YYYY-MM-DD, outfit_title,
            details). Never invent clothes that are not in the wardrobe; if the wardrobe is too small, say what is missing.
            Reply in English.'
    goalTemplate: 'Task: {task_label}

      Occasion: {occasion}

      {?location}Location: {location}{/location}

      {?day}Day: {day}{/day}

      {?notes}Calendar and notes from the user: {notes}{/notes}

      Today is {date}. Reply in the language with ISO code {lang}.'
    appTools:
    - name: items_read
      description: Read the user's wardrobe items
      action: read
      collection: items
      scope: user
    - name: outfit_save
      description: Save an outfit for the user
      action: append
      collection: outfits
      scope: user
    - name: plan_add
      description: Plan an outfit on a day
      action: append
      collection: planned
      scope: user
    - name: weather_forecast
      description: Weather forecast from MET Norway for a position
      action: http
      http:
        method: GET
        url: https://api.met.no/weatherapi/locationforecast/2.0/compact
        attribution: Weather data from MET Norway, CC BY 4.0
    output: markdown
    limits:
      maxTurns: 14
      maxBudgetUsd: 0.5
  - key: shopper
    role: main
    when: task == 'gaps'
    description: Finds wardrobe gaps and suggests items from affiliate retailer feeds.
    profile:
      inline:
        display_name: Closetly gap finder
        crews:
        - id: shopper
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You analyse a wardrobe and suggest what is missing. Read the wardrobe with items_read. Find gaps
            (e.g. no rain jacket, too few versatile basics, colours that do not combine) and say which existing pieces each
            new item would unlock. Then search the catalogue of affiliate retailer products with feed_search and suggest at
            most 6 products, ONLY from that feed, with name, retailer, price and the affiliate link exactly as stored. Never
            suggest products from anywhere else and never invent products or prices. Start with a level-1 title "# Wardrobe
            gaps". State that links are affiliate links. Reply in English.
    goalTemplate: 'Find wardrobe gaps. Focus: {?occasion}{occasion}{/occasion}{!occasion}everyday life{/occasion}. {?notes}Budget
      and wishes: {notes}{/notes} Today is {date}.'
    appTools:
    - name: items_read
      description: Read the user's wardrobe items
      action: read
      collection: items
      scope: user
    - name: feed_search
      description: Search affiliate retailer products
      action: search
      collection: feed_items
      scope: all
    output: markdown
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.5
  - key: reseller
    role: main
    when: task == 'resale'
    description: Writes a resale listing for an item.
    profile:
      inline:
        display_name: Closetly resale writer
        crews:
        - id: reseller
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write second-hand marketplace listings. Read the user''s items with items_read and find the
            one whose id is given. If the file field has a photo, you may open it with read_upload. Start with a level-1 title
            that is the listing title (max 80 characters). Then sections: ## Description (honest, with brand, size, colour,
            season, condition as stated), ## Suggested price (a range based on the purchase price and typical depreciation;
            say it is an estimate), ## Tags. Then save the text with item_update (id, listing_text, status "for_sale"). Never
            claim a condition or authenticity the record does not state. You cannot publish: tell the user to copy the listing
            to the marketplace. Reply in English.'
    goalTemplate: 'Write the resale listing for the item with id {item}. {?notes}Notes: {notes}{/notes}'
    appTools:
    - name: items_read
      description: Read the user's wardrobe items
      action: read
      collection: items
      scope: user
    - name: item_update
      description: Update a wardrobe item of the user
      action: write
      collection: items
      scope: user
    - name: read_upload
      description: Read a photo of an item
      action: read_file
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.3
  - key: analyst
    role: main
    when: task == 'stats'
    description: 'Wardrobe statistics: cost per wear, unworn items, value.'
    profile:
      inline:
        display_name: Closetly analyst
        crews:
        - id: analyst
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You compute wardrobe statistics from the user''s records: items_read (purchase price) and wear_read
            (one record per time an item was worn). Report: total wardrobe value (sum of prices), number of items, cost per
            wear for each item (price divided by number of wears; say ''never worn'' when 0), the 10 best and 10 worst, unworn
            items (candidates for resale) and spending by category. Use only real figures from the records. Start with a level-1
            title "# Wardrobe statistics". Add one chart as a fenced block: ```chart {"type":"bar","title":"Cost per wear","labels":[...],"series":[{"name":"Cost
            per wear","values":[...]}]}``` for the top worst-value items. End with 3 practical suggestions. Reply in English.'
    goalTemplate: Compute my wardrobe statistics. Today is {date}.
    appTools:
    - name: items_read
      description: Read the user's wardrobe items
      action: read
      collection: items
      scope: user
    - name: wear_read
      description: Read the user's wear log
      action: read
      collection: wear_log
      scope: user
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.3
  inputForm:
    title: Ask Closetly
    fields:
    - name: task
      type: select
      required: true
      label: What do you need?
      default: outfit
      options:
      - value: outfit
        label: Outfit ideas
      - value: gaps
        label: Fill the gaps in my wardrobe
      - value: resale
        label: Resale listing (Premium)
      - value: stats
        label: Wardrobe statistics
    - name: occasion
      type: text
      label: Occasion
      visibleWhen: task == 'outfit' || task == 'gaps'
      maxLength: 200
    - name: day
      type: date
      label: Day
      visibleWhen: task == 'outfit'
    - name: location
      type: location
      label: Where (for the weather)
      visibleWhen: task == 'outfit'
    - name: item
      type: select
      label: Item to sell
      optionsFrom: collection:items
      visibleWhen: task == 'resale'
    - name: notes
      type: textarea
      maxLength: 500
      label: Notes (calendar, budget, wishes)
  data:
    collections:
    - name: items
      ownedBy: user
      description: The user's clothes
      fields:
      - name: name
        type: text
        required: true
        label: Name
      - name: photo
        type: file
        accept:
        - jpg
        - jpeg
        - png
        - webp
        maxMb: 10
        capture: true
        extract: none
        label: Photo
      - name: category
        type: select
        required: true
        label: Category
        options:
        - tops
        - bottoms
        - dresses
        - outerwear
        - shoes
        - accessories
        - other
      - name: colour
        type: text
        label: Colour
      - name: brand
        type: text
        label: Brand
      - name: season
        type: select
        label: Season
        options:
        - spring
        - summer
        - autumn
        - winter
        - all-year
      - name: size
        type: text
        label: Size
      - name: price
        type: number
        label: Purchase price
      - name: purchased_on
        type: date
        label: Purchased on
      - name: status
        type: select
        label: Status
        default: active
        options:
        - active
        - for_sale
        - sold
      - name: listing_text
        type: textarea
        label: Resale listing
    - name: wear_log
      ownedBy: user
      description: Each time an item is worn
      fields:
      - name: item
        type: select
        required: true
        optionsFrom: collection:items
        label: Item
      - name: day
        type: date
        required: true
        label: Day
    - name: outfits
      ownedBy: user
      sharing:
      - viewer
      description: Saved outfits, shareable with friends
      fields:
      - name: title
        type: text
        required: true
        label: Title
      - name: items
        type: textarea
        label: Items
      - name: explanation
        type: textarea
        label: Why it works
    - name: planned
      ownedBy: user
      description: Outfits planned on the calendar
      fields:
      - name: day
        type: date
        required: true
        label: Day
      - name: outfit_title
        type: text
        required: true
        label: Outfit
      - name: details
        type: textarea
        label: Details
    - name: feed_items
      ownedBy: shared
      searchable: true
      description: Products from retailer affiliate feeds, loaded by the admins from CSV
      fields:
      - name: name
        type: text
        label: Product
      - name: retailer
        type: text
        label: Retailer
      - name: category
        type: text
        label: Category
      - name: colour
        type: text
        label: Colour
      - name: price
        type: number
        label: Price
      - name: affiliate_url
        type: url
        label: Affiliate link
  views:
  - key: home
    type: page
    title: Closetly
    nav: false
    sections:
    - type: hero
      title: Your wardrobe, **styled by AI**.
      text: Photograph your clothes, get outfits for the weather and the occasion, plan your week and know what every piece
        really costs you.
      actions:
      - label: Get started
        href: /login
        style: primary
      band: true
    - type: steps
      id: how
      title: How it works
      items:
      - title: Add your clothes
        text: Take a photo, confirm category, colour, brand, season, size and price.
        badge: 📷
      - title: Ask the stylist
        text: Outfits from your own wardrobe, with the reason for each choice.
        badge: ✨
      - title: Plan and wear
        text: Put outfits on the calendar and get a push notification each morning.
        badge: 📅
      - title: Know your numbers
        text: Cost per wear, unworn items, wardrobe value, and resale listings.
        badge: 📊
    - type: cards
      id: premium
      title: Free, with Premium
      items:
      - title: Free
        text: Unlimited wardrobe, planner, statistics and 5 stylist requests per month.
      - title: Premium
        text: Unlimited stylist requests and the resale tools.
    - type: note
      content: Closetly suggests clothes; weather comes from MET Norway (CC BY 4.0). Shopping suggestions use affiliate links.
  - key: add_item
    type: form
    title: Add clothes
    collection: items
    fields:
    - photo
    - name
    - category
    - colour
    - brand
    - season
    - size
    - price
    - purchased_on
    submit:
      label: Save to wardrobe
      message: Added to your wardrobe.
      redirect: wardrobe
    edit: true
    roles:
    - user
    - admin
  - key: wardrobe
    type: cards
    title: My wardrobe
    source: collection:items
    export: true
    data:
      display: cards
      fields:
      - key: name
      - key: category
        format: badge
      - key: colour
      - key: brand
      - key: season
        format: badge
      - key: size
      - key: price
        format: money
      - key: status
        format: badge
      sort:
        field: name
        dir: asc
      limit: 200
    roles:
    - user
    - admin
  - key: new_run
    type: new_run
    title: Ask the stylist
    roles:
    - user
    - admin
  - key: history
    type: history
    title: My requests
    source: run
    roles:
    - user
    - admin
  - key: report
    type: report
    source: run
    printable: true
    nav: false
  - key: outfits_list
    type: table
    title: My outfits
    source: collection:outfits
    data:
      display: table
      fields:
      - key: title
      - key: items
      - key: explanation
      limit: 100
    roles:
    - user
    - admin
  - key: plan_day
    type: form
    title: Plan an outfit
    collection: planned
    submit:
      label: Add to calendar
      message: Planned. You will get a push notification that morning.
      redirect: planner
    roles:
    - user
    - admin
  - key: planner
    type: table
    title: Calendar
    source: collection:planned
    data:
      display: table
      fields:
      - key: day
        format: date
      - key: outfit_title
      - key: details
      sort:
        field: day
        dir: asc
      limit: 100
    roles:
    - user
    - admin
  - key: log_wear
    type: form
    title: I wore this
    collection: wear_log
    submit:
      label: Log wear
      message: Wear logged.
    roles:
    - user
    - admin
  - key: stats
    type: page
    title: Statistics
    roles:
    - user
    - admin
    sections:
    - type: data
      title: My wardrobe
      source: collection:items
      display: kpi
      kpis:
      - label: Items
        agg: count
      - label: Wardrobe value
        agg: sum
        field: price
        format: money
    - type: data
      title: Value by category
      source: collection:items
      display: chart
      chart: pie
      fields:
      - key: category
      - key: total
      groupBy:
        field: category
        aggs:
        - key: total
          agg: sum
          field: price
    - type: text
      title: Cost per wear and unworn items
      content: Ask the stylist for **Wardrobe statistics** to get cost per wear and unworn items, based on the wears you log.
    - type: view
      view: new_run
  - key: account
    type: account
    title: Premium
    roles:
    - user
  schedules: []
  triggers:
  - key: morning_look
    description: Morning push with the day's planned look
    'on':
      date:
        collection: planned
        field: day
        offsetDays: 0
        hour: 7
    notify:
      to: owner
      subject: 'Today''s look: {record.outfit_title}'
      body: '{record.outfit_title}

        {record.details}'
      link: planner
  billing:
    modes:
    - subscription
    currency: eur
    costs:
      agent:reseller:
        requiresPlan: premium
    plans:
    - key: premium
      price: 6.99
      interval: month
      label: Closetly Premium
      includes:
      - Unlimited stylist requests
      - Resale tools
  mobile:
    appId: com.closetly.app
    appName: Closetly
    capabilities:
    - name: camera
      reason:
        en: To photograph your clothes
    - name: location
      reason:
        en: To check the weather where you are
    - name: push
  egress:
    hosts:
    - api.met.no
    notes: 'MET Norway locationforecast: free reuse, CC BY 4.0, attribution required.'
  extensions:
  - key: background_removal
    description: Automatic background removal from item photos is not available yet; photos are stored as taken.
  - key: virtual_try_on
    description: Virtual try-on of new items needs image generation, not available yet.
  - key: ebay_publish
    description: Publishing listings to eBay (and other marketplaces) needs OAuth sign-in to another service, not available
      yet. The app writes the listing and the user copies it.
  - key: calendar_sync
    description: Reading the user's Google/Apple calendar needs OAuth, not available yet; the user enters plans in the planner
      or in the request notes.
  - key: affiliate_feeds
    description: Retailer product feeds are loaded by the admins into feed_items on the data page (CSV) from affiliate programmes;
      live API feeds can be added per retailer later.
