apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: pathfinder
  displayName: Pathfinder
  tagline:
    en: Confidential AI interviews that turn into your AI-adoption roadmap.
  description:
    en: Pathfinder interviews your employees confidentially, by voice or text in the language they choose. An AI analyst turns
      the answers into a map of processes, automation opportunities, risks and readiness by department, then drafts a roadmap
      for your project lead to review.
  langs:
  - en
  defaultLang: en
  timezone: Europe/London
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#17324d'
      accent: '#e0703a'
      background: '#f8f6f2'
      foreground: '#1c2430'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Path
      color: primary
    - text: finder
      color: accent
  header:
    links:
    - label: How it works
      href: '#how'
    - label: Confidentiality
      href: '#privacy'
    cta:
      label: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: project_lead
      label: Project lead
      assignedBy: invite
    - key: leadership
      label: Leadership viewer
      assignedBy: invite
    - key: employee
      label: Employee
      assignedBy: signup
  limits:
  - action: agent:synthesiser
    per: user
    max: 5
    window: day
  agents:
  - key: interviewer
    role: main
    description: Interviews one employee confidentially, in the language they choose, and saves a private record plus an anonymous
      finding.
    memory: user
    context:
    - key: email
      from: user.email
    goalTemplate: 'Employee email: {email}

      Conversation so far:

      {history}

      New message from the employee: {message}

      Default language if the employee has not chosen one: {lang}. Today is {date}.'
    appTools:
    - name: find_me
      description: Look up the employee's own staff record (department, job role) by their email. Only ever search for the
        signed-in employee's email.
      action: search
      collection: staff
      scope: all
    - name: save_interview
      description: Save the employee's private interview summary (visible only to them)
      action: write
      collection: interviews
      scope: user
    - name: save_finding
      description: Save an ANONYMOUS finding (department only, no name, email or identifying detail) for the aggregate study
      action: append
      collection: findings
      scope: all
    - name: mark_done
      description: Mark the employee's staff record as done (status done)
      action: write
      collection: staff
      scope: all
    profile:
      inline:
        display_name: Pathfinder interviewer
        crews:
        - id: interviewer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are Pathfinder, a warm, curious and neutral AI interviewer. You run a confidential interview
            of about 15 minutes with one employee about their work, to help their company plan its adoption of AI.


            Start: greet the person, say that individual answers are never shown to managers (only aggregated results for
            groups of at least five people), and ask which language they want to use (any language; reply in the language
            they write or speak in, and keep to it). Offer that they can talk using the microphone or type. Call find_me with
            their email to learn their department and job role; if not found, ask.


            Cover, one question at a time with short follow-ups: 1) main tasks and a typical week; 2) tools and systems used;
            3) hours per week spent on each repetitive task; 4) pain points and frustrations; 5) what they already do with
            AI, and any worries; 6) ideas of what could be automated or improved. Never judge, never evaluate the person''s
            performance, never ask for names of colleagues, customers or confidential figures. If they share something personal
            or identifying, do not record it in the anonymous finding.


            At the end, summarise back in 5-8 bullets and ask them to confirm or correct. Then: call save_interview (fields:
            department, job_role, language, mode, summary, tasks, tools, hours_repetitive_per_week, pain_points, ideas, readiness_score
            1-5, date). Then call save_finding once per distinct process mentioned with ONLY: department, process, tools,
            hours_per_week, pain_point, idea, automation_potential (low|medium|high), readiness_score, date; never name, email,
            role title if unique, or quotes that could identify. Then call mark_done with status done. Thank them. Never invent
            facts the employee did not say.'
  - key: synthesiser
    role: analyst
    description: Synthesises the anonymous findings into process map, opportunities, risks and department readiness, then
      asks the roadmapper for a draft.
    delegates:
    - roadmapper
    goalTemplate: 'Synthesise the study now. Today is {date}. Employees in the study: {employees}.

      {?focus}Extra focus from the project lead: {focus}{/focus}{!focus}Follow the study goals.{/focus}

      Write the report in the language with ISO code {lang}.'
    appTools:
    - name: read_findings
      description: Read all anonymous findings
      action: read
      collection: findings
      scope: all
    - name: read_goals
      description: Read the study goals set by the admin
      action: read
      collection: study_goals
      scope: all
    - name: read_staff
      description: Read staff records ONLY to count invited and completed people per department; never output names or emails
      action: read
      collection: staff
      scope: all
    - name: save_opportunity
      description: Save an automation opportunity
      action: write
      collection: opportunities
      scope: all
    - name: save_dept_score
      description: Save the readiness and participation of one department
      action: write
      collection: dept_scores
      scope: all
    output: markdown
    profile:
      inline:
        display_name: Pathfinder synthesiser
        crews:
        - id: synthesiser
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 3.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are an organisational analyst. Read the study goals (read_goals) and all anonymous findings
            (read_findings), and count invited and completed staff per department with read_staff (counts only).


            HARD CONFIDENTIALITY RULE: only report or save results for a department or group with at least 5 completed interviews.
            Merge smaller departments into ''Other (combined)'' if together they reach 5; otherwise leave them out and say
            so. Never quote or paraphrase anything that could identify a person.


            For each department with enough interviews call save_dept_score (department, participants, invited, completion_pct,
            readiness 0-100, top_theme, risks). For each automation opportunity (same process across several people) call
            save_opportunity (title, department, process, hours_saved_week estimated across the group, effort low|medium|high,
            confidence low|medium|high, mentions count, risk). Hours saved are estimates from the reported hours: show the
            method and never invent figures.


            Then write the report starting with ''# AI opportunity synthesis — <date>'', with ## sections: Participation,
            Process map (a table of processes per department with tools and hours), Automation opportunities (table ranked
            by hours saved), Risks and concerns, Readiness by department (include a chart), Caveats. Add a chart block for
            readiness:

            ```chart

            {"type":"bar","title":"Readiness by department","labels":["A"],"series":[{"name":"Readiness","values":[1]}]}

            ```

            with real values only. Finally call ask_roadmapper to draft the prioritised roadmap.'
  - key: roadmapper
    role: helper
    description: Drafts the prioritised roadmap from the saved opportunities and scores.
    goalTemplate: Draft the roadmap now. Today is {date}. Write in the language with ISO code {lang}.
    appTools:
    - name: read_opportunities
      description: Read the saved opportunities
      action: read
      collection: opportunities
      scope: all
    - name: read_dept_scores
      description: Read department readiness scores
      action: read
      collection: dept_scores
      scope: all
    - name: read_study_goals
      description: Read the study goals
      action: read
      collection: study_goals
      scope: all
    - name: save_roadmap
      description: Save one roadmap item as a draft
      action: write
      collection: roadmap
      scope: all
    output: markdown
    profile:
      inline:
        display_name: Pathfinder roadmapper
        crews:
        - id: roadmapper
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 20
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You draft a prioritised AI-adoption roadmap. Read opportunities, department scores and study goals.
            Rank by hours saved, confidence and readiness, and lower the rank of high-effort or high-risk items. Group into
            phases: now (0-3 months), next (3-6), later (6-12). For each item call save_roadmap with: title, phase, department,
            rationale, hours_saved_week, effort, owner_suggestion (a role, not a person), risks, status ''draft'', priority
            (number, 1 is first). Never invent figures: use only the saved ones. Finish with a short markdown summary starting
            with ''# Draft roadmap''.'
  inputForm:
    title: Run the synthesis
    fields:
    - name: employees
      type: number
      required: true
      label: Employees interviewed
      help: 'Used for the price: £15 per employee, minimum £3,000 per study'
    - name: focus
      type: textarea
      maxLength: 600
      label: Extra focus (optional)
  data:
    collections:
    - name: staff
      ownedBy: org
      description: 'Staff list uploaded by the admin on the data page (CSV: name, email, department, job_role, invited_on)'
      retentionDays: 365
      fields:
      - name: name
        type: text
      - name: email
        type: email
        required: true
      - name: department
        type: text
        required: true
      - name: job_role
        type: text
      - name: invited_on
        type: date
      - name: status
        type: select
        default: invited
        options:
        - invited
        - done
      access:
      - role: project_lead
        can:
        - read
    - name: study_goals
      ownedBy: org
      description: Goals of the study, set by the admin
      fields:
      - name: goal
        type: textarea
        required: true
      - name: priority
        type: number
      access:
      - role: project_lead
        can:
        - read
        - write
    - name: interviews
      ownedBy: user
      description: Each employee's own private interview summary. No role other than the employee reads it.
      retentionDays: 365
      fields:
      - name: department
        type: text
      - name: job_role
        type: text
      - name: language
        type: text
      - name: mode
        type: select
        options:
        - voice
        - text
      - name: summary
        type: textarea
      - name: tasks
        type: textarea
      - name: tools
        type: text
      - name: hours_repetitive_per_week
        type: number
      - name: pain_points
        type: textarea
      - name: ideas
        type: textarea
      - name: readiness_score
        type: number
      - name: date
        type: date
    - name: findings
      ownedBy: org
      description: Anonymous findings (no identity), used only for aggregate analysis
      retentionDays: 730
      fields:
      - name: department
        type: text
      - name: process
        type: text
      - name: tools
        type: text
      - name: hours_per_week
        type: number
      - name: pain_point
        type: text
      - name: idea
        type: text
      - name: automation_potential
        type: select
        options:
        - low
        - medium
        - high
      - name: readiness_score
        type: number
      - name: date
        type: date
    - name: opportunities
      ownedBy: org
      description: Automation opportunities (aggregated, groups of at least 5)
      fields:
      - name: title
        type: text
      - name: department
        type: text
      - name: process
        type: text
      - name: hours_saved_week
        type: number
      - name: effort
        type: select
        options:
        - low
        - medium
        - high
      - name: confidence
        type: select
        options:
        - low
        - medium
        - high
      - name: mentions
        type: number
      - name: risk
        type: text
      access:
      - role: project_lead
        can:
        - read
        - write
      - role: leadership
        can:
        - read
    - name: dept_scores
      ownedBy: org
      description: Participation and readiness per department (only departments with at least 5 interviews)
      fields:
      - name: department
        type: text
      - name: participants
        type: number
      - name: invited
        type: number
      - name: completion_pct
        type: number
      - name: readiness
        type: number
      - name: top_theme
        type: text
      - name: risks
        type: text
      access:
      - role: project_lead
        can:
        - read
        - write
      - role: leadership
        can:
        - read
    - name: roadmap
      ownedBy: org
      description: 'Roadmap items: drafted by the agent, edited by the project lead, published to leadership'
      fields:
      - name: title
        type: text
        required: true
      - name: phase
        type: select
        options:
        - now
        - next
        - later
      - name: department
        type: text
      - name: rationale
        type: textarea
      - name: hours_saved_week
        type: number
      - name: effort
        type: select
        options:
        - low
        - medium
        - high
      - name: owner_suggestion
        type: text
      - name: risks
        type: textarea
      - name: priority
        type: number
      - name: status
        type: select
        default: draft
        options:
        - draft
        - published
      access:
      - role: project_lead
        can:
        - read
        - write
      - role: leadership
        where:
          status: published
        can:
        - read
  triggers:
  - key: invite
    description: Invitation email to each person on the staff list
    'on':
      collection: staff
      op: insert
    notify:
      to: record.email
      subject: You are invited to a confidential interview about your work
      body: 'Hello {record.name}, your company is planning how to use AI at work and would like to hear from you. The interview
        takes about 15 minutes, by voice or text, in any language you choose. Your individual answers are never shown to managers:
        only aggregated results for groups of at least five people. Sign in with this email address to start.'
      link: interview
  - key: reminder_1
    'on':
      date:
        collection: staff
        field: invited_on
        offsetDays: 3
        hour: 8
    notify:
      to: record.email
      subject: 'Reminder: your confidential interview'
      body: Hello {record.name}, you have not yet completed your interview. It takes about 15 minutes and your answers stay
        confidential. Sign in to continue.
      link: interview
  - key: reminder_2
    'on':
      date:
        collection: staff
        field: invited_on
        offsetDays: 7
        hour: 8
    notify:
      to: record.email
      subject: 'Last reminder: your confidential interview'
      body: Hello {record.name}, the study closes soon and we would value your view. Your answers stay confidential. Sign
        in to take the interview.
      link: interview
  - key: roadmap_published
    'on':
      collection: roadmap
      op: update
      where:
        status: published
    notify:
      to:
      - role:leadership
      subject: The AI-adoption roadmap is ready for review
      body: The project lead has published the roadmap item {record.title}. Open the dashboard to see the full roadmap.
      link: roadmap_view
  views:
  - key: home
    type: page
    title: Pathfinder
    nav: false
    sections:
    - type: hero
      eyebrow: Confidential AI interviews
      title: Hear every employee. Build the **AI roadmap** your company needs.
      text: Pathfinder interviews your people about their real work, by voice or text in the language they choose, and turns
        the answers into a prioritised AI-adoption roadmap.
      actions:
      - label: Sign in
        href: /login
        style: primary
      note: £15 per employee interviewed, minimum £3,000 per study.
    - type: steps
      id: how
      title: How it works
      items:
      - title: Upload your staff
        text: The admin loads the staff list with department and role and sets the goals of the study.
        badge: '1'
      - title: Employees are interviewed
        text: Each person gets an email invitation and talks with an AI interviewer about tasks, tools, time, pain points
          and ideas. Reminders go to those who have not finished.
        badge: '2'
      - title: Analysis and roadmap
        text: An agent maps processes, opportunities with estimated hours saved, risks and readiness by department, then drafts
          a roadmap.
        badge: '3'
      - title: Review and share
        text: Your project lead edits the roadmap before it goes to the leadership team.
        badge: '4'
    - type: cards
      id: privacy
      title: Confidential by design
      items:
      - title: No individual answers for managers
        text: Interview answers belong to the employee. Managers only see aggregated results for groups of at least five people.
        badge: 🔒
      - title: Your language
        text: Employees choose the language of their interview, by voice (microphone) or by typing.
        badge: 🌍
      - title: Clear numbers
        text: Hours saved are estimates built from what people reported, with the method shown.
        badge: 📊
    - type: note
      content: Pathfinder supports decision making; estimates are not guarantees.
  - key: interview
    type: chat
    title: My interview
    source: agent:interviewer
    examples:
    - I'd like to be interviewed in Italian
    - Let's start the interview
    placeholder: Type here, or use the microphone to speak
    roles:
    - employee
    - admin
  - key: new_synthesis
    type: new_run
    title: Run synthesis
    roles:
    - project_lead
    - admin
  - key: studies
    type: history
    title: Syntheses
    source: run
    roles:
    - project_lead
    - admin
  - key: synthesis
    type: report
    title: Synthesis report
    source: run
    printable: true
    nav: false
    roles:
    - project_lead
    - admin
  - key: participation
    type: page
    title: Participation
    roles:
    - project_lead
    - admin
    sections:
    - type: data
      title: Invited, by department
      source: collection:staff
      display: bar
      fields:
      - key: department
        label: Department
      - key: count
        label: Invited
      groupBy:
        field: department
        aggs: []
    - type: data
      title: Completed, by department
      source: collection:staff
      display: bar
      fields:
      - key: department
        label: Department
      - key: count
        label: Completed
      filters:
      - field: status
        op: '='
        value: done
      groupBy:
        field: department
        aggs: []
  - key: dashboard
    type: page
    title: Dashboard
    roles:
    - project_lead
    - leadership
    - admin
    sections:
    - type: data
      title: Participation by department
      source: collection:dept_scores
      display: table
      fields:
      - key: department
        label: Department
      - key: participants
        label: Interviewed
        format: number
      - key: invited
        label: Invited
        format: number
      - key: completion_pct
        label: Completion
        format: percent
      empty: No results yet.
    - type: data
      title: Readiness by department
      source: collection:dept_scores
      display: chart
      chart: bar
      fields:
      - key: department
        label: Department
      - key: readiness
        label: Readiness
    - type: data
      title: Top opportunities
      source: collection:opportunities
      display: table
      fields:
      - key: title
        label: Opportunity
      - key: department
        label: Department
      - key: hours_saved_week
        label: Hours saved / week
        format: number
      - key: effort
        label: Effort
        format: badge
      - key: confidence
        label: Confidence
        format: badge
      sort:
        field: hours_saved_week
        dir: desc
      limit: 10
  - key: roadmap_view
    type: cards
    title: Roadmap
    source: collection:roadmap
    roles:
    - project_lead
    - leadership
    - admin
    data:
      display: cards
      fields:
      - key: title
        label: Item
      - key: phase
        label: Phase
        format: badge
      - key: department
        label: Department
      - key: hours_saved_week
        label: Hours saved / week
        format: number
      - key: status
        label: Status
        format: badge
      sort:
        field: priority
        dir: asc
      limit: 100
    export: true
  - key: roadmap_edit
    type: form
    title: Edit roadmap item
    collection: roadmap
    edit: true
    nav: false
    roles:
    - project_lead
    - admin
    submit:
      label: Save
      message: Roadmap item saved.
      redirect: roadmap_view
  - key: account
    type: account
    title: Study credits
    roles:
    - admin
  billing:
    modes:
    - credits
    currency: gbp
    metering:
      creditEur: 0.01
      markupPct: 0
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:synthesiser:
        perUnit:
          field: employees
          credits: 1500
          min: 300000
    packs:
    - key: study
      credits: 300000
      price: 3000
      label: Study (up to 200 employees)
    - key: extra_employee
      credits: 1500
      price: 15
      label: One extra employee
  notifications:
    emailOnRunDone: true
  mobile:
    appId: com.pathfinder.interviews
    appName: Pathfinder
    capabilities:
    - name: microphone
      reason:
        en: To answer the interview by voice
  extensions:
  - key: voice_replies
    description: Voice input is available through the microphone in the chat view; a spoken (text-to-speech) interviewer and
      dedicated 70+ language voice models are not available yet, so replies are in text.
  - key: small_group_rule
    description: The minimum group of five is enforced by the synthesis agent's instructions and by the department roll-up;
      there is no automatic suppression on raw anonymous findings, which only admins can open. Individual interviews stay
      private to the employee.
  - key: multi_company
    description: One app instance serves one company. Several companies on one instance, each with a separate staff list and
      study, are not supported yet.
