apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: heatwise
  displayName: Heatwise
  tagline: Heat pump quotes, surveys and installs, with one place to follow the whole project.
  description: Heatwise helps homeowners get a heat pump quote and a Boiler Upgrade Scheme pre-check, book a survey and follow
    their project. It also gives installers a portal for jobs, schedules, materials and commissioning.
  langs:
  - en
  defaultLang: en
  timezone: Europe/London
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12433a'
      accent: '#e8742a'
      background: '#f7f5f0'
      foreground: '#17211f'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Heat
      color: primary
    - text: wise
      color: accent
  header:
    links:
    - label: How it works
      href: '#how-it-works'
    - label: For installers
      href: '#installers'
    cta:
      label: Get a quote
      href: /v/request_quote
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: homeowner
      label: Homeowner
      assignedBy: signup
    - key: surveyor
      label: Surveyor
      assignedBy: invite
    - key: installer
      label: Installer
      assignedBy: invite
    - key: ops
      label: Operations manager
      assignedBy: invite
  limits:
  - action: agent:quoter
    per: user
    max: 3
    window: day
    roles:
    - homeowner
  agents:
  - key: quoter
    role: main
    description: Drafts the heat pump quote from the project and photos, pre-checks BUS eligibility, then asks a surveyor
      to confirm.
    awaits:
    - bus_check
    appTools:
    - name: price_book
      description: 'Read the price book: unit costs per item and Heatwise fee percentage'
      action: read
      collection: price_book
      scope: all
    - name: read_upload
      description: Read a photo or file the user uploaded (OCR included)
      action: read_file
    output: markdown
    writesTo:
      collection: quotes
      parse: whole
    limits:
      maxTurns: 15
      maxBudgetUsd: 0.8
    profile:
      inline:
        display_name: Heatwise quoter
        crews:
        - id: quoter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You draft indicative heat pump installation quotes for UK homeowners at Heatwise. You get the property
            details (address, type, bedrooms, current heating, insulation, EPC rating) and photo file ids. Open each photo
            with the tool read_upload and note what is relevant: existing boiler, cylinder space, radiators, outside space
            for the unit, meter position. Read prices ONLY from the tool price_book (unit costs and the Heatwise fee percentage);
            if an item is missing, say it is to be confirmed at survey. Never invent prices, grant amounts or technical figures.


            Write the report in English, starting with a level-1 title "# Heat pump quote — <address>". Then ## headings:
            Your property; Recommended system (type and an indicative size range, clearly marked as an estimate until the
            survey); Cost breakdown (a table of line items from the price book, then a separate Heatwise fee line, a total,
            and the Boiler Upgrade Scheme grant deducted only as ''subject to eligibility''); Boiler Upgrade Scheme pre-check
            (England and Wales; list the criteria you could check from the data, e.g. property type, current heating, EPC
            on record, and what is unknown. State the grant amount only if you are certain of the current published figure,
            otherwise say ''to be confirmed''); What happens next (survey, MCS-certified design, installation, commissioning).
            Add a short caveat that the quote is indicative and the eligibility is confirmed by a surveyor and Ofgem. Keep
            it under 500 words. Heatwise runs the BUS application and MCS certification; do not tell the homeowner to do those
            themselves.


            When the report is written, call request_bus_check once with the address and EPC so a surveyor confirms eligibility.'
  - key: planner
    role: helper
    description: Once a project is approved, prepares the materials list and an installation plan for the assigned installer.
    appTools:
    - name: price_book
      description: 'Read the price book: unit costs per item and Heatwise fee percentage'
      action: read
      collection: price_book
      scope: all
    - name: read_quotes
      description: Read the homeowner's quote
      action: read
      collection: quotes
      scope: user
    output: markdown+json
    writesTo:
      collection: materials_lists
      parse: json_last
    limits:
      maxTurns: 10
      maxBudgetUsd: 0.5
    profile:
      inline:
        display_name: Heatwise install planner
        crews:
        - id: planner
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You prepare the materials list and job plan for a heat pump installation from the approved quote
            (read it with read_quotes) and the price book. Write a short Markdown plan: ## Materials (item, quantity, notes),
            ## Pre-install checks, ## Suggested sequence and duration, ## Commissioning checklist reminders. Do not invent
            specifications that the quote does not support; mark unknowns as ''confirm on site''. End with ONE final fenced
            JSON object: {"project_address":"…","installer_email":"…","items":"one item per line: quantity x item","notes":"…","status":"draft"}
            using the address and installer email given in the task.'
  - key: performance
    role: helper
    description: Reads the quarterly meter photo and writes a simple performance summary.
    appTools:
    - name: read_upload
      description: Read a photo or file the user uploaded (OCR included)
      action: read_file
    - name: past_readings
      description: The homeowner's earlier meter readings
      action: read
      collection: meter_readings
      scope: user
    output: markdown
    writesTo:
      collection: performance_summaries
      parse: whole
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.4
    profile:
      inline:
        display_name: Heatwise performance summary
        crews:
        - id: performance
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You give a homeowner a simple, honest performance summary of their heat pump. Open the meter photo
            with read_upload and read the number; if the homeowner typed values, prefer those and mention any mismatch. Compare
            with their earlier readings (past_readings) to get the energy used this quarter. If both electricity and heat
            meter values exist, give the ratio heat out / electricity in; otherwise say a ratio cannot be calculated and give
            only the electricity used. Start with "# Heat pump summary — <quarter and year>". Sections: ## This quarter, ##
            Compared with last time, ## What to do. Under 200 words in plain language. Never invent figures or guarantee savings;
            say plainly when a photo is unreadable and ask for a clearer one.'
  - key: bus_analyst
    role: scheduled
    description: 'Monthly: collects the latest Ofgem Boiler Upgrade Scheme statistics for the market dashboard.'
    writesTo:
      collection: bus_stats
      parse: json_last
      keyBy: period
    output: markdown+json
    limits:
      maxTurns: 30
      maxBudgetUsd: 1
    profile:
      inline:
        display_name: Heatwise BUS statistics collector
        crews:
        - id: bus_analyst
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You collect the latest published Ofgem Boiler Upgrade Scheme (BUS) statistics from ofgem.gov.uk
            (open government licence) using the WebRobot tools to read the page and the published data. Extract the most recent
            monthly headline figures. Start with "# BUS statistics — <month year>" and a 3-line summary with the source link.
            Then end with ONE final fenced JSON object: {"period":"YYYY-MM","applications_received":number|null,"vouchers_issued":number|null,"installations_completed":number|null,"grant_value_gbp":number|null,"ashp_share_pct":number|null,"source_url":"…"}.
            Use null for anything you cannot find. Never estimate or invent figures.'
  data:
    collections:
    - name: projects
      description: A homeowner's heat pump project, from quote request to commissioning
      ownedBy: user
      fields:
      - name: address
        type: text
        required: true
        label: Property address
      - name: postcode
        type: text
        required: true
        label: Postcode
      - name: homeowner_phone
        type: text
        label: Phone
      - name: location
        type: location
        label: Property location
      - name: property_type
        type: select
        required: true
        label: Property type
        options:
        - value: detached
          label: Detached
        - value: semi
          label: Semi-detached
        - value: terraced
          label: Terraced
        - value: flat
          label: Flat
        - value: bungalow
          label: Bungalow
      - name: bedrooms
        type: number
        required: true
        label: Bedrooms
      - name: current_heating
        type: select
        required: true
        label: Current heating
        options:
        - value: gas
          label: Gas boiler
        - value: oil
          label: Oil boiler
        - value: lpg
          label: LPG
        - value: electric
          label: Electric
        - value: solid
          label: Solid fuel
        - value: other
          label: Other
      - name: insulation
        type: select
        required: true
        label: Insulation
        options:
        - value: none
          label: None or unknown
        - value: partial
          label: Partial (loft or cavity)
        - value: good
          label: Good
        - value: excellent
          label: Excellent
      - name: epc
        type: select
        required: true
        label: EPC rating
        options:
        - A
        - B
        - C
        - D
        - E
        - F
        - G
        - Unknown
      - name: photos
        type: file
        label: Photos (boiler, radiators, outside space, meter)
        accept:
        - jpg
        - jpeg
        - png
        - webp
        maxMb: 10
        multiple: true
        capture: true
      - name: status
        type: select
        label: Stage
        default: requested
        options:
        - value: requested
          label: Quote requested
        - value: quoted
          label: Quoted
        - value: survey_booked
          label: Survey booked
        - value: survey_complete
          label: Survey complete
        - value: approved
          label: Approved
        - value: installed
          label: Installed
        - value: commissioned
          label: Commissioned
      - name: bus_eligibility
        type: select
        label: BUS eligibility (surveyor)
        options:
        - value: pending
          label: Pending
        - value: eligible
          label: Eligible
        - value: not_eligible
          label: Not eligible
      - name: surveyor_email
        type: email
        label: Surveyor
      - name: installer_email
        type: email
        label: Installer
      - name: survey_date
        type: date
        label: Survey date
      - name: install_date
        type: date
        label: Installation date
      access:
      - role: surveyor
        where:
          surveyor_email: '{user.email}'
        can:
        - read
        - write
      - role: installer
        where:
          installer_email: '{user.email}'
        can:
        - read
      - role: ops
        can:
        - read
        - write
    - name: quotes
      description: Quotes drafted by the agent
      ownedBy: user
      fields:
      - name: title
        type: text
        label: Quote
      - name: content
        type: textarea
        label: Quote text
      access:
      - role: ops
      - role: surveyor
    - name: price_book
      description: Unit costs and the Heatwise fee, kept by the admins
      ownedBy: shared
      fields:
      - name: item
        type: text
        required: true
        label: Item
      - name: category
        type: text
        label: Category
      - name: unit_cost_gbp
        type: number
        label: Unit cost (GBP)
      - name: fee_pct
        type: number
        label: Heatwise fee (%)
    - name: surveyors
      description: Surveyors who can be booked
      ownedBy: shared
      fields:
      - name: name
        type: text
        required: true
        label: Name
      - name: email
        type: email
        label: Email
      - name: area
        type: text
        label: Area covered
    - name: survey_bookings
      description: Survey slots booked by homeowners
      ownedBy: user
      fields:
      - name: notes
        type: textarea
        label: Access notes
      access:
      - role: ops
        can:
        - read
        - write
      - role: surveyor
    - name: materials_lists
      description: Materials lists and job plans for installers
      ownedBy: user
      fields:
      - name: project_address
        type: text
        label: Project
      - name: installer_email
        type: email
        label: Installer
      - name: items
        type: textarea
        label: Materials
      - name: notes
        type: textarea
        label: Notes
      - name: status
        type: text
        label: Status
      access:
      - role: installer
        where:
          installer_email: '{user.email}'
        can:
        - read
        - write
      - role: ops
        can:
        - read
        - write
    - name: commissioning
      description: Commissioning forms filled by installers
      ownedBy: user
      fields:
      - name: project_address
        type: text
        required: true
        label: Project address
      - name: homeowner_email
        type: email
        required: true
        label: Homeowner email
      - name: commissioned_on
        type: date
        required: true
        label: Commissioned on
      - name: mcs_reference
        type: text
        label: MCS installation reference
      - name: unit_serial
        type: barcode
        label: Heat pump serial number
      - name: flow_temperature
        type: number
        label: Design flow temperature (°C)
      - name: checks_done
        type: textarea
        required: true
        label: Checks completed
      - name: handover_notes
        type: textarea
        label: Handover notes
      - name: next_service_date
        type: date
        required: true
        label: Next annual service due
      - name: photos
        type: file
        label: Photos
        accept:
        - jpg
        - jpeg
        - png
        - webp
        maxMb: 10
        multiple: true
        capture: true
      access:
      - role: ops
        can:
        - read
        - write
    - name: meter_readings
      description: Quarterly meter readings sent by homeowners
      ownedBy: user
      fields:
      - name: reading_date
        type: date
        required: true
        label: Reading date
      - name: meter_photo
        type: file
        required: true
        label: Photo of the meter
        accept:
        - jpg
        - jpeg
        - png
        - webp
        maxMb: 10
        capture: true
      - name: elec_kwh
        type: number
        label: Electricity meter (kWh), if you can read it
      - name: heat_kwh
        type: number
        label: Heat meter (kWh), if you have one
      retentionDays: 1825
    - name: performance_summaries
      description: Performance summaries written by the agent
      ownedBy: user
      fields:
      - name: title
        type: text
        label: Summary
      - name: content
        type: textarea
        label: Text
    - name: bus_stats
      description: Ofgem Boiler Upgrade Scheme monthly statistics, collected by the scheduled agent
      ownedBy: app
      fields:
      - name: period
        type: text
        label: Month
      - name: applications_received
        type: number
        label: Applications received
      - name: vouchers_issued
        type: number
        label: Vouchers issued
      - name: installations_completed
        type: number
        label: Installations completed
      - name: grant_value_gbp
        type: number
        label: Grant value (GBP)
      - name: ashp_share_pct
        type: number
        label: Air source share (%)
      - name: source_url
        type: url
        label: Source
  approvals:
  - key: bus_check
    title: Confirm Boiler Upgrade Scheme eligibility
    description: A surveyor confirms or rejects the agent's eligibility pre-check.
    role: surveyor
    decidedBy: role
    fields:
    - address
    - epc
    timeoutMinutes: 10080
    onTimeout: reject
  triggers:
  - key: quote_on_request
    'on':
      collection: projects
      op: insert
    start:
      agent: quoter
    goal: 'Draft a quote for the project at {record.address}, {record.postcode}. Property type: {record.property_type}. Bedrooms:
      {record.bedrooms}. Current heating: {record.current_heating}. Insulation: {record.insulation}. EPC rating: {record.epc}.
      Photo file ids: {record.photos}. Today is {date}.'
  - key: plan_on_approval
    'on':
      collection: projects
      op: update
      where:
        status: approved
    start:
      agent: planner
    goal: 'Prepare the materials list and job plan for the project at {record.address}. Installer email: {record.installer_email}.
      Installation date: {record.install_date}. Today is {date}.'
  - key: summary_on_reading
    'on':
      collection: meter_readings
      op: insert
    start:
      agent: performance
    goal: 'A new quarterly meter reading was sent. Date: {record.reading_date}. Meter photo file id: {record.meter_photo}.
      Typed electricity kWh: {record.elec_kwh}. Typed heat kWh: {record.heat_kwh}. Write the performance summary.'
  - key: n_quote_ready
    'on':
      collection: quotes
      op: insert
    notify:
      to: owner
      subject: Your Heatwise quote is ready
      body: Your heat pump quote is ready. Open it to see the cost breakdown and your Boiler Upgrade Scheme pre-check. A surveyor
        will confirm eligibility, and you can book your survey when you are ready.
      link: my_quotes
  - key: n_bus_decided
    'on':
      approval: bus_check
      decision: any
    notify:
      to: owner
      subject: 'Boiler Upgrade Scheme check: a surveyor has decided'
      body: A surveyor has reviewed your Boiler Upgrade Scheme eligibility. Open your project to see the result and the next
        step.
      link: my_project
  - key: n_deposit
    'on':
      payment: survey_deposit
    notify:
      to: owner
      subject: 'Deposit received: book your survey'
      body: Thank you, we received your survey deposit. You can now choose a survey slot.
      link: book_survey
  - key: n_survey_booked
    'on':
      collection: survey_bookings
      op: insert
    notify:
      to:
      - owner
      - admins
      subject: Survey booked
      body: Your heat pump survey is booked for {record.date}. A surveyor will visit the property. We will remind you the
        day before.
      link: my_project
  - key: r_survey_day
    'on':
      date:
        collection: survey_bookings
        field: start
        offsetDays: -1
        hour: 8
    notify:
      to: owner
      subject: Your survey is tomorrow
      body: A reminder that your heat pump survey is tomorrow. Please make sure the surveyor can reach the boiler, hot water
        cylinder area, loft and electrical meter.
      link: my_project
  - key: n_survey_complete
    'on':
      collection: projects
      op: update
      where:
        status: survey_complete
    notify:
      to: owner
      subject: Survey complete
      body: Your survey is complete. We are finalising your design and quote. We will tell you when your project is approved
        and an installation date is set.
      link: my_project
  - key: n_approved
    'on':
      collection: projects
      op: update
      where:
        status: approved
    notify:
      to: owner
      subject: Your project is approved
      body: Your heat pump project is approved. Your installer and installation date are shown in your project page.
      link: my_project
  - key: n_installed
    'on':
      collection: projects
      op: update
      where:
        status: installed
    notify:
      to: owner
      subject: Installation complete
      body: Your heat pump is installed. Commissioning and handover are next.
      link: my_project
  - key: n_commissioned
    'on':
      collection: commissioning
      op: insert
    notify:
      to:
      - record.homeowner_email
      - role:ops
      subject: Your heat pump is commissioned
      body: Your heat pump at {record.project_address} was commissioned on {record.commissioned_on}. Every three months we
        will ask you for a photo of your meter, and we will remind you of your annual service.
      link: meter_form
  - key: r_reading_q1
    'on':
      date:
        collection: commissioning
        field: commissioned_on
        offsetDays: 90
        hour: 9
    notify:
      to: record.homeowner_email
      subject: Time for your quarterly meter photo
      body: Please send a photo of your meter. We will give you a simple performance summary.
      link: meter_form
  - key: r_reading_q2
    'on':
      date:
        collection: commissioning
        field: commissioned_on
        offsetDays: 180
        hour: 9
    notify:
      to: record.homeowner_email
      subject: Time for your quarterly meter photo
      body: Please send a photo of your meter. We will give you a simple performance summary.
      link: meter_form
  - key: r_reading_q3
    'on':
      date:
        collection: commissioning
        field: commissioned_on
        offsetDays: 270
        hour: 9
    notify:
      to: record.homeowner_email
      subject: Time for your quarterly meter photo
      body: Please send a photo of your meter. We will give you a simple performance summary.
      link: meter_form
  - key: r_service
    'on':
      date:
        collection: commissioning
        field: next_service_date
        offsetDays: -14
        hour: 9
    notify:
      to:
      - record.homeowner_email
      - role:ops
      subject: Your annual heat pump service is due
      body: Your heat pump at {record.project_address} is due its annual service on {record.next_service_date}. Reply to this
        email or contact us to arrange it.
      link: my_project
  schedules:
  - agent: bus_analyst
    action: run
    cron: 0 6 5 * *
    owner: app
    goal: Collect the latest Ofgem Boiler Upgrade Scheme statistics. Today is {date}.
  views:
  - key: home
    type: page
    title: Heatwise
    nav: false
    sections:
    - type: hero
      band: true
      eyebrow: Heat pumps, without the guesswork
      title: A **heat pump quote** and grant check in minutes, then a team that installs it.
      text: Tell us about your home and upload a few photos. Our agent drafts your quote and pre-checks the Boiler Upgrade
        Scheme, and a surveyor confirms it. Then book your survey and follow every stage.
      actions:
      - label: Get my quote
        href: /v/request_quote
        style: primary
      - label: Sign in
        href: /login
        style: ghost
    - type: steps
      id: how-it-works
      title: How it works
      items:
      - title: Request a quote
        text: Address, property type, heating, insulation, EPC and some photos.
        badge: 📝
      - title: Quote and grant pre-check
        text: An indicative quote with our fee shown, and a Boiler Upgrade Scheme check a surveyor confirms.
        badge: 🔎
      - title: Book and pay the deposit
        text: Choose a survey slot once the deposit is paid.
        badge: 📅
      - title: Install and commission
        text: Our MCS-certified installers fit the system. We handle the certification and the grant application.
        badge: 🔧
      - title: Quarterly summary
        text: Send a photo of your meter every quarter and get a simple performance summary and a service reminder.
        badge: 📊
    - type: cards
      id: installers
      title: For installers
      intro: A portal for the jobs assigned to you.
      items:
      - title: Jobs and schedule
        text: See only your assigned jobs, with directions, call and calendar buttons.
        badge: 🗓️
      - title: Materials lists
        text: A materials list prepared for each approved job.
        badge: 📦
      - title: Commissioning forms
        text: Fill the commissioning form on site, with photos and the unit serial scanned.
        badge: ✅
    - type: note
      content: Quotes are indicative until the survey. Boiler Upgrade Scheme eligibility is confirmed by a surveyor and Ofgem.
        Installation, MCS certification and the grant application are handled by Heatwise.
  - key: request_quote
    type: form
    title: Request a quote
    collection: projects
    fields:
    - address
    - postcode
    - homeowner_phone
    - location
    - property_type
    - bedrooms
    - current_heating
    - insulation
    - epc
    - photos
    submit:
      label: Get my quote
      message: Thank you. We are drafting your quote and will email you when it is ready.
      redirect: my_project
    roles:
    - homeowner
    - admin
  - key: my_project
    type: cards
    title: My project
    source: collection:projects
    roles:
    - homeowner
    data:
      display: cards
      fields:
      - key: address
        label: Address
      - key: status
        label: Stage
        format: badge
      - key: bus_eligibility
        label: BUS eligibility
        format: badge
      - key: survey_date
        label: Survey
        format: date
      - key: install_date
        label: Installation
        format: date
      empty: No project yet. Request a quote to start.
  - key: my_quotes
    type: table
    title: My quotes
    source: collection:quotes
    roles:
    - homeowner
    data:
      display: list
      fields:
      - key: title
        label: Quote
      - key: content
        label: Details
      empty: Your quote will appear here.
  - key: book_survey
    type: booking
    title: Book my survey
    collection: survey_bookings
    resources: collection:surveyors
    fields:
    - notes
    slots:
      days:
      - 1
      - 2
      - 3
      - 4
      - 5
      from: 09:00
      to: '17:00'
      minutes: 120
      tz: Europe/London
      aheadDays: 28
      minNoticeHours: 48
      capacity: 1
    roles:
    - homeowner
  - key: meter_form
    type: form
    title: Send my meter reading
    collection: meter_readings
    submit:
      label: Send reading
      message: Thank you. Your performance summary will be ready shortly.
      redirect: performance
    roles:
    - homeowner
  - key: performance
    type: table
    title: My performance
    source: collection:performance_summaries
    roles:
    - homeowner
    data:
      display: list
      fields:
      - key: title
        label: Summary
      - key: content
        label: Details
      empty: Your first summary appears after your first quarterly reading.
  - key: surveys
    type: approvals
    title: Eligibility checks
    approvals:
    - bus_check
    roles:
    - surveyor
    - admin
  - key: installer_jobs
    type: table
    title: My jobs
    source: collection:projects
    roles:
    - installer
    preview:
      rows: 2
      unlessPlan: installer_pro
    data:
      display: table
      fields:
      - key: address
        label: Address
      - key: postcode
        label: Postcode
      - key: status
        label: Stage
        format: badge
      - key: install_date
        label: Installation
        format: date
      - key: property_type
        label: Property
      sort:
        field: install_date
        dir: asc
      actions:
      - type: directions
        label: Directions
        field: address
      - type: call
        label: Call
        field: homeowner_phone
      - type: calendar
        label: Add to calendar
        title: address
        start: install_date
        location: address
      empty: No jobs assigned to you yet.
  - key: materials
    type: table
    title: Materials lists
    source: collection:materials_lists
    roles:
    - installer
    - ops
    - admin
    data:
      display: table
      fields:
      - key: project_address
        label: Project
      - key: items
        label: Materials
      - key: notes
        label: Notes
      - key: status
        label: Status
        format: badge
  - key: commissioning_form
    type: form
    title: Commissioning form
    collection: commissioning
    submit:
      label: Submit commissioning
      message: Commissioning recorded. The homeowner has been notified.
    roles:
    - installer
  - key: ops_projects
    type: table
    title: All projects
    source: collection:projects
    roles:
    - ops
    - admin
    export: true
    data:
      display: table
      fields:
      - key: address
        label: Address
      - key: status
        label: Stage
        format: badge
      - key: bus_eligibility
        label: BUS
        format: badge
      - key: surveyor_email
        label: Surveyor
      - key: installer_email
        label: Installer
      - key: survey_date
        label: Survey
        format: date
      - key: install_date
        label: Installation
        format: date
      actions:
      - type: directions
        label: Directions
        field: address
      - type: call
        label: Call
        field: homeowner_phone
  - key: assign_project
    type: form
    title: Update a project
    collection: projects
    edit: true
    fields:
    - status
    - bus_eligibility
    - surveyor_email
    - installer_email
    - survey_date
    - install_date
    submit:
      label: Save
      message: Project updated.
      redirect: ops_projects
    roles:
    - ops
    - admin
    nav: false
  - key: commissioned_list
    type: table
    title: Commissioned systems
    source: collection:commissioning
    roles:
    - ops
    - admin
    export: true
    data:
      display: table
      fields:
      - key: project_address
        label: Project
      - key: commissioned_on
        label: Commissioned
        format: date
      - key: mcs_reference
        label: MCS ref
      - key: unit_serial
        label: Serial
      - key: next_service_date
        label: Next service
        format: date
      sort:
        field: next_service_date
        dir: asc
  - key: market
    type: page
    title: BUS market
    roles:
    - homeowner
    - installer
    - ops
    - surveyor
    - admin
    sections:
    - type: text
      title: 'Boiler Upgrade Scheme: market context'
      content: Monthly statistics published by Ofgem, collected once a month.
    - type: data
      source: collection:bus_stats
      display: kpi
      kpis:
      - label: Applications (latest month)
        agg: last
        field: applications_received
        format: number
      - label: Vouchers issued
        agg: last
        field: vouchers_issued
        format: number
      - label: Installations completed
        agg: last
        field: installations_completed
        format: number
      - label: Air source share
        agg: last
        field: ashp_share_pct
        format: percent
      sort:
        field: period
        dir: asc
    - type: data
      title: Applications and vouchers by month
      source: collection:bus_stats
      display: chart
      chart: line
      fields:
      - key: period
        label: Month
      - key: applications_received
        label: Applications
      - key: vouchers_issued
        label: Vouchers
      - key: installations_completed
        label: Installations
      sort:
        field: period
        dir: asc
      limit: 36
      empty: The first statistics arrive after the next monthly collection.
    - type: note
      content: 'Source: Ofgem Boiler Upgrade Scheme statistics, published under the Open Government Licence.'
  - key: account
    type: account
    title: Payments and plan
    roles:
    - homeowner
    - installer
  billing:
    modes:
    - credits
    - subscription
    currency: gbp
    packs:
    - key: survey_deposit
      price: 99
      credits: 0
      label: Survey deposit
      unlocks:
      - book_survey
    plans:
    - key: installer_pro
      price: 79
      interval: month
      label: Installer platform
      includes:
      - Full job list and schedule
      - Materials lists
      - Commissioning forms
      roles:
      - installer
  notifications:
    emailOnRunDone: true
  extensions:
  - key: regulated_operations
    description: Installations, MCS certification and Boiler Upgrade Scheme applications are physical and regulated work run
      by Heatwise outside the app. The app only records stages, dates and reference numbers (MCS reference on the commissioning
      form).
  - key: pricing_assumptions
    description: 'The survey deposit (GBP 99) and installer subscription (GBP 79 per month) are placeholders: set the real
      amounts and fill the price book (items and fee percentage) on the data page. Stripe must be connected in the studio.'
  - key: deposit_link
    description: The deposit pack unlocks the survey booking view; refunds and balance payments are handled in Stripe, not
      in the app.
  - key: sms_notifications
    description: Customer updates go by email only; SMS and WhatsApp are not available yet.
