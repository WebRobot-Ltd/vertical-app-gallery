  views:
  - key: home
    type: page
    title: Tendwright
    nav: false
    sections:
    - type: hero
      title: Win UK public-sector contracts with a **bid team that never sleeps**.
      text: Tendwright finds the tenders that fit your company, reads the documents, plans the bid and drafts every answer
        from your own past bids and case studies. Your writers edit, your reviewer approves, you submit.
      actions:
      - label: Get started
        href: /login
        style: primary
      - label: How it works
        href: '#how'
        style: ghost
    - type: steps
      id: how
      title: How it works
      items:
      - title: Tell us about your company
        text: Sectors, CPV codes, regions, contract size and certifications. Upload past bids, case studies, policies and
          CVs.
        badge: '1'
      - title: Get a daily digest
        text: Every morning we search Find a Tender and Contracts Finder and email the new tenders that fit, scored.
        badge: '2'
      - title: Open a tender
        text: We extract questions, word limits, weightings and deadlines, build the plan and a compliance checklist.
        badge: '3'
      - title: Draft, review, export
        text: Answers are drafted from your library with sources cited and missing evidence flagged. A reviewer approves each
          one.
        badge: '4'
    - type: cards
      id: pricing
      title: Pricing
      intro: Monthly plans with bids included. Need more? Buy extra bids as credits.
      items:
      - title: Starter
        text: 3 bids a month, daily digest, competitor watch.
      - title: Growth
        text: 10 bids a month, unlimited team members.
      - title: Scale
        text: 30 bids a month, priority support.
    - type: note
      content: 'Tendwright drafts bids from your own evidence and does not give legal advice. Always check drafts against
        the tender documents before you submit. Notice data: Find a Tender and Contracts Finder, Open Government Licence v3.0.'
  - key: onboarding
    type: form
    title: Company profile
    collection: company_profile
    edit: true
    submit:
      label: Save profile
      message: Profile saved. Now add your library and set up a tender watch.
      redirect: library
  - key: library_add
    type: form
    title: Add to library
    collection: library
    submit:
      label: Add
      message: Added to your library.
      redirect: library
  - key: library
    type: table
    title: Library
    source: collection:library
    data:
      display: table
      fields:
      - key: kind
        label: Type
        format: badge
      - key: title
        label: Title
      - key: outcome
        label: Outcome
  - key: watches
    type: instances
    title: Tender watch
    template: tender_watch
  - key: opportunities
    type: table
    title: Opportunities
    source: collection:opportunities
    export: true
    data:
      display: table
      fields:
      - key: fit_score
        label: Fit
        format: number
      - key: title
        label: Title
      - key: buyer
        label: Buyer
      - key: value
        label: Value
        format: money
      - key: deadline
        label: Deadline
        format: date
      - key: fit_reason
        label: Why
      - key: url
        label: Notice
        format: link
      sort:
        field: fit_score
        dir: desc
      limit: 100
      empty: No opportunities yet. Create a tender watch.
  - key: new_bid
    type: new_run
    title: Open a tender
  - key: bid_runs
    type: history
    title: Bid plans
    source: run
  - key: bid_plan
    type: report
    source: run
    printable: true
    nav: false
  - key: bids
    type: table
    title: Bids
    source: collection:bids
    export: true
    data:
      display: table
      fields:
      - key: title
        label: Bid
      - key: buyer
        label: Buyer
      - key: status
        label: Status
        format: badge
      - key: clarification_deadline
        label: Clarifications
        format: date
      - key: submission_deadline
        label: Submission
        format: date
      - key: value
        label: Value
        format: money
      sort:
        field: submission_deadline
        dir: asc
  - key: bid_edit
    type: form
    title: Update bid
    collection: bids
    edit: true
    nav: false
    fields:
    - title
    - status
    - clarification_deadline
    - submission_deadline
    - reviewer_email
    - members
    - win
    - outcome_value
    - plan
    submit:
      label: Save
      message: Bid updated.
      redirect: bids
  - key: answers
    type: table
    title: Answers
    source: collection:bid_questions
    data:
      display: table
      fields:
      - key: bid
        label: Bid
      - key: ref
        label: Ref
      - key: question
        label: Question
      - key: word_limit
        label: Limit
        format: number
      - key: weighting
        label: Weight
        format: number
      - key: status
        label: Status
        format: badge
      - key: gaps
        label: Missing evidence
      limit: 200
  - key: answer_edit
    type: form
    title: Edit or review answer
    collection: bid_questions
    edit: true
    nav: false
    fields:
    - draft
    - status
    - reviewer_comment
    submit:
      label: Save
      message: Answer saved.
      redirect: answers
  - key: checklist
    type: table
    title: Compliance
    source: collection:compliance
    data:
      display: table
      fields:
      - key: bid
        label: Bid
      - key: item
        label: Document
      - key: mandatory
        label: Mandatory
      - key: status
        label: Status
        format: badge
      limit: 200
  - key: check_edit
    type: form
    title: Update checklist item
    collection: compliance
    edit: true
    nav: false
    fields:
