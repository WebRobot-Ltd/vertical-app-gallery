    submit:
      label: Save
      message: Saved.
      redirect: checklist
  - key: dashboard
    type: page
    title: Dashboard
    sections:
    - type: data
      title: Pipeline
      source: collection:bids
      display: kpi
      filters:
      - field: status
        op: '!='
        value: won
      - field: status
        op: '!='
        value: lost
      - field: status
        op: '!='
        value: no_bid
      kpis:
      - label: Bids in pipeline
        agg: count
      - label: Pipeline value
        agg: sum
        field: value
        format: money
    - type: data
      title: Results
      source: collection:bids
      display: kpi
      filters:
      - field: win
        op: '>='
        value: 0
      kpis:
      - label: Bids decided
        agg: count
      - label: Win rate
        agg: avg
        field: win
        format: percent
      - label: Value won
        agg: sum
        field: outcome_value
        format: money
    - type: data
      title: Bids by status
      source: collection:bids
      display: chart
      chart: bar
      fields:
      - key: status
      - key: count
      groupBy:
        field: status
        aggs:
        - key: total
          agg: sum
          field: value
    - type: data
      title: Next deadlines
      source: collection:bids
      display: table
      fields:
      - key: title
        label: Bid
      - key: status
        label: Status
        format: badge
      - key: submission_deadline
        label: Submission
        format: date
      sort:
        field: submission_deadline
        dir: asc
      limit: 10
  - key: competitors
    type: instances
    title: Competitor watch
    template: competitor_watch
  - key: competitor_wins
    type: table
    title: Competitor wins
    source: collection:competitor_wins
    data:
      display: table
      fields:
      - key: competitor
        label: Competitor
      - key: award_date
        label: Awarded
        format: date
      - key: buyer
        label: Buyer
      - key: title
        label: Contract
      - key: value
        label: Value
        format: money
      - key: summary
        label: Summary
      - key: url
        label: Notice
        format: link
      sort:
        field: award_date
        dir: desc
      limit: 100
  - key: account
    type: account
    title: Plan and credits
    roles:
    - user
    - admin
  triggers:
  - key: clarification_reminder
    'on':
      date:
        collection: bids
        field: clarification_deadline
        offsetDays: -2
        hour: 8
      where:
        status: drafting
    notify:
      to:
      - owner
      - record.reviewer_email
      subject: 'Clarification deadline in 2 days: {record.title}'
      body: The clarification deadline for {record.title} ({record.buyer}) is {record.clarification_deadline}. Send any questions
        to the buyer before then.
      link: bids
  - key: submission_reminder_3d
    'on':
      date:
        collection: bids
        field: submission_deadline
        offsetDays: -3
        hour: 8
      where:
        status: drafting
    notify:
      to:
      - owner
      - record.reviewer_email
      subject: 'Submission in 3 days: {record.title}'
      body: '{record.title} is due on {record.submission_deadline} and is still in drafting. Check answers and the compliance
        checklist.'
      link: answers
  - key: submission_reminder_1d
    'on':
      date:
        collection: bids
        field: submission_deadline
        offsetDays: -1
        hour: 8
      where:
        status: review
    notify:
      to:
      - owner
      - record.reviewer_email
      subject: 'Submission tomorrow: {record.title}'
      body: '{record.title} is due on {record.submission_deadline}. Approve the remaining answers and submit.'
      link: answers
  - key: submission_reminder_1d_drafting
    'on':
      date:
        collection: bids
        field: submission_deadline
        offsetDays: -1
        hour: 8
      where:
        status: drafting
    notify:
      to:
      - owner
      - record.reviewer_email
      subject: 'Submission tomorrow: {record.title}'
      body: '{record.title} is due on {record.submission_deadline} and is still in drafting.'
      link: answers
  - key: review_requested
    'on':
      collection: bid_questions
      op: update
      where:
        status: in_review
    notify:
      to: record.reviewer_email
      subject: 'Answer ready for review: {record.ref}'
      body: An answer to question {record.ref} is ready for your review.
      link: answers
  - key: compile_approved
    'on':
      collection: bids
      op: update
      where:
        status: approved
    start:
      agent: compiler
    goal: 'Compile the bid with notice id {record.notice_id} (title: {record.title}) into one document.'
  notifications:
    emailOnRunDone: true
  billing:
    modes:
    - subscription
    - credits
    currency: gbp
    signupCredits: 100
    costs:
      agent:planner: 100
    packs:
    - key: extra_bid
      credits: 100
      price: 39
      label: 1 extra bid
    - key: extra_5
      credits: 500
      price: 175
      label: 5 extra bids
    plans:
    - key: starter
      price: 79
      interval: month
      label: Starter — 3 bids a month
      credits: 300
      creditsReset: monthly
      includes:
      - 3 bids a month
      - daily tender digest
      - competitor watch
    - key: growth
      price: 199
      interval: month
      label: Growth — 10 bids a month
      credits: 1000
      creditsReset: monthly
      includes:
      - 10 bids a month
      - unlimited team members
    - key: scale
      price: 449
      interval: month
      label: Scale — 30 bids a month
      credits: 3000
      creditsReset: monthly
      includes:
      - 30 bids a month
      - priority support
  extensions:
  - key: word_export
    description: Export to Word (.docx) is not available yet. The compiled bid is a printable report you can save as PDF or
      copy into Word.
  - key: reviewer_only_approval
    description: Approving an answer is a status change on the answer. The designated reviewer can set it, but the runtime
      cannot yet forbid writers from setting it too.
  - key: find_a_tender_documents
    description: Find a Tender documents may need a login to download. When the agent cannot fetch them, the user uploads
      the documents in the Open a tender form.
