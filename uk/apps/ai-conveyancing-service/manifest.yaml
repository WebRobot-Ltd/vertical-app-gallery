    - summary
    timeoutMinutes: 10080
  - key: spend_signoff
    title: Approve searches and Land Registry orders (paid)
    role: lawyer
    fields:
    - matter_ref
    - summary
    timeoutMinutes: 10080
  - key: report_signoff
    title: Approve report on title
    role: lawyer
    fields:
    - matter_ref
    - summary
    timeoutMinutes: 10080
  - key: completion_signoff
    title: Approve completion statement
    role: lawyer
    fields:
    - matter_ref
    - summary
    timeoutMinutes: 10080
  triggers:
  - key: onboarding_done
    'on':
      collection: matters
      op: any
      where:
        ready: true
    start:
      agent: conveyancer
    goal: 'Onboarding complete for matter {record.matter_ref}, client {record.client_name}. Event 1: prepare the matter as
      instructed.'
    asUser: true
  - key: enquiries_approved
    'on':
      approval: enquiries_signoff
      decision: approved
    start:
      agent: conveyancer
    goal: 'Event 2: approval enquiries_signoff approved. {event}'
    asUser: true
  - key: spend_approved
    'on':
      approval: spend_signoff
      decision: approved
    start:
      agent: conveyancer
    goal: 'Event 2: approval spend_signoff approved. {event}'
    asUser: true
  - key: report_approved
    'on':
      approval: report_signoff
      decision: approved
    start:
      agent: conveyancer
    goal: 'Event 2: approval report_signoff approved. {event}'
    asUser: true
  - key: completion_approved
    'on':
      approval: completion_signoff
      decision: approved
    start:
      agent: conveyancer
    goal: 'Event 2: approval completion_signoff approved. {event}'
    asUser: true
  - key: timeline_notify
    'on':
      collection: timeline
      op: insert
    notify:
      to: owner
      subject: 'Keyhand update: {record.title}'
      body: 'Hello {record.client_name},


        {record.title}

        {record.detail}


        You can follow every step on your timeline.'
      link: timeline
  - key: enquiry_to_review
    'on':
      collection: enquiries
      op: insert
    notify:
      to:
      - record.lawyer_email
      subject: 'Draft enquiries to review: {record.matter_ref}'
      body: A draft enquiry is waiting for your review on matter {record.matter_ref}.
      link: signoffs
  - key: exchanged_notify
    'on':
      collection: matters
      op: update
      where:
        stage: exchanged
    notify:
      to: owner
      subject: 'Contracts exchanged: {record.matter_ref}'
      body: 'Your lawyer has exchanged contracts on {record.property_address}. Completion date: {record.completion_date}.'
      link: timeline
  - key: completed_notify
    'on':
      collection: matters
      op: update
      where:
        stage: completed
    notify:
      to: owner
      subject: 'Completion: {record.matter_ref}'
      body: Your matter on {record.property_address} has completed. Congratulations.
      link: timeline
  - key: deposit_paid
    'on':
      payment: deposit
    notify:
      to: owner
      subject: Deposit received
      body: 'Thank you, we have received your deposit. Next step: complete your onboarding in Keyhand.'
      link: onboarding
  notifications:
    emailOnRunDone: true
  billing:
    modes:
    - credits
    currency: gbp
    signupCredits: 0
    packs:
    - key: deposit
      credits: 150
      price: 150
      label: Deposit (1 credit = £1)
    - key: balance
      credits: 1000
      price: 1000
      label: Fixed fee balance (1 credit = £1)
  extensions:
  - key: sms_updates
    description: SMS updates at milestones are not available yet; clients get email updates only.
  - key: id_check_partner
    description: Identity checks through a certified partner need that partner's API and an organisation credential. Until
      connected, the lawyer sets id_check_status by hand.
  - key: hmlr_business_eservices
    description: Ordering searches and HM Land Registry official copies and plans (paid per copy) needs the firm's Business
      e-services access and is not available as an app tool yet. Agents prepare draft orders; a lawyer approves spend and
      the team places them.
  - key: client_account
    description: Client money and stamp duty payments go through the firm's client account outside this software. The deposit
      and fee packs here are Stripe payments to the app owner; align them with the firm's accounting and SRA/CLC client-money
      rules.
  - key: fee_amounts
    description: Fees, bands and deposit in the quote slot and packs are placeholder examples; set them to the firm's fixed-fee
      schedule.
  - key: lawyer_only_acts
    description: Exchange and completion are performed by the lawyer outside the app, who records them by updating the matter
      stage.
