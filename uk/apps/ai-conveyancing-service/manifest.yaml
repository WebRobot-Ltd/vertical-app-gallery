apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: keyhand
  displayName: Keyhand
  tagline: AI-led conveyancing, signed off by a qualified lawyer.
  description: Keyhand is the software around a regulated conveyancing service for buyers and sellers in England and Wales.
    Clients get a fixed-fee quote, pay a deposit, complete onboarding and follow a live timeline. AI agents prepare the work;
    a lawyer approves every enquiry, report and completion statement.
  langs:
  - en
  defaultLang: en
  timezone: Europe/London
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#12304a'
      accent: '#b8863b'
      background: '#f7f5f0'
      foreground: '#1a2330'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Key
      color: primary
    - text: hand
      color: accent
    width: wide
  header:
    links:
    - label: How it works
      href: '#how'
    - label: Who it's for
      href: '#roles'
    cta:
      label: Get a quote
      href: /v/quote
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: client
      label: Client
      assignedBy: signup
    - key: lawyer
      label: Lawyer
      assignedBy: derived
      from: collection:matters.lawyer_email
    - key: paralegal
      label: Paralegal
      assignedBy: derived
      from: collection:matters.paralegal_email
    - key: referrer
      label: Estate agent / broker
      assignedBy: derived
      from: collection:matters.referrer_email
  limits:
  - action: agent:quoter
    per: user
    max: 10
    window: day
    roles:
    - client
  - action: agent:conveyancer
    per: user
    max: 20
    window: day
    roles:
    - client
  agents:
  - key: quoter
    role: main
    description: Writes a fixed-fee quote from figures computed by a slot.
    context:
    - key: fee_ex_vat
      from: slot:quote_values
    - key: vat
      from: slot:quote_values
    - key: fee_inc_vat
      from: slot:quote_values
    - key: tax_name
      from: slot:quote_values
    - key: duty
      from: slot:quote_values
    - key: searches_est
      from: slot:quote_values
    - key: hmlr_est
      from: slot:quote_values
    - key: total_est
      from: slot:quote_values
    goalTemplate: 'Prepare a fixed-fee conveyancing quote.

      Service: {service_label}. Nation: {nation_label}. Price: £{price}. Tenure: {tenure_label}.

      {?mortgage}With a mortgage. {/mortgage}{?first_time_buyer}First-time buyer. {/first_time_buyer}{?additional_property}Additional
      property. {/additional_property}

      Computed figures (use exactly, do not recalculate): legal fee ex VAT £{fee_ex_vat}, VAT £{vat}, legal fee inc VAT £{fee_inc_vat};
      {tax_name} estimate £{duty}; searches estimate £{searches_est}; HM Land Registry copies estimate £{hmlr_est}; total
      estimated cost £{total_est}.

      Write in English.'
    output: markdown
    profile:
      inline:
        display_name: Keyhand quoter
        crews:
        - id: quoter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 4
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write clear, friendly conveyancing quotes for clients in England and Wales. Start with a level-1
            title "# Your Keyhand quote". Sections (## headings): Summary, Our fixed fee, Costs paid to others (tax, searches,
            Land Registry), Total estimate, What happens next. Add one small table of the figures. Use ONLY the figures given
            in the goal; never invent or recalculate. State that tax figures are estimates, that the regulated legal service
            is provided by an SRA/CLC-regulated firm and that a qualified lawyer reviews every matter. Next steps: pay the
            deposit on the Credits page, then complete onboarding. Under 300 words.'
  - key: conveyancer
    role: analyst
    description: 'Works on one matter: reads the files, prepares draft enquiries, order requests, the report on title and
      the completion statement. A lawyer approves everything.'
    goalTemplate: 'Matter event: {event}

      Today is {date}. Follow your instructions for this event.'
    output: markdown
    limits:
      maxTurns: 40
      maxBudgetUsd: 2
    awaits:
    - enquiries_signoff
    - report_signoff
    - completion_signoff
    - spend_signoff
    appTools:
    - name: read_matter
      description: Read the client's matter record (property, price, lender, chain, stage, lawyer and uploaded file ids)
      action: read
      collection: matters
      scope: user
    - name: update_matter
      description: Update the matter record (status only)
      action: write
      collection: matters
      scope: user
    - name: read_upload
      description: Read a file the client uploaded (contract pack, title, searches, ID and funds documents; OCR included)
      action: read_file
    - name: write_enquiry
      description: Create or update a DRAFT enquiry
      action: write
      collection: enquiries
      scope: user
    - name: write_order
      description: Create or update a draft order request (official copies, plans, searches)
      action: write
      collection: orders
      scope: user
    - name: write_report
      description: Create or update a draft report on title or completion statement
      action: write
      collection: reports
      scope: user
    - name: add_timeline
      description: Add a milestone to the client's timeline (this emails the client)
      action: append
      collection: timeline
      scope: user
    profile:
      inline:
        display_name: Keyhand conveyancing agent
        crews:
        - id: conveyancer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the preparation agent of Keyhand, a conveyancing service for England and Wales. A regulated
            firm and its qualified lawyers provide the legal service; you only prepare drafts for them. You NEVER send anything,
            never order or pay for anything, never exchange or complete, never give final legal advice, never invent facts,
            dates or figures, and never judge whether an ID document is genuine (identity checks are done by a certified partner
            and the lawyer sets id_check_status).


            For each event start with read_matter. Copy matter_ref, client_name, lawyer_email, paralegal_email and referrer_email
            onto EVERY record you write (enquiries, orders, reports, timeline).


            Events:

            1. Onboarding complete (ready = true): check the documents listed (ID, source of funds, contract pack) are present
            and say what is missing in a timeline entry. Read the contract pack, title and any searches with read_upload.
            For each gap or risk (title restrictions, leasehold terms, missing planning/building regulation papers, chain
            issues, unclear funds) draft an enquiry with write_enquiry (status draft, to_party, precise numbered text). For
            needed items (official copies of the register and title plan from HM Land Registry, local authority, drainage
            and environmental searches) write draft orders with write_order (status draft, est_cost_gbp, short reason; Land
            Registry copies are paid per copy). Then call request_enquiries_signoff and request_spend_signoff with matter_ref
            and a short summary. Add a timeline entry (milestone onboarding) in plain English. Set matter status to prepared.

            2. Approval approved: for enquiries_signoff set the matter''s draft enquiries to status approved and add a timeline
            entry; for spend_signoff set draft orders to approved; for report_signoff set the report to approved and add a
            timeline entry; for completion_signoff set the completion statement to approved and add a timeline entry. Do nothing
            else.

            3. Documents received (title, searches, replies): write a report on title with write_report (kind report_on_title,
            status draft) in plain English for a non-lawyer, level-1 title first, sections: Summary, The property and title,
            Searches, Risks and what they mean, Questions still open, What we recommend you do. Call request_report_signoff.
            When the lawyer asks for a completion statement, prepare it (kind completion_statement: purchase price, fees,
            disbursements, taxes, mortgage, balance due, from the figures in the matter only) and call request_completion_signoff.

            Never tell the client a draft is final. Timeline entries: short title, one plain sentence of detail, milestone
            value. Finish with a short markdown summary of what you drafted and what awaits the lawyer, starting with a level-1
            title.'
  inputForm:
    title: Get a fixed-fee quote
    fields:
    - name: service
      type: select
      required: true
      label: I am
      options:
      - value: buy
        label: Buying
      - value: sell
        label: Selling
      - value: buy_sell
        label: Buying and selling
    - name: nation
      type: select
      required: true
      label: Property is in
      options:
      - value: england
        label: England
      - value: wales
        label: Wales
    - name: price
      type: number
      required: true
      label: Price (£)
    - name: tenure
      type: select
      required: true
      label: Tenure
      options:
      - value: freehold
        label: Freehold
      - value: leasehold
        label: Leasehold
    - name: mortgage
      type: boolean
      label: I am using a mortgage
    - name: first_time_buyer
      type: boolean
      label: First-time buyer
    - name: additional_property
      type: boolean
      label: Additional property (England)
  slots:
  - key: quote_values
    description: Fixed fee, VAT, SDLT/LTT and disbursement estimates from the quote form
    timeoutMs: 2000
    example:
      values:
        service: buy
        nation: england
        price: 350000
        tenure: freehold
        mortgage: true
      lang: en
    code: "def tax(a, bands):\n    t = 0.0\n    prev = 0\n    for lim, rate in bands:\n        if a > prev:\n            t\
      \ += (min(a, lim) - prev) * rate\n        prev = lim\n    return t\n\ndef yes(x):\n    return str(x).lower() in ('true',\
      \ '1', 'yes', 'on')\n\ndef main(input):\n    v = input.get('values') or {}\n    price = float(v.get('price') or 0)\n\
      \    service = v.get('service') or 'buy'\n    nation = v.get('nation') or 'england'\n    buying = service in ('buy',\
      \ 'buy_sell')\n    selling = service in ('sell', 'buy_sell')\n    fee = 0\n    if buying:\n        fee += 950\n    \
      \    if v.get('tenure') == 'leasehold':\n            fee += 250\n        if yes(v.get('mortgage')):\n            fee\
      \ += 150\n    if selling:\n        fee += 750\n    if price > 1000000:\n        fee += 400\n    elif price > 500000:\n\
      \        fee += 150\n    vat = round(fee * 0.2, 2)\n    INF = 10 ** 12\n    duty = 0.0\n    name = 'Stamp Duty Land\
      \ Tax'\n    if buying:\n        if nation == 'wales':\n            name = 'Land Transaction Tax'\n            duty =\
      \ tax(price, [(225000, 0), (400000, 0.06), (750000, 0.075), (1500000, 0.10), (INF, 0.12)])\n        else:\n        \
      \    if yes(v.get('first_time_buyer')) and price <= 500000:\n                duty = tax(price, [(300000, 0), (500000,\
      \ 0.05)])\n            else:\n                duty = tax(price, [(125000, 0), (250000, 0.02), (925000, 0.05), (1500000,\
      \ 0.10), (INF, 0.12)])\n            if yes(v.get('additional_property')):\n                duty += price * 0.05\n  \
      \  else:\n        name = 'Stamp duty (not payable when only selling)'\n    searches = 350 if buying else 0\n    hmlr\
      \ = 21 if buying else 14\n    total = fee + vat + duty + searches + hmlr\n    return {'fee_ex_vat': round(fee, 2), 'vat':\
      \ vat, 'fee_inc_vat': round(fee + vat, 2), 'tax_name': name, 'duty': round(duty, 2), 'searches_est': searches, 'hmlr_est':\
      \ hmlr, 'total_est': round(total, 2)}\n"
  data:
    collections:
    - name: matters
      ownedBy: user
      description: One conveyancing matter per client transaction
      access:
      - role: lawyer
        where:
          lawyer_email: '{user.email}'
        can:
        - read
        - write
      - role: paralegal
        where:
          paralegal_email: '{user.email}'
        can:
        - read
        - write
      fields:
      - name: matter_ref
        type: text
        label: Matter reference
        roles:
        - admin
        - lawyer
        - paralegal
      - name: client_name
        type: text
        required: true
        label: Your full name
      - name: phone
        type: text
        label: Mobile phone
      - name: service
        type: select
        required: true
        label: Service
        options:
        - value: buy
          label: Buying
        - value: sell
          label: Selling
        - value: buy_sell
          label: Buying and selling
      - name: property_address
        type: textarea
        required: true
        label: Property address
      - name: postcode
        type: text
        label: Postcode
      - name: tenure
        type: select
        label: Tenure
        options:
        - value: freehold
          label: Freehold
        - value: leasehold
          label: Leasehold
        - value: unknown
          label: Not sure
      - name: price
        type: number
        required: true
        label: Price (£)
      - name: has_mortgage
        type: boolean
        label: I am using a mortgage
      - name: lender
        type: text
        label: Lender
      - name: broker_name
        type: text
        label: Mortgage broker
      - name: mortgage_amount
        type: number
        label: Mortgage amount (£)
      - name: estate_agent_name
        type: text
        label: Estate agent
      - name: chain_details
        type: textarea
        label: Chain details
        help: Who is above and below you in the chain, and where they are up to.
      - name: id_documents
        type: file
        label: Photo ID and proof of address
        accept:
        - pdf
        - jpg
        - jpeg
        - png
        maxMb: 10
        multiple: true
      - name: funds_documents
        type: file
        label: Source of funds (bank statements, gift letter, sale proceeds)
        accept:
        - pdf
        - jpg
        - jpeg
        - png
        - csv
        maxMb: 15
        multiple: true
      - name: contract_pack
        type: file
        label: Contract pack, title, searches and other documents
        accept:
        - pdf
        - docx
        - jpg
        - jpeg
        - png
        maxMb: 15
        multiple: true
      - name: funds_notes
        type: textarea
        label: Where is the money coming from?
      - name: ready
        type: boolean
        label: I have finished onboarding and want the team to start
      - name: status
        type: select
        label: Status
        options:
        - new
        - prepared
        - in_review
        roles:
        - admin
        - lawyer
        - paralegal
      - name: stage
        type: select
        label: Stage
        default: onboarding
        options:
        - value: onboarding
          label: Onboarding
        - value: checks
          label: ID and funds checks
        - value: searches
          label: Searches and title
        - value: enquiries
          label: Enquiries
        - value: report
          label: Report on title
        - value: exchanged
          label: Exchanged
        - value: completed
          label: Completed
        roles:
        - admin
        - lawyer
        - paralegal
      - name: id_check_status
        type: select
        label: Identity check (certified partner)
        options:
        - pending
        - passed
        - failed
        - manual_review
        roles:
        - admin
        - lawyer
        - paralegal
      - name: exchange_date
        type: date
        label: Exchange date
        roles:
        - admin
        - lawyer
        - paralegal
      - name: completion_date
        type: date
        label: Completion date
        roles:
        - admin
        - lawyer
        - paralegal
      - name: lawyer_email
        type: email
        label: Lawyer
        roles:
        - admin
      - name: paralegal_email
        type: email
        label: Paralegal
        roles:
        - admin
      - name: referrer_email
        type: email
        label: Estate agent or broker (sees timeline only)
        roles:
        - admin
    - name: timeline
      ownedBy: user
      description: Milestones shown to the client, the team and the referrer
      access:
      - role: lawyer
        where:
          lawyer_email: '{user.email}'
        can:
        - read
        - write
      - role: paralegal
        where:
          paralegal_email: '{user.email}'
        can:
        - read
        - write
      - role: referrer
        where:
          referrer_email: '{user.email}'
        can:
        - read
      fields:
      - name: matter_ref
        type: text
      - name: client_name
        type: text
      - name: title
        type: text
        required: true
      - name: detail
        type: textarea
      - name: milestone
        type: select
        options:
        - onboarding
        - checks
        - searches
        - enquiries
        - report
        - exchange
        - completion
        - other
      - name: event_date
        type: date
      - name: lawyer_email
        type: email
      - name: paralegal_email
        type: email
      - name: referrer_email
        type: email
    - name: enquiries
      ownedBy: user
      description: Draft enquiries; a lawyer approves each one before it is sent
      access:
      - role: lawyer
        where:
          lawyer_email: '{user.email}'
        can:
        - read
        - write
      - role: paralegal
        where:
          paralegal_email: '{user.email}'
        can:
        - read
        - write
      fields:
      - name: matter_ref
        type: text
      - name: to_party
        type: select
        options:
        - seller_solicitor
        - buyer_solicitor
        - local_authority
        - management_company
        - other
      - name: text
        type: textarea
        required: true
      - name: status
        type: select
        options:
        - draft
        - approved
        - sent
        - rejected
        default: draft
      - name: lawyer_notes
        type: textarea
      - name: lawyer_email
        type: email
      - name: paralegal_email
        type: email
    - name: orders
      ownedBy: user
      description: Requests for searches and HM Land Registry copies (paid per copy), approved by a lawyer before ordering
      access:
      - role: lawyer
        where:
          lawyer_email: '{user.email}'
        can:
        - read
        - write
      - role: paralegal
        where:
          paralegal_email: '{user.email}'
        can:
        - read
        - write
      fields:
      - name: matter_ref
        type: text
      - name: kind
        type: select
        options:
        - official_copy_register
        - title_plan
        - local_search
        - drainage_search
        - environmental_search
        - other
      - name: description
        type: text
      - name: est_cost_gbp
        type: number
      - name: status
        type: select
        options:
        - draft
        - approved
        - ordered
        - received
        - cancelled
        default: draft
      - name: lawyer_email
        type: email
      - name: paralegal_email
        type: email
    - name: reports
      ownedBy: user
      description: Report on title and completion statement; visible to the client once approved
      access:
      - role: lawyer
        where:
          lawyer_email: '{user.email}'
        can:
        - read
        - write
      - role: paralegal
        where:
          paralegal_email: '{user.email}'
        can:
        - read
        - write
      fields:
      - name: matter_ref
        type: text
      - name: kind
        type: select
        options:
        - report_on_title
        - completion_statement
      - name: title
        type: text
      - name: body
        type: textarea
      - name: status
        type: select
        options:
        - draft
        - approved
        default: draft
      - name: lawyer_email
        type: email
      - name: paralegal_email
        type: email
  views:
  - key: home
    type: page
    title: Keyhand
    nav: false
    sections:
    - type: hero
      band: true
      eyebrow: Conveyancing, England and Wales
      title: Move home with **AI doing the legwork** and a lawyer signing off every step.
      text: A fixed fee, a live timeline and plain-English reports. AI agents prepare the enquiries, read the contract pack
        and draft the report on title; a qualified lawyer reviews and approves everything and performs exchange and completion.
      actions:
      - label: Get a fixed-fee quote
        href: /v/quote
        style: primary
      - label: Sign in
        href: /login
        style: ghost
    - type: steps
      id: how
      title: How it works
      items:
      - title: Quote and deposit
        text: Tell us about the sale or purchase and get a fixed fee. Pay a deposit online.
      - title: Onboarding
        text: Property, price, lender, chain, ID and source-of-funds documents, in one place.
      - title: Prepared by agents
        text: Searches and Land Registry copies requested, contract pack and title read, draft enquiries raised.
      - title: Approved by your lawyer
        text: Every enquiry, report and completion statement is reviewed by a lawyer before it reaches you.
      - title: Exchange and completion
        text: Performed by your lawyer. You follow each milestone by email.
    - type: cards
      id: roles
      title: Who it's for
      items:
      - title: Clients
        text: Timeline, document upload and updates at every milestone.
      - title: Lawyers and paralegals
        text: Sign-off queue, draft enquiries, orders and reports for their own matters.
      - title: Estate agents and brokers
        text: Progress of the clients they referred, nothing more.
    - type: note
      content: Keyhand is software. The regulated legal service is provided by an SRA- or CLC-regulated firm. Quotes are estimates
        of third-party costs and taxes; the legal fee is fixed.
  - key: quote
    type: new_run
    title: Get a quote
    roles:
    - client
    - admin
  - key: quotes
    type: history
    title: My quotes
    source: run
    roles:
    - client
    - admin
  - key: quote_report
    type: report
    title: Quote
    source: run
    printable: true
    nav: false
  - key: onboarding
    type: form
    title: My matter and onboarding
    collection: matters
    edit: true
    fields:
    - client_name
    - phone
    - service
    - property_address
    - postcode
    - tenure
    - price
    - has_mortgage
    - lender
    - broker_name
    - mortgage_amount
    - estate_agent_name
    - chain_details
    - id_documents
    - funds_documents
    - funds_notes
    - contract_pack
    - ready
    submit:
      label: Save
      message: Saved. Tick the last box when you are ready for us to start.
      redirect: my_matters
    roles:
    - client
  - key: my_matters
    type: table
    title: Matters
    source: collection:matters
    roles:
    - client
    - lawyer
    - paralegal
    - admin
    data:
      display: table
      fields:
      - key: matter_ref
        label: Ref
      - key: client_name
        label: Client
      - key: property_address
        label: Property
      - key: service
        label: Service
        format: badge
      - key: stage
        label: Stage
        format: badge
      - key: id_check_status
        label: ID check
        format: badge
      - key: completion_date
        label: Completion
        format: date
      sort:
        field: stage
        dir: asc
    export: true
  - key: matter_admin
    type: form
    title: Update matter (staff)
    collection: matters
    edit: true
    fields:
    - matter_ref
    - stage
    - status
    - id_check_status
    - exchange_date
    - completion_date
    - lawyer_email
    - paralegal_email
    - referrer_email
    submit:
      label: Save
      message: Matter updated.
      redirect: my_matters
    roles:
    - lawyer
    - paralegal
    - admin
  - key: timeline
    type: list
    title: Timeline
    source: collection:timeline
    roles:
    - client
    - lawyer
    - paralegal
    - referrer
    - admin
    data:
      display: list
      fields:
      - key: event_date
        label: Date
        format: date
      - key: client_name
        label: Client
      - key: title
        label: Milestone
      - key: detail
        label: Detail
      sort:
        field: event_date
        dir: desc
      limit: 100
      empty: Nothing yet.
  - key: my_reports
    type: cards
    title: My reports
    source: collection:reports
    roles:
    - client
    data:
      display: cards
      fields:
      - key: title
        label: Report
      - key: kind
        label: Type
        format: badge
      - key: body
        label: Contents
      filters:
      - field: status
        op: '='
        value: approved
      empty: Reports appear here once your lawyer has approved them.
  - key: review_reports
    type: cards
    title: Reports for review
    source: collection:reports
    roles:
    - lawyer
    - paralegal
    - admin
    data:
      display: cards
      fields:
      - key: matter_ref
        label: Matter
      - key: title
        label: Report
      - key: status
        label: Status
        format: badge
      - key: body
        label: Contents
