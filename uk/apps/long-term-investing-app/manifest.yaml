apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: growvest
  displayName: Growvest
  tagline:
    en: Long-term investing, made simple.
  description:
    en: 'Software around a regulated partner: onboarding, ready-made ETF portfolios, monthly investing, a clear dashboard,
      a plain-language explainer and a portfolio simulator.'
  langs:
  - en
  defaultLang: en
  timezone: Europe/London
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#0b3d2e'
      accent: '#2f9e6f'
      background: '#f7faf8'
      foreground: '#14201b'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Grow
      color: primary
    - text: vest
      color: accent
  header:
    links:
    - label: How it works
      href: '#how'
    - label: Pricing
      href: '#pricing'
    cta:
      label: Get started
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  limits:
  - action: agent:explainer
    per: user
    max: 10
    window: day
    roles:
    - user
    plans:
      plus: 50
      pro: -1
  - action: agent:simulator
    per: user
    max: 5
    window: day
    roles:
    - user
    plans:
      plus: 20
      pro: -1
  agents:
  - key: simulator
    role: main
    description: Explains the possible outcomes of the simulator.
    profile:
      inline:
        display_name: Growvest simulator
        crews:
        - id: simulator
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 4
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You present an illustrative long-term investment simulation for a UK investor. You get three pre-computed
            scenarios (cautious, central, optimistic) and must use exactly those figures, never invent others. Start with
            a level-1 title "# Your portfolio simulation". Sections with ## headings: Summary, Scenarios (a small table: scenario,
            final value, total contributed), What could change the outcome (fees, inflation, market falls, time), Next steps.
            Add one chart as a fenced block: ```chart {"type":"bar","title":"Possible outcomes","labels":["Cautious","Central","Optimistic"],"series":[{"name":"Final
            value (GBP)","values":[low,mid,high]}],"unit":"GBP"}``` using the real figures. State clearly that this is an
            illustration, not a forecast or a guarantee, that capital is at risk and values can fall as well as rise, that
            figures are before fees and inflation, and that it is not personal advice. Under 350 words.'
    context:
    - key: sim
      from: slot:sim_values
    goalTemplate: 'Initial amount: {initial} GBP. Monthly amount: {monthly} GBP. Horizon: {years} years. Risk level: {risk_label}.

      Scenario figures (GBP): cautious {low}, central {mid}, optimistic {high}. Total contributed: {contributed}. Assumed
      central annual return: {mu_pct}%.

      Today is {date}. Write in the language with ISO code {lang}.'
    output: markdown
  - key: explainer
    role: helper
    description: Explains market moves and portfolio changes in plain words from the educational content. No personal advice.
    profile:
      inline:
        display_name: Growvest explainer
        crews:
        - id: explainer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are Growvest''s educational assistant for long-term investors. You explain market moves, how
            ETFs, ISAs, pensions, rebalancing and fees work, and what changed in the user''s portfolio, in plain English.
            Use the tools: search_articles for the educational content (base your answers on it and name the article you used)
            and read_market_notes for the latest market commentary. The user''s holdings are given to you as context. You
            are NOT giving personal advice: never tell the user to buy, sell or switch a specific investment, never say what
            they personally should do, never predict returns. When asked for advice, explain the general considerations and
            suggest they consider guidance from a regulated adviser. Remind them, when relevant, that capital is at risk.
            Never invent figures or facts; if the content does not cover it, say so. Keep answers short and friendly.'
    appTools:
    - name: search_articles
      description: Search the educational articles
      action: search
      collection: articles
      scope: all
    - name: read_market_notes
      description: Read the latest market notes
      action: read
      collection: market_notes
      scope: all
    context:
    - key: holdings
      from: collection:holdings
    goalTemplate: 'Conversation so far:

      {history}

      New question: {message}

      The user''s holdings (one JSON line each, may be empty):

      {holdings}

      Answer in the language with ISO code {lang}.'
    output: markdown
  - key: commentator
    role: scheduled
    description: Writes a short daily market note for everyone.
    writesTo:
      collection: market_notes
      parse: whole
      keyBy: date
    profile:
      inline:
        display_name: Growvest market commentator
        crews:
        - id: commentator
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          mcp_servers:
          - name: webrobot
            type: http
            url: https://mcp-full.webrobot.eu/mcp
            allow: all
          system_prompt: 'You write a short, neutral market note for long-term ETF investors. Use the WebRobot MCP to read
            the headlines and index levels from a few reputable public finance news pages. Start with "# Markets — <date>".
            Sections: ## What moved, ## Why it moved (only what the sources say), ## What it means for long-term investors
            (general context, never advice or predictions). Under 250 words, cite the sources by name, never invent figures.'
    goalTemplate: 'Write today''s market note. Today is {date}. Language: English.'
    output: markdown
  slots:
  - key: sim_values
    description: Three illustrative outcomes from the risk level, amounts and horizon
    timeoutMs: 2000
    example:
      values:
        initial: 1000
        monthly: 200
        years: 20
        risk: '3'
      lang: en
    code: "MU = {\"1\": 0.025, \"2\": 0.04, \"3\": 0.055, \"4\": 0.07, \"5\": 0.08}\nSD = {\"1\": 0.03, \"2\": 0.06, \"3\"\
      : 0.10, \"4\": 0.14, \"5\": 0.18}\n\ndef future_value(init, m, y, rate):\n    mr = (1 + rate) ** (1 / 12.0) - 1\n  \
      \  bal = init\n    for _ in range(y * 12):\n        bal = bal * (1 + mr) + m\n    return int(round(bal))\n\ndef main(input):\n\
      \    v = input.get(\"values\") or {}\n    init = float(v.get(\"initial\") or 0)\n    m = float(v.get(\"monthly\") or\
      \ 0)\n    y = int(float(v.get(\"years\") or 10))\n    r = str(v.get(\"risk\") or \"3\")\n    mu = MU.get(r, 0.055)\n\
      \    sd = SD.get(r, 0.10)\n    return {\n        \"low\": future_value(init, m, y, mu - sd * 0.6),\n        \"mid\"\
      : future_value(init, m, y, mu),\n        \"high\": future_value(init, m, y, mu + sd * 0.6),\n        \"contributed\"\
      : int(round(init + m * 12 * y)),\n        \"mu_pct\": round(mu * 100, 1),\n    }\n"
  inputForm:
    title: Portfolio simulator
    fields:
    - name: initial
      type: number
      label: Starting amount (£)
      default: 1000
    - name: monthly
      type: number
      required: true
      label: Monthly amount (£)
      default: 200
    - name: years
      type: number
      required: true
      label: Years
      default: 20
    - name: risk
      type: select
      required: true
      label: Risk level
      options:
      - value: '1'
        label: 1 - Very cautious
      - value: '2'
        label: 2 - Cautious
      - value: '3'
        label: 3 - Balanced
      - value: '4'
        label: 4 - Growth
      - value: '5'
        label: 5 - Adventurous
  data:
    collections:
    - name: investor_profiles
      ownedBy: user
      description: Onboarding answers of each investor
      fields:
      - name: goal
        type: select
        required: true
        label: Main goal
        options:
        - Retirement
        - Buy a home
        - Children's future
        - Build wealth
        - Other
      - name: horizon_years
        type: number
        required: true
        label: Time horizon (years)
      - name: loss_reaction
        type: select
        required: true
        label: If your investments fell 20%, you would...
        options:
        - Sell everything
        - Sell some
        - Do nothing
        - Buy more
      - name: experience
        type: select
        required: true
        label: Investing experience
        options:
        - None
        - Some
        - Experienced
      - name: capacity
        type: select
        required: true
        label: Could you cope with losing part of this money?
        options:
        - 'No'
        - A little
        - Yes, a fair amount
      - name: risk_profile
        type: select
        required: true
        label: Risk level you are comfortable with
        options:
        - '1'
        - '2'
        - '3'
        - '4'
        - '5'
      - name: monthly_amount
        type: number
        required: true
        label: Monthly amount (£)
      - name: wrapper
        type: select
        required: true
        label: Account type
        options:
        - Stocks and Shares ISA
        - General account
        - Pension
    - name: goals
      ownedBy: user
      description: Investment goals
      fields:
      - name: name
        type: text
        required: true
        label: Goal
      - name: target_amount
        type: number
        required: true
        label: Target (£)
      - name: target_date
        type: date
        required: true
        label: Target date
    - name: model_portfolios
      ownedBy: shared
      description: Ready-made ETF portfolios, kept by the admins
      fields:
      - name: name
        type: text
        required: true
      - name: risk_level
        type: number
        required: true
      - name: description
        type: textarea
      - name: allocation
        type: textarea
        help: ETF and weight per line
      - name: annual_fee_pct
        type: number
    - name: user_portfolios
      ownedBy: user
      description: The portfolio each user chose and adjusted
      fields:
      - name: portfolio
        type: select
        required: true
        label: Portfolio
        optionsFrom: collection:model_portfolios
      - name: adjustments
        type: textarea
        label: Your adjustments (optional)
        help: e.g. 10% less bonds, 10% more global equities
      - name: auto_rebalance
        type: boolean
        label: Rebalance automatically
        default: true
    - name: invest_plans
      ownedBy: user
      description: Monthly investing plans
      fields:
      - name: amount
        type: number
        required: true
        label: Monthly amount (£)
      - name: day
        type: number
        required: true
        label: Day of the month (1-28)
      - name: wrapper
        type: select
        required: true
        label: Account
        options:
        - Stocks and Shares ISA
        - General account
        - Pension
      - name: mandate_status
        type: text
        label: Direct Debit status
    - name: holdings
      ownedBy: user
      description: Positions, synced from the partner
      fields:
      - name: ticker
        type: text
      - name: name
        type: text
      - name: wrapper
        type: text
      - name: units
        type: number
      - name: value
        type: number
      - name: cost
        type: number
      - name: gain_pct
        type: number
    - name: contributions
      ownedBy: user
      description: Contributions, synced from the partner
      fields:
      - name: date
        type: date
      - name: amount
        type: number
      - name: wrapper
        type: text
      - name: status
        type: text
    - name: dividends
      ownedBy: user
      description: Dividends received, synced from the partner
      fields:
      - name: date
        type: date
      - name: ticker
        type: text
      - name: amount
        type: number
    - name: snapshots
      ownedBy: user
      description: Daily value of the portfolio, synced from the partner
      fields:
      - name: date
        type: date
      - name: value
        type: number
      - name: contributed
        type: number
    - name: articles
      ownedBy: shared
      description: Educational content, kept by the admins
      fields:
      - name: title
        type: text
        required: true
      - name: topic
        type: text
      - name: content
        type: textarea
        required: true
    - name: market_notes
      ownedBy: app
      description: Daily market notes written by the commentator agent
      fields:
      - name: date
        type: date
      - name: title
        type: text
      - name: content
        type: textarea
    - name: tax_dates
      ownedBy: shared
      description: Deadlines such as the end of the tax year (5 April), added each year by the admins
      fields:
      - name: title
        type: text
        required: true
      - name: deadline
        type: date
        required: true
      - name: message
        type: textarea
  views:
  - key: home
    type: page
    title: Growvest
    nav: false
    sections:
    - type: hero
      layout: stack
      band: true
      eyebrow: Long-term investing
      title: Invest for the long run, **simply**.
      text: Open an ISA, general account or pension through our FCA-regulated partner, pick a ready-made ETF portfolio, invest
        monthly and watch your goals grow.
      actions:
      - label: Get started
        href: /login
        style: primary
      - label: Try the simulator
        href: /login
        style: ghost
      note: Capital at risk. The value of investments can fall as well as rise.
    - type: steps
      id: how
      title: How it works
      items:
      - title: Verify and tell us your goals
        text: Identity checks are done securely by our regulated partner, then you answer a short questionnaire.
        badge: '1'
      - title: Pick a portfolio
        text: Ready-made ETF portfolios matched to your risk level, which you can adjust.
        badge: '2'
      - title: Invest monthly
        text: A Direct Debit and automatic rebalancing do the work.
        badge: '3'
      - title: Understand and track
        text: A clear dashboard and an assistant that explains markets in plain words.
        badge: '4'
    - type: cards
      id: pricing
      title: Pricing
      items:
      - title: Free
        text: Core investing, dashboard and the simulator with daily limits.
      - title: Plus
        text: Lower fees, more assistant questions, extra reports.
      - title: Pro
        text: Lowest fees, unlimited assistant and simulator, priority support.
    - type: note
      content: Growvest is software provided around services of an FCA-authorised investment firm, which holds client assets
        in custody and executes trades. Information and the assistant are educational, not personal advice. Capital at risk.
  - key: onboarding
    type: form
    title: Your profile
    collection: investor_profiles
    edit: true
    submit:
      label: Save profile
      message: Profile saved. Now choose a portfolio.
      redirect: portfolios
    roles:
    - user
    - admin
  - key: goals_form
    type: form
    title: Add a goal
    collection: goals
    submit:
      label: Save goal
      message: Goal saved.
      redirect: dashboard
    roles:
    - user
    - admin
  - key: portfolios
    type: cards
    title: Portfolios
    source: collection:model_portfolios
    data:
      display: cards
      fields:
      - key: name
        label: Portfolio
      - key: risk_level
        label: Risk level
        format: badge
      - key: description
        label: About
      - key: allocation
        label: ETFs
      - key: annual_fee_pct
        label: Fee %
        format: number
      sort:
        field: risk_level
        dir: asc
    roles:
    - user
    - admin
  - key: choose_portfolio
    type: form
    title: Choose and adjust
    collection: user_portfolios
    edit: true
    submit:
      label: Save portfolio
      message: Portfolio saved.
      redirect: plan
    roles:
    - user
    - admin
  - key: plan
    type: form
    title: Monthly investing
    collection: invest_plans
    fields:
    - amount
    - day
    - wrapper
    edit: true
    submit:
      label: Set up monthly investing
      message: Plan saved. Your Direct Debit mandate is set up with our partner.
      redirect: dashboard
    roles:
    - user
    - admin
  - key: dashboard
    type: page
    title: Dashboard
    roles:
    - user
    - admin
    sections:
    - type: data
      title: My portfolio
      source: collection:holdings
      display: kpi
      kpis:
      - label: Value
        agg: sum
        field: value
        format: money
      - label: Invested
        agg: sum
        field: cost
        format: money
      - label: Positions
        agg: count
    - type: data
      title: Performance
      source: collection:snapshots
      display: chart
      chart: line
      fields:
      - key: date
        label: Date
      - key: value
        label: Value
      - key: contributed
        label: Contributed
      sort:
        field: date
        dir: asc
      limit: 200
      empty: Your performance will appear after your first investment.
    - type: data
      title: Holdings
      source: collection:holdings
      display: table
      fields:
      - key: name
        label: Fund
      - key: ticker
        label: Ticker
      - key: wrapper
        label: Account
      - key: units
        label: Units
        format: number
      - key: value
        label: Value
        format: money
      - key: gain_pct
        label: Gain
        format: percent
      empty: No holdings yet.
    - type: data
      title: Dividends
      source: collection:dividends
      display: table
      fields:
      - key: date
        label: Date
        format: date
      - key: ticker
        label: Fund
      - key: amount
        label: Amount
        format: money
      sort:
        field: date
        dir: desc
      limit: 20
      kpis:
      - label: Total dividends
        agg: sum
        field: amount
        format: money
      empty: No dividends yet.
    - type: data
      title: Goals
      source: collection:goals
      display: table
      fields:
      - key: name
        label: Goal
      - key: target_amount
        label: Target
        format: money
      - key: target_date
        label: By
        format: date
      empty: No goals yet.
    - type: view
      title: Ask the assistant
      view: assistant
  - key: assistant
    type: chat
    title: Assistant
    source: agent:explainer
    examples:
    - Why did markets fall this week?
    - What is rebalancing?
    - How does the ISA allowance work?
    - What changed in my portfolio?
    placeholder: Ask about markets, ETFs, ISAs...
    roles:
    - user
    - admin
  - key: simulator
    type: new_run
    title: Simulator
    roles:
    - user
    - admin
  - key: simulations
    type: history
    title: My simulations
    source: run
    roles:
    - user
    - admin
  - key: simulation
    type: report
    source: run
    printable: true
    nav: false
  - key: learn
    type: cards
    title: Learn
    source: collection:articles
    data:
      display: cards
      fields:
      - key: title
        label: Article
      - key: topic
        label: Topic
        format: badge
      - key: content
        label: Content
    roles:
    - user
    - admin
  - key: market
    type: list
    title: Market notes
    source: collection:market_notes
    data:
      display: list
      fields:
      - key: date
        label: Date
        format: date
      - key: title
        label: Note
      - key: content
        label: Summary
      sort:
        field: date
        dir: desc
      limit: 30
    roles:
    - user
    - admin
  - key: account
    type: account
    title: Plan
    roles:
    - user
  - key: admin
    type: tabs
    title: Admin
    children:
    - admin_overview
    - admin_metrics
    - admin_data
    roles:
    - admin
  - key: admin_overview
    type: admin
    title: Overview
    roles:
    - admin
    nav: false
  - key: admin_data
    type: admin
    title: Content and data
    roles:
    - admin
    nav: false
  - key: admin_metrics
    type: page
    title: Aggregate metrics
    roles:
    - admin
    nav: false
    sections:
    - type: data
      title: Investors by account type
      source: collection:investor_profiles
      display: chart
      chart: pie
      groupBy:
        field: wrapper
        aggs: []
        minCount: 5
        acrossUsers: true
    - type: data
      title: Investors by risk level
      source: collection:investor_profiles
      display: bar
      groupBy:
        field: risk_profile
        aggs:
        - key: avg_monthly
          agg: avg
          field: monthly_amount
        minCount: 5
        acrossUsers: true
  schedules:
  - agent: commentator
    cron: 0 7 * * 1-5
    action: run
    owner: app
    goal: Write today's market note.
  triggers:
  - key: contribution_in
    'on':
      collection: contributions
      op: insert
    notify:
      to: owner
      subject: 'Contribution received: £{record.amount}'
      body: Your monthly contribution of £{record.amount} to your {record.wrapper} was processed. Capital is at risk.
      link: dashboard
  - key: dividend_in
    'on':
      collection: dividends
      op: insert
    notify:
      to: owner
      subject: 'Dividend received: £{record.amount}'
      body: You received a dividend of £{record.amount} from {record.ticker}.
      link: dashboard
  - key: isa_30
    'on':
      date:
        collection: tax_dates
        field: deadline
        offsetDays: -30
        hour: 8
    notify:
      to: role:user
      subject: '30 days left: {record.title}'
      body: '{record.message}'
      link: plan
  - key: isa_7
    'on':
      date:
        collection: tax_dates
        field: deadline
        offsetDays: -7
        hour: 8
    notify:
      to: role:user
      subject: 'One week left: {record.title}'
      body: '{record.message}'
      link: plan
  - key: hook_holdings
    'on':
      webhook: true
    write:
      collection: holdings
      keyBy: ticker
  - key: hook_contributions
    'on':
      webhook: true
    write:
      collection: contributions
  - key: hook_dividends
    'on':
      webhook: true
    write:
      collection: dividends
  - key: hook_snapshots
    'on':
      webhook: true
    write:
      collection: snapshots
      keyBy: date
  notifications:
    emailOnRunDone: true
  mobile:
    appId: com.growvest.app
    appName: Growvest
    capabilities:
    - name: push
    - name: biometrics
      reason:
        en: To open Growvest with Face ID or your fingerprint
    lock: biometric
  billing:
    modes:
    - subscription
    currency: gbp
    plans:
    - key: plus
      price: 4.99
      interval: month
      label: Plus
      includes:
      - Lower platform fee
      - More assistant questions
      - Extra reports
    - key: pro
      price: 9.99
      interval: month
      label: Pro
      includes:
      - Lowest platform fee
      - Unlimited assistant and simulator
      - Priority support
  extensions:
  - key: partner_integration
    description: 'The FCA-authorised partner must provide: identity checks (KYC), custody, trade execution, Direct Debit mandates,
      ISA/pension account opening, and the data feeds (holdings, contributions, dividends, daily snapshots) that call the
      webhook triggers. The partner''s payload must identify the user and the record owner; OAuth or signed partner sessions
      are not available yet, so this link is custom work.'
  - key: fee_tiers
    description: Lower fees for paid tiers are applied by the partner's fee schedule per plan; the app only sells the subscription.
  - key: risk_scoring
    description: The risk questionnaire stores answers and a self-chosen risk level; an automatic score and suitability assessment
      by the regulated firm is custom work.
  - key: auto_rebalance_and_sms
    description: Rebalancing is executed by the partner according to the saved preference. SMS/WhatsApp messages are not available.
