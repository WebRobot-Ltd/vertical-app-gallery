        label: Meals
        format: number
      groupBy:
        field: logged_on
        bucket: month
        aggs:
        - key: avg_kcal
          agg: avg
          field: kcal
        minCount: 5
        acrossUsers: true
  - key: admin_data
    type: admin
    title: Data
    roles:
    - admin
    nav: false
  billing:
    modes:
    - subscription
    currency: gbp
    plans:
    - key: monthly
      price: 9.99
      interval: month
      label: Leanleaf Monthly
      includes:
      - Personal plan
      - Daily AI coach
      - Meal photo analysis
      - Weekly review
      - Human coach escalation
    - key: annual
      price: 79
      interval: year
      label: Leanleaf Annual
      includes:
      - Everything in Monthly
      - Two months free
  mobile:
    appId: com.leanleaf.app
    appName: Leanleaf
    capabilities:
    - name: camera
      reason:
        en: To photograph your meals
    - name: push
    - name: microphone
      reason:
        en: To talk to your coach by voice
    - name: biometrics
      reason:
        en: To keep your health data private with Face ID or fingerprint
    lock: biometric
  egress:
    hosts:
    - world.openfoodfacts.org
    notes: 'Open Food Facts, open database (ODbL), used to cross-check packaged foods. CoFID (UK Government, Open Government
      Licence) has no live API: the agent uses typical values from it.'
  extensions:
  - key: cofid_lookup
    description: CoFID is published as spreadsheets, not an API. Meal estimates use the agent's knowledge of CoFID plus Open
      Food Facts. Loading CoFID as a shared collection (admin CSV import on the data page) would let the agent read it directly.
  - key: per_user_reminder_times
    description: Meal, fasting-window and weigh-in reminders are sent at fixed times to all members as notifications. Reminders
      at each member's own times, from their personal fasting window, are not available yet.
  - key: renewal_reminder_and_cancel
    description: UK rules need a reminder before each renewal and a one-step cancel. The Account page provides plan management;
      a reminder a set number of days before each renewal charge is not available yet and must be handled in Stripe settings.
      Check the cancel flow on the Account page before launch.
  - key: coach_assignment
    description: Admins assign a human coach by setting coach_email on a member's profile in the data page. Plans, escalations
      and weekly summaries carry the coach email from the profile at the time they are written, so a coach assigned later
      sees only newer records.
