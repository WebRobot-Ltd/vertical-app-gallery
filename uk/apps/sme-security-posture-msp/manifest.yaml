  extensions:
  - key: per_device_msp_billing
    description: £5 per device per month for MSPs needs usage-based invoicing from the devices count of each client; here
      the devices field is recorded and MSPs buy credits or a plan. Per-device invoicing must be handled outside the app.
  - key: file_ownership_check
    description: Ownership checks by a file on the website are reviewed by a person (status needs_review); only the DNS TXT
      check is automatic, because agents can only call a fixed list of public hosts.
  - key: endpoint_agents_and_sensors
    description: Endpoint agents, network sensors and the 24/7 security operations service are outside this app; their findings
      could later arrive on a webhook trigger into the findings collection.
  - key: cyber_essentials_certification
    description: The checklist tracks readiness only; certification needs an accredited certification body.
  - key: role_note
    description: Everyone who signs up holds the msp_admin role, including direct small businesses (their own client record);
      client admins and viewers also get their derived role. Data stays isolated per owner and per client through access rules.
