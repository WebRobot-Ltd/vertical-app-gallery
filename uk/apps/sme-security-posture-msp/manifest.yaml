apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: shieldway
  displayName: Shieldway
  tagline: AI security monitoring for small businesses and the MSPs who look after them.
  description: Shieldway lets MSPs and small businesses register the assets they own, prove ownership, and get passive external
    monitoring, plain-English remediation tickets, a Cyber Essentials readiness checklist and a monthly security score by
    email.
  langs:
  - en
  defaultLang: en
  timezone: Europe/London
spec:
  pattern: dashboard
  branding:
    theme: light
    palette:
      primary: '#0b1f33'
      accent: '#00a88f'
      background: '#f4f7fa'
      foreground: '#12202e'
    fonts:
      body: Inter
      display: Manrope
    wordmark:
    - text: Shield
      color: primary
    - text: way
      color: accent
    width: wide
  header:
    links:
    - label: How it works
      href: '#how'
    - label: What we check
      href: '#checks'
    - label: Pricing
      href: '#pricing'
    cta:
      label: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Platform admin
      assignedBy: admin_emails
    - key: msp_admin
      label: MSP admin / business owner
      assignedBy: signup
    - key: technician
      label: Technician
      assignedBy: derived
      from: collection:clients.technician_email
    - key: client_admin
      label: Client admin
      assignedBy: derived
      from: collection:clients.client_admin_email
    - key: client_viewer
      label: Client viewer
      assignedBy: derived
      from: collection:clients.viewer_email
  limits:
  - action: run
    per: user
    max: 20
    window: day
  egress:
    hosts:
    - cloudflare-dns.com
    - crt.sh
    - services.nvd.nist.gov
    - www.cisa.gov
    notes: 'cloudflare-dns.com: public DNS-over-HTTPS (DNS, SPF, DMARC, ownership TXT). crt.sh: public certificate transparency
      logs, light use. services.nvd.nist.gov: NVD CVE API, public domain data. www.cisa.gov: CISA Known Exploited Vulnerabilities
      catalog, public domain. All passive, read-only, no scanning of client systems.'
  agents:
  - key: verifier
    role: helper
    description: Checks ownership of a newly registered asset (DNS TXT) and the written authorisation, then sets its status
      and copies the client's access fields.
    profile:
      inline:
        display_name: Shieldway ownership verifier
        crews:
        - id: verifier
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You verify that a client really controls an asset before Shieldway monitors it. Steps: 1) call read_clients
            and find the client by name; note technician_email, client_admin_email and viewer_email. 2) If the asset type
            is domain, website or email_domain and the method is dns_txt, call dns_lookup with query "name=_shieldway.<domain>&type=TXT"
            (for a website use its hostname) and accept only if a TXT answer contains "shieldway-verify=<token>" with the
            exact token given. 3) Written authorisation: the record must name who authorised it (authorised_by) and have an
            authorisation file attached; if missing, do not verify. 4) For ip_range, or method file_manual, you cannot check
            automatically: set status needs_review. 5) Call update_asset (write) on the record id with: status (verified |
            pending | needs_review), verified_at (today, only if verified), technician_email, client_email (the client admin''s
            email) and client_members (list of the client admin and viewer emails that exist). Never claim verification without
            evidence. Reply with 3 lines: asset, result, reason.'
    goalTemplate: 'New asset to verify. Record id: {record.id}. Client: {record.client}. Type: {record.type}. Value: {record.value}.
      Method: {record.verification_method}. Token: {record.verification_token}. Authorised by: {record.authorised_by}. Authorisation
      file: {record.authorisation_file}. Today is {date}.'
    appTools:
    - name: read_clients
      description: Read the client organisations
      action: read
      collection: clients
      scope: user
    - name: update_asset
      description: Update an asset record (status, verification date, access fields)
      action: write
      collection: assets
      scope: user
    - name: dns_lookup
      description: DNS-over-HTTPS lookup. query like name=_shieldway.example.com&type=TXT
      action: http
      http:
        method: GET
        url: https://cloudflare-dns.com/dns-query
        headers:
          Accept: application/dns-json
        attribution: Cloudflare public DNS-over-HTTPS
    output: markdown
    limits:
      maxTurns: 10
      maxBudgetUsd: 0.2
  - key: monitor
    role: scheduled
    description: Passive external check of one client's verified assets; records findings.
    profile:
      inline:
        display_name: Shieldway external monitor
        crews:
        - id: monitor
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are a passive external security monitor. You NEVER scan, probe or connect to client systems:
            you only use public sources through your tools. Steps: 1) read_clients and read_assets; work only on assets of
            the named client whose status is verified. If none, say so and stop. 2) For each domain/website/email_domain:
            ct_search with query "q=%25.<domain>&output=json" (unexpected or expired certificates, wildcard sprawl, subdomains
            that look forgotten); dns_lookup for A, MX, NS, TXT records; email authentication: TXT at <domain> for SPF (missing,
            multiple, +all or ?all, too permissive) and TXT at _dmarc.<domain> (missing, p=none, no rua). 3) If an asset has
            a software field, use nvd_search (query "keywordSearch=<product version>&resultsPerPage=20") and kev_catalog to
            flag CVEs, marking kev=true when the CVE appears in the CISA KEV catalog (KEV raises severity to at least high).
            Only claim a vulnerability when the named software and version is declared by the client. IP ranges: only report
            what public sources show; say that nothing else was checked. 4) read_findings first and do not duplicate open
            findings with the same asset and title. 5) For every new issue call add_finding with: client, asset, source (ct_logs|dns|email_auth|nvd|kev),
            severity (critical|high|medium|low|info), title, detail (plain English), evidence (the exact record or URL), cve,
            kev, first_seen (today), status open, technician_email, client_email and client_members (copy from the client
            record: the client admin and viewer emails). Mark findings that are no longer observed as resolved is NOT your
            job. Report format: start with "# Monitoring report — <client> — <date>", then ## Summary, ## New findings (table:
            severity, asset, title), ## Checked and fine, ## Limits of this check. Never invent data; if a source fails, say
            so.'
    appTools:
    - name: read_clients
      description: Read the client organisations
      action: read
      collection: clients
      scope: user
    - name: read_assets
      description: Read registered assets
      action: read
      collection: assets
      scope: user
    - name: read_findings
      description: Read existing findings
      action: read
      collection: findings
      scope: user
    - name: add_finding
      description: Record a new finding
      action: append
      collection: findings
      scope: user
    - name: dns_lookup
      description: DNS-over-HTTPS lookup. query like name=example.com&type=TXT
      action: http
      http:
        method: GET
        url: https://cloudflare-dns.com/dns-query
        headers:
          Accept: application/dns-json
        attribution: Cloudflare public DNS-over-HTTPS
    - name: ct_search
      description: Certificate transparency search on crt.sh. query like q=%25.example.com&output=json
      action: http
      http:
        method: GET
        url: https://crt.sh/
        attribution: crt.sh, public certificate transparency logs
        maxBytes: 500000
    - name: nvd_search
      description: NVD CVE API 2.0 search. query like keywordSearch=nginx 1.18&resultsPerPage=20
      action: http
      http:
        method: GET
        url: https://services.nvd.nist.gov/rest/json/cves/2.0
        attribution: NVD, NIST
    - name: kev_catalog
      description: CISA Known Exploited Vulnerabilities catalog (JSON)
      action: http
      http:
        method: GET
        url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
        attribution: CISA KEV catalog
        maxBytes: 2000000
        timeoutMs: 30000
    output: markdown
    limits:
      maxTurns: 30
      maxBudgetUsd: 1.0
  - key: ticket_drafter
    role: helper
    description: Turns a finding into a remediation ticket with plain-English explanation and fix steps.
    profile:
      inline:
        display_name: Shieldway ticket drafter
        crews:
        - id: ticket_drafter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You draft remediation tickets for small-business IT. From the finding you receive, call create_ticket
            once with: client, finding_title, severity (same as the finding), title (short, action-oriented), explanation
            (2-4 plain-English sentences a non-technical owner understands: what it is, why it matters), fix_steps (numbered,
            concrete, for a technician; name the exact record or setting to change), status open, due_date (critical 3 days,
            high 7, medium 30, low 90 days from today), technician_email, client_email, client_members (copy from the finding).
            Do not invent facts beyond the finding''s evidence and do not promise outcomes. Reply with one line: the ticket
            title.'
    goalTemplate: 'Draft a ticket. Today is {date}. Client: {record.client}. Asset: {record.asset}. Source: {record.source}.
      Severity: {record.severity}. Title: {record.title}. Detail: {record.detail}. Evidence: {record.evidence}. CVE: {record.cve}.
      In CISA KEV: {record.kev}. Technician: {record.technician_email}. Client admin: {record.client_email}. Members: {record.client_members}.'
    appTools:
    - name: create_ticket
      description: Create a remediation ticket
      action: append
      collection: tickets
      scope: user
    output: markdown
    limits:
      maxTurns: 6
      maxBudgetUsd: 0.2
  - key: report_writer
    role: scheduled
    description: Writes a client's monthly security report with a score and stores it.
    profile:
      inline:
        display_name: Shieldway monthly reporter
        crews:
        - id: report_writer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 15
          max_budget_usd: 0.6
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write the monthly security report for one small-business client, for its owner (not a specialist).
            Use read_clients, read_assets, read_findings, read_tickets and read_checklist, restricted to the named client.
            Security score (0-100) = 100 minus 20 per open critical finding, 10 per open high, 4 per open medium, 1 per open
            low, minus 5 per overdue open ticket, floored at 0; add nothing for unverified assets and mention how many assets
            are not yet verified. Start with "# Security report — <client> — <month year>". Sections: ## Your score (score
            and change vs the last report if one exists, read_reports), ## What we found, ## What was fixed, ## What to do
            next (max 5 items, in plain English), ## Cyber Essentials readiness (the 5 controls and their status; state clearly
            that this is a readiness checklist and not a certification, which requires an accredited certification body).
            Add a ```chart block (bar, open findings by severity, real figures only). Then call save_report once with: client,
            month (YYYY-MM), score, open_critical, summary (3 sentences), body (the full report), client_email, technician_email,
            client_members (copied from the client record). Never invent figures; the monitoring covers only external passive
            checks of verified assets, endpoint agents and 24/7 SOC are separate services and not reflected here.'
    appTools:
    - name: read_clients
      description: Read the client organisations
      action: read
      collection: clients
      scope: user
    - name: read_assets
      description: Read assets
      action: read
      collection: assets
      scope: user
    - name: read_findings
      description: Read findings
      action: read
      collection: findings
      scope: user
    - name: read_tickets
      description: Read tickets
      action: read
      collection: tickets
      scope: user
    - name: read_checklist
      description: Read the Cyber Essentials readiness checklist
      action: read
      collection: checklist
      scope: user
    - name: read_reports
      description: Read earlier reports
      action: read
      collection: reports
      scope: user
    - name: save_report
      description: Save the monthly report
      action: append
      collection: reports
      scope: user
    output: markdown
    limits:
      maxTurns: 15
      maxBudgetUsd: 0.6
  templates:
  - key: asset_monitor
    title: External monitor
    description: Weekly passive check of all verified assets of one client.
    agent: monitor
    params:
    - name: client
      type: select
      required: true
      label: Client
      optionsFrom: collection:clients
    goal: 'Monitor the verified assets of the client "{client}" (watch: {instance}). Today is {date}. Write the report in
      English.'
    schedule:
      cron: 0 5 * * 1
      userCanChange: true
    maxPerUser: 200
    cost:
      perRun: 10
    deliver:
      to: owner
      onlyIfNew: true
      subject: Shieldway monitoring — {title}
  - key: monthly_report
    title: Monthly security report
    description: 'On the 1st of each month: score and report for one client, emailed to the client admin.'
    agent: report_writer
    params:
    - name: client
      type: select
      required: true
      label: Client
      optionsFrom: collection:clients
    goal: Write the monthly security report for the client "{client}" for the month before {date}. Write in English.
    schedule:
      cron: 0 7 1 * *
      userCanChange: false
    maxPerUser: 200
    cost:
      perRun: 10
  triggers:
  - key: verify_asset
    description: Verify ownership when an asset is registered
    'on':
      collection: assets
      op: insert
      where:
        status: pending
    start:
      agent: verifier
    goal: Verify the new asset {record.value} of client {record.client}.
  - key: draft_ticket
    description: Draft a ticket for each new finding
    'on':
      collection: findings
      op: insert
    start:
      agent: ticket_drafter
    goal: Draft a ticket for the finding "{record.title}" ({record.severity}) of client {record.client}.
  - key: ticket_opened
    'on':
      collection: tickets
      op: insert
    notify:
      to: record.technician_email
      subject: 'New {record.severity} ticket: {record.title}'
      body: 'A new remediation ticket was created for {record.client}.


        {record.title}


        Open Shieldway to assign and work on it.'
      link: tickets
  - key: ticket_closed
    'on':
      collection: tickets
      op: update
      where:
        status: closed
    notify:
      to: record.client_email
      subject: 'Fixed: {record.title}'
      body: 'Your technician has closed this security ticket:


        {record.title}


        Notes: {record.resolution_notes}'
      link: tickets
  - key: report_ready
    'on':
      collection: reports
      op: insert
    notify:
      to:
      - record.client_email
      - owner
      subject: 'Your Shieldway security report for {record.month}: score {record.score}'
      body: 'Your monthly security report for {record.client} is ready. Security score: {record.score}/100.


        {record.summary}'
      link: reports
  data:
    collections:
    - name: clients
      description: Client organisations (an MSP's clients, or a direct business's own record)
      ownedBy: user
      fields:
      - name: name
        type: text
        required: true
        label: Organisation
      - name: kind
        type: select
        required: true
        label: Type
        options:
        - value: msp_client
          label: MSP client
        - value: direct
          label: Direct customer
      - name: client_admin_email
        type: email
        required: true
        label: Client admin email
      - name: viewer_email
        type: email
        label: Client viewer email
      - name: technician_email
        type: email
        label: Assigned technician email
      - name: devices
        type: number
        label: Managed devices
      - name: notes
        type: textarea
        label: Notes
      access:
      - role: technician
        where:
          technician_email: '{user.email}'
        can:
        - read
      - role: client_admin
        where:
          client_admin_email: '{user.email}'
        can:
        - read
      - role: client_viewer
        where:
          viewer_email: '{user.email}'
        can:
        - read
    - name: assets
      description: Assets a client owns and authorises us to monitor
      ownedBy: user
      fields:
      - name: client
        type: select
        required: true
        label: Client
        optionsFrom: collection:clients
      - name: type
        type: select
        required: true
        label: Asset type
        options:
        - value: domain
          label: Domain
        - value: website
          label: Website
        - value: email_domain
          label: Email domain
        - value: ip_range
          label: IP range
      - name: value
        type: text
        required: true
        label: Asset (domain, URL or CIDR)
      - name: software
        type: text
        label: Known software and version (optional)
        help: e.g. nginx 1.18.0. Used only to match known vulnerabilities.
      - name: verification_method
        type: select
        required: true
        label: Ownership check
        options:
        - value: dns_txt
          label: DNS TXT record
        - value: file_manual
          label: File on the site (reviewed by a person)
      - name: verification_token
        type: text
        required: true
        label: Verification token
        help: Invent a long random string, then publish a TXT record on _shieldway.<your domain> with the value shieldway-verify=<token>.
      - name: authorised_by
        type: text
        required: true
        label: Name of the person who authorises monitoring
      - name: authorisation_file
        type: file
        accept:
        - pdf
        - jpg
        - png
        maxMb: 10
        label: Signed authorisation
      - name: status
        type: select
        label: Status
        options:
        - pending
        - verified
        - needs_review
        - rejected
        default: pending
      - name: verified_at
        type: date
        label: Verified on
      - name: technician_email
        type: email
      - name: client_email
        type: email
      - name: client_members
        type: array
        label: Client users with access
      access:
      - role: technician
        where:
          technician_email: '{user.email}'
        can:
        - read
        - write
      - role: client_admin
        where:
          client_members: '{user.email}'
        can:
        - read
      - role: client_viewer
        where:
          client_members: '{user.email}'
        can:
        - read
    - name: findings
      description: Findings from passive external monitoring
      ownedBy: user
      retentionDays: 730
      fields:
      - name: client
        type: text
        label: Client
      - name: asset
        type: text
        label: Asset
      - name: source
        type: select
        label: Source
        options:
        - ct_logs
        - dns
        - email_auth
        - nvd
        - kev
      - name: severity
        type: select
        label: Severity
        options:
        - critical
        - high
        - medium
        - low
        - info
      - name: title
        type: text
        label: Finding
      - name: detail
        type: textarea
        label: Detail
      - name: evidence
        type: textarea
        label: Evidence
      - name: cve
        type: text
        label: CVE
      - name: kev
        type: boolean
        label: In CISA KEV
      - name: first_seen
        type: date
        label: First seen
      - name: status
        type: select
        label: Status
        options:
        - open
        - resolved
        default: open
      - name: technician_email
        type: email
      - name: client_email
        type: email
      - name: client_members
        type: array
      access:
      - role: technician
        where:
          technician_email: '{user.email}'
        can:
        - read
        - write
      - role: client_admin
        where:
          client_members: '{user.email}'
        can:
        - read
      - role: client_viewer
        where:
          client_members: '{user.email}'
        can:
        - read
    - name: tickets
      description: Remediation tickets
      ownedBy: user
      fields:
      - name: client
        type: text
        label: Client
      - name: finding_title
        type: text
        label: Finding
      - name: severity
        type: select
        label: Severity
        options:
        - critical
        - high
        - medium
        - low
        - info
      - name: title
        type: text
        label: Ticket
      - name: explanation
        type: textarea
        label: What it means
      - name: fix_steps
        type: textarea
        label: Fix steps
      - name: status
        type: select
        label: Status
        options:
        - open
        - in_progress
        - closed
        default: open
      - name: assignee_email
        type: email
        label: Assigned to
      - name: resolution_notes
        type: textarea
        label: Resolution notes
      - name: due_date
        type: date
        label: Due
      - name: technician_email
        type: email
      - name: client_email
        type: email
      - name: client_members
        type: array
      access:
      - role: technician
        where:
          technician_email: '{user.email}'
        can:
        - read
        - write
      - role: client_admin
        where:
          client_members: '{user.email}'
        can:
        - read
      - role: client_viewer
        where:
          client_members: '{user.email}'
        can:
        - read
    - name: checklist
      description: Cyber Essentials readiness checklist (not a certification)
      ownedBy: user
      fields:
      - name: client
        type: select
        required: true
        label: Client
        optionsFrom: collection:clients
      - name: control
        type: select
        required: true
        label: Control
        options:
        - value: firewalls
          label: Firewalls
        - value: secure_configuration
          label: Secure configuration
        - value: access_control
          label: User access control
        - value: malware_protection
          label: Malware protection
        - value: update_management
          label: Security update management
      - name: status
        type: select
        required: true
        label: Status
        options:
        - not_started
        - in_progress
        - met
        - not_met
      - name: evidence
        type: textarea
        label: Evidence
      - name: reviewed_on
        type: date
        label: Reviewed on
      - name: technician_email
        type: email
        label: Technician email
      - name: client_members
        type: array
        label: Client users with access (emails)
      access:
      - role: technician
        where:
          technician_email: '{user.email}'
        can:
        - read
        - write
      - role: client_admin
        where:
          client_members: '{user.email}'
        can:
        - read
      - role: client_viewer
        where:
          client_members: '{user.email}'
        can:
        - read
    - name: reports
      description: Monthly security reports with score
      ownedBy: user
      fields:
      - name: client
        type: text
        label: Client
      - name: month
        type: text
        label: Month
      - name: score
        type: number
        label: Score
      - name: open_critical
        type: number
        label: Open critical
      - name: summary
        type: textarea
        label: Summary
      - name: body
        type: textarea
        label: Report
      - name: technician_email
        type: email
      - name: client_email
        type: email
      - name: client_members
        type: array
      access:
      - role: technician
        where:
          technician_email: '{user.email}'
        can:
        - read
      - role: client_admin
        where:
          client_members: '{user.email}'
        can:
        - read
      - role: client_viewer
        where:
          client_members: '{user.email}'
        can:
        - read
  views:
  - key: home
    type: page
    title: Shieldway
    nav: false
    sections:
    - type: hero
      eyebrow: For MSPs and small businesses
      title: Know what attackers can see, and **fix it** first.
      text: Register the domains, websites and networks you own, prove ownership, and Shieldway watches them from the outside
        with public sources. Every finding becomes a clear ticket your technician can close, and every month you get a security
        score by email.
      actions:
      - label: Get started
        href: /login
        style: primary
      - label: How it works
        href: '#how'
        style: ghost
      note: Passive monitoring only. We never scan systems you have not authorised.
    - type: steps
      id: how
      title: How it works
      items:
      - title: Add clients and assets
        text: MSPs add client organisations; businesses can sign up directly. Each asset is confirmed with a DNS record and
          a written authorisation.
      - title: We monitor from outside
        text: Certificate logs, DNS, SPF and DMARC, and known vulnerabilities from NVD and the CISA KEV list.
      - title: Findings become tickets
        text: An agent drafts severity, a plain-English explanation and fix steps. Your technician assigns and closes them.
      - title: Monthly score
        text: Clients get a monthly email report with a security score and Cyber Essentials readiness.
    - type: cards
      id: checks
      title: What we check
      items:
      - title: Certificates and subdomains
        text: Certificate transparency logs show forgotten or unexpected hosts.
      - title: Email security
        text: SPF and DMARC configuration that stops spoofing.
        badge: ✉️
      - title: Known vulnerabilities
        text: NVD CVEs for the software you declare, flagged when listed as actively exploited by CISA.
      - title: Cyber Essentials readiness
        text: A checklist of the five controls. Certification itself is issued by an accredited body.
    - type: cards
      id: pricing
      title: Pricing
      items:
      - title: Through an MSP
        text: £5 per device per month, billed to your MSP.
      - title: Direct
        text: Plans from £99 per month for small businesses.
    - type: note
      content: Shieldway provides external, passive monitoring and a workflow around it. Endpoint agents, network sensors
        and a 24/7 security operations service are separate and not part of this app. Readiness is not certification.
