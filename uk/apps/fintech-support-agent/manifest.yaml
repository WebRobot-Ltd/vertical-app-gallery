apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: querent
  displayName: Querent
  tagline:
    en: AI customer operations for banks, payment firms and lenders.
  description:
    en: An AI agent that answers customers from your own procedures, with references. It looks up status through your APIs,
      hands over to people when it must, and tracks complaints against FCA deadlines.
  langs:
  - en
  defaultLang: en
  timezone: Europe/London
spec:
  pattern: chat
  branding:
    theme: light
    palette:
      primary: '#12283f'
      accent: '#0e8a7d'
      background: '#f6f8fa'
      foreground: '#16202b'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Quer
      color: primary
    - text: ent
      color: accent
    width: wide
  header:
    links:
    - label: How it works
      href: '#how'
    - label: Safeguards
      href: '#safeguards'
    cta:
      label: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Operations admin
      assignedBy: admin_emails
    - key: customer
      label: Customer
      assignedBy: signup
    - key: support
      label: Support agent
      assignedBy: invite
    - key: reviewer
      label: Quality reviewer
      assignedBy: invite
    - key: compliance
      label: Compliance
      assignedBy: invite
  limits:
  - action: chat
    per: user
    max: 80
    window: day
    roles:
    - customer
  agents:
  - key: assistant
    role: main
    description: 'Customer operations agent: answers from the procedures with references, looks up status through the firm''s
      APIs, logs conversations and escalates to humans.'
    profile:
      inline:
        display_name: Querent customer operations agent
        crews:
        - id: assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 14
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are the customer operations assistant of a regulated financial firm (bank, payment firm or lender).
            You talk to the firm''s customers.


            HOW YOU ANSWER

            - Always search the procedures first (search_procedures, then read_procedure). Answer ONLY from them and from
            what the status tools return. Cite the procedure reference and version at the end of the answer, e.g. (Ref: CARD-LOST
            v3). If no procedure covers the question, say so and escalate.

            - Never invent figures, fees, dates or policy. Never give financial, legal or investment advice.

            - Be short, calm and clear. Write in the customer''s language.


            COMMON REQUESTS

            - Card lost or stolen: follow the card procedure, call card_status, tell the customer what happens next, and ALWAYS
            raise an escalation (reason card_lost_or_stolen, urgent) so a human blocks and replaces the card.

            - Disputed payment: follow the dispute procedure, call payment_status, collect date, amount and merchant, then
            raise an escalation (reason money_movement).

            - Address change: point the customer to the ''Change my address'' form; never change records yourself.

            - KYC document upload: point the customer to the ''Upload a document'' form; use kyc_status and list_kyc_documents
            to report status.


            CHECKS THAT NEED A HUMAN

            Each procedure lists steps; steps marked human_check=true must be done by a person: never perform or promise them,
            raise an escalation.


            ALWAYS ESCALATE (raise_escalation, then tell the customer a colleague will contact them and that nothing further
            is done by you)

            - vulnerable customers (bereavement, illness, distress, financial difficulty, difficulty understanding, signs
            of fraud or coercion): reason vulnerable, urgent;

            - any complaint or expression of dissatisfaction with the firm: first log_complaint (call complaint_deadlines
            with the received date YYYY-MM-DD and the kind: payment_services if it is about a payment, card or transfer, else
            other), then raise_escalation with reason complaint. Tell the customer the complaint is recorded, the acknowledgement
            date and the final response date;

            - anything involving moving, refunding, reversing or releasing money;

            - low confidence: you are not sure the procedure applies or the lookup failed.


            AT THE END of every conversation turn that concludes a topic, call log_conversation once with topic, outcome (resolved,
            escalated or open), confidence (0-1), a two-sentence summary and the procedure references used. Never put full
            card numbers, passwords or security answers in any record; if the customer types them, tell them not to share
            them.


            If a lookup tool says the firm''s system is not connected, say you cannot check right now and escalate.'
    goalTemplate: 'Customer email: {email}

      Today is {date}. Reply in the language with ISO code {lang}.

      Conversation so far:

      {history}


      New message from the customer:

      {message}'
    context:
    - key: email
      from: user.email
    appTools:
    - name: search_procedures
      description: Search the firm's procedures, policies, product terms and complaint rules
      action: search
      collection: procedures
      scope: all
    - name: read_procedure
      description: Read one procedure with its steps and which steps need a human
      action: read
      collection: procedures
      scope: all
    - name: card_status
      description: 'Look up the status of the customer''s cards in the core banking system (read only). Query: customer_email.'
      action: http
      http:
        method: GET
        url: https://api.example-bank.com/v1/cards
        allowPath: false
        credential:
          provider: corebank
        attribution: Firm core banking API
    - name: payment_status
      description: 'Look up a payment or disputed transaction (read only). Query: customer_email, optional date and amount.'
      action: http
      http:
        method: GET
        url: https://api.example-bank.com/v1/payments
        allowPath: false
        credential:
          provider: corebank
        attribution: Firm core banking API
    - name: kyc_status
      description: 'Look up the KYC verification status of the customer (read only). Query: customer_email.'
      action: http
      http:
        method: GET
        url: https://api.example-bank.com/v1/kyc
        allowPath: false
        credential:
          provider: corebank
        attribution: Firm core banking API
    - name: list_kyc_documents
      description: The KYC documents this customer has uploaded in the app
      action: read
      collection: kyc_documents
      scope: user
    - name: log_conversation
      description: Record the outcome of this conversation
      action: append
      collection: conversations
      scope: user
    - name: raise_escalation
      description: Hand the case to a human colleague
      action: append
      collection: escalations
      scope: user
    - name: log_complaint
      description: Record a customer complaint with its FCA deadlines
      action: append
      collection: complaints
      scope: user
    - name: complaint_deadlines
      description: 'Compute the acknowledgement, interim and final response dates of a complaint. Args: received (YYYY-MM-DD),
        kind (payment_services or other).'
      action: call
      slot: fca_deadlines
    output: markdown
    limits:
      maxTurns: 14
      maxBudgetUsd: 0.5
  slots:
  - key: fca_deadlines
    description: 'FCA complaint deadlines from the received date: acknowledgement in 3 business days, interim at 4 weeks,
      final response at 8 weeks (15 business days for payment services complaints).'
    timeoutMs: 2000
    example:
      args:
        received: '2026-11-12'
        kind: other
    code: "from datetime import date, timedelta\n\ndef add_bd(d, n):\n    while n > 0:\n        d = d + timedelta(days=1)\n\
      \        if d.weekday() < 5:\n            n -= 1\n    return d\n\ndef main(input):\n    args = input.get('args') or\
      \ {}\n    try:\n        d = date.fromisoformat(str(args.get('received')))\n    except Exception:\n        return {'error':\
      \ 'received must be YYYY-MM-DD'}\n    kind = args.get('kind') or 'other'\n    if kind == 'payment_services':\n     \
      \   final = add_bd(d, 15)\n        rule = '15 business days (payment services)'\n    else:\n        final = d + timedelta(days=56)\n\
      \        rule = '8 weeks (DISP)'\n    return {'received_date': d.isoformat(), 'ack_due': add_bd(d, 3).isoformat(), 'interim_due':\
      \ (d + timedelta(days=28)).isoformat(), 'final_due': final.isoformat(), 'rule': rule}\n"
  data:
    credentials:
    - provider: corebank
      kind: api_key
      scope: org
      label: Core banking API key
      help: A read-only service key from your core banking provider. Set it once in the account page.
    collections:
    - name: procedures
      ownedBy: shared
      searchable: true
      description: Procedures, policies, product terms and complaint rules. Admins keep them on the data page.
      fields:
      - name: reference
        type: text
        required: true
        label: Reference (e.g. CARD-LOST)
      - name: title
        type: text
        required: true
      - name: category
        type: select
        required: true
        options:
        - procedure
        - policy
        - product_terms
        - complaint_rules
      - name: version
        type: text
      - name: summary
        type: textarea
      - name: steps
        type: array
        label: Steps
        fields:
        - name: step
          type: text
        - name: human_check
          type: boolean
          label: Needs a human
        - name: check_note
          type: text
      - name: body
        type: textarea
        label: Full text
      - name: document
        type: file
        accept:
        - pdf
        - docx
        - txt
        - md
        maxMb: 15
    - name: conversations
      ownedBy: user
      retentionDays: 730
      description: One record per concluded conversation, written by the agent
      fields:
      - name: date
        type: date
      - name: customer_email
        type: email
      - name: topic
        type: text
      - name: outcome
        type: select
        options:
        - resolved
        - escalated
        - open
      - name: confidence
        type: number
      - name: summary
        type: textarea
      - name: references
        type: text
      - name: csat
        type: number
        label: Satisfaction 1-5
      - name: assigned_to
        type: email
      access:
      - role: support
        where:
          assigned_to: '{user.email}'
        can:
        - read
      - role: reviewer
      - role: compliance
    - name: escalations
      ownedBy: user
      description: Cases handed to a human
      fields:
      - name: date
        type: date
      - name: customer_email
        type: email
      - name: reason
        type: select
        options:
        - vulnerable
        - complaint
        - money_movement
        - card_lost_or_stolen
        - low_confidence
        - other
      - name: urgent
        type: boolean
      - name: summary
        type: textarea
      - name: status
        type: select
        options:
        - open
        - in_progress
        - closed
        default: open
      - name: assigned_to
        type: email
        label: Assigned to (support agent email)
      - name: resolution_note
        type: textarea
      access:
      - role: support
        where:
          assigned_to: '{user.email}'
        can:
        - read
        - write
      - role: compliance
    - name: complaints
      ownedBy: user
      description: Complaint cases with FCA deadlines
      fields:
      - name: customer_email
        type: email
      - name: summary
        type: textarea
      - name: kind
        type: select
        options:
        - payment_services
        - other
      - name: received_date
        type: date
      - name: ack_due
        type: date
      - name: interim_due
        type: date
      - name: final_due
        type: date
      - name: status
        type: select
        options:
        - received
        - acknowledged
        - resolved
        default: received
      - name: open
        type: boolean
        default: true
      - name: outcome
        type: textarea
      - name: assigned_to
        type: email
      access:
      - role: support
        where:
          assigned_to: '{user.email}'
        can:
        - read
        - write
      - role: compliance
        can:
        - read
        - write
    - name: kyc_documents
      ownedBy: user
      description: Documents uploaded by customers
      fields:
      - name: doc_type
        type: select
        required: true
        options:
        - passport
        - driving_licence
        - proof_of_address
        - other
      - name: document
        type: file
        required: true
        accept:
        - pdf
        - jpg
        - jpeg
        - png
        maxMb: 10
      - name: notes
        type: textarea
      - name: review_status
        type: select
        options:
        - received
        - accepted
        - rejected
        default: received
      access:
      - role: compliance
        can:
        - read
        - write
    - name: address_requests
      ownedBy: user
      description: Address change requests
      fields:
      - name: new_address
        type: textarea
        required: true
      - name: effective_date
        type: date
      - name: status
        type: select
        options:
        - received
        - done
        - rejected
        default: received
    - name: reviews
      ownedBy: user
      description: Quality reviews of sampled conversations (the reviewer's own records)
      fields:
      - name: conversation_ref
        type: text
        required: true
        label: Conversation (date and customer email)
      - name: accuracy
        type: number
        required: true
        label: Accuracy 1-5
      - name: procedure_followed
        type: boolean
      - name: escalation_correct
        type: boolean
      - name: tone
        type: number
        label: Tone 1-5
      - name: comments
        type: textarea
      access:
      - role: compliance
  views:
  - key: home
    type: page
    title: Querent
    nav: false
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow: For banks, payment firms and lenders
      title: Customer operations that follow **your procedures**.
      text: Querent answers customers from your own procedures with references, looks up status through your APIs and hands
        over to your people for vulnerable customers, complaints and money movement.
      actions:
      - label: Sign in to chat
        href: /login
        style: primary
      aside: '<div style="padding:16px"><b>Customer:</b> I lost my card.<br><br><b>Querent:</b> I have blocked nothing yet.
        A colleague will do it now. Your card shows as active. (Ref: CARD-LOST v3)</div>'
    - type: steps
      id: how
      title: How it works
      items:
      - title: Your rulebook
        text: Admins upload procedures, policies and product terms, and write each procedure as steps, marking the checks
          that need a human.
      - title: The agent answers
        text: Customers chat, send email or call. The agent answers with references and checks status through your configured
          APIs.
      - title: People take over
        text: Cases are escalated to the assigned support agent. Complaints get FCA deadlines and reminders. Reviewers score
          samples.
    - type: cards
      id: safeguards
      title: Safeguards
      items:
      - title: Always escalates
        text: Vulnerable customers, complaints, money movement and low confidence.
      - title: Assigned only
        text: Support agents see only the conversations assigned to them.
      - title: Read-only lookups
        text: The agent never moves money.
    - type: note
      content: Querent supports decisions and does not give financial or legal advice.
  - key: chat
    type: chat
    title: Chat with us
    source: agent:assistant
    examples:
    - I lost my card
    - I do not recognise a payment
    - I want to change my address
    - I want to make a complaint
    placeholder: How can we help?
    roles:
    - customer
    - admin
  - key: kyc_upload
    type: form
    title: Upload a document
    collection: kyc_documents
    fields:
    - doc_type
    - document
    - notes
    submit:
      label: Send
      message: Thank you. Our team will review your document.
    roles:
    - customer
  - key: address_change
    type: form
    title: Change my address
    collection: address_requests
    fields:
    - new_address
    - effective_date
    submit:
      label: Send request
      message: Request received.
    roles:
    - customer
  - key: my_conversations
    type: table
    title: My conversations
    source: collection:conversations
    data:
      display: table
      fields:
      - key: date
        label: Date
        format: date
      - key: topic
        label: Topic
      - key: outcome
        label: Outcome
        format: badge
      - key: summary
        label: Summary
      sort:
        field: date
        dir: desc
    roles:
    - customer
  - key: inbox
    type: table
    title: Escalations
    source: collection:escalations
    data:
      display: table
      fields:
      - key: date
        label: Date
        format: date
      - key: reason
        label: Reason
        format: badge
      - key: urgent
        label: Urgent
      - key: customer_email
        label: Customer
      - key: summary
        label: Summary
      - key: status
        label: Status
        format: badge
      - key: assigned_to
        label: Assigned to
      sort:
        field: date
        dir: desc
    export: true
    roles:
    - support
    - compliance
    - admin
  - key: assign_case
    type: form
    title: Update a case
    collection: escalations
    fields:
    - status
    - assigned_to
    - resolution_note
    edit: true
    submit:
      label: Save
      message: Saved.
    nav: false
    roles:
    - support
    - admin
  - key: complaints_list
    type: table
    title: Complaints
    source: collection:complaints
    data:
      display: table
      fields:
      - key: customer_email
        label: Customer
      - key: kind
        label: Type
        format: badge
      - key: received_date
        label: Received
        format: date
      - key: ack_due
        label: Acknowledge by
        format: date
      - key: final_due
        label: Final response by
        format: date
      - key: status
        label: Status
        format: badge
      - key: assigned_to
        label: Assigned to
      sort:
        field: final_due
        dir: asc
    export: true
    roles:
    - support
    - compliance
    - admin
  - key: review_queue
    type: table
    title: Conversations to review
    source: collection:conversations
    data:
      display: table
      fields:
      - key: date
        label: Date
        format: date
      - key: customer_email
        label: Customer
      - key: topic
        label: Topic
      - key: outcome
        label: Outcome
        format: badge
      - key: confidence
        label: Confidence
      - key: references
        label: References
      - key: summary
        label: Summary
      sort:
        field: date
        dir: desc
      limit: 50
    roles:
    - reviewer
    - compliance
    - admin
  - key: review_form
    type: form
    title: Score a conversation
    collection: reviews
    submit:
      label: Save review
      message: Review saved.
    roles:
    - reviewer
    - admin
  - key: reviews_list
    type: table
    title: My reviews
    source: collection:reviews
    data:
      display: table
      fields:
      - key: conversation_ref
        label: Conversation
      - key: accuracy
        label: Accuracy
      - key: tone
        label: Tone
      - key: comments
        label: Comments
    roles:
    - reviewer
    - compliance
    - admin
  - key: dashboard
    type: page
    title: Dashboard
    roles:
    - admin
    - compliance
    - reviewer
    sections:
    - type: data
      title: Conversations
      source: collection:conversations
      display: kpi
      kpis:
      - label: Conversations
        agg: count
      - label: Average satisfaction
        agg: avg
        field: csat
        format: number
      - label: Average confidence
        agg: avg
        field: confidence
        format: number
    - type: data
      title: Resolution rate
      intro: Outcome of concluded conversations
      source: collection:conversations
      display: chart
      chart: pie
      groupBy:
        field: outcome
        aggs:
        - key: avg_csat
          agg: avg
          field: csat
      fields:
      - key: outcome
        label: Outcome
      - key: count
        label: Conversations
    - type: data
      title: Customer satisfaction by month
      source: collection:conversations
      display: chart
      chart: line
      groupBy:
        field: date
        bucket: month
        aggs:
        - key: avg_csat
          agg: avg
          field: csat
      fields:
      - key: date
        label: Month
      - key: avg_csat
        label: Satisfaction
    - type: data
      title: Escalations by reason
      source: collection:escalations
      display: chart
      chart: bar
      groupBy:
        field: reason
        aggs: []
      fields:
      - key: reason
        label: Reason
      - key: count
        label: Escalations
    - type: data
      title: Complaint deadlines
      intro: Open complaints, nearest final response first
      source: collection:complaints
      display: table
      filters:
      - field: open
        op: '='
        value: true
      sort:
        field: final_due
        dir: asc
      limit: 30
      fields:
      - key: customer_email
        label: Customer
      - key: ack_due
        label: Acknowledge by
        format: date
      - key: final_due
        label: Final response by
        format: date
      - key: status
        label: Status
        format: badge
      - key: assigned_to
        label: Assigned to
      empty: No open complaints.
  - key: account
    type: account
    title: Plan and API key
    roles:
    - admin
  triggers:
  - key: new_escalation
    'on':
      collection: escalations
      op: insert
    notify:
      to: admins
      subject: 'New escalation: {record.reason}'
      body: 'A conversation was escalated ({record.reason}). Summary: {record.summary}

        Assign it to a support agent.'
      link: inbox
  - key: new_complaint
    'on':
      collection: complaints
      op: insert
    notify:
      to:
      - admins
      - role:compliance
      subject: New complaint received
      body: 'A complaint was logged. Acknowledge by {record.ack_due}; final response by {record.final_due}.

        {record.summary}'
      link: complaints_list
  - key: complaint_ack_due
    'on':
      date:
        collection: complaints
        field: ack_due
        offsetDays: 0
        hour: 8
      where:
        status: received
    notify:
      to:
      - admins
      - role:compliance
      subject: Complaint acknowledgement due today
      body: The complaint from {record.customer_email} must be acknowledged today.
      link: complaints_list
  - key: complaint_final_week
    'on':
      date:
        collection: complaints
        field: final_due
        offsetDays: -7
        hour: 8
      where:
        open: true
    notify:
      to:
      - admins
      - role:compliance
      subject: Complaint final response due in 7 days
      body: The complaint from {record.customer_email} needs its final response by {record.final_due}.
      link: complaints_list
  - key: complaint_final_2days
    'on':
      date:
        collection: complaints
        field: final_due
        offsetDays: -2
        hour: 8
      where:
        open: true
    notify:
      to:
      - admins
      - role:compliance
      subject: 'URGENT: complaint final response due in 2 days'
      body: The complaint from {record.customer_email} must be answered by {record.final_due}.
      link: complaints_list
  - key: kyc_received
    'on':
      collection: kyc_documents
      op: insert
    notify:
      to: role:compliance
      subject: New KYC document received
      body: A customer uploaded a {record.doc_type}. Please review it.
      link: inbox
  - key: address_received
    'on':
      collection: address_requests
      op: insert
    notify:
      to: admins
      subject: Address change request
      body: A customer asked to change their address.
      link: inbox
  channels:
  - key: web
    type: web
    agent: assistant
  - key: email
    type: email
    agent: assistant
  - key: phone
    type: phone
    agent: assistant
    greeting: Hello, you have reached customer support. How can I help?
    language: en
  egress:
    hosts:
    - api.example-bank.com
    notes: The firm's own core banking API (read-only lookups). Replace api.example-bank.com with the firm's real API host
      before publishing; the key is set by the admins on the account page.
  billing:
    modes:
    - subscription
    currency: gbp
    plans:
    - key: platform
      price: 499
      interval: month
      label: Querent platform fee
      includes:
      - AI agent on web, email and phone
      - Dashboards, quality review and complaint tracking
  extensions:
  - key: per_resolved_charge
    description: 'The charge per resolved conversation billed to the firm is not available: runtime charges bill the record''s
      owner (the end customer), not the firm. Today only the monthly platform plan is set; usage-based billing per resolved
      conversation needs organisation-level metering.'
  - key: core_banking_depth
    description: Core banking integration is limited to read-only HTTP lookups with one API key (card, payment, KYC status).
      Writes such as blocking a card, reversing a payment or two-way sync need a dedicated connector and stay with human staff.
  - key: email_phone_setup
    description: Inbound email and telephone channels are declared; the inbox address and phone number are set when the channels
      are activated. Callers and senders who have not signed up cannot reach per-customer records, so identity must be matched
      to a signed-in customer first.
  - key: anonymous_website_chat
    description: Chat needs the customer to sign in by magic link, because conversations, escalations and complaints are stored
      in the customer's own records. Anonymous visitors cannot start a regulated case.
  - key: sample_selection
    description: Quality reviewers pick conversations from the review queue by hand. Automatic random sampling is not available
      yet.
