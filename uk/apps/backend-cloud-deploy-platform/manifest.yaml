apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: launchpad
  displayName: Launchpad
  tagline: Describe a backend. Review the code. Deploy it.
  description: 'The web console for Launchpad: projects, AI-drafted backends, deployments, resources, environment variables,
    usage, team roles, alerts, docs and an AI assistant.'
  langs:
  - en
  defaultLang: en
  timezone: Europe/London
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#0f172a'
      accent: '#6366f1'
      background: '#f8fafc'
      foreground: '#0f172a'
    fonts:
      body: Inter
      display: Space Grotesk
      mono: JetBrains Mono
    wordmark:
    - text: Launch
      color: primary
    - text: pad
      color: accent
    width: wide
  header:
    links:
    - label: How it works
      href: '#how'
    - label: Pricing
      href: '#pricing'
    - label: Docs
      href: /v/docs
    cta:
      label: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
      - docs
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: user
      assignedBy: signup
  limits:
  - action: create:projects
    max: 3
    window: total
    plans:
      pro: 50
  - action: agent:codegen
    per: user
    max: 20
    window: day
    roles:
    - user
  - action: agent:assistant
    per: user
    max: 100
    window: day
    roles:
    - user
  agents:
  - key: codegen
    role: main
    description: Drafts backend code, database schema and configuration from a plain-English description.
    profile:
      inline:
        display_name: Launchpad backend drafter
        crews:
        - id: codegen
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.8
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are a senior backend engineer on the Launchpad platform. From a plain-English description you
            draft a backend for the developer to review and commit to their GitHub repository. Use search_docs to check the
            Launchpad CLI, SDK and config conventions before writing config; if the docs do not cover something, say so and
            never invent SDK functions or config keys. Output Markdown starting with a level-1 title "# <Project> — <backend
            in 4 words>". Sections with ## headings: Overview, Files (each file as a heading with its path followed by a fenced
            code block), Database schema (SQL migration), Configuration (launchpad config and the environment variables needed,
            names only, never real secrets), Resources to provision, Review checklist (security, auth, limits, things to verify),
            Commit steps (git commands). Keep it minimal and idiomatic for the chosen runtime. Be explicit about assumptions.
            Never include real credentials.'
    appTools:
    - name: search_docs
      description: Search the Launchpad documentation
      action: search
      collection: docs
      scope: all
    context:
    - key: stack
      from: collection:projects.stack
    - key: region
      from: collection:projects.region
    goalTemplate: 'Project: {project} (runtime {stack}, region {region}).

      Describe the backend wanted:

      {description}

      {?constraints}Constraints: {constraints}{/constraints}

      Today is {date}. Write the draft in English.'
    output: markdown
  - key: assistant
    role: helper
    description: Answers questions using the Launchpad docs.
    profile:
      inline:
        display_name: Launchpad assistant
        chat_mode: true
        crews:
        - id: assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 5
          max_budget_usd: 0.2
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You are the Launchpad support assistant. Always call search_docs first and answer only from what
            the docs say, quoting the relevant command or setting. If the docs do not cover the question, say so and suggest
            contacting support. Never invent CLI flags, SDK methods or prices. Be concise.
    appTools:
    - name: search_docs
      description: Search the Launchpad documentation
      action: search
      collection: docs
      scope: all
    goalTemplate: 'Conversation so far:

      {history}


      New question from {user}: {message}'
    output: markdown
  inputForm:
    title: Draft a backend
    fields:
    - name: project
      type: select
      required: true
      label: Project
      optionsFrom: collection:projects
    - name: description
      type: textarea
      required: true
      maxLength: 3000
      label: What should the backend do?
      help: e.g. A REST API for a todo app with users, lists and tasks, Postgres storage and file attachments.
    - name: constraints
      type: textarea
      maxLength: 600
      label: Constraints (optional)
  data:
    collections:
    - name: projects
      description: Projects created by developers; members and viewers hold the team roles
      ownedBy: user
      fields:
      - name: name
        type: text
        required: true
        label: Project name
      - name: stack
        type: select
        required: true
        label: Runtime
        options:
        - node
        - python
        - go
        - java
      - name: region
        type: select
        required: true
        label: Region
        options:
        - eu-west
        - eu-central
        - us-east
      - name: github_repo
        type: text
        label: GitHub repository (owner/name)
      - name: members
        type: array
        label: Developers (emails)
      - name: viewers
        type: array
        label: Viewers (emails)
      - name: owner_email
        type: email
        label: Owner email
      access:
      - role: user
        where:
          members: '{user.email}'
        can:
        - read
        - write
      - role: user
        where:
          viewers: '{user.email}'
        can:
        - read
    - name: deployments
      description: Deployments reported by the Launchpad infrastructure
      ownedBy: user
      fields:
      - name: deployment_id
        type: text
        label: Deployment
      - name: project
        type: text
        label: Project
      - name: environment
        type: select
        label: Environment
        options:
        - production
        - staging
        - development
      - name: commit
        type: text
        label: Commit
      - name: branch
        type: text
        label: Branch
      - name: status
        type: select
        label: Status
        options:
        - building
        - live
        - failed
        - rolled_back
      - name: build_log
        type: textarea
        label: Build log
      - name: runtime_log
        type: textarea
        label: Runtime log
      - name: created_at
        type: date
        label: Created
      - name: owner_email
        type: email
        label: Owner email
      - name: members
        type: array
        label: Developers
      - name: viewers
        type: array
        label: Viewers
      retentionDays: 90
      access:
      - role: user
        where:
          members: '{user.email}'
        can:
        - read
        - write
      - role: user
        where:
          viewers: '{user.email}'
        can:
        - read
    - name: resources
      description: Provisioned Postgres databases, object storage and secrets (names and status only)
      ownedBy: user
      fields:
      - name: resource_id
        type: text
        label: Resource
      - name: project
        type: text
        label: Project
      - name: kind
        type: select
        label: Type
        options:
        - postgres
        - object_storage
        - secret
      - name: name
        type: text
        label: Name
      - name: status
        type: text
        label: Status
      - name: size
        type: text
        label: Size
      - name: members
        type: array
        label: Developers
      - name: viewers
        type: array
        label: Viewers
      access:
      - role: user
        where:
          members: '{user.email}'
        can:
        - read
        - write
      - role: user
        where:
          viewers: '{user.email}'
        can:
        - read
    - name: env_vars
      description: Environment variables per environment
      ownedBy: user
      fields:
      - name: project
        type: text
        required: true
        label: Project
      - name: environment
        type: select
        required: true
        label: Environment
        options:
        - production
        - staging
        - development
      - name: key
        type: text
        required: true
        label: Name
      - name: value
        type: text
        required: true
        label: Value
      - name: members
        type: array
        label: Developers
      access:
      - role: user
        where:
          members: '{user.email}'
        can:
        - read
        - write
    - name: rollback_requests
      description: Requests to roll a project back to an earlier deployment
      ownedBy: user
      fields:
      - name: project
        type: text
        required: true
        label: Project
      - name: environment
        type: select
        required: true
        label: Environment
        options:
        - production
        - staging
        - development
      - name: deployment_id
        type: text
        required: true
        label: Roll back to deployment
      - name: reason
        type: textarea
        label: Reason
      - name: members
        type: array
        label: Developers
      access:
      - role: user
        where:
          members: '{user.email}'
        can:
        - read
        - write
    - name: usage_daily
      description: Daily requests, CPU, memory and cost per project
      ownedBy: user
      fields:
      - name: project
        type: text
        label: Project
      - name: date
        type: date
        label: Date
      - name: requests
        type: number
        label: Requests
      - name: cpu_hours
        type: number
        label: CPU hours
      - name: memory_gb_hours
        type: number
        label: Memory GB-hours
      - name: cost_gbp
        type: number
        label: Cost (£)
      - name: members
        type: array
        label: Developers
      - name: viewers
        type: array
        label: Viewers
      retentionDays: 400
      access:
      - role: user
        where:
          members: '{user.email}'
        can:
        - read
      - role: user
        where:
          viewers: '{user.email}'
        can:
        - read
    - name: spend_alerts
      description: Raised when spending approaches a limit
      ownedBy: user
      fields:
      - name: project
        type: text
        label: Project
      - name: percent
        type: number
        label: Percent of limit
      - name: spend_gbp
        type: number
        label: Spend (£)
      - name: owner_email
        type: email
        label: Owner email
      retentionDays: 90
    - name: docs
      description: Launchpad documentation, kept by the admins
      ownedBy: shared
      searchable: true
      fields:
      - name: title
        type: text
        label: Title
      - name: section
        type: text
        label: Section
      - name: body
        type: textarea
        label: Content
  views:
  - key: home
    type: page
    nav: false
    title: Launchpad
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow: Backend platform
      title: Describe a backend. **Review the code.** Deploy it.
      text: 'Launchpad hosts your backends. Describe what you need in plain English: an AI agent drafts the code, schema and
        config, you review it and commit to GitHub, and the Launchpad CLI deploys it.'
      actions:
      - label: Get started free
        href: /login
        style: primary
      - label: Read the docs
        href: /v/docs
        style: ghost
      aside: <div style="padding:16px"><b>$ launchpad deploy</b><br>✓ Build passed<br>✓ Migrations applied<br>✓ Live in eu-west</div>
    - type: steps
      id: how
      title: How it works
      items:
      - title: Create a project
        text: Pick a runtime and region and link your GitHub repository.
        badge: 📁
      - title: Describe your backend
        text: The agent drafts code, database schema and configuration for you to review.
        badge: ✨
      - title: Deploy and watch
        text: Track deployments, logs, resources, usage and cost; roll back in one step.
        badge: 🚀
    - type: cards
      id: pricing
      title: Pricing
      items:
      - title: Hobby
        text: Free. Up to 3 projects to try the platform.
        badge: 🌱
      - title: Pro
        text: £20 per user a month plus usage. Up to 50 projects, teams and roles.
        badge: ⚡
      - title: Enterprise
        text: Custom plans, support and security terms. Contact us.
        badge: 🏢
    - type: note
      content: Launchpad console. AI-drafted code must be reviewed before it is committed or deployed.
  - key: new_project
    type: form
    title: New project
    collection: projects
    fields:
    - name
    - stack
    - region
    - github_repo
    submit:
      label: Create project
      message: Project created.
      redirect: projects
    roles:
    - user
    - admin
  - key: projects
    type: cards
    title: Projects
    source: collection:projects
    data:
      display: cards
      fields:
      - key: name
        label: Name
      - key: stack
        label: Runtime
        format: badge
      - key: region
        label: Region
        format: badge
      - key: github_repo
        label: Repository
    roles:
    - user
    - admin
  - key: team
    type: form
    title: Team members
    collection: projects
    fields:
    - members
    - viewers
    edit: true
    submit:
      label: Save team
      message: Team updated.
      redirect: projects
    nav: false
    roles:
    - user
    - admin
  - key: generate
    type: new_run
    title: Draft a backend
    roles:
    - user
    - admin
  - key: drafts
    type: history
    title: My drafts
    source: run
    roles:
    - user
    - admin
  - key: draft
    type: report
    source: run
    printable: true
    nav: false
  - key: deployments
    type: table
    title: Deployments
    source: collection:deployments
    export: true
    data:
      display: table
      fields:
      - key: project
        label: Project
      - key: environment
        label: Env
        format: badge
      - key: commit
        label: Commit
      - key: status
        label: Status
        format: badge
      - key: created_at
        label: Created
        format: date
      - key: build_log
        label: Build log
      - key: runtime_log
        label: Runtime log
      sort:
        field: created_at
        dir: desc
      limit: 100
    roles:
    - user
    - admin
  - key: rollback
    type: form
    title: Roll back
    collection: rollback_requests
    submit:
      label: Request rollback
      message: Rollback requested.
    roles:
    - user
    - admin
  - key: resources_view
    type: table
    title: Resources
    source: collection:resources
    data:
      display: table
      fields:
      - key: project
        label: Project
      - key: kind
        label: Type
        format: badge
      - key: name
        label: Name
      - key: status
        label: Status
        format: badge
      - key: size
        label: Size
    roles:
    - user
    - admin
  - key: env_set
    type: form
    title: Add variable
    collection: env_vars
    submit:
      label: Save variable
      message: Saved.
      redirect: env_list
    nav: false
    roles:
    - user
    - admin
  - key: env_list
    type: table
    title: Environment variables
    source: collection:env_vars
    data:
      display: table
      fields:
      - key: project
        label: Project
      - key: environment
        label: Env
        format: badge
      - key: key
        label: Name
      - key: value
        label: Value
    roles:
    - user
    - admin
  - key: usage
    type: page
    title: Usage
    roles:
    - user
    - admin
    sections:
    - type: data
      title: Totals
      source: collection:usage_daily
      display: kpi
      kpis:
      - label: Requests
        agg: sum
        field: requests
        format: number
      - label: CPU hours
        agg: sum
        field: cpu_hours
        format: number
      - label: Memory GB-hours
        agg: sum
        field: memory_gb_hours
        format: number
      - label: Cost (£)
        agg: sum
        field: cost_gbp
        format: money
    - type: data
      title: Requests per day
      source: collection:usage_daily
      display: chart
      chart: line
      groupBy:
        field: date
        bucket: day
        aggs:
        - key: requests
          agg: sum
          field: requests
      fields:
      - key: date
      - key: requests
    - type: data
      title: Cost per day (£)
      source: collection:usage_daily
      display: chart
      chart: bar
      groupBy:
        field: date
        bucket: day
        aggs:
        - key: cost
          agg: sum
          field: cost_gbp
      fields:
      - key: date
      - key: cost
  - key: assistant_chat
    type: chat
    title: Assistant
    source: agent:assistant
    examples:
    - How do I roll back a deployment?
    - How do I add a Postgres database?
    - How are environment variables set per environment?
    placeholder: Ask about Launchpad…
    roles:
    - user
    - admin
  - key: docs
    type: page
    title: Docs
    sections:
    - type: data
      title: Documentation
      source: collection:docs
      display: list
      fields:
      - key: title
        label: Title
      - key: section
        label: Section
        format: badge
      - key: body
        label: Content
      empty: Documentation is coming soon.
  - key: account
    type: account
    title: Billing
    roles:
    - user
  - key: admin_data
    type: admin
    title: Admin
    roles:
    - admin
  triggers:
  - key: deploy_hook
    'on':
      webhook: true
    write:
      collection: deployments
      fields:
        deployment_id: deployment.id
        project: project
        environment: environment
        commit: commit
        branch: branch
        status: status
        build_log: build_log
        runtime_log: runtime_log
        created_at: created_at
        owner_email: owner_email
        members: members
        viewers: viewers
      keyBy: deployment_id
  - key: resource_hook
    'on':
      webhook: true
    write:
      collection: resources
      fields:
        resource_id: resource.id
        project: project
        kind: kind
        name: name
        status: status
        size: size
        members: members
        viewers: viewers
      keyBy: resource_id
  - key: usage_hook
    'on':
      webhook: true
    write:
      collection: usage_daily
      fields:
        project: project
        date: date
        requests: requests
        cpu_hours: cpu_hours
        memory_gb_hours: memory_gb_hours
        cost_gbp: cost_gbp
        members: members
        viewers: viewers
  - key: spend_hook
    'on':
      webhook: true
    write:
      collection: spend_alerts
      fields:
        project: project
        percent: percent
        spend_gbp: spend_gbp
        owner_email: owner_email
  - key: deploy_failed
    'on':
      collection: deployments
      op: any
      where:
        status: failed
    notify:
      to:
      - record.owner_email
      subject: 'Deployment failed: {record.project}'
      body: The deployment of {record.project} to {record.environment} (commit {record.commit}) failed. Open the console to
        see the build log.
      link: deployments
  - key: spend_near_limit
    'on':
      collection: spend_alerts
      op: insert
    notify:
      to:
      - record.owner_email
      subject: 'Spending alert: {record.project}'
      body: '{record.project} has reached {record.percent}% of its spending limit (£{record.spend_gbp}).'
      link: usage
  - key: rollback_asked
    'on':
      collection: rollback_requests
      op: insert
    notify:
      to: admins
      subject: 'Rollback requested: {record.project}'
      body: 'Rollback of {record.project} ({record.environment}) to deployment {record.deployment_id}. Reason: {record.reason}'
  billing:
    modes:
    - subscription
    - credits
    currency: gbp
    signupCredits: 50
    metering:
      creditEur: 0.01
      markupPct: 50
      drivers:
      - llm_tokens
      - compute
    costs:
      agent:codegen:
        estimate: 10
        metered: true
      agent:assistant: 1
    packs:
    - key: credits_500
      credits: 500
      price: 5
      label: 500 AI credits
    plans:
    - key: pro
      price: 20
      interval: month
      label: Pro (per user, plus usage)
      includes:
      - Up to 50 projects
      - Teams and roles
  notifications:
    emailOnRunDone: true
  egress:
    hosts:
    - api.github.com
    notes: Reserved for GitHub repository links; no calls made by the app today.
  extensions:
  - key: github_signin_commit
    description: 'Sign-in with GitHub (OAuth) and committing the reviewed draft straight to the repository are not available
      yet: sign-in is by email link and the developer commits the draft with the git steps in the report.'
  - key: infra_webhooks
    description: The Launchpad infrastructure must POST to the hooks deploy_hook, resource_hook, usage_hook and spend_hook
      (/api/hooks/<key>), including the owner and the team emails (owner_email, members, viewers) in each payload so records
      reach the right customers.
  - key: rollback_execution
    description: Rollback requests are saved and sent to admins; executing them on the infrastructure needs an integration
      on your side.
  - key: per_project_roles
    description: 'Roles owner, developer and viewer are modelled per project through the members and viewers lists: viewers
      read only, developers read and write, the owner manages the team. Environment variable values are plain text records:
      secret handling should live in your infrastructure.'
  - key: enterprise_plans
    description: Enterprise plans are sold by contact; Stripe plans declared here are Pro only. Usage-based charges beyond
      credits are billed by your infrastructure.
