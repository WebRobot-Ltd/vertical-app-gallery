apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: flexgrid
  displayName: Flexgrid
  tagline: Turn home batteries, EVs and heat pumps into paid grid flexibility.
  description: Virtual power plant software for energy suppliers and device makers. Agents forecast flexibility from device
    data and NESO open data, bid into flexibility markets within each homeowner's limits, and settle every month. Every dispatch
    instruction leaves an audit trail.
  langs:
  - en
  defaultLang: en
  timezone: Europe/London
spec:
  pattern: dashboard
  branding:
    theme: light
    palette:
      primary: '#0b2540'
      accent: '#19a974'
      background: '#f4f8f6'
      foreground: '#12202b'
    fonts:
      body: Inter
      display: Space Grotesk
    wordmark:
    - text: Flex
      color: primary
    - text: grid
      color: accent
    width: wide
  header:
    links:
    - label: How it works
      href: '#how-it-works'
    - label: Who it is for
      href: '#who'
    cta:
      label: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Flexgrid operations
      assignedBy: admin_emails
    - key: trader
      label: Trader
      assignedBy: invite
    - key: partner
      label: Partner
      assignedBy: derived
      from: collection:contracts.partner_email
    - key: homeowner
      label: Homeowner
      assignedBy: derived
      from: collection:enrolments.home_email
  egress:
    hosts:
    - api.neso.energy
    notes: NESO Data Portal (open data, NESO Open Data Licence) for system, demand and flexibility service data. Read only.
  agents:
  - key: forecaster
    role: scheduled
    description: Each morning forecasts the flexibility (kW, by window and region) the fleet can offer, from device state,
      homeowner limits and NESO open data.
    profile:
      inline:
        display_name: Flexgrid forecaster
        crews:
        - id: forecaster
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You forecast the flexibility a virtual power plant can offer to the grid over the next 48 hours.


            Sources: devices (read_devices), latest device state (read_readings: soc_pct, power_kw, plugged_in), homeowners''
            limits (read_limits) and NESO open data (neso_catalog to find a dataset, neso_data to read it; query is the URL
            query string, e.g. resource_id=<id>&limit=100).


            Method: use only homes whose latest limits record has opted_in true. For each home use its most recent limits
            record. Batteries: usable kW is limited by rated power and by state of charge above min_battery_pct. EVs: only
            when plugged in, and only energy that still lets the car reach car_min_charge_pct by car_ready_time. Heat pumps:
            only a conservative reduction. Never count a device without a recent reading (older than 6 hours) or a home with
            a missing limits record. Apply a derating for uncertainty (communications loss, opt-outs).


            For each half-hourly-aligned window of 2 hours and each region (postcode area group), write one record with write_forecast,
            keyed by window_start+region: window_start, window_end (ISO), region, available_kw, confidence (low|medium|high),
            basis (one sentence: devices counted, NESO signal used). Also record how many homes and devices were counted.


            Never invent device data or NESO figures; if data is missing, forecast less and say so in basis. Finish with a
            short Markdown report starting with ''# Flexibility forecast — <date>'' with a table of the next 24 hours and
            any data-quality problems.'
          mcp_servers: []
    goalTemplate: Today is {date}. Forecast fleet flexibility for the next 48 hours and write the forecast records. Report
      in English.
    output: markdown
    limits:
      maxTurns: 30
      maxBudgetUsd: 1.0
    appTools:
    - name: read_devices
      description: Read the registered devices (kind, power_kw, capacity_kwh, home_email, partner_email, status)
      action: read
      collection: devices
      scope: all
    - name: read_readings
      description: Read the latest state of each device (soc_pct, power_kw, plugged_in, ts)
      action: read
      collection: device_readings
      scope: all
    - name: read_limits
      description: Read the homeowners' limits and opt-in status
      action: read
      collection: limits
      scope: all
    - name: write_forecast
      description: Write or update a flexibility forecast record
      action: write
      collection: flex_forecast
      scope: all
    - name: neso_catalog
      description: Search the NESO open data catalogue (package_search); pass q=<keywords> as query
      action: http
      http:
        method: GET
        url: https://api.neso.energy/api/3/action/package_search
        allowPath: false
        attribution: NESO Open Data Licence
    - name: neso_data
      description: Read rows of a NESO dataset (datastore_search); pass resource_id=<id>&limit=<n> as query
      action: http
      http:
        method: GET
        url: https://api.neso.energy/api/3/action/datastore_search
        allowPath: false
        attribution: NESO Open Data Licence
  - key: bidder
    role: scheduled
    description: Builds bids from the forecast and the homeowners' limits; bids above the approval size wait for a trader.
    awaits:
    - large_bid
    profile:
      inline:
        display_name: Flexgrid bidder
        crews:
        - id: bidder
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You prepare market bids for a virtual power plant. Flexgrid already holds the market accession and
            qualification; you only prepare bids that the platform''s market connector submits.


            Inputs: the forecast (read_forecast), homeowners'' limits (read_limits), devices (read_devices), existing bids
            (read_bids) and NESO open data on prices and requirements (neso_catalog, neso_data).


            Rules:

            1. Bid only kW that the forecast shows AND that respect every homeowner limit (opt-in, minimum battery charge,
            car-ready time, maximum events per week). Never bid more than 80% of forecast available_kw and never into a window
            where a bid already exists for the same region.

            2. Choose the market that fits the window (NESO services or distribution network flexibility tenders) from NESO
            data; state the reasoning in rationale. Price from published clearing prices; if none are available, do not guess:
            write no bid and say why.

            3. Write each bid with write_bid: market, window_start, window_end, region, size_kw, price_gbp_mwh, rationale,
            and the forecast window it relies on.

            4. APPROVAL SIZE: any bid with size_kw of 1000 (1 MW) or more MUST get status ''awaiting_approval'' and then you
            call request_large_bid with the bid details. Smaller bids get status ''queued_for_submission''.

            5. When you are told a large bid was approved, set its status to ''queued_for_submission''; if rejected, ''rejected''.
            You never change a bid already submitted or awarded.


            Finish with a Markdown report starting ''# Bids — <date>'' listing each bid, its status and reasoning, and windows
            skipped.'
          mcp_servers: []
    goalTemplate: Today is {date}. Prepare bids for the next day-ahead windows from the current forecast. Report in English.
    output: markdown
    limits:
      maxTurns: 30
      maxBudgetUsd: 1.0
    appTools:
    - name: read_forecast
      description: Read the flexibility forecast records
      action: read
      collection: flex_forecast
      scope: all
    - name: read_limits
      description: Read the homeowners' limits and opt-in status
      action: read
      collection: limits
      scope: all
    - name: read_devices
      description: Read the registered devices (kind, power_kw, capacity_kwh, home_email, partner_email, status)
      action: read
      collection: devices
      scope: all
    - name: read_bids
      description: Read existing bids
      action: read
      collection: bids
      scope: all
    - name: write_bid
      description: Create or update a bid record
      action: write
      collection: bids
      scope: all
    - name: neso_catalog
      description: Search the NESO open data catalogue (package_search); pass q=<keywords> as query
      action: http
      http:
        method: GET
        url: https://api.neso.energy/api/3/action/package_search
        allowPath: false
        attribution: NESO Open Data Licence
    - name: neso_data
      description: Read rows of a NESO dataset (datastore_search); pass resource_id=<id>&limit=<n> as query
      action: http
      http:
        method: GET
        url: https://api.neso.energy/api/3/action/datastore_search
        allowPath: false
        attribution: NESO Open Data Licence
  - key: dispatcher
    role: helper
    description: When a bid is awarded, selects devices within limits, queues dispatch instructions and logs an audit entry
      for every step. Also handles homeowner opt-outs.
    profile:
      inline:
        display_name: Flexgrid dispatcher
        crews:
        - id: dispatcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 40
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You turn an awarded market bid into device dispatch instructions, and you keep the audit trail.


            For an awarded bid (read_bids): list candidate devices (read_devices) in the bid''s region whose home has opted_in
            and a limits record (read_limits). For each device check the LATEST reading (read_readings): reading not older
            than 2 hours; battery state of charge stays above min_battery_pct after delivering the energy; EV plugged in and
            able to reach car_min_charge_pct by car_ready_time; the home has not reached max_events_per_week (count its instructions
            this week with read_instructions); no opt-out exists for it. Select devices until the awarded kW is covered, with
            a 10% reserve. Never exceed a device''s power_kw.


            For each selected device create an instruction with append_instruction: bid_id, device_ref, home_email, partner_email,
            kw, start, end, status ''scheduled'', limits_check (the numbers you checked: soc, min, ready time). IMMEDIATELY
            after, append_audit: instruction_id, bid_id, home_email, partner_email, at (now, ISO), actor ''dispatcher agent'',
            action ''instruction_created'', detail with the limits snapshot. Also audit devices you REJECTED, with action
            ''device_excluded'' and the reason. If you cannot cover the awarded kW, audit ''shortfall'' and say so in your
            report so a trader can act.


            Opt-out (when the goal names an opt-out): find the instruction (read_instructions), set its status to ''opted_out''
            via update_instruction, append_audit with actor ''homeowner'' and action ''opted_out'' (include the reason), then
            try to replace the lost kW with other eligible devices following the same checks; audit that too. If you cannot,
            audit ''shortfall''.


            Never contact devices yourself: the platform''s device connector executes ''scheduled'' instructions at their
            start time. Never alter or delete audit entries. Finish with a short Markdown report starting ''# Dispatch — <bid
            or event>''.'
          mcp_servers: []
    goalTemplate: 'Today is {date}. Handle this event: {event}'
    output: markdown
    limits:
      maxTurns: 40
      maxBudgetUsd: 1.0
    appTools:
    - name: read_bids
      description: Read existing bids
      action: read
      collection: bids
      scope: all
    - name: write_bid
      description: Create or update a bid record
      action: write
      collection: bids
      scope: all
    - name: read_devices
      description: Read the registered devices (kind, power_kw, capacity_kwh, home_email, partner_email, status)
      action: read
      collection: devices
      scope: all
    - name: read_limits
      description: Read the homeowners' limits and opt-in status
      action: read
      collection: limits
      scope: all
    - name: read_readings
      description: Read the latest state of each device (soc_pct, power_kw, plugged_in, ts)
      action: read
      collection: device_readings
      scope: all
    - name: read_instructions
      description: Read dispatch instructions
      action: read
      collection: dispatch_instructions
      scope: all
    - name: append_instruction
      description: Create a new dispatch instruction
      action: append
      collection: dispatch_instructions
      scope: all
    - name: update_instruction
      description: Update an existing dispatch instruction (status)
      action: write
      collection: dispatch_instructions
      scope: all
    - name: append_audit
      description: Append an entry to the dispatch audit trail (never edited afterwards)
      action: append
      collection: dispatch_audit
      scope: all
  - key: settler
    role: scheduled
    description: Each month computes homeowner earnings and each partner's settlement from market results and contracts.
    profile:
      inline:
        display_name: Flexgrid settlement
        crews:
        - id: settler
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 60
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You prepare the monthly settlement for the previous calendar month.


            Data: market results (read_results: bid_id, period, delivered_kwh, revenue_gbp, delivery_pct), bids, dispatch
            instructions (read_instructions: kw, status, home_email, partner_email, bid_id), enrolments and contracts (read_contracts:
            partner_email, homeowner_share_pct, platform_fee_pct).


            Calculation, per partner, per period (YYYY-MM):

            - gross_gbp = sum of revenue_gbp of results attributable to that partner''s instructions (split each bid''s result
            across its instructions by kW share; ignore instructions with status opted_out or cancelled, and apply the result''s
            delivery_pct).

            - platform_fee_gbp = gross_gbp x platform_fee_pct / 100 (Flexgrid''s revenue share on flexibility income).

            - net = gross_gbp - platform_fee_gbp.

            - homeowner_pool_gbp = net x homeowner_share_pct / 100; partner_share_gbp = net - homeowner_pool_gbp.

            - Per home: earnings_gbp = homeowner_pool_gbp x the home''s delivered kWh share among that partner''s homes; delivered_kwh,
            events count. Write each with write_earning, keyed by home_email+period.

            Write each partner''s figures with write_settlement, keyed by partner_email+period, status ''draft'' (an admin
            reviews and publishes), plus a ''report'' field: a short text of the calculation and any anomalies (missing results,
            shortfalls, delivery below 100%).

            Round to pennies; the home earnings must sum exactly to homeowner_pool_gbp (put the rounding remainder on the
            largest). If a contract is missing, skip that partner and flag it. Never invent revenue; if results for a bid
            are missing, list it as unsettled.

            Finish with a Markdown report starting ''# Settlement — <period>'' with a table per partner and the open issues.'
          mcp_servers: []
    goalTemplate: Today is {date}. Prepare the draft settlement for the previous calendar month. Report in English.
    output: markdown
    limits:
      maxTurns: 60
      maxBudgetUsd: 1.5
    appTools:
    - name: read_results
      description: Read market results (bid_id, period, delivered_kwh, revenue_gbp, delivery_pct)
      action: read
      collection: market_results
      scope: all
    - name: read_bids
      description: Read existing bids
      action: read
      collection: bids
      scope: all
    - name: read_instructions
      description: Read dispatch instructions
      action: read
      collection: dispatch_instructions
      scope: all
    - name: read_contracts
      description: Read partner contracts (revenue shares)
      action: read
      collection: contracts
      scope: all
    - name: read_enrolments
      description: Read the enrolled customers
      action: read
      collection: enrolments
      scope: all
    - name: write_earning
      description: Write or update a homeowner's monthly earnings record
      action: write
      collection: earnings
      scope: all
    - name: write_settlement
      description: Write or update a partner's monthly settlement
      action: write
      collection: settlements
      scope: all
  approvals:
  - key: large_bid
    title: Approve large bid
    description: Bids of 1 MW or more need a trader's approval before submission.
    role: trader
    fields:
    - market
    - window_start
    - window_end
    - region
    - size_kw
    - price_gbp_mwh
    - rationale
    timeoutMinutes: 240
    onTimeout: reject
  data:
    collections:
    - name: contracts
      ownedBy: org
      description: 'Partner contracts: revenue share terms. Filled by the admins.'
      fields:
      - name: partner_name
        type: text
        required: true
      - name: partner_email
        type: email
        required: true
      - name: platform_fee_pct
        type: number
        required: true
        help: Flexgrid's share of flexibility income, %
      - name: homeowner_share_pct
        type: number
        required: true
        help: Share of net income passed to homeowners, %
      - name: start_date
        type: date
      access:
      - role: partner
        where:
          partner_email: '{user.email}'
        can:
        - read
    - name: enrolments
      ownedBy: org
      description: Customers a partner has enrolled. A homeowner holds the homeowner role while a record names their email.
      fields:
      - name: home_email
        type: email
        required: true
      - name: home_name
        type: text
      - name: partner_email
        type: email
        required: true
      - name: postcode_district
        type: text
        required: true
      - name: status
        type: select
        options:
        - active
        - paused
        - left
        default: active
      access:
      - role: partner
        where:
          partner_email: '{user.email}'
        can:
        - read
        - write
      - role: homeowner
        where:
          home_email: '{user.email}'
        can:
        - read
    - name: limits
      ownedBy: org
      description: Each homeowner's limits the agents respect in every bid and dispatch.
      fields:
      - name: home_email
        type: email
        required: true
      - name: opted_in
        type: boolean
        default: true
        label: Take part in flexibility events
      - name: min_battery_pct
        type: number
        label: Minimum battery charge (%)
        default: 20
      - name: car_ready_time
        type: text
        label: Car ready by (HH:MM)
        default: 07:00
      - name: car_min_charge_pct
        type: number
        label: Car charge needed by then (%)
        default: 80
      - name: max_events_per_week
        type: number
        label: Maximum events per week
        default: 4
      - name: notes
        type: textarea
        maxLength: 400
      access:
      - role: homeowner
        where:
          home_email: '{user.email}'
        can:
        - read
        - write
    - name: devices
      ownedBy: org
      description: Home batteries, EV chargers and heat pumps, registered by the partner.
      fields:
      - name: home_email
        type: email
        required: true
      - name: partner_email
        type: email
        required: true
      - name: kind
        type: select
        required: true
        options:
        - battery
        - ev
        - heat_pump
      - name: manufacturer
        type: text
        required: true
      - name: device_ref
        type: text
        required: true
        help: The id used by the manufacturer's API
      - name: power_kw
        type: number
        required: true
      - name: capacity_kwh
        type: number
      - name: status
        type: select
        options:
        - active
        - offline
        - retired
        default: active
      access:
      - role: partner
        where:
          partner_email: '{user.email}'
        can:
        - read
        - write
      - role: homeowner
        where:
          home_email: '{user.email}'
        can:
        - read
    - name: device_readings
      ownedBy: org
      description: Latest state of each device, posted by the device connector on a webhook.
      retentionDays: 90
      fields:
      - name: device_ref
        type: text
        required: true
      - name: soc_pct
        type: number
      - name: power_kw
        type: number
      - name: plugged_in
        type: boolean
      - name: ts
        type: text
    - name: flex_forecast
      ownedBy: app
      description: Forecast flexibility by window and region, written by the forecaster.
      fields:
      - name: window_start
        type: text
      - name: window_end
        type: text
      - name: region
        type: text
      - name: available_kw
        type: number
      - name: confidence
        type: select
        options:
        - low
        - medium
        - high
      - name: basis
        type: textarea
    - name: bids
      ownedBy: org
      description: Market bids prepared by the bidder.
      fields:
      - name: market
        type: text
      - name: window_start
        type: text
      - name: window_end
        type: text
      - name: region
        type: text
      - name: size_kw
        type: number
      - name: price_gbp_mwh
        type: number
      - name: status
        type: select
        options:
        - awaiting_approval
        - queued_for_submission
        - submitted
        - awarded
        - lost
        - rejected
      - name: rationale
        type: textarea
      access:
      - role: trader
        can:
        - read
        - write
    - name: dispatch_instructions
      ownedBy: org
      description: Instructions to devices, executed by the device connector.
      fields:
      - name: bid_id
        type: text
      - name: device_ref
        type: text
      - name: home_email
        type: email
      - name: partner_email
        type: email
      - name: kw
        type: number
      - name: start
        type: text
      - name: end
        type: text
      - name: status
        type: select
        options:
        - scheduled
        - sent
        - acknowledged
        - completed
        - opted_out
        - failed
        - cancelled
      - name: limits_check
        type: textarea
      access:
      - role: partner
        where:
          partner_email: '{user.email}'
        can:
        - read
      - role: homeowner
        where:
          home_email: '{user.email}'
        can:
        - read
      - role: trader
        can:
        - read
    - name: dispatch_audit
      ownedBy: org
      description: 'Append-only audit trail of every dispatch instruction: who, what, when, and the limits checked.'
      fields:
      - name: instruction_id
        type: text
      - name: bid_id
        type: text
      - name: home_email
        type: email
      - name: partner_email
        type: email
      - name: at
        type: text
      - name: actor
        type: text
      - name: action
        type: text
      - name: detail
        type: textarea
      access:
      - role: partner
        where:
          partner_email: '{user.email}'
        can:
        - read
      - role: homeowner
        where:
          home_email: '{user.email}'
        can:
        - read
      - role: trader
        can:
        - read
    - name: optouts
      ownedBy: org
      description: Homeowners opting out of a dispatch event.
      fields:
      - name: home_email
        type: email
        required: true
      - name: instruction_id
        type: text
        required: true
        help: The instruction id shown on the event
      - name: reason
        type: textarea
        maxLength: 300
      access:
      - role: homeowner
        where:
          home_email: '{user.email}'
        can:
        - read
      - role: trader
        can:
        - read
    - name: market_results
      ownedBy: org
      description: Delivered volumes and revenue per bid, entered by admins from the market statements (CSV).
      fields:
      - name: bid_id
        type: text
        required: true
      - name: period
        type: text
        required: true
        help: YYYY-MM
      - name: delivered_kwh
        type: number
      - name: revenue_gbp
        type: number
      - name: delivery_pct
        type: number
    - name: earnings
      ownedBy: org
      description: Monthly earnings per homeowner.
      fields:
      - name: home_email
        type: email
      - name: partner_email
        type: email
      - name: period
        type: text
      - name: events
        type: number
      - name: delivered_kwh
        type: number
      - name: earnings_gbp
        type: number
      access:
      - role: homeowner
        where:
          home_email: '{user.email}'
        can:
        - read
      - role: partner
        where:
          partner_email: '{user.email}'
        can:
        - read
    - name: settlements
      ownedBy: org
      description: 'Monthly settlement per partner: gross income, Flexgrid revenue share, homeowner pool and partner share.'
      fields:
      - name: partner_email
        type: email
      - name: period
        type: text
      - name: gross_gbp
        type: number
      - name: platform_fee_gbp
        type: number
      - name: homeowner_pool_gbp
        type: number
      - name: partner_share_gbp
        type: number
      - name: status
        type: select
        options:
        - draft
        - published
        - paid
        default: draft
      - name: report
        type: textarea
      access:
      - role: partner
        where:
          partner_email: '{user.email}'
        can:
        - read
  views:
  - key: home
    type: page
    title: Flexgrid
    nav: false
    sections:
    - type: hero
      title: Turn home batteries, EVs and heat pumps into **paid grid flexibility**.
      text: Flexgrid aggregates devices from energy suppliers and device makers into one virtual power plant. AI agents forecast,
        bid and dispatch within every homeowner's limits, with a full audit trail.
      actions:
      - label: Sign in
        href: /login
        style: primary
      - label: How it works
        href: '#how-it-works'
        style: ghost
      band: true
    - type: steps
      id: how-it-works
      title: How it works
      items:
      - title: Partners enrol customers
        text: Suppliers and device makers register customers and their devices. Homeowners join for free through their partner.
      - title: Homeowners set their limits
        text: Minimum battery charge, car-ready time, events per week. Every bid and dispatch respects them.
      - title: Agents forecast and bid
        text: Flexibility is forecast from device data and NESO open data. Large bids wait for a trader's approval.
      - title: Dispatch, audit, settle
        text: Every instruction is logged. Each month earnings are shared between homeowners and partners by contract.
    - type: cards
      id: who
      title: Who it is for
      items:
      - title: Homeowners
        text: See your earnings, upcoming events and opt out of any event.
        badge: 🏠
      - title: Partners
        text: See your fleet's dispatch, audit trail and monthly revenue.
        badge: 🔌
      - title: Traders
        text: Review forecasts and approve bids above the set size.
        badge: 📈
    - type: note
      content: Flexgrid is software around Flexgrid's own market accession and qualification. Earnings depend on market results
        and are not guaranteed.
  - key: my_flex
    type: page
    title: My flexibility
    roles:
    - homeowner
    sections:
    - type: data
      title: Earnings
      source: collection:earnings
      display: kpi
      kpis:
      - label: Total earned
        agg: sum
        field: earnings_gbp
        format: money
      - label: Energy delivered (kWh)
        agg: sum
        field: delivered_kwh
        format: number
      - label: Events
        agg: sum
        field: events
        format: number
    - type: data
      title: Upcoming and recent events
      intro: Copy an event's id to opt out of it.
      source: collection:dispatch_instructions
      display: table
      fields:
      - key: id
        label: Event id
      - key: start
        label: Start
      - key: end
        label: End
      - key: device_ref
        label: Device
      - key: kw
        label: kW
        format: number
      - key: status
        label: Status
        format: badge
      sort:
        field: start
        dir: desc
      limit: 20
      empty: No events yet.
    - type: view
      title: Opt out of an event
      view: optout
  - key: my_limits
    type: form
    title: My limits
    roles:
    - homeowner
    collection: limits
    edit: true
    fields:
    - home_email
    - opted_in
    - min_battery_pct
    - car_ready_time
    - car_min_charge_pct
    - max_events_per_week
    - notes
    submit:
      label: Save my limits
      message: Saved. Every future bid and dispatch will respect these limits.
      redirect: my_flex
  - key: optout
    type: form
    title: Opt out of an event
    roles:
    - homeowner
    collection: optouts
    fields:
    - home_email
    - instruction_id
    - reason
    submit:
      label: Opt out
      message: Done. This event will not use your devices.
  - key: earnings
    type: table
    title: Earnings by month
    source: collection:earnings
    roles:
    - homeowner
    - partner
    - admin
    export: true
    data:
      display: table
      fields:
      - key: period
        label: Month
      - key: earned
        label: Earned
        format: money
      - key: kwh
        label: kWh
        format: number
      - key: count
        label: Records
        format: number
      groupBy:
        field: period
        aggs:
        - key: earned
          agg: sum
          field: earnings_gbp
        - key: kwh
          agg: sum
          field: delivered_kwh
  - key: my_devices
    type: table
    title: Devices
    source: collection:devices
    roles:
    - homeowner
    - partner
    - admin
    export: true
    data:
      display: table
      fields:
      - key: home_email
        label: Home
      - key: kind
        label: Type
        format: badge
      - key: manufacturer
        label: Maker
      - key: device_ref
        label: Device id
      - key: power_kw
        label: kW
        format: number
      - key: status
        label: Status
        format: badge
  - key: add_customer
    type: form
    title: Enrol a customer
    roles:
    - partner
    - admin
    collection: enrolments
    fields:
    - home_email
    - home_name
    - partner_email
    - postcode_district
    - status
    submit:
      label: Enrol
      message: Customer enrolled. They can now sign in with this email and set their limits.
  - key: add_device
    type: form
    title: Add a device
    roles:
    - partner
    - admin
    collection: devices
    fields:
    - home_email
    - partner_email
    - kind
    - manufacturer
    - device_ref
    - power_kw
    - capacity_kwh
    - status
    submit:
      label: Add device
      message: Device added.
  - key: customers
    type: table
    title: Customers
    source: collection:enrolments
    roles:
    - partner
    - admin
    export: true
    data:
      display: table
      fields:
      - key: home_name
        label: Name
      - key: home_email
        label: Email
      - key: postcode_district
        label: Area
      - key: status
        label: Status
        format: badge
  - key: dispatch
    type: table
    title: Dispatch
    source: collection:dispatch_instructions
    roles:
    - partner
    - trader
    - admin
    export: true
    data:
      display: table
      fields:
      - key: start
        label: Start
      - key: end
        label: End
      - key: home_email
        label: Home
      - key: device_ref
        label: Device
      - key: kw
        label: kW
        format: number
      - key: status
        label: Status
        format: badge
      - key: bid_id
        label: Bid
      sort:
        field: start
        dir: desc
      limit: 200
  - key: audit
    type: table
    title: Audit trail
    source: collection:dispatch_audit
    roles:
    - partner
    - homeowner
    - trader
    - admin
    export: true
    data:
      display: table
      fields:
      - key: at
        label: When
      - key: instruction_id
        label: Instruction
      - key: actor
        label: Actor
      - key: action
        label: Action
        format: badge
      - key: detail
        label: Detail
      sort:
        field: at
        dir: desc
      limit: 200
  - key: revenue
    type: table
    title: Revenue and settlements
    source: collection:settlements
    roles:
    - partner
    - admin
    export: true
    data:
      display: table
      fields:
      - key: period
        label: Month
      - key: gross_gbp
        label: Gross income
        format: money
      - key: platform_fee_gbp
        label: Flexgrid share
        format: money
      - key: homeowner_pool_gbp
        label: Homeowners
        format: money
      - key: partner_share_gbp
        label: Your share
        format: money
      - key: status
        label: Status
        format: badge
      sort:
        field: period
        dir: desc
  - key: forecast
    type: table
    title: Flexibility forecast
    source: collection:flex_forecast
    roles:
    - trader
    - partner
    - admin
    data:
      display: chart
      chart: bar
      fields:
      - key: window_start
        label: Window
      - key: available_kw
        label: Available kW
      sort:
        field: window_start
        dir: asc
      limit: 48
  - key: bids
    type: table
    title: Bids
    source: collection:bids
    roles:
    - trader
    - admin
    export: true
    data:
      display: table
      fields:
      - key: window_start
        label: Window
      - key: market
        label: Market
      - key: region
        label: Region
      - key: size_kw
        label: kW
        format: number
      - key: price_gbp_mwh
        label: £/MWh
        format: money
      - key: status
        label: Status
        format: badge
      - key: rationale
        label: Why
      sort:
        field: window_start
        dir: desc
      limit: 100
  - key: approvals
    type: approvals
    title: Bids to approve
    roles:
    - trader
    - admin
    approvals:
    - large_bid
  schedules:
  - agent: forecaster
    action: run
    cron: 30 5 * * *
    owner: app
    goal: Today is {date}. Forecast fleet flexibility for the next 48 hours and write the forecast records.
  - agent: bidder
    action: run
    cron: 30 6 * * *
    owner: app
    goal: Today is {date}. Prepare bids for the next day-ahead windows from the current forecast.
  - agent: settler
    action: run
    cron: 0 6 2 * *
    owner: app
    goal: Today is {date}. Prepare the draft settlement for the previous calendar month.
  triggers:
  - key: device_reading
    description: Device connector posts the latest state of a device
    'on':
      webhook: true
    write:
      collection: device_readings
      fields:
        device_ref: device_ref
        soc_pct: soc_pct
        power_kw: power_kw
        plugged_in: plugged_in
        ts: ts
      keyBy: device_ref
  - key: bid_needs_approval
    'on':
      collection: bids
      op: insert
      where:
        status: awaiting_approval
    notify:
      to: role:trader
      subject: 'Bid awaiting approval: {record.size_kw} kW'
      body: A bid of {record.size_kw} kW in {record.market} for {record.window_start} needs your approval.
      link: approvals
  - key: large_bid_approved
    'on':
      approval: large_bid
      decision: approved
    start:
      agent: bidder
    goal: 'A large bid was approved: {event}. Set it to queued_for_submission and report.'
    asUser: false
  - key: bid_awarded
    'on':
      collection: bids
      op: update
      where:
        status: awarded
    start:
      agent: dispatcher
    goal: Bid {record.id} was awarded ({record.size_kw} kW, {record.window_start} to {record.window_end}, region {record.region}).
      Create dispatch instructions within all limits and audit every step.
    asUser: false
  - key: event_notice
    'on':
      collection: dispatch_instructions
      op: insert
      where:
        status: scheduled
    notify:
      to: record.home_email
      subject: Flexgrid event {record.start}
      body: Your device {record.device_ref} will help the grid from {record.start} to {record.end}. You can opt out any time
        before it starts in the Flexgrid app.
      link: my_flex
  - key: homeowner_opted_out
    'on':
      collection: optouts
      op: insert
    start:
      agent: dispatcher
    goal: 'A homeowner opted out: instruction {record.instruction_id}, home {record.home_email}, reason {record.reason}. Cancel
      it, audit it and replace the lost kW if possible.'
    asUser: false
  - key: settlement_published
    'on':
      collection: settlements
      op: update
      where:
        status: published
    notify:
      to: record.partner_email
      subject: Your Flexgrid settlement for {record.period}
      body: 'Your settlement for {record.period} is ready: gross income {record.gross_gbp}, your share {record.partner_share_gbp}.'
      link: revenue
  notifications:
    emailOnRunDone: false
  billing:
    modes:
    - free
  mobile:
    appId: com.flexgrid.home
    appName: Flexgrid
    capabilities:
    - name: push
  extensions:
  - key: device_control_connector
    description: Executing 'scheduled' dispatch instructions through each manufacturer's IoT API (and posting readings to
      the device_reading webhook, updating instruction status sent/acknowledged/completed) is Flexgrid's own connector; the
      app only holds the instructions and the audit trail.
  - key: market_submission_connector
    description: Submitting 'queued_for_submission' bids to NESO and distribution network flexibility markets, and returning
      awards (bid status awarded/lost) and market statements, uses Flexgrid's own accession; results are loaded into market_results
      by the admins or the connector.
  - key: payouts_and_invoicing
    description: Bank payouts to homeowners, partner invoicing for the revenue share and SMS/WhatsApp event messages are not
      available; the app computes and publishes the settlement figures and sends email and push notifications.
  - key: approval_size
    description: The approval threshold is 1 MW, set in the bidder's instructions; change it there.
