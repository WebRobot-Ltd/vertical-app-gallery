apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: letloop
  displayName: Letloop
  tagline:
    en: Direct lettings between landlords and tenants, with an AI agent at every step.
  description:
    en: Letloop helps landlords list a home, check the EPC and stay on top of Renters' Rights Act duties. It matches tenants
      with suitable listings, books viewings, handles applications and starts the tenancy, then tracks repairs afterwards.
  langs:
  - en
  defaultLang: en
  timezone: Europe/London
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#0f3d3e'
      accent: '#e2725b'
      background: '#faf8f4'
      foreground: '#1c2527'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Let
      color: primary
    - text: loop
      color: accent
    width: wide
  header:
    links:
    - label: How it works
      href: '#how-it-works'
    - label: Pricing
      href: '#pricing'
    cta:
      label: Sign in
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
      - listings_browse
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: landlord
      label: Landlord
      assignedBy: signup
    - key: tenant
      label: Tenant
      assignedBy: signup
  limits:
  - action: agent:matcher
    per: user
    max: 10
    window: day
    roles:
    - tenant
  agents:
  - key: matcher
    role: main
    description: Matches a tenant's profile with the published listings and explains why each one fits.
    profile:
      inline:
        display_name: Letloop matcher
        crews:
        - id: matcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You match tenants with rental listings in the UK. You receive the tenant''s profile (budget, move
            date, employment, household, pets, areas) and you use the search_listings tool to read the published listings.
            Start with a level-1 title "# Your Letloop matches — <date>". Then rank at most 5 listings. For each give a ##
            heading with the area and rent, a fit score out of 10, ''Why it fits'' (budget, bedrooms, move date, furnishing,
            bills, EPC) and ''Check before viewing'' (pets, affordability, anything that does not fit). Typical landlords
            look for monthly rent of about one-thirtieth of annual income or less; mention affordability as a guide, never
            as a rule. Never invent listings or figures: only use what the tool returns. If nothing fits, say so and say what
            to relax. End with a line telling the tenant they can book a viewing from the listing page. Do not give legal
            advice.'
    appTools:
    - name: search_listings
      description: Search the published listings
      action: search
      collection: public_listings
      scope: all
    context:
    - key: profile
      from: collection:tenant_profiles
    goalTemplate: 'Tenant profile (one JSON line per record): {profile}

      {?priorities}Extra priorities: {priorities}{/priorities}

      Today is {date}. Write the report in the language with ISO code {lang}.'
    output: markdown
    limits:
      maxTurns: 10
      maxBudgetUsd: 0.4
  - key: advert_writer
    role: helper
    description: Writes the advert for a new listing, checks the EPC on the public register, publishes it and reminds the
      landlord of their obligations.
    profile:
      inline:
        display_name: Letloop advert writer
        crews:
        - id: advert_writer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You help a UK landlord advertise a property. You get the listing details. Steps: (1) Call epc_lookup
            (GET) with the query parameters postcode and address to find the property''s certificate on the public EPC register.
            Compare the rating the landlord declared with the register. If the register has no match or the call fails, mark
            the EPC as ''not verified'' and say so. Never invent a rating, and flag that a rental needs a valid EPC (usually
            E or above to let). (2) Write an honest, appealing advert of 120-180 words: headline, description, key facts (rent
            pcm, deposit, bedrooms, furnishing, bills, EPC, availability). Do not include the full street address or house
            number in the advert, only the area and postcode district. Do not use discriminatory wording (no ''no DSS'', ''professionals
            only'', ''no children''). (3) Call publish_listing once with: listing_ref (a short slug from postcode district
            and address), headline, advert, area, postcode_district, rent, deposit, bedrooms, furnishing, bills, epc_rating,
            epc_verified (true/false), available_from, landlord_email, status ''published''. (4) Write the report. Start with
            "# Advert — <area>, <bedrooms> bed". Sections: ## Advert, ## EPC check, ## Your obligations. In the obligations
            section give a short checklist under the Renters'' Rights Act 2025 as it applies in England: assured periodic
            tenancies with no fixed term and no section 21 evictions; possession only on the statutory grounds; rent increases
            once a year by a formal notice only, with a rent asked at the advertised price and no bidding; no more than one
            month''s rent in advance; no discrimination against tenants with children or on benefits; considering pet requests
            reasonably; registration on the Private Rented Sector database and landlord ombudsman membership; the written
            statement of terms; the how-to-rent guide, gas safety certificate, EICR and smoke and carbon monoxide alarms;
            deposit capped at five weeks'' rent and protected in a government-approved scheme within 30 days; Right to Rent
            checks before the tenancy. Say that dates and details should be checked on gov.uk and that this is guidance, not
            legal advice. Mention that referencing, Right to Rent checks, e-signing, deposit registration and rent collection
            run through licensed partners, not through you.'
    appTools:
    - name: epc_lookup
      description: Search the public EPC register for domestic certificates by postcode and address
      action: http
      http:
        method: GET
        url: https://get-energy-performance-data.communities.gov.uk/api/domestic/search
        allowPath: false
        attribution: EPC register data, MHCLG, Open Government Licence v3.0
        credential:
          provider: epc_register
          header: Authorization
          format: Bearer {secret}
    - name: publish_listing
      description: Create or update the public advert of a listing
      action: write
      collection: public_listings
      scope: all
    context:
    - key: landlord_email
      from: user.email
    output: markdown
    limits:
      maxTurns: 10
      maxBudgetUsd: 0.5
  - key: application_assistant
    role: helper
    description: Summarises a new application for the landlord and links it to the landlord.
    profile:
      inline:
        display_name: Letloop application assistant
        crews:
        - id: application_assistant
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You process a tenant''s application for a UK rental. Call find_listing to read the published listing
            named in the application (listing_ref) and get its landlord_email. Then call update_application on the application
            matching that listing and tenant_email, setting landlord_email, summary (3 sentences on affordability against
            the rent, move-in date and household, neutral and factual, never using protected characteristics) and status ''ready_for_review''.
            Then write a short report starting with "# Application — <area>" listing the summary and the next steps: referencing
            with credit check through the licensed referencing partner, and a Right to Rent check following gov.uk guidance
            through the certified ID partner. You do not run credit or identity checks yourself and you never decide for the
            landlord.'
    appTools:
    - name: find_listing
      description: Read a published listing
      action: read
      collection: public_listings
      scope: all
    - name: update_application
      description: Update the tenant's own application record
      action: write
      collection: applications
      scope: user
    output: markdown
    limits:
      maxTurns: 6
      maxBudgetUsd: 0.3
  - key: agreement_drafter
    role: helper
    description: Drafts the tenancy agreement and the start-of-tenancy checklist.
    profile:
      inline:
        display_name: Letloop agreement drafter
        crews:
        - id: agreement_drafter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You draft an assured periodic tenancy agreement for England under the Renters'' Rights Act 2025
            from the details you receive (address, tenant, start date, rent, deposit, scheme, rent due day). Start with "#
            Tenancy agreement — <address>". Sections: ## Parties and property, ## Term (periodic, monthly, no fixed term,
            no section 21), ## Rent (amount, due day, annual increase only by formal notice), ## Deposit (capped at five weeks''
            rent, protected in a government-approved scheme within 30 days, prescribed information), ## Tenant and landlord
            responsibilities, ## Pets and repairs, ## Ending the tenancy (statutory grounds, tenant notice), ## Signatures.
            Then ## Start checklist: how-to-rent guide, gas safety, EICR, EPC, alarms, Right to Rent done, referencing done,
            deposit registered, inventory, payment partner set-up. Leave blanks as [ ] when a value is missing; never invent
            figures. State that the draft must be reviewed by the landlord and is signed electronically through the e-signature
            partner, and that this is not legal advice.'
    output: markdown
    limits:
      maxTurns: 6
      maxBudgetUsd: 0.4
  - key: repair_triage
    role: helper
    description: Triages a repair report with photos and informs the landlord.
    profile:
      inline:
        display_name: Letloop repair triage
        crews:
        - id: repair_triage
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 8
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You triage a repair reported by a tenant. If photo file ids are given, open each with read_upload
            and describe what you see. Classify the urgency: emergency (gas smell, no heating in winter, flooding, electrical
            danger, no water, insecure door), urgent (damp and mould, leaks, broken boiler without risk, health hazard), routine.
            Mention that health hazards such as damp and mould must be handled promptly by the landlord. Then call update_repair
            on the repair matching the tenancy and issue, setting urgency (emergency|urgent|routine), triage (2 sentences)
            and status ''triaged''. Finish with a short report starting with "# Repair — <area>, <urgency>" with Findings,
            Suggested next step for the landlord, and What the tenant should do meanwhile. For gas smells tell the tenant
            to call the National Gas Emergency line 0800 111 999. Never promise a repair date.'
    appTools:
    - name: read_upload
      description: Read a photo the tenant uploaded
      action: read_file
    - name: update_repair
      description: Update the tenant's own repair record
      action: write
      collection: repairs
      scope: user
    output: markdown
    limits:
      maxTurns: 8
      maxBudgetUsd: 0.4
  inputForm:
    title: Find my matches
    fields:
    - name: priorities
      type: textarea
      maxLength: 400
      label: Extra priorities (optional)
      help: e.g. near a station, garden, quiet street
  data:
    credentials:
    - provider: epc_register
      kind: api_key
      scope: org
      label:
        en: EPC register API key
      help:
        en: Request an API key from the EPC register service at get-energy-performance-data.communities.gov.uk.
    collections:
    - name: listings
      description: A landlord's own property details
      ownedBy: user
      fields:
      - name: address
        type: text
        required: true
        label: Address
      - name: postcode
        type: text
        required: true
        label: Postcode
      - name: rent
        type: number
        required: true
        label: Rent (£ per month)
      - name: deposit
        type: number
        required: true
        label: Deposit (£, max 5 weeks' rent)
      - name: bedrooms
        type: number
        required: true
        label: Bedrooms
      - name: furnishing
        type: select
        required: true
        label: Furnishing
        options:
        - unfurnished
        - part-furnished
        - furnished
      - name: bills
        type: select
        required: true
        label: Bills
        options:
        - tenant pays all
        - some included
        - all included
      - name: epc_rating
        type: select
        required: true
        label: EPC rating
        options:
        - A
        - B
        - C
        - D
        - E
        - F
        - G
      - name: photos
        type: file
        label: Photos
        accept:
        - jpg
        - jpeg
        - png
        - webp
        maxMb: 10
        multiple: true
        capture: true
        extract: none
      - name: available_from
        type: date
        required: true
        label: Available from
      - name: viewing_notes
        type: textarea
        maxLength: 500
        label: Notes for viewings (optional)
    - name: public_listings
      description: The published adverts, written by the advert agent. Tenants read them.
      ownedBy: app
      fields:
      - name: listing_ref
        type: text
      - name: headline
        type: text
      - name: advert
        type: textarea
      - name: area
        type: text
      - name: postcode_district
        type: text
      - name: rent
        type: number
      - name: deposit
        type: number
      - name: bedrooms
        type: number
      - name: furnishing
        type: text
      - name: bills
        type: text
      - name: epc_rating
        type: text
      - name: epc_verified
        type: boolean
      - name: available_from
        type: date
      - name: landlord_email
        type: email
      - name: status
        type: text
    - name: tenant_profiles
      description: A tenant's own search profile
      ownedBy: user
      fields:
      - name: budget
        type: number
        required: true
        label: Budget (£ per month)
      - name: bedrooms_needed
        type: number
        label: Bedrooms needed
      - name: areas
        type: text
        label: Preferred areas or postcodes
      - name: move_date
        type: date
        required: true
        label: Move date
      - name: employment
        type: select
        required: true
        label: Employment
        options:
        - employed
        - self-employed
        - student
        - retired
        - benefits
        - other
      - name: household
        type: number
        required: true
        label: People in the household
      - name: pets
        type: text
        label: Pets (type and number, or none)
    - name: viewings
      description: Viewing bookings made by tenants
      ownedBy: user
      fields:
      - name: notes
        type: textarea
        label: Notes
    - name: applications
      description: A tenant's application for a listing
      ownedBy: user
      fields:
      - name: listing
        type: select
        required: true
        label: Listing
        optionsFrom: collection:public_listings
      - name: tenant_email
        type: email
        required: true
        label: Your email
      - name: employer
        type: text
        label: Employer or source of income
      - name: income
        type: number
        required: true
        label: Yearly income (£)
      - name: move_in
        type: date
        required: true
        label: Move-in date
      - name: notes
        type: textarea
        maxLength: 600
        label: Anything else
      - name: landlord_email
        type: email
        label: Landlord
      - name: summary
        type: textarea
        label: Summary
      - name: status
        type: select
        default: submitted
        label: Status
        options:
        - submitted
        - ready_for_review
        - approved
        - declined
      - name: ref_status
        type: select
        default: not_started
        label: Referencing and credit check
        options:
        - not_started
        - in_progress
        - passed
        - failed
      - name: rtr_status
        type: select
        default: not_started
        label: Right to Rent
        options:
        - not_started
        - in_progress
        - passed
        - failed
      - name: landlord_notes
        type: textarea
        label: Landlord notes
      access:
      - role: landlord
        where:
          landlord_email: '{user.email}'
        can:
        - read
        - write
    - name: tenancies
      description: A tenancy started by a landlord
      ownedBy: user
      fields:
      - name: address
        type: text
        required: true
        label: Property address
      - name: tenant_email
        type: email
        required: true
        label: Tenant's email
      - name: start_date
        type: date
        required: true
        label: Start date
      - name: rent
        type: number
        required: true
        label: Rent (£ per month)
      - name: deposit
        type: number
        required: true
        label: Deposit (£)
      - name: rent_due_day
        type: number
        required: true
        label: Rent due day of the month
      - name: deposit_scheme
        type: select
        label: Deposit scheme
        options:
        - DPS
        - mydeposits
        - TDS
      - name: deposit_registered
        type: date
        label: Deposit registered on
      - name: agreement_status
        type: select
        default: draft
        label: Agreement
        options:
        - draft
        - sent
        - signed
      - name: management
        type: select
        label: Management
        options:
        - let only
        - managed
      access:
      - role: tenant
        where:
          tenant_email: '{user.email}'
        can:
        - read
    - name: repairs
      description: Repairs reported by tenants
      ownedBy: user
      fields:
      - name: tenancy
        type: select
        required: true
        label: Tenancy
        optionsFrom: collection:tenancies
      - name: landlord_email
        type: email
        required: true
        label: Landlord's email
      - name: area
        type: select
        required: true
        label: Where
        options:
        - kitchen
        - bathroom
        - bedroom
        - living room
        - heating and hot water
        - electrics
        - windows and doors
        - outside
        - other
      - name: issue
        type: textarea
        required: true
        label: What is wrong
      - name: photos
        type: file
        label: Photos
        accept:
        - jpg
        - jpeg
        - png
        - webp
        maxMb: 10
        multiple: true
        capture: true
      - name: urgency
        type: select
        label: Urgency
        options:
        - emergency
        - urgent
        - routine
      - name: triage
        type: textarea
        label: Triage
      - name: status
        type: select
        default: open
        label: Status
        options:
        - open
        - triaged
        - resolved
      access:
      - role: landlord
        where:
          landlord_email: '{user.email}'
        can:
        - read
        - write
    - name: partner_events
      description: Results sent by the referencing, ID, deposit and payment partners
      ownedBy: org
      fields:
      - name: partner_ref
        type: text
      - name: kind
        type: text
      - name: application
        type: text
      - name: result
        type: text
  views:
  - key: home
    type: page
    title: Letloop
    nav: false
    sections:
    - type: hero
      layout: split
      band: true
      eyebrow: Direct lettings
      title: Let and rent **directly**, without the agency fees.
      text: Landlords list in minutes and get an advert, an EPC check and a Renters' Rights Act checklist. Tenants get matched
        with homes that fit and book viewings in one place.
      actions:
      - label: I am a landlord
        href: /login
        style: primary
      - label: I am a tenant
        href: /v/listings_browse
        style: ghost
    - type: steps
      id: how-it-works
      title: How it works
      items:
      - title: List
        text: Add the address, rent, deposit, EPC and photos. The agent writes the advert and checks the EPC on the public
          register.
      - title: Match and view
        text: Tenants fill in a profile, the agent explains which listings fit, and they book a viewing slot with email reminders.
      - title: Apply and approve
        text: The tenant applies after the viewing. Referencing and Right to Rent run through licensed partners and the landlord
          approves.
      - title: Move in and live there
        text: The agreement is drafted, the deposit is protected in an approved scheme, and repairs are reported with photos.
    - type: cards
      id: pricing
      title: Pricing
      items:
      - title: Per let
        text: A fee for each tenancy you start, paid in credits.
        badge: 💷
      - title: Management subscription
        text: Optional monthly plan for landlords who want ongoing management help.
        badge: 🔧
      - title: Tenants
        text: Free to search, match, view and apply.
        badge: 🏠
    - type: note
      content: Letloop gives guidance, not legal advice. Referencing, Right to Rent checks, deposit protection and rent collection
        are done by licensed partners.
  - key: listings_browse
    type: cards
    title: Homes to rent
    source: collection:public_listings
    data:
      display: cards
      fields:
      - key: headline
        label: Home
      - key: area
        label: Area
      - key: rent
        label: Rent pcm
        format: money
      - key: bedrooms
        label: Bedrooms
        format: number
      - key: furnishing
        label: Furnishing
      - key: epc_rating
        label: EPC
        format: badge
      - key: available_from
        label: Available
        format: date
      sort:
        field: available_from
        dir: asc
      limit: 60
      empty: No homes published yet.
  - key: my_profile
    type: form
    title: My profile
    collection: tenant_profiles
    edit: true
    submit:
      label: Save profile
      message: Profile saved.
      redirect: find_matches
    roles:
    - tenant
  - key: find_matches
    type: new_run
    title: Find my matches
    roles:
    - tenant
    - admin
  - key: matches
    type: history
    title: My matches
    source: run
    roles:
    - tenant
  - key: report
    type: report
    title: Report
    source: run
    printable: true
    nav: false
  - key: book_viewing
    type: booking
    title: Book a viewing
    collection: viewings
    resources: collection:public_listings
    fields:
    - notes
    slots:
      days:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      from: '10:00'
      to: '19:00'
      minutes: 30
      tz: Europe/London
      aheadDays: 14
      minNoticeHours: 4
      capacity: 1
    roles:
    - tenant
  - key: my_viewings
    type: table
    title: My viewings
    source: collection:viewings
    roles:
    - tenant
  - key: apply
    type: form
    title: Apply for a home
    collection: applications
    fields:
    - listing
    - tenant_email
    - employer
    - income
    - move_in
    - notes
    submit:
      label: Send application
      message: Application sent. The landlord will review it.
      redirect: applications
    roles:
    - tenant
  - key: applications
    type: table
    title: Applications
    source: collection:applications
    data:
      display: table
      fields:
      - key: listing
        label: Listing
      - key: tenant_email
        label: Applicant
      - key: income
        label: Income
        format: money
      - key: move_in
        label: Move in
        format: date
      - key: summary
        label: Summary
      - key: ref_status
        label: Referencing
        format: badge
      - key: rtr_status
        label: Right to Rent
        format: badge
      - key: status
        label: Status
        format: badge
    roles:
    - tenant
    - landlord
    - admin
  - key: review_application
    type: form
    title: Review application
    collection: applications
    fields:
    - status
    - landlord_notes
    edit: true
    submit:
      label: Save decision
      message: Decision saved.
      redirect: applications
    roles:
    - landlord
    nav: false
  - key: new_listing
    type: form
    title: New listing
    collection: listings
    submit:
      label: Create listing and advert
      message: Saved. The agent is writing your advert and checking the EPC.
      redirect: adverts
    roles:
    - landlord
  - key: my_listings
    type: table
    title: My listings
    source: collection:listings
    roles:
    - landlord
  - key: adverts
    type: history
    title: Adverts and checks
    source: run
    roles:
    - landlord
  - key: start_tenancy
    type: form
    title: Start a tenancy
    collection: tenancies
    fields:
    - address
    - tenant_email
    - start_date
    - rent
    - deposit
    - rent_due_day
    - deposit_scheme
    - deposit_registered
    - management
    submit:
      label: Start tenancy
      message: Tenancy started. The agreement is being drafted.
      redirect: tenancies
    roles:
    - landlord
  - key: tenancies
    type: table
    title: Tenancies
    source: collection:tenancies
    roles:
    - landlord
    - tenant
  - key: report_repair
    type: form
    title: Report a repair
    collection: repairs
    fields:
    - tenancy
    - landlord_email
    - area
    - issue
    - photos
    submit:
      label: Send report
      message: Repair reported.
      redirect: repairs
    roles:
    - tenant
  - key: repairs
    type: table
    title: Repairs
    source: collection:repairs
    data:
      display: table
      fields:
      - key: area
        label: Where
      - key: issue
        label: Issue
      - key: urgency
        label: Urgency
        format: badge
      - key: triage
        label: Triage
      - key: status
        label: Status
        format: badge
    roles:
    - tenant
    - landlord
  - key: account
    type: account
    title: Credits and plan
    roles:
    - landlord
    - tenant
  triggers:
  - key: advert_on_listing
    'on':
      collection: listings
      op: insert
    start:
      agent: advert_writer
    goal: 'A landlord created a listing. Address: {record.address}, postcode {record.postcode}. Rent £{record.rent} pcm, deposit
      £{record.deposit}, bedrooms {record.bedrooms}, furnishing {record.furnishing}, bills {record.bills}, declared EPC rating
      {record.epc_rating}, available from {record.available_from}. Notes for viewings: {record.viewing_notes}. Landlord email:
      {landlord_email}. Check the EPC, publish the advert and write the report. Today is {date}.'
  - key: screen_application
    'on':
      collection: applications
      op: insert
      where:
        status: submitted
    start:
      agent: application_assistant
    goal: 'New application. Listing ref: {record.listing}. Applicant: {record.tenant_email}. Yearly income £{record.income},
      employer {record.employer}, move-in {record.move_in}. Notes: {record.notes}.'
  - key: application_ready
    'on':
      collection: applications
      op: update
      where:
        status: ready_for_review
    notify:
      to:
      - record.landlord_email
      subject: New application to review
      body: You have a new application for one of your listings. Review the summary, check the referencing and Right to Rent
        results, then approve or decline.
      link: applications
  - key: application_approved
    'on':
      collection: applications
      op: update
      where:
        status: approved
    notify:
      to:
      - owner
      subject: Your application was approved
      body: 'Good news: the landlord approved your application. Next come the tenancy agreement, the deposit and your first
        rent payment.'
      link: tenancies
  - key: application_declined
    'on':
      collection: applications
      op: update
      where:
        status: declined
    notify:
      to:
      - owner
      subject: Update on your application
      body: The landlord did not go ahead with your application. You can find other matches in Letloop.
      link: find_matches
  - key: agreement_on_tenancy
    'on':
      collection: tenancies
      op: insert
    start:
      agent: agreement_drafter
    goal: 'Draft the tenancy agreement. Property: {record.address}. Tenant: {record.tenant_email}. Start date {record.start_date}.
      Rent £{record.rent} per month due on day {record.rent_due_day}. Deposit £{record.deposit}, scheme {record.deposit_scheme}.
      Today is {date}.'
  - key: let_fee
    'on':
      collection: tenancies
      op: insert
    charge:
      credits: 500
      reason: Letting fee
  - key: triage_repair
    'on':
      collection: repairs
      op: insert
      where:
        status: open
    start:
      agent: repair_triage
    goal: 'A tenant reported a repair. Tenancy: {record.tenancy}. Where: {record.area}. Issue: {record.issue}. Photo file
      ids: {record.photos}. Landlord: {record.landlord_email}. Today is {date}.'
  - key: repair_triaged
    'on':
      collection: repairs
      op: update
      where:
        status: triaged
    notify:
      to:
      - record.landlord_email
      subject: 'Repair reported: {record.area} ({record.urgency})'
      body: 'A tenant reported a repair.

        Issue: {record.issue}

        Urgency: {record.urgency}

        Triage: {record.triage}'
      link: repairs
  - key: viewing_confirmation
    'on':
      collection: viewings
      op: insert
    notify:
      to:
      - owner
      subject: Viewing confirmed
      body: Your viewing is booked. You can see the time in My viewings. If you cannot come, please cancel so someone else
        can have the slot.
      link: my_viewings
  - key: viewing_reminder
    'on':
      date:
        collection: viewings
        field: start
        offsetDays: 0
        hour: 7
    notify:
      to:
      - owner
      subject: Viewing today
      body: You have a viewing booked today. Bring photo ID and your questions.
      link: my_viewings
  - key: deposit_reminder
    'on':
      date:
        collection: tenancies
        field: start_date
        offsetDays: 20
        hour: 8
    notify:
      to:
      - owner
      subject: Deposit protection deadline
      body: A deposit must be protected in a government-approved scheme, with the prescribed information given to the tenant,
        within 30 days of receipt. If you have not done it yet, do it now.
      link: tenancies
  - key: partner_event
    'on':
      webhook: true
    write:
      collection: partner_events
      fields:
        partner_ref: ref
        kind: kind
        application: application
        result: result
      keyBy: partner_ref
  notifications:
    emailOnRunDone: true
  billing:
    modes:
    - credits
    - subscription
    currency: gbp
    signupCredits: 100
    costs:
      agent:advert_writer: 10
      agent:matcher: 5
    packs:
    - key: let
      credits: 500
      price: 50
      label: One let
    - key: three_lets
      credits: 1500
      price: 135
      label: Three lets
    plans:
    - key: managed
      price: 25
      interval: month
      label: Management
      includes:
      - Repair triage and reminders for your tenancies
      - Priority support
      credits: 0
      roles:
      - landlord
  mobile:
    appId: uk.letloop.app
    capabilities:
    - name: camera
      reason:
        en: To photograph the property or a repair
    - name: push
  egress:
    hosts:
    - get-energy-performance-data.communities.gov.uk
    notes: Public EPC register of England and Wales, open government data under the Open Government Licence v3.0, used to
      verify the declared EPC rating.
  extensions:
  - key: licensed_partners
    description: Referencing with credit checks, Right to Rent ID checks, e-signature of the tenancy agreement, deposit registration
      with an approved scheme, and rent collection through a regulated client-money partner have no built-in connector yet.
      Partners can post results to the partner_events webhook and an admin sets the statuses on the applications and tenancies.
      Connection through the partners' APIs is still to be built.
  - key: landlord_viewing_visibility
    description: Landlords are not yet shown the viewings booked on their listings, and photos uploaded by landlords are not
      yet shown to tenants on the public listing.
  - key: rent_ledger
    description: Monthly rent status and arrears per tenancy need the payment partner's data; not available yet.
