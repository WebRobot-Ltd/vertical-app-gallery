  - key: insights
    type: page
    title: Dashboard
    roles:
    - admin
    sections:
    - type: text
      title: Programme dashboard
      content: Cohort progress, placements and wages, with regional context from the ONS. Placement rate = placements divided
        by graduates.
    - type: data
      title: Applications
      source: collection:applications
      display: kpi
      kpis:
      - label: Applications
        agg: count
    - type: data
      title: Graduates
      source: collection:graduate_profiles
      display: kpi
      kpis:
      - label: Graduates
        agg: count
      - label: Average score
        agg: avg
        field: avg_score
        format: number
    - type: data
      title: Placements
      source: collection:placements
      display: kpi
      kpis:
      - label: Placements
        agg: count
      - label: Average starting wage
        agg: avg
        field: starting_wage
        format: money
    - type: data
      title: Applications by cohort
      source: collection:applications
      display: chart
      chart: bar
      groupBy:
        field: cohort
        aggs: []
      fields:
      - key: cohort
        label: Cohort
      - key: count
        label: Applications
    - type: data
      title: 'Cohort progress: average score by module'
      source: collection:assessment_results
      display: chart
      chart: bar
      groupBy:
        field: module
        aggs:
        - key: avg_score
          agg: avg
          field: score
      fields:
      - key: module
        label: Module
      - key: avg_score
        label: Average score
    - type: data
      title: Starting wages by region
      source: collection:placements
      display: table
      groupBy:
        field: region
        aggs:
        - key: avg_wage
          agg: avg
          field: starting_wage
      fields:
      - key: region
        label: Region
      - key: count
        label: Placements
        format: number
      - key: avg_wage
        label: Average starting wage
        format: money
    - type: data
      title: ONS regional context
      intro: 'Median pay and employment by region. Source: Office for National Statistics, Open Government Licence v3.0.'
      source: collection:regional_context
      display: table
      fields:
      - key: region
        label: Region
      - key: metric
        label: Metric
      - key: value
        label: Value
        format: number
      - key: unit
        label: Unit
      - key: period
        label: Period
      limit: 100
  billing:
    modes:
    - credits
    currency: eur
    signupCredits: 0
    packs:
    - key: placement_fee
      credits: 500
      price: 500
      label: Placement fee (one hire)
  notifications:
    emailOnRunDone: true
  extensions:
  - key: employer_vetting
    description: The employer role is held by anyone who registers a company profile with their own email. The programme manager
      should check new employers on the data page before approving introductions; there is no automatic vetting yet.
  - key: placement_fee_debit
    description: Employers buy placement-fee credit packs. The debit on each hire is made by the programme manager (credit
      adjustment) when a placement is recorded; an automatic charge to the employer is not designed yet.
  - key: learner_gating
    description: The course catalogue is visible to every signed-in candidate, not only selected ones, because a role cannot
      be derived from a selection status. The videos should be hosted privately by the programme.
  - key: practical_training
    description: In-person practical training is run by partners outside the software. Only trainers' attendance records are
      kept here.
