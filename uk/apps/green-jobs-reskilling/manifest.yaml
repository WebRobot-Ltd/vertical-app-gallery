apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: verdepath
  displayName: Verdepath
  tagline: From where you are to a green career.
  description: Verdepath retrains people for green jobs such as heat pumps, solar and retrofit. It ranks applicants for each
    cohort, runs the online course, and introduces graduates to employers.
  langs:
  - en
  defaultLang: en
  timezone: Europe/London
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f4d3a'
      accent: '#2f9e6b'
      background: '#f6f8f4'
      foreground: '#17251f'
    fonts:
      body: Inter
      display: Fraunces
    wordmark:
    - text: Verde
      color: primary
    - text: path
      color: accent
  header:
    links:
    - label: How it works
      href: '#how'
    - label: Employers
      href: '#employers'
    cta:
      label: Apply now
      href: /v/apply
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Programme manager
      assignedBy: admin_emails
    - key: trainer
      label: Trainer
      assignedBy: invite
    - key: candidate
      label: Candidate
      assignedBy: signup
    - key: employer
      label: Employer
      assignedBy: derived
      from: collection:employers.contact_email
  agents:
  - key: screener
    role: main
    description: Checks eligibility and ranks the applicants of a cohort. The programme manager makes the final selection.
    when: task == 'screen'
    profile:
      inline:
        display_name: Verdepath screener
        crews:
        - id: screener
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You screen applicants for a green-jobs reskilling programme (heat pumps, solar, retrofit). Read
            the cohort with read_cohorts and its applicants with read_applications (status ''submitted'', matching cohort).
            For each applicant judge eligibility (available for the cohort dates, region reachable by partner training, a
            genuine interest in the cohort''s area, motivation that is concrete) and give a score 0-100. Do not use protected
            characteristics (age, gender, ethnicity, disability, nationality) and do not penalise a lack of formal education
            or a career change: weigh motivation, availability and fit. For each applicant: call add_ranking (application_id,
            cohort, rank, score, eligible true or false, rationale of 2-3 sentences) and call update_application to set status
            ''ranked''. Then write the report. It starts with a level-1 title ''# Cohort ranking - <cohort>''. Then give a
            table of rank, applicant, score, eligible and one-line reason, then ## Borderline cases and ## Notes for the programme
            manager. You only recommend: the programme manager selects. Never invent facts about an applicant.'
          mcp_servers: []
    goalTemplate: Screen and rank the applicants of cohort {cohort}. Capacity and area are in the cohorts collection. Today
      is {date}.
    appTools:
    - name: read_cohorts
      description: Read the cohorts
      action: read
      collection: cohorts
      scope: all
    - name: read_applications
      description: Read applications
      action: read
      collection: applications
      scope: all
    - name: update_application
      description: Update the status of an application
      action: write
      collection: applications
      scope: all
    - name: add_ranking
      description: Save the ranking of one applicant
      action: append
      collection: rankings
      scope: all
    output: markdown
    limits:
      maxTurns: 25
      maxBudgetUsd: 1.5
  - key: profiler
    role: main
    description: Builds the anonymised profiles of graduates, for employers.
    when: task == 'profile'
    profile:
      inline:
        display_name: Verdepath profiler
        crews:
        - id: profiler
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You create anonymised graduate profiles for employers. Read the selected applications of the cohort
            (read_applications, status ''selected'', share_profile true only), their assessment results (read_results) and
            attendance (read_attendance), and the module catalogue (read_modules). A candidate graduates when all the modules
            of their area are passed and attendance at practical sessions is at least 80 percent; skip the others and list
            them in the report. For each graduate call add_profile with: ref (the application record id), region, interest_areas,
            modules_passed, avg_score, attendance_rate, availability and summary (3 sentences of skills and strengths). The
            profile must NEVER contain the name, email, employer history with company names, town, or any detail that identifies
            the person. Then write the report. It starts with ''# Graduate profiles - <cohort>'', then lists who was profiled
            and who was not and why. Use real figures only.'
          mcp_servers: []
    goalTemplate: Create the graduate profiles for cohort {cohort}. Today is {date}.
    appTools:
    - name: read_applications
      description: Read applications
      action: read
      collection: applications
      scope: all
    - name: read_results
      description: Read module assessment results
      action: read
      collection: assessment_results
      scope: all
    - name: read_attendance
      description: Read practical session attendance
      action: read
      collection: attendance
      scope: all
    - name: read_modules
      description: Read the module catalogue
      action: read
      collection: modules
      scope: all
    - name: add_profile
      description: Save an anonymised graduate profile
      action: append
      collection: graduate_profiles
      scope: all
    output: markdown
    limits:
      maxTurns: 25
      maxBudgetUsd: 1.5
  - key: matcher
    role: main
    description: Proposes graduate introductions for an employer role. The programme manager approves each introduction.
    when: task == 'match'
    profile:
      inline:
        display_name: Verdepath matcher
        crews:
        - id: matcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 25
          max_budget_usd: 1.5
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You match graduates to an employer''s role. Read the role with read_jobs and the anonymised graduates
            with read_profiles. Match on interest area, region or willingness to travel, availability and results. Choose
            at most 5 graduates and score each 0-100. For each one, find the person''s email by looking up the application
            whose id equals the profile ref (read_applications), then call add_introduction with role_id, role_title, employer_email,
            company, candidate_ref, candidate_email, score, rationale and status ''proposed''. Do not propose a graduate who
            already has an introduction for this role (read_introductions). Do not use protected characteristics. Then write
            the report. It starts with ''# Matches - <role title>'' and has a table of ref, score and reason, then ## Gaps
            if few graduates fit. Nothing is shared with the employer until the programme manager approves it.'
          mcp_servers: []
    goalTemplate: Find matches for the role {job_role}. Today is {date}.
    appTools:
    - name: read_jobs
      description: Read employer roles
      action: read
      collection: job_roles
      scope: all
    - name: read_profiles
      description: Read anonymised graduate profiles
      action: read
      collection: graduate_profiles
      scope: all
    - name: read_applications
      description: Read applications
      action: read
      collection: applications
      scope: all
    - name: read_introductions
      description: Read existing introductions
      action: read
      collection: introductions
      scope: all
    - name: add_introduction
      description: Propose an introduction
      action: append
      collection: introductions
      scope: all
    output: markdown
    limits:
      maxTurns: 25
      maxBudgetUsd: 1.5
  - key: labour_context
    role: scheduled
    description: Monthly regional labour market context from ONS open data.
    profile:
      inline:
        display_name: Verdepath labour market context
        crews:
        - id: labour_context
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 30
          max_budget_usd: 1.0
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You collect regional labour market context for the UK from the ONS open API (api.beta.ons.gov.uk/v1).
            Call ons_api with path ''/datasets'' to find the datasets for earnings (for example ASHE median pay by region)
            and for employment and unemployment by region. Then follow the dataset links (editions, versions, observations)
            to get the latest values per region. For each region and metric call add_context with region, metric (median_weekly_pay,
            median_annual_pay, unemployment_rate or employment_rate), value (number), unit, period and source (dataset id).
            Use ONLY values the API returned and never estimate. If a metric cannot be fetched, skip it and say so. Finish
            with a short report that starts with ''# ONS regional context - <month>'' and has a table of what was updated.
            Source: Office for National Statistics, Open Government Licence v3.0.'
          mcp_servers: []
    goalTemplate: Refresh the ONS regional labour market context. Today is {date}.
    appTools:
    - name: ons_api
      description: GET the ONS open data API (datasets, editions, versions, observations)
      action: http
      http:
        method: GET
        url: https://api.beta.ons.gov.uk/v1
        allowPath: true
        attribution: Office for National Statistics, Open Government Licence v3.0
    - name: add_context
      description: Save one regional figure
      action: append
      collection: regional_context
      scope: all
    output: markdown
    limits:
      maxTurns: 30
      maxBudgetUsd: 1.0
  inputForm:
    title: New programme task
    fields:
    - name: task
      type: select
      required: true
      label: Task
      options:
      - value: screen
        label: Rank the applicants of a cohort
      - value: profile
        label: Create graduate profiles for a cohort
      - value: match
        label: Match graduates to an employer role
    - name: cohort
      type: select
      label: Cohort
      optionsFrom: collection:cohorts
      visibleWhen: task != 'match'
    - name: job_role
      type: select
      label: Employer role
      optionsFrom: collection:job_roles
      visibleWhen: task == 'match'
  data:
    collections:
    - name: cohorts
      ownedBy: shared
      description: Programme cohorts, kept by the programme manager on the data page
      fields:
      - name: name
        type: text
        required: true
        label: Name
      - name: area
        type: select
        label: Area
        options:
        - heat_pumps
        - solar
        - retrofit
        - mixed
      - name: start_date
        type: date
        label: Start date
      - name: capacity
        type: number
        label: Places
      - name: status
        type: select
        label: Status
        options:
        - open
        - running
        - completed
    - name: modules
      ownedBy: shared
      description: 'Course catalogue: video modules with an assessment'
      fields:
      - name: title
        type: text
        required: true
        label: Title
      - name: area
        type: select
        label: Area
        options:
        - heat_pumps
        - solar
        - retrofit
        - core
      - name: position
        type: number
        label: Order
      - name: video_url
        type: url
        label: Video
      - name: summary
        type: textarea
        label: Summary
      - name: assessment_brief
        type: textarea
        label: Assessment
    - name: applications
      ownedBy: org
      description: Candidate applications (the programme manager's back office; candidates see their own)
      fields:
      - name: full_name
        type: text
        required: true
        label: Full name
      - name: candidate_email
        type: email
        required: true
        label: Email
        help: Use the email you sign in with
      - name: region
        type: select
        required: true
        label: Region
        options:
        - North East
        - North West
        - Yorkshire and The Humber
        - East Midlands
        - West Midlands
        - East of England
        - London
        - South East
        - South West
        - Wales
        - Scotland
        - Northern Ireland
      - name: town
        type: text
        label: Town or city
      - name: current_job
        type: text
        required: true
        label: Current job
      - name: education
        type: select
        required: true
        label: Highest education
        options:
        - value: none
          label: No formal qualifications
        - value: gcse
          label: GCSE or equivalent
        - value: a_level
          label: A level or equivalent
        - value: vocational
          label: Vocational or apprenticeship
        - value: degree
          label: Degree
        - value: postgrad
          label: Postgraduate
      - name: availability
        type: select
        required: true
        label: Availability
        options:
        - value: immediately
          label: Immediately
        - value: one_month
          label: Within 1 month
        - value: three_months
          label: Within 3 months
        - value: evenings_weekends
          label: Evenings and weekends only
      - name: interests
        type: multiselect
        required: true
        label: Areas of interest
        options:
        - value: heat_pumps
          label: Heat pumps
        - value: solar
          label: Solar
        - value: retrofit
          label: Retrofit
        - value: ev_charging
          label: EV charging
        - value: other
          label: Other
      - name: motivation
        type: textarea
        required: true
        maxLength: 800
        label: Why do you want to move into a green job?
      - name: cohort
        type: select
        label: Preferred cohort
        optionsFrom: collection:cohorts
      - name: share_profile
        type: boolean
        label: If I graduate, share an anonymised profile with employers
      - name: status
        type: select
        label: Status
        default: submitted
        options:
        - submitted
        - ranked
        - shortlisted
        - selected
        - waitlist
        - not_selected
      access:
      - role: candidate
        where:
          candidate_email: '{user.email}'
        can:
        - read
      - role: trainer
        where:
          status: selected
        can:
        - read
    - name: rankings
      ownedBy: org
      description: Agent's eligibility score and rationale per applicant (programme manager only)
      fields:
      - name: application_id
        type: text
      - name: cohort
        type: text
      - name: rank
        type: number
      - name: score
        type: number
      - name: eligible
        type: boolean
      - name: rationale
        type: textarea
    - name: assessment_results
      ownedBy: org
      description: Module assessments marked by trainers
      fields:
      - name: candidate_email
        type: email
        required: true
        label: Candidate email
      - name: module
        type: text
        required: true
        label: Module
      - name: score
        type: number
        required: true
        label: Score (0-100)
      - name: outcome
        type: select
        required: true
        label: Outcome
        options:
        - pass
        - resit
        - fail
      - name: feedback
        type: textarea
        label: Feedback
      access:
      - role: candidate
        where:
          candidate_email: '{user.email}'
        can:
        - read
      - role: trainer
        can:
        - read
        - write
    - name: attendance
      ownedBy: org
      description: Attendance at in-person practical sessions run by partners
      fields:
      - name: candidate_email
        type: email
        required: true
        label: Candidate email
      - name: session_date
        type: date
        required: true
        label: Session date
      - name: session
        type: text
        required: true
        label: Session
      - name: partner
        type: text
        label: Training partner
      - name: present
        type: boolean
        label: Present
      - name: notes
        type: textarea
        label: Notes
      access:
      - role: candidate
        where:
          candidate_email: '{user.email}'
        can:
        - read
      - role: trainer
        can:
        - read
        - write
    - name: employers
      ownedBy: user
      description: Employer company profiles
      fields:
      - name: company
        type: text
        required: true
        label: Company
      - name: contact_email
        type: email
        required: true
        label: Contact email
        help: Use the email you sign in with
      - name: sector
        type: select
        label: Sector
        options:
        - heat_pumps
        - solar
        - retrofit
        - ev_charging
        - other
      - name: region
        type: text
        label: Main region
      - name: website
        type: url
        label: Website
    - name: job_roles
      ownedBy: org
      description: Roles posted by employers
      fields:
      - name: employer_email
        type: email
        required: true
        label: Your email
      - name: company
        type: text
        required: true
        label: Company
      - name: title
        type: text
        required: true
        label: Role title
      - name: area
        type: select
        label: Area
        options:
        - heat_pumps
        - solar
        - retrofit
        - ev_charging
        - other
      - name: region
        type: text
        required: true
        label: Region
      - name: salary_min
        type: number
        label: Salary from (GBP)
      - name: salary_max
        type: number
        label: Salary to (GBP)
      - name: description
        type: textarea
        required: true
        label: Description and requirements
      - name: status
        type: select
        default: open
        label: Status
        options:
        - open
        - filled
        - closed
      access:
      - role: employer
        where:
          employer_email: '{user.email}'
        can:
        - read
        - write
    - name: graduate_profiles
      ownedBy: org
      description: Anonymised graduate profiles created by the profiler agent
      fields:
      - name: ref
        type: text
      - name: region
        type: text
      - name: interest_areas
        type: text
      - name: modules_passed
        type: number
      - name: avg_score
        type: number
      - name: attendance_rate
        type: number
      - name: availability
        type: text
      - name: summary
        type: textarea
      access:
      - role: employer
    - name: introductions
      ownedBy: org
      description: Proposed introductions of graduates to roles; employers see only approved ones
      fields:
      - name: role_id
        type: text
      - name: role_title
        type: text
      - name: company
        type: text
      - name: employer_email
        type: email
      - name: candidate_ref
        type: text
      - name: candidate_email
        type: email
      - name: score
        type: number
      - name: rationale
        type: textarea
      - name: status
        type: select
        default: proposed
        label: Decision
        options:
        - proposed
        - approved
        - rejected
      - name: manager_note
        type: textarea
        label: Note
      access:
      - role: employer
        where:
          employer_email: '{user.email}'
          status: approved
        can:
        - read
    - name: placements
      ownedBy: org
      description: Graduates placed with employers
      fields:
      - name: candidate_email
        type: email
        required: true
        label: Candidate email
      - name: employer_email
        type: email
        required: true
        label: Employer email
      - name: company
        type: text
        required: true
        label: Company
      - name: role_title
        type: text
        required: true
        label: Role
      - name: region
        type: text
        required: true
        label: Region
      - name: starting_wage
        type: number
        required: true
        label: Starting annual wage (GBP)
      - name: start_date
        type: date
        label: Start date
      access:
      - role: employer
        where:
          employer_email: '{user.email}'
        can:
        - read
    - name: regional_context
      ownedBy: app
      description: ONS regional labour market figures, refreshed monthly
      fields:
      - name: region
        type: text
      - name: metric
        type: text
      - name: value
        type: number
      - name: unit
        type: text
      - name: period
        type: text
      - name: source
        type: text
  egress:
    hosts:
    - api.beta.ons.gov.uk
    notes: ONS open data API for regional earnings and labour market context. Office for National Statistics, Open Government
      Licence v3.0, reuse allowed with attribution.
  schedules:
  - agent: labour_context
    action: run
    cron: 0 6 1 * *
    owner: app
    goal: Refresh the ONS regional labour market context.
  triggers:
  - key: application_received
    'on':
      collection: applications
      op: insert
    notify:
      to: record.candidate_email
      subject: We received your Verdepath application
      body: Hi {record.full_name}, thank you for applying to Verdepath. We will review your application and email you at each
        stage. Applying is free.
      link: my_application
  - key: application_shortlisted
    'on':
      collection: applications
      op: update
      where:
        status: shortlisted
    notify:
      to: record.candidate_email
      subject: You are on the Verdepath shortlist
      body: Hi {record.full_name}, you are on the shortlist for your cohort. The programme manager will make the final selection
        soon.
      link: my_application
  - key: application_selected
    'on':
      collection: applications
      op: update
      where:
        status: selected
    notify:
      to: record.candidate_email
      subject: 'Welcome to Verdepath: you have been selected'
      body: Hi {record.full_name}, congratulations, you have a place on the programme. Sign in to start the online modules.
        Your in-person practical sessions will be arranged by our training partners.
      link: modules
  - key: application_waitlist
    'on':
      collection: applications
      op: update
      where:
        status: waitlist
    notify:
      to: record.candidate_email
      subject: 'Your Verdepath application: waiting list'
      body: Hi {record.full_name}, you are on the waiting list for your cohort. We will email you if a place opens.
      link: my_application
  - key: application_declined
    'on':
      collection: applications
      op: update
      where:
        status: not_selected
    notify:
      to: record.candidate_email
      subject: Your Verdepath application
      body: Hi {record.full_name}, thank you for applying. We could not offer you a place in this cohort. You are welcome
        to apply again for a future one.
      link: my_application
  - key: module_marked
    'on':
      collection: assessment_results
      op: insert
    notify:
      to: record.candidate_email
      subject: Your assessment for {record.module} has been marked
      body: 'Your result for {record.module}: {record.outcome} ({record.score}). Sign in to read your trainer''s feedback.'
      link: my_results
  - key: role_posted
    'on':
      collection: job_roles
      op: insert
    notify:
      to: admins
      subject: 'New employer role: {record.title}'
      body: '{record.company} posted a new role: {record.title} ({record.region}). Run a match from the programme tasks page.'
      link: new_run
  - key: introduction_approved
    'on':
      collection: introductions
      op: update
      where:
        status: approved
    notify:
      to:
      - record.employer_email
      - record.candidate_email
      subject: 'Verdepath introduction: {record.role_title}'
      body: The programme manager approved an introduction for the role {record.role_title} at {record.company}. Sign in to
        see the details.
      link: my_introductions
  - key: placement_recorded
    'on':
      collection: placements
      op: insert
    notify:
      to:
      - record.employer_email
      - record.candidate_email
      subject: Congratulations on the new placement
      body: A placement as {record.role_title} at {record.company} has been recorded. Well done! The employer placement fee
        applies.
      link: home
  views:
  - key: home
    type: page
    title: Verdepath
    nav: false
    sections:
    - type: hero
      title: Move into a **green job**, free of charge.
      text: Verdepath retrains people for heat pumps, solar and retrofit work. You learn online, train in person with our
        partners, and meet employers who are hiring.
      actions:
      - label: Apply for a place
        href: /v/apply
        style: primary
      - label: 'Employers: hire graduates'
        href: /v/employer_profile
        style: ghost
      note: Candidates never pay. Employers pay a fee only when they hire.
    - type: steps
      id: how
      title: How it works
      items:
      - title: Apply
        text: Tell us where you live, your current job, your availability and what interests you.
        badge: 📝
      - title: Get selected
        text: We check eligibility and rank applicants for each cohort. A programme manager makes the final choice.
        badge: ✅
      - title: Learn and train
        text: Follow video modules with assessments, then do practical training with our partners.
        badge: 🎓
      - title: Get introduced
        text: Employers see anonymised graduate profiles. Introductions are approved by us.
        badge: 🤝
    - type: cards
      id: employers
      title: For employers
      intro: Post your roles and see anonymised profiles of trained graduates. Pay a placement fee only when you hire.
      items:
      - title: Post roles
        text: Describe the role, region and pay.
      - title: Anonymised profiles
        text: See skills, results and attendance without personal details.
      - title: Approved introductions
        text: Our programme manager approves each introduction.
    - type: note
