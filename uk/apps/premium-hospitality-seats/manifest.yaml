apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: boxside
  displayName: Boxside
  tagline:
    en: Premium hospitality and seating for sport and music events.
  description:
    en: A marketplace where venues and clubs list hospitality packages and buyers book them. It includes corporate quotes,
      an AI concierge, event-day guides, reminders and venue sales dashboards.
  langs:
  - en
  defaultLang: en
  timezone: Europe/London
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#10213a'
      accent: '#b8893b'
      background: '#f8f6f1'
      foreground: '#16202e'
    fonts:
      body: Inter
      display: Playfair Display
    wordmark:
    - text: Box
      color: primary
    - text: side
      color: accent
    buttonShape: rounded
  header:
    links:
    - label: How it works
      href: '#how'
    - label: For venues
      href: '#venues'
    cta:
      label: Browse packages
      href: /v/catalogue
  auth:
    method: magic_link
    anonymous:
      views:
      - home
      - catalogue
      - concierge
      agents:
      - concierge
    roles:
    - key: admin
      assignedBy: admin_emails
    - key: account_manager
      label: Account manager
      assignedBy: invite
    - key: partner
      label: Venue / club partner
      assignedBy: invite
    - key: buyer
      label: Buyer
      assignedBy: signup
  limits:
  - action: chat
    per: ip
    max: 30
    window: hour
    roles:
    - anonymous
  - action: agent:guide_writer
    per: user
    max: 10
    window: day
  agents:
  - key: guide_writer
    role: main
    description: Drafts an event-day guide for one package from its listing details.
    appTools:
    - name: read_catalogue
      description: Read published packages
      action: read
      collection: catalogue
      scope: all
    profile:
      inline:
        display_name: Boxside guide writer
        crews:
        - id: guide_writer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write event-day guides for hospitality guests. Read the package with the read_catalogue tool,
            using the package id you are given. Use only the details stored there: event, date, venue, seat area, food and
            drink, dress code, arrival time, parking and venue policies. Start with a level-1 title "# Event-day guide — <event>,
            <date>". Then use these ## sections: At a glance, Getting there and parking, Arrival and entry, What is included,
            Dress code and house rules, Contact and help. If arrival times or parking details are missing, say so plainly
            and tell the guest to check the venue''s confirmation. Never invent times, addresses or prices. Keep it under
            400 words, in English.'
    goalTemplate: 'Package id: {listing_id}

      {?notes}Guest notes: {notes}{/notes}

      Today is {date}. Write the guide in the language with ISO code {lang}.'
    output: markdown
    limits:
      maxTurns: 6
      maxBudgetUsd: 0.4
  - key: concierge
    role: helper
    description: Answers buyer questions about packages from listing details and venue policies.
    appTools:
    - name: search_catalogue
      description: Search published hospitality packages by sport, team, artist, venue, event or date
      action: search
      collection: catalogue
      scope: all
    profile:
      inline:
        display_name: Boxside concierge
        chat_mode: true
        crews:
        - id: concierge
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You are the Boxside concierge. You help buyers choose and understand premium hospitality packages.
            Answer only from the package details and venue policies you find with search_catalogue. Mention the price, the
            seat area, what food and drink is included, the dress code and the venue policies when they are relevant. If something
            is not in the listing, say you do not know and suggest the buyer contact the venue or request a quote for groups.
            For groups of 10 or more, point to the quote request form. Never invent availability, prices or policies. Never
            promise refunds. Do not give advice on ticket resale, other than that Boxside follows UK CMA rules. Keep answers
            short and in English.
    goalTemplate: 'Conversation so far:

      {history}


      New message: {message}'
    output: markdown
  - key: quote_drafter
    role: helper
    description: Prepares a quote proposal for a corporate group request and asks an account manager to approve it.
    awaits:
    - quote_approval
    appTools:
    - name: read_catalogue_q
      description: Read published packages
      action: read
      collection: catalogue
      scope: all
    profile:
      inline:
        display_name: Boxside quote drafter
        crews:
        - id: quote_drafter
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: You prepare quote proposals for corporate group bookings. Look up the requested package with read_catalogue_q.
            Compute the list price for the group size (price per seat × seats). Do not apply a discount unless the request
            or the listing states one. Write a short proposal that gives the package, seats, list price, inclusions and open
            questions. Then call request_quote_approval with that summary so an account manager can approve it. Start with
            "# Quote proposal — <company>". Never invent prices or discounts.
    goalTemplate: 'New quote request.

      Company: {record.company}

      Package id: {record.listing_id}

      Seats: {record.seats}

      Contact: {record.contact_email}

      Message: {record.message}'
    output: markdown
  inputForm:
    title:
      en: Event-day guide
    fields:
    - name: listing_id
      type: select
      required: true
      label:
        en: Package
      optionsFrom: collection:catalogue
    - name: notes
      type: textarea
      maxLength: 400
      label:
        en: Anything special? (optional)
      help:
        en: 'For example: travelling by train, guests with accessibility needs.'
  data:
    collections:
    - name: partners
      description: 'Venues and clubs under contract: legal name, contact email, commission and payout details.'
      ownedBy: org
      fields:
      - name: name
        type: text
        required: true
      - name: contact_email
        type: email
        required: true
      - name: commission_pct
        type: number
      - name: contract_ref
        type: text
    - name: listings
      description: Hospitality packages created by each partner.
      ownedBy: user
      access:
      - role: account_manager
        can:
        - read
      fields:
      - name: event_title
        type: text
        required: true
        label: Event
      - name: category
        type: select
        required: true
        label: Category
        options:
        - sport
        - music
      - name: sport
        type: text
        label: Sport
      - name: team
        type: text
        label: Team or artist
      - name: venue
        type: text
        required: true
        label: Venue
      - name: event_date
        type: date
        required: true
        label: Date
      - name: seat_area
        type: text
        required: true
        label: Seat area
      - name: seats_total
        type: number
        required: true
        label: Number of seats
      - name: price_per_seat
        type: number
        required: true
        label: Price per seat (GBP)
      - name: food_drink
        type: textarea
        label: Food and drink included
      - name: dress_code
        type: text
        label: Dress code
      - name: arrival_info
        type: textarea
        label: Arrival times and entry
      - name: parking_info
        type: textarea
        label: Parking and transport
      - name: policies
        type: textarea
        label: Venue policies (cancellation, age, bag rules)
      - name: photos
        type: file
        accept:
        - jpg
        - png
        - webp
        maxMb: 8
        multiple: true
        extract: none
        label: Photos
      - name: status
        type: select
        required: true
        label: Status
        options:
        - draft
        - published
        - withdrawn
        default: draft
    - name: catalogue
      description: Published packages everyone can browse (copied from partners' listings when they publish).
      ownedBy: shared
      fields:
      - name: listing_id
        type: text
      - name: event_title
        type: text
      - name: category
        type: text
      - name: sport
        type: text
      - name: team
        type: text
      - name: venue
        type: text
      - name: event_date
        type: date
      - name: seat_area
        type: text
      - name: seats_total
        type: number
      - name: price_per_seat
        type: number
      - name: food_drink
        type: textarea
      - name: dress_code
        type: text
      - name: arrival_info
        type: textarea
      - name: parking_info
        type: textarea
      - name: policies
        type: textarea
    - name: orders
      description: Bookings. Each belongs to the buyer; the venue partner sees the ones for its packages.
      ownedBy: user
      access:
      - role: partner
        where:
          partner_email: '{user.email}'
        can:
        - read
      - role: account_manager
        can:
        - read
      fields:
      - name: listing_id
        type: select
        required: true
        label: Package
        optionsFrom: collection:catalogue
      - name: seats
        type: number
        required: true
        label: Seats
      - name: buyer_type
        type: select
        label: Booking as
        options:
        - individual
        - company
      - name: notes
        type: textarea
        label: Notes
      - name: event_title
        type: text
      - name: venue
        type: text
      - name: event_date
        type: date
      - name: amount
        type: number
      - name: buyer_email
        type: email
      - name: partner_email
        type: email
      - name: status
        type: select
        options:
        - pending
        - paid
        - cancelled
        - refunded
        default: pending
    - name: quote_requests
      description: Corporate group quote requests.
      ownedBy: user
      access:
      - role: account_manager
        can:
        - read
        - write
      fields:
      - name: company
        type: text
        required: true
        label: Company
      - name: contact_email
        type: email
        required: true
        label: Contact email
      - name: listing_id
        type: select
        required: true
        label: Package
        optionsFrom: collection:catalogue
      - name: seats
        type: number
        required: true
        label: Seats
      - name: message
        type: textarea
        label: Requirements
      - name: status
        type: select
        options:
        - new
        - approved
        - rejected
        - accepted
        default: new
    - name: payouts
      description: Payout statements per venue after each event, net of commission. Entered by the admins.
      ownedBy: org
      access:
      - role: partner
        where:
          partner_email: '{user.email}'
        can:
        - read
      fields:
      - name: partner_email
        type: email
        required: true
      - name: event_title
        type: text
      - name: event_date
        type: date
      - name: gross
        type: number
      - name: commission
        type: number
      - name: net
        type: number
      - name: status
        type: select
        options:
        - due
        - paid
        default: due
      - name: paid_on
        type: date
      retentionDays: 2555
  views:
  - key: home
    type: page
    title: Boxside
    nav: false
    sections:
    - type: hero
      layout: stack
      band: true
      eyebrow: Premium hospitality
      title: The best seats, the **best hospitality**, at the events you love.
      text: Browse boxes, lounges and hospitality packages at sport and music events. Book by card, or ask for a quote for
        your team or clients.
      actions:
      - label: Browse packages
        href: /v/catalogue
        style: primary
      - label: Sign in
        href: /login
        style: ghost
    - type: steps
      id: how
      title: How it works
      items:
      - title: Browse
        text: Filter by sport, team, artist, venue and date.
      - title: Ask
        text: The concierge answers questions from the listing and the venue's policies.
      - title: Book
        text: Pay by card. For large groups, request a quote and an account manager approves it.
      - title: Enjoy
        text: Get your confirmation, e-ticket, reminders and an event-day guide.
    - type: cards
      id: venues
      title: For venues and clubs
      items:
      - title: List your packages
        text: Add event, date, seat area, seats, food and drink, dress code, price and photos.
        badge: 🏟️
      - title: See only your own
        text: Each partner sees its own listings, sales and payouts.
        badge: 🔒
      - title: Paid after the event
        text: Payouts go to the venue after the event, net of Boxside's commission.
        badge: 💷
    - type: view
      title: Ask the concierge
      view: concierge
    - type: note
      content: Ticket resale on Boxside follows UK Competition and Markets Authority (CMA) rules. Boxside is not an official
        ticket seller for any club or artist.
  - key: catalogue
    type: cards
    title: Packages
    source: collection:catalogue
    columns:
    - event_title
    - team
    - venue
    - event_date
    - seat_area
    - price_per_seat
    data:
      display: cards
      fields:
      - key: event_title
        label: Event
      - key: team
        label: Team / artist
      - key: sport
        label: Sport
      - key: venue
        label: Venue
      - key: event_date
        label: Date
        format: date
      - key: seat_area
        label: Seat area
      - key: price_per_seat
        label: Price per seat
        format: money
      sort:
        field: event_date
        dir: asc
      limit: 100
      empty: No packages published yet.
  - key: concierge
    type: chat
    title: Concierge
    source: agent:concierge
    examples:
    - Which packages include food and drink?
    - What is the dress code for the next home match?
    - Do you have anything for 12 people in London?
    placeholder: Ask about a package…
    nav: false
  - key: book
    type: form
    title: Book a package
    collection: orders
    fields:
    - listing_id
    - seats
    - buyer_type
    - notes
    submit:
      label: Continue to payment
      message: Thanks. Your booking is saved; you will get a confirmation email.
      redirect: my_orders
    roles:
    - buyer
    - admin
  - key: my_orders
    type: table
    title: My bookings
    source: collection:orders
    data:
      display: table
      fields:
      - key: event_title
        label: Event
      - key: venue
        label: Venue
      - key: event_date
        label: Date
        format: date
      - key: seats
        label: Seats
      - key: amount
        label: Total
        format: money
      - key: status
        label: Status
        format: badge
      sort:
        field: event_date
        dir: asc
      actions:
      - type: calendar
        label: Add to calendar
        title: event_title
        start: event_date
        location: venue
    roles:
    - buyer
    - admin
  - key: quote
    type: form
    title: Request a group quote
    collection: quote_requests
    fields:
    - company
    - contact_email
    - listing_id
    - seats
    - message
    submit:
      label: Request quote
      message: Thanks. An account manager will review your request and reply by email.
    roles:
    - buyer
    - admin
  - key: quotes_review
    type: table
    title: Quote requests
    source: collection:quote_requests
    data:
      display: table
      fields:
      - key: company
        label: Company
      - key: seats
        label: Seats
      - key: contact_email
        label: Contact
      - key: status
        label: Status
        format: badge
    roles:
    - account_manager
    - admin
  - key: approvals_inbox
    type: approvals
    title: Quote approvals
    approvals:
    - quote_approval
    roles:
    - account_manager
    - admin
  - key: listing_new
    type: form
    title: New package
    collection: listings
    submit:
      label: Save package
      message: Saved. Set the status to published to show it in the catalogue.
      redirect: my_listings
    roles:
    - partner
    - admin
  - key: my_listings
    type: table
    title: My packages
    source: collection:listings
    data:
      display: table
      fields:
      - key: event_title
        label: Event
      - key: event_date
        label: Date
        format: date
      - key: seat_area
        label: Area
      - key: seats_total
        label: Seats
      - key: price_per_seat
        label: Price
        format: money
      - key: status
        label: Status
        format: badge
      sort:
        field: event_date
        dir: asc
    roles:
    - partner
    - admin
  - key: edit_listing
    type: form
    title: Edit package
    collection: listings
    edit: true
    submit:
      label: Save
      redirect: my_listings
    nav: false
    roles:
    - partner
    - admin
  - key: sales
    type: table
    title: My sales
    source: collection:orders
    export: true
    data:
      display: table
      groupBy:
        field: event_title
        aggs:
        - key: seats_sold
          agg: sum
          field: seats
        - key: revenue
          agg: sum
          field: amount
      fields:
      - key: event_title
        label: Event
      - key: seats_sold
        label: Seats sold
        format: number
      - key: revenue
        label: Revenue
        format: money
    roles:
    - partner
    - admin
  - key: my_payouts
    type: table
    title: My payouts
    source: collection:payouts
    export: true
    data:
      display: table
      fields:
      - key: event_title
        label: Event
      - key: event_date
        label: Date
        format: date
      - key: gross
        label: Gross
        format: money
      - key: commission
        label: Commission
        format: money
      - key: net
        label: Net
        format: money
      - key: status
        label: Status
        format: badge
      sort:
        field: event_date
        dir: desc
    roles:
    - partner
    - admin
  - key: guide_new
    type: new_run
    title: Event-day guide
    roles:
    - buyer
    - partner
    - admin
  - key: guides
    type: history
    title: My guides
    source: run
    roles:
    - buyer
    - partner
    - admin
  - key: guide
    type: report
    source: run
    printable: true
    nav: false
  - key: dashboard
    type: page
    title: Sales dashboard
    roles:
    - admin
    - account_manager
    sections:
    - type: data
      title: Revenue by venue
      source: collection:orders
      display: kpi
      kpis:
      - label: Bookings
        agg: count
      - label: Seats sold
        agg: sum
        field: seats
        format: number
      - label: Revenue
        agg: sum
        field: amount
        format: money
    - type: data
      title: Revenue by venue
      source: collection:orders
      display: chart
      chart: bar
      groupBy:
        field: venue
        aggs:
        - key: revenue
          agg: sum
          field: amount
      fields:
      - key: venue
        label: Venue
      - key: revenue
        label: Revenue
    - type: data
      title: Sales by event
      source: collection:orders
      display: table
      groupBy:
        field: event_title
        aggs:
        - key: seats_sold
          agg: sum
          field: seats
        - key: revenue
          agg: sum
          field: amount
      fields:
      - key: event_title
        label: Event
      - key: seats_sold
        label: Seats sold
        format: number
      - key: revenue
        label: Revenue
        format: money
    - type: data
      title: Seats available per package (compare with seats sold above)
      source: collection:catalogue
      display: table
      fields:
      - key: event_title
        label: Event
      - key: venue
        label: Venue
      - key: seats_total
        label: Seats offered
        format: number
      sort:
        field: event_date
        dir: asc
  - key: admin_payouts
    type: table
    title: All payouts
    source: collection:payouts
    export: true
    data:
      display: table
      fields:
      - key: partner_email
        label: Venue
      - key: event_title
        label: Event
      - key: gross
        label: Gross
        format: money
      - key: commission
        label: Commission
        format: money
      - key: net
        label: Net
        format: money
      - key: status
        label: Status
        format: badge
    roles:
    - admin
  triggers:
  - key: publish_listing
    description: Copy a published listing into the public catalogue
    'on':
      collection: listings
      op: any
      where:
        status: published
    write:
      collection: catalogue
      fields:
        listing_id: id
        event_title: event_title
        category: category
        sport: sport
        team: team
        venue: venue
        event_date: event_date
        seat_area: seat_area
        seats_total: seats_total
        price_per_seat: price_per_seat
        food_drink: food_drink
        dress_code: dress_code
        arrival_info: arrival_info
        parking_info: parking_info
        policies: policies
      keyBy: listing_id
  - key: order_confirmed
    'on':
      collection: orders
      op: any
      where:
        status: paid
    notify:
      to:
      - owner
      - record.partner_email
      subject:
        en: 'Boxside booking confirmed: {record.event_title}'
      body:
        en: Your booking for {record.event_title} at {record.venue} on {record.event_date} is confirmed ({record.seats} seats).
          Your e-ticket comes from the venue's ticketing system. We will remind you the day before.
      link: my_orders
  - key: order_reminder
    'on':
      date:
        collection: orders
        field: event_date
        offsetDays: -1
        hour: 8
    notify:
      to: owner
      subject:
        en: 'Tomorrow: {record.event_title}'
      body:
        en: Your event is tomorrow at {record.venue}. Open the event-day guide in Boxside for arrival times and parking.
      link: guide_new
  - key: quote_received
    'on':
      collection: quote_requests
      op: insert
    start:
      agent: quote_drafter
    goal: 'New quote request.

      Company: {record.company}

      Package id: {record.listing_id}

      Seats: {record.seats}

      Contact: {record.contact_email}

      Message: {record.message}'
  - key: quote_decided
    'on':
      approval: quote_approval
      decision: approved
    notify:
      to: owner
      subject:
        en: Your Boxside group quote is approved
      body:
        en: Your account manager approved your group quote. Open Boxside to see it and confirm the booking.
      link: quote
  approvals:
  - key: quote_approval
    title:
      en: Group quote
    description: An account manager approves a corporate quote before it goes to the buyer.
    role: account_manager
    decidedBy: role
    timeoutMinutes: 4320
    onTimeout: reject
  billing:
    modes:
    - per_transaction
    currency: gbp
    transactionFeePct: 12
    sellers: collection:partners
  notifications:
    emailOnRunDone: true
  egress:
    hosts: []
    notes: No external APIs.
  extensions:
  - key: card_checkout
    description: The booking form saves the order. Card payment through Stripe Connect, and setting price, amount, venue and
      partner_email from the catalogue entry on the server, still need wiring. The app owner must connect Stripe in the studio.
  - key: venue_payouts
    description: Payouts are statements in the payouts collection, entered by admins (or by CSV) after each event. Automatic
      calculation across all orders is not available. Transfers to venues' Stripe Connect accounts are made outside this manifest.
  - key: etickets
    description: E-tickets come from each venue's ticketing system. Fetching them needs the venue's API and a credential for
      each partner. For now the confirmation email tells the buyer to expect them from the venue.
  - key: resale_cma
    description: 'Resale is not part of this version. Before building it, Boxside needs UK CMA / Consumer Rights Act rules:
      show seat, face value and seller status, and cap resale prices where the venue or promoter requires it. It also needs
      counsel''s review.'
  - key: listing_photos
    description: Partner photos are private to the uploader, so buyers cannot see them in the catalogue yet. Public images
      need a shared file store.
  - key: sell_through
    description: Sell-through % (seats sold ÷ seats offered) is shown as two figures side by side. A computed ratio needs
      a joined aggregate.
  - key: reminder_filter
    description: Date reminders cannot be filtered by status, so the day-before reminder goes for every order with an event
      date, including unpaid or cancelled ones.
  - key: messaging
    description: SMS, WhatsApp and push reminders are not available. Reminders are sent by email.
