apiVersion: webrobot.eu/v1alpha1
kind: VerticalApp
metadata:
  slug: firstrung
  displayName: Firstrung
  tagline:
    en: Entry-level hiring built on skills, not CVs.
  description:
    en: Young candidates show what they can do through short skills assessments and achievements. Employers post entry-level
      roles and apprenticeships and meet only candidates who applied or opted in. An AI agent writes encouraging strengths
      profiles and explains each match.
  langs:
  - en
  defaultLang: en
  timezone: Europe/London
spec:
  pattern: report
  branding:
    theme: light
    palette:
      primary: '#1f3a5f'
      accent: '#f28c38'
      background: '#fbf8f3'
      foreground: '#1c2430'
    fonts:
      body: Inter
      display: Poppins
    wordmark:
    - text: First
      color: primary
    - text: rung
      color: accent
    width: wide
  header:
    links:
    - label: How it works
      href: '#how'
    - label: For candidates
      href: '#candidates'
    - label: For employers
      href: '#employers'
    cta:
      label: Get started
      href: /login
  auth:
    method: magic_link
    anonymous:
      views:
      - home
    roles:
    - key: admin
      label: Admin
      assignedBy: admin_emails
    - key: user
      label: Candidate
      assignedBy: signup
    - key: employer
      label: Employer
      assignedBy: derived
      from: collection:companies.contact_email
  agents:
  - key: scorer
    role: main
    description: Scores a candidate's assessments and writes an encouraging strengths profile.
    profile:
      inline:
        display_name: Firstrung scorer
        crews:
        - id: scorer
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 10
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You are a warm, fair careers coach for young people applying for their first job or apprenticeship.
            Use the tools read_assessments, read_achievements and read_profile to see everything the candidate has submitted
            so far. Score only what is present, from 1 to 5, on: problem_solving, numeracy (check the numeric answers against
            the questions in the answers; be exact), writing (clarity, structure, tone), field_task (relevance and practical
            thinking). Judge only the content of the answers: never use name, region, school, or anything that hints at background,
            gender, ethnicity or disability. Leave a score empty if that assessment has not been done yet. Then call save_strengths
            exactly once with: headline (one encouraging sentence), strengths_text (3 to 5 strengths in plain, positive language,
            each backed by something the candidate actually wrote or did, plus one ''next step to grow''), problem_solving,
            numeracy, writing, field_task, work_preferences (short summary of their stated preferences), field_area. If a
            strengths record already exists, update it rather than adding another. Your final answer is the profile as Markdown:
            a level-1 ''# '' title ''Your strengths profile'', then ## Your strengths, ## Where you shine at work, ## Next
            steps. Be encouraging and honest; never invent achievements or figures; never mention scores as a ranking against
            other people.'
    appTools:
    - name: read_assessments
      description: Read the candidate's submitted assessments
      action: read
      collection: assessments
      scope: user
    - name: read_achievements
      description: Read the candidate's achievements, projects and volunteering
      action: read
      collection: achievements
      scope: user
    - name: read_profile
      description: Read the candidate's profile
      action: read
      collection: candidate_profiles
      scope: user
    - name: save_strengths
      description: Save or update the candidate's strengths profile
      action: write
      collection: strengths
      scope: user
    output: markdown
    limits:
      maxTurns: 10
      maxBudgetUsd: 0.4
  - key: matcher
    role: helper
    description: Matches candidates to open roles with an explanation, and prepares the employer's shortlist entry when a
      candidate applies.
    profile:
      inline:
        display_name: Firstrung matcher
        crews:
        - id: matcher
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 12
          max_budget_usd: 0.4
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You match young candidates to entry-level roles and apprenticeships on skills, never on background.
            Tools: read_strengths, read_profile, read_achievements (the candidate''s own data), list_roles (all open roles),
            save_match and add_shortlist. Two jobs, as the goal says. (1) RECOMMEND: read the strengths and list the open
            roles; for the best up to 5 fits call save_match once per role with role_ref, role_title, employer_name, fit_score
            (0-100) and explanation (2-4 encouraging sentences saying which of the candidate''s skills fit which requirement
            and, honestly, one gap and how to bridge it). Consider field, skills, location/region, start date and the candidate''s
            work preferences. Skip roles with a poor fit. Never use name, gender, ethnicity, school name or other background.
            (2) APPLICATION: find the role named in the goal with list_roles, then call add_shortlist once with: candidate_name
            (first name and initial, or the profile''s full name), candidate_email (from read_profile), region, role_ref,
            role_title, employer_email (from the role), fit_score, fit_explanation (explain the fit for the hiring manager,
            skills evidence first), strengths_summary (3 sentences with achievements the candidate shared), stage ''applied''.
            Never invent skills; if there are no strengths yet, say the profile is incomplete. Finish with a one-paragraph
            Markdown summary starting with ''# Matches updated''.'
    appTools:
    - name: read_strengths
      description: Read the candidate's strengths profile
      action: read
      collection: strengths
      scope: user
    - name: read_profile
      description: Read the candidate's profile
      action: read
      collection: candidate_profiles
      scope: user
    - name: read_achievements
      description: Read the candidate's achievements, projects and volunteering
      action: read
      collection: achievements
      scope: user
    - name: list_roles
      description: List all open roles and apprenticeships
      action: read
      collection: open_roles
      scope: all
    - name: save_match
      description: Save a recommended role for the candidate
      action: append
      collection: job_matches
      scope: user
    - name: add_shortlist
      description: Add the candidate's application to the employer's shortlist
      action: append
      collection: shortlist
      scope: user
    output: markdown
    limits:
      maxTurns: 12
      maxBudgetUsd: 0.4
  - key: digester
    role: scheduled
    description: Writes an employer's weekly hiring digest.
    profile:
      inline:
        display_name: Firstrung digest writer
        crews:
        - id: digester
          engine: agent_sdk
          model: claude-sonnet-5-5
          max_turns: 6
          max_budget_usd: 0.3
          permission_mode: bypassPermissions
          disallowed_tools:
          - Bash
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - NotebookEdit
          - WebFetch
          - WebSearch
          system_prompt: 'You write a short weekly hiring digest for one employer. Use read_pipeline (the candidates who applied
            or opted in to this employer, with stage, fit and region) and list_my_roles. Start with ''# Your Firstrung week
            — <date>''. Sections: ## This week (new applicants, interviews coming up, outcomes), ## Needs your attention (applicants
            waiting for review, invites without a date), ## Pipeline (counts per stage and per role as a small table). Under
            250 words, plain text friendly. Real figures only; if nothing happened, say so briefly. Never reveal anything
            about candidates who have not applied or opted in.'
    appTools:
    - name: read_pipeline
      description: Read the candidates shared with this employer
      action: read
      collection: shortlist
      scope: user
    - name: list_my_roles
      description: Read this employer's posted roles
      action: read
      collection: role_posts
      scope: user
    output: markdown
    writesTo:
      collection: digests
      parse: whole
    limits:
      maxTurns: 6
      maxBudgetUsd: 0.3
  data:
    collections:
    - name: candidate_profiles
      ownedBy: user
      description: Each candidate's own profile
      fields:
      - name: full_name
        type: text
        required: true
        label: Full name
      - name: email
        type: email
        required: true
        label: Contact email
      - name: region
        type: select
        required: true
        label: Region
        options:
        - North East
        - North West
        - Yorkshire and the Humber
        - East Midlands
        - West Midlands
        - East of England
        - London
        - South East
        - South West
        - Wales
        - Scotland
        - Northern Ireland
        - Outside the UK
      - name: field_interest
        type: multiselect
        label: Fields you are interested in
        options:
        - Technology
        - Business and admin
        - Finance
        - Healthcare
        - Engineering
        - Construction and trades
        - Creative and media
        - Retail and hospitality
        - Education and community
      - name: available_from
        type: date
        label: Available from
      - name: about
        type: textarea
        maxLength: 500
        label: A few words about you
    - name: assessments
      ownedBy: user
      description: Answers to the short skills assessments
      fields:
      - name: section
        type: select
        required: true
        label: Assessment
        options:
        - value: problem_solving
          label: Problem solving
        - value: numeracy
          label: Numeracy
        - value: writing
          label: Written communication
        - value: preferences
          label: Work preferences
        - value: field_task
          label: Field task
      - name: ps_answer1
        type: textarea
        maxLength: 800
        label: Scenario 1
        help: A delivery is going to arrive a day late and three customers are waiting. What do you do, step by step?
      - name: ps_answer2
        type: textarea
        maxLength: 800
        label: Scenario 2
        help: Your team has 5 tasks and time for only 3 before the end of the day. How do you decide which ones?
      - name: num_1
        type: number
        label: Question 1
        help: A shop sells a 40 pound jacket at 25% off. What is the sale price in pounds?
      - name: num_2
        type: number
        label: Question 2
        help: You work 6.5 hours a day for 4 days at 12 pounds an hour. How much do you earn in pounds?
      - name: num_3
        type: number
        label: Question 3
        help: A recipe for 4 people needs 300 g of flour. How many grams do you need for 10 people?
      - name: writing_sample
        type: textarea
        maxLength: 1500
        label: Written task
        help: Write a short, friendly email (80 to 150 words) to a customer whose order is late, apologising and saying what
          happens next.
      - name: pref_work_style
        type: multiselect
        label: How do you like to work?
        options:
        - With a team
        - On my own
        - Hands-on
        - At a computer
        - With people face to face
        - Outdoors
        - Following clear steps
        - Solving open problems
      - name: pref_environment
        type: select
        label: Preferred pace
        options:
        - Calm and steady
        - Mixed
        - Fast and busy
      - name: pref_goals
        type: textarea
        maxLength: 500
        label: What do you want from a first job?
      - name: field_area
        type: select
        label: Field for your task
        options:
        - Technology
        - Business and admin
        - Finance
        - Healthcare
        - Engineering
        - Construction and trades
        - Creative and media
        - Retail and hospitality
        - Education and community
      - name: task_answer
        type: textarea
        maxLength: 1500
        label: Your field task
        help: 'Describe how you would approach a small real task from this field (for example: plan a simple spreadsheet,
          a care visit checklist, a social post, a site safety check). Explain your choices.'
    - name: achievements
      ownedBy: user
      description: School, college, project and volunteering achievements
      fields:
      - name: kind
        type: select
        required: true
        label: Type
        options:
        - School or college
        - Project
        - Volunteering
        - Work experience
        - Other
      - name: title
        type: text
        required: true
        label: What was it?
      - name: description
        type: textarea
        maxLength: 600
        label: What did you do and learn?
      - name: year
        type: text
        label: When
      - name: link
        type: url
        label: Link (optional)
    - name: strengths
      ownedBy: user
      description: Strengths profile written by the agent
      fields:
      - name: headline
        type: text
        label: Headline
      - name: strengths_text
        type: textarea
        label: Your strengths
      - name: problem_solving
        type: number
        label: Problem solving
      - name: numeracy
        type: number
        label: Numeracy
      - name: writing
        type: number
        label: Writing
      - name: field_task
        type: number
        label: Field task
      - name: work_preferences
        type: text
        label: Work preferences
      - name: field_area
        type: text
        label: Field
    - name: companies
      ownedBy: user
      description: Employer organisation details
      fields:
      - name: company_name
        type: text
        required: true
        label: Organisation
      - name: contact_email
        type: email
        required: true
        label: Hiring manager email
      - name: size
        type: select
        label: Size
        options:
        - 1-10
        - 11-50
        - 51-250
        - 251-1000
        - 1000+
      - name: about
        type: textarea
        maxLength: 600
        label: About you
    - name: role_posts
      ownedBy: user
      description: Roles an employer posts; published to the board by a trigger
      fields:
      - name: title
        type: text
        required: true
        label: Role title
      - name: employer_name
        type: text
        required: true
        label: Organisation
      - name: employer_email
        type: email
        required: true
        label: Hiring manager email
      - name: type
        type: select
        required: true
        label: Type
        options:
        - Entry-level role
        - Apprenticeship
        - Traineeship
      - name: field
        type: select
        required: true
        label: Field
        options:
        - Technology
        - Business and admin
        - Finance
        - Healthcare
        - Engineering
        - Construction and trades
        - Creative and media
        - Retail and hospitality
        - Education and community
      - name: skills
        type: textarea
        required: true
        maxLength: 600
        label: Skills needed
        help: 'Skills, not qualifications: what must the person be able to do?'
      - name: location
        type: text
        required: true
        label: Location
      - name: region
        type: select
        required: true
        label: Region
        options:
        - North East
        - North West
        - Yorkshire and the Humber
        - East Midlands
        - West Midlands
        - East of England
        - London
        - South East
        - South West
        - Wales
        - Scotland
        - Northern Ireland
        - Outside the UK
      - name: pay
        type: text
        required: true
        label: Pay
      - name: start_date
        type: date
        required: true
        label: Start date
      - name: description
        type: textarea
        maxLength: 1000
        label: About the role
    - name: open_roles
      ownedBy: app
      description: The public board of open roles, filled when an employer posts
      fields:
      - name: title
        type: text
        label: Role title
      - name: employer_name
        type: text
        label: Organisation
      - name: employer_email
        type: email
        label: Hiring manager email
      - name: type
        type: text
        label: Type
      - name: field
        type: text
        label: Field
      - name: skills
        type: textarea
        label: Skills needed
      - name: location
        type: text
        label: Location
      - name: region
        type: text
        label: Region
      - name: pay
        type: text
        label: Pay
      - name: start_date
        type: date
        label: Start date
      - name: description
        type: textarea
        label: About the role
    - name: job_matches
      ownedBy: user
      description: Roles recommended to the candidate, with the reason
      fields:
      - name: role_ref
        type: text
        label: Role id
      - name: role_title
        type: text
        label: Role
      - name: employer_name
        type: text
        label: Organisation
      - name: fit_score
        type: number
        label: Fit
      - name: explanation
        type: textarea
        label: Why it fits
    - name: applications
      ownedBy: user
      description: A candidate applying to a role or opting in to be seen
      fields:
      - name: role
        type: select
        required: true
        label: Role
        optionsFrom: collection:open_roles
      - name: message
        type: textarea
        maxLength: 600
        label: Why this role? (optional)
      - name: consent
        type: boolean
        required: true
        label: I agree to share my strengths profile and achievements with this employer
    - name: shortlist
      ownedBy: user
      description: Candidates who applied or opted in, visible to the employer named in employer_email
      access:
      - role: employer
        where:
          employer_email: '{user.email}'
        can:
        - read
        - write
      fields:
      - name: candidate_name
        type: text
        label: Candidate
      - name: candidate_email
        type: email
        label: Candidate email
      - name: region
        type: text
        label: Region
      - name: role_ref
        type: text
        label: Role id
      - name: role_title
        type: text
        label: Role
      - name: employer_email
        type: email
        label: Employer
      - name: fit_score
        type: number
        label: Fit
      - name: fit_explanation
        type: textarea
        label: Why it fits
      - name: strengths_summary
        type: textarea
        label: Strengths and achievements
      - name: stage
        type: select
        label: Stage
        options:
        - value: applied
          label: Applied
        - value: shortlisted
          label: Shortlisted
        - value: invited
          label: Interview invited
        - value: interviewed
          label: Interviewed
        - value: offered
          label: Offer made
        - value: hired
          label: Hired
        - value: declined
          label: Not progressing
      - name: interview_date
        type: date
        label: Interview date
      - name: interview_time
        type: text
        label: Interview time
      - name: interview_where
        type: text
        label: Where or video link
    - name: interview_notes
      ownedBy: user
      description: The hiring manager's structured interview record
      fields:
      - name: candidate
        type: select
        required: true
        label: Candidate
        optionsFrom: collection:shortlist
      - name: communication
        type: number
        required: true
        label: Communication (1-5)
      - name: problem_solving
        type: number
        required: true
        label: Problem solving (1-5)
      - name: motivation
        type: number
        required: true
        label: Motivation and potential (1-5)
      - name: outcome
        type: select
        required: true
        label: Outcome
        options:
        - Offer
        - Second interview
        - Not progressing
      - name: notes
        type: textarea
        maxLength: 1000
        label: Notes
    - name: digests
      ownedBy: instance
      description: Weekly hiring digests
  views:
  - key: home
    type: page
    title: Firstrung
    nav: false
    sections:
    - type: hero
      layout: stack
      band: true
      eyebrow: Skills first
      title: Your first job should start with what you **can do**, not your CV.
      text: Firstrung helps young people show their skills through short assessments, and helps employers find entry-level
        talent they would otherwise miss. Free for candidates.
      actions:
      - label: Show my skills
        href: /login
        style: primary
      - label: Hire on skills
        href: /login
        style: ghost
    - type: steps
      id: how
      title: How it works
      items:
      - title: Show what you can do
        text: Short assessments and your own achievements, projects and volunteering.
      - title: Get your strengths profile
        text: An encouraging profile that says what you are good at, and the best-fit roles with the reasons.
      - title: You choose who sees you
        text: Employers only see you if you apply or opt in.
      - title: Meet employers
        text: Structured interviews, clear updates at every step.
    - type: cards
      id: candidates
      title: For candidates
      items:
      - title: Free, always
        text: Assessments, profile and matches cost nothing.
      - title: No CV needed
        text: Problem solving, numeracy, writing and a short task in your chosen field.
      - title: In control
        text: Share your profile one employer at a time.
    - type: cards
      id: employers
      title: For employers
      items:
      - title: Skills-based shortlists
        text: Every match comes with an explanation of the fit.
      - title: Pay per active role or subscribe
        text: Simple pricing through Stripe.
      - title: See your pipeline
        text: Applicants, regional spread and conversion in one dashboard, plus a weekly digest.
    - type: note
      content: Matches and scores support human decisions; they never replace the hiring manager's judgement. Firstrung does
        not use name, school or background in scoring.
  - key: profile_form
    type: form
    title: My profile
    collection: candidate_profiles
    submit:
      label: Save profile
      message: Profile saved. Now try an assessment.
      redirect: assessments_hub
    edit: false
    roles:
    - user
  - key: assessments_hub
    type: page
    title: Assessments
    roles:
    - user
    sections:
    - type: text
      title: Pick an assessment
      content: 'Each one takes 5 to 10 minutes. Do as many as you like; your strengths profile updates every time.


        - [Problem solving](/v/assess_problem)

        - [Numeracy](/v/assess_numeracy)

        - [Written communication](/v/assess_writing)

        - [Work preferences](/v/assess_preferences)

        - [A task in your field](/v/assess_field)

        - [Add an achievement](/v/achievement_form)'
  - key: assess_problem
    type: form
    title: Problem solving
    collection: assessments
    fields:
    - section
    - ps_answer1
    - ps_answer2
    submit:
      label: Submit
      message: Thanks! Your strengths profile is being updated.
      redirect: my_strengths
    nav: false
    roles:
    - user
  - key: assess_numeracy
    type: form
    title: Numeracy
    collection: assessments
    fields:
    - section
    - num_1
    - num_2
    - num_3
    submit:
      label: Submit
      message: Thanks! Your strengths profile is being updated.
      redirect: my_strengths
    nav: false
    roles:
    - user
  - key: assess_writing
    type: form
    title: Written communication
    collection: assessments
    fields:
    - section
    - writing_sample
    submit:
      label: Submit
      message: Thanks! Your strengths profile is being updated.
      redirect: my_strengths
    nav: false
    roles:
    - user
  - key: assess_preferences
    type: form
    title: Work preferences
    collection: assessments
    fields:
    - section
    - pref_work_style
    - pref_environment
    - pref_goals
    submit:
      label: Submit
      message: Thanks! Your strengths profile is being updated.
      redirect: my_strengths
    nav: false
    roles:
    - user
  - key: assess_field
    type: form
    title: Field task
    collection: assessments
    fields:
    - section
    - field_area
    - task_answer
    submit:
      label: Submit
      message: Thanks! Your strengths profile is being updated.
      redirect: my_strengths
    nav: false
    roles:
    - user
  - key: achievement_form
    type: form
    title: Add an achievement
    collection: achievements
    submit:
      label: Add
      message: Added to your profile.
      redirect: assessments_hub
    nav: false
    roles:
    - user
  - key: my_strengths
    type: cards
    title: My strengths
    source: collection:strengths
    data:
      display: cards
      fields:
      - key: headline
      - key: strengths_text
      - key: problem_solving
        label: Problem solving
        format: number
      - key: numeracy
        label: Numeracy
        format: number
      - key: writing
        label: Writing
        format: number
      - key: field_task
        label: Field task
        format: number
      empty: Complete an assessment to see your strengths profile.
    roles:
    - user
  - key: my_matches
    type: cards
    title: My matches
    source: collection:job_matches
    data:
      display: cards
      fields:
      - key: role_title
        label: Role
      - key: employer_name
        label: Organisation
      - key: fit_score
        label: Fit
        format: number
      - key: explanation
        label: Why it fits
      sort:
        field: fit_score
        dir: desc
      empty: Matches appear after your first assessment, once roles are open.
    roles:
    - user
  - key: roles_board
    type: table
    title: Open roles
    source: collection:open_roles
    data:
      display: table
      fields:
      - key: title
        label: Role
      - key: employer_name
        label: Organisation
      - key: type
        label: Type
      - key: location
        label: Location
      - key: pay
        label: Pay
      - key: start_date
        label: Start
        format: date
      - key: skills
        label: Skills
      empty: No open roles yet.
    roles:
    - user
    - employer
    - admin
  - key: apply_form
    type: form
    title: Apply or opt in
    collection: applications
    submit:
      label: Share my profile
      message: Shared. The employer can now see your strengths profile.
      redirect: my_applications
    roles:
    - user
  - key: my_applications
    type: table
    title: My applications
    source: collection:shortlist
    data:
      display: table
      fields:
      - key: role_title
        label: Role
      - key: stage
        label: Status
        format: badge
      - key: interview_date
        label: Interview
        format: date
      - key: interview_time
        label: Time
      - key: interview_where
        label: Where
      empty: You have not applied yet.
    roles:
    - user
  - key: company_form
    type: form
    title: Your organisation
    collection: companies
    submit:
      label: Save
      message: Saved. Employer tools are now unlocked after you sign in again.
      redirect: post_role
    roles:
    - user
    - employer
  - key: post_role
    type: form
    title: Post a role
    collection: role_posts
    submit:
      label: Post role
      message: Role posted to the board.
      redirect: my_roles
    roles:
    - employer
    - admin
  - key: my_roles
    type: table
    title: My roles
    source: collection:role_posts
    data:
      display: table
      fields:
      - key: title
        label: Role
      - key: type
        label: Type
      - key: location
        label: Location
      - key: pay
        label: Pay
      - key: start_date
        label: Start
        format: date
    roles:
    - employer
    - admin
  - key: review
    type: table
    title: Review candidates
    source: collection:shortlist
    export: true
    data:
      display: table
      fields:
      - key: candidate_name
        label: Candidate
      - key: role_title
        label: Role
      - key: fit_score
        label: Fit
        format: number
      - key: fit_explanation
        label: Why it fits
      - key: stage
        label: Stage
        format: badge
      - key: interview_date
        label: Interview
        format: date
      sort:
        field: fit_score
        dir: desc
      empty: No candidates yet. Only people who applied or opted in appear here.
    roles:
    - employer
    - admin
  - key: update_stage
    type: form
    title: Update stage and invite
    collection: shortlist
    fields:
    - stage
    - interview_date
    - interview_time
    - interview_where
    edit: true
    submit:
      label: Save
      message: Updated. The candidate has been notified.
      redirect: review
    roles:
    - employer
    - admin
  - key: interview_form
    type: form
    title: Record interview
    collection: interview_notes
    submit:
      label: Save outcome
      message: Interview recorded. Remember to update the stage.
      redirect: review
    roles:
    - employer
    - admin
  - key: digest_watch
    type: instances
    template: weekly_digest
    title: Weekly digest
    roles:
    - employer
  - key: employer_dashboard
    type: page
    title: Hiring dashboard
    roles:
    - employer
    - admin
    sections:
    - type: data
      title: Applicants
      source: collection:shortlist
      display: kpi
      kpis:
      - label: Applicants
        agg: count
      - label: Average fit
        agg: avg
        field: fit_score
        format: number
    - type: data
      title: Applicants by region
      source: collection:shortlist
      display: chart
      chart: bar
      groupBy:
        field: region
        aggs:
        - key: applicants
          agg: count
      fields:
      - key: region
      - key: applicants
    - type: data
      title: Conversion by stage
      source: collection:shortlist
      display: chart
      chart: bar
      groupBy:
        field: stage
        aggs:
        - key: candidates
          agg: count
      fields:
      - key: stage
      - key: candidates
  - key: admin_dashboard
    type: page
    title: Admin activity
    roles:
    - admin
    sections:
    - type: data
      title: Open roles
      source: collection:open_roles
      display: kpi
      kpis:
      - label: Open roles
        agg: count
    - type: data
      title: Candidate profiles
      source: collection:strengths
      display: kpi
      kpis:
      - label: Strengths profiles
        agg: count
    - type: data
      title: Pipeline by stage
      source: collection:shortlist
      display: chart
      chart: bar
      groupBy:
        field: stage
        aggs:
        - key: candidates
          agg: count
      fields:
      - key: stage
      - key: candidates
    - type: data
      title: Candidates by region
      source: collection:shortlist
      display: chart
      chart: pie
      groupBy:
        field: region
        aggs:
        - key: candidates
          agg: count
      fields:
      - key: region
      - key: candidates
  - key: account
    type: account
    title: Billing
    roles:
    - employer
    - admin
  templates:
  - key: weekly_digest
    title: Weekly hiring digest
    description: A weekly email summarising your pipeline.
    agent: digester
    params:
    - name: focus
      type: select
      required: true
      label: Focus
      options:
      - value: all
        label: Everything
      - value: actions
        label: Only what needs my attention
    goal: 'Write this week''s hiring digest for this employer. Focus: {focus}. Today is {date}. Write in language {lang}.'
    schedule:
      cron: 0 7 * * 1
      userCanChange: false
    maxPerUser: 1
    roles:
    - employer
    deliver:
      to: owner
      subject: Your Firstrung week
      onlyIfNew: true
  triggers:
  - key: publish_role
    'on':
      collection: role_posts
      op: insert
    write:
      collection: open_roles
  - key: role_fee
    'on':
      collection: role_posts
      op: insert
    charge:
      credits: 100
      reason: Active role posting
  - key: score_on_assessment
    'on':
      collection: assessments
      op: insert
    start:
      agent: scorer
    goal: The candidate just submitted an assessment ({record.section}). Read everything they have submitted, score it and
      save their updated strengths profile. Write in language {lang}.
  - key: match_on_strengths
    'on':
      collection: strengths
      op: any
    start:
      agent: matcher
    goal: 'RECOMMEND: the candidate''s strengths profile was updated. Read it and the open roles and save the best-fit matches
      with explanations. Replace nothing you cannot justify. Write in language {lang}.'
  - key: shortlist_on_application
    'on':
      collection: applications
      op: insert
      where:
        consent: true
    start:
      agent: matcher
    goal: 'APPLICATION: the candidate applied or opted in to the role with id {record.role}. Their message: {record.message}.
      Add the shortlist entry for that employer as described. Write in language {lang}.'
  - key: notify_strengths
    'on':
      collection: strengths
      op: insert
    notify:
      to: owner
      subject: Your Firstrung strengths profile is ready
      body: 'Good news: your strengths profile is ready. Take a look at what you are good at and the roles that could suit
        you.'
      link: my_strengths
  - key: notify_application
    'on':
      collection: applications
      op: insert
    notify:
      to: owner
      subject: You have shared your profile
      body: Thanks for applying. The employer can now see your strengths profile and will review it. We will email you at
        every step.
      link: my_applications
  - key: notify_new_applicant
    'on':
      collection: shortlist
      op: insert
    notify:
      to: record.employer_email
      subject: New candidate for {record.role_title}
      body: 'A candidate who applied or opted in is ready for your review. Fit: {record.fit_score}.'
      link: review
  - key: notify_shortlisted
    'on':
      collection: shortlist
      op: update
      where:
        stage: shortlisted
    notify:
      to: record.candidate_email
      subject: You have been shortlisted for {record.role_title}
      body: 'Great news: the hiring manager shortlisted you for {record.role_title}. They may invite you to a short interview
        soon.'
      link: my_applications
  - key: notify_invited
    'on':
      collection: shortlist
      op: update
      where:
        stage: invited
    notify:
      to: record.candidate_email
      subject: 'Interview invitation: {record.role_title}'
      body: 'You are invited to a short, structured interview for {record.role_title} on {record.interview_date} at {record.interview_time}.
        Where: {record.interview_where}. Good luck, you have earned this.'
      link: my_applications
  - key: notify_offered
    'on':
      collection: shortlist
      op: update
      where:
        stage: offered
    notify:
      to: record.candidate_email
      subject: An offer for {record.role_title}
      body: Congratulations! The employer wants to offer you the role of {record.role_title}. Check your applications page
        for details.
      link: my_applications
  - key: notify_declined
    'on':
      collection: shortlist
      op: update
      where:
        stage: declined
    notify:
      to: record.candidate_email
      subject: Update on {record.role_title}
      body: 'Thank you for applying for {record.role_title}. The employer is not moving forward this time. Your skills are
        real and other roles may suit you well: check your matches.'
      link: my_matches
  - key: remind_interview
    'on':
      date:
        collection: shortlist
        field: interview_date
        offsetDays: -1
        hour: 8
    notify:
      to:
      - record.candidate_email
      - record.employer_email
      subject: 'Reminder: interview tomorrow for {record.role_title}'
      body: 'A reminder that the interview for {record.role_title} is tomorrow at {record.interview_time}. Where: {record.interview_where}.'
      link: my_applications
  billing:
    modes:
    - credits
    - subscription
    currency: eur
    signupCredits: 100
    packs:
    - key: roles_5
      credits: 500
      price: 99
      label: 5 active roles
    - key: roles_15
      credits: 1500
      price: 249
      label: 15 active roles
    plans:
    - key: employer_pro
      price: 299
      interval: month
      label: Employer subscription
      credits: 2500
      creditsReset: monthly
      roles:
      - employer
      includes:
      - Up to 25 active roles a month
      - Weekly digest
      - Hiring dashboard
  extensions:
  - key: candidate_discovery
    description: Employers see only candidates who applied or opted in to one of their roles. Browsing a pool of discoverable
      candidates is not offered.
  - key: sms_notifications
    description: Updates are sent by email only; SMS and WhatsApp are not available yet.
